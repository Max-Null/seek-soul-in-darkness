<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 28px; background: #1c1c1e; font-family: -apple-system, "Segoe UI", sans-serif; }
  h2 { color: #8e8e93; font-size: 13px; font-weight: 600; margin: 0 0 14px; letter-spacing: .5px; }
  .row { display: flex; gap: 26px; margin-bottom: 30px; flex-wrap: wrap; }
  .cell { text-align: center; }
  .cap { color: #8e8e93; font-size: 12px; margin-top: 8px; }
  .board { background:#2c2c2e; border-radius: 22px; padding: 22px; display: inline-block; }
  .dock-dark { background: #000; border-radius: 18px; padding: 14px 20px; display: flex; gap: 16px; align-items: flex-end; }
  .tiny { font-size: 10px; }
  svg { display: block; }
</style>
</head>
<body>

<h2>三层壳层轨道（Si: K/L/M 三层 · 断口错位避开遮挡）· 核保留眼睛</h2>
<div class="row">
  <div class="cell">
    <span class="board">
      <svg width="190" height="190" viewBox="0 0 128 128">
        <!-- M 层（外，r54）：1/4 断口，开口右上 -->
        <circle cx="64" cy="64" r="54" stroke="#fff" stroke-width="4" fill="none" stroke-dasharray="250 89" transform="rotate(45 64 64)" opacity=".85"/>
        <!-- L 层（中，r38）：1/4 断口，开口左下 -->
        <circle cx="64" cy="64" r="38" stroke="#fff" stroke-width="4" fill="none" stroke-dasharray="178 61" transform="rotate(225 64 64)" opacity=".8"/>
        <!-- K 层（内，r23）：1/3 断口，开口左 -->
        <circle cx="64" cy="64" r="23" stroke="#fff" stroke-width="4" fill="none" stroke-dasharray="105 40" transform="rotate(180 64 64)" opacity=".9"/>
        <!-- 电子（空心环） -->
        <g fill="none" stroke="#fff" stroke-width="4">
          <circle cx="113" cy="45" r="5.5"/>
          <circle cx="30" cy="98" r="5"/>
          <circle cx="26" cy="44" r="4.5"/>
          <circle cx="96" cy="80" r="4"/>
        </g>
        <!-- 核：偏心眼珠 -->
        <circle cx="69" cy="66" r="12.5" fill="#fff"/>
        <circle cx="61" cy="58" r="4.2" fill="#0d1117"/>
      </svg>
    </span>
    <div class="cap">A · 三层断口（1/4 错位开口）</div>
  </div>
  <div class="cell">
    <span class="board">
      <svg width="190" height="190" viewBox="0 0 128 128">
        <!-- M 层：对开双半弧（上下） -->
        <path d="M 18.2 44 A 54 54 0 0 1 18.2 84" stroke="#fff" stroke-width="4" fill="none" opacity=".85" transform="rotate(28 64 64)"/>
        <path d="M 109.8 44 A 54 54 0 0 0 109.8 84" stroke="#fff" stroke-width="4" fill="none" opacity=".85" transform="rotate(28 64 64)"/>
        <!-- L 层：对开（左右） -->
        <path d="M 26 64 A 38 38 0 0 1 64 102 A 38 38 0 0 1 102 64" stroke="#fff" stroke-width="4" fill="none" opacity=".8" transform="rotate(10 64 64)"/>
        <!-- K 层：短弧 2/3 -->
        <path d="M 64 87 A 23 23 0 1 1 64 41" stroke="#fff" stroke-width="4" fill="none" opacity=".9"/>
        <!-- 电子 -->
        <g fill="none" stroke="#fff" stroke-width="4">
          <circle cx="103" cy="94" r="5.5"/>
          <circle cx="78" cy="9.5" r="5"/>
          <circle cx="36" cy="34" r="4.5"/>
        </g>
        <!-- 核：白盘深瞳 -->
        <circle cx="64" cy="64" r="16.5" fill="#fff"/>
        <circle cx="66" cy="62" r="10" fill="#0d1117"/>
        <circle cx="62" cy="58" r="3.2" fill="#fff"/>
      </svg>
    </span>
    <div class="cap">B · 三层对开弧（半圆式断线）</div>
  </div>
</div>

<h2>Dock 模拟（28px）</h2>
<div class="dock-dark">
  <span><svg width="30" height="30" viewBox="0 0 128 128"><circle cx="64" cy="64" r="54" stroke="#fff" stroke-width="11" fill="none" stroke-dasharray="250 89" transform="rotate(45 64 64)" opacity=".9"/><circle cx="64" cy="64" r="38" stroke="#fff" stroke-width="11" fill="none" stroke-dasharray="178 61" transform="rotate(225 64 64)" opacity=".85"/><circle cx="64" cy="64" r="23" stroke="#fff" stroke-width="11" fill="none" stroke-dasharray="105 40" transform="rotate(180 64 64)" opacity=".95"/><g fill="none" stroke="#fff" stroke-width="11"><circle cx="113" cy="45" r="12"/><circle cx="30" cy="98" r="11"/><circle cx="26" cy="44" r="10"/><circle cx="96" cy="80" r="9"/></g><circle cx="69" cy="66" r="28" fill="#fff"/><circle cx="60" cy="57" r="9.5" fill="#000"/></svg><div class="cap tiny">A</div></span>
  <span><svg width="30" height="30" viewBox="0 0 128 128"><path d="M 18.2 44 A 54 54 0 0 1 18.2 84" stroke="#fff" stroke-width="11" fill="none" opacity=".9" transform="rotate(28 64 64)"/><path d="M 109.8 44 A 54 54 0 0 0 109.8 84" stroke="#fff" stroke-width="11" fill="none" opacity=".9" transform="rotate(28 64 64)"/><path d="M 26 64 A 38 38 0 0 1 64 102 A 38 38 0 0 1 102 64" stroke="#fff" stroke-width="11" fill="none" opacity=".85" transform="rotate(10 64 64)"/><path d="M 64 87 A 23 23 0 1 1 64 41" stroke="#fff" stroke-width="11" fill="none" opacity=".95"/><g fill="none" stroke="#fff" stroke-width="11"><circle cx="103" cy="94" r="12"/><circle cx="78" cy="9.5" r="11"/><circle cx="36" cy="34" r="10"/></g><circle cx="64" cy="64" r="34" fill="#fff"/><circle cx="66" cy="62" r="21" fill="#000"/><circle cx="62" cy="58" r="7" fill="#fff"/></svg><div class="cap tiny">B</div></span>
</div>

</body>
</html>
