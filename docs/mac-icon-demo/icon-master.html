<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>body{margin:0;padding:0;background:#2c2c2e}</style></head>
<body>
<svg width="1024" height="1024" viewBox="0 0 128 128">
  <rect x="0" y="0" width="128" height="128" rx="24" fill="#0d1117"/>
  <!-- M 层（外 r54）1/4 断口 rotate45 -->
  <circle cx="64" cy="64" r="54" stroke="#fff" stroke-width="5" fill="none" stroke-dasharray="250 89" transform="rotate(45 64 64)" opacity=".9"/>
  <!-- L 层（中 r38）1/4 断口 rotate225 -->
  <circle cx="64" cy="64" r="38" stroke="#fff" stroke-width="5" fill="none" stroke-dasharray="178 61" transform="rotate(225 64 64)" opacity=".85"/>
  <!-- K 层（内 r23）1/3 断口 rotate180 -->
  <circle cx="64" cy="64" r="23" stroke="#fff" stroke-width="5" fill="none" stroke-dasharray="105 40" transform="rotate(180 64 64)" opacity=".95"/>
  <!-- 核：偏心眼珠（眼神方向右上） -->
  <circle cx="69" cy="66" r="12.5" fill="#fff"/>
  <circle cx="61" cy="58" r="4.2" fill="#0d1117"/>
</svg>
</body>
</html>
