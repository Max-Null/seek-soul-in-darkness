*\n- 上游自己写明了硬门槛：*\"每个 head 分支必须位于同一仓库\"*、*\"跨 fork 链直接硬停\"*、*\"不要在官方扩展或服务端堆叠特性不可用时退回逐个手工合并与重定向\"*\n\n**它的两条通用判据已经被别处覆盖**：\n\n- **\"任何历史重写后要重新抓取确切 head，并重新审计未解决的评审线程、批准、可合并性、检查\"** → **06 §三.5 已逐字保留** ✓\n- **\"删除分支只在对应 PR 报告 `MERGED` 之后的单独最后一遍进行；删前要求 GitHub 报告没有仍以它为 base 的开放 PR\"** → 通用但 SSiD 无 PR 流程，**暂无处安放**（若将来有分支清理动作，这是判据来源）\n\n**所以不单独适配，也不并入**——它的判据已被 06 吸收，剩下的全是 `gh stack` 机制。\n\n---\n\n## 三、这份判断的边界（什么情况下要重新评估）\n\n**不适用是\"现在\"的结论，不是永久结论。** 下列任一条件出现时，对应 skill 应被重新评估：\n\n| 触发条件 | 应重新评估 | 届时的起点 |\n|---|---|---|\n| SSiD 引入**双语文档**（中英对照） | `dsh-translate-docs` | 它的三路径分流（更新 / 新配对 / 删除改名）+ \"最小更新而非重译\" |\n| SSiD 给 `docs/决策/` 引入**状态与归档** | `dsh-archive-agent-notes` | 它的按未来价值分类判据 + 追加式封印 |\n| SSiD 建立**成体系的文档制度**（kind / 模板 / 预算 / 门禁） | `dsh-doc` | 它的四模板骨架 + Summary gate；**但 15 条判据届时已在 03/04 里** |\n| SSiD 开始用 **GitHub 堆叠 PR**（例如长期并行多条改动线） | `dsh-merging-stacked-prs` | 它的硬门槛检查 + 官方 stack 对象作为成员资格权威 |\n\n**写入包的方式**：`@max-null/dsh-skills` 首次发布**不含这 4 个 skill**，但包内 README 应有一段\"**未包含的 4 个上游 skill 及原因**\"（简短指向本说明），这样包的使用者不会以为我们漏了它们。\n\n---\n\n## 四、数字自检（命令产出，可复现）\n\n```powershell\n$root = 'DSHfork\\.agents\\skills'\n# 行数（LF 口径，与 read 一致）\nforeach ($n in @('dsh-doc','dsh-translate-docs','dsh-archive-agent-notes','dsh-merging-stacked-prs')) {\n  $tot = 0\n  Get-ChildItem \"$root\\$n\" -Recurse -File | ForEach-Object {\n    $tot += ([regex]::Matches([System.IO.File]::ReadAllText($_.FullName),\"`n\")).Count\n  }\n  \"$n = $tot\"\n}\n# dsh-doc = 861 ; dsh-translate-docs = 74 ; dsh-archive-agent-notes = 68 ; dsh-merging-stacked-prs = 127\n\n# dsh-doc 的构成\n@(Get-ChildItem \"$root\\dsh-doc\\references\" -File).Count   # 5\n@(Get-ChildItem \"$root\\dsh-doc\\templates\" -File).Count    # 4\n\n# SSiD 侧：本说明引用的\"不存在\"逐条\nTest-Path 'seek-soul-in-darkness\\docs\\i18n'                       # False\nTest-Path 'seek-soul-in-darkness\\docs\\cookbook'                   # False\ngit -C 'seek-soul-in-darkness' config --get core.hooksPath        # 空\nTest-Path 'seek-soul-in-darkness\\benchmarks'                      # False\n(Get-Command ffmpeg -EA SilentlyContinue) -ne $null               # False\n```\n\n**自查记录**：\n\n- 本说明引用的行数（861/74/68/127、**5** references、4 templates）来自 01–08 各轮的同一批命令，且 `dsh-doc = 861` 与清点表一致。\n- **自查抓到一处错误**：第一版把 `dsh-doc` 的 `references/` 写成 **6 个**，实测为 **5 个**（`metadata-links-i18n.md` / `review.md` / `structure-hierarchy.md` / `style.md` / `website-sync.md`）。**这又是一次「我数过的」错误**——而且它就发生在我写「本说明没有引入任何新数字」的那一节里。**教训：「我引用的都是旧数字」这句话本身不构成免责**，每个数字仍要单独核对。\n- 本说明**更正了清点表的一处判断**：`dsh-doc` 原记为 `⛔ 现在不适用` 而未提\"可搬判据\"。核实后它有 **15 条**制度无关的判据（fact-check 4 + voice 5 + quality 6）应并入 03/04。**这是第二处对清点表的更正**（第一处在 04 §2.2：Cordis 注册**不是** DSH 专有）。\n- 两处更正的**方向相反**：04 是\"原判不适用，实际适用\"；09 是\"原判纯不适用，实际**部分可搬**\"。**共同点**：清点表是在**只读了一遍**的情况下做的粗分类，而适配说明是**逐条核实**——差异不出在判断力，出在**核实的深度**。\n"},{"file":"2026-09-10-skill适配说明-写作规则.md","date":"2026-09-10","slug":"skill适配说明-写作规则","title":"skill 适配说明 · 写作规则","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-skills","dsh-skills","dsh-chat-rail","dsh-hooks","dsh-ci-test-reliability","ssid-test-reliability","dsh-trim-cot-leakage","dsh-prose-standard","dsh-code-review","dsh-find-simplifications","dsh-pre-push-checks","dsh-speed-up-perf"],"summary":"铁律：先文档后动手。 不得跳过 ② 直接写 SKILL.md——因为 ② 是判据的判定记录，③ 只是它的一次翻译。 清点分类与工作量（12 个）：","bytes":13129,"lines":201,"body":"# skill 适配说明 · 写作规则\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **这份文档的作用**：后续每一份适配说明都按它写。它把 01、02 两次实际踩到的坑固化成**可执行的检查**，而不是「要仔细」这类空话。\n> **读者**：主要是 agent（本项目约定人工不逐步复核）。所以它按 skill 的写法写——明确的触发条件、可执行的步骤、反例。\n\n---\n\n## 一、流程与义务\n\n| 阶段 | 产出 | 谁做 |\n|---|---|---|\n| ① 清点 | `2026-09-10-DSH-skills适配清点.md`（12 个 skill 的分类） | 已完成 |\n| ② 适配说明 | `2026-09-10-skill适配说明-NN-\u003c中文名>.md` | agent（本系列） |\n| ③ 生成 skill | 包内 `skills/ssid-\u003cname>/`（SKILL.md + SOURCE.md + references/） | agent，**须等 ② 完成** |\n| ④ 建包与集成 | `@max-null/dsh-skills`（SkillProvider，rank 550）+ SSiD 侧验证 | agent |\n\n**铁律：先文档后动手。** 不得跳过 ② 直接写 SKILL.md——因为 ② 是判据的判定记录，③ 只是它的一次翻译。\n\n**清点分类与工作量**（12 个）：\n\n| 分类 | 数量 | 清单 |\n|---|---:|---|\n| `✅ 小改即可用` | 3 | ci-test-reliability（01）、trim-cot-leakage（02）、prose-standard（03） |\n| `🔧 需适配` | 4 | code-review、find-simplifications、pre-push-checks、speed-up-perf |\n| `🔧 部分可用` | 1 | record-browser-gif（SKILL.md 前 115 行通用 + 337 行编码器可复用） |\n| `⛔ 现在不适用` | 4 | doc、translate-docs、archive-agent-notes、merging-stacked-prs |\n\n**分类名以 `2026-09-10-DSH-skills适配清点.md` 为准，全系列不得改名**（注意 `🔧` 同时用于「需适配」与「部分可用」，靠后半截区分）。算术核对：3 + 4 + 1 + 4 = **12** ✓\n\n**产出计划**：8 份完整适配说明（01–08，按上表顺序）+ **1 份「不适用理由」合订**（4 个 skill 各自给理由，不硬造判据）。\n\n---\n\n## 二、验证规则（三层）\n\n上游 superpowers 的 Iron Law 是 `NO SKILL WITHOUT A FAILING TEST FIRST`——那是**写新 skill** 的纪律。我们做的是**移植**，直接套用会要求 12 个 skill 全跑压力场景，成本不现实。所以改成三层：\n\n| 条款类型 | 要不要新基线 | 怎么验证 |\n|---|---|---|\n| 未改动的判据 | 不用 | 继承上游检验——DSH 的真实开发史已替我们测过 |\n| 等价替换（路径 / 命令 / 文件名） | 不用 | 可解析性检查：引用真实存在、命令真能跑 |\n| **改写与新增的判据** | **要** | 必须指出证据来源——DSH 的 Agent Note 或 SSiD 的真实事故；**指不出来就不新增** |\n\n**这套规则的代价，写清楚**：它验证的是「判据有据可查」，**不是**「判据真能改变 agent 行为」。后者要跑压力场景，成本极高。取舍：上游判据的有效性由 DSH 真实开发史背书；我们新增的判据只能保证有据可查。更强的保证只能等包发布后从真实使用里回收——就像 DSH 自己做的：事故进 Agent Note，再进判据。\n\n---\n\n## 三、数字纪律（**最容易犯的错，已犯两次**）\n\n**强制规则**：\n\n> **适配说明里的每一个数字，必须在文末「数字自检」一节给出可复现的命令。写不出命令的数字，不许写进正文。**\n\n**已发生的错误**：**01 共 5 处、02 共 2 处**，本质是同一个病 —— 拿记忆或估算当事实。\n\n| 说明 | 错误 | 真值 | 成因 |\n|---|---|---|---|\n| 01 | 「用 vitest 的插件 12 个」 | **10 个** | 估算 |\n| 01 | 「dsh-chat-rail 用 vitest」 | **纯 node:test**（devDeps 无 vitest） | 上一条的衍生 |\n| 01 | 「vitest 是全局注入」 | **也是显式导入**（没开 `globals: true`） | 上一条的衍生 |\n| 01 | 「这些文档都不存在」 | **`vitest.config.ts` 存在 4 个** | 未核 |\n| 01 | 「原样保留 6 节」 | **7 节** | 算术 |\n| 02 | 「release-notes 18 个」 | **19 个** | 估算 |\n| 02 | 「keep rules 10 条」 | **9 条** | 估算 |\n\n**注意前三条的同源关系**：一个错误的事实会**在全文多处复现**——01 的「12 个」同时出现在 §一、§三.7、§四。所以修一个数字时，要**全篇搜一遍它的所有出现处**，否则只修一半。\n\n**两条操作细则**：\n\n1. **每个数字要有专属命令**。全文 `^\\d\\. ` 计数得 13，那是 Taxonomy（8）+ Workflow（5），**不是 Workflow 的条目数**。不理解命令在数什么，等于没数。\n2. **工具本身也要验证**。`Get-Content x | Measure-Object -Line` **会忽略空行**——它给出 86/53/34，而正确值是 131/81/45。当时我差点拿这个假证据去「修正」正确的数字。**假证据比没证据更危险。** 用 `@(Get-Content x).Count`。\n3. **「我数过的」不算证据**。任何形如「N 类 / N 条 / N 个」的表述，**写之前先跑计数命令**。阅读印象数出来的数，错误率不是偶然的：**01 犯 5 次、02 犯 2 次、03 犯 1 次（把 12 类位置写成 13 类），三份说明共 8 次**。这条不是「要更小心」，而是**不许凭印象出数**。\n4. **「默认位置没有」不等于「没有」**。查「某机制是否存在」时，必须查**配置解析后的实际路径**，而不是默认目录。实例（06 踩到）：查 DSH 的 git 钩子只看 `.git/hooks`，得出「DSH 也没有钩子」的**错误**结论——实际 `core.hooksPath` 指向 `.git/dsh-hooks`（lefthook 管理，含 `pre-commit` / `pre-merge-commit` / `pre-push`）。正确程序：**先读配置**（`git rev-parse --git-path \u003cname>` 一类），**再查那个路径**，两条都查过才可下否定结论。\n5. **引用原文要复制，不要重建**。两类表现：① `edit` 的 `old_string` 凭记忆写会失败（已发生一次——实际是「引用 01，须同批」，我记成「须同批进包」）；② 文档里引用上游原句时，必须**从文件复制**，「我记得是这么写的」不构成引用依据。\n6. **交付前做一次数字复检（强制）**。成品（skill 文件、npm 包）交付之前，**把所有数字命令重跑一遍并逐项核对**。理由：到 2026-09-11 为止本系列共犯 **12 次**「数一数」错误（01 五次、02 两次、03 两次、09 一次、02 的 SOURCE 两次），其中两次是**写完之后才被命令推翻**的（03 的「11 类」、02 SOURCE 的「上游 17 节 / 缺 13 节」）——**写的时候\"感觉自己数过\"，实际是估的**。第 1 条要求的是\"写之前跑命令\"，本条要求的是\"交付前再跑一遍\"。\n\n> **第 1、5 条是同一个根因**：默认自己的记忆可靠，于是**重建**而不**复制**。全部\"数一数\"错误都是它，`edit` 失败也是它。**凡是能复制的地方，就不要重建。**\n\n---\n\n## 四、算术核对（强制）\n\n每份适配说明的「汇总」一节必须有一行算术核对：\n\n```\n（保留 + 保留并扩充 + 改写 + 重写 + 删除）= 上游部件总数 ✓\n```\n\n**上游部件总数怎么定**：`SKILL.md` 的 `## ` 小节数 + 引言 + `references/` 文件数，用命令数出来（见 §三）。01 在这里错过一次。\n\n---\n\n## 五、版面自检（发出前逐条过）\n\n1. **引用可解析**：正文引用的每个路径用 `Test-Path` 核过；引用的外部 URL 注明来源（本机文件 / 网络获取要分开标）。\n2. **判定齐全**：上游每个部件都有判定，不遗漏、不合并糊弄。\n3. **四类用词统一**：原样保留 / 保留并扩充 / 改写 / 重写 / 删除。**「重写」与「改写」要分开**——重写是内容重做（如 references 换成中文案例），改写是同一内容换表述。\n4. **依赖链检查**：若该 skill 引用其他 skill（`REQUIRED BACKGROUND` 之类），必须在文里声明**是否同批进包**。判据依赖缺了，skill 就会过度执行。02 已示范（依赖 03，必须同批）。\n5. **description 合规**：只写**触发条件**，不总结工作流。依据是 `writing-skills` 的实测——描述里写了工作流，agent 会照描述做、**跳过正文**（实测：描述写「任务间做代码评审」，agent 就只做一次评审，尽管流程图明画了两次）。\n6. **新增判据带证据**：按 §二第 3 行，每条新增都写明来源。\n7. **术语一致**：同一事物全篇同名。上游叫 `keep rules` 就一直叫 `keep rules`，不要中途换成「保留条款」。\n\n---\n\n## 六、统一结构（七节 + 自检）\n\n```markdown\n# skill 适配说明 NN：\u003c中文名>\n\n> 本说明的地位 + 格式沿用说明\n\n**上游 skill**：\u003cname>\n**上游位置**：DSHfork/.agents/skills/\u003cname>/\n**上游版本锚点**：\u003ccommit>（\u003c抓取日期>）\n**上游体量**：SKILL.md N 行 + references/... （命令产出）\n**清点分类**：\u003c✅ 小改即可用 / 🔧 需适配 / 🔧 部分可用 / ⛔ 现在不适用>\n**拟落点**：@max-null/dsh-skills 的 skills/ssid-\u003cname>/\n\n## 一、为什么做这一个（或「为什么不适用」，对 ⛔ 类）\n## 二、SSiD 侧现状（已核实）\n## 三、逐条适配判断（每个部件一条，四类判定）\n## 四、汇总：改动清单（含算术核对）\n## 五、落地结构（目录树 + description 建议 + 依赖声明）\n## 六、SOURCE.md（用统一下表的模板，只填值）\n## 七、待确认（只写真正需要人拍板的，不写「请确认我写得对不对」）\n## 八、数字自检（命令 + 产出 + 自查记录）\n```\n\n---\n\n## 七、SOURCE.md 模板（全系列统一，源自 01 §六）\n\n```markdown\n# 来源与版本\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | \u003cname> |\n| 上游路径 | DSHfork/.agents/skills/\u003cname>/ |\n| 上游版本锚点 | \u003ccommit>（\u003c抓取日期>） |\n| 上游体量 | \u003c命令产出> |\n| 适配日期 | \u003cdate> |\n| 适配类型 | \u003c小改 / 需适配 / 部分可用> |\n| 依赖 | \u003c同批进包的 skill，若无写「无」> |\n| 适配说明 | seek-soul-in-darkness/docs/决策/2026-09-10-skill适配说明-NN-\u003c名>.md |\n\n## 与上游的差异\n\n**保留**：\u003c逐项列，注明「未改判据」>\n\n**改写**：\u003c每项写「上游 X → 本地 Y」>\n\n**新增**：\u003c每项附证据来源>\n\n**删除**：\u003c每项附理由；「本地没有」不算理由，要说清为何不适用>\n\n## 上游变动时的跟进方式\n\n上游无版本号，只有 commit 可靠。跟进方法：\n1. `git -C DSHfork fetch && git -C DSHfork log --oneline \u003c锚点>..origin/master -- .agents/skills/\u003cname>/`\n2. 若该目录有变动，对照本文件「与上游的差异」逐条重判\n3. 更新版本锚点与适配日期\n```\n\n---\n\n## 八、命名与落点\n\n- **skill 名**：`ssid-\u003c上游去掉 dsh- 前缀的名字>`，例：`dsh-ci-test-reliability` → `ssid-test-reliability`。\n- **包名**：`@max-null/dsh-skills`，源码放 `max-null-plugins/dsh-skills/`（**待建**；自制插件落点，见工作区 AGENTS.md）。\n- **发现路径**：SkillProvider 注册（rank **550**，生态约定），随 npm 版本确认 skill 版本——这是选 npm 形态的原因。\n- **与 SSiD 现有 `skills/` 的关系**：`seek-soul-in-darkness/skills/`（14 个，mxy + omo 系列）是**目录落点**的内置预设；本包是**独立 provider**，两者并存、互不覆盖。\n\n---\n\n## 九、进度表\n\n| NN | 上游 skill | 分类 | 适配说明 | skill 文件 | 备注 |\n|---|---|---|---|:--:|---|\n| 01 | dsh-ci-test-reliability | `✅ 小改即可用` | **完成** | — | 5 处自查错误已修正 |\n| 02 | dsh-trim-cot-leakage | `✅ 小改即可用` | **完成** | — | 与 03 双向依赖，须同批 |\n| 03 | dsh-prose-standard | `✅ 小改即可用` | **完成** | — | **02 的前置**；与 02 双向依赖 |\n| 04 | dsh-code-review | `🔧 需适配` | **完成** | — | 引用 01/03，须同批；**更正清点表一处误判** |\n| 05 | dsh-find-simplifications | `🔧 需适配` | **完成** | — | **引入新实践**（SSiD 无简化类记录、无 TODO 标记） |\n| 06 | dsh-pre-push-checks | `🔧 需适配` | **完成** | — | 引用 01/03；**前提反转**（SSiD 无钩子、无测试 CI） |\n| 07 | dsh-speed-up-perf | `🔧 需适配` | **完成** | — | **引入新能力**（SSiD 无测量基建）；测量纪律全部保留 |\n| 08 | record-browser-gif | `🔧 部分可用` | **完成** | — | 脚本逐字复用；主落点改 `docs/shots/`；**ffmpeg 未装** |\n| 09 | —（不适配合订） | `⛔ 现在不适用` | **完成** | — | 4 个理由；**救出 dsh-doc 的 15 条判据并入 03/04** |\n\n### 依赖关系（同批进包的约束）\n\n```\n02 ⇄ 03          双向引用（02 的完整命题规则由 03 own；03 把\"找泄漏\"交给 02）\n04 ──> 01, 03    04 的 Blocking #1 指向 03，Manual「测试可靠性」指向 01\n06 ──> 01        06（推送前检查）复用 01 的测试判据\n```\n\n**同批的含义**：`@max-null/dsh-skills` 首次发布必须包含 {01, 02, 03, 04, 06}。若只发部分，引用会指向不存在的 skill——**上游也是这种兄弟互引结构，它们从来是整套存在的**。\n"},{"file":"2026-09-10-SSiD-check-rules骨架建议.md","date":"2026-09-10","slug":"SSiD-check-rules骨架建议","title":"SSiD check-rules 骨架建议（对标官方 Gates）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-09-10","dateNote":"对应手册待办 #5、#9","tags":["@max-null/dsh-ssid-panels","@playwright/mcp","@astudioplus/codegraph-mcp","@deepseek-ai/dsh","@max-null/dsh-header-unify","@max-null/dsh-quick-toolbar","ssid-check-rules","dsh-ssid-panels","dsh-ssid-zh-ui","dsh-quick-toolbar","dsh-capture","dsh-context-doctor"],"summary":"本文的输入是官方仓库 DSHfork（= deepseek-ai/deepseek-harness）scripts/ 下 55 个 verify- 门脚本与 1583 行编排器 run-gates.ts 的精读结果，报告原文见： - docs/决策/2026-09-10-DSH官方Gates拆解原始报告-E-配对与配置门.md（verify-translation-pairing.ts、verif","bytes":22831,"lines":394,"body":"# SSiD check-rules 骨架建议（对标官方 Gates）\n\n> 状态：进行中（推断 · 2026-09-12）\n\n日期：2026-09-10　对应手册待办 #5、#9\n\n## 0. 输入与边界\n\n本文的输入是官方仓库 `DSHfork`（= `deepseek-ai/deepseek-harness`）`scripts/` 下 55 个\n`verify-*` 门脚本与 1583 行编排器 `run-gates.ts` 的精读结果，报告原文见：\n\n- `docs/决策/2026-09-10-DSH官方Gates拆解原始报告-E-配对与配置门.md`（`verify-translation-pairing.ts`、`verify-cordis-config.ts`）\n- `docs/决策/2026-09-10-DSH官方Gates拆解原始报告-F-run-gates编排.md`（`run-gates.ts`）\n\n结论对 SSiD 侧的真实结构做了核实：SSiD 壳库根目录**没有** `package.json`，脚本家在\n`seek-soul-in-darkness/shell/`，运行器是 `npm run`。本文所有落点均按此写。\n\n本文只给骨架与判定契约，不含实现代码。\n\n## 1. 官方 Gates 的形状（结论先行）\n\n| 维度 | 官方实测 | SSiD 应否照搬 |\n|---|---|---|\n| 门数量 | 55 个 `verify-*` 门脚本（`scripts/` 下共 210 个文件） | 否，四项检查 |\n| 编排器 | `run-gates.ts` 1583 行 / 17 个聚合 mode | 否，约 150 行 |\n| 依赖 | `needs`（强）+ `after`（弱）+ DFS 环检测 | 否 |\n| 调度 | 单进程手写容量闸 + `availableParallelism()` 上限 | 否，四个门串行 |\n| 失败处理 | fail-fast + `kill(-pid)` 进程树终止 + 静默确认 | 否 |\n| 开关 | 十余个 `DSH_*` 环境变量 | 否 |\n| 空语料 | 显式 fail-loud | **是** |\n| 每门自测 | 每个 gate 配 `.spec.ts` | **是** |\n| 失败定位 | 每条违规自带 `文件:行` | **是** |\n\n官方那 1583 行不是设计过剩，是被\"55 个门 + vitest worker + dev server 这类会留下后代的\n子进程\"逼出来的：`needs`/`after` 双依赖存在的理由是同目录产物的读者与写入者互斥\n（`run-gates.ts:447-461`、`526-536`），进程树终止体系存在的理由是子进程会留后代\n（`1091-1265`）。SSiD 四个检查脚本都读完几十个文件就退出，串行耗时以秒计，上述机制一件都用不上。\n\n## 2. 落点\n\n```\nseek-soul-in-darkness/shell/\n├── package.json                 # 增加 5 行 scripts\n└── scripts/\n    ├── check-rules.mjs          # 编排器（四项都就绪后再建）\n    ├── check-vendor-sync.mjs\n    ├── check-profile-sync.mjs\n    ├── check-bom.mjs\n    ├── check-legacy-names.mjs\n    └── check-rules.manifest.json   # 例外清单（白名单式）\n```\n\n沿用 `.mjs` 而非官方的 `.ts`：`shell/scripts/` 现有五个脚本里四个是 `.mjs`\n（`boot-bundled.mjs`、`prepare-runtime.mjs`、`repack-open-sea-skin-vendor.mjs`、\n`verify-deploy-rename.mjs`），另一个 `after-pack.cjs` 是 electron-builder 的钩子。\n检查脚本不需要类型，保持形态一致就不必让 `scripts/` 依赖 `tsx`。\n\n**`verify-deploy-rename.mjs` 是一个要避开的先例。** 它 72 行里逐场景 `console.log`，\n失败只打 `[FAIL]`，进程仍以 0 退出，结尾固定打 `ALL CHECKS DONE`。这种形状供人肉阅读，\n无法挂 pre-push 或发版前置——CI 与发版脚本只认退出码。新脚本从第一个起就必须把\n\"发现问题 ⇒ 非零退出\"写死。\n\n## 3. 四项检查的判定契约\n\n### 3.1 check-vendor-sync：vendor 四份一致\n\n手册 §10 定义的同步链是四份：\n\n```\n1. seek-soul-in-darkness/plugins/\u003cpkg>/lib/**        源头\n2. ~/.dsh/profiles/web/vendor/\u003cpkg>                  运行时（web）\n3. ~/.dsh/profiles/ssid/vendor/\u003cpkg>                 运行时（ssid）\n4. shell/profile-template/vendor/\u003cpkg>               发版基准\n```\n\n适用范围要显式声明，不能对所有 vendor 条目一律比，而且**源头未必在 SSiD 仓库内**。\n已核实 SSiD 仓库根的 `plugins/` 下有三个包，但只有两个是现行源头：\n\n| 包 | 源头 | 可比份数 |\n|---|---|---|\n| `dsh-ssid-panels` | `seek-soul-in-darkness/plugins/dsh-ssid-panels/lib` | 四份 |\n| `dsh-ssid-zh-ui` | `seek-soul-in-darkness/plugins/dsh-ssid-zh-ui/lib` | 四份 |\n| `dsh-quick-toolbar` | `max-null-plugins/dsh-quick-toolbar/lib`（**仓库外**） | 四份，源侧不在本仓 |\n| `dsh-capture` | `max-null-plugins/dsh-capture/lib`（仓库外） | 三处 vendor 互比 |\n| `dsh-context-doctor` | 上游固化，无本地源头 | 三处 vendor 互比 |\n\n`seek-soul-in-darkness/plugins/dsh-quick-toolbar` 曾是该插件 2026-08-30 迁出独立时\n未清理的残留：停在 0.1.0，落后现行 0.8.6 七个小版本，且全仓没有任何脚本引用它。\n它若被当作源头写进 manifest，`check-vendor-sync` 会稳定报三个假红。该残骸已于\n2026-09-10 删除（见 §6），实测数据见 §7。\n\n**不要照搬记录式哈希。** 官方 `.i18n.yaml` 采用\"记录上次确认一致时的 git blob 哈希\"，\n是因为双语对两侧内容本来就不同，没有可比的第二份。SSiD 的四份是**应当完全相同**的副本，\n直接实时比对即可；若引入记录文件，它自己就变成第五个需要同步的东西。\n\n**哈希对象是文件集合，不是目录。** 已核实两个内置插件的同步语义并不相同：\n\n- `dsh-ssid-panels`（源 21 文件 / vendor 21 文件）与 `dsh-ssid-zh-ui`（5 / 5）：\n  源目录与 vendor 副本**逐文件全等**，连 `src/`、`tests/`、`docs/` 都同步。\n- `dsh-quick-toolbar`：源（`max-null-plugins/`）43 文件，vendor 只有 5 个——vendor 是\n  **精简副本**，只含 `lib/`、`cordis.patch.yml`、`package.json`；源码、测试、截图、\n  `README`、`LICENSE` 都不进 vendor。整目录比对会报 **40 处差异，其中只有 1 处是真信号**\n  （vendor 侧多出的旧脚本 `verify-header-unify.cjs`），其余 39 处是\"源侧有而 vendor\n  本就不需要\"。\n\n所以比对面必须按包声明，不能一律要求\"整目录摘要相等\"。正确做法是逐文件建\n`相对路径 → 内容哈希` 映射再比，差异分三类输出：\n\n- 只在源侧存在 → 未同步\n- 只在 vendor 侧存在 → 多余文件\n- 两侧都有但内容不同 → 漂移\n\n文本文件在报差异时给出**第一处不同的行号**，二进制给文件级。这一点是官方门禁里\n\"每条违规自带 文件:行 定位\"的直接落地，没有定位的漂移报告等于没跑。\n\n哈希用 `node:crypto` 的 `sha256`。手册写的是习惯叫法\"MD5\"，实现不必跟着弱算法走，\n但文档与错误信息里要把用词统一（建议统一为\"指纹\"）。\n\n比对面写进 manifest，采用官方\"只列排除项\"的白名单风格（`verify-translation-pairing.ts:93-101`\n的目录项以 `/` 结尾做边界，同款写法）：\n\n```json\n{\n  \"packages\": {\n    \"@max-null/dsh-ssid-panels\": {\n      \"source\": \"../../plugins/dsh-ssid-panels\",\n      \"include\": [\"lib/**\", \"package.json\", \"cordis.patch.yml\"],\n      \"exclude\": [\"**/*.map\", \"**/*.tsbuildinfo\"]\n    }\n  }\n}\n```\n\n### 3.2 check-profile-sync：profile vs template 声明\n\n比对面：`shell/profile-template/package.json`（发版基准，A 侧）对\n`~/.dsh/profiles/ssid/package.json`（运行时，B 侧），取两个字段：\n\n- `dependencies`（包名 → 版本，版本是精确 pin 无 `^`）\n- `dsh.profile.bundles`（数组）\n\n判定四条：\n\n1. 只在 A 有 / 只在 B 有 → 报告差异，并注明方向。手册 §4 记的实测是：只改 B 不改 A，\n   部署后 B 会被归档包版本覆盖——所以\"B 落后于 A\"是可预期的稳态，\"B 超前于 A\"才是\n   下一次发版会踩的坑。两个方向都要报，但文案要区分。\n2. 同名不同版本 → 报告，这是最高频的失配形态。\n3. A 侧 `dependencies` 里每个 `file:./vendor/\u003cX>` 指向的目录必须存在。\n4. `dsh.profile.bundles` 的每一项必须在 `dependencies` 里声明。这是官方\n   `missingPluginDependencies`（`verify-cordis-config.ts:441-463`）的差集模式：\n   遍历引用、按包名归集引用点，`packageName in dependencies` 才算通过，否则报\n   `\u003c引用位置>: \u003cpackage> must be declared in \u003cdependencyOwner>`——**违规信息里同时带\n   引用位置与责任文件名**，这正是 §3.1 要求的那种定位。反方向不查：`dependencies` 里\n   多出来的 MCP 包（如 `@playwright/mcp`、`@astudioplus/codegraph-mcp`）本就不注册为 bundle。\n\n必须在构造期排除内核族 `@deepseek-ai/dsh*`：dev 源码模式下 profile 声明**不包含**内核族\n（手册 §5.1），拿它跟 template 比必然假红。\n\n**只比 ssid，不比 web。** `~/.dsh/profiles/web` 是 web 开发环境，依赖集与 ssid 不同\n（已核实两侧 vendor 目录内容就不同：web 多一个 `dsh-dream-skin`）。受检 profile 列表由\nmanifest 声明；声明的 profile 目录不存在时报错，不静默跳过。\n\n### 3.3 check-bom：BOM 扫描\n\n判定：文件前三字节为 `EF BB BF`。\n\n范围（都是被 node 读的文本）：`shell/profile-template/**/*.{json,yml,yaml}`、\n`~/.dsh/profiles/{ssid,web}/*.{json,yml,yaml}`、SSiD 仓库内被 node 读的 JSON。\n排除 `node_modules/`、`lib/`、`dist*/`、`build/`。\n\n必要性有实测支撑：手册 §4 记 PowerShell 5.1 的 `Set-Content -Encoding UTF8` 会写 BOM，\n`readProfileManifest` 直接崩。这类故障面大而检查成本极低。\n\n官方 `scripts/` 下没有任何 BOM 检查（`verify-translation-pairing.ts` 与 `verify-cordis-config.ts`\n都没有），这一项要自写，结构照官方风格即可：Buffer 前三字节判定 + 空语料 fail-loud。\n\n### 3.4 check-legacy-names：旧名残留\n\n**这一项的关键是划对硬/软边界。** 全仓 grep `header-unify` 命中 79 处，其中绝大多数在\n`docs/决策/**` 与 `docs/release-notes-*.md` 里，是合法的历史叙述（\"原 dsh-header-unify\"）。\n用黑名单式全仓扫描，79 条噪声会立刻摧毁这条规则的可信度——而官方门禁的通行做法正是\n**显式分类允许名单**而不是黑名单。\n\n硬残留域（应为零，且**用结构化解析而非扫描文本**）：\n\n- `shell/profile-template/package.json` 的 `dependencies` 键与 `dsh.profile.bundles` 项\n- `~/.dsh/profiles/*/package.json` 同上\n- `cordis.patch.yml` 里各条目的 `id` / `name`\n- `plugins/`、`vendor/` 下的**目录名**\n\n软残留域（合法，豁免）：`docs/决策/`、`docs/release-notes-*.md`、以及代码注释中的\n「（原 X）」叙述。豁免按路径前缀走白名单。\n\n改名表带归一化，因为旧名有多个变体（`dsh-header-unify` / `@max-null/dsh-header-unify` /\n`header-unify`），比对前去掉 scope 与分隔符：\n\n```json\n{\n  \"renames\": [{ \"from\": \"dsh-header-unify\", \"to\": \"dsh-quick-toolbar\", \"at\": \"2026-08-30\" }],\n  \"hardScopes\": [\"shell/profile-template/package.json\", \"~/.dsh/profiles/*/package.json\", \"**/cordis.patch.yml\", \"dirName\"],\n  \"exemptPathPrefixes\": [\"docs/决策/\", \"docs/release-notes-\"]\n}\n```\n\n**首个实测命中。** `shell/profile-template/vendor/dsh-quick-toolbar/verify-header-unify.cjs:77`\n是一条钉住旧包名的断言：\n\n```js\ncheck('handoff.id 为 @max-null/dsh-header-unify', global.__handoff.id === '@max-null/dsh-header-unify', global.__handoff?.id)\n```\n\n而它 `eval` 的同目录 `lib/client.js:399` 早已用新名注册（`id: \"@max-null/dsh-quick-toolbar\"`）。\n\n实测 `node verify-header-unify.cjs`：进程 exit 1，但**不是在断言处失败的**——它在更早的\n`new MutationObserver(...)`（`client.js:1276`）处就抛 `ReferenceError: MutationObserver is not defined`。\n脚本内建的假 window 停留在 0.1.0 版 client.js 所需的最小集合上，没有跟上新版，\n这条旧名断言永远到不了。\n\n所以该文件的真实状态是**废弃的回归测试**：它不再保护任何东西，留在目录里只会让\n旧名残留检查多出一条噪声（已于 2026-09-10 删除，见 §6）。它同时是 §3.1 那类漂移的\n产物——源侧的对应文件已改名 `verify-quick-toolbar.cjs` 并随新版同步，vendor 侧留下的是\n0.1.0 时代的旧脚本。这说明旧名并不总在配置声明里，也可能钉在测试断言里，\n而**只在配置里查旧名会漏掉它**。\n\n### 3.5 一条适用于所有检查的判据：别做\"变更探测器\"\n\n来源：`superpower-writing-skills` 的附带参考 `writing-good-tests.md`（DSH 生态移植版：[JasonFreeLab/dsh-superpowers](https://github.com/JasonFreeLab/dsh-superpowers)，上游为 obra/superpowers）。它讲的是**测试**，两条原则：\n\n> 1. Every test names the break it catches（每个测试都要说出它捕获的那个断裂）\n> 2. Every test exercises the real thing（每个测试都要演练真实的东西）\n\n其中一条否决很锋利：\n\n> **No change detectors.** 如果只有**有意的决策**能让测试失败——一个常量的值、**确切的措辞**、私有结构——那么它**会在重新设计时触发，却在 bug 面前睡觉**。应该测**依赖那个决策的行为**：不是 `expect(MAX_RETRIES).toBe(5)`，而是\"失败的调用被重试 5 次，且第 6 次永不发生\"。\n\n**边界声明**：门禁**不等同于**测试。门禁强制一个约定，测试捕获一个 bug——目的不同，所以上面那套判据**不直接适用于门禁**。\n\n**但有一条启发值得对照**：\n\n> **一个只会在\"有意变更\"时报警的门禁，是在追着变化跑，而不是在防真问题。**\n\n按这条逐项对照四项检查：\n\n| 检查 | 报警时的成因 | 判定 |\n|---|---|---|\n| §3.1 vendor 四份核 | 改了源头忘同步 / 改了一处漏别处——**内容是应然的契约** | 不是变更探测器 |\n| §3.2 profile vs template | 声明失配（手册 §4 实测过的坑） | 同上 |\n| §3.3 BOM 扫描 | 字节级污染导致解析崩溃，属事故 | 同上 |\n| **§3.4 旧名残留** | **改名是有意的显著变更** | **最接近变更探测器的一项** |\n\n前三项防的是\"事情坏了\"，第四项防的是\"措辞不干净\"——**所以只有第四项需要额外小心**。\n\n**它需要小心的具体形态是退化成全仓文本扫描**。一旦变成\"任何地方出现旧字符串就报警\"，它会稳定命中 `docs/决策/**` 与 `docs/release-notes-*.md` 里的合法历史叙述（实测 79 处），而**这些命中恰好都是有意保留的**——那就是变更探测器的定义。\n\n**免除办法本文件 §3.4 已经给出**：只检查\"**引用会不会失效**\"，不检查\"措辞是否干净\"——\n\n- **硬域**：profile 声明、`cordis.patch.yml` 的 `id`/`name`、目录名——旧名在这里会导致**运行失败**\n- **软域**：历史文档与注释中的「原 X」叙述——旧名在这里**只是历史**\n\n**一句话判据**：门禁应当回答\"**这样写会不会坏**\"，而不是\"**这样写是否够新**\"。\n\n## 4. 编排器 check-rules\n\n四项检查各自是独立脚本 + package.json 里一行稳定 script 名（官方约定：\n`Package scripts own public aggregate names; this runner owns their validated dependency graphs`），\n编排器只做四件事：\n\n1. 单入口 + 白名单 mode 校验。`node scripts/check-rules.mjs [all|vendor-sync|profile-sync|bom|legacy-names]`，\n   非法值抛错并回显全部合法值（`run-gates.ts:134-159` 的形状）。\n2. 门表数据化，命令与展示名分离：`{ id, label, script }`。\n3. 顺序执行 + 逐门计时 + 输出缓冲。\n4. 退出码契约：任一失败 ⇒ exit 1。\n\n失败输出按官方 `formatGateResultReason`（`run-gates.ts:1533-1539`）把三类事实全列出、互不遮蔽：\n`error` / `exit N` / `signal X`。汇总区逐条列不成功的门。\n\n`shell/package.json` 增加：\n\n```json\n\"check:rules\":        \"node scripts/check-rules.mjs\",\n\"check:vendor-sync\":  \"node scripts/check-vendor-sync.mjs\",\n\"check:profile-sync\": \"node scripts/check-profile-sync.mjs\",\n\"check:bom\":          \"node scripts/check-bom.mjs\",\n\"check:legacy-names\": \"node scripts/check-legacy-names.mjs\"\n```\n\n每个门保留独立 script，便于单独复现、单独接入钩子。规模上四个门串行秒级完成，\n不需要并发调度；门数到 10 个以上、或单轮超过两分钟，再考虑引入官方那套并发与 fail-fast。\n\n**平台条件门用构造期过滤 gate 列表，不用运行期 skip 状态**（`run-gates.ts:351-365`）：\n少一个状态维度，也少一处\"看起来跑了其实跳过了\"的假绿。\n\n## 5. 明确不抄的部分\n\n| 官方机制 | 位置 | 不抄的理由 |\n|---|---|---|\n| `needs` + `after` 双依赖与环检测 | `814-869` | 为同目录产物的读者/写入者互斥而生；SSiD 四门之间无产物依赖 |\n| 手写并发调度 + `availableParallelism` 上限 | `168-197`、`934-941` | 官方封顶 4 是因为多个 doc 门各自建整棵 `ts.Program` 会爆内存；SSiD 无此负载 |\n| fail-fast 进程树终止体系 | `1091-1265` | 被 vitest worker / dev server 逼出来的；SSiD 门不留后代 |\n| 十余个 `DSH_*` 开关 | 全文 | 配置面就是理解成本 |\n| 嵌套 runner | `464-467` | `ci-consumers` 门里再跑子 runner，SSiD 无对应结构 |\n\n## 6. 待人工确认\n\n1. ~~两处残骸的处置~~ **已处置（2026-09-10）**：\n   - `seek-soul-in-darkness/plugins/dsh-quick-toolbar/`（整个目录，6 个 git 跟踪文件）\n   - `shell/profile-template/vendor/dsh-quick-toolbar/verify-header-unify.cjs`\n   \n   删除前确认随目录一并删掉的设计文档在上游有同一份（`max-null-plugins/dsh-quick-toolbar/doc/设计/`，\n   SHA256 均为 `1B397F5B…`，6158 字节），无信息损失。清理后重跑比对：三处 vendor 与\n   `max-null-plugins/` 源头零差异，\"仅在 vendor 侧存在\"由 1 归零，vendor 回到 4 文件的精简副本。\n2. 比对面是否需要 `exclude` 掉 `src/`、`tests/`、`docs/`——取决于\"四份一致\"是按可运行产物\n   定义还是按整个包目录定义。手册说的是\"MD5 四份一致\"，未界定比对面。\n3. `~/.dsh/profiles/web` 是否也要有 template 基准（当前 web 与 ssid 的 vendor 包集合不同）。\n4. 指纹算法是否接受从手册所称 MD5 换为 sha256。\n5. `dsh-capture`（源头在 `max-null-plugins/dsh-capture`）与 `dsh-context-doctor`（第三方固化）\n   是否纳入 §3.1 的\"三处互相一致\"子集。\n6. ~~`shell/profile-template/vendor/README.md` 两处过时~~ **已修正（2026-09-10）**：条目标题\n   的旧名改为 `dsh-quick-toolbar`；`dsh-genui` 条目改为反映现状（经 npm 声明 0.9.8、\n   vendor 目录下已无该包）。仍待定的是**边界问题**：`vendor/README.md` 这类描述性标题\n   要不要纳入旧名检查的硬域？当前建议归软域（人工维护），因为它是叙述而不是配置声明。\n\n## 7. 首次体检实测（2026-09-10）\n\n在写任何检查脚本之前，先按 §3.1 的判定手工跑了两轮比对（lib 面四份核、整包目录源对\nvendor；逐文件 sha256，排除 `node_modules`、`.git`、`*.log`、`*.tsbuildinfo`）。\n这既验证了判定契约可落地，也给出了当前基线：\n\n**lib 面（四份核）**：\n\n| 包 | 源侧 | 三处 vendor | 差异 |\n|---|---|---|---|\n| `dsh-ssid-panels` | 3 | 3 / 3 / 3 | **0** |\n| `dsh-ssid-zh-ui` | 2 | 2 / 2 / 2 | **0** |\n| `dsh-quick-toolbar` | 2 | 2 / 2 / 2 | **3（全部文件）** |\n\n**整个包目录（源 vs `profile-template/vendor`，残骸清理前）**：\n\n| 包 | 源 | vendor | 仅在源侧 | 仅在 vendor | 内容不同 |\n|---|---|---|---|---|---|\n| `dsh-ssid-panels` | 21 | 21 | 0 | 0 | 0 |\n| `dsh-ssid-zh-ui` | 5 | 5 | 0 | 0 | 0 |\n| `dsh-quick-toolbar`（源取 `max-null-plugins/`） | 43 | 5 | 39 | 1 | 0 |\n\n`dsh-ssid-panels` 与 `dsh-ssid-zh-ui` 四份全绿，说明现行同步纪律在执行中确实有效，\n检查一旦建立就有真实基线可守。\n\n`dsh-quick-toolbar` 的 lib 面三个红全是 manifest 源头写错，不是真的漂移：\n\n```\n把 seek-soul-in-darkness/plugins/dsh-quick-toolbar/lib 当源头：\n  DIFF client.js    src=74F19FCD  tpl/web/ssid=1FF6630F\n  DIFF index.js     src=MISSING   tpl/web/ssid=C0E9D4DA\n  DIFF index.mjs    src=00620466  tpl/web/ssid=MISSING\n把 max-null-plugins/dsh-quick-toolbar/lib 当源头：\n  三处 vendor 零差异\n版本：SSiD 残骸 0.1.0 ／ max-null-plugins 与三处 vendor 均 0.8.6\n```\n\n全目录那一行给出另一半结论：源 43 文件对 vendor 5 文件，39 处\"仅在源侧\"全部是按设计\n不进 vendor 的内容，唯一真信号是仅在 vendor 侧的 `verify-header-unify.cjs`——直接比\n\"整目录摘要\"的噪声比是 **40:1**，这正是 §3.1 要求把 include/exclude 写进 manifest 的理由。\n而 lib 面那三个 DIFF 里有两个是文件命名变化（`index.js` ↔ `index.mjs`），目录级摘要\n只会把它们显示成一个无法定位的红。\n\n残骸清理后重跑同一比对：`A=43 B=4 onlyA=39 onlyB=0 contentDiff=0`——\"仅 vendor 侧存在\"\n归零，vendor 回到 4 文件的精简副本，三处 vendor 的 lib 与源侧零差异。\n\n同时确认 §3.2 的一个前提：`~/.dsh/profiles/web/vendor` 与 `ssid/vendor` 的包集合不同\n（web 多一个 `dsh-dream-skin`），所以 profile 侧的受检对象只能是 ssid。\n\n## 8. 落地顺序\n\n1. `check-vendor-sync`——手册 §10 的硬性要求，与待办 #1 `sync-vendor.cjs` 互为对偶\n   （一个负责同步，一个负责验证）。\n2. `check-profile-sync`——手册 §4 实测踩过的坑，失配频率第二高。\n3. `check-bom`——实现最简，故障面最大。\n4. `check-legacy-names`——先定硬/软边界，并处理 §6 第 1 项的待确认。\n5. 四个都跑通后再建 `check-rules.mjs` 编排器。\n\n前两项之间有共享代码的诱惑（列文件、算指纹、定位差异），但建议先各自独立；\n真正需要从第一个脚本起就统一的只有**报告格式**（`文件:行` + 三类事实 + 退出码非零），\n它值得抽一个约 40 行的 `scripts/lib/gate-report.mjs`。\n\n每项检查都配一个自测（官方是每 gate 一个 `.spec.ts`）。既然检查脚本本身是 `.mjs`，\n自测也用 `.mjs`，`node --test scripts/*.spec.mjs` 直接可跑，不必引入 `tsx`。\n`shell/package.json` 现有测试脚本之所以带 `node --import tsx/esm`，是因为它跑的是\n`.ts` 用例（`--test tests/profile-merge.spec.ts tests/codegraph-adapt.spec.ts`），\n且用例是逐个列出的——新增自测时按同样方式显式登记，别用通配符收进来。\n自测同样要遵守官方那条纪律：**一个只在单独运行时才通过的测试是缺陷**——\n凡是占用临时目录或子进程的自测都要自己收尾。`verify-cordis-config.spec.ts` 的写法是\n每个用例 `mkdtempSync` 建独立临时目录、在 `finally` 里 `rmSync` 清理（L52/L70、\nL113/L141、L146/L152），并断言精确的错误字符串。\n"},{"file":"2026-09-10-SSiD-skill落点调查.md","date":"2026-09-10","slug":"SSiD-skill落点调查","title":"SSiD skill 落点调查","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["ssid-skill","dsh-plugin-upgrade","ssid-release","dsh-plugin-center","dsh-memory","dsh-superpowers","dsh-skill","dsh-chat-rail","dsh-prose-standard"],"summary":"源码：DSHfork/packages/skill/skill-filesystem/src/index.ts:250-262 共 6 类源，每类带一个 rank（优先级）。同名的覆盖关系由测试名写明：","bytes":8643,"lines":139,"body":"# SSiD skill 落点调查\n\n> **调查缘起**：你指出\"这些 skill 可能是某个插件的附属品，比如我们的记忆插件就有附带的 skill。这一点值得先进一步调查\"。\n> **调查方法**：读 DSH 的 skill 发现机制源码，并核对本机的实际部署形态。\n\n> 状态：进行中（推断 · 2026-09-12）\n\n---\n\n## 一、DSH 如何发现 skill\n\n源码：`DSHfork/packages/skill/skill-filesystem/src/index.ts:250-262`\n\n```\n\u003c项目根>/.dsh/skills      →  source: project-dsh\n\u003c项目根>/.agents/skills   →  source: project-agents\n\u003ccustomSkillDirs 配置项>   →  source: custom\n$DSH_HOME/skills          →  source: user-dsh   （skipSystem：跳过 .system/）\n$AGENTS_HOME/skills       →  source: user-agents\n\u003cbundledSkillDir>         →  source: bundled     （trustedHost: true）\n```\n\n**共 6 类源**，每类带一个 `rank`（优先级）。同名的覆盖关系由测试名写明：\n\n> **项目 skill 覆盖 runtime，runtime 覆盖 custom 与 user skill。**\n\n其他核实到的行为：支持目录形式 `\u003cname>/SKILL.md` 与平铺形式 `\u003cname>.md`；支持符号链接（含断链与设备链的处理）；有 `skills/change` 事件供热更新；`customSkillDirs` 可在配置里声明任意额外目录。\n\n---\n\n## 二、本机的实际部署形态\n\n| 路径 | 源 | 内容 |\n|---|---|---|\n| `C:\\Users\\MaxNull\\.dsh\\skills` | **user-dsh** | **17 个**：`dsh-plugin-upgrade`、`genui`、`mxy-*`（8）、`omo-*`（6）、`ssid-release`，另有 README.md |\n| `C:\\Users\\MaxNull\\.agents\\skills` | user-agents | 1 个：`docx` |\n| `C:\\Users\\MaxNull\\.agents\\.skill-lock.json` | — | `npx skills add` 的锁文件 |\n| `H:\\MaxNull\\WorkStation\\.agents` | project-agents | **不存在** |\n\n**因此当前会话加载的全部 skill 都来自 `~/.dsh/skills/`（user-dsh 源）**——包括那个 `dsh-plugin-upgrade`。\n\n---\n\n## 三、插件附属 skill 的真实机制（关键）\n\n**模式确实存在，但机制与直觉不同。**\n\n`max-null-plugins/dsh-plugin-center` 带一个 skill：`skills/dsh-plugin-upgrade/SKILL.md`。\n\n它的 package.json 里：\n\n- `files` 字段**包含** `\"skills\"`（把它打进 npm 包）\n- **`dsh` 字段没有任何 skill 声明**——只有 `bundle` 与 `client`\n\n既然发现路径里没有\"从 `node_modules/\u003cpkg>/skills` 读\"这一条，而 `dsh-plugin-upgrade` 又确实出现在 `~/.dsh/skills/` 下，**结论是：插件附属 skill 是\"部署时被安装到 user-dsh 目录\"才生效的，不是运行时从插件目录发现的。**\n\n旁证：`dsh-plugin-center/src/market.ts:182` 有一段注释区分了两种 skill 来源——\n\n> Skill entries install into `~/.agents/skills` via a different mechanism (`npx skills add`); the pnpm-driven center cannot install them, so…\n\n**所以 skill 有两条独立的供应链**：\n1. **插件包内 `skills/` → 随插件安装 → 落到 user-dsh**\n2. **纯 skill → 走 `npx skills add` → 落到 `~/.agents/skills`**\n\n---\n\n## 四、一处与记忆有关的更正\n\n你说\"我们的记忆插件就有附带的 skill\"。**这一点我没有找到证据**：\n\n- `max-null-plugins/dsh-memory` 顶层**没有** `skills/` 目录，全库无 `SKILL.md` 或 skill 相关文件\n- 它的 `files` 字段是 `[\"dist\",\"client.js\",\"cordis.patch.yml\",\"README.md\",\"LICENSE\"]`——**不含 skills**\n- 它的 `dsh` 字段只有 `bundle` 与 `client`，无 skill 声明\n- 全工作区扫下来，**带 `skills/` 目录的插件只有 `dsh-plugin-center` 一个**\n\n**最可能的解释**：你指的是当前会话每轮注入的那段「记忆系统自述」——那是 **dsh-memory 插件注入的系统提示段落，不是 skill**。两者在界面上都表现为\"大段中文说明\"，容易混淆，但机制完全不同：系统提示段落由插件直接注入，skill 是经上述发现路径加载的。\n\n如果你指的是别处（比如另一个工作区或未提交的分支），告诉我路径，我再去核。\n\n---\n\n## 五、对落点决策的结论（2026-09-10 修订）\n\n> **本节已改写**。原结论是\"两个落点\"，那是在**只考虑文件系统发现路径**的前提下得出的。\n> 之后的调查发现 skill 可以由**插件注册 provider**提供（范本：`packages/skill/skill-badge/`），于是出现了第三个、也是更优的落点。\n\n**落点是三个，且第三个优于前两个。**\n\n| # | 落点 | 生效条件 | rank |\n|---:|---|---|---:|\n| ① | `\u003c项目>/.dsh/skills` | 工作目录 = 该项目 | 100 |\n| ② | `\u003c项目>/.agents/skills` | 工作目录 = 该项目 | 200 |\n| ③ | **独立 npm 包（SkillProvider 插件）** | **装了它的 profile** | **550** |\n\n**①② 的共同局限**：路由条件是\"**工作目录等于那个仓库**\"——**出了那个目录就失效，也无法分发给他人**。我最初建议的 ② 只解决了一半问题。\n\n**③ 解决了全部四个需求**：进 SSiD、进任何 DSH profile、可分发给他人、独立库可承载更多文档与演进记录。\n\n**rank 550 的依据**：生态里已有先例——[JasonFreeLab/dsh-superpowers](https://github.com/JasonFreeLab/dsh-superpowers) 的 `SkillProvider` 就用 550，README 明写\"可被项目/用户技能覆盖\"。它位于 user-agents(500) 与 bundled(600) 之间，语义是\"第三方 skill 插件\"。详见 `2026-09-10-DSH-skill生态调查.md`。\n\n**SSiD 现有的 `ssid-release` 不受影响**——它是 SSiD 专属、只在开发/发版时用的 skill，留在 `.agents/skills/`（②）是对的。**新的方法论 skill 走 ③**，因为它的目标是\"跨项目可用、可分发\"。\n\n**一个仍然有效的事实**：SSiD 根目录的 `skills/`（14 个）**不在 DSH 的发现路径上**。它只是\"源头\"——需要经 `profile-template/skills/`（15 个，多一个 `genui`）走归档部署，才能到达 `~/.dsh/skills/` 生效。这解释了 `genui` 为什么只在 profile-template 里：它只属于产品交付，不属于开发期。\n\n**于是 SSiD 侧出现第三种形态**：一个既可独立分发、又被 SSiD 集成的东西。它**不适用**手册 §10 的\"内置插件不发布 npm\"条款（那条针对的是脱离 SSiD 无法使用的插件），而是走**npm 声明**（像 dsh-chat-rail 那样）——这也正是你的决定。\n\n---\n\n## 六、你这个要求的技术必要性：来源与版本标记\n\n你说的\"要有一份文档或者标记，表明这个 skill 的来源和版本，得记录来时路\"——调查之后，这条**不只是好习惯，而是被机制逼出来的必需**：\n\n**因为 skill 一旦部署到 `~/.dsh/skills/`，就脱离了源仓库。** 那个目录下的 17 个条目没有任何元数据说明它们从哪来、对应哪个上游版本。当前已知的溯源手段只有：\n\n- `~/.agents/.skill-lock.json`（只覆盖 `npx skills add` 那条链）\n- 各 skill 自身的 frontmatter（DSH 的 12 个 skill 只有 `name` 与 `description`，**没有 version 字段**）\n\n所以如果我们不自己记，**上游 DSH 更新到第几版、我们适配自哪一版，将无从查起**。而 DSH 是高频更新的（本会话早前实测：24 天 / 16 个 tag）。\n\n**建议的标记内容**（待你确认）：\n\n| 字段 | 例子 | 为什么需要 |\n|---|---|---|\n| 上游来源 | `DSHfork/.agents/skills/dsh-prose-standard/SKILL.md` | 定位原始文件 |\n| 上游版本锚点 | commit SHA + 日期 | DSH 无版本号，只有 commit 可靠 |\n| 适配日期 | `2026-09-10` | 判断适配是否已过时 |\n| 适配类型 | 小改 / 需适配 / 部分可用 | 对应清点文档里的分类 |\n| 与上游的差异摘要 | 删了什么、改了什么、为什么 | **适配的核心价值所在** |\n\n放在哪有两种选择：**skill 文件内的 frontmatter 扩展字段**（随文件走，但可能被 DSH 的 skill 格式检查拒绝），或 **skill 包内单独一个 `SOURCE.md`**（不干扰格式）。我倾向后者，理由与 DSH 自己的做法一致——`SKILL.md` 保持精简，重材料外置。\n\n---\n\n## 附：本次调查的证据边界\n\n- **已核实**：发现路径与 rank 的源码位置、6 类源、本机三个目录的实际内容、`dsh-plugin-center` 的 package.json 字段、全工作区插件 `skills/` 目录的扫描结果、`market.ts` 的注释原文。\n- **未核实**：`bundledSkillDir` 具体指向哪里；profile 配置里是否有 `customSkillDirs`；`dsh-plugin-upgrade` 究竟由哪一步部署到 `~/.dsh/skills/`（我只确认了结果，没有追到执行者）。\n- **更正**：第四节关于 dsh-memory 的结论是\"未找到证据\"，不是\"不存在\"——如果你有具体位置，我再去核。\n"},{"file":"2026-09-09-CodeGraph-MCP-默认索引目录修复.md","date":"2026-09-09","slug":"CodeGraph-MCP-默认索引目录修复","title":"CodeGraph MCP 默认索引目录修复（v0.2.2）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-09-09","dateNote":null,"tags":["ssid-codegraph-mcp","dsh-mcp-client","dsh-ssid-panels","dsh-skill-mcp-center"],"summary":"反馈原文要点（SSiD-CodeGraph-MCP-问题反馈.md，2026-09-09）：","bytes":8389,"lines":146,"body":"# CodeGraph MCP 默认索引目录修复（v0.2.2）\n\n> 日期：2026-09-09 ｜ 触发：AI 中台项目组问题反馈（本机 SSiD 用户）\n> 相关：`docs/决策/2026-09-07-升级部署覆盖用户层修复.md`（用户层保留）、\n> 状态：进行中（推断 · 2026-09-12）\n\n> `docs/决策/2026-08-24-Playwright-MCP-预制-实施方案.md`（预制 MCP 模式）\n\n## 1. 反馈与现象\n\n反馈原文要点（`SSiD-CodeGraph-MCP-问题反馈.md`，2026-09-09）：\n\n| 现象 | 后果 |\n|---|---|\n| 首次调用 `codegraph_*` 超时 `MCP error -32001`，进程停在 `index_parse` 8 分钟以上、内存 900MB+ | 首次体验差，易误判工具损坏 |\n| 索引产物收录 5000 条 `AppData\\...`（撞 `--max-files` 默认上限 5000） | 资源浪费，索引一堆无关文件 |\n| 查询项目符号（`SdkApiService`）返回 Chrome 扩展的 JS | 静默失效：工具「有响应」但结果与项目无关 |\n\n根因（v0.2.1 出厂注入，本机核对仍原样存在）：\n\n- `shell/main.mjs`：`process.env.SSID_MCP_CG_WS = process.env.SSID_MCP_CG_WS || homedir()`\n- `shell/profile-template/cordis.patch.yml`：`cwd: !!js 'process.env.SSID_MCP_CG_WS || \"\"'`\n\n即未定制时 CodeGraph 引擎的 workspace 就是**用户主目录**——而主目录里没有代码仓库。\n\n## 2. 为什么报告的建议 1 不可行（架构约束）\n\n报告建议「默认值改为会话工作目录」。核对 DSH 实现后确认**做不到**：\n\n- `dsh-mcp-client` 是 **profile 级 loader 条目**（`cordis.patch.yml` 顶层 `insert`），\n  一个 MCP 进程服务**所有会话**；`cwd` 在进程 spawn 时固定\n  （`packages/mcp/mcp-client/src/transport.ts` 把 `config.cwd` 直接交给\n  `StdioClientTransport`）。\n- 会话工作目录是**每会话**的运行时值，MCP 进程既感知不到，也不能在会话之间切换。\n- 即便改成 agent-preset 级挂载，也会变成「每会话一个索引引擎」——\n  按报告的 700–900MB/索引计，内存不可接受。\n\n另有两个实测约束：\n\n- `cwd: ''`（空字符串）会经 MCP SDK 直接传给 `spawn`，**实测 ENOENT**——\n  所以不能简单「不设默认值」，必须给一个非空目录。\n- 引擎 CLI 支持 `--workspace`（可重复）、`--exclude`（可重复）、`--max-files`、\n  `--profile`、`--graph-only`；工具 `codegraph_index_directory {path}` 可索引任意目录。\n\n## 3. 采用的方案\n\n**出厂不再指向用户主目录；boot 前由壳解析一次索引目录，解析不到就停用该条目。**\n\n### 3.1 解析优先级（`shell/lib/codegraph-adapt.mjs`）\n\n1. `SSID_MCP_CG_WS` 环境变量（高级用户/脚本显式指定）\n2. `~/.ssid/codegraph.json` 的 `workspace`（SSiD 侧稳定入口，含首次引导的选择）\n3. **最近会话探测**：扫 `$DSH_HOME/sessions-ssid`、`$DSH_HOME/sessions` 下的\n   `session.jsonl.zstd`，按 mtime 降序取第一个 header `cwd` 仍可用的会话\n   （只解第一个 zstd 帧，成本 ~KB 级；扫描规则与 `dsh-ssid-panels` 同源）\n4. 都没有 → `workspace = null` → **条目停用**\n\n「可用」判定 `isUsableWorkspace()` 显式拒绝：不存在的目录、**用户主目录本身**、\n**主目录的祖先**（`C:\\Users` 这类——等于把整个用户区当项目索引，正是本次事故）。\n\n### 3.2 停用与启用\n\n模板 patch 的 codegraph 条目带条件：\n\n```yaml\n      disabled: !!js 'process.env.SSID_MCP_CG_ENABLE !== \"1\"'\n```\n\n壳按解析结果设 `SSID_MCP_CG_ENABLE`（`'1'` / `'0'`），并**总是**设\n`SSID_MCP_CG_WS`（未适配时给占位目录）——空 cwd 会让 `spawn` ENOENT。\n`disabled` 的 `!!js` 求值走 `vendor/loader/src/config/entry.ts:104` 的通用\nentry 路径（`isJsExpr(options.disabled)` → `evaluate(...)`），insert 子条目同样适用。\n\n### 3.3 首次引导（可跳过）\n\n未适配且用户尚未做过选择（`~/.ssid/codegraph.json` 无 `decided`）时，boot 前弹一次\n选择框：选目录 → 落盘并启用；跳过 → 落盘 `decided: true` 并保持停用。\n用户之后仍可在「设置 → MCP」里改 cwd / 启停（`dsh-skill-mcp-center` 支持热更新）。\n\n### 3.4 出厂保护参数\n\n即使索引目录被改到项目根，也不进这些目录（报告建议 3）：\n\n```\n--exclude node_modules --exclude .git --exclude AppData --exclude target\n--exclude dist --exclude build --exclude .venv --exclude __pycache__\n```\n\n`--max-files` 保持引擎默认（5000）——撞上限本身是「索引范围没配对」的信号，\n出厂替用户调大会掩盖问题。\n\n## 4. 附带修复：升级不再打回用户对出厂 MCP 的改动\n\n**缺陷**：`mergeUserPatch` 以模板为基线，只把「模板 insert 块内不存在的用户子条目」\n追加回去；**同 id 子条目一律以模板为准**。于是用户在 MCP 管理页改的 cwd / 启停\n（写在 profile 根的 `cordis.patch.yml`）会在下次升级部署时被打回。\n\n**修复（三方合并）**：部署时把本次归档模板原文缓存到\n`~/.ssid/template-cordis.patch.yml`；下次部署以它为 **base** 比较：\n\n- base 有同 id 子条目且用户文本 ≠ base ⇒ **用户改过** ⇒ 用用户版本替换模板的该子条目\n- 文本与 base 相同 ⇒ 用户没改 ⇒ 用模板新版（模板升级照常生效）\n- 无 base（首次引入该机制）⇒ 退化为 v0.2.1 行为（只保留用户新增条目）\n\n`mergeUserPatch(old, template, base)` 第三参可选；`splitChildEntries` 增补\n`start`/`end` 行号以支持文本级替换。升级报告的 `patchMerged` 增 `overridden` 字段。\n\n## 5. 改动清单\n\n| 文件 | 改动 |\n|---|---|\n| `shell/lib/codegraph-adapt.mjs` | 新增：解析优先级、可用性校验、会话 artifact 探测、配置读写、保护参数 |\n| `shell/main.mjs` | 去掉 `homedir()` 默认；boot 前解析 + 设 env；首次引导弹窗；部署段缓存模板 base 并传三方合并 |\n| `shell/profile-template/cordis.patch.yml` | codegraph 条目加 `disabled: !!js`；args 加 `--exclude` 保护清单；注释重写 |\n| `shell/lib/profile-merge.mjs` | `mergeUserPatch` 三方合并；`splitChildEntries` 返回行号；升级报告加 `overridden` |\n| `shell/tests/codegraph-adapt.spec.ts` | 新增 7 例 |\n| `shell/tests/profile-merge.spec.ts` | 新增 4 例（用户改动保留 / 模板升级生效 / 无 base 退化 / 改动+新增并存） |\n| `shell/package.json` | 增 `test`（聚合）与 `test:codegraph-adapt` |\n\n## 6. 验证（L2，2026-09-09）\n\n- **L1**：`npm run typecheck` 全绿；`npm test` 29/29（含新增 11 例）。\n  注意 `tsconfig.json` 的 `include` 只含 `kernel.ts`/`module-resolution.ts`/`boot-smoke.ts`，\n  `main.mjs` 不在类型检查范围内——改动靠 boot 实测覆盖。\n- **停用路径**（不设 `SSID_MCP_CG_ENABLE`）：`npm run smoke` → `SSiD boot OK`，\n  进程列表**无** `codegraph-server-*`（对照组证明该条目确实会被加载）。\n- **启用路径**（`SSID_MCP_CG_ENABLE=1` + 空目录 workspace）：引擎日志\n  `Workspaces: [\"...cg-empty-ws\"]`、`Excluding: [\"node_modules\", \".git\", \"AppData\", ...]`、\n  `Client: dsh-mcp-client 0.0.1`、`tools/list` 正常，boot OK——`--exclude` 被引擎接受，\n  workspace 不再是用户主目录。\n- **顺带清理**：发现一个 v0.2.1 遗留的孤儿 `codegraph-server` 进程\n  （2026-09-08 启动、命令行 `--mcp` 无 `--workspace`、cwd 继承 = 用户主目录，父进程已退出），\n  已终止。\n\n## 7. 已知限制与待办\n\n- **旧壳 × 新 patch 不一致**：正在运行的安装版（v0.2.1 壳）不设 `SSID_MCP_CG_ENABLE`，\n  若其重启会用上已同步的运行时 patch → codegraph 显示为**停用**（安全方向）。\n  v0.2.2 发版后壳与 patch 一并更新即一致。\n- **首次引导只在「未适配且未 decided」时出现**；跳过后若之后探测到项目仍会自动启用\n  （`decided` 只表示「问过了」，不是「永不用」）。\n- **多项目用户**：MCP 是单例，索引目录只能有一个。跨项目需在 MCP 管理页切换，\n  或给 `codegraph_index_directory` 传目标路径（引擎支持多 workspace，但出厂不预置）。\n- 工具面保持 `--profile all`（42 工具，实测工具列表约 42KB 注入成本）——\n  用户若嫌上下文重，可在 MCP 管理页把 args 改成 `--profile core|graph`。\n"},{"file":"2026-09-07-升级部署覆盖用户层修复.md","date":"2026-09-07","slug":"升级部署覆盖用户层修复","title":"2026-09-07 升级部署覆盖用户层修复（插件/MCP 丢失 + 无法启动）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@huanlin/dsh-plugin-better-sidebar-plugin-office","@deepseek-ai/dsh","@astudioplus/codegraph-mcp","dsh-skill-mcp-center","dsh-plugin-better-sidebar-plugin-office","dsh-web-preview-panel","dsh-sidebar-qa","dsh-runtime","dsh-taskboard","dsh-mcp-client","dsh-wechat","dsh-ssid-panels"],"summary":"- main.mjs deployRuntime（v0.1.3+）：归档顶层 = profile 根内容，部署 = nodemodules 整体替换 + 其余条目（package.json / cordis.patch.yml / pnpm-lock.yaml / vendor/…）逐个「rmSync + rename」覆盖——没有合并，用户自装插件声明、用户 patch（MCP 注册）零保留。 ","bytes":11308,"lines":77,"body":"# 2026-09-07 升级部署覆盖用户层修复（插件/MCP 丢失 + 无法启动）\n\n> 状态：进行中（推断 · 2026-09-12）\n\n> 现象报告（用户 v0.2.0 覆盖安装后）：① 用户自装插件与新版 DSH 不兼容，新版 SSiD 安装后无法启动；② 用户自装 MCP 消失——MCP 程序本体还在，但注册信息被覆盖。\n> 结论：两个 bug 同根因（部署零保留覆盖用户层），另附一条「部署失败→无闭包锚点→运行时定位崩溃」的失效链与本机遗留的「陈旧 pending 回滚炸弹」。\n\n## 1. 机制确认（代码 + 本机现场证据）\n\n- `main.mjs deployRuntime`（v0.1.3+）：归档顶层 = profile 根内容，部署 = `node_modules` 整体替换 + **其余条目（package.json / cordis.patch.yml / pnpm-lock.yaml / vendor/…）逐个「rmSync + rename」覆盖**——没有合并，用户自装插件声明、用户 patch（MCP 注册）零保留。\n- DSH 的 MCP 注册渠道 = profile 根 `cordis.patch.yml` 的 insert 条目（dsh-skill-mcp-center / 插件中心都编辑它）；DSH 无全局 MCP（2026-08-24 方案文档同款结论）。\n- 本机现场（开发机即用户机器，dev 与安装版共用 `~/.dsh/profiles/ssid`）：\n  - 今晚 21:53 安装版启动日志：`runtime deploy needed (archive=0.2.0-…e13b24f3 profile=0.2.0-…86e1fb66) → runtime deployed`；\n  - 部署后 `cordis.patch.yml` = 模板原文（仅 mcp-playwright）；`package.json` deps = 模板+内核族；\n  - 用户曾装插件（`@huanlin/dsh-plugin-better-sidebar-plugin-office`、`dsh-web-preview-panel`）仅存在于各 `package.json.pre-*`/`.bak-*` 备份，node_modules 实体已消失；\n  - **`~/.ssid/pending-plugin-updates/index.json` 残留 8-28 的 `dsh-sidebar-qa@0.4.2`**：kernel `applyPendingPluginUpdates` 每次 boot 前 `pnpm add -w dsh-sidebar-qa@0.4.2`——一旦某次成功就把 0.5.0（rc.1 兼容）降回 0.4.2（rc.2 时代）→ `Failed to load plugins` 白屏。当前实体仍是 0.5.0（消费一直失败），但雷一直挂着。\n- 无法启动链（ssid.log 实锤）：`runtime deploy failed: EPERM … .deploy.old`（旧实例/杀软占用 + 首次 `rmSync` 残留清理无防御）→ isUpgrade 走「继续用旧环境启动」→ 旧 profile 无闭包锚点（源码模式残留）→ `Error: 无法定位 DeepSeek Harness 运行时` → 崩溃。用户观察到「直接打不开」，且「没装插件时覆盖安装正常」——因为旧插件增大 node_modules 占用与部署失败概率，且失败后环境完整性差。\n\n## 2. 修复（v0.2.1 起生效，本提交）\n\n| 环节 | 改动 | 文件 |\n|---|---|---|\n| 部署前快照 | `~/.ssid/profile-backups/\u003c旧指纹>-\u003cts>/` 复制 package.json / pnpm-lock.yaml / pnpm-workspace.yaml / cordis.patch.yml / settings.yaml / .npmrc | main.mjs + lib |\n| 部署后 patch 合并回写 | 模板 patch 为基线，旧 patch 中「模板无同 id」条目（用户 MCP insert / disable 等）追加回写；纯文本条目级切分（不解析 `!!js`，失败保模板）；UTF-8 无 BOM | lib `mergeUserPatch` + main.mjs |\n| 升级报告 | `~/.ssid/upgrade-report-\u003cver>.json`：丢失插件清单（声明层，不自动重装——避免旧版插件在新内核白屏）、合并条目数、快照路径 | lib `buildUpgradeReport` + main.mjs |\n| pending 护栏 | 消费前比对当前声明：pending \u003c 声明（或声明缺失/非 registry 形态）→ 丢弃并清 tgz，绝不回滚（本机 dsh-sidebar-qa@0.4.2 雷被此规则消化） | kernel.ts + lib `shouldDropPending` |\n| 部署失败/取消兜底 | isUpgrade 失败或取消后：闭包锚点（profile/node_modules/@deepseek-ai/dsh）存在 → 维持旧版启动；缺失 → splash 明确阻断提示，不再走到「无法定位运行时」崩溃 | main.mjs |\n| 残留清理防御 | `.deploy.new/.deploy.old` 清理包 try/catch：被占用时仅日志（历史会未捕获抛异常崩在启动最早期） | main.mjs |\n\n`lib/profile-merge.mjs` 为纯 ESM 零依赖（main.mjs 主进程与 kernel.ts/esbuild bundle 共用）；单测 `tests/profile-merge.spec.ts` 13 例（patch 切分/合并/增量/semver/护栏/快照/报告）全绿；`npm run typecheck` 通过；`npm run bundle-kernel` 产物已含新逻辑。\n\n## 3. 设计取舍\n\n- **MCP 自动合并、插件不自动重装**：MCP 条目是纯配置（无版本/兼容风险）→ 合并保留；插件声明层丢失后自动重装 = 把「旧版插件 × 新内核」的白屏风险直接灌回 → 只进报告，引导用户从插件中心装兼容版。\n- **合并失败保模板**：任何异常返回模板原文（绝不写坏 profile patch），仅日志。\n- 用户「disable 了出厂条目（如 mcp-playwright）」的偏好：合并规则以出厂模板为准（disable 同 id 不保留）——出厂基线恢复优先，文档记录此边界。\n\n## 4. 验证\n\n- L1：13 单测全绿 + `npm run typecheck` + `bundle-kernel` 产物含 `shouldDropPending`。\n- L2（待执行，三环境流转：发版预演 `SSID_DEV_DEPLOY=1` 在 SSiD dev 上）：\n  1. 预置用户 MCP 条目 + 用户插件声明 → 建 `dsh-runtime.tar.gz`（手改后重建）→ 部署 → 断言 `cordis.patch.yml` 含用户条目、报告生成、插件清单正确；\n  2. pending 雷：`index.json` 留 dsh-sidebar-qa@0.4.2 → boot → 断言清单被清、实体仍 0.5.0；\n  3. 部署失败（模拟占用）→ 无闭包锚点 → splash 阻断文案（而非崩溃）。\n\n## 6. 补充（2026-09-07 用户确认）：office 插件恢复预制\n\n- 初版排查把 `@huanlin/dsh-plugin-better-sidebar-plugin-office` 归为「用户自装」——**纠正**：它是 v0.1.x 时代的**预制清单成员**（8-19/8-29/9-2 三份预制清单均含，0.1.0→0.1.2），v0.2.0 发布时被主动移除（release note「预制列表清理（不再维护的第三方插件）」）。\n- 移除理由已失效：作者 2026-09-04 发布 **0.2.0**（仍在维护）；且 web 端 rc.1 已实装 0.2.0（9-6 插件中心 0.1.2→0.2.0 的「不兼容」标注为保守判定，实测可用）。\n- **恢复预制**（用户拍板）：`profile-template/package.json` dependencies + bundles 加回 `@huanlin/dsh-plugin-better-sidebar-plugin-office@0.2.0`（精确 pin）——下个发版归档自带；本机 profile 装回需在 SSiD 实例退出后执行（node-pty 文件锁）。\n- 测试样例同步替换：office 不再作为「用户插件」样例，改用第三方 `dsh-taskboard`。\n\n## 7. 补充（2026-09-07 晚）：v0.2.1 发版计划审查结论（codegraph/wechat 预制）\n\n- **codegraph MCP 预制（ec45749）审查**：三处到位（deps 0.20.1 精确 pin / patch mcp-codegraph 显式 id + cwd（dsh-mcp-client StdioConfig 原生支持 cwd）/ main.mjs SSID_MCP_CG_CLI/WS 注入，WS 默认主目录）。**修正两项**：① patch `config.env` 加 `CODEGRAPH_TELEMETRY: 'off'`（匿名遥测默认开，预制必须关——README 明示 opt-out 方式）；② **引擎不在 npm 包内**（0.20.1 仅 69KB，postinstall 从 GitHub release 下载引擎 + ONNX sidecar，下载失败静默继续）→ 发版归档抽查**必加**「`node_modules/@astudioplus/codegraph-mcp/bin/codegraph-server-*.exe` 存在」断言；release notes 说明首次使用可能联网/低内存自动 graph-only（\u003c1.5GB），勿宣传「直接可用」。\n- **dsh-wechat（6a32659）审查**：`^0.9.1` → **改精确 pin `0.9.1`**（模板其余第三方全为精确 pin，归档确定性）。\n- **跨会话并发事实**：多次 git add -A 交叉提交（本会话 main.mjs 修复被卷进 ec45749、office 模板改动被卷进 6a32659）——内容无冲突但提交主题混杂；**发版前 git status + git diff 复核**，release notes 按内容分组（修复/预制），不按 commit 主题。kernel.ts（pending 护栏）/lib//tests/ 仍为未提交，发版 commit 得带上。\n\n## 8. 补充（2026-09-07 深夜）：0.2.1 修复失效实证——insert 子条目级漏网（v0.2.2 修复）\n\n- **用户实证**：另一台电脑 0.2.1 安装版覆盖 0.2.0 后，用户自装 MCP **仍全部丢失**（0.2.1 已含 92446d5 的护栏与 main.mjs/lib 修复——不是没带代码）。\n- **根因（复现实锤）**：用户 MCP 是被**追加进既有 `- insert:` 列表的第三个子条目**（面板/插件中心的标准做法，顶层仍是同一个 insert 块）。第一版 mergeUserPatch 只做**顶层条目级**对比：旧 patch 的 insert 块整体 id=第一个子条目（mcp-playwright）→ 与模板同 id → 整块判定「模板已有」→ **用户子条目被丢弃**（复现：merged=0、mcp-user-custom 丢失）。只有「独立顶层 insert 块」形态（形态 B）能保住（复现 merged=1 保留）。\n- **修复**（lib/profile-merge.mjs `mergeUserPatch` 重写）：**子条目级**对比——把模板与旧 patch 的 insert 块都 `splitChildEntries` 到子条目（`- \u003ckey>:` 形态判定，**排除 args/env 里的 `- !!js`/`- '字符串'` 列表项**——首次实现把 args 当子条目导致虚高合并 4 条）；用户新增子条目并入模板 insert 块尾部；非 insert 顶层条目维持原逻辑；任何异常保模板。单测 15/15（新增「追加子条目」与「模板无 insert」两用例）+ typecheck + round-trip（单块、子条目序 [playwright, codegraph, user]、无 BOM）全绿。\n- **现状处置**：用户那台电脑的 MCP 注册已被 0.2.1 覆盖，但 0.2.1 部署时**快照已拍**——`~/.ssid/profile-backups/\u003c旧指纹>-\u003cts>/cordis.patch.yml` 含升级前原始 patch（用户 MCP 条目可对照找回，面板重加）；自动保留从 0.2.2 起生效。\n- **教训**：patch 合并的粒度必须到「insert 块内子条目」级；测试必须用**真实模板形态**（多子条目 + args 表达式/字符串）而不是理想化样例。\n\n### 8.1 对抗审查（2026-09-07 深夜，修复后自查）\n\n- **P1 真 bug（已修）**：`mergeUserPatch` 未剥离 **UTF-8 BOM**——旧 patch 若被编辑器写成带 BOM（首行即 `- insert:`、无头注释）→ `\\uFEFF- insert:` 被条目切分误判为非条目行 → 整块（含用户 MCP）再次全丢。修复：入口 `replace(/^\\uFEFF/, '')`（oldText + templateText）。\n- **P2 边界（已确认安全，记录）**：① 模板有多个 insert 块时用户子条目并入**最后一个**块（当前模板仅 1 块）；② 子条目判定 `- \u003ckey>:` 不约束缩进层级——若未来某插件 config 含「数组对象带 id 字段」的嵌套结构会被误切（当前 mcp-client config 全为标量/列表，无此形态）；③ 模板顶层若出现 disable 条目，其子行 id 会进入 tmplChildIds（暂无此形态）。\n- 对抗用例（+3，共 18）：BOM 头无注释旧 patch、多用户 MCP 子条目顺序、用户子条目内 args `!!js`/字符串完整保留。全套：18/18 + typecheck + 真实 v0.2.0→v0.2.1 复现（两形态均保留）+ round-trip（单块、序 [playwright, codegraph, user]、无 BOM）。\n\n## 5. 后续建议（未在本轮）\n\n- 升级报告的 UI 呈现（dsh-ssid-panels「关于 SSiD」提示徽章 / 启动通知）——当前仅文件 + 日志。\n- 部署前「旧实例占用检测」主动提示（现在靠失败后 hint + 阻断兜底，可再提前）。\n"},{"file":"2026-09-06-chat-rail导航条TypeError与投影串写根因.md","date":"2026-09-06","slug":"chat-rail导航条TypeError与投影串写根因","title":"chat-rail 导航条点击报错：TypeError 根因 + chatRail 投影跨会话串写（2026-09-06）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-chat-rail","dsh-v0","dsh-chat-rail"],"summary":"dsh-chat-rail/src/client/index.tsx jumpToMessage() 解构类方法后裸调： Session.loadThrough 是类方法（packages/api/session-controller/src/client/sessions/session.ts:390）， 内部读 this.openState（第 391 行）→ this 为 undefined","bytes":9504,"lines":138,"body":"# chat-rail 导航条点击报错：TypeError 根因 + chatRail 投影跨会话串写（2026-09-06）\n\n> 状态：进行中（推断 · 2026-09-12）\n\n> 用户报「web 版 dsh 导航条点击报错」，定位与修复记录。\n> 环境：web 端（3080，`bin.ts web` 源码模式，checkout @ dsh-v0.1.2-rc.1）；插件 `@max-null/dsh-chat-rail@0.6.0`。\n\n## 一、主 bug：TypeError（已修复 ✅）\n\n### 现象\n\n```\nclient.js:2049  [Violation] Permissions policy violation: unload is not allowed...\nsession.ts:391  Uncaught (in promise) TypeError: Cannot read properties of undefined (reading 'openState')\n    at loadThrough (session.ts:391:14)\n    at jumpToMessage (index.tsx:922:11)\n    at onClick (index.tsx:1478:9)\n```\n\n### 根因\n\n`dsh-chat-rail/src/client/index.tsx` `jumpToMessage()` 解构类方法后裸调：\n\n```ts\nconst jumpLoadThrough = session.loadThrough   // ← 解构\n...\nawait jumpLoadThrough(targetSeq)              // ← 裸调用，this === undefined（ESM 严格模式）\n```\n\n`Session.loadThrough` 是类方法（`packages/api/session-controller/src/client/sessions/session.ts:390`），\n内部读 `this.openState`（第 391 行）→ `this` 为 undefined 即抛 TypeError。栈行号与源码逐行吻合\n（`session.ts:391` / `index.tsx:922` 调用点 / `index.tsx:1478` 点击处理）。\n\n### 修复（max-null-plugins/dsh-chat-rail）\n\n- `src/client/index.tsx`：改为方法调用 `jumpSession.loadThrough(targetSeq)`（this 正确绑定到 session 对象）。\n- `tests/client-nodes.spec.ts`：新增回归测试「invokes loadThrough as a method so the session this stays bound」\n  ——修前红（有效捕获）、修后绿。\n- L1：`pnpm test` 38/38、`typecheck` 绿、`pnpm build`（tsdown）成功。\n- 运行时实体同步：源码 `lib/client.js(+.map)` → `~/.dsh/profiles/web` 与 `~/.dsh/profiles/ssid` 的\n  `node_modules/@max-null/dsh-chat-rail/lib/`（三处 hash 一致）。\n- L2 实测：Playwright 打开 3080 页面 → 打开「助手中心开发」会话 → 点击导航条消息项 →\n  **console 0 error**（原必现 TypeError 消失）。\n\n## 二、次级问题：chatRail 投影跨会话串写（未修复，根因在内核 host 侧 ⚠️）\n\n### 现象\n\n点击导航条不再报错，但出现：\n\n```\n[chat-rail] jumpToMessage: node \"13:input-messagef3c8d0bf-…\" not loaded after loadThrough(8)\n```\n\n（跳转探测失败 → 不滚动；且 rail 显示「ssid更新内核/来文档了/你重启就行」3 条不属于当前会话的消息。）\n\n### 证据链（全部实测）\n\n| # | 事实 | 证据 |\n|---|---|---|\n| 1 | 当前会话（session-3d86ef56…「助手中心开发」，8/24 起）真实用户消息 11 条：seq 18381「全家桶中还有哪些…」/ 32484「社区有没有定时任务」/ 36015… / 88295「记忆与人格层」/ 90043 / 94217 / 95509 / 97265 / 106624「开干」 | `session/page` 全量窗口（beforeSeq=139915, max=200），source.kind=user 过滤 |\n| 2 | 该会话日志**不存在** 9/5 16:05-16:26 的任何事件（按 time 区间全量扫描 0 命中），**不存在** id=f3c8d0bf 的消息 | `session/page` records 窗口（2634 条）按 time/id 过滤 |\n| 3 | rail（导航条）显示 9 条 = **[9/5 16:05-16:26 的 3 条 {seq 8/25411/66609, id f3c8d0bf/811f71af/21fb1de5}（rc.1 升级会话）] + [8/24-25 的 6 条真实消息（seq 88295-106624）]** | DOM `crl_item` 逐一读取（时间标签 1天前/8-25 与缓存一致） |\n| 4 | 该会话投影缓存 `session_projcache/sessions/session-3d86ef56…json` 的 `rows.chatRail` 与 rail 内容**完全一致**（ver=6, seq=139914）；**其他行（title/todos/plan/turnOutline 等 23 行）全部正常**（title=\"助手中心开发\" ✓） | 直接读 JSON |\n| 5 | 删除该缓存文件 → 刷新页面 → **rail 复现同样 9 条**（非磁盘脏残留，宿主侧**每次打开会话实时生成**） | Playwright 实测 |\n| 6 | 全盘扫描所有 `session_projcache/sessions/*.json`：**没有任何文件**含 id=f3c8d0bf | node 脚本 |\n\n### 结论\n\n- **数据错在宿主侧**：打开「助手中心开发」会话时，host 端对 `chatRail` 投影单元做冷重建/折叠时，\n  其事件流中**混入了另一个会话（9/5 16:05-16:26 的 rc.1 升级会话）的 3 条 user/message 事件**，\n  且异常地排在本会话消息之前（客户端 messages 数组 = [异会话 3 条] + [本会话尾部 6 条]）。\n- **非 chat-rail 的 bug**：它的数据源（`useProjection('chatRail')`）与宿主投影 checkpoint\n  （其余 23 行正确）之间出现单元级错位；目标 key/seq 在本会话不存在 → 客户端任何跳转策略都无法命中。\n- **修复归属**：`deepseek-harness` 官方库 host 侧（`packages/session/{session-projection,session-projection-cache}`\n  的冷重建/事件源拼接路径）——按工作区规则**只引用不改**，需反馈上游或由用户决策（是否在 SSiD dev\n  侧进一步定位到具体 host 行号 / 打本地补丁）。\n\n### 建议\n\n1. **反馈上游**：根因描述 = 打开会话时 chatRail 投影 fold 事件流混入异会话事件（仅影响单投影单元，\n   其余 checkpoint 行正常；删缓存可复现）。\n2. 用户侧临时手段：无（缓存删除无效，问题在运行时生成侧）。\n3. 后续可在 SSiD dev 环境（能重启、能加日志）打 host 侧日志，定位冷重建时事件源拼接的确切路由。\n\n## 二·补 2026-09-07 复核：串写未重现（缓存已为正确 12 条）⚠️ 修正性证据\n\n> 9/6 结论「每次打开会话实时生成串写」需按本节修正定级：**已观察到的是一次可复现的异常，\n> 当前缓存/日志层已一致为正确数据，未再重现**。\n\n### 复核操作\n\n1. **原始日志逐条核对**（多帧 zstd 解码：frame magic `28 B5 2F FD` 逐帧切分后 `zstdDecompressSync`；\n   6646 帧 / 8910 行）：会话 3d86ef56 的 `user/message`（source.kind=user）事件 = **12 条**：\n   seq 8 / 18381 / 32484 / 36015 / 44730 / 77371 / 88295 / 90043 / 94217 / 95509 / 97265 / 106624\n   （首条 time=1787589516330，尾条 106624「开干」）。\n2. **当前投影表缓存**（`~/.dsh/storages/session_projcache.json`，tables.sessions[3d86ef56].rows.chatRail，\n   ver=6 seq=139913）的 messages = **12 条，与日志逐条一致**（id/time/text 全对）——**9/6 的\n   「9 条 = 3 异会话 + 6 本会话」组合已不存在**。\n3. 9/6 的串写版本存档仍在 `session_projcache/sessions.bak-2026-09-06/session-3d86ef56-….json`\n   （可复查：ver=6 seq=139914，9 条）。\n4. 缓存自愈时间窗：9/6 晚（删缓存复现 9 条）→ 9/7 0:46（首次读取时已 12 条正确）。期间 web host\n   持续运行 + SSiD dev 首启（0:42）+ 会话文件同步（0:48）——**未定位到确切自愈触发方**。\n5. **局限**：12 条正确结论基于「日志层 + 投影缓存层」静态核对；SSiD dev UI 无法打开该会话\n   （侧边栏列表窗口限制 + 名称搜索无全文索引），web(3080) 端 token 不可得，**未做 UI 层复测**。\n\n### 定级修正\n\n- 9/6：**可稳定复现**的串写异常（删缓存后刷新复现），影响单投影单元。\n- 9/7：**未重现**；缓存已正确。列入「疑似竞态型异常（与特定打开时序/并发会话活跃有关）」，\n  反馈上游时按「竞态 + 待稳定复现配方」描述，**不再断言必现**。\n- 机理候选（代码已核对）：投影 restore 为 per-session 事件流 + seq 连续校验（不跨会话喂事件）；\n  植入点候选 = session-persistence `readFrom(id, floor)` 或 cold-read 调用方的事件窗口拼接\n  （`packages/session/session-projection-cache` / `packages/api/session-controller` 冷路径），\n  待 host 侧日志定位。\n\n## 二·补二 2026-09-07 跳转四件套（插件侧闭环 ✅，非本文件主案）\n\n- 用户大会话实测暴露四项：近距也先加载 / 首条点击无效 / 滚到后仍显示加载中 / rail 滚动条闪现。\n- 归属结论：**均非 DSH 升级 bug**——插件侧缺陷被 rc.1 的 `loadThrough` 跳转 API + 异步窗口装配\n  「放大」：①无官方 `TurnNavigator` 的 loaded/unloaded 二分（适配瑕疵）②`scrollToRow` 的\n  `target\u003c0 return` 使文档头部行（首条）无法落位（长会话必现，测试盲区——上轮 L2 只验\n  「不报 TypeError」未验「滚到位」）③busy 状态覆盖跳转全程（含滚动后稳定性验证）④CSS 滚动条\n  随粘性 busy 行闪现。\n- 参考（官方）：`packages/client/ui-chat/src/client/chat/{ChatView.tsx,TurnNavigator.tsx}` 的\n  `navigateToTurn`（loaded→`anchorElement`+滚动；unloaded→`loadThrough`）；\n  锚点 key 规则 `conversationContextKey`（`${kind.length}:${kind}${id}`——**13:input-message 未变**）。\n- 修复与完整证据链见插件仓库\n  `max-null-plugins/dsh-chat-rail/docs/verification/验证记录-2026-09-07-chat-rail修复链L2.md`\n  （回归测试 +4、41/41、L2 实测 scrollTop/loading/scrollbar 数据、0.6.1 发版清单）。\n\n## 三、涉及文件\n\n- `max-null-plugins/dsh-chat-rail/src/client/index.tsx`（修复 + 行号 909-922）\n- `max-null-plugins/dsh-chat-rail/tests/client-nodes.spec.ts`（+1 回归测试）\n- `max-null-plugins/dsh-chat-rail/lib/client.js`（构建产物，已同步 web/ssid profile 实体）\n- `C:\\Users\\MaxNull\\.dsh\\storages\\session_projcache\\sessions.bak-2026-09-06\\session-3d86ef56…json`（串写缓存备份）\n"},{"file":"2026-09-06-DSH-web内核升级-rc.1参考文档.md","date":"2026-09-06","slug":"DSH-web内核升级-rc.1参考文档","title":"DSH web 内核升级 0.1.2-rc.1 参考文档（2026-09-06）","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh","dsh-web","dsh-0","dsh-v0","dsh-client-runtime","dsh-observations","#3456"],"summary":"- [ ] web 页面可打开（master 内核 web 服务带 token 认证——从启动日志 dsh web: http://127.0.0.1:\u003cport/?token=… 取带 token 的 URL；裸 URL 会 401） - [ ] 标题栏/关于信息显示 DSH 内核版本 = 0.1.2-rc.1 - [ ] 插件/工具/设置页功能抽查（rc.1 与 alpha.5 的 API 差","bytes":5230,"lines":79,"body":"# DSH web 内核升级 0.1.2-rc.1 参考文档（2026-09-06）\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **⚠️ 修订说明（2026-09-06 晚）**：本文档 §0 现状盘点经实测修正——web(3080) 实为 **deepseek-harness**\n> 宿主（进程启动时加载 alpha.1，checkout 已 rc.1），**DSHfork 并非运行宿主**（无 node_modules/dist，无法承载）。\n> 升级已由 SSiD 会话执行完毕（见《2026-09-06-web升级-rc.1执行记录.md》）；本文档 DSHfork 步骤保留仅作参考。\n\n\n> 任务背景（大计划第 3 步）：SSiD 已发版 v0.2.0（DSH 内核 rc.1，官方 checkout + 安装版闭环）；\n> 现在把**日常开发宿主 web(3080)** 从 alpha.5 时代（DSHfork master）升到 **rc.1**，\n> 与 SSiD 安装版对齐。本文为**操作参考**（按 AGENTS.md 三环境流转纪律，**web 主体操作由用户执行**；\n> 当前会话在 web 上运行，仅做只读探查与文档，不启停任何实例）。\n\n## 0. 现状盘点（已核实）\n\n| 项 | 值 |\n|---|---|\n| web(3080) 宿主进程 | `node --import tsx/esm apps/cli/src/bin.ts web`（源码模式，进程 PID 65604） |\n| 宿主仓库 | `H:\\MaxNull\\WorkStation\\DSHfork`（本地克隆；`origin`=官方、`fork`=Max-Null 分叉） |\n| 当前内核 | **master @ 49a606bc5b**（`Merge PR #3456 release/dsh-0.1.2-alpha.5-version-to-master`）→ **alpha.5 时代** |\n| 目标 | **dsh-v0.1.2-rc.1**（本地 tag 已存在，`git tag -l` 可见；与官方 checkout 同 tag） |\n| 工作区 | DSHfork `git status` 干净（无本地改动，纯跟随） |\n| 参考实现 | SSiD 安装版 v0.2.0（归档指纹 `0.2.0-0.1.2-rc.1-*`，闭包 214 overrides 全 rc.1） |\n| 间距 | DSHfork master 落后官方 origin 共 292 commits（含 alpha.5→rc.1 全部） |\n\n## 1. 升级步骤（用户侧执行）\n\n```powershell\n# ① 准备：确认干净 + 取最新官方引用\ncd H:\\MaxNull\\WorkStation\\DSHfork\ngit status                                   # 期望干净（已核实）\ngit fetch origin\ngit tag -l 'dsh-v0.1.2*'                      # 应有 dsh-v0.1.2-rc.1\n\n# ② 切到 rc.1（detached，与官方 checkout 同习惯）\ngit checkout dsh-v0.1.2-rc.1\ngit describe --tags                           # 期望 dsh-v0.1.2-rc.1\n\n# ③ 依赖对齐（rc.1 分支 lockfile，400+ 包，约几分钟；npm/pnpm 均可——\n#    DSH 仓库标准为 pnpm workspace）\npnpm install --frozen-lockfile\n\n# ④ 验证（不重启前先静态检查）\npnpm build                                    # 或 pnpm --filter @deepseek-ai/dsh build（按仓库惯例）\nnode --version                                # 期望 ≥22.13\n\n# ⑤ 重启 web 实例（旧 3080 进程收尾后启动）\n#    原启动命令不变：node --import tsx/esm apps/cli/src/bin.ts web\n```\n\n## 2. 升级后核对清单\n\n- [ ] web 页面可打开（master 内核 web 服务**带 token 认证**——从启动日志 `dsh web: http://127.0.0.1:\u003cport>/?token=…` 取带 token 的 URL；裸 URL 会 401）\n- [ ] 标题栏/关于信息显示 DSH 内核版本 = `0.1.2-rc.1`\n- [ ] 插件/工具/设置页功能抽查（rc.1 与 alpha.5 的 API 差异点：settings 三段式、client 模块表 `dsh-client-runtime` 退役等——见 SSiD 09-04 适配方案）\n- [ ] 长会话加载（alpha.4 时代实测卡死的回归点，rc.1 已修复，验证一次）\n\n## 3. 参考实现（SSiD 安装版 v0.2.0 对照点）\n\n| 项 | SSiD 侧做法 | 源码模式（DSHfork）注意 |\n|---|---|---|\n| 内核接法 | prepare-runtime 读 `DSH_CHECKOUT` checkout 的 `apps/cli/package.json`（单一来源） | 源码模式直接用 checkout 本身，无此步 |\n| 版本锁 | profile-template overrides 214 条全量 `0.1.2-rc.1`（防 npm 发布链版本漂移） | **不适用**（workspace 源码互相引用，无 npm 解析） |\n| 依赖范围缺陷 | 官方若干包 `dsh-* @ \">=0.1.2 \u003c0.2.0-0\"` 匹配不到 rc 预发布 → overrides 强制 | **不适用**（源码模式下 pnpm 走 workspace）——但**对外发布/安装出包**仍需 overrides 手法 |\n| 插件适配 | 自研 3 插件按 rc.1 settings 三段式 + 测试 L1 全绿 | DSHfork 不预装插件，无此工作；**rc.1 API 差异**见 SSiD 方案文档 |\n\n## 4. 风险与回滚\n\n- **回滚**：`git checkout master && pnpm install --frozen-lockfile` 后重启原命令即可（DSHfork 干净，无代码迁移）。\n- **注意**：升级后 DS 的会话数据/工作区配置不变（工作区根 `H:\\MaxNull\\WorkStation` 独立于 checkout）。\n- **web 认证**：rc.1 与 alpha.5 均带 token 认证——若历史脚本/书签使用裸 URL，需改用启动日志打印的带 token URL（SSiD smoke-ui 的 `--cdp` 模式即为此设计）。\n- **三环境纪律**：web(3080) = 当前会话主体——**升级窗口内不要启用本会话重启 DSH 的操作**；如果 3080 升级后需要重启，由用户在外部操作，本会话不主动调用。\n\n## 5. 依据与后续\n\n- 依据：官方 `dsh-v0.1.2-rc.1` release（a66e470204）+ SSiD v0.2.0 全链验证 + 09-04/09-05/09-06 决策文档。\n- 后续：升级完成后，web 与 SSiD 同内核（rc.1），后续插件/内核开发两边一致，观察站（dsh-observations）回归脚本按 rc.1 对齐。\n"},{"file":"2026-09-06-SSiD内核升级执行指南-rc.1通用范本.md","date":"2026-09-06","slug":"SSiD内核升级执行指南-rc.1通用范本","title":"SSiD 内核升级执行指南（rc.1 适配通用范本 · 2026-09-06）","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh-","@deepseek-ai/dsh","@deepseek-ai/dsh-mcp-client","@playwright/mcp","dsh-v0","dsh-ssid-panels","dsh-runtime","ssid-release","ssid-shell-setup","dsh-vx","ssid-shell","dsh-mcp-client"],"summary":"1. 定内核 tag：git tag 查官方最新（如 dsh-v0.1.2-rc.1）；git -C deepseek-harness checkout \u003ctag。 2. 前置检查：git status 干净、git log v上版本..HEAD 收集分组素材、安装目录归档备份。 3. dev profile 洁净：跑 npm start 前确认 profile 无半成品（.deploy./nod","bytes":7946,"lines":94,"body":"# SSiD 内核升级执行指南（rc.1 适配通用范本 · 2026-09-06）\n\n> 先例：v0.1.15 升级（2026-08-29 执行指南）、alpha.4 评估（2026-09-02 执行指南）。\n> 状态：已决策（推断 · 2026-09-12）\n\n> 本文把 v0.1.17(alpha.2) → v0.2.0(rc.1) 的完整适配过程固化为**可复制 SOP**：\n> 下次内核升级（alpha.5 / 0.1.3 / rc.2…）按步骤改版本号即可；坑表逐条可查。\n> 配套文档：`2026-09-04-SSiD内核升级-0.1.2-rc.1插件适配与测试体系方案.md`（前期方案）、\n> `2026-09-05-rc.1适配执行日志与复盘.md`（过程记录）。\n\n## 0. 决策与范围（先拍板再动手）\n\n| 决策点 | 本次判据（复用于后续） |\n|---|---|\n| 版本号 | 内核换版 = 里程碑 → **minor 起步**；内核 rc/正式版 + 插件语义版本发布时评估 **0.2.0 级进位**（本次 0.1.17→0.2.0） |\n| 未分发合并 | 上一版**无用户流量**（发布 \u003c24h/自测未装）→ **删除旧 release+tag、合并重打**（v0.1.10/0.1.11 先例）；不浪费新版本号 |\n| 平台策略 | mac = **单架构 arm64**（2020 后全 M 系）；双架构的 latest-mac.yml 互覆、增量更新缺架构条目——以后需要 Intel 再按「同 job 双 arch」设计重构 |\n| 上游留言 | 官方缺陷若本地已完全规避 → **不留言**（升级即规避，除非影响长尾生态） |\n\n## 1. 升级前准备\n\n1. **定内核 tag**：`git tag` 查官方最新（如 `dsh-v0.1.2-rc.1`）；`git -C deepseek-harness checkout \u003ctag>`。\n2. **前置检查**：`git status` 干净、`git log v上版本..HEAD` 收集分组素材、安装目录归档备份。\n3. **dev profile 洁净**：跑 `npm start` 前确认 profile 无半成品（`.deploy.*`/`node_modules.old*` 清理见坑表 K9）。\n\n## 2. 内核接法（单一来源 + 全量锁版）\n\n- **DSH_VERSION 单一来源** = `deepseek-harness/apps/cli/package.json`（prepare-runtime 自动读取；CI 用完整 clone 的同 tag）。\n- **overrides 全量切版**：`shell/profile-template/pnpm-workspace.yaml` **214 条 @deepseek-ai/dsh-\\* 全部换成新版本串**（**无混杂**——半切 = 闭包混版本必 boot 坏）。\n- **聚合包**：prepare-runtime `[3/5]` 注入 `@deepseek-ai/dsh@\u003cver>` + 32 个丢失 peer（精确 pin，无 `^`）。\n- **官方 rc 依赖范围缺陷规避**（K1）：官方子包依赖 `>=0.1.2 \u003c0.2.0-0` 匹配不到 rc 预发布 → 靠 overrides 强制 + 插件 peer 侧精确 pin。\n\n## 3. 插件适配\n\n- **第三方升级规则**：升到 npm 最新；本地超前以本地为准；大跳版先核实 author/peer 再 install。\n- **自研插件**（@max-null/*）：**L1 = typecheck + test 全绿**才能发；适配 rc.1 变化点优先看官方 settings 三段式（host `installSection` + client `settingsScope.bind` + `settings.plugin.item` keyed 卡片）。\n- **双处声明**：profile-template/package.json pin（新 minor 必须显式改）+（vendor 化插件的）vendor/package.json 版本号。\n- **vendor 三处同步**：plugins 源构建产物 → profile-template/vendor → dev profile vendor；`git diff --no-index` / MD5 双核对。\n- **发布**：npm publish 用户手动（F2A）；**发布必须在归档重建前**（archives 按 pin 解析）。\n\n## 4. 归档构建\n\n```powershell\ncd shell\nnode scripts/prepare-runtime.mjs   # 3-5 分钟；完成前不得动 ssid profile 的 pnpm\n```\n- **运行约束**：官方源（不设 SSID_REGISTRY）；归档约 147 MB（本版）；`.runtime-version = \u003cssidVer>-\u003cdshVer>-\u003c指纹>`。\n- **验证指纹**：`0.2.0-0.1.2-rc.1-86e1fb66` 形态（ssidVer 与 shell/package.json 一致、dshVer 与 checkout 一致）。\n\n## 5. 验证链（发版门槛，按序全过）\n\n1. **守卫单测**：`node --test shell/updater-core.test.mjs`（7）+ `node --import tsx/esm --test plugins/dsh-ssid-panels/tests/release-notes.test.ts`（3）。\n2. **归档抽查 8 项**（解包 dsh-runtime/ 后）：`.runtime-version` 前缀 / dream-skin 版本+lib / plugin-center pin / better-sidebar pin / capture lib==vendor 源 / dependencies 新 pin / vendor 三包版本 / release-notes 首行 `# vX.Y.Z`。\n3. **打包版自检**（isPackaged 分支必须实测——v0.1.14 教训）：win-unpacked 启动 → 日志 `deploy → bootKernel ok` → 骨架断言。\n4. **smoke-ui**：`node .agents/skills/ssid-release/smoke-ui.cjs --cdp \u003cport>`（打包版用 `--remote-debugging-port=9334` + CDP 模式；裸 URL 撞认证页）。\n5. **mac CI**：push tag 自动触发 build-mac（单 arm64 job）→ 成功后核对 Release 资产与 latest-mac.yml url 一致。\n\n## 6. 交付（GitHub 五件事）\n\n1. commit → push main → `git tag vX.Y.Z` → push tag（触发 mac CI）。\n2. `gh release create`（--notes-file）+ 资产上传。\n3. **资产命名**（K5）：electron-builder 产物中文名 → **英文名副本**上传（`ssid-shell-setup-\u003cver>.exe`），必须与 latest.yml/latest-mac.yml 的 url 完全一致。\n4. **大文件上传**（K8）：gh CLI 传 256MB+ 会挂 → `curl --proxy http://127.0.0.1:7897 -F \"file=@...\"`（uploads API + 数字 release id）；慢但要完成。\n5. 核对 `gh api releases/tags/vX.Y.Z` 资产清单、清理旧名残留（`gh api -X DELETE .../assets/\u003cid>`）。\n\n## 7. 坑表（本次全部，按触发频率排序）\n\n| # | 坑 | 症状 | 处理 |\n|---|---|---|---|\n| K1 | 官方 rc 依赖范围缺陷 | 干净安装 NO_MATCHING | overrides 强制 + 插件 peer 精确 pin |\n| K2 | DSH 版本漂移（CI sparse clone 默认分支） | 归档注入 `0.1.3-alpha.1` | clone 钉 `--branch dsh-vX.Y.Z` |\n| K3 | pnpm shim（CI `.bin/pnpm` 是 shell） | `SyntaxError` | prepare-runtime 只收 `.cjs` 入口 + bundled pnpm 兜底 |\n| K4 | esbuild 幽灵依赖 | mac `esbuild: command not found` 127 | bundle-kernel 的 esbuild 显式 devDep |\n| K5 | GH 中文资产名剥离 | 资产名缺中文、与 yml url 不一致 | artifactName 全英文（`ssid-shell-${version}-${arch}.*`） |\n| K6 | afterPack 钩子文件换行丢失 | `handler is not a function` | 提取仓库文件一律 node execSync 按字节（禁用 Out-File -NoNewline） |\n| K7 | mac 双 job 的 latest-mac.yml 互覆 | 增量更新缺架构条目 | 单 arch（arm64）；需 Intel 时重构同 job 双 arch |\n| K8 | gh 上传大文件挂死/404 | 256MB 上传无进展 | curl 直传（显式代理）+ 数字 release id |\n| K9 | deploy EPERM `.deploy.old` | 打包版首装失败 | 清 profile 运行时残骸（node_modules/old/old2/.upgrade-backup）走首装路径 |\n| K10 | vendor 根有非目录条目 | mac ENOTDIR | 清 vendor node_modules 前 `isDirectory()` 过滤 |\n| K11 | 插件中心重复提示 | 同插件更新提示两次 | plugin-center checkUpdates 按包名去重（0.2.18） |\n| K12 | 归档后插件的「过期感」 | 用户疑「归档为何不最新」 | **归档 = 发版时刻 pin 快照**；作者新发布走插件中心一键更新；模板 pin 同步下次发版自然带 |\n\n## 8. 回滚\n\n- **未分发**：`gh release delete \u003ctag> --yes` + 删远端 tag（`git push origin :refs/tags/\u003ctag>`）+ 本地 `git tag -d`；force tag 新 commit 重触发 CI。\n- **已分发**：发补丁版本（合并重打原则：无用户流量才算未分发；有流量走新版本号）。\n- **运行时**：版本指纹不一致 → 下次启动自动重部署；profile 坏 = 清残留走首装（K9）。\n\n## 9. 固化的通用约定（本次拍板，后续遵循）\n\n- 插件生态更新**不进 SSiD 版本**——插件中心一键更新 + 模板 pin 同步（下次发版归档自然最新）。\n- MCP 管理列表 = mcp-client loader 条目（cordis.patch.yml `name: '@deepseek-ai/dsh-mcp-client'` 行）；模板预置 playwright（`@playwright/mcp@0.0.80`），纯净 profile 空列表是设计而非缺陷。\n- dev 裸跑隔离：dev 跳过归档部署、就绪信号 = 内核实体（`@deepseek-ai/dsh`）——清预设不再触发回灌死循环。\n"},{"file":"2026-09-06-web升级-rc.1执行记录.md","date":"2026-09-06","slug":"web升级-rc.1执行记录","title":"DSH web(3080) 升级 0.1.2-rc.1 执行记录（2026-09-06）","statusRaw":"已完成（推断 · 2026-09-12）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@changfenhuang/dsh-genui","@max-null/dsh-chat-rail","@max-null/dsh-draft-polish","@max-null/dsh-plugin-center","@deepseek-ai/dsh-telemetry","dsh-web","dsh-v0","dsh-capture","dsh-quick-toolbar","dsh-ssid-panels","dsh-genui","dsh-chat-rail"],"summary":"关键结论： 1. web 服务端进程仍跑 alpha.1（比参考文档猜的 alpha.5 更旧），前端 dist 已是 rc.1（混合态）。 2. 内核侧升级只差重启 web 进程（checkout 源码与 dist 均已就绪，无需重新构建）。 3. DSHfork 观察站不动（非运行宿主；如需 web 独立观测库另议，见待办）。","bytes":5378,"lines":68,"body":"# DSH web(3080) 升级 0.1.2-rc.1 执行记录（2026-09-06）\n\n> 会话：SSiD 会话（三环境流转：升级 web 用 SSiD 操作）——与参考文档《2026-09-06-DSH-web内核升级-rc.1参考文档.md》配套。\n\n> 状态：已完成（推断 · 2026-09-12）\n\n## 0. 现状澄清（实测，修正参考文档 §0）\n\n| 项 | 参考文档（09-06 早） | 实测（本会话） |\n|---|---|---|\n| web 宿主仓库 | DSHfork（master @49a606bc，alpha.5 时代） | **deepseek-harness**（页面 assets hash 与 `apps/web/dist` 完全一致：`index-Df-65__b.js` 等四文件）；DSHfork 无 node_modules、无 apps/web/dist，**不可能承载运行实例** |\n| web 进程 | PID 65604 | PID 65604（一致）命令行 `node --import tsx/esm apps/cli/src/bin.ts web`，启动 **2026-09-04 23:29:45** |\n| 进程加载的源码 | alpha.5 | **dsh-v0.1.2-alpha.1**（reflog：09-04 23:27 切到 `cd5ef81481`=dsh-v0.1.2-alpha.1，23:29 启动） |\n| checkout 现状 | — | HEAD=**dsh-v0.1.2-rc.1**（09-05 02:32 切换）；`apps/web/dist` **09-05 02:38 全量构建**（rc.1 产物，页面加载正常） |\n\n**关键结论**：\n1. **web 服务端进程仍跑 alpha.1**（比参考文档猜的 alpha.5 更旧），**前端 dist 已是 rc.1**（混合态）。\n2. 内核侧升级**只差重启 web 进程**（checkout 源码与 dist 均已就绪，无需重新构建）。\n3. DSHfork 观察站不动（非运行宿主；如需 web 独立观测库另议，见待办）。\n\n## 1. 已执行（插件升级，文件侧）\n\n### 1.1 vendor 同步（web profile）\n- `~/.dsh/profiles/web/vendor/dsh-capture`：0.2.1 → **0.3.0**（源：ssid vendor，robocopy /MIR）\n- `~/.dsh/profiles/web/vendor/dsh-quick-toolbar`：0.8.5 → **0.8.6**
