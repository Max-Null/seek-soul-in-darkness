-node-appearance@0.1.1` 发布 npm（2026-08-18 21:49，0.1.0 发布于同日 21:26）。\n上轮备注中的\"发布 npm 即切 registry\"路径落地。\n\n**改动**：\n\n| 文件 | 改动 |\n|---|---|\n| `shell/profile-template/package.json` | dependencies：`file:./vendor/dsh-node-appearance` → `^0.1.1`（bundles 不变） |\n| `shell/profile-template/vendor/dsh-node-appearance/` | **删除**（不再需要 vendor 分发） |\n| `shell/profile-template/pnpm-workspace.yaml` | minimumReleaseAgeExclude 加 `@max-null/dsh-node-appearance@0.1.1`（发布 \u003c7 天豁免） |\n| dev profile（`~/.dsh/profiles/ssid`） | 用户已先行切换（deps `^0.1.1` + exclude 0.1.0/0.1.1 + install 完成）；本次清理孤儿 vendor 目录 |\n\n**验证**：\n- npm 0.1.1（node_modules 实装）与工作区源码构建 **MD5 全等**（index.js/client.js）——npm 包即最新源码\n- 模板 JSON/YAML 语法通过；dev profile 已装 0.1.1，lockfile 为 registry 形式\n- 0.1.1 测试 20/20 通过（vitest）\n- **发布路径**：prepare-runtime 重新打包时从 registry 安装 0.1.1，不再依赖 vendor 目录\n\n**影响**：node-appearance 从 vendor 分发转为 registry 分发（与 memory/chinese-thinking/guardian/habit/chat-rail 同模式）；\nvendor 同步约定中该插件的条目不再适用（见约定文档更新）。\n"},{"file":"2026-08-19-DSH上游回复-3198确认新机制10.md","date":"2026-08-19","slug":"DSH上游回复-3198确认新机制10","title":"DSH 上游回复：Discussion #3198 被确认为新机制 #10（2026-08-19）","statusRaw":"✅ 上游已确认（argszero 回复，2026-08-18T19:11:17Z）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["dsh-doctor","dsh-chat-rail","dsh-scan","#3198","#10","#2167"],"summary":"2026-08-19 提交的 DSH 上游反馈帖 [3198「Session log unreadable after resume across session/end-seed」] (https://github.com/deepseek-ai/deepseek-harness/discussions/3198)， argszero（deepseek-ai 核心成员）回复确认。","bytes":2649,"lines":49,"body":"# DSH 上游回复：Discussion #3198 被确认为新机制 #10（2026-08-19）\n\n日期：2026-08-19\n状态：✅ 上游已确认（argszero 回复，2026-08-18T19:11:17Z）\n\n## 背景\n\n2026-08-19 提交的 DSH 上游反馈帖\n[#3198「Session log unreadable after resume across session/end-seed」]\n(https://github.com/deepseek-ai/deepseek-harness/discussions/3198)，\nargszero（deepseek-ai 核心成员）回复确认。\n\n## 回复要点（argszero）\n\n1. **确认为 session-corruption 家族第 12 份报告、新机制 #10**\n   （\"resume seed shorter than the persisted tail\"）。单实例可复现的\n   部分最有价值——一举排除跨进程竞态（#1333/#1452）与 stale 缓存路径\n   （#2839），锁定为纯种子构造算术 bug。\n2. **源码分歧点精确确认**（packages/core/session/src/index.ts）：\n   - `:539` `firstLiveSeq = this.log.length` 在 end-seed 逻辑**之前**捕获；\n   - `:545` 追加 `session/end-seed`（注释称仅内存）；\n   - `:629` 每次 live append 用 `seq = this.log.length`。\n   - 分歧出现在**持久化文件尾部超出构造种子**时：新 session 种子停在\n     207485（firstLiveSeq=207486），首个 live append（seq 207486）与持久化\n     尾部重叠 → 严格扫描器（format.ts:364-371）拒绝合并文件。\n3. **修复方向（按杠杆排序）**：\n   - (a) end-seed append **之后**再捕获 `firstLiveSeq`（最小本地修复，\n     只治愈新写入）；\n   - (b) **resume 种子 = 完整持久化尾部**（根修复，家族方向 #2167/#2839）；\n   - (c) 扫描侧在 `session/end-seed` 边界**分区域校验**（持久兜底，\n     不重写即可治愈现有文件）；\n   - (d) dsh-doctor 离线检测 end-seed 后 seq 重启（截断到 end-seed 是安全恢复）。\n4. **评价**：带解码证据 + 确定性复现，是 \"one-PR-sized fix\"——\n   (a)+(b) 一起，或 (a)+(c)（含治愈路径）。\"Good find.\"\n\n## 跟进事项（待用户拍板）\n\n- 上游明示修复空间为一个 PR 大小：可协助实现 (a)+(b) 或 (a)+(c)\n  （deepseek-harness 源码在 H:\\MaxNull\\WorkStation\\deepseek-harness）。\n- 或先在 #3198 回复确认理解 + 提供补充测试用例（已有两个真实日志样例）。\n- 现有用户恢复路径不变：fork 副本（内存连续种子）最稳；旧日志可等\n  (c) 落地后自动可读，或手动平移 seq（tools: fix-seq.ts）。\n\n## 相关文件\n\n- 帖子正文备份：H:\\MaxNull\\WorkStation\\dsh-chat-rail\\tests\\issue-body.md\n- 分析工具：dsh-chat-rail/tests/（seq-gap2/3/5/6.ts、fix-seq.ts、\n  to-zstd.ts、verify-zstd-full.ts、verify-dsh-scan.ts）\n"},{"file":"2026-08-19-DSH修复PR-3198方案落盘.md","date":"2026-08-19","slug":"DSH修复PR-3198方案落盘","title":"DSH 上游修复：实现 #3198 修复（方案 a+c，讨论区交付）","statusRaw":"✅ 已完成（修复实现 + 测试全绿 + 交付到 #3198 讨论区）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["#3198","#10"],"summary":"argszero 确认 3198 为 session 损坏家族新机制 10「resume seed shorter than the persisted tail」，源码分歧点： - packages/core/session/src/index.ts:539 firstLiveSeq = this.log.length 在 end-seed 逻辑（:545）之前捕获； - :545 种子末事件非","bytes":3335,"lines":61,"body":"# DSH 上游修复：实现 #3198 修复（方案 a+c，讨论区交付）\n\n日期：2026-08-19\n状态：✅ 已完成（修复实现 + 测试全绿 + 交付到 #3198 讨论区）\n\n## 背景\n\nargszero 确认 #3198 为 session 损坏家族新机制 #10「resume seed shorter than\nthe persisted tail」，源码分歧点：\n\n- `packages/core/session/src/index.ts:539` `firstLiveSeq = this.log.length`\n  在 end-seed 逻辑（:545）**之前**捕获；\n- `:545` 种子末事件非 end-seed 时追加 `session/end-seed`；\n- `:629` 每次 live append 用 `seq = this.log.length`——与持久化尾部重叠。\n\n上游建议：one-PR 规模，(a)+(b) 一起（根修复），或 (a)+(c)（含治愈路径）。\n\n## 方案选择（实际落地：a + c）\n\n- **(a) 已实现**（core/session/index.ts）：`firstLiveSeq` 在 end-seed append\n  **之后**捕获——现在恒为「构造后第一个 live append 的 seq」，end-seed\n  标记恒位于 `firstLiveSeq - 1`。连带修正：\n  - session-persistence coordinator `attachPrepared`：删除\n    `firstLiveSeq !== cursor` 校验（该字段不再编码 seed 长度；\n    `state.cursor === inspection.events.length` 仍是绑定校验）；\n  - session-telemetry：adoption 起点移到 end-seed 之后（end-seed 是构造\n    事件、从不发布，不再被回放导出；chunk 投影不受影响）。\n- **(b) 未实现（评估结论）**：coordinator 的 `prepareCore` 已经用完整\n  stored events + 合成 closers 作种子，短种子视图的源头在别处\n  （stale view / HMR 式 adoption），属后续跟进，已在讨论区说明。\n- **(c) 已实现**（session-persistence-jsonl/format.ts）：扫描器把\n  `session/end-seed` 视为区域边界——紧随标记的 seq 断裂以断裂事件为\n  区域原点重起，**区域内严格连续**；非 end-seed 边界的断裂仍整体拒绝。\n  存量重叠日志**不重写即可治愈**（expectedSeq 独立于 events.length 计数，\n  治愈后 seq 重叠是合法形态）。\n\n## 验证结果（全绿）\n\n1. vitest：**1205/1205 通过**（core/session、session-persistence、\n   session-persistence-jsonl、session-telemetry、agent-loop、\n   subagent-in-process-driver 46 个文件），新增 3 个 (c) 测试\n   （治愈形态 / 治愈段内断裂仍拒 / 种子段断裂仍拒）。\n2. `tsc -b tsconfig.host.json` 干净；oxlint 改动文件 0 warning 0 error。\n\n## 交付方式（重要调整）\n\n- **上游暂不接受外部 PR**：CONTRIBUTING.md 明确「cannot accept external\n  pull requests at the moment」，pulls API 404（仓库禁用 issues/PR 基础设施）。\n  原「提交 PR」目标不可行，改为讨论区交付：\n  - fork 分支 `Max-Null/deepseek-harness:fix-3198-resume-seq-gap`\n    （commit `bca7700f1d`，基于 rc.7 master）已推送，上游可直接取用；\n  - #3198 讨论区已发两条评论（修复说明 + 验证 + (b) 评估；\n    patch gist：https://gist.github.com/Max-Null/16257bc912307dc15fb06e0d149305a4）；\n  - 评论链接：#discussioncomment-18072466 / #discussioncomment-18072467。\n\n## 关联\n\n- 上游讨论：#3198（argszero 确认 + 修复方向 (a)-(d)）\n- 本仓库决策记录：2026-08-19-DSH上游回复-3198确认新机制10.md\n- DSH checkout：H:\\MaxNull\\WorkStation\\deepseek-harness（分支 fix-3198-resume-seq-gap）\n"},{"file":"2026-08-19-plugin-center-0.1.7本机重建.md","date":"2026-08-19","slug":"plugin-center-0.1.7本机重建","title":"plugin-center 0.1.7 本机重建：决策记录","statusRaw":"实施完成，待 npm publish（代码已构建 + 双验证全过 + 已提交 619a6e1）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["@max-null/dsh-plugin-center","dsh-plugin-center","dsh-header-unify"],"summary":"v0.1.6 发布链待办 1 需要 @max-null/dsh-plugin-center@0.1.7（SSiD profile-template 声明 ^0.1.6，归档重建需 npm 上存在）。 0.1.6/0.1.7 代码原开发于另一台电脑（不在手边，无法取得源码）： - npm 最新仅 0.1.5；GitHub 远程仅 main=ebc3c0d（0.1.5）；本机仓库 H:\\MaxNull","bytes":4298,"lines":65,"body":"# plugin-center 0.1.7 本机重建：决策记录\n\n> 日期：2026-08-19\n> 状态：**实施完成，待 npm publish**（代码已构建 + 双验证全过 + 已提交 619a6e1）\n> 关联：`docs/决策/2026-08-19-v0.1.6发布执行-环境核查与阻塞.md`、`docs/决策/2026-08-17-header按钮统一-调查与方案.md`\n\n---\n\n## 一、背景\n\nv0.1.6 发布链待办 1 需要 `@max-null/dsh-plugin-center@0.1.7`（SSiD profile-template 声明 `^0.1.6`，归档重建需 npm 上存在）。\n\n0.1.6/0.1.7 代码原开发于**另一台电脑**（不在手边，无法取得源码）：\n- npm 最新仅 0.1.5；GitHub 远程仅 main=`ebc3c0d`（0.1.5）；本机仓库 `H:\\MaxNull\\WorkStation\\dsh-plugin-center` 也是 0.1.5；安装版归档、profile 均 0.1.5——**五处一致，0.1.7 代码唯一存在于另一台电脑**。\n\n## 二、决策（用户拍板）\n\n**本机基于 0.1.5 源码重建 0.1.7 等价实现**。用户确认改动很小且记得全部内容：\n> \"就是把插件中心的按钮和磁侧边栏的按钮都移到标题栏了，正如 ssid 的代码展示的那样，没做别的\"\n\n即 0.1.7 的**功能契约**已由 SSiD 侧 `plugins/dsh-header-unify/lib/client.js` 和决策文档完整定义，本机实现只需满足该契约。\n\n## 三、功能契约（来自 dsh-header-unify client.js + SSiD 决策文档）\n\n| API | 行为 | 消费方 |\n|---|---|---|\n| `window.__pluginCenterOpen` | 打开插件中心 overlay（0.1.6 已有） | dsh-header-unify 老版回退 |\n| `window.__pluginCenterToggle` | 开则关、关则开（0.1.7 新增） | dsh-header-unify 优先调用 |\n| `window.__pluginCenterClose` | 关闭 overlay（0.1.7 新增） | dsh-header-unify 开侧栏/底栏前互斥调用 |\n| 点遮罩关闭 | overlay 面板外点击遮罩即关闭（0.1.7 新增） | 用户交互 |\n\n## 四、本机 0.1.5 现状（读源码确认）\n\n`client/index.tsx`：\n- `openOverlay()` / `closeOverlay()` 已存在（模块级 `overlayOpen` + `overlayListeners` 通知，138-139 行）\n- `HeaderButton`（690 行）onClick 只 open，无 toggle\n- `OverlayPanel`（702 行）`.pc-overlay` 遮罩**无** onClick 关闭\n- `apply()`（794 行）未暴露任何 window API\n- 构建：`npm run build` = tsc（src→dist）+ esbuild（client/index.tsx→client.js）\n\n## 五、改动清单（本机重建）\n\n1. ✅ `client/index.tsx`：\n   - 新增 `toggleOverlay()`（`overlayOpen ? closeOverlay() : openOverlay()`）\n   - `apply()` 内暴露 `window.__pluginCenterOpen/Toggle/Close`，含页面卸载清理（unload 时 delete，防泄漏/重复挂载）+ 重复 apply 守卫\n   - `OverlayPanel`：`.pc-overlay` 加 `onClick={closeOverlay}`；`.pc-panel` 加 `onClick={e => e.stopPropagation()}`（面板内点击不触发关闭）\n2. ✅ `package.json`：version 0.1.5 → 0.1.7\n3. ✅ 构建：`npm run build`（tsc 通过 + client.js 45.6kb）\n4. ✅ 验证：\n   - `verify-globals.cjs`（新建）：**14 项全过**——API 暴露/可调用/unload 清理/重复守卫/遮罩关闭静态断言\n   - SSiD 仓库 `plugins/dsh-header-unify/verify-header-unify.cjs`：**17 项全过**（消费方契约）\n5. ✅ git 提交：`619a6e1`（client/index.tsx + package.json + verify-globals.cjs）\n6. ⏳ 发布：用户本机 npm login（.npmrc token 已失效 401）→ `npm publish` → 确认 `npm view` 0.1.7\n7. ⏳ 发布后继续发布链：清 pnpm metadata 缓存 → prepare-runtime（DSH_NODE/PNPM_CMD 已确认）→ 归档 boot 冒烟 → pack → 自测 → Release → 收尾\n8. ⏳ 网络窗口补 push：`619a6e1` + tag `v0.1.7`（本机仓库 origin）\n\n## 六、风险与注意\n\n| 项 | 说明 |\n|---|---|\n| 与另一台电脑实现的差异 | 无法比对源码；功能契约一致即可（契约由 SSiD 侧定义），实现细节差异无影响 |\n| 版本号一致性 | 本机重建后发布的 0.1.7 与另一台电脑未发布的 0.1.7 是同版本号不同实现——但另一台电脑版本从未发布，npm 上无冲突；用户后续拿到另一台电脑代码时如再发布需注意（可升 0.1.8 或直接以本机为准） |\n| verify-header-unify.cjs | 该脚本是模拟环境（假 window），验证 dsh-header-unify 逻辑；plugin-center 侧需独立模拟脚本验证 |\n| npm 凭据 | 用户手动 login；token 401 是用户侧问题 |\n"},{"file":"2026-08-19-SSiD预设技能包-落地方案.md","date":"2026-08-19","slug":"SSiD预设技能包-落地方案","title":"SSiD 预设技能包 —— 落地方案","statusRaw":"已定案（本期实施）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["@max-null/dsh-skill-mcp-center","ssid-skills","dsh-runtime","dsh-skill-filesystem","ssid-double-star","dsh-skill-mcp-center","#7"],"summary":"思灵（SSiD）安装后开箱即用：出厂自带 14 个技能（8 mxy + 6 omo）， 无需用户手动安装。现状是仓库根 skills/ 有技能源码，但安装包 （profile-template → dsh-runtime.tar.gz）不含任何技能——新用户装完 思灵，~/.dsh/skills 为空，一个技能都没有。MCP 预设本期不做（另议）。","bytes":4702,"lines":80,"body":"# SSiD 预设技能包 —— 落地方案\n\n> 日期：2026-08-19\n> 状态：已定案（本期实施）\n> 关联：[SSiD-插件清单](../设计/SSiD-插件清单.md) #7「14 技能包 ssid-skills（M3）」\n\n---\n\n## 一、需求\n\n思灵（SSiD）安装后**开箱即用**：出厂自带 14 个技能（8 mxy + 6 omo），\n无需用户手动安装。现状是仓库根 `skills/` 有技能源码，但安装包\n（profile-template → dsh-runtime.tar.gz）**不含任何技能**——新用户装完\n思灵，`~/.dsh/skills` 为空，一个技能都没有。MCP 预设本期不做（另议）。\n\n## 二、机制调研（DSH 侧）\n\n1. **技能发现**（`dsh-skill-filesystem`，standard / ssid-double-star preset\n   里的 `skill-filesystem` 行，`includeDefaultRoots` 默认 true）按 rank 扫描：\n   - 项目根（最近含 `.git` 的祖先）：`.dsh/skills`（100）、`.agents/skills`（200）\n   - `$DSH_HOME/skills`（400，user-dsh，跳过 `.system`）、`~/.agents/skills`（500）\n   - `$DSH_BUNDLED_SKILL_DIR`（bundled 只读层，trustedHost）\n   - 技能格式：目录包 `\u003cname>/SKILL.md` 或扁平 `\u003cname>.md`，需 YAML frontmatter\n     （name kebab-case + description）。\n2. **skill-mcp-center UI**（`@max-null/dsh-skill-mcp-center`，已预制）扫描\n   `~/.dsh/skills`、`~/.agents/skills`、会话 cwd 的 `.dsh/skills`/`.agents/skills`\n   ——**bundled 层不可见、不可 toggle**。出厂技能要能在设置里管理，必须落在\n   用户/工作区层。\n3. **SSiD 部署链路**：`shell/profile-template/`（package.json + cordis.patch.yml\n   + vendor/）→ `prepare-runtime.mjs` → `dsh-runtime.tar.gz` → 用户首启\n   `main.mjs deployRuntime` 解压到 `~/.dsh/profiles/ssid/`（归档顶层 = profile\n   根内容）→ `kernel.ts bootKernel` boot（DSH_HOME = `~/.dsh`）。\n\n## 三、方案决策\n\n**出厂技能 = 归档携带（profileDir/skills）+ 启动时非覆盖合并到用户层（`~/.dsh/skills`）。**\n\n对比过的替代方案与否决理由：\n\n| 方案 | 结论 | 理由 |\n|---|---|---|\n| 只挂 bundled 层（`DSH_BUNDLED_SKILL_DIR` 指向 profileDir/skills） | ❌ | skill-mcp-center UI 扫不到 bundled 层：出厂技能在设置里不可见、不可关；且引入新的环境变量依赖 |\n| bundled + 用户层双挂 | ❌ | 同名技能两个来源，bundled rank 优先会 shadow 用户层修改（toggle 无效） |\n| **用户层非覆盖复制（本期方案）** | ✅ | ①skill-mcp-center 完全可见可管理；②fractal 传统一致（「首次启动初始化，合并非覆盖」）；③用户增删改永远优先，升级补新技能不覆盖用户修改；④不改 DSH 任何机制 |\n\n同步策略（幂等，每次启动执行）：\n\n- 源：`\u003cprofileDir>/skills/`（随归档部署，只读出厂副本）\n- 目标：`$DSH_HOME/skills/`\n- 规则：遍历源下**目录条目**（技能包）；目标不存在同名条目 → 复制；存在 → 跳过。\n  根级 `.md`（如 README）不复制（会被扁平技能解析器误扫）。`skipped` 目录跳过。\n- 失败不阻塞 boot（try/catch + 日志）。\n\n## 四、实施清单\n\n| # | 改动 | 文件 |\n|---|---|---|\n| 1 | 14 个技能目录副本（仓库根 `skills/` 整目录复制，**不含** README.md） | `shell/profile-template/skills/`（新增） |\n| 2 | 同步函数 `syncPresetSkills(sourceDir, targetDir)` + bootKernel 调用 | `shell/kernel.ts` |\n| 3 | pnpm 兜底安装分支复制 skills 到 profileDir | `shell/main.mjs` |\n| 4 | 归档指纹纳入 `skills/`（技能内容变化触发重部署） | `shell/scripts/prepare-runtime.mjs` |\n| 5 | 注明部署副本同步关系（改技能后需同步到 profile-template/skills） | `skills/README.md` |\n\n## 五、验证\n\n1. `npm run typecheck`（shell）—— kernel.ts 改动编译通过\n2. 同步逻辑模拟：源 = 仓库根 `skills/`、目标 = 临时目录，跑两遍（第二遍全跳过 =\n   幂等）；预置同名文件验证「存在即跳过」；验证根级 .md 不被复制\n3. 目录一致性：profile-template/skills 与仓库根 skills 技能条目一一对应\n4. 归档指纹：prepare-runtime.mjs 改动仅影响构建产物，typecheck 覆盖不到，\n   靠代码审查 + 下次构建验证\n\n## 六、边界与后续\n\n- 本期**不做** MCP 预设（双星 persona 引用的 GitHub MCP / Playwright MCP 另立\n  方案，涉及 token 与内置 node 执行路径，需单独设计）\n- 出厂技能若被用户删除，升级**不**补回（非覆盖语义，符合「用户资产」定位）\n- 技能内容更新：改仓库根 `skills/` → 同步到 `profile-template/skills/` → 重建\n  归档（指纹变化自动触发用户升级部署）\n"},{"file":"2026-08-19-v0.1.5发布收尾-归档损坏与恢复.md","date":"2026-08-19","slug":"v0.1.5发布收尾-归档损坏与恢复","title":"v0.1.5 发布收尾：归档损坏恢复 + 误解压事故","statusRaw":"✅ 发布完成","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["@max-null/dsh-chat-rail","@max-null/dsh-memory","dsh-runtime","dsh-profile-ssid","dsh-chat-rail","dsh-node-appearance","dsh-better-sidebar","dsh-memory"],"summary":"- Release v0.1.5「预设技能包 + 预设插件更新」 已发布（Latest）， https://github.com/Max-Null/seek-soul-in-darkness/releases/tag/v0.1.5 - 资产 Setup.0.1.5.exe（265,622,437 字节 ≈ 253 MB），URL HTTP 200。 - tag v0.1.5 指向 ebddc84，","bytes":3395,"lines":58,"body":"# v0.1.5 发布收尾：归档损坏恢复 + 误解压事故\n\n日期：2026-08-19\n状态：✅ 发布完成\n\n## 发布结果\n\n- Release **v0.1.5「预设技能包 + 预设插件更新」** 已发布（Latest），\n  https://github.com/Max-Null/seek-soul-in-darkness/releases/tag/v0.1.5\n- 资产 `Setup.0.1.5.exe`（265,622,437 字节 ≈ 253 MB），URL HTTP 200。\n- tag `v0.1.5` 指向 `ebddc84`，与 origin/main 一致；本地已 fetch 对齐。\n- v0.1.4 Draft（历史遗留，无资产）已删除——v0.1.4 内容并入 v0.1.5，\n  Releases 页不再有草稿。\n- 发布前验证环全绿：typecheck ✅ → prepare-runtime 重建归档（163.3 MB，\n  指纹 `0.1.5-0.1.0-rc.7-80503a8a`）→ 归档完整性 tar 全量 75104 项 ✅ →\n  闭包 boot 冒烟（boot-bundled.mjs，临时 DSH_HOME，HTTP 200）✅ → pack ✅。\n\n## 事故 1：dsh-runtime.tar.gz 损坏（截断）\n\n- 现象：上次会话生成的归档（125.5 MB）tar -tzf 报\n  `Truncated input file (needed 20992 bytes, only 0 available)`，列表只到\n  node_modules 中段（56142 项），`dsh-runtime/` 源目录残留未删。\n- 根因：6:08 那次 prepare-runtime 在 tar 压缩阶段中断（源目录未删是\n  脚本异常退出的标志；脚本正常路径是 [7/7] 删源目录）。\n- 处置：重跑 prepare-runtime（DSH_NODE 指向 PATH 的 node v26.2.0，\n  PNPM_CMD 指向全局 pnpm 11.21.0），完整归档 163.3 MB / 75104 项，重建成功。\n- 教训：**发布前必须 tar -tzf 全量校验归档完整性**——只看文件大小/时间戳\n  会漏掉截断归档，损坏归档会打进安装包（extraResources 原样携带）。\n\n## 事故 2：tar 解压误落 shell 根目录（package.json 被覆盖）\n\n- 现象：冒烟前执行 `tar -xzf dsh-runtime.tar.gz`（在 shell/ 下，无 -C），\n  归档条目是 `./xxx` 前缀 → 全部解压散落到 shell/ 根目录：node_modules\n  （760 MB 混入）、skills/、vendor/、pnpm-lock.yaml、.npmrc、\n  cordis.patch.yml、pnpm-workspace.yaml、.runtime-version——并且\n  **shell/package.json 被归档里的 profile package.json 覆盖**\n  （name 变 dsh-profile-ssid、version/scripts 丢失）。\n- 处置：\n  1. `git show HEAD:shell/package.json` 恢复原文件，再改回 version 0.1.5\n     （注意：PowerShell `ConvertTo-Json` 重写会打乱格式产生 70 行假 diff，\n     必须用文本级替换只改 version 一行）。\n  2. 删除 shell/ 根目录的污染文件（.npmrc/.runtime-version/cordis.patch.yml/\n     pnpm-lock.yaml/pnpm-workspace.yaml/skills/vendor）。\n  3. `npm ci` 干净重装 shell 依赖（混入的 1041 个归档包清除）；\n     electron 二进制 postinstall 未跑，手动 `node node_modules/electron/install.js`\n     补装。\n- 教训：**归档解压必须 `tar -xzf dsh-runtime.tar.gz -C dsh-runtime`**\n  （先建目录），绝不能在工作区根目录直接解压。boot-bundled.mjs 的\n  RUNTIME_DIR 就是 shell/dsh-runtime，冒烟前解压目标必须是它。\n\n## 决策备查\n\n- v0.1.4 内容（安装卡死修复、步骤可视化、plugin-center 预制、圆角、\n  伪 3D）全部并入 v0.1.5 发布，不再单独发 v0.1.4。\n- npm 依赖解析确认：@max-null/dsh-chat-rail@0.1.0、dsh-node-appearance@0.1.1、\n  dsh-better-sidebar@0.13.1、@max-null/dsh-memory@0.2.2 均已在 registry 就绪，\n  minimumReleaseAgeExclude 已同步。\n"},{"file":"2026-08-19-v0.1.6发布待办-标题栏按钮组.md","date":"2026-08-19","slug":"v0.1.6发布待办-标题栏按钮组","title":"v0.1.6 发布待办：标题栏统一按钮组 + 插件中心优化","statusRaw":"已完成（2026-08-20：归档重建 + 打包 + Release v0.1.6 已发布；另顺带更新 skill-mcp-center 0.2.0 进归档）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["@max-null/dsh-header-unify","@max-null/dsh-plugin-center","dsh-skill-mcp-center","dsh-header-unify","ssid-shell","dsh-plugin-center","dsh-runtime"],"summary":"验证：plugins/dsh-header-unify/verify-header-unify.cjs 17 项断言全过；安装版实机验证 4 项（标题栏/会话页/hero 页/主题）+ 2 项优化全部通过。","bytes":4682,"lines":80,"body":"# v0.1.6 发布待办：标题栏统一按钮组 + 插件中心优化\r\n\r\n> 日期：2026-08-19\r\n> 状态：**已完成**（2026-08-20：归档重建 + 打包 + Release v0.1.6 已发布；另顺带更新 skill-mcp-center 0.2.0 进归档）\r\n> 版本：SSiD **0.1.6**（shell/package.json 已升）+ plugin-center **0.1.7**（已提交、已发布）+ dsh-skill-mcp-center **0.2.0**（本次新增，已发布）\r\n> 关联：[`2026-08-17-header按钮统一-调查与方案.md`](2026-08-17-header按钮统一-调查与方案.md)\r\n\r\n---\r\n\r\n## 一、本版包含的改动\r\n\r\n| # | 改动 | 状态 |\r\n|---|---|---|\r\n| 1 | SSiD 自绘标题栏统一按钮组（插件中心/侧栏/底栏，最小化按钮左侧） | ✅ 开发 + 验证 |\r\n| 2 | 内置插件 `@max-null/dsh-header-unify`（隐藏 DSH 内原按钮 + `ssid:titlebar` 事件执行器） | ✅ 开发 + 验证 |\r\n| 3 | plugin-center 暴露全局 API：`__pluginCenterOpen`（0.1.6）/ `__pluginCenterToggle` + `__pluginCenterClose` + 点遮罩关闭（0.1.7） | ✅ 开发 + 验证 |\r\n| 4 | 交互优化：插件中心再点关闭（toggle）；开侧栏/底栏自动关插件中心（单向互斥） | ✅ 用户实测效果很好 |\r\n| 5 | 壳 IPC：`ssid:title:action` → `mainView.executeJavaScript` 派发 `ssid:titlebar` CustomEvent | ✅ |\r\n\r\n验证：`plugins/dsh-header-unify/verify-header-unify.cjs` 17 项断言全过；安装版实机验证 4 项（标题栏/会话页/hero 页/主题）+ 2 项优化全部通过。\r\n\r\n## 二、版本矩阵\r\n\r\n| 包 | 版本 | 仓库 | 提交 |\r\n|---|---|---|---|\r\n| `ssid-shell` | 0.1.6 | `Max-Null/seek-soul-in-darkness` | 本提交（未推送） |\r\n| `@max-null/dsh-plugin-center` | 0.1.7 | `Max-Null/dsh-plugin-center` | `509d9f5`（0.1.6）+ `1833b58`（0.1.7），**未 push、未 publish** |\r\n| `@max-null/dsh-header-unify` | 0.1.0 | SSiD 仓库内置（`plugins/` + `profile-template/vendor/`） | 本提交 |\r\n\r\n## 三、发布链路（按序执行，每步成功后进入下一步）\r\n\r\n### 1. plugin-center：push + publish\r\n```sh\r\ncd D:\\Project\\dsh-plugin-center\r\ngit push origin main          # 推送 509d9f5 + 1833b58\r\nnpm publish                   # 发布 @max-null/dsh-plugin-center@0.1.7（需 npm token）\r\nnpm view @max-null/dsh-plugin-center version   # 确认 0.1.7\r\n```\r\n> 注意：pnpm-workspace.yaml 已把 0.1.7 加进 `minimumReleaseAgeExclude`，发布后立即 prepare-runtime 不会触发发布年龄检查。\r\n\r\n### 2. 重跑运行环境归档（新装机闭包）\r\n```sh\r\ncd D:\\Project\\ssid\\shell\r\nnode scripts/prepare-runtime.mjs\r\n```\r\n- 产物：`shell/dsh-runtime.tar.gz`（约 170MB，含 dsh-header-unify + plugin-center 0.1.7）\r\n- 前置：Node ≥22.13（默认找 `D:\\Program Files\\nvm\\v22.22.2\\node.exe`）、pnpm 11.x\r\n- 归档版本 `.runtime-version` = `0.1.6-0.1.0-rc.7-\u003c指纹>`：版本 + 依赖 + vendor 指纹变化会触发老 profile 重部署\r\n\r\n### 3. 重新打包安装版\r\n```sh\r\ncd D:\\Project\\ssid\\shell\r\nnpm run pack\r\n```\r\n- 产物：`shell/dist-electron/思灵 Setup 0.1.6.exe`\r\n- 验证 asar 含新标题栏：`btn-plugins` / `ssid:title:action`（打包后可选 grep）\r\n\r\n### 4. 发布前自测（安装版）\r\n- [ ] 新装机（删除 `%USERPROFILE%\\.dsh\\profiles\\ssid` 后首启）：归档部署成功，标题栏 3 按钮可用，插件中心可开/关/遮罩关，侧栏互斥正常\r\n- [ ] 老 profile 覆盖安装：标题栏按钮出现（asar 新版），插件中心为 0.1.7（归档指纹变化触发重部署或手动 `dsh plugin update`）\r\n- [ ] hero 页（未选会话）：插件中心可打开\r\n\r\n### 5. GitHub Release v0.1.6\r\n- 上传 `思灵 Setup 0.1.6.exe` 到 Release `v0.1.6`\r\n- Release 正文 = `docs/release-notes-v0.1.6.md`（**待写**，可参考 v0.1.2 的结构：新增/修复/体积/更新说明）\r\n- 打 tag `v0.1.6` 并推送\r\n\r\n### 6. 收尾\r\n- [ ] 推送 SSiD 仓库 main（本提交）\r\n- [ ] 更新 `docs/README.md` 索引（若新增 release-notes 链接）\r\n- [ ] 归档（可选）：发布后删除本机 `shell/dist-electron/` 旧产物，保留 0.1.6\r\n\r\n## 四、风险与注意\r\n\r\n| 项 | 说明 |\r\n|---|---|\r\n| 当前安装包（`思灵 Setup 0.1.5.exe`，2026-08-19 17:58） | 壳代码已含标题栏按钮，但 dsh-runtime 归档是旧内容（plugin-center 0.1.5）——**新装机**会缺 `__pluginCenterToggle/Close`，标题栏插件中心只能打开不能关闭。发布链第 2 步解决 |\r\n| 本机 profile | 已手动部署 0.1.7 + dsh-header-unify，不受归档影响；发布链完成后归档指纹变化，重启可能触发一次重部署（正常） |\r\n| `verify-header-unify.cjs` | 回归测试：任何 client.js 改动后先跑它再部署 |\r\n"},{"file":"2026-08-19-v0.1.6发布执行-环境核查与阻塞.md","date":"2026-08-19","slug":"v0.1.6发布执行-环境核查与阻塞","title":"v0.1.6 发布执行：环境核查与阻塞记录","statusRaw":"执行中，卡在待办 1 的 npm publish（凭据由用户手动执行；0.1.7 代码确认不在 GitHub 远程，publish 需用户在另一环境本地仓库执行）（部分结论已被 2026-08-19-plugin-center-0.1.7本机重建.md 取代 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":"拉取代码后当轮","tags":["@max-null/dsh-plugin-center","dsh-plugin-center","dsh-runtime"],"summary":"1. npm 凭据：~/.npmrc 的 token 已失效（401）。用户已选择手动执行（见第五节指令）。 2. plugin-center 0.1.7 代码：❌ 确认不在 GitHub 远程——ls-remote --heads 只有 main（ebc3c0d，package.json=0.1.5），无其他分支；clone 提交历史无 509d9f5/1833b58。用户先前以为已 push，","bytes":5560,"lines":88,"body":"# v0.1.6 发布执行：环境核查与阻塞记录\n\n> 日期：2026-08-19（拉取代码后当轮）\n> 状态：**执行中，卡在待办 1 的 npm publish**（凭据由用户手动执行；**0.1.7 代码确认不在 GitHub 远程**，publish 需用户在另一环境本地仓库执行）（部分结论已被 `2026-08-19-plugin-center-0.1.7本机重建.md` 取代 · 2026-09-12）\n> 关联：[`2026-08-19-v0.1.6发布待办-标题栏按钮组.md`](2026-08-19-v0.1.6发布待办-标题栏按钮组.md)\n\n---\n\n## 一、当前环境核查结果（本机 H:\\MaxNull\\WorkStation\\seek-soul-in-darkness）\n\n| 项 | 结果 | 影响 |\n|---|---|---|\n| SSiD 仓库 | 存在，main 在 `8c02389`（含 5 个发布相关 commits） | ✅ |\n| `shell/` 目录 | 存在 | ✅ |\n| Node | v26.2.0（PATH） | ✅ 满足 prepare-runtime ≥22.13 |\n| pnpm | 11.21.0 | ✅ |\n| npm registry | registry.npmjs.org，可达（`npm view` 成功） | ✅ |\n| **npm 凭据** | `~/.npmrc` token `npm_KdnF9m1...` **401 Unauthorized**（`npm whoami` / curl 均失败） | ❌ 无法 `npm publish` |\n| npm 已发布版本 | `@max-null/dsh-plugin-center` 最新 **0.1.5**（0.1.6/0.1.7 未发布） | ❌ 与待办文档一致 |\n| plugin-center 本地 checkout | `D:\\Project\\dsh-plugin-center` **不存在**（开发在另一环境） | ❌ 无 0.1.7 代码 |\n| plugin-center 远程 | GitHub 存在，main=`ebc3c0d`（**是否含 0.1.7 未确认**，文档记录 509d9f5/1833b58 开发时未 push） | ⚠️ 待确认 |\n| GitHub 网络 | **间歇性不可用**：直连曾成功（pull 成功、ls-remote 一次成功），当前窗口全部超时（clone/ls-remote/codeload 均失败） | ⚠️ 时通时断 |\n| git 代理 7897 | `clash-core-service` 进程在跑，但 **TLS connect error**（握手失败），不可用 | ❌ 需修代理或直连 |\n| NVM_HOME |
