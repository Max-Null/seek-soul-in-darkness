869` | 为同目录产物的读者/写入者互斥而生；SSiD 四门之间无产物依赖 |\n| 手写并发调度 + `availableParallelism` 上限 | `168-197`、`934-941` | 官方封顶 4 是因为多个 doc 门各自建整棵 `ts.Program` 会爆内存；SSiD 无此负载 |\n| fail-fast 进程树终止体系 | `1091-1265` | 被 vitest worker / dev server 逼出来的；SSiD 门不留后代 |\n| 十余个 `DSH_*` 开关 | 全文 | 配置面就是理解成本 |\n| 嵌套 runner | `464-467` | `ci-consumers` 门里再跑子 runner，SSiD 无对应结构 |\n\n## 6. 待人工确认\n\n1. ~~两处残骸的处置~~ **已处置（2026-09-10）**：\n   - `seek-soul-in-darkness/plugins/dsh-quick-toolbar/`（整个目录，6 个 git 跟踪文件）\n   - `shell/profile-template/vendor/dsh-quick-toolbar/verify-header-unify.cjs`\n   \n   删除前确认随目录一并删掉的设计文档在上游有同一份（`max-null-plugins/dsh-quick-toolbar/doc/设计/`，\n   SHA256 均为 `1B397F5B…`，6158 字节），无信息损失。清理后重跑比对：三处 vendor 与\n   `max-null-plugins/` 源头零差异，\"仅在 vendor 侧存在\"由 1 归零，vendor 回到 4 文件的精简副本。\n2. 比对面是否需要 `exclude` 掉 `src/`、`tests/`、`docs/`——取决于\"四份一致\"是按可运行产物\n   定义还是按整个包目录定义。手册说的是\"MD5 四份一致\"，未界定比对面。\n3. `~/.dsh/profiles/web` 是否也要有 template 基准（当前 web 与 ssid 的 vendor 包集合不同）。\n4. 指纹算法是否接受从手册所称 MD5 换为 sha256。\n5. `dsh-capture`（源头在 `max-null-plugins/dsh-capture`）与 `dsh-context-doctor`（第三方固化）\n   是否纳入 §3.1 的\"三处互相一致\"子集。\n6. ~~`shell/profile-template/vendor/README.md` 两处过时~~ **已修正（2026-09-10）**：条目标题\n   的旧名改为 `dsh-quick-toolbar`；`dsh-genui` 条目改为反映现状（经 npm 声明 0.9.8、\n   vendor 目录下已无该包）。仍待定的是**边界问题**：`vendor/README.md` 这类描述性标题\n   要不要纳入旧名检查的硬域？当前建议归软域（人工维护），因为它是叙述而不是配置声明。\n\n## 7. 首次体检实测（2026-09-10）\n\n在写任何检查脚本之前，先按 §3.1 的判定手工跑了两轮比对（lib 面四份核、整包目录源对\nvendor；逐文件 sha256，排除 `node_modules`、`.git`、`*.log`、`*.tsbuildinfo`）。\n这既验证了判定契约可落地，也给出了当前基线：\n\n**lib 面（四份核）**：\n\n| 包 | 源侧 | 三处 vendor | 差异 |\n|---|---|---|---|\n| `dsh-ssid-panels` | 3 | 3 / 3 / 3 | **0** |\n| `dsh-ssid-zh-ui` | 2 | 2 / 2 / 2 | **0** |\n| `dsh-quick-toolbar` | 2 | 2 / 2 / 2 | **3（全部文件）** |\n\n**整个包目录（源 vs `profile-template/vendor`，残骸清理前）**：\n\n| 包 | 源 | vendor | 仅在源侧 | 仅在 vendor | 内容不同 |\n|---|---|---|---|---|---|\n| `dsh-ssid-panels` | 21 | 21 | 0 | 0 | 0 |\n| `dsh-ssid-zh-ui` | 5 | 5 | 0 | 0 | 0 |\n| `dsh-quick-toolbar`（源取 `max-null-plugins/`） | 43 | 5 | 39 | 1 | 0 |\n\n`dsh-ssid-panels` 与 `dsh-ssid-zh-ui` 四份全绿，说明现行同步纪律在执行中确实有效，\n检查一旦建立就有真实基线可守。\n\n`dsh-quick-toolbar` 的 lib 面三个红全是 manifest 源头写错，不是真的漂移：\n\n```\n把 seek-soul-in-darkness/plugins/dsh-quick-toolbar/lib 当源头：\n  DIFF client.js    src=74F19FCD  tpl/web/ssid=1FF6630F\n  DIFF index.js     src=MISSING   tpl/web/ssid=C0E9D4DA\n  DIFF index.mjs    src=00620466  tpl/web/ssid=MISSING\n把 max-null-plugins/dsh-quick-toolbar/lib 当源头：\n  三处 vendor 零差异\n版本：SSiD 残骸 0.1.0 ／ max-null-plugins 与三处 vendor 均 0.8.6\n```\n\n全目录那一行给出另一半结论：源 43 文件对 vendor 5 文件，39 处\"仅在源侧\"全部是按设计\n不进 vendor 的内容，唯一真信号是仅在 vendor 侧的 `verify-header-unify.cjs`——直接比\n\"整目录摘要\"的噪声比是 **40:1**，这正是 §3.1 要求把 include/exclude 写进 manifest 的理由。\n而 lib 面那三个 DIFF 里有两个是文件命名变化（`index.js` ↔ `index.mjs`），目录级摘要\n只会把它们显示成一个无法定位的红。\n\n残骸清理后重跑同一比对：`A=43 B=4 onlyA=39 onlyB=0 contentDiff=0`——\"仅 vendor 侧存在\"\n归零，vendor 回到 4 文件的精简副本，三处 vendor 的 lib 与源侧零差异。\n\n同时确认 §3.2 的一个前提：`~/.dsh/profiles/web/vendor` 与 `ssid/vendor` 的包集合不同\n（web 多一个 `dsh-dream-skin`），所以 profile 侧的受检对象只能是 ssid。\n\n## 8. 落地顺序\n\n1. `check-vendor-sync`——手册 §10 的硬性要求，与待办 #1 `sync-vendor.cjs` 互为对偶\n   （一个负责同步，一个负责验证）。\n2. `check-profile-sync`——手册 §4 实测踩过的坑，失配频率第二高。\n3. `check-bom`——实现最简，故障面最大。\n4. `check-legacy-names`——先定硬/软边界，并处理 §6 第 1 项的待确认。\n5. 四个都跑通后再建 `check-rules.mjs` 编排器。\n\n前两项之间有共享代码的诱惑（列文件、算指纹、定位差异），但建议先各自独立；\n真正需要从第一个脚本起就统一的只有**报告格式**（`文件:行` + 三类事实 + 退出码非零），\n它值得抽一个约 40 行的 `scripts/lib/gate-report.mjs`。\n\n每项检查都配一个自测（官方是每 gate 一个 `.spec.ts`）。既然检查脚本本身是 `.mjs`，\n自测也用 `.mjs`，`node --test scripts/*.spec.mjs` 直接可跑，不必引入 `tsx`。\n`shell/package.json` 现有测试脚本之所以带 `node --import tsx/esm`，是因为它跑的是\n`.ts` 用例（`--test tests/profile-merge.spec.ts tests/codegraph-adapt.spec.ts`），\n且用例是逐个列出的——新增自测时按同样方式显式登记，别用通配符收进来。\n自测同样要遵守官方那条纪律：**一个只在单独运行时才通过的测试是缺陷**——\n凡是占用临时目录或子进程的自测都要自己收尾。`verify-cordis-config.spec.ts` 的写法是\n每个用例 `mkdtempSync` 建独立临时目录、在 `finally` 里 `rmSync` 清理（L52/L70、\nL113/L141、L146/L152），并断言精确的错误字符串。\n"},{"file":"2026-09-10-SSiD-skill落点调查.md","date":"2026-09-10","slug":"SSiD-skill落点调查","title":"SSiD skill 落点调查","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["ssid-skill","dsh-plugin-upgrade","ssid-release","dsh-plugin-center","dsh-memory","dsh-superpowers","dsh-skill","dsh-chat-rail","dsh-prose-standard"],"summary":"源码：DSHfork/packages/skill/skill-filesystem/src/index.ts:250-262 共 6 类源，每类带一个 rank（优先级）。同名的覆盖关系由测试名写明：","bytes":8643,"lines":139,"body":"# SSiD skill 落点调查\n\n> **调查缘起**：你指出\"这些 skill 可能是某个插件的附属品，比如我们的记忆插件就有附带的 skill。这一点值得先进一步调查\"。\n> **调查方法**：读 DSH 的 skill 发现机制源码，并核对本机的实际部署形态。\n\n> 状态：进行中（推断 · 2026-09-12）\n\n---\n\n## 一、DSH 如何发现 skill\n\n源码：`DSHfork/packages/skill/skill-filesystem/src/index.ts:250-262`\n\n```\n\u003c项目根>/.dsh/skills      →  source: project-dsh\n\u003c项目根>/.agents/skills   →  source: project-agents\n\u003ccustomSkillDirs 配置项>   →  source: custom\n$DSH_HOME/skills          →  source: user-dsh   （skipSystem：跳过 .system/）\n$AGENTS_HOME/skills       →  source: user-agents\n\u003cbundledSkillDir>         →  source: bundled     （trustedHost: true）\n```\n\n**共 6 类源**，每类带一个 `rank`（优先级）。同名的覆盖关系由测试名写明：\n\n> **项目 skill 覆盖 runtime，runtime 覆盖 custom 与 user skill。**\n\n其他核实到的行为：支持目录形式 `\u003cname>/SKILL.md` 与平铺形式 `\u003cname>.md`；支持符号链接（含断链与设备链的处理）；有 `skills/change` 事件供热更新；`customSkillDirs` 可在配置里声明任意额外目录。\n\n---\n\n## 二、本机的实际部署形态\n\n| 路径 | 源 | 内容 |\n|---|---|---|\n| `C:\\Users\\MaxNull\\.dsh\\skills` | **user-dsh** | **17 个**：`dsh-plugin-upgrade`、`genui`、`mxy-*`（8）、`omo-*`（6）、`ssid-release`，另有 README.md |\n| `C:\\Users\\MaxNull\\.agents\\skills` | user-agents | 1 个：`docx` |\n| `C:\\Users\\MaxNull\\.agents\\.skill-lock.json` | — | `npx skills add` 的锁文件 |\n| `H:\\MaxNull\\WorkStation\\.agents` | project-agents | **不存在** |\n\n**因此当前会话加载的全部 skill 都来自 `~/.dsh/skills/`（user-dsh 源）**——包括那个 `dsh-plugin-upgrade`。\n\n---\n\n## 三、插件附属 skill 的真实机制（关键）\n\n**模式确实存在，但机制与直觉不同。**\n\n`max-null-plugins/dsh-plugin-center` 带一个 skill：`skills/dsh-plugin-upgrade/SKILL.md`。\n\n它的 package.json 里：\n\n- `files` 字段**包含** `\"skills\"`（把它打进 npm 包）\n- **`dsh` 字段没有任何 skill 声明**——只有 `bundle` 与 `client`\n\n既然发现路径里没有\"从 `node_modules/\u003cpkg>/skills` 读\"这一条，而 `dsh-plugin-upgrade` 又确实出现在 `~/.dsh/skills/` 下，**结论是：插件附属 skill 是\"部署时被安装到 user-dsh 目录\"才生效的，不是运行时从插件目录发现的。**\n\n旁证：`dsh-plugin-center/src/market.ts:182` 有一段注释区分了两种 skill 来源——\n\n> Skill entries install into `~/.agents/skills` via a different mechanism (`npx skills add`); the pnpm-driven center cannot install them, so…\n\n**所以 skill 有两条独立的供应链**：\n1. **插件包内 `skills/` → 随插件安装 → 落到 user-dsh**\n2. **纯 skill → 走 `npx skills add` → 落到 `~/.agents/skills`**\n\n---\n\n## 四、一处与记忆有关的更正\n\n你说\"我们的记忆插件就有附带的 skill\"。**这一点我没有找到证据**：\n\n- `max-null-plugins/dsh-memory` 顶层**没有** `skills/` 目录，全库无 `SKILL.md` 或 skill 相关文件\n- 它的 `files` 字段是 `[\"dist\",\"client.js\",\"cordis.patch.yml\",\"README.md\",\"LICENSE\"]`——**不含 skills**\n- 它的 `dsh` 字段只有 `bundle` 与 `client`，无 skill 声明\n- 全工作区扫下来，**带 `skills/` 目录的插件只有 `dsh-plugin-center` 一个**\n\n**最可能的解释**：你指的是当前会话每轮注入的那段「记忆系统自述」——那是 **dsh-memory 插件注入的系统提示段落，不是 skill**。两者在界面上都表现为\"大段中文说明\"，容易混淆，但机制完全不同：系统提示段落由插件直接注入，skill 是经上述发现路径加载的。\n\n如果你指的是别处（比如另一个工作区或未提交的分支），告诉我路径，我再去核。\n\n---\n\n## 五、对落点决策的结论（2026-09-10 修订）\n\n> **本节已改写**。原结论是\"两个落点\"，那是在**只考虑文件系统发现路径**的前提下得出的。\n> 之后的调查发现 skill 可以由**插件注册 provider**提供（范本：`packages/skill/skill-badge/`），于是出现了第三个、也是更优的落点。\n\n**落点是三个，且第三个优于前两个。**\n\n| # | 落点 | 生效条件 | rank |\n|---:|---|---|---:|\n| ① | `\u003c项目>/.dsh/skills` | 工作目录 = 该项目 | 100 |\n| ② | `\u003c项目>/.agents/skills` | 工作目录 = 该项目 | 200 |\n| ③ | **独立 npm 包（SkillProvider 插件）** | **装了它的 profile** | **550** |\n\n**①② 的共同局限**：路由条件是\"**工作目录等于那个仓库**\"——**出了那个目录就失效，也无法分发给他人**。我最初建议的 ② 只解决了一半问题。\n\n**③ 解决了全部四个需求**：进 SSiD、进任何 DSH profile、可分发给他人、独立库可承载更多文档与演进记录。\n\n**rank 550 的依据**：生态里已有先例——[JasonFreeLab/dsh-superpowers](https://github.com/JasonFreeLab/dsh-superpowers) 的 `SkillProvider` 就用 550，README 明写\"可被项目/用户技能覆盖\"。它位于 user-agents(500) 与 bundled(600) 之间，语义是\"第三方 skill 插件\"。详见 `2026-09-10-DSH-skill生态调查.md`。\n\n**SSiD 现有的 `ssid-release` 不受影响**——它是 SSiD 专属、只在开发/发版时用的 skill，留在 `.agents/skills/`（②）是对的。**新的方法论 skill 走 ③**，因为它的目标是\"跨项目可用、可分发\"。\n\n**一个仍然有效的事实**：SSiD 根目录的 `skills/`（14 个）**不在 DSH 的发现路径上**。它只是\"源头\"——需要经 `profile-template/skills/`（15 个，多一个 `genui`）走归档部署，才能到达 `~/.dsh/skills/` 生效。这解释了 `genui` 为什么只在 profile-template 里：它只属于产品交付，不属于开发期。\n\n**于是 SSiD 侧出现第三种形态**：一个既可独立分发、又被 SSiD 集成的东西。它**不适用**手册 §10 的\"内置插件不发布 npm\"条款（那条针对的是脱离 SSiD 无法使用的插件），而是走**npm 声明**（像 dsh-chat-rail 那样）——这也正是你的决定。\n\n---\n\n## 六、你这个要求的技术必要性：来源与版本标记\n\n你说的\"要有一份文档或者标记，表明这个 skill 的来源和版本，得记录来时路\"——调查之后，这条**不只是好习惯，而是被机制逼出来的必需**：\n\n**因为 skill 一旦部署到 `~/.dsh/skills/`，就脱离了源仓库。** 那个目录下的 17 个条目没有任何元数据说明它们从哪来、对应哪个上游版本。当前已知的溯源手段只有：\n\n- `~/.agents/.skill-lock.json`（只覆盖 `npx skills add` 那条链）\n- 各 skill 自身的 frontmatter（DSH 的 12 个 skill 只有 `name` 与 `description`，**没有 version 字段**）\n\n所以如果我们不自己记，**上游 DSH 更新到第几版、我们适配自哪一版，将无从查起**。而 DSH 是高频更新的（本会话早前实测：24 天 / 16 个 tag）。\n\n**建议的标记内容**（待你确认）：\n\n| 字段 | 例子 | 为什么需要 |\n|---|---|---|\n| 上游来源 | `DSHfork/.agents/skills/dsh-prose-standard/SKILL.md` | 定位原始文件 |\n| 上游版本锚点 | commit SHA + 日期 | DSH 无版本号，只有 commit 可靠 |\n| 适配日期 | `2026-09-10` | 判断适配是否已过时 |\n| 适配类型 | 小改 / 需适配 / 部分可用 | 对应清点文档里的分类 |\n| 与上游的差异摘要 | 删了什么、改了什么、为什么 | **适配的核心价值所在** |\n\n放在哪有两种选择：**skill 文件内的 frontmatter 扩展字段**（随文件走，但可能被 DSH 的 skill 格式检查拒绝），或 **skill 包内单独一个 `SOURCE.md`**（不干扰格式）。我倾向后者，理由与 DSH 自己的做法一致——`SKILL.md` 保持精简，重材料外置。\n\n---\n\n## 附：本次调查的证据边界\n\n- **已核实**：发现路径与 rank 的源码位置、6 类源、本机三个目录的实际内容、`dsh-plugin-center` 的 package.json 字段、全工作区插件 `skills/` 目录的扫描结果、`market.ts` 的注释原文。\n- **未核实**：`bundledSkillDir` 具体指向哪里；profile 配置里是否有 `customSkillDirs`；`dsh-plugin-upgrade` 究竟由哪一步部署到 `~/.dsh/skills/`（我只确认了结果，没有追到执行者）。\n- **更正**：第四节关于 dsh-memory 的结论是\"未找到证据\"，不是\"不存在\"——如果你有具体位置，我再去核。\n"},{"file":"2026-09-09-CodeGraph-MCP-默认索引目录修复.md","date":"2026-09-09","slug":"CodeGraph-MCP-默认索引目录修复","title":"CodeGraph MCP 默认索引目录修复（v0.2.2）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-09-09","dateNote":null,"tags":["ssid-codegraph-mcp","dsh-mcp-client","dsh-ssid-panels","dsh-skill-mcp-center"],"summary":"反馈原文要点（SSiD-CodeGraph-MCP-问题反馈.md，2026-09-09）：","bytes":8389,"lines":146,"body":"# CodeGraph MCP 默认索引目录修复（v0.2.2）\n\n> 日期：2026-09-09 ｜ 触发：AI 中台项目组问题反馈（本机 SSiD 用户）\n> 相关：`docs/决策/2026-09-07-升级部署覆盖用户层修复.md`（用户层保留）、\n> 状态：进行中（推断 · 2026-09-12）\n\n> `docs/决策/2026-08-24-Playwright-MCP-预制-实施方案.md`（预制 MCP 模式）\n\n## 1. 反馈与现象\n\n反馈原文要点（`SSiD-CodeGraph-MCP-问题反馈.md`，2026-09-09）：\n\n| 现象 | 后果 |\n|---|---|\n| 首次调用 `codegraph_*` 超时 `MCP error -32001`，进程停在 `index_parse` 8 分钟以上、内存 900MB+ | 首次体验差，易误判工具损坏 |\n| 索引产物收录 5000 条 `AppData\\...`（撞 `--max-files` 默认上限 5000） | 资源浪费，索引一堆无关文件 |\n| 查询项目符号（`SdkApiService`）返回 Chrome 扩展的 JS | 静默失效：工具「有响应」但结果与项目无关 |\n\n根因（v0.2.1 出厂注入，本机核对仍原样存在）：\n\n- `shell/main.mjs`：`process.env.SSID_MCP_CG_WS = process.env.SSID_MCP_CG_WS || homedir()`\n- `shell/profile-template/cordis.patch.yml`：`cwd: !!js 'process.env.SSID_MCP_CG_WS || \"\"'`\n\n即未定制时 CodeGraph 引擎的 workspace 就是**用户主目录**——而主目录里没有代码仓库。\n\n## 2. 为什么报告的建议 1 不可行（架构约束）\n\n报告建议「默认值改为会话工作目录」。核对 DSH 实现后确认**做不到**：\n\n- `dsh-mcp-client` 是 **profile 级 loader 条目**（`cordis.patch.yml` 顶层 `insert`），\n  一个 MCP 进程服务**所有会话**；`cwd` 在进程 spawn 时固定\n  （`packages/mcp/mcp-client/src/transport.ts` 把 `config.cwd` 直接交给\n  `StdioClientTransport`）。\n- 会话工作目录是**每会话**的运行时值，MCP 进程既感知不到，也不能在会话之间切换。\n- 即便改成 agent-preset 级挂载，也会变成「每会话一个索引引擎」——\n  按报告的 700–900MB/索引计，内存不可接受。\n\n另有两个实测约束：\n\n- `cwd: ''`（空字符串）会经 MCP SDK 直接传给 `spawn`，**实测 ENOENT**——\n  所以不能简单「不设默认值」，必须给一个非空目录。\n- 引擎 CLI 支持 `--workspace`（可重复）、`--exclude`（可重复）、`--max-files`、\n  `--profile`、`--graph-only`；工具 `codegraph_index_directory {path}` 可索引任意目录。\n\n## 3. 采用的方案\n\n**出厂不再指向用户主目录；boot 前由壳解析一次索引目录，解析不到就停用该条目。**\n\n### 3.1 解析优先级（`shell/lib/codegraph-adapt.mjs`）\n\n1. `SSID_MCP_CG_WS` 环境变量（高级用户/脚本显式指定）\n2. `~/.ssid/codegraph.json` 的 `workspace`（SSiD 侧稳定入口，含首次引导的选择）\n3. **最近会话探测**：扫 `$DSH_HOME/sessions-ssid`、`$DSH_HOME/sessions` 下的\n   `session.jsonl.zstd`，按 mtime 降序取第一个 header `cwd` 仍可用的会话\n   （只解第一个 zstd 帧，成本 ~KB 级；扫描规则与 `dsh-ssid-panels` 同源）\n4. 都没有 → `workspace = null` → **条目停用**\n\n「可用」判定 `isUsableWorkspace()` 显式拒绝：不存在的目录、**用户主目录本身**、\n**主目录的祖先**（`C:\\Users` 这类——等于把整个用户区当项目索引，正是本次事故）。\n\n### 3.2 停用与启用\n\n模板 patch 的 codegraph 条目带条件：\n\n```yaml\n      disabled: !!js 'process.env.SSID_MCP_CG_ENABLE !== \"1\"'\n```\n\n壳按解析结果设 `SSID_MCP_CG_ENABLE`（`'1'` / `'0'`），并**总是**设\n`SSID_MCP_CG_WS`（未适配时给占位目录）——空 cwd 会让 `spawn` ENOENT。\n`disabled` 的 `!!js` 求值走 `vendor/loader/src/config/entry.ts:104` 的通用\nentry 路径（`isJsExpr(options.disabled)` → `evaluate(...)`），insert 子条目同样适用。\n\n### 3.3 首次引导（可跳过）\n\n未适配且用户尚未做过选择（`~/.ssid/codegraph.json` 无 `decided`）时，boot 前弹一次\n选择框：选目录 → 落盘并启用；跳过 → 落盘 `decided: true` 并保持停用。\n用户之后仍可在「设置 → MCP」里改 cwd / 启停（`dsh-skill-mcp-center` 支持热更新）。\n\n### 3.4 出厂保护参数\n\n即使索引目录被改到项目根，也不进这些目录（报告建议 3）：\n\n```\n--exclude node_modules --exclude .git --exclude AppData --exclude target\n--exclude dist --exclude build --exclude .venv --exclude __pycache__\n```\n\n`--max-files` 保持引擎默认（5000）——撞上限本身是「索引范围没配对」的信号，\n出厂替用户调大会掩盖问题。\n\n## 4. 附带修复：升级不再打回用户对出厂 MCP 的改动\n\n**缺陷**：`mergeUserPatch` 以模板为基线，只把「模板 insert 块内不存在的用户子条目」\n追加回去；**同 id 子条目一律以模板为准**。于是用户在 MCP 管理页改的 cwd / 启停\n（写在 profile 根的 `cordis.patch.yml`）会在下次升级部署时被打回。\n\n**修复（三方合并）**：部署时把本次归档模板原文缓存到\n`~/.ssid/template-cordis.patch.yml`；下次部署以它为 **base** 比较：\n\n- base 有同 id 子条目且用户文本 ≠ base ⇒ **用户改过** ⇒ 用用户版本替换模板的该子条目\n- 文本与 base 相同 ⇒ 用户没改 ⇒ 用模板新版（模板升级照常生效）\n- 无 base（首次引入该机制）⇒ 退化为 v0.2.1 行为（只保留用户新增条目）\n\n`mergeUserPatch(old, template, base)` 第三参可选；`splitChildEntries` 增补\n`start`/`end` 行号以支持文本级替换。升级报告的 `patchMerged` 增 `overridden` 字段。\n\n## 5. 改动清单\n\n| 文件 | 改动 |\n|---|---|\n| `shell/lib/codegraph-adapt.mjs` | 新增：解析优先级、可用性校验、会话 artifact 探测、配置读写、保护参数 |\n| `shell/main.mjs` | 去掉 `homedir()` 默认；boot 前解析 + 设 env；首次引导弹窗；部署段缓存模板 base 并传三方合并 |\n| `shell/profile-template/cordis.patch.yml` | codegraph 条目加 `disabled: !!js`；args 加 `--exclude` 保护清单；注释重写 |\n| `shell/lib/profile-merge.mjs` | `mergeUserPatch` 三方合并；`splitChildEntries` 返回行号；升级报告加 `overridden` |\n| `shell/tests/codegraph-adapt.spec.ts` | 新增 7 例 |\n| `shell/tests/profile-merge.spec.ts` | 新增 4 例（用户改动保留 / 模板升级生效 / 无 base 退化 / 改动+新增并存） |\n| `shell/package.json` | 增 `test`（聚合）与 `test:codegraph-adapt` |\n\n## 6. 验证（L2，2026-09-09）\n\n- **L1**：`npm run typecheck` 全绿；`npm test` 29/29（含新增 11 例）。\n  注意 `tsconfig.json` 的 `include` 只含 `kernel.ts`/`module-resolution.ts`/`boot-smoke.ts`，\n  `main.mjs` 不在类型检查范围内——改动靠 boot 实测覆盖。\n- **停用路径**（不设 `SSID_MCP_CG_ENABLE`）：`npm run smoke` → `SSiD boot OK`，\n  进程列表**无** `codegraph-server-*`（对照组证明该条目确实会被加载）。\n- **启用路径**（`SSID_MCP_CG_ENABLE=1` + 空目录 workspace）：引擎日志\n  `Workspaces: [\"...cg-empty-ws\"]`、`Excluding: [\"node_modules\", \".git\", \"AppData\", ...]`、\n  `Client: dsh-mcp-client 0.0.1`、`tools/list` 正常，boot OK——`--exclude` 被引擎接受，\n  workspace 不再是用户主目录。\n- **顺带清理**：发现一个 v0.2.1 遗留的孤儿 `codegraph-server` 进程\n  （2026-09-08 启动、命令行 `--mcp` 无 `--workspace`、cwd 继承 = 用户主目录，父进程已退出），\n  已终止。\n\n## 7. 已知限制与待办\n\n- **旧壳 × 新 patch 不一致**：正在运行的安装版（v0.2.1 壳）不设 `SSID_MCP_CG_ENABLE`，\n  若其重启会用上已同步的运行时 patch → codegraph 显示为**停用**（安全方向）。\n  v0.2.2 发版后壳与 patch 一并更新即一致。\n- **首次引导只在「未适配且未 decided」时出现**；跳过后若之后探测到项目仍会自动启用\n  （`decided` 只表示「问过了」，不是「永不用」）。\n- **多项目用户**：MCP 是单例，索引目录只能有一个。跨项目需在 MCP 管理页切换，\n  或给 `codegraph_index_directory` 传目标路径（引擎支持多 workspace，但出厂不预置）。\n- 工具面保持 `--profile all`（42 工具，实测工具列表约 42KB 注入成本）——\n  用户若嫌上下文重，可在 MCP 管理页把 args 改成 `--profile core|graph`。\n"},{"file":"2026-09-07-升级部署覆盖用户层修复.md","date":"2026-09-07","slug":"升级部署覆盖用户层修复","title":"2026-09-07 升级部署覆盖用户层修复（插件/MCP 丢失 + 无法启动）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@huanlin/dsh-plugin-better-sidebar-plugin-office","@deepseek-ai/dsh","@astudioplus/codegraph-mcp","dsh-skill-mcp-center","dsh-plugin-better-sidebar-plugin-office","dsh-web-preview-panel","dsh-sidebar-qa","dsh-runtime","dsh-taskboard","dsh-mcp-client","dsh-wechat","dsh-ssid-panels"],"summary":"- main.mjs deployRuntime（v0.1.3+）：归档顶层 = profile 根内容，部署 = nodemodules 整体替换 + 其余条目（package.json / cordis.patch.yml / pnpm-lock.yaml / vendor/…）逐个「rmSync + rename」覆盖——没有合并，用户自装插件声明、用户 patch（MCP 注册）零保留。 ","bytes":11308,"lines":77,"body":"# 2026-09-07 升级部署覆盖用户层修复（插件/MCP 丢失 + 无法启动）\n\n> 状态：进行中（推断 · 2026-09-12）\n\n> 现象报告（用户 v0.2.0 覆盖安装后）：① 用户自装插件与新版 DSH 不兼容，新版 SSiD 安装后无法启动；② 用户自装 MCP 消失——MCP 程序本体还在，但注册信息被覆盖。\n> 结论：两个 bug 同根因（部署零保留覆盖用户层），另附一条「部署失败→无闭包锚点→运行时定位崩溃」的失效链与本机遗留的「陈旧 pending 回滚炸弹」。\n\n## 1. 机制确认（代码 + 本机现场证据）\n\n- `main.mjs deployRuntime`（v0.1.3+）：归档顶层 = profile 根内容，部署 = `node_modules` 整体替换 + **其余条目（package.json / cordis.patch.yml / pnpm-lock.yaml / vendor/…）逐个「rmSync + rename」覆盖**——没有合并，用户自装插件声明、用户 patch（MCP 注册）零保留。\n- DSH 的 MCP 注册渠道 = profile 根 `cordis.patch.yml` 的 insert 条目（dsh-skill-mcp-center / 插件中心都编辑它）；DSH 无全局 MCP（2026-08-24 方案文档同款结论）。\n- 本机现场（开发机即用户机器，dev 与安装版共用 `~/.dsh/profiles/ssid`）：\n  - 今晚 21:53 安装版启动日志：`runtime deploy needed (archive=0.2.0-…e13b24f3 profile=0.2.0-…86e1fb66) → runtime deployed`；\n  - 部署后 `cordis.patch.yml` = 模板原文（仅 mcp-playwright）；`package.json` deps = 模板+内核族；\n  - 用户曾装插件（`@huanlin/dsh-plugin-better-sidebar-plugin-office`、`dsh-web-preview-panel`）仅存在于各 `package.json.pre-*`/`.bak-*` 备份，node_modules 实体已消失；\n  - **`~/.ssid/pending-plugin-updates/index.json` 残留 8-28 的 `dsh-sidebar-qa@0.4.2`**：kernel `applyPendingPluginUpdates` 每次 boot 前 `pnpm add -w dsh-sidebar-qa@0.4.2`——一旦某次成功就把 0.5.0（rc.1 兼容）降回 0.4.2（rc.2 时代）→ `Failed to load plugins` 白屏。当前实体仍是 0.5.0（消费一直失败），但雷一直挂着。\n- 无法启动链（ssid.log 实锤）：`runtime deploy failed: EPERM … .deploy.old`（旧实例/杀软占用 + 首次 `rmSync` 残留清理无防御）→ isUpgrade 走「继续用旧环境启动」→ 旧 profile 无闭包锚点（源码模式残留）→ `Error: 无法定位 DeepSeek Harness 运行时` → 崩溃。用户观察到「直接打不开」，且「没装插件时覆盖安装正常」——因为旧插件增大 node_modules 占用与部署失败概率，且失败后环境完整性差。\n\n## 2. 修复（v0.2.1 起生效，本提交）\n\n| 环节 | 改动 | 文件 |\n|---|---|---|\n| 部署前快照 | `~/.ssid/profile-backups/\u003c旧指纹>-\u003cts>/` 复制 package.json / pnpm-lock.yaml / pnpm-workspace.yaml / cordis.patch.yml / settings.yaml / .npmrc | main.mjs + lib |\n| 部署后 patch 合并回写 | 模板 patch 为基线，旧 patch 中「模板无同 id」条目（用户 MCP insert / disable 等）追加回写；纯文本条目级切分（不解析 `!!js`，失败保模板）；UTF-8 无 BOM | lib `mergeUserPatch` + main.mjs |\n| 升级报告 | `~/.ssid/upgrade-report-\u003cver>.json`：丢失插件清单（声明层，不自动重装——避免旧版插件在新内核白屏）、合并条目数、快照路径 | lib `buildUpgradeReport` + main.mjs |\n| pending 护栏 | 消费前比对当前声明：pending \u003c 声明（或声明缺失/非 registry 形态）→ 丢弃并清 tgz，绝不回滚（本机 dsh-sidebar-qa@0.4.2 雷被此规则消化） | kernel.ts + lib `shouldDropPending` |\n| 部署失败/取消兜底 | isUpgrade 失败或取消后：闭包锚点（profile/node_modules/@deepseek-ai/dsh）存在 → 维持旧版启动；缺失 → splash 明确阻断提示，不再走到「无法定位运行时」崩溃 | main.mjs |\n| 残留清理防御 | `.deploy.new/.deploy.old` 清理包 try/catch：被占用时仅日志（历史会未捕获抛异常崩在启动最早期） | main.mjs |\n\n`lib/profile-merge.mjs` 为纯 ESM 零依赖（main.mjs 主进程与 kernel.ts/esbuild bundle 共用）；单测 `tests/profile-merge.spec.ts` 13 例（patch 切分/合并/增量/semver/护栏/快照/报告）全绿；`npm run typecheck` 通过；`npm run bundle-kernel` 产物已含新逻辑。\n\n## 3. 设计取舍\n\n- **MCP 自动合并、插件不自动重装**：MCP 条目是纯配置（无版本/兼容风险）→ 合并保留；插件声明层丢失后自动重装 = 把「旧版插件 × 新内核」的白屏风险直接灌回 → 只进报告，引导用户从插件中心装兼容版。\n- **合并失败保模板**：任何异常返回模板原文（绝不写坏 profile patch），仅日志。\n- 用户「disable 了出厂条目（如 mcp-playwright）」的偏好：合并规则以出厂模板为准（disable 同 id 不保留）——出厂基线恢复优先，文档记录此边界。\n\n## 4. 验证\n\n- L1：13 单测全绿 + `npm run typecheck` + `bundle-kernel` 产物含 `shouldDropPending`。\n- L2（待执行，三环境流转：发版预演 `SSID_DEV_DEPLOY=1` 在 SSiD dev 上）：\n  1. 预置用户 MCP 条目 + 用户插件声明 → 建 `dsh-runtime.tar.gz`（手改后重建）→ 部署 → 断言 `cordis.patch.yml` 含用户条目、报告生成、插件清单正确；\n  2. pending 雷：`index.json` 留 dsh-sidebar-qa@0.4.2 → boot → 断言清单被清、实体仍 0.5.0；\n  3. 部署失败（模拟占用）→ 无闭包锚点 → splash 阻断文案（而非崩溃）。\n\n## 6. 补充（2026-09-07 用户确认）：office 插件恢复预制\n\n- 初版排查把 `@huanlin/dsh-plugin-better-sidebar-plugin-office` 归为「用户自装」——**纠正**：它是 v0.1.x 时代的**预制清单成员**（8-19/8-29/9-2 三份预制清单均含，0.1.0→0.1.2），v0.2.0 发布时被主动移除（release note「预制列表清理（不再维护的第三方插件）」）。\n- 移除理由已失效：作者 2026-09-04 发布 **0.2.0**（仍在维护）；且 web 端 rc.1 已实装 0.2.0（9-6 插件中心 0.1.2→0.2.0 的「不兼容」标注为保守判定，实测可用）。\n- **恢复预制**（用户拍板）：`profile-template/package.json` dependencies + bundles 加回 `@huanlin/dsh-plugin-better-sidebar-plugin-office@0.2.0`（精确 pin）——下个发版归档自带；本机 profile 装回需在 SSiD 实例退出后执行（node-pty 文件锁）。\n- 测试样例同步替换：office 不再作为「用户插件」样例，改用第三方 `dsh-taskboard`。\n\n## 7. 补充（2026-09-07 晚）：v0.2.1 发版计划审查结论（codegraph/wechat 预制）\n\n- **codegraph MCP 预制（ec45749）审查**：三处到位（deps 0.20.1 精确 pin / patch mcp-codegraph 显式 id + cwd（dsh-mcp-client StdioConfig 原生支持 cwd）/ main.mjs SSID_MCP_CG_CLI/WS 注入，WS 默认主目录）。**修正两项**：① patch `config.env` 加 `CODEGRAPH_TELEMETRY: 'off'`（匿名遥测默认开，预制必须关——README 明示 opt-out 方式）；② **引擎不在 npm 包内**（0.20.1 仅 69KB，postinstall 从 GitHub release 下载引擎 + ONNX sidecar，下载失败静默继续）→ 发版归档抽查**必加**「`node_modules/@astudioplus/codegraph-mcp/bin/codegraph-server-*.exe` 存在」断言；release notes 说明首次使用可能联网/低内存自动 graph-only（\u003c1.5GB），勿宣传「直接可用」。\n- **dsh-wechat（6a32659）审查**：`^0.9.1` → **改精确 pin `0.9.1`**（模板其余第三方全为精确 pin，归档确定性）。\n- **跨会话并发事实**：多次 git add -A 交叉提交（本会话 main.mjs 修复被卷进 ec45749、office 模板改动被卷进 6a32659）——内容无冲突但提交主题混杂；**发版前 git status + git diff 复核**，release notes 按内容分组（修复/预制），不按 commit 主题。kernel.ts（pending 护栏）/lib//tests/ 仍为未提交，发版 commit 得带上。\n\n## 8. 补充（2026-09-07 深夜）：0.2.1 修复失效实证——insert 子条目级漏网（v0.2.2 修复）\n\n- **用户实证**：另一台电脑 0.2.1 安装版覆盖 0.2.0 后，用户自装 MCP **仍全部丢失**（0.2.1 已含 92446d5 的护栏与 main.mjs/lib 修复——不是没带代码）。\n- **根因（复现实锤）**：用户 MCP 是被**追加进既有 `- insert:` 列表的第三个子条目**（面板/插件中心的标准做法，顶层仍是同一个 insert 块）。第一版 mergeUserPatch 只做**顶层条目级**对比：旧 patch 的 insert 块整体 id=第一个子条目（mcp-playwright）→ 与模板同 id → 整块判定「模板已有」→ **用户子条目被丢弃**（复现：merged=0、mcp-user-custom 丢失）。只有「独立顶层 insert 块」形态（形态 B）能保住（复现 merged=1 保留）。\n- **修复**（lib/profile-merge.mjs `mergeUserPatch` 重写）：**子条目级**对比——把模板与旧 patch 的 insert 块都 `splitChildEntries` 到子条目（`- \u003ckey>:` 形态判定，**排除 args/env 里的 `- !!js`/`- '字符串'` 列表项**——首次实现把 args 当子条目导致虚高合并 4 条）；用户新增子条目并入模板 insert 块尾部；非 insert 顶层条目维持原逻辑；任何异常保模板。单测 15/15（新增「追加子条目」与「模板无 insert」两用例）+ typecheck + round-trip（单块、子条目序 [playwright, codegraph, user]、无 BOM）全绿。\n- **现状处置**：用户那台电脑的 MCP 注册已被 0.2.1 覆盖，但 0.2.1 部署时**快照已拍**——`~/.ssid/profile-backups/\u003c旧指纹>-\u003cts>/cordis.patch.yml` 含升级前原始 patch（用户 MCP 条目可对照找回，面板重加）；自动保留从 0.2.2 起生效。\n- **教训**：patch 合并的粒度必须到「insert 块内子条目」级；测试必须用**真实模板形态**（多子条目 + args 表达式/字符串）而不是理想化样例。\n\n### 8.1 对抗审查（2026-09-07 深夜，修复后自查）\n\n- **P1 真 bug（已修）**：`mergeUserPatch` 未剥离 **UTF-8 BOM**——旧 patch 若被编辑器写成带 BOM（首行即 `- insert:`、无头注释）→ `\\uFEFF- insert:` 被条目切分误判为非条目行 → 整块（含用户 MCP）再次全丢。修复：入口 `replace(/^\\uFEFF/, '')`（oldText + templateText）。\n- **P2 边界（已确认安全，记录）**：① 模板有多个 insert 块时用户子条目并入**最后一个**块（当前模板仅 1 块）；② 子条目判定 `- \u003ckey>:` 不约束缩进层级——若未来某插件 config 含「数组对象带 id 字段」的嵌套结构会被误切（当前 mcp-client config 全为标量/列表，无此形态）；③ 模板顶层若出现 disable 条目，其子行 id 会进入 tmplChildIds（暂无此形态）。\n- 对抗用例（+3，共 18）：BOM 头无注释旧 patch、多用户 MCP 子条目顺序、用户子条目内 args `!!js`/字符串完整保留。全套：18/18 + typecheck + 真实 v0.2.0→v0.2.1 复现（两形态均保留）+ round-trip（单块、序 [playwright, codegraph, user]、无 BOM）。\n\n## 5. 后续建议（未在本轮）\n\n- 升级报告的 UI 呈现（dsh-ssid-panels「关于 SSiD」提示徽章 / 启动通知）——当前仅文件 + 日志。\n- 部署前「旧实例占用检测」主动提示（现在靠失败后 hint + 阻断兜底，可再提前）。\n"},{"file":"2026-09-06-chat-rail导航条TypeError与投影串写根因.md","date":"2026-09-06","slug":"chat-rail导航条TypeError与投影串写根因","title":"chat-rail 导航条点击报错：TypeError 根因 + chatRail 投影跨会话串写（2026-09-06）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-chat-rail","dsh-v0","dsh-chat-rail"],"summary":"dsh-chat-rail/src/client/index.tsx jumpToMessage() 解构类方法后裸调： Session.loadThrough 是类方法（packages/api/session-controller/src/client/sessions/session.ts:390）， 内部读 this.openState（第 391 行）→ this 为 undefined","bytes":9504,"lines":138,"body":"# chat-rail 导航条点击报错：TypeError 根因 + chatRail 投影跨会话串写（2026-09-06）\n\n> 状态：进行中（推断 · 2026-09-12）\n\n> 用户报「web 版 dsh 导航条点击报错」，定位与修复记录。\n> 环境：web 端（3080，`bin.ts web` 源码模式，checkout @ dsh-v0.1.2-rc.1）；插件 `@max-null/dsh-chat-rail@0.6.0`。\n\n## 一、主 bug：TypeError（已修复 ✅）\n\n### 现象\n\n```\nclient.js:2049  [Violation] Permissions policy violation: unload is not allowed...\nsession.ts:391  Uncaught (in promise) TypeError: Cannot read properties of undefined (reading 'openState')\n    at loadThrough (session.ts:391:14)\n    at jumpToMessage (index.tsx:922:11)\n    at onClick (index.tsx:1478:9)\n```\n\n### 根因\n\n`dsh-chat-rail/src/client/index.tsx` `jumpToMessage()` 解构类方法后裸调：\n\n```ts\nconst jumpLoadThrough = session.loadThrough   // ← 解构\n...\nawait jumpLoadThrough(targetSeq)              // ← 裸调用，this === undefined（ESM 严格模式）\n```\n\n`Session.loadThrough` 是类方法（`packages/api/session-controller/src/client/sessions/session.ts:390`），\n内部读 `this.openState`（第 391 行）→ `this` 为 undefined 即抛 TypeError。栈行号与源码逐行吻合\n（`session.ts:391` / `index.tsx:922` 调用点 / `index.tsx:1478` 点击处理）。\n\n### 修复（max-null-plugins/dsh-chat-rail）\n\n- `src/client/index.tsx`：改为方法调用 `jumpSession.loadThrough(targetSeq)`（this 正确绑定到 session 对象）。\n- `tests/client-nodes.spec.ts`：新增回归测试「invokes loadThrough as a method so the session this stays bound」\n  ——修前红（有效捕获）、修后绿。\n- L1：`pnpm test` 38/38、`typecheck` 绿、`pnpm build`（tsdown）成功。\n- 运行时实体同步：源码 `lib/client.js(+.map)` → `~/.dsh/profiles/web` 与 `~/.dsh/profiles/ssid` 的\n  `node_modules/@max-null/dsh-chat-rail/lib/`（三处 hash 一致）。\n- L2 实测：Playwright 打开 3080 页面 → 打开「助手中心开发」会话 → 点击导航条消息项 →\n  **console 0 error**（原必现 TypeError 消失）。\n\n## 二、次级问题：chatRail 投影跨会话串写（未修复，根因在内核 host 侧 ⚠️）\n\n### 现象\n\n点击导航条不再报错，但出现：\n\n```\n[chat-rail] jumpToMessage: node \"13:input-messagef3c8d0bf-…\" not loaded after loadThrough(8)\n```\n\n（跳转探测失败 → 不滚动；且 rail 显示「ssid更新内核/来文档了/你重启就行」3 条不属于当前会话的消息。）\n\n### 证据链（全部实测）\n\n| # | 事实 | 证据 |\n|---|---|---|\n| 1 | 当前会话（session-3d86ef56…「助手中心开发」，8/24 起）真实用户消息 11 条：seq 18381「全家桶中还有哪些…」/ 32484「社区有没有定时任务」/ 36015… / 88295「记忆与人格层」/ 90043 / 94217 / 95509 / 97265 / 106624「开干」 | `session/page` 全量窗口（beforeSeq=139915, max=200），source.kind=user 过滤 |\n| 2 | 该会话日志**不存在** 9/5 16:05-16:26 的任何事件（按 time 区间全量扫描 0 命中），**不存在** id=f3c8d0bf 的消息 | `session/page` records 窗口（2634 条）按 time/id 过滤 |\n| 3 | rail（导航条）显示 9 条 = **[9/5 16:05-16:26 的 3 条 {seq 8/25411/66609, id f3c8d0bf/811f71af/21fb1de5}（rc.1 升级会话）] + [8/24-25 的 6 条真实消息（seq 88295-106624）]** | DOM `crl_item` 逐一读取（时间标签 1天前/8-25 与缓存一致） |\n| 4 | 该会话投影缓存 `session_projcache/sessions/session-3d86ef56…json` 的 `rows.chatRail` 与 rail 内容**完全一致**（ver=6, seq=139914）；**其他行（title/todos/plan/turnOutline 等 23 行）全部正常**（title=\"助手中心开发\" ✓） | 直接读 JSON |\n| 5 | 删除该缓存文件 → 刷新页面 → **rail 复现同样 9 条**（非磁盘脏残留，宿主侧**每次打开会话实时生成**） | Playwright 实测 |\n| 6 | 全盘扫描所有 `session_projcache/sessions/*.json`：**没有任何文件**含 id=f3c8d0bf | node 脚本 |\n\n### 结论\n\n- **数据错在宿主侧**：打开「助手中心开发」会话时，host 端对 `chatRail` 投影单元做冷重建/折叠时，\n  其事件流中**混入了另一个会话（9/5 16:05-16:26 的 rc.1 升级会话）的 3 条 user/message 事件**，\n  且异常地排在本会话消息之前（客户端 messages 数组 = [异会话 3 条] + [本会话尾部 6 条]）。\n- **非 chat-rail 的 bug**：它的数据源（`useProjection('chatRail')`）与宿主投影 checkpoint\n  （其余 23 行正确）之间出现单元级错位；目标 key/seq 在本会话不存在 → 客户端任何跳转策略都无法命中。\n- **修复归属**：`deepseek-harness` 官方库 host 侧（`packages/session/{session-projection,session-projection-cache}`\n  的冷重建/事件源拼接路径）——按工作区规则**只引用不改**，需反馈上游或由用户决策（是否在 SSiD dev\n  侧进一步定位到具体 host 行号 / 打本地补丁）。\n\n### 建议\n\n1. **反馈上游**：根因描述 = 打开会话时 chatRail 投影 fold 事件流混入异会话事件（仅影响单投影单元，\n   其余 checkpoint 行正常；删缓存可复现）。\n2. 用户侧临时手段：无（缓存删除无效，问题在运行时生成侧）。\n3. 后续可在 SSiD dev 环境（能重启、能加日志）打 host 侧日志，定位冷重建时事件源拼接的确切路由。\n\n## 二·补 2026-09-07 复核：串写未重现（缓存已为正确 12 条）⚠️ 修正性证据\n\n> 9/6 结论「每次打开会话实时生成串写」需按本节修正定级：**已观察到的是一次可复现的异常，\n> 当前缓存/日志层已一致为正确数据，未再重现**。\n\n### 复核操作\n\n1. **原始日志逐条核对**（多帧 zstd 解码：frame magic `28 B5 2F FD` 逐帧切分后 `zstdDecompressSync`；\n   6646 帧 / 8910 行）：会话 3d86ef56 的 `user/message`（source.kind=user）事件 = **12 条**：\n   seq 8 / 18381 / 32484 / 36015 / 44730 / 77371 / 88295 / 90043 / 94217 / 95509 / 97265 / 106624\n   （首条 time=1787589516330，尾条 106624「开干」）。\n2. **当前投影表缓存**（`~/.dsh/storages/session_projcache.json`，tables.sessions[3d86ef56].rows.chatRail，\n   ver=6 seq=139913）的 messages = **12 条，与日志逐条一致**（id/time/text 全对）——**9/6 的\n   「9 条 = 3 异会话 + 6 本会话」组合已不存在**。\n3. 9/6 的串写版本存档仍在 `session_projcache/sessions.bak-2026-09-06/session-3d86ef56-….json`\n   （可复查：ver=6 seq=139914，9 条）。\n4. 缓存自愈时间窗：9/6 晚（删缓存复现 9 条）→ 9/7 0:46（首次读取时已 12 条正确）。期间 web host\n   持续运行 + SSiD dev 首启（0:42）+ 会话文件同步（0:48）——**未定位到确切自愈触发方**。\n5. **局限**：12 条正确结论基于「日志层 + 投影缓存层」静态核对；SSiD dev UI 无法打开该会话\n   （侧边栏列表窗口限制 + 名称搜索无全文索引），web(3080) 端 token 不可得，**未做 UI 层复测**。\n\n### 定级修正\n\n- 9/6：**可稳定复现**的串写异常（删缓存后刷新复现），影响单投影单元。\n- 9/7：**未重现**；缓存已正确。列入「疑似竞态型异常（与特定打开时序/并发会话活跃有关）」，\n  反馈上游时按「竞态 + 待稳定复现配方」描述，**不再断言必现**。\n- 机理候选（代码已核对）：投影 restore 为 per-session 事件流 + seq 连续校验（不跨会话喂事件）；\n  植入点候选 = session-persistence `readFrom(id, floor)` 或 cold-read 调用方的事件窗口拼接\n  （`packages/session/session-projection-cache` / `packages/api/session-controller` 冷路径），\n  待 host 侧日志定位。\n\n## 二·补二 2026-09-07 跳转四件套（插件侧闭环 ✅，非本文件主案）\n\n- 用户大会话实测暴露四项：近距也先加载 / 首条点击无效 / 滚到后仍显示加载中 / rail 滚动条闪现。\n- 归属结论：**均非 DSH 升级 bug**——插件侧缺陷被 rc.1 的 `loadThrough` 跳转 API + 异步窗口装配\n  「放大」：①无官方 `TurnNavigator` 的 loaded/unloaded 二分（适配瑕疵）②`scrollToRow` 的\n  `target\u003c0 return` 使文档头部行（首条）无法落位（长会话必现，测试盲区——上轮 L2 只验\n  「不报 TypeError」未验「滚到位」）③busy 状态覆盖跳转全程（含滚动后稳定性验证）④CSS 滚动条\n  随粘性 busy 行闪现。\n- 参考（官方）：`packages/client/ui-chat/src/client/chat/{ChatView.tsx,TurnNavigator.tsx}` 的\n  `navigateToTurn`（loaded→`anchorElement`+滚动；unloaded→`loadThrough`）；\n  锚点 key 规则 `conversationContextKey`（`${kind.length}:${kind}${id}`——**13:input-message 未变**）。\n- 修复与完整证据链见插件仓库\n  `max-null-plugins/dsh-chat-rail/docs/verification/验证记录-2026-09-07-chat-rail修复链L2.md`\n  （回归测试 +4、41/41、L2 实测 scrollTop/loading/scrollbar 数据、0.6.1 发版清单）。\n\n## 三、涉及文件\n\n- `max-null-plugins/dsh-chat-rail/src/client/index.tsx`（修复 + 行号 909-922）\n- `max-null-plugins/dsh-chat-rail/tests/client-nodes.spec.ts`（+1 回归测试）\n- `max-null-plugins/dsh-chat-rail/lib/client.js`（构建产物，已同步 web/ssid profile 实体）\n- `C:\\Users\\MaxNull\\.dsh\\storages\\session_projcache\\sessions.bak-2026-09-06\\session-3d86ef56…json`（串写缓存备份）\n"},{"file":"2026-09-06-DSH-web内核升级-rc.1参考文档.md","date":"2026-09-06","slug":"DSH-web内核升级-rc.1参考文档","title":"DSH web 内核升级 0.1.2-rc.1 参考文档（2026-09-06）","statusRaw":"已归档（2026-09-12 · 被 2026-09-06-web升级-rc.1执行记录.md 取代；原状态：记录（推断 · 2026-09-12））","statusKind":"已归档","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh","dsh-web","dsh-0","dsh-v0","dsh-client-runtime","dsh-observations","#3456"],"summary":"- [ ] web 页面可打开（master 内核 web 服务带 token 认证——从启动日志 dsh web: http://127.0.0.1:\u003cport/?token=… 取带 token 的 URL；裸 URL 会 401） - [ ] 标题栏/关于信息显示 DSH 内核版本 = 0.1.2-rc.1 - [ ] 插件/工具/设置页功能抽查（rc.1 与 alpha.5 的 API 差","bytes":5327,"lines":79,"body":"# DSH web 内核升级 0.1.2-rc.1 参考文档（2026-09-06）\n\n> 状态：已归档（2026-09-12 · 被 `2026-09-06-web升级-rc.1执行记录.md` 取代；原状态：记录（推断 · 2026-09-12））\n\n> **⚠️ 修订说明（2026-09-06 晚）**：本文档 §0 现状盘点经实测修正——web(3080) 实为 **deepseek-harness**\n> 宿主（进程启动时加载 alpha.1，checkout 已 rc.1），**DSHfork 并非运行宿主**（无 node_modules/dist，无法承载）。\n> 升级已由 SSiD 会话执行完毕（见《2026-09-06-web升级-rc.1执行记录.md》）；本文档 DSHfork 步骤保留仅作参考。\n\n\n> 任务背景（大计划第 3 步）：SSiD 已发版 v0.2.0（DSH 内核 rc.1，官方 checkout + 安装版闭环）；\n> 现在把**日常开发宿主 web(3080)** 从 alpha.5 时代（DSHfork master）升到 **rc.1**，\n> 与 SSiD 安装版对齐。本文为**操作参考**（按 AGENTS.md 三环境流转纪律，**web 主体操作由用户执行**；\n> 当前会话在 web 上运行，仅做只读探查与文档，不启停任何实例）。\n\n## 0. 现状盘点（已核实）\n\n| 项 | 值 |\n|---|---|\n| web(3080) 宿主进程 | `node --import tsx/esm apps/cli/src/bin.ts web`（源码模式，进程 PID 65604） |\n| 宿主仓库 | `H:\\MaxNull\\WorkStation\\DSHfork`（本地克隆；`origin`=官方、`fork`=Max-Null 分叉） |\n| 当前内核 | **master @ 49a606bc5b**（`Merge PR #3456 release/dsh-0.1.2-alpha.5-version-to-master`）→ **alpha.5 时代** |\n| 目标 | **dsh-v0.1.2-rc.1**（本地 tag 已存在，`git tag -l` 可见；与官方 checkout 同 tag） |\n| 工作区 | DSHfork `git status` 干净（无本地改动，纯跟随） |\n| 参考实现 | SSiD 安装版 v0.2.0（归档指纹 `0.2.0-0.1.2-rc.1-*`，闭包 214 overrides 全 rc.1） |\n| 间距 | DSHfork master 落后官方 origin 共 292 commits（含 alpha.5→rc.1 全部） |\n\n## 1. 升级步骤（用户侧执行）\n\n```powershell\n# ① 准备：确认干净 + 取最新官方引用\ncd H:\\MaxNull\\WorkStation\\DSHfork\ngit status                                   # 期望干净（已核实）\ngit fetch origin\ngit tag -l 'dsh-v0.1.2*'                      # 应有 dsh-v0.1.2-rc.1\n\n# ② 切到 rc.1（detached，与官方 checkout 同习惯）\ngit checkout dsh-v0.1.2-rc.1\ngit describe --tags                           # 期望 dsh-v0.1.2-rc.1\n\n# ③ 依赖对齐（rc.1 分支 lockfile，400+ 包，约几分钟；npm/pnpm 均可——\n#    DSH 仓库标准为 pnpm workspace）\npnpm install --frozen-lockfile\n\n# ④ 验证（不重启前先静态检查）\npnpm build                                    # 或 pnpm --filter @deepseek-ai/dsh build（按仓库惯例）\nnode --version                                # 期望 ≥22.13\n\n# ⑤ 重启 web 实例（旧 3080 进程收尾后启动）\n#    原启动命令不变：node --import tsx/esm apps/cli/src/bin.ts web\n```\n\n## 2. 升级后核对清单\n\n- [ ] web 页面可打开（master 内核 web 服务**带 token 认证**——从启动日志 `dsh web: http://127.0.0.1:\u003cport>/?token=…` 取带 token 的 URL；裸 URL 会 401）\n- [ ] 标题栏/关于信息显示 DSH 内核版本 = `0.1.2-rc.1`\n- [ ] 插件/工具/设置页功能抽查（rc.1 与 alpha.5 的 API 差异点：settings 三段式、client 模块表 `dsh-client-runtime` 退役等——见 SSiD 09-04 适配方案）\n- [ ] 长会话加载（alpha.4 时代实测卡死的回归点，rc.1 已修复，验证一次）\n\n## 3. 参考实现（SSiD 安装版 v0.2.0 对照点）\n\n| 项 | SSiD 侧做法 | 源码模式（DSHfork）注意 |\n|---|---|---|\n| 内核接法 | prepare-runtime 读 `DSH_CHECKOUT` checkout 的 `apps/cli/package.json`（单一来源） | 源码模式直接用 checkout 本身，无此步 |\n| 版本锁 | profile-template overrides 214 条全量 `0.1.2-rc.1`（防 npm 发布链版本漂移） | **不适用**（workspace 源码互相引用，无 npm 解析） |\n| 依赖范围缺陷 | 官方若干包 `dsh-* @ \">=0.1.2 \u003c0.2.0-0\"` 匹配不到 rc 预发布 → overrides 强制 | **不适用**（源码模式下 pnpm 走 workspace）——但**对外发布/安装出包**仍需 overrides 手法 |\n| 插件适配 | 自研 3 插件按 rc.1 settings 三段式 + 测试 L1 全绿 | DSHfork 不预装插件，无此工作；**rc.1 API 差异**见 SSiD 方案文档 |\n\n## 4. 风险与回滚\n\n- **回滚**：`git checkout master && pnpm install --frozen-lockfile` 后重启原命令即可（DSHfork 干净，无代码迁移）。\n- **注意**：升级后 DS 的会话数据/工作区配置不变（工作区根 `H:\\MaxNull\\WorkStation` 独立于 checkout）。\n- **web 认证**：rc.1 与 alpha.5 均带 token 认证——若历史脚本/书签使用裸 URL，需改用启动日志打印的带 token URL（SSiD smoke-ui 的 `--cdp` 模式即为此设计）。\n- **三环境纪律**：web(3080) = 当前会话主体——**升级窗口内不要启用本会话重启 DSH 的操作**；如果 3080 升级后需要重启，由用户在外部操作，本会话不主动调用。\n\n## 5. 依据与后续\n\n- 依据：官方 `dsh-v0.1.2-rc.1` release（a66e470204）+ SSiD v0.2.0 全链验证 + 09-04/09-05/09-06 决策文档。\n- 后续：升级完成后，web 与 SSiD 同内核（rc.1），后续插件/内核开发两边一致，观察站（dsh-observations）回归脚本按 rc.1 对齐。\n"},{"file":"2026-09-06-SSiD内核升级执行指南-rc.1通用范本.md","date":"2026-09-06","slug":"SSiD内核升级执行指南-rc.1通用范本","title":"SSiD 内核升级执行指南（rc.1 适配通用范本 · 2026-09-06）","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh-","@deepseek-ai/dsh","@deepseek-ai/dsh-mcp-client","@playwright/mcp","dsh-v0","dsh-ssid-panels","dsh-runtime","ssid-release","ssid-shell-setup","dsh-vx","ssid-shell","dsh-mcp-client"],"summary":"1. 定内核 tag：git tag 查官方最新（如 dsh-v0.1.2-rc.1）；git -C deepseek-harness checkout \u003ctag。 2. 前置检查：git status 干净、git log v上版本..HEAD 收集分组素材、安装目录归档备份。 3. dev profile 洁净：跑 npm start 前确认 profile 无半成品（.deploy./nod","bytes":7946,"lines":94,"body":"# SSiD 内核升级执行指南（rc.1 适配通用范本 · 2026-09-06）\n\n> 先例：v0.1.15 升级（2026-08-29 执行指南）、alpha.4 评估（2026-09-02 执行指南）。\n> 状态：已决策（推断 · 2026-09-12）\n\n> 本文把 v0.1.17(alpha.2) → v0.2.0(rc.1) 的完整适配过程固化为**可复制 SOP**：\n> 下次内核升级（alpha.5 / 0.1.3 / rc.2…）按步骤改版本号即可；坑表逐条可查。\n> 配套文档：`2026-09-04-SSiD内核升级-0.1.2-rc.1插件适配与测试体系方案.md`（前期方案）、\n> `2026-09-05-rc.1适配执行日志与复盘.md`（过程记录）。\n\n## 0. 决策与范围（先拍板再动手）\n\n| 决策点 | 本次判据（复用于后续） |\n|---|---|\n| 版本号 | 内核换版 = 里程碑 → **minor 起步**；内核 rc/正式版 + 插件语义版本发布时评估 **0.2.0 级进位**（本次 0.1.17→0.2.0） |\n| 未分发合并 | 上一版**无用户流量**（发布 \u003c24h/自测未装）→ **删除旧 release+tag、合并重打**（v0.1.10/0.1.11 先例）；不浪费新版本号 |\n| 平台策略 | mac = **单架构 arm64**（2020 后全 M 系）；双架构的 latest-mac.yml 互覆、增量更新缺架构条目——以后需要 Intel 再按「同 job 双 arch」设计重构 |\n| 上游留言 | 官方缺陷若本地已完全规避 → **不留言**（升级即规避，除非影响长尾生态） |\n\n## 1. 升级前准备\n\n1. **定内核 tag**：`git tag` 查官方最新（如 `dsh-v0.1.2-rc.1`）；`git -C deepseek-harness checkout \u003ctag>`。\n2. **前置检查**：`git status` 干净、`git log v上版本..HEAD` 收集分组素材、安装目录归档备份。\n3. **dev profile 洁净**：跑 `npm start` 前确认 profile 无半成品（`.deploy.*`/`node_modules.old*` 清理见坑表 K9）。\n\n## 2. 内核接法（单一来源 + 全量锁版）\n\n- **DSH_VERSION 单一来源** = `deepseek-harness/apps/cli/package.json`（prepare-runtime 自动读取；CI 用完整 clone 的同 tag）。\n- **overrides 全量切版**：`shell/profile-template/pnpm-workspace.yaml` **214 条 @deepseek-ai/dsh-\\* 全部换成新版本串**（**无混杂**——半切 = 闭包混版本必 boot 坏）。\n- **聚合包**：prepare-runtime `[3/5]` 注入 `@deepseek-ai/dsh@\u003cver>` + 32 个丢失 peer（精确 pin，无 `^`）。\n- **官方 rc 依赖范围缺陷规避**（K1）：官方子包依赖 `>=0.1.2 \u003c0.2.0-0` 匹配不到 rc 预发布 → 靠 overrides 强制 + 插件 peer 侧精确 pin。\n\n## 3. 插件适配\n\n- **第三方升级规则**：升到 npm 最新；本地超前以本地为准；大跳版先核实 author/peer 再 install。\n- **自研插件**（@max-null/*）：**L1 = typecheck + test 全绿**才能发；适配 rc.1 变化点优先看官方 settings 三段式（host `installSection` + client `settingsScope.bind` + `settings.plugin.item` keyed 卡片）。\n- **双处声明**：profile-template/package.json pin（新 minor 必须显式改）+（vendor 化插件的）vendor/package.json 版本号。\n- **vendor 三处同步**：plugins 源构建产物 → profile-template/vendor → dev profile vendor；`git diff --no-index` / MD5 双核对。\n- **发布**：npm publish 用户手动（F2A）；**发布必须在归档重建前**（archives 按 pin 解析）。\n\n## 4. 归档构建\n\n```powershell\ncd shell\nnode scripts/prepare-runtime.mjs   # 3-5 分钟；完成前不得动 ssid profile 的 pnpm\n```\n- **运行约束**：官方源（不设 SSID_REGISTRY）；归档约 147 MB（本版）；`.runtime-version = \u003cssidVer>-\u003cdshVer>-\u003c指纹>`。\n- **验证指纹**：`0.2.0-0.1.2-rc.1-86e1fb66` 形态（ssidVer 与 shell/package.json 一致、dshVer 与 checkout 一致）。\n\n## 5. 验证链（发版门槛，按序全过）\n\n1. **守卫单测**：`node --test shell/updater-core.test.mjs`（7）+ `node --import tsx/esm --test plugins/dsh-ssid-panels/tests/release-notes.test.ts`（3）。\n2. **归档抽查 8 项**（解包 dsh-runtime/ 后）：`.runtime-version` 前缀 / dream-skin 版本+lib / plugin-center pin / better-sidebar pin / capture lib==vendor 源 / dependencies 新 pin / vendor 三包版本 / release-notes 首行 `# vX.Y.Z`。\n3. **打包版自检**（isPackaged 分支必须实测——v0.1.14 教训）：win-unpacked 启动 → 日志 `deploy → bootKernel ok` → 骨架断言。\n4. **smoke-ui**：`node .agents/skills/ssid-release/smoke-ui.cjs --cdp \u003cport>`（打包版用 `--remote-debugging-port=9334` + CDP 模式；裸 URL 撞认证页）。\n5. **mac CI**：push tag 自动触发 build-mac（单 arm64 job）→ 成功后核对 Release 资产与 latest-mac.yml url 一致。\n\n## 6. 交付（GitHub 五件事）\n\n1. commit → push main → `git tag vX.Y.Z` → push tag（触发 mac CI）。\n2. `gh release create`（--notes-file）+ 资产上传。\n3. **资产命名**（K5）：electron-builder 产物中文名 → **英文名副本**上传（`ssid-shell-setup-\u003cver>.exe`），必须与 latest.yml/latest-mac.yml 的 url 完全一致。\n4. **大文件上传**（K8）：gh CLI 传 256MB+ 会挂 → `curl --proxy http://127.0.0.1:7897 -F \"file=@...\"`（uploads API + 数字 release id）；慢但要完成。\n5. 核对 `gh api releases/tags/vX.Y.Z` 资产清单、清理旧名残留（`gh api -X DELETE .../assets/\u003cid>`）。\n\n## 7. 坑表（本次全部，按触发频率排序）\n\n| # | 坑 | 症状 | 处理 |\n|---|---|---|---|\n| K1 | 官方 rc 依赖范围缺陷 | 干净安装 NO_MATCHING | overrides 强制 + 插件 peer 精确 pin |\n| K2 | DSH 版本漂移（CI sparse clone 默认分支） | 归档注入 `0.1.3-alpha.1` | clone 钉 `--branch dsh-vX.Y.Z` |\n| K3 | pnpm shim（CI `.bin/pnpm` 是 shell） | `SyntaxError` | prepare-runtime 只收 `.cjs` 入口 + bundled pnpm 兜底 |\n| K4 | esbuild 幽灵依赖 | mac `esbuild: command not found` 127 | bundle-kernel 的 esbuild 显式 devDep |\n| K5 | GH 中文资产名剥离 | 资产名缺中文、与 yml url 不一致 | artifactName 全英文（`ssid-shell-${version}-${arch}.*`） |\n| K6 | afterPack 钩子文件换行丢失 | `handler is not a function` | 提取仓库文件一律 node execSync 按字节（禁用 Out-File -NoNewline） |\n| K7 | mac 双 job 的 latest-mac.yml 互覆 | 增量更新缺架构条目 | 单 arch（arm64）；需 Intel 时重构同 job 双 arch |\n| K8 | gh 上传大文件挂死/404 | 256MB 上传无进展 | curl 直传（显式代理）+ 数字 release id |\n| K9 | deploy EPERM `.deploy.old` | 打包版首装失败 | 清 profile 运行时残骸（node_modules/old/old2/.upgrade-backup）走首装路径 |\n| K10 | vendor 根有非目录条目 | mac ENOTDIR | 清 vendor node_modules 前 `isDirectory()` 过滤 |\n| K11 | 插件中心重复提示 | 同插件更新提示两次 | plugin-center checkUpdates 按包名去重（0.2.18） |\n| K12 | 归档后插件的「过期感」 | 用户疑「归档为何不最新」 | **归档 = 发版时刻 pin 快照**；作者新发布走插件中心一键更新；模板 pin 同步下次发版自然带 |\n\n## 8. 回滚\n\n- **未分发**：`gh release delete \u003ctag> --yes` + 删远端 tag（`git push origin :refs/tags/\u003ctag>`）+ 本地 `git tag -d`；force tag 新 commit 重触发 CI。\n- **已分发**：发补丁版本（合并重打原则：无用户流量才算未分发；有流量走新版本号）。\n- **运行时**：版本指纹不一致 → 下次启动自动重部署；profile 坏 = 清残留走首装（K9）。\n\n## 9. 固化的通用约定（本次拍板，后续遵循）\n\n- 插件生态更新**不进 SSiD 版本**——插件中心一键更新 + 模板 pin 同步（下次发版归档自然最新）。\n- MCP 管理列表 = mcp-client loader 条目（cordis.patch.yml `name: '@deepseek-ai/dsh-mcp-client'` 行）；模板预置 playwright（`@playwright/mcp@0.0.80`），纯净 profile 空列表是设计而非缺陷。\n- dev 裸跑隔离：dev 跳过归档部署、就绪信号 = 内核实体（`@deepseek-ai/dsh`）——清预设不再触发回灌死循环。\n"},{"file":"2026-09-06-web升级-rc.1执行记录.md","date":"2026-09-06","slug":"web升级-rc.1执行记录","title":"DSH web(3080) 升级 0.1.2-rc.1 执行记录（2026-09-06）","statusRaw":"已完成（推断 · 2026-09-12）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@changfenhuang/dsh-genui","@max-null/dsh-chat-rail","@max-null/dsh-draft-polish","@max-null/dsh-plugin-center","@deepseek-ai/dsh-telemetry","dsh-web","dsh-v0","dsh-capture","dsh-quick-toolbar","dsh-ssid-panels","dsh-genui","dsh-chat-rail"],"summary":"关键结论： 1. web 服务端进程仍跑 alpha.1（比参考文档猜的 alpha.5 更旧），前端 dist 已是 rc.1（混合态）。 2. 内核侧升级只差重启 web 进程（checkout 源码与 dist 均已就绪，无需重新构建）。 3. DSHfork 观察站不动（非运行宿主；如需 web 独立观测库另议，见待办）。","bytes":5378,"lines":68,"body":"# DSH web(3080) 升级 0.1.2-rc.1 执行记录（2026-09-06）\n\n> 会话：SSiD 会话（三环境流转：升级 web 用 SSiD 操作）——与参考文档《2026-09-06-DSH-web内核升级-rc.1参考文档.md》配套。\n\n> 状态：已完成（推断 · 2026-09-12）\n\n## 0. 现状澄清（实测，修正参考文档 §0）\n\n| 项 | 参考文档（09-06 早） | 实测（本会话） |\n|---|---|---|\n| web 宿主仓库 | DSHfork（master @49a606bc，alpha.5 时代） | **deepseek-harness**（页面 assets hash 与 `apps/web/dist` 完全一致：`index-Df-65__b.js` 等四文件）；DSHfork 无 node_modules、无 apps/web/dist，**不可能承载运行实例** |\n| web 进程 | PID 65604 | PID 65604（一致）命令行 `node --import tsx/esm apps/cli/src/bin.ts web`，启动 **2026-09-04 23:29:45** |\n| 进程加载的源码 | alpha.5 | **dsh-v0.1.2-alpha.1**（reflog：09-04 23:27 切到 `cd5ef81481`=dsh-v0.1.2-alpha.1，23:29 启动） |\n| checkout 现状 | — | HEAD=**dsh-v0.1.2-rc.1**（09-05 02:32 切换）；`apps/web/dist` **09-05 02:38 全量构建**（rc.1 产物，页面加载正常） |\n\n**关键结论**：\n1. **web 服务端进程仍跑 alpha.1**（比参考文档猜的 alpha.5 更旧），**前端 dist 已是 rc.1**（混合态）。\n2. 内核侧升级**只差重启 web 进程**（checkout 源码与 dist 均已就绪，无需重新构建）。\n3. DSHfork 观察站不动（非运行宿主；如需 web 独立观测库另议，见待办）。\n\n## 1. 已执行（插件升级，文件侧）\n\n### 1.1 vendor 同步（web profile）\n- `~/.dsh/profiles/web/vendor/dsh-capture`：0.2.1 → **0.3.0**（源：ssid vendor，robocopy /MIR）\n- `~/.dsh/profiles/web/vendor/dsh-quick-toolbar`：0.8.5 → **0.8.6**\n- `dsh-ssid-panels/release-notes.md`：v0.1. 类错误——rc.1 全量构建产物完整）\n  5. ✅ **长会话加载回归**：8.3M tok 历史会话（「DSH Store上游Commit复检阻断处理」）加载完整（8 轮 · 67 步），无 alpha.4 式卡死；chat-rail 0.6.0 画卷导航正常渲染\n  6. ✅ 插件 API 全 200（chat-rail / quick-toolbar / sidebar / ssid-panels / draft-polish / context-doctor / achievements / genui）\n  7. ✅「插件更新」弹窗消失（plugin-center 0.2.18 = 最新；此前 0.2.17→0.2.18 提示）\n  8. ✅ 截图留痕：`web-rc1-long-session.png`、`web-rc1-main.png`（Playwright 输出）\n- **记录在案**：插件中心「更新 1」= huanlin/dsh-plugin-better-sidebar-plugin-office **0.1.2→0.2.0 标注「不兼容当前 DSH」**——第三方大版本，保持 0.1.2 不动（plugin-center 保守判定，不强行升级）。\n\n## 3. 风险与回滚\n\n- **回滚声明**：`package.json.pre-rc1-20260905162259` + `.bak-vendor-20260906/` 恢复 → pnpm install → 重启。\n- 进程级回滚无需：运行中 web 实例不受文件侧变更影响（启动时已加载）；重启后才切换。\n"},{"file":"2026-09-05-rc.1适配执行日志与复盘.md","date":"2026-09-05","slug":"rc.1适配执行日志与复盘","title":"rc.1 适配执行日志与复盘（2026-09-05）","statusRaw":"已完成（推断 · 2026-09-12）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh","@max-null/dsh-chat-rail","@max-null/dsh-capture","@max-null/dsh-quick-toolbar","@max-null/dsh-memory","@deepseek-ai/dsh-mcp-client","@astudioplus/codegraph-mcp","dsh-v0","dsh-chat-rail","dsh-settings","dsh-session-projection","dsh-capture"],"summary":"1. 内核：官方 checkout 定稿 dsh-v0.1.2-rc.1；prepare-runtime.mjs 注入 @deepseek-ai/dsh@0.1.2-rc.1 + 32 个缺失 peer（DSHVERSION 自动读取，实测归档 .runtime-version = 0.1.18-0.1.2-rc.1-\u003c指纹）。 2. 闭包锁定：profile-template/pnpm-work","bytes":3882,"lines":35,"body":"# rc.1 适配执行日志与复盘（2026-09-05）\n\n> 状态：已完成（推断 · 2026-09-12）\n\n## 执行记录\n\n1. **内核**：官方 checkout 定稿 `dsh-v0.1.2-rc.1`；`prepare-runtime.mjs` 注入 `@deepseek-ai/dsh@0.1.2-rc.1` + 32 个缺失 peer（DSH_VERSION 自动读取，实测归档 `.runtime-version = 0.1.18-0.1.2-rc.1-\u003c指纹>`）。\n2. **闭包锁定**：`profile-template/pnpm-workspace.yaml` overrides 214 条 `0.1.2-alpha.2 → 0.1.2-rc.1`（无其他版本串混杂，一次性替换）。\n3. **插件适配**（L1 = typecheck + test 全绿门槛）：\n   - @max-null/dsh-chat-rail **0.6.0**：settings 迁移到新卡片（三段式）、rc.1 peer 加固（dsh-settings 精确 pin `0.1.2-alpha.5`、dsh-session-projection `^0.1.2-alpha.2`）；测试 **37/37**。\n   - @max-null/dsh-capture **0.3.0**：截图组件设定迁移（settings 卡片，与另两插件同一范式）；测试 **4/4**。\n   - @max-null/dsh-quick-toolbar **0.8.6**：悬浮球官方设计；侧栏/底栏图标 better-sidebar 官方同款；测试 **68/68**。\n4. **npm 发布**：三个插件均由用户手动执行（F2A），registry 确认为 0.6.0 / 0.3.0 / 0.8.6。\n5. **vendor 同步**：capture / quick-toolbar / ssid-panels 三处（plugins 源 → profile-template/vendor → dev profile vendor）`git diff --no-index` + MD5 双核对一致；ssid-panels release-notes.md 随版同步。\n6. **dev 验证**：dev profile 全族 rc.1（@deepseek-ai/dsh、dsh-settings、dsh-web-app = 0.1.2-rc.1）；MCP Tab 显示 playwright + codegraph（均运行中，握手成功）。\n7. **隔离设计（main.mjs，2 处）**：\n   - profile 就绪信号：预设插件（@max-null/dsh-memory）→ **内核本体（@deepseek-ai/dsh）**——清预设不再触发「归档回灌 → 依赖报错 → 回灌」死循环。\n   - dev 裸跑：`!app.isPackaged` 时跳过归档部署（归档只服务安装版交付；dev profile 由本地 pnpm 独占维护；首启 profile 由 kernel.ts initProfile 建立）。安装版首启/升级部署逻辑不变。\n8. **MCP 检测机制验证**：MCP 管理列表 = mcp-client loader 条目（cordis.patch.yml `name: '@deepseek-ai/dsh-mcp-client'` 行）。dev 空列表根因 = patch `[]`（纯净设计），非机制 bug；补 playwright 预置 + 安装 @astudioplus/codegraph-mcp 实测：新增 loader 行重启后自动 spawn、initialize/tools-list 握手完成（`Client: dsh-mcp-client 0.0.1`）。\n\n## 坑与解法（复盘）\n\n| 坑 | 现象 | 解法 |\n|---|---|---|\n| 官方 rc.1 依赖范围缺陷 | 若干子包 `>=0.1.2 \u003c0.2.0-0` 匹配不到 rc.1 预发布 → 干净安装 NO_MATCHING（capture 装包被堵） | 插件侧 peer 精确 pin；闭包侧 overrides 强制 rc.1 |\n| pnpm 11 单包 overrides 不生效 | 只在多包 workspace 根生效；单包 `overrides` 无效 | **junction 借链**：capture/node_modules → chat-rail/node_modules（+ tsconfig paths 5 个 @deepseek-ai/* 指向 chat-rail 实体）；vitest 同样借 deepseek-harness/nm |\n| capture TS2717 webServer 重复 | 本地 `declare module` 增强与官方类型重复 | 删除本地增强（官方类型经 paths 解析） |\n| MCP 管理列表为空 | dev profile patch `[]` | 澄清语义（列表 = loader 条目）后补 playwright；**非发布缺口**（模板本就预置 mcp-playwright 行） |\n| dev 被归档回灌干扰 | 清预设 → 自动回灌 → 依赖报错死循环 | main.mjs 隔离设计（就绪信号 + dev 跳过部署） |\n| 官方 rc.1 npm 发布链版本杂糅 | dsh 族存在 alpha.3/4/5/rc.1 多版本 | 全部显式 pin：插件 peer 精确、模板 overrides 强制、dev install 以 lockfile 固化 |\n\n## 未决事项 → 已结案（2026-09-06 拍板）\n\n- 官方 rc.1 依赖范围缺陷**不向上游留言**：老用户升级 v0.1.18 即规避（overrides + peer pin 已内置闭包，升级时自动重部署）。\n"},{"file":"2026-09-04-SSiD内核升级-0.1.2-rc.1插件适配与测试体系方案.md","date":"2026-09-04","slug":"SSiD内核升级-0.1.2-rc.1插件适配与测试体系方案","title":"SSiD 内核升级 0.1.2-rc.1 插件适配与测试体系方案（2026-09-04）","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh","@deepseek-ai/dsh-","@max-null/dsh-chat-rail","@max-null/dsh-capture","@max-null/dsh-quick-toolbar","dsh-v0","dsh-chat-rail","dsh-settings","dsh-session-projection","dsh-capture","dsh-quick-toolbar"],"summary":"- 官方发布 DSH 内核 0.1.2-rc.1（npm 族 @deepseek-ai/dsh@0.1.2-rc.1 等，含本地源码 tag dsh-v0.1.2-rc.1）。 - SSiD 上一版（v0.1.17）内核为 0.1.2-alpha.2；本版目标：升级 rc.1 并完成自研插件适配后发版。 - 期间评估过 alpha.4：实测大历史会话加载卡死（净负收益），回滚 alpha.2；最终","bytes":3781,"lines":47,"body":"# SSiD 内核升级 0.1.2-rc.1 插件适配与测试体系方案（2026-09-04）\n\n> 状态：记录（推断 · 2026-09-12）\n\n## 背景\n\n- 官方发布 DSH 内核 **0.1.2-rc.1**（npm 族 `@deepseek-ai/dsh@0.1.2-rc.1` 等，含本地源码 tag `dsh-v0.1.2-rc.1`）。\n- SSiD 上一版（v0.1.17）内核为 0.1.2-alpha.2；本版目标：**升级 rc.1 并完成自研插件适配后发版**。\n- 期间评估过 alpha.4：实测大历史会话加载卡死（净负收益），回滚 alpha.2；最终定稿 rc.1。\n\n## 内核接法\n\n- 源码模式：deepseek-harness checkout 固定 `dsh-v0.1.2-rc.1` → `prepare-runtime.mjs` 从 `apps/cli/package.json` 自动读取 `DSH_VERSION=0.1.2-rc.1`（单一来源）。\n- 闭包版本锁定：`profile-template/pnpm-workspace.yaml` overrides 214 条 `@deepseek-ai/dsh-*` 全局 pin（v0.1.17 时代为 alpha.2，本版改 `0.1.2-rc.1`），防聚合包/子包版本漂移。\n\n## 风险与对策：官方 rc.1 依赖范围缺陷\n\n- 现象：官方若干子包依赖声明 `\">=0.1.2 \u003c0.2.0-0\"`，而 rc.1 是预发布版本（`0.1.2-rc.1 \u003c 0.1.2`），semver 范围匹配不到 → 干净安装 NO_MATCHING。\n- 对策（分层）：\n  1. 归档闭包：overrides 214 条强制 rc.1 家族（如上）。\n  2. 自研插件：consumer 侧按需精确 pin 官方 peer（例：`@max-null/dsh-chat-rail@0.6.0` peer `dsh-settings: \"0.1.2-alpha.5\"` —— rc.1 发布链中 settings 的最新可解析版；`dsh-session-projection: \"^0.1.2-alpha.2\"` 范围可覆盖 rc.1）。\n  3. 开发装包：junction 借链 + tsconfig paths（见执行复盘）。\n\n## 插件适配范围与范式\n\n- 对象：@max-null/dsh-chat-rail（0.6.0）、@max-null/dsh-capture（0.3.0）、@max-null/dsh-quick-toolbar（0.8.6）。\n- rc.1 设定 API 形态：官方 `settings` 宿主三段式（host `settings.installSection(ctx, NS, Config(schemastery z), config, {setSource,onChange})` + client `settingsScope.bind({namespace:NS})` + `settings.plugin.item` keyed 卡片，卡片样式 = 官方白卡 12px、header/desc、IconChevronDownOutline14、cardOpen 底 layer-2、家族开关 40×22）。\n- 迁移原则（用户拍板）：**「把设置迁移到新位置」**——三个插件设置一律迁到 settings 新卡片；参数少的用内置卡片（ppp 三段式），参数多的保留独立页（plugin-center / memory-manage 先例）。\n- 非设置项：quick-toolbar 悬浮球按官方设计方案、侧栏/底栏图标用 better-sidebar 官方同款（框+实心内条）。\n\n## 测试体系（tests/plugin-adapt，纳入 shell workspace）\n\n- 定位：SSiD 插件实机适配回归（连 dev 运行中实例，默认 CDP `127.0.0.1:9222`）。\n- 断言四层：\n  - L1 Boot 健康：页面就绪、无 `Failed to load plugins`、console 0 error/exception（导航前注册捕获）。\n  - L2 界面契约：`data-slot`/`aria-label` 锚点、`style[data-plugin]` 注入、布局顺序（横向 bbox 比较）。\n  - L3 功能可用：真实交互闭环（点击 → toast/结果）。\n  - L4 样式契约回归：按钮行 computed style 快照 vs 基线 JSON（`pnpm baseline` 更新；像素截图路线判定不可行，见 README 已知坑）。\n- 基线入库：签名变化需人工确认后重生成；截图用例排在 toast 触发用例之前、`caret:'hide'`。\n- 服务面：L1 全绿为发版门槛（typecheck + test 全绿）。\n\n## 发布面\n\n- 三个自研插件：npm 发布（用户手动 F2A）+ vendor 三处同步（plugins 源 / profile-template/vendor / dev profile vendor；`git diff --no-index` 与 MD5 双核对）。\n- 归档：`prepare-runtime.mjs` 重建（官方 registry，不设 SSID_REGISTRY——rc.1 已上官方 npm）。\n- 老用户升级：版本指纹不一致 → 自动重部署（约 30 秒可跳过）。\n"},{"file":"2026-09-02-DSH-alpha2到alpha4-上游变更清单.md","date":"2026-09-02","slug":"DSH-alpha2到alpha4-上游变更清单","title":"DSH 0.1.2-alpha.2 → 0.1.2-alpha.4 上游变更清单（2026-09-02）","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh-experimental-code-runtime-python","@deepseek-ai/dsh-session","dsh-alpha2","dsh-experimental-code-runtime-python","dsh-session","#3186"],"summary":"- CPython 子进程后端（c388169cff + ~130 跟进修复）：新包 packages/experimental/code-runtime-python（@deepseek-ai/dsh-experimental-code-runtime-python， private）；fd-3 帧协议、SIGXCPU 重置/软限钳制、RLIMIT 预算门 （maxLogBytes/maxVal","bytes":7747,"lines":109,"body":"# DSH 0.1.2-alpha.2 → 0.1.2-alpha.4 上游变更清单（2026-09-02）\n\n> 状态：记录（推断 · 2026-09-12）\n\n> 拉取总结（基于全部 338 个 non-merge 提交的实际 diff 阅读，非标题推断）。\n> 拉取布局：主工作区 `deepseek-harness/` 保持 alpha.2（运行环境）；官方主线在独立\n> worktree `H:\\MaxNull\\WorkStation\\deepseek-harness-alpha4`（master @ 4e84901e64）。\n> 规模：338 提交（feat 18 / perf 22 / fix 132 / docs 68 / test 64 / refactor 13 /\n> chore 11 / ci 3 / revert 2 / release 2 / cleanup 1 / style 1），\n> 2901 文件 +39496 / -31644。\n\n## 新增功能\n\n- **CPython 子进程后端**（c388169cff + ~130 跟进修复）：新包\n  `packages/experimental/code-runtime-python`（`@deepseek-ai/dsh-experimental-code-runtime-python`，\n  private）；fd-3 帧协议、SIGXCPU 重置/软限钳制、RLIMIT 预算门\n  （maxLogBytes/maxValueBytes 载入即校验）、同组进程 reap、输出按序列化成本计量；\n  053d17f6a1 整体迁入 experimental，d6bd5eb973 限界解释器版本探测，7f84a825c9 定稿 provider 契约。\n- **全会话 turn rail**（7e2eacb1fe / b3064cca77 / 6af1ee49b1 / 3a834fe6c9）：新包\n  `session-turn-outline`（每 turn 号 / start seq / 首提示预览投影，挂 web-app bundle）；\n  ui-chat 固定间距可滚动 turn rail 与 load-and-jump；218bb7f645 在 `ISession` 新增\n  **`loadThrough(seq)`** 深历史分页（共享 low-water 重定向 + no-progress 守卫）；\n  0e63841189 settled-response 预览、b7053eba79 限界超大预览块。\n- **web fetch 默认暴露**（0a0f9e59ff + cf7b0bd5a4 + ca723d9273）：base/headless/sdk-app\n  的 `tool-web` 行 `fetch: false → true`（Web 禁用该行、按 agent preset 组合）。\n- **PTC preset 去掉 workflow**（0cdcc9c3c5）：Web ptc preset 禁用 `tool-workflow` 行\n  （`workflow-worker-thread` 与 `ralph` 保留），Standard/Creator 不变。\n- **subagent steer 图像交付**（7c38fd8102 + ec493c2db8 + 53f5418a72）：turn 关闭窗口内的\n  steer/跟进改新 turn 认领；可继续子代理跟进接受图片部件（宿主先准入持久化再入 inbox；\n  模型拒图则拒交付）；queue dock 渲染图片缩略图；fixes #3186。\n- 其他：4df85c85ff PR open 初始化 Issue 开始日期（`.github/issue-management/policy.mjs`）；\n  2480bdf27a Workspace Write 中文文案；7020c7e122/3ce5604a71 超级椭圆圆角 + 发丝线\n  elevation 描边。\n\n## 修复（代表性）\n\n- ff21366916 输入机 Tab 完成高亮命令（候选 drill 动作优先）\n- 25e4527f5e + 5257c75092 llm profile headers 按 Fetch 可表示性校验（不可表示即配置错误拒绝）\n- 49bf26a794 网关 WebSocket 心跳改 2 次 missed 才断开（`stream-server.ts` 的\n  `MAX_MISSED_HEARTBEATS`），慢主机不再误判掉线\n- 7222e17dc0 `read_image` 接受无扩展名附件路径（`sniffImageMediaType` 文件签名识别，\n  `INVALID_IMAGE` 诊断带路径）\n- 1dd3e60f50 + d8e2ac5052 流式代码围栏增量渲染（`CodeBlock.tsx` / `highlight.ts` /\n  `incremental.ts` 重构）\n- 2e21d210a5 trajectory 替换窗口重锚；39b90961c7 / 62f707bb1d / db5417ff6f jump 与\n  分页器所有权；32d681f023 空恢复模型选择保留；d7abd0a01e 空白会话先激活选中视图再 blank 门控\n\n## 重构与性能优化\n\n- **27bf1039db refactor(session)!（breaking）**：`packages/util/brand` 新增 `brandNumber`；\n  `@deepseek-ai/dsh-session/types` 引入 **`SessionSeq`**（事件序号）与 **`SessionLogOffset`**\n  （log 偏移/前缀长）双品牌；`SessionEvent.seq`、`SurfaceOp.replace.start/end`、\n  `sourceEventSeqs` 全部品牌化；`SessionHeader.seedLength?` → **`isSeeded: boolean`**，\n  `CreateSessionOptions.meta.seedLength` → `isSeeded` + `inheritedEventCount`；\n  物理 JSONL v0 行仍存可选 `seedLength`（向后兼容读）。\n- **4553c9d957 refactor(session)!（breaking）**：删除整个 `session-persistence-sqlite` 包\n  （codec/schema/store/sql/压缩字典），会话持久化只留 JSONL。\n- **5660f44d29（连带 bcfec8d1c3 / 47e6448e23）（breaking）**：`Session.events` getter\n  删除 → **`eventAt(seq)`** + **`snapshotEvents(fromSeq, toSeqExclusive)`** 半开区间快照；\n  `Session.seeded` 新布尔字段。\n- **4203317e18 perf(client)**：`ConversationNodeAssembler` 按需物化 target——\n  `activeTargets()` 更名 **`activityTargets()`**、新增 `activateTarget(target)`；\n  未激活 target 不建 builder/snapshot；buildLocationData 回传上次 publication，\n  未变则原样返回。\n- **perf(chat)**：e32437d18b 滚动几何采样节流 500ms + `scrollend` 终采样\n  （`SCROLL_SAMPLE_INTERVAL_MS`）；0e90d47d19 `ChatNodeList` memo 跳过稳定 order 映射；\n  c809098b06 / 5934201109 streaming publication 合并到 2→3 帧；\n  81431381d6 / 2ab37e9558 location projection 复用与 trajectory 先分页再渲染；\n  faa61ada74 视口外语法高亮延迟；8478de9b0e 工具体格式化延迟到展开；86c6d9345e 等。\n\n## 插件生态影响（升级前必读）\n\n1. **Session 读取 API 破坏**：任何调用 `session.events` 的插件必须改为\n   `snapshotEvents()` / `eventAt()`；`seeded` 字段取代隐式判断。\n2. **类型品牌化**：`SessionSeq` / `SessionLogOffset` 改变公开签名（运行时仍是 number，\n   但 TS 编译期强制品牌），`@deepseek-ai/dsh-session` 消费者需重新类型化。\n3. **Client observable 契约收紧**（b8a19413e9）：`ChatNodeSource` / `ChatNodeProcessSource`\n   的 `getSnapshot` / `subscribe` 必须是 readonly 函数属性而非类方法；\n   **`InboxState.claimed` → `currentClaimed`**（拒绝的 claim 不再分类后续消息）。\n4. **注入面新增**（577f0cf7d9）：slot 注入契约新增 **`keyedHooks` compartment**\n   （`KeyedHooksSources = Record\u003cstring, KeyedStandardSource>`），合成\n   `use\u003cName>(key, selector?)` 键控选择器 hooks；`bindInjectHooks` → `bindInjectSources`；\n   chat 节点订阅源改为 keyed 形态（scoped-slots / ui-slots 同步）。\n5. **session-projection 事件语义**：ceadd90e71 identity 门控（视图 Object.is 相同不推送）\n   + 9069a8b6f8 每步视图比较（不存 dedup baseline）；acc23f6d9c 的 viewKey token 已被\n   a2437db180 回退——最终形态是 \"per-step raw-view gate\"。\n6. **Assembler 激活语义**：第三方 View 通过自身订阅激活 target（`activateTarget`），\n   未激活无快照；`activeTargets` 只反映已物化快照；turn-rail 依赖新\n   `session-turn-outline` 投影单元。\n7. **工具面**：base/headless/sdk 默认新增 `web_fetch`（匿名 fetch 仅公开 HTTP(S)），\n   Web 按 preset 组合不受影响；PTC preset 的 `workflow` 绑定移除。\n\n## 其他\n\n- docs / notes 双语文档海量同步（config-catalog、module-graph、子系统文档）。\n- CI 加固：161c6591be 首个 gate 失败即停、a074e6131f 超时与 store-scan 降本、\n  e2ef25b06e Windows 零构建覆盖率、4032a0a428 ReFS block-clone。\n- 两个 release 提交（a9e185f205 / 14bab4422b）为全包版本号提升，无 CHANGELOG 变更。\n- 依赖锁与第三方 notices 同步。\n\n## 备注\n\n- 主 checkout 曾因 `git pull` 在 alpha.2 分支上短暂被快进至 alpha.4，已\n  `git reset --hard 0a53fb55be` 恢复；最终布局 = 主工作区 alpha.2 + worktree alpha.4。\n- 仓库遗留 2 条旧 stash（`ds-harness-remote trustedHosts 适配（alpha.1 时代）`、\n  `fix-3198-resume-seq-gap: temp: switch to official master`），非本批产物，待人工裁决。\n- 在 alpha.4 上运行前需在 worktree 内 `pnpm install`；建议随 SSiD 下一次内核升级窗口\n  统一适配（全景 breaking 见「插件生态影响」）。\n"},{"file":"2026-09-02-SSiD内核升级-alpha.4执行指南.md","date":"2026-09-02","slug":"SSiD内核升级-alpha.4执行指南","title":"SSiD 内核升级执行指南：DSH 0.1.2-alpha.2 → 0.1.2-alpha.4（2026-09-02）","statusRaw":"已归档（2026-09-12 · 被 2026-09-04-SSiD内核升级-0.1.2-rc.1插件适配与测试体系方案.md 取代；原状态：进行中（推断 · 2026-09-12））","statusKind":"已归档","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh","@deepseek-ai/dsh-","@max-null/dsh-node-appearance", 包仅 `code-runtime-python`（experimental/private 不发布）\n  与 `dsh-session-turn-outline`（官方 web-app bundle 以 **dependencies** 引用 → 闭包自动拉入）。\n\n## 3. 改动清单（本次）\n\n### 3.1 ssid dev profile（`~/.dsh/profiles/ssid/package.json`）\n1. 全部 `@deepseek-ai/dsh-*` 依赖：`0.1.2-alpha.2` → `0.1.2-alpha.4`（30 个，精确 pin，node 写 JSON）\n2. `dsh-context`：`0.38.5` → `0.40.1`\n3. `@max-null/dsh-node-appearance`：`0.3.4` → `0.3.5`\n4. `@max-null/dsh-chat-rail`：`0.5.1`（2026-09-01 已完成，实体已同步）\n5. `@max-null/dsh-plugin-center`：`0.2.17`（已最新）\n\n### 3.2 profile-template（`shell/profile-template/package.json`，双处声明铁律）\n1. `dsh-context`：`0.38.5` → `0.40.1`\n2. `@max-null/dsh-plugin-center`：`0.2.16` → `0.2.17`\n3. `@max-null/dsh-node-appearance`：`0.3.5`（已一致）；`@max-null/dsh-chat-rail`：`0.5.1`（已一致）\n4. 内核族不在 template（prepare-runtime 注入），无需改\n\n### 3.3 执行前置\n- 备份：`package.json.pre-alpha2-$(date)`（回滚用）\n- **pnpm install 必须等 SSiD 实例完全退出**（node-pty 原生模块被 SSiD 内核占用 →\n  `ERR_PNPM_EPERM`，2026-09-01 chat-rail 升级实踩）。\n\n## 4. 启动验证清单（SSiD 重启后逐项）\n\n1. 壳正常 boot（无 `Failed to load plugins` / pending waiting for service）。\n2. `~/.dsh/profiles/ssid/.runtime-version`（dev 未部署）或日志确认内核 = 0.1.2-alpha.4。\n3. 插件中心：bundles 无 failed；node-appearance 0.3.5 / context 0.40.1 / plugin-center\n   0.2.17 / chat-rail 0.5.1 显示无更新提示。\n4. 功能抽查（按 2026-08-29 指南 §4 清单）：会话管理面板、插件中心 toggle、SSiD 面板\n   （习惯/Guardian/上下文医生）、better-sidebar 双面板动画、**chat-rail 导航跳转**（上次修复点）。\n5. 大会话长跳转（多页补载）与 turn rail（α.4 官方新增全会话 turn rail——与 chat-rail 导航并存，确认无遮挡/重复）。\n6. console 0 error。\n\n## 5. 风险与回滚\n\n- **breaking 面**（α.2→α.4 变更清单「插件生态影响」）：`session.events` → `snapshotEvents/eventAt`\n  （@max-null 全家桶未用 `events`——chat-rail 用 getSnapshot/loadOlder，已核）；`InboxState.claimed` →\n  `currentClaimed`；注入面 `keyedHooks`。若插件出现上述 API 报错，按变量名定位修复。\n- **better-sidebar 0.18.0-alpha.0 在 α.4 的运行时兼容**为最大不确定项（作者未发 α.4 适配版）；\n  异常时记录并等待作者版本或临时屏蔽（官方 turn rail 与 chat-rail 已覆盖导航能力）。\n- 回滚：恢复 `package.json.pre-alpha2-*` → `pnpm install` → 重启 SSiD 即回 α.2 闭包。\n\n## 6. 执行记录（2026-09-02，web 会话）\n\n- **停止 SSiD dev**（authorized：dev 验证对象可操作）→ `pnpm install` 14.2s（+238 包，\n  node-pty 顺利通过——上次 EPERM 卡点随 SSiD 关闭解除）→ 实体校验全过：\n  `@deepseek-ai/dsh 0.1.2-alpha.4`、`dsh-context 0.40.1`、`@max-null/dsh-node-appearance 0.3.5`、\n  `@max-null/dsh-chat-rail 0.5.1`、`@max-null/dsh-plugin-center 0.2.17`、\n  `dsh-better-sidebar 0.18.0-alpha.0`（保持）、`@deepseek-ai/dsh-session-turn-outline 0.1.2-alpha.4`\n  （官方 bundle dependencies 自动拉入，闭包不缺失 ✅）。\n- **重启 SSiD dev**（`npm start`）：`phase start() completed`、`loadURL ok`、内核端口 3082 HTTP 200；\n  本次启动日志 0 Error（历史段的 typert-registry 导入失败为 alpha.2 时代旧记录）；\n  `[sidebar-diag]`、`[theme-observer]` 正常 → better-sidebar 已运行。\n- **内核选择确认**：dev 模式走 `bootKernel` 部署锚点分支（`DSH_CHECKOUT` 进程/User/Machine 级\n  均无残留；`profile/node_modules/@deepseek-ai/dsh` 存在）→ 实测运行 **npm 0.1.2-alpha.4 实体**\n  （非并列源码 alpha.2）。\n- **待用户目视确认**：插件中心版本号/无 failed、SSiD 面板（习惯/Guardian/上下文医生）、\n  chat-rail 导航跳转、官方 α.4 新增 turn rail 与 chat-rail 并存无遮挡、console 0 error。\n\n## 7. 回滚记录（2026-09-02 下午）\n\n- **结论**：α.4 在 SSiD 上为净负收益——打开**大体积旧时代历史会话**（19MB/1MB 级，\n  8/18-8/31 各项目目录会话）时进入「载入历史…」后长时间不渲染（20s+ 未见消息行，\n  伴随 1 处 400），升级前 α.2 无此现象（用户确认「α.2→α.4 有点崩」）。\n  新会话（609KB，升级后创建）打开正常；文件层/索引/请求链路经 20+ 探针验证全部健康。\n- **回滚矩阵**（恢复 8/31 已验证组合）：@deepseek-ai/dsh 及子包 31 个 `alpha.4 → alpha.2`、\n  `dsh-context 0.40.1 → 0.38.5`、`@max-null/dsh-node-appearance 0.3.5 → 0.3.4`\n  （两处声明已同步；template 的 plugin-center 0.2.17 / chat-rail 0.5.1 保留——与内核无关）。\n- **关键坑（pnpm 11 版本漂移）**：只有 top-level 声明 pin 是不够的——官方 bundle 的\n  `workspace:^` 依赖在 npm 上解析为 `^0.1.2-alpha.x`，会把闭包内 183 个官方子包拉到\n  **npm 最新版（alpha.4）**，与 top-level α.2 混合 → boot 报\n  `@deepseek-ai/dsh-attachment does not provide an export named 'admitPromptContent'`\n  （混合不一致的经典症状）。8/31 正常是因为当时 npm 最新 = α.2（α.3 于 9/1 00:20 才发布）。\n  **修复**：以 8/31 归档（dsh-runtime.tar.gz，214 包全 α.2）为基准生成\n  `@deepseek-ai/dsh-*` 枚举 overrides（**pnpm 11 的 overrides 必须写在\n  `pnpm-workspace.yaml`，package.json 的 `pnpm.overrides` 已不生效**）→ install\n  后实体扫描 214/214 全 α.2 → boot 成功。\n- **执行结果**：SSiD boot ok / start() completed / 全插件挂载 / 0 error；\n  历史会话（插件更新批量，8/31）点开 12s 内 rows=37 完整渲染 ✅；\n  数据零丢失（sessions-ssid 会话目录完整）。\n- **执行**：SSiD 关闭后 `pnpm install`（ssid profile）→ 重启 → 用户验证历史会话恢复。\n- **α.4 后续**：本轮变更已沉淀为两份文档（本节 + 2026-09-02-DSH-alpha2到alpha4-上游变更清单）；\n  根因（大历史会话重放/400）留待 alpha4 worktree 专项研究，SSiD 基线保持 α.2。\n"},{"file":"2026-09-01-chat-rail-0.5.1发版与SSiD同步.md","date":"2026-09-01","slug":"chat-rail-0.5.1发版与SSiD同步","title":"chat-rail 0.5.1 发版与 SSiD 同步（2026-09-01）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-chat-rail","dsh-chat-rail"],"summary":"DSH 0.1.2-alpha.2（SSiD v0.1.17 起的内核）把 Conversation 目标数据移出 Session 快照： session.getSnapshot() 不再携带 chat.nodes，Chat 节点迁入 uiConversation 服务的 'chat' 视图目标（ChatSnapshot.nodes keyed store）。chat-rail 0.5.0 在新内","bytes":2163,"lines":37,"body":"# chat-rail 0.5.1 发版与 SSiD 同步（2026-09-01）\n\n> 状态：进行中（推断 · 2026-09-12）\n\n## 背景\n\nDSH `0.1.2-alpha.2`（SSiD v0.1.17 起的内核）把 Conversation 目标数据移出 Session 快照：\n`session.getSnapshot()` 不再携带 `chat.nodes`，Chat 节点迁入 `uiConversation` 服务的\n`'chat'` 视图目标（`ChatSnapshot.nodes` keyed store）。chat-rail 0.5.0 在新内核上\n「点击导航跳转失效」：加载探测读死字段 → 翻页到 `hasMore` 耗尽仍放弃 → 不滚动\n（`[chat-rail] jumpToMessage: node … not loaded after N page(s)`）。\n\n## 修复与发版（dsh-chat-rail 仓库）\n\n- `0c3b0de` fix：双数据通道适配——`uiConversation.binding(id).target('chat')` 优先，\n  旧 `chat.nodes` Map 兼容回退；`jumpToMessage` 改用 `nodeOf` 实时探测；\n  collect/tip 读取同步适配。新增 `tests/client-nodes.spec.ts`（11 例，34/34 全绿）。\n- `b26ec57` release: v0.5.1（package.json + `docs/release-notes-v0.5.1.md`），tag `v0.5.1` 已推送。\n- L1：typecheck ✅ / test 34/34 ✅；L2（web 环境用户实测）：跳转正常 ✅。\n\n## 发布分工（既定惯例）\n\n- 代理（本会话）：版本 bump、构建、GitHub 提交/tag `v0.5.1`、SSiD 模板同步 —— ✅ 已完成。\n- 用户：`npm login` 后手动 `npm publish`（npm 2FA，代理 E401 无法代发）。\n- **发布后待办**：\n  1. `~/.dsh/profiles/web` 与 `~/.dsh/profiles/ssid` 的 package.json 声明\n     `0.5.0`（或 `^0.5.0`）→ `0.5.1` + `pnpm install`（web 当前为 dev 热更新形态，\n     与本发布同代码；install 后即与 npm 一致）。\n  2. SSiD dev profile 复验（下次归档/发版走正常流程，无需 pre-release 动作）。\n\n## SSiD 同步范围（本次）\n\n- `shell/profile-template/package.json`：`@max-null/dsh-chat-rail` `0.5.0` → `0.5.1`（精确版本）。\n- 未动 `minimumReleaseAgeExclude`：2026-08-22 起 `minimumReleaseAge: 0` 已关闭年龄保护，\n  该名单仅历史遗留（参见模板 pnpm-workspace.yaml 注释）。\n- 未动 SSiD 版本号（v0.1.17 未发；本次为依赖 patch 同步，随下次发版归档）。\n"},{"file":"2026-08-29-DSH-master插件适配测试报告.md","date":"2026-08-29","slug":"DSH-master插件适配测试报告","title":"DSH master 插件适配测试报告","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-29","dateNote":null,"tags":["@deepseek-ai/dsh-base","@deepseek-ai/dsh-web-app","@deepseek-ai/dsh-client-runtime","@deepseek-ai/dsh-client-modules","@max-null/dsh-","@deepseek-ai/dsh-client-store","@max-null/dsh-plugin-center","@max-null/dsh-skill-mcp-center","@max-null/dsh-achievements","@deepseek-ai/dsh-client-ui-chat","dsh-master","dsh-base"],"summary":"- 纯净版（仅 @deepseek-ai/dsh-base + @deepseek-ai/dsh-web-app）→ 新增会话/完整对话链路正常；旧依赖（web profile 的 node-pty）AttachConsole failed 报错消失。 - 共测试 26 项插件：24 项 ✅ 适配，2 项 ❌ 不兼容，2 项 ⚠️ 有小问题。 - ❌ 共性问题：预编译 bundle 型插件（无源码","bytes":21432,"lines":154,"body":"# DSH master 插件适配测试报告\n\n- 日期：2026-08-29\n- 背景：deepseek-harness 拉取最新 master（0.1.2-alpha.1 之后），相对 SSiD 安装版内置的 0.1.1-rc.2 有大量架构变化。web 版 DSH（`dsh web`，3080）启动后出现插件加载失败、新增会话不可用等异常，需确认插件全家桶对 master 的适配情况。\n- 测试环境：`C:\\Users\\MaxNull\\.dsh\\profiles\\web`（web profile，源码模式 `node --import tsx/esm apps/cli/src/bin.ts web`），Playwright 驱动 UI 验证。\n\n> 状态：进行中（推断 · 2026-09-12）\n\n## 结论速览\n\n- 纯净版（仅 `@deepseek-ai/dsh-base` + `@deepseek-ai/dsh-web-app`）→ 新增会话/完整对话链路正常；旧依赖（web profile 的 node-pty）`AttachConsole failed` 报错消失。\n- 共测试 26 项插件：**24 项 ✅ 适配，2 项 ❌ 不兼容，2 项 ⚠️ 有小问题**。\n- ❌ 共性问题：预编译 bundle 型插件（无源码、`lib/client.js` 为 `__ModuleLoader__` 包裹的 CJS）内部 `require(\"@deepseek-ai/dsh-client-runtime/client\")`，而 master 的 client 模块表已无该 key（见根因分析）。\n\n## 测试矩阵\n\n| 类别 | 插件 | 版本 | 结果 | 说明 |\n|---|---|---|---|---|\n| 预制 | dsh-better-sidebar | 0.17.1 | ✅ | 折叠分组/设置入口「侧边卡片」正常 |\n| 预制 | better-sidebar-plugin-office | 0.1.2 | ✅ | — |\n| 预制 | dsh-sidebar-qa | 0.4.0 | ✅ | — |\n| 预制 | dsh-capture | 0.2.1 | ✅ | 输入栏「截图」按钮挂载正常；tray/热键依赖壳注入 |\n| 预制 | dsh-header-unify | 0.1.0 | ✅ | 壳端插件，web 端验证加载兼容即可（用户确认无需启用） |\n| 预制 | dsh-ssid-panels | 0.1.9 | ✅ | 「关于 SSiD」页完整：版本/通知/会话存储（独立根 183 + 共享根 184 隔离与载入/移除）/更新日志/预制插件清单 |\n| 预制 | dsh-ssid-zh-ui | 0.1.0 | ✅ | — |\n| 预制 | dsh-genui | 0.9.6 (npm) | ✅ | 渲染链路实测（agent 自动渲染测试卡片） |\n| 预制 | dsh-session-manager | 0.2.2 | ✅ | 对话管理面板完整（119 会话/未读/继续/路径）；**⚠️ 回收站加载失败** |\n| 预制 | open-sea-skin | 1.2.1 | ⚠️ | 面板/设置/开关功能正常；**❌ i18n 不跟随 DSH locale**（按钮/面板全英文，根因见下） |\n| 预制 | dsh-context-doctor | 0.6.1 | ❌ | client 模块表缺失 → 整页 Failed to load plugins（已回滚） |\n| 用户批 | dsh-memory | 0.6.0 | ✅ | 记忆面板完整（15 条全局记忆/注入预览/搜索/过滤/常驻注入开关） |\n| 用户批 | dsh-chinese-thinking | 0.3.0 | ✅ | 思考过程/回复均为中文 |\n| 用户批 | dsh-guardian | 0.2.0 | ✅ | 无拦截异常 |\n| 用户批 | dsh-chat-rail | 0.4.0 | ✅ | 消息「收藏消息」「填充到输入框」按钮挂载正常 |\n| 用户批 | dsh-habit | 0.2.0 | ✅ | — |\n| 用户批 | dsh-node-appearance | 0.3.3 | ✅ | 设置「节点外观」完整（思考开关/工具颜色/覆盖） |\n| 用户批 | dsh-draft-polish | 0.2.1 | ✅ | 输入栏「润色」按钮正常 |\n| 用户批 | dsh-plugin-center | 0.2.13 | ✅ | 插件更新弹窗正常（检测到 0.2.14） |\n| 用户批 | dsh-skill-mcp-center | 0.4.1 | ✅ | Skill & MCP 管理完整（18 skill/搜索/停用） |\n| 用户批 | dsh-achievements | 0.1.0 | ✅ | 成就面板（10/19 解锁，进度真实） |\n| 用户批 | dsh-context | 0.34.1 | ✅ | 上下文可视化全面（统计/趋势/浏览器/事件/Agent 网络/费用估算） |\n| 用户批 | dsh-video-preview | 0.1.4 | ✅ | — |\n| 用户批 | dsh-excel-panel | 0.6.1 | ✅ | — |\n| 用户批 | dsh-pocket | 1.14.5 | ✅ | 代理端口 3081 占用自动切 3082 |\n| 用户批 | ds-harness-remote | 0.4.1 | ✅ | host/client 身份就绪，与 dsh.r2049.cn 控制通道在线 |\n| 用户批 | dsh-dream-skin | 8.28.0 | ❌ | 与 context-doctor 同根因（已回滚） |\n\n## ❌ 根因分析：client 模块表演进\n\n- 旧 DSH（0.1.1-rc.2 时代）的 client bundle 通过 `require(\"@deepseek-ai/dsh-client-runtime/client\")` 获取共享运行时。\n- master 已将 client 模块体系重构为 `@deepseek-ai/dsh-client-modules`：shell 种下冻结的 `PLATFORM_MODULES` 表（React/Cordis/静态 UI 库），动态插件通过 `package.json` 的 `dsh.client` 声明 + `clientBundle()` 构建（产物 `lib/client.js`），非 baseline 请求走 `dsh.client.external` 精确声明。\n- `@deepseek-ai/dsh-client-runtime` 包在 master 已不存在（残留的 `runtime-diagnostics` README 仍引用旧名，待更新）。旧式独立 bundle 的裸 require 找不到该 key，load 失败并带着 `missed the module table` 错误；浏览器端因此整页 `Failed to load plugins`（任一加载失败均拖垮 shell）。\n- 与源码型插件（@max-null/dsh-*、npm 预编译但按新体系声明的第三方如 video-preview/excel-panel）不冲突：源码型插件重新打包时用新基线，旧 bundle 则卡死。\n\n## ⚠️ 问题细节\n\n### open-sea-skin i18n\n\n- 现象：悬浮按钮/面板文案全英文（DSH 界面语言为中文）。\n- 根因：`plugin/client.js` 的 `apply()` 创建 controller 时不传 `options.locale`；`selectCopy()` 回退 `document.documentElement.lang || navigator.language`，且面板创建时一次性选定、语言切换不刷新。\n- 修复资源：fork `Max-Null/open-sea-skin`（分支 `feat/quick-controls-enable-toggle`）的 `harness-plugin/src/client/index.ts` 已按新版架构实现 `ctx.locale.register(SETTINGS_NS, { zh, en })`（inject 含 `locale` 服务）——重建产物即可修好 i18n（同时完成旧 bundle → 新体系迁移）。\n\n### dsh-session-manager 回收站\n\n- 现象：「对话管理」面板显示「回收站加载失败」，其余管理功能（列表/未读/继续/路径）正常。\n- 疑似新 DSH 的回收站相关 API（trash/restore）结构变化；待深挖 0.2.2 源码确认。\n\n## 处理建议\n\n1. **open-sea-skin**：已本地修复（i18n 尾补丁 IIFE，见上「⚠️ 问题细节」；补丁 tgz 已同步 `~/.dsh/profiles/ssid/vendor` 与 `shell/profile-template/vendor`，下次重建 dsh-runtime.tar.gz 自动带上）。后续仍建议用 fork 源码（`Max-Null/open-sea-skin#feat/quick-controls-enable-toggle`，已实现 `ctx.locale.register`）按 master `clientBundle` 体系重建提 PR 到 d-dev01001/open-sea-skin。\n2. **dsh-context-doctor / dsh-dream-skin**：2026-08-29 追升结果——\n   - **context-doctor**：已本地完成 master API 迁移并构建 **0.6.2-master**（克隆上游 + 改 5 处：ClientContext 改 cordis、store 改 dsh-client-store、CLIENT_EXTERNALS 增删、slots augment 拉 ui-renderer、setup 链接重定向），实测 ✅（审计环/预算/四类统计全中文正常）。改动保留在 `.dsh-tmp/context-doctor-src`；**已提 PR**：[Zhenyu98/dsh-context-doctor#10](https://github.com/Zhenyu98/dsh-context-doctor/pull/10)（fork Max-Null：fix/master-client-modules，Closes #9）——上游采纳后 SSiD 归档可切回官方源。\n   - **dream-skin**：上游 main 与 npm 均为 8.28.0。本地定位到唯一旧引用 `require(\"@deepseek-ai/dsh-client-runtime/client\")`（6 处调用全部是 `defineStore`，master 的 `@deepseek-ai/dsh-client-store` 同签名且在种子表内）→ **一行替换**修好并本地验证 ✅（设置「Theme / 外观」面板完整：8 套皮肤/强调色/壁纸/透明度/主题包）。**已提 PR**：[RevolutionLA/dsh-dream-skin#42](https://github.com/RevolutionLA/dsh-dream-skin/pull/42)（fork Max-Null：fix/master-client-modules，v8.28.1，Closes #41）。\n3. **文档同步**：deepseek-harness 侧 `packages/runtime-diagnostics/invariants/README.md` 里的 `dsh-client-runtime` 旧名应更新为 `dsh-client-modules`（待上游 PR）。\n\n## 2026-08-29 升级记录（web 端追升）\n\n- dsh-session-manager 0.2.2 → **0.4.1**（npm）：✅ 功能增强（归档/移出归档/移动至工作区/迁移预设/删除会话，侧边栏「会话管理」入口）；0.2.2 的「回收站加载失败」问题消失。\n- （同日追升，插件中心清单）dsh-sidebar-qa 0.4.0 → **0.4.2**、@max-null/dsh-plugin-center 0.2.13 → **0.2.14**、@max-null/dsh-skill-mcp-center 0.4.1 → **0.4.2**、dsh-context 0.36.0 → **0.38.1**、dsh-pocket 1.14.5 → **1.16.1**：✅ 全部验证通过（context 0.38.1 上下文统计/浏览器/Agent 网络完整；pocket 代理 3082；插件中心「有更新 0」）。\n- @max-null/dsh-achievements 0.1.0 → **0.1.2**：✅（新增「收藏」成就等）。\n- dsh-context 0.34.1 → **0.36.0**：✅（上下文统计/趋势/浏览器正常）。\n- dsh-context-doctor 0.6.1 → **0.6.2-master**（本地构建）：✅ 详见上。\n- dsh-dream-skin：❌ 无新版（8.28.0 仍为最新，未适配）。\n\n## 2026-08-29 侧边栏 footer 布局修复（Remote/会话管理/设置）\n\n- **问题**：DSH master 侧边栏 footer 三个入口（Remote=ds-harness-remote、会话管理=dsh-session-manager 0.4.1、设置=官方）同排时互相挤压——会话管理被压窄成竖排文字，与官方「设置」样式不统一；收起态下 Remote 仍用 `isWide` 溢出错位（其插件自带的 `isRail` 未触发）。\n- **修复（dsh-ssid-panels client 尾补丁，v5 完整集）**：JS 从稳定类名（`.dshRemoteSidebarEntry`/`.sm-footerBtn`）向上定位官方 footer 容器并挂 `data-dsh-footer`（wide/rail，React 不覆盖 data-*）+ 注入 \u003cstyle> 规则（竖排全宽 or 图标 36px 居中、文字由 span 包裹后按 rail 隐藏）。纯 CSS 驱动（inline style 会被 React 重渲染清除，已排除）；嵌套 `:has()` 不受支持（已绕开）。\n- **实测**：展开态三行全宽横排（Remote→会话管理→设置，与官方样式对齐）；收起态三入口图标化 36px 居中、文字隐藏；无 console error。\n- 补丁集三处一致：`~/.dsh/profiles/{web,ssid}/vendor` + `shell/profile-template/vendor`（下次重建归档自动带上）。\n\n### 迭代收敛（v10–v22，图标对齐/尺寸/颜色/宽度/间距）\n\n- **展开态（wide）**：官方设置触发器自身带 `margin-left:-2px`（图标列 x=18），而 Remote/会话管理在 x=20 —— v16 给两插件行同加 `margin-left:-2px`，三方图标列统一 x=18。\n- **收起态（rail）居中根因（v17）**：`sm-footerBtn` 是 `display:flex; justify-content:center` 但含**两个** flex 子项——svg(18px) + 文本 span（宽 0 高 0 的占位，靠 `font-size:0` 藏字）+ 插件自带 `gap:6px`，整体内容盒实为 24px，居中后 svg 中心 25 vs 按钮中心 28，**偏左 3px**。官方设置/Remote 只有一个 svg 子项（gap 0）因此完全居中。修复：rail 下 `gap:0` + `> span { display:none }`（让占位 span 真正退流）。\n- **rail 图标尺寸（v18）**：v14 曾把 Remote rail 图标放大到 20px，而会话管理/官方设置是 18px，相邻三图标大小不一。统一 Remote 为 18px（与官方 rail 图标一致）。\n- **rail 图标颜色（v19）**：ds-harness-remote 自带 `.dshRemoteComputerIcon { color: var(--dsw-alias-label-secondary) }` 把图标强制为灰（svg 用 `stroke:currentColor`，按钮自身的黑色不生效）。修复：`.dshRemoteComputerIcon { color: rgb(28,28,30) !important }` 覆盖到与设置/会话管理一致。\n- **宽度与间距（v20–v22）**：①官方设置触发器的 `width:260px`（右缘 270）比另两行（256、右缘 266）宽 4px → 统一 256px；②wide 下 Remote 容器 `isWide` 自带 `margin-bottom:4px` 导致首段 8px、第二段 4px → 清 bottom margin，间距统一 4/4；rail 下 Remote/设置 margin 8/10 而会话管理 0（12px vs 8px）→ 三按钮统一 `margin:4px 0` + entry `height:auto`（官方 isRail 固定 54px 会多垫 4px），间距统一 8/8。\n- **两个 CSS 陷阱（本轮踩坑记录）**：①`data-dsh-footer` 只挂在 footerActions 上，`settingsArea` 是兄弟子树 → 针对设置按钮的规则全部静默失效，需 JS 给其单独挂 mark（稳定 class + 自身 data-dsh-footer）；②`[data-dsh-footer=\"rail\"] .EWqqVW_footerActions { gap:0 }` 用后代组合器不会匹配属性宿主自身，必须写成 `[data-dsh-footer=\"rail\"].EWqqVW_footerActions`。\n- **实测（v22 后，3080）**：wide 三按钮 x=10/w=256/右缘 266、图标 16×16@x18、黑色、间距 4/4、radius 12px、hover 背景一致 rgba(0,113,227,0.1)；rail 三按钮 36×36、图标 18×18 中心 28、黑色、间距 8/8；像素采样确认三行背景一致（透明透出 #f4f4f6）；无 console error。\n- 补丁发生器：`.dsh-tmp/patch-fix-sidebar-footer-v{10..22}.mjs`（每个追加一个幂等 IIFE style/JS 注入）。\n\n### 2026-08-29（下午）撤回 + 会话管理入口迁移到标题栏（header-unify）\n\n- **撤回**：footer 布局补丁 v1–v22 全部回滚——dsh-ssid-panels 三处 vendor（web/ssid/profile-template）恢复为插件源干净版（0.1.9，63750B，MD5 一致），footer 恢复 dsh-session-manager 0.4.1 官方样式。教训：与官方 footer 的 CSS Modules 哈希类 + 动态布局对抗成本过高（v16–v22 反复微调仍难收敛），改走\"入口迁移\"而非\"样式对齐\"。\n- **入口迁移（新方案）**：会话管理按钮从 footer 迁到「壳标题栏统一按钮组」——`dsh-header-unify`（v0.3.0）：\n  - DSH 侧：`HIDE_CSS` 加 `.sm-footerBtn { display:none !important }`（0.4.x）；`ssid:titlebar` detail=`session-manager` 桥接打开面板——优先 `.sm-footerBtn`（master 0.4.x，footer 按钮 display:none 后 JS click 仍触发 React onClick → panelStore.set(true)），兜底 `[data-dsh-header-button]`（rc.2 0.2.x header utilities 的「会话管理」按钮 → setDrawer({open:true,view:'manage'})）；另在会话 header（.sm-header）内嵌兜底按钮（web 无标题栏时用）。\n  - 壳侧：`shell/titlebar.html` 加「会话管理」按钮（btn-session-manager）+ `titlebar.js` 转发 `action('session-manager')`（main.mjs 的 `ssid:title:action` 转发本就通用字符串，无需改）。\n- **版本适配差异**：web/master 用 dsh-session-manager **0.4.1**（有 sm-footerBtn/sm-header，面板=SafePanel modal）；SSiD/rc.2 用 **0.2.2**（无 footer 按钮，header utilities 已有「会话管理」按钮 HeaderManageButton → 抽屉；稳定标识 `data-dsh-header-button`）。桥接函数双目标覆盖两版。\n- **已知待办**：dsh-header-unify 的 client.js 在 web/master 上**未激活**（rc.2 时代 `window.__ModuleLoader__.load` CJS 自注册 bundle，master Loader 不调用其 apply——v0.2 起 `toggleCluster` 隐藏就从未生效；页面无报错静默跳过）。列入「web DSH 升级测试」适配项：按 master 客户端插件规范迁移（package.json `dsh.client` schema + bundle 导出格式）。当前 SSiD（rc.2）上 v0.2 正常生效，v0.3 文件已同步三处 vendor，重启壳后生效。\n\n## 2026-08-29 用户升级计划与协作原则（原话记录）\n\n用户明确的双阶段升级计划与协作约定，后续所有工作遵循：\n\n- **双阶段升级计划（用户原话）**：「先通过 SSiD 发起会话升级 web DSH，并进行插件测试；完成后在 web DSH 开启会话升级 SSiD 并将插件更新，这样才能保证可用。」\n  - 第 1 阶段：SSiD（稳定基石）→ web DSH（试验场）：升级 master + 插件适配 + 测试。\n  - 第 2 阶段：web DSH → SSiD：确认可用后，把升级后的插件/配置回灌 SSiD。\n  - 目的：保证可用后再动 SSiD，避免把稳定环境搞坏。\n- **协作原则**：\n  - 当前会话运行在 54621（SSiD 壳）上——**不得重启/停止 54621 的任何进程**（会中断当前会话）；SSiD 保持稳定，只允许同步 vendor 文件，生效时机由用户安排。\n  - web（3080）不是当前会话宿主，可以随意重启验证。\n  - 用户对探索性尝试的反馈：「不要急」——小改动若反复不收敛，及时止损换方案（如 footer 样式对齐 → 放弃改为入口迁移）。\n- **dsh-header-unify 定位（用户澄清）**：header-unify 是 **SSiD 专属插件**，配合 SSiD 的壳（标题栏按钮组）把乱七八糟的插件按钮集成到壳的标题栏——不是给无壳的 web 用的；web 上其 master 激活问题属于第 1 阶段适配项。\n- **集成诉求（用户原话）**：「你把会话管理的按钮屏蔽了，集成到 header-unify 吧」「不要回滚 header-unify」。即：隐蔽 session-manager footer 按钮（0.4.x），入口统一到壳标题栏（v0.3 已实现）；header-unify 的改动不可回滚。\n\n## 2026-08-29（晚）web 三个插件升级（LLM 更新流程）\n\n- **dsh-dream-skin 8.28.1 → 8.29.0（vendor → switch-npm）**：本地为 vendor 8.28.1（带一行 require swap 定制）；8.29.0 发布说明含「Merge PR #42 · point defineStore require at dsh-client-store」——**本地定制已被上游采纳**（实测 8.29.0 client.js 中 `dsh-client-runtime` 出现 0 次）。依赖声明 `file:vendor\\dsh-dream-skin` → `8.29.0`，vendor 目录保留未删（可回退）。\n- **dsh-sidebar-qa 0.4.2 → 0.5.0**：插件中心标记「不兼容当前 DSH」——核实为**误判**：engines.dsh `>=0.1.2-alpha.1` 恰好等于运行时 master 源码版本 0.1.2-alpha.1；0.5.0 客户端含 13 处 `remote.session` 服务依赖，但 **master 提供该服务**（0.4.2 在 web 上运行正常即证据；SSiD rc.2 无此服务，血泪陷阱不适用于 web/master）。peer dsh-better-sidebar >=0.16.0（已装 0.17.1）✓。升级后页面加载正常、0 console error、无 pending。\n- **dsh-pocket 2.0.0 → 2.1.3**：patch 级（移动端工作区菜单 #72、iOS 触摸自适应、停止注入 dsh-desktop-* markers），peer 同 2.0.0，低风险直接升。\n- **连带发现与修复（重要）**：本轮 head-unify v0.3 在 master 上**被实际激活**（v0.2 时代在 web 上未激活——重装后 master loader 正常加载并调用 apply；SSiD 升级到 master 后必然同此）。因 v0.3 的 HIDE_CSS 会隐藏 pc-headerbtn/toggleCluster（设计给壳标题栏复制的入口），**无壳 web 上插件中心/侧栏按钮被切断**——修正：header-unify 按 `window.__SSID_SHELL__` 标志分支——壳环境（main.mjs 在 mainView dom-ready 后注入）才隐藏原按钮；无壳 web 保留。现在 web：插件中心/侧栏按钮保留 + 会话管理迁 header（footer 隐藏）+ titlebar 事件桥接均正常；SSiD：重启壳后标题栏接管行为不变。\n- **过程教训（BOM）**：PowerShell 5.1 `Set-Content -Encoding UTF8` 写 package.json 会带 BOM，DSH 的 `readProfileManifest`（JSON.parse）直接崩溃 `Unexpected token ﻿`——**改 profile JSON 一律用 node（writeFileSync utf8 无 BOM）**。已用 node 重写修复。\n- **实测（升级后 3080）**：三插件实体版本 8.29.0 / 0.5.0 / 2.1.3；插件中心「已安装」显示一致、开关状态启用；header「会话管理」按钮点击 → 面板正常；0 console error；已写入 `~/.dsh/plugin-center/llm-update-log.jsonl`。\n\n## 2026-08-29 open-sea-skin 移除决策\n\n- **原因**：open-sea-skin 导致部分面板半透明（WebGPU 背景叠加干扰面板/弹窗显示）。\n- **动作**：①web profile 卸载（依赖/bundle/vendor tgz）；②SSiD 预制清单移除（`profile-template/package.json` 的 dependencies+bundles、`profile-template/vendor` 与 `~/.dsh/profiles/ssid/vendor` 的 tgz、vendor README 条目）；③下次发版重建 dsh-runtime.tar.gz 时生效。\n- **修复不浪费**：i18n 尾补丁修复（跟随 DSH document lang，与本地一致但基于上游 1.2.1 原版字典）**已提报告原仓库**：[d-dev0101/open-sea-skin#6](https://github.com/d-dev0101/open-sea-skin/pull/6)（v1.2.2，fix/i18n-locale-follow）。注意上游正确仓库是 **d-dev0101**（非 d-dev01001）。\n- **剩余引用检查**：scripts/repack-open-sea-skin-vendor.mjs 及其在发版流程里的调用需在下次发版时移除/更新。\n\n## 2026-08-29 原生轮次导航栏屏蔽（TurnNavigator rail）\n\n- **对象**：DSH master `@deepseek-ai/dsh-client-ui-chat` 的 TurnNavigator（消息流右侧轮次导航竖轨，aria-label「轮次导航/Turn navigation」，items\u003c2 不渲染）。\n- **屏蔽方案（已生效）**：在 `dsh-ssid-panels` 的 client.js 追加尾补丁 IIFE（`dsh-ssid-hide-turn-rail` style 规则，aria-label 双文案锚点），已同步 `~/.dsh/profiles/{web,ssid}/vendor` 与 `shell/profile-template/vendor`。\n- **可借鉴设计（官方 rail 优于我们的点）**：①轮次 hover 预览（prompt/response 浮层 + 指针定位）②完整 aria（jump/turn/current）③marks 溢出压缩与 inset 布局 ④翻页锚点补偿（pagingAnchor）。局限性：仅轮次跳转，无收藏/复用。\n- **正轨跟进（待办）**：向 deepseek-harness 提 PR——ui-chat 的 `ChatSettings` 增加 `showTurnRail`（默认 true）配置，SSiD 侧设置关闭后可移除本补丁。\n\n\n\n- 3080 web 实例运行 27 个 bundle（官方 2 + 预制 9 + 用户批 16 中可用 15 + 无 context-doctor/dream-skin），无 console error。\n- web profile 备份：`~/.dsh/profiles/web/.bak-pure-20260829-111424/`（配置 + node_modules + vendor）。\n- 回滚项：dsh-context-doctor、dsh-dream-skin（bundle 与依赖均已清理，可随时按本报告恢复测试）。\n"},{"file":"2026-08-29-SSiD升级执行记录.md","date":"2026-08-29","slug":"SSiD升级执行记录","title":"SSiD 升级执行记录（web → SSiD 回灌，第 2 阶段）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-29","dateNote":"晚","tags":["@deepseek-ai/dsh","@max-null/dsh-plugin-center","@max-null/dsh-skill-mcp-center","@max-null/dsh-achievements","@playwright/mcp","dsh-master","dsh-runtime","dsh-0","dsh-session-manager","dsh-sidebar-qa","dsh-context","dsh-pocket"],"summary":"- 插件全家桶已按 web 端实体版本全量对齐（27 项依赖、28 项 bundle、5 处 vendor 三端 MD5 一致）——这是「web 确认可用后回灌 SSiD」的第 2 阶段落地。 - 内核已切到 master 0.1.2-alpha.1（dev 源码模式：思灵壳 boot 并列的 deepseek-harness checkout），smoke + Electron 壳 boot 双","bytes":9236,"lines":77,"body":"# SSiD 升级执行记录（web → SSiD 回灌，第 2 阶段）\n\n- 日期：2026-08-29（晚）\n- 执行会话：DSH web 端 3080（官方 master 源码 0.1.2-alpha.1）\n- 配套文档：`docs/决策/2026-08-29-SSiD升级执行指南.md`（执行方案）、`docs/决策/2026-08-29-DSH-master插件适配测试报告.md`（第 1 阶段 web 端测试）\n\n> 状态：进行中（推断 · 2026-09-12）\n\n## 结论速览\n\n- **插件全家桶已按 web 端实体版本全量对齐**（27 项依赖、28 项 bundle、5 处 vendor 三端 MD5 一致）——这是「web 确认可用后回灌 SSiD」的第 2 阶段落地。\n- **内核已切到 master 0.1.2-alpha.1**（dev 源码模式 /dsh-context-doctor 整体同步到 ssid/vendor**（本会话未做） |\n| dsh-dream-skin | `^8.28.0` → 8.28.0 | **8.29.0** | 本地 vendor 定制已被上游采纳（PR #42），直接 npm 版 |\n| dsh-pocket | `1.14.5` | **2.1.3** | |\n| dsh-sidebar-qa | `^0.4.0` → 0.4.0 | **0.5.0** | remote.session 依赖——**仅 master 内核有**（rc.2 无，血泪教训） |\n| dsh-session-manager | `file:./vendor/dsh-session-manager-0.2.2.tgz` → 0.2.2 | **0.4.1**（npm） | 0.2.2 无 footer 按钮；0.4.1 有（header-unify 已接管隐藏） |\n| @max-null/dsh-memory | `^0.6.0` | **0.6.0** | 已一致，核验即可 |\n| @max-null/dsh-chat-rail | `^0.4.0` | **0.4.0** | 已一致 |\n| @max-null/dsh-chinese-thinking | `^0.3.0` | **0.3.0** | 已一致 |\n| @max-null/dsh-guardian | `^0.2.0` | **0.2.0** | 已一致 |\n| @max-null/dsh-habit | `^0.2.0` | **0.2.0** | 已一致 |\n| @max-null/dsh-draft-polish | `^0.2.1` | **0.2.1** | 已一致 |\n| @max-null/dsh-node-appearance | `^0.3.3` | **0.3.3** | 已一致 |\n| @max-null/dsh-skill-mcp-center | `^0.4.1` | **0.4.2** | |\n| @max-null/dsh-achievements | `^0.1.0` | **0.1.2** | |\n| @max-null/dsh-plugin-center | `link:H:/MaxNull/WorkStation/dsh-plugin-center` | **0.2.14**（npm） | **ssid 建议也切 npm 0.2.14**（bundle-toggle 修复已在 0.2.14 中验证） |\n| dsh-better-sidebar | `^0.17.1` → 0.17.1 | **0.17.1** | 已一致 |\n| @huanlin/dsh-plugin-better-sidebar-plugin-office | `^0.1.2` | **0.1.2** | 已一致 |\n| @changfenhuang/dsh-genui | `^0.9.6` | **0.9.6** | 已一致 |\n| @max-null/dsh-capture | `file:./vendor/dsh-capture` | file: 同形态 | 核对 vendor MD5 与 web 一致 |\n| @max-null/dsh-ssid-zh-ui | `file:./vendor/dsh-ssid-zh-ui` | file: 同形态 | 核对 vendor MD5 与 web 一致 |\n| @max-null/dsh-header-unify | `file:./vendor/dsh-header-unify` | file: 同形态 | **v0.3 壳分支已同步（本会话完成，MD5 四端一致）** |\n| @max-null/dsh-ssid-panels | `file:./vendor/dsh-ssid-panels` | file: 同形态 | **干净 0.1.9 已同步（本会话完成，MD5 四端一致）** |\n| ds-harness-remote | `^0.4.1` | **0.4.1** | 已一致 |\n| dsh-video-preview | `^0.1.4` | **0.1.4** | 已一致 |\n| dsh-excel-panel | `^0.6.1` | **0.6.1** | 已一致 |\n\n### 1.2 bundles 列表\n\n两边 profile 的 `dsh.profile.bundles` **已一致**（各 28 项：官方 2 + 预制 9 + 用户 17，
