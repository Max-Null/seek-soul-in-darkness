无 open-sea-skin）。执行时 diff 确认即可。\n\n## 2. 卡点：@deepseek-ai/dsh@0.1.2-alpha.1 未发布 npm\n\n`pnpm view @deepseek-ai/dsh versions`：最新为 **0.1.1-rc.2**（0.1.2-alpha.1 是 master 源码版本，尚未发布）。SSiD 归档（`shell/scripts/prepare-runtime.mjs` 第 121 行）**从 npm 精确 pin 安装内核**，npm 没有该版本就装不上。两条路径：\n\n### 路径 A（推荐先做）：dev 源码模式——不等 npm 发布\n\nSSiD 壳的运行时选择（`shell/kernel.ts` 三级回退：DSH_CHECKOUT → 相邻源码 → 内置闭包）中，**未打包 dev 模式**下删除部署锚点即可回退到相邻源码：\n- 部署锚点：`~/.dsh/profiles/ssid/node_modules/@deepseek-ai/dsh/package.json`（存在 → 优先用闭包）\n- 操作：让内核走并列源码 = **把 `H:\\MaxNull\\WorkStation\\deepseek-harness` 作为相邻 checkout**（它就在 SSiD 仓库旁的 WorkStation 下，且已是 master 源码）；若仍被闭包拦截，临时改名为 `node_modules/@deepseek-ai/dsh` 移到备份或设置 `DSH_CHECKOUT=H:/MaxNull/WorkStation/deepseek-harness`（注意 pitfalls #5：User 级环境变量残留会劫持，用完删除）。\n- **重启 SSiD 壳后即跑 master 内核**（源码模式），然后 §3 升插件。\n\n### 路径 B（正式发版形态，需官方发布或本地发布 alpha）\n\n1. npm 发布 `@deepseek-ai/dsh@0.1.2-alpha.1`（官方流程）；或确认官方已发。\n2. `node shell/scripts/prepare-runtime.mjs`（重建 dsh-runtime.tar.gz，3-5 分钟）。\n3. 按 `docs/发版流程规范.md` + ssid-release skill：归档抽查清单（.runtime-version = `0.1.x-0.1.2-alpha.1-\u003c指纹>`、node_modules/@deepseek-ai/dsh 版本、vendor 指纹）、NSIS 打包、本机验证、GitHub tag/Release。\n\n## 3. 插件升级执行步骤（web 会话照做）\n\n```powershell\n# 0) 备份（回滚用）\nCopy-Item \"C:\\Users\\MaxNull\\.dsh\\profiles\\ssid\\package.json\" \"C:\\Users\\MaxNull\\.dsh\\profiles\\ssid\\package.json.pre-master-$(Get-Date -Format yyyyMMdd-HHmm)\" \n#   node_modules 备份大——至少备份 @deepseek-ai/dsh 与关键 vendor tgz：\nCopy-Item \"C:\\Users\\MaxNull\\.dsh\\profiles\\ssid\\vendor\\dsh-session-manager-0.2.2.tgz\" \"C:\\Users\\MaxNull\\.dsh\\profiles\\ssid\\vendor\\dsh-session-manager-0.2.2.tgz.bak\" -ErrorAction SilentlyContinue\n\n# 1) 对齐 vendor（本会话已同步 dsh-ssid-panels / dsh-header-unify；还需同步的）：\n#    - dsh-context-doctor：整个拷 web 的 vendor（0.6.2-master，包含 API 迁移后的 lib/client.js）\n#    - dsh-capture / dsh-ssid-zh-ui：MD5 核对与 web 一致（不一致则整体同步）\n\n# 2) 改 ssid profile 依赖声明（按 §1.1 表，用 node 写 JSON——PowerShell Set-Content 会写 BOM 导致 DSH 启动崩溃！）\nnode -e \"改 package.json 依赖的脚本（精确版本，不用 ^）\"\n\n# 3) 安装\ncd C:\\Users\\MaxNull\\.dsh\\profiles\\ssid\npnpm install\n\n# 4) 实体校验（node 读 node_modules/\u003cpkg>/package.json 的 version，逐包对比 §1.1 目标）\n#    特别注意：dsh-session-manager 必须从 0.2.2 → 0.4.1（vendor tgz → npm）\n```\n\n## 4. 启动验证清单（SSiD 重启后逐项）\n\n1. SSiD 壳正常 boot（无 Failed to load plugins / pending waiting for service）——**重点看 dsh-sidebar-qa 0.5.0**（remote.session；master 内核有该服务，rc.2 没有——若内核回退仍失败说明还在跑闭包）。\n2. `~/.dsh/profiles/ssid/.runtime-version`（源码模式可能无此文件；闭包模式应为 `0.1.x-0.1.2-alpha.1-*`）。\n3. 插件中心：28 个 bundle、无 failed；header-unify 条目可见（v0.1.0）。\n4. 标题栏：出现「会话管理」按钮（本会话已加 titlebar.html/js + main.mjs 壳标志 `__SSID_SHELL__`）；点击 → 会话管理抽屉（0.4.1 面板）打开；插件中心/侧栏原按钮被隐藏（壳模式行为）。\n5. footer：**无**「会话管理」按钮（被 header-unify 隐藏）；Remote/设置按钮样式官方原样（footer 布局补丁已全撤回）。\n6. 会话 header：「会话管理」按钮存在（ssid-sm-open-btn，web 无标题栏时兜底——壳里有标题栏，该按钮保留也无妨）。\n7. 功能抽查：会话管理面板（列表/归档/移动）、插件中心 toggle（header-unify 禁用/启用往返，应无「no patch row」错误）、面板（dream-skin 皮肤、习惯/Guardian/上下文医生等 SSiD 面板）、手机访问（dsh-pocket 2.1.3）。\n8. console 0 error。\n\n## 5. 风险与回滚\n\n- **壳-内核兼容性（最高风险）**：SSiD 壳（Electron main.mjs/titlebar 等）此前只与 rc.2 内核验证过。master 内核改动较大（plugin-center 通道、client 模块表等）。build 失败/功能异常先记录，`main.mjs` 兼容点（插件中心 IPC、mcp 桥、BrowserView、`ssid:title` 事件）逐一排查——**这正是路径 A 先做的意义：在开发模式下低成本暴露壳兼容问题**。\n- **回滚**：恢复 `package.json.pre-master-*` → `pnpm install` → 恢复 `.runtime-version`（删掉会强制下次重部署）→ 重启 SSiD 即回 rc.2 闭包；源码模式的 DSH_CHECKOUT 用完删除（pitfalls #5 幽灵依赖）。\n- **BOM 陷阱**：改 profile JSON 一律用 node（`writeFileSync(p, JSON.stringify(obj, null, 2) + '\\n', 'utf8')`）；PowerShell 5.1 `Set-Content -Encoding UTF8` 会写 BOM，DSH `readProfileManifest` 直接崩（2026-08-29 实测）。\n- **版本声明**：保持精确 pin（无 ^），与 web 端声明形态一致。\n\n## 6. 本会话已就位（54621 会话完成，web 会话无需重做）\n\n1. dsh-ssid-panels 三处 vendor（web/ssid/profile-template）恢复**干净 0.1.9**（footer 补丁 v1-v22 全部撤回，MD5 四端一致）。\n2. dsh-header-unify **v0.5**（三处 vendor 同步）：\n   - **全环境隐藏**（v0.5 起，不再限定壳环境）：插件中心 header 按钮（pc-headerbtn）+ better-sidebar 的 toggleCluster（底栏/侧栏右上按钮）+ `.sm-footerBtn`——悬浮快捷工具栏（插件中心/侧栏/底栏/会话管理）全环境接管这些入口（隐藏后 JS .click() 仍触发）。\n   - `ssid:titlebar` detail=`session-manager` 桥接打开会话管理（0.4.x 走 `.sm-footerBtn`，0.2.x 走 `[data-dsh-header-button]` 双目标；**桥接支持 toggle——再点关闭**，关闭经面板 modal 头部「关闭」按钮，已实测开→关→开）。\n   - **悬浮快捷工具栏**（v0.4+）：可拖拽移动（localStorage 持久化）、可展开/收起；i18n（v0.4.2，跟随 document.documentElement.lang，中文=「思灵快捷工具栏」）。\n3. 标题栏「会话管理」按钮（titlebar.html + titlebar.js）+ main.mjs 转发（通用）。\n4. 决策文档 `docs/决策/2026-08-29-DSH-master插件适配测试报告.md`：完整测试矩阵、撤回记录、升级记录、用户计划与协作原则。\n"},{"file":"2026-08-28-session-manager加入预制.md","date":"2026-08-28","slug":"session-manager加入预制","title":"dsh-session-manager 加入 SSiD 预制（2026-08-28）","statusRaw":"进行中（部分结论已被 2026-08-29-SSiD升级执行记录.md 取代 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@changfenhuang/dsh-genui","dsh-session-manager","dsh-session-manager-0","dsh-dream-skin","dsh-context","dsh-video-preview","dsh-genui","dsh-context-doctor","#14"],"summary":"- 用户要求：dsh-session-manager 加入 SSiD 预制插件。候选 6 个（hkkz9522/dream12347/Semidia/WSL043/wsxwj123/wuxiangru915），用户选定 dream12347（功能最全：删除回收站/恢复/彻底清除、归档恢复、活动统计、继续/暂停、未读标记、工作区分组排序、上下文压缩阈值）。 - npm 现状：dsh-session-","bytes":3886,"lines":47,"body":"# dsh-session-manager 加入 SSiD 预制（2026-08-28）\n\n> 状态：进行中（部分结论已被 `2026-08-29-SSiD升级执行记录.md` 取代 · 2026-09-12）\n\n## 背景与决策\n\n- 用户要求：`dsh-session-manager` 加入 SSiD 预制插件。候选 6 个（hkkz9522/dream12347/Semidia/WSL043/wsxwj123/wuxiangru915），用户选定 **dream12347**（功能最全：删除回收站/恢复/彻底清除、归档恢复、活动统计、继续/暂停、未读标记、工作区分组排序、上下文压缩阈值）。\n- **npm 现状**：`dsh-session-manager`（npm）是 **hkkz9522 的 0.1.2**，dream12347 **未发布 npm**——只能走 GitHub 源码 → tgz → **file: vendor** 模式（open-sea-skin 同款）。\n- **本地已验证**：ssid profile `node_modules/dsh-session-manager` 实体 **0.2.2 已存在**（用户测试通过），且 **lib 含 nav-bubble 定制**（settings nav 齿轮→会话气泡 Lucide message-circle，已在上游 adfd547 #14 合入）。\n- **当前脱链状态**（核实）：实体在 node_modules，但 **profile package.json 的 dependencies / bundles / pnpm-lock 均无它** ——归档重建（prepare-runtime 重装 node_modules）后即丢失。\n\n## 接入方案（open-sea-skin 同款三步）\n\n1. **vendor tarball**：以本地已验证实体为源 `npm pack` → `dsh-session-manager-0.2.2.tgz` → `shell/profile-template/vendor/`\n   - 以**测试版实体**为源（0.2.2、nav-bubble 定制）——与用户测试产物一致；上游仓库 lib 为更新构建（多 28 行），但未经本地测试，暂不追平（后续可升级）。\n2. **profile-template**：\n   - `dependencies` 加 `\"dsh-session-manager\": \"file:./vendor/dsh-session-manager-0.2.2.tgz\"`\n   - `dsh.profile.bundles` 加 `dsh-session-manager`（宿主插件靠 cordis.patch.yml insert，bundle 必须显式挂载——否则 kernel resolveBundleDir 找不到会崩，2026-08-22 教训）\n3. **归档重建**：prepare-runtime（实体版本校验 0.2.2）→ 替换安装目录归档 → 思灵部署\n\n## 注意\n\n- 包名无 scope（`dsh-session-manager`），与全家桶 `@max-null/*` 命名不同——按上游原名接入，bundles id 也用原名。\n- 上游未发布 npm，本接入为**本地 vendor 分发**；若上游发布 npm 可切换 `^x.y.z`。\n- 测试版实体与上游 main lib 差异：nav-bubble 定制已入上游，其他 24 行差异待 diff 确认（不影响接入——以测试版为准）。\n\n## 第三方插件升级（2026-08-28，用户规则：第三方升 npm 最新；本地超前以本地为准）\n\n| 包 | 声明/现状 | npm latest | 动作 |\n|---|---|---|---|\n| dsh-dream-skin | ^0.4.14（归档实体 0.4.15） | **8.28.0** | ⬆️ 升 ^8.28.0（作者 08-27 真发，peer rc.6+ 兼容） |\n| dsh-context | ^0.32.0 | **0.34.1** | ⬆️ 升 ^0.34.1（peer rc.7+，待验证 rc.2 兼容） |\n| dsh-video-preview | ^0.1.1 | **0.1.4** | ⬆️ 升 ^0.1.4 |\n| ds-harness-remote | ^0.3.0 | **0.3.36** | ⬆️ 升 ^0.3.36（peer >=rc.6 \u003c0.2.0，兼容） |\n| @changfenhuang/dsh-genui | vendor 0.9.5 | 0.9.6 | ✅ **已升 ^0.9.6**（实测：作者采纳魔改——0.9.6 含模板中心/探索成就/面板 dock 全部定制标记，index.js 字节一致，client.js 仅 minifier 微调） |\n| dsh-context-doctor/open-sea-skin | vendor | 无/以本地 | 🚫 保持（本地增强） |\n| 其余 | 一致 | 一致 | 不动 |\n\n- 等待归档的重启：panels 0.1.9（已 bump）、session-manager 0.2.2（vendor tarball 已就位）随本次归档一起进入。\n- **风险**：dsh-context 0.34.1 peer `^0.1.0-rc.7` 对 DSH 0.1.1-rc.2 的兼容性需 pnpm 实测（0.3.0 发布阻塞类似坑）；dream-skin 8.28.0 大跳需归档后冒烟。\n\n## 执行步骤\n\n1. pack tarball → vendor/\n2. profile-template deps + bundles\n3. 归档重建 → 部署 → 冒烟（会话管理入口出现、归档/回收站可用）\n"},{"file":"2026-08-28-v0.1.15发版决策.md","date":"2026-08-28","slug":"v0.1.15发版决策","title":"SSiD v0.1.15 发版决策（2026-08-28）","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["dsh-session-manager","dsh-dream-skin","dsh-context","dsh-video-preview","dsh-ssid-panels","ssid-release","#66","#69"],"summary":"- 0.1.14 → 0.1.15（minor，功能增强）：新增预制 session-manager + panels 0.1.9 功能 + 第三方升级 + genui 切 npm。 - 0.1.15 编号未被占用（历史上 106a875 曾 bump 到 0.1.15 又回滚 0.1.14 重打，未外发 Release）——本次为新号。 - v0.1.14 已外发（08-26 Latest），v","bytes":2126,"lines":38,"body":"# SSiD v0.1.15 发版决策（2026-08-28）\n\n> 状态：已决策（推断 · 2026-09-12）\n\n## 版本决策\n\n- **0.1.14 → 0.1.15**（minor，功能增强）：新增预制 session-manager + panels 0.1.9 功能 + 第三方升级 + genui 切 npm。\n- **0.1.15 编号未被占用**（历史上 106a875 曾 bump 到 0.1.15 又回滚 0.1.14 重打，未外发 Release）——本次为新号。\n- v0.1.14 已外发（08-26 Latest），v0.1.14..HEAD 有 9 个未发布 commit，内容必须新版本承载。\n\n## v0.1.14..HEAD 变更分组（git log 提炼）\n\n**新增预制/升级（ae0f61b）**\n- dsh-session-manager 0.2.2（dream12347）加入预制（vendor tarball + bundles）\n- 第三方升级：dsh-dream-skin ^8.28.0 / dsh-context ^0.34.1 / dsh-video-preview ^0.1.4 / ds-harness-remote ^0.3.36\n- genui vendor 0.9.5 → npm ^0.9.6（作者采纳本地魔改：模板中心/成就/dock 对齐）\n- dsh-ssid-panels 0.1.8 → 0.1.9\n\n**内置插件优化（panels）**\n- 8d03301 更新日志弹窗每版本一次 + 展示即标记\n- d225bc9 更新日志 seen 改 host 文件（动态端口丢标记修复）\n- 74dc9ec 版本卡布局优化（检查更新按钮右上 + ⭐给我个星吧）\n- 44c6fbb 检查更新结果跟随按钮（结果/状态并入版本卡）\n\n**其他**\n- 69100e2 genui vendor 同步上游 main（PR #66/#67 + #69/#70 + 成就指纹 hash 隐私强化）\n- daf554f CI: build-mac workflow（功能代码在 feat/macos-packaging 分支）\n- 58b6ff4 删除误提交临时脚本\n- 451bedf docs(skill): ssid-release 补充 spread 丢原型经验\n\n## 发版五件事\n\n1. 更新日志 docs/release-notes-v0.1.15.md + 同步 plugins/dsh-ssid-panels/release-notes.md（守卫测试）\n2. shell/package.json 0.1.15（四处同步：package.json/归档/.runtime-version/tag）\n3. 发版前守卫（updater-core + release-notes 单测）\n4. 归档重建 prepare-runtime + 抽查（实体全过：chat-rail 0.4.0/session-manager 0.2.2/panels 0.1.9/genui 0.9.6/dream-skin 8.28.0/context 0.34.1）\n5. NSIS 打包（英文名副本坑）+ 打包版自检 + 冒烟 + GitHub tag/Release/upload（latest.yml+blockmap）\n"},{"file":"2026-08-26-三个插件加入SSiD预设.md","date":"2026-08-26","slug":"三个插件加入SSiD预设","title":"执行记录：dsh-context / dsh-genui / dsh-context-doctor 加入 SSiD 预设插件","statusRaw":"已完成（待 prepare-runtime 归档重建）（部分结论已被 2026-08-28-v0.1.15发版决策.md 取代 · 2026-09-12）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-26","dateNote":null,"tags":["@changfenhuang/dsh-genui","dsh-context","dsh-genui","dsh-context-doctor","dsh-client-ui-conversation","#8","#58"],"summary":"三个插件已加入 SSiD 预设（发布模板 + 开发 profile 同步），genui 预置版自带 SSiD 面板样式修复（对齐宿主导航/输入区宽度轴等），genui skill 教学随预置技能包。","bytes":4051,"lines":51,"body":"# 执行记录：dsh-context / dsh-genui / dsh-context-doctor 加入 SSiD 预设插件\r\n\r\n> 日期：2026-08-26\r\n> 状态：已完成（待 prepare-runtime 归档重建）（部分结论已被 `2026-08-28-v0.1.15发版决策.md` 取代 · 2026-09-12）\n> 执行人：MaxNull（AI 代执行）\r\n> 关联：[SSiD-插件清单.md](../设计/SSiD-插件清单.md) 2.4 第三方预制\r\n> 上游联动：genui 面板修复 PR [omdsh-dev/dsh-genui#58](https://github.com/omdsh-dev/dsh-genui/pull/58)；context-doctor [issue #8](https://github.com/Zhenyu98/dsh-context-doctor/issues/8)\r\n\r\n---\r\n\r\n## 一、结论\r\n\r\n三个插件已加入 SSiD 预设（发布模板 + 开发 profile 同步），genui 预置版自带\r\nSSiD 面板样式修复（对齐宿主导航/输入区宽度轴等），`genui` skill 教学随预置技能包。\r\n\r\n| 插件 | 预置形态 | 版本基线 |\r\n|---|---|---|\r\n| `dsh-context` | npm `^0.32.0` 声明 | 0.32.0 |\r\n| `@changfenhuang/dsh-genui` | `file:./vendor/dsh-genui`（vendor 固化；来源仓库 [omdsh-dev/dsh-genui](https://github.com/omdsh-dev/dsh-genui)） | 0.9.2 + 面板修复 |\r\n| `dsh-context-doctor` | `file:./vendor/dsh-context-doctor`（vendor 固化） | 0.6.1（git #main 产物） |\r\n\r\n## 二、改动清单\r\n\r\n| 文件 | 改动 |\r\n|---|---|\r\n| `shell/profile-template/vendor/dsh-genui/`（新增） | genui 上游 v0.9.2 发布文件 + 本地构建面板修复产物（`lib/client.js` 含修复标记） |\r\n| `shell/profile-template/vendor/dsh-context-doctor/`（新增） | context-doctor v0.6.1 发布文件（lib + cordis.patch.yml + README/LICENSE） |\r\n| `shell/profile-template/skills/genui/SKILL.md`（新增） | genui skill 教学（随预置技能包） |\r\n| `shell/profile-template/package.json` | dependencies + bundles 各加三项 |\r\n| `shell/profile-template/vendor/README.md` | 新增 dsh-genui / dsh-context-doctor 条目说明 |\r\n| `docs/设计/SSiD-插件清单.md` | 新增 2.4 第三方预制小节 |\r\n| `~/.dsh/profiles/ssid/package.json`（dev profile，不入库） | 同上 dependencies + bundles + vendor 同步 |\r\n\r\n## 三、验证结果\r\n\r\n1. **合成配置**：`dsh --profile ssid --dump-config` 含三条——`# == dsh-context`（id: dsh-context）、`# == @changfenhuang/dsh-genui`、`# == dsh-context-doctor`（id: context-doctor）✅\r\n2. **安装**：dev profile `pnpm install` 成功（+196 包 / 17.5s）；`node_modules` 下三个包就位；vendor genui `lib/client.js` 含修复标记（`composer-side-clearance` + `IconChevronDownOutline14`）✅\r\n3. **Peer**：无新增缺失——genui 的官方 peer（dsh-client-ui-conversation/ui-primitives/slots/llm/session/system-prompt/tools/invariants）经 semver 判定全部满足（0.1.1-rc.2 ∈ `>=0.1.1-rc.0 \u003c0.2.0`），物理上在 node_modules 存在；`pnpm peers check` 报告的 missing 为 SSiD hoisted 布局的既有特征（官方 peer 不入依赖图，运行时由 cordis loader 按服务注入），与 chat-rail 先例同款，**prepare-runtime.mjs 的 MISSING_PEERS 无需补充**。\r\n4. **JSON 合规**：模板与 dev profile 的 package.json 均通过 node JSON.parse 校验。\r\n\r\n## 四、生效方式\r\n\r\n- 开发环境：重启思灵（或当前 GUI 会话）后 ssid profile 加载三个插件。\r\n- 发布环境：**需重建运行时归档**——`node scripts/prepare-runtime.mjs`（shell/ 目录；归档带 vendor 指纹，自动包含新 vendor 与技能），然后替换安装目录归档 → 下次安装/升级即开箱即用。\r\n\r\n## 五、备注\r\n\r\n- genui vendor 采用「上游基线 + SSiD 修复」的双源模式：上游 PR #58 合并并发布新版本后，应切换回 npm 声明并删除 `vendor/dsh-genui`（恢复临时补丁脚本 `H:\\MaxNull\\WorkStation\\apply-genui-patch.ps1` 同期删除）。\r\n- context-doctor 无 npm 发布（`private: true`），长期走 vendor 固化；上游修复 issue #8 后重新抓取 main 产物替换 vendor。\r\n- dsh-context 为 npm 声明，后续 `prepare-runtime` 重建自动收最新 0.32.x（`minimumReleaseAge: 0` 已豁免）。\r\n"},{"file":"2026-08-24-Playwright-MCP-预制-实施方案.md","date":"2026-08-24","slug":"Playwright-MCP-预制-实施方案","title":"Playwright MCP 预制 - 实施方案","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":"2026-08-24","dateNote":null,"tags":["@playwright/mcp","@deepseek-ai/dsh-mcp-client","dsh-mcp-client","dsh-skill-mcp-center","dsh-runtime"],"summary":"用户在某个 DSH 会话中看到「playwright-core（全局 MCP 包内）」的表述，追问 DSH 是否有全局 MCP、为何 MCP 管理插件看不到。排查结论： - 该表述指 npm 全局安装的 @playwright/mcp 包（C:\\Users\\MaxNull\\AppData\\Roaming\\npm\\nodemodules\\@playwright\\mcp）——playwright-co","bytes":5270,"lines":107,"body":"# Playwright MCP 预制 - 实施方案\n\n> 日期：2026-08-24\n> 范围：SSiD 出厂预制（profile-template）+ 本机 profile 同步\n> 关联：`docs/设计/SSiD-插件清单.md`（MCP 五通道 → 本次落地浏览器自动化通道）、`docs/决策/2026-08-19-预设技能包-落地方案.md`（prefab 模式参照）\n\n> 状态：已决策（推断 · 2026-09-12）\n\n## 1. 背景\n\n用户在某个 DSH 会话中看到「playwright-core（全局 MCP 包内）」的表述，追问 DSH 是否有全局 MCP、为何 MCP 管理插件看不到。排查结论：\n\n- 该表述指 **npm 全局安装的 `@playwright/mcp` 包**（`C:\\Users\\MaxNull\\AppData\\Roaming\\npm\\node_modules\\@playwright\\mcp`）——`playwright-core` 是它的依赖；\n- 它同时被 **OpenCode 全局 MCP 配置**（`~/.config/opencode/opencode.json` 的 `mcp.playwright`）使用；\n- **DSH 本身没有全局 MCP、也不内置任何 MCP 服务器**：`@deepseek-ai/dsh-mcp-client` 只是客户端桥，服务器需在 profile 配置中显式注册；`dsh-skill-mcp-center` 的 MCP 面板只枚举 DSH loader 里的 `mcp-client` 条目，因此看不到 OpenCode/全局 npm 侧的 MCP。\n\n结论：DSH 的「预制 MCP」不存在官方概念，SSiD 从零落地自己的浏览器自动化 MCP 预制。\n\n## 2. 决策\n\n| 决策点 | 选择 | 理由 |\n|---|---|---|\n| 预制形态 | **默认启用**（模板直接 insert，mcp-playwright 常驻） | 用户拍板：SSiD 开箱即得浏览器自动化能力 |\n| 运行时 | **离线自包含依赖**：`@playwright/mcp` 精确 pin `0.0.79` 进 profile 依赖（归档构建时下载，离线可装） | SSiD 归档离线原则；避免 npx 每次联网解析 |\n| node 定位 | SSiD 壳启动时注入 `SSID_MCP_NODE`（打包内置 node.exe → NVM v22.22.2 → PATH）与 `SSID_MCP_PW_CLI`（profile 内 cli.js 绝对路径） | 与 worker 分支 node 候选链同源；electron `execPath` ABI 不匹配不可用；MMCP 配置 `!!js` 只读 env，无运行时副作用 |\n| 浏览器二进制 | **不随安装包发布**；首次使用需 `playwright install chromium`（约 150MB，按需下载） | 安装包体积与首装时长权衡；失败时 mcp-client `failOnStartupError: false`，面板显示未连接而非崩溃 |\n| 模式 | `--headless` | 与用户 OpenCode 全局配置一致；SSiD 内使用以自动化为主，可见浏览器由用户自行改 args（Skill & MCP 面板可编辑） |\n\n## 3. 改动清单\n\n### 3.1 `shell/main.mjs`（启动注入，dev/打包共用）\n\n在 bootKernel 前的环境准备段（`SSID_PNPM` 注入旁）新增：\n\n```js\nconst mcpNodeCandidates = [\n  process.resourcesPath ? join(process.resourcesPath, 'node', 'node.exe') : '',\n  process.env.NVM_HOME ? join(process.env.NVM_HOME, 'v22.22.2', 'node.exe') : '',\n  'node.exe',\n]\nconst mcpNodeExe = mcpNodeCandidates.find((c) => c !== '' && existsSync(c))\nif (mcpNodeExe) process.env.SSID_MCP_NODE = mcpNodeExe\nconst mcpPwCli = join(profileDir, 'node_modules', '@playwright', 'mcp', 'cli.js')\nif (existsSync(mcpPwCli)) process.env.SSID_MCP_PW_CLI = mcpPwCli\n```\n\n注：`main.mjs` 是 dev 与打包版共同入口，本次改动**无需重打 kernel.bundle.mjs**；但 `SSID_MCP_*` 的注入发生在 kernel boot 前，`!!js` 求值（host 进程内）可见。\n\n### 3.2 `shell/profile-template/package.json`\n\ndependencies 追加（精确 pin，归档构建确定性）：\n\n```json\n\"@playwright/mcp\": \"0.0.79\"\n```\n\n### 3.3 `shell/profile-template/cordis.patch.yml`（出厂模板）\n\n顶层插入：\n\n```yaml\n- insert:\n    - id: mcp-playwright\n      name: '@deepseek-ai/dsh-mcp-client'\n      config:\n        serverName: playwright\n        transport: stdio\n        command: !!js 'process.env.SSID_MCP_NODE || \"node\"'\n        args:\n          - !!js 'process.env.SSID_MCP_PW_CLI'\n          - '--headless'\n```\n\n### 3.4 本机 profile 同步（开发机立即生效）\n\n- `~/.dsh/profiles/ssid/cordis.patch.yml`：同 3.3；\n- `~/.dsh/profiles/ssid/package.json`：同 3.2；\n- `pnpm install`（profile 目录，nodeLinker=hoisted，依赖提升到顶层 `node_modules/`）。\n\n## 4. 首次使用（浏览器二进制）\n\n```sh\n# 开发机（任选其一，均在 profile 目录内解析本地 playwright）\ncd %DSH_HOME%\\profiles\\ssid\nnode node_modules\\playwright\\cli.js install chromium\n# 或\nnpm exec --yes playwright install chromium\n```\n\n安装版（打包后）：\n```\n\"%DSH_HOME%\\profiles\\ssid\\node_modules\\.bin\\playwright.cmd\" install chromium\n```\n\n## 5. 验证\n\n1. 重启思灵（或 dev dsh web）；日志出现 `prefab mcp node=…` 与 `prefab mcp cli=…`；\n2. Settings → Skill & MCP 面板出现 `playwright` 卡片；\n3. 新会话模型工具列表出现 `mcp__playwright__*`（browser_navigate / browser_snapshot 等）；\n4. 浏览器缺失时面板状态为「未连接」，安装 chromium 后重连。\n\n## 6. 发布链（归档配套动作）\n\n- 本改动进入 SSiD 后：`pnpm run prepare-runtime` 重建 dsh-runtime 归档（新增 0.0.79 pin 依赖随归档下载）；\n- 升级部署机制（归档版本升级 → profile 重部署）自动把新 patch 与依赖带到用户机器；\n- `docs/设计/SSiD-插件清单.md` 的「MCP 五通道」行可补 Playwright 浏览器自动化通道状态为 ✅ 预制（后续版本）。\n"},{"file":"2026-08-23-会话隔离与插件更新-交付清单.md","date":"2026-08-23","slug":"会话隔离与插件更新-交付清单","title":"2026-08-23 · 会话隔离与插件更新三段式 · 交付清单（整晚工作归档）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@types/react-dom","@max-null/dsh-plugin-center","dsh-plugin-center","dsh-ssid-panels","dsh-runtime"],"summary":"- 设置页「会话存储」卡片：开关（预设默认开启）、常驻计数 （独立根/共享根/已载入）、载入原 DSH 会话、移除已载入会话（B 方案：只删清单内）、 按需「重启思灵」行、统一操作反馈行； - 载入 = 复制共享根会话 → 独立根（幂等：已存在跳过）； - workspace attach：载入/已存在会话 attach 到 cwd 对应 workspace（侧栏分组即时可见）； - 隔离开关状态","bytes":7188,"lines":105,"body":"# 2026-08-23 · 会话隔离与插件更新三段式 · 交付清单（整晚工作归档）\n\n> 起点：用户报告「历史加载失败：corrupt session log: seq gap in committed region」。\n> 终点：会话存储隔离全家桶 + 插件更新三段式 + 一串可靠性修复，全部实测闭环。\n\n> 状态：进行中（推断 · 2026-09-12）\n\n## 一、功能交付（均已用户实测 / 系统验证）\n\n### 1. 会话存储隔离（SSiD 与手动 dsh web 彻底分家）\n- 设置页「会话存储」卡片：开关（**预设默认开启**）、常驻计数\n  （独立根/共享根/已载入）、载入原 DSH 会话、移除已载入会话（**B 方案：只删清单内**）、\n  按需「重启思灵」行、统一操作反馈行；\n- 载入 = 复制共享根会话 → 独立根（幂等：已存在跳过）；\n- **workspace attach**：载入/已存在会话 attach 到 cwd 对应 workspace（侧栏分组即时可见）；\n- 隔离开关状态 `~/.ssid/session-root.json`（isolated=开关，applied=启动生效值，\n  kernel 回写）；**预设：无配置文件 ⇒ 默认隔离**（首次启动落盘显式配置）；\n- 已载入清单 `~/.ssid/imported-sessions.json`（B 方案：移除只删清单内，新建会话保护）；\n- `listNeedsRestart`（清单 mtime vs `SSID_BOOTED_AT`）持久判定重启提示行。\n\n### 2. 插件更新三段式（dsh-plugin-center）\n- 直装优先（99% 成功：纯 JS/新增包/未锁原生模块）；\n- 撞锁（EPERM/EBUSY/rename）分流：SSiD（kernel 声明 `SSID_PENDING_CONSUMER=1`）\n  → **npm pack 预下载** → pending 清单（`~/.ssid/pending-plugin-updates/index.json`）\n  → **重启时 kernel boot 前安装**（无锁窗口）；官方 dsh web（无消费方）→ **指令复制弹窗**；\n- UI：直装 toast + 「已更新待重启」卡片（点击弹重启确认）、多更新统一弹窗、\n  busy 保护（进行中会话拦截）、WhatsNew 弹窗旧检查修复。\n\n### 3. 可靠性修复（本轮） \n- 托盘「重启」`restartDsh` 作用域 ReferenceError（try 内 const → 提出去）；\n- BOM 写坏 profile package.json（**教训：改 JSON 一律用 node，禁 PowerShell Set-Content**）；\n- host 版本缓存假象（外部改版本后 listInstalled 旧值——重启应用可解，mtime 失效改进挂起）；\n- 弹窗配色统一到 DSH 官方变量（`button-primary-fill` + `label-primary-foreground`）。\n\n## 二、验证记录（节选）\n\n| 项 | 证据 |\n|---|---|\n| 直装路径 | 用户实测 toast + 版本升 0.15.2（pnpm 日志 ok ×3） |\n| 立即重启 relaunch | 多次实时进程 0:19/0:31/0:34/1:08/1:13 新实例 |\n| 托盘重启修复 | ssid.log：修复前 2 次 ReferenceError，其后 bootKernel ok ×2 |\n| pending 消费 | boot 实测：applied（可装项移除）/ deferred（失败项保留） |\n| 预设默认隔离 | 删除配置 boot → 自动生成 {isolated:true,applied:true} + 运行隔离根 |\n| B 方案移除 | 移除后隔离根仅剩新建的 1 个会话；清单 imported=153 |\n| 会话数据修复 | 15 个损坏日志修复 12 个（其余 3 个不可恢复，见 .tmp-repair-* 工具） |\n\n## 三、改动文件清单\n\n### dsh-plugin-center（H:\\MaxNull\\WorkStation\\dsh-plugin-center）\n- `src/update.ts`：PnpmResult(direct/pending/command)、preparePluginUpdate（npm pack\n  预下载；pnpm pack 不支持远程 spec）、pending 清单读写、tarballNameOf、npm 候选；\n- `src/engine.ts`：update() 三段式 + `SSID_PENDING_CONSUMER` 握手 + command 生成；\n- `src/rpc.ts`：update value 透传 direct/pending/command；\n- `client/index.tsx`：三分支 UI、CommandDialog/RestartDialog（官方配色）、\n  已更新待重启卡片（doneUpdatesStore 模块级）、WhatsNew 检查修复、i18n；\n- `docs/决策/2026-08-22-插件更新两段式-预下载重启安装.md`（含演进节）；\n- 产物：`dist/*`、`client.js`（已同步 profile ×2）。\n\n### dsh-ssid-panels（H:\\MaxNull\\WorkStation\\seek-soul-in-darkness\\plugins\\dsh-ssid-panels）\n- `src/index.ts`：sessionRoot.get/set/import(+workspace attach)/clear(B 清单)/\n  restart（busy 保护）、firstZstdFrame、readArtifactHeaderCwd、\n  imported-sessions 清单、listNeedsRestart；\n- `src/client/index.tsx`：ConfirmDialog 通用弹窗、开关/载入/移除/重启行\n  （按需、持久判定）、统一操作反馈行、i18n（zh/en）；\n- `package.json`：peer +devDeps 增加 `react-dom` / `@types/react-dom`（client 真类型）；\n- `docs/2026-08-22-会话存储隔离开关-设计方案.md`；\n- 产物：`lib/*`（已同步 ssid/web × vendor/node_modules，共 4 处）。\n\n### seek-soul-in-darkness / shell\n- `shell/kernel.ts`：SSID_SESSION_ISOLATED/SHARED_ROOT env、SSID_BOOTED_AT、\n  SSID_PENDING_CONSUMER=1、applyPendingPluginUpdates（boot 前消费，10 分钟超时，\n  失败保留不阻断）、预设默认隔离 + 首次落盘、SSID_SHELL_RESTART_KEY 注入；\n- `shell/main.mjs`：restartDsh 提出 try 块（作用域修复）、bootKernel\n  `opts.restart` 注入、托盘「重启」复用同一函数。\n\n### deepseek-harness（诊断/修复工具，仓库根保留）\n- `.tmp-audit-all.mts`（全量 seq 审计）、`.tmp-repair-spurious.mts`、\n  `.tmp-repair-conflict.mts`、`.tmp-repair-tail.mts`（三类损坏修复，均自动备份）。\n\n### 部署产物（非 git，Profile 内）\n- `~/.dsh/profiles/{ssid,web}/vendor|node_modules/@max-null/{dsh-ssid-panels,dsh-plugin-center}/`；\n- `~/.dsh/profiles/{ssid,web}/node_modules/@max-null/dsh-plugin-center/`（dist+client.js）。\n\n## 四、发布注意点（SSiD / 插件）\n\n1. **SSiD 安装版**：kernel.ts / main.mjs 改动在 asar/归档内 —— **重新 `npm run pack`\n   并重建 dsh-runtime 归档**（打包前各插件 `pnpm run typecheck && build`，再按\n   prepare-runtime 两步走：清 pnpm metadata 缓存、解压归档核对 package.json）。\n2. **升级影响需写明**：预设「默认隔离」= 老用户首次升级后（无 session-root.json）\n   **被动进入隔离**，共享根会话不在侧栏（设置页可载入）——README/发布说明必须写。\n3. **插件发布**：dsh-plugin-center → **0.2.4**（client.js/dist 更新，files 已含 client.js）；\n   dsh-ssid-panels → **0.1.4**（带 react-dom peer/devDeps；**勿升 react 19**，与\n   peer ^18.2.0 冲突）；npm 2FA 用户手动 publish；发布后 profile `pnpm install` 拉新。\n4. **兼容性**：新插件中心 + 旧 SSiD kernel（无 SSID_PENDING_CONSUMER）→ 自动走\n   web 模式（指令弹窗），不会\"假待重启\"；官方 dsh web 同理（无消费方）。\n5. **README 更新**：dsh-plugin-center（SSiD 链接惯例）、dsh-ssid-panels（新增\n   会话存储功能说明）、SSiD 项目 README（隔离开关/载入/预设）——发布前补齐。\n\n## 五、遗留项（待办）\n\n- `listInstalled` 对外部改版本不感知（mtime 失效改进，用户可拍板）；\n- 已知 3 个损坏会话不可恢复：`6a73e2d5`（尾部不连续）、`e96146aa`（缺 408 事件）、\n  `3eda899f`（大冲突段 B 内不连续）；\n- `dsh-ssid-panels` README 尚未存在（发布清单内）。\n"},{"file":"2026-08-23-快捷截图框选引用-设计方案.md","date":"2026-08-23","slug":"快捷截图框选引用-设计方案","title":"快捷截图框选引用插件 — 设计方案（2026-08-23）","statusRaw":"已完成（推断 · 2026-09-12）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-ssid-screenshot","dsh-sidebar-preview-select","dsh-header-unify","dsh-ssid-screenshot","dsh-ssid-panels"],"summary":"用户想引用屏上内容时，过去只能打字描述，LLM 理解准确性有限且费事。现在 DSH 已有多模态能力（图片消息走官方 admission 通道），因此做一个 快捷截图 + 框选 + 送入消息框 插件：从全屏冻结帧里框选一块区域，裁剪结果自动进入当前会话。 本方案放弃上一版 dsh-sidebar-preview-select 路线（全局 mouseup + 区域判定 + DSH 页面内浮层 + 文件","bytes":9399,"lines":105,"body":"# 快捷截图框选引用插件 — 设计方案（2026-08-23）\n\n> 状态：已完成（推断 · 2026-09-12）\n\n## 背景与目标\n\n用户想引用屏上内容时，过去只能打字描述，LLM 理解准确性有限且费事。现在 DSH 已有多模态能力（图片消息走官方 admission 通道），因此做一个 **快捷截图 + 框选 + 送入消息框** 插件：从全屏冻结帧里框选一块区域，裁剪结果自动进入当前会话。\n\n本方案放弃上一版 dsh-sidebar-preview-select 路线（全局 mouseup + 区域判定 + DSH 页面内浮层 + 文件类型解析），理由：侵入 DSH DOM、只限 DSH 内预览、生命周期复杂。新方案把「截屏 + 框选」放在**独立的 Electron 浮层窗口**（壳层），把「送入」走 DSH 官方图片 intake，互不侵入。\n\n## 已验证的关键事实（代码位置）\n\n| 事实 | 证据 |\n| --- | --- |\n| SSiD 是 Electron 43.3，主进程可直接用 `desktopCapturer.getSources` | `shell/package.json` \"electron\": \"43.3.0\"（主进程 API，桌面壳主进程可用） |\n| DSH web UI 运行在 `mainView` BrowserView（无 preload），壳→渲染已有 `executeJavaScript` + CustomEvent 先例 | `shell/main.mjs` L796-811（`ssid:titlebar` → `dsh-header-unify` 监听，双层 sandbox+contextIsolation） |\n| 图片消息官方通道：client `session.prompt([{type:'image', mediaType, data(base64), name?}])` → host `durablePromptContent`/`admitEncodedImages` → 图库落盘；模型必须支持 image（`MODEL_DOES_NOT_SUPPORT_IMAGES` 有中文文案） | `packages/host/apiproxy/src/api-proxy.ts` L129-138、L2382-2416；`packages/client/ui-conversation/src/client/image-labels.ts` |\n| 输入框图片 intake 官方入口：composer 的 **document 级 drop 处理器** `onDrop → onAddImages(files) → createDraftImages → input machine`（拖拽/粘贴图片都走它，含 canAcceptDrop/数量/大小限制） | `packages/client/ui-attachment/src/client/ComposerAttachments.tsx` L60-79；`ui-conversation/src/client/apply.ts` L311-326 |\n| 插件可用浏览器原生 `new DataTransfer()` + `new DragEvent('drop')` 走这条官方 drop 路径，**无需 DSH 核心改动** | 同上（drop 处理器只认 `dataTransfer.types.includes('Files')`） |\n| 当前会话 = 客户端 `sessions.list.getSnapshot().current`；发送用 `sessions.binding(id).session.prompt(content,'queue')` | `packages/client/runtime/src/client/sessions/service.ts` L76-97；`session.ts` L190-211 |\n| 合成 drop 的另一个官方备用通道：**系统剪贴板**（Electron `clipboard.writeImage`），用户可手动粘贴 | Electron API |\n\n## 架构\n\n```\n触发（托盘菜单项「截图引用」 / 全局快捷键 Ctrl+Shift+A）\n   ↓ 主进程\nwin.hide()（冻结帧不含 DSH 自身）→ ~250ms\ndesktopCapturer.getSources({types:['screen'], thumbnailSize=所有屏物理并集最大})\n   → 每屏一张冻结帧 nativeImage → dataURL\n   → 每屏一个全屏无边框置顶 overlay BrowserWindow（独立窗口，不碰 DSH DOM）\n       渲染本屏冻结帧 + 十字准星；拖拽框选；Esc 取消；双击/Enter 确认\n       选区逻辑 px × scaleFactor → canvas 物理像素裁剪 → PNG base64\n   → 主进程关全部浮层 → win.restore()\n   → mainView.webContents.executeJavaScript 派发 `ssid:screenshot` CustomEvent\n   ↓ 客户端插件 @max-null/dsh-ssid-screenshot（profile 内置）\n       监听 CustomEvent → dataURL→File（fetch(dataUrl).blob()）\n       → 合成 drop（new DataTransfer + DragEvent）填入当前会话输入框草稿\n         （官方 intake：可编辑/删除/加文字，回车后才发送）\n```\n\n### 分层职责\n\n- **壳层（shell/main.mjs + overlay 页面）**：触发、截屏、框选浮层、裁剪、输送。Electron 独有的能力留在这里（desktopCapturer/globalShortcut/clipboard/nativeImage）。\n- **client 插件（plugins/dsh-ssid-screenshot）**：接收事件、把 PNG 交给官方 intake、处理「无会话/不支持」反馈。只依赖官方 客户端服务（sessions）与浏览器事件，不 import DSH 包内部符号。\n\n### 触发方式（已定：托盘菜单 + 全局快捷键）\n\n- 托盘菜单项「截图引用」（托盘已存在，L1018-1033 菜单模板加一项）\n- 全局快捷键 `Ctrl+Shift+A`（whenReady 注册 / 退出注销；避开微信/QQ 的 `Ctrl+Alt+A`；设置页改键留后续）\n- 标题栏按钮暂不做（需要改 titlebar.html，后续需要时走 `ssid:title:action` 通道）\n\n### 框选浮层细节（多显示器，v1 所有屏）\n\n- 触发后先 `win.hide()`（冻结帧里不包含 DSH 自身），~250ms 后再抓帧，浮层关闭后恢复窗口。\n- 抓帧：**逐屏调用** `desktopCapturer.getSources({ types: ['screen'], thumbnailSize: 该屏物理宽高 })`，按 `display_id` 匹配源（兜底枚举顺序）。*修正记录（2026-08-23 探针实测）*：单次调用统一 thumbnailSize 会把全部源等比缩放进同一请求盒（本机 2560x1440@1.0 被放大成 3840x2160，画面失真）；逐屏请求后返回像素级 1:1（3840x2162 请求 → 源返回 3840x2160，浮层换算以返回值为基准，无需依赖请求值）。\n- 浮层：每屏一个 `BrowserWindow`（`frame:false, alwaysOnTop:true, skipTaskbar:true, resizable:false, movable:false, show:false` + preload），位置尺寸取 `screen.getAllDisplays()` 的 bounds（DIP）；每个浮层只渲染自己那屏的冻结帧（`\u003cimg>` 按逻辑像素铺满）。\n- 选区：mousedown → mousemove 画矩形 → mouseup 定格；**裁剪在浮层渲染进程用 canvas 完成**（画布按物理像素、选区逻辑像素按 `thumbnail尺寸 / bounds` 比例换算成物理像素），避免 nativeImage.crop 的 DIP/scaleFactor 换算；Esc 取消（全部浮层）；双击/Enter 确认。\n- 确认后浮层经自带 preload 把裁剪结果（PNG base64）回主进程：主进程关闭全部浮层 → `win.restore()` → 派发 `ssid:screenshot` CustomEvent 给 mainView。\n\n### 注入渲染进程\n\n沿用 `ssid:titlebar` 先例：`executeJavaScript` 派发 CustomEvent，插件监听。数据为 base64 PNG（框选区域通常几十 KB~几 MB，可接受；若后续变大可改为浮层窗口完成裁剪后直接把 dataURL 经 devtools 协议/临时文件通道送，v1 不做）。\n\n## 新插件清单（独立仓库 github.com/Max-Null/dsh-ssid-screenshot，v0.1.0）\n\n> 结构演进（2026-08-23 用户定案）：插件的双环境通用性使其**源码真身迁出思灵仓库**，\n> 独立仓库维护（`H:\\MaxNull\\WorkStation\\dsh-ssid-screenshot`）；思灵仓库仅保留\n> `shell/profile-template/vendor/dsh-ssid-screenshot`（构建产物拷贝，内置分发载体）。\n\n- `package.json`：`@max-null/dsh-ssid-screenshot`，react peer（同 dsh-ssid-panels 规矩），`main` 指向 lib。\n- `src/index.ts`（host 半 /ssid/api 路由）、`src/client/*`（监听 + 按钮 + 设置行 + 页面遮罩）。\n- 内置插件跟随 profile-template 预置（vendor 产物拷贝），发布到 npm 后由插件中心更新链路接管。\n- 文档：README（双引擎说明 + 使用步骤）。\n\n## 边界与风险\n\n- 无当前会话 / composer 未挂载：drop 不生效 → 插件检测 `sessions.list.current === undefined` 时（在浮层内或 toast）提示「先打开一个会话」；v1 简化为浮层提示 + 插件侧静默。\n- 模型不支持图片：host 拒绝（`attachment-error`，官方中文文案），走 composer 的 promptError 展示，无需插件处理。\n- 快捷键冲突：v1 固定一个低冲突组合，文档写明；设置页改键留待后续。\n- 大图 admission 限制（像素/大小上限）与官方拖拽路径一致，超限提示同样生效。\n- Windows 多屏缩放比：冻结帧按物理像素请求，选区坐标按 CSS px 换算 `scaleFactor`；v1 主屏通常 100% 缩放，仍需换算代码。\n\n## 已定决策（2026-08-23 用户确认）\n\n1. 送达方式：**填入输入框草稿**（不自动发送；可加文字后再回车）。\n2. 触发方式：**托盘菜单项 + 全局快捷键**（标题栏按钮留后续）。\n3. 屏幕范围：**所有显示器**。\n4. （迭代追加，2026-08-23 用户反馈）确认框选后进入**标注阶段**：拖拽画红框强调\n   重点（可多个），回车/完成发送；右键/Esc 与 Esc 同级逐级回退（撤框 → 重选 →\n   退出）；浮层无交互 3 分钟自动取消（防卡屏）。\n5. （迭代追加）截图设置并入 **设置 → 通用** 两行（隐藏窗口开关 + 快捷键，即改即存、\n   壳内即时重注册；配置存 ~/.ssid/screenshot.json，主进程每次触发前读取）。\n\n## 已验收（2026-08-23 用户实测）\n\n- 快捷键/相机按钮触发 → 多屏浮层 → 框选 → 标注画框 → 确认 → 截图进输入框，\n  全链路日志验证通过（`confirm received → delivered → drop types=Files`）。\n- 设置 → 通用 两行显示与即时生效（快捷键改 Control+Alt+B 即时重注册成功）。\n\n## 已否决路线\n\n- dsh-sidebar-preview-select（v0.1.0 未发布）：DOM 侵入 + 文件解析 + 仅限 DSH 预览，不再推进。\n- DSH 核心改动（如给 IConversation 增加 `attachImages(files)`）：非必需——官方 drop intake 已覆盖；若日后多插件都要「外部来源填充草稿」，再在 DSH 侧收敛为正式 API。\n"},{"file":"2026-08-23-DSH原生配置页样式基准.md","date":"2026-08-23","slug":"DSH原生配置页样式基准","title":"DSH 原生配置页样式基准（family 插件统一规格）","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-plugin-center","@max-null/dsh-skill-mcp-center","@max-null/dsh-draft-polish","@max-null/dsh-node-appearance","@max-null/dsh-capture","dsh-ssid-panels","dsh-plugin-center","dsh-skill-mcp-center","dsh-draft-polish","dsh-node-appearance","dsh-capture"],"summary":"- 面板：800×min(800px, 100vh-48px)，radius 24，bg --dsw-alias-bg-layer-2，--dsw-shadow-lv3。 - 左导航：宽 188，padding 22/12/0；标题「设置」16/500 lh24；导航项 h40 r12 padding 9 16 9 12，14/400， 选中 --dsw-specific-sidebar-nav-","bytes":5556,"lines":85,"body":"# DSH 原生配置页样式基准（family 插件统一规格）\n\n> 来源：deepseek-harness 源码 `packages/client/ui-settings-general/SettingsRoot.module.css`、\n> 状态：已决策（推断 · 2026-09-12）\n\n> `ui-settings-plugins/PluginsSettingsSection.module.css`、`fields.module.css`、`PluginCard.module.css`、\n> `ui-agent-preset/AgentPresetSection.module.css`、`ui-primitives/Button.module.css`、`Pill.module.css`。\n> 所有 CSS 值均为源码原文，任何家族插件不得自创规格。\n\n## 设置外壳（弹窗，通常不需要改）\n\n- 面板：800×min(800px, 100vh-48px)，radius **24**，bg `--dsw-alias-bg-layer-2`，`--dsw-shadow-lv3`。\n- 左导航：宽 188，padding 22/12/0；标题「设置」16/500 lh24；导航项 h40 r12 padding 9 16 9 12，14/400，\n  选中 `--dsw-specific-sidebar-nav-item-active`，hover `--dsw-specific-sidebar-nav-item-hover`。\n- 内容区 header h54；内容 padding 0 24 24；关闭钮 28×28 r28。\n\n## 页面骨架（设置页 Section 通用）\n\n- section：`max-width: 760px`（Agent 预设页 720px），flex column gap **12**。\n- 页面标题 heading：**font-size 18 / weight 600**（原 family 自创 16px 已作废）。\n- 页面描述 intro/subtitle：**13px，color label-tertiary**（原 family 自创 secondary 已作废）。\n- 分组题头 groupHead：12/600，uppercase，letter-spacing .06em，color label-tertiary；组间距 20。\n\n## 卡片（列表卡与网格卡统一）\n\n- 卡：border 1px `--dsw-alias-border-l2`，bg **`--dsw-alias-bg-layer-3`**，radius **12**，\n  hover `border-color: --dsw-alias-label-dimmed`，transition .16s。\n- 卡头：padding **14px 16px**，gap 12（grid 卡 cardMain padding 14 16 12，gap 8）。\n- 卡名 name：**15px / 600**，line-height 1.4。\n- 卡描述 description：**13px**，label-tertiary（列表卡）或 label-secondary + line-clamp 4（网格卡）。\n- 卡脚 cardFoot：border-top l2，padding 6px 10px，gap 2。\n- 网格：grid-template-columns repeat(auto-fill, minmax(268px, 1fr))，gap 12，auto-rows 1fr。\n\n## 徽标 badge（胶囊统一）\n\n- 胶囊：border-radius **999px**，padding 1px 8px，**font-size 11 / 500**，line-height 17px。\n- 中性：border l2 + label-tertiary（预设卡）或 bg `--dsw-alias-bg-module-platform` + label-secondary（字段）。\n- 强调（in use）：bg `--dsw-alias-label-primary`，color `--dsw-alias-bg-layer-3`。\n- 危险/错误：bg `--dsw-alias-state-error-primary`，color bg-layer-3。\n- 官方/业务强调：bg `--dsw-alias-state-business-tertiary`，color `--dsw-alias-state-business-primary`。\n- （Pill 组件：h24 r12 12px/18，bg-layer-2，label-secondary —— 与 badge 并列场景用 Pill。）\n\n## 按钮\n\n- primitives Button：胶囊 r18，h36 padding 0 14，14px/22；sm 变体 h28 r14 padding 0 10 12px/18。\n  primary = `--dsw-alias-button-primary-fill` + `--dsw-alias-label-primary-foreground`；\n  outline = border l2 透明底；hierarchy 用 hover `--dsw-alias-interactive-bg-hover`。\n- 卡内操作（save/discard）：**r8，padding 5px 14px，13px/1.5**；\n  discard = border-l2 + label-secondary；save = bg `--dsw-alias-label-primary` + color bg-layer-3。\n- 图标按钮：padding 6，r7，color label-tertiary，hover bg-layer-1 + label-primary；\n  focus-visible outline 2px brand。\n\n## 字段/表单（卡片展开区）\n\n- field：padding 12px 0，flex column gap 6；field+field 分隔线 `border-top l2`。\n- 字段题头 head：gap 8；标签 label：**13px / 500**，line-height 1.5，label-primary。\n- 输入框：**h34，r8，padding 0 12px，13px/1.5**，border l2，bg `--dsw-alias-bg-layer-3`，\n  focus border `--dsw-alias-brand-primary`；placeholder label-dimmed。\n- 提示 hint/错误：12px，tertiary / `--dsw-alias-label-error`。\n- 重置 reset 链接：12px label-secondary，hover label-primary。\n\n## 选项卡 tabs（插件配置页样式）\n\n- tabs 容器：border-bottom l2，gap **22**，margin-top 2。\n- tab：13px/20，padding **7px 1px 9px**，color label-tertiary，hover/active label-primary；\n  active 下划线 2px l2（radius 2 2 0 0，bottom -1）bg label-primary；\n  focus-visible outline 2px `--dsw-alias-state-business-primary`。\n\n## 开关 switch（家族自定，保持统一）\n\n- 40×22 r11；track off = **`--dsw-alias-border-l4`**（浅色主题 rgba(0,0,0,.16) 灰、暗色 rgba(255,255,255,.2) 灰，\n  两主题均与白钮有对比；不可用 `bg-module-platform` — 浅色主题下 ≈ rgb(245,246,247) 纯白，off 开关完全隐形），\n  on = `--dsw-alias-state-business-primary,#4FC3F7`；\n  knob 16×16 白 #fff；margin-left 2→22（或 left 3→21）；transition .15s。\n- DSH 原生无 knob 开关（无 Switch 组件），此为 SSiD 家族统一基准，勿再改动。\n\n## 家族插件清单（对齐目标 · 2026-08-23 发布版本）\n\n- dsh-ssid-panels（关于 SSiD 页 / 侧边卡片）——SSiD 内置 vendor，随壳 v0.1.10\n- dsh-plugin-center（插件市场页：列表卡、badge、chip、搜索框、按钮）——`@max-null/dsh-plugin-center` v0.2.5\n- dsh-skill-mcp-center（技能/MCP 中心：侧栏、列表卡、badge、按钮、输入框）——`@max-null/dsh-skill-mcp-center` v0.4.1\n- dsh-draft-polish（润色设置页：卡片、字段、badge）——`@max-null/dsh-draft-polish` v0.2.1\n- dsh-node-appearance（节点外观设置：卡片、group、按钮）——`@max-null/dsh-node-appearance` v0.3.3\n- dsh-capture（截图设置页：卡片行、开关、按钮）——`@max-null/dsh-capture` v0.1.0，SSiD 预制（vendor）\n"},{"file":"2026-08-22-插件中心0.2.1发布与归档覆盖机制复盘.md","date":"2026-08-22","slug":"插件中心0.2.1发布与归档覆盖机制复盘","title":"插件中心 0.2.1 发布与 SSiD 归档覆盖机制复盘（2026-08-22）","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-plugin-center","dsh-plugin-center","dsh-market","dsh-runtime"],"summary":"dsh-plugin-center 0.2.1（AI 推荐修复：Message 契约 / dsh-market spec 修正 / spec+stars / maxTokens 2000 / failure 详情）在本轮发布。期间暴露了三个 SSiD 部署机制的坑，均有真实现场证据。","bytes":4416,"lines":62,"body":"# 插件中心 0.2.1 发布与 SSiD 归档覆盖机制复盘（2026-08-22）\n\n> 状态：记录（推断 · 2026-09-12）\n\n## 背景\n\ndsh-plugin-center 0.2.1（AI 推荐修复：Message 契约 / dsh-market spec 修正 / spec+stars / maxTokens 2000 / failure 详情）在本轮发布。期间暴露了三个 SSiD 部署机制的坑，均有真实现场证据。\n\n## 一、思灵启动时用安装目录归档覆盖 profile（版本回退根因）\n\n**现象**：临时部署 0.2.1 到 profile（node_modules 手工覆盖）后，重启思灵，插件中心面板回到 0.1.7。\n\n**机制**（`shell/main.mjs` ensureProfile）：\n```\ndeployNeeded = !hasModules || (archiveVer !== null && profileVer !== archiveVer)\n```\n- 归档 = 安装目录 `resources/dsh-runtime.tar.gz`（NSIS 打包时内置）\n- 每次启动比对「归档内 .runtime-version」与「profile/.runtime-version」\n- **不一致 → 解压归档覆盖 profile 整个 node_modules**（含手工部署的版本）\n- 覆盖后 .runtime-version 写回归档值，下次启动 skip\n\n**教训**：对 profile 的临时部署只对「.runtime-version 与归档一致」的启动有效；任何触发部署的启动都会把 profile 打回归档内容。**验证新版本必须同步替换安装目录归档**，或直接走正式流程（发布 → prepare-runtime → 替换归档）。\n\n**本轮 hack**：直接解压安装目录归档 → 替换其中 `node_modules/@max-null/dsh-plugin-center` 为本地构建 → 重打包（tar -czf，保持 `./` 顶层结构）→ 替换安装目录归档（原归档备份 `.bak-0622`）→ profile .runtime-version 改一个不匹配值触发部署。**注意：pnpm 锁文件机制会覆盖此类 hack（见二）**，hack 只适合临时验证，最终必须发布。\n\n## 二、pnpm add 重建 node_modules，按锁文件恢复包版本\n\n**现象**：hack 归档部署 0.2.1 后，用户点安装 EAC（`pnpm add -w github:zouyuxuan122/Deepseek-Harness-EAC`）→ 插件中心版本回到 0.1.7。\n\n**机制**：`pnpm add` 解析依赖图 → 更新 pnpm-lock.yaml（EAC 带 148 个传递依赖，日志 `Packages: +148 -61`）→ **按新锁文件重新生成 node_modules 全部链接**。锁文件里 plugin-center 锁的是 0.1.7（依赖声明 `^0.1.7`、0.2.1 未发布），relink 时从 store 恢复 0.1.7，手工 hack 的内容被冲掉。\n\n**教训**：**任何对 node_modules 的文件级覆盖都是临时的**——只要锁文件/依赖声明还是旧版本，任何 `pnpm add/install` 都会恢复。新版本想稳定存在：发布 npm → 更新依赖声明 → pnpm install（锁文件锁定新版本）。\n\n**附带发现**：`pnpm add github:owner/repo`（git 依赖）在本机实测可用（Deepseek-Harness-EAC 0.0.0 安装成功，GitHub 网络慢约 1.5 分钟；SSiD 运行时若 node-pty 等被占用会 EPERM，需先关思灵）。\n\n## 三、package.json 带 UTF-8 BOM 导致 kernel 启动失败\n\n**现象**：部署 0.2.1（工作区 package.json 被外部工具写入时带上 BOM）后，思灵启动报：\n```\nSyntaxError: Unexpected token '﻿', \"﻿{ \"n\"... is not valid JSON\nat loadProfile (kernel.bundle.mjs:5702)\n```\nDSH kernel 的 `JSON.parse` 不剥离 BOM（Node ESM 会剥离，但 JSON.parse 不会）。\n\n**教训**：npm 包内的 package.json 严禁 BOM。发布前检查（`[System.IO.File]::ReadAllBytes` 前 3 字节 EF BB BF）。本轮已修复工作区 package.json（去除 BOM + 修复 description 历史乱码 `鈥?` → `—`）。\n\n## 四、prepare-runtime 的 node/pnpm 路径漂移\n\n**现象**：重跑 prepare-runtime 报「缺少 Node」/「缺少 pnpm 11.x」。\n\n**原因**：脚本硬编码 `D:\\Program Files\\nvm\\v22.22.2\\node.exe`（nvm 目录已移除），且 pnpm 只找 `dirname(node)/node_modules/pnpm/bin/pnpm.cjs`（系统 node 安装目录没有 pnpm）。\n\n**修复**（commit ec7e769）：\n- node 候选追加 PATH 上的 `node.exe`\n- pnpm 候选追加 `%APPDATA%\\npm\\node_modules\\pnpm\\bin\\pnpm.cjs`\n\n## 结论\n\n1. 验证新版本：临时部署只对「.runtime-version 与归档一致」的启动有效；可靠路径是发布 → prepare-runtime → 替换安装目录归档 → 重启自动部署\n2. 发布后必须同步：依赖声明（profile-template）→ 锁文件（pnpm install）→ 归档（prepare-runtime）→ 安装目录归档\n3. npm 包 JSON 文件禁 BOM；pnpm 锁文件是 node_modules 的唯一事实来源\n"},{"file":"2026-08-22-全家桶peer对齐0.1.1-rc.1.md","date":"2026-08-22","slug":"全家桶peer对齐0.1.1-rc.1","title":"全家桶 peer 对齐 DSH 0.1.1-rc.1 —— 决策与实施记录","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-22","dateNote":null,"tags":["@deepseek-ai/dsh-","@deepseek-ai/cordis","@deepseek-ai/cordis-plugin-","@deepseek-ai/schemastery","dsh-chat-rail","dsh-better-sidebar","dsh-chinese-thinking","dsh-draft-polish","dsh-guardian","dsh-habit","dsh-memory","dsh-node-appearance"],"summary":"1. 统一范围：所有 @deepseek-ai/dsh-（排除 @deepseek-ai/cordis 与 @deepseek-ai/cordis-plugin-）的 peerDependencies / devDependencies 范围 → ^0.1.1-rc.1（可匹配 0.1.1-rc.2）。@deepseek-ai/cordis@^4.0.1、cordis-plugin-loader ","bytes":3985,"lines":64,"body":"# 全家桶 peer 对齐 DSH 0.1.1-rc.1 —— 决策与实施记录\n\n- **日期**：2026-08-22\n- **背景**：SSiD 内置 DSH 升级 0.1.1-rc.2 后，全家桶插件 peer 仍钉在 `^0.1.0-rc.x`/\n> 状态：进行中（推断 · 2026-09-12）\n\n  `>=0.0.1-rc.x`。npm semver 预发布 tuple 规则下这些范围对 0.1.1-rc.2 全部不满足\n  （实测 false），虽 pnpm strict-peer-dependencies=false 下仅告警不阻断，但长期\n  是隐患（后续内核再升级、其他用户 pnpm 严格模式会炸）。本次统一对齐。\n\n## 决策\n\n1. **统一范围**：所有 `@deepseek-ai/dsh-*`（排除 `@deepseek-ai/cordis` 与\n   `@deepseek-ai/cordis-plugin-*`）的 peerDependencies / devDependencies 范围 →\n   `^0.1.1-rc.1`（可匹配 0.1.1-rc.2）。`@deepseek-ai/cordis@^4.0.1`、`cordis-plugin-loader`\n   不动；`@deepseek-ai/schemastery`（独立版本线 3.18.1）不动。\n2. **版本策略**：peer 契约变化 → minor bump（0.x 语义）：\n   chat-rail 0.2.0→0.3.0、chinese-thinking 0.2.0→0.3.0、draft-polish 0.1.0→0.2.0、\n   guardian 0.1.0→0.2.0、habit 0.1.0→0.2.0、memory 0.4.1→0.5.0、\n   node-appearance 0.2.3→0.3.0、plugin-center 0.1.7→0.2.0、skill-mcp-center 0.3.1→0.4.0\n3. **流程**：批量脚本改 package.json（60 处范围）→ 各仓库 install（npm/pnpm 按 lock）→\n   typecheck → test → build → commit → tag vX.Y.Z → push（GitHub 与 npm 版本对齐）\n   → 给用户 npm publish 指令（2FA 无法代发，用户手动发布）\n4. **发布后**：SSiD profile-template/package.json 依赖范围已是 ^（^0.2.0 等），\n   prepare-runtime 重建归档自动收新版本（minimumReleaseAge: 0 已豁免）。\n\n## 实施状态\n\n- [x] 批量修改 9 个仓库 package.json（脚本 align-peers.mjs，60 处范围）\n- [x] 各仓库 install/typecheck/test/build/commit/tag/push（子代理分批执行 + 手工补两个受阻仓库）\n\n### 执行结果\n\n| 仓库 | 版本 | commit | 备注 |\n|---|---|---|---|\n| dsh-chat-rail | 0.3.0 | 0624afa | ⚠️ 移除 dsh-better-sidebar peer/dev 声明（社区包 omdsh-dev peer 仍旧 rc.8，pnpm 范围合并无解；src 仅注释引用）；测试期望同步（stateVersion 5、hasImage） |\n| dsh-chinese-thinking | 0.3.0 | 7443cf3 | 正常 |\n| dsh-draft-polish | 0.2.0 | d822913 | ⚠️ GitHub 仓库此前不存在，已新建 public（Max-Null/dsh-draft-polish）并推送 |\n| dsh-guardian | 0.2.0 | a091ce6 | 正常 |\n| dsh-habit | 0.2.0 | 857d792 | 正常 |\n| dsh-memory | 0.5.0 | b9057f0 | 正常 |\n| dsh-node-appearance | 0.3.0 | 4773fe1 | ⚠️ 0.1.1-rc.2 内核移除 ui-primitives/ui-slots peer 网络，补声明（primitives 进 peer/dev/inject，ui-slots 进 dev type-only） |\n| dsh-plugin-center | 0.2.0 | 1e34a82 | 正常 |\n| dsh-skill-mcp-center | 0.4.0 | 5f9e9f4 | 正常 |\n\n### 关键教训（2026-08-22）\n\n1. **pnpm 11.21 自动改写 pnpm-workspace.yaml**：install 时自动追加 50+ 条\n   minimumReleaseAgeExclude（@deepseek-ai/dsh-*@0.1.1-rc.1 系列），多个仓库触发，\n   已还原/不提交。\n2. **0.1.1-rc.2 内核 peer 网络收缩**：dsh-client-ui-primitives / ui-slots 不再被\n   任何官方包 peer 引用——src import 它们的插件必须自行显式声明（chat-rail 原已\n   声明；node-appearance 本次补齐）。\n3. **dsh-better-sidebar（omdsh-dev/huanlin 社区包）peer 未对齐**：其 peer 仍为\n   ^0.1.0-rc.x，与本轮 ^0.1.1-rc.1 声明无交集；pnpm 合并产生 `>=0.1.1 \u003c0.2.0-0`\n   （排除全部 prerelease）→ ERR_PNPM_NO_MATCHING_VERSION，9 种绕过方案实测无效，\n   唯一可行是移除 peer 声明。上游对齐前，chat-rail 不再声明协作关系（README 说明）。\n\n## 下一步（用户手动）\n\n- [ ] 逐个 `npm publish`（2FA 无法代发；chat-rail/node-appearance/draft-polish 注意\n      files 含 client.js 检查）\n- [ ] 发布后 prepare-runtime 归档重建（自动收新版本，minimumReleaseAge: 0 已豁免）\n"},{"file":"2026-08-22-chat-rail历史节点修复-投影wire适配.md","date":"2026-08-22","slug":"chat-rail历史节点修复-投影wire适配","title":"chat-rail 历史节点丢失修复 —— 投影 wire API 适配","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-22","dateNote":null,"tags":["dsh-chat-rail"],"summary":"DSH 0.1.1-rc.2 的 session-projection API 破坏性变更：","bytes":3190,"lines":59,"body":"# chat-rail 历史节点丢失修复 —— 投影 wire API 适配\n\n- **日期**：2026-08-22\n- **仓库**：dsh-chat-rail（commit `af4285a`，v0.3.0 重打 tag）\n- **症状**：DSH 重启后载入历史会话，画卷导航栏无历史节点；手动下拉会话点「加载更多」后，\n> 状态：进行中（推断 · 2026-09-12）\n\n  fallback 收集的节点才出现。\n\n## 根因（已实证）\n\n**DSH 0.1.1-rc.2 的 session-projection API 破坏性变更**：\n\n| | rc.8（旧） | rc.2（新） |\n|---|---|---|\n| 单元字段 | `{ key, schema, init, apply, view, stateVersion }` | `{ key, stateSchema, init, apply, wire?: { viewSchema, view }, stateVersion }` |\n| client 快照 | snapshot 输出**所有**注册单元 | **只有带 `wire` 的单元**进 snapshot/restore values；无 wire = host-only（checkpoint 有、client 无） |\n\nchat-rail 的投影定义仍用 rc.8 形状（`schema`/顶层 `view`）→ rc.2 下被当作 host-only 单元\n→ `useProjection('chatRail')` 永远 undefined → rail 空。\n\n验证证据（SSiD 真实环境 boot + detached restore）：\n- 修复前：restore values keys = 官方单元（sessionStats/title/goal/...），无 chatRail；\n  手动 import chat-rail lib 的 apply 注册正常（包本身无问题）\n- 修复后：restore values 含 `chatRail`，`messages=68` 覆盖整会话（seq 7 → 415139），\n  非仅最近页\n\n**why 手动加载更多后有节点**：client fallback `collectFromNodes`（已加载窗口的\nuser 节点）在投影空时兜底；背景 loadOlder 循环因投影「非空即停」的守卫与窗口语义\n配合不佳，历史深度不可靠——但这是 fallback 表象，主修复在投影本身。\n\n## 修复\n\n`src/index.ts`：`schema` → `stateSchema`，`view` 移入 `wire: { viewSchema, view }`\n（chatRail 是导航数据，必须 client-visible）。测试同步（wire.view）。\n`pnpm-workspace.yaml`：`minimumReleaseAge: 0`（pnpm 11 supply-chain lockfile 验证\n以 MINIMUM_RELEASE_AGE_VIOLATION 拦截 0.1.1-rc.1 全家 66 条目，2026-08-22 实测）。\n\n## 影响面\n\n- 全家桶 9 插件中仅 chat-rail 使用 sessionProjections（grep 全量确认），无同类隐患\n- 其他 @max-null 插件（memory/habit/guardian 等）用 storage 服务，不受影响\n- 内置三插件（panels/header-unify/zh-ui）不用投影，不受影响\n\n## 发布要求（关键）\n\n1. **必须发布 chat-rail 0.3.0（含此修复）**：当前 profile 已临时覆盖修复版 host half\n   （用户重启思灵即生效），但归档仍是 0.2.0（无 wire）——若不发布并重建归档，\n   下次归档部署会回退到坏版本。\n2. 发布后：清 pnpm 缓存 → prepare-runtime 重建归档 → 思灵自动升级。\n\n## 遗留观察\n\n- 会话 `session-140b9120`（SSiD 工作区）user/message 事件 182 条 vs chatRail 68 条：\n  差异来自 source.kind 过滤（注入上下文/tool 消息）与无 durable id 消息——符合设计，\n  但若用户感觉节点偏少可再核。\n- SSiD 会话的 projcache 无行（projection-cache 插件在 web profile 未配置？）——\n  冷读走全量折叠，功能正确，缓存缺失仅影响性能，非本次问题。\n"},{"file":"2026-08-22-DSH升级0.1.1-rc.2-多模态升级.md","date":"2026-08-22","slug":"DSH升级0.1.1-rc.2-多模态升级","title":"DSH 升级 0.1.1-rc.2（多模态视觉）—— 决策与实施记录","statusRaw":"已完成（推断 · 2026-09-12）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-22","dateNote":null,"tags":["@deepseek-ai/dsh","ssid-shell","dsh-runtime"],"summary":"1. 插件 API 协议层 ✅：rc.1/rc.2 官方 release notes 无插件破坏性变更；品牌槽位 （sidebar.brand.mark/conversation.hero.brand.mark）、bundle patch 协议 （cordis.patch.yml）、client 注入协议（dsh.client.platform/inject/immediately） 在 0.1.","bytes":5639,"lines":85,"body":"# DSH 升级 0.1.1-rc.2（多模态视觉）—— 决策与实施记录\n\n- **日期**：2026-08-22\n- **动机**：DeepSeek 发布多模态 Flash 模型（DeepSeek-V4-Flash-Vision-Exp，DSH 0.1.1-rc.1 引入），用户希望 SSiD 尽快内置 DSH 0.1.1-rc.2 以解锁视觉能力\n- **涉及仓库**：seek-soul-in-darkness（构建侧）、deepseek-harness（只读）\n\n> 状态：已完成（推断 · 2026-09-12）\n\n## 一、版本现状（检查结论）\n\n| 项 | 值 |\n|---|---|\n| deepseek-harness checkout（apps/cli） | **0.1.1-rc.2**（2026-08-21T12:42Z 发布，\u003c24h） |\n| 上一内置版本 | 0.1.0-rc.8（2026-08-19T15:41Z） |\n| SSiD profile 实况 | `0.1.8-0.1.0-rc.8-76cce55d`（C:\\Users\\MaxNull\\.dsh\\profiles\\ssid） |\n| 安装目录归档 | `C:\\Users\\MaxNull\\AppData\\Local\\Programs\\ssid-shell\\resources\\dsh-runtime.tar.gz`（167MB） |\n| 思灵进程 | 运行中（6 个 electron 进程） |\n\n## 二、兼容性检查结论\n\n1. **插件 API 协议层 ✅**：rc.1/rc.2 官方 release notes 无插件破坏性变更；品牌槽位\n   （`sidebar.brand.mark`/`conversation.hero.brand.mark`）、bundle patch 协议\n   （cordis.patch.yml）、client 注入协议（dsh.client.platform/inject/immediately）\n   在 0.1.1-rc.2 源码中逐一确认保留。插件框架包 rc.8→rc.2 仅 34 文件/376 行小改。\n2. **内置 vendor 插件 ✅**：三插件 cordis.patch.yml 均为 profile 根纯 insert（不碰 DSH 源码）。\n3. **插件 peer 版本范围 ⚠️**：全家桶 peer 钉在 `^0.1.0-rc.7`/`^0.1.0-rc.6`/`>=0.0.1-rc.x`，\n   真实 node-semver 实测对 `0.1.1-rc.2` **全部不满足**（npm 预发布 tuple 规则：\n   候选 prerelease 版本须与范围中某 comparator 的 major.minor.patch 相同）。\n   pnpm 默认 strict-peer-dependencies=false → 仅告警不阻断，运行时风险低；\n   各插件项目后续把 peer 升到 `^0.1.1-rc.1`。\n4. **pnpm 11 发布年龄保护 ❌（阻断级）**：pnpm 11 默认 `minimumReleaseAge: 1440`（1 天），\n   官方文档确认。`@deepseek-ai/dsh@0.1.1-rc.2` 及 60+ 个 `^0.1.1-rc.2` 官方闭包族全部\n   发布 \u003c24h，且 minimumReleaseAgeExclude 名单只有 @max-null 与社区插件。\n   prepare-runtime 每次全新解析（profile-template 无 lockfile）→ 不豁免必装旧版/解析失败。\n\n## 三、决策\n\n1. **`minimumReleaseAge: 0`**（profile-template/pnpm-workspace.yaml）：\n   - 理由：官方闭包 60+ 包同族 \u003c24h，逐包维护 exclude 名单不可行（每个 rc 都要重来）；\n     归档运行时版本由 pnpm-lock.yaml 固定、构建机可控，供应链风险可接受。\n   - 保留既有 minimumReleaseAgeExclude 名单（作信任记录，无害）。\n   - 附带收益：@max-null 全家桶新版本发布后 prepare-runtime 不再受年龄保护阻碍，\n     记忆「发布三步」中的 a 步（豁免名单）不再必需（缓存清理与归档验证仍保留）。\n2. **升级路径**：重跑 prepare-runtime.mjs（DSH_NODE/PNPM_CMD 显式指定）→\n   解压归档静态验证 → 隔离冒烟（DSH_HOME=临时目录 + DSH_CHECKOUT=解压目录，\n   boot-smoke.ts 验证 HTTP 200）→ 替换安装目录归档 → 用户重启思灵 →\n   ensureProfile 自动原子重部署（main.mjs deployRuntime：.deploy.new → rename 原子切换）。\n   不手动替换运行中 profile，避免文件占用与破坏运行中进程。\n\n## 四、实施步骤\n\n- [x] 1. pnpm-workspace.yaml 加 `minimumReleaseAge: 0`\n- [x] 2. 清 pnpm metadata 缓存（%LOCALAPPDATA%\\pnpm-cache\\v11\\metadata{,-full}）\n- [x] 3. `node scripts/prepare-runtime.mjs`（DSH_NODE=C:\\Program Files\\nodejs\\node.exe，\n      PNPM_CMD=...\\npm\\node_modules\\pnpm\\bin\\pnpm.mjs）—— 最终归档 159.7MB，\n      `.runtime-version = 0.1.8-0.1.1-rc.2-0f58d550`\n- [x] 4. 归档验证：`tar -xzOf` @deepseek-ai/dsh = 0.1.1-rc.2、cordis = 4.0.1、\n      全家桶 9 插件版本正确、内置三插件（header-unify/panels/zh-ui）实体完整\n- [x] 5. 隔离冒烟：解压归档 → DSH_CHECKOUT 指向 → boot-smoke HTTP 200（14522 bytes）\n- [x] 6. 替换安装目录归档（rc.8 备份 dsh-runtime.tar.gz.rc8.bak）→ 重启思灵 →\n      ensureProfile 自动重部署完成（.runtime-version 0.1.8-0.1.1-rc.2-0f58d550）\n- [x] 7. 用户 GUI 验收（2026-08-22 用户确认\"没什么问题\"）：品牌瞳孔标记、\n      中文面板/汉化、better-sidebar 布局、模型选择器含 DeepSeek-V4-Flash-Vision-Exp\n- [x] 8. 提交（485c69a：pnpm-workspace.yaml + prepare-runtime.mjs + 本文档）\n\n### 过程修正（2026-08-22）\n\n首次跑 prepare-runtime：pnpm install 成功（901 包全 0.1.1-rc.2），但 `pnpm add 缺失 peer`\n在打印 \"Done in 16.4s\" 后进程不退出（慢网络下 supply-chain 全量验证挂起），被 10 分钟\ntimeout 杀死（spawnSync ETIMEDOUT）。实测 add 实际已完成：dependencies 已写入 20 个\npeer、pnpm-lock.yaml 已生成（759KB）、node_modules 完好。\n\n**脚本改进**（prepare-runtime.mjs）：\n1. 第 3 步注入 @deepseek-ai/dsh 时同步把 MISSING_PEERS 注入 dependencies\n   （版本随 DSH_VERSION 动态对齐，保持单一版本来源）；\n2. 删除 install 后的 pnpm add 步骤（peer 已是显式依赖，install 一步到位）；\n3. runPnpm timeout 10 分钟 → 30 分钟（慢网络兜底）。\n\n## 五、回滚\n\n- 构建侧：旧 dsh-runtime.tar.gz（git 无归档，构建产物）——本机安装目录归档\n  替换前保留原文件副本 `dsh-runtime.tar.gz.rc8.bak`。\n- 部署侧：deployRuntime 自带回滚（失败保留 .deploy.old，.runtime-version 归零\n  强制下次重部署）。\n"},{"file":"2026-08-22-open-sea-skin本地增强与SSiD集成.md","date":"2026-08-22","slug":"open-sea-skin本地增强与SSiD集成","title":"open-sea-skin 本地增强与 SSiD 集成（2026-08-22）","statusRaw":"已归档（2026-09-12 · 被 2026-08-29-SSiD升级执行记录.md 取代；原状态：进行中（推断 · 2026-09-12））","statusKind":"已归档","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["dsh-bundle","dsh-header-unify"],"summary":"open-sea-skin（d-dev0101/open-sea-skin，WebGPU 海洋皮肤，release tarball 安装）加入 SSiD 预制后，用户要求：设置面板增加「启用开关（ossEnabled）」「自动昼夜循环开关（autoCycle）」「恢复默认」按钮。","bytes":3445,"lines":42,"body":"# open-sea-skin 本地增强与 SSiD 集成（2026-08-22）\n\n> 状态：已归档（2026-09-12 · 被 `2026-08-29-SSiD升级执行记录.md` 取代；原状态：进行中（推断 · 2026-09-12））\n\n## 背景\n\nopen-sea-skin（d-dev0101/open-sea-skin，WebGPU 海洋皮肤，release tarball 安装）加入 SSiD 预制后，用户要求：设置面板增加「启用开关（ossEnabled）」「自动昼夜循环开关（autoCycle）」「恢复默认」按钮。\n\n## 决策：fork 本地构建，tarball 进归档\n\n- **不改官方 release 依赖**（URL tarball 无法承载改动，也不维护外部 fork 发布链路）\n- **本地 fork**：源码入库 `plugins/open-sea-skin/`（基于上游 main v1.2.1，去掉 .git），改动集中在 `shared/skin-core.js`\n- **构建产物**：`node scripts/build-runtime.mjs && node scripts/build-dsh-bundle.mjs` → `plugin/client.js`（skin-core + localStorage adapter 拼接）\n- **打包**：`npm pack` → `open-sea-skin-1.2.1.tgz`（383KB，24 文件，files 字段含 plugin/native-dist/cordis.patch.yml）\n- **预制引用**：`shell/profile-template/package.json` 依赖 `open-sea-skin: file:./vendor/open-sea-skin-1.2.1.tgz`（tarball 存 `shell/profile-template/vendor/`）——归档构建离线可用，不依赖上游 release\n\n## 改动内容（shared/skin-core.js）\n\n1. **启用开关**：面板新增 checkbox，绑定 `ossEnabled`；`applyEnabled` 调整——禁用时**只卸载海洋背景（frame/glass），保留按钮/面板**（否则设置入口消失无法再启用；2026-08-22 实测原实现 `unmount()` 会把按钮一起移除）\n2. **自动昼夜循环开关**：checkbox 绑定 `ossAutoCycle`（原面板无此开关，手动拖「日光」会置 false 且无法恢复）\n3. **恢复默认按钮**：重置 state 为 DEFAULTS（45/55/72/循环开）→ 写 localStorage 5 键 → 同步 UI/玻璃/海洋/启用状态\n4. 面板样式（.oss-switch / .oss-reset）沿用海洋主题（#8fe9e4 accent）\n\n## SSiD 集成链路（标题栏入口）\n\n- `shell/titlebar.html/js`：插件中心按钮左侧新增「海洋皮肤」按钮 → IPC `ssid:title:action('open-sea-skin')`\n- `shell/main.mjs`：action 通用转发（无需改）→ mainView 派发 `ssid:titlebar` detail='open-sea-skin'\n- `plugins/dsh-header-unify/lib/client.js`：监听该事件 → `document.getElementById('__open-sea-skin-btn__').click()`\n- **隐藏原浮动按钮**：`visibility:hidden + pointer-events:none`（**不能用 display:none**——面板按按钮 rect 定位，display:none 后 rect 全 0 面板飞出视口，2026-08-22 实测）\n- 标题栏 asar 热替换生效（`resources/app.asar` 解包→替换→重打包，原包备份 `app.asar.bak-0622`）；正式分发需 `npm run pack` 重新打安装包\n\n## 配置存储与重置（实证自 plugin/client.js）\n\nlocalStorage 5 键：`ossEnabled` / `ossSea` / `ossTime` / `ossGlass` / `ossAutoCycle`。\n手动重置（DevTools console）：`['ossEnabled','ossSea','ossTime','ossGlass','ossAutoCycle'].forEach(k => localStorage.removeItem(k))` 后刷新。\n面板「恢复默认」按钮等效实现（无需 DevTools）。\n\n## 后续注意\n\n- profile 的 node_modules/open-sea-skin 为手动替换的本地构建（1.2.1）；**执行 pnpm install 前须先完成归档流程**（否则被恢复为官方 1.2.0 URL 版）\n- 归档构建（prepare-runtime）时 file: tarball 依赖随 profile-template 复制，离线可装\n"},{"file":"2026-08-22-open-sea-skin增强版提交上游PR.md","date":"2026-08-22","slug":"open-sea-skin增强版提交上游PR","title":"open-sea-skin 增强版提交上游 PR（2026-08-22）","statusRaw":"已完成（推断 · 2026-09-12）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"前一决策（2026-08-22-open-sea-skin本地增强与SSiD集成.md）本地 fork 增强版已运行于 SSiD。用户要求：将增强改动整理成 commit 并向上游 d-dev0101/open-sea-skin 提 PR。","bytes":3028,"lines":44,"body":"# open-sea-skin 增强版提交上游 PR（2026-08-22）\n\n> 状态：已完成（推断 · 2026-09-12）\n\n## 背景\n\n前一决策（2026-08-22-open-sea-skin本地增强与SSiD集成.md）本地 fork 增强版已运行于 SSiD。用户要求：将增强改动整理成 commit 并向上游 d-dev0101/open-sea-skin 提 PR。\n\n## 调研结论\n\n- **本地 fork 与上游 main 的差异只有 4 个文件**：`shared/skin-core.js`（手写）+ `plugin/client.js`、`extension/content.js`、`native-dist/loader.js`（均由 build 脚本从 skin-core 生成，必须 byte-for-byte 同步）\n- 上游 main（2437d80）领先 v1.2.1 共 6 个提交（website/CI），本地 fork 基于 main 全量拷贝，PR 基线用 main\n- 上游 CONTRIBUTING 要求：改 shared/ 后跑 `npm run build`、更新 CHANGELOG.md、跑测试（installer 测试依赖 bash，Windows 跳过）\n- gh（Max-Null）已登录，有 repo 权限；Max-Null/open-sea-skin fork **尚未创建**，需先 fork\n\n## 提 PR 前的代码修正（评审发现的 3 个问题）\n\n1. **中文注释 → 英文**：原改动含「SSiD 增强（2026-08-22）」等内部注释，上游全英文注释，公开 PR 需剥离内部引用\n2. **autoCycle 复选框不同步 bug**：拖「日光」滑块的原始逻辑置 `state.autoCycle = false` 并保存，但新复选框仍显示勾选 → 同步 `cycleBox.checked`\n3. **reset 走单一写入路径**：改为 `save({...DEFAULTS}).then(...)`（save 内部已更新 state），避免先手动赋值 state 再写存储的重复路径\n\n## PR 核心卖点（对上游的价值）\n\n- 新增「启用」「自动昼夜循环」「恢复默认」3 个控件（修复禁用后不可再启用的逻辑缺陷）\n- 原版 disabled → `unmount()` 会删除按钮/面板 → 无法再启用；增强版只卸载海洋背景（frame/glass），保留设置入口\n\n## 执行结果\n\n- **PR 已创建并验证**：https://github.com/d-dev0101/open-sea-skin/pull/1 （OPEN, MERGEABLE）\n- commit `c73f133`（分支 `feat/quick-controls-enable-toggle`，作者 MaxNull / 24647158+Max-Null@users.noreply.github.com，含 CHANGELOG Unreleased）\n- 构建产物 `--check` 通过（byte-for-byte 同步）；static/bundle 测试除「site/index.html hash」外全绿——该失败为上游 main 既有问题（测试期望 hash 是按 LF 计算的 `69267b…`，Windows CRLF checkout 本地必失败，CI Linux 无碍），与本次改动无关\n- 本地 fork 4 个代码文件与 PR 分支完全一致（仅 CHANGELOG 差异预期内）\n- fork 仓库：https://github.com/Max-Null/open-sea-skin\n\n## 后续注意\n\n- 作者合并后如需回投 tarball 重建 SSiD vendor，按归档流程走（本次未重建）\n- 若作者未响应，可考虑跟进评论或关闭 PR（本地增强版不依赖合并，SSiD 继续用 file: tarball）\n\n## 不涉及\n\n- 不重建 SSiD vendor tarball / 归档（当前部署已用修正前版本且工作正常；下一轮归档时自然带入修正版）\n- 不改 package.json 版本（发版由维护者决定）\n"},{"file":"2026-08-22-SSiD归档重建与预置插件升级.md","date":"2026-08-22","slug":"SSiD归档重建与预置插件升级","title":"SSiD 归档重建与预置插件升级（2026-08-22，接手误关闭会话）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-plugin-center","@deepseek-ai/dsh","@max-null/dsh-chat-rail","@max-null/dsh-memory","dsh-runtime","dsh-plugin-center","dsh-better-sidebar","dsh-sidebar-qa","dsh-dream-skin","dsh-skin","dsh-chat-rail","dsh-memory"],"summary":"前一会话正在执行 SSiD 归档发版链时被误关闭（shell/dsh-runtime.tar.gz 落在 0 字节 = tar 阶段中断前的残留）。该会话已完成： - npm 发布链：chat-rail 0.3.1（tip 缩略图 + 收起态角标）、plugin-center 0.2.3（AI 推荐修复 + 0.2.1 发布时的文档复盘） - profile-template 依赖声明 @max-","bytes":4210,"lines":61,"body":"# SSiD 归档重建与预置插件升级（2026-08-22，接手误关闭会话）\n\n> 状态：进行中（推断 · 2026-09-12）\n\n## 背景\n\n前一会话正在执行 SSiD 归档发版链时被误关闭（`shell/dsh-runtime.tar.gz` 落在 0 字节 = tar 阶段中断前的残留）。该会话已完成：\n- npm 发布链：chat-rail 0.3.1（tip 缩略图 + 收起态角标）、plugin-center 0.2.3（AI 推荐修复 + 0.2.1 发布时的文档复盘）\n- profile-template 依赖声明 `@max-null/dsh-plugin-center` 升至 `^0.2.3`（未提交，本次并入）\n\n## 本次接手执行\n\n### 1. 预置插件版本对齐（shell/profile-template/package.json，commit 580a1b4）\n\n| 包 | 声明 | npm 最新 | 处理 |\n|---|---|---|---|\n| @max-null/* 全家桶 9 包 | 各 ^x.y.z | 全部一致 | 无需改（chat-rail ^0.3.1 / plugin-center ^0.2.3 等） |\n| dsh-better-sidebar | ^0.14.0 | 0.15.0 | 升 ^0.15.0 |\n| dsh-sidebar-qa | ^0.2.0 | 0.4.0 | 升 ^0.4.0 |\n| dsh-dream-skin / open-sea-skin / vendor 三件套 | — | — | 保持 |\n\n### 2. bundles 残留修复（关键，否则新归档部署即崩溃）\n\n`dsh.profile.bundles` 中：\n- **移除 `dsh-skin`**：依赖已在 e06a10a 移除，但 bundles 残留。kernel `resolveBundleDir` 对 bundle 列表逐包 resolve，找不到直接 throw（`cannot resolve profile bundle`）→ 新归档部署后思灵启动必崩。\n- **补入 `dsh-dream-skin`、`open-sea-skin`**：两包均声明 `dsh.bundle.patch`（npm view / tgz 实测确认），不进 bundles 皮肤不会加载。\n\n### 3. 归档重建与验证链（已执行 ✅）\n\n- `node scripts/prepare-runtime.mjs`：node 自动命中 PATH v26.2.0，pnpm 命中 %APPDATA% 全局 cjs（无需 DSH_NODE/PNPM_CMD）；pnpm install 19.6s（967 包，store 复用 906）+ vendor 兜底正常\n- 归档产物 `shell/dsh-runtime.tar.gz` **163.5 MB**，`.runtime-version = 0.1.8-0.1.1-rc.2-489c8bdf`\n- 归档冒烟（tar 解压 → Node UTF-8 核对实体 package.json，**勿信 pnpm view/乱码的 PowerShell 读取**）：\n\n| 包 | 归档内实体版本 | 期望 |\n|---|---|---|\n| @deepseek-ai/dsh | 0.1.1-rc.2 | ✅ |\n| @max-null/dsh-chat-rail | 0.3.1 | ✅（client.js 含 crl_tipImgCount / attachmentId 新代码） |\n| @max-null/dsh-plugin-center | 0.2.3 | ✅ |\n| @max-null/dsh-memory | 0.5.0 | ✅ |\n| dsh-better-sidebar | 0.15.0 | ✅ |\n| dsh-sidebar-qa | 0.4.0 | ✅ |\n| dsh-dream-skin | 0.4.10 | ✅ |\n| open-sea-skin | 1.2.1 | ✅（file: tarball 本地增强版） |\n| vendor 三件套 | header-unify 0.1.0 / ssid-panels 0.1.3 / ssid-zh-ui 0.1.0 | ✅ |\n\n- 安装目录归档已替换（`C:\\Users\\MaxNull\\AppData\\Local\\Programs\\ssid-shell\\resources\\dsh-runtime.tar.gz`，旧版备份 `.bak-0822`）；profile 现 `.runtime-version=0f58d550` ≠ 归档 `489c8bdf` → 思灵下次启动自动触发重部署\n- 运行 profile 全程未跑 pnpm install（pitfalls 第 11 节顺序约束 ✓，open-sea-skin 手动增强版未被恢复）\n\n### 4. v0.1.9 发版（已执行 ✅）\n\n- **版本决策**：远端 tag v0.1.8 已锚定 8/21 rc.8 时代提交（且 v0.1.7/v0.1.8 均未建 Release），本次 rc.2 内容不可复用 0.1.8 命名 → shell/package.json bump **0.1.9**（commit c5dd8fd）\n- 重跑 prepare-runtime：`.runtime-version = 0.1.9-0.1.1-rc.2-489c8bdf`（指纹与 0.1.8 版一致——依赖/vendor 未变，仅 ssid 版本号变化），冒烟全绿后替换安装目录归档（当前版备份 `.bak-0822b`）\n- `npm run pack`：after-pack 确认 dsh-runtime.tar.gz 163.5MB 入包 → **思灵 Setup 0.1.9.exe（253.9MB）** 签名 + blockmap ✓\n- tag v0.1.9 推送 + GitHub Release：https://github.com/Max-Null/seek-soul-in-darkness/releases/tag/v0.1.9（资产 Setup.0.1.9.exe / .blockmap，命名与 v0.1.6 一致；release-notes-v0.1.9.md 注明 v0.1.7/0.1.8 为本地构建未发）\n- 教训：`gh release create` 的 `--assets` 在 PowerShell 下必须单字符串逗号分隔（数组会展开成多个参数导致解析失败）；`gh release edit` 后再 `upload` 单独传资产更稳。\n\n### 5. 待办（用户操作）\n\n- [ ] `npm run pack`（electron-builder NSIS，含标题栏海洋皮肤按钮等 asar 改动）\n- [ ] GitHub Release（release-notes + 版本）\n"},{"file":"2026-08-20-输入框命令权限中文化-内部插件方案.md","date":"2026-08-20","slug":"输入框命令权限中文化-内部插件方案","title":"输入框命令/权限中文化：SSiD 内部插件方案","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":"MaxNull（方案由 DSH 源码调研得出）","purpose":null,"dateInBody":"2026-08-20","dateNote":null,"tags":["@max-null/dsh-ssid-zh-ui","@max-null/dsh-","dsh-ssid-zh-ui","dsh-header-unify"],"summary":"DSH Web GUI 整体已是中文（locale 系统存在且 zh 是键集源），但输入框两处内容仍为英文：","bytes":9662,"lines":131,"body":"# 输入框命令/权限中文化：SSiD 内部插件方案\n\n> 日期：2026-08-20\n> 决策人：MaxNull（方案由 DSH 源码调研得出）\n> 范围：仅 SSiD 内置（`plugins/` + `profile-template/vendor/`），不发布社区插件\n\n> 状态：已决策（推断 · 2026-09-12）\n\n## 一、背景与问题\n\nDSH Web GUI 整体已是中文（locale 系统存在且 zh 是键集源），但**输入框两处内容仍为英文**：\n\n| 位置 | 英文内容 | 原因 |\n|---|---|---|\n| 权限触发器（输入框盾牌按钮 + 菜单） | `Read Only` / `Workspace Write` / `Full access` | 客户端 `PermissionSelect.tsx` 把机器名 kebab 转 Title Case，`Full access` 为硬编码；host 端 `optionOf()` 未配置 name/description 时回退英文 |\n| `/` 命令弹窗（命令行） | 命令 description（`Switch the permission preset...` 等） | 各插件注册命令时 `description` 英文硬编码，未走 locale 字典 |\n\n目标用户：SSiD 非开发用户。命令名（`/compact` 等）是命令语法本身，不翻译；命令描述与权限展示名/描述需要中文化。\n\n## 二、可挂载点调研结论（DSH 源码）\n\n结论先行：**官方扩展面（slot / remote / provide 替换）均不可行，唯一可行且低侵入的挂点是 host 端包装服务实例方法**。\n\n| 候选挂点 | 结论 | 依据 |\n|---|---|---|\n| 客户端 slot 替换权限触发器 | ❌ | `PermissionSelect`/命令按钮是 `ui-conversation` `InputBar.tsx` 硬编码组件，不在 slot 里；`conversation.input.left/right` 文档明言 \"never replace\" 内置 chrome |\n| 客户端替换 `remote.commands` | ❌ | `RemoteNamespaceService` 经 `ctx.plugin` + `provide('remote.commands')` 注册，Cordis provide 唯一实现语义，重复提供抛错（`vendor/cordis/src/reflect.ts` L289） |\n| host 端 `ctx.provide` 替换 services | ❌ | 同上，provide 唯一性 |\n| **host 端包装服务实例方法** | ✅ | Cordis `ctx.get` 返回 traced proxy，`Symbol.for('cordis.original')` 可取原始实例（`vendor/cordis/src/utils.ts` L54/L117）；Typert gateway 每次 RPC 实时 `ctx.get(serviceKey)` 解析 receiver（`packages/api/gateway/src/index.ts` L150），`Reflect.get(receiver, method)` 实例 own 属性优先于原型（L163），`originalOf` 只用于 binding 验证（L537）——实例 `defineProperty` 包装方法对 Typert 反射无影响 |\n\n## 三、方案\n\n**新增 SSiD 内置插件 `@max-null/dsh-ssid-zh-ui`（纯 host 端，无 client half）**：\n\n```\nplugins/dsh-ssid-zh-ui/\n├── package.json        # @max-null/dsh-ssid-zh-ui；dsh.bundle.patch\n├── cordis.patch.yml    # insert 一行插件\n├── lib/index.mjs       # apply：inject ['commands','permissionPresets'] → 包装实例方法\n└── verify-zh-ui.cjs    # node 模拟验证（仿 verify-header-unify.cjs）\n```\n\n### 3.1 包装点\n\n1. **`ctx.commands.list(agent)`** → 返回的 descriptor 数组逐项替换 `description`（按命令名查中文表，未收录保持原样）。\n2. **`ctx.permissionPresets.optionOf(name)`** → 预设项返回中文 `name`/`description`；`custom` 分支固定中文。\n   - 客户端 `displayName()` 对非 kebab 字符串原样透传（`PermissionSelect.tsx` L55-58），中文 name 可直接显示；`selectFor` 内部 `this.optionOf(...)` 会解析到实例 own 属性（包装后的方法），投影/RPC/客户端整链路生效。\n\n### 3.2 实现要点\n\n- 用 `ctx.inject(['commands', 'permissionPresets'], cb)` 等待服务；Cordis 服务 HMR 重载后 inject 重新执行，包装跟随新实例。\n- 通过 `service[Symbol.for('cordis.original')] ?? service` 取原始实例，`Object.defineProperty` 包装（configurable: true），实例 own 属性遮蔽原型方法。\n- 包装幂等（实例上挂标记符号，防重复包装）。\n- 防御：包装失败 try/catch 记 `ctx.logger.warn`，绝不影响 host 启动。\n- wrapper 内用 `Reflect.apply(original, this, args)` 转发，保持 `this` 语义（`list` 内部调用 `this.view()` 等私有方法）。\n\n### 3.3 翻译表\n\n**命令描述**（官方 6 命令全收录，未知保留）：\n\n| 命令 | 中文描述 |\n|---|---|\n| `/compact` | 压缩当前会话的历史记录，释放上下文空间 |\n| `/feedback` | 对当前会话或消息提交反馈 |\n| `/goal` | 为当前会话设置长期执行目标 |\n| `/permission` | 切换权限模式（沙箱范围 + 审批策略） |\n| `/plan` | 进入或退出计划模式 |\n| `/export` | 导出当前会话日志为文件 |\n\n> hint（命令参数占位，如 `\u003cpreset>`）**不翻译**——它是命令语法提示，用户需输入机器值，避免误导。\n\n**权限预设**（覆盖三个默认预设 + custom）：\n\n| 预设 | name | description |\n|---|---|---|\n| `read-only` | 只读 | 仅允许读取与浏览，不授予文件修改或命令执行权限 |\n| `workspace-write` | 工作区写入 | 允许修改当前工作区文件；敏感操作与外部命令仍需逐项确认 |\n| `danger-full-access` | 完全访问 | 可直接执行敏感操作、文件修改或外部命令，不再逐项确认；仅建议在信任任务时使用 |\n| `custom` | 自定义 | 当前沙箱与审批设置不匹配任何预设 |\n\n## 三·五、演进记录（2026-08-20 实测后）\n\n### v1（host 包装）→ v2（client 展示层翻译）决策\n\nv1 实现为 host 端包装 `commands.list` / `permissionPresets.optionOf`，经 settings 语言开关控制翻译。**实测发现死结**：权限投影与命令目录的数据推送是事件驱动的（会话事件/`commands/change`），语言切换**不会触发数据重推**——host 翻译写入数据后，客户端缓存的中文无法切回英文，必须刷新页面才恢复。\n\n**v2 决策：翻译整体移到 client 展示层**：\n\n- host half 变 no-op（数据保持英文原文）。\n- client half 维护**英文原文 → 中文**翻译表（`TEXT_ZH`，文本全等匹配），按 `ctx.locale`（`locale/change` 事件）即时替换/恢复；MutationObserver 兜底 React 重渲染。\n- 替换范围限定 css-modules 原始段 + role 语义：`[class*=\"triggerLabel\"]`（输入框权限/模型触发器）、`[class*=\"selector\"]`（设置页选择器）、`[role=\"menuitem\"]`（菜单项）、`[role=\"option\"]`（命令/权限弹窗选项）。文本全等匹配，官方中文子串（「启用 Full access」）与消息正文不受影响。\n- 权限名中客户端 `PermissionSelect.tsx` 对 `danger-full-access` 硬编码 `Full access`，host 数据无法覆盖——v2 一并由展示层替换为「完全访问」（含菜单项、弹窗选项、设置页选择器）。\n\n**翻译表**（`TEXT_ZH`，11 条 + `ZH_TO_EN` 1 条）：\n\n| 英文原文（rc.8） | 中文 |\n|---|---|\n| `Read Only` / `Workspace Write` / `Full access` / `Custom` | 只读 / 工作区写入 / 完全访问 / 自定义 |\n| `Compact older conversation history` | 压缩当前会话的历史记录，释放上下文空间 |\n| `set or view the goal for a long-running task` | 为当前会话设置长期执行目标 |\n| `Enter or leave plan mode` | 进入或退出计划模式 |\n| `Switch the permission preset (sandbox mode + approval policy)` | 切换权限模式（沙箱范围 + 审批策略） |\n| `Download this Session log as a ZIP archive` | 导出当前会话日志为文件 |\n| `record feedback about this session` | 对当前会话或消息提交反馈 |\n| `Select the model for this conversation` ↔ `选择本会话使用的模型` | 双向（`/model` 命令描述） |\n\n> `/model` 双向兜底：官方 `ui-model-selection` 的命令描述**注册时快照 locale，切语言不刷新**（源码注释明言）。插件用 `ZH_TO_EN` 反向表兜底：中文界面把英文快照转中文，英文界面把中文快照转英文。两表键集互斥（英文键集 vs 中文键集），restore + 正向替换顺序无冲突。\n\n### 实测验收（用户，2026-08-20）\n\n中文界面权限「只读/工作区写入/完全访问」、命令描述中文；切 English 全部即时恢复英文；切回中文即时恢复。`verify-zh-ui.cjs` 43 项断言全过。\n\n## 四、装配与分发\n\n1. 源码：`plugins/dsh-ssid-zh-ui/`（SSiD 仓库内置，仿 `dsh-header-unify`）。\n2. vendor 分发：`shell/profile-template/vendor/dsh-ssid-zh-ui/`（lib 产物副本），`profile-template/package.json` dependencies + bundles 各加一行 `file:./vendor/...`。\n3. 发布链：`scripts/prepare-runtime.mjs` 重跑（新归档含本插件），后续随 SSiD 版本发布。\n4. 本机验证：vendor 副本 + profile `package.json` + pnpm install + 重启 dsh web。\n\n## 五、验证计划\n\n1. `verify-zh-ui.cjs`：node 模拟——翻译表覆盖断言、`wrapList` 翻译/未知保留、`wrapOptionOf` 预设中文/custom 中文/未知走原逻辑、实例 own 属性遮蔽断言。\n2. 实机（本机 ssid profile + 3080 GUI）：权限按钮显示「工作区写入」、菜单「只读/工作区写入/Full access」、tooltip 中文描述；`/` 命令弹窗 description 中文；`/permission` 执行不受影响（机器值不变）。\n3. HMR/重载：改插件重启 profile 后包装仍生效。\n\n## 六、风险与边界\n\n- **上游演进**：DSH 若把命令 description 接入 locale（PR 方向），本插件翻译表可能与其重叠——届时保留本插件（内部用户零感知）或移除（让位上游），二选一。\n- **rc 版本差异**：本方案针对 rc.8 产物（profile 已实测）；上游 master 的 `optionOf`/`list` 签名与 rc.8 一致（源码调研）。\n- **全家桶命令**：`@max-null/dsh-*` 若有自注册命令，未收录时保持英文（兜底不破坏）。\n"},{"file":"2026-08-19-记忆插件升级-实施.md","date":"2026-08-19","slug":"记忆插件升级-实施","title":"记忆插件升级实施：审核与注入解耦（0.3.0）","statusRaw":"实施完成（代码/单测/端点验证全过），待 UI 实机验证 + 发布（部分结论已被 2026-08-19-记忆面板归属迁移-dsh-memory自带UI.md 取代 · 2026-09-12）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["dsh-memory","dsh-ssid-panels"],"summary":"迁移规则（读旧 schema 兼容转换，不重写文件）： - 旧 auto → { status:'approved', injected:true }（行为不变） - 旧 suggest → { status:'suggested', injected:false } - 旧 suggested / 缺 injected → { status:'suggested', injected:false","bytes":3748,"lines":56,"body":"# 记忆插件升级实施：审核与注入解耦（0.3.0）\n\n> 日期：2026-08-19\n> 状态：**实施完成（代码/单测/端点验证全过），待 UI 实机验证 + 发布**（部分结论已被 `2026-08-19-记忆面板归属迁移-dsh-memory自带UI.md` 取代 · 2026-09-12）\n> 涉及仓库：`H:\\MaxNull\\WorkStation\\dsh-memory`（0.2.2 → **0.3.0 已提交 7ea4b1e**）、SSiD 仓库 `plugins/dsh-ssid-panels`（**已提交 472c965**）\n\n---\n\n## 一、设计要点回顾（读源码实证后确认）\n\n| 通道 | 现状（v0.2.2） | 改后（0.3.0） |\n|---|---|---|\n| 状态 | `suggested\\|auto\\|suggest` | `suggested\\|approved` + `injected: boolean`（二维） |\n| 注入 | `list({status:'auto'})` 全量注入 | `list({status:'approved', injected:true})` |\n| confirm | `setStatus(id,'auto')` | `setStatus(id,'approved')`（审核语义，不触发注入） |\n| 检索 | memory_search 任意 status | 不变（含 suggested，已确认决策） |\n| RPC | list/search/confirm/forget/reload | + `setInjected(id, boolean)` |\n\n**迁移规则**（读旧 schema 兼容转换，不重写文件）：\n- 旧 `auto` → `{ status:'approved', injected:true }`（行为不变）\n- 旧 `suggest` → `{ status:'suggested', injected:false }`\n- 旧 `suggested` / 缺 injected → `{ status:'suggested', injected:false }`\n- `approved` + 缺 injected → `injected:false`（新写路径）\n\n## 二、改造清单\n\n### dsh-memory（src/）\n| # | 文件 | 改动 |\n|---|---|---|\n| 1 | `engine.ts` | `MemoryStatus='suggested'\\|'approved'`；`StoredBlock`/`MemoryRecord` 加 `injected: boolean`；schema 兼容旧值（status 保留 auto/suggest 枚举 + injected optional）+ `normalizeBlock()` 迁移；`MemoryFilter` 加 `injected?`；list 过滤 injected；新增 `setInjected(id, injected)` |\n| 2 | `index.ts` | RECORD_SCHEMA/tool record 加 injected、status enum 改 approved；`recallText` 只取 approved+injected:true；`memory_confirm` 语义改审核 + 双语描述；GUIDANCE 双语重写；memory_list/search 参数加 injected |\n| 3 | `remote.ts` | `confirm` → setStatus(approved)；新增 `@Remote('setInjected')` |\n\n### dsh-ssid-panels（SSiD 仓库 plugins/dsh-ssid-panels）\n| # | 改动 |\n|---|---|\n| 4 | 记忆 tab：卡片「常驻注入」开关（approved 可切、suggested 禁用）→ `api('memory.setInjected', ...)` |\n| 5 | 三组分组（待审核/按需/常驻注入）+ namespace 筛选 + 中英文案（待审核/已审核/常驻注入） |\n| 6 | 记忆 tab 头部「整理记忆」按钮：`sessions.create` → `open` → input 就绪 `setDraft` → `submit`（一点即发） |\n\n## 三、验证计划\n\n- [x] dsh-memory：typecheck + vitest（**10 项全过**：新增默认不注入/recall 过滤/list 过滤/setInjected/旧数据迁移 5 项）\n- [x] 真实存储迁移：dev 实机 `/ssid/api/memory.list`——**3 条旧 auto 全部 approved+injected:true**（注入行为不变）\n- [x] setInjected 端点：关闭→injected=false（list 复核 3→2），恢复→true\n- [x] panels：build 通过 + vendor 同步（robocopy /MIR）\n- [ ] dev 实机 UI：三组分组/筛选正确；开关→注入行为变化；「整理记忆」按钮流程（sessions.create→open→input 就绪→setDraft→submit，**hero 页/会话页两场景**）\n- [ ] 回归：迁移后注入行为不变（已由迁移验证覆盖）\n\n## 四、发布链（清单 7-8）\n\n1. dsh-memory 0.3.0 npm publish（用户 OTP；已登录 max-null）\n2. dsh-ssid-panels 0.1.3（vendor 分发，不发布 npm）→ 已同步 vendor + 提交\n3. SSiD profile-template：dsh-memory ^0.2.0 → ^0.3.0 + pnpm-workspace 豁免 0.3.0\n4. prepare-runtime（**与 v0.1.6 发布链耦合**：plugin-center 0.1.7 + dsh-memory 0.3.0 一次归档重建）\n"},{"file":"2026-08-19-记忆面板归属迁移-dsh-memory自带UI.md","date":"2026-08-19","slug":"记忆面板归属迁移-dsh-memory自带UI","title":"记忆面板归属迁移 + 工作区路由：dsh-memory 自带 client UI","statusRaw":"已决策，实施中","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["dsh-memory","dsh-ssid-panels"],"summary":"1. 记忆的面板应该跟随 dsh-memory，放在 dsh-ssid-panels 不合适 → 已实施（0.3.3 自带 client UI，侧栏 tab + 设置页兜底入口） 2. 工作区语义：设置页/侧栏都保留\"工作区 tab 显示当前会话工作区的 project 记忆\"；未选择工作区时显示\"未选择工作区\"；术语统一用「工作区」（不用「项目」）","bytes":3442,"lines":70,"body":"# 记忆面板归属迁移 + 工作区路由：dsh-memory 自带 client UI\n\n> 日期：2026-08-19\n> 状态：**已决策，实施中**\n> 关联：`docs/设计/2026-08-16-记忆UI面板-实现设计.md`（当时结论：Typert remote 独立包不可做、面板落 SSiD 侧——**该前提已过时**：dsh-memory 0.1.x 已自带 MemoryGateway remote，client 数据通道成立）\n\n---\n\n## 一、用户反馈（两轮）\n\n1. 记忆的面板应该跟随 dsh-memory，放在 dsh-ssid-panels 不合适 → **已实施**（0.3.3 自带 client UI，侧栏 tab + 设置页兜底入口）\n2. **工作区语义**：设置页/侧栏都保留\"工作区 tab 显示当前会话工作区的 project 记忆\"；未选择工作区时显示\"未选择工作区\"；术语统一用「工作区」（不用「项目」）\n\n## 二、现状与问题\n\n| 项 | 现状 |\n|---|---|\n| 记忆 UI（MemoryView） | ✅ 已迁至 dsh-memory 自带（remote.memory 直连） |\n| **project 记忆路由** | ❌ 引擎固定 `process.cwd()/.dsh/storages`——**未真正跟随工作区**（会话切换 workspace 不感知） |\n| 术语 | 「项目」与「工作区」割裂 |\n\n## 三、工作区路由机制（读代码实证）\n\n| 层 | 取 cwd 的路径 |\n|---|---|\n| 工具执行 | `exec.agent.session.header.cwd`（`tool-fs/session-cwd.ts` 先例——fs 工具已按会话工作区路由） |\n| 侧栏 tab | `TabComponentProps.scope.cwd`（SessionScope） |\n| 设置页 | `sessions.list 快照 byId[current].cwd`（SessionSummary.cwd，host 侧 summary 实证） |\n\n## 四、实施清单（0.3.4）\n\n### engine.ts：project 按 cwd 路由\n| # | 改动 |\n|---|---|\n| 1 | `projectRootFor(cwd)` = `join(cwd, '.dsh', 'storages')`；project 域按 cwd 懒打开 + 缓存（Map\u003ccwd, facility>，backend 名 hash cwd 防重名） |\n| 2 | 所有方法加 `projectCwd?` 参数（调用级，支持多会话并发各自工作区）：remember/list/search/forget/setStatus/setInjected/update 的 project 分支按 cwd 路由；无 cwd → project 部分为空 |\n| 3 | reload：global + 全部已开 project 域重开 |\n\n### index.ts：工具层\n| # | 改动 |\n|---|---|\n| 4 | 各工具 `execute(args, exec)` 取 `exec.agent?.session?.header?.cwd` 传给 engine |\n\n### remote.ts：面板通道\n| # | 改动 |\n|---|---|\n| 5 | remote 方法加 `cwd?` 参数（list/confirm/forget/setInjected/update/reload） |\n\n### client/index.tsx：面板\n| # | 改动 |\n|---|---|\n| 6 | MemoryView 加 `cwd?: string`：侧栏传 `scope.cwd`；设置页传 `sessions 快照 byId[current].cwd`（渲染时读快照） |\n| 7 | 无 cwd（未选工作区）：工作区组显示「未选择工作区」占位 |\n| 8 | 文案：`nsProject` → 「工作区」/「Workspace」，统一术语 |\n\n## 五、验证\n\n- [ ] dsh-memory：typecheck + vitest（新增按 cwd 路由单测：两个 cwd 的 project 记忆互不可见）\n- [ ] SSiD dev：侧栏工作区 tab 显示当前会话工作区记忆；未选工作区显示占位\n- [ ] 设置页：工作区 tab 同样跟随当前会话\n- [ ] 工具：会话 A（cwdA）memory_save → 会话 B（cwdB）不可见；同 cwd 可见\n\n## 六、风险\n\n| 项 | 说明 |\n|---|---|\n| 多会话并发 | cwd 是调用级参数，subagent 各会话各自 cwd ✓ |\n| 旧数据 | 旧 `process.cwd()` 根下的 memory_project.json 不再读取（工作区路由后）——旧文件保留不删 |\n| 术语变更 | 面板/工具描述/self 描述统一「工作区」\n"},{"file":"2026-08-19-记忆面板刷新机制.md","date":"2026-08-19","slug":"记忆面板刷新机制","title":"记忆面板刷新机制：外部编辑文件后重载存储","statusRaw":"进行中","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["dsh-memory","dsh-ssid-panels"],"summary":"外部应用编辑记忆文件后，SSiD 记忆面板一直显示旧数据。","bytes":1557,"lines":34,"body":"# 记忆面板刷新机制：外部编辑文件后重载存储\n\n日期：2026-08-19\n状态：进行中\n\n## 用户实测问题\n\n外部应用编辑记忆文件后，SSiD 记忆面板一直显示旧数据。\n\n## 根因（源码确认）\n\n- DSH `JsonStorageBackend`（storage-json）**打开时 loadAll 一次进内存**，\n  之后读写走内存、写时 atomic 落盘——**无 watch、无 reload API**\n  （packages/storage 全 grep reload 无匹配）。\n- dsh-memory 的 `list()` 读 domain table（内存缓存）→ 外部文件编辑不感知。\n- panels MemoryView 挂载时拉一次，无刷新按钮/可见性重拉。\n\n## 修复\n\n1. **dsh-memory 0.2.1**：`MemoryService.reload()`——关闭 domain 重开\n   （facility.closeAll → 重新 open 两域），放弃内存缓存强制重读文件。\n   - engine.ts 重构：facility/table 提为字段，init 与 reload 共用 openDomains()；\n     关闭效应改为引用当前 facility。\n2. **dsh-ssid-panels 0.1.3**：MemoryView 加「刷新」按钮（调 memory.reload\n   → memory.list 重拉）；tab 可见时自动重拉（visible prop，与其他 tab 一致）。\n   - host 端点：`memory.reload`（调 memory.reload?.() 后返回 list）。\n3. 发布链：dsh-memory npm 0.2.1 → SSiD 依赖/豁免/缓存 → 归档 → 冒烟 → pack。\n\n## 验证\n\n- [ ] dsh-memory typecheck/build、reload 单测（写文件 → reload → list 新数据）\n- [ ] panels typecheck/build + vendor 同步\n- [ ] 归档冒烟 + 用户实测：外部编辑文件 → 面板点刷新即见新数据\n"},{"file":"2026-08-19-预设插件更新检查-better-sidebar升级.md","date":"2026-08-19","slug":"预设插件更新检查-better-sidebar升级","title":"执行记录：预设插件更新检查 + dsh-better-sidebar 升级 0.13.1","statusRaw":"已完成","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["@huanlin/dsh-plugin-better-sidebar-plugin-office","@max-null/dsh-chat-rail","@max-null/dsh-chinese-thinking","@max-null/dsh-guardian","@max-null/dsh-habit","@max-null/dsh-memory","@max-null/dsh-plugin-center","@max-null/dsh-skill-mcp-center","@max-null/dsh-node-appearance","@max-null/dsh-ssid-panels","@deepseek-ai/dsh-base","dsh-better-sidebar"],"summary":"官方 bundle（@deepseek-ai/dsh-base / dsh-web-app）随 DSH 内核分发，不在检查范围。 dev profile 的 dsh-sidebar-preview-select（link: 本地源码）为 dev 专属实验插件，npm 404、不在模板，未纳入。","bytes":2903,"lines":56,"body":"# 执行记录：预设插件更新检查 + dsh-better-sidebar 升级 0.13.1\n\n> 日期：2026-08-19\n> 状态：已完成\n> 执行人：MaxNull（AI 代执行）\n> 关联：SSiD 预设插件清单（shell/profile-template/package.json）\n\n---\n\n## 一、检查结果（全部 14 个 registry 依赖 + 1 个 vendor + 2 个官方 bundle）\n\n| 包 | 模板声明 | dev 实际 | npm latest | 结论 |\n|---|---|---|---|---|\n| @huanlin/dsh-plugin-better-sidebar-plugin-office | ^0.1.0 | 0.1.0 | 0.1.0 | ✅ 最新 |\n| @max-null/dsh-chat-rail | ^0.1.0 | 0.1.0 | 0.1.0 | ✅ 最新 |\n| @max-null/dsh-chinese-thinking | ^0.2.0 | 0.2.0 | 0.2.0 | ✅ 最新 |\n| @max-null/dsh-guardian | ^0.1.0 | 0.1.0 | 0.1.0 | ✅ 最新 |\n| @max-null/dsh-habit | ^0.1.0 | 0.1.0 | 0.1.0 | ✅ 最新 |\n| @max-null/dsh-memory | ^0.2.0 | 0.2.2 | 0.2.2 | ✅ 最新（dev 已升） |\n| @max-null/dsh-plugin-center | ^0.1.5 | 0.1.5 | 0.1.5 | ✅ 最新 |\n| @max-null/dsh-skill-mcp-center | ^0.1.0 | 0.1.0 | 0.1.0 | ✅ 最新 |\n| @max-null/dsh-node-appearance | ^0.1.1 | 0.1.1 | 0.1.1 | ✅ 最新（本次会话已升） |\n| **dsh-better-sidebar** | ^0.13.0 | 0.13.0 | **0.13.1** | ⚠️ **本次升级** |\n| dsh-excel-panel | ^0.6.1 | 0.6.1 | 0.6.1 | ✅ 最新 |\n| dsh-sidebar-qa | ^0.2.0 | 0.2.0 | 0.2.0 | ✅ 最新 |\n| dsh-skin | ^0.4.1 | 0.4.1 | 0.4.1 | ✅ 最新 |\n| dsh-video-preview | ^0.1.1 | 0.1.1 | 0.1.1 | ✅ 最新 |\n| @max-null/dsh-ssid-panels（vendor） | file: 0.1.2 | — | 不发布 npm | ✅ 源码构建与 vendor MD5 全等 |\n\n官方 bundle（@deepseek-ai/dsh-base / dsh-web-app）随 DSH 内核分发，不在检查范围。\ndev profile 的 `dsh-sidebar-preview-select`（link: 本地源码）为 dev 专属实验插件，npm 404、不在模板，未纳入。\n\n## 二、唯一可更新项：dsh-better-sidebar 0.13.0 → 0.13.1\n\n- 0.13.1 发布于 2026-08-18（\u003c7 天，需豁免）；peer/deps 声明与 0.13.0 同代（rc.7 系，与当前 DSH 兼容）\n- 模板声明 `^0.13.0` 已允许 0.13.1（发布自动取 0.13.1），**模板 package.json 无需改**\n\n## 三、改动清单\n\n| 文件 | 改动 |\n|---|---|\n| `~/.dsh/profiles/ssid/pnpm-workspace.yaml` | minimumReleaseAgeExclude 加 `dsh-better-sidebar@0.13.1` |\n| `shell/profile-template/pnpm-workspace.yaml` | 同上（发布侧豁免，保证 prepare-runtime 构建不被 age 策略拦截） |\n| dev profile | `pnpm update dsh-better-sidebar` → 实装 0.13.1，lockfile 更新 |\n\n## 四、验证\n\n1. `pnpm update` 成功（exit 0），node_modules 实装 **0.13.1**\n2. `pnpm peers check`：与升级前完全一致（8 项既有问题，无新增）\n3. 两处 pnpm-workspace.yaml YAML 校验通过\n\n## 五、备注\n\n- 下次发布 SSiD 安装包时 runtime 自动包含 0.13.1（模板 ^0.13.0 解析到 latest）。\n- 更新检查方式备忘：`npm view \u003cpkg> version` 批量对比模板声明与 dev 实装，见本文档第一节表格。\n"},{"file":"2026-08-19-chat-rail-加入SSiD预设.md","date":"2026-08-19","slug":"chat-rail-加入SSiD预设","title":"执行记录：dsh-chat-rail 加入 SSiD 预设插件","statusRaw":"已完成","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["@max-null/dsh-chat-rail","@deepseek-ai/cordis","@deepseek-ai/dsh-session-projection","dsh-chat-rail","dsh-session-projection","dsh-better-sidebar","dsh-chat-timeline"],"summary":"@max-null/dsh-chat-rail@0.1.0（画卷式消息导航）已加入 SSiD 预设插件： 开发 profile 与发布模板两处同步，依赖安装成功、peer 无新增缺失、语法校验通过。","bytes":2726,"lines":40,"body":"# 执行记录：dsh-chat-rail 加入 SSiD 预设插件\n\n> 日期：2026-08-19\n> 状态：已完成\n> 执行人：MaxNull（AI 代执行）\n> 前置决策：[2026-08-18-消息导航自研-放弃第三方rail.md](2026-08-18-消息导航自研-放弃第三方rail.md)（执行顺序的「装入 ssid profile 实测」落点）\n> 关联清单：[SSiD-插件清单.md](../设计/SSiD-插件清单.md) 2.1 已就绪自研预制项\n\n---\n\n## 一、结论\n\n`@max-null/dsh-chat-rail@0.1.0`（画卷式消息导航）已加入 SSiD 预设插件：\n开发 profile 与发布模板两处同步，依赖安装成功、peer 无新增缺失、语法校验通过。\n\n## 二、改动清单\n\n| 文件 | 改动 |\n|---|---|\n| `~/.dsh/profiles/ssid/package.json`（开发 profile） | dependencies + `dsh.profile.bundles` 各加 `@max-null/dsh-chat-rail` |\n| `~/.dsh/profiles/ssid/pnpm-workspace.yaml` | `minimumReleaseAgeExclude` 加 `@max-null/dsh-chat-rail@0.1.0`（新发布包豁免） |\n| `shell/profile-template/package.json`（发布模板） | 同上 dependencies + bundles 两处 |\n| `shell/profile-template/pnpm-workspace.yaml` | 同上豁免项 |\n\n## 三、验证结果\n\n1. **安装**：profile 内 `pnpm install` 成功（exit 0，+1 包），`node_modules/@max-null/dsh-chat-rail@0.1.0` 就位，包内容完整（`lib/index.mjs` host 半端 + `lib/client.js` client 半端 + `cordis.patch.yml` bundle patch）。\n2. **Peer**：5 个 peer 全部满足——`@deepseek-ai/cordis@4.0.1`（cordis-plugin-group 带入）、`@deepseek-ai/dsh-session-projection@0.1.0-rc.7`（官方聚合包直接依赖）、`dsh-better-sidebar@0.13.0`、`react@18.3.1`、`react-dom@18.3.1`。`pnpm peers check` 无 chat-rail 相关条目（既有 missing peer 均为官方 rc.7 包间关系，与本次无关）。**prepare-runtime.mjs 的 MISSING_PEERS 无需补充**——chat-rail 的 peer 均由官方依赖树自动带入，runtime 构建（模板 + 官方包注入 + pnpm install）与开发 profile 同源。\n3. **语法**：4 个改动文件 JSON/YAML 校验全过；chat-rail 的 cordis.patch.yml（`insert: chat-rail`）语法正确，与已加载插件同模式。\n4. **插件测试**：dsh-chat-rail 仓库 `npm test` 通过（exit 0；该版本 tests 目录无 spec 用例）。\n\n## 四、生效方式\n\nbundle 声明在 DSH 进程启动时加载：**重启思灵（或当前 GUI 会话）后**，右侧画卷式消息导航 rail 生效。\n\n## 五、备注\n\n- dsh-chat-timeline（第三方）此前已移除（决策文档要求的执行步骤），本次 package.json 确认无残留。\n- 下次发布 SSiD 安装包时，`prepare-runtime.mjs` 重新打包 runtime 即自动包含 chat-rail（模板已更新），无需其他手工步骤。\n"},{"file":"2026-08-19-dsh-node-appearance-加入SSiD预设.md","date":"2026-08-19","slug":"dsh-node-appearance-加入SSiD预设","title":"执行记录：dsh-node-appearance 加入 SSiD 预设插件","statusRaw":"已完成","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["@max-null/dsh-node-appearance","@deepseek-ai/cordis","dsh-node-appearance","dsh-ssid-panels","dsh-client-runtime","dsh-client-ui-settings","dsh-client-ui-settings-plugins","dsh-settings"],"summary":"@max-null/dsh-node-appearance@0.1.0（节点外观：按节点类型/工具名配色的可配置配色 + 思考过程显示开关） 已加入 SSiD 预设：发布模板（profile-template）补齐 vendor + 依赖 + bundle 声明。 与 chat-rail 的差异：chat-rail 已发布 npm（registry 依赖）；node-appearance 未发布 ","bytes":5300,"lines":80,"body":"# 执行记录：dsh-node-appearance 加入 SSiD 预设插件\n\n> 日期：2026-08-19\n> 状态：已完成\n> 执行人：MaxNull（AI 代执行）\n> 关联：[2026-08-18-工作区内部插件与vendor同步约定.md](2026-08-18-工作区内部插件与vendor同步约定.md)、[2026-08-19-chat-rail-加入SSiD预设.md](2026-08-19-chat-rail-加入SSiD预设.md)\n\n---\n\n## 一、结论\n\n`@max-null/dsh-node-appearance@0.1.0`（节点外观：按节点类型/工具名配色的可配置配色 + 思考过程显示开关）\n已加入 SSiD 预设：发布模板（profile-template）补齐 vendor + 依赖 + bundle 声明。\n\n**与 chat-rail 的差异**：chat-rail 已发布 npm（registry 依赖）；node-appearance **未发布 npm**\n（npm 404 实测确认），按 dsh-ssid-panels 模式走 **vendor 本地分发**（`file:./vendor/...`）。\n\n## 二、改动清单\n\n| 文件 | 改动 |\n|---|---|\n| `shell/profile-template/vendor/dsh-node-appearance/` | **新增**：`lib/`（工作区最新构建产物）+ `package.json` + `cordis.patch.yml` |\n| `shell/profile-template/package.json` | dependencies 加 `\"@max-null/dsh-node-appearance\": \"file:./vendor/dsh-node-appearance\"`；bundles 加 `\"@max-null/dsh-node-appearance\"` |\n| 开发 profile（`~/.dsh/profiles/ssid`） | 原本已有（dependencies + bundles），**本次未改声明**；vendor 恢复为与 node_modules 一致的既有构建 |\n\n## 三、验证结果\n\n1. **构建产物三方一致**：工作区源码 `npm run build` → `lib/` 同步到模板 vendor，MD5 全等（tsdown 输出确定性已实测：连续两次构建 MD5 相同）。\n2. **插件测试**：`npm test`（vitest）20/20 通过（palette 16 + config 4）。\n3. **语法**：模板 package.json JSON 校验通过；`pnpm install` 在 dev profile 实测 exit 0。\n4. **peer**：5 个 peer 全部由官方依赖树满足（`@deepseek-ai/cordis`、`dsh-client-runtime`、`dsh-client-ui-settings`、`dsh-client-ui-settings-plugins`、`dsh-settings`、`react`），无需补 MISSING_PEERS。\n5. **发布路径**：prepare-runtime 重新打包时，全新环境无旧 store 快照，`pnpm install` 会把模板 vendor（最新构建）打包进运行时——**发布版即最新构建**。\n\n## 四、重要发现：pnpm file: 依赖的 store 快照机制（坑）\n\n调试中踩到的 pnpm 11 行为，记录备查：\n\n- **node_modules 里的 file: 依赖副本 = pnpm store 的内容寻址快照（硬链接）**，\n  **不是** vendor 目录的实时复制。\n- lockfile 指纹（如 `10b771...`）是 **peer 组合指纹，与目录内容无关**；\n  目录内容变化**不会**让 pnpm 重新打包。\n- `pnpm install`（含 `--force`）、`pnpm update \u003cpkg>`、删除 vendor 目录、\n  删除 file+H++ 缓存目录、删除 store 内容文件——**都无法**让 pnpm 重新打包 vendor 目录；\n  它总从 store 旧快照恢复 node_modules 副本。\n- **结论**：vendor 内容更新后，**node_modules 不会自动跟随**。更新流程：\n  1. 工作区改源码 → `npm run build`\n  2. `robocopy \u003cws>/lib \u003cvendor>/lib /MIR`（注意：**不要用 PowerShell `Copy-Item` 覆盖已存在目录**，会生成 `lib\\lib` 嵌套，破坏目录结构——pnpm 对结构异常目录会 fallback 到 registry 解析，未发布包直接 404）\n  3. 若需 dev 环境立即生效：**手动复制 lib 到 node_modules 副本**（覆盖硬链接），或等待下一次全新部署\n  4. 发布版不受影响（全新环境直接打包新内容）\n\n## 五、备注\n\n- dev profile 的 node_modules/vendor/store 三方已恢复一致（既有构建，功能与最新构建等价——CSS 键集合 21 项完全一致，仅映射顺序差异）。\n- 若未来 node-appearance 发布 npm，可把依赖从 `file:./vendor/...` 切换为 registry 版本，届时不再需要 vendor 同步。\n\n## 六、升级：0.1.0 → 0.1.1（发布 npm，切 registry）\n\n> 日期：2026-08-19，状态：已完成\n\n**触发**：`@max-null/dsh
