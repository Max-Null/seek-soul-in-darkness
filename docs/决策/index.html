<script>var DATA={"entries":[{"file":"2026-09-13-SSiD决策总表-内核升级与壳路线.md","date":"2026-09-13","slug":"SSiD决策总表-内核升级与壳路线","title":"SSiD 内核升级决策总表（0.1.2-rc.1 → 0.1.5-rc.2）","statusRaw":"已决策","statusKind":"已决策","owner":"MaxNull","purpose":null,"dateInBody":"2026-09-13","dateNote":null,"tags":["@max-null/readme.md","dsh-web-runtime","dsh-web","dsh-pocket","dsh-capture","dsh-app"],"summary":"本轮内核升级牵出的决策超出了「升个版本」的范围：它同时暴露了一处工作区级的资源冲突（共享 checkout）、三处被内核逼出的适配、以及若干跨轮次才能定的路线选择（换不换桌面壳、做不做签名、移不移内核进程）。 这些决策如果只留在对话里，下次会被重新讨论一遍；只看执行记录又会缺「为什么没走另一条路」。需要一份能让人独立复盘的落盘：选项、否决理由、以及生效条件（\"现在不做\"和\"永远不做\"必须区分开）。","bytes":15496,"lines":153,"body":"# SSiD 内核升级决策总表（0.1.2-rc.1 → 0.1.5-rc.2）\n\n> 日期：2026-09-13\n> 状态：已决策\n> 决策人：MaxNull\n> 配套：`2026-09-12-SSiD内核升级-0.1.5-rc.2.md`（执行记录与证据）、`SSiD内核升级报告-0.1.5-rc.2.html`（全景报告）\n\n> 本篇是四段模板的第二个应用。与执行记录的分工：**执行记录回答「发生了什么」，本篇回答「定了什么、排除了什么、为什么」**。\n> 用户的原始要求：*「不止记录要做什么，也要记录不要做什么，更要记录为什么这样决策」*——所以 `Alternatives considered` 一节是本篇的主体，不是附录。\n\n## Problem\n\n本轮内核升级牵出的决策超出了「升个版本」的范围：它同时暴露了一处**工作区级**的资源冲突（共享 checkout）、三处**被内核逼出**的适配、以及若干**跨轮次才能定**的路线选择（换不换桌面壳、做不做签名、移不移内核进程）。\n\n这些决策如果只留在对话里，下次会被重新讨论一遍；只看执行记录又会缺「为什么没走另一条路」。需要一份能让人**独立复盘**的落盘：选项、否决理由、以及**生效条件**（\"现在不做\"和\"永远不做\"必须区分开）。\n\n## Decision\n\n### D1 升级目标取 `0.1.5-rc.2`（而非核对清单写的 rc.1）｜**已执行**\n\n核对清单（2026-09-10 版）写的是 rc.1，但执行时 npm `next` 已是 rc.2（rc.1 停在 `latest`）。实测二者对本轮**唯一的破坏性变更完全一致**（`packages/preset/` 下 rc.1→rc.2 只改 package.json 版本号），故取更新者。\n\n### D2 共享 checkout 加红线 + web 版内核隔离｜**已执行**\n\n`deepseek-harness/` 同时是 web 版与 SSiD 的内核来源（web profile 不带内核闭包）。对它做 `git checkout` / `pnpm install` / `pnpm run build` 会**连带影响运行中的 web 宿主**——本轮实际发生了：web 版被连带升级后崩溃。\n\n处置：为 web 版建独立副本 `dsh-web-runtime/` + `启动-DSH-Web.bat`（设 `DSH_CHECKOUT` 指向副本）；约束写进工作区 `AGENTS.md` 铁律 2.1 与手册 §5.0 第 0 条。\n\n### D3 隔离走「独立副本 + 各自启动入口」，**不用**用户级 `DSH_CHECKOUT`｜**已执行**\n\n用户级环境变量会同时改变 SSiD 的内核解析，把问题从\"web 被动升级\"变成\"两边都指向同一个 checkout\"，更乱。\n\n### D4 插件适配：`dsh-pocket` 2.10.3 → 2.10.6｜**已执行（分发面待同步）**\n\n`client-connection` 在 0.1.5 把 inject 收缩为 `['credentials']`，而 `rpc.handle` 的 owner 是 **connection 自己的 ctx**（`get rpc()` 里 `const owner = this.ctx`）——不是宿主能力问题。2.10.6 的 `inject` 含 `webServer` 并优先自行挂载路由，是官方适配写法。\n\n### D5 版本号显示改为「实际加载的内核模块」｜**已执行**\n\n标题栏读 `installAnchor`（部署闭包），而 dev 下 tsx 的 paths 让模块实际从 checkout 源码加载——两者不一致时显示\"没升级\"，与实际相反。改为 `import.meta.resolve` 走与运行时相同的解析链读取实体版本，`installAnchor` 降为兜底。\n\n### D6 内核升级必须同步的「口子」写进手册 §5.0 / §5.5｜**已执行**\n\npreset 手工部署（两副本）、persona 字段跨版本会变、tsconfig paths 手写清单、dev 源码模式要求 checkout 自身完整（paths / install / `lib/` 三条件）、以及\"先确认单实例锁持有者\"的排查纪律。\n\n### D7 **不切换**到 DSH 官方桌面壳（当前时机不成熟）｜**已决策，条件性搁置**\n\n**触发条件（满足其一即重评）**：官方桌面端出现正式发版或 CI 构建；或 SSiD 需要\"无端口 + 最小 IPC 暴露\"这一整套安全姿态；或自研壳的维护成本超过迁移成本。\n\n### D8 **不**自己做代码签名证书（非商业用途）｜**已决策**\n\n不签名也能运行，仅首次启动有系统提示。成本：Windows OV 约 $200–400/年（EV 需企业资质）、macOS 需 Apple Developer $99/年。**触发条件**：出现对外分发计划。\n\n### D9 **不**降级内核｜**永久排除**\n\nDSH 会话格式已是 v3 且**无降级路径**（源码只有 v0→v1→v2→v3 迁移器，错误文案写死 `ships no upgrade path for it`）。旧内核读 v3 日志会让已有会话**永久打不开**——「出问题就回退内核」在 SSiD 上不成立。\n\n### D10 **不**急于处理 webserver 债务，但记下硬边界｜**已决策**\n\n全家桶有 15 个插件用 `webServer`。走\"无 webServer 宿主\"路线时 HTTP 路由可迁到 `connection.fetch.register`，但 **WebSocket 无替代通道**（`registerUpgrade` 是 HTTP upgrade；Electron `protocol.handle` 只处理 Request→Response）。**下一步不是动壳，而是先看 better-sidebar 上游是否提供非 WebSocket 方案。**\n\n### D11 **不**顺带引入 `workflow` / `ralph` 工具面｜**已决策**\n\nDSH 0.1.5 提供这些 `tool-*` 行，但 SSiD 的委派体系是自研四角色（灵犀/明镜/巧匠/明瞳）。顺带引入等于同时暴露两套委派概念，需单独评估——不在本轮范围。\n\n### D12 **不**改壳的进程模型以外的通信机制｜**已决策**\n\nD7/D10 相关。保留 `webServer` 与现有壳↔页面通道（标题栏/托盘/截图/主题同步）。\n\n### D13 dsh-capture 路由迁移：分支保留、**暂不合入**｜**已决策**\n\n分支 `feat/connection-fetch-routes-clean`（`54f75ec`）已就绪并验证（typecheck + build + 8 项 rc.2 契约核对），但经 §D10 的归因更正后**对当前 SSiD 收益为零**（SSiD 有 webServer，新旧写法走同一挂载点）。价值是为无 webServer 宿主铺路。\n\n## Alternatives considered\n\n| 决策 | 被否决的备选 | 否决理由 |\n|---|---|---|\n| D1 | 按清单升 rc.1 | 清单写于 rc.2 发布前；rc.2 更新且改动集一致，选新不选旧。清单的版本号属**过期信息**，不是承诺。 |\n| D1 | 升到 `0.1.5-alpha.2`（更新的 alpha 通道） | alpha 通道无回归验证，且清单针对 rc 段整理；rc 已是官方候选发布。 |\n| D2 | **直接切主 checkout**（本轮实际做法） | 正是事故成因。checkout 是**共享资源**，SSiD 单方面切版本会连带升级 web。 |\n| D2 | 让 web 版也带内核闭包（彻底不依赖源码） | 改造面大（web profile 由官方模板生成，无归档机制），且收益与\"独立副本\"相同。列为将来可选。 |\n| D3 | 用户级环境变量 `DSH_CHECKOUT` 指向独立副本 | 会同时改变 SSiD 的内核解析——把\"web 被动升级\"换成\"两边都读同一个 checkout\"，更难排查。隔离必须**分入口**。 |\n| D3 | 改 OpenCode 启动器配置注入环境变量 | 启动器是闭源桌面应用，未找到可注入环境变量的配置点；脚本入口是等效且可控的做法。 |\n| D4 | 回退到 rc.1 内核（让旧插件继续工作） | 违反 D9：v3 会话不可降级。**这条路在物理上就堵死**，不是取舍问题。 |\n| D4 | 临时禁用 `dsh-pocket` 让 boot 通过 | 治标；且插件是用户常用功能。上游已有官方适配版（2.10.6，其源码注释逐字写明了这个坑），没有理由不用。 |\n| D5 | 只改 `installAnchor` 的取值（让 dev 指向源码） | 会破坏 `healProfilesModuleFallback` / `loadProfile` 的锚点语义——那两个 API 依赖锚点找 bundle 物理目录。显示层的问题应在显示层解决。 |\n| D5 | 版本号显示两个值（闭包版 + 源码版） | 标题栏空间有限，且用户需要的是\"在跑什么\"这一个事实。来源标注（source/bundled）已能区分。 |\n| D5 | 不动它（用户能看到 About 页详情） | 显示与实际相反会**系统性误导排查**——用户第一反应就是\"升级没生效\"，本轮已实际发生。 |\n| D7 | 立刻切官方桌面壳 | ①官方从未发布过安装包（12 个 release 资产数全为 0）；②无任何 CI 构建（`.github/workflows` 20 个文件 grep `desktop` 零命中）、`private: true`、无兼容承诺——\"把维护交给官方\"这个收益**不存在**；③官方壳显式禁用 `webserver`，15 个插件要改造；④壳↔页面交互（标题栏/托盘/截图/主题）在官方模型下无对应物，要重建；⑤协议号 `DESKTOP_HOST_PROTOCOL_VERSION` 是内部号、overlay 的 patch 行 id 未命中只 warn 不报错，上游改名会**静默失效**。 |\n| D7 | 在 SSiD 仓库 fork 官方壳 | 同 D7 的②③④，且额外背上 fork 漂移。 |\n| D7 | 用官方壳但保留自研 webServer 与交互通道 | 与官方壳的进程/通信模型冲突（官方是子进程 + 分帧字节管道 + `dsh-app://` 协议），等于只借了打包配置，收益最小而改造最大。 |\n| D8 | 立即买证书 | 非商业用途，收益（消除首次启动提示）不抵成本。且与\"用哪个壳\"无关——**签名不可借用**，官方签名绑定其构建者证书，改代码重打包后原签名即失效。 |\n| D8 | 借官方签名 | 同上，物理上不可能。且官方根本没有已签名的安装包可借。 |\n| D9 | 保留\"回退内核\"作为兜底方案 | 会让已有会话永久不可读。兜底方案必须是**前向**的（修当前版本），不能是后向的。 |\n| D10 | 现在就把 15 个插件迁到 `connection.fetch.register` | 对当前 SSiD 收益为零（有 webServer，同一挂载点）；且 WebSocket 那 3 条**无解**，迁一半反而留下不一致状态。 |\n| D10 | 把 webServer 从\"宿主提供\"改成\"插件自持\" | 每个插件自建 HTTP 服务会引入端口管理、认证、生命周期等一整套问题，比现状差。 |\n| D11 | 顺手启用 Workflow/Ralph | 两套委派概念并存会让用户与模型都难以判断该用哪个；且其价值未在 SSiD 场景验证。 |\n| D13 | 直接合入 main 并发布 0.3.1 | 收益为零的改动不值得单独发一版（npm 发布是 F2A，用户手动执行，更不该为此打扰）。 |\n| D13 | 删除该分支 | 它验证过、可合入，且是 D10/D7 路线的现成起点；删了将来要重做。 |\n\n## Consequences\n\n**已落盘的规范（防复发）**：\n\n| 位置 | 内容 |\n|---|---|\n| `AGENTS.md` 铁律 2.1 | 共享 checkout 是红线：动前须经用户同意；隔离走独立副本 + 各自启动入口；不用用户级 `DSH_CHECKOUT`；降级内核不是选项 |\n| 手册 §5.0 第 0 条 | 同上，列为升级口子的最高优先级 |\n| 手册 §5.0 第 1–4 条 | preset 两副本 / persona 字段 / tsconfig paths / `rpc.handle` 消费者扫描 |\n| 手册 §5.5 | dev 源码模式的三个条件 + 单实例锁排查纪律 |\n| 手册 §7 坑 14–16 | YAML block mapping 不能加尾逗号、内核加包打断 typecheck、`prepare-runtime` 把 vendor 根 README 当插件 |\n\n**未闭合项（按建议顺序）**：\n\n| # | 项 | 性质 |\n|---|---|---|\n| 1 | `dsh-pocket` 分发面同步（SSiD vendor + 归档仍是 2.10.3） | 本轮收尾缺口；不补则下次发版丢失该适配 |\n| 2 | 归档加逐文件 hash 清单 | 可靠性；现只有 `.runtime-version` 一个依赖指纹，回答不了\"解压出来的文件对不对\" |\n| 3 | 内核移出 Electron 主进程 | 架构级；已确认**不影响一键安装**（SSiD 已内置 `node.exe` 94.4 MB），且能根治 `ctx.loader.internal` 的 V8 embedder 老问题 |\n| 4 | web 版隔离生效（需用新脚本重启一次 web） | 一步操作 |\n| 5 | dsh-capture 分支真机验证 | 验证 |\n\n**D14 内核移出 Electron 主进程：分两阶段，第一阶段已完成（2026-09-13 续）**\n\n原列在\"未闭合项\"的第 3 条，本轮推进了核心部分。**阶段一（已完成并验证）**：\n\n- `shell/kernel-child.ts`：把内核跑在独立 Node 子进程里，经 Node IPC 上报 `port/url/dshVersion`、转发通知用的会话事件（`turn/start`、`turn/end`、`approval/asked`）、响应 `shutdown`，并在父进程 IPC 断开时自我了结（不留孤儿占端口）。跑在标准 Node 里，因此不再需要 `module-resolution.ts` 那套 `registerHooks` 绕行。\n- `shell/host-process.mjs`：主进程侧 spawn、等 ready（带超时）、事件回调、优雅关闭（15s 超时后强杀）。\n- **实测**（从 `shell/` 跑）：子进程成功 boot 内核，`dshVersion = 0.1.5-rc.2`、端口在监听、HTTP 401（就绪）、空闲期无事件转发、关闭后端口释放。typecheck 0 错（`kernel-child.ts` 原先不在 `tsconfig.include` 里，已补——否则这个文件根本没被类型检查过）；单测 50/50。\n\n**为什么不用官方那套分帧字节管道**：官方 `host-protocol.ts` 的 fd3/fd4 帧协议是为了让窗口走 `dsh-app://` 自定义协议、**彻底不要端口**。SSiD 的内核本来就监听 127.0.0.1 随机端口、BrowserWindow 直接 loadURL，所以只需传出端口与生命周期——引入那套协议等于凭空多维护一个协议而无收益。\n\n**阶段二（未做）**：\n\n| # | 项 | 说明 |\n|---|---|---|\n| 1 | `main.mjs` 切换 + `SSID_KERNEL_CHILD=1` 开关 | 开关式集成（默认仍同进程），便于灰度与回退 |\n| 2 | **反向能力通道** | `restart` / `update` / `screenshot` 是闭包、无法跨进程传递；不补则子进程模式下「设置页重启按钮 / 在线更新 / 快捷截图」失效。这是阶段二的主体工作 |\n| 3 | `turn/start` 的 time 字段 | 子进程转发里缺内核的 `event.time`，用时暂按主进程本地时钟估算；补上才能与同进程模式完全一致 |\n| 4 | `session/event` 的类型正确写法 | 该事件声明为 `this: Scoped\u003cSession>`，根 ctx 不满足；当前用受控断言（依据 `main.mjs:1286` 同款调用已在生产运行数月），应下沉到 session 作用域（cordis 未导出该类型名，需另找路径） |\n| 5 | 打包链路 | `kernel-child` 需要 bundle（打包版用内置 `node.exe` 跑 bundle，dev 用 `tsx` 跑 TS），并确认 electron-builder 的 `extraResources` 带上它 |\n\n## 附：本轮新增/更新的规则与坑\n\n| 位置 | 内容 |\n|---|---|\n| 手册 §7 坑 14 | **YAML block mapping 不能加尾逗号** —— 该文件是 block 风格，条目不带逗号；批量切版脚本惯性加逗号会让 `pnpm install` 直接报 `bad indentation of a mapping entry`。且改完必须用真解析器验语法，正则自检挡不住 |\n| 手册 §7 坑 15 | **内核加包会打断 `npm run typecheck`**，且错误位置指向 checkout 源码而非 SSiD 代码——`shell/tsconfig.json` 的 paths 是手写清单，属\"每次内核升级都要过的门\" |\n| 手册 §7 坑 16 | `prepare-runtime.mjs` 第 4.5 步会把 vendor 根的 `README.md` 当插件目录复制（产物里出现 0 字节的 `@max-null/README.md`） |\n| 工作区 `AGENTS.md` 铁律 2.1 | 共享 checkout 是红线；隔离走独立副本 + 各自启动入口；不用用户级 `DSH_CHECKOUT`；降级内核不是选项 |\n| 手册 §5.5 | dev 源码模式的三个条件（paths / 完整 install / `lib/` 产物）+ 单实例锁排查纪律 |\n\n**本篇的自我限制**：所有\"实测\"结论均附可复现命令或文件行号；「推断」在正文显式标注。本轮共发生 3 处**我自己的判断错误**（切共享 checkout 未告知、假设 SSiD 无 webServer、检查器未校准就下结论），全部已在执行记录中留痕——保留它们的理由与保留正确结论相同：**复盘时最有价值的是错误路径，不是成功路径。**\n"},{"file":"2026-09-12-归档候选清单.md","date":"2026-09-12","slug":"归档候选清单","title":"决策记录归档候选清单（2026-09-12）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["dsh-web","dsh-memory","dsh-ssid-panels","dsh-context","dsh-context-doctor","#7"],"summary":"整篇的结论已被后续文档推翻，保留会误导读者以为它仍权威。","bytes":5001,"lines":53,"body":"# 决策记录归档候选清单（2026-09-12）\n\n> 来源：对 `docs/决策/` **全量 110 篇**的一次并行审计（workflow `decision-records-audit`，11 个分片 agent，全绿）。\n> 状态：进行中（推断 · 2026-09-12）\n\n> 判定标准（**从严**）：**仅当另一篇文档显式说明它被替代/推翻/作废，或同主题更晚文档明确改写其结论**时才计入；引不出具体文字一律不计。审计中每条都要求给出原文依据。\n> 产出这份清单的目的：为待办 #7 遗留的「归档现有决策文档一批」提供**有据的候选**，最终判定（哪些\"不再权威\"）仍由人决定。\n\n## A. 完整取代 —— 建议整篇归档（5 篇）\n\n整篇的结论已被后续文档推翻，保留会误导读者以为它仍权威。\n\n| 文件 | 被谁取代 | 取代证据（原文引用摘要） |\n|---|---|---|\n| `2026-08-17-v0.1.4追加优化-plugincenter与圆角与伪3D.md` | `2026-08-19-v0.1.5发布收尾-归档损坏与恢复.md` | 本文结论「版本仍为 0.1.4（尚未发布，优化并入同版）；发布动作等用户确认」被明确改写：「v0.1.4 内容……全部并入 v0.1.5 发布，**不再单独发 v0.1.4**」「v0.1.4 Draft（历史遗留，无资产）已删除」 |\n| `2026-09-02-SSiD内核升级-alpha.4执行指南.md` | `2026-09-04-SSiD内核升级-0.1.2-rc.1插件适配与测试体系方案.md` | 本文「SSiD 基线保持 α.2」被改写：「期间评估过 alpha.4：实测大历史会话加载卡死（净负收益），回滚 alpha.2；**最终定稿 rc.1**」 |\n| `2026-09-06-DSH-web内核升级-rc.1参考文档.md` | `2026-09-06-web升级-rc.1执行记录.md` | **本文自认被取代**：「本文档 §0 现状盘点经实测修正——web(3080) 实为 **deepseek-harness** 宿主……DSHfork 并非运行宿主……本文档 DSHfork 步骤保留仅作参考」；执行记录逐项改写其 §0 |\n| `2026-08-18-vendor指纹盲区-中英切换未生效.md` | `release-notes-v0.1.5.md` | 本文的修复行动已被交付：「修复 - 运行时指纹覆盖 vendor/skills 目录清单——插件/技能更新不再被跳过重部署」；且 `2026-08-19-v0.1.5发布收尾-归档损坏与恢复.md` 记载 v0.1.5 已发布、验证环全绿 |\n| `2026-08-22-open-sea-skin本地增强与SSiD集成.md` | `2026-08-29-SSiD升级执行记录.md` | 本文结论「本地 fork 源码入库 plugins/open-sea-skin/、预制引用 tarball」被推翻：「open-sea-skin 移除决策——原因：导致部分面板半透明」「SSiD 无 open-sea-skin（bundles 28 项不含）」；`release-notes-v0.1.16.md` 亦称「预制依赖、声明与归档物料全面清理」 |\n\n## B. 部分取代 —— 建议只标注、不整篇归档（4 篇）\n\n**只有部分结论被改写**，整篇归档会连带丢掉仍有效的部分。\n\n| 文件 | 被谁取代 | 仍有效的部分（故不宜整篇归档） |\n|---|---|---|\n| `2026-08-19-v0.1.6发布执行-环境核查与阻塞.md` | `2026-08-19-plugin-center-0.1.7本机重建.md` | 被改写的是「0.1.7 代码在 GitHub 远程」这一事实判断（实为五处一致 0.1.5、0.1.7 仅在另一台电脑）；其**阻塞点清单与用户手动步骤**仍有参考价值 |\n| `2026-08-19-记忆插件升级-实施.md` | `2026-08-19-记忆面板归属迁移-dsh-memory自带UI.md` | 被改写的是「记忆面板落在 dsh-ssid-panels」的**落点**（已迁至 dsh-memory 自带 UI）；本篇 0.3.0「审核与注入解耦」**主体未被推翻** |\n| `2026-08-26-三个插件加入SSiD预设.md` | `2026-08-28-v0.1.15发版决策.md` | **仅 genui 一条**的预置形态被改写（vendor 固化 → 切 npm `^0.9.6`）；dsh-context（npm）、dsh-context-doctor（vendor 固化）**两条处置仍有效** |\n| `2026-08-28-session-manager加入预制.md` | `2026-08-29-SSiD升级执行记录.md` | 被改写的是接入方式（vendor tgz 0.2.2 → npm 0.4.1）；**「加入预制」这一决策本身仍有效** |\n\n## C. 需要你判的部分\n\nA 组 5 篇我建议归档（`状态：已归档`），依据是\"整篇结论已被推翻\"。\nB 组 4 篇我**不建议**整篇归档，但建议在文件头标注「部分结论已被 X 取代」并指向新篇——这样读者不会被误导，也不会丢信息。\n\n**\"归档\"在本仓库该用什么形式？** 三个选项：\n\n1. **只加状态标记**（`> 状态：已归档（2026-09-12，被 X 取代）`）—— 不改路径，与 #7 的零侵入原则一致，**推荐**\n2. 加标记 + 在正文顶部插一段「本篇已被 X 取代」—— 更醒目，但要动正文\n3. 移到 `docs/决策/归档/` 子目录 —— 会破坏既有互引路径，#7 里已论证过不划算\n\n## D. 附：本次审计的状态分布（110 篇）\n\n| 推断状态 | 篇数 |\n|---|---|\n| 已完成 | 38 |\n| 记录 | 31 |\n| 已决策 | 21 |\n| 进行中 | 20 |\n\n（该分布为「读全文后推断」的结果；原始 43 篇有状态头、67 篇无。补充方案见 #7 遗留项。）\n"},{"file":"2026-09-12-决策记录知识库化.md","date":"2026-09-12","slug":"决策记录知识库化","title":"决策记录知识库化","statusRaw":"已完成","statusKind":"已完成","owner":"MaxNull","purpose":null,"dateInBody":"2026-09-12","dateNote":null,"tags":["dsh-anatomy","dsh-skills","#7"],"summary":"docs/决策/ 累积了 110 篇记录，全部符合 YYYY-MM-DD-标题.md 命名，但没有统一元数据，只能靠文件名和记忆定位。要知道「哪些决策还在进行中」「某插件相关改过哪些决定」，只能全文翻找。 同时，待办 7 原案要求「目录即状态机」——把 docs/决策/ 重组为 {proposed,implemented,rejected,archived} 四个子目录。但实测发现不可行/不划算：","bytes":8462,"lines":113,"body":"# 决策记录知识库化\n\n> 日期：2026-09-12\n> 状态：已完成\n> 决策人：MaxNull\n\n> 统计口径：本文出现的「110 篇」含**本文自身**（构建器把它也纳入索引）。数字随重建变化，以构建器输出为准。\n>\n> **口径变化留痕（2026-09-13）**：`docs/决策/` 现为 **80 篇**，不是本文写的 110/111。差额可完整对上——**迁出 33 篇**到两个衍生库（`dsh-anatomy` 的**决策精读 17** + **工程范式 5**、`dsh-skills` 的 **skill 适配说明 11**；迁移提交 `2af7cad`，删除记录 33 条），此后新增 `2026-09-12-SSiD内核升级-0.1.5-rc.2`、`2026-09-13-SSiD决策总表-内核升级与壳路线` 等。写在这里是为了避免复盘时把「数字变小」误读成「文档丢了」。\n> 本篇是待办 #7「Agent Notes 状态机」四段模板（Problem → Decision → Alternatives considered → Consequences）的**首个应用范例**；状态词沿用索引归纳出的「已完成」，与四状态机的 `implemented` 对应。\n\n## Problem\n\n`docs/决策/` 累积了 110 篇记录，全部符合 `YYYY-MM-DD-标题.md` 命名，但**没有统一元数据**，只能靠文件名和记忆定位。要知道「哪些决策还在进行中」「某插件相关改过哪些决定」，只能全文翻找。\n\n同时，待办 #7 原案要求「目录即状态机」——把 `docs/决策/` 重组为 `{proposed,implemented,rejected,archived}` 四个子目录。**但实测发现不可行/不划算**：\n\n- 43/110 篇已有**非正式头部**（`- 状态：x` / `> 状态：x` / 裸 `状态：x` 三种写法并存），**67/110 完全没有**\n- 按状态分目录要**移动 110 个历史文件**，破坏既有引用路径（手册、决策记录之间大量互引）\n- 且「状态」是**会变的**：一篇 `implemented` 将来会 `archived`，每次状态流转都要**再移动一次文件**，git 历史会碎\n\n## Decision\n\n**用「元数据投影」替代「物理目录重组」，且不改动任何一个历史文件。**\n\n1. **零侵入解析**：只读 `.md`，从文件名取日期、从正文头部取状态/决策人、从正文首标题取标题。解析不到的诚实标为「未标注」并在报告里逐个点名——**绝不批量补写**。\n2. **状态「原文 + 类别」双字段**：保留 `statusRaw`（如 `✅ 已完成（v0.1.4 已…）`）与归纳出的 `statusKind`（进行中/已决策/已完成/记录/未标注）。归一的规则表**顺序敏感**：先判「进行中」，否则「实施完成，待 npm publish」会被误归为已完成。\n3. **自包含单页**：内联**原始 markdown**（不预渲染），浏览器端用内置极简渲染器转换；全文内联所以搜索是纯本地、零外部请求。\n4. **惯例**：新增决策记录后跑一次 `node shell/scripts/build-decision-index.mjs` 重建索引。知识库是**只读投影**——改元数据要改 `.md` 原文。\n\n## Alternatives considered\n\n| 备选 | 否决理由 |\n|---|---|\n| **YAML frontmatter 批量注入**（最初方案） | 67/110 篇没有状态头，批量填 = **替历史做 67 个未经查证的判断**，违反「断言必须有据」。改为只解析不补写。 |\n| **物理目录重组为四状态目录**（待办 #7 原案） | 要移动 110 个历史文件、破坏既有互引路径；且状态会流转，每流转一次就要再移动，git 历史碎片化。用户已改向「元数据 + 生成 HTML」。 |\n| **预渲染 HTML 后内联** | 体积翻倍，且正文失去「原文可搜索」这一性质。保留原始 markdown 更省也更可检索。 |\n| **状态归一为四状态枚举** | 会吃掉 `已完成（v0.1.4 已发布）` 这类括号里的细节。改为双字段：原文忠实保留、类别供筛选。 |\n| **只出 JSON 或只出 HTML** | 两者用途不同：JSON 供程序消费/二次加工，HTML 供人浏览。因此两者都生成，但 `decisions.json` **不入库**（可由脚本重建），`index.html` 入库。 |\n\n## Consequences\n\n**交付物**：\n\n| 文件 | 说明 |\n|---|---|\n| `shell/scripts/build-decision-index.mjs` | 构建器，零依赖（仅 node 内置模块） |\n| `docs/决策/index.html` | 自包含单页（约 1.1 MB），可直接双击打开 |\n| `docs/决策/decisions.json` | 中间产物，不入 git |\n\n**实测覆盖率**：\n\n| 项 | 覆盖 | 来源 |\n|---|---|---|\n| 日期 | **110/110** | 文件名前缀 |\n| 标题 | 109/110 | 正文 `#` 标题（1 篇无，回退文件名） |\n| 状态 | 43/110 | 正文头部 |\n| 标签 | 92/110 | 字面提取（包名/插件名/issue 号） |\n\n状态分布：进行中 11、已决策 5、已完成 24、记录 3、未标注 67。渲染规模：含表格 80 篇、含代码块 37 篇。\n\n**唯一无反例的维度是日期**（110/110），所以时间线是知识库最可靠的组织轴。\n\n**遗留**：\n\n- 67 篇「未标注」需要**人工逐篇补状态**；这是内容工作，脚本替代不了，构建器会持续点名。\n- `2026-09-10-DSH官方Gates拆解原始报告-F-run-gates编排.md` 无正文 `#` 标题，暂用文件名回退。\n- 1/110 篇（6-09-10-DSH过程决策精读-判断标准总表.md）是**纯表格型文档**，无散文首段，摘要只能取到分类名；强行为它生成散文摘要会失真，故接受。\n- 待办 #7 的其余要素（四状态目录、归档一批）**未做**——四状态目录已被本决策替代；「归档现有决策文档一批」仍是待办。\n\n## 实施记录：过程中修掉的三个真 bug\n\n均为本次引入，全部由验证环节发现。\n\n### 1. 状态抓取强制要求行首前缀 → 19 个假阴性\n\n`grab()` 初版正则要求 `状态：` 前必须有 `-`/`*`/`>`，实测存在**裸写法**（行首直接 `状态：`）。\n症状：状态覆盖只有 23/110，而独立探测是 42/109。**差值 19，且当时「未标注 86 = 67 + 19」精确吻合**，据此定位。\n\n### 2. 同一行串联多字段 → 又漏 1 个\n\n```markdown\n> 日期：2026-09-10 · 状态：方案 B 已选定，可行性验证进行中\n```\n\n`状态：` 不在行首。修复后覆盖 23 → 41 → **42**，与独立探测精确相等。\n副作用修正：`grab('日期')` 原会把整行后面全吃掉并污染 `dateNote`；正文里 `2026-08-29（晚）` 这类**带补充说明**的日期被误报为「与文件名不一致」——按前 10 字符比对后归零。\n\n### 3. 渲染器死循环（最严重）\n\n极简 markdown 渲染器的段落分支：一个**以 `|` 开头但不构成表格**的行，会被表格分支跳过、又被段落分支的排除正则 `\\|` 挡住 → `while` 不执行、`i` 不推进 → **无限循环，浏览器会卡死页面**。\n症状：验证器跑全部记录时 **120 s 超时**；修复后 **22 ms**。\n\n修复：段落分支加 `if(i===guard){p.push(l);i++;}` 兜底推进，主循环加 `steps++\u003cL.length*4+64` 迭代上限。\n\n## 验证（三层，共 37 项断言）\n\n1. **数据层报告**：覆盖率 + 缺口点名（无标题文件逐个列出，不只给一个数字）\n2. **生成物验证**（`shell/scripts/verify-decision-index.mjs`，14 项）：内联 JS 语法检查、DATA 可 JSON.parse 且篇数 == 目录实际 `.md` 数、JS 引用的 11 个 DOM id 全部存在、全部记录渲染非空、渲染输出中未转义 `\u003cscript` 为 0 次、渲染耗时上限\n3. **行为验证**（`shell/scripts/verify-decision-ui.mjs`，23 项）：迷你 DOM shim 真跑页面逻辑，交叉断言「点击筛选筛出条数 == 按同一数据现算的期望条数」\n\n两个验证器的期望值**全部动态锚定**到目录实际文件数，不硬编码篇数——否则每新增一篇记录就要改验证器。\n\n**两条教训**：\n\n- **「写出成功」不等于「能用」**：只看构建器输出会漏掉死循环这个致命问题；生成物必须被独立验证。\n- **验证器自己也会骗人**：本轮验证器先后误报 **3 次**，全部是验证器侧的问题，不是生成物的问题：\n  1. 用 `;\\n` 非贪婪正则提取内联 DATA，但生成物里 `var DATA={…};(function(){` **没有换行** → 把后续代码当成了 JSON 尾部；\n  2. 单独 eval `md()` 时漏了它依赖的同作用域函数 `esc()` → `ReferenceError`；\n  3. shim 的 `history.replaceState` 写成空函数 → 「深链是否写入」这条断言**恒为假**。\n\n  出现误报要先证明「是生成物错还是验证器错」，不能默认生成物有问题。\n"},{"file":"2026-09-12-SSiD内核升级-0.1.5-rc.2.md","date":"2026-09-12","slug":"SSiD内核升级-0.1.5-rc.2","title":"SSiD 内核升级：0.1.2-rc.1 → 0.1.5-rc.2（2026-09-12 执行）","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh-package-manifest","@deepseek-ai/dsh-agent-spine-demo","@deepseek-ai/dsh-tool-subagent-report","@max-null/readme.md","@deepseek-ai/dsh-http-proxy","@deepseek-ai/node-addon-system","dsh-v0","dsh-persona","dsh-system-prompt","ssid-double-star","dsh-package-manifest","dsh-agent-spine-demo"],"summary":"rc.2 通道纪律：0.1.5-rc.2 只挂在 npm next 通道上，latest 是 0.1.5-rc.1。所有 pin 必须写精确版本串，不能用 ^——^0.1.5-rc.2 在 0.x 语义下不跨 minor，会静默装回旧版。","bytes":14129,"lines":136,"body":"# SSiD 内核升级：0.1.2-rc.1 → 0.1.5-rc.2（2026-09-12 执行）\n\n> 状态：已决策（推断 · 2026-09-12）\n> 依据：`docs/决策/2026-09-10-升级前置差异清单-0.1.2-rc.1到0.1.5-rc.1.md`（跨系列核对清单）\n> 配套：`2026-09-06-SSiD内核升级执行指南-rc.1通用范本.md`（SOP）\n\n## 1. 范围与版本\n\n| 项 | 值 |\n|---|---|\n| 起点 | `0.1.2-rc.1`（checkout HEAD `a66e470204` = tag `dsh-v0.1.2-rc.1`） |\n| 终点 | **`0.1.5-rc.2`**（checkout `fb2c4b9e69` = tag `dsh-v0.1.5-rc.2`） |\n| 为什么不是 rc.1 | 核对清单写的是 rc.1，但执行时 npm `next` = `0.1.5-rc.2`（`rc.1` 停在 `latest`）。二者对本轮**唯一的破坏性变更完全一致**（见 §2），取更新者。 |\n| SSiD 版本 | 不变（`shell/package.json` 仍是 `0.2.1`）——内核换版不等于发版 |\n| 归档指纹 | `.runtime-version = 0.2.1-0.1.5-rc.2-d5876b8a` |\n\n**rc.2 通道纪律**：`0.1.5-rc.2` 只挂在 npm `next` 通道上，`latest` 是 `0.1.5-rc.1`。所有 pin 必须写精确版本串，**不能用 `^`**——`^0.1.5-rc.2` 在 0.x 语义下不跨 minor，会静默装回旧版。\n\n## 2. 破坏性变更：一条，但它是硬失败\n\n**`dsh-persona` 的配置字段由 `text` 改为 `prefix`（required）。** 这不是 rc.2 引入的，`0.1.5-rc.1` 与 rc.2 相同；rc.2 相对 rc.1 在 `packages/preset/` 下**只改了 package.json 的版本号**（persona 源码零差异）。\n\n实测（不是读文档推断的）：\n\n- `dsh-persona@0.1.2-rc.1`：`Config = { text: string; complete?; includeRuntimeContext? }`\n- `dsh-persona@0.1.5-rc.2`：`Config = { prefix: z.string().required(); suffix: z.string().default(''); complete?; includeRuntimeContext? }`\n- 用 rc.2 实体 + 真 schemastery 3.18.2 跑校验：`{ text: '…' }` → **`$.prefix missing required value`**；`{ prefix: '…' }` → 通过。\n\n同时 `dsh-system-prompt` 把 persona 段从单个 `deployment:persona` 拆成 `deployment:persona-prefix` / `deployment:persona-suffix`，并新增导出 `PERSONA_PREFIX_SECTION` / `PERSONA_SUFFIX_SECTION`。**内核包族必须整体升**：rc.2 的 `dsh-persona` 配 rc.1 的 `dsh-system-prompt` 会在 ESM 链接期直接报 `does not provide an export named 'PERSONA_PREFIX_SECTION'`（已实测）。\n\n→ SSiD 的动作：`presets/ssid-double-star/agent.cordis.yml` 的 `config.text` 改 `config.prefix`（两处副本，见 §4）。\n\n**没有补 `suffix`（刻意）**：rc.2 里 `suffix` 默认 `''`，而 `dsh-persona` 在 agent preset 内会**遮蔽整个 deployment persona**。rc.1 的模块文档与 rc.2 逐字相同（\"Mounted inside an agent preset it shadows the deployment persona for that one session\"），所以双星 persona 本来就从不包含官方那句 `Your working directory is {{cwd}}.`——升级前后一致，补 suffix 反而是引入新行为。\n\n## 3. 顺带发现：preset 不在归档同步链内\n\n`prepare-runtime.mjs` 只把 `skills/` 纳入指纹与归档（`walkVendor(skillsDir, 'skills')`），`kernel.ts` 的 `syncPresetSkills` 也只同步技能；`agentPresetsRoot` 指向的 `apps/cli/config/agent-presets` 在两个版本里都只有 `examples/`（`scanRoot` 对不存在的根返回 `[]`，静默忽略，不报错——这条\"死路径\"不是缺陷但也没用）。\n\n结论：**`presets/ssid-double-star/` 是手工部署的**——仓库副本（版本管理）+ `~/.dsh/.agent-presets/ssid-double-star/`（DSH 实际读取）。改 preset 必须两处同时改，且**不在任何归档/升级自动路径上**。任何 preset 字段变更都会漏掉其中一处而静默生效失败。\n\n## 4. 改动清单\n\n| 文件 | 改动 | 副本同步 |\n|---|---|---|\n| `presets/ssid-double-star/agent.cordis.yml` | `config.text` → `config.prefix` | 与 `~/.dsh/.agent-presets/ssid-double-star/` **SHA256 必须一致**（改后校验同为 `63E5F78B…`） |\n| `shell/profile-template/pnpm-workspace.yaml` | overrides **212 条** pin → `0.1.5-rc.2`；删 2 条官方已下线包 | 与本机 profile 同名文件同步 |\n| `~/.dsh/profiles/ssid/pnpm-workspace.yaml` | 同上 | 构建机侧副本 |\n| `shell/tsconfig.json` | 补 1 条 paths 映射 `@deepseek-ai/dsh-package-manifest` → `packages/util/package-manifest/src` | rc.2 新增包，`app-boot` 的 `profile.ts` 引用它；缺则 `npm run typecheck` 报 TS2307 |\n\n**为什么删那 2 条 override**：`@deepseek-ai/dsh-agent-spine-demo` 与 `@deepseek-ai/dsh-tool-subagent-report` 在 rc.2 的 `packages/` 下**不存在**，npm 上也只发到 `0.1.2-alpha.2`/`0.1.2-alpha.3`（registry 返回 404 于任何 `0.1.5-*`）。全仓 `package.json` 对二者**零依赖**。保留它们 = 永远解析不到的幽灵 pin，且新版 `prepare-runtime.mjs` 注入的 `[3/5]` 聚合包不引用它们，`pnpm install` 不报错、纯噪声。\n\n**profile 里那 31 个 `@deepseek-ai/*` 显式 pin 不用手改**：它们来自 `prepare-runtime.mjs` 的 `MISSING_PEERS`（版本随 `DSH_VERSION` 动态取）与首次 boot 的写回。归档重建 + 重启部署后自然变成 `0.1.5-rc.2`。\n\n## 5. 坑（本次实踩，按代价排序）\n\n| # | 坑 | 症状 | 处置 |\n|---|---|---|---|\n| P1 | **YAML block mapping 加尾逗号** | 切版脚本把 `'pkg': 'ver'` 写成 `'pkg': 'ver',`，`pnpm install` 立刻 `[ERROR] bad indentation of a mapping entry (47:39)` | overrides 是 **block** mapping，条目无尾逗号（flow style 才要）。改版脚本一律不加 `,`；改完必须用**真解析器**（`yaml` 包）验语法，不能只用正则自检 |\n| P2 | **rc.2 新增包导致 typecheck 崩** | `npm run typecheck` 报 `TS2307: Cannot find module '@deepseek-ai/dsh-package-manifest'`，错误定位在 checkout 的 `profile.ts` 而非 SSiD 代码 | `shell/tsconfig.json` 的 paths 是手写清单（289 条），内核加包就会漏。补映射即可；这是**每次内核升级都要过的门**，不要误判为 SSiD 代码问题 |\n| P3 | **`prepare-runtime.mjs` 把 vendor 根的 `README.md` 当插件复制** | 日志出现「修复 vendor 副本 README.md」，`node_modules/@max-null/README.md` 是个 0 文件条目 | 第 4.5 步按 `readdirSafe(vendorRoot)` 遍历时未过滤 `isDirectory()`（第 2.1 步过滤了，第 4.5 步没过滤）。无害（0 文件、不参与解析），但属噪声，待修 |\n| P4 | **PowerShell `Get-Content -Raw \\| ConvertFrom-Json` 读内核 package.json 失败** | `Invalid object passed in, ':' or '}' expected`，根因是文件里的中文 `description` 被按 GBK 读成乱码 | 读任何含中文的 JSON 一律用 node（`JSON.parse(readFileSync(f,'utf8'))`），不要用 PowerShell 反序列化 |\n| P5 | **未压缩体积与压缩归档口径混用** | 构建日志 `node_modules: 1013.8 MB` 一度看着像「归档暴涨 4.5 倍」；实际 tar.gz 产物 **226.9 MB**（既有归档 223.8 MB） | 判断归档大小只看 `dsh-runtime.tar.gz` 的字节数；`node_modules` 是未压缩中间态 |\n\n## 6. 验证（全部实测）\n\n| 门 | 命令 | 结果 |\n|---|---|---|\n| preset schema | rc.2 `dsh-persona` 实体 + 真 schemastery 校验真实 preset 文件 | 修前 **0/2 通过**（`$.prefix missing required value`）→ 修后 **2/2 通过**，两副本 SHA256 一致 |\n| YAML 语法 | `yaml@2.9.0` 解析切版前备份（正例）+ 两个目标文件 | 正例 214 条解析成功；目标 212 条全为 `0.1.5-rc.2`，无下线包残留 |\n| 依赖可用性 | registry 逐包查 `0.1.5-rc.2` | 212/214 存在；缺的 2 个即 §4 那两个下线包（已删） |\n| typecheck | `npm run typecheck` | **exit 0** |\n| 单测 | `npm test` | **50/50 通过** |\n| 规范检查 | `npm run check:rules` | **4 门全过 / 91 受检 / 0 违规**（vendor-sync / profile-sync / bom / legacy-names） |\n| 归档抽查 | `npm run verify:release` | **受检 9 项 / 0 违规**；`.runtime-version = 0.2.1-0.1.5-rc.2-d5876b8a`、plugin-center `0.2.19`、better-sidebar `0.18.0`、4 个 vendor 包一致 |\n\n**未做（属用户手动步骤）**：重启思灵触发归档部署、打包版自检、NSIS 打包。归档部署会重写 `~/.dsh/profiles/ssid/node_modules`，共享环境里由用户手动做。\n\n## 7. 回滚\n\n备份锚点 `.build/upgrade-015-rc2/`（7 份：profile 与 template 的 package.json / pnpm-workspace.yaml、两处 preset、shell/package.json）+ 旧归档 223.8 MB。\n\n回滚 = 恢复这些文件 + `deepseek-harness` checkout 回 `dsh-v0.1.2-rc.1` + 恢复旧归档重建。\n\n## 8. 顺带结论：封存分支 `feat/connection-fetch-routes` 可以启用，但不在本轮合\n\n`dsh-capture` 的分支（`37fa8e9`，`inject: ['webServer','webRuntime'] → ['connection']`，路由迁到 `ctx.connection.fetch`）**只在 0.1.5+ 成立**——rc.1 的 connection 自身 `inject ['webServer','credentials']` 且内部经 `ctx.webServer.register`，是 webServer 的语义包装层，不是 carrier-neutral。\n\nrc.2 侧已逐条核实，分支代码与类型**精确对齐**：\n\n- `ctx.connection.fetch.register({ path, methods, requestBody, fetch })`——分支用的 `requestBody: 'buffered'` 正是 rc.2 的必填字段（`'buffered' | 'streaming'`）。\n- 路径必须在 `/api` 之下（rc.2 测试断言 `path: '/outside'` → `toThrow('invalid exact Fetch route')`）；分支用 `/api/ssid/screenshot/{get,set,trigger}` ✓。\n- `methods` 不可为空、不可重复（同测试文件断言）；分支三条各为 `['POST']` ✓。\n- 同一 path 被多路由认领会 `toThrow('already registered')`；分支三个不同后缀 ✓。\n- rc.2 里 connection **不再静态 inject webServer**，改为 `ctx.inject(['webServer'], …)` 可选——无 webServer 时 Fetch 注册表仍在，与分支前提一致。\n\n**但本轮不合**，两个理由：\n\n1. 该分支**混入了与路由无关的截图改名**（`docs/shots/*-1.png` → `shot/中文名.png`，`package.json` 的 `files` 同步改成 `shot`）——与本仓库规范（截图落 `docs/shots/`）冲突，合规部分需要分离。\n2. 分支的验证环境是 `0.1.5-alpha.2`（其自身提交信息如此声明）。rc.2 的**接口签名已核对一致**，但**行为**验证（typecheck + 无壳环境下的 GET 200 / TRIGGER 503 / 未知方法 404）应在 rc.2 上重做。\n\n→ 建议下一轮：先拆掉截图改名、在 rc.2 环境跑一遍验证，再决定合入与发布（插件发布走 npm，F2A 由用户执行）。\n\n## 9. 真机验证：rc.2 的实际破坏性影响（2026-09-12 补记）\n\nSSiD dev（源码模式）在 rc.2 上跑通。过程中确认了两类**与清单预测不同**的事实。\n\n### 9.1 插件要跟着改：`dsh-pocket` 必须升到 2.10.6\n\nboot 时插件树加载失败：\n\n```\nfailed to apply loader entry dsh-pocket: cannot get property \"webServer\" without inject\n  at client-connection/src/rpc-host.ts:179  ← rpc.handle() 内部访问 owner.webServer\n  at dsh-pocket/lib/web-rpc.js:39 installPocketRpc\n```\n\n根因是 **`client-connection` 的 inject 在 0.1.5 收缩**（rc.1 为 `['webServer','credentials']`，0.1.5 改为只 `['credentials']`）。关键在于 `rpc.handle` 的 owner 是 **connection 实例自己的 ctx**（`rpc-host.ts` 的 `get rpc()` 里 `const owner = this.ctx`），而非调用方插件的 ctx；owner 只声明了 `credentials`，所以 `owner.webServer.register(route)` 必抛。\n\n**归因更正（2026-09-13）**：原文写成「SSiD 恰好是无 webServer 的宿主」，这是错的。实测证据：SSiD 组合树里 `webserver` 行启用（`--dump-config` 可见），内核端口在监听且 HTTP 401；profile 的 `cordis.patch.yml` 只 insert 了 MCP，没有禁用该行。也就是说 **SSiD 有 webServer，但 connection 实例的 ctx 没有它的权限**——报错的是 ctx 权限，不是宿主能力。真正没有 webServer 的宿主是 DSH 官方桌面壳（`desktop.cordis.patch.yml` 显式 `webserver: disabled: true`）。这一区分影响判断：在 SSiD 上，`connection.fetch.register`（本仓库 dsh-capture 的改造方向）与 `rpc.handle` 走的是同一个 webServer 挂载点，改造的价值在于去掉对 webServer 的依赖（适配官方壳/headless），而**不是**修 SSiD 上的既有故障。\n\n**`dsh-pocket@2.10.6` 是官方适配版**（其 `lib/web-rpc.js` 头部注释逐字写明了这个坑），`inject` 改为 `['connection','webServer']`，并优先自行把路由挂到 webServer 上、失败才回退 `rpc.handle`。SSiD 的 webServer 是正常提供的（`bootKernel ok port=` 就是它），所以优先路径成立。已按**双处声明**升级（`profile-template/package.json` + ssid profile），实体 2.10.6。\n\n**这条是清单遗漏的**：清单把 connection 变化列为\"能力变化（方案 B 的关键）\"，但**没预判它会让既有第三方插件在无 webServer 宿主下直接崩**。凡是用 `ctx.connection.rpc.handle` 注册通道的插件都要按此模式适配。\n\n### 9.2 dev 源码模式的三个依赖口子（与 rc.2 无关，但升级时才会暴露）\n\n`kernel.ts:374` 的规则是：dev 裸跑时若 `$DSH_CHECKOUT` 未设且 profile 有部署闭包，**理应走闭包**；但 SSiD 的 tsx 会用 `shell/tsconfig.json` 的 paths 把内核包解析到 checkout 源码——于是实际加载的是源码，闭包被旁路。源码模式因此需要 checkout 自身完整可用：\n\n1. **paths 要跟得上内核加包**（本次补 57 条，289→347）——`subprocess/src` 在 rc.2 新增 `@deepseek-ai/dsh-http-proxy` 导入即触发。\n2. **checkout 必须完整 `pnpm install`**——它此前从未装过（`zod`、`mime-types`、`@deepseek-ai/node-addon-system` 全缺）。\n3. **dist 型包必须有 `lib/` 构建产物**——22 个包缺（须跑 `pnpm run build`；`node-addon-system` 的 `lib/` 单独构建亦可）。\n\n### 9.3 一条排查教训\n\n「启动失败」有两次根本不是内核问题，而是 **单实例锁被占用**：打包版思灵（`AppData\\Local\\Programs\\ssid-shell\\思灵.exe`）一直在后台运行，dev 实例起来后立刻 `single-instance lock FAILED -> quit`。判断启动失败前**先确认锁的持有者**，别把「被拒绝启动」当成「启动后崩溃」。\n"},{"file":"2026-09-10-官方桌面壳评估与方案B决策.md","date":"2026-09-10","slug":"官方桌面壳评估与方案B决策","title":"官方桌面壳（apps/desktop）评估与方案 B 决策","statusRaw":"方案 B 已选定，可行性验证进行中","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-09-10","dateNote":null,"tags":["@deepseek-ai/dsh-desktop","@deepseek-ai/dsh-api-remotes","@deepseek-ai/dsh-client-connection","dsh-v0","dsh-anatomy","dsh-desktop","dsh-app","dsh-memory","dsh-capture","dsh-draft-polish","dsh-ssid-achievements","dsh-chat-rail"],"summary":"用户判断：自建桌面壳（SSiD shell/）持续踩坑（部署覆盖丢用户层、更新回滚链、运行时供给），而官方已推出 Electron 桌面壳，其底座值得借用。目标：以官方壳为底座，改成 SSiD 的样子。","bytes":22458,"lines":299,"body":"# 官方桌面壳（apps/desktop）评估与方案 B 决策\n\n> 日期：2026-09-10 · 状态：方案 B 已选定，可行性验证进行中\n> 证据库：`DSHfork` @ `dsh-v0.1.5-alpha.2`（独立观察站，origin=官方主库）\n> 证据来源：官方源码 / README、npm registry、GitHub Releases API、CDP 对运行中桌面端的实测\n> 相关文档：`dsh-anatomy/版本对比/2026-09-09-0.1.5-alpha.2-vs-0.1.2-rc.1.md`\n\n## 1. 背景\n\n用户判断：自建桌面壳（SSiD `shell/`）持续踩坑（部署覆盖丢用户层、更新回滚链、运行时供给），而官方已推出 Electron 桌面壳，其底座值得借用。目标：**以官方壳为底座，改成 SSiD 的样子**。\n\n## 2. 官方壳是什么（事实盘点）\n\n- **位置**：`apps/desktop`（`@deepseek-ai/dsh-desktop`，0.1.5-alpha.2）+ 私有 `apps/desktop-host`\n- **分发状态（2026-09-10 实测）**：npm `@deepseek-ai/dsh-desktop` → 404；GitHub Release `dsh-v0.1.5-alpha.2` 的 `assets` 为空 → **官方尚未发布任何安装包，只能从源码构建**\n- **许可**：仓库根 `LICENSE` = **MIT**（可修改、分发、商用，保留版权声明）\n- **架构要点**（摘自 `apps/desktop/README.md`）：\n\n| 机制 | 官方设计 |\n|---|---|\n| 运行时 | Electron 自带上游 Node.js（打包时下载 24.17.0）+ 自带 pnpm；不用系统 Node/pnpm |\n| 传输 | **不开监听端口**：`dsh-app://` 承载 Web 资产与 Fetch 流量，帧化字节管道承载请求/响应块，Node IPC 只传生命周期控制 |\n| Profile | 独占 `$DSH_HOME/profiles/desktop`；CLI 不能 boot 或修改它 |\n| 与 CLI 的数据关系 | **共享** sessions / settings / credentials / workspaces / storage；**不共享**可执行包、插件激活、lockfile、node_modules |\n| 包来源 | 自带离线 seed store（macOS 分 16 个未压缩 tar 分片）+ 本地打包的第一方 tarball；插件是普通 npm 包，走固定 `https://registry.npmjs.org/` |\n| 安装/变更 | staging → 启动完整 backend 健康检查 → 通过才替换 active profile；journal + 一个回滚 profile |\n| 更新 | electron-updater + blockmap 差分；Electron 壳与 dsh 版本强绑定为一个签名更新单元 |\n| 签名 | macOS Developer ID + 公证（逐个签 Mach-O CAS 对象、重写 pnpm hash）；Windows EV 证书 + SignTool + RFC 3161 时间戳 |\n| 单实例 | Electron `requestSingleInstanceLock()`（进程生命周期锁） |\n| 已知禁用 | Web 的「Open In…」在 Desktop 被禁用，因为其 host 插件需要 HTTP 路由，而 **Desktop 不提供 `webServer`** |\n\n## 3. 关键约束\n\n1. **DSH 主库只引用不改**（工作区铁律）→ 所有改造必须在 fork 或 SSiD 仓库内完成。\n2. **官方壳不提供 `webServer`** → 依赖 HTTP 路由的 host 插件在官方壳内不可用。\n3. **官方壳与 CLI 共享 `$DSH_HOME` 的会话数据** → 与运行中的 web 宿主并发访问同一会话根。\n4. **官方壳仍在 alpha**（0.1.5-alpha.1 才引入右侧栏；两周内两个版本）→ 直接依赖其 API 有跟进成本。\n\n## 4. 方案对比\n\n| 方案 | 做法 | 拿到什么 | 代价 | 量级 |\n|---|---|---|---|---|\n| A 品牌层 | 在 fork 里改官方壳外观/文案/图标/启动屏，装 @max-null 插件 | 官方工程能力 + SSiD 外观 | 丢掉依赖 HTTP 路由的插件 | 小 |\n| **B 官方壳当底座** | A + 预装 @max-null 插件 + 适配 host↔client 通道 | 外观 + 工程能力 | 需迁移通信层；跟进官方升级 | 中 |\n| C SSiD 吸官方机制 | 不换壳，搬离线 seed / staging 健康检查 / 回滚 / 签名链路 | 插件生态完整 + 工程能力 | 自己维护；拿不到官方现成打包流程 | 中 |\n| D vendored fork | 复制 apps/desktop 进 SSiD 仓改 | 完全可控 | 与官方迭代脱节 | 大 |\n\n**决策：方案 B**（用户拍板）。理由：官方壳的运行时供给与部署回滚链正是 SSiD 当前痛点所在。\n\n## 5. 方案 B 逐项算账\n\n| 官方机制 | 价值 | 注意 / 代价 |\n|---|---|---|\n| staging + 健康检查 + 回滚 | **最高**（正对 SSiD 部署覆盖丢用户层、失败崩溃链） | shell 侧逻辑，可独立搬 |\n| 自带 Node/pnpm | 高（消除系统环境变量与 pnpm 版本漂移） | 安装包变大；Node 版本跟随官方 |\n| 离线 seed 分片 | 高（离线安装 + 差分更新） | macOS 流程重：逐个签 Mach-O CAS 对象、重写 pnpm hash |\n| electron-updater + 签名 | 中高（省自写 updater） | 证书/公证账号仍是自己的 |\n| 单实例锁 | 中（防双实例抢 profile） | 需与 SSiD 多实例/会话根隔离语义对齐 |\n| 帧化字节管道（无端口） | **有争议**：无端口冲突、无认证/CORS 暴露面 | 插件 HTTP 路由失效 |\n\n**唯一需要拍板的矛盾**：要「零端口」就不能保留依赖 HTTP 路由的插件；若补回环 HTTP 服务，「零端口」名存实亡。\n**建议**：取「不对外监听」的实质——绑 `127.0.0.1` + 随机端口 + 一次性 token，插件路由可用、局域网不可达。真正值钱的是 staging/回滚与自带运行时，不是绝对零端口。\n\n## 6. 关键发现：我们的插件与官方壳的真实距离（实测）\n\n**教训（重要）**：`package.json` 的 dependencies/peerDependencies **不是** DSH 插件的服务依赖真相——服务依赖用 cordis 的 `inject` 声明。前一轮据此得出的\"无插件依赖 webserver\"结论是**错的**。\n\n实测（grep `@max-null/*` 的 `src/`）：\n\n| 插件 | 依赖形态 | 官方壳（webServer 已被禁用）结果 |\n|---|---|---|\n| `dsh-memory`（host 半） | 静态必需：`inject = ['storage','systemPrompt','tools','webServer','webRuntime']` | **静默不激活**（cordis 语义已实测，见 §8.1） |\n| `dsh-capture` | 静态必需：`inject = ['webServer','webRuntime']` | 静默不激活 |\n| `dsh-draft-polish` | 静态必需：`inject = ['webServer','sessionQuery','llm','loader']` | 静默不激活 |\n| `dsh-ssid-achievements` | 静态必需：`inject = ['tools','webServer','webRuntime']` | 静默不激活 |\n| `dsh-chat-rail` | 动态可选：`ctx.inject(['webServer'], …)` | 激活，路由相关功能降级 |\n| `dsh-quick-toolbar` | 动态可选：`ctx.inject(['webServer','connection'], …)` | 激活，同上 |\n| `dsh-memory` → betterSidebar | 动态可选：`root.inject(['betterSidebar'], …)` | 优雅降级（面板入口不注册） |\n\n**两条替代通道（详见 §8.3）**：① 轻量——`ctx.connection.fetch.register({ path, methods, requestBody, fetch })`（carrier-neutral 精确路由，走 `/api`，Web 载体与 Electron shell 载体都分发同一个 handler）；② 正规——`@deepseek-ai/dsh-api-remotes`（Typert 类型化 RPC + API Gateway）。**不需要自建 webServer 桥**。\n\n**关于 better-sidebar**：它是第三方插件（`omdsh-dev/DSH-better-sidebar`），SSiD 只是**预制**了它，**不是自有资产**。它能否在官方壳里跑是它自己的适配问题，不应绑住 SSiD 的架构决策。\n\n## 7. 已实测的官方壳行为（2026-09-10，CDP + 源码）\n\n1. **`DSH_HOME` 未隔离**：`dev.ts` 写的是 `process.env.DSH_HOME ?? \u003cDSHfork 内部路径>`，而 shell 里已有 `DSH_HOME=C:\\Users\\MaxNull\\.dsh`，隔离默认值被短路 → 桌面端直接使用主 home，并写入了 `storages/`、`workspace.json`、`session_projcache/`。\n2. **会话视图不同步**：`desktop-host` 内无任何 watch/poll/subscribe（grep 为空）→ 桌面端只读到启动时的快照，web 侧后续写入不反映。\n3. **导航条被容器查询隐藏**：`TurnNavigator.module.css` 有 `@container (max-width: 900px) { .slot { display: none } }`，`ChatView.module.css:20` 有 `container-type: inline-size`（规则确实生效）。窗口 1264px + 右侧栏 301px → 聊天区约 678px → 展开后导航条实测 `w=0`（隐藏），**不是被遮挡**；`elementFromPoint` 命中导航条自身（`hitIsNav=true`）。过渡动画期间两者不同源，可能出现短暂重叠（未实测到）。\n4. **官方右侧栏 API 面**：`ctx.sidebarRightTabs.register({ id, kind, patterns?, priority?, canOpen?, title, guide? })` + 主体注册到 keyed slot `sidebar.right.pane.tab`；优先级档 `extension > builtin > fallback`，且**扩展可接管内建**（内建与扩展各占一格，只渲染生效的那个）；控制器 `openResource/openTab/focus/split/float/dock/_undo/_redo`。\n5. **官方桌面端无市场/发现入口**：只有已安装插件的 list/install/remove/update，来源固定为 npm registry。\n\n## 8. 验证结果（2026-09-10 实测）\n\n### 8.1 cordis `inject` 语义（最小实验：`DSHfork/.tmp-cordis-inject-probe.mjs`）\n\n| 用例 | 结果 |\n|---|---|\n| 静态 `inject: ['webServer']`，服务从未提供 | `pending` —— **插件静默不激活，无报错、无警告** |\n| 静态 inject，注册后再提供服务 | `pending` → `applied` —— 服务出现后自动激活 |\n| 静态 inject，注册时服务已存在 | `applied` |\n| 动态 `ctx.inject(['webServer'], cb)`，服务缺失 | `not-run` —— 回调不执行（安全降级） |\n| `inject: { required: [], optional: ['webServer'] }` | `pending` —— 该写法在 cordis 4.0.0-rc.7 下**不生效** |\n\n**结论**：静态 `inject` 缺失服务 → 插件**静默失效**（功能消失且无任何提示，最危险的一种）；动态 `ctx.inject` → 优雅降级。这解释了为什么插件在换壳后\"看起来装上了却没反应\"。\n\n### 8.2 官方桌面端在配置层面禁用了 webServer\n\n`apps/desktop-host/config/desktop.cordis.patch.yml` 开头即：\n\n```\n# Electron reuses the browser composition without its network and browser-launch rows.\n- id: web-startup\n  disabled: true\n- id: webserver\n  disabled: true\n- id: web-runtime\n  disabled: true\n- id: client-hmr\n  disabled: true\n- id: open-in-app\n  disabled: true\n- id: ui-open-in-app\n  disabled: true\n- id: directory-picker\n  disabled: true\n```\n\n→ 与 README 的「Desktop does not provide a `webServer`」一致，且是**配置层面的硬禁用**。我们的 4 个静态依赖 `webServer` + `webRuntime` 的插件在官方壳里会静默失效。\n\n### 8.3 官方给了替代通道（不必自建 webServer 桥）\n\n`@deepseek-ai/dsh-client-connection` 提供 **carrier-neutral** 的精确路由注册：\n\n```\nctx.connection.fetch.register({ path, methods, requestBody, fetch })  // 返回 disposer\n```\n\n- Web 载体（浏览器 HTTP）与 shell 载体（Electron IPC 桥）**分发同一个 shared fetch handler**\n- `desktop-host` 的 fetch 桥把 `/api` 前缀请求交给 `connection.createSharedFetchHandler('/api')`；其余走 `assetHandler`（只处理 `/plugins/` 与静态资源）\n- 路径为**精确匹配**（`fetchRoutes.get(pathname)`），未认领请求返回 404\n\n→ 插件把 `ctx.webServer.register(...)` 换成 `ctx.connection.fetch.register(...)`（路径在 `/api` 下）即可在官方壳内工作；更重的场景再迁 Typert remote。\n\n### 8.4 剩余待验证\n\n- [ ] `dsh-chat-rail` / `dsh-quick-toolbar`（动态可选）在官方壳内的实际挂载与降级表现\n- [ ] 4 个静态插件改注入声明 + 换路由注册后的端到端验证\n- [ ] 侧边栏类插件迁移到 `ctx.sidebarRightTabs` 的工作量\n- [ ] 壳信号差异：`__SSID_SHELL__` → 官方注入 `dsh-desktop-mode` / `__DSH_DESKTOP_FILE_PATH__`\n\n## 9. 实施策略（若验证通过）\n\n1. **不要整体复制官方壳**：保持目录结构对齐 + 定制点收敛为补丁面（品牌资源、i18n 词典、desktop profile 的 seed 清单、通信通道适配）。\n2. **分阶段取**：第一刀只切 `staging → 健康检查 → 回滚` + 自带 Node/pnpm（不碰端口语义，收益立即可验证）；第二刀再决定是否换掉帧化管道。\n3. **跟踪策略**：定期 merge 官方 master，保持目录与命名对齐，冲突面最小化。\n\n## 10. 任务执行记录（2026-09-10）\n\n### 10.1 任务①：dsh-capture 改造为 `connection.fetch.register`（已完成）\n\n**改动**（`max-null-plugins/dsh-capture`）：\n\n- `src/index.ts`：`inject` 从 `['webServer','webRuntime']` → `['connection']`；三条路由（get/set/trigger）从 `ctx.webServer.register({ kind:'prefix', path:'/ssid/api/screenshot' })` 改为 `ctx.connection.fetch.register({ path:'/api/ssid/screenshot/\u003cmethod>', methods:['POST'], requestBody:'buffered', fetch })`；handler 从 node:http `(req,res)` 改为 Fetch `(request) => Response`；删除自建 Host/Origin fence（carrier 已统一应用 trust/auth）\n- `src/client/api.ts`：请求路径 `/ssid/api/screenshot/\u003cm>` → `/api/ssid/screenshot/\u003cm>`\n\n**验证结果**：\n\n| 检查 | 结果 |\n|---|---|\n| typecheck | ✅ 通过（0 错误） |\n| 无 webServer 环境下插件激活 | ✅ `webServer present? -> false`，插件仍正常加载 |\n| GET 路由 | ✅ 200 + 正确配置体（`shellAvailable:false`） |\n| TRIGGER 路由（无壳） | ✅ 503 + `shell-unavailable` |\n| 未知方法 / 错误动词 | ✅ 404 |\n\n**环境备注**：`max-null-plugins/*/node_modules` 是 Junction 指向 `dsh-chat-rail/node_modules`（全家族共享一份依赖）；补链 `@deepseek-ai/dsh-client-connection`（指向 DSHfork 的 0.1.5-alpha.2 构建产物）后 typecheck 通过。共享依赖里没有 vitest，故单测未跑。\n\n### 10.2 任务②：chat-rail / quick-toolbar 在官方壳的挂载分析（已完成）\n\n| 插件 | 静态 inject | 依赖 webServer 的功能 | 官方壳（无 webServer）结论 |\n|---|---|---|---|\n| `dsh-chat-rail` | **无** | 仅 `favoritesRouteDefinition`（收藏路由） | 激活；轮次导航（走 `sessionProjections`）正常，收藏功能降级 |\n| `dsh-quick-toolbar` | **无** | `adapters` / `state` / `authUrl` 三条路由（**核心**） | 激活但**功能整体失效**（回调不执行 → `wsSvc` 未设置 → 路由未注册） |\n\n**结论**：动态 `ctx.inject` 让两个插件都能激活，但 quick-toolbar 的降级是\"静默失效\"——需要与 capture 同款改造（`connection.fetch.register`）。\n\n## 11. 双轨兼容结论与可反馈项（2026-09-10）\n\n### 11.1 `connection` 在 web 端同样存在 → 改造是单向的\n\n`packages/bundle/web-app/cordis.patch.yml` 含 connection 行：\n\n```\n# Owns both ends of the web transport: node half binds the gateway to the\n# webserver under /api; browser half is the fetch/SSE client.\n- id: connection\n  name: '@deepseek-ai/dsh-client-connection'\n  inject: [webRuntime]\n  config:\n    trustedHosts: !!js ctx.webRuntime.trustedHosts\n```\n\n即：**web 载体下 connection 把路由挂到 webserver 的 `/api`；桌面载体下由 shell 直接分发**（`desktop.cordis.patch.yml` 保留 connection、只禁 webserver/web-runtime）。因此用 `ctx.connection.fetch.register` 注册的路由**两端都可达**——从 webServer 迁到 connection 是**单向迁移**（改一次，两端都能跑），不是二选一。\n\n唯一共同约束：路径必须在 `/api` 之下（两种载体都满足）。\n\n### 11.2 可反馈给官方：把 desktop-host 的分发改成\"先查路由表\"\n\n现状（`apps/desktop-host/src/index.ts`）：\n\n```\npathname.startsWith('/api') ? await api.fetch(request) : await assets.fetch(request)\n```\n\n即先按前缀筛、再查路由表。若改为**先查 connection 路由表、未命中再走静态资源**，插件就能注册任意路径（包括 webServer 风格的 `/ssid/api/...`），实现\"可变轨\"。\n\n**边界**：这只解决路径问题；handler 形态（node:http `(req,res)` → Fetch `(request)=>Response`）与 prefix → 精确匹配仍需插件侧改造。真正的零改造需要官方维护一层完整的 `webServer` 兼容垫片，那是另一个量级的维护负担。官方是否愿意改未知，但**我们自己的 fork 落地方案 B 时顺手改这几行是低成本收益**。\n\n## 12. 适配规范草案（待适配完成后升格为《SSiD开发手册》§9 正式规范）\n\n> **状态：草案 / 待验证。**\n> 升格条件：① 在一个 rc.1 环境（SSiD dev 或 web profile）实测通过；② 至少一个插件（`dsh-capture` 已完成改造）在两种载体上跑通。\n> 升格去向：`docs/SSiD开发手册.md` §9「插件开发与测试规范」新增小节「host 侧通信通道」。\n\n### 12.1 规范条文（草案）\n\n1. **host 侧新增 HTTP 端点一律用 `ctx.connection.fetch.register`**，不用 `ctx.webServer.register`。\n   理由：`connection` 是 carrier-neutral（web 载体把路由挂到 webserver 的 `/api`；Electron shell 载体由帧化管道直接分发），而 `webServer` 只在 web 载体存在，官方桌面端已在配置层禁用。\n2. **路由路径必须在 `/api` 之下**（如 `/api/ssid/\u003cplugin>/\u003cmethod>`）。两种载体的分发都只把 `/api` 前缀交给 connection 路由表。\n3. **精确路径匹配**：一个 `kind: 'prefix'` 路由要拆成若干条精确路径（未命中即 404）。\n4. **handler 用标准 Fetch API**：`(request: Request) => Promise\u003cResponse>`，不再用 node:http 的 `(req, res)`。\n5. **不要自建 Host/Origin fence**：carrier 在 handler 运行前已应用信任与鉴权策略。\n6. **注入声明用 `inject: ['connection']`**；避免静态 `inject` 里出现 `webServer` / `webRuntime`——静态声明缺失服务会让插件**静默不激活**。\n7. **客户端请求路径与 host 注册路径保持一致**（同为 `/api/...`）。\n\n### 12.2 升格前置（待验证）\n\n- [x] **已实测（2026-09-12）：rc.1 内核不支持 POST** —— 本机三处内核（assistant-probe `0.1.1-rc.2`、ssid 与 rc1-clean `0.1.2-rc.1`）的 `dsh-client-connection` 均为 `GET`＋`HEAD`，无 `requestBody`。→ **该前置不成立**；§12 已于 2026-09-12 升格为手册 §9 小节「host 侧通信通道」，但**附加版本边界**：规范自 `0.1.5-rc.1` 起适用，不要据此在 `0.1.2-rc.1` 上改插件。\n- [ ] `dsh-capture` 改造在 SSiD dev（rc.1）实测：截图按钮 → trigger 路由 → 壳层浮层 —— **阻塞于上一条**，需先升级内核到 `0.1.5+`。\n- [ ] 其余 5 个涉及 webServer 的插件按本规范改造后的回归 —— 同上，待升级后推进。\n- [ ] **「`0.1.5-rc.1` 的 connection 与 alpha.2 零改动」待独立复核** —— 本机未安装该版本，本次只能确认 alpha.2 侧（源码 + 行为断言），rc.1 侧仍系断言。\n\n## 13. 暂缓推进决策（2026-09-10 拍板）\n\n### 13.1 rc.1 与 0.1.5 的 connection 断代（实测）\n\n| | rc.1（当前 SSiD / web 内核） | 0.1.5-alpha.2 |\n|---|---|---|\n| `ConnectionFetchMethod` | `'GET' \\| 'HEAD'` | `'GET' \\| 'HEAD' \\| 'POST'` |\n| `ConnectionFetchRoute.requestBody` | 无 | 有（buffered / streaming） |\n| connection 的 `inject` | `['webServer','credentials']` | `['credentials']` |\n| 路由实现 | `ctx.webServer.register(route)` | carrier 直接分发 |\n| 无 webServer 时 | connection 也不激活 | connection 仍可用 |\n| 本质 | webServer 的包装层 | carrier-neutral |\n\n**结论**：`connection.fetch.register` 的 carrier-neutral 语义是 **0.1.5 才引入的**；rc.1 上它只是 webServer 的语义包装，且不支持 POST。连锁影响：\n\n- 本次 `dsh-capture` 改造（POST + `requestBody`）**在 rc.1 上不可用**，不能同步进 SSiD dev；\n- 方案 B（官方壳做底座）的**前提是内核升到 0.1.5+**；\n- §12 规范草案需加版本分界；升格前置 ① 判定为**不成立**。\n\n### 13.2 决策：暂缓推进，静观其变\n\n**理由**：DSH 主库当前一天一个版本（0.1.3-alpha.2 → 0.1.5-alpha.1 → 0.1.5-alpha.2 仅两天），内核 API 仍在快速变动；在晃动的地基上推进方案 B 会反复返工。用户将于周末集中过一遍新 DSH，并留 2–3 天观察主库新动静。\n\n**动作**：\n\n1. 本次 `dsh-capture` 改造封存到独立分支 `feat/connection-fetch-routes`（不合入 main、不同步进 SSiD、不发版）；\n2. 本文档 §1–§13 作为备查基线（背景 / 事实 / 方案 / 设计 / 实测 / 规范草案 / 决策）；\n3. 待内核稳定或升级到 0.1.5+ 后，再按 §12 规范推进其余 5 个涉及 webServer 的插件。\n\n**重启条件**（任一满足即可重新评估）：\n\n- SSiD 内核升到 0.1.5+（或官方发布 rc / beta）；\n- 官方桌面端发布安装包（当前 npm 无包、GitHub Release 无资产）；\n- 官方为 `webServer` → `connection` 提供兼容 shim 或迁移指南。\n\n### 13.3 状态更新（2026-09-10 晚）与周末计划\n\n**重启条件①已满足**：`dsh-v0.1.5-rc.1` 于 09-10 09:36 发布，npm `latest` 已从 `0.1.2-rc.1` **跳到 `0.1.5-rc.1`**（`next` 同）。rc.1 相对 alpha.2 的 connection 与桌面端**零改动**，因此 §12 规范草案的技术前提成立。详见 `dsh-anatomy/版本对比/2026-09-10-0.1.5-rc.1-vs-0.1.5-alpha.2.md`。\n\n**重启条件②仍待满足**：官方桌面端仍未发布（npm 无 `@deepseek-ai/dsh-desktop`、GitHub Release 的 assets 为空）。\n\n**周末计划（用户 2026-09-10 定：进行「大改造」）**——动手前的前置清单（**跨系列升级的破坏性变更与核对项另见 `2026-09-10-升级前置差异清单-0.1.2-rc.1到0.1.5-rc.1.md`**）：\n\n1. 决定 SSiD 内核升级目标版本（0.1.5-rc.1 已是 npm `latest`，可直接安装试验）\n2. 升级后逐项复核 §12 规范条文（尤其 `connection` 在 rc.1 的实际行为——rc.1 与 alpha.2 的 connection 源码零差异，但仍需实测确认）\n3. 启用封存分支 `max-null-plugins/dsh-capture` → `feat/connection-fetch-routes`（commit `37fa8e9`）\n4. 按 §12 推进其余涉 webServer 的插件：`dsh-memory`、`dsh-draft-polish`、`dsh-ssid-achievements`（静态必需）+ `dsh-quick-toolbar`（动态但核心功能依赖）+ `dsh-chat-rail`（动态、非核心，可选）\n5. 侧边栏类插件迁移到 `ctx.sidebarRightTabs` 的工作量评估\n6. 方案 B 落地策略复检（§9：不整体复制官方壳、定制点收敛为补丁面、分阶段取 staging/回滚）\n\n## 附：本次实测环境\n\n- 观察库：`H:\\MaxNull\\WorkStation\\DSHfork` @ `dsh-v0.1.5-alpha.2`（detached HEAD）\n- 启动方式：`pnpm install`（44s，缓存命中 1187/1266）→ `pnpm run dev:desktop`（全量构建约 6 分钟，Electron 二进制自动下载）\n- 调试端口：9222（renderer）/ 9229（main）/ 9230（host）\n- 当前状态：桌面端运行中，右侧栏展开，`DSH_HOME=C:\\Users\\MaxNull\\.dsh`（未隔离）\n"},{"file":"2026-09-10-升级前置差异清单-0.1.2-rc.1到0.1.5-rc.1.md","date":"2026-09-10","slug":"升级前置差异清单-0.1.2-rc.1到0.1.5-rc.1","title":"升级前置差异清单：0.1.2-rc.1 → 0.1.5-rc.1（2026-09-10 整理）","statusRaw":"素材已核对，标注「待查」的项尚未在本地验证。","statusKind":"记录","owner":null,"purpose":"周末「大改造」的升级前核对清单。","dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh","dsh-anatomy","dsh-ssid-panels","ssid-double-star","dsh-persona","dsh-guardian","dsh-node-appearance","dsh-v0"],"summary":"与上次升级（alpha.2 → rc.1，同系列内）不同，这次跨 0.1.2 → 0.1.5 两个系列，破坏性变更显著更多。","bytes":6853,"lines":79,"body":"# 升级前置差异清单：0.1.2-rc.1 → 0.1.5-rc.1（2026-09-10 整理）\n\n> 用途：周末「大改造」的升级前核对清单。\n> 素材来源：`dsh-anatomy/版本对比/` 三篇观察（2026-09-04 / 09-09 / 09-10）+ 官方 GitHub Release notes（经 API 核对）+ 本机实测。\n> 状态：**素材已核对，标注「待查」的项尚未在本地验证**。\n\n## 1. 升级范围\n\n| 项 | 值 |\n|---|---|\n| 起点 | `0.1.2-rc.1`（当前 web 宿主 + SSiD profile，实测 32 个包全为 rc.1） |\n| 终点 | `0.1.5-rc.1`（09-10 09:36 发布，**npm `latest` + `next`**） |\n| 中间版本 | 0.1.3-alpha.1（未发 npm）、0.1.3-alpha.2、0.1.5-alpha.1、0.1.5-alpha.2、0.1.5-rc.1（**无 0.1.4**） |\n| 提交量 | 1469（rc.1→alpha.2）+ 17（alpha.2→rc.1） |\n| 新增包目录 | 20 个，删除 0 个（清单见 09-09 观察附录） |\n\n与上次升级（alpha.2 → rc.1，同系列内）不同，**这次跨 0.1.2 → 0.1.5 两个系列**，破坏性变更显著更多。\n\n## 2. 破坏性变更清单\n\n| 变更 | 引入版本 | 影响层 | 本地需核查什么 |\n|---|---|---|---|\n| **会话格式 v2**（assistant streams 内嵌持久日志 + live stream frames） | 0.1.3-alpha.1 | 会话日志 | 会话日志读取工具（`.tmp-*.mts` 修复脚本、chat-rail 投影读取、标题修补脚本） |\n| **会话格式 v3**（identity 迁移、PTC 词汇重命名、V2 prompts → V3 system surfaces） | 0.1.5-alpha.1 | 会话日志 | 同上；**升级后的会话不支持降级读取** |\n| Session persistence API → 生命周期持有的 `SessionHandle`；`agentLoop.create()` 异步化；新增 session 锁（同 session 至多一个进程持有） | 0.1.3-alpha.1 | 内核 API | 插件是否直接调 session/agentLoop 内部 API |\n| 移除 `ctx.agent`（调用方须显式传 Agent） | 0.1.5-alpha.1 | 插件 API | ✅ **已查**：`max-null-plugins/*` 无任何使用 |\n| Inbox API：`Inbox` 改为类型接口，`hasPending` / `claim` 退出公共接口 | 0.1.5-alpha.1 | 插件 API | ✅ **已查**：无插件使用 `inbox.` / `hasPending` / `claim` |\n| 插件面板 API：`sidebar.panellist` 与 `main` 注册全局面板；原 `conversation` Slot 迁移为 `main` 的 `conversation` key | 0.1.5-alpha.2 | 插件 API | ✅ **已查（结论：不受影响）**：5 个插件的 `conversation.input.right`（capture / draft-polish）/ `conversation.input.dock`（chat-rail）/ `conversation.session.header.utilities`（plugin-center）/ `conversation.input.for`（memory），以及 `dsh-ssid-panels` 的 `settings.section` / `sidebar.brand.mark` / `sidebar.brand.name` / `conversation.hero.brand.mark`——**在 0.1.5-rc.1 里全部仍存在**。release notes 那句指「全局面板」的注册方式，与这些输入区/品牌 Slot 无关 |\n| **自定义 persona 配置拆分为前缀 + 后缀** | 0.1.3-alpha.2 | 配置 | ❌ **必须改（唯一确定风险）**：`presets/ssid-double-star/agent.cordis.yml` 用的是 `config.text`，而 0.1.5 的 `dsh-persona` schema 是 `prefix`（**required**）/ `suffix` / `complete` / `includeRuntimeContext`——**`text` 字段已不存在**，且缺 `prefix` 会校验失败 |\n| 普通 subprocess handle 移除 `pid`（终端 handle 不受影响） | 0.1.3-alpha.2 | 内核 API | ✅ **已查**：无插件读取 subprocess pid |\n| 默认工具调整：SDK / Headless / ACP 默认用 read/write/edit；minimal 系列保持 shell-only；`str_replace_editor` 移出默认 | 0.1.3-alpha.2 / 0.1.5 | 工具集 | ✅ **已查**：`str_replace_editor` 仅出现在 `dsh-guardian/src/engine.ts` 的注释与 `dsh-node-appearance/src/client/palette.ts` 的配色表键名，**无功能依赖** |\n| `str_replace_editor` 移出默认工具集（代码仍在，需显式启用） | 0.1.5 | 工具集 | 同上 |\n\n## 3. connection 能力变化（方案 B 的关键）\n\n| | rc.1（当前） | 0.1.5-rc.1（目标） |\n|---|---|---|\n| `ConnectionFetchMethod` | `'GET' \\| 'HEAD'` | `'GET' \\| 'HEAD' \\| 'POST'` |\n| `ConnectionFetchRoute.requestBody` | 无 | 有（`buffered` / `streaming`） |\n| connection 的 `inject` | `['webServer','credentials']` | `['credentials']` |\n| 路由实现 | `ctx.webServer.register(route)` | carrier 直接分发 |\n| 无 webServer 时 | connection 也不激活 | connection 仍可用 |\n\n→ **升级后 §12 规范草案（host 侧用 `ctx.connection.fetch.register`）技术前提成立**。封存分支 `feat/connection-fetch-routes` 可在升级后启用。\n\n## 4. 新增能力（升级后可用）\n\n- **右侧边栏**：`ui-sidebar-right`（`ctx.sidebarRight` / `ctx.sidebarRightTabs`，extension 档可接管 builtin）、`ui-sidebar-files`、`ui-sidebar-documentpreview`\n- **官方桌面端**：`apps/desktop` + `apps/desktop-host`（**仍未发布**：npm 无包、GitHub Release 无资产）\n- **文件体系**：`api/workspace-files`（双面文件 API）、`fs` 有界字节窗口读取、`client/resources` 资源注册表、`host/open-in-app`\n- **布局**：`ui-dockkit`（可逆停靠引擎，自述内部引擎、非稳定 API）\n\n## 5. 升级动作（两条线，路径不同）\n\n| 线 | 动作 | 注意 |\n|---|---|---|\n| **web（3080）** | `deepseek-harness` checkout `dsh-v0.1.5-rc.1` → `pnpm run clean && pnpm run build` | web profile **无 `@deepseek-ai/dsh` 依赖**（实测 n/a），内核来自 checkout，不走 overrides |\n| **SSiD** | `profile-template/pnpm-workspace.yaml` overrides 214 条 `0.1.2-rc.1` → `0.1.5-rc.1` → `prepare-runtime.mjs` 重建归档 | 套用 `2026-09-06-SSiD内核升级执行指南-rc.1通用范本.md`；指纹形态 `0.2.x-0.1.5-rc.1-\u003c哈希>` |\n\n## 6. 升级前置 checklist\n\n- [ ] **备份会话日志**（`~/.dsh/sessions` + `~/.dsh/sessions-ssid`）——v3 迁移后**不支持降级读取**\n- [ ] 备份 SSiD 归档与 profile（`~/.ssid/profile-backups/` 机制）\n- [ ] 核对 29 个 bundle 的 peer 范围（`ssid` profile 的 `dsh.profile.bundles`）\n- [ ] 检查 persona 配置（前缀/后缀拆分）\n- [ ] 检查 preset 是否依赖 `str_replace_editor`\n- [ ] 检查插件是否用 `ctx.agent` / `Inbox` 公共 API / 旧 `conversation` Slot\n- [ ] 检查各插件的 `inject` 是否含 `webServer` / `webRuntime`（静态必需者升级后行为变化）\n\n## 7. 风险与回滚\n\n| 风险 | 说明 | 缓解 |\n|---|---|---|\n| **会话不可降级** | v3 迁移后旧版本读不了新日志 | 前置备份；先在小 profile 试迁 |\n| 会话日志工具失效 | 自定义读取器需适配 v2/v3 | 升级前先跑一遍现有工具，确认基线 |\n| 插件静默失效 | 静态 `inject` 缺失服务时不报错 | 升级后逐个核对插件是否真的挂载 |\n| 性能回退 | 0.1.3-alpha.1 曾公告已知性能缺陷 | 本版应已修复，实测确认 |\n| 回滚路径 | checkout 回 tag + 恢复归档 + 恢复会话备份 | 三样都要有备份才动手 |\n"},{"file":"2026-09-10-DSH-skill生态调查.md","date":"2026-09-10","slug":"DSH-skill生态调查","title":"DSH skill 生态调查","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@jasonfreelab/dsh-superpowers","@max-null/dsh-skill-mcp-center","@max-null/dsh-skills","dsh-skill","dsh-superpowers","dsh-skills","dsh-skill-hub","dsh-any-skills","dsh-web","dsh-skill-explorer","dsh-skill-mcp-center","dsh-plugin"],"summary":"[CocoSgt/dsh-skills](https://github.com/CocoSgt/dsh-skills)（16 星，topics 含 skill-hub/slash-commands）、[cheshireez/dsh-skill-hub](https://github.com/cheshireez/dsh-skill-hub)（\"基于官方 ctx.skills 注册表\"）、[wmen","bytes":10622,"lines":179,"body":"# DSH skill 生态调查\n\n> **调查缘起**：你提出\"社区有没有人先我们一步做了这个 skill 合集？DSH 官方有没有做这样的合集？需要调查\"。\n> **调查方法**：GitHub API（仓库元数据与目录树）+ README 全文 + 对 DSH 官方源码的交叉核实。\n> **调查日期**：2026-09-10\n\n> 状态：记录（推断 · 2026-09-12）\n\n---\n\n## 一、结论先行\n\n| 问题 | 答案 |\n|---|---|\n| 社区有人做了吗？ | **有，至少 6 个项目**，但**没有一个是\"从 DSH 自身工程实践提炼判断标准\"这一路** |\n| DSH 官方做了吗？ | **没有做合集**。官方只提供机制（`packages/skill/` 的 service + provider + filesystem），`.agents/skills/` 那 12 个是开发自用、未发布 |\n| 我们的位置 | **空白**，但必须把定位写清，否则会被归入\"superpowers 那一类\"当成重复品 |\n\n---\n\n## 二、生态全景：三类项目\n\n### ① 移植类 —— 把别人的方法论搬进 DSH\n\n| 项目 | 内容 | 关键数据 |\n|---|---|---|\n| [JasonFreeLab/dsh-superpowers](https://github.com/JasonFreeLab/dsh-superpowers) | 移植 [obra/superpowers](https://github.com/obra/superpowers) **v6.3.0**（作者 Jesse Vincent / Prime Radiant，MIT），14 个 skill | 1 星；2026-08-28 建；npm `@jasonfreelab/dsh-superpowers` |\n| [gongyijie85/mattpocock-skills-dsh](https://github.com/gongyijie85/mattpocock-skills-dsh) | 移植 Matt Pocock 的 skill 集，**25 个 skill** | v0.1.6；双 README（中英） |\n\n### ② 管理工具类 —— skill 的浏览/启用/管理\n\n[CocoSgt/dsh-skills](https://github.com/CocoSgt/dsh-skills)（**16 星**，topics 含 `skill-hub`/`slash-commands`）、[cheshireez/dsh-skill-hub](https://github.com/cheshireez/dsh-skill-hub)（\"基于官方 ctx.skills 注册表\"）、[wmengxiang/dsh-any-skills](https://github.com/wmengxiang/dsh-any-skills)、[zhu1090093659/dsh-web](https://github.com/zhu1090093659/dsh-web) 的 `dsh-skill-explorer`，**加上你自己的 `@max-null/dsh-skill-mcp-center` 0.4.2**。\n\n### ③ 列表类 —— awesome 索引\n\n[itgoyo/awesome-agent-skills](https://github.com/itgoyo/awesome-agent-skills)、[scienceaix/agentskills](https://github.com/scienceaix/agentskills)、多个 `awesome-deepseek-harness`、`awesome-dsh-plugin`（有多个 fork）。\n\n---\n\n## 三、两个同类项目的 skill 清单（差异化判断的依据）\n\n### `dsh-superpowers` 的 14 个\n\n| skill | 触发时机 |\n|---|---|\n| `superpower-using-superpowers` | 任意会话起点，先加载技能再回应 |\n| `superpower-brainstorming` | 任何创造性工作之前 |\n| `superpower-writing-plans` | 有规格/需求、动手写代码之前 |\n| `superpower-using-git-worktrees` | 需要隔离工作区 |\n| `superpower-executing-plans` | 有书面实现计划要执行 |\n| `superpower-subagent-driven-development` | 按计划逐任务派子代理 |\n| `superpower-dispatching-parallel-agents` | 2+ 个互不依赖的独立任务 |\n| `superpower-test-driven-development` | 实现功能/修复之前（RED-GREEN-REFACTOR） |\n| `superpower-systematic-debugging` | 遇到 bug/失败，提出修复之前 |\n| **`superpower-verification-before-completion`** | **宣称完成/已修复/通过之前，先跑验证拿证据** |\n| `superpower-requesting-code-review` / `receiving-code-review` | 请求/接收评审 |\n| `superpower-finishing-a-development-branch` | 决定如何集成 |\n| `superpower-writing-skills` | 新建/编辑/验证技能之前 |\n\n### `mattpocock-skills-dsh` 的 25 个\n\n`ask-matt`、`code-review`、`codebase-design`、`diagnosing-bugs`、`domain-modeling`、`grill-me`、`grill-with-docs`、`grilling`、`handoff`、`implement`、`improve-codebase-architecture`、`prototype`、`research`、`resolving-merge-conflicts`、`setup-matt-pocock-skills`、`tdd`、`teach`、`to-questionnaire`、`to-spec`、`to-tickets`、`triage`、`wait-what`、`wayfinder`、`wizard`、`writing-for-agents`\n\n---\n\n## 四、差异化判断：它们做的是\"流程\"，我们要做的是\"判据\"\n\n**两者都在做人类软件工程方法论的 agent 化**——TDD、代码评审、系统化调试、计划、头脑风暴，这些都是人类开发者熟悉的流程，被写成 skill 给 agent 执行。\n\n**我们的材料来源完全不同**：\n\n| 维度 | 两个移植项目 | 我们 |\n|---|---|---|\n| **来源** | obra/superpowers、Matt Pocock（**作者个人经验**） | **DSH 官方 47 篇决策记录 + 12 个官方 skill + 974 篇 Agent Note** |\n| **内容性质** | **流程**：先做什么、后做什么 | **判据**：凭什么这么判断 |\n| **回答的问题** | \"怎么做\" | \"**为什么这么做、什么时候不该这么做**\" |\n| **立场** | 通用（任何 agent harness 都适用） | **DSH 特定**（agent 主导开发的仓库该怎样） |\n\n**它们没有覆盖的，正是我们的核心内容**：\n\n- **门禁设计**——什么时候该自动化、什么时候必须交给评审、什么叫\"表面合规\"\n- **证据标准**——相似性不构成同一性、独立预言机、度量机制会改变结论\n- **诚实的空白**——不确定时标注而非补齐（9 次出现的跨批模式）\n- **机械化的梯度**——从完全机械化到删除的八档处置\n- **决策记录制度**——Agent Note 的生命周期、强制的 Alternatives、归档与冻结\n- **被否决方案的价值**——\"决定告诉你结果，否决告诉你边界\"\n\n**最接近的一个**是 `superpower-verification-before-completion`（\"宣称完成之前先跑验证拿证据\"）——但它是**流程要求**（在什么时机做什么动作），不是**判断标准**（什么算够格的证据、什么时候验证手段本身会失效）。\n\n**结论：重合度低，但必须在 README 里主动划清**，否则读者看到\"又一个 skill 包\"就划过去了。\n\n---\n\n## 五、实施范本：从 `dsh-superpowers` 可直接借鉴的六件事\n\n这个项目把我们要走的路走通了。**以下都是它有、我们该照做的**：\n\n**① 实现方式**：`src/superpowers.ts` 是一个 **`SkillProvider`，rank 550**，**惰性加载** `SKILL.md` 正文。README 明写\"**可被项目/用户技能覆盖**\"。\n\n**rank 550 的含义**（结合 DSH 源码的 rank 表）：\n```\n100 项目 .dsh/skills   200 项目 .agents/skills   250 runtime\n300 customSkillDirs    400 user-dsh    500 user-agents\n550 ← 第三方 skill 插件   600 bundled（官方内置）\n```\n**第三方 skill 插件排在 550**——这是生态里已形成的约定，我们该跟随。\n\n**② 安装命令**（DSH 官方 CLI）：\n```sh\ndsh plugin --profile web add @jasonfreelab/dsh-superpowers\ndsh plugin --profile web remove @jasonfreelab/dsh-superpowers\ndsh --profile web --dump-config | grep -A2 '@jasonfreelab/dsh-superpowers'\n```\n\n**③ 包结构**：\n```\nsrc/superpowers.ts       # SkillProvider（rank 550），惰性加载 SKILL.md\nskills/                  # 技能目录（含 references/）\nlib/                     # 构建产物【已提交】→ GitHub 直装零构建\nscripts/                 # test.mjs + verify.mjs\ncordis.patch.yml         # bundle patch\n.github/workflows/       # ci.yml + release.yml + release-please.yml\n```\n\n**④ 双语文档策略**：**技能正文保持英文原文**，中文只做 README（`README.zh.md`）。理由写的是\"英文国际化\"——**这与我们\"保留 DSH 来源\"的想法一致，skill 正文用英文便于与上游对照，说明性文档才翻译**。\n\n**⑤ 自动化发布**：`release-please`（版本 + CHANGELOG + Release 说明）+ npm 可信发布。\n\n**⑥ 自测**：`npm test` 做\"内容卫生 + 真实 SkillRegistry\"测试，`npm run verify` 做结构校验 + 运行时冒烟。\n\n---\n\n## 六、一处需要澄清的差异：`dsh.plugin.json` 不是官方格式\n\n`mattpocock-skills-dsh` 用了一个 `dsh.plugin.json`：\n\n```json\n{ \"id\": \"gongyijie85/mattpocock-skills-dsh\", \"version\": \"0.1.6\",\n  \"main\": \"./lib/index.js\",\n  \"engines\": { \"dsh\": \">=0.1.0-rc.6\" },\n  \"contributes\": { \"tools\": [], \"skills\": [\"ask-matt\", ...] } }\n```\n\n**但我 grep 了 `DSHfork/packages/` 下的全部 TypeScript，没有 `dsh.plugin.json` 这个文件名**。所以它**不是 DSH 官方的清单格式**，而是某个第三方工具/插件中心的约定。\n\n**这意味着两条路**：\n- **`dsh-superpowers` 的路**：`cordis.patch.yml` + 代码里的 `SkillProvider`（**DSH 原生，我们倾向这条**）\n- **`mattpocock-skills-dsh` 的路**：`dsh.plugin.json` 声明式（**依赖一个非官方的消费者**）\n\n**我们走前者**——它与 DSH 官方机制直接对齐，不依赖任何第三方清单格式。\n\n---\n\n## 七、对既有决策的影响\n\n1. **名字**：你定的 `@max-null/dsh-skills` 可以。GitHub 仓库名在不同 owner 下可同名（不会与 `CocoSgt/dsh-skills` 冲突），npm 有 `@max-null` scope 隔离。**风险只是搜索混淆**——但如你所说，我们更贴近\"DSH skills\"这个语义。\n2. **实现方式**：确认走 **provider 式（方案 A）**，并且按 `dsh-superpowers` 的范本用 **rank 550**（不是我之前推测的 600）。\n3. **落点**：不再是 SSiD 的 `.agents/skills/`，而是**独立 npm 包**；SSiD 侧用 npm 声明集成（你已定）。\n4. **双语**：技能正文可用英文（与上游 DSH 对照方便），说明文档做中文——**这个策略已被同类项目验证**。\n\n---\n\n## 八、待核实与待决策\n\n**待核实**：\n- 两个项目的**具体 skill 内容**（我只看了清单与触发时机，未读 SKILL.md 正文）——如果要精确划清差异，需要抽查最接近的几个（如 `superpower-verification-before-completion`）\n- `superpower-writing-skills` 里有没有\"怎么写 skill 的方法论\"——**如果有，它可能与我们的\"skill 适配\"工作直接相关**\n\n**待决策**：\n- 是否要把 `superpower-writing-skills` 读一遍（它是\"教 agent 写 skill\"的 skill，对我们做适配可能有直接参考价值）\n\n---\n\n## 附：调查方法与证据边界\n\n- **已核实**：两个仓库的元数据与完整目录树（GitHub API）、`dsh-superpowers` 的 README 全文、`mattpocock-skills-dsh` 的 `dsh.plugin.json` 全文、DSH 源码中 `dsh.plugin.json` 不存在。\n- **未核实**：其余 4+ 个管理工具类项目的实际功能（仅凭 GitHub description 判断）；两个移植项目的 SKILL.md 正文；`CocoSgt/dsh-skills` 的实际内容（首次 fetch 只拿到 GitHub 导航菜单，未取到仓库内容，其性质依据是其 topics 与 16 星）。\n- **时效性**：生态数据为 2026-09-10 抓取，DSH 生态更新频繁，结论会过时。\n"},{"file":"2026-09-10-dsh-skills发布与集成.md","date":"2026-09-10","slug":"dsh-skills发布与集成","title":"@max-null/dsh-skills 发布与集成","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-skills","dsh-skills","ssid-record-browser-gif","ssid-test-reliability","dsh-ci-test-reliability","ssid-trim-cot-leakage","dsh-trim-cot-leakage","ssid-prose-standard","dsh-prose-standard","ssid-code-review","dsh-code-review","ssid-find-simplifications"],"summary":"把 DSH 官方 .agents/skills 的 12 个 skill 判据适配成思灵可用的 8 个 skill，打包为 @max-null/dsh-skills；4 个因依赖思灵没有的制度（双语、Agent Note 状态机、gh stack、整套文档制度）而不适配——但它们的制度无关判据已并入那 8 个，没有丢。","bytes":6229,"lines":108,"body":"# @max-null/dsh-skills 发布与集成\n\n> 状态：进行中（推断 · 2026-09-12）\n\n> **这是本次适配工作的交付入口**：一页说清**产出了什么、还差什么、你要做什么**。\n> 全部过程记录在 `2026-09-10-skill适配说明-*.md` 系列（序号 01–09，含 01 份写作规则）。\n\n---\n\n## 一、一句话\n\n把 DSH 官方 `.agents/skills` 的 **12 个 skill** 判据适配成思灵可用的 **8 个 skill**，打包为 `@max-null/dsh-skills`；**4 个**因依赖思灵没有的制度（双语、Agent Note 状态机、`gh stack`、整套文档制度）而不适配——**但它们的制度无关判据已并入那 8 个**，没有丢。\n\n---\n\n## 二、产出物\n\n| 类别 | 位置 | 状态 |\n|---|---|---|\n| **适配说明**（判定依据） | `dsh-skills/docs/适配说明/2026-09-10-skill适配说明-01..09` | 9 份完成 |\n| **判定规则**（后续同类工作的依据） | 同上 `-写作规则.md` | 完成 |\n| **判据正文** | `max-null-plugins/dsh-skills/skills/*/SKILL.md` | 8 份完成 |\n| **来源标记** | 同目录 `SOURCE.md` | 8 份完成 |\n| **包本体** | `max-null-plugins/dsh-skills/`（package.json / lib / cordis.patch.yml / README / LICENSE） | 完成，可发布 |\n| **脚本（逐字复用）** | `skills/ssid-record-browser-gif/scripts/` | 2 个，SHA256 与上游一致 |\n\n**8 个 skill 与它们的上游**：\n\n| skill | 上游 | 适配类型 |\n|---|---|---|\n| `ssid-test-reliability` | `dsh-ci-test-reliability` | 小改 |\n| `ssid-trim-cot-leakage` | `dsh-trim-cot-leakage` | 小改 |\n| `ssid-prose-standard` | `dsh-prose-standard` | 小改 |\n| `ssid-code-review` | `dsh-code-review` | 需适配 |\n| `ssid-find-simplifications` | `dsh-find-simplifications` | 需适配 |\n| `ssid-pre-push-checks` | `dsh-pre-push-checks` | 需适配 |\n| `ssid-speed-up-perf` | `dsh-speed-up-perf` | 需适配 |\n| `ssid-record-browser-gif` | `record-browser-gif` | 部分可用 |\n\n全部指向同一个上游锚点：**`c291e7961a`（2026-09-10 抓取）**。\n\n---\n\n## 三、你要做的事（两条命令）\n\n**GitHub 侧已完成**：`https://github.com/Max-Null/dsh-skills`（PUBLIC，分支 main，6 个提交已推送）；SSiD 本仓库也已推送（`d7fb2bb`）。\n\n```sh\ncd H:\\MaxNull\\WorkStation\\max-null-plugins\\dsh-skills\nnpm login                      # 必须：本机 .npmrc 里的 _authToken 已失效（npm whoami → E401）\nnpm publish --access public\n```\n\n- `--access public` 是必须的——`@max-null/*` 是 scoped 包，**默认按私有发布**。\n- 包名已确认**未被占用**（`npm view` → 404）；同 scope 的 `dsh-chat-rail@0.6.1` 与 `dsh-memory@0.6.0` 都能查到，说明 scope 存在且你有发布权。\n\n**发布后自检**：\n\n```sh\nnpm view @max-null/dsh-skills version    # 应返回 0.1.0\n```\n\n---\n\n## 四、发布后三步集成\n\n1. `shell/profile-template/package.json` **两处声明**：\n   - `dependencies` 加 `\"@max-null/dsh-skills\": \"0.1.0\"`\n   - `dsh.profile.bundles` 数组加 `\"@max-null/dsh-skills\"`\n2. `node scripts/prepare-runtime.mjs` 重建归档\n3. 重启后在**新会话**里问「有哪些 `ssid-` 开头的 skill」——**八个都在**即成功\n\n**失败时的排查顺序**：包是否进了 `node_modules` → profile 的 `cordis.patch.yml` 里是否有那一行 → **该 profile 是否真的重启过**（provider 在 `apply()` 时注册，不重启不生效）。\n\n---\n\n## 五、未竟事项（诚实列出）\n\n| # | 事项 | 影响 |\n|---|---|---|\n| 1 | ~~`ssid-trim-cot-leakage/references/examples.md` 校准样本不全~~ **已补齐** | **11 节 / 22 案例 / 152 行**，节数与上游一致（上游 11 节 / 30 案例 / 275 行）。案例数少于上游是**有意的**：上游案例绑定 DSH 的目录与机制，逐个直译会得到\"在思灵读不懂\"的样本集；取舍是保证每节至少一个可校准的真实样本 |\n| 2 | ~~本机未安装 `ffmpeg` / `ffprobe`~~ **已装** | ffmpeg / ffprobe **9.0.1**（gyan.dev release-essentials，106 MB）解压在 `H:\\MaxNull\\WorkStation\\.build\\ffmpeg\\ffmpeg-9.0.1-essentials_build\\bin\\`，并写入**用户级 PATH**（`IsAdmin=False` 下走便携版路线，不需要提权）。**编码器 5 个自测已实测通过**。若不想让用户 PATH 保留这一条，删掉即可——skill 里也记了绝对路径 |\n| 3 | ~~包的 GitHub 仓库尚未创建~~ **已建并推送** | `https://github.com/Max-Null/dsh-skills`（PUBLIC，分支 main，6 个提交）；`package.json` 的 `repository` / `homepage` / `bugs` 现在都指向真实地址。**SSiD 本仓库也已推送**（`d7fb2bb`） |\n| 4 | 手册待办 **#7（`docs/决策/` 状态机）未做** | `ssid-code-review` 的「决策记录与已交付现实一致」与 `ssid-find-simplifications` 的「取代标记」两条判据依赖它；缺失时只按当前无状态机的形态执行 |\n\n---\n\n## 六、复核入口（想查什么看哪里）\n\n| 想知道 | 看 |\n|---|---|\n| 为什么某个 skill 这样改 | 对应的 `-NN-*.md` §三（逐条判定） |\n| 上游判据有没有少 | 各说明 §四「算术核对」+ 包的 `SOURCE.md`「与上游的差异」 |\n| 数字对不对 | 各说明 §八「数字自检」——**每个数字都附可复现命令** |\n| 我犯过哪些错 | 各说明的自查记录 + 《写作规则》§三（**9 次\"数一数\"类错误，全部留痕**） |\n| 怎么加工新的 skill | 《写作规则》§六（七节结构模板）与 §七（SOURCE.md 模板） |\n| 上游更新了怎么办 | 每份 `SOURCE.md` 末尾的「跟进方式」（附 `git log` 命令） |\n\n---\n\n## 七、这次工作本身的收获\n\n三条可复用的方法，已写进《写作规则》：\n\n1. **三层验证规则**：未改动的判据继承上游检验；等价替换只需可解析性检查；**改写与新增必须指出证据来源，指不出来就不新增**。\n2. **数字纪律**：写不出可复现命令的数字不许进正文。这条是从**真实错误**里长出来的——三份说明共犯 9 次\"数一数\"错误（凭印象报数）。\n3. **生成 skill 的过程本身就是一次复核**：03 的两处数字错误**只有在落地成 skill 时才暴露**。所以「适配说明写完」不等于「判据已准确」。\n"},{"file":"2026-09-10-DSH决策记录的人机协作形态.md","date":"2026-09-10","slug":"DSH决策记录的人机协作形态","title":"DSH 决策记录的人机协作形态","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"来源：.agents/notes/README.md（125 行，制度的正式文件） 它对自身的定性在开头第一段：","bytes":11239,"lines":167,"body":"# DSH 决策记录的人机协作形态\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **这份笔记补的是什么**：前 15 批只覆盖 `implemented/process/`（47 篇）。这次查出全库实际有 **974 篇英文 Agent Note**，而我此前报的\"230 篇 architecture\"是**文件数**（含中文配对），英文只有 115 篇。\n> 本篇补上三类此前未纳入的材料：**Agent Note 制度本身**、**人机分工的一手证据**、以及**\"什么时候不该用机器判定\"的判据**——最后这条正是前一批末尾列为\"没有答案\"的那个问题。\n\n---\n\n## 一、Agent Note 是什么\n\n来源：`.agents/notes/README.md`（125 行，制度的正式文件）\n\n它对自身的定性在开头第一段：\n\n> 一份 **Agent Note** 记录一个影响本代码库的决策或提案——**其中的\"为什么\"和\"我们放弃了什么\"，即代码与文档承载不了的那些部分**。\n\n三个关键设计：\n\n**① 路径就是状态。** 格式为 `{生命周期}/{类别}/日期-主题.md`，两轴都编码在路径里：\n\n| 生命周期 | 含义 |\n|---|---|\n| `proposed/` | 实施前经过评审的提案，尚未建成 |\n| `implemented/` | 决策已交付。记录决定了什么、否决了什么，**并随实际交付物保持最新**（只更新事实——路径、名字、结构——不更新决策本身） |\n| `rejected/` | 提案被审议并拒绝。**只在它的理由能阻止一个诱人且有意义的错误时才保留**，否则整组删除 |\n\n| 类别（共 6 个，封闭集合） | 覆盖范围 |\n|---|---|\n| `feature` | 面向用户或模型的新能力 |\n| `bug-fix` | 修正缺陷，或补上事故复盘暴露的缺口 |\n| `simplification` | 移除代码、行为或表面积，而不新增能力 |\n| `architecture` | 关于**已交付源码**的结构决策 |\n| `process` | 代码**周边**的工具、政策、工作流（门禁、包管理器、vendoring），不是运行时行为 |\n| `testing` | 测试基础设施与策略 |\n\n**② 强制的 `## Alternatives considered`。** 每一篇都必须有这一节，且：\n\n> **决策若没有记下它击败了什么，就会招致\"重新打官司\"——而那正是 Agent Note 存在要防止的失败。**\n\n**③ 正文骨架按生命周期固定**（`implemented/` 是 `Problem → Decision → Alternatives considered → Consequences`），由门禁强制；`Proposal`、`Plan`、`Acceptance criteria` 这类提案期标题**在 implemented 里被门禁拒绝**。\n\n---\n\n## 二、谁执笔、谁评审、谁授权\n\n`.agents/notes/AGENTS.md` 第 3 行是直接答案：\n\n> Agent Notes are effectively **RFCs written by agents**（Agent Note 本质上是由 agent 撰写的 RFC）。\n\n三种角色在材料里都能定位：\n\n| 角色 | 依据 |\n|---|---|\n| **agent：执笔与执行** | 上句；`process/2026-06-11-quality-gates.md`：本代码库**主要由编码 agent 开发** |\n| **人：评审者** | `process/2026-08-09-committed-artifact-citations.md` 记录了\"**大型设计与评审会话**\"会留下 **reviewer rulings（评审者裁决）**；`README.md`：由**评审**强制执行\"非平凡变更必须写 Note\"这条语义边界 |\n| **人：项目所有者** | `process/2026-07-30-generated-third-party-notices.md`：**项目所有者单独授权**分发某个 SDK 的每一个官方版本 |\n\n第三种最值得注意——**那是机器拿不到的信息**：开源合规要求披露某份依赖，这件事\"不是工程必须，是开源必须\"，而授权只能由人给出。\n\n还有一处能说明协作的严格程度。`proposed/process/2026-07-13-human-review-skill-maintenance.md` 描述了一个**双评审者流程**，它把每条反馈的作者分成三类：**`human-authored`（人写的）/ `forwarded-automation`（agent 转发机器发现的）/ `unclear`（无法判定）**，然后：\n\n> 从\"已被修复的机器人发现\"里学习 —— **否决：来源契约是人的评审反馈**。作者类型在分析之前就被过滤。\n\n**他们只从人的反馈里学习，并明确过滤掉 agent 转发的内容。** 人和 agent 在这里不是可互换的两种劳动力。\n\n---\n\n## 三、关键判据：什么时候**不该**用机器判定\n\n这回答了前一批末尾\"我没有答案\"的那个问题——**判据就在这条规则里**。\n\n`README.md` 要求：**每个非平凡变更必须在同一个 PR 里添加或更新至少一个 Agent Note**。但这条规则**没有门禁**：\n\n> **评审强制这条语义边界。没有任何自动门禁试图把一个 diff 分类为平凡或非平凡**，所以这条政策不增加门禁阶段或运行时。\n\n被否决的对照方案给出了完整理由（`archived/process/2026-07-19-require-agent-notes-for-non-trivial-changes.md`）：\n\n> **加一道 CI 的 diff 分类门禁。** 一个机械检查**无法可靠判断一个语义变更是否平凡**，而另一道门禁会增加运行时，**并招致误报或表面合规（superficial compliance）**。\n\n拆开是两条理由，缺一不可：\n\n1. **能力上不可靠**：机械检查无法可靠判断\"语义上是否平凡\"\n2. **代价上不划算**：多一道门禁增加运行时，而且会招致**误报**与**表面合规**\n\n**\"表面合规\"（superficial compliance）** 这个词是新的，它比\"误报\"更精确：**一道不可靠的门禁不会让人去解决它想解决的问题，而是让人学会迎合它。**\n\n这和第一批读到的\"一刀切天花板会**训练贡献者橡皮图章式地批准提高上限**\"，是同一失败模式的两种表述。\n\n### 由此修正第 4 档与第 6 档的区别\n\n我此前说\"两者都不强制，所以没找到判据\"——**这个框定本身是错的**。它们的区别不在\"强不强制\"，而在**机器是否具备可靠的判定能力**：\n\n| 档位 | 机器的判定能力 | 处置 | 为什么 |\n|---|---|---|---|\n| **参考性（advisory）** | **不可靠**，但**跑起来仍有参考价值** | 跑，但不阻塞合并 | 例：Knip 的未使用代码扫描——泛化会误伤动态加载与生成代码，但宽泛信号本身有参考价值 |\n| **由评审负责（review-owned）** | **不可靠**，且**跑起来只有害处** | **不跑** | 例：\"这个 diff 是否平凡\"——跑起来会招致表面合规，且增加运行时 |\n\n**判据是：当机器的判定不可靠时，跑这道检查还有没有剩余价值？有则降级为参考性；没有且会招致表面合规，就交给评审。**\n\n你关于\"脚本失效会静默通过\"的那条洞察，恰好是这道题的另一面：**不可靠的判定有两种危害——静默通过（漏），和表面合规（把注意力从真问题引开）。** 后者更隐蔽，因为它会让人以为自己合规了。\n\n---\n\n## 四、\"脚本静默失效\"在被防御的名单上\n\n你指出\"脚本也要有适用环境，外部条件变了会使脚本失效，进而静默通过\"。这不是多虑——**它是一个被专门命名的失效模式，且有一整类防御对应**：\n\n| 防御 | 出处 |\n|---|---|\n| **拒绝缩窄的语料** | `scripts/verify-client-ui-i18n.ts`：*\"discovery narrowed to N source file(s); expected at least M\"*；对应决策 `architecture/2026-08-23-locale-owned-client-ui-copy.md`：\"**Discovery refuses a narrowed corpus**\" |\n| **空语料直接失败** | `scripts/verify-cordis-config.ts`：包自身配置扫描为空 → 报错；fixture 数量为零 → 报错 |\n| **明写覆盖缺口** | `process/2026-08-09-committed-artifact-citations.md`：*\"**Coverage gap**: no gate rejects a new ordinal citation — review owns the rule.\"* |\n| **声明不声称什么** | `architecture/2026-08-04-configuration-source-ownership.md`：门禁*\"makes no repository-wide claim about `process.env` access\"* |\n\n**结论：他们防的不只是\"脚本判错\"，而是\"脚本因为环境变了、扫描面缩了，然后静默地报绿\"。** 这在他们那里是一整类防御，不是边角问题。\n\n---\n\n## 五、覆盖率清点（修正此前的数字）\n\n| 目录 | 英文篇数 | 状态 |\n|---|---:|---|\n| `implemented/`（6 类） | **310** | process/ 47 篇已 100% 读毕；其余 263 篇未读 |\n| `proposed/` | 21 | 未读（本次查证读了 1 篇） |\n| `rejected/` | 14 | 未读 |\n| `archived/`（冻结历史） | 629 | 未读（本次查证读了 1 篇） |\n| **合计** | **974** | **已精读 47 篇 = 4.8%** |\n\n两个必要的限定：\n\n- **`archived/` 不是遗漏**。按第 06 批读到的归档政策，它是**冻结的历史**，官方明确要求\"**不得将其视为当前行为的权威依据**\"，且所有文档门禁都跳过它。所以当前权威是 `implemented` + `proposed` + `rejected` = **345 篇**，我读了其中 **47 篇（13.6%）**。\n- **`process/` 是唯一的完整覆盖**。这不是\"我读了 4.8% 所以学得少\"，而是\"**我完整读完了\"流程与政策\"这一整类，其余 5 类（架构、功能、缺陷、简化、测试）只读了它们的流程侧**\"。\n\n---\n\n## 六、附：这次会话本身也是同构的\n\n你指出\"我们的这次会话不也是一次 Agent Note 吗，你在执笔不是吗\"——**结构上确实高度吻合**。\n\n这 15 批笔记的每一篇，用的骨架正好是 `implemented/` 的规定骨架：\n\n| Agent Note 的规定骨架 | 本系列笔记的对应小节 |\n|---|---|\n| `## Problem` | 「他们遇到的事」 |\n| `## Decision` | 「判断」 |\n| `## Alternatives considered` | 「被否决的方案」 |\n| `## Consequences` | 「他们承认的代价」 |\n\n而本次会话的过程，也与那套流程同构：**你提出判断 → 我去取证（读源码与决策记录）→ 落盘 → 你复核并提出修正**。\n\n**但有三处实质差别，值得记下来：**\n\n1. **读者不同，所以形态不同。** DSH 的 Agent Note 写给\"将来要改动这块代码的人或 agent\"；本系列笔记写给\"想学这套判断方法的人\"。前者为**行动**服务，后者为**理解**服务——所以笔记保留了大量的\"他们凭什么这么判断\"，而 Agent Note 本身不需要解释自己的方法论。\n\n2. **我们缺少 supersession 检查（取代关系检查）。** `README.md` 要求写一篇新 Note 时必须检索活跃树中覆盖同一决策的旧 Note，并分类完全取代或部分取代。我在写这 15 批时**没有做这件事**——我不知道它们是否与 SSiD 已有的学习笔记重复或冲突。\n\n3. **我们的产物没有状态字段。** Agent Note 的 `Status:` 行与文件夹互为校验（门禁会交叉检查），而本系列笔记是\"一次性写就\"的——它们不会随 SSiD 的实践演进被更新。**如果以后要拿它们当规范用，这会成为问题。**\n\n---\n\n## 下一步（待你定）\n\n1. **是否要把\"人机协作形态\"这套结论回写进总表**？现在它只在这一篇里，总表的\"工作方式\"一节没有覆盖它。\n2. **是否要补做 supersession 检查**（第六节第 2 点涉及的问题）——即检查本系列笔记与 `2026-09-10-DSH工程方法论学习笔记.md` 等已有文档是否重复。\n3. **剩余 263 篇 implemented/ 非 process 类**要不要继续读——按第 06 批学到的方法论，它们属于\"另一类\"，读它们更像读产品决策而非流程决策。\n"},{"file":"2026-09-10-DSH作为AI中台内核的评估框架.md","date":"2026-09-10","slug":"DSH作为AI中台内核的评估框架","title":"DSH 作为 AI 中台内核：评估框架（2026-09-10）","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["dsh-anatomy"],"summary":"不采纳的理由有硬依据，不是印象： - 官方 AGENTS.md 明写 \"Public APIs are pre-stable; update every consumer.\" - 会话格式处于 v0 → v1 → v2 → v3 的演进中（v3 于 0.1.5-alpha.1 落地，rc.1 与 rc.2 之间仍在补迁移细节） - 发布节奏：24 天 16 个 tag（08-17 ~ 09-10）","bytes":2892,"lines":60,"body":"# DSH 作为 AI 中台内核：评估框架（2026-09-10）\n\n> 背景：用户曾考虑以 DSH 作为公司 AI 中台的内核，因当时 DSH 刚发布而未采纳。本文件固化那次判断的依据，并给出未来的就绪判据与可立即采用的中间道路。\n> 依据：本工作区对主库的持续观察（`dsh-anatomy/版本对比/`）+ 官方 `AGENTS.md`、`docs/architecture.md` 的原文表述。\n\n> 状态：已决策（推断 · 2026-09-12）\n\n## 1. 当时的判断与依据\n\n不采纳的理由有硬依据，不是印象：\n\n- 官方 `AGENTS.md` 明写 \"Public APIs are pre-stable; update every consumer.\"\n- 会话格式处于 v0 → v1 → v2 → v3 的演进中（v3 于 0.1.5-alpha.1 落地，rc.1 与 rc.2 之间仍在补迁移细节）\n- 发布节奏：24 天 16 个 tag（08-17 ~ 09-10）；09-08 → 09-10 三天内四个版本\n- 无 LTS 概念、无商业支持渠道\n\n结论：不是「简陋」，是「未定型」。\n\n## 2. 就绪观察信号\n\n| 维度 | 2026-09-10 现状 | 就绪信号 |\n|---|---|---|\n| API 稳定性 | pre-stable，每次变更须更新所有消费者 | 发布 stable（非 rc/alpha）+ 稳定性承诺窗口 |\n| 会话格式 | v3 刚落地，迁移机制已建但仍在演进 | 格式冻结，或有 LTS 级别的迁移保证 |\n| 发布节奏 | 三天四个版本 | 季度级，且破坏性变更预先公告 |\n| 工程成熟度 | test/ci 占比升至 34%（在补基建） | 覆盖率与性能有硬门禁 |\n| 支持体系 | 无 LTS、无服务渠道 | 有 LTS 分支与服务渠道 |\n\n一句话判据：**官方开始承诺「某接口 N 年不变」之日，才是可以压上中台之时。**\n\n## 3. 中间道路：把 DSH 当可替换的 Agent 运行时\n\n即使现在，也可以按「可替换」的方式使用 DSH，不必等它稳定：\n\n1. 业务逻辑留在自己的服务里；DSH 只负责 Agent 编排与工具调用\n2. AI 能力通过 DSH 的工具/插件暴露，但接口由我们定义\n3. 不把 DSH 内部契约写进业务代码（会话格式细节、slot 名、投影缓存结构）\n4. DSH 升级时只改适配层；将来替换 DSH 也不伤害业务\n\n这套做法与 DSH 自身的设计哲学相容：官方声明「没有特权内核可改，一切皆插件」，意味着它本来就预期被组合与替换。\n\n## 4. 边界：哪些不是 DSH 的责任\n\n中台化的真正难点不在「能否用 DSH 承载 Agent」，而在：\n\n- 多租户隔离\n- 多服务编排\n- 长生命周期运维\n\n这三件由中台自己负责。边界划清，DSH 是好用的组件；划不清，它每次升级都会变成故障源。\n\n## 5. 评估节奏\n\n每季度对照 §2 表评估一次，或在下列事件发生时立即重评：\n\n- 官方发布 stable（非 rc/alpha）版本\n- 官方宣布会话格式冻结或 LTS 计划\n- 官方为插件 API 给出稳定性承诺\n- 官方桌面端正式发布（产品化信号）\n"},{"file":"2026-09-10-SSiD-check-rules骨架建议.md","date":"2026-09-10","slug":"SSiD-check-rules骨架建议","title":"SSiD check-rules 骨架建议（对标官方 Gates）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-09-10","dateNote":"对应手册待办 #5、#9","tags":["@max-null/dsh-ssid-panels","@playwright/mcp","@astudioplus/codegraph-mcp","@deepseek-ai/dsh","@max-null/dsh-header-unify","@max-null/dsh-quick-toolbar","ssid-check-rules","dsh-anatomy","dsh-ssid-panels","dsh-ssid-zh-ui","dsh-quick-toolbar","dsh-capture"],"summary":"本文的输入是官方仓库 DSHfork（= deepseek-ai/deepseek-harness）scripts/ 下 55 个 verify- 门脚本与 1583 行编排器 run-gates.ts 的精读结果，报告原文见： - dsh-anatomy/工程范式/2026-09-10-DSH官方Gates拆解原始报告-E-配对与配置门.md（verify-translation-pairing","bytes":22857,"lines":394,"body":"# SSiD check-rules 骨架建议（对标官方 Gates）\n\n> 状态：进行中（推断 · 2026-09-12）\n\n日期：2026-09-10　对应手册待办 #5、#9\n\n## 0. 输入与边界\n\n本文的输入是官方仓库 `DSHfork`（= `deepseek-ai/deepseek-harness`）`scripts/` 下 55 个\n`verify-*` 门脚本与 1583 行编排器 `run-gates.ts` 的精读结果，报告原文见：\n\n- `dsh-anatomy/工程范式/2026-09-10-DSH官方Gates拆解原始报告-E-配对与配置门.md`（`verify-translation-pairing.ts`、`verify-cordis-config.ts`）\n- `dsh-anatomy/工程范式/2026-09-10-DSH官方Gates拆解原始报告-F-run-gates编排.md`（`run-gates.ts`）\n\n结论对 SSiD 侧的真实结构做了核实：SSiD 壳库根目录**没有** `package.json`，脚本家在\n`seek-soul-in-darkness/shell/`，运行器是 `npm run`。本文所有落点均按此写。\n\n本文只给骨架与判定契约，不含实现代码。\n\n## 1. 官方 Gates 的形状（结论先行）\n\n| 维度 | 官方实测 | SSiD 应否照搬 |\n|---|---|---|\n| 门数量 | 55 个 `verify-*` 门脚本（`scripts/` 下共 210 个文件） | 否，四项检查 |\n| 编排器 | `run-gates.ts` 1583 行 / 17 个聚合 mode | 否，约 150 行 |\n| 依赖 | `needs`（强）+ `after`（弱）+ DFS 环检测 | 否 |\n| 调度 | 单进程手写容量闸 + `availableParallelism()` 上限 | 否，四个门串行 |\n| 失败处理 | fail-fast + `kill(-pid)` 进程树终止 + 静默确认 | 否 |\n| 开关 | 十余个 `DSH_*` 环境变量 | 否 |\n| 空语料 | 显式 fail-loud | **是** |\n| 每门自测 | 每个 gate 配 `.spec.ts` | **是** |\n| 失败定位 | 每条违规自带 `文件:行` | **是** |\n\n官方那 1583 行不是设计过剩，是被\"55 个门 + vitest worker + dev server 这类会留下后代的\n子进程\"逼出来的：`needs`/`after` 双依赖存在的理由是同目录产物的读者与写入者互斥\n（`run-gates.ts:447-461`、`526-536`），进程树终止体系存在的理由是子进程会留后代\n（`1091-1265`）。SSiD 四个检查脚本都读完几十个文件就退出，串行耗时以秒计，上述机制一件都用不上。\n\n## 2. 落点\n\n```\nseek-soul-in-darkness/shell/\n├── package.json                 # 增加 5 行 scripts\n└── scripts/\n    ├── check-rules.mjs          # 编排器（四项都就绪后再建）\n    ├── check-vendor-sync.mjs\n    ├── check-profile-sync.mjs\n    ├── check-bom.mjs\n    ├── check-legacy-names.mjs\n    └── check-rules.manifest.json   # 例外清单（白名单式）\n```\n\n沿用 `.mjs` 而非官方的 `.ts`：`shell/scripts/` 现有五个脚本里四个是 `.mjs`\n（`boot-bundled.mjs`、`prepare-runtime.mjs`、`repack-open-sea-skin-vendor.mjs`、\n`verify-deploy-rename.mjs`），另一个 `after-pack.cjs` 是 electron-builder 的钩子。\n检查脚本不需要类型，保持形态一致就不必让 `scripts/` 依赖 `tsx`。\n\n**`verify-deploy-rename.mjs` 是一个要避开的先例。** 它 72 行里逐场景 `console.log`，\n失败只打 `[FAIL]`，进程仍以 0 退出，结尾固定打 `ALL CHECKS DONE`。这种形状供人肉阅读，\n无法挂 pre-push 或发版前置——CI 与发版脚本只认退出码。新脚本从第一个起就必须把\n\"发现问题 ⇒ 非零退出\"写死。\n\n## 3. 四项检查的判定契约\n\n### 3.1 check-vendor-sync：vendor 四份一致\n\n手册 §10 定义的同步链是四份：\n\n```\n1. seek-soul-in-darkness/plugins/\u003cpkg>/lib/**        源头\n2. ~/.dsh/profiles/web/vendor/\u003cpkg>                  运行时（web）\n3. ~/.dsh/profiles/ssid/vendor/\u003cpkg>                 运行时（ssid）\n4. shell/profile-template/vendor/\u003cpkg>               发版基准\n```\n\n适用范围要显式声明，不能对所有 vendor 条目一律比，而且**源头未必在 SSiD 仓库内**。\n已核实 SSiD 仓库根的 `plugins/` 下有三个包，但只有两个是现行源头：\n\n| 包 | 源头 | 可比份数 |\n|---|---|---|\n| `dsh-ssid-panels` | `seek-soul-in-darkness/plugins/dsh-ssid-panels/lib` | 四份 |\n| `dsh-ssid-zh-ui` | `seek-soul-in-darkness/plugins/dsh-ssid-zh-ui/lib` | 四份 |\n| `dsh-quick-toolbar` | `max-null-plugins/dsh-quick-toolbar/lib`（**仓库外**） | 四份，源侧不在本仓 |\n| `dsh-capture` | `max-null-plugins/dsh-capture/lib`（仓库外） | 三处 vendor 互比 |\n| `dsh-context-doctor` | 上游固化，无本地源头 | 三处 vendor 互比 |\n\n`seek-soul-in-darkness/plugins/dsh-quick-toolbar` 曾是该插件 2026-08-30 迁出独立时\n未清理的残留：停在 0.1.0，落后现行 0.8.6 七个小版本，且全仓没有任何脚本引用它。\n它若被当作源头写进 manifest，`check-vendor-sync` 会稳定报三个假红。该残骸已于\n2026-09-10 删除（见 §6），实测数据见 §7。\n\n**不要照搬记录式哈希。** 官方 `.i18n.yaml` 采用\"记录上次确认一致时的 git blob 哈希\"，\n是因为双语对两侧内容本来就不同，没有可比的第二份。SSiD 的四份是**应当完全相同**的副本，\n直接实时比对即可；若引入记录文件，它自己就变成第五个需要同步的东西。\n\n**哈希对象是文件集合，不是目录。** 已核实两个内置插件的同步语义并不相同：\n\n- `dsh-ssid-panels`（源 21 文件 / vendor 21 文件）与 `dsh-ssid-zh-ui`（5 / 5）：\n  源目录与 vendor 副本**逐文件全等**，连 `src/`、`tests/`、`docs/` 都同步。\n- `dsh-quick-toolbar`：源（`max-null-plugins/`）43 文件，vendor 只有 5 个——vendor 是\n  **精简副本**，只含 `lib/`、`cordis.patch.yml`、`package.json`；源码、测试、截图、\n  `README`、`LICENSE` 都不进 vendor。整目录比对会报 **40 处差异，其中只有 1 处是真信号**\n  （vendor 侧多出的旧脚本 `verify-header-unify.cjs`），其余 39 处是\"源侧有而 vendor\n  本就不需要\"。\n\n所以比对面必须按包声明，不能一律要求\"整目录摘要相等\"。正确做法是逐文件建\n`相对路径 → 内容哈希` 映射再比，差异分三类输出：\n\n- 只在源侧存在 → 未同步\n- 只在 vendor 侧存在 → 多余文件\n- 两侧都有但内容不同 → 漂移\n\n文本文件在报差异时给出**第一处不同的行号**，二进制给文件级。这一点是官方门禁里\n\"每条违规自带 文件:行 定位\"的直接落地，没有定位的漂移报告等于没跑。\n\n哈希用 `node:crypto` 的 `sha256`。手册写的是习惯叫法\"MD5\"，实现不必跟着弱算法走，\n但文档与错误信息里要把用词统一（建议统一为\"指纹\"）。\n\n比对面写进 manifest，采用官方\"只列排除项\"的白名单风格（`verify-translation-pairing.ts:93-101`\n的目录项以 `/` 结尾做边界，同款写法）：\n\n```json\n{\n  \"packages\": {\n    \"@max-null/dsh-ssid-panels\": {\n      \"source\": \"../../plugins/dsh-ssid-panels\",\n      \"include\": [\"lib/**\", \"package.json\", \"cordis.patch.yml\"],\n      \"exclude\": [\"**/*.map\", \"**/*.tsbuildinfo\"]\n    }\n  }\n}\n```\n\n### 3.2 check-profile-sync：profile vs template 声明\n\n比对面：`shell/profile-template/package.json`（发版基准，A 侧）对\n`~/.dsh/profiles/ssid/package.json`（运行时，B 侧），取两个字段：\n\n- `dependencies`（包名 → 版本，版本是精确 pin 无 `^`）\n- `dsh.profile.bundles`（数组）\n\n判定四条：\n\n1. 只在 A 有 / 只在 B 有 → 报告差异，并注明方向。手册 §4 记的实测是：只改 B 不改 A，\n   部署后 B 会被归档包版本覆盖——所以\"B 落后于 A\"是可预期的稳态，\"B 超前于 A\"才是\n   下一次发版会踩的坑。两个方向都要报，但文案要区分。\n2. 同名不同版本 → 报告，这是最高频的失配形态。\n3. A 侧 `dependencies` 里每个 `file:./vendor/\u003cX>` 指向的目录必须存在。\n4. `dsh.profile.bundles` 的每一项必须在 `dependencies` 里声明。这是官方\n   `missingPluginDependencies`（`verify-cordis-config.ts:441-463`）的差集模式：\n   遍历引用、按包名归集引用点，`packageName in dependencies` 才算通过，否则报\n   `\u003c引用位置>: \u003cpackage> must be declared in \u003cdependencyOwner>`——**违规信息里同时带\n   引用位置与责任文件名**，这正是 §3.1 要求的那种定位。反方向不查：`dependencies` 里\n   多出来的 MCP 包（如 `@playwright/mcp`、`@astudioplus/codegraph-mcp`）本就不注册为 bundle。\n\n必须在构造期排除内核族 `@deepseek-ai/dsh*`：dev 源码模式下 profile 声明**不包含**内核族\n（手册 §5.1），拿它跟 template 比必然假红。\n\n**只比 ssid，不比 web。** `~/.dsh/profiles/web` 是 web 开发环境，依赖集与 ssid 不同\n（已核实两侧 vendor 目录内容就不同：web 多一个 `dsh-dream-skin`）。受检 profile 列表由\nmanifest 声明；声明的 profile 目录不存在时报错，不静默跳过。\n\n### 3.3 check-bom：BOM 扫描\n\n判定：文件前三字节为 `EF BB BF`。\n\n范围（都是被 node 读的文本）：`shell/profile-template/**/*.{json,yml,yaml}`、\n`~/.dsh/profiles/{ssid,web}/*.{json,yml,yaml}`、SSiD 仓库内被 node 读的 JSON。\n排除 `node_modules/`、`lib/`、`dist*/`、`build/`。\n\n必要性有实测支撑：手册 §4 记 PowerShell 5.1 的 `Set-Content -Encoding UTF8` 会写 BOM，\n`readProfileManifest` 直接崩。这类故障面大而检查成本极低。\n\n官方 `scripts/` 下没有任何 BOM 检查（`verify-translation-pairing.ts` 与 `verify-cordis-config.ts`\n都没有），这一项要自写，结构照官方风格即可：Buffer 前三字节判定 + 空语料 fail-loud。\n\n### 3.4 check-legacy-names：旧名残留\n\n**这一项的关键是划对硬/软边界。** 全仓 grep `header-unify` 命中 79 处，其中绝大多数在\n`docs/决策/**` 与 `docs/release-notes-*.md` 里，是合法的历史叙述（\"原 dsh-header-unify\"）。\n用黑名单式全仓扫描，79 条噪声会立刻摧毁这条规则的可信度——而官方门禁的通行做法正是\n**显式分类允许名单**而不是黑名单。\n\n硬残留域（应为零，且**用结构化解析而非扫描文本**）：\n\n- `shell/profile-template/package.json` 的 `dependencies` 键与 `dsh.profile.bundles` 项\n- `~/.dsh/profiles/*/package.json` 同上\n- `cordis.patch.yml` 里各条目的 `id` / `name`\n- `plugins/`、`vendor/` 下的**目录名**\n\n软残留域（合法，豁免）：`docs/决策/`、`docs/release-notes-*.md`、以及代码注释中的\n「（原 X）」叙述。豁免按路径前缀走白名单。\n\n改名表带归一化，因为旧名有多个变体（`dsh-header-unify` / `@max-null/dsh-header-unify` /\n`header-unify`），比对前去掉 scope 与分隔符：\n\n```json\n{\n  \"renames\": [{ \"from\": \"dsh-header-unify\", \"to\": \"dsh-quick-toolbar\", \"at\": \"2026-08-30\" }],\n  \"hardScopes\": [\"shell/profile-template/package.json\", \"~/.dsh/profiles/*/package.json\", \"**/cordis.patch.yml\", \"dirName\"],\n  \"exemptPathPrefixes\": [\"docs/决策/\", \"docs/release-notes-\"]\n}\n```\n\n**首个实测命中。** `shell/profile-template/vendor/dsh-quick-toolbar/verify-header-unify.cjs:77`\n是一条钉住旧包名的断言：\n\n```js\ncheck('handoff.id 为 @max-null/dsh-header-unify', global.__handoff.id === '@max-null/dsh-header-unify', global.__handoff?.id)\n```\n\n而它 `eval` 的同目录 `lib/client.js:399` 早已用新名注册（`id: \"@max-null/dsh-quick-toolbar\"`）。\n\n实测 `node verify-header-unify.cjs`：进程 exit 1，但**不是在断言处失败的**——它在更早的\n`new MutationObserver(...)`（`client.js:1276`）处就抛 `ReferenceError: MutationObserver is not defined`。\n脚本内建的假 window 停留在 0.1.0 版 client.js 所需的最小集合上，没有跟上新版，\n这条旧名断言永远到不了。\n\n所以该文件的真实状态是**废弃的回归测试**：它不再保护任何东西，留在目录里只会让\n旧名残留检查多出一条噪声（已于 2026-09-10 删除，见 §6）。它同时是 §3.1 那类漂移的\n产物——源侧的对应文件已改名 `verify-quick-toolbar.cjs` 并随新版同步，vendor 侧留下的是\n0.1.0 时代的旧脚本。这说明旧名并不总在配置声明里，也可能钉在测试断言里，\n而**只在配置里查旧名会漏掉它**。\n\n### 3.5 一条适用于所有检查的判据：别做\"变更探测器\"\n\n来源：`superpower-writing-skills` 的附带参考 `writing-good-tests.md`（DSH 生态移植版：[JasonFreeLab/dsh-superpowers](https://github.com/JasonFreeLab/dsh-superpowers)，上游为 obra/superpowers）。它讲的是**测试**，两条原则：\n\n> 1. Every test names the break it catches（每个测试都要说出它捕获的那个断裂）\n> 2. Every test exercises the real thing（每个测试都要演练真实的东西）\n\n其中一条否决很锋利：\n\n> **No change detectors.** 如果只有**有意的决策**能让测试失败——一个常量的值、**确切的措辞**、私有结构——那么它**会在重新设计时触发，却在 bug 面前睡觉**。应该测**依赖那个决策的行为**：不是 `expect(MAX_RETRIES).toBe(5)`，而是\"失败的调用被重试 5 次，且第 6 次永不发生\"。\n\n**边界声明**：门禁**不等同于**测试。门禁强制一个约定，测试捕获一个 bug——目的不同，所以上面那套判据**不直接适用于门禁**。\n\n**但有一条启发值得对照**：\n\n> **一个只会在\"有意变更\"时报警的门禁，是在追着变化跑，而不是在防真问题。**\n\n按这条逐项对照四项检查：\n\n| 检查 | 报警时的成因 | 判定 |\n|---|---|---|\n| §3.1 vendor 四份核 | 改了源头忘同步 / 改了一处漏别处——**内容是应然的契约** | 不是变更探测器 |\n| §3.2 profile vs template | 声明失配（手册 §4 实测过的坑） | 同上 |\n| §3.3 BOM 扫描 | 字节级污染导致解析崩溃，属事故 | 同上 |\n| **§3.4 旧名残留** | **改名是有意的显著变更** | **最接近变更探测器的一项** |\n\n前三项防的是\"事情坏了\"，第四项防的是\"措辞不干净\"——**所以只有第四项需要额外小心**。\n\n**它需要小心的具体形态是退化成全仓文本扫描**。一旦变成\"任何地方出现旧字符串就报警\"，它会稳定命中 `docs/决策/**` 与 `docs/release-notes-*.md` 里的合法历史叙述（实测 79 处），而**这些命中恰好都是有意保留的**——那就是变更探测器的定义。\n\n**免除办法本文件 §3.4 已经给出**：只检查\"**引用会不会失效**\"，不检查\"措辞是否干净\"——\n\n- **硬域**：profile 声明、`cordis.patch.yml` 的 `id`/`name`、目录名——旧名在这里会导致**运行失败**\n- **软域**：历史文档与注释中的「原 X」叙述——旧名在这里**只是历史**\n\n**一句话判据**：门禁应当回答\"**这样写会不会坏**\"，而不是\"**这样写是否够新**\"。\n\n## 4. 编排器 check-rules\n\n四项检查各自是独立脚本 + package.json 里一行稳定 script 名（官方约定：\n`Package scripts own public aggregate names; this runner owns their validated dependency graphs`），\n编排器只做四件事：\n\n1. 单入口 + 白名单 mode 校验。`node scripts/check-rules.mjs [all|vendor-sync|profile-sync|bom|legacy-names]`，\n   非法值抛错并回显全部合法值（`run-gates.ts:134-159` 的形状）。\n2. 门表数据化，命令与展示名分离：`{ id, label, script }`。\n3. 顺序执行 + 逐门计时 + 输出缓冲。\n4. 退出码契约：任一失败 ⇒ exit 1。\n\n失败输出按官方 `formatGateResultReason`（`run-gates.ts:1533-1539`）把三类事实全列出、互不遮蔽：\n`error` / `exit N` / `signal X`。汇总区逐条列不成功的门。\n\n`shell/package.json` 增加：\n\n```json\n\"check:rules\":        \"node scripts/check-rules.mjs\",\n\"check:vendor-sync\":  \"node scripts/check-vendor-sync.mjs\",\n\"check:profile-sync\": \"node scripts/check-profile-sync.mjs\",\n\"check:bom\":          \"node scripts/check-bom.mjs\",\n\"check:legacy-names\": \"node scripts/check-legacy-names.mjs\"\n```\n\n每个门保留独立 script，便于单独复现、单独接入钩子。规模上四个门串行秒级完成，\n不需要并发调度；门数到 10 个以上、或单轮超过两分钟，再考虑引入官方那套并发与 fail-fast。\n\n**平台条件门用构造期过滤 gate 列表，不用运行期 skip 状态**（`run-gates.ts:351-365`）：\n少一个状态维度，也少一处\"看起来跑了其实跳过了\"的假绿。\n\n## 5. 明确不抄的部分\n\n| 官方机制 | 位置 | 不抄的理由 |\n|---|---|---|\n| `needs` + `after` 双依赖与环检测 | `814-
