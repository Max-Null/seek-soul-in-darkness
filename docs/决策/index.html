d` | `2026-08-19-plugin-center-0.1.7本机重建.md` | 被改写的是「0.1.7 代码在 GitHub 远程」这一事实判断（实为五处一致 0.1.5、0.1.7 仅在另一台电脑）；其**阻塞点清单与用户手动步骤**仍有参考价值 |\n| `2026-08-19-记忆插件升级-实施.md` | `2026-08-19-记忆面板归属迁移-dsh-memory自带UI.md` | 被改写的是「记忆面板落在 dsh-ssid-panels」的**落点**（已迁至 dsh-memory 自带 UI）；本篇 0.3.0「审核与注入解耦」**主体未被推翻** |\n| `2026-08-26-三个插件加入SSiD预设.md` | `2026-08-28-v0.1.15发版决策.md` | **仅 genui 一条**的预置形态被改写（vendor 固化 → 切 npm `^0.9.6`）；dsh-context（npm）、dsh-context-doctor（vendor 固化）**两条处置仍有效** |\n| `2026-08-28-session-manager加入预制.md` | `2026-08-29-SSiD升级执行记录.md` | 被改写的是接入方式（vendor tgz 0.2.2 → npm 0.4.1）；**「加入预制」这一决策本身仍有效** |\n\n## C. 需要你判的部分\n\nA 组 5 篇我建议归档（`状态：已归档`），依据是\"整篇结论已被推翻\"。\nB 组 4 篇我**不建议**整篇归档，但建议在文件头标注「部分结论已被 X 取代」并指向新篇——这样读者不会被误导，也不会丢信息。\n\n**\"归档\"在本仓库该用什么形式？** 三个选项：\n\n1. **只加状态标记**（`> 状态：已归档（2026-09-12，被 X 取代）`）—— 不改路径，与 #7 的零侵入原则一致，**推荐**\n2. 加标记 + 在正文顶部插一段「本篇已被 X 取代」—— 更醒目，但要动正文\n3. 移到 `docs/决策/归档/` 子目录 —— 会破坏既有互引路径，#7 里已论证过不划算\n\n## D. 附：本次审计的状态分布（110 篇）\n\n| 推断状态 | 篇数 |\n|---|---|\n| 已完成 | 38 |\n| 记录 | 31 |\n| 已决策 | 21 |\n| 进行中 | 20 |\n\n（该分布为「读全文后推断」的结果；原始 43 篇有状态头、67 篇无。补充方案见 #7 遗留项。）\n"},{"file":"2026-09-12-决策记录知识库化.md","date":"2026-09-12","slug":"决策记录知识库化","title":"决策记录知识库化","statusRaw":"已完成","statusKind":"已完成","owner":"MaxNull","purpose":null,"dateInBody":"2026-09-12","dateNote":null,"tags":["#7"],"summary":"docs/决策/ 累积了 110 篇记录，全部符合 YYYY-MM-DD-标题.md 命名，但没有统一元数据，只能靠文件名和记忆定位。要知道「哪些决策还在进行中」「某插件相关改过哪些决定」，只能全文翻找。 同时，待办 7 原案要求「目录即状态机」——把 docs/决策/ 重组为 {proposed,implemented,rejected,archived} 四个子目录。但实测发现不可行/不划算：","bytes":7928,"lines":111,"body":"# 决策记录知识库化\n\n> 日期：2026-09-12\n> 状态：已完成\n> 决策人：MaxNull\n\n> 统计口径：本文出现的「110 篇」含**本文自身**（构建器把它也纳入索引）。数字随重建变化，以构建器输出为准。\n> 本篇是待办 #7「Agent Notes 状态机」四段模板（Problem → Decision → Alternatives considered → Consequences）的**首个应用范例**；状态词沿用索引归纳出的「已完成」，与四状态机的 `implemented` 对应。\n\n## Problem\n\n`docs/决策/` 累积了 110 篇记录，全部符合 `YYYY-MM-DD-标题.md` 命名，但**没有统一元数据**，只能靠文件名和记忆定位。要知道「哪些决策还在进行中」「某插件相关改过哪些决定」，只能全文翻找。\n\n同时，待办 #7 原案要求「目录即状态机」——把 `docs/决策/` 重组为 `{proposed,implemented,rejected,archived}` 四个子目录。**但实测发现不可行/不划算**：\n\n- 43/110 篇已有**非正式头部**（`- 状态：x` / `> 状态：x` / 裸 `状态：x` 三种写法并存），**67/110 完全没有**\n- 按状态分目录要**移动 110 个历史文件**，破坏既有引用路径（手册、决策记录之间大量互引）\n- 且「状态」是**会变的**：一篇 `implemented` 将来会 `archived`，每次状态流转都要**再移动一次文件**，git 历史会碎\n\n## Decision\n\n**用「元数据投影」替代「物理目录重组」，且不改动任何一个历史文件。**\n\n1. **零侵入解析**：只读 `.md`，从文件名取日期、从正文头部取状态/决策人、从正文首标题取标题。解析不到的诚实标为「未标注」并在报告里逐个点名——**绝不批量补写**。\n2. **状态「原文 + 类别」双字段**：保留 `statusRaw`（如 `✅ 已完成（v0.1.4 已…）`）与归纳出的 `statusKind`（进行中/已决策/已完成/记录/未标注）。归一的规则表**顺序敏感**：先判「进行中」，否则「实施完成，待 npm publish」会被误归为已完成。\n3. **自包含单页**：内联**原始 markdown**（不预渲染），浏览器端用内置极简渲染器转换；全文内联所以搜索是纯本地、零外部请求。\n4. **惯例**：新增决策记录后跑一次 `node shell/scripts/build-decision-index.mjs` 重建索引。知识库是**只读投影**——改元数据要改 `.md` 原文。\n\n## Alternatives considered\n\n| 备选 | 否决理由 |\n|---|---|\n| **YAML frontmatter 批量注入**（最初方案） | 67/110 篇没有状态头，批量填 = **替历史做 67 个未经查证的判断**，违反「断言必须有据」。改为只解析不补写。 |\n| **物理目录重组为四状态目录**（待办 #7 原案） | 要移动 110 个历史文件、破坏既有互引路径；且状态会流转，每流转一次就要再移动，git 历史碎片化。用户已改向「元数据 + 生成 HTML」。 |\n| **预渲染 HTML 后内联** | 体积翻倍，且正文失去「原文可搜索」这一性质。保留原始 markdown 更省也更可检索。 |\n| **状态归一为四状态枚举** | 会吃掉 `已完成（v0.1.4 已发布）` 这类括号里的细节。改为双字段：原文忠实保留、类别供筛选。 |\n| **只出 JSON 或只出 HTML** | 两者用途不同：JSON 供程序消费/二次加工，HTML 供人浏览。因此两者都生成，但 `decisions.json` **不入库**（可由脚本重建），`index.html` 入库。 |\n\n## Consequences\n\n**交付物**：\n\n| 文件 | 说明 |\n|---|---|\n| `shell/scripts/build-decision-index.mjs` | 构建器，零依赖（仅 node 内置模块） |\n| `docs/决策/index.html` | 自包含单页（约 1.1 MB），可直接双击打开 |\n| `docs/决策/decisions.json` | 中间产物，不入 git |\n\n**实测覆盖率**：\n\n| 项 | 覆盖 | 来源 |\n|---|---|---|\n| 日期 | **110/110** | 文件名前缀 |\n| 标题 | 109/110 | 正文 `#` 标题（1 篇无，回退文件名） |\n| 状态 | 43/110 | 正文头部 |\n| 标签 | 92/110 | 字面提取（包名/插件名/issue 号） |\n\n状态分布：进行中 11、已决策 5、已完成 24、记录 3、未标注 67。渲染规模：含表格 80 篇、含代码块 37 篇。\n\n**唯一无反例的维度是日期**（110/110），所以时间线是知识库最可靠的组织轴。\n\n**遗留**：\n\n- 67 篇「未标注」需要**人工逐篇补状态**；这是内容工作，脚本替代不了，构建器会持续点名。\n- `2026-09-10-DSH官方Gates拆解原始报告-F-run-gates编排.md` 无正文 `#` 标题，暂用文件名回退。\n- 1/110 篇（6-09-10-DSH过程决策精读-判断标准总表.md）是**纯表格型文档**，无散文首段，摘要只能取到分类名；强行为它生成散文摘要会失真，故接受。\n- 待办 #7 的其余要素（四状态目录、归档一批）**未做**——四状态目录已被本决策替代；「归档现有决策文档一批」仍是待办。\n\n## 实施记录：过程中修掉的三个真 bug\n\n均为本次引入，全部由验证环节发现。\n\n### 1. 状态抓取强制要求行首前缀 → 19 个假阴性\n\n`grab()` 初版正则要求 `状态：` 前必须有 `-`/`*`/`>`，实测存在**裸写法**（行首直接 `状态：`）。\n症状：状态覆盖只有 23/110，而独立探测是 42/109。**差值 19，且当时「未标注 86 = 67 + 19」精确吻合**，据此定位。\n\n### 2. 同一行串联多字段 → 又漏 1 个\n\n```markdown\n> 日期：2026-09-10 · 状态：方案 B 已选定，可行性验证进行中\n```\n\n`状态：` 不在行首。修复后覆盖 23 → 41 → **42**，与独立探测精确相等。\n副作用修正：`grab('日期')` 原会把整行后面全吃掉并污染 `dateNote`；正文里 `2026-08-29（晚）` 这类**带补充说明**的日期被误报为「与文件名不一致」——按前 10 字符比对后归零。\n\n### 3. 渲染器死循环（最严重）\n\n极简 markdown 渲染器的段落分支：一个**以 `|` 开头但不构成表格**的行，会被表格分支跳过、又被段落分支的排除正则 `\\|` 挡住 → `while` 不执行、`i` 不推进 → **无限循环，浏览器会卡死页面**。\n症状：验证器跑全部记录时 **120 s 超时**；修复后 **22 ms**。\n\n修复：段落分支加 `if(i===guard){p.push(l);i++;}` 兜底推进，主循环加 `steps++\u003cL.length*4+64` 迭代上限。\n\n## 验证（三层，共 37 项断言）\n\n1. **数据层报告**：覆盖率 + 缺口点名（无标题文件逐个列出，不只给一个数字）\n2. **生成物验证**（`shell/scripts/verify-decision-index.mjs`，14 项）：内联 JS 语法检查、DATA 可 JSON.parse 且篇数 == 目录实际 `.md` 数、JS 引用的 11 个 DOM id 全部存在、全部记录渲染非空、渲染输出中未转义 `\u003cscript` 为 0 次、渲染耗时上限\n3. **行为验证**（`shell/scripts/verify-decision-ui.mjs`，23 项）：迷你 DOM shim 真跑页面逻辑，交叉断言「点击筛选筛出条数 == 按同一数据现算的期望条数」\n\n两个验证器的期望值**全部动态锚定**到目录实际文件数，不硬编码篇数——否则每新增一篇记录就要改验证器。\n\n**两条教训**：\n\n- **「写出成功」不等于「能用」**：只看构建器输出会漏掉死循环这个致命问题；生成物必须被独立验证。\n- **验证器自己也会骗人**：本轮验证器先后误报 **3 次**，全部是验证器侧的问题，不是生成物的问题：\n  1. 用 `;\\n` 非贪婪正则提取内联 DATA，但生成物里 `var DATA={…};(function(){` **没有换行** → 把后续代码当成了 JSON 尾部；\n  2. 单独 eval `md()` 时漏了它依赖的同作用域函数 `esc()` → `ReferenceError`；\n  3. shim 的 `history.replaceState` 写成空函数 → 「深链是否写入」这条断言**恒为假**。\n\n  出现误报要先证明「是生成物错还是验证器错」，不能默认生成物有问题。\n"},{"file":"2026-09-10-官方桌面壳评估与方案B决策.md","date":"2026-09-10","slug":"官方桌面壳评估与方案B决策","title":"官方桌面壳（apps/desktop）评估与方案 B 决策","statusRaw":"方案 B 已选定，可行性验证进行中","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-09-10","dateNote":null,"tags":["@deepseek-ai/dsh-desktop","@deepseek-ai/dsh-api-remotes","@deepseek-ai/dsh-client-connection","dsh-v0","dsh-observations","dsh-desktop","dsh-app","dsh-memory","dsh-capture","dsh-draft-polish","dsh-ssid-achievements","dsh-chat-rail"],"summary":"用户判断：自建桌面壳（SSiD shell/）持续踩坑（部署覆盖丢用户层、更新回滚链、运行时供给），而官方已推出 Electron 桌面壳，其底座值得借用。目标：以官方壳为底座，改成 SSiD 的样子。","bytes":22442,"lines":299,"body":"# 官方桌面壳（apps/desktop）评估与方案 B 决策\n\n> 日期：2026-09-10 · 状态：方案 B 已选定，可行性验证进行中\n> 证据库：`DSHfork` @ `dsh-v0.1.5-alpha.2`（独立观察站，origin=官方主库）\n> 证据来源：官方源码 / README、npm registry、GitHub Releases API、CDP 对运行中桌面端的实测\n> 相关文档：`dsh-observations/2026-09-09-0.1.5-alpha.2-vs-0.1.2-rc.1.md`\n\n## 1. 背景\n\n用户判断：自建桌面壳（SSiD `shell/`）持续踩坑（部署覆盖丢用户层、更新回滚链、运行时供给），而官方已推出 Electron 桌面壳，其底座值得借用。目标：**以官方壳为底座，改成 SSiD 的样子**。\n\n## 2. 官方壳是什么（事实盘点）\n\n- **位置**：`apps/desktop`（`@deepseek-ai/dsh-desktop`，0.1.5-alpha.2）+ 私有 `apps/desktop-host`\n- **分发状态（2026-09-10 实测）**：npm `@deepseek-ai/dsh-desktop` → 404；GitHub Release `dsh-v0.1.5-alpha.2` 的 `assets` 为空 → **官方尚未发布任何安装包，只能从源码构建**\n- **许可**：仓库根 `LICENSE` = **MIT**（可修改、分发、商用，保留版权声明）\n- **架构要点**（摘自 `apps/desktop/README.md`）：\n\n| 机制 | 官方设计 |\n|---|---|\n| 运行时 | Electron 自带上游 Node.js（打包时下载 24.17.0）+ 自带 pnpm；不用系统 Node/pnpm |\n| 传输 | **不开监听端口**：`dsh-app://` 承载 Web 资产与 Fetch 流量，帧化字节管道承载请求/响应块，Node IPC 只传生命周期控制 |\n| Profile | 独占 `$DSH_HOME/profiles/desktop`；CLI 不能 boot 或修改它 |\n| 与 CLI 的数据关系 | **共享** sessions / settings / credentials / workspaces / storage；**不共享**可执行包、插件激活、lockfile、node_modules |\n| 包来源 | 自带离线 seed store（macOS 分 16 个未压缩 tar 分片）+ 本地打包的第一方 tarball；插件是普通 npm 包，走固定 `https://registry.npmjs.org/` |\n| 安装/变更 | staging → 启动完整 backend 健康检查 → 通过才替换 active profile；journal + 一个回滚 profile |\n| 更新 | electron-updater + blockmap 差分；Electron 壳与 dsh 版本强绑定为一个签名更新单元 |\n| 签名 | macOS Developer ID + 公证（逐个签 Mach-O CAS 对象、重写 pnpm hash）；Windows EV 证书 + SignTool + RFC 3161 时间戳 |\n| 单实例 | Electron `requestSingleInstanceLock()`（进程生命周期锁） |\n| 已知禁用 | Web 的「Open In…」在 Desktop 被禁用，因为其 host 插件需要 HTTP 路由，而 **Desktop 不提供 `webServer`** |\n\n## 3. 关键约束\n\n1. **DSH 主库只引用不改**（工作区铁律）→ 所有改造必须在 fork 或 SSiD 仓库内完成。\n2. **官方壳不提供 `webServer`** → 依赖 HTTP 路由的 host 插件在官方壳内不可用。\n3. **官方壳与 CLI 共享 `$DSH_HOME` 的会话数据** → 与运行中的 web 宿主并发访问同一会话根。\n4. **官方壳仍在 alpha**（0.1.5-alpha.1 才引入右侧栏；两周内两个版本）→ 直接依赖其 API 有跟进成本。\n\n## 4. 方案对比\n\n| 方案 | 做法 | 拿到什么 | 代价 | 量级 |\n|---|---|---|---|---|\n| A 品牌层 | 在 fork 里改官方壳外观/文案/图标/启动屏，装 @max-null 插件 | 官方工程能力 + SSiD 外观 | 丢掉依赖 HTTP 路由的插件 | 小 |\n| **B 官方壳当底座** | A + 预装 @max-null 插件 + 适配 host↔client 通道 | 外观 + 工程能力 | 需迁移通信层；跟进官方升级 | 中 |\n| C SSiD 吸官方机制 | 不换壳，搬离线 seed / staging 健康检查 / 回滚 / 签名链路 | 插件生态完整 + 工程能力 | 自己维护；拿不到官方现成打包流程 | 中 |\n| D vendored fork | 复制 apps/desktop 进 SSiD 仓改 | 完全可控 | 与官方迭代脱节 | 大 |\n\n**决策：方案 B**（用户拍板）。理由：官方壳的运行时供给与部署回滚链正是 SSiD 当前痛点所在。\n\n## 5. 方案 B 逐项算账\n\n| 官方机制 | 价值 | 注意 / 代价 |\n|---|---|---|\n| staging + 健康检查 + 回滚 | **最高**（正对 SSiD 部署覆盖丢用户层、失败崩溃链） | shell 侧逻辑，可独立搬 |\n| 自带 Node/pnpm | 高（消除系统环境变量与 pnpm 版本漂移） | 安装包变大；Node 版本跟随官方 |\n| 离线 seed 分片 | 高（离线安装 + 差分更新） | macOS 流程重：逐个签 Mach-O CAS 对象、重写 pnpm hash |\n| electron-updater + 签名 | 中高（省自写 updater） | 证书/公证账号仍是自己的 |\n| 单实例锁 | 中（防双实例抢 profile） | 需与 SSiD 多实例/会话根隔离语义对齐 |\n| 帧化字节管道（无端口） | **有争议**：无端口冲突、无认证/CORS 暴露面 | 插件 HTTP 路由失效 |\n\n**唯一需要拍板的矛盾**：要「零端口」就不能保留依赖 HTTP 路由的插件；若补回环 HTTP 服务，「零端口」名存实亡。\n**建议**：取「不对外监听」的实质——绑 `127.0.0.1` + 随机端口 + 一次性 token，插件路由可用、局域网不可达。真正值钱的是 staging/回滚与自带运行时，不是绝对零端口。\n\n## 6. 关键发现：我们的插件与官方壳的真实距离（实测）\n\n**教训（重要）**：`package.json` 的 dependencies/peerDependencies **不是** DSH 插件的服务依赖真相——服务依赖用 cordis 的 `inject` 声明。前一轮据此得出的\"无插件依赖 webserver\"结论是**错的**。\n\n实测（grep `@max-null/*` 的 `src/`）：\n\n| 插件 | 依赖形态 | 官方壳（webServer 已被禁用）结果 |\n|---|---|---|\n| `dsh-memory`（host 半） | 静态必需：`inject = ['storage','systemPrompt','tools','webServer','webRuntime']` | **静默不激活**（cordis 语义已实测，见 §8.1） |\n| `dsh-capture` | 静态必需：`inject = ['webServer','webRuntime']` | 静默不激活 |\n| `dsh-draft-polish` | 静态必需：`inject = ['webServer','sessionQuery','llm','loader']` | 静默不激活 |\n| `dsh-ssid-achievements` | 静态必需：`inject = ['tools','webServer','webRuntime']` | 静默不激活 |\n| `dsh-chat-rail` | 动态可选：`ctx.inject(['webServer'], …)` | 激活，路由相关功能降级 |\n| `dsh-quick-toolbar` | 动态可选：`ctx.inject(['webServer','connection'], …)` | 激活，同上 |\n| `dsh-memory` → betterSidebar | 动态可选：`root.inject(['betterSidebar'], …)` | 优雅降级（面板入口不注册） |\n\n**两条替代通道（详见 §8.3）**：① 轻量——`ctx.connection.fetch.register({ path, methods, requestBody, fetch })`（carrier-neutral 精确路由，走 `/api`，Web 载体与 Electron shell 载体都分发同一个 handler）；② 正规——`@deepseek-ai/dsh-api-remotes`（Typert 类型化 RPC + API Gateway）。**不需要自建 webServer 桥**。\n\n**关于 better-sidebar**：它是第三方插件（`omdsh-dev/DSH-better-sidebar`），SSiD 只是**预制**了它，**不是自有资产**。它能否在官方壳里跑是它自己的适配问题，不应绑住 SSiD 的架构决策。\n\n## 7. 已实测的官方壳行为（2026-09-10，CDP + 源码）\n\n1. **`DSH_HOME` 未隔离**：`dev.ts` 写的是 `process.env.DSH_HOME ?? \u003cDSHfork 内部路径>`，而 shell 里已有 `DSH_HOME=C:\\Users\\MaxNull\\.dsh`，隔离默认值被短路 → 桌面端直接使用主 home，并写入了 `storages/`、`workspace.json`、`session_projcache/`。\n2. **会话视图不同步**：`desktop-host` 内无任何 watch/poll/subscribe（grep 为空）→ 桌面端只读到启动时的快照，web 侧后续写入不反映。\n3. **导航条被容器查询隐藏**：`TurnNavigator.module.css` 有 `@container (max-width: 900px) { .slot { display: none } }`，`ChatView.module.css:20` 有 `container-type: inline-size`（规则确实生效）。窗口 1264px + 右侧栏 301px → 聊天区约 678px → 展开后导航条实测 `w=0`（隐藏），**不是被遮挡**；`elementFromPoint` 命中导航条自身（`hitIsNav=true`）。过渡动画期间两者不同源，可能出现短暂重叠（未实测到）。\n4. **官方右侧栏 API 面**：`ctx.sidebarRightTabs.register({ id, kind, patterns?, priority?, canOpen?, title, guide? })` + 主体注册到 keyed slot `sidebar.right.pane.tab`；优先级档 `extension > builtin > fallback`，且**扩展可接管内建**（内建与扩展各占一格，只渲染生效的那个）；控制器 `openResource/openTab/focus/split/float/dock/_undo/_redo`。\n5. **官方桌面端无市场/发现入口**：只有已安装插件的 list/install/remove/update，来源固定为 npm registry。\n\n## 8. 验证结果（2026-09-10 实测）\n\n### 8.1 cordis `inject` 语义（最小实验：`DSHfork/.tmp-cordis-inject-probe.mjs`）\n\n| 用例 | 结果 |\n|---|---|\n| 静态 `inject: ['webServer']`，服务从未提供 | `pending` —— **插件静默不激活，无报错、无警告** |\n| 静态 inject，注册后再提供服务 | `pending` → `applied` —— 服务出现后自动激活 |\n| 静态 inject，注册时服务已存在 | `applied` |\n| 动态 `ctx.inject(['webServer'], cb)`，服务缺失 | `not-run` —— 回调不执行（安全降级） |\n| `inject: { required: [], optional: ['webServer'] }` | `pending` —— 该写法在 cordis 4.0.0-rc.7 下**不生效** |\n\n**结论**：静态 `inject` 缺失服务 → 插件**静默失效**（功能消失且无任何提示，最危险的一种）；动态 `ctx.inject` → 优雅降级。这解释了为什么插件在换壳后\"看起来装上了却没反应\"。\n\n### 8.2 官方桌面端在配置层面禁用了 webServer\n\n`apps/desktop-host/config/desktop.cordis.patch.yml` 开头即：\n\n```\n# Electron reuses the browser composition without its network and browser-launch rows.\n- id: web-startup\n  disabled: true\n- id: webserver\n  disabled: true\n- id: web-runtime\n  disabled: true\n- id: client-hmr\n  disabled: true\n- id: open-in-app\n  disabled: true\n- id: ui-open-in-app\n  disabled: true\n- id: directory-picker\n  disabled: true\n```\n\n→ 与 README 的「Desktop does not provide a `webServer`」一致，且是**配置层面的硬禁用**。我们的 4 个静态依赖 `webServer` + `webRuntime` 的插件在官方壳里会静默失效。\n\n### 8.3 官方给了替代通道（不必自建 webServer 桥）\n\n`@deepseek-ai/dsh-client-connection` 提供 **carrier-neutral** 的精确路由注册：\n\n```\nctx.connection.fetch.register({ path, methods, requestBody, fetch })  // 返回 disposer\n```\n\n- Web 载体（浏览器 HTTP）与 shell 载体（Electron IPC 桥）**分发同一个 shared fetch handler**\n- `desktop-host` 的 fetch 桥把 `/api` 前缀请求交给 `connection.createSharedFetchHandler('/api')`；其余走 `assetHandler`（只处理 `/plugins/` 与静态资源）\n- 路径为**精确匹配**（`fetchRoutes.get(pathname)`），未认领请求返回 404\n\n→ 插件把 `ctx.webServer.register(...)` 换成 `ctx.connection.fetch.register(...)`（路径在 `/api` 下）即可在官方壳内工作；更重的场景再迁 Typert remote。\n\n### 8.4 剩余待验证\n\n- [ ] `dsh-chat-rail` / `dsh-quick-toolbar`（动态可选）在官方壳内的实际挂载与降级表现\n- [ ] 4 个静态插件改注入声明 + 换路由注册后的端到端验证\n- [ ] 侧边栏类插件迁移到 `ctx.sidebarRightTabs` 的工作量\n- [ ] 壳信号差异：`__SSID_SHELL__` → 官方注入 `dsh-desktop-mode` / `__DSH_DESKTOP_FILE_PATH__`\n\n## 9. 实施策略（若验证通过）\n\n1. **不要整体复制官方壳**：保持目录结构对齐 + 定制点收敛为补丁面（品牌资源、i18n 词典、desktop profile 的 seed 清单、通信通道适配）。\n2. **分阶段取**：第一刀只切 `staging → 健康检查 → 回滚` + 自带 Node/pnpm（不碰端口语义，收益立即可验证）；第二刀再决定是否换掉帧化管道。\n3. **跟踪策略**：定期 merge 官方 master，保持目录与命名对齐，冲突面最小化。\n\n## 10. 任务执行记录（2026-09-10）\n\n### 10.1 任务①：dsh-capture 改造为 `connection.fetch.register`（已完成）\n\n**改动**（`max-null-plugins/dsh-capture`）：\n\n- `src/index.ts`：`inject` 从 `['webServer','webRuntime']` → `['connection']`；三条路由（get/set/trigger）从 `ctx.webServer.register({ kind:'prefix', path:'/ssid/api/screenshot' })` 改为 `ctx.connection.fetch.register({ path:'/api/ssid/screenshot/\u003cmethod>', methods:['POST'], requestBody:'buffered', fetch })`；handler 从 node:http `(req,res)` 改为 Fetch `(request) => Response`；删除自建 Host/Origin fence（carrier 已统一应用 trust/auth）\n- `src/client/api.ts`：请求路径 `/ssid/api/screenshot/\u003cm>` → `/api/ssid/screenshot/\u003cm>`\n\n**验证结果**：\n\n| 检查 | 结果 |\n|---|---|\n| typecheck | ✅ 通过（0 错误） |\n| 无 webServer 环境下插件激活 | ✅ `webServer present? -> false`，插件仍正常加载 |\n| GET 路由 | ✅ 200 + 正确配置体（`shellAvailable:false`） |\n| TRIGGER 路由（无壳） | ✅ 503 + `shell-unavailable` |\n| 未知方法 / 错误动词 | ✅ 404 |\n\n**环境备注**：`max-null-plugins/*/node_modules` 是 Junction 指向 `dsh-chat-rail/node_modules`（全家族共享一份依赖）；补链 `@deepseek-ai/dsh-client-connection`（指向 DSHfork 的 0.1.5-alpha.2 构建产物）后 typecheck 通过。共享依赖里没有 vitest，故单测未跑。\n\n### 10.2 任务②：chat-rail / quick-toolbar 在官方壳的挂载分析（已完成）\n\n| 插件 | 静态 inject | 依赖 webServer 的功能 | 官方壳（无 webServer）结论 |\n|---|---|---|---|\n| `dsh-chat-rail` | **无** | 仅 `favoritesRouteDefinition`（收藏路由） | 激活；轮次导航（走 `sessionProjections`）正常，收藏功能降级 |\n| `dsh-quick-toolbar` | **无** | `adapters` / `state` / `authUrl` 三条路由（**核心**） | 激活但**功能整体失效**（回调不执行 → `wsSvc` 未设置 → 路由未注册） |\n\n**结论**：动态 `ctx.inject` 让两个插件都能激活，但 quick-toolbar 的降级是\"静默失效\"——需要与 capture 同款改造（`connection.fetch.register`）。\n\n## 11. 双轨兼容结论与可反馈项（2026-09-10）\n\n### 11.1 `connection` 在 web 端同样存在 → 改造是单向的\n\n`packages/bundle/web-app/cordis.patch.yml` 含 connection 行：\n\n```\n# Owns both ends of the web transport: node half binds the gateway to the\n# webserver under /api; browser half is the fetch/SSE client.\n- id: connection\n  name: '@deepseek-ai/dsh-client-connection'\n  inject: [webRuntime]\n  config:\n    trustedHosts: !!js ctx.webRuntime.trustedHosts\n```\n\n即：**web 载体下 connection 把路由挂到 webserver 的 `/api`；桌面载体下由 shell 直接分发**（`desktop.cordis.patch.yml` 保留 connection、只禁 webserver/web-runtime）。因此用 `ctx.connection.fetch.register` 注册的路由**两端都可达**——从 webServer 迁到 connection 是**单向迁移**（改一次，两端都能跑），不是二选一。\n\n唯一共同约束：路径必须在 `/api` 之下（两种载体都满足）。\n\n### 11.2 可反馈给官方：把 desktop-host 的分发改成\"先查路由表\"\n\n现状（`apps/desktop-host/src/index.ts`）：\n\n```\npathname.startsWith('/api') ? await api.fetch(request) : await assets.fetch(request)\n```\n\n即先按前缀筛、再查路由表。若改为**先查 connection 路由表、未命中再走静态资源**，插件就能注册任意路径（包括 webServer 风格的 `/ssid/api/...`），实现\"可变轨\"。\n\n**边界**：这只解决路径问题；handler 形态（node:http `(req,res)` → Fetch `(request)=>Response`）与 prefix → 精确匹配仍需插件侧改造。真正的零改造需要官方维护一层完整的 `webServer` 兼容垫片，那是另一个量级的维护负担。官方是否愿意改未知，但**我们自己的 fork 落地方案 B 时顺手改这几行是低成本收益**。\n\n## 12. 适配规范草案（待适配完成后升格为《SSiD开发手册》§9 正式规范）\n\n> **状态：草案 / 待验证。**\n> 升格条件：① 在一个 rc.1 环境（SSiD dev 或 web profile）实测通过；② 至少一个插件（`dsh-capture` 已完成改造）在两种载体上跑通。\n> 升格去向：`docs/SSiD开发手册.md` §9「插件开发与测试规范」新增小节「host 侧通信通道」。\n\n### 12.1 规范条文（草案）\n\n1. **host 侧新增 HTTP 端点一律用 `ctx.connection.fetch.register`**，不用 `ctx.webServer.register`。\n   理由：`connection` 是 carrier-neutral（web 载体把路由挂到 webserver 的 `/api`；Electron shell 载体由帧化管道直接分发），而 `webServer` 只在 web 载体存在，官方桌面端已在配置层禁用。\n2. **路由路径必须在 `/api` 之下**（如 `/api/ssid/\u003cplugin>/\u003cmethod>`）。两种载体的分发都只把 `/api` 前缀交给 connection 路由表。\n3. **精确路径匹配**：一个 `kind: 'prefix'` 路由要拆成若干条精确路径（未命中即 404）。\n4. **handler 用标准 Fetch API**：`(request: Request) => Promise\u003cResponse>`，不再用 node:http 的 `(req, res)`。\n5. **不要自建 Host/Origin fence**：carrier 在 handler 运行前已应用信任与鉴权策略。\n6. **注入声明用 `inject: ['connection']`**；避免静态 `inject` 里出现 `webServer` / `webRuntime`——静态声明缺失服务会让插件**静默不激活**。\n7. **客户端请求路径与 host 注册路径保持一致**（同为 `/api/...`）。\n\n### 12.2 升格前置（待验证）\n\n- [x] **已实测（2026-09-12）：rc.1 内核不支持 POST** —— 本机三处内核（assistant-probe `0.1.1-rc.2`、ssid 与 rc1-clean `0.1.2-rc.1`）的 `dsh-client-connection` 均为 `GET`＋`HEAD`，无 `requestBody`。→ **该前置不成立**；§12 已于 2026-09-12 升格为手册 §9 小节「host 侧通信通道」，但**附加版本边界**：规范自 `0.1.5-rc.1` 起适用，不要据此在 `0.1.2-rc.1` 上改插件。\n- [ ] `dsh-capture` 改造在 SSiD dev（rc.1）实测：截图按钮 → trigger 路由 → 壳层浮层 —— **阻塞于上一条**，需先升级内核到 `0.1.5+`。\n- [ ] 其余 5 个涉及 webServer 的插件按本规范改造后的回归 —— 同上，待升级后推进。\n- [ ] **「`0.1.5-rc.1` 的 connection 与 alpha.2 零改动」待独立复核** —— 本机未安装该版本，本次只能确认 alpha.2 侧（源码 + 行为断言），rc.1 侧仍系断言。\n\n## 13. 暂缓推进决策（2026-09-10 拍板）\n\n### 13.1 rc.1 与 0.1.5 的 connection 断代（实测）\n\n| | rc.1（当前 SSiD / web 内核） | 0.1.5-alpha.2 |\n|---|---|---|\n| `ConnectionFetchMethod` | `'GET' \\| 'HEAD'` | `'GET' \\| 'HEAD' \\| 'POST'` |\n| `ConnectionFetchRoute.requestBody` | 无 | 有（buffered / streaming） |\n| connection 的 `inject` | `['webServer','credentials']` | `['credentials']` |\n| 路由实现 | `ctx.webServer.register(route)` | carrier 直接分发 |\n| 无 webServer 时 | connection 也不激活 | connection 仍可用 |\n| 本质 | webServer 的包装层 | carrier-neutral |\n\n**结论**：`connection.fetch.register` 的 carrier-neutral 语义是 **0.1.5 才引入的**；rc.1 上它只是 webServer 的语义包装，且不支持 POST。连锁影响：\n\n- 本次 `dsh-capture` 改造（POST + `requestBody`）**在 rc.1 上不可用**，不能同步进 SSiD dev；\n- 方案 B（官方壳做底座）的**前提是内核升到 0.1.5+**；\n- §12 规范草案需加版本分界；升格前置 ① 判定为**不成立**。\n\n### 13.2 决策：暂缓推进，静观其变\n\n**理由**：DSH 主库当前一天一个版本（0.1.3-alpha.2 → 0.1.5-alpha.1 → 0.1.5-alpha.2 仅两天），内核 API 仍在快速变动；在晃动的地基上推进方案 B 会反复返工。用户将于周末集中过一遍新 DSH，并留 2–3 天观察主库新动静。\n\n**动作**：\n\n1. 本次 `dsh-capture` 改造封存到独立分支 `feat/connection-fetch-routes`（不合入 main、不同步进 SSiD、不发版）；\n2. 本文档 §1–§13 作为备查基线（背景 / 事实 / 方案 / 设计 / 实测 / 规范草案 / 决策）；\n3. 待内核稳定或升级到 0.1.5+ 后，再按 §12 规范推进其余 5 个涉及 webServer 的插件。\n\n**重启条件**（任一满足即可重新评估）：\n\n- SSiD 内核升到 0.1.5+（或官方发布 rc / beta）；\n- 官方桌面端发布安装包（当前 npm 无包、GitHub Release 无资产）；\n- 官方为 `webServer` → `connection` 提供兼容 shim 或迁移指南。\n\n### 13.3 状态更新（2026-09-10 晚）与周末计划\n\n**重启条件①已满足**：`dsh-v0.1.5-rc.1` 于 09-10 09:36 发布，npm `latest` 已从 `0.1.2-rc.1` **跳到 `0.1.5-rc.1`**（`next` 同）。rc.1 相对 alpha.2 的 connection 与桌面端**零改动**，因此 §12 规范草案的技术前提成立。详见 `dsh-observations/2026-09-10-0.1.5-rc.1-vs-0.1.5-alpha.2.md`。\n\n**重启条件②仍待满足**：官方桌面端仍未发布（npm 无 `@deepseek-ai/dsh-desktop`、GitHub Release 的 assets 为空）。\n\n**周末计划（用户 2026-09-10 定：进行「大改造」）**——动手前的前置清单（**跨系列升级的破坏性变更与核对项另见 `2026-09-10-升级前置差异清单-0.1.2-rc.1到0.1.5-rc.1.md`**）：\n\n1. 决定 SSiD 内核升级目标版本（0.1.5-rc.1 已是 npm `latest`，可直接安装试验）\n2. 升级后逐项复核 §12 规范条文（尤其 `connection` 在 rc.1 的实际行为——rc.1 与 alpha.2 的 connection 源码零差异，但仍需实测确认）\n3. 启用封存分支 `max-null-plugins/dsh-capture` → `feat/connection-fetch-routes`（commit `37fa8e9`）\n4. 按 §12 推进其余涉 webServer 的插件：`dsh-memory`、`dsh-draft-polish`、`dsh-ssid-achievements`（静态必需）+ `dsh-quick-toolbar`（动态但核心功能依赖）+ `dsh-chat-rail`（动态、非核心，可选）\n5. 侧边栏类插件迁移到 `ctx.sidebarRightTabs` 的工作量评估\n6. 方案 B 落地策略复检（§9：不整体复制官方壳、定制点收敛为补丁面、分阶段取 staging/回滚）\n\n## 附：本次实测环境\n\n- 观察库：`H:\\MaxNull\\WorkStation\\DSHfork` @ `dsh-v0.1.5-alpha.2`（detached HEAD）\n- 启动方式：`pnpm install`（44s，缓存命中 1187/1266）→ `pnpm run dev:desktop`（全量构建约 6 分钟，Electron 二进制自动下载）\n- 调试端口：9222（renderer）/ 9229（main）/ 9230（host）\n- 当前状态：桌面端运行中，右侧栏展开，`DSH_HOME=C:\\Users\\MaxNull\\.dsh`（未隔离）\n"},{"file":"2026-09-10-升级前置差异清单-0.1.2-rc.1到0.1.5-rc.1.md","date":"2026-09-10","slug":"升级前置差异清单-0.1.2-rc.1到0.1.5-rc.1","title":"升级前置差异清单：0.1.2-rc.1 → 0.1.5-rc.1（2026-09-10 整理）","statusRaw":"素材已核对，标注「待查」的项尚未在本地验证。","statusKind":"记录","owner":null,"purpose":"周末「大改造」的升级前核对清单。","dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh","dsh-observations","dsh-ssid-panels","ssid-double-star","dsh-persona","dsh-guardian","dsh-node-appearance","dsh-v0"],"summary":"与上次升级（alpha.2 → rc.1，同系列内）不同，这次跨 0.1.2 → 0.1.5 两个系列，破坏性变更显著更多。","bytes":6845,"lines":79,"body":"# 升级前置差异清单：0.1.2-rc.1 → 0.1.5-rc.1（2026-09-10 整理）\n\n> 用途：周末「大改造」的升级前核对清单。\n> 素材来源：`dsh-observations/` 三篇观察（2026-09-04 / 09-09 / 09-10）+ 官方 GitHub Release notes（经 API 核对）+ 本机实测。\n> 状态：**素材已核对，标注「待查」的项尚未在本地验证**。\n\n## 1. 升级范围\n\n| 项 | 值 |\n|---|---|\n| 起点 | `0.1.2-rc.1`（当前 web 宿主 + SSiD profile，实测 32 个包全为 rc.1） |\n| 终点 | `0.1.5-rc.1`（09-10 09:36 发布，**npm `latest` + `next`**） |\n| 中间版本 | 0.1.3-alpha.1（未发 npm）、0.1.3-alpha.2、0.1.5-alpha.1、0.1.5-alpha.2、0.1.5-rc.1（**无 0.1.4**） |\n| 提交量 | 1469（rc.1→alpha.2）+ 17（alpha.2→rc.1） |\n| 新增包目录 | 20 个，删除 0 个（清单见 09-09 观察附录） |\n\n与上次升级（alpha.2 → rc.1，同系列内）不同，**这次跨 0.1.2 → 0.1.5 两个系列**，破坏性变更显著更多。\n\n## 2. 破坏性变更清单\n\n| 变更 | 引入版本 | 影响层 | 本地需核查什么 |\n|---|---|---|---|\n| **会话格式 v2**（assistant streams 内嵌持久日志 + live stream frames） | 0.1.3-alpha.1 | 会话日志 | 会话日志读取工具（`.tmp-*.mts` 修复脚本、chat-rail 投影读取、标题修补脚本） |\n| **会话格式 v3**（identity 迁移、PTC 词汇重命名、V2 prompts → V3 system surfaces） | 0.1.5-alpha.1 | 会话日志 | 同上；**升级后的会话不支持降级读取** |\n| Session persistence API → 生命周期持有的 `SessionHandle`；`agentLoop.create()` 异步化；新增 session 锁（同 session 至多一个进程持有） | 0.1.3-alpha.1 | 内核 API | 插件是否直接调 session/agentLoop 内部 API |\n| 移除 `ctx.agent`（调用方须显式传 Agent） | 0.1.5-alpha.1 | 插件 API | ✅ **已查**：`max-null-plugins/*` 无任何使用 |\n| Inbox API：`Inbox` 改为类型接口，`hasPending` / `claim` 退出公共接口 | 0.1.5-alpha.1 | 插件 API | ✅ **已查**：无插件使用 `inbox.` / `hasPending` / `claim` |\n| 插件面板 API：`sidebar.panellist` 与 `main` 注册全局面板；原 `conversation` Slot 迁移为 `main` 的 `conversation` key | 0.1.5-alpha.2 | 插件 API | ✅ **已查（结论：不受影响）**：5 个插件的 `conversation.input.right`（capture / draft-polish）/ `conversation.input.dock`（chat-rail）/ `conversation.session.header.utilities`（plugin-center）/ `conversation.input.for`（memory），以及 `dsh-ssid-panels` 的 `settings.section` / `sidebar.brand.mark` / `sidebar.brand.name` / `conversation.hero.brand.mark`——**在 0.1.5-rc.1 里全部仍存在**。release notes 那句指「全局面板」的注册方式，与这些输入区/品牌 Slot 无关 |\n| **自定义 persona 配置拆分为前缀 + 后缀** | 0.1.3-alpha.2 | 配置 | ❌ **必须改（唯一确定风险）**：`presets/ssid-double-star/agent.cordis.yml` 用的是 `config.text`，而 0.1.5 的 `dsh-persona` schema 是 `prefix`（**required**）/ `suffix` / `complete` / `includeRuntimeContext`——**`text` 字段已不存在**，且缺 `prefix` 会校验失败 |\n| 普通 subprocess handle 移除 `pid`（终端 handle 不受影响） | 0.1.3-alpha.2 | 内核 API | ✅ **已查**：无插件读取 subprocess pid |\n| 默认工具调整：SDK / Headless / ACP 默认用 read/write/edit；minimal 系列保持 shell-only；`str_replace_editor` 移出默认 | 0.1.3-alpha.2 / 0.1.5 | 工具集 | ✅ **已查**：`str_replace_editor` 仅出现在 `dsh-guardian/src/engine.ts` 的注释与 `dsh-node-appearance/src/client/palette.ts` 的配色表键名，**无功能依赖** |\n| `str_replace_editor` 移出默认工具集（代码仍在，需显式启用） | 0.1.5 | 工具集 | 同上 |\n\n## 3. connection 能力变化（方案 B 的关键）\n\n| | rc.1（当前） | 0.1.5-rc.1（目标） |\n|---|---|---|\n| `ConnectionFetchMethod` | `'GET' \\| 'HEAD'` | `'GET' \\| 'HEAD' \\| 'POST'` |\n| `ConnectionFetchRoute.requestBody` | 无 | 有（`buffered` / `streaming`） |\n| connection 的 `inject` | `['webServer','credentials']` | `['credentials']` |\n| 路由实现 | `ctx.webServer.register(route)` | carrier 直接分发 |\n| 无 webServer 时 | connection 也不激活 | connection 仍可用 |\n\n→ **升级后 §12 规范草案（host 侧用 `ctx.connection.fetch.register`）技术前提成立**。封存分支 `feat/connection-fetch-routes` 可在升级后启用。\n\n## 4. 新增能力（升级后可用）\n\n- **右侧边栏**：`ui-sidebar-right`（`ctx.sidebarRight` / `ctx.sidebarRightTabs`，extension 档可接管 builtin）、`ui-sidebar-files`、`ui-sidebar-documentpreview`\n- **官方桌面端**：`apps/desktop` + `apps/desktop-host`（**仍未发布**：npm 无包、GitHub Release 无资产）\n- **文件体系**：`api/workspace-files`（双面文件 API）、`fs` 有界字节窗口读取、`client/resources` 资源注册表、`host/open-in-app`\n- **布局**：`ui-dockkit`（可逆停靠引擎，自述内部引擎、非稳定 API）\n\n## 5. 升级动作（两条线，路径不同）\n\n| 线 | 动作 | 注意 |\n|---|---|---|\n| **web（3080）** | `deepseek-harness` checkout `dsh-v0.1.5-rc.1` → `pnpm run clean && pnpm run build` | web profile **无 `@deepseek-ai/dsh` 依赖**（实测 n/a），内核来自 checkout，不走 overrides |\n| **SSiD** | `profile-template/pnpm-workspace.yaml` overrides 214 条 `0.1.2-rc.1` → `0.1.5-rc.1` → `prepare-runtime.mjs` 重建归档 | 套用 `2026-09-06-SSiD内核升级执行指南-rc.1通用范本.md`；指纹形态 `0.2.x-0.1.5-rc.1-\u003c哈希>` |\n\n## 6. 升级前置 checklist\n\n- [ ] **备份会话日志**（`~/.dsh/sessions` + `~/.dsh/sessions-ssid`）——v3 迁移后**不支持降级读取**\n- [ ] 备份 SSiD 归档与 profile（`~/.ssid/profile-backups/` 机制）\n- [ ] 核对 29 个 bundle 的 peer 范围（`ssid` profile 的 `dsh.profile.bundles`）\n- [ ] 检查 persona 配置（前缀/后缀拆分）\n- [ ] 检查 preset 是否依赖 `str_replace_editor`\n- [ ] 检查插件是否用 `ctx.agent` / `Inbox` 公共 API / 旧 `conversation` Slot\n- [ ] 检查各插件的 `inject` 是否含 `webServer` / `webRuntime`（静态必需者升级后行为变化）\n\n## 7. 风险与回滚\n\n| 风险 | 说明 | 缓解 |\n|---|---|---|\n| **会话不可降级** | v3 迁移后旧版本读不了新日志 | 前置备份；先在小 profile 试迁 |\n| 会话日志工具失效 | 自定义读取器需适配 v2/v3 | 升级前先跑一遍现有工具，确认基线 |\n| 插件静默失效 | 静态 `inject` 缺失服务时不报错 | 升级后逐个核对插件是否真的挂载 |\n| 性能回退 | 0.1.3-alpha.1 曾公告已知性能缺陷 | 本版应已修复，实测确认 |\n| 回滚路径 | checkout 回 tag + 恢复归档 + 恢复会话备份 | 三样都要有备份才动手 |\n"},{"file":"2026-09-10-DSH-skill生态调查.md","date":"2026-09-10","slug":"DSH-skill生态调查","title":"DSH skill 生态调查","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@jasonfreelab/dsh-superpowers","@max-null/dsh-skill-mcp-center","@max-null/dsh-skills","dsh-skill","dsh-superpowers","dsh-skills","dsh-skill-hub","dsh-any-skills","dsh-web","dsh-skill-explorer","dsh-skill-mcp-center","dsh-plugin"],"summary":"[CocoSgt/dsh-skills](https://github.com/CocoSgt/dsh-skills)（16 星，topics 含 skill-hub/slash-commands）、[cheshireez/dsh-skill-hub](https://github.com/cheshireez/dsh-skill-hub)（\"基于官方 ctx.skills 注册表\"）、[wmen","bytes":10622,"lines":179,"body":"# DSH skill 生态调查\n\n> **调查缘起**：你提出\"社区有没有人先我们一步做了这个 skill 合集？DSH 官方有没有做这样的合集？需要调查\"。\n> **调查方法**：GitHub API（仓库元数据与目录树）+ README 全文 + 对 DSH 官方源码的交叉核实。\n> **调查日期**：2026-09-10\n\n> 状态：记录（推断 · 2026-09-12）\n\n---\n\n## 一、结论先行\n\n| 问题 | 答案 |\n|---|---|\n| 社区有人做了吗？ | **有，至少 6 个项目**，但**没有一个是\"从 DSH 自身工程实践提炼判断标准\"这一路** |\n| DSH 官方做了吗？ | **没有做合集**。官方只提供机制（`packages/skill/` 的 service + provider + filesystem），`.agents/skills/` 那 12 个是开发自用、未发布 |\n| 我们的位置 | **空白**，但必须把定位写清，否则会被归入\"superpowers 那一类\"当成重复品 |\n\n---\n\n## 二、生态全景：三类项目\n\n### ① 移植类 —— 把别人的方法论搬进 DSH\n\n| 项目 | 内容 | 关键数据 |\n|---|---|---|\n| [JasonFreeLab/dsh-superpowers](https://github.com/JasonFreeLab/dsh-superpowers) | 移植 [obra/superpowers](https://github.com/obra/superpowers) **v6.3.0**（作者 Jesse Vincent / Prime Radiant，MIT），14 个 skill | 1 星；2026-08-28 建；npm `@jasonfreelab/dsh-superpowers` |\n| [gongyijie85/mattpocock-skills-dsh](https://github.com/gongyijie85/mattpocock-skills-dsh) | 移植 Matt Pocock 的 skill 集，**25 个 skill** | v0.1.6；双 README（中英） |\n\n### ② 管理工具类 —— skill 的浏览/启用/管理\n\n[CocoSgt/dsh-skills](https://github.com/CocoSgt/dsh-skills)（**16 星**，topics 含 `skill-hub`/`slash-commands`）、[cheshireez/dsh-skill-hub](https://github.com/cheshireez/dsh-skill-hub)（\"基于官方 ctx.skills 注册表\"）、[wmengxiang/dsh-any-skills](https://github.com/wmengxiang/dsh-any-skills)、[zhu1090093659/dsh-web](https://github.com/zhu1090093659/dsh-web) 的 `dsh-skill-explorer`，**加上你自己的 `@max-null/dsh-skill-mcp-center` 0.4.2**。\n\n### ③ 列表类 —— awesome 索引\n\n[itgoyo/awesome-agent-skills](https://github.com/itgoyo/awesome-agent-skills)、[scienceaix/agentskills](https://github.com/scienceaix/agentskills)、多个 `awesome-deepseek-harness`、`awesome-dsh-plugin`（有多个 fork）。\n\n---\n\n## 三、两个同类项目的 skill 清单（差异化判断的依据）\n\n### `dsh-superpowers` 的 14 个\n\n| skill | 触发时机 |\n|---|---|\n| `superpower-using-superpowers` | 任意会话起点，先加载技能再回应 |\n| `superpower-brainstorming` | 任何创造性工作之前 |\n| `superpower-writing-plans` | 有规格/需求、动手写代码之前 |\n| `superpower-using-git-worktrees` | 需要隔离工作区 |\n| `superpower-executing-plans` | 有书面实现计划要执行 |\n| `superpower-subagent-driven-development` | 按计划逐任务派子代理 |\n| `superpower-dispatching-parallel-agents` | 2+ 个互不依赖的独立任务 |\n| `superpower-test-driven-development` | 实现功能/修复之前（RED-GREEN-REFACTOR） |\n| `superpower-systematic-debugging` | 遇到 bug/失败，提出修复之前 |\n| **`superpower-verification-before-completion`** | **宣称完成/已修复/通过之前，先跑验证拿证据** |\n| `superpower-requesting-code-review` / `receiving-code-review` | 请求/接收评审 |\n| `superpower-finishing-a-development-branch` | 决定如何集成 |\n| `superpower-writing-skills` | 新建/编辑/验证技能之前 |\n\n### `mattpocock-skills-dsh` 的 25 个\n\n`ask-matt`、`code-review`、`codebase-design`、`diagnosing-bugs`、`domain-modeling`、`grill-me`、`grill-with-docs`、`grilling`、`handoff`、`implement`、`improve-codebase-architecture`、`prototype`、`research`、`resolving-merge-conflicts`、`setup-matt-pocock-skills`、`tdd`、`teach`、`to-questionnaire`、`to-spec`、`to-tickets`、`triage`、`wait-what`、`wayfinder`、`wizard`、`writing-for-agents`\n\n---\n\n## 四、差异化判断：它们做的是\"流程\"，我们要做的是\"判据\"\n\n**两者都在做人类软件工程方法论的 agent 化**——TDD、代码评审、系统化调试、计划、头脑风暴，这些都是人类开发者熟悉的流程，被写成 skill 给 agent 执行。\n\n**我们的材料来源完全不同**：\n\n| 维度 | 两个移植项目 | 我们 |\n|---|---|---|\n| **来源** | obra/superpowers、Matt Pocock（**作者个人经验**） | **DSH 官方 47 篇决策记录 + 12 个官方 skill + 974 篇 Agent Note** |\n| **内容性质** | **流程**：先做什么、后做什么 | **判据**：凭什么这么判断 |\n| **回答的问题** | \"怎么做\" | \"**为什么这么做、什么时候不该这么做**\" |\n| **立场** | 通用（任何 agent harness 都适用） | **DSH 特定**（agent 主导开发的仓库该怎样） |\n\n**它们没有覆盖的，正是我们的核心内容**：\n\n- **门禁设计**——什么时候该自动化、什么时候必须交给评审、什么叫\"表面合规\"\n- **证据标准**——相似性不构成同一性、独立预言机、度量机制会改变结论\n- **诚实的空白**——不确定时标注而非补齐（9 次出现的跨批模式）\n- **机械化的梯度**——从完全机械化到删除的八档处置\n- **决策记录制度**——Agent Note 的生命周期、强制的 Alternatives、归档与冻结\n- **被否决方案的价值**——\"决定告诉你结果，否决告诉你边界\"\n\n**最接近的一个**是 `superpower-verification-before-completion`（\"宣称完成之前先跑验证拿证据\"）——但它是**流程要求**（在什么时机做什么动作），不是**判断标准**（什么算够格的证据、什么时候验证手段本身会失效）。\n\n**结论：重合度低，但必须在 README 里主动划清**，否则读者看到\"又一个 skill 包\"就划过去了。\n\n---\n\n## 五、实施范本：从 `dsh-superpowers` 可直接借鉴的六件事\n\n这个项目把我们要走的路走通了。**以下都是它有、我们该照做的**：\n\n**① 实现方式**：`src/superpowers.ts` 是一个 **`SkillProvider`，rank 550**，**惰性加载** `SKILL.md` 正文。README 明写\"**可被项目/用户技能覆盖**\"。\n\n**rank 550 的含义**（结合 DSH 源码的 rank 表）：\n```\n100 项目 .dsh/skills   200 项目 .agents/skills   250 runtime\n300 customSkillDirs    400 user-dsh    500 user-agents\n550 ← 第三方 skill 插件   600 bundled（官方内置）\n```\n**第三方 skill 插件排在 550**——这是生态里已形成的约定，我们该跟随。\n\n**② 安装命令**（DSH 官方 CLI）：\n```sh\ndsh plugin --profile web add @jasonfreelab/dsh-superpowers\ndsh plugin --profile web remove @jasonfreelab/dsh-superpowers\ndsh --profile web --dump-config | grep -A2 '@jasonfreelab/dsh-superpowers'\n```\n\n**③ 包结构**：\n```\nsrc/superpowers.ts       # SkillProvider（rank 550），惰性加载 SKILL.md\nskills/                  # 技能目录（含 references/）\nlib/                     # 构建产物【已提交】→ GitHub 直装零构建\nscripts/                 # test.mjs + verify.mjs\ncordis.patch.yml         # bundle patch\n.github/workflows/       # ci.yml + release.yml + release-please.yml\n```\n\n**④ 双语文档策略**：**技能正文保持英文原文**，中文只做 README（`README.zh.md`）。理由写的是\"英文国际化\"——**这与我们\"保留 DSH 来源\"的想法一致，skill 正文用英文便于与上游对照，说明性文档才翻译**。\n\n**⑤ 自动化发布**：`release-please`（版本 + CHANGELOG + Release 说明）+ npm 可信发布。\n\n**⑥ 自测**：`npm test` 做\"内容卫生 + 真实 SkillRegistry\"测试，`npm run verify` 做结构校验 + 运行时冒烟。\n\n---\n\n## 六、一处需要澄清的差异：`dsh.plugin.json` 不是官方格式\n\n`mattpocock-skills-dsh` 用了一个 `dsh.plugin.json`：\n\n```json\n{ \"id\": \"gongyijie85/mattpocock-skills-dsh\", \"version\": \"0.1.6\",\n  \"main\": \"./lib/index.js\",\n  \"engines\": { \"dsh\": \">=0.1.0-rc.6\" },\n  \"contributes\": { \"tools\": [], \"skills\": [\"ask-matt\", ...] } }\n```\n\n**但我 grep 了 `DSHfork/packages/` 下的全部 TypeScript，没有 `dsh.plugin.json` 这个文件名**。所以它**不是 DSH 官方的清单格式**，而是某个第三方工具/插件中心的约定。\n\n**这意味着两条路**：\n- **`dsh-superpowers` 的路**：`cordis.patch.yml` + 代码里的 `SkillProvider`（**DSH 原生，我们倾向这条**）\n- **`mattpocock-skills-dsh` 的路**：`dsh.plugin.json` 声明式（**依赖一个非官方的消费者**）\n\n**我们走前者**——它与 DSH 官方机制直接对齐，不依赖任何第三方清单格式。\n\n---\n\n## 七、对既有决策的影响\n\n1. **名字**：你定的 `@max-null/dsh-skills` 可以。GitHub 仓库名在不同 owner 下可同名（不会与 `CocoSgt/dsh-skills` 冲突），npm 有 `@max-null` scope 隔离。**风险只是搜索混淆**——但如你所说，我们更贴近\"DSH skills\"这个语义。\n2. **实现方式**：确认走 **provider 式（方案 A）**，并且按 `dsh-superpowers` 的范本用 **rank 550**（不是我之前推测的 600）。\n3. **落点**：不再是 SSiD 的 `.agents/skills/`，而是**独立 npm 包**；SSiD 侧用 npm 声明集成（你已定）。\n4. **双语**：技能正文可用英文（与上游 DSH 对照方便），说明文档做中文——**这个策略已被同类项目验证**。\n\n---\n\n## 八、待核实与待决策\n\n**待核实**：\n- 两个项目的**具体 skill 内容**（我只看了清单与触发时机，未读 SKILL.md 正文）——如果要精确划清差异，需要抽查最接近的几个（如 `superpower-verification-before-completion`）\n- `superpower-writing-skills` 里有没有\"怎么写 skill 的方法论\"——**如果有，它可能与我们的\"skill 适配\"工作直接相关**\n\n**待决策**：\n- 是否要把 `superpower-writing-skills` 读一遍（它是\"教 agent 写 skill\"的 skill，对我们做适配可能有直接参考价值）\n\n---\n\n## 附：调查方法与证据边界\n\n- **已核实**：两个仓库的元数据与完整目录树（GitHub API）、`dsh-superpowers` 的 README 全文、`mattpocock-skills-dsh` 的 `dsh.plugin.json` 全文、DSH 源码中 `dsh.plugin.json` 不存在。\n- **未核实**：其余 4+ 个管理工具类项目的实际功能（仅凭 GitHub description 判断）；两个移植项目的 SKILL.md 正文；`CocoSgt/dsh-skills` 的实际内容（首次 fetch 只拿到 GitHub 导航菜单，未取到仓库内容，其性质依据是其 topics 与 16 星）。\n- **时效性**：生态数据为 2026-09-10 抓取，DSH 生态更新频繁，结论会过时。\n"},{"file":"2026-09-10-dsh-skills发布与集成.md","date":"2026-09-10","slug":"dsh-skills发布与集成","title":"@max-null/dsh-skills 发布与集成","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-skills","dsh-skills","ssid-record-browser-gif","ssid-test-reliability","dsh-ci-test-reliability","ssid-trim-cot-leakage","dsh-trim-cot-leakage","ssid-prose-standard","dsh-prose-standard","ssid-code-review","dsh-code-review","ssid-find-simplifications"],"summary":"把 DSH 官方 .agents/skills 的 12 个 skill 判据适配成思灵可用的 8 个 skill，打包为 @max-null/dsh-skills；4 个因依赖思灵没有的制度（双语、Agent Note 状态机、gh stack、整套文档制度）而不适配——但它们的制度无关判据已并入那 8 个，没有丢。","bytes":6212,"lines":108,"body":"# @max-null/dsh-skills 发布与集成\n\n> 状态：进行中（推断 · 2026-09-12）\n\n> **这是本次适配工作的交付入口**：一页说清**产出了什么、还差什么、你要做什么**。\n> 全部过程记录在 `2026-09-10-skill适配说明-*.md` 系列（序号 01–09，含 01 份写作规则）。\n\n---\n\n## 一、一句话\n\n把 DSH 官方 `.agents/skills` 的 **12 个 skill** 判据适配成思灵可用的 **8 个 skill**，打包为 `@max-null/dsh-skills`；**4 个**因依赖思灵没有的制度（双语、Agent Note 状态机、`gh stack`、整套文档制度）而不适配——**但它们的制度无关判据已并入那 8 个**，没有丢。\n\n---\n\n## 二、产出物\n\n| 类别 | 位置 | 状态 |\n|---|---|---|\n| **适配说明**（判定依据） | `docs/决策/2026-09-10-skill适配说明-01..09` | 9 份完成 |\n| **判定规则**（后续同类工作的依据） | 同上 `-写作规则.md` | 完成 |\n| **判据正文** | `max-null-plugins/dsh-skills/skills/*/SKILL.md` | 8 份完成 |\n| **来源标记** | 同目录 `SOURCE.md` | 8 份完成 |\n| **包本体** | `max-null-plugins/dsh-skills/`（package.json / lib / cordis.patch.yml / README / LICENSE） | 完成，可发布 |\n| **脚本（逐字复用）** | `skills/ssid-record-browser-gif/scripts/` | 2 个，SHA256 与上游一致 |\n\n**8 个 skill 与它们的上游**：\n\n| skill | 上游 | 适配类型 |\n|---|---|---|\n| `ssid-test-reliability` | `dsh-ci-test-reliability` | 小改 |\n| `ssid-trim-cot-leakage` | `dsh-trim-cot-leakage` | 小改 |\n| `ssid-prose-standard` | `dsh-prose-standard` | 小改 |\n| `ssid-code-review` | `dsh-code-review` | 需适配 |\n| `ssid-find-simplifications` | `dsh-find-simplifications` | 需适配 |\n| `ssid-pre-push-checks` | `dsh-pre-push-checks` | 需适配 |\n| `ssid-speed-up-perf` | `dsh-speed-up-perf` | 需适配 |\n| `ssid-record-browser-gif` | `record-browser-gif` | 部分可用 |\n\n全部指向同一个上游锚点：**`c291e7961a`（2026-09-10 抓取）**。\n\n---\n\n## 三、你要做的事（两条命令）\n\n**GitHub 侧已完成**：`https://github.com/Max-Null/dsh-skills`（PUBLIC，分支 main，6 个提交已推送）；SSiD 本仓库也已推送（`d7fb2bb`）。\n\n```sh\ncd H:\\MaxNull\\WorkStation\\max-null-plugins\\dsh-skills\nnpm login                      # 必须：本机 .npmrc 里的 _authToken 已失效（npm whoami → E401）\nnpm publish --access public\n```\n\n- `--access public` 是必须的——`@max-null/*` 是 scoped 包，**默认按私有发布**。\n- 包名已确认**未被占用**（`npm view` → 404）；同 scope 的 `dsh-chat-rail@0.6.1` 与 `dsh-memory@0.6.0` 都能查到，说明 scope 存在且你有发布权。\n\n**发布后自检**：\n\n```sh\nnpm view @max-null/dsh-skills version    # 应返回 0.1.0\n```\n\n---\n\n## 四、发布后三步集成\n\n1. `shell/profile-template/package.json` **两处声明**：\n   - `dependencies` 加 `\"@max-null/dsh-skills\": \"0.1.0\"`\n   - `dsh.profile.bundles` 数组加 `\"@max-null/dsh-skills\"`\n2. `node scripts/prepare-runtime.mjs` 重建归档\n3. 重启后在**新会话**里问「有哪些 `ssid-` 开头的 skill」——**八个都在**即成功\n\n**失败时的排查顺序**：包是否进了 `node_modules` → profile 的 `cordis.patch.yml` 里是否有那一行 → **该 profile 是否真的重启过**（provider 在 `apply()` 时注册，不重启不生效）。\n\n---\n\n## 五、未竟事项（诚实列出）\n\n| # | 事项 | 影响 |\n|---|---|---|\n| 1 | ~~`ssid-trim-cot-leakage/references/examples.md` 校准样本不全~~ **已补齐** | **11 节 / 22 案例 / 152 行**，节数与上游一致（上游 11 节 / 30 案例 / 275 行）。案例数少于上游是**有意的**：上游案例绑定 DSH 的目录与机制，逐个直译会得到\"在思灵读不懂\"的样本集；取舍是保证每节至少一个可校准的真实样本 |\n| 2 | ~~本机未安装 `ffmpeg` / `ffprobe`~~ **已装** | ffmpeg / ffprobe **9.0.1**（gyan.dev release-essentials，106 MB）解压在 `H:\\MaxNull\\WorkStation\\.build\\ffmpeg\\ffmpeg-9.0.1-essentials_build\\bin\\`，并写入**用户级 PATH**（`IsAdmin=False` 下走便携版路线，不需要提权）。**编码器 5 个自测已实测通过**。若不想让用户 PATH 保留这一条，删掉即可——skill 里也记了绝对路径 |\n| 3 | ~~包的 GitHub 仓库尚未创建~~ **已建并推送** | `https://github.com/Max-Null/dsh-skills`（PUBLIC，分支 main，6 个提交）；`package.json` 的 `repository` / `homepage` / `bugs` 现在都指向真实地址。**SSiD 本仓库也已推送**（`d7fb2bb`） |\n| 4 | 手册待办 **#7（`docs/决策/` 状态机）未做** | `ssid-code-review` 的「决策记录与已交付现实一致」与 `ssid-find-simplifications` 的「取代标记」两条判据依赖它；缺失时只按当前无状态机的形态执行 |\n\n---\n\n## 六、复核入口（想查什么看哪里）\n\n| 想知道 | 看 |\n|---|---|\n| 为什么某个 skill 这样改 | 对应的 `-NN-*.md` §三（逐条判定） |\n| 上游判据有没有少 | 各说明 §四「算术核对」+ 包的 `SOURCE.md`「与上游的差异」 |\n| 数字对不对 | 各说明 §八「数字自检」——**每个数字都附可复现命令** |\n| 我犯过哪些错 | 各说明的自查记录 + 《写作规则》§三（**9 次\"数一数\"类错误，全部留痕**） |\n| 怎么加工新的 skill | 《写作规则》§六（七节结构模板）与 §七（SOURCE.md 模板） |\n| 上游更新了怎么办 | 每份 `SOURCE.md` 末尾的「跟进方式」（附 `git log` 命令） |\n\n---\n\n## 七、这次工作本身的收获\n\n三条可复用的方法，已写进《写作规则》：\n\n1. **三层验证规则**：未改动的判据继承上游检验；等价替换只需可解析性检查；**改写与新增必须指出证据来源，指不出来就不新增**。\n2. **数字纪律**：写不出可复现命令的数字不许进正文。这条是从**真实错误**里长出来的——三份说明共犯 9 次\"数一数\"错误（凭印象报数）。\n3. **生成 skill 的过程本身就是一次复核**：03 的两处数字错误**只有在落地成 skill 时才暴露**。所以「适配说明写完」不等于「判据已准确」。\n"},{"file":"2026-09-10-DSH-skills适配清点.md","date":"2026-09-10","slug":"DSH-skills适配清点","title":"DSH skills 适配清点","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["dsh-skills","dsh-doc","dsh-trim-cot-leakage","dsh-code-review","dsh-merging-stacked-prs","dsh-ci-test-reliability","dsh-prose-standard","dsh-find-simplifications","dsh-pre-push-checks","dsh-speed-up-perf","dsh-translate-docs","dsh-archive-agent-notes"],"summary":"调查前的认知是\"12 个 skill = 12 个 SKILL.md\"。实际是 12 个技能包，共 2956 行：","bytes":21844,"lines":256,"body":"# DSH skills 适配清点\n\n> **调查范围**：`DSHfork/.agents/skills/` 全部 12 个技能包。\n> **调查方法**：逐个通读 `SKILL.md` 全文（12 个，1254 行），并核实包内结构；`references/` 与 `templates/` 按需查阅。\n> **判断依据**：本系列 15 批精读得到的\"为什么\"，加上对 SSiD 现状的了解（单人开发、无 CI 池、无双语制度、无 Agent Note 制度）。\n\n> 状态：进行中（推断 · 2026-09-12）\n\n---\n\n## 一、先说一个结构性发现：skill 是\"技能包\"，不是单个文件\n\n调查前的认知是\"12 个 skill = 12 个 SKILL.md\"。实际是 **12 个技能包，共 2956 行**：\n\n| 组成 | 文件数 | 行数 | 作用 |\n|---|---:|---:|---|\n| `SKILL.md` | 12 | 1254 | 入口与判断标准 |\n| `references/` | 8 | 1037 | 细节材料，按需加载 |\n| `templates/` | 4 | 361 | 写作骨架（仅 `dsh-doc`） |\n| `scripts/` | 2 | 440 | 可执行工具（仅 `record-browser-gif`） |\n\n**包体重差异很大**：`dsh-doc` 是 861 行（SKILL.md + 5 references + 4 templates），`dsh-trim-cot-leakage` 是 372 行（SKILL.md + 2 references），而 `dsh-code-review`、`dsh-merging-stacked-prs` 等只有单个 SKILL.md。\n\n**这本身是设计要点**：`SKILL.md` 保持精简（45–172 行）以便随时加载，重材料外置按需读取。`dsh-doc` 里有一句把它说透了：\n\n> **Load only the reference needed for the task.** Each reference links directly from this file **so the skill has no deep reference chain.**\n\n---\n\n## 二、三分类总表\n\n| # | skill | 行数 | 判定 | 一句话理由 |\n|---:|---|---:|---|---|\n| 1 | `dsh-ci-test-reliability` | 191 | **✅ 小改即可用** | 内容几乎全是跨平台/并发/时序的通用可靠性判据 |\n| 2 | `dsh-trim-cot-leakage` | 372 | **✅ 小改即可用** | 判据通用；且直接对应你的待办 #8 |\n| 3 | `dsh-prose-standard` | 223 | **✅ 小改即可用** | 文字判据通用，仅需删掉 DSH 专有的位置类型 |\n| 4 | `dsh-code-review` | 52 | **🔧 需适配** | 检查骨架通用，但要重写\"事实来源\"清单与 DSH 专有条款 |\n| 5 | `dsh-find-simplifications` | 157 | **🔧 需适配** | 判据高度通用，但流程绑在 DSH 的包结构与 Agent Note 制度上 |\n| 6 | `dsh-pre-push-checks` | 128 | **🔧 需适配** | \"选最小验证集\"的判据通用，具体命令与目录规则全是 DSH 的 |\n| 7 | `dsh-speed-up-perf` | 91 | **🔧 需适配** | 测量纪律通用，但它依赖 DSH 的 benchmark 基础设施与 CI 性能门禁 |\n| 8 | `record-browser-gif` | 612 | **🔧 部分可用** | 录制与编码通用（含 337 行可复用编码器），发布流程绑 PR 制度 |\n| 9 | `dsh-doc` | 861 | **⛔ 现在不适用** | 依赖整套文档制度（kind 系统、4 模板、字数预算、双语、网站投影） |\n| 10 | `dsh-translate-docs` | 74 | **⛔ 现在不适用** | 完全依赖双语配对制度 |\n| 11 | `dsh-archive-agent-notes` | 68 | **⛔ 现在不适用** | 依赖 Agent Note 制度——但它是待办 #7 的直接参考 |\n| 12 | `dsh-merging-stacked-prs` | 127 | **⛔ 现在不适用** | 依赖 GitHub stacked PR，单人开发用不上 |\n\n---\n\n## 三、小改即可用（3 个）\n\n### 1. `dsh-ci-test-reliability`（131 + 60 行）\n\n**这是 12 个里通用性最高的。** 它解决的问题是\"测试在真实 CI 拓扑下才暴露的失效\"，而这些问题与仓库规模无关。\n\n**通用判据（几乎可原样保留）**：\n\n- **执行拓扑四层模型**：同一 Vitest 文件内 → 不同 worker 进程 → 同一 job 内的独立进程 → 共享主机的不同 job。\"除非当前配置证明不然，**假设这些层会重叠**\"\n- **\"进程隔离不隔离主机的端口、可预测文件系统路径、外部服务、数据库、socket 或继承的子进程。\"**\n- **\"不要因为一个 fixture 缺隔离就把整个套件串行化。\"**（\"顺序化一个 Vitest 块无法保护主机资源免受另一个文件、进程、job 或 runner 的干扰\"）\n- **用资源所有者的分配器，而不是\"先检查可用、稍后再占\"**：网络用 `listen(0)` 读回分配到的地址；**绝不要扫描空闲端口然后稍后绑定**\n- **进程全局状态清单**：`process.env`、`cwd`、假计时器、locale 与时区、模块 mock、注册表、console 钩子、`globalThis`、全局 `fetch` 拦截——**都当作独占可变资源**；变更时\"捕获原值是缺失还是存在 → 恢复那个确切状态 → 立即注册恢复 → 最小作用域 `try/finally` → 保留 `afterEach` 兜底\"\n- **平台自有语义 4 条**（Windows 特有）：mtime 精度不足、环境变量名大小写不敏感、文件句柄异步释放（需要\"按实测争用规模定大小的有界重试\"）、无 POSIX 权限与信号语义\n- **超时预算**：\"`describe` 或 case 超时会**覆盖** runner 的 `--testTimeout` 而不是让位\"；**\"提升测试预算时要一起提升 hook 预算\"**（否则\"只提升 case 预算会把一次争用失败挪进 `afterEach`\"）\n- **\"固定的 sleep 不是 setup 完成或清理结算的证据。\"** 等显式就绪事件/握手/状态转移/自有 promise/可外部观察的条件；**\"超时只用来界定等待，绝不用作让断言成立的条件\"**\n- **释放干净**：\"调用 `abort()`、`close()` 或 `kill()` 而不等待自有的完成信号，是**不完整的拆除**\"\n- **拒绝掩盖式修复（7 条）**：加超时而不指明等待的状态、加重试、全部串行、吞掉错误、弱化断言、归一化不稳定行为、清理前加 sleep\n- **而\"恢复预算不是掩盖\"**：把套件提升到它本来就有的 lane 预算，或\"按 runner 上实测的争用规模定有界重试\"，都是\"**命名了等待的工作并归还了 lane 已授予的量**\"\n- **\"只做诊断的请求保持只读：报告原因与证据，除非用户同时要求修复。\"**\n\n**需要适配的**：`docs/testing.md`、`docs/defensive-patterns.md`、`snapshots/AGENTS.md` 这些 DSH 文档引用；以及 `references/ci-flake-diagnosis.md`（60 行，绑 DSH 的 CI 拓扑）。\n\n### 2. `dsh-trim-cot-leakage`（45 + 327 行）\n\n**直接对应你的待办 #8（CoT 泄漏探针）**，而且它比第 02 批我读到的决策记录更完整——**决策记录给了原理，这个 skill 给了可操作分类**。\n\n**核心判据只有一句**（\"The one test\"）：\n\n> 对每一段可疑文字问：**一个在 HEAD 处、无法访问任何会话记录、PR 讨论或未提交草稿的读者，能否解析每一个引用、核实每一条主张？** 若不能，就用仓库视角重述仍成立的事实并删掉其余部分。\n\n**8 类泄漏**（每类都有具体模式）：失效的设计会话引用、Stack/PR 视角、变更叙事与版本戳、评审编排、面向评审者的自我辩护、重述与推导记录、模糊措辞与规划残留、撰写语言滑落。\n\n**9 条 keep 规则**（**这一节是防过度清理的关键**）：issue 引用、Agent Note 里的已合并 PR 引用、抑制理由、反事实现在时、**带 `measured` 的实测边界**（\"provenance 词 `measured` 是承重的\"）、运行时旧/新状态、note 变更史段落里的历史阶段名、**按设计在仓库外解析的外部引用**（RFC 章节号、Figma 帧名）、项目声音与体裁形式。\n\n**工作流 5 步**，其中第 2 步是你待办 #8 要的方法：**先只读审计，跑召回探针（带 `--hidden`），每条探针在信任其输出之前，用一个已知正例和一个近似负例校准，然后逐条语义判断**——并且\"**探针不是定义**：原始清除的每一轮评审都发现了探针漏掉的情况，所以在没有模式在手的情况下，也去读范围内最密集的文字\"。\n\n**需要适配的**：DSH 专有路径（`docs/AGENTS.md#writing-rules`、`verify-type-equiv`、`verify-translation-pairing`）、`references/recall-batteries.md`（52 行，探针清单要按 SSiD 的词汇重写）、`references/examples.md`（275 行，示例要换成 SSiD 的）。\n\n### 3. `dsh-prose-standard`（81 + 142 行）\n\n**文字判据通用，本体只需小改。**\n\n**核心**：\"**写够以保住契约，然后移除推理记录、重复和装饰。**\"\n\n**\"保住完整命题\"一节是精华**——编辑前先识别段落里的每个命题，逐项保留：行为者与动作 / 条件、时机与顺序 / 情态（必须、可以、绝不）/ **负面保证与例外** / 归属、副作用、失败模式与后果。配套两句硬话：\n\n- **\"字数更少本身不是改进。\"**\n- **\"不要为了满足删除目标而制造编辑。\"**\n\n**\"按文字位置要求的覆盖\"一节（11 类）**是最可直接移植的部分：公开 JSDoc / 内部注释 / 模块注释 / 测试 / 教程 / README / Agent Note / 事故复盘 / **skills 与 agent 指令** / 示例与配置注释 / 提示词与可见字符串 / 诊断信息——**每类都写明\"该有什么\"和\"该删什么\"**。\n\n**Borderline 的定义值得抄**：\"只有当**至少两个版本都满足完整命题规则、但交换了被接受的原则**，且本 skill 不解决这个权衡时，才算 borderline。**一个只有单一保命题答案的改写不是 borderline。**\"\n\n**互动模式还给出了知识沉淀机制**：用户决定后，\"**把原则和版本提炼进 examples，不带 PR 历史或评审叙述**\"。← **这正是你说的\"知识沉淀\"，而且是它写明的做法。**\n\n**需要适配的**：`vendor/` 与 `archived/` 排除（SSiD 无此结构）、`verify-client-ui-i18n`（无此门禁）、`adding-a-package.md`（无此文档）。\n\n---\n\n## 四、需适配（4 个）\n\n### 4. `dsh-code-review`（52 行）\n\n**\"Manual checks\"那 16 条是全篇价值所在**，且绝大多数与仓库规模无关：\n\n- **意图与接口契约**：追踪每个变更接口的两侧\n- **生命周期与并发**：异步 setup、回调、进程、拆除——\"检查发布前的竞态、await 期间的取消、独立错误上报、回调包含、重入前的归属、完整的 detach 清理、静默拆除\"\n- **能力与消费者匹配**：追踪每一个当前消费者；**反向也要查**——\"一个通用服务上的新公开方法，若唯一调用者是一个内部消费者，那是**不必要的 API 扩张**\"\n- **范围、归属与必要性**：把每个抽象、状态机、选项、防御性拷贝映射到它的当前契约、生产消费者与归属方\n- **配置与公开选择**：问\"每个默认值、公开操作集、格式有什么当前消费者证据或先例支持\"；**\"当证据缺失时，要求一个显式选择或显式推迟\"**\n- **模型视角**：检查模型实际收到的提示词、工具 schema、结果与诊断\n- **执行路径**：跟踪每条拒绝路径到真正执行它的操作\n- **界限覆盖最终操作**：定位完整产物的所有者，**探测极小与精确边界**\n- **真实入口路径**：测试要走真实 Loader/bin/worker\n- **测试强度**：\"断言在预期的回归上失败，并验证外部状态、日志、事件或释放，**而不是复述实现或相信 agent 的报告**\"\n- **\"覆盖率是必要的，但不是场景正确的证据。\"**\n- 报告部分：**\"把阻塞项与建议分开，并**省略已被绿色门禁强制的问题**\"**，以及**\"收到评审时，逐条核实，用技术理由修复或反驳，不要表演式同意\"**\n\n**需要适配的**：`Sources of truth` 那 8 个链接全部指向 DSH 文档；`Blocking requirements` 里 #3（subsystems/type-equiv）、#4（Cordis 注册）、#5（invariant companions）、#7（locale 文案）是 DSH 专有；`change-scope` 脚本不存在。\n\n### 5. `dsh-find-simplifications`（157 行）\n\n**判据通用、流程专用。**\n\n**\"什么算强候选\"9 条**（可原样用于 SSiD）：\n\n- 公开方法/事件/配置项/注册表通知/helper/包/持久事件/测试产物**没有生产消费者**\n- 只有测试或文档是消费者，而它们钉住的行为**不承重**\n- 两种表示**镜像同一个事实**\n- 一个接缝有每个实现都必须支持、但**没有消费者使用**的方法\n- 独立包只为测试/demo/支持代码存在\n- 特性实现的是**投机性通用**\n- 不变量/回滚路径/期望输出集/特例测试**只为保护一个未使用的 API 而存在**\n- 手搓代码重实现了成熟外部包或 Node 内置已经提供的\n- **简化后的行为可以略有不同，但新行为仍然合理且更易解释**\n\n配套的反例同样重要：**\"薄弱候选不足以写 Agent Note\"**——删一个错字、跑一次 `knip`、移除一个有意记录的后端/适配器、**\"无调用点证据地说'这看起来复杂'\"**。\n\n**\"消费者三分类\"是可复用的判据**：生产语料（`src`、运行时脚本、loader/config 路径）/ 非生产语料（测试、README/docs、Agent Note、快照、生成的期望输出、注释）/ **歧义语料（可能是产品冒烟路径的示例和脚本——分类前先查用法）**。\n\n**\"拒绝或降级一个候选\"4 条**：存在生产调用者（那就是特性决策而非清理）/**API 由一个已实现的 Agent Note 或一个来之不易的防御模式明确论证过，而新证据没有击败那个理由**/移除会迫使无关翻腾而不真正减少公开 API/想法正确但太小（**那就加一个有针对性标签的 TODO**）。\n\n**需要适配的**：`.agents/notes/` 制度、DSH 的包结构、`rg` 工作流细节、\"Coalesce Superseded Agent Notes\"整节（依赖待办 #7）。\n\n### 6. `dsh-pre-push-checks`（128 行）\n\n**判据通用**：\"选取**覆盖即将推送或被刚推送 diff 的最小测试与检查**，而不是反射式地跑全仓库套件\"。\n\n**通用条款**：\n\n- **\"除了钩子，不存在通用的本地基线。\"** 每个行为变更需要\"**能因它的回归而失败的最窄可用测试**\"\n- **\"不要仅仅因为接下来要 commit 或 push 就手工重跑一个已经通过的检查。\"**\n- **\"测试选择与覆盖率选择是两回事。\"**\n- **\"不要推送并指望 CI 表现不同。\"**\n- 失败时的四条证据纪律：记录确切命令/失败测试/平台特定不匹配 → 确认相关的非平台证据 → **优先修跨平台不确定性** → 只有用户明确要求才绕过本地钩子，并报告究竟什么失败了、为什么期望 CI 不同\n- 历史重写保护：`--force-with-lease=\u003cbranch>:\u003cobserved-oid>`，\"**裸 `--force` 永远不允许**\"\n- 一条很实用的诊断：`gh pr checks` 报 \"no checks reported\" 且 `total_count: 0` 时，**那不是基础设施问题，是 PR 处于冲突状态**——\"GitHub 在 PR 为 `CONFLICTING`/`DIRTY` 时不创建 `pull_request` 工作流运行\"，而\"空提交、`--allow-empty` 推送、draft/ready 切换、revert-and-restore 弹跳都会让 `total_count` 保持 0，并增加垃圾历史\"\n\n**需要适配的**：`change-scope` 脚本、8 类变更对应的具体 pnpm 命令、snapshot 目录规则、`gh stack` 相关整节。\n\n### 7. `dsh-speed-up-perf`（91 行）\n\n**测量纪律通用，基础设施专用。**\n\n**测量卡片（7 字段，实施前必填）**是全篇最有价值的形式：用户操作 / 工作负载 / 入口路径 / 时钟 / 内存 / 判定 / 行为。\n\n**通用判据（可直接用）**：\n\n- **\"一个可疑的循环、未使用的缓存，或一个大文件，本身不是瓶颈的证据。\"**\n- **\"变化独立成本驱动量：字节、持久事件、紧凑记录、原始增量、轮次、工具、子项、可见 DOM 节点是不同的量。\"**\n- **\"不要在不检查它压的是什么用户操作的情况下，把大批量微小的相同消息称为'真实的'。\"**\n- **\"绝不让 fixture setup 偷偷预热一个冷场景。\"**\n- **\"一个解析后丢弃的基线，与经过验证的保留历史不可比。\"**\n- **\"不要为了让回归通过而放宽预算或挑选幸运的一次运行。\"**\n- **\"不要仅为测量而新增生产导出，也不要把算法复制进一个'基准实现'。\"**\n- **\"推迟不是删除\"**，视口高亮不是完全虚拟化\n- **\"一个宽到让回归通过的阈值不是保护；一个低于已核实噪声底的预算也不可靠。\"**\n- **\"不要静默截断历史、跳过工具结果、禁用不变量，或为了达到一个数字而改变生命周期语义。\"**\n- **\"当收益在端到端处消失、典型工作负载实质回归、复杂度超过小收益、或取消/保留/持久性无法被解释和测试时，拒绝这个优化。\"**\n- **\"不要仅仅因为报告来自 bot 就驳回它。\"**\n- 结果汇总格式：**工作负载 → 前后绝对值与比率 → 端点与内存语义 → 行为证据 → 负对照 → 实际执行的检查 → 排除项**，并**分开陈述作者自报的历史数字、新的本地测量与 CI 证据**\n\n**需要适配的**：`benchmarks/AGENTS.md`、既有 benchmark lane、CI 性能门禁——**SSiD 没有这套基础设施**。判据可以先归档，等有性能需求时再建。\n\n---\n\n## 五、不适用（现在）（4 个）\n\n| skill | 为什么不适用 | 但有什么值得留下 |\n|---|---|---|\n| `dsh-doc`（861 行） | 依赖整套文档制度：kind 系统 + 4 个模板 + 字数预算清单 + 双语配对 + 网站投影 | **\"Fact-check procedure: test, do not assume\" 那 5 条**——\"对操作类主张，唯一可接受的证据是你亲手跑过\"；\"删除你无法复现的东西——**当一条主张无法复现时，改的是主张，不是测试**\"。这 5 条与仓库规模无关，值得单独提取 |\n| `dsh-translate-docs`（74 行） | 完全依赖双语配对制度（三文件配对、blob 哈希 sidecar、`verify-translation-pairing`） | 一条洞察：**\"绝不要为应用一次更新而重译整个文档——最小更新保住了一切未改动内容的已评审措辞；重译把它们扔掉。\"** 以及 frontmatter 的 `disable-model-invocation: true` 机制本身（**危险或昂贵的操作禁止模型自动调用**） |\n| `dsh-archive-agent-notes`（68 行） | 依赖 Agent Note 制度——SSiD 还没建（你的待办 #7） | **整份都是待办 #7 的直接参考**，尤其\"Calibrated examples\"一节：**用具体篇目 + 字数校准归档判断**，并明说\"**这些示例设定标准；字数证明大小不是标准**\" |\n| `dsh-merging-stacked-prs`（127 行） | 依赖 GitHub 原生 stacked PR + `gh stack` 扩展；单人开发没有依赖链 | 三条通用判据：\"**取当前 PR 元数据与确切 head OID，而不是相信分支名或之前的报告**\"；\"**不要仅因为存在刷新机制就重写分支**\"；\"**任何历史重写都会让 commit-OID 假设失效**——重新取确切 head 并重新审计\"；以及删除分支的门槛\"**除 `0` 以外的任何结果都阻止删除**\" |\n\n---\n\n## 六、部分可用（1 个）\n\n**`record-browser-gif`（172 + 440 行）**\n\n它其实由三段组成，可用性各不相同：\n\n| 段 | 行数 | 判定 |\n|---|---:|---|\n| **录制与证据链纪律** | SKILL.md 前 115 行 | **✅ 通用**——\"一次分镜就是一次证据运行\"、fresh state roots、失败整场丢弃、\"等待唯一语义定位器\"、`exact: true` 防止匹配到提示词回显 |\n| **编码器 `scripts/encode_gif.py`** | 337 行 | **✅ 可直接复用**——纯工具，含 103 行自测；只依赖 `ffmpeg`/`ffprobe` |\n| **发布流程（`gh --attach` / assets 分支）** | SKILL.md 后 57 行 | **🔧 依赖 PR 制度**——但若 SSiD 的 GitHub 流程有 PR 评审，这段也可用 |\n\n**最值得直接拿来的一条**：编码器的参数设计里有一句——\n\n> `--speed` 改变播放速度；**在 GIF 旁边披露它和选定的区间，这样演示就无法暗示被测量的响应延迟。**\n\n---\n\n## 七、适配的优先顺序建议\n\n按\"收益 ÷ 工作量\"排序：\n\n| 顺序 | skill | 理由 |\n|---:|---|---|\n| **1** | `dsh-ci-test-reliability` | 通用性最高、改动最小；SSiD 有测试也有跨平台问题，立刻用得上 |\n| **2** | `dsh-trim-cot-leakage` | 直接清掉你的待办 #8；判据与分类都是现成的 |\n| **3** | `dsh-prose-standard` | 补齐\"文字判据\"这一层；11 类位置的覆盖清单可直接移植 |\n| **4** | `dsh-code-review` | SSiD 若有评审环节就能用；16 条 manual checks 是现成骨架 |\n| **5** | `dsh-find-simplifications` | 判据好，但流程改造量大 |\n| **6** | `record-browser-gif` 的编码器 + 录制段 | 工具可直接搬 |\n| 7–10 | 其余四个 | 等 SSiD 长出对应制度（Agent Note、文档体系、双语、多人协作）再回来 |\n\n---\n\n## 八、两个需要你决定的点\n\n1. **落点结构与命名**：DSH 用 `.agents/skills/\u003cname>/SKILL.md` + `references/`。SSiD 要不要照这个结构？如果照，名字前缀该用什么（DSH 用 `dsh-`，我们大概用 `ssid-`）？\n\n2. **适配的产品是什么**：是产出**可直接放进 SSiD 的 skill 文件**，还是先产出**逐个 skill 的\"适配说明\"**（列出它依赖 DSH 的哪些前提、在 SSiD 该怎么改）？\n\n   我倾向后者——因为按第 12 批学到的\"**软技能**\"（`dsh-prose-standard` 自称的 *\"It is guidance, not a script\"*），适配的价值恰恰在那些**判断依据**上，而不是让文件长得像。先有说明、再生成文件，也便于你逐条复核。\n\n---\n\n## 附：本次调查的过程记录\n\n- 分批通读 12 个 `SKILL.md`（约 1254 行），核实包内结构（`references`/`templates`/`scripts` 共 1702 行）\n- 未读：`dsh-doc` 的 5 个 references 与 4 个 templates（733 行）、`dsh-translate-docs` 之外的 i18n 材料、`record-browser-gif` 的 Python 脚本（440 行，只核了行数与自测存在）\n- 上述判断中，凡标注\"通用\"的条款，都是我**逐一读过原文**的；凡涉及 SSiD 现状的推断（如\"单人开发不用 stacked PR\"），依据是你此前告知的项目背景，**未独立核实**。\n"},{"file":"2026-09-10-DSH方法论精读原始报告存档.md","date":"2026-09-10","slug":"DSH方法论精读原始报告存档","title":"DSH 方法论精读：原始报告存档（2026-09-10）","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["dsh-doc","dsh-prose-standard","dsh-speed-up-perf","dsh-ci-test-reliability","dsh-trim-cot-leakage","dsh-code-review","dsh-find-simplifications","dsh-pre-push-checks"],"summary":"源文件：.agents/skills/dsh-doc/SKILL.md、.agents/notes/README.md、.agents/notes/AGENTS.md、.agents/notes/implemented/AGENTS.md、docs/AGENTS.md、dsh-doc/references/structure-hierarchy.md","bytes":34990,"lines":264,"body":"# DSH 方法论精读：原始报告存档（2026-09-10）\n\n> 状态：记录（推断 · 2026-09-12）\n\n> 本文件存档 4 个 subagent 对 8 个官方 skill 的精读报告（保留全部逐字引用与规则清单，删除叙述性重复）。\n> 综合提炼见 `2026-09-10-DSH工程方法论学习笔记.md`；结构与规模见 `2026-09-10-DSH官方工程化范式调查.md`。\n> 素材来源：`DSHfork` @ `origin/master`（`c291e7961a`）。\n\n## 报告 A：文档体系与 Agent Notes 机制\n\n**源文件**：`.agents/skills/dsh-doc/SKILL.md`、`.agents/notes/README.md`、`.agents/notes/AGENTS.md`、`.agents/notes/implemented/AGENTS.md`、`docs/AGENTS.md`、`dsh-doc/references/structure-hierarchy.md`\n\n### A.1 文档分层与职责边界\n\n每层都明写「不收什么」：\n\n| 层 | 职责 | 不收 |\n|---|---|---|\n| Root `AGENTS.md` | 常驻指令（每条 1–3 行 + 链接 home） | 故事、示例、情景流程、从 home 复述的内容 |\n| 子树 `AGENTS.md` | 子树专属指令 | 根文件已有的全仓规则 |\n| JSDoc / 代码注释 | 模块与导出的本地完整契约（行为、失败、时序、所有权、模态、异常、后果） | 推理过程、测试走读、评审分析、复述代码 |\n| Package README | 每包契约（config、语义、limitations、扩展点、Model Experience / Known Limitations） | JSDoc 复述、生成目录复述、别的包的事 |\n| Agent Note | 活跃决策记录（why、放弃了什么、必需验证） | 迁移计划、验收清单、spec-speak（\"should…\"） |\n| 顶层 `docs/` | architecture 有序地图 / subsystems 类型定义 / cookbook 编号验证步骤 / postmortem（唯一可讲事故处）/ user 产品指南 / development 贡献者流程 | — |\n| 网站 `website/` | 投影 | \"The website is a tested projection, never a second copy\"；`.generated/` 永不手改 |\n\n**核心原则（逐字）**：\n\n- \"Preserve one owner per fact: source, tests, generated catalogs, package READMEs, guides, Agent Notes, and scratch each keep their own kind of truth.\"\n- \"Each fact has one home: the tier whose job it is; elsewhere, link there.\"\n- \"Document type does not widen that scope.\"（参考文档只对自身主题穷尽）\n\n**映射规则（逐字）**：\n\n> \"Placement: bugs → postmortems; rationale → Agent Notes; procedures → cookbooks; type definitions → subsystems; package contracts → READMEs; standing orders → root `AGENTS.md` with a rationale link.\"\n\n**kind 元数据机械映射**：package-group / package-reference / package-library / package-bundle，一 kind 一模板；\"Add a new kind only together with a distinct template file, a documented repository position or declared owner, and a focused check that maps documents to it.\"\n\n**硬约束**：一事实一家；重复规则用特征短语 grep 合并（\"keep one home and link the rest\"）；生成目录永不手改；搬迁必须原子修好所有入链。\n\n**「受众优先层级」**：该术语仅出现在 dsh-doc 的 frontmatter description（\"using audience-first hierarchy\"），完整定义条目未读到。可验证支撑三条：① 分页按「一个主要 job + 一个 reader」分类；② 页内顺序固定为 用户可用 → 高级配置 → 开发者细节；③ \"Organize cross-package Markdown under audience and learning intent instead of leaving unrelated pages flat at `docs/`.\"\n\n### A.2 Agent Notes 机制\n\n**触发条件（逐字）**：\"Every non-trivial change MUST add or update at least one Agent Note in the same PR.\"\n\n非平凡 = 改变行为、架构、跨文件/跨包契约、流程或工具、测试策略、磁盘/wire/配置格式，或维护者可能重新审视的其他决策。豁免仅限纯机械、无行为/契约/结构/流程/理由变化的局部编辑。更新既有归属 note 即算满足，禁止另建重复。新增 note 必触发一次 supersession 检查（同 PR 归档合格 triplet，部分取代则双向交叉链接）。\n\n**生命周期（目录即状态）**：\n\n| 目录 | 含义 | 备注 |\n|---|---|---|\n| `proposed/` | 实施前评审的提案，尚未或仅部分构建 | \"Never archive a proposed note: reject an obsolete proposal.\" |\n| `implemented/` | 决策已 ship | 随实际发布同步更新——\"facts only — paths, names, structure — not the decision itself\" |\n| `rejected/` | 已考虑后拒绝 | 仅当理由还能防住一个诱人错误时保留，否则中/英 + sidecar 三件套一起删 |\n| `archived/` | 冻结历史 | 仅 implemented 可进 |\n\n**归档判据**：shipped 决策已完成且理由不太可能指导未来工作。仍活跃的判据（任一成立即保留）：alternatives、ownership boundary、negative guarantee、durable/wire semantics、security rule、reintroduction condition。且 \"word count and age are discovery aids, never archive criteria.\"、\"Do not archive toward a quota.\"\n\n**为什么归档不可编辑（逐字）**：\"Once sealed, every archived triplet is permanently frozen. Do not edit, translate, reformat, update, move, or delete it, and do not treat it as authority for current behavior.\"——归档即宣布它不再对当前行为负责；若仍可编辑就会与 implemented note「随代码同步」的义务冲突，变成第二份会过期的权威。故 gate 跳过 archived 源（含其出链）。归档唯一允许的内容改动：在 `Status: implemented` 正下方插入同一值的 `Archived: YYYY-MM-DD`（两个语言文件）。\n\n**格式要求（全部由 gate 强制）**：\n\n- 路径 `{lifecycle}/{class}/yyyy-mm-dd-topic-title.md`，日期取主题**首次提出日**（按 git 历史）。\n- class 为封闭集合：feature / bug-fix / simplification / architecture / process / testing——architecture = 发布的源码结构；process = 源码周边工具与流程；**刻意没有 refactor**。\n- 禁建中心化 INDEX.md。\n- 头三行固定为 `# Agent Note: \u003ctitle>`、空行、`Status: \u003cstatus>`；Status 仅三形式（proposed / implemented / `rejected — \u003c一行原因>`），不带日期与括号，且必须与所在目录一致（gate 交叉校验）。\n- 正文必以 `## Problem` 开（能在没有方案的情况下独立成立）。\n- proposed 章节：Problem / Proposal / … / Alternatives considered / Acceptance criteria / Risks；implemented：Problem / Decision / … / Alternatives considered / Consequences。gate 拒绝 implemented 中的 `## Proposal`、`## Plan`、`## Migration plan`、`## Acceptance criteria`（spec-speak）。\n- `## Alternatives considered` **强制**且必为真替代：每个真替代一段加粗开头，或有争议的写 `### Why not \u003cX>?`。\n- 决策与架构约束（逐字）：\"An Agent Note is never edited into a *different decision*: supersede it with a new one, and keep both notes cross-linked.\"\n- `.zh.md` 逐节镜像英文结构，机器校验的 header token（`# Agent Note: ` 与 Status 行）保持英文原样。\n\n### A.3 可迁移点（原报告）\n\n**个人**：① 固定四段模板（问题 → 决策 → 替代方案（为什么没赢，必填）→ 后果）；② 写前先问「这条属于哪一层」，一事实一家，重复规则 grep 特征短语合并；③ 当前状态进文档、理由进决策记录、事故进复盘、临时想法只进 Dev Note（\"Dev Note is the only slop zone.\"）；④ \"the only admissible evidence for an operation claim is having run it\"——跑不了就写「未验证 + 验证 owner」；⑤ 决策变更用新记录取代旧记录 + 双向交叉链接。\n\n**≤10 人团队最小可行**：`notes/{proposed,implemented,rejected,archived}/{class}/yyyy-mm-dd-title.md`；class 裁到 4 个（feature / bug-fix / architecture / process）；三条准入规则 = 非机械改动同 PR 必加或更新一条、每条必写 Alternatives considered、新建时做 supersession 扫描；归档即冻结、只作历史链接目标；给 AGENTS.md / README 设字数上限，超限按 relocate → condense → raise。\n\n**未验证项**：①「audience-first hierarchy」精确定义；② `dsh-doc/references/review.md` 与 `dsh-prose-standard` 未读（后者由报告 C 补上）；③ `scripts/verify-archived-agent-notes.ts` 实现细节。\n\n## 报告 B：性能与可靠性\n\n**源文件**：`.agents/skills/dsh-speed-up-perf/SKILL.md`（92 行）、`.agents/skills/dsh-ci-test-reliability/SKILL.md`（131 行）\n\n### B.1 定位（逐字）\n\n- perf：\"Turn a broad “make it faster” request into reproducible user-path measurements and small, evidence-backed fixes.\"；\"This is guidance, not a quota or a script: survey broadly, follow measured cost, and reject attractive changes that do not improve the workload users actually run.\"\n- ci：\"Build tests that remain correct under the repository's real CI topology, not only when run alone on a quiet workstation.\"；\"Process isolation does not isolate host ports, predictable filesystem paths, external services, databases, sockets, or inherited child processes.\"；\"Do not serialize an entire suite merely because one fixture lacks isolation.\"\n\n### B.2 性能七步\n\n1. **定范围**：读 AGENTS/architecture/testing/defensive-patterns，约定五项——可见终点、负载范围、资源约束、可接受行为差异、**停止规则**。后端与浏览器端到端分开：\"a fast history iterator or Client fold does not prove fast transport, paint, scrolling, or input response\"；本机开销须排除 model/网络延迟并声明。\n2. **核对确切当前 base**（merged diff / 源头 / 测试 / 已解决线程）；PR 正文可能描述已废弃实现，历史证据 \"not authority to reintroduce their implementations\"。\n3. **Survey 用户路径 → 排序候选**：冷启动与首读 / 多轮与工具重型历史 / 首绘·滚动·翻页·激活隐藏视图 / 流式与重连；区分独立成本驱动力（bytes / events / records / deltas / turns / tools / children / DOM nodes）。每个候选须写明：生产消费者、重复工作、期望复杂度、最小可伪证干预、必须稳定的行为。\n4. **先建真实合成基准**：扩展现有 required lane，不另立基建；只能提取**聚合**负载特征。\n5. **写 measurement card 后才实现**；Node 测构建后 JS（plain Node），浏览器用构建产物 + 支持的 profile；\"Do not add a production export solely for measurement or copy the algorithm into a “benchmark implementation.”\"；冷样本用 fresh child + 私有临时 root，warm 显式保留 cache，两侧输入/校验/完成条件一致。\n6. **先证回归再删工作**：改前跑未优化负载，存「命令、revision、runtime/platform、fixture 维度、原始值、裁决」；缩小到仍触发真瓶颈，再排可伪证假设。\n7. **一次一个因果因子**，重跑聚焦场景 + 端到端父场景，必须 negative control：\"the tightened assertion fails on the original implementation or a controlled reintroduction of the targeted cost.\"\n\n**measurement card 七字段（逐字）**：\n\n| 字段 | 要求 |\n|---|---|\n| User operation | \"Exact action and externally observable completion condition\" |\n| Workload | \"Fixed dimensions, distributions, construction seed/constants, and why they exercise ordinary and tail use\" |\n| Entry path | \"Production calls/composition and built artifacts; mocked external boundaries\" |\n| Clock | \"Included setup, cold/warm state, timing start/end, and excluded costs\" |\n| Memory | \"Reachable endpoint objects, baseline, GC policy, retained versus transient limits\" |\n| Verdict | \"Raw samples, chosen aggregate, calibrated absolute/ratio/memory limits, and negative control\" |\n| Behavior | \"Owning functional tests/snapshots and permitted minor differences\" |\n\n**不算证据清单（完整）**：怀疑的循环 / 未用缓存 / 大文件（\"A suspicious loop, unused cache, or large file alone is not evidence of a bottleneck.\"）；历史迭代器或 Client fold 快不代表传输、绘制、滚动、输入响应；\"Node folds, fake DOMs, and custom heartbeat events alone cannot establish browser responsiveness.\"；\"A parse-and-discard baseline is not comparable with validated retained history.\"；未区分 merged / closed-unmerged / superseded / estimated / newly-measured 的历史 PR 数字；调阈值——\"Do not widen a budget or select a lucky run to hide a regression.\" 且 \"A threshold so generous that the regression passes is not protection; a budget below a verified noise floor is not reliable either.\"；手工浏览器诊断**无阈值**，浏览器预算须先在真实 CI runner 重复测量才可落为源码常量。另一条底层原则：\"Faster execution with unbounded retention is not an automatic win.\"\n\n**隐私红线（逐字）**：\"Never copy prompts, outputs, paths, identities, IDs, credentials, recordings, or recognizable snippets into fixtures, logs, screenshots, PRs, or artifacts. Generate fixed inputs from reviewed constants; no benchmark depends on the user's home, ambient repository, network service, or private data.\"\n\n### B.3 CI 可靠性：分类与防护\n\n先建模拓扑（可重叠）四层：同文件测试 / 不同 Vitest 文件或 worker 进程 / 同 job 内独立进程 / 共享一台宿主的不同 Actions job。每个已获取资源须点名：owner、原子分配机制、可观测就绪信号、登记清理、静默完成信号。\n\n| 类别 | 防护 |\n|---|---|\n| 并发/隔离 | \"Use the resource owner's allocator instead of checking availability and claiming it later.\"；不因单个 fixture 串行整套 |\n| 端口/网络 | 回环 `listen(0)`，服务报 listening 后才读地址；\"Never scan for a free port and bind it later.\" |\n| 共享路径/资源 | `mkdtemp` per-test 私有根；db/socket/session/输出唯一命名空间；必须不存在时 exclusive creation；录制标识与临时地址分离并在 fixture 内翻译 |\n| 进程全局态 | `process.env`、`cwd`、fake timers、locale/timezone、module mocks、registries、console hooks、`globalThis`、global `fetch` 拦截 = 独占可变资源；优先注入依赖；必须改时 capture 原值存在与否 → 恢复原状 → 立即登记 → `try/finally` 最小作用域 → `afterEach` 兜底 → 只拦最窄目标请求 |\n| 平台语义 | 回写仅在断言容忍回写失败时安全；NTFS 100ns 滴答不给分数毫秒，依赖回写时取 fresh read；Windows 环境变量名大小写不敏感；Windows 句柄异步释放 → 按实测争用做有界重试；无 POSIX 权限/信号语义 → 显式平台 skip 并注明理由 |\n| 超时预算 | `describe`/case timeout 覆盖 runner 的 `--testTimeout`（低于 lane 预算即收窄 CI 已给的）；进程创建型套件取 lane 预算；hook 预算随 test 预算同升 |\n| 同步 | \"A fixed sleep is not evidence that setup completed or cleanup settled.\"；等显式就绪事件/握手/状态转移/自有 promise；deferred/barrier 钉住竞态；\"Use a timeout only to bound a wait, never as the condition that makes the assertion correct.\"；不断言调度器顺序 |\n| 释放到静默 | 获取后立即登记清理；停止新回调、解绑监听、恢复全局钩子、终止自有工作，并 await 子进程退出/服务关闭/worker 终止；\"Calling `abort()`, `close()`, or `kill()` without awaiting the owned completion signal is incomplete teardown.\" |\n\n**「可靠」的判定（不是「多跑几次都过」）**：① 修复前能观察到普通回归失败，新 guard 临时引入被拒用例能观察到预期失败；② 竞态用 barrier 证重叠——\"repeated execution alone is not a race test\"；③ 端口/共享路径/子进程类改动须并发跑独立进程验证跨进程隔离；④ fixture 自设 deadline 时先断言无 signal/timeout 结束子进程；⑤ 验证外部状态/事件/文件/日志/退出/释放而非组件自报；⑥ \"Stress runs supplement a deterministic regression; they do not replace one.\"；⑦ 证据按风险配：全局变更→恢复证据，生命周期/子进程→静默 teardown 证据，共享路径→并发独立进程证据，新 guard→negative control。报告 \"do not describe retries, skipped tests, or pending CI as passing\"。\n\n**反模式（逐字，八条禁令）**：\"increasing a timeout without identifying the awaited state; adding retries; making all files serial; swallowing an error or unhandled rejection; weakening an assertion; normalizing away unstable behavior; adding a sleep before cleanup or assertion.\" 例外：\"Retries remain valid for documented transient external-provider tests under the real-API policy. Keep that exception at the external boundary.\"；\"Restoring a budget is not masking.\"\n\n**延伸阅读**：`dsh-ci-test-reliability` 引用的 `references/ci-flake-diagnosis.md`（诊断既有 flake 的只读工作流）未读。\n\n## 报告 C：写作规范与推理痕迹\n\n**源文件**：`.agents/skills/dsh-prose-standard/SKILL.md`（含 `references/examples.md`、`references/recall-batteries.md`）、`.agents/skills/dsh-trim-cot-leakage/SKILL.md`\n\n### C.1 定位\n\n- **prose-standard**：决定该写多少、写在哪、按位置必须覆盖哪些契约（不够要补写）——\"This is not a one-way shortening pass.\"\n- **trim-cot-leakage**：清掉视角停在「写作会话」而非仓库的推理残留（失效引用／变更叙事／对已离场评审辩解）。\n- 两者是配套关系：trim 把 prose-standard 的 complete-proposition 规则作为前置依赖引用；单独用 trim 会过度删减，故后者专列 overcorrection traps。\n\n### C.2 prose-standard 核心原则（逐字）\n\n1. \"Write enough to preserve the contract, then remove reasoning transcripts, repetition, and decoration.\"\n2. \"A smaller word count alone is not an improvement.\"\n3. \"One explanation has one home; essential contract facts may repeat locally.\"\n4. \"Keep non-obvious rationale when omitting it could plausibly cause misuse or an incorrect simplification.\"\n5. \"Comments describe non-obvious contracts or rationale that code cannot express; they do not restate what code already implies.\"\n6. \"Keep a complete local contract at the point of use\"\n7. \"treat wording as behavior\"\n8. \"This is not a one-way shortening pass.\"\n\n### C.3 prose-standard 规则\n\n**契约判据**：caller／callee／implementer／producer／consumer 依赖的 obligation、invariant、precondition、postcondition、compatibility promise；判据是「caller 推不出才写」。\n\n**完整命题五要素**：actor and action；condition, timing, and ordering；modality（must / may / never）；negative guarantee and exception；ownership, side effect, failure mode, and consequence。修剪前提：\"Remove adjectives, repetition, and narration only when every factual clause survives\"。\n\n**按位置必须覆盖**：Public JSDoc（return distinctions、throws/rejections、side effects、ownership、timing、cancellation、durability）；Internal comments（invariants、race ordering、security boundaries）＋\"Delete control-flow narration and code restatement\"；其后依次点名 Module comments / Tests / Cookbooks / READMEs / Agent Notes / Postmortems / Skills / Examples / Prompts / Diagnostics 共 11 类（如 Tests 只解释 non-obvious test design，删 walkthroughs；Diagnostics 要点名 failing subject or path、violated rule、correction）。\n\n**六分类动作**：keep, add, trim, restore, restructure, or defer；\"do not manufacture edits to satisfy a deletion target\"。borderline 定义 = 至少两版都满足完整命题、且本 skill 未化解取舍。\n\n**反例对（`references/examples.md`）**：把 \"serializes writes per session, flushes buffered events before disposal resolves, and reports backend failures\" 砍成 \"serializes persistence\"；\"normalizes provider errors\" 丢光 failure categories；删掉 \"Throws if initialization has not completed...\" 即丢 caller-visible contract；收尾判据 \"A package README is not a backlog dump.\"\n\n**误报家族（逐条点名）**：instrumental \"used to\"（the key used to sign requests）、`/v1/` 协议路径、\"This PR\" 出现在流程文档、本版本 vs 本版、runtime \"today\"。\n\n### C.4 trim-cot-leakage 规则\n\n**定义（逐字）**：\"Chain-of-thought leakage is prose whose vantage is the authoring session rather than the repository\"。\n\n**单测判定（逐字）**：\"could a reader at HEAD, with no access to any session transcript, PR thread, or uncommitted draft, resolve every reference and verify every claim?\"；\"resolvability only clears this skill's bar\"（在 README/docs/JSDoc 等 current-state 面仍属变更叙事）。\n\n**修复方式（逐字）**：\"The fix is never deletion alone when a passage carries factual clauses — restate each so it stands at HEAD, then delete the transcript around it; a passage carrying none (an audit code, control-flow narration) is deleted outright.\"\n\n**八类泄漏**：① 死设计会引用（`(decision 7)`、`(audit C2)`、`design §4.7`、phase labels 如 T4/W3/P-I）② stack/PR 视角（\"a later PR in this stack\"）③ 变更叙事与版本戳（\"used to\"、\"no longer\"、\"this cut\"、\"today\"）④ review choreography（\"Rejected in review:\"、draft ordinals）⑤ 为评审辩解（\"the cast is safe — it simply…\"）⑥ 复述与推导记录（\"first we X, then we Y\"、test walkthroughs）⑦ hedges（\"probably fine for now\"、\"should be enough\"）⑧ 作者语言滑落（端／设计稿／`---- 私有 ----` 混进英文 prose）。\n\n**每条给「改成什么」**：固定回归写现在时反事实 \"without X, Y happens\"；延期挪 TODO/issue；hedge 提升为 TODO/FIXME 或写真实上界。\n\n**keep 白名单（不得误删）**：issue 引用 `#1470`、`TODO(name)`、suppression 理由（oxlint-disable / coverage-ignore / 空 catch）、**measured 界**（\"the provenance word 'measured' is load-bearing\"）、runtime old/new、外部标准 §、note 的 Alternatives-considered。\n\n**边界（逐字）**：\"the §-ban covers uncommitted internal drafts, not external standards or committed docs that own their §-numbering.\"\n\n**探针阈值与用法**：`rg --hidden` 且排除 glob 必须写在最后；自然语言行加 `-i`（含 `\\bT\\d\\b` 的首行保持大小写敏感）；短语加词边界（\"`\\bthis PR\\b` must match 'this PR adds' without matching 'this project'\"）；每个探针先命中已知正例、再拒绝近邻负例才能信；\"The batteries are probes, not the definition\"。\n\n**流程**：显式 scope（缺失就停下报告，不自行推断仓库级）；永不动 `vendor/` 与 `.agents/notes/archived/`；**owner-first**（\"Edit the owning source or scenario first, then regenerate every derivative\"）；删前枚举命题并查 overcorrection traps（把义务翻成背书、假设升格为已交付、删真事实、丢 provenance）；验证重跑只允许 sanctioned keeps。\n\n### C.5 可迁移点（原报告）\n\n**个人**：注释先问\"caller 推不推得出\"，推得出的分支一句不写；文档一事实一个 home、局部留契约＋外链理由；commit/PR 正文不写\"本轮修订/评审要求改\"；与 AI 协作时说\"只保留契约、删掉推导\"比\"精简点\"有效；\"A rewrite with one proposition-preserving answer is not borderline\"说明别让 AI 处处提问——交互时给 2–3 个可行版本＋推荐＋事实差异。\n\n**工具**：8 类泄漏可落成 rg 探针批（官方自己就这么用），在 SSiD 里是最易实现的自研检查门（lint 插件或 commit-msg / CI gate）；**探针必须带正负例校准 + 白名单，否则误报会摧毁规则可信度**；可落地门禁还有「跨文件引用必须在 HEAD 可解析」「禁 indexical」「prose 预算」「双语成对最小同步」；最强一条是 owner-first，与工作区铁律 5「双处声明」同源；`examples.md` 的 over-trimmed 版可直接当负例回归语料。\n\n## 报告 D：审查、简化与提交\n\n**源文件**：`.agents/skills/dsh-code-review/SKILL.md`、`.agents/skills/dsh-find-simplifications/SKILL.md`、`.agents/skills/dsh-pre-push-checks/SKILL.md`\n\n### D.1 定位（逐字）\n\n- code-review：DSH PR 审查导向器——接到仓库既有标准（AGENTS.md、防御性模式、ADR、质量门），并补上代码本身看不出的检查。\n- find-simplifications：把「找简化点」的宽泛请求变成有证据的 Agent Note，真正删除/折叠既有表面积。\n- pre-push-checks：推送/标 ready 前，选出覆盖本次 diff 的**最小**检查集，而非反射式跑全量套件。\n\n**共同元原则**：三者都声明自己是导向不是清单——\"This skill is guidance, not a complete checklist.\"（simplifications 版为 \"It is guidance, not a checklist\"）；pre-push 的等价声明是 \"There is no universal local baseline beyond the hooks.\"\n\n### D.2 code-review\n\n**顺序**：核对 checkout 与分支 → 验证 live base/exact head → 跑 `pnpm --silent run change-scope --base \u003cverified-base-ref>` → **再**读 diff 与足量周边码 → 按 SSoT 清单逐项过（AGENTS.md、packages/AGENTS.md、defensive-patterns.md、testing.md、Agent Notes、i18n）；该报告只给路径与脏层，\"does not replace semantic review\"；retarget/merge 后重建 base 并重跑范围报告。\n\n**优先级（逐字）**：\"Prioritize correctness, lifecycle, security, and broken required behavior over style; **a short review with one substantiated blocker is better than a list of nits.**\"\n\n**分级**：7 条 Blocking requirements（新增文案必须语义审查；文档与代码同 diff 同步；核心类型与 type-equiv；注册可清理；不变量伴生必须语义化；必需证据存在；客户端 UI 文案归 locale）+ 一长串 Manual checks（接口两侧契约、生命周期与并发、能力与消费者匹配、范围与必要性、配置默认、模型视角、denial 路径、借用 vs 拥有、边界覆盖最终操作、真实入口路径、测试强度与可靠性、不变量负向控制、Agent Note 与已发布现实、transcript、双语文案）。\n\n**分级处置（逐字）**：\"Separate blockers from suggestions and omit issues already enforced by a green gate.\" 局部缺陷 inline 贴最紧 diff 范围，跨切面用 PR 级评论；每条给 defect / location / impact / evidence。无合理关系的不变量伴生须整体删除（export、构建入口、专用测试）并在 README 记 package 专属理由：\"Reject empty installers and invented checks\"。\n\n**两条边界（逐字）**：\"Automated checks do not establish those properties.\"；\"Coverage is necessary but not evidence that the scenario is correct.\"；对既定决策：\"Treat disagreement with an Agent Note as a design discussion, not an automatic veto.\"；收到 review 时 \"verify each claim and fix or rebut it on technical grounds without performative agreement.\"\n\n### D.3 find-simplifications\n\n**判据（逐字）**：\"A strong simplification removes, folds, or demotes something real and has clear evidence that the current design costs more than it buys\"；取舍 \"prefer a few well-proven candidates over a pile of thin guesses\"；\"Do not let the first good candidate stop the survey.\"；替换净值 \"A wrapper that relocates the same complexity is not a win.\"\n\n**怎么找**：先读 AGENTS.md 的 pre-release stance 与两条 doctrine（tests-are-not-golden-truth、Agent Notes-are-not-golden-truth）与 architecture.md，**先标出有意架构与 protected seam**；用并行 subagent 分域（agent loop/session log、ACP+UI、LLM/tools/prompt、bash/工具执行、packages/scripts/tests），\"require evidence, not guesses\"，从生产代码最大 delta 起步；证据法为先 `rg` 精确 symbol / event name / config key（`.name(` 与 `name(` 两写）/ wire string，再读 call sites；消费者分 production / non-production / ambiguous 三类。\n\n**非显而易见的强候选**：无生产消费者的公共方法/事件/配置项/注册通知/包/持久事件；\"Tests or docs are the only consumers, and the behavior they pin is not load-bearing.\"；\"Two representations mirror the same fact, especially across durable session events and transient `agent/*` events.\"；seam 有所有实现都必须支持却无人用的方法；独立 package 只服务测试并增加发布开销；推测性产品通用性（multi-session、background job rosters、live registry invalidation、tool-owned UI rendering）；只为保护无人调用 API 的不变量/回滚/期望输出；手写代码重实现了 Node builtin 或维护良好的 npm 包且替换能连实现与专用测试一起删。放宽条款：\"The simplified behavior may differ slightly, but the new behavior is still reasonable and easier to explain.\"\n\n**反模式**：① \"Thin candidates are not enough for an Agent Note: deleting one typo, running `knip` once, removing an intentionally documented backend/adapter, or flagging \"this looks complex\" without call-site proof.\"；② 四条 reject/downgrade——有生产调用方（属功能决策非清理）／被已实施 Agent Note 或来之不易的防御模式证成／只造成无关 churn 而不减公共 API 或必需行为／想法对但太小（改加定向 TODO/FIXME/XXX，\"Do not add TODOs for speculative complaints or for behavior that needs an Agent Note-level decision.\"）；③ \"Treat dual LLM adapters as intentional by default.\"，不把 twin adapter 或 persistence seam 当「低成本」删；④ 依赖替换须 \"beat the recorded rationale, not just cite the policy\"；⑤ 只有完全不出现在生产码/配置/格式/迁移中的特性才算 full supersession，否则留 partial 并交叉链接。\n\n### D.4 pre-push-checks\n\n**选择律（逐字）**：\"Every behavior change needs the narrowest available test or purpose-built check that would fail for its regression; add broader checks only for surfaces the diff actually reaches.\"\n\n**为什么本地不跑全量**：hooks 故意窄（pre-commit 只修 staged lint、查 staged 空白、守 vendor 元数据；pre-push 只跑增量 typecheck），\"CI owns exhaustive coverage and the platform matrix.\"\n\n**怎么决定**：确认 checkout/分支 → 验证 live PR base 或 stack parent（该命令 \"never guesses or fetches a base\"）→ `change-scope --base \u003cverified-base-ref>` → 按变更类型取最窄证据；merge 新 base 后重跑报告并**只重跑被 merge 失效的检查**。\"Test selection and coverage selection are separate.\"：覆盖率须显式声明被测源范围；`vitest related` 发现不了只经配置、动态加载、子进程、worker、构建产物、外部 provider 到达的行为，须显式点出拥有者测试。\n\n| 变更类型 | 应跑证据 |\n|---|---|\n| 包/脚本行为 | 拥有该行为的 Vitest 文件或 focused test name；共享契约加相邻包测试；仓库级留给 CI |\n| Remote mock 类型 | `pnpm run typecheck`（unbuilt `any` 只是 \"explicit local fallback, not strict evidence\"） |\n| 文档/Agent Note/catalog | `pnpm run doc-sync`，文档工作流要求时 full lint |\n| 模型/编辑器/CLI/终端可见输出 | 拥有该输出的 focused keyless snapshot 或真实可运行示例 |\n| 期望输出位置 | session 往返 → 顶层 `snapshots/`；其余 → 测试旁 `tests/expected/` |\n| Profile/配置位置 | 跨包 → `apps/cli/tests/profiles/`；包内 → 该包 `tests/fixtures/`；用户 overlay → `apps/cli/config/examples/` |\n| manifest/公开导出/构建配置/bin 入口 | `pnpm run build` + hygiene + 构建产物 smoke |\n| 真实 provider/agent | 相关 `pnpm run test:e2e`（有凭据时）；\"never print secrets\" |\n\n**全量本地排练**仅三种情形：用户明确要求、诊断 CI 失败、变更广到没有更窄集合可信；且 \"Use the current workflow and package scripts as the inventory; do not recreate the removed `check:pre-push` aggregate.\"\n\n**严禁**：重复已通过的检查（\"do not run typecheck immediately before pushing solely to duplicate the pre-push hook\"）；用 `--passWithNoTests`、降阈值、缩 include 掩盖未覆盖文件；\"Raw `--force` is never allowed.\"（rewrite 用 `--force-with-lease=\u003cbranch>:\u003cobserved-oid>`）；push 后指望 CI 不同（\"Do not push and hope CI differs.\"）；把平台失败含糊成环境问题（须记录精确命令、失败测试、平台差异，绕过 hook 仅在用户同意时）；`gh stack sync` 成功即称 stack ready；`gh pr checks` 报 \"no checks reported\" 就怀疑基础设施——PR 为 CONFLICTING/DIRTY 时 GitHub 不建 pull_request run，\"total_count: 0\" 即冲突，空提交 / `--allow-empty` / draft 切换 / revert 反弹都无效且污染历史。\n\n### D.5 可迁移点（原报告）\n\n**个人**：① 提交前自检按「回归时会失败的最窄测试」选证据，不习惯性全量；hook 故意窄是设计。② 不重复已通过的检查——重复不产生信息，只产生虚假确定性。③ 让 AI 审查的提示词：先给 base/head，要求**先出范围报告再读 diff**；要求\"少而实\"；blocker 与 suggestion 分栏、跳过已被绿灯门禁覆盖者；每条给 defect/location/impact/evidence；明说对已实施决策的分歧按设计讨论、不许一刀否决。④ 提简化请求的提示词：先列有意架构与 protected seam，分域并行调查并要求 call-site 证据，明令禁止 thin candidate 与「看起来复杂」。⑤ 收到 review：逐条验证，\"fix or rebut it on technical grounds without performative agreement\"。⑥ rewrite 纪律：lease 保护；rewrite 后旧 commit hash 与评论锚点不算证据，须重查 heads/线程/检查。\n\n**工具**：① 移植 `change-scope`（显式 base → 变更路径 + 受影响包与脏层，作选检查的唯一入口；绝不猜 base）。② 固化「diff → 检查集」映射为脚本，输出应跑命令清单；全量排练需显式开关，缺省不跑。③ 覆盖率绑定门禁：选中测试必须声明覆盖源范围，禁 `--passWithNoTests` / 降阈值（可接 SSiD 的 L1 typecheck+test 门槛）。④ 「消费者证据」门禁：新增导出/配置项/事件须能列出生产调用方，否则拒收或降级为带稳定标签的 TODO。⑤ 可机械化的文档/文案门禁：对照 `verify-export-jsdoc`、`verify-doc-budgets`、`verify-client-ui-i18n`、`verify-cordis-config`、`doc-sync`。⑥ 不变量与负向控制：新增守卫须证明存在可独立分叉的观测，且每条变更的验收路径证明会拒绝无效输入。⑦ 推送规程：`--force-with-lease` 强制、raw `--force` 禁；「无检查运行」先读 mergeable 再怀疑基础设施。⑧ 决策记录：非平凡变更同 PR 带 Agent Note（proposed→implemented→archived、归档冻结、一事实一归属）。\n\n**三份报告的公共骨架（原报告结语）**：「**先证据后判断**——范围报告先于阅读，call-site 先于结论，最窄证据先于全量；把「必须改」与「可以不改」显式分栏，把「已由绿灯门禁覆盖」排除在讨论之外。」\n\n"},{"file":"2026-09-10-DSH工程方法论学习笔记.md","date":"2026-09-10","slug":"DSH工程方法论学习笔记","title":"DSH 工程方法论学习笔记（2026-09-10）","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["dsh-prose-standard","dsh-trim-cot-leakage","dsh-code-review","dsh-find-simplifications","dsh-pre-push-checks","dsh-speed-up-perf","dsh-ci-test-reliability","dsh-doc","dsh-archive-agent-notes","dsh-translate-docs","dsh-merging-stacked-prs","#5"],"summary":"「先证据后判断」展开成三条次序： 1. 范围报告先于阅读代码——先跑 change-scope，再读 diff。 2. call-site 先于结论——没有生产调用方证据，就不算「可删」。 3. 最窄证据先于全量——回归时会失败的那个测试，胜过整套跑一遍。","bytes":15744,"lines":161,"body":"# DSH 工程方法论学习笔记（2026-09-10）\n\n> 目的：用户背景是「用自研 SSiD 做 AI 原生中台服务开发」，学习目标有两个——① 升级个人工作方法论；② 升级 SSiD 工具本身。\n> 素材：DSHfork @ `origin/master`（`c291e7961a`）的 8 个 skill 全文，由 4 个 subagent 精读后交叉核对；原文引用均逐字核对。\n> 配套：结构与规模（12 skill / 960 篇 Agent Notes / 215 脚本）见 `2026-09-10-DSH官方工程化范式调查.md`，本篇只讲**方法论与可迁移点**。\n\n> 状态：记录（推断 · 2026-09-12）\n\n## 一、八条核心方法论（跨 skill 提炼）\n\n| # | 原则 | 原文依据 |\n|---|---|---|\n| 1 | **证据驱动**：任何结论须有可复现证据 | \"A suspicious loop, unused cache, or large file alone is not evidence of a bottleneck.\" |\n| 2 | **最小必要**：最窄的测试、最小的改动、最小检查集 | \"Every behavior change needs the narrowest available test or purpose-built check that would fail for its regression.\" |\n| 3 | **一个事实一个家** | \"Each fact has one home: the tier whose job it is; elsewhere, link there.\" |\n| 4 | **决策必留替代方案** | \"A decision recorded without what it beat invites re-litigation — the failure Agent Notes exist to prevent.\" |\n| 5 | **当前状态而非变更史** | \"Document current state, not change history.\" |\n| 6 | **机器强制优于人类自觉** | Gates 体系本身（约 50 个 `verify-*` 在 CI 里拒绝违规） |\n| 7 | **资源点名**：owner / 原子分配 / 就绪信号 / 清理登记 / 静默完成 | \"Use the resource owner's allocator instead of checking availability and claiming it later.\" |\n| 8 | **反模式显式化** | 明文列出\"不得作为根因修复\"的手段（见 §2.4） |\n\n### 1.1 三条共享次序（三个 skill 的公共骨架）\n\n「先证据后判断」展开成三条次序：\n\n1. **范围报告先于阅读代码**——先跑 `change-scope`，再读 diff。\n2. **call-site 先于结论**——没有生产调用方证据，就不算「可删」。\n3. **最窄证据先于全量**——回归时会失败的那个测试，胜过整套跑一遍。\n\n### 1.2 一条容易被忽略的纪律\n\n把「必须改」与「可以不改」显式分栏，并把已被绿灯门禁覆盖的问题排除在讨论之外——重复检查不产生信息，只产生虚假确定性。\n\n## 二、五组 skill 的方法论\n\n### 2.1 写作：`dsh-prose-standard` + `dsh-trim-cot-leakage`\n\n**两者关系**：前者管\"写够、写在哪\"，后者管\"删什么\"；单独用 trim 会过度删减。\n\n**契约判据**：只写 caller **cannot infer** 的内容（义务、不变式、前后置、兼容承诺）。\n**完整命题五要素**：actor and action ／ condition–timing–ordering ／ modality（must·may·never）／ negative guarantee and exception ／ ownership–side effect–failure mode–consequence。\n**修剪前提**：\"Remove adjectives, repetition, and narration only **when every factual clause survives**\"。\n**六类动作**：keep / add / trim / restore / restructure / defer；\"do not manufacture edits to satisfy a deletion target\"。\n**两条反直觉规则**：\n- \"A smaller word count alone is not an improvement.\"\n- \"Keep non-obvious rationale when omitting it could plausibly cause misuse or an incorrect simplification.\"\n\n**CoT 泄漏的定义**：\"Chain-of-thought leakage is prose whose vantage is the authoring session rather than the repository\"。\n**单测判定**（可直接当工具用）：\n> \"could a reader at HEAD, with no access to any session transcript, PR thread, or uncommitted draft, resolve every reference and verify every claim?\"\n\n**修复方式不是单纯删除**：\"The fix is never deletion alone when a passage carries factual clauses — restate each so it stands at HEAD, then delete the transcript around it\"。\n**八类泄漏**：死设计会引用（`(decision 7)`、`design §4.7`、阶段标签）／stack/PR 视角／变更叙事与版本戳（used to, no longer, this cut, today）／review choreography／为评审辩解／复述与推导记录／hedges／作者语言滑落。\n
