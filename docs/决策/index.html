这种漏洞在结构上不可能发生。**\n\n**⑧ 结论要附带它够不到的边界。**\n\"确立了版本与路径兼容性，**不是容量保证**\"；\"只有一个样本，**不能把差异归因于并发**\"。\n\n**⑨ 清理要等所有所有者结算。**\n\"失败的泳道等另一条完成再清理——**延迟失败报告，但避免删除仍被子进程持有的文件**。\" **报告的及时性让位于资源的正确释放。**\n\n---\n\n## 进度与下一步\n\n**进度 44/47（94%）**。剩余 3 篇，均为基础设施细节：\n\n- `2026-09-06-preview-hosted-runner-sizing.md`\n- `2026-09-06-python-runtime-windows-hosted.md`\n- `2026-09-09-blacksmith-failover-leg.md`\n\n下一批读完这 3 篇（预计快速扫读），即达 **47/47**，然后进行**收束**：把 14 个批次的「共同判断标准」合并去重成一份可直接查阅的总清单。\n"},{"file":"2026-09-10-DSH过程决策精读-15-回退参与者清单与默认值.md","date":"2026-09-10","slug":"DSH过程决策精读-15-回退参与者清单与默认值","title":"DSH 过程决策精读 · 第 15 批：回退、参与者清单与默认值","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["dsh-win-ci","dsh-win-ci-16","dsh-win-ci-21","dsh-win-ci-04","#3629","#3640","#3337"],"summary":"2026-09-06-preview-hosted-runner-sizing.md","bytes":15905,"lines":246,"body":"# DSH 过程决策精读 · 第 15 批：回退、参与者清单与默认值\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇 = 最后一批，47/47 完成**。\n> 三篇都在处理\"变更的边界\"：一个度量机制如何改变结论、一次失败的迁移如何完整记录、一个开关的**参与者清单**怎么划。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [实测的 PR preview runner 尺寸](#1-实测的-pr-preview-runner-尺寸) | 每分钟价格低，不保证每 job 成本低 |\n| 2 | [Windows Python 运行时回退到托管](#2-windows-python-运行时-ci-回退到托管) | **一份完整的失败迁移记录** |\n| 3 | [Blacksmith 作为故障切换腿](#3-blacksmith-作为-ci-池的故障切换腿) | 参与者清单必须逐个点名 |\n\n---\n\n## 1. 实测的 PR preview runner 尺寸\n\n`2026-09-06-preview-hosted-runner-sizing.md`\n\n### 他们遇到的事\n\n一个容易被忽略的计费机制，写在 Problem 的第一句：\n\n> **A lower per-minute runner price does not guarantee lower job cost because GitHub rounds each job upward to whole minutes.**\n\n**更低的每分钟 runner 价格，不保证更低的每 job 成本——因为 GitHub 把每个 job 向上取整到整分钟。**\n\n于是\"换更便宜的 runner\"这个直觉需要实测，而不是按单价推算。\n\n### 测量结果\n\n| Runner | 冷 / 热 job 秒 | 取整分钟 | 每个 USD | 工作区秒（冷/热） | preview 秒（冷/热） |\n|---|---:|---:|---:|---:|---:|\n| standard, 2 vCPU | 202 / 203 | **4** | **0.024** | 138.92 / 147.21 | 12.65 / 12.94 |\n| larger, 4 vCPU | 177 / 162 | 3 | 0.036 | 124.21 / 114.86 | 10.77 / 9.88 |\n| larger, 8 vCPU | 154 / 154 | 3 | 0.066 | 110.51 / 110.77 | 9.20 / 9.21 |\n| larger, 16 vCPU | 124 / 125 | 3 | 0.126 | 90.57 / 84.99 | 7.62 / 7.33 |\n\n结论：**标准版比 16 核便宜 80.95%、比 4 核便宜 33.33%**，代价是**比 16 核多 78 秒**。\n\n注意那个\"取整分钟\"列：标准版 202 秒取整成 **4 分钟**，而 16 核 124 秒取整成 3 分钟——**时间只差 78 秒，价格差 5.25 倍**。他们的判断是：**\"Preview 构建不足以证明那个 16 核溢价值得\"**（对一个以成本为焦点的决策）。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持 16 核 | 最短的实测 job，**但每个样本多花 $0.102 换 78 秒的改进** |\n| 选 4 核或 8 核 | 两者都成功并缩短构建，**但它们取整后的样本成本超过标准 Ubuntu**；4 核保留更多 RAM/磁盘余量**如果未来工作负载耗尽标准容量**——**而这样的改变需要新的测量** |\n| 移到自托管 | **被范围否决**：preview 留在 GitHub CI |\n\n第 3 条的措辞值得记：**\"Rejected by scope\"** ——不是\"做不到\"，是**\"这超出本决策的范围\"**。**范围本身可以是一个否决理由，而且要说清是范围而不是能力。**\n\n### 一段罕见的\"诚实到过头\"的边界说明\n\n- **标准版暴露 2 vCPU / 7.75 GiB RAM**，工作区最大进程 RSS 是 2.86 / 2.76 GiB，preview 是 0.76 / 0.74 GiB，都没有 OOM 或超时。但紧接着：\n\n  > **GNU time RSS is not simultaneous process-tree memory.** These samples establish **successful execution, not a permanent memory guarantee**.\n\n  **GNU time 的 RSS 不是同时的进程树内存**；这些样本确立**成功执行，不是永久的内存保证**。\n- **比较固定了源码、锁文件、命令和运行时版本，但没有固定物理 CPU 或镜像发布**：标准版和 4 核用镜像 `20260831.293.1`，8 核和 16 核用 `20260823.283.1`；**CPU 在 AMD EPYC 9V74/7763 与 Intel Xeon 8370C/8573C 之间变化**。\n- **\"每个缓存状态一个样本，测量的是所提供的标签，不是隔离的 CPU 伸缩或统计可重复性。\"**\n- 关于把生产 job 的开销加进来：\"**那是一个预测，不是实测的标准 runner 发布结果**\"\n\n### 他们承认的代价\n\n- **用大约 78 秒的采样构建延迟，换取更低的计算成本**\n- **\"不从这个单一实验外推任何小时或月度的节省。\"**\n- **临时的基准工作流和它的安全测试不在最终树里；实验提交和链接的 run 保留了方法和证据**——**临时物清理掉，方法与证据留下。**\n\n---\n\n## 2. Windows Python 运行时 CI 回退到托管\n\n`2026-09-06-python-runtime-windows-hosted.md` · **一份完整的失败迁移记录，这类记录很少见**\n\n### 他们遇到的事：带时间线的失败复现\n\n之前一次迁移（PR #3629）把 Windows x64 目标路由到自托管池。结果：\n\n> The shared `dsh-win-ci` pool **did not make the lane more reliable**.\n\n随后是一份精确到分钟的记录（全部 UTC，每个 run 都执行了那个 07:56 合并起生效的选择器）：\n\n| 时间 | 结果 |\n|---|---|\n| **09:12** | 在 `dsh-win-ci-16` 上，installed-wheel 冒烟**通过**（PR #3640 的 commit `ca3ffe95`） |\n| **10:06** | 在 `dsh-win-ci-21` 上**失败**（PR #3337） |\n| **10:46** | 在 `dsh-win-ci-04` 上**失败**（PR #3640 的最终 head `c5ba873f`）——`smoke_sdk_profile_plugin` 的打包 `dsh plugin add` **子进程无输出地退出**，而**同一次运行的 Linux 和 macOS cell 都通过了** |\n| **11:29** | 一次 job 重跑**重复了同样的静默死亡** |\n\n还有一句点出根因的话：\n\n> The migration proposal (#3629) remained **`proposed`** because its **throughput and shared-load acceptance criteria were never measured**.\n\n**那份迁移提案一直停留在 `proposed` 状态——因为它的吞吐量与共享负载验收标准从未被测量。** 换句话说：**没有测量验收标准，就上线了。**\n\n### 判断：完整回退\n\n- Windows x64 目标**总是使用它的托管 `matrix.runner`**，配标准工具链、pnpm 缓存恢复和 pkg 缓存\n- **failover 选择器、job 私有 Python setup 步骤、自托管依赖安装与 post-step 清理、私有 setup 脚本、以及那个路由 spec 全部被移除**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持 failover 路由 | **共享池在一天内重复了同样的静默子进程死亡两次，而迁移清单的吞吐量验收仍然开着；而且让一条正确性泳道经过 failover 状态，会把它耦合到一个无关的池故障开关** |\n| **修复共享池** | **留给池运维者**：观察到的失败是\"子进程无输出地死亡\"，**不是缺少镜像前置条件——而同一个镜像服务于原生 Windows failover job** |\n| 在托管镜像上保留 job 私有工具链 | **私有 uv/Python 下载的存在是为了避免改动一个常驻共享宿主；一次性托管镜像已经提供了迁移前泳道使用的已注册 Python 3.10 工具链** |\n\n第 1 条后半句是一个通用判据：**不要把\"正确性泳道\"接到\"故障切换开关\"上**——那会让一次无关的池故障影响到正确性信号的可用性。\n\n第 2 条也很干净：**\"这不是池配错了，是池本身不可靠\"**——承认问题归属不在自己这边，**然后把决策（回退）和自己的处置（不修池）分开**。\n\n### 一段\"给未来重试者的前置条件\"\n\nConsequences 的最后一部分列出了**四条必须重新建立的约束**：\n\n1. **setup-python 的 Windows 安装器会移除匹配的 machine/current-user 记录并为所有用户安装**——**私有 toolcache 不能隔离那个注册表状态**\n2. **每个构建缓存和临时测试根必须 job 自有，用复制导入而不是共享存储链接**\n3. **清理必须在成功、失败和取消时都运行**，带有界的 Windows 文件系统重试\n4. **只有 Windows x64 目标是可移植的——Linux 目标的 manylinux 检查需要 Docker**\n\n并且定下门槛：**\"未来的一次自托管尝试必须在实际池上重新验证吞吐量和失败可复现性，在任何路由变更之前。\"**\n\n**一次失败的迁移，留下的不是\"别再试了\"，而是一份\"要再试的话，先满足这些\"。**\n\n---\n\n## 3. Blacksmith 作为 CI 池的故障切换腿\n\n`2026-09-09-blacksmith-failover-leg.md`\n\n### 他们遇到的事\n\n第三方 runner 供应商的**迁移向导建议整体替换仓库的 `runs-on` 标签**。这在默认状态下不可接受，理由写得很完整：\n\n> it **breaks the workflow contract specs**, **distorts benchmark and performance-budget measurements**, and **moves trust-boundary jobs without a decision record**\n\n**它破坏工作流契约 spec、扭曲基准与性能预算测量，并在没有决策记录的情况下移动信任边界 job。** ——三个不同层面的理由，**没有一个是\"我们不信任第三方\"这种态度**。\n\n### 判断：一个显式开关 + 一份参与者清单\n\n`blacksmith` 作为一个**新值**加入两个 failover 变量。**只在设置期间花钱，所以它是显式的故障或实验选择，永远不是默认。**\n\n真正的工作量在**参与者清单**上——这份清单是这篇的核心价值：\n\n**参与的**：三个企业 Linux worker、`node-compat` 腿、`all-checks-passed` 裁决、四个 Windows 泳道、`expected-filenames`、sandbox bwrap 腿、两个手动基准矩阵。\n\n**不参与的（保持自己的 runner）**，按理由分类：\n\n| 类别 | 例子 |\n|---|---|\n| 被工作流 spec 钉在托管 runner 上 | `node-24-bench`、`python-sdk`、master Wine 门、`release-publish`、Cloudflare preview、加权审批对 |\n| **持有凭据** | real-API e2e 泳道、issue App-token job、npm 与 PyPI 发布器 |\n| **需要 Blacksmith 缺少的宿主能力** | Landlock 腿与其打包验证、Seatbelt 腿、linux-arm64 单 exe 腿 |\n| **release 形态的链** | npm/PyPI 发布器、node-addon-system release 链、Pages 部署——**因为它们的产物喂养已发布的 registry 输出** |\n\n以及两处\"有理由的不动\"：\n\n- **python-runtime 构建器完全保持托管**：它的调用者**传入真实 API 凭据**，它的 macOS/arm64 腿需要 GitHub 的镜像，**而它的 wheel 输出喂养 PyPI 发布链**\n- **release 演练 job 保持变更前的路由不变**：它们**只携带既有的 `selfhosted` 分支，所以在 `blacksmith` 下回落到托管默认值，且不获得 `blacksmith` 分支**——**没做的事也写明**\n\n还有一处与第 08 批呼应的细节：**blacksmith 分支不携带 Dependabot 排除**，因为**\"Blacksmith runner 是短暂的，所以让 Dependabot 留在托管池的那个'常驻 VM'理由不适用\"**。**同一个排除规则，在前提下失效时自动不适用——而这件事被写出来。**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 整体采用迁移向导 | **破坏工作流契约 spec、改变基准语义与性能预算校准，并作为默认把持有凭据和信任边界的 job 移到第三方基础设施上** |\n| 保持自建池作为唯一 failover 目标 | **它们是一个有界的备用；Blacksmith 为\"舰队本身即退化资源\"的故障与实验情形增加弹性容量** |\n\n### 一次精确到触发条件的故障归因\n\n试验暴露了一个 `verify-md-wrap` 在 Blacksmith 上失败的问题。归因写得非常克制：\n\n> The trigger is **the lstat-probe of a path beneath a matched symlink**, **not `**` over symlinked trees in general**: the other `globSync` `**` call sites that scan symlink-bearing trees **stayed green on the same run and needed no change**.\n\n**触发条件是\"lstat-probe 一个已匹配 symlink 之下的路径\"，而不是\"`**` 扫过含 symlink 的树\"**——证据是：**同一次运行里，其他扫描含 symlink 树的 `globSync` 调用点保持绿色，无需改动。**\n\n**用\"同类情况里哪些没出问题\"来收窄故障条件**，比笼统地说\"某个模式有问题\"精确得多。\n\n### 他们承认的代价（含未验证项的标注）\n\n- **blacksmith 腿保持休眠直到值被设置**，只在真实故障或显式实验期间被演练\n- **Blacksmith 把它的 runner 注册为 self-hosted，所以在该值下 `node-compat` 腿会真实执行它们的 toolcache 与隔离验证步骤**（而非跳过）\n- **基准矩阵的 8 和 32 vCPU 标签不在试验范围内，是按已实测的 4/16 vCPU 标签的命名对称推定的；首次使用前请用一次手动 dispatch 确认**\n- **Landlock、Seatbelt 和 linux-arm64 的排除仍基于更早迁移尝试的散文式 dispatch 实测，记录为已知缺口**；试验按设计无法触发这几条腿\n\n最后两条是\"哪些已验证、哪些是推定、哪些是已知缺口\"的三分法——**而且每一项都说清了验证手段的局限**。\n\n---\n\n## 对索引里跨批模式的印证\n\n**模式 A（诚实的空白）——最后一课：区分\"已验证 / 推定 / 已知缺口\"。**\n\n\"8 和 32 vCPU 标签……**按命名对称推定**，首次使用前请手动 dispatch 确认\"；\"Landlock、Seatbelt 和 linux-arm64 的排除仍基于**散文式 dispatch 实测**，记录为已知缺口\"。**不是简单标注\"未经验证\"，而是说清它凭什么被推定、以及怎么才能验证。**\n\n**一条新的通用判据：度量机制本身会改变结论。**\n\n\"每分钟价格低不保证每 job 成本低——**因为 GitHub 把每个 job 向上取整到整分钟**\"。**在比较两个方案之前，先弄清度量是连续的还是离散的**——离散化会让\"差 78 秒\"变成\"差 1 分钟\"，也可能反过来让优势消失。\n\n---\n\n## 这批的共同判断标准\n\n**① 先弄清度量机制，再比较方案。**\n取舍整到整分钟的机制让\"价格 5.25 倍差距\"对应\"时间只差 78 秒\"。**度量是离散的，直觉上的比例关系就不成立。**\n\n**② 不从单一实验外推。**\n\"不从这个单一实验外推任何小时或月度的节省。\"\"每个缓存状态一个样本，测量的是所提供的标签，**不是隔离的 CPU 伸缩或统计可重复性**。\"\n\n**③ 失败的迁移要完整记录，包括根因。**\n时间线精确到分钟、失败现象（**子进程无输出地退出，而同 run 的 Linux/macOS cell 通过**）、以及那个真正的根因：**\"验收标准从未被测量，提案一直停在 proposed\"。**\n\n**④ 回退时，给未来的重试者留下前置条件。**\n四条约束（注册表状态无法被私有 toolcache 隔离、缓存必须 job 自有且用复制导入、清理必须在成功/失败/取消时都跑、只有 Windows x64 可移植），加上门槛：**\"必须在实际池上重新验证吞吐量与失败可复现性，在任何路由变更之前。\"**\n\n**⑤ 变更要列参与者清单，逐个点名。**\n谁参与、谁不参与、**为什么**不参与（凭据 / 宿主能力 / 产物喂养发布链 / 工作流 spec 钉住）。**\"谁不受影响\"和\"为什么不受影响\"是同一份清单的两半。**\n\n**⑥ \"没做的事\"也要写明。**\n\"release 演练 job 保持变更前的路由不变……**不获得 `blacksmith` 分支**。\" **沉默会被读成\"忘了\"，而不是\"决定不做\"。**\n\n**⑦ 整体替换作为默认不可接受。**\n三条理由都不是态度：**破坏工作流契约 spec、扭曲基准测量、移动信任边界 job 而无决策记录。**\n\n**⑧ 用\"同类里哪些没出问题\"来收窄故障条件。**\n\"触发条件是 probe 一个已匹配 symlink 之下的路径，**不是 `**` 扫过含 symlink 的树**\"——依据是**同 run 里其他同类调用点保持绿色**。\n\n**⑨ 范围可以是一个否决理由，但要说清是范围而不是能力。**\n\"移到自托管——**被范围否决**。\"\n\n**⑩ 临时物清理掉，方法与证据留下。**\n\"临时的基准工作流和它的安全测试不在最终树里；**实验提交和链接的 run 保留了方法和证据**。\"\n\n---\n\n## 最终进度\n\n**47/47 完成（100%）**。全部 47 篇决策记录已精读，落盘为 15 份批次笔记 + 1 份索引。\n\n下一步：**收束**——把 15 个批次的「共同判断标准」合并去重为一份可直接查阅的总清单。\n"},{"file":"2026-09-10-DSH过程决策精读-判断标准总表.md","date":"2026-09-10","slug":"DSH过程决策精读-判断标准总表","title":"DSH 过程决策精读 · 判断标准总表","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"判断与门禁类","bytes":31830,"lines":472,"body":"# DSH 过程决策精读 · 判断标准总表\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **这份文件是什么**：15 个批次笔记各自有一个「共同判断标准」小节，累计约 120 条，彼此有明显重复（\"诚实的空白\"在 7 个批次里各写了一遍）。\n> 这里把它们**合并去重、按主题重排**，形成一份可直接查阅的清单。\n> **完整论证在批次笔记里**——每条后面的方括号是出处（`[01]` = 第 01 批），需要原文佐证时按索引去查。\n>\n> 来源：`DSHfork/.agents/notes/implemented/process/` 全部 47 篇决策记录（2026-06-11 → 2026-09-10）。\n\n---\n\n## 术语对照（读本系列时会撞到的英文词）\n\n**判断与门禁类**\n\n| 英文 | 中文 | 说明 |\n|---|---|---|\n| gate | 门禁 | 能自动跑、失败就非零退出的检查脚本 |\n| tripwire | 绊线式检查 | 简易触发式检查：一碰就报警，**不追求覆盖全部** |\n| advisory | 参考性的 / 提示性的 | 会跑会报告，但**不阻塞**合并 |\n| review-owned | 由评审负责 | 机器根本不跑，靠人看 |\n| fail loud | 大声失败 | 出错就报，不静默吞掉 |\n| non-zero exit | 非零退出 | 命令行表示\"失败\"的方式 |\n| allowlist / denylist | 白名单 / 黑名单 | 分别列出\"允许的\"与\"禁止的\" |\n| grandfather clause | 祖父条款 | 新规不溯及既往（只对之后的东西生效） |\n| ratchet | 棘轮 | 只紧不松——上限只降不升 |\n| Coverage gap | 覆盖缺口 | 明说\"这块没有门禁管\" |\n| Deferred | 推迟 | 暂时不做，但留着重启条件（**区别于\"否决\"**） |\n\n**工程与流程类**（★ = 在本系列正文中出现 5 次以上）\n\n| 英文 | 中文 | 说明 |\n|---|---|---|\n| ★ fixture | 测试夹具 | 测试用的固定输入数据 |\n| ★ coverage | 覆盖率 | 被测试执行到的代码比例 |\n| ★ rebase | 变基 | 把一串提交挪到新的基底上 |\n| ★ head | 提交顶端 | PR 当前指向的那个提交 |\n| ★ lease | 租约 | 带时限的独占权，超时自动失效 |\n| ★ artifact | 产物 | 构建 / 打包出来的文件 |\n| ★ partition | 分片 | 把一批工作切成几份并行 |\n| assertion | 断言 | 测试里判断真假的语句 |\n| no-op | 空操作 | 跑了但什么也不做 |\n| idempotent | 幂等 | 重复执行结果相同 |\n| regression | 回归 | 原本正常的功能变坏了 |\n| snapshot | 快照 | 某一时刻的完整记录 |\n| drift | 漂移 | 两份本该一致的东西渐渐不一致 |\n| stale | 陈旧的 | 过期了但还在被使用 |\n| seam | 接缝 | 模块之间的边界 |\n| invariant | 不变量 | 任何时候都必须成立的条件 |\n| payload | 载荷 | 打包后真正发布出去的内容 |\n| provenance | 来源 | 这个东西从哪来 |\n| verbatim | 逐字 | 一字不差地照抄 |\n| supersede | 取代 | 新决策顶替旧决策 |\n| rationale | 理由 | 为什么这么定 |\n| oracle | 预言机 | 判断正确性的独立依据 |\n| merge-forward | 向前合并 | 把主干合并进分支（而不是变基） |\n\n> **实测说明**：这些词在 15 份笔记正文里的出现频次大多很低（`advisory` 1 次、`review-owned` 0 次、`tripwire` 0 次）——**它们主要密集出现在对话回复里，不在笔记里**。\n> 笔记里英文较多的是**整句原文引用**：全系列 140 行引用中，**108 行是纯英文原文**（77%）。\n> 但已实测：**这 108 行全部（108/108）在前后 2–3 行内有中文**——**没有孤立的英文引用**，每一处原文附近都有中文说明。\n\n---\n\n## 一、地基：为什么要有规范\n\n**1. 可机械判定的不变量必须编码成检查，散文规则不作数。** `[01]`\n依据是两处独立印证——总纲的立场，以及文档预算门禁那句：\"积累**就发生在规则和评审注意力都在场的时候**；没有机械兜底的散文规则在这里被证明不成立。\"\n\n**2. 沉默不是中立：不写下规则，规则会被推断出来，而且更严。** `[03]`\n依赖政策从没写进 `AGENTS.md`，于是执行者从现状推断出\"别加依赖\"——**比任何人实际决定的都严格**。空缺的位置从来不会被留空。\n\n**3. 删门禁和加门禁一样需要记录，门槛更高。** `[01]`\n删 Knip 的三个条件：失败模式已被更窄的检查覆盖、泛化结果只是参考性而例外是硬维护成本、例外清单使普通变更依赖一份失真的图。\n\n**4. 规范只禁了一半，漏洞就从另一半漏进来。** `[02]`\n文档标准禁了\"变更历史\"（previously/now、PR 引用），却没管\"引用\"——于是 `(decision 12)`、`(audit C2)` 这类解析不到的序号一直往仓库里漏。\n**看任何规范都该问：跟它对称的那一半在哪？**\n\n---\n\n## 二、写一条规则\n\n**5. 规范要写成\"可判定的拒绝\"，不是风格建议。** `[08]`\n样式规范的 12 项检查表，每一项都是\"**看到 X，拒绝**\"。**检验标准：一个人读完这条规范，能不能在不咨询作者的情况下得出唯一结论？**\n\n**6. 写的人与评审的人共用同一张表。** `[08]`\n自我检查与评审检查是同一次动作——**这堵掉了\"规范知道但没执行\"的空间**。\n\n**7. 换一个宽泛的词等于什么都没做。** `[02]`\n\"把抽象标签统一换成 source/origin/metadata\"被否决：**另一个宽泛标签仍然让读者去猜**。只是把谜题换了个面。\n\n**8. 约束要在被约束者无知觉的情况下生效。** `[08]`\n暗色模式靠属性选择器的**整表覆盖**，于是**组件里零主题选择器**。**好的约束不需要被约束者配合。**\n\n**9. 表越大，表里每一项的权威越弱。** `[08]`\n拒绝 token 化字号与间距的理由：\"**膨胀的 token 表会稀释颜色 token 的权威性**。\" **约束范围由\"它能守住多少\"决定，不是\"它能覆盖多少\"。**\n\n**10. 用可预测性换精确性，通常是划算的。** `[06]`\n一条更精确的规则（\"这个类型是否每轮都被循环持有/派生/流式/记录\"）输给了一条更粗糙但可预测的规则（按仓库布局）：**要求\"逐例判断重要性\"的规则会在两个方向同时出错——收进不该收的，漏掉该收的**。\n\n**11. 一条政策不该依赖两套独立管理的权限。** `[11]`\n不是因为做不到，而是因为**那把一个运维面变成了两个**。\n\n**12. 不接受过渡态。** `[01]`\n\"全语料一个要求\"——没有 per-file rollout、没有日期截止线、没有类别特例。**过渡态是永久泄漏的开始。**\n\n**13. 缺席必须被标注，否则读的人无法解读。** `[11]`\n\"无约束的缺席，在'审计过的零'和'忘记写文档'之间是模糊的。\" **空白也是一种陈述，它需要被授权。**\n\n---\n\n## 三、设计一个门禁 / 检查\n\n**14. 错误的门禁会训练坏行为——比没有门禁更糟。** `[01]`\n一刀切天花板\"恰好惩罚正确的长文档\"，并产生逐文件覆盖的翻腾，**\"训练贡献者橡皮图章式地批准提高上限\"**。\n\n**15. 门禁的价值在强制决策的时机，不在度量精度。** `[01]`\n字数**不能判断质量**，但它**恰好在内容被添加的那一刻**逼出\"该放哪\"的决定——那是作者最清楚上下文的时刻。\n\n**16. 绕过必须在结构上不可能。** `[01]`\nmanifest **只列排除项**，不列包含项：\"不能让任何条目绕过发现流程而获得更弱的检查。\"\n\n**17. 校验要搭已有的车。** `[09]`\n断言放进测试泳道本来就在跑的 spec——**零新门进程、零新调度槽位、零新 CI 步骤**。这是对\"门禁本身是要维护的代码\"那条代价的直接回应。\n\n**18. 自动修复必须在信息不足时拒绝动手。** `[08]`\n未分类的运行时导出**阻塞所有 `--fix` 写入**。**证据不够时的\"尽力而为\"，等于用一个更强的语气说出一个更弱的判断。**\n\n**19. 验证与生成要分开。** `[10]`\nhook **只验证不重新生成**，所以\"绕过 hook 不能静默地祝福翻译漂移\"。**如果验证会顺手修正，绕过它就成了作弊通道。**\n\n**20. 独立检查不能与被检查对象共享实现假设。** `[13]`\n\"调度和验证共享实现假设\"——**同一个实现既调度又验证时，它的错误会同时骗过两边。**\n\n**21. 每条违规自带 `文件:行` 定位。** `[01][08]`\n漂移报告没有定位等于没跑；未分类导出给**一条可点击的 `path:line:column`**。\n\n**22. 测试要有负控。** `[11]`\n移除一个目标、错误路由一个 job、恢复一个陈旧依赖——**每一个都必须产生预期失败**，否则你不知道这个测试能不能红。\n\n**23. 门禁管形式，评审管内容——而且要写明谁管什么。** `[11]`\n\"评审仍然拥有覆盖率、链接相关性和事实准确性。\"\n\n**24. 不能被机械判定的规则，要么推迟，要么明说缺口。** `[02]`\n他们对\"禁用词汇\"**推迟**了门禁并列出高精度候选清单备用，同时**主动写出**\"覆盖缺口：没有门禁拒绝新的序号引用——这条规则由评审承担\"。**两条路都比'假装有门禁'诚实。**\n\n**25. 让检查\"意外可选\"不是中立行为。** `[09]`\n\"停止自动安装 hooks 会让廉价的提交/推送检查意外变成可选的，**尤其是在短命的 agent worktree 里**。\"\n\n---\n\n## 四、处理不确定性：诚实的空白（出现 9 次，最强形态在 `[10]`）\n\n**26. 不确定的地方要标注，不要补齐。** `[02][04][05][06]`\n无法重建 alternatives 的旧笔记，永久保留一行\"此处不可重建\"，**而不是补一段像样的理由**。\n\n**27. 算不出来时，不要给出一个看起来对的答案。** `[10]` ← **最强形态**\nGit 合并驱动的启动器**能算出一个干净的文本合并结果，却仍然返回冲突**——因为那个结果没经过驱动的校验。**未经校验的结果冒充校验过的结果，比明确失败更危险。**\n\n**28. 数值不可得时，记录\"形态\"。** `[11]`\n精确 token 数依赖 tokenizer／序列化／配置／运行时数据，**它不稳定，所以不进契约**；契约退到\"每次请求固定／条件性／保留／替换／有上限／零直接\"这一层。\n\n**29. 不声称自己验证不了的东西。** `[11][12]`\n\"本地调度测试**不声称**原生运行时或 Wine 执行\"；\"选择器测试**不声称**复现那些构建\"。\n\n**30. 区分\"已验证 / 推定 / 已知缺口\"。** `[15]`\n8 和 32 vCPU 标签\"**按命名对称推定**，首次使用前请手动 dispatch 确认\"；Landlock 等排除\"仍基于**散文式 dispatch 实测**，记录为已知缺口\"。**不是笼统标注\"未经验证\"，而是说清它凭什么被推定、以及怎么才能验证。**\n\n**31. 结论要附带它够不到的边界。** `[14]`\n\"确立了版本与路径兼容性，**不是容量保证**\"；\"只有一个样本，**不能把差异归因于并发**\"。\n\n**32. 明确接受代价，不要软化措辞。** `[11][15]`\n\"明确接受这四项检查的**合并后才发现**\"；\"**明确接受 standby 饥饿**\"。**同时说清代价的边界：是\"晚发现\"，不是\"不发现\"。**\n\n---\n\n## 五、证据与验证\n\n**33. 相似性不构成同一性。** `[04]`\n四种伪装：视觉相似（不同运行的帧）、结果相似（聊天记录显示成功但隐藏失败路径）、来源相似（历史加速看起来是现成答案）、名称相似（宽泛标签替代语义分类）。\n\n**34. 要验到\"评审者真正使用的那条路径\"。** `[04][07][12]`\nGIF 发布不满足于\"push 成功\"，要重读活体 body、用 Markdown API 渲染、抓取上传 URL 确认 `200 image/gif`——**那才是评审者实际看的东西**。\n\n**35. 通用问法：这个验证手段短路掉了什么？** `[07]`\n**被短路的那一段，就是故障的藏身处。** \"fixture 全绿不算完成\"的依据正是：\"fixture 短路掉的正是链路运载链，**而两个经验确认的 bug 都藏在那里**。\"\n\n**36. 验证必须确保它验证的是你以为的那个东西。** `[12]`\n三处防护：**移除继承的 Node 解析钩子**（否则可能解到源码而非 tarball）、**checkout 显式清理未跟踪与被忽略的输出**、**\"一个热的 pnpm store 不能替代 tarball 载荷\"**。\n\n**37. 验证手段不能改变被验证的行为。** `[04]`\n用 fixture 替换不可访问的原生 UI 被否决，因为**那通过改变被观察的产品路径来让自动化更容易**。**凡是让\"验证更容易\"的改动，都要先问它有没有改变被验证的东西。**\n\n**38. 只有稳定配置下的已完成运行，才构成调参的证据。** `[12]`\n\"仅仅进展缓慢永远不会提高并发，**因为反复重启会抹掉唯一的证据**。\" **在基线不稳时调参，会破坏调参所依赖的证据本身。**\n\n**39. 每个 bug 修复钉一个断言，且钉在它所属的层。** `[07]`\n一个原本只能靠 12 秒浏览器哨兵防守的问题，被钉成**纯 Node 的秒级用例**。\n\n**40. 失败时也要留下完整证据。** `[12]`\n失败测试**仍然发出 blob**，让合并报告完整状态之后才返回失败。**\"失败\"和\"证据残缺\"是两件事，不要用一个掩盖另一个。**\n\n**41. 用\"必需物缺席\"表达失败，而不是一个可能被漏检的标志。** `[14]`\n发布完成记录**最后写**，出错时它就不存在——**于是\"忘了检查标志\"这种漏洞在结构上不可能发生。**\n\n**42. 判断错误方向，并往安全的那一侧倾斜。** `[09]`\n运行时披露层**刻意覆盖每一个可挂载的插件**：\"**对一份法律声明来说，披露不足才是代价高昂的方向。**\" **每条规则都该问：如果我错了，会往哪边错？**\n\n**43. 先弄清度量机制，再比较方案。** `[15]`\n\"更低的每分钟价格不保证更低的每 job 成本——**因为 GitHub 把每个 job 向上取整到整分钟**。\" **离散化的度量会让比例直觉失效。**\n\n**44. 不从单一实验外推。** `[15]`\n\"不从这个单一实验外推任何小时或月度的节省。\"\n\n**45. 一个手段改善了可见指标，不等于它打中了瓶颈。** `[14]`\n代理把上传从 203.83 秒降到 38.59 秒（**5.3 倍**），**而总时长没变**——真正的约束是两次 Apple 提交之间的串行等待。**看到某个数字大幅改善时，要再问一次：这个数字是约束吗？**\n\n**46. 用\"同类里哪些没出问题\"来收窄故障条件。** `[15]`\n\"触发条件是 probe 一个已匹配 symlink 之下的路径，**不是 `**` 扫过含 symlink 的树**\"——依据是**同 run 里其他同类调用点保持绿色**。\n\n---\n\n## 六、状态与语义\n\n**47. 未满足 ≠ 失败；没有 ≠ 有但不同。** `[05]`\n`pending`（条件未满足，可解决）/ `success` / `error`（评估本身失败）；registry 的\"没有那个版本\"与\"有但内容不同\"是两个状态——**两种\"已经存在\"只有一个是真的问题**。\n\n**48. 同一个字段名不该回答两个问题。** `[10]`\n`devDependencies` 回答\"安装器要不要下载\"，**不能**回答\"要不要披露\"；`always()` 要区分\"失败聚合\"、\"资源清理\"、\"被取消运行的簿记\"三种义务。**当一个字段名开始承担第二个问题时，错误就藏在两个问题的差集里。**\n\n**49. 状态要表达交接，不要表达判定。** `[03]`\n\"谁拥有下一步\"能驱动行为；\"GitHub 认为可合并\"会在具体反例上说谎。\n\n**50. 三种处置，不是两种：阻塞 / 可见但不阻塞 / 忽略。** `[14]`\n`windows-coverage` 缺席于聚合 `needs`，所以\"它的阈值失败**保持红色且可见，而不延迟必需的裁决**\"。**把三种压成两种必然损失信息。**\n\n**51. 判定的归属必须唯一。** `[12]`\n\"阈值所有权属于合并后的报告\"——**一个有意不完整的部分，不能对自己作整体判定。**\n\n**52. 幂等 = 重复执行不产生新状态。** `[05]`\n跳过状态建立在**内容相等**（integrity 相同）而非版本相等上。**好流程的标志是：重跑它是一件无聊的事。**\n\n**53. 身份用标识符，不用显示名。** `[12]`\n\"一个显示名不标识工作流文件；另一个工作流可以使用同样的标题。\" **显示名可被复用，路径/ID 才是身份。**\n\n**54. 形式检查不是语义检查。** `[05]`\nIssue 政策检查了正文长度和标题语言，**却无法确立\"请求的工作、预期行为、交付物是否清晰\"**。**每条政策都该被问一次：它失败的时候，能不能指出缺失的那个决策？**\n\n**55. 自动化的边界由\"谁拥有这份元数据\"划定。** `[03]`\n本地能确定的事自动做；**共享元数据或影响链外的事留给人类**。\n\n**56. 混淆状态时，错误的方向是\"把失败显示成通过\"。** `[10]`\nsuccess-only 的聚合\"**能把失败的依赖藏在一个被跳过的必需检查后面**\"——比漏报更危险，因为漏报还有机会被发现。\n\n---\n\n## 七、派生物与单一归属\n\n**57. 一份事实只该有一个家，而且那个家要可预测。** `[06]`\n索引复制路径与日期、类型该跟着包走而不是\"重要性\"、每个粘贴声明只有一个家——三个层面上的同一个要求。\n\n**58. 第二份真相有两种成本：漂移，以及争用。** `[06]`\n生成的索引不只是\"要同步\"，**它还把你无关的改动拖进同一份文件**。\n\n**59. 三问决定\"消除\"还是\"自动化\"。** `[09]`\n**① 它是必需的吗？② 源变化时能自动重生成吗？③ 校验能搭现成的车吗？** 三问都否就该消除它；都满足就该接受它并把同步自动化。\n反面教材：把校验做成专门的 `doc-sync` 门，它\"**唯一的失败模式，是在一个贡献者推完无关的依赖升级几分钟后，告诉他去重跑生成器**\"——**把同步成本推给一个人**。\n\n**60. 当源信息不足以生成正确的副本时，这个副本的问题不是\"需要维护\"，而是\"不可能正确\"。** `[11]`\nAST **能找到注册，但推断不出语义条件**（历史保留、输出截断、父子可见性）。\n\n**61. 冻结要真的冻结，包括放弃维护义务。** `[06]`\n归档笔记**被所有其他文档门禁排除**，且**不随重命名包、变化的行为、翻译标准、格式规则、断裂链接更新**。**只冻结内容而不划掉维护义务，等于没冻结。**\n\n**62. 归档与删除的语义不能混。** `[06]`\n归档 = \"已实现的历史决策\"。过时的提案要**明确拒绝**，没价值的拒绝要**删除**，而不是找第二个低价值存放区。\n\n**63. 删除时要区分\"引用\"与\"理由\"。** `[02]`\n死产物的引用可以删，但**事实分句要保留或重述**。\n\n**64. 契约要住在实现本地。** `[11]`\n\"包 README 是实现本地的契约；一份中央副本会增加另一个漂移点。\" **决定内容住哪里的，是\"谁在改动它\"，不是\"谁在阅读它\"。**\n\n**65. 本地分歧要记账。** `[07]`\n\"Cordis vendor 副本与上游又多了一处类型结构分歧，同步时必须重新应用或显式退役。\" **每一笔本地定制都是未来要偿还的债。**\n\n**66. 临时物清理掉，方法与证据留下。** `[15]`\n\"临时的基准工作流和它的安全测试不在最终树里；**实验提交和链接的 run 保留了方法和证据**。\"\n\n---\n\n## 八、变更与边界\n\n**67. 越界的机制不能走那条被阻塞的路径。** `[08]`\nCI 故障切换被设计成**仓库变量**而非一次合并，因为\"**它在检查是红的时候也能工作**\"。**设计应急机制时先问：它依赖的通道，在它要应对的那种故障里还通吗？**\n\n**68. 冗余 ≠ 替换。** `[08]`\n\"让自建池永远留在必需路径里\"被否决：**那是拿 B 的可用性换 A 的可用性——移动了单点故障，没有增加回退。**\n\n**69. 变更要列参与者清单，逐个点名。** `[15]`\n谁参与、谁不参与、**为什么**不参与（凭据 / 宿主能力 / 产物喂养发布链 / 工作流 spec 钉住）。**\"谁不受影响\"和\"为什么不受影响\"是同一份清单的两半。**\n\n**70. \"没做的事\"也要写明。** `[15]`\nrelease 演练 job \"**不获得 `blacksmith` 分支**\"。**沉默会被读成\"忘了\"，而不是\"决定不做\"。**\n\n**71. 整体替换作为默认不可接受。** `[15]`\n三条理由都不是态度：**破坏工作流契约 spec、扭曲基准测量、移动信任边界 job 而无决策记录。**\n\n**72. 范围可以是一个否决理由，但要说清是范围而不是能力。** `[15]`\n\"移到自托管——**被范围否决**。\"\n\n**73. 限定范围本身就是防御。** `[04]`\n\"**有限的场景/修复范围，防止一个宽泛的性能请求变成一次无关的架构重写。**\"\n\n**74. 拒绝把手头问题变成一个通用层。** `[09]`\n\"构建通用 hook 管理器\"被否决：**顺序、参数转发、失败语义、升级会变成与目标无关的仓库自有行为。**\n\n**75. 顺手能做的事，如果不是本次决策的一部分，就不做。** `[05]`\n自动元数据修复被拒绝的理由是\"**它们是独立的决策，而不是随一次政策简化捎带进来**\"。**范围蔓延最隐蔽的形式，就是那些看起来相关且容易的事。**\n\n**76. 优化不该改变拓扑。** `[12]`\n\"必须留在既有 job 内\"——拆 job 会带来 checkout、安装、制品传输和 merge job。\n\n**77. 文档和代码在同一次变更里移动。** `[09]`\n\"必须移动 `engines.node`、兼容矩阵和**这篇 Agent Note**\"——**文档是必须同步移动的三样东西之一。**\n\n**78. 政策反转时要记录被否决政策的完整理由。** `[10]`\n旧豁免当初要保护什么、它的成本被什么界定、以及**\"明确接受 standby 饥饿\"**。\n\n**79. 回退时，给未来的重试者留下前置条件。** `[15]`\n四条约束 + 门槛：\"**必须在实际池上重新验证吞吐量与失败可复现性，在任何路由变更之前。**\" **一次失败的迁移留下的不是\"别再试了\"，而是\"要再试的话，先满足这些\"。**\n\n**80. 失败的迁移要完整记录，包括根因。** `[15]`\n时间线精确到分钟、失败现象、以及真正的根因：**\"验收标准从未被测量，提案一直停在 `proposed`。\"**\n\n**81. 不做的事也要列出来。** `[03]`\n\"不重建评审轮次、不查询 `reviewDecision`、**不加定时对账器**\"——**它划出了\"这条命令管到哪为止\"**。\n\n**82. 选介入点，要选在所有路径都必经的地方。** `[10]`\n包装一个命令只能覆盖\"使用那个命令\"的场景；**合并驱动是裸 Git、stack 工具、rebase、cherry-pick 共享的扩展点**。\n\n**83. 部分成功必须非零退出。** `[10]`\n\"调用者不能把一次部分解析误认为完成的合并。\" **能做完多少就做多少，但汇报时必须说\"没做完\"。**\n\n**84. 失败契约要含\"可观察状态\"。** `[10]`\n那张表三列：失败、**可观察状态**、恢复。**恢复的第一步是识别，所以识别条件属于契约。**\n\n**85. 说清能力的边界，不把\"可取消\"包装成\"会变快\"。** `[10]`\n\"取消是一个**请求**，不是立即终止的保证……它让过时验证可被取消，**不承诺**固定的运行时长或取消延迟。\"\n\n---\n\n## 九、工具与资源\n\n**86. 趁爆炸半径小的时候换承重工具。** `[07]`\n\"现在换\"的依据是**可枚举的**：还没有任何东西发布、工具只需做三件事、唯一专属资产小而机械。\n\n**87. 让工具的错误成为防线。** `[07]`\npnpm 篇**刻意不加** hoisted 逃生舱，因为非扁平 `node_modules` 让**幻影依赖大声失败**——他们对一个\"整个质量故事都是机械门禁\"的仓库称之为 *a feature*。**选工具时问的不是\"它的报错会不会烦到我\"，而是\"它的报错恰好是我需要的那个信号吗\"。**\n\n**88. pin 比范围好；类型不能领先于运行时下限。** `[09]`\n浮动的 major 条目\"**会随时间长上去，并静默停止演练声明的下限**\"；类型跑在运行时前面，**会把运行时故障伪装成编译通过**。\n\n**89. 更多资源不等于更好，要用实测判断。** `[14]`\n32 核只比 16 核改进 **1.47 秒**，而且在 Node 的 CJS lexer 里失败。**\"加资源\"是需要证据的主张，不是默认答案。**\n\n**90. 任何共享的可变位置，都会把并发变成时序依赖。** `[09][14]`\n共享的 Git hooks 目录会让\"一个 worktree 的安装改变另一个的行为\"；可变的共享 Node 链接会\"**让选定的版本取决于另一个 job 的时序**\"。**隔离的代价要明说，但换来的是结果的可复现。**\n\n**91. 结构性修复优先于周期清理；区分\"混乱\"与\"缓存\"。** `[13]`\n\"编译缓存是**缓存**，不是**残留**。每次运行删除它会丢弃缓存存在的意义。\" **当增长是某个东西的正常行为时，问题在\"它长在哪\"，不在\"它长了\"。**\n\n**92. 超时用来防挂死是对的，用来表达性能目标是错的。** `[13][14]`\n\"调度方差会取消正确的工作，**并压制诊断回归所需的证据**\"；而正确的用法是\"**约束卡住的工作，而不把性能目标当作正确性截止时间**\"。\n\n**93. 隔离/清理要按\"finally 不会被执行\"来设计。** `[12]`\n`TMPDIR` 指向 `runner.temp`，为的是**即使进程被杀、`finally` 没跑，临时物仍在清理范围内**。\n\n**94. 清理要等所有所有者结算。** `[14]`\n\"失败的泳道等另一条完成再清理——**延迟失败报告，但避免删除仍被子进程持有的文件**。\"\n\n---\n\n## 十、工作方式\n\n**95. 不留悬空的红。** `[07]`\n行为变更让用例变红时**当场对账**（修测试或修代码，以契约为仲裁）。**一个挂着的红，会让之后每一次\"红了\"都失去意义。**\n\n**96. 知道该怎么修就直接修，别评论。** `[04]`\n\"只评论不修复\"被否决的理由：**它保留无效状态并要求人工清理**。**把一个可自动完成的修复降级成一条提示，是把自己的成本转给未来的某个人。**\n\n**97. 分层要沿着架构的自然接缝，而且层间不重复测试。** `[07]`\n上层只测自己的层；纯函数层不引入任何 fake。**重复测试不是\"更保险\"，是让信号的归属变模糊。**\n\n**98. 探针必须用正例和近似负例校准。** `[02]`\n\"用已知正例和一个近似负例校准\"——**只测正例的探针，无法知道自己有没有误伤。**\n\n**99. 强制的摩擦可以是刻意的。** `[02]`\n`Alternatives considered` 是\"刻意的摩擦\"，因为**\"一个没有记录它击败了什么的决策，会招致它本来要防止的重新打官司\"**。\n\n**100. 自描述优先于依赖上下文。** `[02]`\n`Agent Note: ` 前缀让文件挪出树外仍能自述体裁。**假设读者在错误的上下文里读到它。**\n\n**101. 不要为了测试变绿而缩小被测范围。** `[14]`\n\"排除看起来不支持的文件\"被拒绝，理由是**\"受影响的行为是受支持的\"**——它是\"之前漏测的东西\"，不是\"不该测的东西\"。\n\n**102. 测试环境比真实环境更完备时，测不出缺席。** `[05]`\nworkspace 安装总是有每个包，**所以所有测试都通过，而发布的包对拒绝可选 peer 的消费者是坏的**。**凡是\"我这个环境里一定有\"的假设，都要问一句：在所有真实环境里也一定有吗？**\n\n**103. 潜伏的 bug 需要专门的搜寻。** `[05]`\n那条 `^0.0.1` **从未失败，只因版本从未离开 `0.0.1`**。这类 bug 不会通过\"跑测试\"暴露，只能通过**推理条件边界**（\"如果这个值变了会怎样\"）发现。\n\n**104. 新增能力带来新增义务。** `[13]`\n\"连续录制保留中间状态，**所以评审者必须检查选定区间是否有敏感内容与可读性**。\"\n\n**105. 代价要量化，然后判定它可不可接受。** `[13]`\n\"缓存在 `runner.temp` 里累积，runner 不清空它——**但在数据卷上（约 1% inode）那无害**。\" **先量，再判，而不是含糊地说\"影响很小\"。**\n\n---\n\n## 附：9 条跨批模式\n\n这些不是单条标准，而是**同一立场在多个批次里反复出现**的形态。括号内是出现次数。\n\n| 模式 | 次数 | 一句话 |\n|---|---|---|\n| **A 诚实的空白胜过补齐** | **9** | 不确定/缺失/不利的地方标注出来，不补一个看起来合理的东西。四个强度层次：标注缺失 → 公开不利证据 → 信息不足时拒绝动手 → **放弃一个看似可用的答案** |\n| **B 第二份真相：消除或自动化** | 5 拒 + 1 收 | 能消除就消除；必须存在的，在源头变化时自动重生成，并让校验搭现成的车 |\n| **C 别把不同的事混成一种状态** | **7** | 未满足≠失败、没有≠有但不同、意图≠范围、三种 `always()` 义务、三种处置档位 |\n| **D 证据要成立** | 4 | 验到消费点；短路掉的正是故障藏身处；**不共享实现假设的独立路径**；**观察行为不能破坏被观察对象** |\n| **E 范围蔓延防御** | 2 | 顺手能做的事，不是本次决策的一部分就不做 |\n| **F 可预测性战胜精确性** | 1 | 要求\"逐例判断重要性\"的规则已在制造漏洞 |\n| **G 冻结 = 明确放弃更新义务** | 1 | 只冻结内容不划掉维护义务，等于没冻结 |\n| **H 让工具的错误成为防线** | 1 | 选工具时问\"它的报错是我需要的信号吗\" |\n| **I 越界的机制不能走被阻塞的路径** | 1 | 应急机制依赖的通道，在它要应对的故障里还通吗 |\n| **J 机器判定不可靠时，问它跑起来还有没有剩余价值** | 1 | **有** → 降级为「参考性」（跑但不阻塞）；**没有且会招致表面合规** → 交给评审，不跑。见下方「张力已解答」 |\n\n### 那条张力已经解答（补记）\n\n此前在这里记着一条\"未解决的张力\"——\"可机械判定的必须机械化\"与\"能不能机械判定本身需要判断\"之间的矛盾。**它现在有一手判据**，出处是 `archived/process/2026-07-19-require-agent-notes-for-non-trivial-changes.md`：\n\n> **评审强制这条语义边界。没有任何自动门禁试图把一个 diff 分类为平凡或非平凡**，所以这条政策不增加门禁阶段或运行时。\n\n被否决的对照方案给出了完整理由：\n\n> **加一道 CI 的 diff 分类门禁。** 一个机械检查**无法可靠判断一个语义变更是否平凡**，而另一道门禁会增加运行时，**并招致误报或表面合规（superficial compliance）**。\n\n**判据：当机器的判定不可靠时，问它跑起来还有没有剩余价值。**\n\n| 机器的判定 | 处置 |\n|---|---|\n| 可靠 | 完全机械化（第 ① 档） |\n| **不可靠，但跑起来仍有参考价值** | 降级为**参考性**——跑，但不阻塞合并（例：Knip 的未使用代码扫描） |\n| **不可靠，且跑起来只有害处** | 交给**评审**，不跑（例：\"这个 diff 是否平凡\"） |\n\n**\"表面合规\"是这里的关键词**：一道不可靠的门禁**不会让人去解决它想解决的问题，而是让人学会迎合它**。这与第 01 批的\"一刀切天花板会**训练贡献者橡皮图章式地批准提高上限**\"是同一失败模式的两种表述。\n\n---\n\n## 怎么用这份表\n\n**如果你是作者**：写规范时对照第二、三节（规则与门禁）；写变更时对照第八节。\n\n**如果你是评审者**：第五、六节可直接当检查清单；第四节问\"这个结论的边界在哪\"。\n\n**如果只能记三条**：\n\n1. **模式 A**——不确定就标注，不补齐。\n2. **第五节第 45 条**——一个手段改善了可见指标，不等于打中了瓶颈。\n3. **第六节第 48 条**——同一个字段名不该回答两个问题。\n"},{"file":"2026-09-10-DSH过程决策精读-索引.md","date":"2026-09-10","slug":"DSH过程决策精读-索引","title":"DSH 过程决策精读 · 索引","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"读法说明（写在每篇之前的约定）： 每篇按五段提炼——他们遇到的事 / 判断 / 凭什么这么判断 / 他们承认的代价 / 被否决的方案。 其中「被否决的方案」信息量最大：决定告诉你结果，否决告诉你边界。","bytes":21260,"lines":263,"body":"# DSH 过程决策精读 · 索引\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **这个文件的作用**：会话上下文会被反复压缩。批次笔记在磁盘上是安全的，但\"我读到哪了、已经得出过什么结论\"会丢。\n> 这个索引是恢复点——**先读它，再决定读哪一批**。\n> 建立于 2026-09-10，随每批更新。\n\n## 进度\n\n| 项 | 值 |\n|---|---|\n| 精读对象 | `DSHfork/.agents/notes/implemented/process/` |\n| 该目录总数 | **47 篇**（目录下 94 个 `.md` = 47 篇英文 + 47 篇中文配对翻译） |\n| 已读 | **47 篇**（第 01–15 批）＝ **该目录 100% ✅** |\n| **全库规模** | **974 篇英文 Agent Note**：implemented **310** + proposed **21** + rejected **14** + archived **629** |\n| **全库覆盖** | 47 / **345**（当前权威 = implemented + proposed + rejected）＝ **13.6%**；archived 629 篇是**冻结历史**，按官方政策不算遗漏 |\n\n> **计数修正（2026-09-10 第二次）**：本篇最初把\"47 篇\"当成全库总量。实测后全库是 974 篇英文——\n> **\"100%\" 只对 `process/` 这一类成立**，即\"流程与政策\"这一整类读完了，其余 5 类（architecture / feature / bug-fix / simplification / testing）只读了它们的流程侧。\n> 另外，此前报的\"230 篇 architecture\"是**文件数**（含中文配对），英文实际 115 篇——所有目录都存在这个 2 倍偏差。\n\n## 批次索引\n\n| 批次 | 文件 | 主题 | 篇数 |\n|---|---|---|---|\n| 01 | `2026-09-10-DSH过程决策精读-01-门禁体系.md` | 门禁体系（总纲 + 两个门禁 + 编排器 + 删门禁） | 5 |\n| 02 | `2026-09-10-DSH过程决策精读-02-文字规范与引用纪律.md` | 文字规范与引用纪律 | 3 |\n| 03 | `2026-09-10-DSH过程决策精读-03-权威与推断.md` | 权威与推断（事实有多个来源时以谁为准） | 3 |\n| 04 | `2026-09-10-DSH过程决策精读-04-什么算证据.md` | 什么算证据（识破\"看起来等价\"） | 3 |\n| 05 | `2026-09-10-DSH过程决策精读-05-状态的语义精度.md` | 状态的语义精度（未满足≠失败） | 3 |\n| 06 | `2026-09-10-DSH过程决策精读-06-事实住哪里.md` | 事实住哪里（单一归属 + 冻结语义）**含跨批模式交叉验证** | 3 |\n| 07 | `2026-09-10-DSH过程决策精读-07-工具的选择与边界.md` | 工具的选择与边界（选型判据 + 分层）**含跨批模式交叉验证** | 3 |\n| 08 | `2026-09-10-DSH过程决策精读-08-把判断变成可判定的规则.md` | 把判断变成可判定的规则（样式约束 / CI 死锁 / 依赖分类） | 3 |\n| 09 | `2026-09-10-DSH过程决策精读-09-派生物与事实源.md` | 派生物与事实源**（修正模式 B 的边界）** | 3 |\n| 10 | `2026-09-10-DSH过程决策精读-10-把纠缠的事实拆开.md` | 把纠缠的事实拆开（配对合并 / 依赖分区段 / CI 取消）**含跨批印证** | 3 |\n| 11 | `2026-09-10-DSH过程决策精读-11-契约写在哪保证什么.md` | 契约写在哪、保证什么（Model Experience / 规划字段 / 平台 CI）**含跨批印证** | 3 |\n| 12 | `2026-09-10-DSH过程决策精读-12-身份与证据的可靠性.md` | 身份与证据的可靠性（自托管演练 / 分区覆盖 / 审批身份）**含跨批印证** | 3 |\n| 13 | `2026-09-10-DSH过程决策精读-13-别让省事的做法冒充正确做法.md` | 别让省事的做法冒充正确做法（串行参考 / 编译缓存 / 视频录制）**含跨批印证** | 3 |\n| 14 | `2026-09-10-DSH过程决策精读-14-真正的瓶颈与不能证明的事.md` | 真正的瓶颈与不能证明的事（Wine vs 原生 / 隔离 / 并行公证）**含跨批印证** | 3 |\n| 15 | `2026-09-10-DSH过程决策精读-15-回退参与者清单与默认值.md` | 回退、参与者清单与默认值（runner 尺寸 / **失败迁移回退** / Blacksmith）**收尾批** | 3 |\n\n> **`process/` 47 篇读毕（该目录 100%）**。收束文档见 `2026-09-10-DSH过程决策精读-判断标准总表.md`（把 15 批的「共同判断标准」合并去重后的可查阅版本）。\n\n| 补记 | `2026-09-10-DSH决策记录的人机协作形态.md` | **制度层**：Agent Note 制度全貌 + 人机分工证据 + **审阅档位判据**（解答了总表里那条张力） | 制度层 |\n\n> **补记说明**：正读 15 批只覆盖 `process/`（流程与政策）。补记补的是**制度本身**——`.agents/notes/README.md`（制度总纲）、`archived/` 与 `proposed/` 里的相关篇目，\n> 其中 `archived/process/2026-07-19-require-agent-notes-for-non-trivial-changes.md` 给出了那条\"未解决张力\"的**一手判据**（\"表面合规\"）。\n\n**读法说明**（写在每篇之前的约定）：\n每篇按五段提炼——**他们遇到的事 / 判断 / 凭什么这么判断 / 他们承认的代价 / 被否决的方案**。\n其中**「被否决的方案」信息量最大**：决定告诉你结果，否决告诉你边界。\n\n## 跨批模式（本索引最有价值的部分）\n\n单独一篇里的结论可能像是偶然的谨慎；**同一个立场在多批里反复出现，才是可以依赖的判断标准**。目前识别出 5 个跨批模式：\n\n### 模式 A：诚实的空白胜过补齐（出现 9 次）**← 已稳固为默认习惯，10 批出现最强形态**\n\n不一致、缺失、不确定的地方，**标注出来，而不是补一个看起来合理的东西**。\n\n| 出处 | 具体表现 |\n|---|---|\n| 02 批 ⑦ | 无法重建 alternatives 的旧笔记，永久保留一行\"此处不可重建\"的注释，而不是补一段像样的理由 |\n| 02 批（格式强制） | 连\"这篇没写 Alternatives\"都用 HTML 注释显式标出，而不是静默缺失 |\n| 04 批 ④ | 性能表里明写\"这个数字是估算，不是浏览器测量\"；未合并就关闭的 PR **不发明缺失的分类** |\n| 05 批 ⑥ | \"字节可重现性是假设，不是测量\"——并给出行动指令：**在第一次可能被重跑的发布之前先测它** |\n| **06 批（归档）** | **归档\"保留那个证据，而不假装它仍然是当前的\"**；归档笔记**按设计就可能过时**，不随重命名/格式/翻译/链接规则更新 |\n| **07 批（pnpm）** | **主动公开不利于自己的数据**：性能表三个格子对 pnpm 不利，并附上\"我们的测试环境让那个本来可能成立的优势无法显现\"的解释；结论改成\"**理由是生态对齐和安全，不是速度**\" |\n\n**07 批给出了这条立场的一个新形态**：前几次是\"标注缺失\"，这次是\"**公开一个削弱自己结论的证据**\"。\n\n| **08 批（依赖分类）** | **未分类的运行时导出阻塞所有 `--fix` 写入**——\"只有源头安全通过之后，`--fix` 才执行分类所蕴含的区段与范围变更\"。**信息不足时拒绝猜一个分类**，而不是\"尽力而为\" |\n\n**08 批给出了另一个新形态**：不是\"标注缺失\"，也不是\"公开证据\"，而是**工具在信息不足时拒绝动手**。证据不够时\"尽力而为\"，等于用一个更强的语气说出一个更弱的判断。\n\n| **10 批（配对合并）** | **最强形态**：Git 合并驱动的启动器**能算出一个干净的文本合并结果，却仍然返回冲突**——因为那个结果没经过驱动的校验（六 blob 哈希、语言切换器、结构签名）。**主动放弃一个看似可用的答案，只因为它没被验证过** |\n\n**四批四个形态**：标注缺失（02/04/05/06）→ 公开不利证据（07）→ 信息不足时拒绝动手（08）→ **放弃未经验证的可用答案（10）**。**方向一致，强度递增。**\n\n| **11 批（Model Experience）** | **把不稳定的部分排除出契约**：\"稳定的契约是**增长形态**，不是数值\"——精确 token 数依赖 tokenizer／序列化／配置／运行时数据，**它不稳定，所以不进契约**；契约退到\"能被稳定判定的那一层\"。同篇还有这条模式的**反面用法**：\"**无约束的缺席，在'审计过的零'和'忘记写文档'之间是模糊的**\"——空白可以是诚实的，但必须是被标注过的空白 |\n| **12 批（自托管演练）** | **\"选择器测试不声称复现那些构建\"**、\"本地调度测试不声称原生运行时执行\"（11 批同款）——**每篇末尾都在划定自己验证能力的边界**。这已成固定收尾：**不声称验证不了的东西** |\n\n### 模式 B（09 批修正）：能消除的第二份真相就消除；不能消除的，让同步自动化\n\n前 5 次都是\"拒绝\"，第 6 次却是\"接受\"——**09 批接受了一个生成文件（`THIRD_PARTY_NOTICES.md`），而它同样是派生出来的第二份拷贝**。同性质的东西结论相反，边界正好由三问划定：\n\n| 判据 | 生成索引（❌拒绝） | 第三方声明（✅接受） |\n|---|---|---|\n| **① 它是必需的吗？** | 否，只是发现路径的一种便利 | 是，开源合规**要求**这份披露存在 |\n| **② 源变化时能自动重生成吗？** | — | **是**：\"Freshness is **maintained**, not merely enforced\" |\n| **③ 校验能搭现成的车吗？** | — | **是**：断言放进测试泳道本来就在跑的 spec，零新门进程、零调度槽位、零 CI 步骤 |\n\n**三问都否，就该考虑消除它；都满足，就该接受它并把同步自动化。**\n\n| 出处 | 判断 |\n|---|---|\n| 01 批 ② | ❌ Knip 的例外清单（重述了清单、构建配置、包专属检查已有的事实） |\n| 01 批（编排器） | ❌ YAML 里的门禁清单、手工维护的包清单 |\n| 03 批（评审状态） | ❌ 定时对账器（事件流之外的第二套真相） |\n| 05 批（npm） | ❌ `vendor/published.json` 账本——\"**tag 反正必须存在，所以它没有引入状态的第二份拷贝**\" |\n| 06 批（索引） | ❌ 生成的 Agent Note 索引——复制了路径、日期、H1，而且是个**合并热点** |\n| **09 批（notices）** | ✅ 生成的第三方声明——三问全满足 |\n\n**两种成本**：第二份真相的代价不止\"要同步\"（漂移），还有**争用**——无关分支每次都要重写同一份文件。\n\n**被否决的对照方案说明了关键所在**：把校验做成一个专门的 `doc-sync` 门，它\"**唯一的失败模式，是在一个贡献者推完无关的依赖升级几分钟后，告诉他去重跑生成器**\"——**把同步成本推给一个人**。这个方案输在第三问上。\n\n**11 批补了一条更根本的论据**：拒绝\"从源码生成中央上下文目录\"的理由不止\"会漂移\"，还有——**AST 能找到注册，但推断不出语义条件**（历史保留、输出截断、父子可见性、辅助模型边界）。\n**当源信息不足以生成正确的副本时，这个副本的问题不是\"需要维护\"，而是\"不可能正确\"。**\n\n### 模式 C：别把不同的事混成一种状态（出现 6 次）**← 10 批出现危险形态**\n\n| 出处 | 被拆开的两种 |\n|---|---|\n| 03 批 ③ | 交接（谁拥有下一步）vs 判定（GitHub 认为可合并） |\n| 04 批（标签） | 意图（kind）vs 语义范围（area） |\n| 05 批 ① | 未满足的合并条件 vs 评估失败（`pending` vs `error`） |\n| 05 批 ② | 没有那个版本 vs 有但内容不同（重跑 vs 未升版本的改动） |\n| **10 批（依赖区段）** | **分发浏览器代码 vs 让安装器下载同名包**——同一个 `devDependencies`，回答\"要不要下载\"与\"要不要披露\"是两个问题 |\n| **10 批（CI 条件）** | **失败聚合 vs 资源清理 vs 被取消运行的簿记**——三种不同的义务 |\n| **11 批（Model Experience）** | **\"不使前缀失效\" vs \"保证缓存命中\"**——前者是这个包能承诺的，后者只有 provider 能承诺。一句话划清责任边界 |\n| **12 批（分区覆盖）** | **阈值所有权属于合并后的报告**——\"每个分区有意只看到套件的一部分，会报告假未覆盖文件\"。**一个有意不完整的部分，不能对自己作整体判定** |\n| **14 批（Windows job）** | **\"阻塞 / 红色可见但不阻塞 / 忽略\"是三种处置**——`windows-coverage` 缺席于聚合 `needs`，所以它的阈值失败\"**保持红色且可见，而不延迟必需的裁决**\"。**把三种压成两种必然损失信息** |\n\n**危险形态（10 批点明）**：**success-only 的聚合\"能把失败的依赖藏在一个被跳过的必需检查后面\"**。\n**混淆状态时，错误的方向是\"把失败显示成通过\"**——这比漏报更危险，因为漏报至少还能被发现，而假通过会一路走到底。\n\n**判据**：当一个字段名（`devDependencies`、`always()`）开始承担第二个问题时，**错误就藏在两个问题的差集里**。\n\n### 模式 D：验证到消费点，而不是产出点（出现 4 次）**← 12 批给出新强度**\n\n| 出处 | 表现 |\n|---|---|\n| 01 批（门禁） | 门禁必须有退出码契约；`verify-deploy-rename.mjs` 那种\"只打印不退出\"的形状无法挂到任何自动化上 |\n| 04 批 ③ | GIF 发布不满足于\"push 成功\"，要重读活体 body、用 Markdown API 渲染、抓取上传 URL 确认 `200 image/gif`——**那才是评审者实际看的东西** |\n| 07 批（GUI 测试） | **\"fixture 全绿不算完成，真链路也必须通过\"**——**fixture 短路掉的正是链路运载链，而两个经验确认的 bug 都藏在那里** |\n| **12 批（分区覆盖）** | **\"未完成运行不是增加并发的证据\"**、\"反复重启会抹掉唯一的证据\"——**把\"什么算证据\"推进到了\"证据的形成条件\"**：不仅要求\"我看到的是真的\"，还要求\"**我看到的时候，条件没有被我的观察行为破坏**\" |\n| **13 批（串行参考）** | **\"调度和验证共享实现假设\"**——所以需要一条**不共享假设的独立路径**（串行聚合）作完整性预言机。**同一实现既调度又验证时，它的错误会同时骗过两边** |\n\n**通用问法**：这个验证手段**短路掉了什么**？被短路的那一段，就是故障的藏身处。\n**12 批的追加问法**：**我这次的观察行为，会不会破坏我正在观察的那个东西？**\n**13 批的追加问法**：**承担验证的那条路径，和被验证的对象共享实现吗？**\n\n### 模式 E：范围蔓延防御（出现 2 次）\n\n| 出处 | 表现 |\n|---|---|\n| 04 批 ⑥ | \"有限的场景/修复范围，防止一个宽泛的性能请求变成一次无关的架构重写\" |\n| 05 批 ⑧ | 自动元数据修复被拒绝：\"它们是独立的决策，而不是随一次政策简化捎带进来\" |\n\n### 🆕 模式 F：可预测性战胜精确性（06 批新增，出现 1 次）\n\n| 出处 | 表现 |\n|---|---|\n| 06 批（子系统页面） | 一条更**精确**的规则（\"这个类型在每一轮都被循环持有/派生/流式/记录\"）输给了一条更**粗糙但可预测**的规则（按仓库布局）。原因不是精确性不好，而是**要求\"逐例判断重要性\"的规则会在两个方向同时出错：收进不该收的，漏掉该收的**——它漏掉了半个公共 API，同时收进了四个包的类型 |\n\n**判据**：当一个规则要求\"逐例判断重要性\"时，它已经在制造漏洞了。\n\n### 🆕 模式 G：冻结 = 明确放弃更新义务（06 批新增，出现 1 次）\n\n| 出处 | 表现 |\n|---|---|\n| 06 批（归档） | 归档笔记**被所有其他文档门禁排除**，理由是\"它们演变的标准不能产生编辑历史的压力\"；且**不随重命名包、变化的行为、翻译标准、格式规则、断裂链接更新** |\n\n**判据**：只冻结内容而不划掉维护义务，等于没冻结——历史会持续产生工作量，而它已经不再提供价值。\n\n### 🆕 模式 H：让工具的错误成为防线（07 批新增，出现 1 次）\n\n| 出处 | 表现 |\n|---|---|\n| 07 批（pnpm） | **刻意不加** `node-linker=hoisted` / `shamefully-hoist` 逃生舱——非扁平的 `node_modules` 会让**幻影依赖大声失败**，而\"这对于一个整个质量故事都是机械门禁的仓库是一个 *feature*\" |\n\n**判据**：选工具时问的不是\"它的报错会不会烦到我\"，而是\"**它的报错恰好是我需要的那个信号吗**\"。\n\n### 🆕 模式 I：越界的机制不能走那条被阻塞的路径（08 批新增，出现 1 次）\n\n| 出处 | 表现 |\n|---|---|\n| 08 批（CI 故障切换） | 有意的困境：企业池挂了 → **所有 PR 不可合并** → **\"合并一个修复\"这个常规恢复手段也被封死**。所以切换机制被设计成**仓库变量**而非一次合并——\"**它在检查是红的时候也能工作**\" |\n\n**判据**：设计应急机制时先问——**它依赖的通道，在它要应对的那种故障里还通吗？**\n\n### 一条张力（值得持续追踪）\n\n01 批的标准是\"**可机械判定的不变量必须编码成检查**\"，但 02 批第 3 篇**主动不机械化**（术语是无界自然语言，硬上会误伤合法散文）。\n\n两句合起来才完整：**\"能不能被机械判定\"本身需要判断**；硬上一道会误伤的门禁，会制造 01 批说的坏训练（教所有人无视规则）——**那比没有门禁更糟**。\n\n## 已读篇目清单（17 篇）\n\n| # | 篇目 | 批次 |\n|---|---|---|\n| 1 | `2026-06-11-quality-gates` | 01 |\n| 2 | `2026-07-02-bilingual-docs-and-pairing-gate` | 01 |\n| 3 | `2026-07-04-doc-tiers-and-budgets` | 01 |\n| 4 | `2026-07-06-parallel-pre-push-gates` | 01 |\n| 5 | `2026-08-19-remove-knip` | 01 |\n| 6 | `2026-08-09-concrete-prose-names-actors-and-recorded-facts` | 02 |\n| 7 | `2026-07-05-uniform-agent-note-format` | 02 |\n| 8 | `2026-08-09-committed-artifact-citations` | 02 |\n| 9 | `2026-08-10-event-directed-pr-review-status` | 03 |\n| 10 | `2026-08-02-native-github-stacks-and-optional-rebases` | 03 |\n| 11 | `2026-07-26-dependencies-over-hand-rolling` | 03 |\n| 12 | `2026-09-06-evidence-driven-performance-skill` | 04 |\n| 13 | `2026-08-08-browser-gif-evidence-chain` | 04 |\n| 14 | `2026-08-08-unified-github-label-taxonomy` | 04 |\n| 15 | `2026-08-10-npm-release-sequences` | 05 |\n| 16 | `2026-09-09-blocked-weighted-approvals-remain-pending` | 05 |\n| 17 | `2026-09-03-semantic-issue-templates-and-policy` | 05 |\n| 18 | `2026-07-19-remove-generated-agent-note-index` | 06 |\n| 19 | `2026-07-26-frozen-agent-note-archive` | 06 |\n| 20 | `2026-08-03-package-anchored-subsystem-pages` | 06 |\n| 21 | `2026-06-16-pnpm-over-yarn` | 07 |\n| 22 | `2026-06-17-ts-build-config` | 07 |\n| 23 | `2026-07-20-gui-testing-system` | 07 |\n| 24 | `2026-07-19-web-styling-system` | 08 |\n| 25 | `2026-07-26-ci-failover-runbook` | 08 |\n| 26 | `2026-08-26-published-dependency-faces` | 08 |\n| 27 | `2026-07-30-generated-third-party-notices` | 09 |\n| 28 | `2026-07-27-worktree-local-lefthook` | 09 |\n| 29 | `2026-07-06-node-engine-floor` | 09 |\n| 30 | `2026-08-08-automatic-translation-pairing-merges` | 10 |\n| 31 | `2026-09-08-browser-third-party-build-inputs` | 10 |\n| 32 | `2026-09-09-cancel-superseded-ci` | 10 |\n| 33 | `2026-07-12-package-model-experience-contract` | 11 |\n| 34 | `2026-09-02-project-local-issue-planning-fields` | 11 |\n| 35 | `2026-09-06-master-only-platform-ci` | 11 |\n| 36 | `2026-09-06-release-rehearsal-selfhosted` | 12 |\n| 37 | `2026-08-18-in-job-partitioned-coverage` | 12 |\n| 38 | `2026-09-10-approval-review-workflow-identity` | 12 |\n| 39 | `2026-07-21-serial-cross-platform-ci-reference` | 13 |\n| 40 | `2026-08-28-ci-node-compile-cache-data-disk` | 13 |\n| 41 | `2026-09-08-playwright-video-gif` | 13 |\n| 42 | `2026-08-08-native-windows-pull-request-ci` | 14 |\n| 43 | `2026-09-06-node-compatibility-selfhosted` | 14 |\n| 44 | `2026-09-09-parallel-macos-notarization` | 14 |\n| 45 | `2026-09-06-preview-hosted-runner-sizing` | 15 |\n| 46 | `2026-09-06-python-runtime-windows-hosted` | 15 |\n| 47 | `2026-09-09-blacksmith-failover-leg` | 15 |\n\n## 后续可选（未读范围）\n\n`process/` 已 100% 读完。**未读的是另外 5 类**——按第 06 批学到的方法论，它们属于\"另一类\"：读它们更像读**产品决策**，而不是流程决策。\n\n| 范围 | 篇数 | 性质 |\n|---|---:|---|\n| `implemented/architecture` | ≈ **113** | 关于已交付源码的结构决策 |\n| `implemented/feature` | 75 | 面向用户或模型的新能力 |\n| `implemented/bug-fix` | 32 | 缺陷修正与事故复盘 |\n| `implemented/testing` | 20 | 测试基础设施与策略 |\n| `implemented/simplification` | 18 | 移除代码而不新增能力 |\n| `proposed/`（全部） | 21 | 提案，含 `2026-07-13-human-review-skill-maintenance` |\n| `rejected/`（全部） | 14 | 被拒绝的提案，**理由即主要内容** |\n| ~~`archived/`~~ | ~~629~~ | **冻结历史**，官方明确\"不得视为当前行为的权威依据\"，不算遗漏 |\n\n**若要继续，建议的优先顺序**：\n\n1. **`rejected/`（14 篇）**——被否决的理由信息密度最高，与已读的\"边界/否决方案\"主题最契合\n2. **`proposed/process/`（7 篇）**——含那份双评审者流程，是\"人机协作形态\"的直接延续\n3. **`implemented/architecture/` 中与门禁、验证、文档治理相关的少数篇目**（本次补记已读了两篇：`configuration-source-ownership`、`outbound-proxy-policy`）\n4. 其余按需查阅，不必逐篇\n"},{"file":"2026-09-10-DSH决策记录的人机协作形态.md","date":"2026-09-10","slug":"DSH决策记录的人机协作形态","title":"DSH 决策记录的人机协作形态","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"来源：.agents/notes/README.md（125 行，制度的正式文件） 它对自身的定性在开头第一段：","bytes":11239,"lines":167,"body":"# DSH 决策记录的人机协作形态\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **这份笔记补的是什么**：前 15 批只覆盖 `implemented/process/`（47 篇）。这次查出全库实际有 **974 篇英文 Agent Note**，而我此前报的\"230 篇 architecture\"是**文件数**（含中文配对），英文只有 115 篇。\n> 本篇补上三类此前未纳入的材料：**Agent Note 制度本身**、**人机分工的一手证据**、以及**\"什么时候不该用机器判定\"的判据**——最后这条正是前一批末尾列为\"没有答案\"的那个问题。\n\n---\n\n## 一、Agent Note 是什么\n\n来源：`.agents/notes/README.md`（125 行，制度的正式文件）\n\n它对自身的定性在开头第一段：\n\n> 一份 **Agent Note** 记录一个影响本代码库的决策或提案——**其中的\"为什么\"和\"我们放弃了什么\"，即代码与文档承载不了的那些部分**。\n\n三个关键设计：\n\n**① 路径就是状态。** 格式为 `{生命周期}/{类别}/日期-主题.md`，两轴都编码在路径里：\n\n| 生命周期 | 含义 |\n|---|---|\n| `proposed/` | 实施前经过评审的提案，尚未建成 |\n| `implemented/` | 决策已交付。记录决定了什么、否决了什么，**并随实际交付物保持最新**（只更新事实——路径、名字、结构——不更新决策本身） |\n| `rejected/` | 提案被审议并拒绝。**只在它的理由能阻止一个诱人且有意义的错误时才保留**，否则整组删除 |\n\n| 类别（共 6 个，封闭集合） | 覆盖范围 |\n|---|---|\n| `feature` | 面向用户或模型的新能力 |\n| `bug-fix` | 修正缺陷，或补上事故复盘暴露的缺口 |\n| `simplification` | 移除代码、行为或表面积，而不新增能力 |\n| `architecture` | 关于**已交付源码**的结构决策 |\n| `process` | 代码**周边**的工具、政策、工作流（门禁、包管理器、vendoring），不是运行时行为 |\n| `testing` | 测试基础设施与策略 |\n\n**② 强制的 `## Alternatives considered`。** 每一篇都必须有这一节，且：\n\n> **决策若没有记下它击败了什么，就会招致\"重新打官司\"——而那正是 Agent Note 存在要防止的失败。**\n\n**③ 正文骨架按生命周期固定**（`implemented/` 是 `Problem → Decision → Alternatives considered → Consequences`），由门禁强制；`Proposal`、`Plan`、`Acceptance criteria` 这类提案期标题**在 implemented 里被门禁拒绝**。\n\n---\n\n## 二、谁执笔、谁评审、谁授权\n\n`.agents/notes/AGENTS.md` 第 3 行是直接答案：\n\n> Agent Notes are effectively **RFCs written by agents**（Agent Note 本质上是由 agent 撰写的 RFC）。\n\n三种角色在材料里都能定位：\n\n| 角色 | 依据 |\n|---|---|\n| **agent：执笔与执行** | 上句；`process/2026-06-11-quality-gates.md`：本代码库**主要由编码 agent 开发** |\n| **人：评审者** | `process/2026-08-09-committed-artifact-citations.md` 记录了\"**大型设计与评审会话**\"会留下 **reviewer rulings（评审者裁决）**；`README.md`：由**评审**强制执行\"非平凡变更必须写 Note\"这条语义边界 |\n| **人：项目所有者** | `process/2026-07-30-generated-third-party-notices.md`：**项目所有者单独授权**分发某个 SDK 的每一个官方版本 |\n\n第三种最值得注意——**那是机器拿不到的信息**：开源合规要求披露某份依赖，这件事\"不是工程必须，是开源必须\"，而授权只能由人给出。\n\n还有一处能说明协作的严格程度。`proposed/process/2026-07-13-human-review-skill-maintenance.md` 描述了一个**双评审者流程**，它把每条反馈的作者分成三类：**`human-authored`（人写的）/ `forwarded-automation`（agent 转发机器发现的）/ `unclear`（无法判定）**，然后：\n\n> 从\"已被修复的机器人发现\"里学习 —— **否决：来源契约是人的评审反馈**。作者类型在分析之前就被过滤。\n\n**他们只从人的反馈里学习，并明确过滤掉 agent 转发的内容。** 人和 agent 在这里不是可互换的两种劳动力。\n\n---\n\n## 三、关键判据：什么时候**不该**用机器判定\n\n这回答了前一批末尾\"我没有答案\"的那个问题——**判据就在这条规则里**。\n\n`README.md` 要求：**每个非平凡变更必须在同一个 PR 里添加或更新至少一个 Agent Note**。但这条规则**没有门禁**：\n\n> **评审强制这条语义边界。没有任何自动门禁试图把一个 diff 分类为平凡或非平凡**，所以这条政策不增加门禁阶段或运行时。\n\n被否决的对照方案给出了完整理由（`archived/process/2026-07-19-require-agent-notes-for-non-trivial-changes.md`）：\n\n> **加一道 CI 的 diff 分类门禁。** 一个机械检查**无法可靠判断一个语义变更是否平凡**，而另一道门禁会增加运行时，**并招致误报或表面合规（superficial compliance）**。\n\n拆开是两条理由，缺一不可：\n\n1. **能力上不可靠**：机械检查无法可靠判断\"语义上是否平凡\"\n2. **代价上不划算**：多一道门禁增加运行时，而且会招致**误报**与**表面合规**\n\n**\"表面合规\"（superficial compliance）** 这个词是新的，它比\"误报\"更精确：**一道不可靠的门禁不会让人去解决它想解决的问题，而是让人学会迎合它。**\n\n这和第一批读到的\"一刀切天花板会**训练贡献者橡皮图章式地批准提高上限**\"，是同一失败模式的两种表述。\n\n### 由此修正第 4 档与第 6 档的区别\n\n我此前说\"两者都不强制，所以没找到判据\"——**这个框定本身是错的**。它们的区别不在\"强不强制\"，而在**机器是否具备可靠的判定能力**：\n\n| 档位 | 机器的判定能力 | 处置 | 为什么 |\n|---|---|---|---|\n| **参考性（advisory）** | **不可靠**，但**跑起来仍有参考价值** | 跑，但不阻塞合并 | 例：Knip 的未使用代码扫描——泛化会误伤动态加载与生成代码，但宽泛信号本身有参考价值 |\n| **由评审负责（review-owned）** | **不可靠**，且**跑起来只有害处** | **不跑** | 例：\"这个 diff 是否平凡\"——跑起来会招致表面合规，且增加运行时 |\n\n**判据是：当机器的判定不可靠时，跑这道检查还有没有剩余价值？有则降级为参考性；没有且会招致表面合规，就交给评审。**\n\n你关于\"脚本失效会静默通过\"的那条洞察，恰好是这道题的另一面：**不可靠的判定有两种危害——静默通过（漏），和表面合规（把注意力从真问题引开）。** 后者更隐蔽，因为它会让人以为自己合规了。\n\n---\n\n## 四、\"脚本静默失效\"在被防御的名单上\n\n你指出\"脚本也要有适用环境，外部条件变了会使脚本失效，进而静默通过\"。这不是多虑——**它是一个被专门命名的失效模式，且有一整类防御对应**：\n\n| 防御 | 出处 |\n|---|---|\n| **拒绝缩窄的语料** | `scripts/verify-client-ui-i18n.ts`：*\"discovery narrowed to N source file(s); expected at least M\"*；对应决策 `architecture/2026-08-23-locale-owned-client-ui-copy.md`：\"**Discovery refuses a narrowed corpus**\" |\n| **空语料直接失败** | `scripts/verify-cordis-config.ts`：包自身配置扫描为空 → 报错；fixture 数量为零 → 报错 |\n| **明写覆盖缺口** | `process/2026-08-09-committed-artifact-citations.md`：*\"**Coverage gap**: no gate rejects a new ordinal citation — review owns the rule.\"* |\n| **声明不声称什么** | `architecture/2026-08-04-configuration-source-ownership.md`：门禁*\"makes no repository-wide claim about `process.env` access\"* |\n\n**结论：他们防的不只是\"脚本判错\"，而是\"脚本因为环境变了、扫描面缩了，然后静默地报绿\"。** 这在他们那里是一整类防御，不是边角问题。\n\n---\n\n## 五、覆盖率清点（修正此前的数字）\n\n| 目录 | 英文篇数 | 状态 |\n|---|---:|---|\n| `implemented/`（6 类） | **310** | process/ 47 篇已 100% 读毕；其余 263 篇未读 |\n| `proposed/` | 21 | 未读（本次查证读了 1 篇） |\n| `rejected/` | 14 | 未读 |\n| `archived/`（冻结历史） | 629 | 未读（本次查证读了 1 篇） |\n| **合计** | **974** | **已精读 47 篇 = 4.8%** |\n\n两个必要的限定：\n\n- **`archived/` 不是遗漏**。按第 06 批读到的归档政策，它是**冻结的历史**，官方明确要求\"**不得将其视为当前行为的权威依据**\"，且所有文档门禁都跳过它。所以当前权威是 `implemented` + `proposed` + `rejected` = **345 篇**，我读了其中 **47 篇（13.6%）**。\n- **`process/` 是唯一的完整覆盖**。这不是\"我读了 4.8% 所以学得少\"，而是\"**我完整读完了\"流程与政策\"这一整类，其余 5 类（架构、功能、缺陷、简化、测试）只读了它们的流程侧**\"。\n\n---\n\n## 六、附：这次会话本身也是同构的\n\n你指出\"我们的这次会话不也是一次 Agent Note 吗，你在执笔不是吗\"——**结构上确实高度吻合**。\n\n这 15 批笔记的每一篇，用的骨架正好是 `implemented/` 的规定骨架：\n\n| Agent Note 的规定骨架 | 本系列笔记的对应小节 |\n|---|---|\n| `## Problem` | 「他们遇到的事」 |\n| `## Decision` | 「判断」 |\n| `## Alternatives considered` | 「被否决的方案」 |\n| `## Consequences` | 「他们承认的代价」 |\n\n而本次会话的过程，也与那套流程同构：**你提出判断 → 我去取证（读源码与决策记录）→ 落盘 → 你复核并提出修正**。\n\n**但有三处实质差别，值得记下来：**\n\n1. **读者不同，所以形态不同。** DSH 的 Agent Note 写给\"将来要改动这块代码的人或 agent\"；本系列笔记写给\"想学这套判断方法的人\"。前者为**行动**服务，后者为**理解**服务——所以笔记保留了大量的\"他们凭什么这么判断\"，而 Agent Note 本身不需要解释自己的方法论。\n\n2. **我们缺少 supersession 检查（取代关系检查）。** `README.md` 要求写一篇新 Note 时必须检索活跃树中覆盖同一决策的旧 Note，并分类完全取代或部分取代。我在写这 15 批时**没有做这件事**——我不知道它们是否与 SSiD 已有的学习笔记重复或冲突。\n\n3. **我们的产物没有状态字段。** Agent Note 的 `Status:` 行与文件夹互为校验（门禁会交叉检查），而本系列笔记是\"一次性写就\"的——它们不会随 SSiD 的实践演进被更新。**如果以后要拿它们当规范用，这会成为问题。**\n\n---\n\n## 下一步（待你定）\n\n1. **是否要把\"人机协作形态\"这套结论回写进总表**？现在它只在这一篇里，总表的\"工作方式\"一节没有覆盖它。\n2. **是否要补做 supersession 检查**（第六节第 2 点涉及的问题）——即检查本系列笔记与 `2026-09-10-DSH工程方法论学习笔记.md` 等已有文档是否重复。\n3. **剩余 263 篇 implemented/ 非 process 类**要不要继续读——按第 06 批学到的方法论，它们属于\"另一类\"，读它们更像读产品决策而非流程决策。\n"},{"file":"2026-09-10-DSH作为AI中台内核的评估框架.md","date":"2026-09-10","slug":"DSH作为AI中台内核的评估框架","title":"DSH 作为 AI 中台内核：评估框架（2026-09-10）","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["dsh-observations"],"summary":"不采纳的理由有硬依据，不是印象： - 官方 AGENTS.md 明写 \"Public APIs are pre-stable; update every consumer.\" - 会话格式处于 v0 → v1 → v2 → v3 的演进中（v3 于 0.1.5-alpha.1 落地，rc.1 与 rc.2 之间仍在补迁移细节） - 发布节奏：24 天 16 个 tag（08-17 ~ 09-10）","bytes":2884,"lines":60,"body":"# DSH 作为 AI 中台内核：评估框架（2026-09-10）\n\n> 背景：用户曾考虑以 DSH 作为公司 AI 中台的内核，因当时 DSH 刚发布而未采纳。本文件固化那次判断的依据，并给出未来的就绪判据与可立即采用的中间道路。\n> 依据：本工作区对主库的持续观察（`dsh-observations/`）+ 官方 `AGENTS.md`、`docs/architecture.md` 的原文表述。\n\n> 状态：已决策（推断 · 2026-09-12）\n\n## 1. 当时的判断与依据\n\n不采纳的理由有硬依据，不是印象：\n\n- 官方 `AGENTS.md` 明写 \"Public APIs are pre-stable; update every consumer.\"\n- 会话格式处于 v0 → v1 → v2 → v3 的演进中（v3 于 0.1.5-alpha.1 落地，rc.1 与 rc.2 之间仍在补迁移细节）\n- 发布节奏：24 天 16 个 tag（08-17 ~ 09-10）；09-08 → 09-10 三天内四个版本\n- 无 LTS 概念、无商业支持渠道\n\n结论：不是「简陋」，是「未定型」。\n\n## 2. 就绪观察信号\n\n| 维度 | 2026-09-10 现状 | 就绪信号 |\n|---|---|---|\n| API 稳定性 | pre-stable，每次变更须更新所有消费者 | 发布 stable（非 rc/alpha）+ 稳定性承诺窗口 |\n| 会话格式 | v3 刚落地，迁移机制已建但仍在演进 | 格式冻结，或有 LTS 级别的迁移保证 |\n| 发布节奏 | 三天四个版本 | 季度级，且破坏性变更预先公告 |\n| 工程成熟度 | test/ci 占比升至 34%（在补基建） | 覆盖率与性能有硬门禁 |\n| 支持体系 | 无 LTS、无服务渠道 | 有 LTS 分支与服务渠道 |\n\n一句话判据：**官方开始承诺「某接口 N 年不变」之日，才是可以压上中台之时。**\n\n## 3. 中间道路：把 DSH 当可替换的 Agent 运行时\n\n即使现在，也可以按「可替换」的方式使用 DSH，不必等它稳定：\n\n1. 业务逻辑留在自己的服务里；DSH 只负责 Agent 编排与工具调用\n2. AI 能力通过 DSH 的工具/插件暴露，但接口由我们定义\n3. 不把 DSH 内部契约写进业务代码（会话格式细节、slot 名、投影缓存结构）\n4. DSH 升级时只改适配层；将来替换 DSH 也不伤害业务\n\n这套做法与 DSH 自身的设计哲学相容：官方声明「没有特权内核可改，一切皆插件」，意味着它本来就预期被组合与替换。\n\n## 4. 边界：哪些不是 DSH 的责任\n\n中台化的真正难点不在「能否用 DSH 承载 Agent」，而在：\n\n- 多租户隔离\n- 多服务编排\n- 长生命周期运维\n\n这三件由中台自己负责。边界划清，DSH 是好用的组件；划不清，它每次升级都会变成故障源。\n\n## 5. 评估节奏\n\n每季度对照 §2 表评估一次，或在下列事件发生时立即重评：\n\n- 官方发布 stable（非 rc/alpha）版本\n- 官方宣布会话格式冻结或 LTS 计划\n- 官方为插件 API 给出稳定性承诺\n- 官方桌面端正式发布（产品化信号）\n"},{"file":"2026-09-10-skill适配说明-01-测试可靠性.md","date":"2026-09-10","slug":"skill适配说明-01-测试可靠性","title":"skill 适配说明 01：测试可靠性","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@types/node","@22.20.1/test.d.ts","dsh-ci-test-reliability","dsh-skills","ssid-test-reliability","dsh-chat-rail","dsh-quick-toolbar","dsh-ssid-panels","dsh-code-review","dsh-pre-push-checks","ssid-release","dsh-ssid-zh-ui"],"summary":"1. 改动最小——它的内容几乎全是跨平台、并发、时序的通用判据，与仓库规模无关 2. SSiD 立刻用得上——你们有 vitest（10 个插件）、node:test（4 处载体：shell 本体、dsh-chat-rail、dsh-quick-toolbar、dsh-ssid-panels）、Playwright（真实浏览器），且要跨 Windows/macOS 3. 它是别的 skill 的依","bytes":30129,"lines":380,"body":"# skill 适配说明 01：测试可靠性\n\n> **本说明的地位**：它是适配工作的**依据**，不是 skill 本身。复核通过后才生成 skill 文件。\n> 状态：进行中（推断 · 2026-09-12）\n\n> 这是本系列的第一份，因此它同时**示范适配说明的格式**，后续 11 个照此办理。\n\n**上游 skill**：`dsh-ci-test-reliability`\n**上游位置**：`DSHfork/.agents/skills/dsh-ci-test-reliability/`（`SKILL.md` 131 行 + `references/ci-flake-diagnosis.md` 60 行）\n**上游版本锚点**：本次读取自 DSHfork 工作副本，HEAD 为 `c291e7961a`（detached at origin/master），抓取日期 **2026-09-10**\n**清点分类**：✅ 小改即可用（见 `2026-09-10-DSH-skills适配清点.md`）\n**拟落点**：`seek-soul-in-darkness/.agents/skills/ssid-test-reliability/`\n\n---\n\n## 一、为什么先做这一个\n\n1. **改动最小**——它的内容几乎全是跨平台、并发、时序的通用判据，与仓库规模无关\n2. **SSiD 立刻用得上**——你们有 vitest（10 个插件）、node:test（**4 处载体**：shell 本体、dsh-chat-rail、dsh-quick-toolbar、dsh-ssid-panels）、Playwright（真实浏览器），且要跨 Windows/macOS\n3. **它是别的 skill 的依赖**——`dsh-code-review` 与 `dsh-pre-push-checks` 都指向它，先做它能解锁后面两个\n\n---\n\n## 二、SSiD 侧现状（已核实）\n\n> **核实方法**：扫各 `package.json` 的 `test` 脚本 + 读运行器配置 + **读 `node_modules` 里运行器自己的源码与类型声明**。最后一项是有意的：第一版我按印象写了\"12 个 vitest 插件\"，回去核对原文发现是错的（见 2.3）。\n\n### 2.1 运行器全景\n\n| 运行器 | 载体 | 触发方式 | 超时配置 |\n|---|---|---|---|\n| **node:test**（4 处载体，SSiD 主力） | shell 本体（2 文件） | `npm test` → `node --import tsx/esm --test tests/profile-merge.spec.ts tests/codegraph-adapt.spec.ts` | **无** |\n| | dsh-chat-rail、dsh-quick-toolbar | `npm test` → `node --import tsx/esm --test tests/**/*.spec.ts` | **无** |\n| | dsh-ssid-panels（2 文件） | **无 npm 脚本**，靠 `ssid-release` skill 手跑单文件 | **无** |\n| **vitest 4.1.11**（10 处，全是插件） | `max-null-plugins/` 下 10 个插件 | `npm test` → `vitest run` | 仅 4 个有 config，且只设 `include` + `environment` |\n| **Playwright 1.57.0** | `shell/tests/plugin-adapt/`：`cases/` + `baselines/` + `helpers/ssid.ts` + 60 余个 `.mjs` 探针 | `npm test` → `playwright test` | 60 s 用例 / 30 s 导航 / 15 s 动作（**三层递减**） |\n| CI | 仅 `.github/workflows/build-mac.yml`（其余为本地/手动） | — | — |\n\n**两个与预期相反的结论**：\n\n1. **node:test 才是 SSiD 的主力**（4 处载体），vitest 是插件专属（10 个但全在 `max-null-plugins/`）。所以上游那份面向\"CI 里的 vitest\"写的 skill，移植到 SSiD 时**主力运行器反而是上游没细讲的那个**。\n2. **只有 Playwright 有超时纪律**，而且是分层预算 + `retries: 0`（主动不掩盖 flake）——**这一处 SSiD 做得比 skill 要求的还好**，应当反过来写进适配版当正面样板。另两个运行器是裸默认，见 §三.6。\n\n### 2.2 dsh-ssid-panels 的测试没有接线\n\n`plugins/dsh-ssid-panels/tests/` 下有 `prompt-seeds.test.ts`（4581 B）与 `release-notes.test.ts`（1589 B），用 `node:test` 写就，但：\n\n- `package.json` 的 `scripts` 只有 `build` / `typecheck` / `watch`，**没有 `test`**\n- `node_modules/` 里**没装 vitest**，devDependencies 里也没有（所以它们确实不是 vitest 测试）\n- 唯一入口是 `ssid-release` skill 里的手跑命令（`SKILL.md:33`、`:50`），且该 skill 记了一个坑：**必须在仓库根或有本地 tsx 的目录跑**，绝对路径 + 错误 cwd 会 `ERR_MODULE_NOT_FOUND`\n\n**为什么这条要写进适配说明**：它正是上游第 1 节 \"Read the owning rules\" 要防的情形——**测试存在 ≠ 测试在跑**。CI 不会跑它们，新人不知道要跑。适配版应把\"哪些测试由谁在什么时机跑\"当作**判据的输入**写清楚，而不是假设\"有测试就有纪律\"。\n\n### 2.3 第一版的错误（留痕）\n\n| 位置 | 第一版写的 | 核实后的事实 |\n|---|---|---|\n| §2 表格 | \"用 vitest 的插件 12 个\"，并列出 dsh-ssid-panels / dsh-ssid-zh-ui / dsh-chat-rail | vitest **10 个**，且全部在 `max-null-plugins/` |\n| 同上 | dsh-chat-rail 同时出现在 vitest 栏与 node:test 栏 | dsh-chat-rail 是**纯 node:test**（devDependencies 无 vitest；`test` = `node --import tsx/esm --test tests/**/*.spec.ts`） |\n| 同上 | 暗示 dsh-ssid-zh-ui 有测试 | 它连 `src/`、`tests/` 都没有，只有 `lib/` + `cordis.patch.yml` + `verify-zh-ui.cjs`，**无测试** |\n| §三.7 | \"node:test 的 `afterEach` 需从 `node:test` 导入，与 vitest 全局注入不同\" | **两个运行器都是显式导入**——SSiD 没开 vitest 的 `globals: true`，vitest 侧同样要 `import { describe, it, expect } from 'vitest'` |\n\n**教训**：这类\"数一数有多少个\"的事实，凭扫描结论的中间产物（记忆里的片段）会错，必须回到 `package.json` 原文。**适配说明里的每一项统计都应当可复现**——否则它会成为下一份文档的错误输入。\n\n**关键结论（修正后）：适配的主要工作不是\"换运行器术语\"，而是三件事**——① 同一份判据给出两个运行器各一版示例；② 补上 SSiD 缺失的超时纪律；③ 把 Playwright 那处已经做对的实践反向写进 skill。判据本身仍**一条不减**。\n\n---\n\n## 三、逐条适配判断\n\n上游 12 个小节，逐一判断。**判定分四类**：原样保留 / 改写 / 删除 / 新增。\n\n### 1. Read the owning rules（5 个链接）→ **改写**\n\n上游让 agent 先读 5 个\"归属规则\"再动手：`docs/testing.md`、`docs/defensive-patterns.md`、当前 Vitest 配置、`snapshots/AGENTS.md`、`dsh-pre-push-checks`。\n\n**SSiD 逐项对照**：\n\n| 上游指向 | SSiD 对应物 | 适配动作 |\n|---|---|---|\n| `docs/testing.md` | `docs/SSiD开发手册.md` §9（插件开发与测试规范，含 L1/L2/L3 分级门槛） | 改指向 |\n| 当前 Vitest 配置 | **存在 4 个**：dsh-plugin-center / dsh-capture / dsh-draft-polish / dsh-skill-mcp-center 的 `vitest.config.ts` | 保留，但**必须补 node:test 一侧**（见下） |\n| `docs/defensive-patterns.md` | **无**（`docs/` 下只有手册、发版流程、genui 手册、README、初版验证清单、release-notes） | 删除，不硬造 |\n| `snapshots/AGENTS.md` | **无**——全库无 `toMatchSnapshot`/`toMatchInlineSnapshot`，也无 `snapshots/` 目录 | 删除 |\n| `dsh-pre-push-checks` | 待该 skill 适配完成后 | 暂留空，或指向手册的发版流程 |\n\n**第一版我写的是\"这些文档都不存在\"，错了**——Vitest 配置确实存在。更要紧的是**光指配置还不够**：SSiD 的主力运行器是 node:test（§2.1），而 **node:test 没有配置文件**，它的纪律**只存在于 `package.json` 的 `test` 脚本里**。所以适配后这一节的真实指向是三条：\n\n1. **vitest 侧** → 那 4 个 `vitest.config.ts`\n2. **node:test 侧** → `package.json` 的 `test` 脚本本身（这是它唯一的\"配置\"）\n3. **两者共同** → §2.2 那份\"哪些测试由谁在什么时机跑\"的清单（否则 agent 会假设\"有测试就有纪律\"）\n\n**为什么这条在上游重要**：它让读者（agent）能读到**真实的超时、并发、重试设置**，而不是去猜。留一个空链接，agent 就会猜——那正好违背第 1 节的本意。\n\n**与 SSiD 手册的关系**：手册 §9 已有\"分级门槛（L1 仓库级 / L2 环境级 / L3 发版级）\"与\"反馈环纪律（先跑红再改绿）\"，**与上游是互补而非重复**——上游管\"测试怎么写才可靠\"，手册管\"什么时候必须跑什么\"。适配后两个文件应互相链接。\n\n### 2. Model the execution topology（4 层重叠模型）→ **改写**\n\n上游四层：同一 Vitest 文件内 → 不同 worker 进程 → 同一 job 内的独立进程 → 共享主机的不同 job。\n\n**SSiD 侧**：没有\"共享主机的不同 job\"这一层（无自托管池）。实际拓扑是三到四层：\n\n| SSiD 层 | 对应上游 |\n|---|---|\n| 同一 spec 文件内的用例 | 第 1 层（保留） |\n| 并行的 spec 文件 / vitest worker | 第 2 层（保留，但 vitest 与 node:test 表现不同） |\n| shell 与插件同时跑测试 | 第 3 层（改写：SSiD 的形态是\"多个包的测试同时跑\"） |\n| 本地开发机与 CI runner | 第 4 层（改写：由\"共享主机\"变为\"本地 vs GitHub runner\"） |\n\n**保留的核心判据（原样）**：\n> **进程隔离不隔离主机的端口、可预测文件系统路径、外部服务、数据库、socket 或继承的子进程。**\n\n以及：\n> **\"不要因为一个 fixture 缺隔离就把整个套件串行化。\"**（\"顺序化一个 Vitest 块无法保护主机资源免受另一个文件、进程、job 或 runner 的干扰\"）\n\n### 3. Allocate resources atomically → **原样保留**\n\n判据与运行器无关：\n\n- **用资源所有者的分配器，而不是\"先检查可用、稍后再占\"**：网络用 `listen(0)` 并**在服务器报告 listening 之后**才读回地址；**绝不要扫描空闲端口然后稍后绑定**\n- 用 `mkdtemp` 建私有临时根；**不要获取可预测的共享路径**\n- 给共享数据库、socket、会话、输出位置**唯一的按用例命名空间**\n- 需要\"路径必须尚不存在\"时用独占创建\n- **稳定的录制标识符要与临时传输地址分开**\n- **而\"仅作为解析器输入或期望值出现的字面路径/URL 不是被获取的资源——不要因为看起来是固定的就改写它们\"**\n\n**SSiD 注意点（已核实，且这条判据当场抓到问题）**：`shell/tests/plugin-adapt/` 下的探针脚本存在三类硬编码，而该目录的 `README.md` **自己已写明**\"页面 URL 是随机端口（如 52221），**断言勿硬编码端口**\"：\n\n| 问题 | 数量与实例 |\n|---|---|\n| **硬编码 token（已入库）** | **5 个文件**：`check-seed.mjs:2`、`grab-clean-modules.mjs:5`、`grab-clean-web.mjs:5`、`probe-3083.mjs:2`、`rc1-clean-check.mjs:3` |\n| **硬编码端口** | 约 28 个文件直接写 `'http://127.0.0.1:9222'`（未走 `SSID_CDP` 回退）；另有 5 个写 `3083` / `54170` |\n| **硬编码用户绝对路径** | `rc1-clean-check.mjs:4`：`executablePath: 'C:\\\\Users\\\\MaxNull\\\\AppData\\\\Local\\\\ms-playwright\\\\chromium-1237\\\\...'` |\n\ngit 跟踪状态已核实：**66 个文件被跟踪**，`.gitignore` 只排除 `node_modules/`、`test-results/`、`report/`，上述文件**全部已入库**。\n\n**关于 token 的风险判断**：那些 URL 里的是 DSH 的 **launch token**（`?token=`），而 `2026-08-24-browser-token-authentication.md` 记明\"**launch token 本身从不持久化，每次进程启动都变**\"——所以它们很可能已失效。**但这只是依据该决策记录的推断，我没有验证这些具体 token 的当前有效性。** 真正的问题是模式本身：把 token 写进测试脚本并提交，这个习惯不该留。\n\n**规范写法在同一个目录里就有**：约 22 个文件用了 `process.env.SSID_CDP ?? 'http://127.0.0.1:9222'`，README 还提到用 `findDshPage` 按 `http://` + 非 `file:` 匹配页面。**所以这不是\"不会写\"，是两批脚本的写法不一致。**\n\n**这正是本节判据的价值证明**——\"用资源所有者的分配器，而不是先检查可用、稍后再占\"与\"不要获取可预测的共享路径\"，在 SSiD 的第一批审计对象上就直接命中。\n\n### 4. Contain process-global state → **原样保留**\n\n清单与手法完整可用：`process.env`、`cwd`、假计时器、locale 与时区、模块 mock、注册表、console 钩子、`globalThis`、全局 `fetch` 拦截——**都当独占可变资源**。\n\n手法保留原样：捕获原值是缺失还是存在 → 恢复那个确切状态 → 立即注册恢复 → 最小作用域 `try/finally` → 保留 `afterEach` 兜底 → 拦截最窄的确切请求。\n\n**SSiD 注意点**：**两个运行器都是显式导入**（SSiD 没开 vitest 的 `globals: true`），所以这节的手法在两边写法几乎一致——node:test 用 `import test from 'node:test'` + `import assert from 'node:assert/strict'`，vitest 用 `import { describe, it, expect, beforeEach, afterEach } from 'vitest'`。**两版示例仍要给，但差异比预想的小。**\n\n### 5. Respect platform-owned semantics（4 条 Windows）→ **原样保留，且价值更高**\n\n四条全部与 SSiD 强相关（你们要出 Windows NSIS 与 macOS 包）：\n\n- **写回值只在断言容忍写回失败时才安全**（mtime 精度、NTFS 的 100 纳秒刻度）\n- **Windows 环境变量名大小写不敏感**——`http_proxy` 与 `HTTP_PROXY` 当作两个键的 fixture 在那里只有一个条目\n- **Windows 异步释放文件句柄**——POSIX 上立即完成的 rename/remove 需要**按实测争用规模定大小的有界重试**\n- **Windows 没有 POSIX 权限与信号语义**——依赖它们的用例**显式平台跳过并写明原因**，而不是到处弱化断言\n\n**新增建议**：SSiD 已有 macOS 相关构建（`build-mac.yml`、`ssid-mac-launcher.command`、`ssid-mac-launcher`），而上游只讲 Windows vs POSIX。适配版应补一条 macOS 侧的经验——**但具体内容我不知道**，建议从 SSiD 的发版复盘中提取（`docs/发版流程规范.md` 与 `docs/排查/`）。\n\n### 6. Budget timeouts against the lane → **改写（机制不同，且 SSiD 现状是三种态度）**\n\n上游三条判断**全部保留**——它们是运行器中立的，一条都不用改：\n\n- **用例级超时覆盖运行器默认值**，而不是让位给它——所以低于 lane 预算的值等于**降低**了 CI 已授予的量\n- **提升测试预算时要一起提升钩子预算**——否则\"只提升 case 预算会把一次争用失败挪进 `afterEach`\"\n- **被测对象本身是超时时，外层等待要远大于被测超时**——证明 20 ms 截止触发的用例**不能与测试框架自己的等待赛跑**\n\n#### 6.1 把\"运行器默认值\"换成实际数字\n\n上游用的是抽象说法（\"runner 的 `--testTimeout`\"）。SSiD 两种运行器并存，必须写清各自的实际默认值：\n\n| 运行器 | 用例级默认 | 钩子级默认 | 证据（可复现） |\n|---|---|---|---|\n| vitest 4.1.11 | **5000 ms** | **10000 ms** | `node_modules/vitest/dist/chunks/cac.*.js` 的 CLI 描述原文：Default timeout of a test in milliseconds (default: 5000)；hook 同处为 10000；写 0 表示完全禁用 |\n| node:test（Node v26.2.0） | **`Infinity`** | 同（钩子即子测试，各带 `timeout`） | `@types/node@22.20.1/test.d.ts` 的 `TestOptions.timeout` 明确标 `@default Infinity`，并注明\"未指定时子测试继承父测试的值\" |\n| Playwright | SSiD 自设 **60000 ms** | — | `shell/tests/plugin-adapt/playwright.config.ts` |\n\n**这张表给出上游没有的机制解释**：vitest 的两个默认值构成 **hook : test = 2 : 1** 的隐含比例。所以\"只提升用例预算\"在 vitest 上**不是风格问题，而是必然破坏默认设计**——把 `testTimeout` 提到 30 s 而不管 `hookTimeout`（仍是 10 s），比例反转成 1 : 3，\"争用失败从 case 挪进 afterEach\"就必然发生。**上游判据因此从\"经验\"变成\"可推导\"。**\n\n**同时暴露上游一处盲区**：两个运行器的默认值方向**相反**——vitest 默认 5 秒（**有限**，风险是慢用例假失败、看起来像 flake），node:test 默认 `Infinity`（**无限**，风险是挂住的用例永不失败、lane 永不结束）。**同一份\"预算\"判据要同时防\"太紧\"与\"缺失信号\"两种病**，而上游只面对前一种。\n\n#### 6.2 SSiD 的三种态度，要分别说明\n\n- **Playwright —— 已经做对，应作为正面样板写进 skill**：60 s 用例 / 30 s 导航 / 15 s 动作的**三层递减**预算，外加 `retries: 0`（主动不掩盖 flake，与第 10 节判据一致）。这是全仓库超时纪律最好的一处。\n- **vitest —— 裸默认**：4 个 `vitest.config.ts` 只设 `include` / `environment`，**没人判断过 5 秒够不够**。风险是起进程、等文件系统一类慢用例间歇撞线，表现为\"flake\"而非\"配置问题\"。\n- **node:test —— 无上限**：这是**更危险**的一侧。挂住的用例不会失败，只会让 lane 永不结束；超时在这里不是\"太紧\"而是**缺失失败信号**。而它偏偏是 SSiD 的主力运行器（4 处载体）。\n\n#### 6.3 两种运行器的写法（同一判据给两版示例）\n\n| | vitest | node:test |\n|---|---|---|\n| 导入 | `import { describe, it, expect, vi } from 'vitest'`（**显式导入**，SSiD 没开 `globals: true`） | `import test from 'node:test'` + `import assert from 'node:assert/strict'` |\n| 用例级 | 第三参数 `it('名字', fn, 30_000)`；或全局配置 `testTimeout` | 第二参数 `test('名字', { timeout: 30_000 }, fn)`（签名见 `test.d.ts` L127） |\n| 钩子级 | `hookTimeout`（独立配置项） | **无独立配置项**——钩子就是子测试，各带 `timeout`，未指定则继承父测试 |\n| 断言 | `expect(x).toBe(y)` | `assert.equal(x, y)`（strict） |\n| 组织 | `describe` / `it` | `test` 可嵌套 |\n\n**这是上游没有的复杂度**：上游只需对一种运行器讲话，SSiD 必须两版并存，且**判据本身不得分叉**（否则就成了两份 skill，违背\"一份判据\"）。\n\n> **由本节派生、但不属于 skill 正文的两条 SSiD 改进项**（单独跟踪，不要混进 skill）：\n> 1. 在 `vitest.config.ts` 里**显式写出** `testTimeout` / `hookTimeout`（哪怕就是默认值）——把**隐式默认**变成**可复核的决定**\n> 2. 给 `shell/package.json` 的 node:test 脚本补 `--test-timeout=\u003cms>`，给无限的默认值一个上限\n\n### 7. Synchronize on state → **原样保留**\n\n- **\"固定的 sleep 不是 setup 完成或清理结算的证据。\"**\n- 等显式就绪事件、握手、状态转移、自有 promise、可外部观察的条件\n- **\"超时只用来界定等待，绝不用作让断言成立的条件。\"**\n- 用 deferred promise 或 barrier 把竞态放在确定点，**并证明相关操作确实重叠**\n- **不要断言依赖调度器的顺序**，除非那个顺序就是被测的产品行为\n- 时间本身是主题时，注入或伪造时钟，**并总是恢复真实计时器**\n\n### 8. Dispose to quiescence → **原样保留**\n\n- **获取后立即注册清理**，这样断言失败也会释放资源\n- 清理要：停止新回调/请求 → 摘掉监听器 → 恢复全局钩子 → 终止自有工作 → **等待子进程退出、服务器关闭、worker 终止或等价完成信号**\n- **\"调用 `abort()`、`close()` 或 `kill()` 而不等待自有的完成信号，是不完整的拆除。\"**\n- 晚完成可能发生时，**证明释放能阻止它变更另一个用例**\n\n**SSiD 注意点**：Electron 与 Playwright 相关测试的拆除尤其吃这套——`shell/tests/plugin-adapt/` 的浏览器测试若没等到 `browser.close()` 完成就进入下一个文件，正是这条要抓的。\n\n### 9. Prove the intended regression → **原样保留**\n\n- 可行时先观察一次普通回归在修复前失败\n- **对新的静态或语料守护，临时引入被拒绝的用例并观察预期失败**（与手册 §9 的\"先跑红\"一致，但这条更具体：**针对守护类检查**）\n- **对竞态用 barrier 证明重叠；重复执行本身不是竞态测试**\n- 对端口、socket、共享路径、子进程，**当跨进程隔离是修复的一部分时，要并发跑独立测试进程**\n- **fixture 用自己的截止时间 spawn 时，要先断言没有信号或超时结束了子进程，再去断言退出状态**——否则一个被杀死的子进程会被报成状态不匹配\n- **验证外部状态、事件、文件、日志、退出或释放，而不是相信组件自报**\n- **\"压力运行补充确定性回归；它们不替代它。\"**\n\n### 10. Reject flake-masking fixes → **原样保留（全篇最可直接移植的一节）**\n\n七条\"不要把这些当作确定性本地测试的根因修复\"：\n\n1. 不指明所等待状态就加大超时\n2. 加重试\n3. 把所有文件改成串行\n4. 吞掉错误或未处理的 rejection\n5. 弱化断言\n6. 把不稳定行为归一化掉\n7. 在清理或断言前加 sleep\n\n**外加一条重要的例外与区分**（也保留）：\n\n- 重试对**有文档记载的瞬态外部提供方测试**仍然有效（对应 SSiD 的模型调用类测试）\n- **\"恢复预算不是掩盖\"**——把套件提升到它本来就有的 lane 预算，或按 runner 上**实测的争用**定有界重试，\"**命名了等待的工作并归还了 lane 已授予的量**\"\n\n### 11. Diagnose existing flakes → **改写（参考文件要重做）**\n\n上游 `references/ci-flake-diagnosis.md`（60 行）绑在 DSH 的 CI 拓扑上。**应重写**，内容改为 SSiD 的诊断路径（本地复现 → Playwright trace → 日志定位）。这一节的具体内容**我不掌握**，需要从 SSiD 现有的排查记录里提取（`docs/排查/` 下已有 `2026-08-20-窗口不定时跳出-排查记录.md` 一类的素材）。\n\n保留上游的定位：\n\n> **\"只做诊断的请求保持只读：报告原因与证据，除非用户同时要求修复。\"**\n\n### 12. Validate and report → **改写（命令）**\n\n上游的\"按风险加拓扑证据\"四条**保留**（全局变更要恢复证据 / 生命周期或子进程要静默拆除证据 / 端口或共享路径要并发独立进程证据 / 新守护要负对照）。\n\n**命令要换成 SSiD 的**（下表逐个核实自 `package.json` 原文，不是凭印象）：\n\n| 目标 | 命令 | 出处 |\n|---|---|---|\n| shell 本体（2 个文件） | `npm test` | `shell/package.json` 的 `test` |\n| shell 单文件 | `npm run test:profile-merge` / `npm run test:codegraph-adapt` | 同上（两个脚本确实都存在） |\n| 各插件 | `pnpm test`（= `vitest run`） | 各插件 `package.json`；**注意 dsh-chat-rail 是 `node --test`**（§2.1） |\n| Playwright | `cd shell/tests/plugin-adapt && npm test`（= `playwright test`）；另有 `npm run test:ui`、`npm run baseline` | `shell/tests/plugin-adapt/package.json` |\n| dsh-ssid-panels 的两个测试 | **没有 npm 脚本**，只能手跑：`node --import tsx/esm --test plugins/dsh-ssid-panels/tests/release-notes.test.ts`（**必须在仓库根**，见 §2.2） | `ssid-release` skill |\n\n**两个坑必须写进 skill，否则 agent 会跑错命令**：\n\n1. **Playwright 不在 `npm test` 里**。shell 的 `test` 脚本只跑那两个 node:test 文件；浏览器回归要单独进 `shell/tests/plugin-adapt/` 跑。**只看 `npm test` 绿就宣布\"全绿\"是错的。**\n2. **包管理器不统一**。dsh-chat-rail 只有 `pnpm-lock.yaml`，而 **dsh-memory 同时存在 `package-lock.json` 与 `pnpm-lock.yaml`**——调用前先看该插件目录里是哪个锁文件，不要一律 `pnpm`。\n\n---\n\n## 四、汇总：改动清单\n\n| 动作 | 数量 | 具体 |\n|---|---:|---|\n| **原样保留** | **7 节** | Allocate resources / Contain global state / Platform-owned semantics / Synchronize on state / Dispose to quiescence / Prove regression / Reject flake-masking（第 3–5、7–10 节） |\n| **改写** | 5 节 | Read the owning rules / Model the topology / Budget timeouts / Diagnose flakes / Validate and report |\n| **删除** | 0 节 | 无 |\n| **新增** | 5 处 | ① 两套运行器（vitest + node:test）的双版示例 ② macOS 侧的平台经验 ③ SSiD 的 CI/本地拓扑 ④ **Playwright 那处已做对的超时层级**（§三.6，上游没有的正面样板）⑤ **SSiD 专有的已知坑**（plugin-adapt README 的 L1–L4 与五条坑，见 §七.4） |\n\n> **算术核对**：7 + 5 + 0 = 12，与上游 12 小节相符。**第一版这里写的是\"原样保留 6 节\"，是错的**（第 3–5、7–10 节共 7 节），同为 §2.3 那类\"数一数\"错误。\n\n**净判断：上游 131 行的判据骨架全部可用，一条不减**——需重写的是引用、示例与命令，约占三分之一篇幅；另有三件事是上游没有的（两套运行器、超时三态度、SSiD 专有坑），必须新增。\n\n---\n\n## 五、建议的落地结构\n\n```\nseek-soul-in-darkness/.agents/skills/ssid-test-reliability/\n├── SKILL.md                 # 判据主体，预计 140–170 行（比上游 131 行略多：要容纳两版示例与 SSiD 专有坑）\n├── SOURCE.md                # 来源与版本标记（模板见下）\n└── references/\n    └── flake-diagnosis.md   # 重写版：SSiD 的 flake 诊断路径\n```\n\n**命名**：`ssid-` 前缀，与 SSiD 现有的 `.agents/skills/ssid-release` 一致。\n\n**description 建议**（只写触发条件，**不描述 skill 内容**）：\n\n> 在设计或修改可能因并发、共享资源、时钟、进程全局状态、子进程、网络监听器或异步拆除而不确定失败的测试与 fixture 时使用，也用于调查不稳定的 CI 或评审测试隔离。\n\n**为什么删掉了\"覆盖哪些运行器\"那半句**：`superpower-writing-skills` 的实测结论——\n\n> **描述的用途是让人判断\"现在该不该读它\"**。当描述总结了技能的工作流时，**agent 可能直接照描述做，而不读技能正文**。实测中，一个写着\"任务间做代码评审\"的描述，让 agent 只做了**一次**评审，尽管技能里的流程图明确画了**两次**。\n> **陷阱：总结了流程的描述会制造一条 agent 会走的捷径，而技能正文变成 agent 跳过的文档。**\n\n\"本 skill 覆盖 vitest、node:test 与 Playwright\" 属于**内容摘要**，不是触发条件——按这条规则必须删。运行器差异改在正文里用一节说明。\n\n---\n\n## 六、SOURCE.md 模板（本系列统一）\n\n```markdown\n# 来源与版本\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | dsh-ci-test-reliability |\n| 上游路径 | DSHfork/.agents/skills/dsh-ci-test-reliability/ |\n| 上游版本锚点 | c291e7961a（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 131 行 + references/ci-flake-diagnosis.md 60 行 |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 小改（清点分类：✅ 小改即可用） |\n| 适配说明 | seek-soul-in-darkness/docs/决策/2026-09-10-skill适配说明-01-测试可靠性.md |\n\n## 与上游的差异\n\n**保留**：第 3–5、7–10 节的判据骨架（资源原子分配、进程全局状态、平台自有语义、\n状态同步、静默拆除、证明预期回归、拒绝掩盖式修复）——逐条对应上游，未改判据。\n\n**改写**：\n- 「读取所属规则」：上游的 5 个文档链接 → ① SSiD 开发手册 §9（分级门槛）② 4 个 `vitest.config.ts` ③ node:test 的 `package.json` 脚本 ④ §2.2 的\"谁在何时跑\"清单（上游有 `docs/testing.md` 与 `snapshots/AGENTS.md`，SSiD 两缺）\n- 「建模执行拓扑」：上游的四层（含自托管池）→ SSiD 的四层（本地/CI、多包并行）\n- 「超时预算」：Vitest 单一机制 → vitest（默认 5 s / 10 s）与 node:test（默认 `Infinity`）双机制，并说明 SSiD 的三种态度\n- 「诊断既有 flake」：上游的 CI 拓扑诊断 → SSiD 的本地复现路径（references 重写）\n- 「验证与报告」：上游命令 → 经核实的 SSiD 命令表，含\"Playwright 不在 `npm test` 里\"与\"包管理器不统一\"两坑\n\n**删除**：无。\n\n**新增**：\n- 两套运行器的双版示例（上游只有 vitest）\n- macOS 侧平台经验（上游只讲 Windows vs POSIX）\n- SSiD 的 CI/本地拓扑描述\n- Playwright 的三层递减超时预算 + `retries: 0`（上游没有的正面样板）\n- SSiD 专有的已知坑（plugin-adapt README 的 L1–L4 分层与五条坑）\n\n## 上游变动时的跟进方式\n\n上游无版本号，只有 commit 可靠。跟进方法：\n1. `git -C DSHfork fetch && git -C DSHfork log --oneline c291e7961a..origin/master -- .agents/skills/dsh-ci-test-reliability/`\n2. 若该目录有变动，对照本节「与上游的差异」逐条重判\n3. 更新本文件的版本锚点与适配日期\n```\n\n---\n\n## 七、待你确认的四点\n\n1. **命名与落点**：`ssid-test-reliability` 放在 `.agents/skills/` 下，是否可以？（我按你\"沿用 DSH 方式\"的要求拟的，前缀对齐现有的 `ssid-release`。）\n\n2. **是否要一并建 `.agents/skills/README.md`**：DSH 的 `.agents/notes/` 有一份 README 说明整套制度，而 `.agents/skills/` 没有（只有 `.gitignore`）。SSiD 这边要不要立一份，说明\"这里的 skill 是适配自 DSH 的、来源标记在各自的 SOURCE.md\"？\n\n3. **~~第 3 节提到的探针脚本审计~~（已核实，见第 3 节）**：确认存在三类硬编码，含 5 个已入库的 token。**是否要单独开一项清理任务？** 这是与 skill 适配无关的独立问题。\n\n4. **~~是否现在就读 `shell/tests/plugin-adapt/README.md`~~（已读）**：它记录了 SSiD 的测试基础设施约定，其中两点对适配有直接影响——\n\n   - **断言分层 L1–L4**（Boot 健康 / 界面契约 / 功能可用 / 样式契约回归）——**与第 07 批读到的 DSH GUI 三层结构同构**，说明你们已经在用同样的分层思路；\n   - **五条已知坑**（`data-slot` 是 `display:contents` 导致 Playwright 元素截图不可用、431 报错源于 cookie 累积、随机端口、console 捕获须在导航前注册、截图基线受光标/Toast 影响）——**这些是 SSiD 专有的平台经验，适配版应当保留，上游没有对应内容**。\n\n   因此第 5 节的\"新增 macOS 侧经验\"建议扩写为：**新增一节\"SSiD 专有的已知坑\"**，把 README 这五条纳入。而我的适配说明第 5 节提到的 macOS 经验，可以从 `docs/发版流程规范.md` 与 `docs/排查/` 继续提取。\n"},{"file":"2026-09-10-skill适配说明-02-推理痕迹修剪.md","date":"2026-09-10","slug":"skill适配说明-02-推理痕迹修剪","title":"skill 适配说明 02：推理痕迹修剪","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-skills","dsh-trim-cot-leakage","dsh-skills","ssid-trim-cot-leakage","dsh-prose-standard","ssid-prose-standard","ssid-test-reliability"],"summary":"1. SSiD 的文档是 AI 写的，而 AI 天生带「写作会话视角」。这不是坏习惯，是生成过程的副产品——我写 01 时就写了 §2.3「第一版我写的是……」。所以这条 skill 在 SSiD 不是锦上添花，是针对主要生产方式的。 2. 实测证明泄漏真实存在，且位置最要紧（§2.2）。命中最集中的地方不在变更日志里（那里合法），而在 skills//SKILL.md——给 agent 的指令。","bytes":17111,"lines":245,"body":"# skill 适配说明 02：推理痕迹修剪\n\n> **本说明的地位**：它是适配工作的**依据**，不是 skill 本身。复核通过后才生成 skill 文件。\n> 状态：进行中（推断 · 2026-09-12）\n\n> 格式沿用 01（见 `2026-09-10-skill适配说明-01-测试可靠性.md`），不重复其模板。\n\n**上游 skill**：`dsh-trim-cot-leakage`\n**上游位置**：`DSHfork/.agents/skills/dsh-trim-cot-leakage/`\n**上游版本锚点**：`c291e7961a`（2026-09-10 抓取，与 01 同批）\n**上游体量**：SKILL.md 45 行 + `references/examples.md` 275 行 + `references/recall-batteries.md` 52 行 = **372 行**\n**清点分类**：✅ 小改即可用\n**拟落点**：`@max-null/dsh-skills` 包的 `skills/ssid-trim-cot-leakage/`\n\n---\n\n## 一、为什么做这一个\n\n1. **SSiD 的文档是 AI 写的，而 AI 天生带「写作会话视角」**。这不是坏习惯，是生成过程的副产品——我写 01 时就写了 §2.3「第一版我写的是……」。所以这条 skill 在 SSiD 不是锦上添花，是**针对主要生产方式**的。\n2. **实测证明泄漏真实存在，且位置最要紧**（§2.2）。命中最集中的地方不在变更日志里（那里合法），而在 **`skills/*/SKILL.md`——给 agent 的指令**。\n3. **它是给 agent 读的 skill**：泄漏进 skill 正文，等于让后续每个 agent 都读一段历史噪音。\n\n---\n\n## 二、SSiD 侧现状（已核实）\n\n### 2.1 探针实测\n\n用中文变更叙事探针（`第一版|本版|旧版|不再|曾经|原来|已改|修正了|之前是|改成了|这轮|本轮`）扫 `seek-soul-in-darkness/**/*.md`：**202 处命中**。\n\n按位置分类——**这张表是本节的核心判断依据**：\n\n| 位置 | 文件数 | 命中密度 | 性质 | 判断 |\n|---|---:|---|---|---|\n| `docs/release-notes-*.md` | 19 | 高 | **变更日志的本体** | **合法主场** |\n| `docs/决策/` | 99 | 高 | 决策记录 ≈ DSH 的 Agent Notes | **合法主场** |\n| `docs/设计/` | 21 | 中 | 设计记录 | **合法主场** |\n| `docs/排查/` | 1 | 中 | 排查记录 | **合法主场** |\n| `shell/docs/pitfalls.md` | 1 | 中 | 坑记录 | **合法主场** |\n| `skills/*/SKILL.md` | 14 | **低但致命** | **给 agent 的指令** | **必须修** |\n| 根 `README.md`、插件 README、`docs/SSiD开发手册.md` | — | 低 | 当前状态表面 | **应修** |\n\n**两个结论**：\n\n1. **SSiD 需要一份「合法主场清单」，这是上游没有的复杂度**。DSH 只有 Agent Notes 一个 sanctioned home；SSiD 有**五个**。不点名豁免，agent 会把 release notes 当泄漏来「修」——那是在破坏历史。\n2. **命中密度的高低是骗人的**：release notes 里几百处没人会误判，而 `skills/*/SKILL.md` 里三处会直接污染 agent 行为。**适配版必须按「表面」而不是按「密度」定优先级。**\n\n### 2.2 实测出的真实泄漏（抽样）\n\n| 文件 | 行 | 现状 | 泄漏类型 |\n|---|---:|---|---|\n| `skills/mxy-commit-review/SKILL.md` | 117 | 「二次审查通过后，**不再**询问『是否继续提交』」 | 类 3 变更叙事 |\n| `skills/mxy-upgrade-vue3/SKILL.md` | 330、359 | 「grep `proxy\\.` 确认模板和脚本中**都不再有**未处理的 `proxy.` 引用」 | 类 3 |\n| `shell/profile-template/vendor/README.md` | 25 | 「目录下**不再保留**该包。历史上的 vendor 固化基线 = 上游 v0.9.2 + …」 | 类 3 + 类 1 |\n| 根 `README.md` | 52 | 「原 v0.1.18 未分发内容并入重打」 | 类 3（编排史） |\n\n**共同的修法**：把「比较级」还原成「当前状态」——「不再询问 X」→「直接进入步骤 6」；「确认都不再有未处理的 X」→「确认无未处理的 X」。\n\n> 注意第四条与前三条不同：根 README 的版本摘要**大体合法**（它答的是「当前版本是什么、有什么」），只有「编排史」那半句该走 release notes。**这条算边界情形，不应用硬规则一刀切**——正是上游 `Borderline decisions` 一节存在的原因。\n\n### 2.3 SSiD 无文档门禁（决定适配策略的关键差异）\n\n`shell/package.json` 的 `scripts` 全部是：`start` / `typecheck` / `smoke` / `test` / `test:profile-merge` / `test:codegraph-adapt` / `pack` / `bundle-kernel` / `pack:mac`——**没有任何文档检查**。\n\n而 DSH 有 `doc-sync`、`verify-doc-budgets`、`verify-translation-pairing`、`verify-doc-links` 一批门禁在持续守护文档。\n\n**这条差异直接决定架构**：DSH 靠门禁长期守住全仓库，SSiD 没有门禁 → **与其要求全仓库干净（修了没人守、必然退回），不如把 scope 收窄到对 agent 影响最大的表面**。具体方案见 §三.3。\n\n---\n\n## 三、逐条适配判断\n\n上游共 **5 个部件**（SKILL.md 引言 + 4 个一级小节）+ **2 个 references**，共 7 个部件，逐一判断。**判定分四类**：原样保留 / 改写 / 重写 / 新增。\n\n### 1. SKILL.md 引言（定义 + REQUIRED BACKGROUND）→ **改写**\n\n上游定义：泄漏是「**视角属于写作会话而不是仓库**」的散文。这个定义**跨语言成立，直接保留**。\n\n要改的是依赖声明：\n\n- 上游：`REQUIRED BACKGROUND: dsh-prose-standard owns the complete-proposition rule this skill applies`\n- 适配版：指向适配后的 `ssid-prose-standard`（03 号），**并注明两者必须同批进入 `@max-null/dsh-skills`**\n\n**为什么这条不能省**：完整命题规则是**防过度修剪**的唯一依据。DSH 的 `examples.md` 里专门有一节 `Overcorrection traps`（四类），全部依赖「先枚举命题再删」。若 agent 只装了本 skill 没装 03，它会删掉真事实。「同批进包」不是包装细节，是**判据能否成立的前提**。\n\n### 2. `## The one test` → **原样保留**\n\n> 对每段可疑文字问：**一个处在 HEAD、拿不到任何会话记录、PR 讨论或未提交草稿的读者，能不能解析每一个引用、核实每一条断言？**\n\n这条**一字不改**。它是整份 skill 的支点，且与语言无关。**它同时也是上游最漂亮的设计**：用**一个可判定的问题**取代一长串禁令——按 `writing-skills` 的「形式匹配失败」表，这属于「正面配方」，而禁令清单在实测中反而**比不给指导更差**。\n\n### 3. `## Taxonomy`（8 类）→ **原样保留，补一条中文探针指引**\n\n8 类（死引用 / stack 与 PR 视角 / 变更叙事与版本戳 / 评审编排 / 面向评审者的辩解 / 复述与推导记录 / 模糊措辞与规划残留 / 写作语言滑落）**全部保留**。\n\n**唯一新增**：第 8 类「写作语言滑落」在 DSH 是「英文文档里混入中文」，在 SSiD **方向相反或不存在**（SSiD 主体就是中文）。适配版应把它改成**同语言内的滑落**（如中文文档里混入英文推导过程、或未翻译的 `---- 私有 ----` 分隔符之类的排版残留），而不是照抄「中英混排」。\n\n### 4. `## What is not leakage`（9 条 keep rules）→ **保留 + 新增 1 条**\n\n9 条全部保留（issue 引用 / 合并 PR 引用 / 抑制理由 / 反事实现在时回归钉 / 实测边界 / 运行时新旧状态 / 笔记变更故事段内的历史阶段名 / 仓外可解析引用 / 项目口吻与文体形制）。\n\n**必须新增的第 10 条——SSiD 的六个合法载体**（上游只认 Agent Notes 一个）：\n\n> **变更叙事在 SSiD 的合法主场**：`docs/release-notes-*.md`、`docs/决策/`、`docs/设计/`、`docs/排查/`、`shell/docs/pitfalls.md`。在这些文件里，变更叙事是**内容本体**，不是泄漏。修剪任务默认**不进入**这些路径；确需进入时须由用户显式指定 scope。\n\n**这条的证据**：§2.1 的实测分布 + §2.3 的无门禁事实。**没有这一条，02 在 SSiD 上会变成一个破坏历史文档的工具**——比不做更糟。\n\n### 5. `## Workflow`（5 步）→ **改写（scope 规则）**\n\n5 步骨架保留（定 scope 与豁免 → 只读审计 → 按表面 owner-first 修 → 删前枚举命题 → 验证）。\n\n**SSiD 改写点**：\n\n| 上游步骤 | SSiD 要改成什么 |\n|---|---|\n| 1. scope 与豁免 | 除 `vendor/` 与归档笔记外，**新增 §4 的六个合法载体**；并默认把 scope 收窄到「指令表面」：`skills/*/SKILL.md`、`docs/SSiD开发手册.md`、插件 README、JSDoc/注释 |\n| 3. 按表面 owner-first | 保留骨架，但删掉 `verify-type-equiv` / `verify-translation-pairing` 这两个 SSiD 没有的门禁，换成「改动后重跑受影响的 L1（typecheck + test）」 |\n| 4. 删前枚举命题 | **保留且提高权重**——这是防过度修剪的唯一闸门 |\n| 5. 验证 | 上游靠门禁，SSiD **没有** → 改成「重跑探针期望只剩合法命中 + 人工确认改动的 diff 不丢事实」。**这一条要显式写明「SSiD 没有门禁，所以验证靠重跑探针」**，否则 agent 会以为有东西替它兜底 |\n\n### 6. `references/recall-batteries.md`（52 行）→ **重写（语言方向反转）**\n\n上游探针集针对 DSH 的语言格局（英文为主 + `.zh.md` 对照）：英文 battery 7 条、中文 battery 4 条（全部是「在英文表面里找中文残留」）。\n\n**SSiD 的语言格局相反**（中文为主），所以：\n\n- 上游的中文 battery **全部失效**（它们是「英文里找中文」，不是「中文里找变更叙事」）\n- 需要**新写中文探针集**（本次实测用的那 12 个词是起点）\n- 英文 battery 保留（SSiD 有英文 README/JSDoc，以及 `-en` 类文档）\n\n**必须保留的三条纪律**（它们比探针本身更值钱，逐字保留）：\n\n1. **「零命中的模式什么也证明不了，直到它命中一个已知正例；有噪音的模式什么也证明不了，直到它拒绝一个近失负例。两者都要先校准再相信全集结果。」**\n2. **「探针是探针，不是定义」**——上游原话：每一轮评审都发现了没有探针能抓到的案例，所以必须**同时无模式地读 scope 内最密的散文**。\n3. **已知假阳性家族**必须随探针一起迁移（§2.2 的边界情形就是新的假阳性家族素材）。\n\n### 7. `references/examples.md`（275 行）→ **重写**\n\n上游 275 行是**英文校准样本**，按 8 类分节，另含 `Behavior-visible candidates`、`Keeps`、`Overcorrection traps` 三节。结构**优秀，照搬结构**；**案例全换**成 SSiD 的中文案例（§2.2 已备四个，需再补到每类 1–2 个）。\n\n**必须保留的是 `Overcorrection traps` 四类**（把义务翻转成背书 / 把假设升格为已交付特性 / 连带删掉真事实 / 留下数字丢了出处）——这四类**跨语言成立**，且是修剪工作最危险的失败模式。\n\n---\n\n## 四、汇总：改动清单\n\n| 动作 | 数量 | 具体 |\n|---|---:|---|\n| **原样保留** | 2 部件 | `The one test`、`Taxonomy`（8 类） |\n| **保留 + 扩充** | 1 部件 | `What is not leakage`（9 条 → 10 条，新增六个合法载体） |\n| **改写** | 2 部件 | 引言（依赖声明）、`Workflow`（scope 规则 + 门禁差异） |\n| **重写** | 2 部件 | `recall-batteries.md`（语言方向反转）、`examples.md`（案例换中文） |\n| **删除** | 0 部件 | 无 |\n\n> **算术核对**：5（SKILL.md 引言 + 4 小节）+ 2（references）= **7 个部件**；2 + 1 + 2 + 2 = **7** ✓\n\n**净判断：上游 45 行正文的判据一条不减**；重写的是两个 references 与 scope 规则，**新增一条上游没有的「六个合法载体」豁免**。\n\n---\n\n## 五、落地结构\n\n```\n@max-null/dsh-skills/\n└── skills/\n    └── ssid-trim-cot-leakage/\n        ├── SKILL.md                    # 预计 55–70 行（上游 45 行 + 主场豁免 + 中文探针指引）\n        ├── SOURCE.md                   # 来源与版本标记（模板见 01 的 §六）\n        └── references/\n            ├── examples.md             # 重写：中文案例，结构照搬（含 Overcorrection traps 四类）\n            └── recall-batteries.md     # 重写：中文探针集 + 保留三条校准纪律 + 假阳性家族\n```\n\n**命名**：`ssid-trim-cot-leakage`。与 01 的 `ssid-test-reliability` 一致用 `ssid-` 前缀。\n\n**description 建议**（**只写触发条件，不总结工作流**——`writing-skills` 的实测：总结了流程的描述会让 agent 照描述做、跳过正文）：\n\n> 在审阅中文或英文文档、注释与技能正文时，如果其中出现以写作会话（而非仓库当前状态）为视角的表述——「第一版」「不再」「旧版」「曾经」「本轮修正」「评审要求改为」等——或者需要判断某段历史叙述应当保留、改写还是移入变更日志时使用。\n\n**与 03 的绑定**：`ssid-trim-cot-leakage` 与 `ssid-prose-standard` **必须同批进包**，且 02 必须在正文里用 `REQUIRED BACKGROUND:` 显式声明（上游写法保留）。理由见 §三.1。\n\n---\n\n## 六、SOURCE.md\n\n用 01 §六 的模板，本 skill 的值：\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | dsh-trim-cot-leakage |\n| 上游路径 | DSHfork/.agents/skills/dsh-trim-cot-leakage/ |\n| 上游版本锚点 | c291e7961a（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 45 行 + examples.md 275 行 + recall-batteries.md 52 行 |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 小改（references 重写 + scope 规则） |\n| 依赖 | **ssid-prose-standard（同批进包）** |\n\n**与上游的差异**要写进 SOURCE.md 的三段（保留 / 改写 / 新增），可直接从本文 §四 抄。\n\n---\n\n## 七、待确认\n\n1. **六个合法载体是否收全**？本说明列的六个（release-notes / 决策 / 设计 / 排查 / pitfalls / **任意 skill 下的 `SOURCE.md`**）来自实测扫描。若你认为 `docs/初版验证清单.md`、`docs/品牌/` 之类也该豁免，请指出——**这份清单是 02 能否安全落地的开关**。\n\n   > **生成 skill 后补录（第三个「落地时才发现」的实例）**：原清单是**五个**，漏了 `SOURCE.md`。发现方式是**用 02 自己的探针去扫 02 自己的产物**——`SOURCE.md` 的「与上游的差异」节满是变更叙事，一扫命中 27 处，而它恰恰是**变更记录的载体**。\n   >\n   > 同一轮扫描还给出另一个结论：8 份 `SKILL.md` 命中 **24 处，但逐条判断后真泄漏为 0**（全是\"评审\"作动作解、判据文本引用示例词之类的假阳性）。**这实践验证了探针文件里那句「探针是探针，不是定义」**——并把新归纳的假阳性家族回填进了 `references/recall-batteries.md`。\n2. **`skills/` 下的 14 个 skill（8 mxy + 6 omo）由谁维护**？它们是第三方来源，改动会与上游同步冲突。三个选项：① 只修本项目自有的 skill；② 全部修但记录到 vendor 同步约定；③ 只报告不修。**我倾向前者**（改动第三方 vendor 内容会破坏同步链）。\n3. **是否要为 SSiD 补一条文档门禁**？SSiD 现在没有任何文档检查，所以本 skill 的成果**没有东西守护**。最小可行门禁是一条中文探针脚本（数十行，可进 `shell/scripts/`）。这是与 skill 适配无关的独立议题，但**它是 02 能否长期生效的前提**。\n\n---\n\n## 八、数字自检（命令产出，可复现）\n\n本说明用到的每个数字都从这里来，**不来自记忆**：\n\n```powershell\n$d = 'DSHfork\\.agents\\skills\\dsh-trim-cot-leakage'\n@(Get-Content \"$d\\SKILL.md\").Count                          # 45\n@(Get-Content \"$d\\SKILL.md\" | Select-String '^## ').Count    # 4  一级小节\n@(Get-Content \"$d\\SKILL.md\" | Select-String '^\\d\\. \\*\\*').Count  # 8  Taxonomy 条目\n@(Get-Content \"$d\\SKILL.md\" | Select-String '^- \\*\\*').Count     # 9  keep rules\n@(Get-Content \"$d\\references\\examples.md\").Count             # 275\n@(Get-Content \"$d\\references\\examples.md\" | Select-String '^### ').Count  # 30 案例\n@(Get-Content \"$d\\references\\recall-batteries.md\").Count     # 52\n@(Get-Content \"$d\\references\\recall-batteries.md\" | Select-String '^rg ').Count  # 11 探针\n@(Get-ChildItem 'seek-soul-in-darkness\\docs' -Filter 'release-notes-*.md' -File).Count  # 19\n@(Get-ChildItem 'seek-soul-in-darkness\\skills' -Directory).Count                        # 14\n```\n\n**自查记录（第一版的两个错误，留痕）**：\n\n| 位置 | 第一版写的 | 命令产出 |\n|---|---|---|\n| §2.1 表格 | release-notes **18** 个 | **19** |\n| §三.4 / §四 | keep rules **10** 条，新增后 11 条 | **9** 条，新增后 10 条 |\n\n**这两个错误与 01 的五个错误是同一个病**：拿记忆/估算当事实。**由此定下一条强制纪律**：\n\n> **适配说明里的每一个数字，必须在文末给出可复现的命令。写不出命令的数字，不许写进正文。**\n\n**Workflow 步骤数的注意**：全文 `^\\d\\. ` 计数是 13（Taxonomy 8 + Workflow 5），**不能拿它当 Workflow 的条目数**——这正是「数字要有专属命令、且要理解命令在数什么」的实例。\n\n"},{"file":"2026-09-10-skill适配说明-03-行文标准.md","date":"2026-09-10","slug":"skill适配说明-03-行文标准","title":"skill 适配说明 03：行文标准","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-skills","dsh-prose-standard","dsh-skills","ssid-prose-standard","dsh-ssid-zh-ui","dsh-doc","dsh-trim-cot-leakage","ssid-trim-cot-leakage","#6","#2","#9","#8"],"summary":"1. 它是 02 的地基。02（推理痕迹修剪）的「删之前先枚举命题」依据的就是本 skill 的完整命题规则。若只装 02 不装 03，agent 会把真事实一并删掉——那是比不做更坏的结果。 2. 它管的不是\"文风\"，是\"契约要不要写出来\"。上游定义：contract 是 caller/callee/implementer/producer/consumer 依赖的义务、不变量、前置/后置条件或","bytes":22693,"lines":288,"body":"# skill 适配说明 03：行文标准\n\n> **本说明的地位**：它是适配工作的**依据**，不是 skill 本身。格式见 `2026-09-10-skill适配说明-写作规则.md`。\n\n> 状态：进行中（推断 · 2026-09-12）\n\n**上游 skill**：`dsh-prose-standard`\n**上游位置**：`DSHfork/.agents/skills/dsh-prose-standard/`\n**上游版本锚点**：`c291e7961a`（2026-09-10 抓取，与 01/02 同批）\n**上游体量**：SKILL.md 81 行 + `references/examples.md` 142 行 = **223 行**\n**清点分类**：`✅ 小改即可用`\n**拟落点**：`@max-null/dsh-skills` 的 `skills/ssid-prose-standard/`\n**优先级**：**本 skill 是 02 的前置**（02 的完整命题规则由它 own），两者必须同批进包。\n\n---\n\n## 一、为什么做这一个\n\n1. **它是 02 的地基**。02（推理痕迹修剪）的「删之前先枚举命题」依据的就是本 skill 的**完整命题规则**。若只装 02 不装 03，agent 会把真事实一并删掉——那是比不做更坏的结果。\n2. **它管的不是\"文风\"，是\"契约要不要写出来\"**。上游定义：*contract* 是 caller/callee/implementer/producer/consumer 依赖的**义务、不变量、前置/后置条件或兼容承诺**。这跟\"写得漂亮\"无关，是**接口事实是否可被使用方读到**。\n3. **SSiD 的主体是 AI 生成的代码与文档**，而 AI 的默认倾向是**过度叙述**（讲过程、讲变更、讲理由），恰好是这条 skill 从头到尾在修剪的东西。\n\n---\n\n## 二、SSiD 侧现状（已核实）\n\n### 2.1 上游的 12 类「行文位置」逐条对照\n\n上游按位置规定**必需覆盖**，共 **12 类条目**。SSiD 的对照如下——**这张表是本说明的核心**：\n\n| # | 上游位置 | SSiD 对应物 | 判定 |\n|---:|---|---|---|\n| 1 | Public JSDoc | 插件 `src/*.ts` 的导出 JSDoc | ✅ 有 |\n| 2 | Internal comments | 同上（`src/` 与 `lib/` 源侧） | ✅ 有 |\n| 3 | Module comments | 同上 | ✅ 有 |\n| 4 | Tests | `tests/*.spec.ts`（node:test 或 vitest，见 01 §2.1） | ✅ 有 |\n| 5 | **Cookbooks** | **无**：`docs/cookbook` 不存在（`docs/` 下只有 4 个子目录） | ❌ **删** |\n| 6 | READMEs | 13 个插件 README + 根 README | ✅ 有 |\n| 7 | **Agent Notes** | `docs/决策/`（**99 个文件**）——但制度不同，见 2.2 | ⚠️ 有，须重述规则 |\n| 8 | **Postmortems** | `docs/排查/`（**仅 1 个文件**） | ⚠️ 近乎空，保留判据但降权 |\n| 9 | Skills and agent instructions | `skills/`（**14 个** SKILL.md）+ 本包 | ✅ 有，且**最要紧** |\n| 10 | Examples and configuration comments | 插件 `cordis.patch.yml` 注释 | ✅ 有 |\n| 11 | **Prompts and visible strings** | `dsh-ssid-zh-ui` 的 `TEXT_ZH` 翻译表（`lib/client.js`）+ `verify-zh-ui.cjs` | ⚠️ 机制不同，见 2.3 |\n| 12 | **Diagnostics** | **无独立体系**——错误消息即诊断（代码内 `throw new Error(...)`） | ❌ **降级为条款** |\n\n**四个需要动作的位置**（12 类里只有这 4 个不能照搬）：\n\n- **#5 Cookbooks 删除**：SSiD 没有 cookbook。判据本身（前置条件 / 必需操作 / 真实入口 / 可观察验证 / 警示）**不删**，而是**并入 #6 READMEs** —— 因为 SSiD 的 README 实际上承担了\"怎么用\"的职责（有 `## 截图` 段与安装说明）。\n- **#7 Agent Notes 改成 `docs/决策/`**：制度不同，见 2.2。\n- **#8 Postmortems 降权**：SSiD 只有 1 份排查记录。判据保留（事故序列 / 证据 / 因果链 / 影响 / 预防），但**注明\"SSiD 此位置近乎空，写的时候按此判据，不要因为没有先例就省掉证据\"**。\n- **#12 Diagnostics 降级**：SSiD 无结构化诊断体系，错误消息直接写在代码里。把上游那三条（点名失败主体或路径 / 指明违反的规则 / 给出纠正方式）**并入 #2 Internal comments**。\n\n### 2.2 `docs/决策/` 与 DSH 的 Agent Notes 不是一回事\n\n| | DSH Agent Notes | SSiD `docs/决策/` |\n|---|---|---|\n| 位置 | `.agents/notes/{implemented,proposed,rejected}/` | `docs/决策/YYYY-MM-DD-标题.md` |\n| 状态字段 | 有（目录即状态 + 归档冻结） | **无**（靠文件名日期与内容自述） |\n| 编目 | 有 README 说明制度、有索引门禁 | **无索引、无门禁** |\n| 读者 | agent（主要） | **人**（给用户回看决策） |\n\n**这条差异决定适配时的两件事**：\n\n1. **不能把上游的 Agent Note 规则整段搬过来**（如\"implemented 用现在时\"、\"归档即冻结\"）——SSiD 没有状态机，无从施加。**只保留对 SSiD 成立的部分**：保留独有理由、机制、备选方案、后果、已交付的验证证据、点名的覆盖空白。\n2. **02 已定的「六个合法载体」在这里同样适用**：`docs/决策/` 是**变更叙事的合法主场**，行文标准**不要求它改写成 HEAD 视角**。\n\n### 2.3 Prompts 与可见字符串：机制不同\n\n上游：客户端 UI 文案归属**类型化 locale 字典**，经显式本地化 props 到达无 Cordis 依赖的原语，并有 `verify-client-ui-i18n` 门禁拒绝硬编码。\n\nSSiD：`dsh-ssid-zh-ui` 用的是**运行时翻译表**（`lib/client.js` 里的 `TEXT_ZH`）＋ 自己的验证脚本 `verify-zh-ui.cjs`（10,952 B，含翻译表覆盖 / 中文替换 / 切英文恢复 / 防误传等断言）。\n\n**所以判据保留、门禁换名**：把 `verify-client-ui-i18n` 换成 **`verify-zh-ui.cjs`**。措辞本身即行为的纪律（文案与 a11y 名称、tooltip、placeholder、格式模板一起看）**逐字保留**。\n\n### 2.4 上游引用的三处外部依赖\n\n| 上游引用 | SSiD 对应 | 动作 |\n|---|---|---|\n| `../../../docs/AGENTS.md`（文档标准） | `docs/SSiD开发手册.md` | 改指向 |\n| `../dsh-doc/SKILL.md` | **无**（`dsh-doc` 属 ⛔ 不适用） | **删除该引用**，其职责（放置 / 预算 / 双语 / 门禁）SSiD 本就没有 |\n| `../dsh-trim-cot-leakage/SKILL.md` | 02 适配版 | 保留（双向引用） |\n\n---\n\n## 三、逐条适配判断\n\n上游 SKILL.md 有 **5 个一级小节 + 引言** = 6 个部件，加 `references/examples.md` =
