n```\n\n## 三、阻塞点（需用户侧输入）\n\n1. **npm 凭据**：`~/.npmrc` 的 token 已失效（401）。**用户已选择手动执行**（见第五节指令）。\n2. **plugin-center 0.1.7 代码**：❌ **确认不在 GitHub 远程**——`ls-remote --heads` 只有 main（`ebc3c0d`，package.json=0.1.5），无其他分支；clone 提交历史无 509d9f5/1833b58。用户先前以为已 push，实际未成功。**publish 不依赖 push**（npm registry 与 GitHub 无关），用户在另一环境本地仓库 publish 即可；push 需用户补做（收尾待办）。\n3. **GitHub 网络**：直连间歇不通（曾 11 次重试成功一次 clone）、代理 7897 已坏。影响 clone/Release 等步骤。\n\n## 四、环境内可先行事项（不依赖网络/凭据）\n\n- [x] 核对 prepare-runtime.mjs 的 node 发现逻辑（**只认 `DSH_NODE` 环境变量或 `D:\\Program Files\\nvm\\v22.22.2\\node.exe`**，本机两者都没有 → 需设置 `DSH_NODE` 指向 PATH 的 v26.2.0；pnpm 同理需 `PNPM_CMD` 指向 pnpm.cjs）\n- [x] 预写 `docs/release-notes-v0.1.6.md`（待办 5 前置，已起草完成）\n- [x] 检查 shell 打包链路本地可用性（electron 43.3.0 / electron-builder / esbuild 已装；`dsh-runtime.tar.gz` 旧归档 171MB 存在待重建）\n\n### 待办 2 本机运行参数（已确认）\n\n```\nDSH_NODE = C:\\Program Files\\nodejs\\node.exe      （v26.2.0，满足 ≥22.13）\nPNPM_CMD = C:\\Users\\MaxNull\\AppData\\Roaming\\npm\\node_modules\\pnpm\\bin\\pnpm.cjs   （11.21.0）\n```\n\n> 注意：pnpm 的 shim 是 pnpm.ps1，prepare-runtime 用 node 执行 pnpm.cjs，必须给 PNPM_CMD 指向真实 .cjs 路径。\n\n## 五、用户手动执行部分（2026-08-19 用户选择\"给我指令我去执行\"）\n\n> plugin-center 0.1.7 已 push 到 GitHub（用户确认），npm 凭据部分由用户手动执行。\n\n### 5.1 npm 登录（二选一）\n\n```sh\n# 方式 A：交互式登录\nnpm login\n\n# 方式 B：设置 token（若已有新 token）\nnpm config set //registry.npmjs.org/:_authToken=\u003c你的新token>\n```\n\n验证：`npm whoami` 应输出你的 npm 用户名。\n\n### 5.2 发布 plugin-center 0.1.7（在 plugin-center 仓库目录）\n\n```sh\ncd \u003cplugin-center 仓库目录>      # 确认在 main 分支且包含 1833b58（0.1.7）\nnpm publish                       # 发布 @max-null/dsh-plugin-center@0.1.7\nnpm view @max-null/dsh-plugin-center version   # 应输出 0.1.7\n```\n\n> 确认仓库已含 0.1.7：`git log --oneline -3` 应看到 `1833b58`（0.1.7 toggle/close/遮罩）与 `509d9f5`（0.1.6 open）。\n\n### 5.3 完成后告知\n\n发布成功后告诉我，我继续执行：待办 2（prepare-runtime，需 `DSH_NODE`/`PNPM_CMD` 环境变量）→ 待办 3（pack）→ 待办 4（自测）→ 待办 5（release-notes + Release）→ 待办 6（收尾）。\n"},{"file":"2026-08-18-标题栏DSH版本显示.md","date":"2026-08-18","slug":"标题栏DSH版本显示","title":"标题栏显示 DSH 版本（官方版本通道占位符的壳层补齐）","statusRaw":"✅ 已完成（dshVersion 实测 0.1.0-rc.7，安装包 1:26 出炉）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-18","dateNote":null,"tags":["@deepseek-ai/dsh"],"summary":"- 官方版本通道存在但拿不到真实值：host.describe（api-proxy.ts:2865） 硬编码 version: '0.0.1'（TODO 占位），apps/cli 的真实版本未流入。 - 结论：DSH 版本展示由 SSiD 壳层补齐——壳本来就读 DSH 运行时锚点。","bytes":1310,"lines":27,"body":"# 标题栏显示 DSH 版本（官方版本通道占位符的壳层补齐）\n\n日期：2026-08-18\n状态：✅ 已完成（dshVersion 实测 0.1.0-rc.7，安装包 1:26 出炉）\n\n## 背景（用户调查结论）\n\n- 官方版本通道存在但拿不到真实值：`host.describe`（api-proxy.ts:2865）\n  硬编码 `version: '0.0.1'`（TODO 占位），apps/cli 的真实版本未流入。\n- 结论：DSH 版本展示由 SSiD 壳层补齐——壳本来就读 DSH 运行时锚点。\n\n## 方案\n\n- **版本来源**：kernel.ts 的 `runtime.installAnchor`（source 模式 =\n  apps/cli/package.json；bundled 模式 = @deepseek-ai/dsh/package.json）\n  直接读其 `version` 字段，boot 时解析一次。\n- **展示**：自绘标题栏「思灵」右侧副标题胶囊小字 `DSH 0.1.0-rc.7`，\n  muted 色 + 细边框，跟随 titlebar 主题变量（主题同步已有机制）。\n- **传递链**：kernel.ts `Kernel.dshVersion` → main.mjs titleBar 加载后\n  executeJavaScript `__setDshVersion` → titlebar.html 元素 + titlebar.js setter。\n\n## 验证\n\n- [ ] dev 冒烟：kernel 返回 dshVersion 正确（source 模式 = apps/cli 版本）\n- [ ] pack 成功；安装版显示 bundled 模式版本（@deepseek-ai/dsh 版本）\n- [ ] 视觉：副标题不干扰拖拽区（brand 区域本就 drag）\n"},{"file":"2026-08-18-工作区内部插件与vendor同步约定.md","date":"2026-08-18","slug":"工作区内部插件与vendor同步约定","title":"工作区内部插件目录与 vendor 同步约定","statusRaw":"✅ 确认（本次无需重新打包）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-18","dateNote":null,"tags":["dsh-ssid-panels","dsh-node-appearance"],"summary":"- dsh-ssid-panels 源码已并入 SSiD 工作区：plugins/dsh-ssid-panels/ （隔壁 archived-dsh-ssid-panels 为归档，不再作为源码来源）。 - dsh-node-appearance 已于 2026-08-19 升级为 registry 分发（0.1.1 发布 npm， 依赖切换为 ^0.1.1，vendor 目录已删除）——本约定不","bytes":2360,"lines":42,"body":"# 工作区内部插件目录与 vendor 同步约定\n\n日期：2026-08-18\n状态：✅ 确认（本次无需重新打包）\n\n## 现状\n\n- dsh-ssid-panels 源码已并入 SSiD 工作区：`plugins/dsh-ssid-panels/`\n  （隔壁 `_archived-dsh-ssid-panels` 为归档，不再作为源码来源）。\n- dsh-node-appearance **已于 2026-08-19 升级为 registry 分发**（0.1.1 发布 npm，\n  依赖切换为 `^0.1.1`，vendor 目录已删除）——本约定不再覆盖它。\n- 分发模式：不发布 npm，经 `shell/profile-template/vendor/` 以\n  `file:./vendor/...` 引用，随 SSiD 壳归档分发（f76e1ab 决策）。\n\n## 同步流程（以后插件更新）\n\n1. `plugins/dsh-ssid-panels` 改代码 → `npm run build`（tsdown）。\n   （dsh-node-appearance 同理：独立工作区改代码 → `npm run build`）\n2. 复制 `lib/`（+ package.json/cordis.patch.yml 如变更）到\n   `shell/profile-template/vendor/\u003c插件名>/`——**用 `robocopy \u003cws>/lib \u003cvendor>/lib /MIR`，\n   不要用 PowerShell `Copy-Item` 覆盖已存在目录**（会生成 `lib\\lib` 嵌套，\n   破坏目录结构，pnpm 对结构异常的 file: 依赖会 fallback registry 解析，未发布包 404）。\n3. `prepare-runtime` → 归档 boot 冒烟 → pack。\n4. 构建产物需 MD5 对比确认（tsdown 输出确定性，一致即已同步）。\n\n## pnpm file: 依赖快照坑（2026-08-19 实测）\n\n- node_modules 里的 file: 依赖副本是 **pnpm store 的内容寻址快照（硬链接）**，\n  不是 vendor 目录的实时复制；lockfile 指纹是 peer 组合指纹，与目录内容无关。\n- vendor 内容更新后，`pnpm install`（含 `--force`/`update`/删缓存）**不会**重新打包 vendor，\n  node_modules 副本停留在旧快照。dev 环境要立即生效需手动复制 lib 到 node_modules；\n  发布版不受影响（全新环境直接打包新内容）。\n- 详见 [2026-08-19-dsh-node-appearance-加入SSiD预设.md](2026-08-19-dsh-node-appearance-加入SSiD预设.md) 第四节。\n\n## 本次确认\n\n- 工作区内部源码构建产物与 vendor MD5 一致 → 已同步（a81b88f，\n  dsh-ssid-panels 0.1.1 中英切换）。\n- 当前归档（132.1MB，rc.7）与安装包（1:30）均已含 0.1.1。\n- 无需重新打包；若用户看到其他「更新」，先按此流程核对 plugins/ 源码\n  是否落后于预期。\n"},{"file":"2026-08-18-会话完成通知-失焦提醒.md","date":"2026-08-18","slug":"会话完成通知-失焦提醒","title":"会话完成通知：窗口失焦时 Windows 通知 + 音效（fractal 行为移植）","statusRaw":"进行中","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-18","dateNote":null,"tags":[],"summary":"每轮会话结束时，若窗口不活跃（最小化/被遮挡/切到其他应用），弹 Windows 通知「会话已完成，用时 mm:ss」并伴随音效——对齐 OC 桌面版 / fractal 行为。","bytes":1919,"lines":38,"body":"# 会话完成通知：窗口失焦时 Windows 通知 + 音效（fractal 行为移植）\n\n日期：2026-08-18\n状态：进行中\n\n## 需求（用户）\n\n每轮会话结束时，若窗口不活跃（最小化/被遮挡/切到其他应用），弹 Windows\n通知「会话已完成，用时 mm:ss」并伴随音效——对齐 OC 桌面版 / fractal 行为。\n\n## 可行性结论（DSH 事件面查证）\n\n- **轮次完成钩子**：`session/event` 的 `turn/end`（root ctx 可监听，Scoped\n  事件在 root 接收全部 session）；reason.kind === 'completed' 表示正常完成\n  （aborted/blocked/error/max-tokens/interrupted 不通知）。\n- **计时**：SessionEvent 自带 `time`（Unix epoch ms）——turn/start 记 Map，\n  turn/end 差值即用时，无需自己计时。\n- **窗口活跃**：Electron `win.isFocused() === false` 覆盖最小化/遮挡/切走。\n- **通知**：主进程 Electron Notification（tray 已有先例，无浏览器权限问题）。\n- **音效**：spawn PowerShell `[System.Media.SystemSounds]::Asterisk.Play()`\n  （零资产；Notification silent 避免双响）。\n- fractal 参考：showNotification(title, body) + durationMs（useStreamProcessor\n  notifyReplyDone）；fractal 无显式音效（Windows 默认），SSiD 显式加 Asterisk。\n\n## 设计（第一版边界）\n\n- 文案：标题「思灵」，正文「会话已完成，用时 mm:ss」——不带会话标题\n  （Session 类型无 title 字段；后续若需要从 session-title 插件读，再扩）。\n- 全量 session 的 completed turn 都通知（含子代理）；窗口聚焦时不打扰。\n- 通知失败静默（Notification.isSupported 门控；音效 spawn 失败吞掉）。\n\n## 验证\n\n- [ ] typecheck / node --check\n- [ ] dev 冒烟 boot 正常（监听挂载不炸）\n- [ ] 用户实测：发起一轮对话 → 切走窗口 → 完成后收通知+音效；\n      窗口聚焦时不通知\n"},{"file":"2026-08-18-通知体系扩展-卡点与设置面板.md","date":"2026-08-18","slug":"通知体系扩展-卡点与设置面板","title":"通知体系扩展：卡点通知（提问/授权）+ 通知设置面板","statusRaw":"进行中","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-18","dateNote":null,"tags":["dsh-ssid-panels"],"summary":"1. 卡点通知：出现提问（askuserquestion）与授权申请（approval）时，窗口 失焦同样弹 Windows 通知 + 音效。 2. 通知设置面板：分形设置页同款——总开关 + 分场景开关。","bytes":2166,"lines":43,"body":"# 通知体系扩展：卡点通知（提问/授权）+ 通知设置面板\n\n日期：2026-08-18\n状态：进行中\n\n## 需求（用户）\n\n1. 卡点通知：出现提问（ask_user_question）与授权申请（approval）时，窗口\n   失焦同样弹 Windows 通知 + 音效。\n2. 通知设置面板：分形设置页同款——总开关 + 分场景开关。\n\n## 事件面查证结论\n\n- **授权**：`session/event` 的 `approval/asked`（session.append 审计事件，\n  含 id/toolName）——root ctx 监听 ✓ 可靠。\n- **提问**：`ctx.userQuestions.ask()` 纯服务调用（无 session 事件）——\n  壳层同进程包装服务实例的 ask 方法（boot 后 ctx.get('userQuestions')），\n  调用时发通知。包装是唯一可靠路径（UI DOM 轮询脆弱）。\n- 会话完成：turn/end completed（已实现，本轮并入统一机制）。\n\n## 设计\n\n1. **配置**：`~/.ssid/notify.json`：`{ enabled, replyDone, question, approval }`；\n   文件不存在 = 默认全开。壳层每次通知前同步读（文件小，性能无虞）。\n2. **通知统一入口**（main.mjs）：`maybeNotify(scene, title, body)`——\n   读配置 → enabled && scene 开关 → win.isFocused() 为假 → Notification\n   （silent）+ Asterisk 音效 + safeLog。\n3. **三场景**：\n   - replyDone：turn/end completed（「会话已完成，用时 mm:ss」）\n   - approval：approval/asked（「有新的授权申请」「工具 \u003cname> 请求授权」）\n   - question：userQuestions.ask 包装（「需要你的回复」「AI 向你提出了一个问题」）\n4. **设置面板**（plugins/dsh-ssid-panels）：\n   - host：rpc 端点 notify.get / notify.set（读写 ~/.ssid/notify.json）\n   - client：新 tab「通知」——总开关 + 会话完成/提问/授权申请三开关\n   - build → vendor 同步 → 归档指纹（vendor 清单）自动触发重部署\n5. 双语：面板文案走 panels 既有 i18n（0.1.1 中英切换框架）。\n\n## 验证\n\n- [ ] typecheck / node --check / boot 冒烟\n- [ ] panels build + vendor 同步 + 归档重建 + 冒烟 + pack\n- [ ] 用户实测：三场景失焦通知 + 面板开关即时生效\n"},{"file":"2026-08-18-消息导航自研-放弃第三方rail.md","date":"2026-08-18","slug":"消息导航自研-放弃第三方rail","title":"决策：消息导航自研，放弃第三方 rail 插件","statusRaw":"已决策","statusKind":"已决策","owner":"MaxNull","purpose":null,"dateInBody":"2026-08-18","dateNote":null,"tags":["@max-null/dsh-","dsh-chat-timeline","dsh-chat-rail","dsh-plugin","dsh-message-preview","dsh-chat-index-rail","dsh-plugin-msg-nav","dsh-codex-timeline","dsh-turn-rail","dsh-session-timeline","dsh-milestone","dsh-sidebar-width"],"summary":"会话面板消息导航（右侧 rail）自研，作为 @max-null 全家桶新插件（暂定名 dsh-chat-rail，见设计文档），不再评估/采用第三方 rail 插件。","bytes":3976,"lines":52,"body":"# 决策：消息导航自研，放弃第三方 rail 插件\n\n> 日期：2026-08-18\n> 状态：已决策\n> 决策人：MaxNull\n> 触发：实测 `dsh-chat-timeline@0.1.2`（jjxjjjjiik-bot）与 better-sidebar 共存后的体验缺陷\n> 关联：`docs/决策/2026-08-16-社区插件评估-better-sidebar与OpenViking.md`、fractal `ChatTimelineNav` 设计（fractal/docs/设计/会话列表优化-设计方案.md 4.5）\n\n---\n\n## 〇、决策\n\n**会话面板消息导航（右侧 rail）自研**，作为 `@max-null` 全家桶新插件（暂定名 `dsh-chat-rail`，见设计文档），不再评估/采用第三方 rail 插件。\n\n## 一、背景\n\n### 1.1 调研结论（2026-08-18，3 个 subagent + awesome 清单实测）\n\n- awesome-dsh-plugin 中\"会话面板消息/回合导航\"方向**已是重度红海**，至少 15 个同款插件。\n- 深度评估 8 个核心候选：`dsh-chat-timeline`（npm 0.1.2）、`dsh-message-preview`、`dsh-chat-index-rail`（npm 0.1.1）、`dsh-plugin-msg-nav`（v0.2.0）、`dsh-codex-timeline`（npm 0.3.2）、`dsh-turn-rail`（npm 0.1.0）、`dsh-session-timeline`（npm 1.0.1）、`dsh-milestone`（npm 0.6.0）。\n- 关键共性风险：都依赖 DSH 内部 slot/投影契约，DSH 升级（rc.8+）可能全部失效；功能高度重叠，左右 rail 同屏互相干扰。\n\n### 1.2 实测结论（dsh-chat-timeline@0.1.2 装入 ssid profile 实测）\n\n功能上**不冲突**（它注入 `conversation.input.dock`，better-sidebar 用 `conversation.chat.turnTail` + CSS margin 挤压，槽位不重叠），但有两个体验缺陷：\n\n1. **动画时序错位**：rail 用 `right: rightOffset` 定位，靠 ResizeObserver + MutationObserver + 2s 轮询跟随聊天区右缘。better-sidebar 展开时给 `#root` 加 `margin-right` CSS transition，rail 跟随滞后 → \"边栏先展开、滚动条/rail 后移\"的错位感。这是结构性时序问题。\n2. **可见性差**：折叠态 rail 仅 34px 宽，指示线 8×2px、颜色 `rgba(0,0,0,.16)`，白色背景下几乎不可见。\n\n## 二、决策理由\n\n1. **代码简单**：核心就是\"用户消息锚点投影 + 右侧指示条 + scroll spy + 点击跳转\"，参考 dsh-chat-timeline 实现（431 行 client.js）完全可控。\n2. **冲突可自处理**：SSID 还会继续加插件（better-sidebar 生态、excel-panel、video-preview 等），自研后任何布局/动画冲突都能自己修，不依赖上游。\n3. **SSID 全家桶**：作为 `@max-null/dsh-*` 新成员进预制清单，与 memory/guardian/habit 同体系，品牌壳可统一皮肤。\n4. **一劳永逸**：第三方 rail 的共性风险（DSH 契约漂移、红海同质化）在自研下由自己掌控。\n\n## 三、技术方案要点（详见插件设计文档）\n\n- **定位**：rail 定位不用\"跟随聊天区 rect\"，改用跟随 better-sidebar 的 CSS 变量 `--dsh-sidebar-width`（`#root { margin-right: var(--dsh-sidebar-width) }`），rail `right: calc(var(--dsh-sidebar-width, 0px) + 12px)`，与边栏共享同一 transition → 动画天然同步，消除时序错位。\n- **可见性**：指示条加粗加深（按 SSID 品牌色），折叠态有底色/描边，hover 展开预览。\n- **架构**：host 半端 `sessionProjections` 投影全量用户消息锚点（含 preview），client 半端 `conversation.input.dock` 注入。\n- **兼容策略**：优先支持 better-sidebar 的 CSS 变量；其它右栏插件（如未来新增）预留 CSS 变量扩展位。\n\n## 四、影响与回滚\n\n- ssid profile 中已装的 `dsh-chat-timeline` 在自研插件就绪后**移除**（package.json dependencies + bundles 两处）。\n- 回滚：自研插件开发失败时，可恢复 dsh-chat-timeline（依赖与 bundle 声明已记录于 2026-08-18 环境记忆）。\n\n---\n\n> 已决策：消息导航自研（2026-08-18）。执行顺序：插件设计文档 → 骨架 → 实现 → 测试 → 装入 ssid profile 实测 → 移除 dsh-chat-timeline → 发布 npm + GitHub。\n"},{"file":"2026-08-18-DSH升级rc7-内置同步.md","date":"2026-08-18","slug":"DSH升级rc7-内置同步","title":"SSiD 内置 DSH 升级 0.1.0-rc.6 → rc.7","statusRaw":"✅ 已完成（归档 132.1MB、boot 冒烟 OK、安装包 1:15 出炉）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-18","dateNote":null,"tags":["@deepseek-ai/dsh","@deepseek-ai/dsh-"],"summary":"- DSH 上游已发布 0.1.0-rc.7（npm latest），SSiD 内置闭包 pin 的是 0.1.0-rc.6——按「DSH 跟进必须是显式决策」的既有约定，本次执行升级。 - 版本策略：SSiD 仍为 0.1.4（Release 尚未发布，DSH 升级并入同版）。 - 升级点（prepare-runtime.mjs 两处 pin）： 1. @deepseek-ai/dsh 注入 0","bytes":973,"lines":22,"body":"# SSiD 内置 DSH 升级 0.1.0-rc.6 → rc.7\n\n日期：2026-08-18\n状态：✅ 已完成（归档 132.1MB、boot 冒烟 OK、安装包 1:15 出炉）\n\n## 决策\n\n- DSH 上游已发布 `0.1.0-rc.7`（npm latest），SSiD 内置闭包 pin 的是\n  `0.1.0-rc.6`——按「DSH 跟进必须是显式决策」的既有约定，本次执行升级。\n- 版本策略：SSiD 仍为 0.1.4（Release 尚未发布，DSH 升级并入同版）。\n- 升级点（prepare-runtime.mjs 两处 pin）：\n  1. `@deepseek-ai/dsh` 注入 `0.1.0-rc.6` → `0.1.0-rc.7`\n  2. MISSING_PEERS 20 个 `@deepseek-ai/dsh-*@0.1.0-rc.6` → rc.7\n     （cordis-plugin-group@1.0.1 / cordis@4.0.0-rc.8 不动）\n- 验证：归档 boot 冒烟（BUNDLED boot OK）——rc.7 的 loader 链/peer 完整性\n  由冒烟把关；precise pin 下不会漂移到其他版本。\n\n## 执行链\n\n改 pin → prepare-runtime → 归档 boot 冒烟 → pack → 用户实测（含\nplugin-center 0.1.4 与双语回归）。\n"},{"file":"2026-08-18-plugin-center发布流程整改-本地验证环.md","date":"2026-08-18","slug":"plugin-center发布流程整改-本地验证环","title":"plugin-center 发布流程整改：npm 发布前必须有本地验证环","statusRaw":"✅ 已落地（本轮 0.1.3 归档已按新流程验证）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-18","dateNote":null,"tags":["dsh-runtime"],"summary":"「我们用 npm 测试是不是有点太不严谨了」——0.1.2 的崩溃级 bug （ctx.locale 属性访问被 cordis 拒绝 → 插件加载失败）在发布后才被用户 真机实测发现。此前流程：改代码 → build → npm publish → 归档 → 打包 → 用户装包测，没有任何发布前验证。","bytes":1961,"lines":39,"body":"# plugin-center 发布流程整改：npm 发布前必须有本地验证环\n\n日期：2026-08-18\n状态：✅ 已落地（本轮 0.1.3 归档已按新流程验证）\n\n## 用户反馈（批评成立）\n\n「我们用 npm 测试是不是有点太不严谨了」——0.1.2 的崩溃级 bug\n（ctx.locale 属性访问被 cordis 拒绝 → 插件加载失败）在**发布后**才被用户\n真机实测发现。此前流程：改代码 → build → npm publish → 归档 → 打包 →\n用户装包测，**没有任何发布前验证**。\n\n## 整改后的流程（每次 plugin-center 改动）\n\n1. 改代码 + build。\n2. **本地 loader 冒烟（发布前）**：把 dist 产物装进临时 profile\n   （file: 依赖 + pnpm install），用 DSH boot 冒烟验证 loader entry apply\n   不炸——「failed to apply loader entry」这类错误在 boot 阶段就会暴露。\n3. UI 交互（双语/更新按钮）：dev GUI 或用户轻测。\n4. 通过后才 npm publish。\n5. SSiD 侧：清 pnpm metadata 缓存（%LOCALAPPDATA%\\pnpm-cache\\v11\\metadata，\n   实测位置）→ prepare-runtime → **归档 boot 冒烟**（解压归档 →\n   boot-bundled.mjs 用临时 DSH_HOME boot → fetch 200）→ pack → 交付。\n\n## 本轮（0.1.3）验证记录\n\n- 归档重建后执行 boot-bundled 冒烟：临时 DSH_HOME boot 闭包含\n  plugin-center@0.1.3，loader apply 全部成功、fetch `/` 200——0.1.2 的\n  locale 崩溃缺陷在交付前被排除。\n\n## 决策备查\n\n- 归档冒烟命令：`tar -xzf dsh-runtime.tar.gz`（临时解压回 shell/dsh-runtime）\n  → `DSH_HOME=\u003c临时目录> node scripts/boot-bundled.mjs` → 成功后删目录。\n- npm 发布后 pnpm metadata 缓存 TTL 导致归档解析旧版本：清\n  `%LOCALAPPDATA%\\pnpm-cache\\v11\\metadata{,-full}` 立即生效（实测）。\n- age 策略：新版本默认 24h 内不被 ^range 采用，profile-template 的\n  minimumReleaseAgeExclude 必须同步更新（0.1.3 已列）。\n"},{"file":"2026-08-18-SSiD托盘菜单重启项.md","date":"2026-08-18","slug":"SSiD托盘菜单重启项","title":"决策：SSiD 托盘菜单增加「重启」项","statusRaw":"已决策","statusKind":"已决策","owner":"MaxNull","purpose":null,"dateInBody":"2026-08-18","dateNote":null,"tags":["dsh-chat-timeline","dsh-chat-rail"],"summary":"在托盘菜单加「重启」项（app.relaunch() + 优雅退出）。标题栏不加任何按钮，保持干净。","bytes":4083,"lines":75,"body":"# 决策：SSiD 托盘菜单增加「重启」项\n\n> 日期：2026-08-18\n> 状态：已决策\n> 决策人：MaxNull\n> 触发：排查「活跃会话历史加载失败」时发现——SSiD 是 DSH 的单进程壳，DSH 内核 boot 在 Electron 主进程内，目前没有任何「重启 DSH」入口，遇到插件变更、内核卡死、状态异常只能手动关掉重开\n> 关联：`shell/main.mjs`（托盘与生命周期）、`shell/kernel.ts`（bootKernel）\n\n---\n\n## 〇、决策\n\n**在托盘菜单加「重启」项**（`app.relaunch()` + 优雅退出）。标题栏不加任何按钮，保持干净。\n\n## 一、背景\n\nSSiD 是「DSH 官方 Web GUI + Electron 壳」形态（`main.mjs`），DSH 内核由 `bootKernel()` 直接 boot 在 Electron 主进程内（单进程，见 kernel.ts 头部注释）。当前生命周期只有：\n\n- 关闭窗口 → 隐藏到托盘（`win.on('close')` 拦截）\n- 托盘「退出」→ `before-quit` → `kernel.shutdown(0)` 优雅 dispose\n\n**没有重启入口**。而现实中反复遇到需要重启的场景：装/卸插件（如本次 dsh-chat-timeline → dsh-chat-rail 切换）、DSH 内核卡死、会话日志并发读异常、皮肤/配置热加载失败等——都要手动退出再打开，体验割裂。\n\n## 二、方案\n\n### 2.1 为什么不做「热重启内核」（只重启 DSH，不重启壳）\n\n理论路径：`kernel.shutdown(0)` → 重新 `bootKernel()` → 新端口 → `mainView.loadURL(新端口)`。**否决**：\n\n1. `installProfilePackageResolver`（kernel.ts）是**全局单次安装**的 loader 改写（bare specifier → profile 目录），dispose 后再 boot 会重复安装解析器；DSH 官方 `runProfile` 注释也明确「重启走 profile 配置重启即可」——内核热重启不是设计路径。\n2. 端口每次变化（`--port 0` 随机），BrowserView 需重新 loadURL，存在空白窗口期。\n3. 全局副作用（registerHooks、healProfilesModuleFallback、env）难以干净回滚。\n\n### 2.2 采用方案：`app.relaunch()` 整壳重启\n\n```js\n{ label: '重启', click: () => {\n  app.relaunch({ args: process.argv.slice(1).filter((a) => !a.endsWith('worker.cjs')) })\n  quitting = true\n  void kernel.shutdown(0).catch(() => app.exit(0))\n} }\n```\n\n要点：\n\n1. **`app.relaunch()` 放前面**：先设置重启标志，再走 `kernel.shutdown(0)` 优雅 dispose（`ctx.fiber.dispose()`），最后 `app.exit(0)` 退出——Electron 检测到 relaunch 标志后自动以新进程启动，完成「重启」。\n2. **过滤 `worker.cjs`**：main.mjs 有 worker 模式分支（`process.argv` 含 `worker.cjs` 时 spawn 孙进程后 return）。`app.relaunch` 默认沿用原始 argv，若当前进程是 worker 模式，relaunch 会错误地再次走 worker 分支而不是启动壳。必须过滤。\n3. **`quitting = true`**：避免 `before-quit` 拦截（`win.on('close')` / `before-quit` 的 quit 守卫）干扰重启流程。\n4. **托盘菜单结构**：显示思灵 / **重启** / 退出（重启放中间，避免误触退出）。\n\n### 2.3 不做的事\n\n- 标题栏不加重启按钮（用户拍板：保持干净）\n- 不做「自动重启」/「卡死检测自动拉起」（本次只做手动入口，心跳检测已有 `~/.ssid/heartbeat.log`，将来需要再扩展）\n\n## 三、文件变更\n\n| 文件 | 变更 |\n|---|---|\n| `shell/main.mjs` | 托盘菜单 `Menu.buildFromTemplate` 加「重启」项（约 3 行） |\n\n## 四、验证\n\n1. 语法检查（`node --check main.mjs`）。\n2. 开发模式启动思灵 → 托盘右键 → 点「重启」→ 进程退出并自动重新启动（观察 `~/.ssid/ssid.log` 的 phase 序列：应看到 `PROCESS_EXIT` 后新的 `single-instance` 序列）。\n\n## 五、风险\n\n- `app.relaunch` 在打包版（NSIS）下沿用安装路径启动，已验证为 Electron 标准行为，风险低。\n- 重启瞬间有窗口消失/重现（splash 流程），可接受；不新增 UI。\n\n---\n\n> 已决策（2026-08-18）。实现：main.mjs 托盘菜单加「重启」项。本次非重点，文档先行，实现顺手完成。\n"},{"file":"2026-08-18-vendor指纹盲区-中英切换未生效.md","date":"2026-08-18","slug":"vendor指纹盲区-中英切换未生效","title":"vendor 更新盲区：指纹不覆盖 vendor 目录 → 老 profile 永远拿不到插件更新","statusRaw":"进行中","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-18","dateNote":null,"tags":["dsh-ssid-panels","dsh-runtime"],"summary":"「关于 SSiD 还是不支持中英双语」——dsh-ssid-panels 0.1.1（中英切换）已在 vendor（a81b88f，01:45），但用户 profile 里仍是 0.1.0。","bytes":1605,"lines":34,"body":"# vendor 更新盲区：指纹不覆盖 vendor 目录 → 老 profile 永远拿不到插件更新\n\n日期：2026-08-18\n状态：进行中\n\n## 用户实测问题\n\n「关于 SSiD 还是不支持中英双语」——dsh-ssid-panels 0.1.1（中英切换）已在\nvendor（a81b88f，01:45），但用户 profile 里仍是 0.1.0。\n\n## 根因链（时间戳定案）\n\n1. 归档 `dsh-runtime.tar.gz` 生成于 **01:13:51**，早于 vendor 0.1.1 同步\n   （01:45）——归档内 vendor 是 0.1.0 旧产物（tar 精确计数确认无 i18n）。\n2. 上一轮 tar 检查的输出错位（PowerShell 两段输出交叠），误判归档含 i18n，\n   导致未重跑 prepare-runtime。\n3. **更深缺陷**：`.runtime-version` 指纹 = md5(package.json dependencies +\n   pnpm-lock)——**vendor/ 目录内容不在指纹内**。即使重跑归档，指纹不变\n   （6ef8f070），老 profile 判定「版本一致」跳过重部署 → vendor 更新永远\n   到不了用户。\n\n## 修复\n\n1. **指纹覆盖 vendor**：prepare-runtime 的指纹追加 vendor 目录清单\n   （相对路径+文件大小 的 md5）——vendor 任何变化都会触发重部署。\n2. 重跑 prepare-runtime（vendor 0.1.1 进归档）→ 归档 boot 冒烟 → pack。\n\n## 决策备查\n\n- 指纹原则升级：**归档内一切「随包分发的内容」都必须参与指纹**——\n  profile 文件 + node_modules（lock 已覆盖）+ vendor（本次补上）。\n- 时间戳对照是唯一可靠的事实源，管道输出错位会骗人——重要验证用\n  落盘计数（精确串匹配计数）而非肉眼扫输出。\n"},{"file":"2026-08-17-安装卡死关闭失败-步骤可视化.md","date":"2026-08-17","slug":"安装卡死关闭失败-步骤可视化","title":"安装卡死「思灵无法关闭」+ 安装/部署步骤可视化","statusRaw":"✅ 已完成（v0.1.4 已发布，用户实测确认「棒」）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-17","dateNote":null,"tags":["dsh-runtime"],"summary":"已安装 v0.1.2，运行 v0.1.3 安装包：NSIS 进度条约 50% 处报「思灵无法关闭」后卡住。","bytes":5832,"lines":98,"body":"# 安装卡死「思灵无法关闭」+ 安装/部署步骤可视化\n\n日期：2026-08-17\n状态：✅ 已完成（v0.1.4 已发布，用户实测确认「棒」）\n\n## 现象（用户实测）\n\n已安装 v0.1.2，运行 v0.1.3 安装包：NSIS 进度条约 50% 处报「思灵无法关闭」后卡住。\n\n## 根因推测\n\n- 旧版卸载阶段（NSIS 安装进度中段 ≈ 50%）执行 v0.1.2 的 uninstaller；\n  该卸载器检测到「思灵」进程正在运行 → 尝试关闭失败 → 弹「思灵无法关闭」并等待。\n- **为什么关不掉**：壳的 close-to-tray 逻辑（`win.on('close')` preventDefault + hide）\n  拦截了卸载器发送的 WM_CLOSE——窗口只是藏进托盘，进程不退，卸载器永远等不到退出。\n- 触发前提是用户开着思灵安装新版（常见操作路径）。\n\n## 方案\n\n### 1. 安装器侧治本（NSIS include 脚本）\n\n`shell/build/installer.nsh` + `package.json` `nsis.include`：\n\n- `customInit`：`taskkill /F /IM 思灵.exe /T` 强杀运行中的思灵（close-to-tray\n  使优雅关闭失效，强杀是唯一可靠路径；会话数据为增量持久化落盘，风险低）。\n  仅杀「思灵.exe」，不碰 electron.exe（避免误伤其他 Electron 应用）。\n- `ShowInstDetails show`：强制展开安装详情区。\n- `DetailPrint` 步骤清单：① 关闭运行中的思灵 → ② 卸载旧版 → ③ 复制程序文件\n  → ④ 注册与快捷方式 → ⑤ 完成。卡住时详情区最后一行即卡点（用户可拍照反馈）。\n\n### 2. 首启部署阶段同步加步骤列表（splash）\n\n- `splash.html`：新增步骤清单 UI + `window.__setStepList(items, current)`\n  （完成项打勾、当前项高亮）。\n- `main.mjs`：启动阶段清单（初始化 → 部署运行环境（解压/校验/交换）→\n  启动内核 → 加载界面 → 就绪），各节点更新当前步；失败时停在失败步。\n\n### 3. 版本与交付\n\n- bump `0.1.4`，release notes 记修复；打包出新安装包供用户实测（本机需\n  先 `prepare-runtime` 重建 dsh-runtime.tar.gz 归档）。\n\n## 验证\n\n- [x] `npm run pack` 成功（产物 `dist-electron/思灵 Setup 0.1.4.exe`，213.6 MB）\n- [x] dev 冒烟：步骤清单插桩不破坏启动流程（TDZ 一次崩溃已修，见 183ce8a）\n- [x] 开着旧版安装 v0.1.4：不再卡 50%，安装成功（用户实测多轮）\n- [x] 详情区展开 + 5 步清单 + 状态标签全程可见，2→4→5 分步停留（用户实测「棒」）\n- [x] 首启部署 splash 步骤列表（随安装版交付，机制与 dev 冒烟一致）\n\n## 最终实现（NSIS 侧，四轮迭代收敛）\n\n1. **杀进程**：customInit + customCheckAppRunning 双处 `taskkill /F /IM 思灵.exe /T`。\n2. **详情区展开**：customCheckAppRunning 内 `SetDetailsView show`（Section 合法指令，\n   实测可覆盖 common.nsh 的顶层 `ShowInstDetails nevershow`）。\n3. **清单**：LVM_INSERTITEMW 直插 SysListView32（1016）——nevershow 下 DetailPrint\n   被运行时丢弃，必须绕过打印机制。\n4. **步骤推进**：NSIS wiki DetailUpdate 方案——LVM_SETITEMTEXT 更新列表最后一项 +\n   WM_SETTEXT 同步状态标签（1006），每次现取句柄、寄存器 Push/Pop 保护；\n   尾部分步 Sleep 1.2s 防 finish 页秒切。\n\n## NSIS 定制坑合集（全部实测）\n\n1. **ShowInstDetails 的合法上下文是文件顶层**（本地 makensis 探针实测）：\n   .onInit / Section / 普通 Function 全部编译报错，**顶层（文件作用域）合法**，\n   语义为「详情区默认展开」。MUI 页面回调绑定也救不了（NSIS 单遍编译，\n   include 编译时还看不到后续模板的页面绑定）。\n2. **SetDetailsView show 是 Section 内合法指令**（官方文档：sections can\n   override the default details view）——但只在 customInstall（文件复制后）\n   时机，救不了更早的卸载卡死点，仅作保险。\n3. **模板在非静默安装时执行 SetDetailsPrint none**（installSection.nsh 第 6 行）\n   会吞掉 Section 内的 DetailPrint——customInstall 里必须 SetDetailsPrint\n   textonly 恢复。\n4. **customInit（.onInit）的 DetailPrint 会缓冲进详情区**，instfiles 页显示时\n   呈现——因此清单在 .onInit 打印，卡死在卸载步（customInstall 之前）时\n   用户也能在展开的详情区看到「开始 [2/5] 卸载旧版本」这一行即卡点。\n5. **卸载器构建同样 include 本文件**：顶层指令需 !ifndef BUILD_UNINSTALLER\n   隔离；宏只定义不展开则无影响。\n6. **打包偶发卡死**：signAndEditExecutable 时 Defender 锁 elevate.exe →\n   electron-builder「waiting for unlock」循环，实测 5-20 分钟自动解锁后\n   继续成功；处置：等待或杀进程清理 dist-electron 重跑。\n\n## 本机重建归档（prepare-runtime）记录\n\n- 本机 node v26.2.0 / pnpm 11.21.0 / bsdtar 满足要求（DSH_NODE + PNPM_CMD 显式指定）。\n- `pnpm add 缺失 peer` 的 spawnSync 报 ETIMEDOUT：pnpm 实际已装完（node_modules\n  完整），但子进程句柄未及时关闭导致 spawnSync 等待 10 分钟超时。处置：手动补\n  `.runtime-version`（0.1.4-0.1.0-rc.6）+ 手动 `tar -czf`（123.6 MB）+ 删源目录，\n  与脚本第 6/7 步等价。**构建机下次跑 prepare-runtime 若复现，考虑把 runPnpm\n  的 stdio 从 inherit 改为 pipe 或加 detached 处理**（候选改进）。\n\n## 备查\n\n- electron-builder NSIS 钩子宏：customInit（installer.nsi .onInit）、customInstall\n  （installSection.nsh Section）；DetailPrint 输出到安装详情区。\n- 卸载器关不掉 app 的根因是 close-to-tray 拦截 WM_CLOSE——该行为对用户是特性，\n  不改为监听安装器；由安装器侧强杀配合（taskkill /F /IM 思灵.exe /T）。\n"},{"file":"2026-08-17-检查更新缺下载入口-v0.1.2候选.md","date":"2026-08-17","slug":"检查更新缺下载入口-v0.1.2候选","title":"检查更新缺下载入口：v0.1.2 候选改进","statusRaw":"决策记录（v0.1.2 实施时执行）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":"2026-08-17","dateNote":null,"tags":["@max-null/dsh-ssid-panels","dsh-ssid-panels"],"summary":"用户点「立即检查」看到「新版本可用：v0.1.1 补丁」，但卡片只有文案， 没有任何可点击的下载入口，用户不知道如何更新（2026-08-17 实测确认）。","bytes":1570,"lines":36,"body":"# 检查更新缺下载入口：v0.1.2 候选改进\n\n日期：2026-08-17\n状态：决策记录（v0.1.2 实施时执行）\n\n## 现象\n\n用户点「立即检查」看到「新版本可用：v0.1.1 补丁」，但卡片只有文案，\n**没有任何可点击的下载入口**，用户不知道如何更新（2026-08-17 实测确认）。\n\n## 根因（代码级确认）\n\n`dsh-ssid-panels/lib/index.mjs` 的 `update-check` API 返回字段只有\n`tag / name / body / publishedAt`，**丢弃了 GitHub release 的 `html_url` 与\n资产 `browser_download_url`**；前端（client.js）更新卡片仅渲染文案 + 「立即检查」按钮。\n\n## 方案（v0.1.2 实施）\n\n1. `update-check` 返回补 `htmlUrl: release.html_url`（及可选\n   `downloadUrl: 首个 exe 资产的 browser_download_url`）。\n2. 前端更新卡片：新版本可用时渲染「下载」按钮 →\n   `shell.openExternal(htmlUrl)` 打开 Releases 页（或直接指向资产 URL）。\n3. 配套：`@max-null/dsh-ssid-panels` 发新版 → `profile-template/vendor` 同步 →\n   重打包发 v0.1.2。\n\n## 本次（v0.1.1 当值）应对\n\n- 手动更新：下载 `Setup.0.1.1.exe`，NSIS 向导覆盖安装（保持原目录）。\n- 安装包已下载至 `C:\\Users\\MaxNull\\Downloads\\Setup.0.1.1.exe`。\n- 覆盖安装后 about 页 shellVersion 显示 0.1.1，检查更新回到「已是最新」。\n\n## 决策备查\n\n- 更新机制现状（v0.1.x）：提示式，不自动下载、不静默安装，符合「人工闸门」原则；\n  但提示必须带下载入口，否则等于没提示。\n"},{"file":"2026-08-17-EPIPE崩溃-stderr管道防护.md","date":"2026-08-17","slug":"EPIPE崩溃-stderr管道防护","title":"EPIPE 崩溃修复：stderr 管道防护","statusRaw":"✅ 已修复","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-17","dateNote":null,"tags":[],"summary":"Electron 主进程弹出 A JavaScript error occurred in the main process： Uncaught Exception: Error: EPIPE: broken pipe, write，栈顶指向 shell/main.mjs:216——console-message 转发回调里的 process.stderr.write(...)。","bytes":2130,"lines":44,"body":"# EPIPE 崩溃修复：stderr 管道防护\n\n日期：2026-08-17\n状态：✅ 已修复\n\n## 现象\n\nElectron 主进程弹出 `A JavaScript error occurred in the main process`：\n`Uncaught Exception: Error: EPIPE: broken pipe, write`，栈顶指向\n`shell/main.mjs:216`——`console-message` 转发回调里的 `process.stderr.write(...)`。\n\n## 根因\n\n- `main.mjs` 把官方 UI 渲染进程的每条 console 都转发到 `process.stderr`（216 行），\n  另有多处启动/诊断日志写 stderr（143/161/264/281/283）。\n- 启动方式决定 stderr 挂在哪：从终端启动时挂在终端管道上；终端关闭 / 管道断开后，\n  再写入抛 **EPIPE**。Node 对 stderr 的 error 事件无人监听时会升级为未捕获异常，\n  Electron 弹错误框并可能终止进程。\n- 报错路径 `file:///H:/.../shell/main.mjs` 表明发生场景是 **dev 形态**（打包版是\n  kernel.bundle.mjs），即启动终端断开或双击启动。\n\n## 修复方案\n\n1. `main.mjs` 顶部（任何写入发生前）注册全局防护：\n   - `process.stderr.on('error', ...)` / `process.stdout.on('error', ...)` 吞掉 error，\n     使 EPIPE 不再升级为未捕获异常；\n   - `safeLog(text)` 封装：写失败一次后置 `stdioDead` 标志，后续日志静默，\n     避免每条 console 都反复写死管道。\n2. 6 处 `process.stderr.write` 全部改走 `safeLog`。\n3. `kernel.bundle.mjs` 内的 `loadLayeredEnv` warn 写 stderr **不改**：它是编译产物，\n   改 bundle 会被下次重建覆盖；全局 error 监听已兜底其写入失败。\n\n## 验证\n\n- [x] `node --check shell/main.mjs` 语法通过\n- [x] dev 启动冒烟（2026-08-17 实测）：boot 正常（dsh web 64864）、`[main-ui]` 日志\n      转发工作、theme-observer installed、关于页 11 插件全加载、无 EPIPE\n- [x] 打包形态同样受防护：electron-builder 将 `main.mjs` 原样打进 asar，无编译差异\n\n## 决策备查\n\n- stderr/stdout 一律经 `safeLog`，禁止直接 `process.stderr.write`（新代码也守此约定）。\n- 编译产物（`*.bundle.mjs`）不做手改，问题修在源码层。\n"},{"file":"2026-08-17-GitHub发布收尾-状态与动作.md","date":"2026-08-17","slug":"GitHub发布收尾-状态与动作","title":"GitHub 发布收尾：v0.1.0 状态盘点与动作","statusRaw":"✅ 收尾完成","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-17","dateNote":null,"tags":[],"summary":"用户反馈「之前卡在发布到 GitHub」。盘点后发现：GitHub Release 本体其实已经发布成功，卡住的是本地收尾的尾巴。","bytes":1849,"lines":39,"body":"# GitHub 发布收尾：v0.1.0 状态盘点与动作\n\n日期：2026-08-17\n状态：✅ 收尾完成\n\n## 背景\n\n用户反馈「之前卡在发布到 GitHub」。盘点后发现：**GitHub Release 本体其实已经发布成功**，卡住的是本地收尾的尾巴。\n\n## 盘点结果（动作前实测）\n\n| 项 | 状态 |\n|---|---|\n| Release `v0.1.0 思灵（SSiD）初版` | ✅ 已发布，非草稿、非 prerelease（2026-08-16T19:51:27Z） |\n| Release 正文 | ✅ 与 `docs/release-notes-v0.1.0.md` 逐字一致 |\n| 安装包资产 | ✅ `Setup.0.1.0.exe`（103,604,882 字节 ≈ 98.8 MB）已上传 |\n| 远程 tag `v0.1.0` | ✅ 指向 `dadc697`，与本地 main 一致 |\n| `docs/release-notes-v0.1.0.md` | ❌ 本地 untracked，未提交推送 |\n| 本地 tag | ❌ 本地 `git tag -l` 为空（远程有，未 fetch） |\n| README 下载入口 | ❌ README「现状」停留在起步阶段，无任何 Release 链接 |\n\n## 本次动作\n\n1. 提交并推送 `docs/release-notes-v0.1.0.md` + 本决策文档 + README 修正（一个 commit）。\n2. `git fetch --tags`：把远程 `v0.1.0` tag 拉到本地，本地/远程完全对齐。\n3. README 补「下载安装」小节（指向 Release 资产与 Releases 页），「现状」更新为 v0.1.0 已发布，「技术栈」插件行从两个起步插件更新为实际全家桶。\n   - 未走 mxy-update-docs：仓库无 AGENTS.md，且本次是发布收尾的小范围修正，非系统性文档同步。\n\n## 验证清单（动作后）\n\n- [x] `git status` 干净\n- [x] `git tag -l` 含 `v0.1.0`，且指向 `dadc697`\n- [x] Release 资产 URL 可访问（HTTP 200）\n- [x] README 链接指向正确\n\n## 结论\n\nGitHub 发布 v0.1.0 完整闭环：Release + 资产 + tag + 仓库文档同步。此前「卡住」是本地未完成收尾造成的感知，远程发布实际早已就绪。\n"},{"file":"2026-08-17-header按钮统一-调查与方案.md","date":"2026-08-17","slug":"header按钮统一-调查与方案","title":"Header 按钮统一：调查结论与方案","statusRaw":"方案待确认（主方案：SSiD 标题栏统一按钮组；补丁已起草将改造；PR 降级）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-17","dateNote":null,"tags":["@max-null/dsh-plugin-center","dsh-plugin-center","dsh-better-sidebar","dsh-header-unify","dsh-runtime"],"summary":"SSiD 预制了插件中心（@max-null/dsh-plugin-center）与侧边栏（dsh-better-sidebar）两个插件，右上角各有一个按钮，但实现方式完全不同：","bytes":12006,"lines":186,"body":"# Header 按钮统一：调查结论与方案\r\n\r\n> 日期：2026-08-17\r\n> 状态：方案待确认（主方案：SSiD 标题栏统一按钮组；补丁已起草将改造；PR 降级）\r\n> 范围：① 插件中心与 better-sidebar 右上角按钮的错位；② 插件中心按钮在 hero 页不可见\r\n> 关联：`docs/设计/SSiD-技术设计方案.md`、`docs/设计/SSiD-壳级能力设计.md`\r\n\r\n---\r\n\r\n## 一、背景\r\n\r\nSSiD 预制了插件中心（`@max-null/dsh-plugin-center`）与侧边栏（`dsh-better-sidebar`）两个插件，右上角各有一个按钮，但实现方式完全不同：\r\n\r\n| | 插件中心 | 侧边栏 |\r\n|---|---|---|\r\n| 按钮注入方式 | `ctx.slots.inject(\"conversation.session.header.utilities\", ...)`——DSH 官方 slot | 自绘浮层：`position: fixed; top: 3px; right: 10px`（`.toggleCluster`） |\r\n| 与原生按钮关系 | 与 DSH 原生 Session log 下载按钮同 slot 并排，样式统一 | 不经过 slot，钉死在视口右上角，与 header 错位 |\r\n| 语义定位 | 会话级工具 | 全局布局开关（无会话时也显示 disabled 按钮） |\r\n\r\n用户感知：① 侧边栏按钮与 header 错位；② 初次打开/新会话（hero 页）时插件中心按钮不可见——而那时正是需要装插件的节点。\r\n\r\n**新方向（用户提出）**：SSiD 标题栏是自绘的（非系统原生），完全可以在**最小化按钮左侧**做一个统一按钮组（插件中心 + 侧栏开关），天然全局可见、样式统一。\r\n\r\n## 二、调查结论（读代码核实）\r\n\r\n### 2.1 DSH 无\"全局 header/toolbar\"位置\r\n\r\nDSH 全部 42 个 client slot（`cordis-client-runner/src/client/slot-catalog.ts`）中，header 类 slot（`conversation.session.header.actions` / `.utilities`）**全部 `scope: 'session'`**，只在会话页渲染。全局可用的仅 `sidebar.footer.action`（左栏底部）、`sidebar.*`、`shell.overlay`（浮层）、`conversation.hero.*`（hero 内容区）。**DSH 官方 UI 没有\"全局右上角\"扩展点。**\r\n\r\n### 2.2 hero 页没有 header\r\n\r\n`ui-conversation/src/client/skeleton/ConversationRoot.tsx`：`hero = sessionId === undefined`。hero 时渲染居中文案 + 输入框，不渲染 header——挂 `header.utilities` 的按钮在 hero 页必然不可见。\r\n\r\n### 2.3 插件中心：按钮与面板解耦，未暴露跨插件 API\r\n\r\n- `HeaderButton` 仅是 `onClick: openOverlay()`；面板挂全局 `shell.overlay`；打开状态是模块级变量 `overlayOpen`（`client.js`）——**未暴露**为 service/全局函数。\r\n- 仓库：`Max-Null/dsh-plugin-center`（**自有**，改源码发新版无障碍）。`apply(ctx)` 内一行 `window.__pluginCenterOpen = openOverlay` 即可暴露全局触发。\r\n\r\n### 2.4 better-sidebar：有对外 service\r\n\r\n- `ctx.provide('betterSidebar', service)`，导出 `togglePanel` 等（`service.ts`），exports 含 `./client/api`——外部插件可集成。\r\n- `.toggleCluster` 编译后类名保留原始段（`nArs4W_toggleCluster`）。\r\n- 仓库：`omdsh-dev/DSH-better-sidebar`（第三方，只能提 PR）。\r\n\r\n### 2.5 壳已具备\"操作 DSH 页面\"的成熟模式\r\n\r\n`shell/main.mjs` 多处 `mainView.webContents.executeJavaScript(...)`：\r\n- **侧边栏自动诊断**（793-820 行）：`document.querySelector('.nArs4W_toggleCluster')` + `btns[0].click()` **模拟点击 better-sidebar 按钮**——标题栏按钮触发 DSH 内动作的链路已有先例。\r\n- 主题同步（835-862 行）：mainView 读 token → titleBar 写 CSS 变量（双向注入）。\r\n- MutationObserver 注入（870-879 行）：注入长期驻留代码。\r\n\r\n### 2.6 标题栏结构\r\n\r\n- `titlebar.html`：`.titlebar` flex 布局 = `.brand`（logo + 思灵 + DSH 版本）+ `.spacer` + `.controls`（最小化/最大化/关闭，52px 宽按钮）。按钮组插在 `.controls` 内最小化按钮左侧即可。\r\n- `titlebar-preload.cjs`：`window.ssidTitle`（invoke/handle 模式 IPC）。\r\n- `main.mjs`：`ipcMain.handle('ssid:title:minimize' | 'toggle-maximize' | 'close')`——加新 IPC 成本低。\r\n\r\n## 三、问题矩阵\r\n\r\n| 场景 | 插件中心按钮 | better-sidebar toggle |\r\n|---|---|---|\r\n| 会话页 | ✅ header 右上角 | ❌ fixed 错位 |\r\n| hero 页 / 新会话 | ❌ 不可见 | ✅ 原位置，无冲突（但无 header 相伴） |\r\n\r\n## 四、决策\r\n\r\n### D1：插件中心按钮 → 迁入 SSiD 标题栏（主方案，解决全部两个问题）\r\n\r\n标题栏是自绘 BrowserView（SSiD 100% 控制），按钮组放最小化按钮左侧：\r\n\r\n```\r\n[logo 思灵 DSH版本]        [插件中心][侧栏] [—][□][✕]\r\n```\r\n\r\n- 永远可见（hero / 会话 / 设置页都在标题栏下方）。\r\n- 统一样式（标题栏按钮组风格一致，跟随主题 token）。\r\n- 不依赖 DSH slot 演进。\r\n\r\n**触发链路**：标题栏按钮 → preload IPC → main → `mainView.webContents.executeJavaScript` 派发 `CustomEvent('ssid:titlebar')` → SSiD 内置 client 插件（`dsh-header-unify` 改造）监听执行：\r\n- 插件中心 → `window.__pluginCenterOpen?.()`（plugin-center 新版暴露）\r\n- 侧栏 → `ctx.betterSidebar.togglePanel()`（service 已有）\r\n\r\n**DSH 内原按钮隐藏**（避免双份、消除错位）：`dsh-header-unify` 注入 CSS：\r\n```css\r\n[class*=\"pc-headerbtn\"]  { display: none !important; }\r\n[class*=\"toggleCluster\"] { display: none !important; }\r\n```\r\nDSH 原生 Session log 按钮保留在 header。\r\n\r\n### D2：better-sidebar 上游 PR（撤销）\r\n\r\n按钮迁入标题栏后错位问题消失（DSH 内原 toggleCluster 被 CSS 隐藏），**不再提 PR**——better-sidebar 在 DSH header 场景下的错位是上游自己的布局决策，SSiD 不做无谓贡献。\r\n\r\n### D3：备选方案（记录不采纳）\r\n\r\n- **原 CSS 对齐方案**（`dsh-header-unify` 对齐 toggleCluster 到 header utilities 行）：解决会话页错位，但不解决 hero 页插件中心不可见；已起草的代码可作参考。\r\n- 插件中心 `sidebar.footer.action` 入口 / body fixed 按钮：用户已评估\"设置内已有插件中心 tab，非高频功能，可接受现状\"——**除非做标题栏方案，否则保持现状**。\r\n\r\n## 五、实施设计（标题栏统一按钮组）\r\n\r\n### 5.1 改动清单\r\n\r\n| # | 文件 | 改动 |\r\n|---|---|---|\r\n| 1 | `shell/titlebar.html` | `.controls` 前加按钮组（2 按钮：插件中心、侧栏），样式复用现有 hover/主题 token |\r\n| 2 | `shell/titlebar.js` | 按钮 click → `window.ssidTitle.action('plugin-center' | 'sidebar')` |\r\n| 3 | `shell/titlebar-preload.cjs` | `ssidTitle.action(id)` → `ipcRenderer.invoke('ssid:title:action', id)` |\r\n| 4 | `shell/main.mjs` | `ipcMain.handle('ssid:title:action', ...)` → `mainView.webContents.executeJavaScript(派发 CustomEvent)`；DSH UI 未就绪时忽略（按钮点击发生在用户交互期，UI 必已就绪） |\r\n| 5 | `plugins/dsh-header-unify/lib/client.js` | 改造：监听 `ssid:titlebar` CustomEvent → 执行插件中心/侧栏动作；注入隐藏 CSS（pc-headerbtn + toggleCluster） |\r\n| 6 | `@max-null/dsh-plugin-center`（独立仓库） | `apply(ctx)` 暴露 `window.__pluginCenterOpen = openOverlay`（含页面卸载清理）→ 发新版 |\r\n\r\n### 5.2 触发链路（时序）\r\n\r\n```\r\n用户点标题栏[插件中心]\r\n → titlebar renderer: window.ssidTitle.action('plugin-center')\r\n → preload: ipcRenderer.invoke('ssid:title:action', 'plugin-center')\r\n → main: ipcMain.handle → mainView.webContents.executeJavaScript(\r\n     `window.dispatchEvent(new CustomEvent('ssid:titlebar', { detail: 'plugin-center' }))`)\r\n → dsh-header-unify (DSH 页面内): 监听事件 → window.__pluginCenterOpen?.()\r\n → plugin-center OverlayPanel (shell.overlay) 打开（hero/会话页均可）\r\n```\r\n\r\n### 5.3 状态反馈（可选增强，MVP 不做）\r\n\r\n侧栏开/关 active 态：main 可定期 `executeJavaScript` 读面板 class（`panelHidden` 有无）→ `titleBar.webContents.send` 更新按钮样式。\r\n\r\n### 5.4 风险与缓解\r\n\r\n| 风险 | 缓解 |\r\n|---|---|\r\n| executeJavaScript 注入代码在 DSH 页面出错 | 包 try/catch；CustomEvent 无监听者时静默（插件未加载） |\r\n| plugin-center 未升级（旧版无 `__pluginCenterOpen`） | `?.()` 可选调用；升级插件中心后生效 |\r\n| better-sidebar 升级改类名段 | 隐藏 CSS 依赖 `toggleCluster`/`pc-headerbtn` 原始段；若变更则按钮重现（无破坏），再适配 |\r\n| 标题栏空间有限 | 按钮组 ≤ 3 个；36px 高标题栏用 28-30px 按钮 |\r\n\r\n## 六、实施清单\r\n\r\n- [x] 方案确认\r\n- [x] 改造 `dsh-header-unify`（事件执行器 + 隐藏 CSS）——`plugins/dsh-header-unify/`\r\n- [x] 改 `plugin-center` 暴露 `window.__pluginCenterOpen`（v0.1.6，本地构建）——`D:\\Project\\dsh-plugin-center`\r\n- [x] 改壳：titlebar.html / titlebar.js / titlebar-preload.cjs / main.mjs（按钮组 + IPC + 事件派发）\r\n- [x] 预制 `dsh-header-unify` 进 profile-template（vendor + package.json）\r\n- [x] 部署到当前 ssid profile（vendor + node_modules + plugin-center 0.1.6）\r\n- [x] 语法检查（node --check 全过）+ client.js 运行时验证（`verify-header-unify.cjs`，11 项全过）\r\n- [ ] 重启壳验证：\r\n  - [ ] 会话页：header 只剩 Session log；标题栏按钮打开插件中心/切换侧栏\r\n  - [ ] hero 页：标题栏按钮可打开插件中心（overlay 全局生效）\r\n  - [ ] 侧栏面板打开时 toggleCluster 不再显示（无错位）\r\n  - [ ] 主题切换后标题栏按钮样式跟随\r\n- [ ] 发布 plugin-center v0.1.6（npm publish，待验证后）\r\n- [ ] 提交 SSiD 仓库改动（plugins/dsh-header-unify + shell 4 文件 + profile-template）\r\n\r\n## 验证记录（2026-08-19）\r\n\r\n- **首次重启安装版**：header 原按钮已隐藏 ✅（dsh-header-unify 插件经 profile 生效）；\r\n  标题栏按钮 ❌ —— 安装版跑 app.asar 旧快照（8-19 打包），shell 源码改动未进安装包。\r\n- **根因**：安装版资源 = 打包时快照；profile = 共享（插件改动即时生效），但壳代码必须重新打包。\r\n- **两步走**：\r\n  1. 重新打包（asar 带新标题栏；dsh-runtime 暂用旧归档）→ 验证功能\r\n  2. 发布 plugin-center v0.1.6 → 重跑 `scripts/prepare-runtime.mjs`（新归档带 dsh-header-unify\r\n     + plugin-center 0.1.6）→ 再打包 → 完整交付（新装机开箱即用）\r\n- **安装版验证（重新打包后）**：标题栏 3 按钮 / 会话页切换 / hero 页插件中心 / 主题跟随 —— 全部 ✅\r\n\r\n## 优化迭代（2026-08-19，用户反馈后）\r\n\r\n| # | 问题 | 方案 | 状态 |\r\n|---|---|---|---|\r\n| 1 | 点插件中心只开不关 | plugin-center 0.1.7 新增 `toggleOverlay`，暴露 `__pluginCenterToggle`；dsh-header-unify 优先 toggle（老版回退 open） | ✅ |\r\n| 2 | 插件中心面板打开时开侧栏被遮挡 | **单向互斥**（用户选 A）：开侧栏/底栏先 `__pluginCenterClose`；附带修复点遮罩关闭（面板内 stopPropagation） | ✅ |\r\n\r\n验证：`verify-header-unify.cjs` 17 项断言全过；profile 部署 0.1.7 + dsh-header-unify 新版；**用户实测效果很好**。\r\nplugin-center 提交：`509d9f5`（0.1.6 暴露 open）、`1833b58`（0.1.7 toggle/close/遮罩）。\r\n\r\n## 待办（第二步完整交付）\r\n\r\n- [ ] 发布 `@max-null/dsh-plugin-center@0.1.7` 到 npm（需 npm token）\r\n- [ ] 重跑 `node scripts/prepare-runtime.mjs`（新归档含 dsh-header-unify + plugin-center 0.1.7；pnpm-workspace.yaml 已豁免 0.1.6/0.1.7 发布年龄）\r\n- [ ] `npm run pack` 重新打包安装版\r\n- [ ] 提交 SSiD 仓库（plugins/dsh-header-unify + shell 4 文件 + profile-template + docs）\r\n\r\n## 附：撤销/降级的备选\r\n\r\n- 插件中心 hero 页全局入口（sidebar.footer.action / body fixed / DSH 全局 slot）：标题栏方案已覆盖，不实施。\r\n- better-sidebar header 对齐 CSS（原 dsh-header-unify 草案）：被标题栏方案取代；代码留作参考。\r\n"},{"file":"2026-08-17-plugin-center三缺陷修复-0.1.1.md","date":"2026-08-17","slug":"plugin-center三缺陷修复-0.1.1","title":"dsh-plugin-center 缺陷修复（0.1.2 含双语）：并发更新闪退 + 弹窗缺按钮 + 中文化 + 市场计数 + 检查反馈 + pnpm 假成功 + 双语","statusRaw":"✅ 代码/发布/归档全链路完成（npm 0.1.1 已发布、归档含 0.1.1、安装包 0:07 出炉）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-17","dateNote":null,"tags":["@max-null/dsh-plugin-center","dsh-plugin-center"],"summary":"1. 点击「Update All」页面闪一下就没下文。 2. 启动 DSH 的「插件更新」弹窗缺少「立即更新」按钮。 3. 「Update All」按钮未中文化（应「更新全部」）。 4. 市场 tab 未打开过时徽标恒 0（预加载机制漏洞）。","bytes":4703,"lines":76,"body":"# dsh-plugin-center 缺陷修复（0.1.2 含双语）：并发更新闪退 + 弹窗缺按钮 + 中文化 + 市场计数 + 检查反馈 + pnpm 假成功 + 双语\n\n日期：2026-08-17\n状态：✅ 代码/发布/归档全链路完成（npm 0.1.1 已发布、归档含 0.1.1、安装包 0:07 出炉）\n仓库：H:\\MaxNull\\WorkStation\\dsh-plugin-center（发布 @max-null/dsh-plugin-center@0.1.1）\n\n## 用户实测缺陷（v0.1.4 预发布验收）\n\n1. 点击「Update All」页面闪一下就没下文。\n2. 启动 DSH 的「插件更新」弹窗缺少「立即更新」按钮。\n3. 「Update All」按钮未中文化（应「更新全部」）。\n4. 市场 tab 未打开过时徽标恒 0（预加载机制漏洞）。\n\n## 根因（代码级确认）\n\n1. **updateAll 并发风暴**（client/index.tsx:435）：`for (const u of updates) { void updateOne(u.name) }`\n   并发发起 N 个 rpc('update')——每个 update 服务端 spawn `pnpm add -w \u003cpkg>`\n   （update.ts:117）阻塞执行，**N 个 pnpm 进程并发写同一 profile**（pnpm\n   store 锁/package.json 并发写）→ 多数失败；前端 busyUpdate 状态互相覆盖\n   （每个 updateOne 各自 set/清空）→ UI 闪烁；失败 toast 一闪而过 → 「没下文」。\n2. **弹窗无更新入口**（client/index.tsx:594-597）：WhatsNewDialog 底部只有\n   「稍后」「全部标记已读」，更新动作须手动去更新页。\n3. **文案遗漏**：456 行按钮为英文「Update All（N）」。\n\n## 修复方案\n\n1. **updateAll 串行化**：await 逐个 rpc('update')，busy='__all__' 全局禁用；\n   结束汇总 toast（成功 N / 失败清单）+ refreshUpdates。\n2. **服务端串行链**（engine.ts）：update/install 挂 promise 链锁——任何入口\n   的 pnpm 调用串行化（同 profile 禁止并发 pnpm，防再次踩并发）。\n3. **弹窗加「立即更新」**：WhatsNewDialog 内串行更新 + busy 态 + toast，\n   全部成功自动关闭弹窗；保留「稍后」「全部标记已读」。\n4. **中文化**：Update All（N）→ 更新全部（N）；弹窗新按钮「立即更新」。\n5. **市场计数预载**（缺陷 4 修复，fdc1177）：marketCount 原本只由 MarketView\n   挂载时的 onCount 回调驱动——tab 未打开过就恒 0（服务端缓存有数据也看不到）。\n   CenterPanel 挂载即拉 listMarket('all')，done=false 时每 5s 轮询直到完成。\n6. **指纹覆盖 lock**（SSiD 侧 prepare-runtime）：指纹 = md5(package.json\n   dependencies + pnpm-lock.yaml)——插件版本漂移（0.1.0→0.1.1）也能触发\n   重部署（此前指纹只 hash package.json，版本漂移是盲区，同批修复）。\n\n## 交付链\n\nplugin-center：改 client/index.tsx + engine.ts → build-client → bump 0.1.1 →\nnpm publish → SSiD 侧 prepare-runtime（lock 解析 0.1.1）→ pack → 用户验收。\n\n## 追加缺陷（0.1.2 同批）\n\n5. **pnpm 假成功**（用户实测单/全更新均「闪一下没下文」）：机器无 pnpm.exe\n   （仅 .cmd/.ps1），`spawn('pnpm', shell:false)` 实测 ENOENT——更新从未执行；\n   客户端不检查返回值 → 假成功 toast。修复：候选链 + shell:true + 失败 detail\n   透传 rpc error + 客户端返回值检查（fa08204）。\n6. **未适配 DSH 双语切换**（用户反馈）：DSH 的 locale 机制 = ctx.locale 服务 +\n   `locale/change` 事件（快照 active: 'zh'|'en'）。plugin-center 文案全部硬编码\n   中文。修复：内置 zh/en 字典 + useT hook + apply 监听 locale/change 与初始快照，\n   市场描述按语言选择 description.zh/en。\n\n## 发布链踩坑（归档解析 0.1.0 两轮排查）\n\n1. **pnpm metadata 缓存**：发布后立即 install 解析到旧版本（缓存 TTL 数分钟），\n   等待或清缓存可解。\n2. **pnpm 11 供应链策略 minimumReleaseAge**：内置默认 24 小时，新版本在龄内\n   不被 ^range 采用（精确版本不受限）。本地四变体实验结论：\n   A 精确 0.1.1 无豁免 → 0.1.1；B ^0.1.0 无豁免 → 0.1.0；\n   C ^0.1.0 + 豁免条目 `pkg@0.1.1` → 0.1.1；D minimumReleaseAge: 0 → 0.1.1。\n   采用 C：profile-template/pnpm-workspace.yaml 的 minimumReleaseAgeExclude\n   加 `@max-null/dsh-plugin-center@0.1.1`（603c538）。\n3. 归档指纹随 lock 变化（07de2fab），首启对比触发重部署 ✓。\n\n## 验证\n\n- [x] build-client 成功、client.js 更新（39.3kb）\n- [x] npm publish 0.1.1（用户终端 OTP 完成）\n- [x] SSiD 归档含 plugin-center@0.1.1（tar 验证）、指纹变化\n- [x] pack 成功（0:07，215.3MB）\n- [ ] 用户实测：更新全部串行、弹窗立即更新、中文按钮、市场计数、检查更新反馈\n"},{"file":"2026-08-17-v0.1.1补丁发布-EPIPE修复进安装包.md","date":"2026-08-17","slug":"v0.1.1补丁发布-EPIPE修复进安装包","title":"v0.1.1 补丁发布决策：EPIPE 修复进安装包","statusRaw":"✅ 已完成（2026-08-17，Release v0.1.1 已发布）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-17","dateNote":null,"tags":["dsh-ssid-panels"],"summary":"用户问「提交了吗？要重新打包吗？」。EPIPE 修复（3584371）只改了 shell/main.mjs， v0.1.0 安装包仍是旧代码。是否重新打包需要决策。","bytes":2632,"lines":51,"body":"# v0.1.1 补丁发布决策：EPIPE 修复进安装包\n\n日期：2026-08-17\n状态：✅ 已完成（2026-08-17，Release v0.1.1 已发布）\n\n## 背景\n\n用户问「提交了吗？要重新打包吗？」。EPIPE 修复（`3584371`）只改了 `shell/main.mjs`，\nv0.1.0 安装包仍是旧代码。是否重新打包需要决策。\n\n## 决策：bump v0.1.1，发新 Release（不替换 v0.1.0 资产）\n\n依据（检查更新逻辑实测，`profile-template/vendor/dsh-ssid-panels/lib/client.js`）：\n\n```js\nconst newer = latest.tag !== `v${update.currentVersion}`\n```\n\n- 更新检查**只对比 tag 字符串与本地版本**。若静默替换 v0.1.0 资产（tag 不变），\n  已安装用户永远判定「已是最新」，看不到修复版 → 必须发新 tag。\n- EPIPE 是崩溃级 bug，语义上是 patch → 版本 0.1.1。\n- 版本来源链：`shell/package.json` version → `SSID_SHELL_VERSION` 注入 →\n  about API `currentVersion` → 检查更新对比。bump 该文件即可全链生效。\n- v0.1.0 之后代码增量仅 EPIPE 防护一个 fix（其余两个提交是文档），0.1.1 范围干净。\n\n## 动作清单\n\n1. `shell/package.json` version → 0.1.1（`npm version patch --no-git-tag-version`，\n   同步 package-lock root version，不让 npm 自动 commit/tag）。\n2. 写 `docs/release-notes-v0.1.1.md`（修复说明）。\n3. commit + push（tag 不打：由 `gh release create` 从 push 的 HEAD 建 tag，避免 tag 落后提交）。\n4. `npm run pack` 重新打包（esbuild bundle-kernel + electron-builder NSIS，\n   产物 `思灵 Setup 0.1.1.exe`）。\n5. `gh release create v0.1.1`：正文用 v0.1.1 release notes，上传新安装包。\n6. README 下载直链更新为 0.1.1 资产，收尾 commit + push。\n7. 验证：Release 资产 200；v0.1.0 安装用户检查更新应显示「新版本可用：v0.1.1」。\n\n## 已知注意点\n\n- kernel.ts 未改动，bundle-kernel 重跑产物不变；修复仅随 main.mjs 进 asar。\n- v0.1.0 Release 保留不动（用户可回退）。\n- 更新机制只提示、不自动下载：用户仍需到 Releases 页手动下载安装（v0.1 现状）。\n- **GitHub 会规范化资产名**：上传「思灵 Setup 0.1.1.exe」后资产实际名为\n  `Setup.0.1.1.exe`（中文与空格被去除，v0.1.0 同）。README 直链必须用规范化名。\n\n## 实测结果\n\n- Release v0.1.1「v0.1.1 补丁」已发布，资产 `Setup.0.1.1.exe`（103,605,121 字节），URL 200。\n- tag v0.1.1 已建（指向 bump commit cb52ee6），本地已 fetch 对齐。\n- README 下载直链与「现状」已更新为 v0.1.1，收尾 commit 已推送。\n"},{"file":"2026-08-17-v0.1.4追加优化-plugincenter与圆角与伪3D.md","date":"2026-08-17","slug":"v0.1.4追加优化-plugincenter与圆角与伪3D","title":"v0.1.4 追加优化：plugin-center 预制 + logo 圆角 + 伪 3D 载入动画","statusRaw":"✅ 已完成（打包成功，待用户验收效果）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-17","dateNote":null,"tags":["@max-null/dsh-plugin-center","dsh-plugin-center","dsh-runtime","#1"],"summary":"用户要求三项优化，并入尚未发布的 v0.1.4（Release/tag 已按用户要求删除，处于未发布状态）。","bytes":4704,"lines":85,"body":"# v0.1.4 追加优化：plugin-center 预制 + logo 圆角 + 伪 3D 载入动画\n\n日期：2026-08-17\n状态：✅ 已完成（打包成功，待用户验收效果）\n\n## 背景\n\n用户要求三项优化，并入尚未发布的 v0.1.4（Release/tag 已按用户要求删除，处于未发布状态）。\n\n## 1. dsh-plugin-center 作为预制插件\n\n- 包：`@max-null/dsh-plugin-center@0.1.0`（npm 已发布，本地 checkout 在\n  `H:\\MaxNull\\WorkStation\\dsh-plugin-center`）。\n- 改动：`shell/profile-template/package.json` 的 dependencies + dsh.profile.bundles\n  各加一行。\n- 连带：dsh-runtime 归档需重建（归档内嵌 profile-template 复制品），\n  重跑 prepare-runtime + 手动补 .runtime-version/tar（沿用 2026-08-17 经验）。\n\n## 2. logo 圆角\n\n实测现状（System.Drawing 像素分析）：\n- `shell/assets/icon.png` 512×512：四角 A=64~255 深色不透明 → **方角**，需圆角透明。\n- `assets/logo.png` 256×256：四角纯白不透明 → **白色方角**，需圆角透明。\n- `shell/assets/tray.png` 32×32：托盘图标保持现状（圆角在托盘显示怪异）。\n\n做法：\n- PowerShell System.Drawing：圆角矩形 GraphicsPath 裁剪重绘，四角透明。\n  - icon.png 圆角半径 100px（约 20%）；logo.png 半径 48px。\n- `shell/assets/icon.ico` 重建：**PNG-in-ICO** 封装（Vista+ 标准，ICONDIR 头 +\n  单条目 + 256×256 PNG 数据），避免 PNG→ICO 转换的 Defender 竞态（pitfalls #1）。\n- 打包后 exe 图标/快捷方式随 icon.ico 生效（signAndEditExecutable 注入）。\n\n## 3. 载入动画：fractal 伪 3D Si 原子移植\n\n- fractal 实现（LoadingScreen.vue）：Canvas 460×460 数学投影伪 3D——3 条轨道\n  （不同半径/主轴倾角/公转速度/电子数）、绕 Y 摇摆 + 绕 X 俯视 + 透视除法\n  （近大远小）、z 分层遮挡（后段电子→核→前段电子→轨道前段）、核=瞳孔\n  （虹膜渐变 + 瞳孔 sin/cos 环顾 + 高光固定 + 辉光呼吸）+ 底座辉光。\n- 移植：splash.html 内联纯 JS（去 Vue/TS 类型），替换现有平面 SVG + CSS\n  halo 动画；canvas 460 物理 / 180px CSS；颜色沿用 fractal sky 色系\n  （#7dd3fc/#0ea5e9/#075985，与 SSiD 主题 #4FC3F7 协调）。\n- 背景说明：用户 2026-08-09 在 fractal 里建议过「CSS 平面圆 3D 压扁问题改\n  数学投影」——本次直接继承该结论。\n\n## 验证清单\n\n- [x] 归档重建成功（prepare-runtime 全绿，125.3MB，plugin-center 在列）\n- [x] icon.png/logo.png 四角 A=0，圆角平滑\n- [x] pack 成功（PNG 路径，exit 0），产物 215.4MB\n- [x] 安装后 exe/快捷方式图标为圆角（用户实测「nice」）\n- [x] splash 伪 3D 原子渲染（用户实测「nice」）\n- [ ] plugin-center 出现在预制插件清单（首轮实测缺失——同版本号归档变化\n      不触发重部署；已加依赖指纹修复，待复测）\n\n## 实测缺陷：版本对比盲区（plugin-center 缺失）\n\n- 现象：追加 plugin-center 后版本号不变（0.1.4），老 profile 的\n  `.runtime-version` 与新归档相同 → ensureProfile 判定 skipped →\n  新插件不落地，关于页无 plugin-center。\n- 修复（caca1d4）：`.runtime-version` 格式改为\n  `\u003cssid>-\u003cdsh>-\u003c依赖清单md5前8位>`，prepare-runtime 生成时计算\n  profile package.json 的 dependencies 指纹。插件增删/版本漂移都会\n  改变指纹 → 触发原子重部署。\n- 教训：版本标记必须覆盖「内容」而不只是「版本号」——同版本号下\n  归档内容变化是常态（追加预制插件）。\n\n## ICO 打包坑（实测记录，补充 pitfalls）\n\n1. **手写 PNG-in-ICO 不被接受**：app-builder-bin 的 icon 转换工具不支持\n   PNG-in-ICO 输入 → 转换静默失败 → `.icon-ico/` 缓存目录不生成 →\n   getIconPath 回退默认图标 → resedit 解析空/异常 buffer 报\n   「Offset is outside the bounds of the DataView」。\n2. **手写 BMP-in-ICO（DIB 256×512 双高）同样不被接受**：转换工具仍拒绝\n   （缓存目录不生成），报错同上。\n3. **正解：win.icon 用 PNG**（electron-builder 原生 PNG→ICO 转换，历史\n   路径一直可用；转换产物经 resedit 注入 exe）。Defender 锁竞态\n   （pitfalls #1）为概率事件，重试可过。\n4. **`.icon-ico/` 是转换缓存**：换图标源时旧缓存可能残留旧产物，排查时\n   先删 `dist-electron/.icon-ico`。\n\n## 决策备查\n\n- 版本仍为 0.1.4（尚未发布，优化并入同版）；发布动作等用户确认。\n- 圆角脚本/ICO 封装为一次性资产处理，成果即文件本身；脚本不落库（一次性工具）。\n"},{"file":"2026-08-16-分形DSH迁移-重评估映射表.md","date":"2026-08-16","slug":"分形DSH迁移-重评估映射表","title":"决策草案：分形 → DSH 迁移重评估与映射表","statusRaw":"已决策","statusKind":"已决策","owner":"MaxNull","purpose":null,"dateInBody":"2026-08-16","dateNote":null,"tags":["dsh-memory","dsh-chinese-thinking","dsh-skin","dsh-web-ui","dsh-web-app","dsh-session"],"summary":"押注 DSH。 fractal 的差异化功能以插件形式迁移到 DSH，采用「DSH 官方 GUI + 桌面壳 + 插件」形态，作为分形 2.0 的基座。","bytes":9363,"lines":151,"body":"# 决策草案：分形 → DSH 迁移重评估与映射表\n\n> 日期：2026-08-16\n> 状态：已决策\n> 决策人：MaxNull\n> 触发：重新审视 `2026-08-14-基座选择-维持OpenCode-DSH暂不切换.md` 的「重评估条件」\n> 关联：`docs/设计/分形-设计方案.md`、`docs/设计/实现/00a-serve能力-产品功能映射.md`\n\n---\n\n## 〇、决策（2026-08-16）\n\n**押注 DSH。** fractal 的差异化功能以插件形式迁移到 DSH，采用「DSH 官方 GUI + 桌面壳 + 插件」形态，作为分形 2.0 的基座。\n\n### 决策理由\n\n1. **自主可控**：DSH 为 DeepSeek 生态（国产），与 fractal「仅 DeepSeek 唯一 Provider」的定位天然一致。\n2. **技术适配**：DSH「一切皆插件」的基座，与 fractal「先插件、后 GUI」的演进路线同构，差异化功能可逐个落地。\n3. **已验证**：`dsh-memory`（记忆）、`dsh-chinese-thinking`（语言）已跑通「独立插件 + npm + topic + PR」全链路；记忆引擎迁移路径已实测无空白。\n\n### 护栏（防呆，非口号）\n\n1. fractal（OC 版）**继续维护、继续交付**，作为稳定兜底，不因押注 DSH 而停更。\n2. **渐进迁移**：按映射表「三分类」逐项搬，不一次性 all-in。\n3. **退出条件**：若 DSH 长期无 tagged release 导致反复重写、或关键能力缺失且无法用插件补齐，回到 OC 基座，fractal 壳保留（EngineAdapter 边界不变）。\n\n---\n\n## 一、核心认知转变：从「切引擎」到「换基座形态」\n\n08-14 决策否决的是「**切引擎**」——fractal 壳保留、把 OC serve 换成 DSH 引擎适配器。这条路要求 DSH 的 ACP/SDK 足够富，当时确实不成立（automation-only，无流式/会话管理/审批交互）。\n\n今天重新审视，正确的思路是「**换基座形态**」：\n\n```\n旧思路：fractal 壳(Electron GUI) + DSH 引擎适配器   ← 要求 DSH 暴露富接口给 fractal 壳消费\n新思路：DSH 官方 Web GUI + 桌面壳(exe) + 插件        ← fractal 的差异化功能做成插件，进 DSH\n```\n\n关键区别：**DSH 不是「引擎」（像 OC serve 那样被消费），DSH 是「自带完整富 GUI 的乐高基座」。** 所以不是「把 DSH 塞进 fractal 壳」，而是「把 fractal 的功能做成插件塞进 DSH」。\n\n佐证：`dsh-skin`（换皮肤，设置页配置）验证了 GUI 外观可插件化；`dsh-web-ui`（2620★，task board / git graph / 远程 UI / 皮肤中心）验证了连面板级 UI 都能插件化。\n\n## 二、08-14 决策「重评估条件」逐条对照（据实，2026-08-16）\n\n| 08-14 重评估条件 | 今日现状 | 是否满足 |\n|---|---|---|\n| DSH 提供交互式对外接口（流式 + 审批交互 + 会话管理） | 已提供——不是 ACP/SDK，而是**官方 Web GUI 本体**（dsh-web-app bundle）及其 host 接口 | ✅ 以「官方 GUI」形态满足 |\n| DSH 发布首个 tagged release、API 稳定 | 仍无 tagged release（截至 08-16），pre-release 段仍在 | ❌ 未满足 |\n| OC 出现不可接受阻塞 | 无 | ❌ |\n\n结论：**「官方 GUI」这条路让第一个条件实质满足**（无需等 ACP/SDK 变富，直接用官方 GUI + 插件）。但「无 tagged release」仍是硬风险，需单独评估。\n\n## 三、迁移映射表（核心）\n\n策略标注：✅ 直接用（DSH 原生）｜🔌 写插件｜🎨 写插件含 UI 面板｜⚠️ 待核实｜❌ 暂不做\n\n### 3.1 会话域\n\n| 分形功能 | DSH 对应 | 策略 | 备注 |\n|---|---|---|---|\n| 新建/列表/删除/重命名 | `dsh-session`（持久化 + projection） | ✅ | |\n| 分叉（fork） | subagent / session fork | ✅ | 形态略不同（DSH 是子代理） |\n| 中断生成（abort） | agent-loop cancel / interrupt | ✅ | |\n| 历史消息全量拉取 | session log（event-sourced） | ✅ | |\n| 撤销/重做（revert） | ❌ 无对应 | ⚠️ | 08-14 已标「serve 有、产品未接」，DSH 需评估 |\n| 会话摘要/标题 | `session-title` | ✅ | |\n| 分享 | `session-log-export` | ✅ | |\n| 运行中切模型 | `agent-default-model` + per-request | ✅ | |\n| 上下文压缩 | `compaction`（basic + shield） | ✅ | 已用 compaction-shield 验证 |\n| 会话树/子会话 | subagent（树） | ✅ | |\n\n### 3.2 消息/交互域\n\n| 分形功能 | DSH 对应 | 策略 | 备注 |\n|---|---|---|---|\n| 流式渲染（打字机） | `llm-streaming` + `ui-conversation` | ✅ | |\n| part 增量（text/thinking/tool） | `ReasoningBlock`/`TextBlock`/`ToolCallBlock` | ✅ | |\n| 回合结束（耗时/token） | `session-stats` / `token-meter` | ✅ | |\n| 消息时间线 | `ui-trajectory`（轨迹视图） | ✅ | 已核实：turn/step/tool/subtool 分层 + Overview 时间线 + inspector，能力超 fractal「阶段时间线」 |\n| 提问弹窗（question 工具） | `ask_user_question` | ✅ | 本次会话已实战 |\n| Todo 面板 | `todo_write` | ✅ | |\n| 斜杠命令 | `commands` | ✅ | |\n\n### 3.3 工具域\n\n| 分形功能 | DSH 对应 | 策略 | 备注 |\n|---|---|---|---|\n| 文件树/读取/写入 | `fs` capability + `fs-local` | ✅ | |\n| git 状态/diff/提交 | `shell`/`bash` 或插件 | ✅ | DSH 走 shell 工具，非 serve vcs |\n| 全局搜索 | `tool-fs-search` | ✅ | |\n| 工作区/项目管理 | `workspace` | ✅ | |\n\n### 3.4 控制域\n\n| 分形功能 | DSH 对应 | 策略 | 备注 |\n|---|---|---|---|\n| 权限审批弹窗（once/always/reject） | `interaction`/`approval` + `permission` | ✅ | 本次会话已实战 |\n| 权限规则管理 | `permission-presets` | ✅ | |\n| API Key 认证 | `credentials`（env/.env provider） | ✅ | |\n\n### 3.5 配置域\n\n| 分形功能 | DSH 对应 | 策略 | 备注 |\n|---|---|---|---|\n| 模型清单 | `llm` catalog + `ui-settings-models` | ✅ | |\n| 配置读写（agent 可自检自改） | `settings` 服务 + file provider + fs 工具 | ✅ | DSH 原生支持「agent 读改配置」 |\n| agent/技能/命令清单 | `skill` catalog + `plugin-inventory` | ✅ | |\n| MCP 管理 | `mcp-client` | ✅ | |\n\n### 3.6 分形差异化功能（核心价值，需插件）\n\n| 分形功能 | DSH 现状 | 策略 | 备注 |\n|---|---|---|---|\n| 记忆面板（三层记忆 + BM25 + 确认闸门） | `dsh-memory` 已实现工具 + 人工闸门 | 🎨 | 已发布 v0.2.0；缺侧栏 UI 面板，需补 |\n| 状态面板（触发线监控/断言计数/编辑审查队列） | ❌ 无对应 | 🎨 | Guardian 状态引擎，需按 DSH 事件重做 |\n| 计划面板（plans/ + checkbox + 状态） | `plan-mode` + `ui-plan` | 🔌 | 已核实：DSH 是「计划模式」非「计划文件面板」，fractal 计划面板需插件 |\n| 管理面板（Agent/技能/MCP/插件/权限 6 tab） | `ui-settings-*`（插件清单/模型/权限） | ✅ | 大部分原生，需对齐 tab 划分 |\n| 回答流程时间线（阶段徽章） | `ui-trajectory` | ✅ | 已核实：DSH trajectory 覆盖且更强，fractal 阶段徽章是简化版 |\n| oc-plus 四 agent（双星/工匠/参谋/军师） | `agent-presets` + `subagent` | 🔌 | 用 preset/subagent 重写四 agent 编排 |\n| 配置体系（类 VSCode settings.json） | `settings` + `settings-file` | ✅ | DSH 原生「配置即文件」 |\n| 预置体系（开箱即用） | `bundle` profile + `preset` | ✅ | 已有 bundle/patch 机制 |\n\n## 四、真正要做的插件清单（增量工作）\n\n按「能无缝搬 → 要补卡扣 → 别搬」三分类：\n\n1. **已完成**：`dsh-memory`（记忆工具 + 闸门）、`dsh-chinese-thinking`（中文语言）。\n2. **需补 UI**：`dsh-memory` 的记忆侧栏面板（浏览三层记忆 + BM25 搜索 + 确认操作）。\n3. **需重做**：Guardian 状态引擎（触发线监控 → 映射到 DSH 的 `session/event` + 自建状态存储 + UI 面板）。\n4. **已核实**：ui-trajectory 覆盖「回答时间线」且更强（直接用）；ui-plan 是「计划模式」非「计划文件面板」（fractal 计划面板需插件）。\n5. **暂不做**：撤销/重做（DSH 无 revert，08-14 本就标「产品未接」）。\n\n## 五、关键风险与待核实项\n\n1. **DSH 无 tagged release**：pre-release 段仍在，`SESSION_FORMAT_VERSION=0` 无兼容承诺。押注前需接受「随 DSH 迭代反复调整」的成本。这是唯一未满足的硬条件。\n2. **套壳无需自研**：社区已有现成桌面壳（anywhere-labs/deepseek-harness-desktop 5402★、bruc3van Electron「官方 UI 本体」、hairyf Tauri 等），fractal 应「选壳」而非「造壳」。\n3. **已核实**：ui-trajectory 对应「回答时间线」且更强；ui-plan 是「计划模式」非「计划文件面板」。剩余 ⚠️ 仅「撤销/重做」等少数项。\n4. **记忆 UI 面板**：dsh-memory 目前只有工具、无侧栏面板，这是 fractal 记忆体验搬到 DSH 的最大缺口。\n\n## 六、下一步建议\n\n1. 实测 DSH Web GUI 逐项核对映射表 ⚠️ 项（trajectory / plan / 设置页形态）。\n2. 选定一个桌面壳（anywhere-labs 或 bruc3van）跑通「DSH GUI + 壳 + 你的插件」最小闭环。\n3. 补 `dsh-memory` 的记忆 UI 面板（第一个增量插件）。\n4. 按本表「三分类」排期，逐步把 fractal 差异化能力以插件形式搬入。\n\n---\n\n> 已决策：押注 DSH（见「〇、决策」）。执行按映射表三分类渐进迁移，fractal OC 版作为兜底保留。\n"},{"file":"2026-08-16-评测脚本子代理无模型-诊断修复.md","date":"2026-08-16","slug":"评测脚本子代理无模型-诊断修复","title":"评测脚本子代理无模型：诊断与修复","statusRaw":"已修复（eval-roles.ts、diag-m3-roles.ts），待下次评测运行验证","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-16","dateNote":null,"tags":[],"summary":"eval 会话（eval-lingxi-1786874923665）中，subagentcounselor、subagentfork、subagent 四次委派全部返回 Error: subagent run failed。4 个子会话 （fd9f78bc、9ca654a3、63640661、6f2f080b）落盘的 turn/end 事件记录同一错误： 主 agent（双星）本身运行正常，只有子","bytes":2362,"lines":60,"body":"# 评测脚本子代理无模型：诊断与修复\n\n- 日期：2026-08-16\n- 触发场景：`shell/_eval-roles.ts`（M3 角色端到端评测）驱动\"双星\"委派灵犀时，4 次子代理委派全部失败\n- 状态：已修复（`_eval-roles.ts`、`_diag-m3-roles.ts`），待下次评测运行验证\n\n## 现象\n\neval 会话（`eval-lingxi-1786874923665`）中，`subagent_counselor`、`subagent_fork`、`subagent`\n四次委派全部返回 `Error: subagent run failed`。4 个子会话\n（`fd9f78bc`、`9ca654a3`、`63640661`、`6f2f080b`）落盘的 `turn/end` 事件记录同一错误：\n\n```\nagent \"\u003cuuid>\" has no provider/model: set AgentOptions.provider and AgentOptions.model\nor supply both via the agent/request waterfall\n```\n\n主 agent（双星）本身运行正常，只有子代理失败。\n\n## 根因\n\nDSH 子代理的模型继承链是\n`resolveChildAgentOptions`（`packages/subagent/subagent/src/child-agent.ts`）：\n只继承 `parent.options.provider` / `parent.options.model`——即**显式传入的\n`AgentOptions`**，不继承 `installModelSelection` 挂在 agent 平面 scope 上的\nwaterfall 注入。\n\n官方 headless runner（`packages/bundle/headless/src/index.ts` 第 111-119 行）创建\nagent 时**两者都做**：\n\n```ts\nagentOptions: { provider: selection.provider, model: selection.model },\nsetup: (agentCtx) => {\n  installModelSelection(agentCtx, { current: selection, assembled: undefined })\n},\n```\n\n而我们的评测脚本只做了后者（只装 model selection，未传 agentOptions），于是主 agent\n靠 waterfall 能跑，子代理创建时 `parent.options` 里没有 provider/model，报\n\"has no provider/model\"。\n\n结论：不是灵犀 persona 配置问题，不是 harness 子代理 bug，不是 API/凭证故障，\n是评测脚本创建主 agent 时缺了 `agentOptions`。\n\n## 修复\n\n`shell/_eval-roles.ts` 与 `shell/_diag-m3-roles.ts` 的 `ctx.agents.create` 调用补上：\n\n```ts\nagentOptions: { provider: selection.provider, model: selection.model },\n```\n\n与官方 headless runner 对齐。`boot-smoke.ts` 不创建 agent，无需改。\n\n## 验证路径\n\n重跑 `node --import tsx/esm _eval-roles.ts`，检查 `_eval-roles.log`：\n子会话段落应出现「灵犀: …」输出与「灵犀模型路由: deepseek-official/deepseek-v4-pro」，\n主会话段落应出现「assistant: …」转述结论。\n"},{"file":"2026-08-16-社区插件评估-better-sidebar与OpenViking.md","date":"2026-08-16","slug":"社区插件评估-better-sidebar与OpenViking","title":"社区插件评估：DSH-better-sidebar 与 OpenViking","statusRaw":"评估完成，方向待用户拍板","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-16","dateNote":null,"tags":["@max-null/dsh-ssid-panels","dsh-better-sidebar","dsh-ssid-panels","dsh-memory","dsh-guardian","dsh-habit","dsh-plugin"],"summary":"服务化的侧边栏框架：ctx.betterSidebar.registerTab / registerFileViewer 开放给所有插件，内置 7 tab + 6 viewer 与三方插件完全对等。内置能力： - 文件工作台：懒加载目录树 + CodeMirror 编辑 + md/HTML/PDF/Office 预览 - 内嵌浏览器（沙箱 iframe）、真实终端（xterm+node-pty）、","bytes":5567,"lines":104,"body":"# 社区插件评估：DSH-better-sidebar 与 OpenViking\n\n> 日期：2026-08-16\n> 触发：用户分享两个社区仓库\n> 状态：评估完成，方向待用户拍板\n\n## 一、DSH-better-sidebar（omdsh-dev，1.6k★，MIT）\n\n### 是什么\n\n**服务化的侧边栏框架**：`ctx.betterSidebar.registerTab` / `registerFileViewer`\n开放给所有插件，内置 7 tab + 6 viewer 与三方插件完全对等。内置能力：\n\n- 文件工作台：懒加载目录树 + CodeMirror 编辑 + md/HTML/PDF/Office 预览\n- 内嵌浏览器（沙箱 iframe）、真实终端（xterm+node-pty）、Git 面板\n  （diff/暂存/提交/还原）、后台任务页（subagent 拓扑）\n- 双工作台（右侧栏+底部面板，拖拽分栏）、会话隔离持久化、\n  按需加载（核心 325KB）、声明式设置、zh/en 多语言\n\n### 关键事实（推翻本仓库此前决策）\n\n1. **第三方 DSH client 插件是可行的**——此前 SSiD 方案文档否决了 client\n   插件路线（\"tsdown clientBundle + modules 静态模块表属 DSH 仓库内设施\"），\n   **结论错误**。better-sidebar 是独立仓库的 client 插件，依赖\n   `@deepseek-ai/*` npm 已发布版本（^0.1.0-rc.6）构建出自己的\n   `lib/client.js`。DSH npm rc 已发布这一事实当时没查到。\n2. 它在 **web profile** 挂载（`dsh plugin --profile web add`），渲染在官方\n   web UI 窗口内——SSiD 壳加载的正是官方 web UI，**同样可用**。\n\n### 与 SSiD 侧栏的重叠与冲突\n\n| 能力 | SSiD 自研侧栏（BrowserView+IPC） | better-sidebar |\n|---|---|---|\n| 文件树/预览 | 本轮刚做（树+懒加载+6 格式预览） | 内置且更成熟（+CodeMirror 编辑、软链接处理） |\n| 终端/Git/浏览器 | 无 | 内置 |\n| 记忆/状态/习惯/余额面板 | SSiD 独有 | 无，但 registerTab 可注册 |\n| 品牌壳（托盘/启动页/logo） | SSiD 独有 | 覆盖不了（壳层） |\n\n**空间冲突**：better-sidebar 渲染在官方 UI 窗口内右侧；SSiD 自研侧栏是\n窗口最右的 BrowserView——两者并存会挤占窗口（两个侧栏）。\n\n### 方向建议（倾向切换，待用户拍板）\n\n按 SSiD 原则「DSH+插件解决得了的事不重复造」：\n\n1. **放弃自研侧栏功能层**（文件树/预览——正好是今天刚做的，沉没成本最小）\n2. **安装 better-sidebar** 进 ssid profile（dependencies + patch 挂载 + pnpm install）\n3. **SSiD 独有面板迁移**为 better-sidebar 的 registerTab 插件\n   （@max-null/dsh-ssid-panels：记忆/状态/习惯/余额四 tab），\n   复用 dsh-memory/dsh-guardian/dsh-habit 的 host 服务\n4. **品牌壳保留**（托盘/启动页/logo/标题/打包）——这是插件覆盖不了的层\n\n风险与前置验证：\n- better-sidebar 装进 ssid profile 后与 SSiD 自研侧栏的冲突处理（先停自研侧栏）\n- 它的 host 半（/sidebar/* 路由、终端 WebSocket）在 electron 单进程下的表现需实测\n- @max-null 面板插件的 client 构建链（better-sidebar 同款，需研读其 tsdown 配置）\n\n## 二、OpenViking（volcengine，28.6k★，AGPLv3，Python）\n\n### 是什么\n\n自进化上下文数据库：`viking://` 虚拟文件系统统一记忆/资源/技能，\nL0（摘要~100t）/L1（概览~2k）/L2（详情）三层按需加载省 token；\n目录递归向量检索 + 可观测轨迹；**会话提交后异步提取偏好与经验\n（\"Sessions become memory\"）**。LoCoMo 基准：用户记忆准确率\n24–57% → 80–83%。有 dsh-plugin topic（DSH 集成）。pip 安装跑本地 server。\n\n### 与 SSiD 自学习闭环的关系\n\n| 维度 | SSiD（dsh-memory + dsh-habit） | OpenViking |\n|---|---|---|\n| 检索 | BM25 + 明文（**拒绝向量，用户拍板**） | 向量 + 目录递归 |\n| 记忆形态 | 扁平卡片，两级人工闸门 | viking:// 树 + 分层加载 |\n| 沉淀方式 | 纠错信号→flash 判断→人工确认 | 会话自动提取（无人工闸门） |\n| 知识/技能层 | 无 | 资源/技能 RAG |\n| 部署 | DSH 插件（无外部进程） | 独立 Python server |\n\n### 方向建议（暂不替换，跟踪观察）\n\n- **短期不替换 dsh-memory/dsh-habit**：人工闸门与 BM25 是既定决策\n  （\"模型不自我提升\"），刚发布且验证通过\n- **跟踪点**：OpenViking 的 DSH 插件集成形态（是 MCP/工具还是 DSH 插件）、\n  其\"会话→记忆自动提取\"与 dsh-habit 纠错闭环的互补性\n- **候选场景**：SSiD 缺\"知识库/RAG\"层时，OpenViking 的资源层是现成答案\n  （自托管 AGPL 可接受）\n\n## 三、行动建议（待用户拍板）\n\n1. 侧栏方向：切换 better-sidebar + SSiD 面板插件化（本仓库最大收益项）\n2. OpenViking：登记观察，不立即集成\n\n## 四、执行结果（2026-08-17，用户拍板后完成）\n\n- better-sidebar@0.12.3 已装进 ssid profile（bundle 层），官方 UI 内\n  右侧栏 + 底部面板工作正常\n- 自研 BrowserView 侧栏已删除（side-rail/、preload.cjs、旧 IPC 全清）\n- `@max-null/dsh-ssid-panels`（新仓库，本地 link）：host 半 `/ssid/api/*`\n  10 方法（fence 同款）+ client 半 4 tab（记忆/状态/习惯/余额），\n  构建链为 better-sidebar 同款 tsdown + ModuleLoader 协议\n- 自研壳保留：无边框自绘标题栏、托盘、启动页、portable 打包\n- 过程中的关键坑：SSiD 自研侧栏吃掉 320px 使官方 UI 视口 \u003c768px，\n  触发 better-sidebar 移动端全屏抽屉（\"右侧栏按钮无效\"假象）——\n  两个侧栏无法并存，进一步印证切换决策\n"},{"file":"2026-08-16-首轮工具面对照评测.md","date":"2026-08-16","slug":"首轮工具面对照评测","title":"首轮工具面对照评测结果（2026-08-16）","statusRaw":"完成（M3 第一个数据点）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["ssid-double-star","dsh-memory","#51"],"summary":"在临时工作目录创建 TypeScript 工具库：utils.ts（removeDuplicates，Set 去重保序）+ utils.test.ts（node:test 两个断言）+ 跑测试验证 + 报告。","bytes":2300,"lines":35,"body":"# 首轮工具面对照评测结果（2026-08-16）\n\n> 状态：完成（M3 第一个数据点）\n> 方法：同一跨文件任务（utils.ts 去重 + node:test 测试），standard vs ssid-double-star 两个 preset，真实模型（deepseek-v4-pro），各跑一轮\n\n## 任务\n\n在临时工作目录创建 TypeScript 工具库：`utils.ts`（removeDuplicates，Set 去重保序）+ `utils.test.ts`（node:test 两个断言）+ 跑测试验证 + 报告。\n\n## 结果\n\n| 观察点 | standard（官方） | ssid-double-star（SSiD） |\n|---|---|---|\n| 首轮开头 | 直接干活（\"工作目录是空目录…先写决策文档\"） | **\"### 思考结论\\n\\n任务清晰：…\"**（纪律锚定生效） |\n| 工具序列 | pwsh, write×3, read×2, pwsh | pwsh, write(决策文档), read, write×3, pwsh |\n| token | in=11606 / out=3214 | in=9823 / out=6351 |\n| 任务完成 | ✅ | ✅ |\n| Let me 绕圈 | 无 | 无 |\n\n## 结论\n\n1. **首轮工具面敏感现象在当前权重下未复现**——两个 preset 都直奔主题，无\"Let me\"绕圈轨迹。与 issue #51 独立复测结论一致（锚定效应已过期/不稳定）。**M3 角色收敛不需担心首轮工具面问题；fork 的 first-turn-anchor 原型暂不搬**。\n\n2. **persona 纪律显著影响首轮行为**——ssid 的\"思考结论\"纪律产生结构化首轮（先对齐再动手），standard 没有。**保留双星 persona 纪律是 M3 的正确决策**，这是直接证据。\n\n3. **记忆 recall 注入在工作**——两个 preset 都自发遵守\"先落盘决策记录再写代码\"的用户习惯（dsh-memory auto 层注入）。\n\n4. **SSiD 输出更啰嗦**（out=6351 vs 3214）——思考结论 + 决策记录落盘 + 详细报告是纪律的代价。可接受（质量优先），后续若成本敏感可精简报告纪律。\n\n## 附：评测方法（可复用）\n\n- 驱动方式：`ctx.agents.create` + `installModelSelection`（web 环境必须，缺失会静默空跑）+ `agent.followup` + `whenIdle`（官方 headless-runner 模式）\n- 关键坑（另一个会话卡住的同一问题）：`agents.create` 不传 agentOptions 且不装 model selection 时，agent/request 无路由，驱动静默空跑（turns 计数但零模型调用）\n- 输出用 fs 日志（进程缓冲在异常退出时丢 stdout）\n"},{"file":"2026-08-16-四阶段编排真实任务评测.md","date":"2026-08-16","slug":"四阶段编排真实任务评测","title":"四阶段编排真实任务评测（2026-08-16）","statusRaw":"完成（M3 核心验证）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["ssid-double-star","dsh-habit"],"summary":"给计算器库添加百分比能力：percent(value, total)（calc.ts）+ formatPercent(value)（format.ts）+ 测试，要求按四阶段流程完整执行、规格落盘、巧匠实现、明镜审查。","bytes":2622,"lines":46,"body":"# 四阶段编排真实任务评测（2026-08-16）\n\n> 状态：完成（M3 核心验证）\n> 方法：预置两文件 TS 项目 + 跨文件功能任务（百分比能力），驱动双星（ssid-double-star）真实模型完整走四阶段，耗时约 5.5 分钟\n\n## 任务\n\n给计算器库添加百分比能力：`percent(value, total)`（calc.ts）+ `formatPercent(value)`（format.ts）+ 测试，要求按四阶段流程完整执行、规格落盘、巧匠实现、明镜审查。\n\n## 结果：四阶段全部完成\n\n### 阶段 1 研究 ✅\n通用 subagent 探索 ×2（现有代码结构、测试模式）。\n\n### 阶段 2 综合 ✅（质量极高）\n规格落盘 `docs/设计/百分比能力-设计规格.md`，包含：\n- 5 个关键决策记录（每个含理由 + 备选方案）：除零返回 0、输入语义为百分数值、toFixed 而非 toLocaleString、测试文件拆分、保持代码风格\n- 16 个测试用例的期望值表（含边界：负数/浮点/组合）\n- **实测发现的坑**：Windows 下 `node --test tests/` 报 MODULE_NOT_FOUND，必须 glob\n- 给巧匠的 4 条实现约束（不改现有行为、保持风格、不引入依赖）\n\n### 阶段 3 实现 ✅\n巧匠（subagent_artisan）调用 ×2（continuable 续接），percent + formatPercent 正确实现，含 total===0 边界。\n\n### 阶段 4 验证 ✅\n明镜（subagent_strategist）审查 ×3，**15 个测试全过**（比要求更多：额外加 format.test.ts、负数、舍入、组合测试）。\n\n### 子代理调用序列\n```\nsubagent_artisan → subagent → subagent_strategist → subagent_artisan\n→ subagent → subagent_strategist → subagent_strategist\n```\n\n## 结论\n\n1. **四阶段编排在 DSH 上完整工作**：研究/综合/实现/验证全走通，角色按名委派（巧匠/明镜）、continuable 续接生效、审查独立执行。\n2. **规格质量超出预期**：决策记录 + 测试规格表 + 实现约束，是「四阶段纪律 + 决策落盘习惯（memory recall 注入）」的直接产物。\n3. **灵犀未参与本次任务**（方向明确无需右脑验证）——符合\"何时调顾问\"纪律（仅四阶段和重大决策才调）。\n4. **评测脚本自身有两个 bug 不影响结论**：规格文件名猜测错误（实际是\"百分比能力-设计规格.md\"）、exit code 1 是 shutdown 时序问题。文件产物与测试结果均为实测。\n\n## 附：M3 剩余\n\n- 明镜/巧匠/明瞳的独立端到端（灵犀已验、四阶段已验巧匠+明镜）\n- 制图师 kimi k3（pi-ai 配置验证）\n- dsh-habit 端到端（插件已写好，待装进 profile 验证）\n"},{"file":"2026-08-16-压缩阈值提前-0.6实测.md","date":"2026-08-16","slug":"压缩阈值提前-0.6实测","title":"SSiD 压缩阈值 0.8→0.6：决策与实测记录（2026-08-16）","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["ssid-double-star","dsh-memory"],"summary":"DSH 官方 compaction-basic 默认 thresholdRatio: 0.8——上下文到窗口 80% 才触发压缩。 实测确认此时超长上下文已导致模型注意力涣散。SSiD 的 ssid-double-star preset 改为 thresholdRatio: 0.6（60% 触发），retainRatio 保持官方默认 0.16（尾部原文保留比例）。 同时补齐 preset 此前完","bytes":2430,"lines":64,"body":"# SSiD 压缩阈值 0.8→0.6：决策与实测记录（2026-08-16）\n\n> 状态：已决策（推断 · 2026-09-12）\n\n## 决策\n\nDSH 官方 compaction-basic 默认 `thresholdRatio: 0.8`——上下文到窗口 80% 才触发压缩。\n实测确认此时超长上下文已导致模型注意力涣散。SSiD 的 ssid-double-star preset 改为\n**`thresholdRatio: 0.6`**（60% 触发），`retainRatio` 保持官方默认 0.16（尾部原文保留比例）。\n\n同时补齐 preset 此前完全缺失的 compaction group——web bundle 禁用了 host 层的\ncompaction-basic（`disabled: true`），压缩由 preset 决定挂不挂，SSiD 的 preset\n没挂等于没有自动压缩。group 内容对齐 official standard：compaction-basic +\ncommand-compact + tool-result-pruner。\n\n## 实测结果（三层验证，2026-08-16）\n\n### 1. 配置层（无 key）\n\n挂载 preset 后读 per-agent compaction 服务：\n\n| preset | thresholdRatio |\n|---|---|\n| ssid-double-star | **0.6** ✅ |\n| standard（对照） | 0.8 |\n\n### 2. 行为层（mock adapter，无 key）\n\ncontextWindow=1000 的 mock adapter，灌到 76% 水位（756t，介于两个阈值之间）：\n\n| preset | 结果 |\n|---|---|\n| ssid-double-star (0.6) | 进入压缩流程（阈值判定通过）✅ |\n| standard (0.8) | null（不触发） |\n\n### 3. 真实端到端（真实 DeepSeek V4 Pro + 真实 API）\n\n注册 contextWindow=3000 的真实 adapter，灌真实信息文本：\n\n```\nbefore: 2231t (74.4%)\n→ 0.6 阈值（1800t）判定通过 → 真实 LLM 摘要\n→ COMPACTED: shadowed 13 nodes, ~1598t\n→ after: 1069t (35.6%)\n```\n\n摘要质量合格：三组信息文本的关键事实全部保留（SSiD 定位、三层架构、\ndsh-memory 插件、阈值决策本身）。\n\n## 顺带修复\n\nSSiD preset 挂载此前会失败：DSH 升级后 schema 新增必填字段\n（`tool-fs-search.sampleOverCapGlobResults`、`tool-todo.allowParallelInProgress`），\n已对齐 standard 补上。\n\n## 后续注意事项\n\n- preset 文件有两个副本：仓库 `presets/ssid-double-star/`（版本管理）与\n  `~/.dsh/.agent-presets/ssid-double-star/`（DSH 实际读取）。改动需同步 + 重启。\n- DSH 升级后跑一遍配置层验证（挂载 preset + 读 compaction 服务），schema 变化\n  会让 preset 静默断掉。\n- 0.6 是首轮设定值，实测若仍感太晚可下调（下限受 retainRatio 约束：\n  thresholdRatio 必须 > retainRatio）。\n"},{"file":"2026-08-16-桌面壳选型-评估结论.md","date":"2026-08-16","slug":"桌面壳选型-评估结论","title":"决策：桌面壳选型评估结论","statusRaw":"已决策（首选 + 备选已定）","statusKind":"已决策","owner":"MaxNull","purpose":null,"dateInBody":"2026-08-16","dateNote":null,"tags":["dsh-desktop","dsh-memory","dsh-chinese-thinking"],"summary":"新项目（DSH 基座版）的壳必须满足： 1. 窗口内是 DSH 官方 Web UI 本体，非仿制/自绘前端； 2. 能打包独立安装包（bundled Node.js + dsh CLI，用户免装 Node）； 3. 能加载 DSH 插件 / 皮肤； 4. Windows 优先；加分项：托盘常驻、自动更新、配置隔离、进程治理、可二次开发。","bytes":3132,"lines":50,"body":"# 决策：桌面壳选型评估结论\n\n> 日期：2026-08-16\n> 状态：已决策（首选 + 备选已定）\n> 决策人：MaxNull\n> 关联：`2026-08-16-分形DSH迁移-重评估映射表.md`（本文为其「选壳」步骤的产出）\n> 数据来源：GitHub API + 仓库原文交叉核实（8 个指定候选 + 7 个补充壳）\n\n---\n\n## 一、硬约束\n\n新项目（DSH 基座版）的壳必须满足：\n\n1. 窗口内是 **DSH 官方 Web UI 本体**，非仿制/自绘前端；\n2. 能打包**独立安装包**（bundled Node.js + dsh CLI，用户免装 Node）；\n3. 能加载 **DSH 插件 / 皮肤**；\n4. Windows 优先；加分项：托盘常驻、自动更新、配置隔离、进程治理、可二次开发。\n\n## 二、结论\n\n| 角色 | 项目 | 依据 |\n|---|---|---|\n| **首选** | [anywhere-labs/deepseek-harness-desktop](https://github.com/anywhere-labs/deepseek-harness-desktop) | Electron / MIT / 5443★ / 当天活跃；官方 UI 本体 + 内置 dsh；**唯一提供文档化桌面插件 API**（`desktopProfiles` + `desktopPnpm`），插件市场「即将推出」；macOS + Windows（无 Linux） |\n| **备选** | [bruc3van/dsh-desktop](https://github.com/bruc3van/dsh-desktop) | Electron / MIT / 31★；「官方 UI 本体」定位最纯粹；SHA-256 更新校验 + 进程治理 + 智能复用已有 dsh；macOS + Windows |\n| Windows 候补 | [ChisaAlter/Deepseek-Harness-Desktop](https://github.com/ChisaAlter/Deepseek-Harness-Desktop) | 84★；插件市场 + 主题 + 远程；Windows 特性强 |\n| Windows 候补 | [myYangyunfan/dsh_desktop](https://github.com/myYangyunfan/dsh_desktop) | 265★；功能最多但偏产品化 |\n\n**首选理由**：`anywhere-labs` 把「Electron 起 Host + loopback 加载官方 UI」这套架构做得最完整，是**架构参考 + 闭环验证**的最佳样本。注意：SSiD 不 fork 它换皮，而是参考其架构自研壳；它的 `desktopProfiles`/`desktopPnpm` 插件 API 亦作为「壳级插件」的参考。\n\n## 三、否决项（勿作壳基础）\n\n| 项目 | 原因 |\n|---|---|\n| `zouyuxuan122/Deepseek-Harness-EAC`（223★） | **无 LICENSE 文件**（README 谎称 MIT），皮肤混用 CC BY-NC-SA 4.0 禁止商用 → 一票否决 |\n| `xiincs/deepseek-harness-desktop` | 「内置 Node」描述与 README 矛盾（README 明示从 PATH 定位 node）→ 不满足「免装 Node」硬需求 |\n| `kelomina/deepseek-harness-wui` | 自绘前端，非官方 UI 本体 |\n| `ipfred/deepseek-harness-app`、`LisiChen0`、`JustGenius-s` | 无实质内容 / 近空壳 |\n\n## 四、风险\n\n1. **停更风险整体存在**：生态处 2026-08 爆发期，壳强耦合 dsh rc 迭代，任一壳都可能随 dsh 升级漂移。\n2. **首选壳无 Linux**：若分形 2.0 未来要 Linux，需另寻或自补。\n3. **插件市场未落地**：`anywhere-labs` 的插件市场标「即将推出」，现阶段以 DSH 原生插件为主。\n\n## 五、下一步\n\n1. 拉取 `anywhere-labs` 跑通「DSH 官方 GUI + 壳 + dsh-memory/dsh-chinese-thinking」最小闭环。\n2. 若首选壳不满足，回退 `bruc3van`（最纯粹的官方 UI 本体 + 安全加固）。\n"},{"file":"2026-08-16-dsh-habit-端到端验证与发布状态.md","date":"2026-08-16","slug":"dsh-habit-端到端验证与发布状态","title":"dsh-habit 端到端验证与发布状态","statusRaw":"已发布 @max-null/dsh-habit@0.1.0，bundle 已接入 SSiD profile，","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-16","dateNote":null,"tags":["@max-null/dsh-habit","dsh-habit","dsh-memory","dsh-guardian","dsh-plugin"],"summary":"在 SSiD 壳内直接 boot() DSH，完整走通自学习三段闭环： 1. 观察：注入 3 条纠错信号（turn 内 isCorrection 文本），turn/end 触发串行分析 2. 判断：flash（temperature 0 + 严格 JSON）生成候选： [high] 用户每次提交前要求先跑一遍测试再交付 (证据 3 条) 3. 沉淀：confirm 后候选转 confirmed，写","bytes":2608,"lines":51,"body":"# dsh-habit 端到端验证与发布状态\n\n- 日期：2026-08-16\n- 状态：已发布 `@max-null/dsh-habit@0.1.0`，bundle 已接入 SSiD profile，\n  npm 包版本端到端复跑通过\n- 验证脚本：`shell/_eval-habit.ts`\n- 相关设计：`docs/设计/2026-08-16-自学习闭环-设计.md`\n\n## 验证结果\n\n在 SSiD 壳内直接 `boot()` DSH，完整走通自学习三段闭环：\n\n1. **观察**：注入 3 条纠错信号（turn 内 `isCorrection` 文本），`turn/end` 触发串行分析\n2. **判断**：flash（temperature 0 + 严格 JSON）生成候选：\n   `[high] 用户每次提交前要求先跑一遍测试再交付 (证据 3 条)`\n3. **沉淀**：`confirm` 后候选转 `confirmed`，写入 dsh-memory 为\n   `[suggested]`，停在人工闸门（`memory_confirm` 后转 `auto`）\n\n## 发布与接入（2026-08-16 完成）\n\n- npm 发布：`@max-null/dsh-habit@0.1.0`（用户终端浏览器认证完成）\n- profile 接入（与 guardian/memory 同模式）：\n  - `~/.dsh/profiles/ssid/package.json`：`dependencies` +\n    `dsh.profile.bundles` 加 `@max-null/dsh-habit`\n  - profile 目录 `pnpm install` 装包；`pnpm peers check` 的 missing peer\n    警告与其余 3 个 @max-null 包相同，由 heal 的平面 symlink\n    （`~/.dsh/profiles/node_modules`）解析，属预期布局\n- TEMP `file://` 引用已清理；`cordis.patch.yml` 还原为空数组 `[]`\n  （DSH overlay 要求顶层必须是 YAML 数组，纯注释会报\n  `must be a top-level YAML array of loader patch entries`）\n- npm 包版本复跑通过，且**跨渠道持久化验证成功**：file:// 验证期 confirm\n  的候选在 npm 包复跑中直接显示 `[confirmed]`，未重复生成 pending——\n  去重与存储路径正确\n\n## 遗留阻塞（仅剩明瞳，需用户侧操作）\n\n1. ~~dsh-habit npm 发布~~ → 已发布并接入，闭环\n2. **明瞳（制图师）kimi-k3**：pi-ai 目录无 kimi-k3（仅 kimi-k2），且无\n   `MOONSHOT_API_KEY`。配置指南已写：`docs/决策/明瞳-kimi-k3-配置指南.md`。\n\n## 决策\n\n- 第三方插件接入统一走 profile `package.json`（dependencies + bundles）\n  + profile 目录 pnpm 安装；`PROFILE_BUNDLES` 常量只负责首次初始化官方层，\n  与既有 3 个 @max-null 包一致\n- GitHub 仓库与 tag（2026-08-16 补齐）：`Max-Null/dsh-habit`、\n  `Max-Null/dsh-guardian` 两仓库均已建（public，dsh-plugin topic）、\n  推送 main、打 `v0.1.0` tag 对齐 npm 版本——npm 页面的 repository\n  链接现已生效\n- `_eval-habit.ts` 随仓库提交：habit 闭环的回归验证脚本，发布后复跑使用\n"},{"file":"2026-08-16-OC妥协到DSH红利.md","date":"2026-08-16","slug":"OC妥协到DSH红利","title":"OC 妥协 → DSH 红利（迁移的核心动力清单）","statusRaw":"记录（源自 fractal 决策/待定清单/oc-plus 机制说明的既有妥协）","statusKind":"进行中","owner":null,"purpose":"这份清单是「为什么押注 DSH」最硬的论据——每一条都是 OC 底层局限逼出的妥协，而 DSH 原生解决。","dateInBody":"2026-08-16","dateNote":null,"tags":["dsh-memory","dsh-web-search-deepseek"],"summary":"这 10 条妥协，往上归结为 OC 的三个根问题，而 DSH 各有一套原生答案：","bytes":4355,"lines":47,"body":"# OC 妥协 → DSH 红利（迁移的核心动力清单）\n\n> 日期：2026-08-16\n> 状态：记录（源自 fractal 决策/待定清单/oc-plus 机制说明的既有妥协）\n> 用途：这份清单是「为什么押注 DSH」最硬的论据——每一条都是 OC 底层局限逼出的妥协，而 DSH 原生解决。\n\n---\n\n## 总表\n\n| # | OC 的底层局限 | fractal 的妥协 | DSH 的红利 | 出处 |\n|---|---|---|---|---|\n| 1 | 无底层 Plan Mode | 触发线 6「行为前门」用 system prompt 文本模拟 → prompt 膨胀 → token 暴跌 → 废弃 | 原生 `plan-mode`（`/plan` + `exit_plan_mode` + policy section，是底层模式切换非贴纸条） | oc-plus 机制说明 §八 |\n| 2 | task 工具同步阻塞 | 四 agent 假并行（逐个等子 agent 返回） | 非阻塞委派（后台 one-shot / continuable + 异步 settlement notice） | subagent README |\n| 3 | subagent 模型配置写 frontmatter | 制图师配 kimi k3 要 GUI 编辑 `agents/*.md` frontmatter（mtime 保护防覆盖） | `SubagentStartRequest.model` 原生 per-child | oc-plus README |\n| 4 | 事件不全（不触发 tool.execute） | 触发线 5 用 `system.transform` 每轮轮询 git log | 完整 `session/event` 事件流（event-sourced 会话日志） | oc-plus 机制说明 §七 |\n| 5 | 记忆引擎与 OC 插件 API 深度耦合 | 记忆长在 OC hook（system.transform/chat.message/event）上，不可剥离 | DSH 扩展点（section/context/storage/session-event）已实测可承载（dsh-memory） | 08-14 决策 §2.4 |\n| 6 | system prompt 膨胀污染推理 | knowledge 每 5 轮注入，精细频率控制 | section（稳定）/context（动态）分离 + 缓存前缀稳定纪律 | oc-plus 机制说明 §十一 |\n| 7 | 内置压缩不可用 | 装外部 opencode-acp + 配置阈值 | 原生 `compaction` | oc-plus README |\n| 8 | 配置改了下次会话才生效 | P9 拍板「下次会话生效」 | settings 服务热重载（文件监听→校验→即时生效） | 待定问题清单 P9 |\n| 9 | 文件引用/附件上传未跑通 | C1 列「未跑通」 | 插件实现（预览面板 + `ReferenceInsert`） | 内测路线图 C1 |\n| 10 | serve 全量拉取无分页 | 会话列表虚拟滚动（100+ 卡）待做 | session projection + 分页 | 内测路线图 ② |\n| 11 | DeepSeek 网络搜索走 Anthropic 兼容格式（非一等公民） | 专门造「侦察兵」agent 单独调 Auth 格式接口 | `dsh-web-search-deepseek` 原生 provider + `web_search` 工具（模型直接调，无需专门 agent） | web-search-deepseek README |\n\n## 三个「根问题」的提炼\n\n这 10 条妥协，往上归结为 OC 的三个根问题，而 DSH 各有一套原生答案：\n\n| OC 根问题 | 具体表现 | DSH 答案 |\n|---|---|---|\n| **① 事件/接口贫瘠** | 事件不全、task 阻塞、配置不热更新、serve 能力未接 | 事件溯源会话日志 + 非阻塞 subagent + settings 热重载 |\n| **② 提示词模拟底层能力** | Plan Mode、行为前门都用 prompt 硬撑 | 原生 plan-mode + section/context 分层 |\n| **③ 扩展点与引擎强耦合** | 记忆/agent 模型都长在 OC 专有 API 上 | 通用 capability seam（llm/section/context/storage/subagent） |\n\n### 根因再挖一层：上下文有没有「固定 vs 变化」的标识\n\n「提示词模拟底层能力」出问题的根子，不在「prompt 太长」，而在 OC 的上下文是**无结构的文本流**——哪些固定、哪些变化没有标识，LLM 只能靠语义猜。DSH 把它做成了两个结构化 seam：\n\n- `systemPrompt.section()` = **固定**（每轮稳定，前缀缓存安全，section 名 + order 标识）\n- `systemPrompt.context()` = **变化**（每轮动态，runtime snapshot，context 名标识）\n\n这正是「缓存前缀稳定纪律」的来源（稳定记忆进 section、动态记忆进 context），也是 plan-mode 能做「底层切换」而非「贴纸条」的原因——模式是结构化状态（`plan/mode` + `plan:policy` + `exit_plan_mode` 工具），不是让 LLM 猜的文本。\n\n## 结论\n\n**这些妥协不是瑕疵，是 fractal 在 OC 框架内\"用技巧换能力\"的代价。** 换到 DSH，这些技巧大多可以删掉，换成原生能力——这就是迁移最实在的红利，也是「不 fork、只插件」能成立的底气：DSH 的 seam 已经把这些坑填平了。\n"}],"report":{"noDate":[],"dateMismatch":[],"noTitle":["2026-09-10-DSH官方Gates拆解原始报告-F-run-gates编排.md"],"noStatus":[],"noTags":["2026-08-16-评测脚本子代理无模型-诊断修复.md","2026-08-17-EPIPE崩溃-stderr管道防护.md","2026-08-17-GitHub发布收尾-状态与动作.md","2026-08-18-会话完成通知-失焦提醒.md","2026-08-22-open-sea-skin增强版提交上游PR.md","2026-09-10-DSH决策记录的人机协作形态.md","2026-09-10-DSH过程决策精读-03-权威与推断.md","2026-09-10-DSH过程决策精读-04-什么算证据.md","2026-09-10-DSH过程决策精读-05-状态的语义精度.md","2026-09-10-DSH过程决策精读-06-事实住哪里.md","2026-09-10-DSH过程决策精读-08-把判断变成可判定的规则.md","2026-09-10-DSH过程决策精读-11-契约写在哪保证什么.md","2026-09-10-DSH过程决策精读-12-身份与证据的可靠性.md","2026-09-10-DSH过程决策精读-13-别让省事的做法冒充正确做法.md","2026-09-10-DSH过程决策精读-14-真正的瓶颈与不能证明的事.md","2026-09-10-DSH过程决策精读-判断标准总表.md","2026-09-10-DSH过程决策精读-索引.md"],"kinds":{"进行中":37,"已完成":29,"已决策":14,"记录":31}},"totalBytes":1039186, function md(src){
  var out=[],L=src.split(/\r?\n/),i=0,steps=0;
  function inline(s){

      out.push(t+"</tbody></table>");continue;
    }

      var q=[];
      while(i<L.length&&/^\s*>/.test(L[i])){q.push(L[i].replace(/^\s*>\s?/,""));i++;}
      out.push("<blockquote>"+q.map(function(x){return "<p>"+inline(x)+"</p>";}).join("")+"</blockquote>");continue;
