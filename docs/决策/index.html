 **7 个部件**。\n\n### 1. 引言（定义 + 术语检查 + 注释规则）→ **改写**\n\n**逐字保留**：\n\n- 核心句：**\"写够以保住契约，然后删掉推理记录、重复与装饰。\"**\n- *contract* 的定义（obligation / invariant / precondition / postcondition / compatibility promise）\n- **术语检查表**：`contract`、`boundary`、`shape`、`surface`、`seam`、`gate`、`vocabulary` 是**用前要检查的词，不是禁词**——先问\"更精确的规则 / API / 字段集 / 类型 / 验证点 / 时序点 / 组件切分 / 失败状态能不能更好地陈述这个事实\"\n- **注释规则**：注释描述代码表达不了的**非显然契约或理由**，不复述代码已经蕴含的东西\n\n**要改的**：依赖声明换成 `docs/SSiD开发手册.md` + 02（去掉 `dsh-doc`）。\n\n**术语表要本地化**：`seam` / `gate` / `vocabulary` 在 SSiD 的使用语境不同。SSiD 实际会用的词是「契约 / 边界 / 表面 / 门禁 / 派生」。**适配版应给一张中英对照的两列表**，比上游的单语清单更适合中文写作场景。\n\n### 2. `## Inputs and exclusions` → **改写**\n\n**保留**：要求显式 `scope`（缺失就报告并停止，不自行推断全仓库）；`mode: automatic | interactive`（默认 automatic）；**mode 控制提问，不控制写入权**；范围里只有排除项时报告「无可用文件」。\n\n**SSiD 改写点**：\n\n| 上游 | SSiD |\n|---|---|\n| 排除 `vendor/`（含符号链接）且排除项写在包含项之后 | 保留；SSiD 的 vendor 副本在 `shell/profile-template/vendor/` 与各插件的 vendor 位 |\n| 排除 `.agents/notes/archived/` | **换成 SSiD 的冻结副本**：`references/`、`plugins/` 下与三处 vendor **逐文件全等**的副本、以及 `_archived-*` 目录。**改这些地方会破坏同步链**（SSiD 手册 §10） |\n| 派生物（生成的目录、快照、fixture）先改 owner 再重新生成 | 保留；SSiD 的派生物是 `lib/`（由 `src/` + tsdown 生成）与 `shell/profile-template/`（由源同步） |\n| 双语对（无永久 owner，任一语言可为 authored side） | **保留但降权**：SSiD 只有 1 份排查记录级别的双语需求，不是常规工作 |\n\n**新增一条（有据）**：SSiD 的**六个合法载体**（`docs/release-notes-*.md` / `docs/决策/` / `docs/设计/` / `docs/排查/` / `shell/docs/pitfalls.md`）——变更叙事在那里是内容本体。**与 02 保持一致，两处引用同一份清单。**\n\n### 3. `## Preserve the complete proposition` → **原样保留（含 5 条子项）**\n\n**这是全篇最不可动的一节**，逐字保留：\n\n编辑前先识别段落的**每一个命题**，逐个保住：actor 与 action；条件、时序与顺序；情态（must / may / never）；否定性保证与例外；归属、副作用、失败模式与后果。\n\n**\"只在每条事实子句都存活、且结果更清楚时才删形容词、重复与叙事。字数变少本身不是改进。\"**\n\n以及三条附属规则：局部保留完整契约、一个解释只有一个 home、非显然理由在\"省掉它会导致误用或错误简化\"时必须保留。\n\n**跨语言成立**，一条不改。\n\n### 4. `## Required coverage by prose location`（12 类）→ **改写**\n\n骨架（按位置规定必需覆盖 + \"这不是单向缩短，缺契约时要**补写**\"）**保留**。\n\n**具体改写已在 §2.1 的表里逐条给出**（删 1 类、降级 1 类、改述 2 类、其余照搬）。要点：\n\n- 12 类 → **10 类**（**两处并入**：Cookbooks 并入 READMEs、Diagnostics 并入 Internal comments）\n- **#9 Skills and agent instructions 要提权重**：SSiD 有 14 个 skill，而且本包的每个 skill 都属这一类。上游那条判据（陈述行为护栏 + 显式 scope 限制，如\"guidance, not a script\"；保持工作流简洁并链接其权威来源）**对 SSiD 尤其重要**——因为 02 的实测显示，泄漏就出在这里。\n\n### 5. `## Workflow`（7 步）→ **改写**\n\n7 步骨架保留，改的是**工具与门禁**：\n\n| 上游步骤 | SSiD 改写 |\n|---|---|\n| 1. 确认 scope / mode / 分支或 PR 基线 / 适用 AGENTS.md | 保留（SSiD 有根 `AGENTS.md` + `seek-soul-in-darkness/AGENTS.md`） |\n| 2. 读文档标准与属主代码 | 改指向 `docs/SSiD开发手册.md` |\n| 3. 检查请求范围而非只看最大文件 | **逐字保留**——\"用搜索与字数找候选，然后**语义判断**\" |\n| 4. 分类每处候选：keep / add / trim / restore / restructure / defer | 保留六分类；**删掉\"不得为了满足删除指标而制造编辑\"的下一句要保留**（这句是防过度修剪的） |\n| 5. 先改 owner 再改派生物；学到新规则后回头复查类似段落 | 保留 |\n| 6. 跑窄范围检查、文档门禁、`git diff --check`、可见字符串的行为测试 | **SSiD 无文档门禁** → 换成：`npm run typecheck`（shell）/ 各插件 `pnpm typecheck` + 受影响的 L1 测试；\u003cbr>**删掉 `verify-client-ui-i18n`**，改 `verify-zh-ui.cjs` |\n| 7. 报告检查范围、明确改动、有意保留、延后项、实际跑过的检查 | 保留（这是**诚实空白**纪律的载体，不删） |\n\n### 6. `## Borderline decisions` → **保留 + 小改**\n\n三条判断**逐字保留**：\n\n1. **只有当至少两个版本都满足完整命题规则、且交换的是已接受的原则时，才算边界情形**——\"一个有唯一保命题答案的改写不是边界情形\"\n2. automatic 模式下**直接应用明确编辑**，只报告真正的边界情形，**不提问**；不得为了让进度而弱化命题\n3. interactive 模式下按治理原则**归组同类段落**，给 2–3 个可行版本、推荐一个、说明事实或结构差异，**不给劣质干扰项**\n\n**要改的**：交互渠道。上游说\"当通过行内评论校准 PR 时，把推荐版本放进 diff、把备选挂在那一行\"——SSiD 没有 PR 评审流程（单人开发）。改成 **GUI 会话内呈现**（在回复里给出 2–3 个版本 + 推荐 + 事实差异）。\n\n### 7. `references/examples.md`（142 行，17 节）→ **重写**\n\n上游 17 节全是英文案例（保每条事实子句 / 显式 skill scope 是功能性的 / cookbook 保留动作与验证 / 保留归属与时序 / 事件 JSDoc 保留边界时序 / 让复杂代码定向而不叙述它 / 公开 JSDoc 含失败 / 保留简洁的实现映射 / 链接理由同时保留本地契约 / implemented Agent Note 保留验证契约 / 安全边界可能需要一个具体例子 / 彻底删除推理记录 / 配置注释解释树看不出的事 / 不要只为字数修剪 / 模型可见文本遵循归属 / 生成的摘要必须独立成立 / 限制是契约不是债务清单）。\n\n**结构照搬，案例全换成中文**，并做三处调整：\n\n- 补 **SSiD 案例**（可从本文 §2.1 与 02 §2.2 的真实样本取材）\n- **删掉**依赖 DSH 专有机制的节（cookbook、事件 JSDoc、模型可见文本归属的既有机制）\n- **保留**跨语言成立的节：**\"不要只为字数修剪\"**、**\"限制是契约不是债务清单\"**、**\"生成的摘要必须独立成立\"**——这三条在中文写作里同样高频踩坑\n\n### 8. 从 `dsh-doc` 并入的 9 条判据（见 09 号说明）→ **新增**\n\n> `dsh-doc`（861 行）被判 `⛔ 不单独适配`——它的制度部分（kind 系统 / 4 模板 / 双语配对 / 字数预算 / 网站投影 / 门禁）SSiD 一样都没有。**但它有 9 条判据的主题正是\"行文\"**，因此在 09 的合订理由里被明确移交到本节。**逐条列出，不做\"大概有点用\"的模糊移交。**\n\n#### (a) 事实核对纪律（4 条，逐字保留）\n\n上游出处：`dsh-doc` 的 \"Fact-check procedure: test, do not assume\" 节。\n\n1. **对每条声称的操作，对着当前 checkout 真跑一遍。** 执行文档将展示的每个 CLI 命令、配置片段、profile/patch 示例的**原样**版本；**只写下你观察到的**，包括确切输出、警告与失败模式。若某断言依赖你没有的密钥或网络，**说明这一点并点名验证属主，而不是断言其行为**。\n2. **★★★ 删掉你无法复现的东西。** *\"**绝不**把命令、字段、默认值或行为从**记忆、类比或邻居包的 README** 搬过来。当一条断言无法复现时，**修那条断言——而不是修测试**。\"*\n   > **这条必须提权**：它逐字描述了本系列 01/02/03/09 犯的 **9 次**\"数一数\"错误。DSH 早已把它写成判据，而 SSiD 侧没有任何等价物。**它就是本说明《写作规则》§三 的存在理由**，两者应互相引用。\n3. **对着最新 master 检查旧文档。** 修订既有页面之前先 `git fetch origin`，把该节与 `origin/master` 对照；配对 sidecar 可恢复任一侧最后确认的文本。**\"master 上一句陈旧的陈述仍然是错的\"——要对着代码改，不是对着旧散文改。**\n4. **分类主题再写安装指引。** **读事实，不要读文件夹名**：看 `package.json` 的声明与入口文件的形态，而不是目录名暗示的类型。\n\n#### (b) 语气规则（5 条，逐字保留）\n\n上游出处：`dsh-doc` 的 \"Voice rules\" 节。这些规则管的是**陈述方式**，与文档制度无关。\n\n1. **★ Summary 说的是主题能做什么。** 开篇 Summary 与用户向小节描述用户或 agent **能用它做什么**——结果、收益、何时选用、主要代价——**绝不是它的角色、类型或内部身份**。包 Summary 里的\"它是什么\"**仅指读者可见的能力**，不是它的 Cordis 角色、注册点或内部组件。*\"'这个接缝注册 `ctx.x` 并追加 `x/event` 记录'是身份叙述；'你可以每条消息存一条笔记，重启后还在'才是它做什么。\"*\n   > **与 `writing-skills` 的「description 只写触发条件」同源**：两者都是\"读者要能判断**该不该用它**，而不是被告知它内部走了几步\"。**适配版的 description 规则应把两处合并成一条**，而不是各写一份。\n2. **开发者小节解释，绝不枚举。** 折叠的实现内容覆盖整体设计概念、架构与挥手式数据流——**足够了理解它怎么工作**——并**链接代码**取确切细节；**不做完整 API 目录、穷举式字段清单、事件负载枚举或 JSDoc 复述**。\n3. **★ Dev Note 是唯一的草稿区。** 半成品想法、草稿、未定方向、实测产物与工作假设**只**出现在末尾的 Dev Note 里，并**显式标注非权威**；**其他每一节都是打磨过的当前状态散文**。\n4. **★ 只讲当前状态。** **Dev Note 之外没有兼容性垫片、迁移话术或历史**（`previously` / `now` / `no longer` / `renamed`）；**\"今天这个代码库是唯一主题\"。**\n   > **这条与 02 的推理痕迹修剪同源**——**03 与 02 应互相引用它**，而不是各自造一份判据。\n5. **用受控的技术英语。** 歧义会改变行为时，让每句话有**显式 actor 与一个主要动作**；一个概念复用一个术语；优先直接动词；拆开堆叠的指令与条件；**保留情态与例外**。（上游引用一份 ASD-STE100 启发的规范，SSiD 无对应文献 → **保留判据、删引用**。）\n\n**并入的算术**：03 的判据总数由上游 7 部件的判定结果 + **9 条新增**构成；上游部件数（7）不变，因此 §四 的算术核对不受影响。\n\n---\n\n## 四、汇总：改动清单\n\n| 动作 | 数量 | 具体 |\n|---|---:|---|\n| **原样保留** | 1 部件 | `Preserve the complete proposition`（含 5 条子项与三条附属规则） |\n| **保留 + 小改** | 1 部件 | `Borderline decisions`（仅换交互渠道） |\n| **改写** | 4 部件 | 引言（依赖与术语表）、`Inputs and exclusions`（排除项 + 六个合法载体）、`Required coverage`（12 类 → **10 类** + 提权 #9）、`Workflow`（门禁换名） |\n| **重写** | 1 部件 | `references/examples.md`（17 节结构保留、案例换中文） |\n| **删除** | 0 部件 | 无（Cookbooks/Diagnostics 是**并入**而非删除） |\n\n> **算术核对**：6（引言 + 5 小节）+ 1（references）= **7 个部件**；1 + 1 + 4 + 1 = **7** ✓\n\n**净判断：上游 81 行的判据一条不减**；改动集中在\"位置清单的本地化\"（删 1、并 1、降权 1、换机制 1）与门禁换名。\n\n---\n\n## 五、落地结构\n\n```\n@max-null/dsh-skills/skills/ssid-prose-standard/\n├── SKILL.md                    # 预计 85–100 行（上游 81 + 术语对照表 + 六个合法载体）\n├── SOURCE.md                   # 用统一模板\n└── references/\n    └── examples.md             # 重写：中文案例，17 节结构保留\n```\n\n**description 建议**（**只写触发条件**）：\n\n> 在撰写、评审、恢复、修剪或审计 SSiD 仓库的中文或英文行文时使用——包括判断 Markdown、JSDoc、代码与测试注释、提示词、诊断信息、CLI 与界面字符串里哪些内容必需、哪些属于推理记录。也用于决定一段契约该写在调用点还是链接到属主文档时。\n\n**依赖声明**（双向，与 02 一致）：\n\n```\nREQUIRED BACKGROUND: ssid-trim-cot-leakage 负责查找与修复推理痕迹；本 skill 负责判断每处该保留什么。\n两者必须同批进入 @max-null/dsh-skills。\n```\n\n---\n\n## 六、SOURCE.md\n\n用 `写作规则 §七` 的模板，本 skill 的值：\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | dsh-prose-standard |\n| 上游路径 | DSHfork/.agents/skills/dsh-prose-standard/ |\n| 上游版本锚点 | c291e7961a（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 81 行 + references/examples.md 142 行 = 223 行 |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 小改（位置清单本地化 + 门禁换名） |\n| 依赖 | **ssid-trim-cot-leakage（双向，同批进包）** |\n\n---\n\n## 七、待确认\n\n1. **Cookbooks 判据并入 READMEs 是否合适**？我的理由：SSiD 的插件 README 实际承担了\"怎么用\"（含 `## 截图` 段）。若你认为该另立一类\"使用文档\"，请指出。\n2. **`docs/排查/` 只有 1 个文件**——是否为\"事故记录\"另立位置（如 `docs/排查/` 约定 + 模板）？这条决定 #8 Postmortems 判据在 SSiD 是空转还是有落点。\n3. **14 个 skill（8 mxy + 6 omo）的正文是否纳入 03 的 scope**？它们是第三方来源，改动会与上游同步冲突（与 02 §七.2 是同一个问题，建议一并决定）。\n\n---\n\n## 八、数字自检（命令产出，可复现）\n\n```powershell\n$up = 'DSHfork\\.agents\\skills\\dsh-prose-standard'\n@(Get-Content \"$up\\SKILL.md\").Count                                    # 81\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^## ').Count              # 5   一级小节\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^- \\*\\*').Count           # 12  位置类条目\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^\\d\\. ').Count            # 7   Workflow 步数\n@(Get-Content \"$up\\references\\examples.md\").Count                      # 142\n@(Get-Content \"$up\\references\\examples.md\" | Select-String '^## ').Count # 17 examples 节数\n@(Get-ChildItem 'seek-soul-in-darkness\\skills' -Recurse -Filter SKILL.md -File).Count  # 14\n@(Get-ChildItem 'seek-soul-in-darkness\\docs' -Directory).Count          # 4   (决策/品牌/排查/设计)\nTest-Path 'seek-soul-in-darkness\\docs\\cookbook'                         # False\n```\n\n**自查记录（两处）**：\n\n1. 第一版把位置条目写成 **13 类**，命令产出为 **12**——\"数一数\"错误（01 犯 5 次、02 犯 2 次、本说明 1 次）。\n2. **生成 skill 文件时又抓到第二处**：§三.4 写「12 类 → 11 类」，但**两处并入**（Cookbooks → READMEs、Diagnostics → Internal comments）应为 **10 类**。同处的「13 个要点归为 12 类条目」也没有依据——命令产出就是 12 类条目。\n\n**教训**：第 2 处错误**直到落地成 skill 时才暴露**——说明「适配说明写完 ≠ 判据已准确」，**生成 skill 的过程本身就是一次复核**。这与本说明 §三.8 那条「对每条声称的操作真跑一遍」是同一个精神：**写下来不算验证，能用才算**。两处错误都属\"数一数\"类（本说明共 2 次；全系列至此 10 次）。\n\n> **由此加一条写作规则**（已并入 `写作规则` §三）：**\"我数过的\"不算证据**。任何形如「N 类 / N 条 / N 个」的表述，必须在写之前跑一次计数命令；凭阅读印象数出来的数，错误率不是偶然的。\n"},{"file":"2026-09-10-skill适配说明-04-代码评审.md","date":"2026-09-10","slug":"skill适配说明-04-代码评审","title":"skill 适配说明 04：代码评审","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-skills","dsh-code-review","dsh-skills","ssid-code-review","dsh-prose-standard","dsh-ci-test-reliability","dsh-ssid-zh-ui","dsh-capture","dsh-habit","dsh-guardian","dsh-ssid-achievements","dsh-memory"],"summary":"上游 description 第一句：Use when reviewing a pull request in the deepseek-harness repo。它整份 skill 围绕「别人提了 PR，你来评」组织：确认 live base/head、跑 change-scope、按来源清单逐项过、把缺陷挂在 diff 行上。 SSiD 是单人（人 + AI）开发，没有 PR 评审流程。但这不","bytes":17841,"lines":255,"body":"# skill 适配说明 04：代码评审\n\n> **本说明的地位**：它是适配工作的**依据**，不是 skill 本身。格式见 `2026-09-10-skill适配说明-写作规则.md`。\n\n> 状态：已决策（推断 · 2026-09-12）\n\n**上游 skill**：`dsh-code-review`\n**上游位置**：`DSHfork/.agents/skills/dsh-code-review/`\n**上游版本锚点**：`c291e7961a`（2026-09-10 抓取，与前批同）\n**上游体量**：SKILL.md 52 行（**无 references**）= 52 行\n**清点分类**：`🔧 需适配`\n**拟落点**：`@max-null/dsh-skills` 的 `skills/ssid-code-review/`\n\n---\n\n## 一、为什么做这一个（以及一个根本差异）\n\n### 1.1 上游的场景是「评审 PR」，SSiD 的主要场景不是\n\n上游 description 第一句：*Use when reviewing a pull request in the deepseek-harness repo*。它整份 skill 围绕「**别人提了 PR，你来评**」组织：确认 live base/head、跑 `change-scope`、按来源清单逐项过、把缺陷挂在 diff 行上。\n\n**SSiD 是单人（人 + AI）开发，没有 PR 评审流程**。但这不意味着删掉它——**判据是「看什么」，与「谁看」无关**。适配后是**两个场景共用一份判据**：\n\n| 场景 | 触发 | 与上游的关系 |\n|---|---|---|\n| **主场景：交付前自审** | AI 写完代码/文档，交付给用户验收之前 | 判据相同，只是「评审者」是被评代码的同一方（这反而**提高**了对 #1「新行文语义评审」的要求——自己写自己评最容易放过） |\n| **次场景：给上游提 PR 前自查** | 向 DSH / 第三方插件提 PR | **SSiD 有真实先例**：`docs/决策/2026-08-19-DSH修复PR-3198方案落盘.md`、`docs/决策/2026-08-22-open-sea-skin增强版提交上游PR.md`。此时上游流程（base 确认、行内评论）**照旧适用** |\n\n### 1.2 它是 01/02/03 的汇聚点\n\n上游 Sources of truth 里直接引用 `dsh-prose-standard`（→ 03）与 `dsh-ci-test-reliability`（→ 01）。所以 04 是**依赖链的上游**：\n\n```\n04 代码评审 ──引用──> 01 测试可靠性（测试与拆除判据）\n           ──引用──> 03 行文标准（新增文案的语义评审）\n```\n\n**结论：01/02/03 必须先于 04 存在**，否则 04 的 Blocking #1 与 Manual「测试可靠性」两条会指向空。这是**第三组依赖关系**（前两组：02↔03 双向依赖、01 被 06 引用）。\n\n---\n\n## 二、SSiD 侧现状（已核实）\n\n### 2.1 上游引用的 DSH 机制，SSiD 有没有\n\n| 上游机制 | SSiD | 依据 |\n|---|---|---|\n| `pnpm run change-scope --base \u003cref>` | **无** | `shell/scripts/` 只有 5 个脚本（after-pack / boot-bundled / prepare-runtime / repack-open-sea-skin-vendor / verify-deploy-rename） |\n| `docs/defensive-patterns.md` | **无该文档** | `docs/` 下只有 4 个子目录与 24 个顶层 md |\n| `docs/AGENTS.md`（文档标准） | 对应 `docs/SSiD开发手册.md` | — |\n| `docs/testing.md` + quality-gates Agent Note | 对应手册 **§9 插件开发与测试规范**（含 `### 分级门槛`，2026-08-30 定稿） | L303 / L307 |\n| Agent Notes（`.agents/notes/`） | 对应 `docs/决策/`（99 个文件）**但无状态机**（见 03 §2.2） | — |\n| `subsystems/` 页 + `type-equiv` | **无** | grep 无实际使用 |\n| `./invariant` 伴生 | **无** | grep 无实际使用 |\n| i18n（`translation-rules.md` / `terminology.md`） | **无双语制度**；但有 `dsh-ssid-zh-ui` 的运行时翻译表 | — |\n| `verify-client-ui-i18n` | 对应 **`verify-zh-ui.cjs`**（10,952 B） | — |\n\n### 2.2 清点表的一处判断需要更正：Cordis 注册**不是** DSH 专有\n\n`2026-09-10-DSH-skills适配清点.md` §126 把「#4（Cordis 注册）」列为 DSH 专有条款。**实测推翻**：\n\n| 证据 | 位置 |\n|---|---|\n| `ctx.effect(() => ctx.webServer.register({` | `dsh-capture/src/index.ts:172`（另有 draft-polish:119、memory/routes.ts:272） |\n| `this.ctx.storage.backend.register('habit', backend)` + `this.ctx.effect(() => async () => { await backend.close() }, 'habit.backendClose')` | `dsh-habit/src/engine.ts:78-79` |\n| 同上（guardian） | `dsh-guardian/src/engine.ts:138-139` |\n| `ctx.on('session/event', ...)` | `dsh-habit/src/engine.ts:91`、`dsh-guardian/src/engine.ts:153`、`dsh-ssid-achievements/src/engine.ts:245,258` |\n| `ctx.tools.register(defineTool({...}))` | `dsh-memory/src/index.ts` **10 处**（L236…L467） |\n| `ctx.slots.inject(...) / ctx.slots.register(...)` | `dsh-capture/src/client/index.ts:104,111`、`dsh-node-appearance/src/client/index.ts:78` |\n| `projectionCtx.sessionProjections.register(...)` | `dsh-chat-rail/src/index.ts:211` |\n\n**SSiD 的插件是彻头彻尾的 cordis 插件**，注册点遍布 storage backend、webServer、tools、slots、session projections。「注册即效果、`register()` 返回 disposer」这条规范**完全适用**。\n\n**更要紧的是**：`dsh-habit` 与 `dsh-guardian` 已经写出了**教科书式 cleanup**（`register` + `ctx.effect` 返回 `backend.close()`）。但：\n\n> **插件测试里没有任何 disposal 断言**——在 `max-null-plugins/**/*.test.ts` 里搜 `dispose|disposer|ctx.scope` **零命中**。\n\n**所以 #4 在 SSiD 不是「专有条款该删」，而是「当前缺失的守卫」**——注册写了清理，却没有任何测试证明它清了。这条要**保留并提权**。\n\n---\n\n## 三、逐条适配判断\n\n上游共 **5 个部件**（引言 + 4 节），无 references。判据总数为 **31 条**（Sources of truth 8 + Blocking 7 + Manual checks 16）。\n\n### 1. 引言 → **改写（场景重述）**\n\n**逐字保留**：\n\n- **\"This skill is guidance, not a complete checklist.\"**（上游显式声明 scope，符合 03 的 #9 位置判据）\n- **\"先验证并获取 PR 的 live base 与 exact head\"** → 主场景改为「先确认改动的起点」（`git status` / 分支 / 与上次交付的差异）\n- **\"范围报告不替代语义评审\"** —— 这句在 SSiD **更重要**，因为 SSiD 连范围报告工具都没有\n- **\"优先正确性、生命周期、安全与必需行为，而不是风格；一条有证据的阻塞项胜过一长串小毛病\"** —— 逐字保留\n\n**要删的**：`change-scope` 命令（SSiD 无此工具）。**替代**：用 `git diff --stat` + 受影响包清单，并**明确写\"这不是 change-scope 的等价物，它只给路径不给脏层\"**。\n\n### 2. `## Sources of truth`（8 条）→ **重写指向（8 → 6 条）**\n\n| 上游 | 适配后 |\n|---|---|\n| `AGENTS.md` + `packages/AGENTS.md` | **工作区根 `AGENTS.md`** + **`seek-soul-in-darkness/AGENTS.md`** |\n| `docs/defensive-patterns.md` | **合并进下一条**——其判据（子进程/回调/异步状态/拆除的缺陷类）由 **01 适配版** 覆盖 |\n| `docs/AGENTS.md` | **03 适配版**（`ssid-prose-standard`）+ `docs/SSiD开发手册.md` |\n| `dsh-prose-standard` | → **03**（保留引用） |\n| `dsh-ci-test-reliability` | → **01**（保留引用） |\n| `docs/testing.md` + quality-gates Agent Note | → **手册 §9**（分级门槛）。**Agent Note 部分删除**（SSiD 无此制度） |\n| Agent Notes 目录 | → **`docs/决策/`**。保留上游那句关键的软化：**\"与决策记录意见不同是设计讨论，不是自动否决\"** |\n| i18n（`translation-rules.md` / `terminology.md`） | **删除**——SSiD 无双语配对制度 |\n\n### 3. `## Blocking requirements`（7 条）→ **改写（7 → 5 条）**\n\n| # | 上游 | 判定 |\n|---:|---|---|\n| 1 | 新行文接受语义评审 | **保留**，指向 03。**在自审场景下要加一句**：\"自己写的文案由自己评\"失败率最高，须逐段对着属主代码或行为核，而不是重读一遍觉得通顺 |\n| 2 | 文档与代码同 diff 同步 | **保留**；门禁换名（`verify-client-ui-i18n` → `verify-zh-ui.cjs`） |\n| 3 | 核心类型文档匹配（subsystems 页 + `type-equiv`） | **删**——SSiD 无 subsystems 页、无 type-equiv 清单 |\n| 4 | 注册要清理（disposal tests） | **保留并提权**（见 §2.2）：SSiD 有大量 cordis 注册与真实 cleanup 代码，**但零 disposal 测试**。指向改为根 `AGENTS.md` 的\"注册即效果\"＋插件自身的 `ctx.effect` 用法 |\n| 5 | Invariant companions are semantic | **删**——SSiD 无 `./invariant` 机制 |\n| 6 | 必需证据存在 | **保留**；\"relevant local checks\" → **L1 门槛（typecheck + test 全绿）**＋手册 §9 的 L2/L3 分级 |\n| 7 | 客户端 UI 文案归 locale | **保留**；机制换述——SSiD 用运行时翻译表（`TEXT_ZH` in `lib/client.js`）＋ `verify-zh-ui.cjs`。**保留用户/模型/线上数据与 code token 逐字不动**这条 |\n\n### 4. `## Manual checks`（16 条）→ **改写（16 → 14 条）**\n\n**12 条原样保留**（判据与语言、仓库无关）：意图与接口契约 / 生命周期与并发 / 能力与消费者匹配 / 范围·归属·必要性 / 配置与公开选择 / 模型视角 / 强制点（denial 路径） / 借用与派生状态 / 边界覆盖最终操作 / 测试强度 / 测试可靠性 / 真实入口。\n\n**2 条改写**：\n\n- **#10 Real entry path**：上游的入口是 Loader / bin / worker / ACP bridge。SSiD 的对应是 **Electron 壳（`main.mjs`）→ `kernel.bundle.mjs` → profile 装载**，以及插件的 `package.json` 导出面（`main` / `exports` / `dsh.client`）。保留上游最有用的一句：**\"手工挂载的插件抓不到非法的 Loader 导出\"**——对应 SSiD 就是「手工 import 抓不到 `cordis.patch.yml` / exports 面的错误」。\n- **#14 Implemented Agent Notes match shipped reality** → 改为**「决策记录与已交付现实一致」**：SSiD 的 `docs/决策/` 无状态机，所以不做「proposed → implemented 的移动与改写」，只要求**决策记录里陈述的机制、路径、名字与实际交付一致**；不一致时**改记录或改代码，不留着两说**。\n- **#15 Transcript changes**（snapshot）→ 改为**截图基线**：SSiD 无 transcript snapshot 制度，但有 Playwright 截图基线（`shell/tests/plugin-adapt/baselines/`，`pnpm baseline` 生成）。保留上游的核心判断：**\"expected-output 的 diff 要当作行为变更来评审，不是格式噪音\"**——对应截图就是\"基线变了要问为什么变，不是重新生成就完事\"。\n\n**2 条删除**：\n\n- **#13 Invariant lifecycle and negative controls** → 删（无 invariant 机制）。**但它有一半要救**：上游那句\"**一条蓄意无效的用例必须经由真实运行器按预期规则失败**\"（负向控制）与 invariant 无关，是**通用**的——**并入 #11 测试强度**。\n- **#16 Bilingual changes** → 删（无双语制度）。\n\n### 5. `## Reporting findings` → **改写（渠道不同）**\n\n上游：缺陷挂**最紧的相关 diff 行内**，跨切面用 PR 级评论，用既有 review thread 回复；收到评审时逐条核实、**以技术理由修正或反驳，不做表演性同意**。\n\n**适配**：\n\n- **主场景（自审）**：报告进 **GUI 会话内的交付说明**——按 **阻塞项 / 建议** 分开，每条给「缺陷 + 位置 + 影响 + 证据」四元组（上游四要素逐字保留）。**\"omit issues already enforced by a green gate\"** 保留——已被 L1 门禁守住的事不重复报告。\n- **上游 PR 场景**：上游流程照旧（行内评论 + PR 级评论）。\n- **\"verify each claim and fix or rebut it on technical grounds without performative agreement\"** —— 逐字保留。这条对 AI 尤其重要：**收到用户反馈时不要表演性同意，要么改、要么给技术理由**。\n\n### 6. 从 `dsh-doc` 并入的 6 条质量判据（见 09 号说明）→ **新增**\n\n> `dsh-doc`（861 行）被判 `⛔ 不单独适配`，但它的 \"Quality criteria\" 节**正是评审时要问的问题**，因此在 09 的合订理由里移交到本节。\n> **并入位置**：`Manual checks` 里审阅**新增或修改的文档**时逐条过；同样适用于审阅新增的 skill 正文。\n\n| # | 判据 | 要问的问题 |\n|---:|---|---|\n| 1 | **Brief** | 常用路径**只含其结局所需的事实**；穷尽真相保持在**一个直接链接或一层细节**之外 |\n| 2 | **Intuitive** | **前置先于依赖概念**；**下一步动作是显然的**；标题用读者会搜的词 |\n| 3 | **Friendly** | 读者能**识别成功**、**行动前理解风险**、**从可能的失败中恢复**、并能选择是否继续深入 |\n| 4 | **Accurate** | 每条持久断言**有一个属主**，以及**与其风险相称的验证路径** |\n| 5 | **★ Agent-readable** | 元数据、稳定标题、锚点、术语、归属、当前/提议状态**支持定向检索，而不必加载整个语料** |\n| 6 | **Newcomer-complete** | 一个没有仓库上下文的专业工程师，能**通过 3–5 个链接页重建相关架构或特性** |\n\n**第 5 条对 SSiD 尤其要紧**：它判的正是「**skill 与文档能不能被 agent 定向检索**」——也就是本系列全部适配工作的目标。若一份 skill 的元数据、标题、术语做不到定向检索，那么它写得再对，agent 也会**因为读不到而用不上**。\n\n**并入的算术**：上游 `Manual checks` 的 16 条判定（16 → 14）**不变**；这 6 条是**评审时额外要问的清单**，不是替代品。\n\n---\n\n## 四、汇总：改动清单\n\n| 动作 | 数量 | 具体 |\n|---|---:|---|\n| **原样保留** | 1 部件（部分） | `Manual checks` 的 12/16 条判据 |\n| **改写** | 4 部件 | 引言（场景重述）、`Blocking`（7→5）、`Manual`（16→14，含 2 条改写）、`Reporting`（渠道） |\n| **重写指向** | 1 部件 | `Sources of truth`（8→6，全部换成本地路径） |\n| **删除** | 0 部件 | 无（整节无删除） |\n\n**判据级算术核对**：\n\n| 节 | 上游 | 适配后 | 变化 |\n|---|---:|---:|---|\n| Sources of truth | 8 | 6 | −2（删 i18n 源；defensive-patterns 并入） |\n| Blocking requirements | 7 | 5 | −2（删 subsystems/type-equiv、invariant） |\n| Manual checks | 16 | 14 | −2（删 invariant 负向控制、双语） |\n| **合计** | **31** | **25** | **−6** |\n| 部件（引言 + 4 节） | 5 | 5 | 0 |\n\n**净判断：删除的 6 条全部因「SSiD 无对应机制」，无一因「不需要」**；`Reporting` 的\"不做表演性同意\"、`Blocking` 的\"自己写自己评失败率最高\"等**通用纪律逐字保留**。\n\n---\n\n## 五、落地结构\n\n```\n@max-null/dsh-skills/skills/ssid-code-review/\n├── SKILL.md        # 预计 60–75 行（上游 52 + 场景重述 + 本地指向）\n└── SOURCE.md\n```\n\n**命名**：`ssid-code-review`。\n\n**description 建议**（**只写触发条件**）：\n\n> 在交付 SSiD 的代码或文档改动之前自审时使用，也用于向 DSH 或第三方插件提 PR 前的自查——包括判断改动是否满足仓库规范、接口契约两侧是否一致、生命周期与并发是否有缺陷、注册是否可清理、必需证据是否存在、界面文案是否越权硬编码。\n\n**依赖声明**：\n\n```\nREQUIRED: 本 skill 引用 ssid-test-reliability（01）与 ssid-prose-standard（03）。\n三者必须同批进入 @max-null/dsh-skills。\n```\n\n---\n\n## 六、SOURCE.md\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | dsh-code-review |\n| 上游路径 | DSHfork/.agents/skills/dsh-code-review/ |\n| 上游版本锚点 | c291e7961a（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 52 行（无 references） |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 需适配（场景重述 + 来源指向重写 + 删 6 条无对应机制的判据） |\n| 依赖 | 引用 01、03（同批进包） |\n\n---\n\n## 七、待确认\n\n1. **主场景定为「交付前自审」是否正确**？依据是 SSiD 无 PR 评审流程（单人开发）＋上游 PR 场景另有 2 次真实先例。若你实际上有 PR 评审环节（哪怕是自建流程），这条要改。\n2. **disposal 测试要补吗**？（§2.2）这是本说明挖出的**真实缺口**：`dsh-habit` / `dsh-guardian` 写了 `ctx.effect(() => async () => backend.close())`，但**没有任何测试**验证它。补测试是独立任务（与 skill 适配无关），但它恰好是 04 的 Blocking #4 在 SSiD 的唯一落点。\n3. **`change-scope` 要不要移植**？DSH 的这个工具（显式 base → 变更路径 + 受影响包 + 脏层）在你此前的学习笔记里已两次提到（`2026-09-10-DSH工程方法论学习笔记.md:24` 等）。这是**工具**而非 skill，属独立议题。\n\n---\n\n## 八、数字自检（命令产出，可复现）\n\n```powershell\n$up = 'DSHfork\\.agents\\skills\\dsh-code-review'\n@(Get-Content \"$up\\SKILL.md\").Count                                    # 52\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^## ').Count              # 4   一级小节\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^### ').Count             # 0   二级小节\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^- ').Count               # 24  列表项\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^\\d\\. ').Count            # 7   Blocking 条数\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^- \\*\\*').Count           # 16  Manual 条数\n# 24 = Sources of truth 8 + Manual checks 16 ✓（Blocking 用编号不用列表）\n\n@(Get-ChildItem 'seek-soul-in-darkness\\shell\\scripts' -File).Count      # 5   脚本数\n@(Get-ChildItem 'seek-soul-in-darkness\\docs\\决策' -File -Filter '*PR*').Count  # 2  上游 PR 先例\nTest-Path 'seek-soul-in-darkness\\docs\\cookbook'                         # False（03 用）\n```\n\n**推导核对**：`^- ` 得 24；其中 Sources of truth 8 条 + Manual checks 16 条 = 24 ✓ 两节可互相验证。\n\n**自查记录**：本说明未发现数字错误——**因为先跑了命令再写**（03 的教训：凭印象数 12 类位置写成 13 类）。这条纪律生效了。\n"},{"file":"2026-09-10-skill适配说明-05-简化审查.md","date":"2026-09-10","slug":"skill适配说明-05-简化审查","title":"skill 适配说明 05：简化审查","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-skills","dsh-find-simplifications","dsh-skills","ssid-find-simplifications","dsh-chinese-thinking","dsh-memory","dsh-node-appearance","dsh-assistant-center","dsh-archive-agent-notes","ssid-prose-standard","dsh-tmp"],"summary":"上游开场就定死了用途：把这句\"找找能简化的地方\"变成一个有证据支撑的 Agent Note。所以它的真正难点不是\"怎么删代码\"，而是\"怎么证明该删\"： - §2 给 9 条 strong-candidate 判据（无生产消费者 / 只有测试和文档在用 / 两份表示镜像同一事实 / 无消费者的 seam 方法 / 只为测试存在的包 / 猜测性产品通用能力 / 只为保护未用 API 而存在的不变量与回","bytes":23271,"lines":315,"body":"# skill 适配说明 05：简化审查\n\n> **本说明的地位**：它是适配工作的**依据**，不是 skill 本身。格式见 `2026-09-10-skill适配说明-写作规则.md`。\n\n> 状态：进行中（推断 · 2026-09-12）\n\n**上游 skill**：`dsh-find-simplifications`\n**上游位置**：`DSHfork/.agents/skills/dsh-find-simplifications/`\n**上游版本锚点**：`c291e7961a`（2026-09-10 抓取，与前批同）\n**上游体量**：SKILL.md 157 行（**无 references**）= 157 行\n**清点分类**：`🔧 需适配`\n**拟落点**：`@max-null/dsh-skills` 的 `skills/ssid-find-simplifications/`\n\n---\n\n## 一、为什么做这一个（以及一个必须说清的定位）\n\n### 1.1 它是「把宽泛请求变成有证据的提案」的 skill\n\n上游开场就定死了用途：*把这句\"找找能简化的地方\"变成一个**有证据支撑的 Agent Note***。所以它的真正难点**不是\"怎么删代码\"，而是\"怎么证明该删\"**：\n\n- §2 给 **9 条** strong-candidate 判据（无生产消费者 / 只有测试和文档在用 / 两份表示镜像同一事实 / 无消费者的 seam 方法 / 只为测试存在的包 / 猜测性产品通用能力 / 只为保护未用 API 而存在的不变量与回滚路径 / 手搓了依赖已有的东西 / 简化后行为略变但更好解释）\n- §7 给 **\"证明或否证\"** 的完整流程（先分类消费者：生产语料 / 非生产语料 / 模糊语料；再用 `rg` 找，再读调用点）\n- §7 还有 **4 条拒绝条件**（生产调用方存在则这是特性决策不是清理 / 已被实现的 Agent Note 或来之不易的防御模式论证过 / 会引发无关改动却没真减少公开 API / 想法对但太小 → 加内联 TODO）\n\n**这套\"先证明再动手\"的纪律，正是 SSiD 最缺的**。\n\n### 1.2 定位：这是**引入新实践**，不是改进已有实践\n\n实测（§2.1）：**SSiD 目前没有任何简化类决策记录，也没有任何内联 TODO 标记**。所以：\n\n- 本 skill 的判据**来源清楚**（上游 157 行，已经过 DSH 真实历史检验）——满足三层验证规则里\"未改动判据继承上游检验\"\n- 但它的**落地场景在 SSiD 是空的**。落地后会**开始产生** `docs/决策/` 里的简化类记录\n- **因此它不能声称\"改进现有流程\"**。它的价值是**给 SSiD 补一套\"如何证伪一个简化提案\"的方法**\n\n---\n\n## 二、SSiD 侧现状（已核实）\n\n### 2.1 三个\"零命中\"与一个不一致\n\n| 检查 | 结果 |\n|---|---|\n| `max-null-plugins/**/*.ts` 中的 `TODO(` / `FIXME` / `XXX(` | **零命中** |\n| `docs/决策/*.md` 的简化 / 清理 / 重构 / 瘦身 / 去重类记录 | **零命中** |\n| 插件测试目录命名 | **不一致**：9 个用 `tests/`，3 个用 `test/`（dsh-chinese-thinking / dsh-memory / dsh-node-appearance），1 个无（dsh-assistant-center） |\n\n**三条推论**：\n\n1. **§10「Inline TODO Notes」在 SSiD 是空白**。SSiD 的待办集中在 `docs/SSiD开发手册.md` 的「待办清单」节（L278），**不在代码里**。适配时**保留判据但标注现状**，而不是假设它已在用——否则 agent 会以为仓库里到处是 TODO 需要合并。\n2. **§8「Coalesce Superseded Agent Notes」基本无落点**（见 §三.8）。SSiD 的 `docs/决策/` 没有状态机、没有归档制度、没有索引——**没有\"被取代的笔记\"这个概念**。\n3. **§7 的语料分类要写两个目录名**（`test/` 与 `tests/` 并存）。上游只面对 `tests` 一种，SSiD 必须同时匹配。\n\n### 2.2 上游引用的 DSH 机制，SSiD 有没有\n\n| 上游引用 | SSiD |\n|---|---|\n| `AGENTS.md`（含 pre-release 立场、tests/Agent Notes are-not-golden-truth 两条信条） | 工作区根 `AGENTS.md` + `seek-soul-in-darkness/AGENTS.md`（**无对应的两条信条**） |\n| `docs/defensive-patterns.md` / `docs/testing.md` / `docs/architecture.md` / `docs/development.md` | **全无**；对应物是 `docs/SSiD开发手册.md`（§9 测试规范 / §7 常见坑）与 **01/03 适配版** |\n| Agent Note 树（`.agents/notes/` + 归档制度 + 索引） | `docs/决策/`（99 个文件），**无状态机、无归档、无索引** |\n| `./invariant` 伴生 | **无** |\n| 依赖政策 Agent Note（`2026-07-26-dependencies-over-hand-rolling.md`） | **无对应记录**；判据本身通用，指向工作区 `AGENTS.md` |\n| `dsh-archive-agent-notes`（§8 引用） | **⛔ 不适用**（该 skill 属四份不适配之一） |\n| `pnpm run doc-sync` / `lint` / `git diff --check` | **无 doc-sync、无 lint**；有 `git diff --check`（pre-commit 钩子）与 L1（typecheck + test） |\n\n---\n\n## 三、逐条适配判断\n\n上游共 **13 个部件**（引言 + 12 个一级小节；另有 1 个二级小节 `### Audit invariant companions` 挂在 §2 下）。\n\n### 1. 引言 → **改写（载体重述）**\n\n上游：*把宽泛的\"找找能简化什么\"变成**有证据的 Agent Note***。\n\nSSiD 版：*把所有\"找找能简化什么\"变成**写在 `docs/决策/` 的提案**，或在提案够格之前先只给证据*。\n\n**逐字保留**两句：*\"It is guidance, not a checklist: follow the code, keep judgment active\"*、***\"prefer a few well-proven candidates over a pile of thin guesses\"***（宁可少而扎实，不要一堆薄猜测）。\n\n**新增一句（有据）**：SSiD 的 `docs/决策/` 目前**没有**简化类记录，所以**第一条这样的记录会是先例**——写的时候要把 §9 的结构写全，它会成为后续的模板。\n\n### 2. `## Start With Repo Context` → **改写（引用换指向）**\n\n上游 3 条：\n\n- 读 `AGENTS.md`（含 pre-release 立场与两条\"不是金科玉律\"信条）+ `defensive-patterns.md` + `testing.md` → SSiD：根与 SSiD 的 `AGENTS.md`、手册 §9（测试规范）与 **01**；**删掉两条信条**（SSiD 没有对应表述，不硬造）\n- 读 `architecture.md` → SSiD：`docs/设计/SSiD-壳级能力设计.md` 与 `docs/决策/2026-09-10-官方桌面壳评估与方案B决策.md`\n- 用 Agent Note 树理解有意为之的架构 + 5 个具体范例 → SSiD：**改为\"先搜 `docs/决策/` 里是否已有相关决策\"**（99 个文件，用关键词搜），**删掉那 5 个 DSH 具体范例**（路径在 SSiD 不存在）\n\n**保留上游最要紧的一条硬约束**（原样）：**默认认为双 LLM 适配器是有意为之的，不要把它当作\"低成本\"删除目标**——除非用户显式推翻。SSiD 的对应保护对象是 **`dsh-memory` 的 storage backend 抽象**与**壳/内核边界**（`shell/main.mjs` ↔ `kernel.bundle.mjs` ↔ profile），简化提案要动它们必须给出比现状更强的证据。\n\n### 3. `## What Counts As A Strong Candidate`（9 条）→ **保留 9 条判据，删 1 个二级小节**\n\n**9 条判据全部保留**（它们与仓库结构无关，是\"什么样的东西算值得删\"的定义），包括：\n\n- 最后一条 **\"简化后行为可以略有不同，但新行为仍然合理且更容易解释\"** —— 这条最重要，它给了简化一个**正当的模糊余地**，避免\"行为必须 100% 等价\"的僵化（那会让绝大多数真实简化被否掉）\n\n**需要本地化的两处**：\n\n- 第 6 条（猜测性产品通用能力）上游列了 DSH 的具体清单（multi-session/session-load、background job rosters、live registry invalidation、mid-turn steering、tool-owned UI rendering）。**SSiD 侧实例清单留白**——不凭空编造，留给实际使用填充，并注明\"留白是有意的\"。\n- 第 7 条含\"invariant\"字样（只为保护未用 API 而存在的不变量）→ 删掉 invariant 一词，保留判据本体（回滚路径 / 期望输出集 / 特例测试）。\n\n**二级小节 `### Audit invariant companions` → 删除**。SSiD 无 `./invariant` 机制（04 §2.1 已核）。**但它有一句通用的该救**：*\"只比较**能独立分叉**的观测才算有用\"* —— **并入第 3 条**（两份表示镜像同一事实），因为那是同一个判断。\n\n### 4. `## Survey Broadly` → **改写（领域清单全换）**\n\n**保留骨架**：用并行 subagent 求广度；给每个 agent 一个**域**并要求**证据而非猜测**；**\"不要让第一个好候选中止普查\"**；从**最大的生产代码差异**开始（大范围审查若止步于显而易见的未用符号，会漏掉那些生命周期或防御机制承载主要成本的文件）。\n\n**5 个域全部换成本地域**（上游是 agent loop / ACP / LLM-tools / Bash / packages）：\n\n| # | SSiD 的域 |\n|---:|---|\n| 1 | **壳与内核边界**：`main.mjs` / `kernel.bundle.mjs` / profile 装载 / splash 与部署流程 |\n| 2 | **插件面**：13 个插件的注册点（storage backend / webServer / tools / slots / sessionProjections）、`cordis.patch.yml`、`dsh.client` 导出面 |\n| 3 | **数据传输与状态**：session projection、storage backend、settings、MCP 注册项 |\n| 4 | **测试与派生物**：`test/` 与 `tests/` 并存、Playwright 截图基线、`lib/` 与 `src/` 同步、vendor 三处副本 |\n| 5 | **文档与规范**：手册、`docs/决策/`（99 个）、插件 README 的重复内容 |\n\n**新增一条（有据）**：**vendor 与 profile-template 的副本是一类特殊候选**——它们是**同步链的产物**（手册 §10：不发布 npm、四份指纹一致、改后必同步运行时实体）。删任何一处都会断链，所以**要么整体处理，要么不动**。上游没有这类约束（DSH 只有 `vendor/` 一处）。\n\n### 5. `## Simplify Prose With The Code` → **保留**\n\n**逐字保留**：注释与文档**是按面积维护的一部分**；删掉复述代码或解释别处已拥有的行为的注释；**保留必需的局部契约**；文档留在其属主层级，略去实现细节与罕见情形，除非它们改变被维护的契约。\n\n指向改为 **03**（`ssid-prose-standard`）。\n\n### 6. `## Audit Trust And Lifecycle Boundaries` → **保留**\n\n**逐字保留**判断框架：对每个防御性拷贝、冻结、验证器与回调捕获，**点名值从哪来、下一个所有者是谁**；同进程的类型化 service/plugin 调用**通常借用只读值**；解析器、配置装载、队列、模型/工具 JSON、持久文件、worker、进程与 wire 解码器**拥有或验证**它们的数据。\n\n**保留那句反直觉的**：*\"围绕敌意 getter、伪造的类型化对象、回调替换、或同进程交接后突变构造的测试，是**可能存在投机契约的证据**，而不是保留它的自动理由。\"*\n\n**要改的**：上游的判据链指向 DSH 的 `defensive-patterns.md` → 改为 **01**（测试可靠性覆盖生命周期/拆除）＋ SSiD 的实际边界（Electron 主进程 ↔ 渲染进程、`kernel` ↔ 插件、MCP 传输、`webServer` 路由）。\n\n### 7. `## Hand-Rolled Code Versus A Dependency` → **保留，政策出处换指向**\n\n**逐字保留 4 条证明要求**：\n\n1. 读手搓实现，**点名该包覆盖的确切表面**；包里没覆盖的残余语义**算作反对交换的依据**并留在提案里\n2. **诚实检查该包的健康度**（维护、采用、传递依赖足迹）；引擎底线已有内置时优先内置\n3. **先查决策记录**：已被记录结论钉住的接缝，交换它必须**胜过那份记录的理由**，而不只是引用政策\n4. **算净删除量**：实现 + 专用测试 + 文档，**减去残留的胶水**；**只是把同样的复杂度搬个家的包装不算赢**\n\n**政策出处**：上游引 `2026-07-26-dependencies-over-hand-rolling.md`（DSH 的 Agent Note）。SSiD 无对应记录 → 改指向工作区 `AGENTS.md`，并**注明\"SSiD 尚无成文的依赖政策，本 skill 落地时应同步补一条\"**。\n\n### 8. `## Prove Or Reject Each Candidate` → **改写（语料定义本地化）**\n\n**保留**：先分类消费者再动笔；先 `rg` 再读调用点；**4 条拒绝条件全部保留**（其中\"想法对但太小 → 加内联 TODO\"依赖 §10，见下）。\n\n**语料三类改为 SSiD 的**：\n\n| 上游 | SSiD |\n|---|---|\n| 生产语料：`packages/*/src`、`examples/*/src`、`examples/**/*.yml`、运行时脚本、loader/config 路径 | **`max-null-plugins/*/src`、`seek-soul-in-darkness/plugins/*/src`、`shell/main.mjs`、`shell/kernel.ts`、`shell/scripts/`、`shell/profile-template/`** |\n| 非生产语料：tests、README/docs、Agent Notes、snapshots、生成的期望输出、注释 | **`test/` 与 `tests/`（两者都要匹配）、`lib/`（派生）、README、`docs/`、Playwright `baselines/`** |\n| 模糊语料：可能是产品冒烟路径的 examples 与脚本 | **`references/`（参考副本）、`.dsh-tmp/`、vendor 副本** |\n\n**搜索工具**：上游用 `rg` → SSiD 同样用 ripgrep ✓（本机可用，本体已多次使用）。\n\n### 9. `## Coalesce Superseded Agent Notes` → **大幅删改（5 步 → 1 步）**\n\n上游 5 步（识别当前 owner → 判断完全/部分取代 → 移交独有理由 → 修入链并三件套同删 → 搜残留）**依赖一整套 SSiD 没有的制度**：状态机、`archived/` 冻结、中英对照三件套、入链门禁。\n\n**SSiD 的对应物只有一个动作**：\n\n> **当一条新决策记录取代了某条旧记录时，在旧记录顶部加一行\"已被 `\u003c新文件名>` 取代\"，并在新记录里链接旧记录。** 不删除（`docs/决策/` 是历史，且没有归档制度来承载\"冻结\"语义）。\n\n**保留上游那句边界**（逐字）：**\"不要把每次代码简化普查都扩大成全仓库的笔记审计\"**。\n\n**明确不做的**：上游的\"完全取代 vs 部分取代\"细分、理由移交清单、入链修复、三件套同删——**SSiD 没有可移交的落点，也没有三件套**。硬搬会让 agent 去修不存在的链接。\n\n**保留上游的一条判断（有据且通用）**：*\"先移除后加回\"的功能是典型的完全取代案例*——但只有当该功能确已从生产代码、配置、schema、持久或 wire 格式、迁移与兼容行为中消失时，移除记录才可以独占其历史。\n\n### 10. `## Write The Agent Note` → **改写为「写决策记录」**\n\n上游的落点是 `.agents/notes/\u003clifecycle>/\u003cclass>/yyyy-mm-dd-topic.md` + `Status: proposed` + 7 条建议结构。\n\n**SSiD 落点**：`docs/决策/YYYY-MM-DD-\u003c标题>.md`（无 lifecycle 目录、**无 Status 字段**）。\n\n**7 条建议结构保留 6 条**（把 `Status: proposed` 去掉，其余照搬）：\n\n1. `# \u003c动作导向的标题>`\n2. `## 问题`：点名当前 API、引用相关文件、陈述消费者证据；**把生产调用方与测试/文档分开**\n3. `## 提案`：确切说明要**移除、折叠、降级还是换位**；相关时含测试、文档、README、JSDoc、快照与生成文件的清理\n4. `## 为什么不保留它？` 或 `## 我们放弃了什么`：**让最强的反方论证可被看见**\n5. `## 验收标准`：可观察的终态与门禁\n6. `## 风险`：公开 API 变更、行为变更、未来产品需求，以及为何这笔权衡仍然合理\n\n**保留上游的收尾约束**：具体到\"一个实施者能顺着痕迹走下去\"；**避免\"简化这个包\"这类含糊提案**；与既有记录重叠时，**把有用的细节并入既有记录而不是新建重复**。\n\n### 11. `## Inline TODO Notes` → **保留判据 + 标注现状空白**\n\n**逐字保留**：内联 TODO/FIXME/XXX **只用于小而局部、明显有用但不是持久设计决策**的清理；**用稳定标签点名异味**（如 `TODO(double-default)`、`XXX(unused-default)`）；**说明为什么可以安全重访、什么动作会简化它**；**不要为投机性抱怨或需要记录级决策的行为加 TODO**。\n\n**必须新增的现状说明**（有据）：**SSiD 目前零 TODO 标记**，待办集中在手册的「待办清单」节。所以：\n\n- 若采用内联 TODO，**要先定紧迫度语义**（上游有 `FIXME`/`TODO`/`XXX` by urgency 的文档，SSiD 无）——**这是落地时的一个前置决定，不是可以直接照抄的**\n- 否则 §7 的\"想法对但太小 → 加内联 TODO\"这条拒绝条件的**出口是空的**，会变成\"想法对但太小 → 忘掉它\"\n\n### 12. `## When Folding Another PR Or Branch` → **降权保留**\n\n上游 5 条依赖 GitHub PR/stack 工作流。SSiD 无 PR（04 §一已定），**但有给上游提 PR 的真实场景**（2 次先例）。\n\n**保留为\"次场景\"**：向 DSH 或第三方插件提 PR 前，diff 对照 `origin/master` 而非当前分支；移植达标的记录、把重叠材料并入既有记录、**不为凑数移植低置信度提案**、更新 PR 描述让评审者看到真实计数。\n\n**删掉**：\"关闭重复 PR\"（SSiD 不拥有上游仓库的 housekeeping）。\n\n### 13. `## Validation And PR Hygiene` → **改写（门禁换名）**\n\n上游：docs-only 至少跑 `pnpm run doc-sync` + `lint` + `git diff --check`；代码注释或 skill 改动另跑相关验证器。\n\n**SSiD 版**：\n\n| 上游 | SSiD |\n|---|---|\n| `pnpm run doc-sync` | **无** → 改为\"改动文档后重跑受影响的 L1\" |\n| `pnpm run lint` | **无** |\n| `git diff --check` | **命令可用，但没有钩子替你跑它**——本仓库**零自定义 git 钩子**（`core.hooksPath` 未配置、默认 hooks 目录零命中；06 §2.2 实测）。**要跑就手动跑** |\n| pre-push hook 只贡献 typecheck | **删**（本仓库无任何钩子） |\n\n> **更正留痕**：本节第一版写的是「`git diff --check` 有 pre-commit 钩子」与「SSiD 有 pre-commit」——**错的**。写本说明时尚未核实钩子状态，是**假设**了 DSH 的形态。06 的实测推翻它：本仓库两个钩子都没有。**这是\"未核实就写\"的又一例**（与 01 §三.1 的「这些文档都不存在」同类）。\n\n**保留**：PR 摘要四要素（新增/合并/部分取代/删除的记录数、主要普查域、有意排除的内容、跑过的检查）；每个合并组要点名新旧 owner 与完全取代的证据。\n\n---\n\n## 四、汇总：改动清单\n\n| 动作 | 数量 | 具体 |\n|---|---:|---|\n| **原样保留** | 4 部件 | §2 的 9 条判据主体、§4、§5、§6（依赖交换 4 条证明） |\n| **改写** | 7 部件 | 引言（载体）、§1（引用）、§3（领域清单）、§7（语料定义）、§9（→ 写决策记录）、§11（降权）、§12（门禁） |\n| **大幅删改** | 1 部件 | §8（5 步 → 1 步，因 SSiD 无状态机/归档/三件套） |\n| **保留 + 标注空白** | 1 部件 | §10（内联 TODO：判据保留，现状零命中须写明） |\n| **删除** | 0 部件 | 无（二级小节 `Audit invariant companions` 删除并救回一句并入 §2） |\n\n> **算术核对**：引言 1 + 一级小节 12 = **13 个部件**；4 + 7 + 1 + 1 = **13** ✓\n\n**净判断**：判据主体（9 条候选定义、4 条拒绝条件、4 条依赖证明、9 条消费者分类骨架）**一条不减**；删改集中在**依赖 DSH 制度的三处**（invariant 二级小节、Agent Note 合并 5 步、门禁命令）。\n\n---\n\n## 五、落地结构\n\n```\n@max-null/dsh-skills/skills/ssid-find-simplifications/\n├── SKILL.md        # 预计 140–165 行（上游 157，删制度相关、补 SSiD 域与 vendor 约束）\n└── SOURCE.md\n```\n\n**命名**：`ssid-find-simplifications`。\n\n**description 建议**（**只写触发条件**）：\n\n> 在需要找出非显然的简化候选、清除冗余注释或实现导向的文档、为简化提案写决策记录、补内联清理标记，或把另一个分支里值得采纳的简化想法并入当前工作时使用；尤其针对已死、重复、投机、过度构建、加了又删、以及本可交给依赖却手搓的表面。\n\n**依赖声明**：引用 **01**（生命周期与拆除判据）、**03**（涉及行文时）。三者同批进包。\n\n---\n\n## 六、SOURCE.md\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | dsh-find-simplifications |\n| 上游路径 | DSHfork/.agents/skills/dsh-find-simplifications/ |\n| 上游版本锚点 | c291e7961a（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 157 行（无 references） |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 需适配（依赖制度的 3 处删改 + 语料与域本地化） |\n| 依赖 | 引用 01、03（同批进包） |\n\n---\n\n## 七、待确认\n\n1. **要不要给 SSiD 定内联 TODO 的紧迫度语义**？上游有 `FIXME`/`TODO`/`XXX` by urgency（`docs/development.md`），SSiD 无。**不定的话，§7 那条\"想法对但太小\"的出口就是空的**——参见 §三.11。\n2. **`docs/决策/` 要不要引入状态字段**？上游有 `Status: proposed` 与 lifecycle 目录。SSiD 现在靠文件名日期与正文自述。**这是 04 §三.4（决策记录与已交付现实一致）与 05 §三.9（取代标记）共同的前提**，建议一并决定。\n3. **测试目录命名要不要统一**？9 个 `tests/` 与 3 个 `test/` 并存（§2.1）。这是独立于 skill 的清理项，但它直接影响本 skill §7 的语料定义——**适配版会写\"两个都要匹配\"，若统一了则应简化**。\n4. **SSiD 的依赖政策要不要成文**？§三.7 的 4 条证明要求已保留，但\"该不该引入依赖\"的上位政策在 SSiD 无成文记录。\n\n---\n\n## 八、数字自检（命令产出，可复现）\n\n```powershell\n$up = 'DSHfork\\.agents\\skills\\dsh-find-simplifications'\n@(Get-Content \"$up\\SKILL.md\").Count                                        # 157\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^## ').Count                  # 12  一级小节\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^### ').Count                 # 1   二级小节\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^\\d\\. ').Count                # 5   §8 编号步数\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^- ').Count                   # 50  全篇列表项\n\n# 分节计数（按标题定位，不凭印象）\n$l = Get-Content \"$up\\SKILL.md\"\n$s=($l|Select-String '^## What Counts As A Strong Candidate'|Select -First 1).LineNumber\n$e=($l|Select-String '^## Survey Broadly'|Select -First 1).LineNumber\n@($l[$s..($e-2)] | Select-String '^- ').Count                              # 9   strong candidate 判据\n$s7=($l|Select-String '^## Prove Or Reject'|Select -First 1).LineNumber\n$e7=($l|Select-String '^## Coalesce Superseded'|Select -First 1).LineNumber\n@($l[$s7..($e7-2)] | Select-String '^- ').Count                            # 7   §7 条目\n$s9=($l|Select-String '^## Write The Agent Note'|Select -First 1).LineNumber\n$e9=($l|Select-String '^## Inline TODO'|Select -First 1).LineNumber\n@($l[$s9..($e9-2)] | Select-String '^- ').Count                            # 7   §9 建议结构\n\n# SSiD 侧\n@(Get-ChildItem 'max-null-plugins' -Recurse -Include *.ts -File |\n   Where-Object { $_.FullName -notmatch 'node_modules|\\.build' } |\n   Select-String -Pattern 'TODO\\(|FIXME|XXX\\(').Count                      # 0   无内联标记\n@(Get-ChildItem 'seek-soul-in-darkness\\docs\\决策' -File -Filter '*.md').Name |\n   Where-Object { $_ -match '简化|清理|重构|瘦身|去重' }                    # 0   无简化类记录\n```\n\n**自查记录**：本说明未发现数字错误（**先跑命令再写**，与 04 同）。**三个零命中与一个不一致都是命令产出的**，不是目测。\n"},{"file":"2026-09-10-skill适配说明-06-推送前检查.md","date":"2026-09-10","slug":"skill适配说明-06-推送前检查","title":"skill 适配说明 06：推送前检查","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-skills","dsh-pre-push-checks","dsh-skills","ssid-pre-push-checks","dsh-hooks","dsh-lefthook-owned"],"summary":"也就是说上游的模型是：本地钩子只做很小的事 → 你按变更选最小检查集 → CI 兜底穷尽覆盖与平台矩阵。所以\"选最小集\"是安全的，因为有兜底。","bytes":18737,"lines":269,"body":"# skill 适配说明 06：推送前检查\n\n> **本说明的地位**：它是适配工作的**依据**，不是 skill 本身。格式见 `2026-09-10-skill适配说明-写作规则.md`。\n\n> 状态：进行中（推断 · 2026-09-12）\n\n**上游 skill**：`dsh-pre-push-checks`\n**上游位置**：`DSHFork/.agents/skills/dsh-pre-push-checks/`\n**上游版本锚点**：`c291e7961a`（2026-09-10 抓取，与前批同）\n**上游体量**：SKILL.md 128 行（**无 references**）= 128 行\n**清点分类**：`🔧 需适配`\n**拟落点**：`@max-null/dsh-skills` 的 `skills/ssid-pre-push-checks/`\n\n---\n\n## 一、为什么做这一个（以及一个反转的前提）\n\n### 1.1 上游的全部逻辑建立在一句前提上\n\n> **\"Git hooks are intentionally narrow: pre-commit fixes staged lint, checks staged whitespace, and guards vendored-source metadata; pre-push runs only the incremental repository typecheck. CI owns exhaustive coverage and the platform matrix.\"**\n\n也就是说上游的模型是：**本地钩子只做很小的事 → 你按变更选最小检查集 → CI 兜底穷尽覆盖与平台矩阵**。所以\"选最小集\"是**安全的**，因为有兜底。\n\n### 1.2 SSiD 的这条前提**整个不存在**（已核实，见 §2.2）\n\n- **零 git 钩子**\n- **CI 只有 mac 打包，不跑任何测试**，且只在 `push tag` 时触发（推分支不触发）\n- **无覆盖率配置**\n\n**所以适配后的第一原则要反转**：\n\n> 上游：*There is no universal local baseline beyond the hooks.*（除钩子外没有通用本地基线）\n> **SSiD：没有任何本地基线，也没有 CI 兜底——你选的检查就是这次改动仅有的证据。**\n\n这不是措辞差异，是**风险等级差异**。它抬高的是\"选择\"的分量：漏选一个检查不会有人替你发现。\n\n### 1.3 一个系统性发现\n\n把本轮与前几轮的核实拼起来，SSiD 的**质量兜底是全面缺席的**：\n\n| 兜底机制 | DSH | SSiD | 核实处 |\n|---|---|---|---|\n| pre-commit / pre-push 钩子 | 有（`core.hooksPath=.git/dsh-hooks`，lefthook 管理，含 `pre-commit`/`pre-merge-commit`/`pre-push`） | **无** | 本说明 §2.2 |\n| CI 跑测试 | 有（穷尽覆盖 + 平台矩阵） | **无**（只打包） | 本说明 §2.2 |\n| 文档门禁 | `doc-sync` 等一批 | **无** | 02 §2.3 |\n| 覆盖率配置 | per-file 100% | **无** | 本说明 §2.2 |\n\n**这条发现不属于某个 skill**，但它决定了 01/02/06 三份适配版都要把\"**没有东西替你兜底**\"写进正文——否则 agent 会沿用上游的心智模型（\"反正 CI 会抓\"），而那个假设在 SSiD 是假的。\n\n---\n\n## 二、SSiD 侧现状（已核实）\n\n### 2.1 上游引用的命令，SSiD 有没有\n\n| 上游命令 / 机制 | SSiD | 备注 |\n|---|---|---|\n| `pnpm --silent run change-scope --base \u003cref>` | **无**（`shell/scripts/` 只有 5 个脚本） | 用 `git diff --stat \u003cbase>` 替代，但**必须说明它不给\"脏层\"** |\n| 钩子（pre-commit 修 lint / 查空白；pre-push 增量 typecheck） | **两者都无** | 见 §2.2 |\n| `pnpm run doc-sync` | **无** | — |\n| `pnpm run build` + hygiene + built-artifact smoke | 部分：`npm run bundle-kernel` / `npm run pack` 存在 | — |\n| `pnpm run test:e2e` | **无** | — |\n| 顶部 `snapshots/` + `snapshot.yml` 规则 | **无** | 对应物是 Playwright 截图基线（`shell/tests/plugin-adapt/baselines/`） |\n| `apps/cli/tests/profiles/` 放置规则 | **无** | — |\n| Vitest per-file 100% 覆盖率 + `--coverage.include` | **无覆盖率配置** | 见 §2.2 |\n| `gh stack push` / `gh stack sync` | **无**（不用 GitHub stacks） | — |\n| `gh pr checks` / `gh pr view --json mergeable` | 命令可用，但**对 SSiD 自己的分支无意义**（CI 不随 push/PR 触发） | 给上游提 PR 时适用 |\n\n### 2.2 本轮的三项实测\n\n| 检查 | 结果 |\n|---|---|\n| `git config --get core.hooksPath`（SSiD） | **空**（未配置；DSH 是 `.git/dsh-hooks`） |\n| `.git/hooks` 下非 `.sample` 文件 | **零** |\n| lefthook / husky 配置 | **无** |\n| `.github/workflows/` | **仅 `build-mac.yml`**（107 行）：检出 → 装依赖 → `prepare-runtime.mjs` → icns → `pack:mac` → 上传产物。**无任何测试步骤** |\n| `build-mac.yml` 触发条件 | `workflow_dispatch` 或 `push: tags: ['v*']`——**推分支不触发** |\n| 覆盖率配置（`package.json` / `vitest.config.ts` 里的 `coverage`） | **零命中** |\n| SSiD 仓库根 | **无 `package.json`**——所有 npm 命令须在 `shell/` 下跑 |\n\n**最后一条是操作陷阱**：SSiD 的仓库根没有 `package.json`，`npm test` 在根目录会失败。上游从来不需要面对这种分层（DSH 是 pnpm workspace，根有 package.json）。\n\n---\n\n## 三、逐条适配判断\n\n上游共 **7 个部件**（引言 + 6 个一级小节；另有 2 个二级小节 `### Focus unit coverage on the affected source`（挂 §2）与 `### Post-sync validation`（挂 §4））。\n\n### 1. 引言 → **改写（前提反转）**\n\n**保留**：*\"Use this skill to run relevant local evidence **once** before a push.\"*（关键在 **once**——不重复已通过的）。\n\n**改写**：把\"钩子很窄 + CI 兜底\"整段换成 §1.2 的反转表述。**删掉** `gh stack sync` 是唯一顺序例外那句（SSiD 不用 stacks）。\n\n**新增**（有据）：**SSiD 的仓库根无 `package.json`，命令须在 `shell/` 下执行**——这是上游没有的操作前提。\n\n### 2. `## Inspect the outgoing change` → **改写（基准确认换工具）**\n\n**保留**：\n\n- 确认 checkout 与分支（`git status --short --branch` / `git rev-parse --show-toplevel`）\n- **\"绝不猜测或抓取 base\"** —— 上游原文 *\"The command never guesses or fetches a base\"*。改述为 SSiD 可执行的形式：**先确认比较基准（上次发版 tag 或目标分支的实时 ref），不要想当然用 `origin/master`**。SSiD 有 **19 个 release tag** 可作基准候选（`git tag` 实测；最近的是 `v0.2.1`）\n- 合并了变化后的 base 之后：**重跑范围报告、重估合并后的范围能影响什么行为、只重跑被合并失效的检查**（逐字保留）\n\n**替换**：`change-scope` → `git diff --stat \u003cverified-base>..HEAD` + 受影响插件清单。**必须注明\"这不是 change-scope 的等价物：它给路径，不给受影响包与脏层\"**。\n\n### 3. `## Select relevant evidence` → **改写（核心判据保留，8 类全换）**\n\n**保留的三条核心判据**（逐字）：\n\n1. **除钩子外没有通用本地基线** → SSiD 版：**连钩子都没有**（§1.2）\n2. **每个行为变更需要最窄的、可获得的、会因该回归失败的测试或专用检查；只在 diff 真正触及的表面加更广的检查**\n3. **不要因为 commit 或 push 在即就手动重复已通过的检查**（尤其不要为了重复 pre-push 钩子而在推送前跑 typecheck —— **SSiD 没有该钩子，所以这条变成\"不要无理由重复\"**）\n\n**保留的入口纪律**：当改动涉及**拥有资源的或异步的测试、fixture、helper 或 CI 执行路径**时，**先读 01** 判断是否适用恢复 / 负向控制 / 静默拆除 / 并发进程证据；本 skill 仍负责选命令、并避免重复已通过的证据。\n\n**8 类具体检查全部换成本地域**：\n\n| 上游类型 | SSiD 对应 |\n|---|---|\n| 包或脚本行为：跑属主 Vitest 文件或聚焦用例名 | **跑属主测试**：`shell/` 是 node:test（`npm run test:profile-merge` 等）；插件按各自 runner（vitest 或 node:test，见 01 §2.1）。**注意 9 个插件用 `tests/`、3 个用 `test/`** |\n| Remote mock 类型：跑 `pnpm run typecheck`，把异常留在 test proxy | **删**（SSiD 无 Remote mock 机制）。**但保留通用判据**：**\"未构建的 `any` 是显式的本地退让，不是严格证据\"** → 对应 SSiD 的 `lib/` 是派生物：改 `src/` 后要跑 `npm run typecheck` 与构建 |\n| 文档 / Agent Note / 目录 / 文档链接注释：跑 `doc-sync` | **无 doc-sync** → 改为 **03** 的行文判据（人工语义核）+ 相关链接的可用性检查 |\n| 模型/编辑器/CLI/终端可见输出：跑聚焦的无密钥快照或真实可运行示例 | **对应 Playwright 截图基线**（`cd shell/tests/plugin-adapt && npm test`）。**保留\"基线变了要问为什么变\"的纪律**（上游：*\"Review expected-output diffs as behavior changes, not formatting noise\"*） |\n| 期望输出放置：`snapshots/` 与 `tests/expected/` 的区分 | **删**（SSiD 无该制度） |\n| Profile 与配置放置：`apps/cli/tests/profiles/` | **改写**：SSiD 的对应物是 **`shell/profile-template/`**——**改它必须同时跑 `node scripts/prepare-runtime.mjs` 并核对三处 vendor 全等**（手册 §10 双处声明 + vendor 四份指纹一致） |\n| 包清单 / 公开导出 / 构建配置 / worker 或 bin 入口 / 构建产物路径：跑 `build` + hygiene + built smoke | **保留并本地化**：改 `package.json` 的 `main`/`exports`/`dsh.client` → 跑 `npm run build`（tsdown）+ `npm run typecheck`；改 `cordis.patch.yml` → 核对插件在 profile 中可装载 |\n| 真实 provider 或 agent 行为：跑 `test:e2e`（有凭据时），**绝不打印密钥** | **保留原则**：**\"绝不打印密钥\"逐字保留**；SSiD 的对应面是 MCP 服务器与真实模型调用 |\n\n**二级小节 `### Focus unit coverage on the affected source` → 删（无覆盖率配置）**\n\n**但必须救回两句**（它们与覆盖率机制无关）：\n\n1. **\"测试选择与覆盖率选择是两件事\"** —— 一个文件过滤器决定跑哪些测试，配置决定量哪些源码\n2. **\"不要用 `--passWithNoTests`、降低阈值、或缩小覆盖面来**掩盖**一个未覆盖的受影响文件\"** —— 这是**反作弊条款**，与有没有覆盖率配置无关\n\n**救回的形式**：并入 §3 正文，作为\"选测试时的两条禁令\"。\n\n### 4. `## Full local rehearsal` → **保留（并调整阈值说明）**\n\n**逐字保留三种情况**：用户显式要求 / 诊断 CI 失败 / 变更横跨全仓以致没有更窄的集合可信。\n\n**保留**：*\"Use the current workflow and package scripts as the inventory; do not recreate the removed `check:pre-push` aggregate.\"* → SSiD 版：**以 `shell/package.json` 的 scripts 为清单，不要自造聚合命令**。\n\n**新增（有据）**：因为**没有 CI 会替你在推送后发现问题**，SSiD 的\"横跨全仓\"阈值**应当比上游低**——触及**壳/内核边界**（`shell/main.mjs` ↔ `kernel.bundle.mjs` ↔ profile）或**同时改多个插件**时，倾向按全量排练处理。\n\n### 5. `## Protect history-rewriting pushes` → **改写（保留 lease 铁律，删 stacks）**\n\n**逐字保留的核心**（这是本 skill 最硬的一条）：\n\n> 重写独立分支的历史前，抓取当前远端分支并**记录它的确切 OID**；用 **`--force-with-lease=\u003cbranch>:\u003cobserved-oid>`** 发布，使并发更新中止推送。**Raw `--force` 永不允许。**\n\n**保留**：**\"任何重写推送之后，重新抓取实时 head，并重新审计未解决的评审线程、批准、可合并性、检查——重写之前的 commit hash 与行内评论锚点不是当前证据。\"**\n\n**删除**：`gh stack push` / `gh stack sync` 相关（SSiD 不用 GitHub stacks），因此**二级小节 `### Post-sync validation` 整节删除**（它的 4 步与后续修复流程全部围绕 stack sync）。\n\n### 6. `## Handle failures` → **保留**\n\n**逐字保留**：若相关检查在普通推送前失败，**停下并修复或解释阻塞**；**不要\"推上去然后指望 CI 结果不同\"**（这条在 SSiD 更硬——CI 本来就不会告诉你）。\n\n**保留环境特定失败的证明流程**：记录确切命令、失败用例与平台特定差异；确认相关的非平台证据；**该检查必需时优先修复跨平台不确定性**；**只有用户显式要求或同意时才绕过本地钩子**，并报告究竟什么失败、为什么预期 CI 会不同（SSiD 无钩子，此条改写为\"绕过任何自定义检查\"）。\n\n### 7. `## Push procedure` → **改写（保留 mergeability 诊断）**\n\n**保留四步**：跑一次选定的检查 → 正常提交并**在继续之前检查 pre-commit 修复器改过的文件**（SSiD 无 pre-commit 修复器 → 改为\"检查格式化/生成步骤改过的文件\"）→ 推送（或对已授权重写分支用确切 lease）→ **验证远端 ref 与本地 `HEAD` 一致**（`git rev-parse HEAD origin/$(git branch --show-current)` 逐字保留）。\n\n**保留那段极有价值的诊断**（上游 §120-126）：当 `gh pr checks` 报 \"no checks reported\" 且 `/actions/runs?head_sha=\u003csha>` 返回 `total_count: 0` 时，**先读可合并性再怀疑推送或 GitHub 丢事件**：\n\n```sh\ngh pr view \u003cnumber> --json mergeable,mergeStateStatus\n```\n\n> **GitHub 在 PR 处于 `CONFLICTING`/`DIRTY` 时不创建 `pull_request` 工作流运行，所以缺失的信号就是冲突本身，不是基础设施问题。** 解决冲突是唯一的修法；空提交、`--allow-empty` 推送、draft/ready 翻转、撤销再恢复都会让 `total_count` 保持为零并增加垃圾历史。\n\n**这条判据的适用边界要写清**：SSiD 自己**没有 `pull_request` 工作流**（CI 只在 tag 触发），所以这段**对 SSiD 的分支不适用**；它适用于**给 DSH 或第三方提 PR 时**。\n\n**删掉**末尾 `gh stack sync` 那句。\n\n---\n\n## 四、汇总：改动清单\n\n| 动作 | 数量 | 具体 |\n|---|---:|---|\n| **原样保留** | 2 部件 | §4（全量排练三条件）、§5（失败处理与平台证明） |\n| **改写** | 5 部件 | 引言（前提反转）、§2（基准工具）、§3（8 类检查 + 救回两条禁令）、§5（lease 保留、删 stacks）、§7（推送流程 + mergeability 适用边界） |\n| **删除** | 0 部件 | 无（2 个二级小节删除，其中 §2 的救回两条禁令并入正文） |\n\n> **算术核对**：引言 1 + 一级小节 6 = **7 个部件**；2 + 5 = **7** ✓\n\n**净判断**：三条核心判据（最小可失败检查、once 不重复、--force-with-lease 铁律）**一字不减**；删改集中在 DSH 专有的 `change-scope`、stacks、覆盖率机制与放置规则。\n\n---\n\n## 五、落地结构\n\n```\n@max-null/dsh-skills/skills/ssid-pre-push-checks/\n├── SKILL.md        # 预计 105–125 行（上游 128，删 stacks 与 DSH 命令，补\"无兜底\"前提）\n└── SOURCE.md\n```\n\n**命名**：`ssid-pre-push-checks`。\n\n**description 建议**（**只写触发条件**）：\n\n> 在推送、强制推送、声称检查通过之前，或在标签发版与上游 PR 推送之后使用——用于为出站改动选出**最小的**测试与检查集合，而不是反射性地跑全仓套件。\n\n**依赖声明**：引用 **01**（测试可靠性）、**03**（文档改动时）。同批进包。\n\n---\n\n## 六、SOURCE.md\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | dsh-pre-push-checks |\n| 上游路径 | DSHfork/.agents/skills/dsh-pre-push-checks/ |\n| 上游版本锚点 | c291e7961a（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 128 行（无 references） |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 需适配（前提反转 + 命令与放置规则本地化 + 删 stacks） |\n| 依赖 | 引用 01、03（同批进包） |\n\n---\n\n## 七、待确认\n\n1. **要不要给 SSiD 加最小 CI（推分支跑 typecheck + 测试）**？这是本说明挖出的**最大单项风险**：现在**推分支完全不触发 CI**，而本地又无钩子 → **代码可能在没有跑过任何检查的状态下进入仓库**。加一个 20 行的 workflow 就能把这条风险关掉。属独立任务，但它决定 06 的长期价值。\n2. **要不要接 `core.hooksPath` 钩子**？DSH 用 lefthook 管理一套窄钩子。SSiD 若无 CI，钩子就是唯一的自动闸门。\n3. **`shell/tests/plugin-adapt/baselines/` 的截图基线要不要进 `.gitignore` 审查**？截图基线与上游的 `snapshots/` 同类（派生物但需要被评审）——上游对这类有明确的\"放置 + 谁拥有\"规则，SSiD 目前只有 `.gitignore` 里三条排除项。\n\n---\n\n## 八、数字自检（命令产出，可复现）\n\n> **生成 skill 时补核（2 处）**：\n> 1. 本章第一版写「SSiD 有 18 个 release tag」，`git tag` 实测为 **19**（`v0.1.0`–`v0.2.1`，缺 `v0.1.4`）。已就地更正。\n> 2. 顺带发现：`docs/release-notes-v0.2.2.md` **存在但 `v0.2.2` 未打 tag**（tag 止于 `v0.2.1`）。这是仓库状态而非判据问题，记录备查。\n\n```powershell\n$up = 'DSHfork\\.agents\\skills\\dsh-pre-push-checks'\n@(Get-Content \"$up\\SKILL.md\").Count                                    # 128\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^## ').Count              # 6   一级小节\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^### ').Count             # 2   二级小节\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^\\d\\. ').Count            # 10  编号项\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^- ').Count               # 12  列表项\n\n# SSiD 侧\ngit -C 'seek-soul-in-darkness' config --get core.hooksPath              # 空（未配置）\ngit -C 'seek-soul-in-darkness' rev-parse --git-path hooks               # .git/hooks\n@(Get-ChildItem 'seek-soul-in-darkness\\.git\\hooks' -File |\n   Where-Object { $_.Name -notlike '*.sample' }).Count                  # 0   无钩子\n@(Get-ChildItem 'seek-soul-in-darkness\\.github\\workflows' -File).Count  # 1   仅 build-mac.yml\n@(Get-Content 'seek-soul-in-darkness\\.github\\workflows\\build-mac.yml').Count   # 107\nTest-Path 'seek-soul-in-darkness\\package.json'                          # False\n\n# 对照：DSH 的钩子配在别处（本轮曾差点踩坑）\ngit -C 'DSHFork' config --get core.hooksPath                            # .git/dsh-hooks\n@(Get-ChildItem 'DSHFork\\.git\\dsh-hooks' -File |\n   Where-Object { $_.Name -notlike '*.sample' }).Name                   # pre-commit / pre-merge-commit / pre-push / .dsh-lefthook-owned\n```\n\n**自查记录（本轮踩到一个真陷阱，留痕）**：\n\n我最初查 DSH 钩子时只看 `.git/hooks`，**得到\"DSH 也没有钩子\"的错误结论**——实际是 `core.hooksPath` 指向了 `.git/dsh-hooks`。\n\n> **由此加一条写作规则（已并入 `写作规则` §三）**：**检查\"某机制是否存在\"时，默认位置查不到不等于不存在**。凡涉及\"有没有 X\"的否定结论，必须查配置解析后的**实际路径**（`git rev-parse --git-path \u003cname>` 一类），而不是默认目录。SSiD 的\"无钩子\"结论是**经过这条程序**得出的（`core.hooksPath` 为空 + 默认目录零命中，两条都查了）。\n"},{"file":"2026-09-10-skill适配说明-07-性能优化.md","date":"2026-09-10","slug":"skill适配说明-07-性能优化","title":"skill 适配说明 07：性能优化","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-skills","dsh-speed-up-perf","dsh-skills","ssid-speed-up-perf","dsh-ci-test-reliability","dsh-pre-push-checks","dsh-runtime","dsh-find-simplifications"],"summary":"上游开场就划清了界线：把一个宽泛的\"让它更快\"请求变成可复现的用户路径测量与小的、有证据的修复……这是指导，不是配额也不是脚本：广泛普查、跟随实测成本、并拒绝那些看起来诱人但没有改善用户真正运行的工作负载的改动。 它最有价值的产出不是那 7 条优化模式，而是测量卡（§3 的 7 个字段）：用户操作 / 工作负载 / 入口路径 / 时钟 / 内存 / 裁决 / 行为。有了这张卡，\"更快\"才是一个可证","bytes":18024,"lines":245,"body":"# skill 适配说明 07：性能优化\n\n> **本说明的地位**：它是适配工作的**依据**，不是 skill 本身。格式见 `2026-09-10-skill适配说明-写作规则.md`。\n\n> 状态：进行中（推断 · 2026-09-12）\n\n**上游 skill**：`dsh-speed-up-perf`\n**上游位置**：`DSHfork/.agents/skills/dsh-speed-up-perf/`\n**上游版本锚点**：`c291e7961a`（2026-09-10 抓取，与前批同）\n**上游体量**：SKILL.md 92 行（**无 references**）\n**清点分类**：`🔧 需适配`\n**拟落点**：`@max-null/dsh-skills` 的 `skills/ssid-speed-up-perf/`\n\n---\n\n## 一、为什么做这一个\n\n### 1.1 它是一份「测量纪律」，不是一份「优化技巧」\n\n上游开场就划清了界线：*把一个宽泛的\"让它更快\"请求变成**可复现的用户路径测量**与**小的、有证据的修复**……这是指导，不是配额也不是脚本：广泛普查、跟随实测成本、**并拒绝那些看起来诱人但没有改善用户真正运行的工作负载的改动**。*\n\n它最有价值的产出不是那 7 条优化模式，而是**测量卡**（§3 的 7 个字段）：用户操作 / 工作负载 / 入口路径 / 时钟 / 内存 / 裁决 / 行为。**有了这张卡，\"更快\"才是一个可证伪的命题。**\n\n### 1.2 SSiD 的现状：有性能面，但没有测量基建\n\nSSiD 是 Electron 桌面壳，**有真实性能面**（启动到可用、大会话装载、导航条与面板响应、内核升级带来的影响）。但实测（§2.1）：**没有 benchmarks 目录、没有任何基准或性能脚本、手册里没有性能节**。\n\n所以本 skill 在 SSiD 与 05 同类——**引入新能力**。差别在于：05 缺的是\"提案纪律\"，07 缺的是**测量基建本身**。上游 §3 那句 *\"扩展现有的必需 lane，而不是创建竞争性的校准或报告基建\"* 在 SSiD **无法照做**（没有可扩展的 lane），必须改成\"**先建最小测量骨架，再谈优化**\"。\n\n---\n\n## 二、SSiD 侧现状（已核实）\n\n### 2.1 性能基建：几乎为零\n\n| 检查 | 结果 |\n|---|---|\n| `seek-soul-in-darkness/benchmarks/` 目录 | **不存在** |\n| 全库 `*bench*` / `*perf*` 文件名（排除 node_modules/vendor/runtime/.build） | **零命中** |\n| `docs/决策/` 里的性能类记录 | **仅 1 个**：`2026-08-17-v0.1.4追加优化-plugincenter与圆角与伪3D.md`（UI 优化，非测量基准） |\n| 手册中的性能节 | **零命中**（搜「性能 / 启动时间 / 响应」） |\n\n**结论：SSiD 没有任何可复用的测量基建**。上游 §3 的全部前置（`benchmarks/AGENTS.md`、既有必需 lane、共享时间校准、已复核的方差余量、Node 机器乘数）在 SSiD **一个都不存在**。\n\n### 2.2 上游引用的机制对照\n\n| 上游引用 | SSiD |\n|---|---|\n| `benchmarks/AGENTS.md` + 性能门禁决策记录 | **无** |\n| `docs/architecture.md` / `testing.md` / `defensive-patterns.md` | **无**；对应 `docs/SSiD开发手册.md`（§9 测试规范）与 01/03 |\n| `dsh-ci-test-reliability` | → **01** ✓ |\n| `dsh-pre-push-checks` | → **06** ✓ |\n| Agent Note rules | → `docs/决策/`（无状态机，见 03 §2.2） |\n| 官方 GitHub stacks + 独立 worktree | **无**（SSiD 不用 stacks；worktree 在工作区里用过，但非标准流程） |\n| CI 性能门禁 / 平台矩阵 | **无 CI 跑测试**（06 §2.2 已核） |\n\n---\n\n## 三、逐条适配判断\n\n上游共 **6 个部件**（6 个一级小节，无二级、无编号项）。\n\n### 1. `## Establish scope and current authority` → **改写（引用换指向）**\n\n**逐字保留的三条**：\n\n1. **\"同意\"清单**：用户可见的端点、工作负载范围、资源约束、可接受的微小行为差异、**停止规则**。**\"停止规则\"要保留——它是防止性能工作无限蔓延的唯一闸门。**\n2. **后端与浏览器端到端测量必须分开**：*\"快的历史迭代器或 Client 折叠**不能证明**传输、绘制、滚动或输入响应快。\"*\n3. **测量本地开销时排除模型/网络延迟，并且要**陈述这个排除**，而不是把结果称为完整的产品延迟。**\n\n**SSiD 本地化**：\n\n- 上游的\"后端 / 浏览器\"两分 → SSiD 是**四层**：**主进程（`main.mjs`）/ 内核（`kernel.bundle.mjs` + DSH）/ 渲染进程（Web UI）/ 磁盘与归档（profile、`dsh-runtime.tar.gz`）**。跨层推断（\"主进程快了所以界面快了\"）与上游禁止的\"Node 折叠证明浏览器响应\"是同一类错误。\n- **启动时间要定义终点**：SSiD 的启动有多个可观察点（进程起、splash 出现、splash 消失、首屏可交互、归档部署完成）。**不定终点就没法比较**——上游\"用户可见端点\"这条在 SSiD 尤其必要。\n- 上游那段\"检查确切当前 base 而非运行中的 checkout……PR 描述可能描述一个已放弃的实现\"→ SSiD 版：**以仓库 HEAD 为准，不以本地 dev 进程为准**（dev 热更新会让本地状态偏离 HEAD）。\n\n### 2. `## Survey user paths, then rank candidates` → **改写（领域清单全换）**\n\n**保留骨架**：广度有帮助时委派独立域；**要求测量与生产调用点，不要猜测**；**独立成本驱动因素要分别变动**（字节、持久事件、紧凑记录、原始增量、回合、工具、子节点、可见 DOM 节点是**不同的量**）；**不要把一个\"大量微小相同消息\"的负载称为现实负载，除非检查过它压的是哪个用户操作**；包含典型与尾部负载，但**避免没有决策价值的组合矩阵**。\n\n**排序依据逐字保留**：观察到的用户延迟、CPU/分配、保留内存、发生频率、置信度。**每条候选必须点名**：生产消费者、重复工作、预期复杂度、**最小的可证伪干预**、**必须保持稳定的行为**。\n\n**保留那句防幻觉的**：*\"可疑的循环、未使用的缓存、或大文件本身**不是**瓶颈的证据。\"*\n\n**4 个域全换**：\n\n| # | SSiD 的域 |\n|---:|---|\n| 1 | **冷启动与热启动**：进程起 → splash → 归档部署（首启/升级）→ 首屏可交互 |\n| 2 | **大会话**：多回合历史、工具密集、单条大结果、会话列表与切换、chat-rail 导航条与面板 |\n| 3 | **渲染与交互**：首次绘制、滚动、面板展开/折叠、侧栏切换、隐藏视图激活 |\n| 4 | **归档与部署**：`prepare-runtime.mjs` 耗时、`dsh-runtime.tar.gz` 解压与校验、vendor 同步（1.5 分钟级操作，用户可感知） |\n\n### 3. `## Build realistic synthetic benchmarks first` → **保留（核心），基建从零**\n\n**这是全篇最该保留的一节**，三个部分逐字保留：\n\n**(a) 隐私纪律（对 SSiD 尤其重要）**\n\n> 若用户授权检查本地语料，**只提取聚合的工作负载特征**。**绝不**把提示词、输出、路径、身份、ID、凭据、录制或可识别片段复制进 fixture、日志、截图、PR 或产物。用经复核的常量生成固定输入；**没有任何基准依赖用户的主目录、环境仓库、网络服务或私有数据。**\n\nSSiD 的用户数据（会话日志、记忆库）**比 DSH 更敏感**，这条要**提权**并加一句：\"会话日志里含真实对话内容，聚合时**只取计数与长度分布**\"。\n\n**(b) 测量卡 7 字段** —— **逐字保留，一字不减**：\n\n| 字段 | 必须给出的决定 |\n|---|---|\n| 用户操作 | 确切动作与**外部可观察的完成条件** |\n| 工作负载 | 固定维度、分布、构造种子/常量，以及**为什么它压到普通与尾部使用** |\n| 入口路径 | 生产调用/组合与构建产物；被 mock 的外部边界 |\n| 时钟 | 纳入的 setup、冷/热状态、计时起止、**被排除的成本** |\n| 内存 | 可达的端点对象、基线、GC 策略、保留 vs 瞬时上限 |\n| 裁决 | 原始样本、选定的聚合、校准的绝对值/比例/内存上限、**负向控制** |\n| 行为 | 属主功能测试/快照，以及**被允许的微小差异** |\n\n**(c) 测量诚实性** —— 逐字保留：用**全新子进程与私有临时根**做冷启动/进程内存样本；热样本显式保留既定缓存；**绝不让 fixture 的 setup 悄悄预热一个冷场景**；两侧保持相同输入、校验、完成条件与可达输出；**\"解析后丢弃的基线不能与经过校验的保留历史相比\"**。\n\n**SSiD 必须改写的一处**：上游 *\"扩展现有的必需 lane，而不是创建竞争性的校准或报告基建\"* → SSiD **没有 lane 可扩展**，改为：**\"先建一条最小的测量 lane（一个脚本 + 一个输出格式），再开始优化\"**，并**明确警告不要为每次优化各造一套脚本**。\n\n**同步删除的**：Node 机器乘数、浏览器 CI 校准、共享时间校准、预算作为源码常量等——它们全部依赖 SSiD 不存在的基建。**但保留一句通用的**：*\"不要把预算放宽或挑一次走运的运行来掩盖回归。\"*\n\n### 4. `## Prove the regression, then remove work` → **保留（含 7 条模式）**\n\n**保留的流程**：改生产代码**之前**先跑未优化的负载；保存命令、版本、运行时/平台、fixture 维度、原始测量与裁决；**把失败场景缩减到仍然压到真实瓶颈**；在动手前**给可证伪假设排序**；用 profile、分配样本、工作计数或阶段计时来区分它们。\n\n**7 条常见模式逐字保留**（它们是\"值得测\"，**不是自动处方**——上游原文强调）：\n\n1. 让紧凑表示一路保持紧凑；消费者需要的是**已定内容或一个聚合**时，避免逐 delta 对象\n2. 只有在**识别出真正的归属与信任转移之后**才移除重复的解析、拷贝、冻结与校验；**\"同进程类型化借用不是削弱持久或 wire 解析的许可\"**\n3. 流式转换产物并**约束中间状态**，而不是保留每一代；在用户操作需要处**包含发布、校验与可写就绪义务**\n4. **分离只读准备与写入/发布工作**，但**不要把被 await 的工作挪到一个正确性所要求的端点之后**\n5. 延迟非活跃视图与折叠细节的工作；**同时测量首次激活与保留状态**；**\"延迟不是删除，视口高亮不是完整虚拟化\"**\n6. **稳定标识、收窄订阅**，使一个变更节点不会让整段历史失效；保持更新顺序与即时事件行为\n7. 用合适的数据结构替代反复移位/扫描/重建；**测量整个消费者路径**而不只是孤立的容器操作；**revision-keyed 复用或 singleflight 只在有显式失效、有界保留、独立等待者取消与拆除归属时才用**\n\n**保留**：一次只改**一个因果因素**；重跑聚焦场景**与其端到端父场景**。\n\n**保留负向控制的定义**（逐字）：*\"一个宽到让回归通过的阈值**不是保护**；低于已验证噪声底的预算**也不可靠**。\"*\n\n### 5. `## Preserve behavior and resource ownership` → **保留**\n\n**逐字保留**：性能测量**补充**功能证据，**不替代**它；跑或补最窄的属主测试（输出、排序、分页、流索引、错误、取消、并发、拆除）；**preserve 模型可见/已记录等价性、已发布代的不可变性、原子发布、必需校验与可写就绪**；**\"不要为了达到一个数字而静默截断历史、跳过工具结果、禁用不变量或改变生命周期语义。\"**\n\n**SSiD 本地化**：模型可见/已记录等价性 → **DSH 会话日志的等价性**（SSiD 必须保持与 DSH 的会话格式契约）；产品可见 GUI 变更的浏览器证据 → **Playwright 截图基线**（`shell/tests/plugin-adapt/`）。\n\n**四种拒绝优化的情形逐字保留**：端到端增益消失 / 典型负载实质性回退 / **复杂度超过小收益** / 取消·保留·持久性**无法解释与测试**。并保留：**\"简短记录被否证的假设，而不是扩大范围来为它辩护。\"**\n\n### 6. `## Deliver a bounded, reviewable result` → **改写（删 stacks）**\n\n**保留**：用 Agent Note 规则承载持久理由 → 改指向 `docs/决策/`；**检查相关记录是否被取代，但不要把性能工作变成全库行文清理**（这条与 05 §三.9 同源，逐字保留）；**可复用流程留在这里，场景相关的真相留在其基准或包属主处**。\n\n**删除**：stacked PR / 官方 GitHub stacks / 独立 worktree 整段（SSiD 无 stacks）。**保留其中一句通用的**：*\"在编辑前选好分层；每一层都要可合并\"*——**若真需要分层，用分支而非 stacks**。\n\n**保留**：应用 **06**（推送前检查）、**只报告执行过的证据**、**查看 CI 而不是假设本地计时能证明 runner 稳定性**（SSiD 版要加一句：**SSiD 的 CI 不跑测试，所以\"本地计时\"就是全部证据——这抬高了重复测量的必要性**）。\n\n**保留**：标记 ready 后，用代码与可执行证据评估评审意见；**不要仅仅因为一份报告来自机器人就驳回它**。\n\n**保留**最终摘要格式（逐字）：*工作负载 → 前后绝对值与比例 → 端点与内存语义 → 行为证据 → 负向控制 → 确切检查 → 排除项*；并**区分作者报告的历史数字、新的本地测量与 CI 证据**；**停在约定的场景/修复范围内，保留一份简短的排序后续清单，而不是追逐无关机会**。\n\n---\n\n## 四、汇总：改动清单\n\n| 动作 | 数量 | 具体 |\n|---|---:|---|\n| **原样保留** | 3 部件 | §3（测量卡 + 隐私纪律 + 测量诚实性）、§4（7 条模式 + 负向控制）、§5（行为与资源归属） |\n| **改写** | 3 部件 | §1（引用 + 四层端点）、§2（4 个域 + 启动终点）、§6（删 stacks + CI 前提） |\n| **删除** | 0 部件 | 无 |\n\n> **算术核对**：**6 个部件**（6 个一级小节）；3 + 3 = **6** ✓\n\n**净判断**：测量卡 7 字段、隐私纪律、7 条优化模式、负向控制定义、四种拒绝情形**一字不减**；删改集中在 SSiD 不存在的测量基建（lane、校准、机器乘数）与 GitHub stacks。\n\n---\n\n## 五、落地结构\n\n```\n@max-null/dsh-skills/skills/ssid-speed-up-perf/\n├── SKILL.md        # 预计 85–105 行（上游 92，删基建依赖，补四层端点与启动终点）\n└── SOURCE.md\n```\n\n**命名**：`ssid-speed-up-perf`。\n\n**description 建议**（**只写触发条件**）：\n\n> 在调查或优化思灵的启动时间、大会话装载、界面响应、面板与导航交互，或设计可复现的用户路径测量、把性能改动变成有测量支撑的行为保持型修复时使用。\n\n**依赖声明**：引用 **01**（进程、时钟、浏览器测试与异步拆除）、**06**（推送前检查）。同批进包。\n\n---\n\n## 六、SOURCE.md\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | dsh-speed-up-perf |\n| 上游路径 | DSHfork/.agents/skills/dsh-speed-up-perf/ |\n| 上游版本锚点 | c291e7961a（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 92 行（无 references） |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 需适配（基建依赖本地化 + 删 stacks；测量纪律全部保留） |\n| 依赖 | 引用 01、06（同批进包） |\n\n---\n\n## 七、待确认\n\n1. **要不要给 SSiD 建一条最小测量 lane**？这是 07 能否落地的前提。建议形态：`shell/scripts/measure-\u003cpath>.mjs` + 固定输出格式（JSON），覆盖**启动到首屏可交互**与**大会话装载**两条路径。属独立任务。\n2. **启动时间的\"终点\"定在哪**？候选：splash 消失 / 首屏可交互 / 归档部署完成。**这决定所有启动数字的可比性**，建议你现在定一个。\n3. **SSiD 的性能面里，哪一条最值得先测**？我的判断是**启动时间**（用户每次都能感知，且 Electron 壳的启动路径长）与**升级时的归档部署**（1.5 分钟量级，用户可感知）。但这需要你确认——**哪条路径慢是用户最能感知的，只有你知道**。\n\n---\n\n## 八、数字自检（命令产出，可复现）\n\n```powershell\n$up = 'DSHfork\\.agents\\skills\\dsh-speed-up-perf'\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^## ').Count              # 6   一级小节\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^### ').Count             # 0\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^\\d\\. ').Count            # 0\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^- ').Count               # 12  列表项\n\n# 行数（两种口径，见下方说明）\n([regex]::Matches([System.IO.File]::ReadAllText(\"$up\\SKILL.md\"),\"`n\")).Count   # 92  ← 本说明采用\n@(Get-Content \"$up\\SKILL.md\").Count                                            # 91\n\n# SSiD 侧\nTest-Path 'seek-soul-in-darkness\\benchmarks'                            # False\n@(Get-ChildItem 'seek-soul-in-darkness' -Recurse -Depth 3 -Include '*bench*','*perf*' -File |\n   Where-Object { $_.FullName -notmatch 'node_modules|vendor|runtime|\\.build' }).Count   # 0\n@(Get-ChildItem 'seek-soul-in-darkness\\docs\\决策' -File -Filter '*.md').Name |\n   Where-Object { $_ -match '性能|慢|启动|优化|perf|benchmark' }         # 仅 1 个（UI 优化，非基准）\nSelect-String -Path 'seek-soul-in-darkness\\docs\\SSiD开发手册.md' -Pattern '性能|启动时间|响应'   # 零命中\n```\n\n**本说明的行数口径说明（必须留痕）**：\n\n本文件是**首次出现两种口径不一致**的：`\\n` 计数为 **92**，而 `Get-Content` 计数为 **91**。对照检查发现 05（`dsh-find-simplifications`）两种口径**都等于 157**。\n\n**同一组命令对不同文件给出不同口径**，原因未查明。本说明采用**与 `read` 工具一致的 `\\n` 口径（92）**。这条不是小事——它是 §三.2 那条规则（**工具本身也要验证**）的第二个实例：**报告数字时必须说明它来自哪种度量**，否则复核者用另一把尺子会得到不同结果，进而怀疑整份说明。\n\n**自查记录**：本说明的数字全部来自命令；**口径差异已如实标注而非抹平**。\n"},{"file":"2026-09-10-skill适配说明-08-浏览器录制.md","date":"2026-09-10","slug":"skill适配说明-08-浏览器录制","title":"skill 适配说明 08：浏览器录制","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-skills","dsh-skills","ssid-record-browser-gif","dsh-quick-toolbar","dsh-chat-rail","dsh-node-appearance","dsh-plugin-center"],"summary":"清点表把它标为「部分可用」，分段与实测精确吻合：§7  Publish the GIF 从 L116 开始，所以 - L1–115（前 115 行）：录制与证据链纪律 → 通用 - L116–172（后 57 行）：发布流程（gh --attach / assets 分支）→ 依赖 GitHub PR 制度 - scripts/（440 行）：纯工具，只依赖 ffmpeg / ffprobe → ","bytes":22767,"lines":301,"body":"# skill 适配说明 08：浏览器录制\n\n> **本说明的地位**：它是适配工作的**依据**，不是 skill 本身。格式见 `2026-09-10-skill适配说明-写作规则.md`。\n> 状态：进行中（推断 · 2026-09-12）\n\n> 这是 8 份完整适配说明的**最后一份**；4 个 `⛔ 现在不适用` 的 skill 另出一份合订理由。\n\n**上游 skill**：`record-browser-gif`\n**上游位置**：`DSHFork/.agents/skills/record-browser-gif/`\n**上游版本锚点**：`c291e7961a`（2026-09-10 抓取，与前批同）\n**上游体量**：SKILL.md **172 行** + `scripts/encode_gif.py` **337 行** + `scripts/test_encode_gif.py` **103 行** = **612 行**\n**清点分类**：`🔧 部分可用`\n**拟落点**：`@max-null/dsh-skills` 的 `skills/ssid-record-browser-gif/`\n\n---\n\n## 一、为什么做这一个\n\n### 1.1 它有两块彼此独立的价值\n\n清点表把它标为「部分可用」，**分段与实测精确吻合**：§7 `## Publish the GIF` 从 L116 开始，所以\n\n- **L1–115（前 115 行）**：录制与证据链纪律 → **通用**\n- **L116–172（后 57 行）**：发布流程（`gh --attach` / assets 分支）→ **依赖 GitHub PR 制度**\n- **`scripts/`（440 行）**：纯工具，只依赖 `ffmpeg` / `ffprobe` → **可直接复用**\n\n**所以这份 skill 的适配不是\"删掉不适用的一半\"，而是\"把发布目标从 PR body 换成 SSiD 自己的落点\"**——因为**前 115 行的纪律恰恰是 SSiD 最缺的**。\n\n### 1.2 SSiD 侧有一个对应的硬规则，且达标率很低\n\n工作区根 `AGENTS.md` 铁律 7：**README 必须有 `## 截图` 段 + `docs/shots/`（用户视角三覆盖）**。\n\n实测（§2.1）：**15 个插件里只有 3 个有 `docs/shots/`**，全库仅 **4 个 GIF**。所以这份 skill 在 SSiD 不是\"锦上添花\"，而是**一条已有规则目前缺执行手段**——它给的是\"怎么录、怎么编码、怎么验证\"的方法。\n\n---\n\n## 二、SSiD 侧现状（已核实）\n\n### 2.1 `docs/shots/` 现状：3/15\n\n| 插件 | 文件数 | gif | png |\n|---|---:|---:|---:|\n| dsh-quick-toolbar | 12 | **4** | 8 |\n| dsh-chat-rail | 5 | 0 | 5 |\n| dsh-node-appearance | 2 | 0 | 2 |\n| **其余 12 个插件** | **无 `docs/shots/`** | — | — |\n\n**全库 `.gif` 总数 = 4**（全部在 `dsh-quick-toolbar`）。\n\n**两个可读的结论**：\n\n- SSiD 的既有实践以 **PNG 截图**为主，GIF 只在 1 个插件里出现 → **适配版必须同时支持\"截图序列\"与\"GIF\"两种产物**（上游 §5 的 `### Screenshot capture` 正好覆盖前者，不能删）。\n- 12 个插件无 `docs/shots/` 是**与 skill 适配无关的独立缺口**，但它决定了本 skill 的**落地价值**——它是补齐这条规则的方法来源。\n\n### 2.2 工具链前置条件：**当前不满足**\n\n| 依赖 | SSiD 实测 |\n|---|---|\n| `python3` | ✅ 有 |\n| `python` | ✅ 有 |\n| **`ffmpeg`** | ❌ **未安装** |\n| **`ffprobe`** | ❌ **未安装** |\n\n**所以 `encode_gif.py`（337 行）当前跑不起来**。而上游原文对此有明确纪律：\n\n> *\"Require `python3`, `ffmpeg`, and `ffprobe`. **If a media binary is missing, report the dependency instead of installing software without authorization.**\"*\n\n**这条要逐字保留并提权**——它决定了 agent 遇到缺失依赖时的正确行为是**报告**而不是**自行安装**。\n\n### 2.3 上游引用的机制对照\n\n| 上游引用 | SSiD |\n|---|---|\n| `gh --attach`（需 gh ≥ v2.99.0、github.com、写权限、GIF ≤ 10 MB） | **命令可用**，但 SSiD 无 PR 流程（04 §一已定） |\n| assets 分支（orphan branch，`\u003cseries>-assets`） | **无**（SSiD 不用 stacks / assets 分支） |\n| `pnpm run build && pnpm run build:web` | SSiD：`npm run bundle-kernel`（shell）＋各插件的 `pnpm build` / `npm run build` |\n| 仓库声明的 Playwright 依赖 | ✅ SSiD 有（`shell/tests/plugin-adapt/`，Playwright 1.57.0） |\n| `.playwright-mcp/` 作为 gitignored 工作目录 | ✅ SSiD 工作区**已有** `.playwright-mcp/` 目录（顶层） |\n| 证据链决策记录 | → `docs/决策/` |\n\n**一条好消息**：`.playwright-mcp/` 在 SSiD 工作区**真实存在**，所以上游\"把脚本、原始视频、计时笔记、QA 帧与 GIF 都放在 gitignored 的 `.playwright-mcp/` 下\"这条**可直接沿用**。\n\n---\n\n## 三、逐条适配判断\n\n上游共 **10 个部件**：引言 + 7 个一级小节（含 4 个二级小节挂在 §4/§5/§7 下）+ 2 个脚本。\n\n### 1. 引言 → **改写（发布目标）**\n\n**保留**：*\"产出一段**简短、真实**的 UI 演示作为本地 GIF；**只有在任务包含把它附到 pull request 时**，才走本 skill 末尾的发布流程。\"* —— 这个\"录制与发布的开关\"结构**逐字保留**，它是防止\"随手就发布\"的设计。\n\n**保留**：优先使用可用的浏览器控制工作流；当该工作流支持更高帧率的连续捕获时用 **Playwright Videos**；用**自带编码器**做裁剪、播放速度、末尾停留、尺寸与体积控制。\n\n**改写**：把\"发布目标 = PR body\"改为 **SSiD 有三个落点**：\n\n1. **`docs/shots/`（主落点）** —— 对应工作区铁律 7，产出物进 README 的 `## 截图` 段\n2. **`docs/release-notes-*.md`（发版说明）** —— 重大界面改动附演示\n3. **上游 PR body（次落点）** —— 保留上游的 `gh --attach` 流程，供向 DSH / 第三方提 PR 时使用\n\n### 2. `## Every GUI pull request includes a GIF` → **改写为「改动用户可见界面就必须录」**\n\n上游的强制规则：*\"改动产品用户可见 GUI 行为的 PR **必须**包含一个用本 skill 录制的演示 GIF，并嵌在 PR body 里。\"*\n\n**SSiD 版（且比上游更严）**：\n\n> **改动产品用户可见的 GUI 行为时，必须在同一次改动里更新对应插件的 `docs/shots/`，并确保 README 的 `## 截图` 段引用到位。**（依据：工作区 `AGENTS.md` 铁律 7「用户视角三覆盖」）\n\n上游随后那段\"录制本身就是证据\"的要求**逐字保留**，并做一处本地化：\n\n- 上游：真实服务器 + 真实 API key + 真实模型回合；**绝不**用 fixture 查询、mock 传输、合成事件注入或 test-only 钩子替代，除非用户显式要求 fixture 录制\n- SSiD：**同上**，另把\"下一条嵌入处要写明**被演示的确切 commit SHA、服务它的树与来源、任何 mode 标志或浏览器状态例外、以及是否跑了真实模型回合**\"逐字保留——这条让评审者知道**录像到底证明了什么**，是整份 skill 的诚实性核心\n\n### 3. `## Keep recording separate from publication` → **原样保留**\n\n**4 条逐字保留**（这是本 skill 的架构骨架）：\n\n- 录制只产出本地视频或截图与一个 `.gif` 产物；**绝不改动远端状态**\n- 发布是**单独的最后一步**，且**只在任务包含附到 PR 时**执行；**绝不改动 PR 自己的分支**\n- **保留所要求的录制条件**：真实服务器 / 真实 API 的演示**不得**使用 fixture 查询、mock 传输、合成事件注入或 test-only 钩子。**若凭据或服务器不可用，报告这个限制，而不是用 fixture 替代**\n- **绝不读取或暴露凭据值**；走应用的正常配置路径，用一个无害的演示提示\n\n### 4. `## Stage the application` → **改写（隔离域换成本地域）**\n\n**4 步全部保留，本地化隔离对象**：\n\n| 上游 | SSiD |\n|---|---|\n| 要求干净工作树，用 `git rev-parse HEAD` 记录确切 commit，然后**构建那棵树**（`pnpm run build && pnpm run build:web`） | 保留 `git rev-parse HEAD` 记录；构建命令改为 **`npm run bundle-kernel`（shell）+ 受影响插件的 `pnpm build`**。**\"对着另一个 commit 的构建录出来的 GIF 是错误归因的证据\"** 逐字保留 |\n| 每个端口起一个服务器，用**全新的 scratch `DSH_HOME`、`DSH_AGENTS_HOME`、工作区与会话状态**；给浏览器全新隔离上下文 | 保留原则，换成本地域：**新的 `DSH_HOME`、工作区、会话状态**；SSiD 的对应隔离面还有 **profile（`~/.dsh/profiles/ssid`）**——录制**不得**碰用户真实 profile |\n| **一个分镜就是一次证据运行**：每个已发布帧都来自那个服务器与那些状态根、工作区、会话与模型场景；**若捕获自动化失败，丢弃它的帧并从全新根重跑；绝不把不同运行的帧拼接起来** | **逐字保留**——这是上游最硬的一条证据纪律 |\n| 在 PR 之间切换时，**按 PID 或命令行精确匹配**停掉旧服务器；**宽泛的 `pkill -f` 可能杀掉启动它的那个 shell，包括你自己的** | **逐字保留**（Windows 上对应 `Stop-Process -Id` 或按命令行精确匹配，**不要用宽泛的 `taskkill /IM node.exe`**） |\n\n### 5. `## Record the flow`（含 `### Capture video`）→ **原样保留**\n\n**逐字保留的要点**：\n\n- 沿用可用浏览器控制工作流的 setup / interaction / cleanup；暴露 `recordVideo` 时在同一受控上下文启用视频以捕获更多中间帧；**\"视频可用性不决定该选哪个浏览器控制工作流\"**\n- 只有在浏览器控制不可用时，才用仓库声明的 Playwright 依赖在隔离无头浏览器里操作，**并在溯源里声明这个退路**；**不要安装另一个驱动，也不要打开用户的浏览器**\n- `### Capture video` 里那条**必须保留的长注释**：`viewport` 与 `recordVideo.size` **要显式匹配**，否则 Playwright 会把视频缩到 800×800 以内，**导致 UI 文字不可读**\n- **`context.close()` 要在 `video.saveAs()` 之前 await**；**只关 browser 不保证视频已 flush**；**每个页面有自己的视频，显式选择被演示的页面，不要拼接不相关的页面或运行**\n- **\"选择 3–6 个有意义状态的短故事\"**；行动前等待**唯一语义定位器**；用 `exact: true` 做可及名称等值与**无法匹配提示词回显**的精确文本完成判定；**固定等待可以在状态验证后提供阅读停留，但绝不用于确立就绪**\n- 演示工具调用 / 拒绝 / 恢复时，**打开它的详情或轨迹**，让视频显示工具身份、状态或稳定错误码、以及下游结果\n- **不捕获任何机密、个人数据、无关标签页或通知**；**浏览器视频包含页面内容而非浏览器外壳**——避免在应用里渲染带凭据的 URL；**审阅整个选定区间，包括中间状态**；**保持单一视口**\n\n### 6. `## Encode the GIF`（含 `### Screenshot capture`）→ **原样保留（并如实标注当前不可用）**\n\n**逐字保留**：\n\n- **依赖缺失时的行为**（§2.2 已引）：**报告依赖，而不是未经授权安装软件**\n- `export GIF_SKILL_DIR=...` **必须单独一行**——**同一命令里的内联赋值无法影响参数展开**\n- `--start` / `--end` 选**一段连续区间**；默认保留整段 1× 速度并加**2 秒末尾停留**；`--speed` 改变播放速度，**必须在 GIF 旁披露速度与选定区间，免得演示暗示了实测响应延迟**；**用观察到的视频时间，不要猜墙钟偏移**\n- **`--fps` 提高不能恢复源录制没捕获到的运动**；**保留原始 WebM 用于 QA；不要拼接不同运行或合成缺失状态**\n- 编码器的自检行为（探测 WebM 容器时长、在调色板转换前应用裁剪与变速、检查编码后时长/动画/宽度/字节大小；**拒绝空区间、越界区间、短于两个输出帧的选择、模式不当的标志与意外覆盖**）\n- 体积过大时**先降 `--max-width`，再降 `--colors` 或 `--fps`；保持文字可读**；**`--force` 只在解决确切输出路径后使用**\n- `### Screenshot capture`：**从一次隔离运行里捕获 3–6 个已验证状态**；按 `00-initial.png` / `01-typed.png` 命名；**尺寸与裁剪一致**；瞬态状态要在**同一次浏览器脚本调用内**轮询 DOM 标记后捕获\n- **一个 duration 适用于每张截图，否则每帧给一个正数，并把稳定状态停留得最久**；**目录输入会拒绝少于两帧、尺寸不一致或 duration 数量不匹配**\n\n**必须新增的现状说明（有据）**：**SSiD 当前没有安装 `ffmpeg` / `ffprobe`，所以编码器暂时不可用**。适配版必须写明：\n\n> 本 skill 的编码步骤需要 `ffmpeg` 与 `ffprobe`；**SSiD 开发机未安装**。按上游纪律**报告依赖而不自行安装**；若要启用录制能力，需由用户决定如何提供这两个二进制（Windows 上通常还需注意 PATH 与许可证）。\n\n### 7. `## Verify the artifact` → **原样保留**\n\n**4 步逐字保留**，其中第 2 步是**全篇最容易跳过、也最重要的一步**：\n\n> **目视阅读编码后的 GIF 本身，而不只是源帧。** 确认过渡可读、最后状态停留足够久、没有敏感内容出现。**若查看器只渲染第一帧，用 `ffmpeg` 从编码后的 GIF 解码代表性帧并检查它们；编码前的截图不能证明编码后的顺序、调色板或末尾停留。**\n\n另保留：读编码器的 **JSON 摘要**核对输出路径 / 源区间与速度（或截图数）/ 编码帧数 / 尺寸 / 时长 / 字节大小；跑 `git status --short` **确认原始视频、QA 帧与产物只落在被忽略的路径下**；返回 GIF 绝对路径、在客户端支持本地媒体时渲染它、**并声明录制用的是真实 API、fixture 还是别的传输**。\n\n以及那句**维护说明**：`python3 -m unittest discover -s \"$GIF_SKILL_DIR/scripts\" -p 'test_*.py' -v`，**且注明\"这些本地媒体测试不在仓库 CI 里跑\"**——**SSiD 同样没有 CI 兜底（06 §2.2），所以这句在 SSiD 同样成立且要保留**。\n\n### 8. `## Publish the GIF`（含 `### Attach with gh`、`### Fall back to an assets branch`）→ **改写（换主落点，次落点保留）**\n\n上游这一节整体（L116–172）以 PR 为唯一目标。**SSiD 的主落点改为 `docs/shots/`**：\n\n**主落点（新增，替代上游的 PR 假设）**：\n\n1. 把已验证的 GIF/PNG 放进 `docs/shots/`（**提交进仓库**——此处与上游\"绝不提交二进制到 PR 分支\"的纪律**不冲突**：上游禁的是把媒体塞进**会被反复合并的分支**以膨胀历史；SSiD 的 `docs/shots/` 是 README 的**常驻资产**，本来就该在仓库里。**这个区别必须写清楚**，否则会与铁律 7 直接矛盾）\n2. 在插件 README 的 `## 截图` 段引用（相对路径）\n3. **控制体积**：`docs/shots/` 的 GIF 应尽量小（上游的体积削减顺序 `--max-width` → `--colors`/`--fps` 适用）\n\n**次落点（保留上游，供向 DSH / 第三方提 PR）**：`gh --attach` 全流程与 assets 分支退路**逐字保留**，包括：\n\n- `gh --attach` 的前置（gh ≥ v2.99.0、github.com、写权限、GIF ≤ 10 MB）与\"体积超标先削减再附加\"\n- body 里按**普通本地路径引用**、`gh` 就地重写为上传 URL、**保留位置与 alt 文本**\n- **附加前立即重读被演示 PR 的 live head 并与记录的 commit 比较；若已移动，停下并重录**\n- 附加后**再次重读 live head 并要求仍停在该 commit**；重读 body 确认引用指向上传 URL；**通过 GitHub Markdown API 渲染 body 确认出现预期 `\u003cimg>`**；**抓取上传 URL 一次确认 `200` 与 `image/gif`**\n- assets 分支退路（orphan、`\u003cseries>-assets`、浅克隆 scratch、**推送前校验分支只含媒体且校验和与本地一致**、**永不删除或重写 assets 分支、永不 force-push**——**已合并的 PR body 会永远引用它的 URL**）\n- **匿名 404 不能否证私有仓库资产；要认证后再验证**\n\n### 9. `scripts/encode_gif.py`（337 行）→ **原样复用**\n\n**逐字复制，不修改**。理由（有据）：\n\n- **零 SSiD 专有依赖**：只 import `argparse` / `json` / `math` / `shutil` / `subprocess` / `tempfile` / `pathlib` / `typing`\n- 外部依赖只有 `ffmpeg` / `ffprobe`（**平台无关**）\n- 它自带输入校验（拒绝空/越界区间、短于两帧的选择、模式不当的标志、意外覆盖）——**这些校验本身就是判据的载体，改它就是改判据**\n\n**唯一要做的包装**：随包分发时确认 `python3` 可解析（Windows 上可能是 `python`）。**不要为此改脚本逻辑**。\n\n> **生成 skill 时的实测补录（比预想更隐蔽）**：本机的 `python3` **解析存在但跑不起来**——它指向 `%LOCALAPPDATA%\\Microsoft\\WindowsApps\\python3.exe`（**0 字节**的 Store 应用别名残留），执行返回 **9009**；而 `python` 指向 `C:\\Python312\\python.exe`（3.12.1）可用。\n> **关键教训**：`Get-Command python3` 报告它存在（`CommandType = Application`），所以**存在性检查不等于可用性检查**——必须真跑一次 `--version` 才算核实。这与 06 §三.3 的「零命中不证明任何事，直到命中已知正例」是同一类纪律：**信号存在 ≠ 信号为真**。已写进 skill 正文。\n\n### 10. `scripts/test_encode_gif.py`（103 行）→ **原样复用**\n\n**逐字复制**。它是编码器的自测（上游明说**不在 CI 跑**）。SSiD 同样**没有 CI 跑测试**（06 §2.2），所以：\n\n> **适配版必须写明：这些测试需要手动跑**（`python3 -m unittest discover -s \u003cskill>/scripts -p 'test_*.py' -v`），且**需要 ffmpeg/ffprobe 已安装**。\n\n---\n\n## 四、汇总：改动清单\n\n| 动作 | 数量 | 具体 |\n|---|---:|---|\n| **原样保留** | 4 部件 | §2（录制/发布分离）、§4（录制流程 + Capture video）、§5（编码 + Screenshot capture，仅加\"当前缺依赖\"标注）、§6（验证产物） |\n| **原样复用** | 2 部件 | `encode_gif.py`（337 行）、`test_encode_gif.py`（103 行） |\n| **改写** | 4 部件 | 引言（三个落点）、§1（改判据载体：PR → `docs/shots/` + 铁律 7）、§3（隔离域换成本地）、§7（主落点换 `docs/shots/`，次落点保留） |\n| **删除** | 0 部件 | 无（上游 PR 流程降为次落点，不删） |\n\n> **算术核对**：引言 1 + 一级小节 7 + 脚本 2 = **10 个部件**；4 + 2 + 4 = **10** ✓\n\n**净判断**：证据纪律（一次分镜一次运行、不拼接、真实服务器、不暴露凭据）与编码器**一字不减、一行不改**；改的是**发布目标**与**隔离域**，另加两条 SSiD 现状标注（缺 ffmpeg、`docs/shots/` 达标率）。\n\n---\n\n## 五、落地结构\n\n```\n@max-null/dsh-skills/skills/ssid-record-browser-gif/\n├── SKILL.md                 # 预计 175–195 行（上游 172 + 三个落点 + 两条现状标注）\n├── SOURCE.md\n└── scripts/\n    ├── encode_gif.py        # 逐字复制（337 行）\n    └── test_encode_gif.py   # 逐字复制（103 行）\n```\n\n**注意**：这是**唯一带可执行脚本**的 skill。包发布时需要 `files` 字段包含 `skills/` 下的 `scripts/`（`dsh-plugin-center` 已有先例：它的 `files` 含 `\"skills\"`）。\n\n**description 建议**（**只写触发条件**）：\n\n> 在被要求制作、录制或生成演示浏览器工作流的 GIF 时使用；也用于改动产品用户可见的界面行为之后——包括更新插件 README 的截图段与 `docs/shots/`、为发版说明准备演示、以及向 DSH 或第三方提 PR 前录制证据型 GIF。\n\n**依赖声明**：引用 **06**（推送前检查）。同批进包。\n\n**运行时依赖（须写进 SKILL.md 正文）**：`python3` / `ffmpeg` / `ffprobe` —— **SSiD 当前只有 python3**。\n\n---\n\n## 六、SOURCE.md\n\n| 项 | 值 |\n|---|---|\n| 上游 skill | record-browser-gif |\n| 上游路径 | DSHfork/.agents/skills/record-browser-gif/ |\n| 上游版本锚点 | c291e7961a（2026-09-10 抓取） |\n| 上游体量 | SKILL.md 172 行 + encode_gif.py 337 行 + test_encode_gif.py 103 行 = 612 行 |\n| 适配日期 | 2026-09-10 |\n| 适配类型 | 部分可用（发布目标改写；脚本逐字复用） |\n| 依赖 | 引用 06（同批进包）；运行时需 ffmpeg/ffprobe（**SSiD 未安装**） |\n\n---\n\n## 七、待确认\n\n1. **`ffmpeg` / `ffprobe` 要不要装**？这是本 skill **能否运行的前提**。上游纪律是\"报告而不自行安装\"，所以这个决定只能是你的。装了的话，那 337 行编码器立刻可用（含 103 行自测）。\n2. **`docs/shots/` 的 12 个空缺要不要补**？实测 15 个插件只有 3 个有。这是铁律 7 的执行缺口，**本 skill 是补它的手段**，但补不补是范围决定。\n3. **`docs/shots/` 里的 GIF 体积上限定多少**？上游对 PR 附件有 10 MB 硬限制；SSiD 把媒体**提交进仓库**，所以需要一个自己的体积纪律（我建议单个 GIF ≤ 2 MB，但这是你的偏好决定）。\n\n---\n\n## 八、数字自检（命令产出，可复现）\n\n```powershell\n$up = 'DSHfork\\.agents\\skills\\record-browser-gif'\n# 行数（LF 口径；本文件两种口径一致）\nforeach ($f in @(\"$up\\SKILL.md\",\"$up\\scripts\\encode_gif.py\",\"$up\\scripts\\test_encode_gif.py\")) {\n  ([regex]::Matches([System.IO.File]::ReadAllText($f),\"`n\")).Count   # 172 / 337 / 103\n  @(Get-Content $f).Count                                            # 172 / 337 / 103（一致）\n}\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^## ').Count              # 7   一级小节\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^### ').Count             # 4   二级小节\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^\\d\\. ').Count            # 8   编号项（§3 的 4 + §6 的 4）\n@(Get-Content \"$up\\SKILL.md\" | Select-String '^- ').Count               # 4   列表项（§2）\n# 分段核对：172 - 115 = 57\n\n# SSiD 侧\n@(Get-ChildItem 'max-null-plugins','seek-soul-in-darkness\\plugins' -Directory |\n   Where-Object { $_.Name -like 'dsh-*' } |\n   Where-Object { Test-Path (Join-Path $_.FullName 'docs\\shots') }).Count   # 3   有 shots 的插件\n@(Get-ChildItem 'max-null-plugins','seek-soul-in-darkness' -Recurse -Filter '*.gif' -File |\n   Where-Object { $_.FullName -notmatch 'node_modules|\\.build' }).Count     # 4   全库 GIF\n(Get-Command ffmpeg -EA SilentlyContinue) -ne $null                     # False\n(Get-Command ffprobe -EA SilentlyContinue) -ne $null                    # False\n(Get-Command python3 -EA SilentlyContinue) -ne $null                    # True\nTest-Path 'H:\\MaxNull\\WorkStation\\.playwright-mcp'                      # True（上游的 gitignored 工作目录在 SSiD 存在）\n```\n\n**自查记录**：本说明未发现数字错误；**两种行数口径在本文件上一致**（172 / 337 / 103），与 07 的情况不同（07 是 92 vs 91）。**分段核对（172 − 115 = 57）与清点表所述「前 115 行 / 后 57 行」精确吻合**——这是清点表做完后第一次回头验证它的分段，结果准确。\n"},{"file":"2026-09-10-skill适配说明-09-不适用理由.md","date":"2026-09-10","slug":"skill适配说明-09-不适用理由","title":"skill 适配说明 09：不适配理由（4 个）","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-skills","dsh-doc","dsh-translate-docs","dsh-archive-agent-notes","dsh-merging-stacked-prs","dsh-skills","#7"],"summary":"不是「SSiD 用不上」，而是「SSiD 没有它谈论的那个东西」。 一个 skill 被判不单独适配，必须满足：它的主题制度在 SSiD 不存在——不是规模小、不是频率低，而是被指向的对象本身缺失。硬凑一份空壳 skill 的三重代价： 1. 它占着触发位：agent 会为一个在 SSiD 永远不会发生的场景加载它； 2. 它携带假判据：为了填满篇幅必然写进 SSiD 无法执行的命令与路径； 3.","bytes":15988,"lines":195,"body":"# skill 适配说明 09：不适配理由（4 个）\n\n> **本说明的地位**：对应目标 ④——**明确不适配的 skill 记录原因，而非硬造判据**。格式见 `2026-09-10-skill适配说明-写作规则.md`。\n> 状态：已决策（推断 · 2026-09-12）\n\n> 这是 8 份完整适配说明（01–08）之后的收尾；它**不生成 skill**。\n\n---\n\n## 一、判「不单独适配」的标准\n\n**不是「SSiD 用不上」，而是「SSiD 没有它谈论的那个东西」。**\n\n一个 skill 被判不单独适配，必须满足：**它的主题制度在 SSiD 不存在**——不是规模小、不是频率低，而是**被指向的对象本身缺失**。硬凑一份空壳 skill 的三重代价：\n\n1. **它占着触发位**：agent 会为一个在 SSiD 永远不会发生的场景加载它；\n2. **它携带假判据**：为了填满篇幅必然写进 SSiD 无法执行的命令与路径；\n3. **它让\"已适配\"的意义变模糊**：以后没人分得清哪几份真能用。\n\n**同时**：判不适用**不等于判无价值**。本说明的第二职责是**提取可搬的判据并把它们并入已有 skill**——丢掉这些才是真的浪费。\n\n---\n\n## 二、逐条理由\n\n### 1. `dsh-doc`（861 行）→ ⛔ **不单独适配，但提取 3 组判据并入 03/05**\n\n**上游体量**：SKILL.md 128 行 + `references/` 5 个 + `templates/` 4 个 = 861 行。\n\n**它依赖的制度（逐条核实，SSiD 全部没有）**：\n\n| 制度 | 上游要求 | SSiD |\n|---|---|---|\n| **kind 系统** | 4 个 kind（`package-group` / `package-reference` / `package-library` / `package-bundle`），**每个 kind 严格对应一个模板文件**，且\"加一个新 kind 必须同时给出模板、仓库位置与专用检查\" | 无 |\n| **YAML 元数据** | frontmatter 的 `kind` 字段派生出期望模板；README 元数据门禁会**拒绝** `name` / `audience` / 未治理的 `tags` / README 局部 `i18n` 元数据 | 无 |\n| **双语配对** | `foo.md` / `foo.zh.md` / `foo.i18n.yaml` 三件套 + **逐行对齐** + sidecar 哈希 | 无（SSiD 无双语制度） |\n| **字数预算** | `pnpm run verify-doc-budgets` + `scripts/doc-budgets.manifest.json` 的天花板 + 至少 5% 余量 | 无 |\n| **网站投影** | VitePress + `website/docs.ts` 显式公开白名单 + `project-doc-site.ts` 重写进 `.generated/` | 无 |\n| **门禁** | `test:docs` / `doc-sync` / Summary gate（英文 Summary ≤ 100 词）/ skill 元数据检查 | 无（06 §2.2 已核） |\n| **参考范例** | `session-persistence-jsonl` 的 README 对是格式样板 | 无对应物 |\n\n**所以它不单独适配**：这份 skill 的主题是\"**一套会互相校验的文档制度**\"，而 SSiD 只有它的**最终产物**（13 个插件 README），没有产出它们的机器。强行适配会得到一份只讲\"README 该长什么样\"、却指向一堆不存在命令的 skill。\n\n**但它有 3 组与制度无关的判据，必须提取**——**这是本次核实对清点表的更正**（清点表记为 `⛔ 现在不适用` 而未提可搬部分）：\n\n#### (a) Fact-check procedure 的 5 条 → 并入 **03**\n\n上游 §\"Fact-check procedure: test, do not assume\" 里，**5 条有 4 条不依赖任何 SSiD 缺失的制度**：\n\n- **\"对每条声称的操作，对着当前 checkout 真跑一遍\"**——执行文档将展示的每个 CLI 命令、配置片段、profile/patch 示例的**原样**版本；**只写下你观察到的**，包括确切输出、警告与失败模式。若某断言依赖你没有的密钥或网络，**说明这一点并点名验证属主，而不是断言其行为**\n- **★★★ \"删掉你无法复现的东西\"**：*\"**绝不**把命令、字段、默认值或行为从**记忆、类比或邻居包的 README** 搬过来。当一条断言无法复现时，**修那条断言——而不是修测试**。\"*\n- **\"对着最新 master 检查旧文档\"**：修订既有页面之前先 `git fetch origin` 并把该节与 `origin/master` 对照；**\"master 上一句陈旧的陈述仍然是错的\"——要对着代码改，不是对着旧散文改**\n- **\"分类主题再写安装指引\"**：**读事实，不要读文件夹名**（看 `package.json` 的声明与入口文件的插件形态）\n\n> **为什么这条必须搬**：它**逐字描述了我在本系列 01–03 里犯的那 8 次错误**——把数字从记忆与类比里搬过来。DSH 早已把这条写成判据，而 SSiD 侧没有任何等价物。**不搬它，就是让同一个错误继续以\"文档工作\"的名义发生。**\n\n#### (b) Voice rules 的 5 条 → 并入 **03**\n\n5 条**全部制度无关**（它们管的是陈述方式）：\n\n- **★★ \"Summary 说的是主题能做什么\"**：开篇 Summary 与用户向小节描述用户或 agent **能用它做什么**——结果、收益、何时选用、主要代价——**绝不是它的角色、类型或内部身份**。包 Summary 里的\"它是什么\"**仅指读者可见的能力**，不是它的 Cordis 角色、注册点或内部组件。*\"'这个接缝注册 `ctx.x` 并追加 `x/event` 记录'是身份叙述；'你可以每条消息存一条笔记，重启后还在'才是它做什么。\"*\n  > **这条与 `writing-skills` 的「description 只写触发条件」同源**：两者都是\"读者要能判断该不该用它，而不是被告知它内部走了几步\"。**适配版的 description 规则应把两处合并成一条**。\n- **\"开发者小节解释，绝不枚举\"**：折叠的实现内容覆盖整体设计概念、架构与挥手式数据流，**足够了理解它怎么工作**，并**链接代码**取确切细节；**不做完整 API 目录、穷举式字段清单、事件负载枚举或 JSDoc 复述**\n- **★ \"Dev Note 是唯一的草稿区\"**：半成品想法、草稿、未定方向、实测产物与工作假设**只**出现在末尾的 Dev Note 里，并**显式标注非权威**；**其他每一节都是打磨过的当前状态散文**\n- **★ \"只讲当前状态\"**：**Dev Note 之外没有兼容性垫片、迁移话术或历史**（\"previously\" / \"now\" / \"no longer\" / renamed）；**\"今天这个代码库是唯一主题\"**\n  > **这条与 02 的推理痕迹修剪同源**——**03 与 02 应互相引用它**，而不是各自造一份。\n- **\"用受控的技术英语\"**：歧义会改变行为时，让每句话有**显式 actor 与一个主要动作**；一个概念复用一个术语；优先直接动词；拆开堆叠的指令与条件；**保留情态与例外**。（上游引用一份 ASD-STE100 启发的规范，SSiD 无对应文献 → **保留判据、删引用**。）\n\n#### (c) Quality criteria 的 6 条 → 并入 **04**（评审用）\n\n6 条**全部通用**，且**正是评审时要问的问题**：\n\n- **Brief**：常用路径只含其结局所需的事实；穷尽真相保持在**一个直接链接或一层细节**之外\n- **Intuitive**：前置先于依赖概念；**下一步动作是显然的**；标题用读者会搜的词\n- **Friendly**：读者能**识别成功**、**行动前理解风险**、**从可能的失败中恢复**、并能选择是否继续深入\n- **Accurate**：每条持久断言**有一个属主**与**与其风险相称的验证路径**\n- **★ Agent-readable**：元数据、稳定标题、锚点、术语、归属、当前/提议状态**支持定向检索而不必加载整个语料**\n- **Newcomer-complete**：一个没有仓库上下文的专业工程师能**通过 3–5 个链接页重建相关架构或特性**\n\n**并入方式**：03 的\"必需覆盖\"清单里加一节\"文档质量六问\"，并在 **04** 的 Manual checks 里引用它（评审新增文档时逐条过）。\n\n**结论**：`dsh-doc` **不生成 skill**，但它的 **15 条判据**（fact-check 4 + voice 5 + quality 6）分别并入 03 与 04。**净损失为零。**\n\n---\n\n### 2. `dsh-translate-docs`（74 行）→ ⛔ **不适用**\n\n**它是什么**：上游的**扩展双语文档工作流**——把 `foo.md ↔ foo.zh.md` 配对保持一致且两边都自然。它在 frontmatter 里就声明了调用边界：\n\n```yaml\ndisable-model-invocation: true\nuser-invocable: true\n```\n\n即**只许用户显式点名调用**，不许从其他 skill 或\"推断出的翻译需求\"里被选中。\n\n**它依赖的制度（SSiD 全部没有）**：\n\n| 机制 | 作用 | SSiD |\n|---|---|---|\n| 三件套 `foo.md` / `foo.zh.md` / `foo.i18n.yaml` | 配对本体 + 一致性记录 | 无 |\n| `pnpm run gen-translation-brief` | 生成简报（改动映射到最窄可安全对齐的粒度） | 无 |\n| `pnpm run verify-translation-pairing --write/--list` | 重算并记录两侧 blobby 哈希 | 无 |\n| `docs/i18n/terminology.md` | **双向约束**的术语表 | 无 |\n| `docs/i18n/translation-rules.md` / `translation-prompt.md` / `style-samples.md` | 翻译规则、机用模板、文体样本 | 无 |\n| 配对门禁 | 检查标题深度、围栏块、表格行列数、列表种类与起始、链接 locale | 无 |\n\n**为什么不能\"简化适配\"**：这份 skill 的**唯一主题**就是双语配对。SSiD 是**单语（中文）仓库**——去掉配对制度后，剩下的只有\"怎么把一段话翻译好\"这类通用写作建议，而那已经由 **03** 覆盖。**硬适配会造出一份没有任何场景能触发的 skill。**\n\n**唯一值得记下的一条**（不并入，仅记录）：*\"**绝不**为了应用一次更新而重译整份文档——最小更新保留了所有未改动部分的已复核措辞；重译把那次复核丢掉了。\"* 这条判据的**一般形式**（\"最小改动保留已复核的部分\"）已在 03 的\"完整命题\"节里隐含，无需另立。\n\n---\n\n### 3. `dsh-archive-agent-notes`（68 行）→ ⛔ **不适用（但记录为待办 #7 的参考）**\n\n**它依赖的制度**：Agent Note 的**生命周期**（`implemented` / `proposed` / `rejected`）+ **三件套** + **`archived/\u003ckind>/` 冻结** + **机械重录哈希** + `pnpm run verify-archived-agent-notes` 验证器 + 追加式封印（append-only seal）。\n\n**SSiD 的现实**（03 §2.2、04 §三.3、05 §三.9 已分别核实）：`docs/决策/`（99 个文件）**无状态字段、无归档制度、无双语三件套、无验证器**——**这份 skill 要动的每一样东西都不存在**。\n\n**两层价值，都不构成\"适配\"**：\n\n1. **它是待办 #7（Agent Notes 状态机）的直接参考** —— 清点表已指出这一点。若 SSiD 将来要给 `docs/决策/` 引入状态与归档，这份 skill 的**分类判据**是现成的方法。\n2. **它有一条通用的分类判据**（值得记录）：***\"按未来决策价值分类——理由、备选方案、否定性保证、持久/wire 语义、归属边界、安全规则、重新引入条件——而不是按字数或年龄。**\"* 并附带一条纪律：**\"不要为了配额而归档。\"**\n   > 这条与 05 §7 的\"先证明再动手\"是同一个精神：**判断要基于语义，不基于可计数的表面指标。**\n\n**为什么不并入 05**：05 已把\"取代标记\"压成一个动作（§三.9）。把归档生命周期塞进 05 会让它重新依赖不存在的制度——**那正是 05 §三.9 明确拒绝的做法**。\n\n---\n\n### 4. `dsh-merging-stacked-prs`（127 行）→ ⛔ **不适用**\n\n**它依赖的制度**：**GitHub 官方堆叠 PR 对象** + `gh stack` 扩展（`--version` / `link` / `checkout` / `sync` / `rebase` / `push` / `merge`）+ GraphQL 的 `PullRequest.stack` / `stackEntry.position` + merge queue。\n\n**SSiD 的现实**：\n\n- **单人开发，无 PR 评审流程**（04 §一已定）；次场景（向 DSH / 第三方提 PR）也**不用 stacks*
