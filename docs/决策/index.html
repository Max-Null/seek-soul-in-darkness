error / 0 warning（全程，含长会话加载；无 #130 / height 类错误——rc.1 全量构建产物完整）\n  5. ✅ **长会话加载回归**：8.3M tok 历史会话（「DSH Store上游Commit复检阻断处理」）加载完整（8 轮 · 67 步），无 alpha.4 式卡死；chat-rail 0.6.0 画卷导航正常渲染\n  6. ✅ 插件 API 全 200（chat-rail / quick-toolbar / sidebar / ssid-panels / draft-polish / context-doctor / achievements / genui）\n  7. ✅「插件更新」弹窗消失（plugin-center 0.2.18 = 最新；此前 0.2.17→0.2.18 提示）\n  8. ✅ 截图留痕：`web-rc1-long-session.png`、`web-rc1-main.png`（Playwright 输出）\n- **记录在案**：插件中心「更新 1」= huanlin/dsh-plugin-better-sidebar-plugin-office **0.1.2→0.2.0 标注「不兼容当前 DSH」**——第三方大版本，保持 0.1.2 不动（plugin-center 保守判定，不强行升级）。\n\n## 3. 风险与回滚\n\n- **回滚声明**：`package.json.pre-rc1-20260905162259` + `.bak-vendor-20260906/` 恢复 → pnpm install → 重启。\n- 进程级回滚无需：运行中 web 实例不受文件侧变更影响（启动时已加载）；重启后才切换。\n"},{"file":"2026-09-05-rc.1适配执行日志与复盘.md","date":"2026-09-05","slug":"rc.1适配执行日志与复盘","title":"rc.1 适配执行日志与复盘（2026-09-05）","statusRaw":"已完成（推断 · 2026-09-12）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh","@max-null/dsh-chat-rail","@max-null/dsh-capture","@max-null/dsh-quick-toolbar","@max-null/dsh-memory","@deepseek-ai/dsh-mcp-client","@astudioplus/codegraph-mcp","dsh-v0","dsh-chat-rail","dsh-settings","dsh-session-projection","dsh-capture"],"summary":"1. 内核：官方 checkout 定稿 dsh-v0.1.2-rc.1；prepare-runtime.mjs 注入 @deepseek-ai/dsh@0.1.2-rc.1 + 32 个缺失 peer（DSHVERSION 自动读取，实测归档 .runtime-version = 0.1.18-0.1.2-rc.1-\u003c指纹）。 2. 闭包锁定：profile-template/pnpm-work","bytes":3882,"lines":35,"body":"# rc.1 适配执行日志与复盘（2026-09-05）\n\n> 状态：已完成（推断 · 2026-09-12）\n\n## 执行记录\n\n1. **内核**：官方 checkout 定稿 `dsh-v0.1.2-rc.1`；`prepare-runtime.mjs` 注入 `@deepseek-ai/dsh@0.1.2-rc.1` + 32 个缺失 peer（DSH_VERSION 自动读取，实测归档 `.runtime-version = 0.1.18-0.1.2-rc.1-\u003c指纹>`）。\n2. **闭包锁定**：`profile-template/pnpm-workspace.yaml` overrides 214 条 `0.1.2-alpha.2 → 0.1.2-rc.1`（无其他版本串混杂，一次性替换）。\n3. **插件适配**（L1 = typecheck + test 全绿门槛）：\n   - @max-null/dsh-chat-rail **0.6.0**：settings 迁移到新卡片（三段式）、rc.1 peer 加固（dsh-settings 精确 pin `0.1.2-alpha.5`、dsh-session-projection `^0.1.2-alpha.2`）；测试 **37/37**。\n   - @max-null/dsh-capture **0.3.0**：截图组件设定迁移（settings 卡片，与另两插件同一范式）；测试 **4/4**。\n   - @max-null/dsh-quick-toolbar **0.8.6**：悬浮球官方设计；侧栏/底栏图标 better-sidebar 官方同款；测试 **68/68**。\n4. **npm 发布**：三个插件均由用户手动执行（F2A），registry 确认为 0.6.0 / 0.3.0 / 0.8.6。\n5. **vendor 同步**：capture / quick-toolbar / ssid-panels 三处（plugins 源 → profile-template/vendor → dev profile vendor）`git diff --no-index` + MD5 双核对一致；ssid-panels release-notes.md 随版同步。\n6. **dev 验证**：dev profile 全族 rc.1（@deepseek-ai/dsh、dsh-settings、dsh-web-app = 0.1.2-rc.1）；MCP Tab 显示 playwright + codegraph（均运行中，握手成功）。\n7. **隔离设计（main.mjs，2 处）**：\n   - profile 就绪信号：预设插件（@max-null/dsh-memory）→ **内核本体（@deepseek-ai/dsh）**——清预设不再触发「归档回灌 → 依赖报错 → 回灌」死循环。\n   - dev 裸跑：`!app.isPackaged` 时跳过归档部署（归档只服务安装版交付；dev profile 由本地 pnpm 独占维护；首启 profile 由 kernel.ts initProfile 建立）。安装版首启/升级部署逻辑不变。\n8. **MCP 检测机制验证**：MCP 管理列表 = mcp-client loader 条目（cordis.patch.yml `name: '@deepseek-ai/dsh-mcp-client'` 行）。dev 空列表根因 = patch `[]`（纯净设计），非机制 bug；补 playwright 预置 + 安装 @astudioplus/codegraph-mcp 实测：新增 loader 行重启后自动 spawn、initialize/tools-list 握手完成（`Client: dsh-mcp-client 0.0.1`）。\n\n## 坑与解法（复盘）\n\n| 坑 | 现象 | 解法 |\n|---|---|---|\n| 官方 rc.1 依赖范围缺陷 | 若干子包 `>=0.1.2 \u003c0.2.0-0` 匹配不到 rc.1 预发布 → 干净安装 NO_MATCHING（capture 装包被堵） | 插件侧 peer 精确 pin；闭包侧 overrides 强制 rc.1 |\n| pnpm 11 单包 overrides 不生效 | 只在多包 workspace 根生效；单包 `overrides` 无效 | **junction 借链**：capture/node_modules → chat-rail/node_modules（+ tsconfig paths 5 个 @deepseek-ai/* 指向 chat-rail 实体）；vitest 同样借 deepseek-harness/nm |\n| capture TS2717 webServer 重复 | 本地 `declare module` 增强与官方类型重复 | 删除本地增强（官方类型经 paths 解析） |\n| MCP 管理列表为空 | dev profile patch `[]` | 澄清语义（列表 = loader 条目）后补 playwright；**非发布缺口**（模板本就预置 mcp-playwright 行） |\n| dev 被归档回灌干扰 | 清预设 → 自动回灌 → 依赖报错死循环 | main.mjs 隔离设计（就绪信号 + dev 跳过部署） |\n| 官方 rc.1 npm 发布链版本杂糅 | dsh 族存在 alpha.3/4/5/rc.1 多版本 | 全部显式 pin：插件 peer 精确、模板 overrides 强制、dev install 以 lockfile 固化 |\n\n## 未决事项 → 已结案（2026-09-06 拍板）\n\n- 官方 rc.1 依赖范围缺陷**不向上游留言**：老用户升级 v0.1.18 即规避（overrides + peer pin 已内置闭包，升级时自动重部署）。\n"},{"file":"2026-09-04-SSiD内核升级-0.1.2-rc.1插件适配与测试体系方案.md","date":"2026-09-04","slug":"SSiD内核升级-0.1.2-rc.1插件适配与测试体系方案","title":"SSiD 内核升级 0.1.2-rc.1 插件适配与测试体系方案（2026-09-04）","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh","@deepseek-ai/dsh-","@max-null/dsh-chat-rail","@max-null/dsh-capture","@max-null/dsh-quick-toolbar","dsh-v0","dsh-chat-rail","dsh-settings","dsh-session-projection","dsh-capture","dsh-quick-toolbar"],"summary":"- 官方发布 DSH 内核 0.1.2-rc.1（npm 族 @deepseek-ai/dsh@0.1.2-rc.1 等，含本地源码 tag dsh-v0.1.2-rc.1）。 - SSiD 上一版（v0.1.17）内核为 0.1.2-alpha.2；本版目标：升级 rc.1 并完成自研插件适配后发版。 - 期间评估过 alpha.4：实测大历史会话加载卡死（净负收益），回滚 alpha.2；最终","bytes":3781,"lines":47,"body":"# SSiD 内核升级 0.1.2-rc.1 插件适配与测试体系方案（2026-09-04）\n\n> 状态：记录（推断 · 2026-09-12）\n\n## 背景\n\n- 官方发布 DSH 内核 **0.1.2-rc.1**（npm 族 `@deepseek-ai/dsh@0.1.2-rc.1` 等，含本地源码 tag `dsh-v0.1.2-rc.1`）。\n- SSiD 上一版（v0.1.17）内核为 0.1.2-alpha.2；本版目标：**升级 rc.1 并完成自研插件适配后发版**。\n- 期间评估过 alpha.4：实测大历史会话加载卡死（净负收益），回滚 alpha.2；最终定稿 rc.1。\n\n## 内核接法\n\n- 源码模式：deepseek-harness checkout 固定 `dsh-v0.1.2-rc.1` → `prepare-runtime.mjs` 从 `apps/cli/package.json` 自动读取 `DSH_VERSION=0.1.2-rc.1`（单一来源）。\n- 闭包版本锁定：`profile-template/pnpm-workspace.yaml` overrides 214 条 `@deepseek-ai/dsh-*` 全局 pin（v0.1.17 时代为 alpha.2，本版改 `0.1.2-rc.1`），防聚合包/子包版本漂移。\n\n## 风险与对策：官方 rc.1 依赖范围缺陷\n\n- 现象：官方若干子包依赖声明 `\">=0.1.2 \u003c0.2.0-0\"`，而 rc.1 是预发布版本（`0.1.2-rc.1 \u003c 0.1.2`），semver 范围匹配不到 → 干净安装 NO_MATCHING。\n- 对策（分层）：\n  1. 归档闭包：overrides 214 条强制 rc.1 家族（如上）。\n  2. 自研插件：consumer 侧按需精确 pin 官方 peer（例：`@max-null/dsh-chat-rail@0.6.0` peer `dsh-settings: \"0.1.2-alpha.5\"` —— rc.1 发布链中 settings 的最新可解析版；`dsh-session-projection: \"^0.1.2-alpha.2\"` 范围可覆盖 rc.1）。\n  3. 开发装包：junction 借链 + tsconfig paths（见执行复盘）。\n\n## 插件适配范围与范式\n\n- 对象：@max-null/dsh-chat-rail（0.6.0）、@max-null/dsh-capture（0.3.0）、@max-null/dsh-quick-toolbar（0.8.6）。\n- rc.1 设定 API 形态：官方 `settings` 宿主三段式（host `settings.installSection(ctx, NS, Config(schemastery z), config, {setSource,onChange})` + client `settingsScope.bind({namespace:NS})` + `settings.plugin.item` keyed 卡片，卡片样式 = 官方白卡 12px、header/desc、IconChevronDownOutline14、cardOpen 底 layer-2、家族开关 40×22）。\n- 迁移原则（用户拍板）：**「把设置迁移到新位置」**——三个插件设置一律迁到 settings 新卡片；参数少的用内置卡片（ppp 三段式），参数多的保留独立页（plugin-center / memory-manage 先例）。\n- 非设置项：quick-toolbar 悬浮球按官方设计方案、侧栏/底栏图标用 better-sidebar 官方同款（框+实心内条）。\n\n## 测试体系（tests/plugin-adapt，纳入 shell workspace）\n\n- 定位：SSiD 插件实机适配回归（连 dev 运行中实例，默认 CDP `127.0.0.1:9222`）。\n- 断言四层：\n  - L1 Boot 健康：页面就绪、无 `Failed to load plugins`、console 0 error/exception（导航前注册捕获）。\n  - L2 界面契约：`data-slot`/`aria-label` 锚点、`style[data-plugin]` 注入、布局顺序（横向 bbox 比较）。\n  - L3 功能可用：真实交互闭环（点击 → toast/结果）。\n  - L4 样式契约回归：按钮行 computed style 快照 vs 基线 JSON（`pnpm baseline` 更新；像素截图路线判定不可行，见 README 已知坑）。\n- 基线入库：签名变化需人工确认后重生成；截图用例排在 toast 触发用例之前、`caret:'hide'`。\n- 服务面：L1 全绿为发版门槛（typecheck + test 全绿）。\n\n## 发布面\n\n- 三个自研插件：npm 发布（用户手动 F2A）+ vendor 三处同步（plugins 源 / profile-template/vendor / dev profile vendor；`git diff --no-index` 与 MD5 双核对）。\n- 归档：`prepare-runtime.mjs` 重建（官方 registry，不设 SSID_REGISTRY——rc.1 已上官方 npm）。\n- 老用户升级：版本指纹不一致 → 自动重部署（约 30 秒可跳过）。\n"},{"file":"2026-09-02-DSH-alpha2到alpha4-上游变更清单.md","date":"2026-09-02","slug":"DSH-alpha2到alpha4-上游变更清单","title":"DSH 0.1.2-alpha.2 → 0.1.2-alpha.4 上游变更清单（2026-09-02）","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh-experimental-code-runtime-python","@deepseek-ai/dsh-session","dsh-alpha2","dsh-experimental-code-runtime-python","dsh-session","#3186"],"summary":"- CPython 子进程后端（c388169cff + ~130 跟进修复）：新包 packages/experimental/code-runtime-python（@deepseek-ai/dsh-experimental-code-runtime-python， private）；fd-3 帧协议、SIGXCPU 重置/软限钳制、RLIMIT 预算门 （maxLogBytes/maxVal","bytes":7747,"lines":109,"body":"# DSH 0.1.2-alpha.2 → 0.1.2-alpha.4 上游变更清单（2026-09-02）\n\n> 状态：记录（推断 · 2026-09-12）\n\n> 拉取总结（基于全部 338 个 non-merge 提交的实际 diff 阅读，非标题推断）。\n> 拉取布局：主工作区 `deepseek-harness/` 保持 alpha.2（运行环境）；官方主线在独立\n> worktree `H:\\MaxNull\\WorkStation\\deepseek-harness-alpha4`（master @ 4e84901e64）。\n> 规模：338 提交（feat 18 / perf 22 / fix 132 / docs 68 / test 64 / refactor 13 /\n> chore 11 / ci 3 / revert 2 / release 2 / cleanup 1 / style 1），\n> 2901 文件 +39496 / -31644。\n\n## 新增功能\n\n- **CPython 子进程后端**（c388169cff + ~130 跟进修复）：新包\n  `packages/experimental/code-runtime-python`（`@deepseek-ai/dsh-experimental-code-runtime-python`，\n  private）；fd-3 帧协议、SIGXCPU 重置/软限钳制、RLIMIT 预算门\n  （maxLogBytes/maxValueBytes 载入即校验）、同组进程 reap、输出按序列化成本计量；\n  053d17f6a1 整体迁入 experimental，d6bd5eb973 限界解释器版本探测，7f84a825c9 定稿 provider 契约。\n- **全会话 turn rail**（7e2eacb1fe / b3064cca77 / 6af1ee49b1 / 3a834fe6c9）：新包\n  `session-turn-outline`（每 turn 号 / start seq / 首提示预览投影，挂 web-app bundle）；\n  ui-chat 固定间距可滚动 turn rail 与 load-and-jump；218bb7f645 在 `ISession` 新增\n  **`loadThrough(seq)`** 深历史分页（共享 low-water 重定向 + no-progress 守卫）；\n  0e63841189 settled-response 预览、b7053eba79 限界超大预览块。\n- **web fetch 默认暴露**（0a0f9e59ff + cf7b0bd5a4 + ca723d9273）：base/headless/sdk-app\n  的 `tool-web` 行 `fetch: false → true`（Web 禁用该行、按 agent preset 组合）。\n- **PTC preset 去掉 workflow**（0cdcc9c3c5）：Web ptc preset 禁用 `tool-workflow` 行\n  （`workflow-worker-thread` 与 `ralph` 保留），Standard/Creator 不变。\n- **subagent steer 图像交付**（7c38fd8102 + ec493c2db8 + 53f5418a72）：turn 关闭窗口内的\n  steer/跟进改新 turn 认领；可继续子代理跟进接受图片部件（宿主先准入持久化再入 inbox；\n  模型拒图则拒交付）；queue dock 渲染图片缩略图；fixes #3186。\n- 其他：4df85c85ff PR open 初始化 Issue 开始日期（`.github/issue-management/policy.mjs`）；\n  2480bdf27a Workspace Write 中文文案；7020c7e122/3ce5604a71 超级椭圆圆角 + 发丝线\n  elevation 描边。\n\n## 修复（代表性）\n\n- ff21366916 输入机 Tab 完成高亮命令（候选 drill 动作优先）\n- 25e4527f5e + 5257c75092 llm profile headers 按 Fetch 可表示性校验（不可表示即配置错误拒绝）\n- 49bf26a794 网关 WebSocket 心跳改 2 次 missed 才断开（`stream-server.ts` 的\n  `MAX_MISSED_HEARTBEATS`），慢主机不再误判掉线\n- 7222e17dc0 `read_image` 接受无扩展名附件路径（`sniffImageMediaType` 文件签名识别，\n  `INVALID_IMAGE` 诊断带路径）\n- 1dd3e60f50 + d8e2ac5052 流式代码围栏增量渲染（`CodeBlock.tsx` / `highlight.ts` /\n  `incremental.ts` 重构）\n- 2e21d210a5 trajectory 替换窗口重锚；39b90961c7 / 62f707bb1d / db5417ff6f jump 与\n  分页器所有权；32d681f023 空恢复模型选择保留；d7abd0a01e 空白会话先激活选中视图再 blank 门控\n\n## 重构与性能优化\n\n- **27bf1039db refactor(session)!（breaking）**：`packages/util/brand` 新增 `brandNumber`；\n  `@deepseek-ai/dsh-session/types` 引入 **`SessionSeq`**（事件序号）与 **`SessionLogOffset`**\n  （log 偏移/前缀长）双品牌；`SessionEvent.seq`、`SurfaceOp.replace.start/end`、\n  `sourceEventSeqs` 全部品牌化；`SessionHeader.seedLength?` → **`isSeeded: boolean`**，\n  `CreateSessionOptions.meta.seedLength` → `isSeeded` + `inheritedEventCount`；\n  物理 JSONL v0 行仍存可选 `seedLength`（向后兼容读）。\n- **4553c9d957 refactor(session)!（breaking）**：删除整个 `session-persistence-sqlite` 包\n  （codec/schema/store/sql/压缩字典），会话持久化只留 JSONL。\n- **5660f44d29（连带 bcfec8d1c3 / 47e6448e23）（breaking）**：`Session.events` getter\n  删除 → **`eventAt(seq)`** + **`snapshotEvents(fromSeq, toSeqExclusive)`** 半开区间快照；\n  `Session.seeded` 新布尔字段。\n- **4203317e18 perf(client)**：`ConversationNodeAssembler` 按需物化 target——\n  `activeTargets()` 更名 **`activityTargets()`**、新增 `activateTarget(target)`；\n  未激活 target 不建 builder/snapshot；buildLocationData 回传上次 publication，\n  未变则原样返回。\n- **perf(chat)**：e32437d18b 滚动几何采样节流 500ms + `scrollend` 终采样\n  （`SCROLL_SAMPLE_INTERVAL_MS`）；0e90d47d19 `ChatNodeList` memo 跳过稳定 order 映射；\n  c809098b06 / 5934201109 streaming publication 合并到 2→3 帧；\n  81431381d6 / 2ab37e9558 location projection 复用与 trajectory 先分页再渲染；\n  faa61ada74 视口外语法高亮延迟；8478de9b0e 工具体格式化延迟到展开；86c6d9345e 等。\n\n## 插件生态影响（升级前必读）\n\n1. **Session 读取 API 破坏**：任何调用 `session.events` 的插件必须改为\n   `snapshotEvents()` / `eventAt()`；`seeded` 字段取代隐式判断。\n2. **类型品牌化**：`SessionSeq` / `SessionLogOffset` 改变公开签名（运行时仍是 number，\n   但 TS 编译期强制品牌），`@deepseek-ai/dsh-session` 消费者需重新类型化。\n3. **Client observable 契约收紧**（b8a19413e9）：`ChatNodeSource` / `ChatNodeProcessSource`\n   的 `getSnapshot` / `subscribe` 必须是 readonly 函数属性而非类方法；\n   **`InboxState.claimed` → `currentClaimed`**（拒绝的 claim 不再分类后续消息）。\n4. **注入面新增**（577f0cf7d9）：slot 注入契约新增 **`keyedHooks` compartment**\n   （`KeyedHooksSources = Record\u003cstring, KeyedStandardSource>`），合成\n   `use\u003cName>(key, selector?)` 键控选择器 hooks；`bindInjectHooks` → `bindInjectSources`；\n   chat 节点订阅源改为 keyed 形态（scoped-slots / ui-slots 同步）。\n5. **session-projection 事件语义**：ceadd90e71 identity 门控（视图 Object.is 相同不推送）\n   + 9069a8b6f8 每步视图比较（不存 dedup baseline）；acc23f6d9c 的 viewKey token 已被\n   a2437db180 回退——最终形态是 \"per-step raw-view gate\"。\n6. **Assembler 激活语义**：第三方 View 通过自身订阅激活 target（`activateTarget`），\n   未激活无快照；`activeTargets` 只反映已物化快照；turn-rail 依赖新\n   `session-turn-outline` 投影单元。\n7. **工具面**：base/headless/sdk 默认新增 `web_fetch`（匿名 fetch 仅公开 HTTP(S)），\n   Web 按 preset 组合不受影响；PTC preset 的 `workflow` 绑定移除。\n\n## 其他\n\n- docs / notes 双语文档海量同步（config-catalog、module-graph、子系统文档）。\n- CI 加固：161c6591be 首个 gate 失败即停、a074e6131f 超时与 store-scan 降本、\n  e2ef25b06e Windows 零构建覆盖率、4032a0a428 ReFS block-clone。\n- 两个 release 提交（a9e185f205 / 14bab4422b）为全包版本号提升，无 CHANGELOG 变更。\n- 依赖锁与第三方 notices 同步。\n\n## 备注\n\n- 主 checkout 曾因 `git pull` 在 alpha.2 分支上短暂被快进至 alpha.4，已\n  `git reset --hard 0a53fb55be` 恢复；最终布局 = 主工作区 alpha.2 + worktree alpha.4。\n- 仓库遗留 2 条旧 stash（`ds-harness-remote trustedHosts 适配（alpha.1 时代）`、\n  `fix-3198-resume-seq-gap: temp: switch to official master`），非本批产物，待人工裁决。\n- 在 alpha.4 上运行前需在 worktree 内 `pnpm install`；建议随 SSiD 下一次内核升级窗口\n  统一适配（全景 breaking 见「插件生态影响」）。\n"},{"file":"2026-09-02-SSiD内核升级-alpha.4执行指南.md","date":"2026-09-02","slug":"SSiD内核升级-alpha.4执行指南","title":"SSiD 内核升级执行指南：DSH 0.1.2-alpha.2 → 0.1.2-alpha.4（2026-09-02）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@deepseek-ai/dsh","@deepseek-ai/dsh-","@max-null/dsh-node-appearance","@max-null/dsh-plugin-center","@max-null/dsh-chat-rail","@deepseek-ai/dsh-session-turn-outline","@deepseek-ai/dsh-attachment","dsh-alpha2","dsh-context","dsh-node-appearance","dsh-plugin-center","dsh-chat-rail"],"summary":"- shell/scripts/prepare-runtime.mjs 的 DSHVERSION 自动读取 DSHCHECKOUT（默认 H:/MaxNull/WorkStation/deepseek-harness = alpha.2）的 apps/cli/package.json。 - 发版/归档重建时：$env:DSHCHECKOUT='H:/MaxNull/WorkStation/deep","bytes":8299,"lines":111,"body":"# SSiD 内核升级执行指南：DSH 0.1.2-alpha.2 → 0.1.2-alpha.4（2026-09-02）\n\n> 执行方：web 端（3080）会话（当前宿主）；验证对象：SSiD dev（`~/.dsh/profiles/ssid`）。\n> 状态：进行中（推断 · 2026-09-12）\n\n> 官方 npm 已发布 `@deepseek-ai/dsh@0.1.2-alpha.4`（与全部 30 个 `@deepseek-ai/dsh-*` 子包）——无需私有源/源码模式。\n> 上游变更全景（α.2→α.4 338 提交）见 `docs/决策/2026-09-02-DSH-alpha2到alpha4-上游变更清单.md`。\n\n## 1. 升级矩阵（npm latest 核对，2026-09-02）\n\n| 包 | ssid 现状 | 目标 | 决策依据 |\n|---|---|---|---|\n| @deepseek-ai/dsh 及 30 个 dsh-* 子包 | 0.1.2-alpha.2 | **0.1.2-alpha.4** | 官方 npm 全家族已发 |\n| dsh-context | 0.38.5 | **0.40.1** | 8/31 发布，适配新内核；peer 全 `>=0.1.1-rc.2` semver 兼容 |\n| @max-null/dsh-node-appearance | 0.3.4 | **0.3.5** | 8/31 发布（steering 图标锚点迁移修复）；模板侧已 pin 0.3.5（1b8b14e） |\n| @max-null/dsh-plugin-center | 0.2.17 | 0.2.17 | 已最新（**模板侧 0.2.16 → 0.2.17 需同步**） |\n| @max-null/dsh-chat-rail | 0.5.1 | 0.5.1 | 已最新（昨日发布） |\n| dsh-better-sidebar | 0.18.0-alpha.0 | **保持** | 作者适配 alpha.2 的最新版；peer `^0.1.2-alpha.2` semver 含 alpha.4；本地超前 npm latest(0.17.1) 以本地为准 |\n| 其余（genui/pocket/session-manager/sidebar-qa/dream-skin/video/excel/office/harness-remote/@max-null 全系） | — | 不变 | 均已 npm 最新 |\n\n## 2. 内核版本来源（重要）\n\n- `shell/scripts/prepare-runtime.mjs` 的 `DSH_VERSION` **自动读取** `DSH_CHECKOUT`（默认\n  `H:/MaxNull/WorkStation/deepseek-harness` = alpha.2）的 `apps/cli/package.json`。\n- **发版/归档重建时**：`$env:DSH_CHECKOUT='H:/MaxNull/WorkStation/deepseek-harness-alpha4'`\n  → 自动解析为 0.1.2-alpha.4（alpha.4 源码已在独立 worktree）。\n- **MISSING_PEERS 无需补充**：α.4 新增包仅 `code-runtime-python`（experimental/private 不发布）\n  与 `dsh-session-turn-outline`（官方 web-app bundle 以 **dependencies** 引用 → 闭包自动拉入）。\n\n## 3. 改动清单（本次）\n\n### 3.1 ssid dev profile（`~/.dsh/profiles/ssid/package.json`）\n1. 全部 `@deepseek-ai/dsh-*` 依赖：`0.1.2-alpha.2` → `0.1.2-alpha.4`（30 个，精确 pin，node 写 JSON）\n2. `dsh-context`：`0.38.5` → `0.40.1`\n3. `@max-null/dsh-node-appearance`：`0.3.4` → `0.3.5`\n4. `@max-null/dsh-chat-rail`：`0.5.1`（2026-09-01 已完成，实体已同步）\n5. `@max-null/dsh-plugin-center`：`0.2.17`（已最新）\n\n### 3.2 profile-template（`shell/profile-template/package.json`，双处声明铁律）\n1. `dsh-context`：`0.38.5` → `0.40.1`\n2. `@max-null/dsh-plugin-center`：`0.2.16` → `0.2.17`\n3. `@max-null/dsh-node-appearance`：`0.3.5`（已一致）；`@max-null/dsh-chat-rail`：`0.5.1`（已一致）\n4. 内核族不在 template（prepare-runtime 注入），无需改\n\n### 3.3 执行前置\n- 备份：`package.json.pre-alpha2-$(date)`（回滚用）\n- **pnpm install 必须等 SSiD 实例完全退出**（node-pty 原生模块被 SSiD 内核占用 →\n  `ERR_PNPM_EPERM`，2026-09-01 chat-rail 升级实踩）。\n\n## 4. 启动验证清单（SSiD 重启后逐项）\n\n1. 壳正常 boot（无 `Failed to load plugins` / pending waiting for service）。\n2. `~/.dsh/profiles/ssid/.runtime-version`（dev 未部署）或日志确认内核 = 0.1.2-alpha.4。\n3. 插件中心：bundles 无 failed；node-appearance 0.3.5 / context 0.40.1 / plugin-center\n   0.2.17 / chat-rail 0.5.1 显示无更新提示。\n4. 功能抽查（按 2026-08-29 指南 §4 清单）：会话管理面板、插件中心 toggle、SSiD 面板\n   （习惯/Guardian/上下文医生）、better-sidebar 双面板动画、**chat-rail 导航跳转**（上次修复点）。\n5. 大会话长跳转（多页补载）与 turn rail（α.4 官方新增全会话 turn rail——与 chat-rail 导航并存，确认无遮挡/重复）。\n6. console 0 error。\n\n## 5. 风险与回滚\n\n- **breaking 面**（α.2→α.4 变更清单「插件生态影响」）：`session.events` → `snapshotEvents/eventAt`\n  （@max-null 全家桶未用 `events`——chat-rail 用 getSnapshot/loadOlder，已核）；`InboxState.claimed` →\n  `currentClaimed`；注入面 `keyedHooks`。若插件出现上述 API 报错，按变量名定位修复。\n- **better-sidebar 0.18.0-alpha.0 在 α.4 的运行时兼容**为最大不确定项（作者未发 α.4 适配版）；\n  异常时记录并等待作者版本或临时屏蔽（官方 turn rail 与 chat-rail 已覆盖导航能力）。\n- 回滚：恢复 `package.json.pre-alpha2-*` → `pnpm install` → 重启 SSiD 即回 α.2 闭包。\n\n## 6. 执行记录（2026-09-02，web 会话）\n\n- **停止 SSiD dev**（authorized：dev 验证对象可操作）→ `pnpm install` 14.2s（+238 包，\n  node-pty 顺利通过——上次 EPERM 卡点随 SSiD 关闭解除）→ 实体校验全过：\n  `@deepseek-ai/dsh 0.1.2-alpha.4`、`dsh-context 0.40.1`、`@max-null/dsh-node-appearance 0.3.5`、\n  `@max-null/dsh-chat-rail 0.5.1`、`@max-null/dsh-plugin-center 0.2.17`、\n  `dsh-better-sidebar 0.18.0-alpha.0`（保持）、`@deepseek-ai/dsh-session-turn-outline 0.1.2-alpha.4`\n  （官方 bundle dependencies 自动拉入，闭包不缺失 ✅）。\n- **重启 SSiD dev**（`npm start`）：`phase start() completed`、`loadURL ok`、内核端口 3082 HTTP 200；\n  本次启动日志 0 Error（历史段的 typert-registry 导入失败为 alpha.2 时代旧记录）；\n  `[sidebar-diag]`、`[theme-observer]` 正常 → better-sidebar 已运行。\n- **内核选择确认**：dev 模式走 `bootKernel` 部署锚点分支（`DSH_CHECKOUT` 进程/User/Machine 级\n  均无残留；`profile/node_modules/@deepseek-ai/dsh` 存在）→ 实测运行 **npm 0.1.2-alpha.4 实体**\n  （非并列源码 alpha.2）。\n- **待用户目视确认**：插件中心版本号/无 failed、SSiD 面板（习惯/Guardian/上下文医生）、\n  chat-rail 导航跳转、官方 α.4 新增 turn rail 与 chat-rail 并存无遮挡、console 0 error。\n\n## 7. 回滚记录（2026-09-02 下午）\n\n- **结论**：α.4 在 SSiD 上为净负收益——打开**大体积旧时代历史会话**（19MB/1MB 级，\n  8/18-8/31 各项目目录会话）时进入「载入历史…」后长时间不渲染（20s+ 未见消息行，\n  伴随 1 处 400），升级前 α.2 无此现象（用户确认「α.2→α.4 有点崩」）。\n  新会话（609KB，升级后创建）打开正常；文件层/索引/请求链路经 20+ 探针验证全部健康。\n- **回滚矩阵**（恢复 8/31 已验证组合）：@deepseek-ai/dsh 及子包 31 个 `alpha.4 → alpha.2`、\n  `dsh-context 0.40.1 → 0.38.5`、`@max-null/dsh-node-appearance 0.3.5 → 0.3.4`\n  （两处声明已同步；template 的 plugin-center 0.2.17 / chat-rail 0.5.1 保留——与内核无关）。\n- **关键坑（pnpm 11 版本漂移）**：只有 top-level 声明 pin 是不够的——官方 bundle 的\n  `workspace:^` 依赖在 npm 上解析为 `^0.1.2-alpha.x`，会把闭包内 183 个官方子包拉到\n  **npm 最新版（alpha.4）**，与 top-level α.2 混合 → boot 报\n  `@deepseek-ai/dsh-attachment does not provide an export named 'admitPromptContent'`\n  （混合不一致的经典症状）。8/31 正常是因为当时 npm 最新 = α.2（α.3 于 9/1 00:20 才发布）。\n  **修复**：以 8/31 归档（dsh-runtime.tar.gz，214 包全 α.2）为基准生成\n  `@deepseek-ai/dsh-*` 枚举 overrides（**pnpm 11 的 overrides 必须写在\n  `pnpm-workspace.yaml`，package.json 的 `pnpm.overrides` 已不生效**）→ install\n  后实体扫描 214/214 全 α.2 → boot 成功。\n- **执行结果**：SSiD boot ok / start() completed / 全插件挂载 / 0 error；\n  历史会话（插件更新批量，8/31）点开 12s 内 rows=37 完整渲染 ✅；\n  数据零丢失（sessions-ssid 会话目录完整）。\n- **执行**：SSiD 关闭后 `pnpm install`（ssid profile）→ 重启 → 用户验证历史会话恢复。\n- **α.4 后续**：本轮变更已沉淀为两份文档（本节 + 2026-09-02-DSH-alpha2到alpha4-上游变更清单）；\n  根因（大历史会话重放/400）留待 alpha4 worktree 专项研究，SSiD 基线保持 α.2。\n"},{"file":"2026-09-01-chat-rail-0.5.1发版与SSiD同步.md","date":"2026-09-01","slug":"chat-rail-0.5.1发版与SSiD同步","title":"chat-rail 0.5.1 发版与 SSiD 同步（2026-09-01）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-chat-rail","dsh-chat-rail"],"summary":"DSH 0.1.2-alpha.2（SSiD v0.1.17 起的内核）把 Conversation 目标数据移出 Session 快照： session.getSnapshot() 不再携带 chat.nodes，Chat 节点迁入 uiConversation 服务的 'chat' 视图目标（ChatSnapshot.nodes keyed store）。chat-rail 0.5.0 在新内","bytes":2163,"lines":37,"body":"# chat-rail 0.5.1 发版与 SSiD 同步（2026-09-01）\n\n> 状态：进行中（推断 · 2026-09-12）\n\n## 背景\n\nDSH `0.1.2-alpha.2`（SSiD v0.1.17 起的内核）把 Conversation 目标数据移出 Session 快照：\n`session.getSnapshot()` 不再携带 `chat.nodes`，Chat 节点迁入 `uiConversation` 服务的\n`'chat'` 视图目标（`ChatSnapshot.nodes` keyed store）。chat-rail 0.5.0 在新内核上\n「点击导航跳转失效」：加载探测读死字段 → 翻页到 `hasMore` 耗尽仍放弃 → 不滚动\n（`[chat-rail] jumpToMessage: node … not loaded after N page(s)`）。\n\n## 修复与发版（dsh-chat-rail 仓库）\n\n- `0c3b0de` fix：双数据通道适配——`uiConversation.binding(id).target('chat')` 优先，\n  旧 `chat.nodes` Map 兼容回退；`jumpToMessage` 改用 `nodeOf` 实时探测；\n  collect/tip 读取同步适配。新增 `tests/client-nodes.spec.ts`（11 例，34/34 全绿）。\n- `b26ec57` release: v0.5.1（package.json + `docs/release-notes-v0.5.1.md`），tag `v0.5.1` 已推送。\n- L1：typecheck ✅ / test 34/34 ✅；L2（web 环境用户实测）：跳转正常 ✅。\n\n## 发布分工（既定惯例）\n\n- 代理（本会话）：版本 bump、构建、GitHub 提交/tag `v0.5.1`、SSiD 模板同步 —— ✅ 已完成。\n- 用户：`npm login` 后手动 `npm publish`（npm 2FA，代理 E401 无法代发）。\n- **发布后待办**：\n  1. `~/.dsh/profiles/web` 与 `~/.dsh/profiles/ssid` 的 package.json 声明\n     `0.5.0`（或 `^0.5.0`）→ `0.5.1` + `pnpm install`（web 当前为 dev 热更新形态，\n     与本发布同代码；install 后即与 npm 一致）。\n  2. SSiD dev profile 复验（下次归档/发版走正常流程，无需 pre-release 动作）。\n\n## SSiD 同步范围（本次）\n\n- `shell/profile-template/package.json`：`@max-null/dsh-chat-rail` `0.5.0` → `0.5.1`（精确版本）。\n- 未动 `minimumReleaseAgeExclude`：2026-08-22 起 `minimumReleaseAge: 0` 已关闭年龄保护，\n  该名单仅历史遗留（参见模板 pnpm-workspace.yaml 注释）。\n- 未动 SSiD 版本号（v0.1.17 未发；本次为依赖 patch 同步，随下次发版归档）。\n"},{"file":"2026-08-29-DSH-master插件适配测试报告.md","date":"2026-08-29","slug":"DSH-master插件适配测试报告","title":"DSH master 插件适配测试报告","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-29","dateNote":null,"tags":["@deepseek-ai/dsh-base","@deepseek-ai/dsh-web-app","@deepseek-ai/dsh-client-runtime","@deepseek-ai/dsh-client-modules","@max-null/dsh-","@deepseek-ai/dsh-client-store","@max-null/dsh-plugin-center","@max-null/dsh-skill-mcp-center","@max-null/dsh-achievements","@deepseek-ai/dsh-client-ui-chat","dsh-master","dsh-base"],"summary":"- 纯净版（仅 @deepseek-ai/dsh-base + @deepseek-ai/dsh-web-app）→ 新增会话/完整对话链路正常；旧依赖（web profile 的 node-pty）AttachConsole failed 报错消失。 - 共测试 26 项插件：24 项 ✅ 适配，2 项 ❌ 不兼容，2 项 ⚠️ 有小问题。 - ❌ 共性问题：预编译 bundle 型插件（无源码","bytes":21432,"lines":154,"body":"# DSH master 插件适配测试报告\n\n- 日期：2026-08-29\n- 背景：deepseek-harness 拉取最新 master（0.1.2-alpha.1 之后），相对 SSiD 安装版内置的 0.1.1-rc.2 有大量架构变化。web 版 DSH（`dsh web`，3080）启动后出现插件加载失败、新增会话不可用等异常，需确认插件全家桶对 master 的适配情况。\n- 测试环境：`C:\\Users\\MaxNull\\.dsh\\profiles\\web`（web profile，源码模式 `node --import tsx/esm apps/cli/src/bin.ts web`），Playwright 驱动 UI 验证。\n\n> 状态：进行中（推断 · 2026-09-12）\n\n## 结论速览\n\n- 纯净版（仅 `@deepseek-ai/dsh-base` + `@deepseek-ai/dsh-web-app`）→ 新增会话/完整对话链路正常；旧依赖（web profile 的 node-pty）`AttachConsole failed` 报错消失。\n- 共测试 26 项插件：**24 项 ✅ 适配，2 项 ❌ 不兼容，2 项 ⚠️ 有小问题**。\n- ❌ 共性问题：预编译 bundle 型插件（无源码、`lib/client.js` 为 `__ModuleLoader__` 包裹的 CJS）内部 `require(\"@deepseek-ai/dsh-client-runtime/client\")`，而 master 的 client 模块表已无该 key（见根因分析）。\n\n## 测试矩阵\n\n| 类别 | 插件 | 版本 | 结果 | 说明 |\n|---|---|---|---|---|\n| 预制 | dsh-better-sidebar | 0.17.1 | ✅ | 折叠分组/设置入口「侧边卡片」正常 |\n| 预制 | better-sidebar-plugin-office | 0.1.2 | ✅ | — |\n| 预制 | dsh-sidebar-qa | 0.4.0 | ✅ | — |\n| 预制 | dsh-capture | 0.2.1 | ✅ | 输入栏「截图」按钮挂载正常；tray/热键依赖壳注入 |\n| 预制 | dsh-header-unify | 0.1.0 | ✅ | 壳端插件，web 端验证加载兼容即可（用户确认无需启用） |\n| 预制 | dsh-ssid-panels | 0.1.9 | ✅ | 「关于 SSiD」页完整：版本/通知/会话存储（独立根 183 + 共享根 184 隔离与载入/移除）/更新日志/预制插件清单 |\n| 预制 | dsh-ssid-zh-ui | 0.1.0 | ✅ | — |\n| 预制 | dsh-genui | 0.9.6 (npm) | ✅ | 渲染链路实测（agent 自动渲染测试卡片） |\n| 预制 | dsh-session-manager | 0.2.2 | ✅ | 对话管理面板完整（119 会话/未读/继续/路径）；**⚠️ 回收站加载失败** |\n| 预制 | open-sea-skin | 1.2.1 | ⚠️ | 面板/设置/开关功能正常；**❌ i18n 不跟随 DSH locale**（按钮/面板全英文，根因见下） |\n| 预制 | dsh-context-doctor | 0.6.1 | ❌ | client 模块表缺失 → 整页 Failed to load plugins（已回滚） |\n| 用户批 | dsh-memory | 0.6.0 | ✅ | 记忆面板完整（15 条全局记忆/注入预览/搜索/过滤/常驻注入开关） |\n| 用户批 | dsh-chinese-thinking | 0.3.0 | ✅ | 思考过程/回复均为中文 |\n| 用户批 | dsh-guardian | 0.2.0 | ✅ | 无拦截异常 |\n| 用户批 | dsh-chat-rail | 0.4.0 | ✅ | 消息「收藏消息」「填充到输入框」按钮挂载正常 |\n| 用户批 | dsh-habit | 0.2.0 | ✅ | — |\n| 用户批 | dsh-node-appearance | 0.3.3 | ✅ | 设置「节点外观」完整（思考开关/工具颜色/覆盖） |\n| 用户批 | dsh-draft-polish | 0.2.1 | ✅ | 输入栏「润色」按钮正常 |\n| 用户批 | dsh-plugin-center | 0.2.13 | ✅ | 插件更新弹窗正常（检测到 0.2.14） |\n| 用户批 | dsh-skill-mcp-center | 0.4.1 | ✅ | Skill & MCP 管理完整（18 skill/搜索/停用） |\n| 用户批 | dsh-achievements | 0.1.0 | ✅ | 成就面板（10/19 解锁，进度真实） |\n| 用户批 | dsh-context | 0.34.1 | ✅ | 上下文可视化全面（统计/趋势/浏览器/事件/Agent 网络/费用估算） |\n| 用户批 | dsh-video-preview | 0.1.4 | ✅ | — |\n| 用户批 | dsh-excel-panel | 0.6.1 | ✅ | — |\n| 用户批 | dsh-pocket | 1.14.5 | ✅ | 代理端口 3081 占用自动切 3082 |\n| 用户批 | ds-harness-remote | 0.4.1 | ✅ | host/client 身份就绪，与 dsh.r2049.cn 控制通道在线 |\n| 用户批 | dsh-dream-skin | 8.28.0 | ❌ | 与 context-doctor 同根因（已回滚） |\n\n## ❌ 根因分析：client 模块表演进\n\n- 旧 DSH（0.1.1-rc.2 时代）的 client bundle 通过 `require(\"@deepseek-ai/dsh-client-runtime/client\")` 获取共享运行时。\n- master 已将 client 模块体系重构为 `@deepseek-ai/dsh-client-modules`：shell 种下冻结的 `PLATFORM_MODULES` 表（React/Cordis/静态 UI 库），动态插件通过 `package.json` 的 `dsh.client` 声明 + `clientBundle()` 构建（产物 `lib/client.js`），非 baseline 请求走 `dsh.client.external` 精确声明。\n- `@deepseek-ai/dsh-client-runtime` 包在 master 已不存在（残留的 `runtime-diagnostics` README 仍引用旧名，待更新）。旧式独立 bundle 的裸 require 找不到该 key，load 失败并带着 `missed the module table` 错误；浏览器端因此整页 `Failed to load plugins`（任一加载失败均拖垮 shell）。\n- 与源码型插件（@max-null/dsh-*、npm 预编译但按新体系声明的第三方如 video-preview/excel-panel）不冲突：源码型插件重新打包时用新基线，旧 bundle 则卡死。\n\n## ⚠️ 问题细节\n\n### open-sea-skin i18n\n\n- 现象：悬浮按钮/面板文案全英文（DSH 界面语言为中文）。\n- 根因：`plugin/client.js` 的 `apply()` 创建 controller 时不传 `options.locale`；`selectCopy()` 回退 `document.documentElement.lang || navigator.language`，且面板创建时一次性选定、语言切换不刷新。\n- 修复资源：fork `Max-Null/open-sea-skin`（分支 `feat/quick-controls-enable-toggle`）的 `harness-plugin/src/client/index.ts` 已按新版架构实现 `ctx.locale.register(SETTINGS_NS, { zh, en })`（inject 含 `locale` 服务）——重建产物即可修好 i18n（同时完成旧 bundle → 新体系迁移）。\n\n### dsh-session-manager 回收站\n\n- 现象：「对话管理」面板显示「回收站加载失败」，其余管理功能（列表/未读/继续/路径）正常。\n- 疑似新 DSH 的回收站相关 API（trash/restore）结构变化；待深挖 0.2.2 源码确认。\n\n## 处理建议\n\n1. **open-sea-skin**：已本地修复（i18n 尾补丁 IIFE，见上「⚠️ 问题细节」；补丁 tgz 已同步 `~/.dsh/profiles/ssid/vendor` 与 `shell/profile-template/vendor`，下次重建 dsh-runtime.tar.gz 自动带上）。后续仍建议用 fork 源码（`Max-Null/open-sea-skin#feat/quick-controls-enable-toggle`，已实现 `ctx.locale.register`）按 master `clientBundle` 体系重建提 PR 到 d-dev01001/open-sea-skin。\n2. **dsh-context-doctor / dsh-dream-skin**：2026-08-29 追升结果——\n   - **context-doctor**：已本地完成 master API 迁移并构建 **0.6.2-master**（克隆上游 + 改 5 处：ClientContext 改 cordis、store 改 dsh-client-store、CLIENT_EXTERNALS 增删、slots augment 拉 ui-renderer、setup 链接重定向），实测 ✅（审计环/预算/四类统计全中文正常）。改动保留在 `.dsh-tmp/context-doctor-src`；**已提 PR**：[Zhenyu98/dsh-context-doctor#10](https://github.com/Zhenyu98/dsh-context-doctor/pull/10)（fork Max-Null：fix/master-client-modules，Closes #9）——上游采纳后 SSiD 归档可切回官方源。\n   - **dream-skin**：上游 main 与 npm 均为 8.28.0。本地定位到唯一旧引用 `require(\"@deepseek-ai/dsh-client-runtime/client\")`（6 处调用全部是 `defineStore`，master 的 `@deepseek-ai/dsh-client-store` 同签名且在种子表内）→ **一行替换**修好并本地验证 ✅（设置「Theme / 外观」面板完整：8 套皮肤/强调色/壁纸/透明度/主题包）。**已提 PR**：[RevolutionLA/dsh-dream-skin#42](https://github.com/RevolutionLA/dsh-dream-skin/pull/42)（fork Max-Null：fix/master-client-modules，v8.28.1，Closes #41）。\n3. **文档同步**：deepseek-harness 侧 `packages/runtime-diagnostics/invariants/README.md` 里的 `dsh-client-runtime` 旧名应更新为 `dsh-client-modules`（待上游 PR）。\n\n## 2026-08-29 升级记录（web 端追升）\n\n- dsh-session-manager 0.2.2 → **0.4.1**（npm）：✅ 功能增强（归档/移出归档/移动至工作区/迁移预设/删除会话，侧边栏「会话管理」入口）；0.2.2 的「回收站加载失败」问题消失。\n- （同日追升，插件中心清单）dsh-sidebar-qa 0.4.0 → **0.4.2**、@max-null/dsh-plugin-center 0.2.13 → **0.2.14**、@max-null/dsh-skill-mcp-center 0.4.1 → **0.4.2**、dsh-context 0.36.0 → **0.38.1**、dsh-pocket 1.14.5 → **1.16.1**：✅ 全部验证通过（context 0.38.1 上下文统计/浏览器/Agent 网络完整；pocket 代理 3082；插件中心「有更新 0」）。\n- @max-null/dsh-achievements 0.1.0 → **0.1.2**：✅（新增「收藏」成就等）。\n- dsh-context 0.34.1 → **0.36.0**：✅（上下文统计/趋势/浏览器正常）。\n- dsh-context-doctor 0.6.1 → **0.6.2-master**（本地构建）：✅ 详见上。\n- dsh-dream-skin：❌ 无新版（8.28.0 仍为最新，未适配）。\n\n## 2026-08-29 侧边栏 footer 布局修复（Remote/会话管理/设置）\n\n- **问题**：DSH master 侧边栏 footer 三个入口（Remote=ds-harness-remote、会话管理=dsh-session-manager 0.4.1、设置=官方）同排时互相挤压——会话管理被压窄成竖排文字，与官方「设置」样式不统一；收起态下 Remote 仍用 `isWide` 溢出错位（其插件自带的 `isRail` 未触发）。\n- **修复（dsh-ssid-panels client 尾补丁，v5 完整集）**：JS 从稳定类名（`.dshRemoteSidebarEntry`/`.sm-footerBtn`）向上定位官方 footer 容器并挂 `data-dsh-footer`（wide/rail，React 不覆盖 data-*）+ 注入 \u003cstyle> 规则（竖排全宽 or 图标 36px 居中、文字由 span 包裹后按 rail 隐藏）。纯 CSS 驱动（inline style 会被 React 重渲染清除，已排除）；嵌套 `:has()` 不受支持（已绕开）。\n- **实测**：展开态三行全宽横排（Remote→会话管理→设置，与官方样式对齐）；收起态三入口图标化 36px 居中、文字隐藏；无 console error。\n- 补丁集三处一致：`~/.dsh/profiles/{web,ssid}/vendor` + `shell/profile-template/vendor`（下次重建归档自动带上）。\n\n### 迭代收敛（v10–v22，图标对齐/尺寸/颜色/宽度/间距）\n\n- **展开态（wide）**：官方设置触发器自身带 `margin-left:-2px`（图标列 x=18），而 Remote/会话管理在 x=20 —— v16 给两插件行同加 `margin-left:-2px`，三方图标列统一 x=18。\n- **收起态（rail）居中根因（v17）**：`sm-footerBtn` 是 `display:flex; justify-content:center` 但含**两个** flex 子项——svg(18px) + 文本 span（宽 0 高 0 的占位，靠 `font-size:0` 藏字）+ 插件自带 `gap:6px`，整体内容盒实为 24px，居中后 svg 中心 25 vs 按钮中心 28，**偏左 3px**。官方设置/Remote 只有一个 svg 子项（gap 0）因此完全居中。修复：rail 下 `gap:0` + `> span { display:none }`（让占位 span 真正退流）。\n- **rail 图标尺寸（v18）**：v14 曾把 Remote rail 图标放大到 20px，而会话管理/官方设置是 18px，相邻三图标大小不一。统一 Remote 为 18px（与官方 rail 图标一致）。\n- **rail 图标颜色（v19）**：ds-harness-remote 自带 `.dshRemoteComputerIcon { color: var(--dsw-alias-label-secondary) }` 把图标强制为灰（svg 用 `stroke:currentColor`，按钮自身的黑色不生效）。修复：`.dshRemoteComputerIcon { color: rgb(28,28,30) !important }` 覆盖到与设置/会话管理一致。\n- **宽度与间距（v20–v22）**：①官方设置触发器的 `width:260px`（右缘 270）比另两行（256、右缘 266）宽 4px → 统一 256px；②wide 下 Remote 容器 `isWide` 自带 `margin-bottom:4px` 导致首段 8px、第二段 4px → 清 bottom margin，间距统一 4/4；rail 下 Remote/设置 margin 8/10 而会话管理 0（12px vs 8px）→ 三按钮统一 `margin:4px 0` + entry `height:auto`（官方 isRail 固定 54px 会多垫 4px），间距统一 8/8。\n- **两个 CSS 陷阱（本轮踩坑记录）**：①`data-dsh-footer` 只挂在 footerActions 上，`settingsArea` 是兄弟子树 → 针对设置按钮的规则全部静默失效，需 JS 给其单独挂 mark（稳定 class + 自身 data-dsh-footer）；②`[data-dsh-footer=\"rail\"] .EWqqVW_footerActions { gap:0 }` 用后代组合器不会匹配属性宿主自身，必须写成 `[data-dsh-footer=\"rail\"].EWqqVW_footerActions`。\n- **实测（v22 后，3080）**：wide 三按钮 x=10/w=256/右缘 266、图标 16×16@x18、黑色、间距 4/4、radius 12px、hover 背景一致 rgba(0,113,227,0.1)；rail 三按钮 36×36、图标 18×18 中心 28、黑色、间距 8/8；像素采样确认三行背景一致（透明透出 #f4f4f6）；无 console error。\n- 补丁发生器：`.dsh-tmp/patch-fix-sidebar-footer-v{10..22}.mjs`（每个追加一个幂等 IIFE style/JS 注入）。\n\n### 2026-08-29（下午）撤回 + 会话管理入口迁移到标题栏（header-unify）\n\n- **撤回**：footer 布局补丁 v1–v22 全部回滚——dsh-ssid-panels 三处 vendor（web/ssid/profile-template）恢复为插件源干净版（0.1.9，63750B，MD5 一致），footer 恢复 dsh-session-manager 0.4.1 官方样式。教训：与官方 footer 的 CSS Modules 哈希类 + 动态布局对抗成本过高（v16–v22 反复微调仍难收敛），改走\"入口迁移\"而非\"样式对齐\"。\n- **入口迁移（新方案）**：会话管理按钮从 footer 迁到「壳标题栏统一按钮组」——`dsh-header-unify`（v0.3.0）：\n  - DSH 侧：`HIDE_CSS` 加 `.sm-footerBtn { display:none !important }`（0.4.x）；`ssid:titlebar` detail=`session-manager` 桥接打开面板——优先 `.sm-footerBtn`（master 0.4.x，footer 按钮 display:none 后 JS click 仍触发 React onClick → panelStore.set(true)），兜底 `[data-dsh-header-button]`（rc.2 0.2.x header utilities 的「会话管理」按钮 → setDrawer({open:true,view:'manage'})）；另在会话 header（.sm-header）内嵌兜底按钮（web 无标题栏时用）。\n  - 壳侧：`shell/titlebar.html` 加「会话管理」按钮（btn-session-manager）+ `titlebar.js` 转发 `action('session-manager')`（main.mjs 的 `ssid:title:action` 转发本就通用字符串，无需改）。\n- **版本适配差异**：web/master 用 dsh-session-manager **0.4.1**（有 sm-footerBtn/sm-header，面板=SafePanel modal）；SSiD/rc.2 用 **0.2.2**（无 footer 按钮，header utilities 已有「会话管理」按钮 HeaderManageButton → 抽屉；稳定标识 `data-dsh-header-button`）。桥接函数双目标覆盖两版。\n- **已知待办**：dsh-header-unify 的 client.js 在 web/master 上**未激活**（rc.2 时代 `window.__ModuleLoader__.load` CJS 自注册 bundle，master Loader 不调用其 apply——v0.2 起 `toggleCluster` 隐藏就从未生效；页面无报错静默跳过）。列入「web DSH 升级测试」适配项：按 master 客户端插件规范迁移（package.json `dsh.client` schema + bundle 导出格式）。当前 SSiD（rc.2）上 v0.2 正常生效，v0.3 文件已同步三处 vendor，重启壳后生效。\n\n## 2026-08-29 用户升级计划与协作原则（原话记录）\n\n用户明确的双阶段升级计划与协作约定，后续所有工作遵循：\n\n- **双阶段升级计划（用户原话）**：「先通过 SSiD 发起会话升级 web DSH，并进行插件测试；完成后在 web DSH 开启会话升级 SSiD 并将插件更新，这样才能保证可用。」\n  - 第 1 阶段：SSiD（稳定基石）→ web DSH（试验场）：升级 master + 插件适配 + 测试。\n  - 第 2 阶段：web DSH → SSiD：确认可用后，把升级后的插件/配置回灌 SSiD。\n  - 目的：保证可用后再动 SSiD，避免把稳定环境搞坏。\n- **协作原则**：\n  - 当前会话运行在 54621（SSiD 壳）上——**不得重启/停止 54621 的任何进程**（会中断当前会话）；SSiD 保持稳定，只允许同步 vendor 文件，生效时机由用户安排。\n  - web（3080）不是当前会话宿主，可以随意重启验证。\n  - 用户对探索性尝试的反馈：「不要急」——小改动若反复不收敛，及时止损换方案（如 footer 样式对齐 → 放弃改为入口迁移）。\n- **dsh-header-unify 定位（用户澄清）**：header-unify 是 **SSiD 专属插件**，配合 SSiD 的壳（标题栏按钮组）把乱七八糟的插件按钮集成到壳的标题栏——不是给无壳的 web 用的；web 上其 master 激活问题属于第 1 阶段适配项。\n- **集成诉求（用户原话）**：「你把会话管理的按钮屏蔽了，集成到 header-unify 吧」「不要回滚 header-unify」。即：隐蔽 session-manager footer 按钮（0.4.x），入口统一到壳标题栏（v0.3 已实现）；header-unify 的改动不可回滚。\n\n## 2026-08-29（晚）web 三个插件升级（LLM 更新流程）\n\n- **dsh-dream-skin 8.28.1 → 8.29.0（vendor → switch-npm）**：本地为 vendor 8.28.1（带一行 require swap 定制）；8.29.0 发布说明含「Merge PR #42 · point defineStore require at dsh-client-store」——**本地定制已被上游采纳**（实测 8.29.0 client.js 中 `dsh-client-runtime` 出现 0 次）。依赖声明 `file:vendor\\dsh-dream-skin` → `8.29.0`，vendor 目录保留未删（可回退）。\n- **dsh-sidebar-qa 0.4.2 → 0.5.0**：插件中心标记「不兼容当前 DSH」——核实为**误判**：engines.dsh `>=0.1.2-alpha.1` 恰好等于运行时 master 源码版本 0.1.2-alpha.1；0.5.0 客户端含 13 处 `remote.session` 服务依赖，但 **master 提供该服务**（0.4.2 在 web 上运行正常即证据；SSiD rc.2 无此服务，血泪陷阱不适用于 web/master）。peer dsh-better-sidebar >=0.16.0（已装 0.17.1）✓。升级后页面加载正常、0 console error、无 pending。\n- **dsh-pocket 2.0.0 → 2.1.3**：patch 级（移动端工作区菜单 #72、iOS 触摸自适应、停止注入 dsh-desktop-* markers），peer 同 2.0.0，低风险直接升。\n- **连带发现与修复（重要）**：本轮 head-unify v0.3 在 master 上**被实际激活**（v0.2 时代在 web 上未激活——重装后 master loader 正常加载并调用 apply；SSiD 升级到 master 后必然同此）。因 v0.3 的 HIDE_CSS 会隐藏 pc-headerbtn/toggleCluster（设计给壳标题栏复制的入口），**无壳 web 上插件中心/侧栏按钮被切断**——修正：header-unify 按 `window.__SSID_SHELL__` 标志分支——壳环境（main.mjs 在 mainView dom-ready 后注入）才隐藏原按钮；无壳 web 保留。现在 web：插件中心/侧栏按钮保留 + 会话管理迁 header（footer 隐藏）+ titlebar 事件桥接均正常；SSiD：重启壳后标题栏接管行为不变。\n- **过程教训（BOM）**：PowerShell 5.1 `Set-Content -Encoding UTF8` 写 package.json 会带 BOM，DSH 的 `readProfileManifest`（JSON.parse）直接崩溃 `Unexpected token ﻿`——**改 profile JSON 一律用 node（writeFileSync utf8 无 BOM）**。已用 node 重写修复。\n- **实测（升级后 3080）**：三插件实体版本 8.29.0 / 0.5.0 / 2.1.3；插件中心「已安装」显示一致、开关状态启用；header「会话管理」按钮点击 → 面板正常；0 console error；已写入 `~/.dsh/plugin-center/llm-update-log.jsonl`。\n\n## 2026-08-29 open-sea-skin 移除决策\n\n- **原因**：open-sea-skin 导致部分面板半透明（WebGPU 背景叠加干扰面板/弹窗显示）。\n- **动作**：①web profile 卸载（依赖/bundle/vendor tgz）；②SSiD 预制清单移除（`profile-template/package.json` 的 dependencies+bundles、`profile-template/vendor` 与 `~/.dsh/profiles/ssid/vendor` 的 tgz、vendor README 条目）；③下次发版重建 dsh-runtime.tar.gz 时生效。\n- **修复不浪费**：i18n 尾补丁修复（跟随 DSH document lang，与本地一致但基于上游 1.2.1 原版字典）**已提报告原仓库**：[d-dev0101/open-sea-skin#6](https://github.com/d-dev0101/open-sea-skin/pull/6)（v1.2.2，fix/i18n-locale-follow）。注意上游正确仓库是 **d-dev0101**（非 d-dev01001）。\n- **剩余引用检查**：scripts/repack-open-sea-skin-vendor.mjs 及其在发版流程里的调用需在下次发版时移除/更新。\n\n## 2026-08-29 原生轮次导航栏屏蔽（TurnNavigator rail）\n\n- **对象**：DSH master `@deepseek-ai/dsh-client-ui-chat` 的 TurnNavigator（消息流右侧轮次导航竖轨，aria-label「轮次导航/Turn navigation」，items\u003c2 不渲染）。\n- **屏蔽方案（已生效）**：在 `dsh-ssid-panels` 的 client.js 追加尾补丁 IIFE（`dsh-ssid-hide-turn-rail` style 规则，aria-label 双文案锚点），已同步 `~/.dsh/profiles/{web,ssid}/vendor` 与 `shell/profile-template/vendor`。\n- **可借鉴设计（官方 rail 优于我们的点）**：①轮次 hover 预览（prompt/response 浮层 + 指针定位）②完整 aria（jump/turn/current）③marks 溢出压缩与 inset 布局 ④翻页锚点补偿（pagingAnchor）。局限性：仅轮次跳转，无收藏/复用。\n- **正轨跟进（待办）**：向 deepseek-harness 提 PR——ui-chat 的 `ChatSettings` 增加 `showTurnRail`（默认 true）配置，SSiD 侧设置关闭后可移除本补丁。\n\n\n\n- 3080 web 实例运行 27 个 bundle（官方 2 + 预制 9 + 用户批 16 中可用 15 + 无 context-doctor/dream-skin），无 console error。\n- web profile 备份：`~/.dsh/profiles/web/.bak-pure-20260829-111424/`（配置 + node_modules + vendor）。\n- 回滚项：dsh-context-doctor、dsh-dream-skin（bundle 与依赖均已清理，可随时按本报告恢复测试）。\n"},{"file":"2026-08-29-SSiD升级执行记录.md","date":"2026-08-29","slug":"SSiD升级执行记录","title":"SSiD 升级执行记录（web → SSiD 回灌，第 2 阶段）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-29","dateNote":"晚","tags":["@deepseek-ai/dsh","@max-null/dsh-plugin-center","@max-null/dsh-skill-mcp-center","@max-null/dsh-achievements","@playwright/mcp","dsh-master","dsh-runtime","dsh-0","dsh-session-manager","dsh-sidebar-qa","dsh-context","dsh-pocket"],"summary":"- 插件全家桶已按 web 端实体版本全量对齐（27 项依赖、28 项 bundle、5 处 vendor 三端 MD5 一致）——这是「web 确认可用后回灌 SSiD」的第 2 阶段落地。 - 内核已切到 master 0.1.2-alpha.1（dev 源码模式：思灵壳 boot 并列的 deepseek-harness checkout），smoke + Electron 壳 boot 双","bytes":9236,"lines":77,"body":"# SSiD 升级执行记录（web → SSiD 回灌，第 2 阶段）\n\n- 日期：2026-08-29（晚）\n- 执行会话：DSH web 端 3080（官方 master 源码 0.1.2-alpha.1）\n- 配套文档：`docs/决策/2026-08-29-SSiD升级执行指南.md`（执行方案）、`docs/决策/2026-08-29-DSH-master插件适配测试报告.md`（第 1 阶段 web 端测试）\n\n> 状态：进行中（推断 · 2026-09-12）\n\n## 结论速览\n\n- **插件全家桶已按 web 端实体版本全量对齐**（27 项依赖、28 项 bundle、5 处 vendor 三端 MD5 一致）——这是「web 确认可用后回灌 SSiD」的第 2 阶段落地。\n- **内核已切到 master 0.1.2-alpha.1**（dev 源码模式：思灵壳 boot 并列的 deepseek-harness checkout），smoke + Electron 壳 boot 双验证通过。\n- **唯一未完成**：内置闭包归档（dsh-runtim n| 内置闭包族声明 | web 无 | 删除 profile/package.json 全部 `@deepseek-ai/dsh*`/cordis 内核族（21 项）——源码模式下从 checkout 解析 | ✅ pnpm install +39/-487 |\n\n## 关键执行细节\n\n- **内核切换**：`node_modules/@deepseek-ai`（rc.2 闭包 196 条目）整体移出 → `.upgrade-backup/@deepseek-ai-rc2`（回滚 = 移回）；dev 裸跑（`app.isPackaged=false`）无 DSH_CHECKOUT 且锚点消失 → `resolveDshRuntime()` 命中并列源码。全程无环境变量残留（避免 pitfalls #5）。\n- **实体校验**：web（基准）vs ssid（实体）逐包比对，26/27 ✓；唯一差异 `@playwright/mcp 0.0.79` 为 **SSiD 预制 MCP 独有**（web 无此功能），预期内。校验脚本：`Temp\\dsh-ssid-verify-plugins.mjs`。\n- **smoke boot 两次发现**：① mcp-playwright 行 `args:[null,…]` —— smoke 裸跑未设 `SSID_MCP_PW_CLI`（Electron 壳由 main.mjs 注入），属测试环境缺失，补环境变量后通过；② master web 服务 token 认证（401 = ready），boot-smoke.ts 断言已更新。\n- **本次修改文件（SSiD 库）**：`shell/kernel.ts`（heal API 适配）、`shell/boot-smoke.ts`（401 就绪断言）、`shell/profile-template/vendor/dsh-context-doctor`（同步 web 0.6.2-master）。\n- **profile 侧**：`~/.dsh/profiles/ssid/package.json`（升级）、`~/.dsh/profiles/ssid/vendor/dsh-context-doctor`（同步）、`~/.dsh/profiles/ssid/.upgrade-backup/@deepseek-ai-rc2`（内核闭包备份）、`package.json.pre-master-20260829-181432`（依赖声明备份）。\n\n## 待办（按序）\n\n1. **npm 发布 `@deepseek-ai/dsh@0.1.2-alpha.1` 后 → 路径 B**（正式发版形态）：\n   - `node shell/scripts/prepare-runtime.mjs`（重建 dsh-runtime.tar.gz，自动从 DSH_CHECKOUT 读 0.1.2-alpha.1 并 pin；vendor 三处已同步，归档自动带上）\n   - 按 `docs/发版流程规范.md` + ssid-release skill：归档抽查（`.runtime-version` 应为 `0.1.15-0.1.2-alpha.1-\u003c指纹>`、kernel 版本、vendor 指纹）→ NSIS 打包 → 本机验证 → GitHub tag/Release。\n   - 发版前把 `kernel.ts`/`boot-smoke.ts` 的改动 bundle 进 `kernel.bundle.mjs`（打包版走 bundle 形态）。\n2. **思灵 GUI 验证（用户手动启动，web 会话不启停实例）**——核对 `docs/决策/2026-08-29-SSiD升级执行指南.md` §4 清单（壳 boot、标题栏「会话管理」、插件中心 28 bundle 无 failed、footer 无会话管理按钮、console 0 error）。\n3. **回滚点**：依赖声明 `package.json.pre-master-20260829-181432` + `@deepseek-ai` 移回 + git 还原 `shell/kernel.ts`/`shell/boot-smoke.ts`（三者齐备即回 rc.2 闭包形态）。\n\n## 本轮教训（补充）\n\n- **web 端（3080）由 opencode 启动器管理**（`Temp\\opencode\\dsh-web-restart.log` 可见 wrapper）；其宿主进程会按 opencode 生命周期被轮换重启，**与思灵无关**——web 会  本地 vendor 定制已被上游采纳（PR #42），直接 npm 版 |\n| dsh-pocket | `1.14.5` | **2.1.3** | |\n| dsh-sidebar-qa | `^0.4.0` → 0.4.0 | **0.5.0** | remote.session 依赖——**仅 master 内核有**（rc.2 无，血泪教训） |\n| dsh-session-manager | `file:./vendor/dsh-session-manager-0.2.2.tgz` → 0.2.2 | **0.4.1**（npm） | 0.2.2 无 footer 按钮；0.4.1 有（header-unify 已接管隐藏） |\n| @max-null/dsh-memory | `^0.6.0` | **0.6.0** | 已一致，核验即可 |\n| @max-null/dsh-chat-rail | `^0.4.0` | **0.4.0** | 已一致 |\n| @max-null/dsh-chinese-thinking | `^0.3.0` | **0.3.0** | 已一致 |\n| @max-null/dsh-guardian | `^0.2.0` | **0.2.0** | 已一致 |\n| @max-null/dsh-habit | `^0.2.0` | **0.2.0** | 已一致 |\n| @max-null/dsh-draft-polish | `^0.2.1` | **0.2.1** | 已一致 |\n| @max-null/dsh-node-appearance | `^0.3.3` | **0.3.3** | 已一致 |\n| @max-null/dsh-skill-mcp-center | `^0.4.1` | **0.4.2** | |\n| @max-null/dsh-achievements | `^0.1.0` | **0.1.2** | |\n| @max-null/dsh-plugin-center | `link:H:/MaxNull/WorkStation/dsh-plugin-center` | **0.2.14**（npm） | **ssid 建议也切 npm 0.2.14**（bundle-toggle 修复已在 0.2.14 中验证） |\n| dsh-better-sidebar | `^0.17.1` → 0.17.1 | **0.17.1** | 已一致 |\n| @huanlin/dsh-plugin-better-sidebar-plugin-office | `^0.1.2` | **0.1.2** | 已一致 |\n| @changfenhuang/dsh-genui | `^0.9.6` | **0.9.6** | 已一致 |\n| @max-null/dsh-capture | `file:./vendor/dsh-capture` | file: 同形态 | 核对 vendor MD5 与 web 一致 |\n| @max-null/dsh-ssid-zh-ui | `file:./vendor/dsh-ssid-zh-ui` | file: 同形态 | 核对 vendor MD5 与 web 一致 |\n| @max-null/dsh-header-unify | `file:./vendor/dsh-header-unify` | file: 同形态 | **v0.3 壳分支已同步（本会话完成，MD5 四端一致）** |\n| @max-null/dsh-ssid-panels | `file:./vendor/dsh-ssid-panels` | file: 同形态 | **干净 0.1.9 已同步（本会话完成，MD5 四端一致）** |\n| ds-harness-remote | `^0.4.1` | **0.4.1** | 已一致 |\n| dsh-video-preview | `^0.1.4` | **0.1.4** | 已一致 |\n| dsh-excel-panel | `^0.6.1` | **0.6.1** | 已一致 |\n\n### 1.2 bundles 列表\n\n两边 profile 的 `dsh.profile.bundles` **已一致**（各 28 项：官方 2 + 预制 9 + 用户 17，无 open-sea-skin）。执行时 diff 确认即可。\n\n## 2. 卡点：@deepseek-ai/dsh@0.1.2-alpha.1 未发布 npm\n\n`pnpm view @deepseek-ai/dsh versions`：最新为 **0.1.1-rc.2**（0.1.2-alpha.1 是 master 源码版本，尚未发布）。SSiD 归档（`shell/scripts/prepare-runtime.mjs` 第 121 行）**从 npm 精确 pin 安装内核**，npm 没有该版本就装不上。两条路径：\n\n### 路径 A（推荐先做）：dev 源码模式——不等 npm 发布\n\nSSiD 壳的运行时选择（`shell/kernel.ts` 三级回退：DSH_CHECKOUT → 相邻源码 → 内置闭包）中，**未打包 dev 模式**下删除部署锚点即可回退到相邻源码：\n- 部署锚点：`~/.dsh/profiles/ssid/node_modules/@deepseek-ai/dsh/package.json`（存在 → 优先用闭包）\n- 操作：让内核走并列源码 = **把 `H:\\MaxNull\\WorkStation\\deepseek-harness` 作为相邻 checkout**（它就在 SSiD 仓库旁的 WorkStation 下，且已是 master 源码）；若仍被闭包拦截，临时改名为 `node_modules/@deepseek-ai/dsh` 移到备份或设置 `DSH_CHECKOUT=H:/MaxNull/WorkStation/deepseek-harness`（注意 pitfalls #5：User 级环境变量残留会劫持，用完删除）。\n- **重启 SSiD 壳后即跑 master 内核**（源码模式），然后 §3 升插件。\n\n### 路径 B（正式发版形态，需官方发布或本地发布 alpha）\n\n1. npm 发布 `@deepseek-ai/dsh@0.1.2-alpha.1`（官方流程）；或确认官方已发。\n2. `node shell/scripts/prepare-runtime.mjs`（重建 dsh-runtime.tar.gz，3-5 分钟）。\n3. 按 `docs/发版流程规范.md` + ssid-release skill：归档抽查清单（.runtime-version = `0.1.x-0.1.2-alpha.1-\u003c指纹>`、node_modules/@deepseek-ai/dsh 版本、vendor 指纹）、NSIS 打包、本机验证、GitHub tag/Release。\n\n## 3. 插件升级执行步骤（web 会话照做）\n\n```powershell\n# 0) 备份（回滚用）\nCopy-Item \"C:\\Users\\MaxNull\\.dsh\\profiles\\ssid\\package.json\" \"C:\\Users\\MaxNull\\.dsh\\profiles\\ssid\\package.json.pre-master-$(Get-Date -Format yyyyMMdd-HHmm)\" \n#   node_modules 备份大——至少备份 @deepseek-ai/dsh 与关键 vendor tgz：\nCopy-Item \"C:\\Users\\MaxNull\\.dsh\\profiles\\ssid\\vendor\\dsh-session-manager-0.2.2.tgz\" \"C:\\Users\\MaxNull\\.dsh\\profiles\\ssid\\vendor\\dsh-session-manager-0.2.2.tgz.bak\" -ErrorAction SilentlyContinue\n\n# 1) 对齐 vendor（本会话已同步 dsh-ssid-panels / dsh-header-unify；还需同步的）：\n#    - dsh-context-doctor：整个拷 web 的 vendor（0.6.2-master，包含 API 迁移后的 lib/client.js）\n#    - dsh-capture / dsh-ssid-zh-ui：MD5 核对与 web 一致（不一致则整体同步）\n\n# 2) 改 ssid profile 依赖声明（按 §1.1 表，用 node 写 JSON——PowerShell Set-Content 会写 BOM 导致 DSH 启动崩溃！）\nnode -e \"改 package.json 依赖的脚本（精确版本，不用 ^）\"\n\n# 3) 安装\ncd C:\\Users\\MaxNull\\.dsh\\profiles\\ssid\npnpm install\n\n# 4) 实体校验（node 读 node_modules/\u003cpkg>/package.json 的 version，逐包对比 §1.1 目标）\n#    特别注意：dsh-session-manager 必须从 0.2.2 → 0.4.1（vendor tgz → npm）\n```\n\n## 4. 启动验证清单（SSiD 重启后逐项）\n\n1. SSiD 壳正常 boot（无 Failed to load plugins / pending waiting for service）——**重点看 dsh-sidebar-qa 0.5.0**（remote.session；master 内核有该服务，rc.2 没有——若内核回退仍失败说明还在跑闭包）。\n2. `~/.dsh/profiles/ssid/.runtime-version`（源码模式可能无此文件；闭包模式应为 `0.1.x-0.1.2-alpha.1-*`）。\n3. 插件中心：28 个 bundle、无 failed；header-unify 条目可见（v0.1.0）。\n4. 标题栏：出现「会话管理」按钮（本会话已加 titlebar.html/js + main.mjs 壳标志 `__SSID_SHELL__`）；点击 → 会话管理抽屉（0.4.1 面板）打开；插件中心/侧栏原按钮被隐藏（壳模式行为）。\n5. footer：**无**「会话管理」按钮（被 header-unify 隐藏）；Remote/设置按钮样式官方原样（footer 布局补丁已全撤回）。\n6. 会话 header：「会话管理」按钮存在（ssid-sm-open-btn，web 无标题栏时兜底——壳里有标题栏，该按钮保留也无妨）。\n7. 功能抽查：会话管理面板（列表/归档/移动）、插件中心 toggle（header-unify 禁用/启用往返，应无「no patch row」错误）、面板（dream-skin 皮肤、习惯/Guardian/上下文医生等 SSiD 面板）、手机访问（dsh-pocket 2.1.3）。\n8. console 0 error。\n\n## 5. 风险与回滚\n\n- **壳-内核兼容性（最高风险）**：SSiD 壳（Electron main.mjs/titlebar 等）此前只与 rc.2 内核验证过。master 内核改动较大（plugin-center 通道、client 模块表等）。build 失败/功能异常先记录，`main.mjs` 兼容点（插件中心 IPC、mcp 桥、BrowserView、`ssid:title` 事件）逐一排查——**这正是路径 A 先做的意义：在开发模式下低成本暴露壳兼容问题**。\n- **回滚**：恢复 `package.json.pre-master-*` → `pnpm install` → 恢复 `.runtime-version`（删掉会强制下次重部署）→ 重启 SSiD 即回 rc.2 闭包；源码模式的 DSH_CHECKOUT 用完删除（pitfalls #5 幽灵依赖）。\n- **BOM 陷阱**：改 profile JSON 一律用 node（`writeFileSync(p, JSON.stringify(obj, null, 2) + '\\n', 'utf8')`）；PowerShell 5.1 `Set-Content -Encoding UTF8` 会写 BOM，DSH `readProfileManifest` 直接崩（2026-08-29 实测）。\n- **版本声明**：保持精确 pin（无 ^），与 web 端声明形态一致。\n\n## 6. 本会话已就位（54621 会话完成，web 会话无需重做）\n\n1. dsh-ssid-panels 三处 vendor（web/ssid/profile-template）恢复**干净 0.1.9**（footer 补丁 v1-v22 全部撤回，MD5 四端一致）。\n2. dsh-header-unify **v0.5**（三处 vendor 同步）：\n   - **全环境隐藏**（v0.5 起，不再限定壳环境）：插件中心 header 按钮（pc-headerbtn）+ better-sidebar 的 toggleCluster（底栏/侧栏右上按钮）+ `.sm-footerBtn`——悬浮快捷工具栏（插件中心/侧栏/底栏/会话管理）全环境接管这些入口（隐藏后 JS .click() 仍触发）。\n   - `ssid:titlebar` detail=`session-manager` 桥接打开会话管理（0.4.x 走 `.sm-footerBtn`，0.2.x 走 `[data-dsh-header-button]` 双目标；**桥接支持 toggle——再点关闭**，关闭经面板 modal 头部「关闭」按钮，已实测开→关→开）。\n   - **悬浮快捷工具栏**（v0.4+）：可拖拽移动（localStorage 持久化）、可展开/收起；i18n（v0.4.2，跟随 document.documentElement.lang，中文=「思灵快捷工具栏」）。\n3. 标题栏「会话管理」按钮（titlebar.html + titlebar.js）+ main.mjs 转发（通用）。\n4. 决策文档 `docs/决策/2026-08-29-DSH-master插件适配测试报告.md`：完整测试矩阵、撤回记录、升级记录、用户计划与协作原则。\n"},{"file":"2026-08-28-session-manager加入预制.md","date":"2026-08-28","slug":"session-manager加入预制","title":"dsh-session-manager 加入 SSiD 预制（2026-08-28）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@changfenhuang/dsh-genui","dsh-session-manager","dsh-session-manager-0","dsh-dream-skin","dsh-context","dsh-video-preview","dsh-genui","dsh-context-doctor","#14"],"summary":"- 用户要求：dsh-session-manager 加入 SSiD 预制插件。候选 6 个（hkkz9522/dream12347/Semidia/WSL043/wsxwj123/wuxiangru915），用户选定 dream12347（功能最全：删除回收站/恢复/彻底清除、归档恢复、活动统计、继续/暂停、未读标记、工作区分组排序、上下文压缩阈值）。 - npm 现状：dsh-session-","bytes":3828,"lines":47,"body":"# dsh-session-manager 加入 SSiD 预制（2026-08-28）\n\n> 状态：进行中（推断 · 2026-09-12）\n\n## 背景与决策\n\n- 用户要求：`dsh-session-manager` 加入 SSiD 预制插件。候选 6 个（hkkz9522/dream12347/Semidia/WSL043/wsxwj123/wuxiangru915），用户选定 **dream12347**（功能最全：删除回收站/恢复/彻底清除、归档恢复、活动统计、继续/暂停、未读标记、工作区分组排序、上下文压缩阈值）。\n- **npm 现状**：`dsh-session-manager`（npm）是 **hkkz9522 的 0.1.2**，dream12347 **未发布 npm**——只能走 GitHub 源码 → tgz → **file: vendor** 模式（open-sea-skin 同款）。\n- **本地已验证**：ssid profile `node_modules/dsh-session-manager` 实体 **0.2.2 已存在**（用户测试通过），且 **lib 含 nav-bubble 定制**（settings nav 齿轮→会话气泡 Lucide message-circle，已在上游 adfd547 #14 合入）。\n- **当前脱链状态**（核实）：实体在 node_modules，但 **profile package.json 的 dependencies / bundles / pnpm-lock 均无它** ——归档重建（prepare-runtime 重装 node_modules）后即丢失。\n\n## 接入方案（open-sea-skin 同款三步）\n\n1. **vendor tarball**：以本地已验证实体为源 `npm pack` → `dsh-session-manager-0.2.2.tgz` → `shell/profile-template/vendor/`\n   - 以**测试版实体**为源（0.2.2、nav-bubble 定制）——与用户测试产物一致；上游仓库 lib 为更新构建（多 28 行），但未经本地测试，暂不追平（后续可升级）。\n2. **profile-template**：\n   - `dependencies` 加 `\"dsh-session-manager\": \"file:./vendor/dsh-session-manager-0.2.2.tgz\"`\n   - `dsh.profile.bundles` 加 `dsh-session-manager`（宿主插件靠 cordis.patch.yml insert，bundle 必须显式挂载——否则 kernel resolveBundleDir 找不到会崩，2026-08-22 教训）\n3. **归档重建**：prepare-runtime（实体版本校验 0.2.2）→ 替换安装目录归档 → 思灵部署\n\n## 注意\n\n- 包名无 scope（`dsh-session-manager`），与全家桶 `@max-null/*` 命名不同——按上游原名接入，bundles id 也用原名。\n- 上游未发布 npm，本接入为**本地 vendor 分发**；若上游发布 npm 可切换 `^x.y.z`。\n- 测试版实体与上游 main lib 差异：nav-bubble 定制已入上游，其他 24 行差异待 diff 确认（不影响接入——以测试版为准）。\n\n## 第三方插件升级（2026-08-28，用户规则：第三方升 npm 最新；本地超前以本地为准）\n\n| 包 | 声明/现状 | npm latest | 动作 |\n|---|---|---|---|\n| dsh-dream-skin | ^0.4.14（归档实体 0.4.15） | **8.28.0** | ⬆️ 升 ^8.28.0（作者 08-27 真发，peer rc.6+ 兼容） |\n| dsh-context | ^0.32.0 | **0.34.1** | ⬆️ 升 ^0.34.1（peer rc.7+，待验证 rc.2 兼容） |\n| dsh-video-preview | ^0.1.1 | **0.1.4** | ⬆️ 升 ^0.1.4 |\n| ds-harness-remote | ^0.3.0 | **0.3.36** | ⬆️ 升 ^0.3.36（peer >=rc.6 \u003c0.2.0，兼容） |\n| @changfenhuang/dsh-genui | vendor 0.9.5 | 0.9.6 | ✅ **已升 ^0.9.6**（实测：作者采纳魔改——0.9.6 含模板中心/探索成就/面板 dock 全部定制标记，index.js 字节一致，client.js 仅 minifier 微调） |\n| dsh-context-doctor/open-sea-skin | vendor | 无/以本地 | 🚫 保持（本地增强） |\n| 其余 | 一致 | 一致 | 不动 |\n\n- 等待归档的重启：panels 0.1.9（已 bump）、session-manager 0.2.2（vendor tarball 已就位）随本次归档一起进入。\n- **风险**：dsh-context 0.34.1 peer `^0.1.0-rc.7` 对 DSH 0.1.1-rc.2 的兼容性需 pnpm 实测（0.3.0 发布阻塞类似坑）；dream-skin 8.28.0 大跳需归档后冒烟。\n\n## 执行步骤\n\n1. pack tarball → vendor/\n2. profile-template deps + bundles\n3. 归档重建 → 部署 → 冒烟（会话管理入口出现、归档/回收站可用）\n"},{"file":"2026-08-28-v0.1.15发版决策.md","date":"2026-08-28","slug":"v0.1.15发版决策","title":"SSiD v0.1.15 发版决策（2026-08-28）","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["dsh-session-manager","dsh-dream-skin","dsh-context","dsh-video-preview","dsh-ssid-panels","ssid-release","#66","#69"],"summary":"- 0.1.14 → 0.1.15（minor，功能增强）：新增预制 session-manager + panels 0.1.9 功能 + 第三方升级 + genui 切 npm。 - 0.1.15 编号未被占用（历史上 106a875 曾 bump 到 0.1.15 又回滚 0.1.14 重打，未外发 Release）——本次为新号。 - v0.1.14 已外发（08-26 Latest），v","bytes":2126,"lines":38,"body":"# SSiD v0.1.15 发版决策（2026-08-28）\n\n> 状态：已决策（推断 · 2026-09-12）\n\n## 版本决策\n\n- **0.1.14 → 0.1.15**（minor，功能增强）：新增预制 session-manager + panels 0.1.9 功能 + 第三方升级 + genui 切 npm。\n- **0.1.15 编号未被占用**（历史上 106a875 曾 bump 到 0.1.15 又回滚 0.1.14 重打，未外发 Release）——本次为新号。\n- v0.1.14 已外发（08-26 Latest），v0.1.14..HEAD 有 9 个未发布 commit，内容必须新版本承载。\n\n## v0.1.14..HEAD 变更分组（git log 提炼）\n\n**新增预制/升级（ae0f61b）**\n- dsh-session-manager 0.2.2（dream12347）加入预制（vendor tarball + bundles）\n- 第三方升级：dsh-dream-skin ^8.28.0 / dsh-context ^0.34.1 / dsh-video-preview ^0.1.4 / ds-harness-remote ^0.3.36\n- genui vendor 0.9.5 → npm ^0.9.6（作者采纳本地魔改：模板中心/成就/dock 对齐）\n- dsh-ssid-panels 0.1.8 → 0.1.9\n\n**内置插件优化（panels）**\n- 8d03301 更新日志弹窗每版本一次 + 展示即标记\n- d225bc9 更新日志 seen 改 host 文件（动态端口丢标记修复）\n- 74dc9ec 版本卡布局优化（检查更新按钮右上 + ⭐给我个星吧）\n- 44c6fbb 检查更新结果跟随按钮（结果/状态并入版本卡）\n\n**其他**\n- 69100e2 genui vendor 同步上游 main（PR #66/#67 + #69/#70 + 成就指纹 hash 隐私强化）\n- daf554f CI: build-mac workflow（功能代码在 feat/macos-packaging 分支）\n- 58b6ff4 删除误提交临时脚本\n- 451bedf docs(skill): ssid-release 补充 spread 丢原型经验\n\n## 发版五件事\n\n1. 更新日志 docs/release-notes-v0.1.15.md + 同步 plugins/dsh-ssid-panels/release-notes.md（守卫测试）\n2. shell/package.json 0.1.15（四处同步：package.json/归档/.runtime-version/tag）\n3. 发版前守卫（updater-core + release-notes 单测）\n4. 归档重建 prepare-runtime + 抽查（实体全过：chat-rail 0.4.0/session-manager 0.2.2/panels 0.1.9/genui 0.9.6/dream-skin 8.28.0/context 0.34.1）\n5. NSIS 打包（英文名副本坑）+ 打包版自检 + 冒烟 + GitHub tag/Release/upload（latest.yml+blockmap）\n"},{"file":"2026-08-26-三个插件加入SSiD预设.md","date":"2026-08-26","slug":"三个插件加入SSiD预设","title":"执行记录：dsh-context / dsh-genui / dsh-context-doctor 加入 SSiD 预设插件","statusRaw":"已完成（待 prepare-runtime 归档重建）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-26","dateNote":null,"tags":["@changfenhuang/dsh-genui","dsh-context","dsh-genui","dsh-context-doctor","dsh-client-ui-conversation","#8","#58"],"summary":"三个插件已加入 SSiD 预设（发布模板 + 开发 profile 同步），genui 预置版自带 SSiD 面板样式修复（对齐宿主导航/输入区宽度轴等），genui skill 教学随预置技能包。","bytes":3971,"lines":51,"body":"# 执行记录：dsh-context / dsh-genui / dsh-context-doctor 加入 SSiD 预设插件\r\n\r\n> 日期：2026-08-26\r\n> 状态：已完成（待 prepare-runtime 归档重建）\r\n> 执行人：MaxNull（AI 代执行）\r\n> 关联：[SSiD-插件清单.md](../设计/SSiD-插件清单.md) 2.4 第三方预制\r\n> 上游联动：genui 面板修复 PR [omdsh-dev/dsh-genui#58](https://github.com/omdsh-dev/dsh-genui/pull/58)；context-doctor [issue #8](https://github.com/Zhenyu98/dsh-context-doctor/issues/8)\r\n\r\n---\r\n\r\n## 一、结论\r\n\r\n三个插件已加入 SSiD 预设（发布模板 + 开发 profile 同步），genui 预置版自带\r\nSSiD 面板样式修复（对齐宿主导航/输入区宽度轴等），`genui` skill 教学随预置技能包。\r\n\r\n| 插件 | 预置形态 | 版本基线 |\r\n|---|---|---|\r\n| `dsh-context` | npm `^0.32.0` 声明 | 0.32.0 |\r\n| `@changfenhuang/dsh-genui` | `file:./vendor/dsh-genui`（vendor 固化；来源仓库 [omdsh-dev/dsh-genui](https://github.com/omdsh-dev/dsh-genui)） | 0.9.2 + 面板修复 |\r\n| `dsh-context-doctor` | `file:./vendor/dsh-context-doctor`（vendor 固化） | 0.6.1（git #main 产物） |\r\n\r\n## 二、改动清单\r\n\r\n| 文件 | 改动 |\r\n|---|---|\r\n| `shell/profile-template/vendor/dsh-genui/`（新增） | genui 上游 v0.9.2 发布文件 + 本地构建面板修复产物（`lib/client.js` 含修复标记） |\r\n| `shell/profile-template/vendor/dsh-context-doctor/`（新增） | context-doctor v0.6.1 发布文件（lib + cordis.patch.yml + README/LICENSE） |\r\n| `shell/profile-template/skills/genui/SKILL.md`（新增） | genui skill 教学（随预置技能包） |\r\n| `shell/profile-template/package.json` | dependencies + bundles 各加三项 |\r\n| `shell/profile-template/vendor/README.md` | 新增 dsh-genui / dsh-context-doctor 条目说明 |\r\n| `docs/设计/SSiD-插件清单.md` | 新增 2.4 第三方预制小节 |\r\n| `~/.dsh/profiles/ssid/package.json`（dev profile，不入库） | 同上 dependencies + bundles + vendor 同步 |\r\n\r\n## 三、验证结果\r\n\r\n1. **合成配置**：`dsh --profile ssid --dump-config` 含三条——`# == dsh-context`（id: dsh-context）、`# == @changfenhuang/dsh-genui`、`# == dsh-context-doctor`（id: context-doctor）✅\r\n2. **安装**：dev profile `pnpm install` 成功（+196 包 / 17.5s）；`node_modules` 下三个包就位；vendor genui `lib/client.js` 含修复标记（`composer-side-clearance` + `IconChevronDownOutline14`）✅\r\n3. **Peer**：无新增缺失——genui 的官方 peer（dsh-client-ui-conversation/ui-primitives/slots/llm/session/system-prompt/tools/invariants）经 semver 判定全部满足（0.1.1-rc.2 ∈ `>=0.1.1-rc.0 \u003c0.2.0`），物理上在 node_modules 存在；`pnpm peers check` 报告的 missing 为 SSiD hoisted 布局的既有特征（官方 peer 不入依赖图，运行时由 cordis loader 按服务注入），与 chat-rail 先例同款，**prepare-runtime.mjs 的 MISSING_PEERS 无需补充**。\r\n4. **JSON 合规**：模板与 dev profile 的 package.json 均通过 node JSON.parse 校验。\r\n\r\n## 四、生效方式\r\n\r\n- 开发环境：重启思灵（或当前 GUI 会话）后 ssid profile 加载三个插件。\r\n- 发布环境：**需重建运行时归档**——`node scripts/prepare-runtime.mjs`（shell/ 目录；归档带 vendor 指纹，自动包含新 vendor 与技能），然后替换安装目录归档 → 下次安装/升级即开箱即用。\r\n\r\n## 五、备注\r\n\r\n- genui vendor 采用「上游基线 + SSiD 修复」的双源模式：上游 PR #58 合并并发布新版本后，应切换回 npm 声明并删除 `vendor/dsh-genui`（恢复临时补丁脚本 `H:\\MaxNull\\WorkStation\\apply-genui-patch.ps1` 同期删除）。\r\n- context-doctor 无 npm 发布（`private: true`），长期走 vendor 固化；上游修复 issue #8 后重新抓取 main 产物替换 vendor。\r\n- dsh-context 为 npm 声明，后续 `prepare-runtime` 重建自动收最新 0.32.x（`minimumReleaseAge: 0` 已豁免）。\r\n"},{"file":"2026-08-24-Playwright-MCP-预制-实施方案.md","date":"2026-08-24","slug":"Playwright-MCP-预制-实施方案","title":"Playwright MCP 预制 - 实施方案","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":"2026-08-24","dateNote":null,"tags":["@playwright/mcp","@deepseek-ai/dsh-mcp-client","dsh-mcp-client","dsh-skill-mcp-center","dsh-runtime"],"summary":"用户在某个 DSH 会话中看到「playwright-core（全局 MCP 包内）」的表述，追问 DSH 是否有全局 MCP、为何 MCP 管理插件看不到。排查结论： - 该表述指 npm 全局安装的 @playwright/mcp 包（C:\\Users\\MaxNull\\AppData\\Roaming\\npm\\nodemodules\\@playwright\\mcp）——playwright-co","bytes":5270,"lines":107,"body":"# Playwright MCP 预制 - 实施方案\n\n> 日期：2026-08-24\n> 范围：SSiD 出厂预制（profile-template）+ 本机 profile 同步\n> 关联：`docs/设计/SSiD-插件清单.md`（MCP 五通道 → 本次落地浏览器自动化通道）、`docs/决策/2026-08-19-预设技能包-落地方案.md`（prefab 模式参照）\n\n> 状态：已决策（推断 · 2026-09-12）\n\n## 1. 背景\n\n用户在某个 DSH 会话中看到「playwright-core（全局 MCP 包内）」的表述，追问 DSH 是否有全局 MCP、为何 MCP 管理插件看不到。排查结论：\n\n- 该表述指 **npm 全局安装的 `@playwright/mcp` 包**（`C:\\Users\\MaxNull\\AppData\\Roaming\\npm\\node_modules\\@playwright\\mcp`）——`playwright-core` 是它的依赖；\n- 它同时被 **OpenCode 全局 MCP 配置**（`~/.config/opencode/opencode.json` 的 `mcp.playwright`）使用；\n- **DSH 本身没有全局 MCP、也不内置任何 MCP 服务器**：`@deepseek-ai/dsh-mcp-client` 只是客户端桥，服务器需在 profile 配置中显式注册；`dsh-skill-mcp-center` 的 MCP 面板只枚举 DSH loader 里的 `mcp-client` 条目，因此看不到 OpenCode/全局 npm 侧的 MCP。\n\n结论：DSH 的「预制 MCP」不存在官方概念，SSiD 从零落地自己的浏览器自动化 MCP 预制。\n\n## 2. 决策\n\n| 决策点 | 选择 | 理由 |\n|---|---|---|\n| 预制形态 | **默认启用**（模板直接 insert，mcp-playwright 常驻） | 用户拍板：SSiD 开箱即得浏览器自动化能力 |\n| 运行时 | **离线自包含依赖**：`@playwright/mcp` 精确 pin `0.0.79` 进 profile 依赖（归档构建时下载，离线可装） | SSiD 归档离线原则；避免 npx 每次联网解析 |\n| node 定位 | SSiD 壳启动时注入 `SSID_MCP_NODE`（打包内置 node.exe → NVM v22.22.2 → PATH）与 `SSID_MCP_PW_CLI`（profile 内 cli.js 绝对路径） | 与 worker 分支 node 候选链同源；electron `execPath` ABI 不匹配不可用；MMCP 配置 `!!js` 只读 env，无运行时副作用 |\n| 浏览器二进制 | **不随安装包发布**；首次使用需 `playwright install chromium`（约 150MB，按需下载） | 安装包体积与首装时长权衡；失败时 mcp-client `failOnStartupError: false`，面板显示未连接而非崩溃 |\n| 模式 | `--headless` | 与用户 OpenCode 全局配置一致；SSiD 内使用以自动化为主，可见浏览器由用户自行改 args（Skill & MCP 面板可编辑） |\n\n## 3. 改动清单\n\n### 3.1 `shell/main.mjs`（启动注入，dev/打包共用）\n\n在 bootKernel 前的环境准备段（`SSID_PNPM` 注入旁）新增：\n\n```js\nconst mcpNodeCandidates = [\n  process.resourcesPath ? join(process.resourcesPath, 'node', 'node.exe') : '',\n  process.env.NVM_HOME ? join(process.env.NVM_HOME, 'v22.22.2', 'node.exe') : '',\n  'node.exe',\n]\nconst mcpNodeExe = mcpNodeCandidates.find((c) => c !== '' && existsSync(c))\nif (mcpNodeExe) process.env.SSID_MCP_NODE = mcpNodeExe\nconst mcpPwCli = join(profileDir, 'node_modules', '@playwright', 'mcp', 'cli.js')\nif (existsSync(mcpPwCli)) process.env.SSID_MCP_PW_CLI = mcpPwCli\n```\n\n注：`main.mjs` 是 dev 与打包版共同入口，本次改动**无需重打 kernel.bundle.mjs**；但 `SSID_MCP_*` 的注入发生在 kernel boot 前，`!!js` 求值（host 进程内）可见。\n\n### 3.2 `shell/profile-template/package.json`\n\ndependencies 追加（精确 pin，归档构建确定性）：\n\n```json\n\"@playwright/mcp\": \"0.0.79\"\n```\n\n### 3.3 `shell/profile-template/cordis.patch.yml`（出厂模板）\n\n顶层插入：\n\n```yaml\n- insert:\n    - id: mcp-playwright\n      name: '@deepseek-ai/dsh-mcp-client'\n      config:\n        serverName: playwright\n        transport: stdio\n        command: !!js 'process.env.SSID_MCP_NODE || \"node\"'\n        args:\n          - !!js 'process.env.SSID_MCP_PW_CLI'\n          - '--headless'\n```\n\n### 3.4 本机 profile 同步（开发机立即生效）\n\n- `~/.dsh/profiles/ssid/cordis.patch.yml`：同 3.3；\n- `~/.dsh/profiles/ssid/package.json`：同 3.2；\n- `pnpm install`（profile 目录，nodeLinker=hoisted，依赖提升到顶层 `node_modules/`）。\n\n## 4. 首次使用（浏览器二进制）\n\n```sh\n# 开发机（任选其一，均在 profile 目录内解析本地 playwright）\ncd %DSH_HOME%\\profiles\\ssid\nnode node_modules\\playwright\\cli.js install chromium\n# 或\nnpm exec --yes playwright install chromium\n```\n\n安装版（打包后）：\n```\n\"%DSH_HOME%\\profiles\\ssid\\node_modules\\.bin\\playwright.cmd\" install chromium\n```\n\n## 5. 验证\n\n1. 重启思灵（或 dev dsh web）；日志出现 `prefab mcp node=…` 与 `prefab mcp cli=…`；\n2. Settings → Skill & MCP 面板出现 `playwright` 卡片；\n3. 新会话模型工具列表出现 `mcp__playwright__*`（browser_navigate / browser_snapshot 等）；\n4. 浏览器缺失时面板状态为「未连接」，安装 chromium 后重连。\n\n## 6. 发布链（归档配套动作）\n\n- 本改动进入 SSiD 后：`pnpm run prepare-runtime` 重建 dsh-runtime 归档（新增 0.0.79 pin 依赖随归档下载）；\n- 升级部署机制（归档版本升级 → profile 重部署）自动把新 patch 与依赖带到用户机器；\n- `docs/设计/SSiD-插件清单.md` 的「MCP 五通道」行可补 Playwright 浏览器自动化通道状态为 ✅ 预制（后续版本）。\n"},{"file":"2026-08-23-会话隔离与插件更新-交付清单.md","date":"2026-08-23","slug":"会话隔离与插件更新-交付清单","title":"2026-08-23 · 会话隔离与插件更新三段式 · 交付清单（整晚工作归档）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@types/react-dom","@max-null/dsh-plugin-center","dsh-plugin-center","dsh-ssid-panels","dsh-runtime"],"summary":"- 设置页「会话存储」卡片：开关（预设默认开启）、常驻计数 （独立根/共享根/已载入）、载入原 DSH 会话、移除已载入会话（B 方案：只删清单内）、 按需「重启思灵」行、统一操作反馈行； - 载入 = 复制共享根会话 → 独立根（幂等：已存在跳过）； - workspace attach：载入/已存在会话 attach 到 cwd 对应 workspace（侧栏分组即时可见）； - 隔离开关状态","bytes":7188,"lines":105,"body":"# 2026-08-23 · 会话隔离与插件更新三段式 · 交付清单（整晚工作归档）\n\n> 起点：用户报告「历史加载失败：corrupt session log: seq gap in committed region」。\n> 终点：会话存储隔离全家桶 + 插件更新三段式 + 一串可靠性修复，全部实测闭环。\n\n> 状态：进行中（推断 · 2026-09-12）\n\n## 一、功能交付（均已用户实测 / 系统验证）\n\n### 1. 会话存储隔离（SSiD 与手动 dsh web 彻底分家）\n- 设置页「会话存储」卡片：开关（**预设默认开启**）、常驻计数\n  （独立根/共享根/已载入）、载入原 DSH 会话、移除已载入会话（**B 方案：只删清单内**）、\n  按需「重启思灵」行、统一操作反馈行；\n- 载入 = 复制共享根会话 → 独立根（幂等：已存在跳过）；\n- **workspace attach**：载入/已存在会话 attach 到 cwd 对应 workspace（侧栏分组即时可见）；\n- 隔离开关状态 `~/.ssid/session-root.json`（isolated=开关，applied=启动生效值，\n  kernel 回写）；**预设：无配置文件 ⇒ 默认隔离**（首次启动落盘显式配置）；\n- 已载入清单 `~/.ssid/imported-sessions.json`（B 方案：移除只删清单内，新建会话保护）；\n- `listNeedsRestart`（清单 mtime vs `SSID_BOOTED_AT`）持久判定重启提示行。\n\n### 2. 插件更新三段式（dsh-plugin-center）\n- 直装优先（99% 成功：纯 JS/新增包/未锁原生模块）；\n- 撞锁（EPERM/EBUSY/rename）分流：SSiD（kernel 声明 `SSID_PENDING_CONSUMER=1`）\n  → **npm pack 预下载** → pending 清单（`~/.ssid/pending-plugin-updates/index.json`）\n  → **重启时 kernel boot 前安装**（无锁窗口）；官方 dsh web（无消费方）→ **指令复制弹窗**；\n- UI：直装 toast + 「已更新待重启」卡片（点击弹重启确认）、多更新统一弹窗、\n  busy 保护（进行中会话拦截）、WhatsNew 弹窗旧检查修复。\n\n### 3. 可靠性修复（本轮） \n- 托盘「重启」`restartDsh` 作用域 ReferenceError（try 内 const → 提出去）；\n- BOM 写坏 profile package.json（**教训：改 JSON 一律用 node，禁 PowerShell Set-Content**）；\n- host 版本缓存假象（外部改版本后 listInstalled 旧值——重启应用可解，mtime 失效改进挂起）；\n- 弹窗配色统一到 DSH 官方变量（`button-primary-fill` + `label-primary-foreground`）。\n\n## 二、验证记录（节选）\n\n| 项 | 证据 |\n|---|---|\n| 直装路径 | 用户实测 toast + 版本升 0.15.2（pnpm 日志 ok ×3） |\n| 立即重启 relaunch | 多次实时进程 0:19/0:31/0:34/1:08/1:13 新实例 |\n| 托盘重启修复 | ssid.log：修复前 2 次 ReferenceError，其后 bootKernel ok ×2 |\n| pending 消费 | boot 实测：applied（可装项移除）/ deferred（失败项保留） |\n| 预设默认隔离 | 删除配置 boot → 自动生成 {isolated:true,applied:true} + 运行隔离根 |\n| B 方案移除 | 移除后隔离根仅剩新建的 1 个会话；清单 imported=153 |\n| 会话数据修复 | 15 个损坏日志修复 12 个（其余 3 个不可恢复，见 .tmp-repair-* 工具） |\n\n## 三、改动文件清单\n\n### dsh-plugin-center（H:\\MaxNull\\WorkStation\\dsh-plugin-center）\n- `src/update.ts`：PnpmResult(direct/pending/command)、preparePluginUpdate（npm pack\n  预下载；pnpm pack 不支持远程 spec）、pending 清单读写、tarballNameOf、npm 候选；\n- `src/engine.ts`：update() 三段式 + `SSID_PENDING_CONSUMER` 握手 + command 生成；\n- `src/rpc.ts`：update value 透传 direct/pending/command；\n- `client/index.tsx`：三分支 UI、CommandDialog/RestartDialog（官方配色）、\n  已更新待重启卡片（doneUpdatesStore 模块级）、WhatsNew 检查修复、i18n；\n- `docs/决策/2026-08-22-插件更新两段式-预下载重启安装.md`（含演进节）；\n- 产物：`dist/*`、`client.js`（已同步 profile ×2）。\n\n### dsh-ssid-panels（H:\\MaxNull\\WorkStation\\seek-soul-in-darkness\\plugins\\dsh-ssid-panels）\n- `src/index.ts`：sessionRoot.get/set/import(+workspace attach)/clear(B 清单)/\n  restart（busy 保护）、firstZstdFrame、readArtifactHeaderCwd、\n  imported-sessions 清单、listNeedsRestart；\n- `src/client/index.tsx`：ConfirmDialog 通用弹窗、开关/载入/移除/重启行\n  （按需、持久判定）、统一操作反馈行、i18n（zh/en）；\n- `package.json`：peer +devDeps 增加 `react-dom` / `@types/react-dom`（client 真类型）；\n- `docs/2026-08-22-会话存储隔离开关-设计方案.md`；\n- 产物：`lib/*`（已同步 ssid/web × vendor/node_modules，共 4 处）。\n\n### seek-soul-in-darkness / shell\n- `shell/kernel.ts`：SSID_SESSION_ISOLATED/SHARED_ROOT env、SSID_BOOTED_AT、\n  SSID_PENDING_CONSUMER=1、applyPendingPluginUpdates（boot 前消费，10 分钟超时，\n  失败保留不阻断）、预设默认隔离 + 首次落盘、SSID_SHELL_RESTART_KEY 注入；\n- `shell/main.mjs`：restartDsh 提出 try 块（作用域修复）、bootKernel\n  `opts.restart` 注入、托盘「重启」复用同一函数。\n\n### deepseek-harness（诊断/修复工具，仓库根保留）\n- `.tmp-audit-all.mts`（全量 seq 审计）、`.tmp-repair-spurious.mts`、\n  `.tmp-repair-conflict.mts`、`.tmp-repair-tail.mts`（三类损坏修复，均自动备份）。\n\n### 部署产物（非 git，Profile 内）\n- `~/.dsh/profiles/{ssid,web}/vendor|node_modules/@max-null/{dsh-ssid-panels,dsh-plugin-center}/`；\n- `~/.dsh/profiles/{ssid,web}/node_modules/@max-null/dsh-plugin-center/`（dist+client.js）。\n\n## 四、发布注意点（SSiD / 插件）\n\n1. **SSiD 安装版**：kernel.ts / main.mjs 改动在 asar/归档内 —— **重新 `npm run pack`\n   并重建 dsh-runtime 归档**（打包前各插件 `pnpm run typecheck && build`，再按\n   prepare-runtime 两步走：清 pnpm metadata 缓存、解压归档核对 package.json）。\n2. **升级影响需写明**：预设「默认隔离」= 老用户首次升级后（无 session-root.json）\n   **被动进入隔离**，共享根会话不在侧栏（设置页可载入）——README/发布说明必须写。\n3. **插件发布**：dsh-plugin-center → **0.2.4**（client.js/dist 更新，files 已含 client.js）；\n   dsh-ssid-panels → **0.1.4**（带 react-dom peer/devDeps；**勿升 react 19**，与\n   peer ^18.2.0 冲突）；npm 2FA 用户手动 publish；发布后 profile `pnpm install` 拉新。\n4. **兼容性**：新插件中心 + 旧 SSiD kernel（无 SSID_PENDING_CONSUMER）→ 自动走\n   web 模式（指令弹窗），不会\"假待重启\"；官方 dsh web 同理（无消费方）。\n5. **README 更新**：dsh-plugin-center（SSiD 链接惯例）、dsh-ssid-panels（新增\n   会话存储功能说明）、SSiD 项目 README（隔离开关/载入/预设）——发布前补齐。\n\n## 五、遗留项（待办）\n\n- `listInstalled` 对外部改版本不感知（mtime 失效改进，用户可拍板）；\n- 已知 3 个损坏会话不可恢复：`6a73e2d5`（尾部不连续）、`e96146aa`（缺 408 事件）、\n  `3eda899f`（大冲突段 B 内不连续）；\n- `dsh-ssid-panels` README 尚未存在（发布清单内）。\n"},{"file":"2026-08-23-快捷截图框选引用-设计方案.md","date":"2026-08-23","slug":"快捷截图框选引用-设计方案","title":"快捷截图框选引用插件 — 设计方案（2026-08-23）","statusRaw":"已完成（推断 · 2026-09-12）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-ssid-screenshot","dsh-sidebar-preview-select","dsh-header-unify","dsh-ssid-screenshot","dsh-ssid-panels"],"summary":"用户想引用屏上内容时，过去只能打字描述，LLM 理解准确性有限且费事。现在 DSH 已有多模态能力（图片消息走官方 admission 通道），因此做一个 快捷截图 + 框选 + 送入消息框 插件：从全屏冻结帧里框选一块区域，裁剪结果自动进入当前会话。 本方案放弃上一版 dsh-sidebar-preview-select 路线（全局 mouseup + 区域判定 + DSH 页面内浮层 + 文件","bytes":9399,"lines":105,"body":"# 快捷截图框选引用插件 — 设计方案（2026-08-23）\n\n> 状态：已完成（推断 · 2026-09-12）\n\n## 背景与目标\n\n用户想引用屏上内容时，过去只能打字描述，LLM 理解准确性有限且费事。现在 DSH 已有多模态能力（图片消息走官方 admission 通道），因此做一个 **快捷截图 + 框选 + 送入消息框** 插件：从全屏冻结帧里框选一块区域，裁剪结果自动进入当前会话。\n\n本方案放弃上一版 dsh-sidebar-preview-select 路线（全局 mouseup + 区域判定 + DSH 页面内浮层 + 文件类型解析），理由：侵入 DSH DOM、只限 DSH 内预览、生命周期复杂。新方案把「截屏 + 框选」放在**独立的 Electron 浮层窗口**（壳层），把「送入」走 DSH 官方图片 intake，互不侵入。\n\n## 已验证的关键事实（代码位置）\n\n| 事实 | 证据 |\n| --- | --- |\n| SSiD 是 Electron 43.3，主进程可直接用 `desktopCapturer.getSources` | `shell/package.json` \"electron\": \"43.3.0\"（主进程 API，桌面壳主进程可用） |\n| DSH web UI 运行在 `mainView` BrowserView（无 preload），壳→渲染已有 `executeJavaScript` + CustomEvent 先例 | `shell/main.mjs` L796-811（`ssid:titlebar` → `dsh-header-unify` 监听，双层 sandbox+contextIsolation） |\n| 图片消息官方通道：client `session.prompt([{type:'image', mediaType, data(base64), name?}])` → host `durablePromptContent`/`admitEncodedImages` → 图库落盘；模型必须支持 image（`MODEL_DOES_NOT_SUPPORT_IMAGES` 有中文文案） | `packages/host/apiproxy/src/api-proxy.ts` L129-138、L2382-2416；`packages/client/ui-conversation/src/client/image-labels.ts` |\n| 输入框图片 intake 官方入口：composer 的 **document 级 drop 处理器** `onDrop → onAddImages(files) → createDraftImages → input machine`（拖拽/粘贴图片都走它，含 canAcceptDrop/数量/大小限制） | `packages/client/ui-attachment/src/client/ComposerAttachments.tsx` L60-79；`ui-conversation/src/client/apply.ts` L311-326 |\n| 插件可用浏览器原生 `new DataTransfer()` + `new DragEvent('drop')` 走这条官方 drop 路径，**无需 DSH 核心改动** | 同上（drop 处理器只认 `dataTransfer.types.includes('Files')`） |\n| 当前会话 = 客户端 `sessions.list.getSnapshot().current`；发送用 `sessions.binding(id).session.prompt(content,'queue')` | `packages/client/runtime/src/client/sessions/service.ts` L76-97；`session.ts` L190-211 |\n| 合成 drop 的另一个官方备用通道：**系统剪贴板**（Electron `clipboard.writeImage`），用户可手动粘贴 | Electron API |\n\n## 架构\n\n```\n触发（托盘菜单项「截图引用」 / 全局快捷键 Ctrl+Shift+A）\n   ↓ 主进程\nwin.hide()（冻结帧不含 DSH 自身）→ ~250ms\ndesktopCapturer.getSources({types:['screen'], thumbnailSize=所有屏物理并集最大})\n   → 每屏一张冻结帧 nativeImage → dataURL\n   → 每屏一个全屏无边框置顶 overlay BrowserWindow（独立窗口，不碰 DSH DOM）\n       渲染本屏冻结帧 + 十字准星；拖拽框选；Esc 取消；双击/Enter 确认\n       选区逻辑 px × scaleFactor → canvas 物理像素裁剪 → PNG base64\n   → 主进程关全部浮层 → win.restore()\n   → mainView.webContents.executeJavaScript 派发 `ssid:screenshot` CustomEvent\n   ↓ 客户端插件 @max-null/dsh-ssid-screenshot（profile 内置）\n       监听 CustomEvent → dataURL→File（fetch(dataUrl).blob()）\n       → 合成 drop（new DataTransfer + DragEvent）填入当前会话输入框草稿\n         （官方 intake：可编辑/删除/加文字，回车后才发送）\n```\n\n### 分层职责\n\n- **壳层（shell/main.mjs + overlay 页面）**：触发、截屏、框选浮层、裁剪、输送。Electron 独有的能力留在这里（desktopCapturer/globalShortcut/clipboard/nativeImage）。\n- **client 插件（plugins/dsh-ssid-screenshot）**：接收事件、把 PNG 交给官方 intake、处理「无会话/不支持」反馈。只依赖官方 客户端服务（sessions）与浏览器事件，不 import DSH 包内部符号。\n\n### 触发方式（已定：托盘菜单 + 全局快捷键）\n\n- 托盘菜单项「截图引用」（托盘已存在，L1018-1033 菜单模板加一项）\n- 全局快捷键 `Ctrl+Shift+A`（whenReady 注册 / 退出注销；避开微信/QQ 的 `Ctrl+Alt+A`；设置页改键留后续）\n- 标题栏按钮暂不做（需要改 titlebar.html，后续需要时走 `ssid:title:action` 通道）\n\n### 框选浮层细节（多显示器，v1 所有屏）\n\n- 触发后先 `win.hide()`（冻结帧里不包含 DSH 自身），~250ms 后再抓帧，浮层关闭后恢复窗口。\n- 抓帧：**逐屏调用** `desktopCapturer.getSources({ types: ['screen'], thumbnailSize: 该屏物理宽高 })`，按 `display_id` 匹配源（兜底枚举顺序）。*修正记录（2026-08-23 探针实测）*：单次调用统一 thumbnailSize 会把全部源等比缩放进同一请求盒（本机 2560x1440@1.0 被放大成 3840x2160，画面失真）；逐屏请求后返回像素级 1:1（3840x2162 请求 → 源返回 3840x2160，浮层换算以返回值为基准，无需依赖请求值）。\n- 浮层：每屏一个 `BrowserWindow`（`frame:false, alwaysOnTop:true, skipTaskbar:true, resizable:false, movable:false, show:false` + preload），位置尺寸取 `screen.getAllDisplays()` 的 bounds（DIP）；每个浮层只渲染自己那屏的冻结帧（`\u003cimg>` 按逻辑像素铺满）。\n- 选区：mousedown → mousemove 画矩形 → mouseup 定格；**裁剪在浮层渲染进程用 canvas 完成**（画布按物理像素、选区逻辑像素按 `thumbnail尺寸 / bounds` 比例换算成物理像素），避免 nativeImage.crop 的 DIP/scaleFactor 换算；Esc 取消（全部浮层）；双击/Enter 确认。\n- 确认后浮层经自带 preload 把裁剪结果（PNG base64）回主进程：主进程关闭全部浮层 → `win.restore()` → 派发 `ssid:screenshot` CustomEvent 给 mainView。\n\n### 注入渲染进程\n\n沿用 `ssid:titlebar` 先例：`executeJavaScript` 派发 CustomEvent，插件监听。数据为 base64 PNG（框选区域通常几十 KB~几 MB，可接受；若后续变大可改为浮层窗口完成裁剪后直接把 dataURL 经 devtools 协议/临时文件通道送，v1 不做）。\n\n## 新插件清单（独立仓库 github.com/Max-Null/dsh-ssid-screenshot，v0.1.0）\n\n> 结构演进（2026-08-23 用户定案）：插件的双环境通用性使其**源码真身迁出思灵仓库**，\n> 独立仓库维护（`H:\\MaxNull\\WorkStation\\dsh-ssid-screenshot`）；思灵仓库仅保留\n> `shell/profile-template/vendor/dsh-ssid-screenshot`（构建产物拷贝，内置分发载体）。\n\n- `package.json`：`@max-null/dsh-ssid-screenshot`，react peer（同 dsh-ssid-panels 规矩），`main` 指向 lib。\n- `src/index.ts`（host 半 /ssid/api 路由）、`src/client/*`（监听 + 按钮 + 设置行 + 页面遮罩）。\n- 内置插件跟随 profile-template 预置（vendor 产物拷贝），发布到 npm 后由插件中心更新链路接管。\n- 文档：README（双引擎说明 + 使用步骤）。\n\n## 边界与风险\n\n- 无当前会话 / composer 未挂载：drop 不生效 → 插件检测 `sessions.list.current === undefined` 时（在浮层内或 toast）提示「先打开一个会话」；v1 简化为浮层提示 + 插件侧静默。\n- 模型不支持图片：host 拒绝（`attachment-error`，官方中文文案），走 composer 的 promptError 展示，无需插件处理。\n- 快捷键冲突：v1 固定一个低冲突组合，文档写明；设置页改键留待后续。\n- 大图 admission 限制（像素/大小上限）与官方拖拽路径一致，超限提示同样生效。\n- Windows 多屏缩放比：冻结帧按物理像素请求，选区坐标按 CSS px 换算 `scaleFactor`；v1 主屏通常 100% 缩放，仍需换算代码。\n\n## 已定决策（2026-08-23 用户确认）\n\n1. 送达方式：**填入输入框草稿**（不自动发送；可加文字后再回车）。\n2. 触发方式：**托盘菜单项 + 全局快捷键**（标题栏按钮留后续）。\n3. 屏幕范围：**所有显示器**。\n4. （迭代追加，2026-08-23 用户反馈）确认框选后进入**标注阶段**：拖拽画红框强调\n   重点（可多个），回车/完成发送；右键/Esc 与 Esc 同级逐级回退（撤框 → 重选 →\n   退出）；浮层无交互 3 分钟自动取消（防卡屏）。\n5. （迭代追加）截图设置并入 **设置 → 通用** 两行（隐藏窗口开关 + 快捷键，即改即存、\n   壳内即时重注册；配置存 ~/.ssid/screenshot.json，主进程每次触发前读取）。\n\n## 已验收（2026-08-23 用户实测）\n\n- 快捷键/相机按钮触发 → 多屏浮层 → 框选 → 标注画框 → 确认 → 截图进输入框，\n  全链路日志验证通过（`confirm received → delivered → drop types=Files`）。\n- 设置 → 通用 两行显示与即时生效（快捷键改 Control+Alt+B 即时重注册成功）。\n\n## 已否决路线\n\n- dsh-sidebar-preview-select（v0.1.0 未发布）：DOM 侵入 + 文件解析 + 仅限 DSH 预览，不再推进。\n- DSH 核心改动（如给 IConversation 增加 `attachImages(files)`）：非必需——官方 drop intake 已覆盖；若日后多插件都要「外部来源填充草稿」，再在 DSH 侧收敛为正式 API。\n"},{"file":"2026-08-23-DSH原生配置页样式基准.md","date":"2026-08-23","slug":"DSH原生配置页样式基准","title":"DSH 原生配置页样式基准（family 插件统一规格）","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-plugin-center","@max-null/dsh-skill-mcp-center","@max-null/dsh-draft-polish","@max-null/dsh-node-appearance","@max-null/dsh-capture","dsh-ssid-panels","dsh-plugin-center","dsh-skill-mcp-center","dsh-draft-polish","dsh-node-appearance","dsh-capture"],"summary":"- 面板：800×min(800px, 100vh-48px)，radius 24，bg --dsw-alias-bg-layer-2，--dsw-shadow-lv3。 - 左导航：宽 188，padding 22/12/0；标题「设置」16/500 lh24；导航项 h40 r12 padding 9 16 9 12，14/400， 选中 --dsw-specific-sidebar-nav-","bytes":5556,"lines":85,"body":"# DSH 原生配置页样式基准（family 插件统一规格）\n\n> 来源：deepseek-harness 源码 `packages/client/ui-settings-general/SettingsRoot.module.css`、\n> 状态：已决策（推断 · 2026-09-12）\n\n> `ui-settings-plugins/PluginsSettingsSection.module.css`、`fields.module.css`、`PluginCard.module.css`、\n> `ui-agent-preset/AgentPresetSection.module.css`、`ui-primitives/Button.module.css`、`Pill.module.css`。\n> 所有 CSS 值均为源码原文，任何家族插件不得自创规格。\n\n## 设置外壳（弹窗，通常不需要改）\n\n- 面板：800×min(800px, 100vh-48px)，radius **24**，bg `--dsw-alias-bg-layer-2`，`--dsw-shadow-lv3`。\n- 左导航：宽 188，padding 22/12/0；标题「设置」16/500 lh24；导航项 h40 r12 padding 9 16 9 12，14/400，\n  选中 `--dsw-specific-sidebar-nav-item-active`，hover `--dsw-specific-sidebar-nav-item-hover`。\n- 内容区 header h54；内容 padding 0 24 24；关闭钮 28×28 r28。\n\n## 页面骨架（设置页 Section 通用）\n\n- section：`max-width: 760px`（Agent 预设页 720px），flex column gap **12**。\n- 页面标题 heading：**font-size 18 / weight 600**（原 family 自创 16px 已作废）。\n- 页面描述 intro/subtitle：**13px，color label-tertiary**（原 family 自创 secondary 已作废）。\n- 分组题头 groupHead：12/600，uppercase，letter-spacing .06em，color label-tertiary；组间距 20。\n\n## 卡片（列表卡与网格卡统一）\n\n- 卡：border 1px `--dsw-alias-border-l2`，bg **`--dsw-alias-bg-layer-3`**，radius **12**，\n  hover `border-color: --dsw-alias-label-dimmed`，transition .16s。\n- 卡头：padding **14px 16px**，gap 12（grid 卡 cardMain padding 14 16 12，gap 8）。\n- 卡名 name：**15px / 600**，line-height 1.4。\n- 卡描述 description：**13px**，label-tertiary（列表卡）或 label-secondary + line-clamp 4（网格卡）。\n- 卡脚 cardFoot：border-top l2，padding 6px 10px，gap 2。\n- 网格：grid-template-columns repeat(auto-fill, minmax(268px, 1fr))，gap 12，auto-rows 1fr。\n\n## 徽标 badge（胶囊统一）\n\n- 胶囊：border-radius **999px**，padding 1px 8px，**font-size 11 / 500**，line-height 17px。\n- 中性：border l2 + label-tertiary（预设卡）或 bg `--dsw-alias-bg-module-platform` + label-secondary（字段）。\n- 强调（in use）：bg `--dsw-alias-label-primary`，color `--dsw-alias-bg-layer-3`。\n- 危险/错误：bg `--dsw-alias-state-error-primary`，color bg-layer-3。\n- 官方/业务强调：bg `--dsw-alias-state-business-tertiary`，color `--dsw-alias-state-business-primary`。\n- （Pill 组件：h24 r12 12px/18，bg-layer-2，label-secondary —— 与 badge 并列场景用 Pill。）\n\n## 按钮\n\n- primitives Button：胶囊 r18，h36 padding 0 14，14px/22；sm 变体 h28 r14 padding 0 10 12px/18。\n  primary = `--dsw-alias-button-primary-fill` + `--dsw-alias-label-primary-foreground`；\n  outline = border l2 透明底；hierarchy 用 hover `--dsw-alias-interactive-bg-hover`。\n- 卡内操作（save/discard）：**r8，padding 5px 14px，13px/1.5**；\n  discard = border-l2 + label-secondary；save = bg `--dsw-alias-label-primary` + color bg-layer-3。\n- 图标按钮：padding 6，r7，color label-tertiary，hover bg-layer-1 + label-primary；\n  focus-visible outline 2px brand。\n\n## 字段/表单（卡片展开区）\n\n- field：padding 12px 0，flex column gap 6；field+field 分隔线 `border-top l2`。\n- 字段题头 head：gap 8；标签 label：**13px / 500**，line-height 1.5，label-primary。\n- 输入框：**h34，r8，padding 0 12px，13px/1.5**，border l2，bg `--dsw-alias-bg-layer-3`，\n  focus border `--dsw-alias-brand-primary`；placeholder label-dimmed。\n- 提示 hint/错误：12px，tertiary / `--dsw-alias-label-error`。\n- 重置 reset 链接：12px label-secondary，hover label-primary。\n\n## 选项卡 tabs（插件配置页样式）\n\n- tabs 容器：border-bottom l2，gap **22**，margin-top 2。\n- tab：13px/20，padding **7px 1px 9px**，color label-tertiary，hover/active label-primary；\n  active 下划线 2px l2（radius 2 2 0 0，bottom -1）bg label-primary；\n  focus-visible outline 2px `--dsw-alias-state-business-primary`。\n\n## 开关 switch（家族自定，保持统一）\n\n- 40×22 r11；track off = **`--dsw-alias-border-l4`**（浅色主题 rgba(0,0,0,.16) 灰、暗色 rgba(255,255,255,.2) 灰，\n  两主题均与白钮有对比；不可用 `bg-module-platform` — 浅色主题下 ≈ rgb(245,246,247) 纯白，off 开关完全隐形），\n  on = `--dsw-alias-state-business-primary,#4FC3F7`；\n  knob 16×16 白 #fff；margin-left 2→22（或 left 3→21）；transition .15s。\n- DSH 原生无 knob 开关（无 Switch 组件），此为 SSiD 家族统一基准，勿再改动。\n\n## 家族插件清单（对齐目标 · 2026-08-23 发布版本）\n\n- dsh-ssid-panels（关于 SSiD 页 / 侧边卡片）——SSiD 内置 vendor，随壳 v0.1.10\n- dsh-plugin-center（插件市场页：列表卡、badge、chip、搜索框、按钮）——`@max-null/dsh-plugin-center` v0.2.5\n- dsh-skill-mcp-center（技能/MCP 中心：侧栏、列表卡、badge、按钮、输入框）——`@max-null/dsh-skill-mcp-center` v0.4.1\n- dsh-draft-polish（润色设置页：卡片、字段、badge）——`@max-null/dsh-draft-polish` v0.2.1\n- dsh-node-appearance（节点外观设置：卡片、group、按钮）——`@max-null/dsh-node-appearance` v0.3.3\n- dsh-capture（截图设置页：卡片行、开关、按钮）——`@max-null/dsh-capture` v0.1.0，SSiD 预制（vendor）\n"},{"file":"2026-08-22-插件中心0.2.1发布与归档覆盖机制复盘.md","date":"2026-08-22","slug":"插件中心0.2.1发布与归档覆盖机制复盘","title":"插件中心 0.2.1 发布与 SSiD 归档覆盖机制复盘（2026-08-22）","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-plugin-center","dsh-plugin-center","dsh-market","dsh-runtime"],"summary":"dsh-plugin-center 0.2.1（AI 推荐修复：Message 契约 / dsh-market spec 修正 / spec+stars / maxTokens 2000 / failure 详情）在本轮发布。期间暴露了三个 SSiD 部署机制的坑，均有真实现场证据。","bytes":4416,"lines":62,"body":"# 插件中心 0.2.1 发布与 SSiD 归档覆盖机制复盘（2026-08-22）\n\n> 状态：记录（推断 · 2026-09-12）\n\n## 背景\n\ndsh-plugin-center 0.2.1（AI 推荐修复：Message 契约 / dsh-market spec 修正 / spec+stars / maxTokens 2000 / failure 详情）在本轮发布。期间暴露了三个 SSiD 部署机制的坑，均有真实现场证据。\n\n## 一、思灵启动时用安装目录归档覆盖 profile（版本回退根因）\n\n**现象**：临时部署 0.2.1 到 profile（node_modules 手工覆盖）后，重启思灵，插件中心面板回到 0.1.7。\n\n**机制**（`shell/main.mjs` ensureProfile）：\n```\ndeployNeeded = !hasModules || (archiveVer !== null && profileVer !== archiveVer)\n```\n- 归档 = 安装目录 `resources/dsh-runtime.tar.gz`（NSIS 打包时内置）\n- 每次启动比对「归档内 .runtime-version」与「profile/.runtime-version」\n- **不一致 → 解压归档覆盖 profile 整个 node_modules**（含手工部署的版本）\n- 覆盖后 .runtime-version 写回归档值，下次启动 skip\n\n**教训**：对 profile 的临时部署只对「.runtime-version 与归档一致」的启动有效；任何触发部署的启动都会把 profile 打回归档内容。**验证新版本必须同步替换安装目录归档**，或直接走正式流程（发布 → prepare-runtime → 替换归档）。\n\n**本轮 hack**：直接解压安装目录归档 → 替换其中 `node_modules/@max-null/dsh-plugin-center` 为本地构建 → 重打包（tar -czf，保持 `./` 顶层结构）→ 替换安装目录归档（原归档备份 `.bak-0622`）→ profile .runtime-version 改一个不匹配值触发部署。**注意：pnpm 锁文件机制会覆盖此类 hack（见二）**，hack 只适合临时验证，最终必须发布。\n\n## 二、pnpm add 重建 node_modules，按锁文件恢复包版本\n\n**现象**：hack 归档部署 0.2.1 后，用户点安装 EAC（`pnpm add -w github:zouyuxuan122/Deepseek-Harness-EAC`）→ 插件中心版本回到 0.1.7。\n\n**机制**：`pnpm add` 解析依赖图 → 更新 pnpm-lock.yaml（EAC 带 148 个传递依赖，日志 `Packages: +148 -61`）→ **按新锁文件重新生成 node_modules 全部链接**。锁文件里 plugin-center 锁的是 0.1.7（依赖声明 `^0.1.7`、0.2.1 未发布），relink 时从 store 恢复 0.1.7，手工 hack 的内容被冲掉。\n\n**教训**：**任何对 node_modules 的文件级覆盖都是临时的**——只要锁文件/依赖声明还是旧版本，任何 `pnpm add/install` 都会恢复。新版本想稳定存在：发布 npm → 更新依赖声明 → pnpm install（锁文件锁定新版本）。\n\n**附带发现**：`pnpm add github:owner/repo`（git 依赖）在本机实测可用（Deepseek-Harness-EAC 0.0.0 安装成功，GitHub 网络慢约 1.5 分钟；SSiD 运行时若 node-pty 等被占用会 EPERM，需先关思灵）。\n\n## 三、package.json 带 UTF-8 BOM 导致 kernel 启动失败\n\n**现象**：部署 0.2.1（工作区 package.json 被外部工具写入时带上 BOM）后，思灵启动报：\n```\nSyntaxError: Unexpected token '﻿', \"﻿{ \"n\"... is not valid JSON\nat loadProfile (kernel.bundle.mjs:5702)\n```\nDSH kernel 的 `JSON.parse` 不剥离 BOM（Node ESM 会剥离，但 JSON.parse 不会）。\n\n**教训**：npm 包内的 package.json 严禁 BOM。发布前检查（`[System.IO.File]::ReadAllBytes` 前 3 字节 EF BB BF）。本轮已修复工作区 package.json（去除 BOM + 修复 description 历史乱码 `鈥?` → `—`）。\n\n## 四、prepare-runtime 的 node/pnpm 路径漂移\n\n**现象**：重跑 prepare-runtime 报「缺少 Node」/「缺少 pnpm 11.x」。\n\n**原因**：脚本硬编码 `D:\\Program Files\\nvm\\v22.22.2\\node.exe`（nvm 目录已移除），且 pnpm 只找 `dirname(node)/node_modules/pnpm/bin/pnpm.cjs`（系统 node 安装目录没有 pnpm）。\n\n**修复**（commit ec7e769）：\n- node 候选追加 PATH 上的 `node.exe`\n- pnpm 候选追加 `%APPDATA%\\npm\\node_modules\\pnpm\\bin\\pnpm.cjs`\n\n## 结论\n\n1. 验证新版本：临时部署只对「.runtime-version 与归档一致」的启动有效；可靠路径是发布 → prepare-runtime → 替换安装目录归档 → 重启自动部署\n2. 发布后必须同步：依赖声明（profile-template）→ 锁文件（pnpm install）→ 归档（prepare-runtime）→ 安装目录归档\n3. npm 包 JSON 文件禁 BOM；pnpm 锁文件是 node_modules 的唯一事实来源\n"},{"file":"2026-08-22-全家桶peer对齐0.1.1-rc.1.md","date":"2026-08-22","slug":"全家桶peer对齐0.1.1-rc.1","title":"全家桶 peer 对齐 DSH 0.1.1-rc.1 —— 决策与实施记录","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-22","dateNote":null,"tags":["@deepseek-ai/dsh-","@deepseek-ai/cordis","@deepseek-ai/cordis-plugin-","@deepseek-ai/schemastery","dsh-chat-rail","dsh-better-sidebar","dsh-chinese-thinking","dsh-draft-polish
