个**只追加的清单**；`--write` 模式**先证明每个现有封印未变**，才追加新归档的产物\n- **所有其他文档门禁排除归档源**——这样\"它们演变的标准不能产生编辑历史的压力\"\n- **supersession 检查在写新笔记时进行，而不是推迟到以后的语料清理**\n\n### 凭什么这么判断（7 个被否决方案，取最锋利的）\n\n| 方案 | 否决理由 |\n|---|---|\n| **删掉每一个离开活跃语料的笔记** | 一个 implemented 记录可以**前向指导价值低，却仍提供关于一个已关闭决策的有用历史证据**。**内容封存的归档保留了那个证据，而不假装它仍然是当前的** |\n| **把归档笔记留在默认的搜索结果里** | **归档事实按设计就可能过时，并且可能靠词汇匹配压过当前结果** |\n| **把 supersession 清理推迟到周期性语料审计** | **替代笔记的作者拥有关于所有权和重叠的最新鲜证据。** 推迟会留下冗余的活跃权威，并让以后的分类更贵 |\n| **也归档 rejected 或 proposed 笔记** | 归档状态的意思是\"已实现的历史决策\"。**一个过时的提案需要一次明确的拒绝；而一个没有护栏价值的拒绝需要删除，而不是第二个低价值的存放区** |\n| **继续对归档笔记适用所有文档门禁** | 后来的格式、翻译、代码、包或链接规则**会要求重写那个历史快照** |\n| **允许事实刷新，只冻结理由** | **那重新制造了活跃语料的判断和翻译负担，并让\"哪些分句是历史的\"变得不清楚** |\n\n第 4 条对\"归档\"这个动作的语义界定值得记住：**归档 = \"已实现的历史决策\"，所以它不能用来处理其他状态的废弃物。** 每一种废弃有它自己的正确出口——过时提案 → 明确拒绝；无价值拒绝 → 删除。\n\n### 他们承认的代价\n\n- 活跃语料变成\"**一组预期会影响未来工作的决策**\"\n- 写一篇新笔记现在包含一次**有范围的 supersession 检查**\n- **归档事实和出站链接可以按设计就是过时的**——所以读者和 agent **必须把活跃代码与文档当权威，只把归档笔记作为历史引用**\n\n最后一条是**把\"存档会腐坏\"这件事正当化并明写出来**，而不是假装存档还能保持新鲜。\n\n---\n\n## 3. 包锚定的子系统页面\n\n`2026-08-03-package-anchored-subsystem-pages.md`\n\n### 他们遇到的事\n\n子系统目录的前页曾用一条 **spine-vs-seam 规则**划定范围：**一个类型是 \"core\" 的，如果循环在每一轮都持有、派生、流式传输或记录它。**\n\n这条规则的问题在于——**它选的是类型，不是包**。随着文件夹长到四十多页：\n\n- **前页变成了一个跨包的大杂烩**：LLM 对话词汇坐在 agent 契约之上\n- 创建/所有权词汇（`AgentHandle`、`CreateAgentOptions`…）**在整个文件夹里哪儿都没被记录**，因为生成器把它们豁免到了一个包 README\n- **读者无法从\"这个类型住在哪里\"预测哪个页面记录它**\n\n同时，包组 README **没有共同形状**——有的带分节表格，有的夹着设计散文，有的拖着本该属于子系统页面的段落。\n\n### 判断\n\n- 每个 `docs/subsystems/` 页面**锚定到声明它词汇的那个包或包组**，**页面成员资格跟随仓库布局**\n- 仓库范围的类型模式（`…Map → derived-union`、branded ids）**留在一个显式框定的收尾章节**里，而不是与包内容交错\n- **每个被生成的签名引用到的类型，都必须在文件夹里的某处可解析**——所有权词汇从生成器的 `TYPE_LINK_EXEMPTIONS` 移进了 `LINK_MAP → core.md`，于是**豁免被保留给真正的服务本地或 vendor 形态**\n- **每个被粘贴的声明只有一个家**\n- 每个 `packages/\u003cgroup>/README.md` 对是一个**薄入口点，形状统一**：why-first 引言段 + 一张包表（Package / Role / ctx key）+ 结尾指向所属子系统页面\n- **承载实质内容、超出该形状的散文，重定位到所属子系统页面，而不是被删除**\n- 门禁拒绝：缺失的组 README、**既没有读者可见的直接链接也没有显式豁免的组**、空白或孤立的豁免、**\"已豁免的组后来又获得了链接\"**、以及所指页面缺失的链接\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持 spine-vs-subsystem 范围规则 | **它按类型回答\"这个类型是不是 core？\"——这就是为什么前页积累了来自四个包的类型，却漏掉了 `packages/core/agent` 公共 API 的一半。按仓库布局的可预测性胜出** |\n| 一个扁平的单一文档目录 | 原笔记里已被否决；**增长到四十一页确认了那个判决** |\n| 只在包 README 里记录所有权词汇（豁免的现状） | 这让 `AgentHandle` 和创建/恢复选项**对那个自称\"类型参考\"的文件夹不可见** |\n\n第 1 条的否决理由是一次很干净的自我修正：**规则问错了维度**（问\"类型重不重要\"，而不是\"类型住在哪个包\"），于是既收进了不该收的，又漏掉了该收的。结论只有五个字：**可预测性胜出。**\n\n### 他们承认的代价\n\n- 每个包组**必须让它的子系统拥有者、或者一个有理由的缺席，变得可评审**（不能只是\"没有\"）\n- `verify-type-equiv` 的 1:1 清单要求每个粘贴单一归属——**重复的 `SessionEvent` 粘贴被删掉了**\n\n---\n\n## 对索引里跨批模式的验证\n\n第 06 批的选题目的之一就是**交叉验证**，结果是两条得到强力印证：\n\n### ✅ 模式 B：拒绝\"第二份真相\"——**强验证**\n\n第 1 篇是这条模式的完美例证，而且理由比我之前记录的更完整：\n\n- 索引**复制了**路径、日期、H1 已经编码的事实（第二份真相）\n- 而且它还是个**合并热点**——无关分支每次都要重写它\n\n这里补上了我之前没意识到的一个维度：**第二份真相的代价不只是\"要同步\"，还包括\"它会把无关的改动拖进同一份文件里\"。** 争用与漂移是两种不同的成本。\n\n### ✅ 模式 A：诚实的空白胜过补齐——**强验证，且更彻底**\n\n第 2 篇把这条立场推到了制度层面：\n\n> A content-sealed archive preserves that evidence **without pretending it remains current**.\n\n**内容封存的归档保留那个证据，而不假装它仍然是当前的。**\n\n它甚至把\"存档会腐坏\"**正当化并写进规范**：归档笔记**不因重命名包、变化的行为、翻译标准、格式规则、断裂的出站链接而更新**。这不是疏忽，是设计。\n\n### 🆕 新增一条模式：可预测性战胜精确性（第 3 篇）\n\n一条更精确的规则（spine-vs-seam）输给了一条更粗糙但可预测的规则（按仓库布局）。原因不是精确性不好，而是**精确的规则需要每次判断，而判断会漏**——它漏掉了半个公共 API，同时收进了四个包的类型。\n\n**当一个规则要求\"逐例判断重要性\"时，它就已经在制造漏洞了。**\n\n### 🆕 新增一条模式：冻结 = 放弃更新它的义务\n\n归档笔记与其他文档门禁**完全脱钩**，理由是\"它们演变的标准不能产生编辑历史的压力\"。\n\n**冻结一个东西，意味着明确划掉它未来的维护义务**——否则\"冻结\"只是名义上的，实际负担照旧。\n\n---\n\n## 这批的共同判断标准\n\n**① 一份事实只该有一个家，而且那个家要可预测。**\n索引复制路径与日期（第 1 篇）、类型该跟着包走而不是跟着\"重要性\"走（第 3 篇）、每个粘贴声明只有一个家（第 3 篇）——三个不同层面上的同一个要求。\n\n**② 第二份真相有两种成本，漂移只是其中之一。**\n另一种是**争用**：它会把你无关的改动拖进同一份文件。评估任何\"再维护一份清单\"的方案时，两种成本都要算。\n\n**③ 冻结要真的冻结，包括放弃维护义务。**\n归档笔记**不跟随重命名、格式规则、翻译标准更新**，且**被所有文档门禁排除在外**。否则\"历史\"会持续产生新的工作量，而它已经不再提供价值。\n\n**④ 归档与删除的语义不能混。**\n归档 = \"已实现的历史决策\"。所以过时的提案要**明确拒绝**，没价值的拒绝要**删除**，而**不是找第二个低价值存放区**。\n\n**⑤ 用可预测性换精确性，通常是划算的。**\n要求\"逐例判断重要性\"的规则，会在两个方向同时出错：收进不该收的，漏掉该收的。\n\n---\n\n## 下一批（待读）\n\n交叉验证可以继续：`2026-07-26-ci-failover-runbook`（手册与自动化边界）、`2026-07-20-gui-testing-system`（测试系统）、`2026-08-26-published-dependency-faces`（发布依赖面）、`2026-06-16-pnpm-over-yarn`（工具链选择）、`2026-09-02-project-local-issue-planning-fields`（规划字段）。\n"},{"file":"2026-09-10-DSH过程决策精读-07-工具的选择与边界.md","date":"2026-09-10","slug":"DSH过程决策精读-07-工具的选择与边界","title":"DSH 过程决策精读 · 第 07 批：工具的选择与边界","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@pnpm/exe"],"summary":"2026-06-16-pnpm-over-yarn.md","bytes":16986,"lines":262,"body":"# DSH 过程决策精读 · 第 07 批：工具的选择与边界\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。都在讲同一件事的不同侧面：**工具不是中立的，选择工具等于选择它会替你挡住什么。**\n> 这批还有一条罕见的诚实——一份**削弱了自己迁移理由的性能数据**被完整公开。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [pnpm 而非 Yarn 4](#1-pnpm-而非-yarn-4) | 选了\"生态期待的那个\"，而不是\"能用的那个\"；且公开了不利于自己的数据 |\n| 2 | [TSC 优先的构建](#2-tsc-优先的构建与单一编译器所有权) | 一个编译器拥有转换，边界用项目引用划 |\n| 3 | [GUI 测试系统三层结构](#3-gui-测试系统的三层结构) | fixture 全绿不算完成 |\n\n---\n\n## 1. pnpm 而非 Yarn 4\n\n`2026-06-16-pnpm-over-yarn.md`\n\n### 他们遇到的事\n\n仓库原本跑在 **Yarn 4 + `node-modules` linker** 上——原文承认这是一个**刻意保守的选择**：行为像 npm 的扁平布局，同时拿到 Yarn 的 workspaces 和 `yarn constraints`。\n\n> It worked.\n\n**它能用。** 但两个趋势让\"能用\"不够：\n\n- Yarn 4 的 Plug'n'Play 血统**让 `node-modules` linker 成为偏离常轨的模式**\n- 更广的 JS 生态——工具默认值、CI actions、Corepack 示例、贡献者熟悉度——**越来越以 pnpm 为中心**\n\n而对一个**主要由 agent 构建、偶尔由人类贡献者阅读**的仓库，\"**大多数工具和人期待的那个包管理器**\"有真实价值：**更少的意外、更好走通的失败路径、更多可复制的答案**。最后一条尤其贴切——生态默认的那个，意味着你能搜到答案。\n\n### 凭什么判断\"现在是换的时候\"\n\n这段时机论证值得学：\n\n- 仓库**还不发布任何东西**（每个包都是 `private: true`）\n- 开发、测试、源码 demo 都走各自声明的 TypeScript 启动器\n- 所以包管理器只需要做三件事：**(a) 解析和链接 `node_modules`、(b) 运行 workspace 脚本、(c) 强制 workspace 约束**\n- 唯一的 Yarn 专属资产是 `yarn.config.cjs`，**小而机械**，容易重新表达\n\n结论一句话：**趁爆炸半径还小的时候，用一个更健康生态的选项替换一个承重工具。**\n\n### 判断：把工具的错误变成防线\n\n最关键的一条设计：\n\n> We deliberately add **no** `node-linker=hoisted` / `shamefully-hoist` escape hatch: pnpm's non-flat `node_modules` makes phantom dependencies (importing an undeclared transitive dep) fail loudly, which is a *feature* for a repo whose whole quality story is mechanical gates.\n\n**他们刻意不加逃生舱。** 幻影依赖（导入一个未声明的传递依赖）在扁平布局下能侥幸工作，在 pnpm 的非扁平 `node_modules` 下**会大声失败**——而他们把这当作 feature，因为\"整个质量故事都是机械门禁\"。\n\n**门禁套件（typecheck、lint、test、build）就是\"不存在这类幻影导入\"的安全网证明。**\n\n另一条：**构建脚本允许清单**。pnpm 10+ 默认不运行依赖的生命周期脚本，他们显式列了 `allowBuilds`——**仓库已经对模型/工具输出采取的同一套供应链加固姿态，现在应用到安装期的代码执行**。同一个姿态，换了作用面。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持 Yarn 4 | 零改动，**但赌在一个更少人走的 linker 模式，和一个绑定到单一包管理器的约束引擎上** |\n| npm workspaces | 无处不在，**但没有约束故事，monorepo 工效更弱** |\n| **pnpm + hoisted linker** | 迁移更平滑，**但丢掉了幻影依赖的安全性——而那正是这次迁移的主要正确性理由** |\n| 总是通过 Node 运行 `npm_execpath` | 对 pnpm 的 JS 分发有效，**但要求 Node 去解析 `@pnpm/exe` 提供的 ELF / Mach-O / PE 可执行文件** |\n| 通过 shell 运行重入命令 | 接受更多启动器形式，**但改变了每个子命令的引号、元字符展开、可执行文件解析和信号行为** |\n\n第 3 条体现了一种一致性：**如果一个方案的卖点是\"迁移更平滑\"，而它恰好削掉了你迁移的全部理由，那就没有理由。**\n\n### 他们承认的代价（本批最值得记的一段）\n\n先是一处功能损失：约束检查**失去了 Yarn 的自动修复**（`workspace.set()` 可以就地重写 manifest），新脚本只检查、非零退出。判断是\"可接受\"——因为**CI 从来不跑 `--fix`**，一行手工编辑也很少见。\n\n然后是**性能数据**，先标前置条件：\n\n> measured at migration time on the dev NFS filesystem; **single-digit-run samples, high variance — directional, not a benchmark suite**\n\n| 场景 | Yarn 4 | pnpm 11 |\n|---|---|---|\n| 冷启动（空 cache/store，无 `node_modules`） | ~14 s | **~16 s** |\n| 热重链（store 热，删掉 `node_modules`） | ~12–14 s | **~15–22 s** |\n| 冻结、`node_modules` 存在（no-op 复核） | ~2–8 s | ~0.5–7 s |\n\n**大多数格子对 pnpm 不利。** 而他们接着解释了为什么这个测试本就测不出真实优势：pnpm 的内容寻址存储本应在磁盘占用上大胜（一个全局 store 硬链接进每个 `node_modules`，而 Yarn 每个 worktree 复制 ~279 MB，有些开发者同时留十几个 worktree）——但**测试 store 和 `node_modules` 在不同文件系统上，硬链接失效了**。\n\n然后是那句总结：\n\n> The honest summary: install speed on our NFS dev filesystem is a wash within noise; the move is justified by ecosystem alignment, phantom-dependency safety, and cross-checkout disk dedup — **not by a raw install-time win**.\n\n**诚实的总结：安装速度在噪声范围内是平局；这次迁移的正当理由是生态对齐、幻影依赖安全和跨 checkout 磁盘去重——不是原始的安装时间收益。**\n\n一份**削弱了自己迁移理由**的数据，被完整贴出来，还附上\"我们的测试环境让这个优势无法显现\"的解释。这是第 02、04、05、06 批\"诚实的空白\"立场的又一次现身。\n\n---\n\n## 2. TSC 优先的构建与单一编译器所有权\n\n`2026-06-17-ts-build-config.md`\n\n### 他们遇到的事\n\n- `build` **让两个工具都做 TypeScript 转换**：用 `tsc` 产 `.d.ts`，用 `tsdown` 产打包的 `.js`\n- `typecheck` 倾向于**用一个根配置**验证 packages、vendor 源码、examples、tests 和 scripts\n\n具体冲突写得很细：\n\n- `tsdown` 用 `oxc` 转换 TypeScript，**与 `tsc` 行为不同**——**打包的 `.d.ts` 与 Cordis 内部的相对模块增强形态冲突**；**打包的 `.js` 与 `tsc -b` 的逐文件 `.js` 行为也不同**（如装饰器转换）\n- `vendor/*/src`、examples、tests、scripts **不能全部朴素地放进一个根严格程序**：直接在根严格配置下检查 vendor 源码**会触发许多超出本项目所有权的类型错误**；而 `packages/*/*` 对 vendor 的依赖被解析到 `vendor/*/lib`，本来就是**为了不同的 tsconfig 严格度**\n\n### 判断\n\n- **`tsdown` 不再是 TypeScript 编译或声明输出的所有者**——它在每个 lib 阶段只在 `tsc` 发射之后读取 JavaScript、产出发布入口和浏览器包\n- 每个普通模块**有一个本地 tsconfig**，供 build、typecheck 和直接运行源码的工具（tsx、vitest、源码加载器）共用\n- 严格度差异用**项目引用**做边界，而不是一个根程序\n- **构建不自动调用 clean**，所以普通构建保留增量状态\n\n### 一段与主题无关但值得单独记的细节\n\n`clean` 在删除一个已存在的目标之前，**会解析目标的父目录，如果解析出的父目录在仓库之外就拒绝执行**：\n\n> so a symlinked project reference cannot redirect cleanup outside the checkout\n\n**一个符号链接的项目引用，不能把清理重定向到 checkout 之外。** 这类防护很便宜，但它防的是\"清理脚本删掉你的家目录\"这一档事故。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持 `tsdown`/oxc 作为 TS 转换器 | oxc 的转换**不是 `tsc` 行为**；打包的 `.d.ts` 与 Cordis 的模块增强形态冲突 |\n| 一个根严格程序覆盖所有目录 | **vendor 源码在根严格标志下触发超出项目所有权的类型错误** |\n| 每次构建前清理 | **会丢弃 `tsc` 和打包器拥有的增量状态**，即使工作区布局没变 |\n| 删除每个包级的 `node_modules` | 有效的包依赖链接**不会**导致工作区发现失败；删除它们**会把构建清理变成依赖重装** |\n\n### 他们承认的代价\n\n发布面的规则被完整写下来：`lib/types/*.d.ts` 是发布声明输出、`.d.ts.map` **只作本地编译产物保留**、`lib/types/*.js` **通常只是打包器输入**（只有当某个运行时导出显式指向发射树时才发布）、`lib/index.*` 是发布运行时输出。\n\n还有一条坦白的负债：**Cordis vendor 副本与上游又多了一处类型结构分歧，在上游同步时必须被重新应用或显式退役**。**每一个本地分歧都是一笔要在未来偿还的债，他们把它记在账上。**\n\n---\n\n## 3. GUI 测试系统的三层结构\n\n`2026-07-20-gui-testing-system.md`\n\n### 他们遇到的事\n\nGUI 栈横跨多种应用形态，而**在一种形态内又有多个运行时环境**（Node host、数据协议层、浏览器对象层、React/DOM）。\n\n原文的结论很直接：**单泳道测试套件无法给出有意义的信号。** 每一环都需要自己的有效测试，**加上**全链路测试的基础能力。\n\n### 判断：按架构的自然测试钩子切三层\n\n| 层 | 被测对象 | 关键技术 |\n|---|---|---|\n| **1 协议同构** | 生成的 Remote 描述符 + ApiGateway + Connection RPC 载体（参数/结果/错误/流/取消） | **同构点上的全链路**：进程内验证描述符编解码与分发；无浏览器演练同样的 `/api` 载体分帧与信任检查 |\n| **2 对象层编排** | Session / SessionManager / ConnectionController（状态机与时序：拼接/去重/分页/乐观草稿清除/pendingBuffers/重连/退避） | **\"事件序列进 → 快照出\"的黄金路径**：可编程 fake + 控制时序的 deferred + 控制退避的假计时器 |\n| **3 组装呈现** | 构建产物 × 真实客户端 loader 与插件组合 | 语义快照在 jsdom 下启动全部八个已构建插件；裸 Playwright 冒烟单独证明真实浏览器/载体边界 |\n\n**层间纪律一句话**：\n\n> each tier tests its own layer, upper tiers never re-test lower ones\n\n**每一层测自己的层，上层从不重复测试下层。** 落到具体：应用语义快照**只钉住跨组装插件边界的用户可见投影**；Playwright 冒烟**只证明浏览器与载体的活性**；**线上语义归第 1 层，数据语义归第 2 层**。而纯函数层（lineage/partial/notifier/transcript-adapter）在同包的 tests/ 里**零 fake 直接测试**。\n\n### 反回归纪律（本批最有价值的一节）\n\n**① 每一个 bug 修复都钉住一个断言。**\n\n按 bug 的可见面归位：浏览器可见的 bug 钉进它所属的浏览器 spec；数据层的 bug 钉进匹配的 spec。他们给了一个先例说明这样做的收益：\n\n> the res-close misjudgment pinned in the webserver bridge suite — **pure Node, reproduces in seconds, no longer needs the 12s browser sentinel as the only defense**\n\n一个原本只能靠 12 秒浏览器哨兵防守的问题，被钉成纯 Node 的秒级用例。\n\n**② fixture 全绿不算完成，真链路也必须通过。**\n\n这条直接印证第 04 批的模式 D：\n\n> what the fixture short-circuits is exactly the wire carriage chain (node:http bridge close semantics, real network timing); **both empirically confirmed bugs hid there**\n\n**fixture 短路掉的正是链路运载链**（node:http 桥接的 close 语义、真实网络时序）——而**两个经验确认的 bug 都藏在那里**。所以凡是触碰 connection/bridge/handler/SSE 的改动**必须跑浏览器泳道**。\n\n**③ 盘上代码即答案。**\n\n行为变更让现有用例变红时**当场对账**（修测试或修代码，以契约作仲裁），**不留悬空的红**。\n\n### 凭什么这么判断\n\n| 被否决 | 一行理由 |\n|---|---|\n| 单一 e2e（一切都过浏览器） | 浏览器启动慢 N 倍且时序不可控；**线上的/对象层的不变量可以在 node 环境里毫秒级完整断言** |\n| 把校验脚本迁到 vitest | 一个有序脚本共享一个浏览器会话；拆开要么把它形式化（顺序+共享页面），要么**把前导重跑 N 次**；而**流式 PASS/FAIL 输出正是 agent 的定位接口** |\n| 在测试里复用 FixtureApiClient | demo 跑在真实时钟上，测试需要手工控制的 deferred 时序——**目的正交**；强制复用会把测试链到 demo 的节奏上 |\n| 为 GUI 包单独一个 vitest 配置 | 包级 tests/ 已被根的 include 扫描；**路径过滤就是那个紧回路——零新配置** |\n| 推迟 hooks/组件层的单元测试 | jsdom 仍是覆盖率主线（快速的逐文件组件行为）；**必需的浏览器重放门禁在组装层补充它，而不是替代它** |\n\n第 2 条里那句值得单独记：**\"流式的 PASS/FAIL 输出正是 agent 的定位接口\"**——他们把测试输出格式当成 agent 工作流的一部分来设计，而不是当成给人看的日志。\n\n### 他们承认的代价\n\n- **层间纪律仍由评审承担**（只有 Linux CI 机械强制浏览器黄金输出的新鲜度）\n- **每个新的应用快照都必须避开不稳定的布局或时钟输出**\n\n---\n\n## 对索引里跨批模式的验证\n\n### ✅ 模式 D：验证到消费点——**第三次印证，且是同一条理由**\n\nGUI 篇的\"fixture 全绿不算完成\"与第 04 批 GIF 篇\"push 成功不算完成\"是同一个判断：**别在\"我这层通过了\"停住，要验到下一层真实消费的地方**。而且他们给了这次的具体缺口——fixture 短路掉的正是链路运载链，**两个真实 bug 都藏在那里**。\n\n### ✅ 模式 A：诚实的空白——**第五次现身，这次是反方向的**\n\n前几次都是\"标注缺失\"，这次是**主动公开不利于自己的数据**：性能表三个格子对 pnpm 不利，还附上\"我们的测试环境让那个本来可能成立的优势无法显现\"的解释。**结论改成\"迁移的理由是生态对齐和安全，不是速度\"。**\n\n**这条立场已经稳固到可以当作他们的默认习惯了。**\n\n### 🆕 新增模式：让工具的错误成为防线\n\npnpm 篇拒绝加 hoisted 逃生舱，因为**非扁平 `node_modules` 会让幻影依赖大声失败**——他们把工具的报错当作质量体系的一部分。\n\n**判据**：选工具时问的不是\"它的错误会不会烦到我\"，而是\"**它的错误恰好是我需要的那个信号吗**\"。\n\n---\n\n## 这批的共同判断标准\n\n**① 趁爆炸半径小的时候换承重工具。**\n时机论证写得很具体：还没有任何东西发布、工具只需做三件事、唯一专属资产小而机械。**\"现在换\"的依据是可枚举的，不是感觉。**\n\n**② 让工具的错误成为防线。**\n幻影依赖 fail loudly 是 feature；构建脚本白名单把\"安装期执行任意代码\"变成显式决定。**别去关掉那个正在替你挡事的报错。**\n\n**③ 单一所有权。**\n一个编译器拥有 TypeScript 转换（不是两个），一个事实一个家（第 06 批）。**同一件事有两个所有者，冲突迟早会以\"两边都对\"的形式爆发。**\n\n**④ 分层要沿着架构的自然接缝，而且层间不重复测试。**\n上层只测自己的层，不重测下层；纯函数层不引入任何 fake。**重复测试不是\"更保险\"，是让信号的归属变模糊。**\n\n**⑤ fixture 全绿不算完成。**\n要问一句：**这个 fixture 短路掉了什么？** 那正是真实故障藏身的地方。\n\n**⑥ 每个 bug 修复钉一个断言，且钉在它所属的层。**\n这是同一个 bug 在归属层被**秒级复现**的成本，对比它作为\"唯一防线\"需要 12 秒浏览器哨兵的现状。\n\n**⑦ 不留悬空的红。**\n行为变更导致用例变红时当场对账（修测试或修代码，用契约仲裁）。**一个挂着的红，会让后面每一次\"红了\"都失去意义。**\n\n**⑧ 本地分歧要记账。**\n\"Cordis vendor 副本与上游又多了一处类型结构分歧，同步时必须重新应用或显式退役\"——**每一笔本地定制都是未来要偿还的债，写进文档才不会被遗忘。**\n\n---\n\n## 下一批（待读）\n\n- `2026-07-19-web-styling-system.md` —— 样式系统的约束\n- `2026-07-26-ci-failover-runbook.md` —— 手册与自动化边界\n- `2026-08-26-published-dependency-faces.md` —— 发布依赖面\n- `2026-09-02-project-local-issue-planning-fields.md` —— 规划字段\n- `2026-07-27-worktree-local-lefthook.md` —— worktree 与本地钩子\n"},{"file":"2026-09-10-DSH过程决策精读-08-把判断变成可判定的规则.md","date":"2026-09-10","slug":"DSH过程决策精读-08-把判断变成可判定的规则","title":"DSH 过程决策精读 · 第 08 批：把判断变成可判定的规则","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"2026-07-19-web-styling-system.md","bytes":14989,"lines":230,"body":"# DSH 过程决策精读 · 第 08 批：把判断变成可判定的规则\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**，共同主题是**可判定性**：把\"风格建议\"变成\"看到 X，拒绝\"，把\"主题分支\"变成\"一张 token 表\"，\n> 把\"紧急时该不该切换\"变成一个**不需要合并**的变量。\n> 其中 CI 那篇讲了一个堪称完美的死锁困境。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [Web 样式系统](#1-web-样式系统) | 12 项检查表，每一项都是\"看到 X，拒绝\" |\n| 2 | [CI 故障切换手册](#2-ci-故障切换运行手册) | 修复 CI 的改动，需要 CI 通过才能合并 |\n| 3 | [发布的依赖面](#3-发布的依赖面与有界的-peer-中继) | 未分类的导出阻塞一切自动写入 |\n\n---\n\n## 1. Web 样式系统\n\n`2026-07-19-web-styling-system.md`\n\n### 他们遇到的事\n\n两句话，但把前提说尽了：\n\n> The GUI **has no designer supply**; styles are written by an agent and reviewed. **Without a machine-checkable token system and coding rules**, colors/radii/motion drift as literals across components, and dark mode grows into conditional branches scattered inside components.\n\n**GUI 没有设计师供给**；样式由 agent 写、由人评审。**如果没有机器可检查的 token 系统和编码规则**，颜色/圆角/动效就会作为字面量在组件之间漂移，而暗色模式会长成**散落在组件内部的条件分支**。\n\n### 判断：五条框架规则\n\n1. **视觉基线 = 与 Chat 前端对齐**。每个值来自一次 Chat 前端调研（品牌蓝、灰阶、气泡几何、阴影层级…）；**偏差允许，但必须先记录在偏差表里**\n2. **两层 token，不是三层**。基线仓库用 static→alias→specific 三层；**在他们的规模上压缩成两层**——\"直接持有真实值的语义层 + 少量组件专属槽位\"\n3. **字号与间距不做 token 化**。字号在组件里写 px，且**总是搭配行高**（16/24、14/22、12/18）；间距用 4 的倍数；**token 化只覆盖颜色/圆角/动效/字体栈/阴影**\n4. **边框与交互态用透明度方案**。理由很实用：`rgba(...)` **叠加在任何高度背景上都成立**，于是**不需要引入新的实色灰**\n5. **暗色模式只发生在 token 表里**——**组件 CSS 里零主题选择器**。当某个非 token 值确实必须随主题变化时，走\"**CSS 变量桥**\"：组件定义局部变量，主题块只覆盖那个变量\n\n### 一条为 agent 设计的规范形态\n\n> The spec is maintained as a **review checklist** (12 items): each item is a decidable \"**see X, reject**\" — **not a style suggestion** — and **writing styles and reviewing styles share the same table**.\n\n三个要点叠在一起：\n\n- 每一项都写成**可判定的拒绝**，不是风格建议\n- **写和评审共用同一张表**（作者的自我检查与评审者的检查是同一次动作）\n- 规范带**操作清单**：新增组件怎么做、加 token 怎么做（先加表行 → 再改两个 CSS 块 → 才在组件里引用）、偏离基线怎么做（**先记偏差表再落代码**）\n\n### 分工：RFC 与活文档\n\n| 内容 | 家 |\n|---|---|\n| 五条框架规则、工程约束、\"为什么两层\"、\"为什么字号不 token 化\" | **本 RFC——改它需要一份新的取代 RFC** |\n| 每个 token 的权威值、视觉基线常量、12 条编码规则、偏差记录 | 活文档，随实现演进 |\n\n**判断性的内容（为什么）冻结在 RFC，事实性的内容（值）放在活文档。** 改事实是日常，改判断要重新走一次决策。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| **token 化字号/间距** | 基线仓库**证明了不 token 化也能收敛**（配对行高的纪律替代了它）；而**一个膨胀的 token 表会稀释颜色 token 的权威性** |\n| **暗色模式用 `prefers-color-scheme` 或组件内分支** | 属性选择器的**整表覆盖让组件保持无知觉**；系统偏好以后可以叠加到开关上，而不触碰 token 机制 |\n\n第 1 条里那句值得单记：**表越大，表里每一项的权威越弱。** 他们宁可少收一点，也不稀释已经收进表里的东西。\n\n### 他们承认的代价\n\n- 字号/间距**依赖纪律而非 token**（配对行高 + 4 的倍数）\n- **任何框架变更都需要一份取代 RFC**\n\n---\n\n## 2. CI 故障切换运行手册\n\n`2026-07-26-ci-failover-runbook.md`\n\n### 他们遇到的事：一个完美的死锁\n\n三个必需的 Linux worker job 跑在托管的企业 32 核池上。当企业池退化时——\n\n> When the enterprise pools degrade — jobs queue indefinitely or the enterprise labels vanish — **every open pull request becomes unmergeable**, and **the ordinary recovery of merging a fix is itself deadlocked behind the very required checks that cannot run**.\n\n**每一个开着的 PR 都变得不可合并；而\"合并一个修复\"这个常规恢复手段本身，被那些跑不起来的必需检查死锁住了。**\n\n修复 CI 的改动要走 CI，而 CI 挂了。**这正是\"常规出路恰好被故障本身封死\"的经典形态。**\n\n### 判断\n\n**范围：两个独立开关，每个平台一个。** `DSH_CI_FAILOVER_LINUX` 恢复企业 Linux 池故障；`DSH_CI_FAILOVER_WINDOWS` 恢复托管 Windows 池故障。**一个平台的故障不必重定向另一个平台的 job。**\n\n关键性质：\n\n> Each switch is **writer-manageable repository state, not a merge**, so it works while checks are red.\n\n**每个开关都是 writer 可管理的仓库状态，不是一次合并，所以它在检查是红的时候也能工作。**\n\n### 他们凭什么敢把它交给 writer 级权限（这段是权限推理的范本）\n\nGitHub 允许任何有写权限的协作者管理仓库变量，所以这不是 admin-only。他们的回应：\n\n> In this repository's trust model that is **not an escalation**: the runner groups admit all workflows of this private, fork-disabled repository, so **any writer could already reach the VMs by pushing a branch workflow**. **The boundary against untrusted code is repository membership; the variables only route work for members.**\n\n**对不可信代码的边界是仓库成员资格，而变量只是为成员路由工作。** 换句话说：这个开关没有创造任何新能力，它只是让已有的能力便宜了一点。\n\n### 三条附带的诚实设计\n\n**① Dependabot 例外。** 两个开关的自托管腿**刻意排除 `dependabot[bot]`**：在自托管故障切换下，Dependabot PR **保持排队等待托管池，而不是在常驻 VM 上执行依赖提供的代码**。\n\n而且明确写了期望行为：**一个在故障期间保持排队的 Dependabot PR 是预期行为，不是切换失败。**\n\n**② 自建池的容量描述不许美化。** `vm-backup` 是**一个共享 VM 上的多个 runner 实例**：\n\n> Registrations share its CPU, memory, and disk; **their count is not a count of independent machines.**\n\n**它们的数量不是独立机器的数量。** 同段还写着\"额外注册只增加调度槽位，不增加机器资源\"。\n\n**③ 一条实测教训写进了规范。** 把 runner 组钉到 master-ref workflow **与这个故障切换不兼容**——因为故障切换 job 是 `pull_request` 运行、从 PR merge ref 评估的，master 钉住的组会让它们**保持排队**：\n\n> (observed live on 2026-07-27; the group was widened to all workflows of this repository to unblock the switch)\n\n**更严格的 runner 侧策略，代价是 PR 故障切换。**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| **合并一个 workflow 变更来切换池** | **促成这个开关的故障状态，恰恰是没有任何 PR 能合并的状态——那些必需的检查正是失败的那些。** 仓库变量是 writer 可管理状态，重跑即生效、无需合并 |\n| **让自建池永远留在必需路径里** | **那是拿托管池的可用性换了自建 VM 的可用性，等于移动了单点故障，而不是增加了一个回退。** 按平台拆分意味着一个平台的故障不会重定向另一个平台 |\n\n第 2 条是一个可以复用的判据：**\"把 A 换成 B\" 不是冗余，只有\"A 或 B 都能用\"才是。**\n\n### 他们承认的代价\n\n- **每个平台要维护第二套 runner 拓扑**，而且自托管的并发与缓存分支必须**与托管腿保持同步**\n- **只有完成的 verdict 才算就绪证据**——一个被取消的、或仅仅被排入的运行**不是就绪证明**\n- 按平台拆开关**多了一个要管理的变量**，但把每个开关的影响范围**限制在单一平台的 job 上**\n\n---\n\n## 3. 发布的依赖面与有界的 peer 中继\n\n`2026-08-26-published-dependency-faces.md`\n\n### 他们遇到的事\n\n一个包可能同时包含**浏览器 bundle、Host 入口、共享 TS 声明和 Cordis 注入元数据**。把所有这些关系都编码成必需的 npm peer，导致发布的 CLI **安装变得昂贵**：npm 会自动安装 peer，并且沿着深层的、收敛的 peer 路径**反复评估放置位置**。\n\n关键判断：**改范围、或者把 peer 变成可选，都没有消除那个遍历。** ——问题不在\"范围写得不合适\"，在\"关系被放错了区段\"。\n\n而且两类关系的归属本就不同：**选择 Client 构建输入的是\"发布的 profile\"**，而**Host 值导入是由 Node 从导入包处加载的**。\n\n### 判断：三档分类 + 一道硬闸\n\n每个 Host 运行时导出被归入三档之一，**只能归入一档**：\n\n| 分类 | 含义 | 结果 |\n|---|---|---|\n| `duplicateSafePackages` | 该包的值是无状态的、结构可识别的、或通过版本化互操作描述符存储 | 整包作为**普通依赖** |\n| `safeHostDependencyExports` | 包的其余导出无法作同样保证，但**列出的这些可以** | 仅列出的导出作为普通依赖 |\n| `peerRequiredHostExports` | **构造函数身份或模块状态必须共享**的导出 | **整条包边**保持 peer + dev |\n\n然后是那道硬闸：\n\n> An unclassified Host runtime export is a policy violation that **blocks all `--fix` writes**... Once source safety passes, `--fix` performs only the section and range changes implied by the classification.\n\n**未分类的运行时导出是政策违规，阻塞所有 `--fix` 写入。** 只有源头安全通过之后，`--fix` 才执行分类所蕴含的区段与范围变更。\n\n**自动修复拒绝在存在未分类项时动手**——因为此时任何自动写入都是在**猜测**。这与第 05 批\"tag 是 commit 指针不是发布证明\"是同一种谨慎：**工具只做它有证据做的事。**\n\n诊断形态也值得记：\n\n> An unclassified runtime import reports **one clickable `path:line:column` diagnostic per imported export.**\n\n**每个被导入的导出，一条可点击的 `path:line:column` 诊断。** 而且验证器**读源文件，所以它在干净树上运行**——不需要先构建。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持内部关系为 peer | npm 必须沿着收敛的祖先路径放置和验证每个必需 peer——**即使所有内部版本都兼容，也会重现报告过的安装时故障** |\n| 用 `\"./client\"` 导出作为 Client 面的名册 | 一个包可以发布面向 Client 的类型或浏览器 API，**却不贡献动态加载的行**；选择它会**把迁移扩大到无关的 Host 包**。`dsh.client` 标识动态行，`packages/client/` 目录独立覆盖静态输入 |\n| 展平每个 Host 包 | 消除了更多 peer 工作，**但把迁移扩大到那些个别基准结果微不足道的包**。显式列表**保留剩余的 peer 契约，直到测量证明另一个条目正当** |\n| 把每个 Client 相关声明移到仅开发 | 双面包的 Host 值导入**仍然是真实的 Node 加载**；省略它们**会让包依赖于某个 profile 的偶然提升** |\n| 在 CI 里强制墙钟阈值 | **resolver 时间随机器负载和元数据完成顺序变化。确定性的 manifest 分类属于 CI；计时留给维护者基准** |\n\n**\"直到测量证明另一个条目正当\"** 与第 07 批\"趁爆炸半径小的时候换\"是同一套纪律：**不做没有测量支撑的扩大。**\n\n### 他们承认的代价\n\n- **把一个公开的类型-only 关系移到 `devDependencies`，意味着一个独立 TypeScript 消费者在消费那个声明时必须安装被引用的类型包。** 发布的 profile 安装完整族；**支持独立组装的消费者将需要一个不同的政策**\n- **元数据-only 基准是诊断证据，不是发布时的性能承诺**\n\n第 1 条是主动写出\"这个决定的受益者之外还有受损者\"——**代价不只作用于自己，也作用于下游消费者，他们说清楚了。**\n\n---\n\n## 这批的共同判断标准\n\n**① 规范要写成\"可判定的拒绝\"，不是风格建议。**\n12 项检查表的每一项都是\"看到 X，拒绝\"。**判断标准：一个人读完这条规范，能不能在不咨询作者的情况下得出唯一结论？**\n\n**② 写的人与评审的人共用同一张表。**\n自我检查与评审检查是同一次动作——**这消除了\"规范知道但没执行\"的空间**（第 02 批\"十九个文件展示了单靠约定能达成什么\"的正面解法）。\n\n**③ 约束要在被约束者无知觉的情况下生效。**\n暗色模式靠属性选择器的**整表覆盖**，于是**组件里零主题选择器**。**好的约束不需要被约束者配合。**\n\n**④ 表越大，表里每一项的权威越弱。**\n他们拒绝 token 化字号与间距，理由是**膨胀的表会稀释颜色 token 的权威性**。**约束的范围应该由\"它能守住多少\"决定，不是由\"它能覆盖多少\"决定。**\n\n**⑤ 越界的机制不能走那条被阻塞的路径。**\nCI 那篇的决定性论证：把切换做成\"一次合并\"是错的，**因为需要切换的时刻，正是合并被阻塞的时刻**。\n**判据：设计应急机制时，先问它依赖的通道在故障时是否还通。**\n\n**⑥ 冗余 ≠ 替换。**\n\"让自建池永远在必需路径里\"被否决，因为**那是用 B 的可用性换 A 的可用性——移动了单点故障，没有增加回退**。\n\n**⑦ 自动修复必须在信息不足时拒绝动手。**\n未分类导出阻塞所有 `--fix` 写入。**工具只做它有证据做的事**——证据不足时的\"尽力而为\"，等于用一个更强的语气说出一个更弱的判断。\n\n**⑧ 诊断要可直接定位。**\n每个未分类导出给一条**可点击的 `path:line:column`**。这是第 01 批\"每条违规自带 文件:行\"的又一次落地。\n\n---\n\n## 下一步\n\n**进度 26/47（55%）**，已过半。下一批候选：`project-local-issue-planning-fields`（规划字段）、`worktree-local-lefthook`（worktree 与钩子）、`generated-third-party-notices`（生成物）、`serial-cross-platform-ci-reference`（跨平台 CI）、`node-engine-floor`（引擎下限）。\n"},{"file":"2026-09-10-DSH过程决策精读-09-派生物与事实源.md","date":"2026-09-10","slug":"DSH过程决策精读-09-派生物与事实源","title":"DSH 过程决策精读 · 第 09 批：派生物与事实源","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@anthropic-ai/claude-agent-sdk","@earendil-works/pi-ai","@types/node"],"summary":"2026-07-30-generated-third-party-notices.md · 本批最重要的一篇","bytes":18982,"lines":301,"body":"# DSH 过程决策精读 · 第 09 批：派生物与事实源\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。主题是\"派生出来的东西怎么保持不撒谎\"。\n> 这批解决了一个我此前记录为\"模式 B（拒绝第二份真相）\"的悬案：**同一类东西，为什么他们拒绝了索引和账本，却接受了一个生成文件？答案是有边界的。**\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [生成的第三方声明](#1-生成的第三方声明) | 新鲜度是**被维护**，不只是被强制 |\n| 2 | [worktree 局部的 Lefthook](#2-worktree-局部的-lefthook) | 隔离共享可变状态；拒绝造通用层 |\n| 3 | [把 Node LTS 下限提到 22.19](#3-把-node-lts-下限提到-2219) | 下限是\"已安装工作区\"的契约，不只是源码的契约 |\n\n---\n\n## 1. 生成的第三方声明\n\n`2026-07-30-generated-third-party-notices.md` · **本批最重要的一篇**\n\n### 他们遇到的事\n\n开源要求披露依赖及其许可证。这个披露必须同时满足三件事：\n\n1. **完整**\n2. **随依赖变化保持真实**\n3. **说出读者能行动的东西**——哪些包最终会出现在用户机器上，哪些只用于构建和测试\n\n然后一句判决：\n\n> A hand-written inventory answers **none of those durably**. Roughly a hundred rows... **drift silently the moment a package is added, removed, or relicensed, and nothing would notice.**\n\n手写清单一条都做不到。大约一百行名字与许可证字符串，**一旦有包被添加、移除或改许可就会静默漂移，而没有任何东西会注意到。**\n\n### 判断：把\"新鲜度\"设计成被维护，而不是被检查\n\n这是本篇最有价值的设计，也是对模式 B 的一个正面解法：\n\n> **Freshness is maintained, not merely enforced.** A pre-commit job regenerates the file and stages it **whenever a generator input is staged**... so **an unrelated dependency edit never has to come back and rerun a generator**.\n\n**在生成器的任一输入被暂存时，pre-commit job 重新生成并暂存该文件。** 输入清单包括：任何 manifest、workspace 声明、根锁文件、`vendor/README.md`、`pyproject.toml`、生成器本身、以及持有构建期 pin 的脚本。\n\n于是**一次无关的依赖编辑永远不必回头重跑生成器**——文件在提交的那一刻就已经是对的。\n\n而**校验**则搭了现成的车：提交后的字节在 `gen-third-party-notices.spec.ts` 里被断言，**而测试泳道本来就会跑它**：\n\n> the check adds **no gate process, no scheduler slot, and no separate CI step**\n\n**不增加门进程、不增加调度槽位、不增加独立 CI 步骤。**\n\n对比一下他们否决的那个方案就明白这个设计的分量：\n\n> its only failure mode is telling a contributor, **minutes after they pushed an unrelated dependency bump**, to go rerun a generator\n\n**它唯一的失败模式，是在一个贡献者推完一个无关的依赖升级几分钟后，告诉他\"去重跑一下生成器\"。**\n\n### 一个被接受、而不是被绕过的缺口\n\n> lefthook inspects only files present on disk, so **deleting** a manifest runs no job\n\nlefthook **只看磁盘上存在的文件**，所以**删除**一个 manifest 不会触发任何 job。他们试过补救——重建暂存文件列表以包含删除——**不行**，因为 lefthook 无论如何都会用工作树过滤那个列表。\n\n于是他们**接受这个缺口并指定兜底**：断言正是为这种情况存在的。**\"接受并指定兜底\"不同于\"忽略\"**——差别在于缺口被写下来了。\n\n### 三条关键的内容判断\n\n**① 只披露直接依赖。** 完整传递闭包（几千个包）**已经带精确版本记录在锁文件里**：\n\n> re-materializing either as prose would be a **second, worse copy**\n\n**把它们重新物化成散文，会是第二份、更差的拷贝。** 文件改为指向锁文件和 `pnpm licenses list` 渲染器。\n\n**② 分层跟随\"分发\"，不跟随 manifest 区段。**\n\n这是本篇的技术核心，也是他们明确推翻的一个\"机械上简单\"的做法：\n\n| 规则 | 结果 |\n|---|---|\n| 按 manifest 区段分层（`dependencies` vs `devDependencies`） | **机械上简单，在真实数据上两个方向都错** |\n| 按\"从已发布装配的可达性\"分层 | 层更紧，**但把 MCP 客户端和 OpenTelemetry 导出器判为仅开发——即使用户运行已安装的仓库时可以挂载它们** |\n\n实际规则：运行时库 = `dependencies` 或 `optionalDependencies` **且不在 `DEV_ONLY_AREAS` 里**；**被发布的 tsdown 和 Vite 配置解析的浏览器输入也算运行时，即使它们在 `devDependencies` 里**；而**测试支持的依赖不会仅因为它的 manifest 写着 `dependencies` 就发布**。\n\n最关键的一条：**运行时层刻意覆盖每一个可挂载的插件**，不只是默认装配加载的那些——因为**源码执行可以从用户的 `cordis.yml` 挂载任何插件包**。原文由此给出错误方向判断：\n\n> **Under-disclosure is the costly direction for a legal notice.**\n\n**对一份法律声明来说，披露不足才是代价高昂的那个方向。**\n\n**③ 各处 fail-loud 的清单。**\n\n- manifest 集合**从根 `pnpm-workspace.yaml` 声明的成员派生**——\"**一个新的成员区域在被声明的那天就被读到，而不是等到有人记得扩展列表的那天**\"\n- **一个包若既不在 store 也不在 link farm 里解析，就大声失败，而不是发出一个空单元格**\n- **许可证不在许可列表上的运行时依赖是硬错误**：*\"发布 copyleft 是一个分发决定，不是一张重新生成的表可以静默吸收的东西\"*\n- vendored 包与 `vendor/README.md` 交叉核对，**任何一个不是 MIT 就被拒绝**\n- `patchedDependencies` 列在运行时表下——因为 **pnpm 在安装时应用那些补丁，发布的产物携带修改过的副本，而补丁文件就是\"改了什么\"的记录**\n\n### 一段极精细的授权设计（Claude SDK）\n\n项目所有者单独授权分发官方 `@anthropic-ai/claude-agent-sdk`。生成器把它表示为**一个精确的直接包身份例外，而不是一次许可证宽松化覆盖**：\n\n- `SEE LICENSE IN README.md` 这类**仍然是非宽松分类**\n- **每一个无关的非宽松运行时仍然 fail closed**\n- 当 SDK 存在时，生成器读它已安装的 manifest、**拒绝官方 SDK 载荷前缀之外的可选身份**、验证已安装宿主载荷的身份/版本/声明许可字段\n- 版本、声明许可和载荷集变化**不需要新的身份授权**，但**仍然需要常规的依赖、锁文件、兼容性、条款和 notices 评审**\n\n被否决的两个替代形状：\n\n| 方案 | 否决理由 |\n|---|---|\n| 把 Claude SDK 条款当作宽松 | **错述上游声明** |\n| 加一个可复用的非宽松允许列表 | **让一个无关的运行时继承它从未被授予的授权** |\n\n### 测试要钉住\"静默遗漏路径\"\n\n> It also pins the parsers against the shapes that would otherwise **drop a package without a word**... **Each of those is a silent-omission path, which is the failure mode a disclosure file cannot afford.**\n\n被钉住的形态包括：`vendor/README.md` 表格不再覆盖某个 vendored 目录、带 extras 的 requirement（`\"httpx[http2]\"`）、完全没有版本的 requirement、作者命名的 `[dependency-groups]` 表、**一个不在任何硬编码列表里的 workspace 成员区域**。\n\n测试还钉住了**促成这条规则的那两种情况**：一个测试支持包的 `dependencies` 条目、一个没有应用挂载的插件包。\n\n### 他们承认的代价\n\n- 依赖编辑现在**把重新生成的文件带进同一个提交**；贡献者在触碰 manifest 的提交上付**大约一秒**，其他提交上不付\n- **禁用钩子提交会把成本推迟到一次指名命令的测试泳道失败**\n- 生成器**需要已安装的树**，比纯源码生成器重；**新包若有不可用的发布元数据，需要一条 `OVERRIDES` 条目，而不是静默渲染空白许可证**——两个失败都**大声且指名补救方法**\n\n---\n\n## 2. worktree 局部的 Lefthook\n\n`2026-07-27-worktree-local-lefthook.md`\n\n### 他们遇到的事\n\n每次 `pnpm install` 跑根的 `postinstall`，它调用 `lefthook install --force`。问题是：\n\n> Linked Git worktrees otherwise **share the common repository's default hooks directory**, so **an install in any worktree can rewrite hooks used by every other worktree**.\n\n**链接的 Git worktree 共享公共仓库的默认 hooks 目录，所以在任何一个 worktree 里安装，都能重写其他每一个 worktree 正在用的 hooks。**\n\n而更具体的失效：Lefthook 生成的 hooks **优先使用\"安装它的那个 worktree\"捕获的绝对二进制路径**，然后才尝试当前 worktree 的回退。所以：\n\n> Shared hooks can therefore **run another worktree's pinned binary until that worktree disappears**, while concurrent installs write the same files.\n\n**共享的 hooks 可能运行另一个 worktree 钉住的二进制，直到那个 worktree 消失**——而并发安装还在写同一个文件。\n\n这是**共享可变状态**的经典事故：两个本该独立的实体，通过一个共享的隐式位置互相破坏。\n\n### 判断\n\n把 hooks 安装变成 **worktree 作用域**。防护清单极其详尽（择要）：\n\n- `CI=true` 或 `GITHUB_ACTIONS=true` 时**在 Git 发现或变更之前就返回**——\"自动化 job 不消费贡献者的 hooks\"\n- 要求 Git 2.26+（`git config --show-scope` 能报告值来自哪个作用域）\n- **升级 format-0 仓库之前，拒绝直接的 common-config `extensions.*`**、拒绝 `core.worktree` 或 `core.bare=true`、拒绝**启用扩展后会激活的非空休眠配置**\n- **这些检查禁用 include 展开**——\"因为 Git 的仓库格式解析器也忽略被包含的目标\"（**模拟对方的行为，包括它的盲区**）\n- 仓库作用域的锁串行化迁移与写入，**释放时必须核对进程 ID、随机令牌、文件身份和确切内容**\n- **死锁或无效锁需要人工恢复，而不是自动破锁**\n- 每个 hook 目录带 JSON 所有权标记，**只允许替换那个确切过时的自有值**\n- **`$GIT_COMMON_DIR/hooks` 里的现有文件永不被移除或重写**\n- Lefthook 在改完 `core.hooksPath` 后失败时**恢复先前的值**；**回滚失败与安装失败一起报告**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持共享 hooks，依赖\"当前 worktree 回退\" | **捕获的绝对路径在它的 worktree 存在期间胜出，所以回退不提供版本或生命周期隔离** |\n| 让每个 worktree 指向一个签入的 `.githooks` | **改变共享的 `core.hooksPath` 会禁用那些分支不含该目录的旧 worktree 的 hooks，而且仍然把每个 worktree 耦合到一个共享配置值** |\n| **构建一个通用的 hook 管理器链式层** | 顺序、参数转发、失败语义和升级**变成与 Lefthook 隔离无关的仓库自有行为** |\n| 白名单 provider 专属的 CI 凭证 include 路径 | **会把安装器安全耦合到 provider 的 checkout 内部**，并削弱对贡献者安装的严格校验 |\n| 停止自动安装 hooks | 避免了共享写入，**但会让仓库廉价的提交/推送检查意外变成可选的——尤其是在短命的 agent worktree 里** |\n\n第 3 条是\"拒绝造通用层\"的范例：**一个只为解决 X 的改动，不该顺手引进一套属于别的问题的仓库自有行为。**（与第 05 批\"不随一次简化捎带进来\"同源。）\n\n第 5 条点出一个隐蔽后果：**让检查变成\"可选\"不是中立的**，它在短命的 worktree 里尤其致命——而 agent 恰好大量使用短命 worktree。\n\n### 他们承认的代价\n\n- 仓库在第一次安装后**变成 Git format-1 仓库**\n- **自定义 worktree hook 管理器需要一个显式的集成选择**\n- **旧式公共 hooks 保留在磁盘上供未升级的 worktree 使用：它们可能变陈旧，但自动移除它们会破坏一个尚未采用此安装器的已注册 worktree**\n\n最后一条是\"**迁移期间必须容忍双重存在**\"——而且**容忍的方向明确偏保守**（宁可留陈旧的，不可破坏在用的）。\n\n---\n\n## 3. 把 Node LTS 下限提到 22.19\n\n`2026-07-06-node-engine-floor.md`\n\n### 他们遇到的事\n\n根 `engines.node` 的 Node 22 分支**不只是 harness 源码直接调用的运行时 API 的契约**：\n\n> it is a contract **for the installed workspace**, not only for the runtime APIs the harness source calls directly\n\n它必须**不低于**在该分支上安装的依赖的 `engines.node` 声明。否则：\n\n- **`pnpm install --engine-strict` 会在一个被广告的 LTS 版本上失败**\n- 非严格安装会**运行在一个依赖支持的运行时之外**\n\n### 判断与推理链\n\n源码特性给出的边界：`node:sqlite` 丢实验标志在 **22.13**，原生 TypeScript 类型剥离成为默认在 **22.18**。\n\n**但这些源码特性在 22.18 就通过了，真正抬高下限的是已安装的依赖**：`@earendil-works/pi-ai@0.79.3` 声明 `engines.node >=22.19.0`。所以 LTS 下限是 **22.19**。\n\n然后是不相交范围的论证：**完全排除 Node 23**——23.0–23.5 仍至少有一个被标记的源码特性，**而 23 线是非 LTS/EOL，所以广告 `>=23.6` 会增加一条死的发布线和一条没有部署应该使用的 CI 腿**。\n\n### `@types/node` 的 pin 逻辑（这段很实用）\n\n保持钉在 22.x 线，理由是**失败要发生在编译期而不是运行期**：\n\n> Pinning `@types/node` to the 22.x line turns that into a **compile error everywhere**.\n\n对照被否决的方案：\n\n| 方案 | 否决理由 |\n|---|---|\n| 让 `@types/node` 领先于下限（`^25`） | **类型领先于运行时下限，会让一个 Node 24/25-only 的 API 编译干净，只在 22.x 上运行时失败。** 钉到 22.x 把它变成每处都编译错误 |\n\n以及矩阵与范围的两条：\n\n| 方案 | 否决理由 |\n|---|---|\n| 矩阵写 `[22, 24, 26]` 而不是钉 `22.19` | **浮动的 major 条目会随时间长上去，并静默停止演练声明的 LTS 下限** |\n| 开放式 `>=22.19` | 广告了对 23.0–23.5 的支持——**那里至少有一个特性仍被标记** |\n| `>=22.13` 加版本条件测试标志 | **为一个狭窄范围增加一个版本条件标志，并把一个实验性标志依赖打扮成一等支持** |\n\n### 他们承认的代价\n\n> A future dependency or source API that raises the runtime floor must move `engines.node`, the compatibility matrix, and **this Agent Note** in the same change.\n\n**一个未来的依赖或源码 API 若抬高运行时下限，必须在同一次变更里移动 `engines.node`、兼容矩阵和这篇 Agent Note。** 文档被列为**必须在同一变更里更新的三样东西之一**。\n\n---\n\n## 对索引里跨批模式的补充：模式 B 的边界终于清楚了\n\n前几批我记录了三处\"拒绝第二份真相\"：**生成的 Agent Note 索引**、**`vendor/published.json` 账本**、**Knip 的例外清单**。而这一批，他们**接受**了一个生成文件（`THIRD_PARTY_NOTICES.md`），它同样是\"从别处派生出来的第二份拷贝\"。\n\n同一类东西，为什么结论相反？原文给了答案：\n\n**① 它是业务必需的，不是便利。** 开源合规**要求**这份披露存在——你不能\"消除\"它，只能选择\"手写\"还是\"生成\"。而索引只是发现路径的一种便利，账本只是状态的一种记录。\n\n**② 自动化的位置不同。** 他们不是事后检查它是否新鲜，而是**在源头变化的同一时刻重生成**：\n\n> Freshness is **maintained**, not merely enforced.\n\n**③ 校验搭了已有的车。** 断言放进测试泳道本来就在跑的 spec，**零额外 CI 成本**。\n\n由此我修正模式 B 的表述：\n\n> **模式 B（修正）：能消除的第二份真相就消除；必须存在的第二份真相，就在源头变化的同一时刻自动重生成它，并让校验搭已有的车——绝不让\"同步\"成为某个人某天要记得做的事。**\n\n判据的三问：**它是必需的吗？源变化时能自动重生成吗？校验能搭现成的车吗？** 三个都否，就该考虑消除它。\n\n这条也解释了那个被否决的 doc-sync 门方案为什么输：**它唯一的失败模式是把同步成本推给一个人**（\"在无关提交之后几分钟告诉他去重跑生成器\"）。\n\n---\n\n## 这批的共同判断标准\n\n**① 新鲜度要被\"维护\"，不只是被\"强制\"。**\n在源头变化时重生成，而不是在事后告诉人去重跑。**让同步成为机制的一部分，而不是某个人的待办事项。**\n\n**② 校验要搭已有的车。**\n断言放进测试泳道本来就在跑的 spec——**零新门进程、零新调度槽位、零新 CI 步骤**。（第 01 批说过\"门禁本身是要维护的代码\"，这是对那条代价的直接回应。）\n\n**③ 分层跟随真实分发，不跟随 manifest 区段。**\n\"机械上简单，在真实数据上两个方向都错。\"**读 manifest 的字段名很容易，判断它是否真的随产物到达用户很难——但只有后者是对的。**\n\n**④ 判断错误方向，并往安全的那一侧倾斜。**\n\"对一份法律声明来说，披露不足才是代价高昂的方向。\"**每一个规则都要问：如果我错了，会往哪边错？**\n\n**⑤ 测试要钉住\"静默遗漏路径\"。**\n那些\"否则会一声不响丢掉一个包\"的输入形态，才是披露类产物承受不起的失败模式。**测的不是\"它能工作\"，而是\"它不会安静地不工作\"。**\n\n**⑥ 隔离共享可变状态。**\n一个 worktree 的安装不该改另一个 worktree 的行为。**隐式共享的位置（默认 hooks 目录）是这类事故的标准温床。**\n\n**⑦ 拒绝把手头问题变成一个通用层。**\n\"构建通用 hook 管理器\"被否决，因为**顺序、参数转发、失败语义、升级会变成与目标无关的仓库自有行为**。\n\n**⑧ 让检查\"意外可选\"不是中立行为。**\n\"停止自动安装 hooks 会让廉价的提交/推送检查意外变成可选的，**尤其是在短命的 agent worktree 里**。\"\n\n**⑨ pin 比范围好，类型不能领先于运行时下限。**\n浮动的 major 条目**会随时间长上去，并静默停止演练声明的下限**；类型跑在运行时前面，会把运行时故障伪装成编译通过。\n\n**⑩ 文档和代码在同一次变更里移动。**\n\"必须移动 `engines.node`、兼容矩阵和这篇 Agent Note\"——**文档是必须同步移动的三样东西之一，不是事后补的。**\n\n---\n\n## 下一步\n\n**进度 29/47（62%）**。下一批候选：`project-local-issue-planning-fields`、`serial-cross-platform-ci-reference`、`automatic-translation-pairing-merges`、`browser-third-party-build-inputs`、`package-model-experience-contract`。\n"},{"file":"2026-09-10-DSH过程决策精读-10-把纠缠的事实拆开.md","date":"2026-09-10","slug":"DSH过程决策精读-10-把纠缠的事实拆开","title":"DSH 过程决策精读 · 第 10 批：把纠缠的事实拆开","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["dsh-translation-pairing"],"summary":"2026-08-08-automatic-translation-pairing-merges.md","bytes":19259,"lines":271,"body":"# DSH 过程决策精读 · 第 10 批：把纠缠的事实拆开\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。共同点是**区分**：同一个 package.json 区段，对\"要不要下载\"和\"要不要披露\"是两个问题；\n> 同一个 `always()`，对\"失败聚合\"和\"资源清理\"有不同义务。\n> 这批还给出了模式 A（诚实的空白）的最强形态。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [自动合成翻译配对记录](#1-自动合成翻译配对记录) | **我算不出来，但我不假装算出来了** |\n| 2 | [浏览器第三方库作为构建输入](#2-浏览器第三方库作为构建输入) | 分发代码 ≠ 让安装器下载同名包 |\n| 3 | [取消被取代的 CI 验证](#3-取消被取代的-ci-验证) | 三种义务，三种条件 |\n\n---\n\n## 1. 自动合成翻译配对记录\n\n`2026-08-08-automatic-translation-pairing-merges.md`\n\n### 他们遇到的事\n\n第 01 批读过的那套双语配对记录，在合并时暴露了一个结构性问题：\n\n> Two branches that independently update different parts of the same confirmed pair therefore **conflict on both hash lines even when Git cleanly composes both Markdown owners**.\n\n两个分支独立更新同一个已确认配对的不同部分——**即使 Git 干净地合并了两侧的 Markdown，也会在两行哈希上冲突**。而选择任何一侧都会留下陈旧的哈希，**手工重新生成记录则是在重复一个确定性操作**，并**阻止了一次本来可以是自动的合并**。\n\n### 判断：让合并驱动重新推导，而不是选择一侧\n\n用一个仓库自有的 `dsh-translation-pairing` **合并驱动**：\n\n- 解析 ancestor/current/other 记录，加载它们哈希命名的**六个 owner blob**\n- **独立地为英文和中文三件套运行 Git 的默认三方文本合并**，要求两个都干净\n- 验证语言切换器与配对结构签名，把两个合并后的 blob 的**哈希写成规范记录**\n- **它合成的是双方父提交中已经存在的确认；它从不记录一次普通的单边文档编辑**\n\n最后一句是这套机制的安全边界：**它能自动合成的，只有\"两边都已经确认过\"这一种情况。**\n\n### 本批最值得记的一处设计：\"算不出来时不假装算出来了\"\n\nGit 的驱动通过一个**签入的 shell 启动器**调用（启动器本身不需要 Node），而启动器在每次执行前会**探测运行时和入口点**。探测失败时：\n\n> When the runtime or entrypoint is unavailable, the launcher **materializes Git's ordinary three-way text result in the sidecar but returns a conflict even when that text merge is clean**, so Git retains the unmerged index stages and **never accepts unverified metadata**.\n\n**它把 Git 的普通三方文本结果物化到 sidecar 里，但即使那个文本合并是干净的，也返回冲突。**\n\n**它明明能算出一个结果，却拒绝让这个结果被当作有效。** 因为那个文本结果**没有经过驱动的那套校验**（六个 blob 的哈希、语言切换器、结构签名）。**用未经校验的结果冒充校验过的结果，比明确失败更危险**——这是模式 A（诚实的空白）到目前为止最强的一个形态：不是\"我不知道所以留白\"，而是\"**我能给出一个看起来对的答案，但我知道它没被验证过**\"。\n\n### 一张失败契约表\n\n他们为正常 `git merge` 期间的每种失败写明了**可观察状态**与**恢复方式**：\n\n| 失败 | 可观察状态 | 恢复 |\n|---|---|---|\n| 全新安装无法探测驱动或装 Lefthook | 不发布新配置；任何新加入的集成**被回滚到先前的 hook 查找** | 恢复依赖并重跑安装器 |\n| 安装后 Node/tsx/入口点变得不可用 | 合并在 sidecar 处于 `UU` 时停止，索引阶段 1/2/3 保留，`MERGE_HEAD` 存在，不创建提交 | 恢复依赖并跑解析器，或 `git merge --abort` |\n| 驱动拒绝记录 | 合并停止，驱动打印 owner 修复与显式解析器路径 | 修复后跑打印出的流程或中止 |\n| 驱动进程以高于 128 的状态崩溃 | **Git 中止合并策略，不发布 `MERGE_HEAD` 或未合并索引阶段** | 修复运行时并重跑合并 |\n| `pre-merge-commit` 拒绝一次本来干净的合并 | 无未合并条目残留，完整结果带 `MERGE_HEAD` 被暂存，不创建合并提交 | 修复 hook 并 `git commit`，或中止 |\n\n**\"可观察状态\"这一列很有价值**：它把\"出问题时你会看到什么\"变成契约的一部分——**恢复的第一步是识别，所以识别条件必须写下来。**\n\n### 两处\"防止误认为完成\"的设计\n\n**① 部分成功必须非零退出。**\n\n`resolve-translation-pairing-conflicts` 在合并停止后应用同样算法：\n\n> It writes and stages every safe record as one batch even when another pair still needs manual work, then reports the remaining pairing conflicts and **exits unsuccessfully so callers cannot mistake a partial resolution for a completed merge**.\n\n**它把每个安全的记录作为一批写入，即使另一对仍需手工处理**——然后**非零退出**，因为\"调用者不能把一次部分解析误认为完成的合并\"。\n\n**② hook 只验证，不重新生成。**\n\n> They validate driver output but **do not regenerate records**, so **bypassing a hook cannot silently bless translation drift**; the corpus-wide `doc-sync` check remains authoritative in CI.\n\n**它们验证驱动输出，但不重新生成记录**——于是**绕过 hook 不能静默地祝福翻译漂移**。\n\n如果 hook 顺手重新生成，那\"绕过 hook\"就变成了\"用陈旧记录蒙混过关\"的通道。**验证与生成分开，让绕过失效。**\n\n### 凭什么这么判断（4 个被否决方案）\n\n| 方案 | 否决理由 |\n|---|---|\n| 取 ours 或用 Git 的 union 驱动 | 任何一侧的父记录命名的都是**合并前**的内容，而 union 会产生重复或无序的哈希键。**两者都不代表合并后的 owner** |\n| 在 `post-merge` 或只在 commit hook 里重新生成 | **`post-merge` 在冲突合并后不运行**，无法影响其结果；**commit hook 只在索引已无未解决条目之后才到达**——单独一个 hook 清不掉那个生成的冲突 |\n| **把每次合并都包进一个仓库命令** | 包装器能解析，且显式解析器保留了那条恢复路径，**但裸 Git、stack 工具、rebase 和 cherry-pick 仍然会在它之前停下来** |\n| 在 GitHub 上通过 Actions 或 app 解析 | 托管自动化可以更新 PR 分支，**但它增加凭据、并发控制和分支变更**；本地与 agent 驱动的 merge-forward 工作流**已经有 checkout 和 push 权限**，仓库**让远程自动化远离这个机制** |\n\n第 3 条是一个关于**介入层次**的判断：包装某一个命令，只能覆盖\"用那个命令\"的路径；而**合并驱动是所有那些操作共享的文件级扩展点**。**选介入点时，要选在\"所有相关路径都必经\"的地方，而不是\"你恰好会用的那条路\"上。**\n\n### 他们承认的代价\n\n- **GitHub 托管的可合并性计算不运行 worktree-local 的可执行文件**，所以贡献者或 agent **仍然必须合并 base 并推送结果提交**，远程冲突徽章才会清除\n- 自动合成**依赖已安装的 Node 依赖**；**运行时丢失会产生一个可见的未解决文本结果，而不是选中陈旧的元数据**（\"失败要可见\"）\n\n---\n\n## 2. 浏览器第三方库作为构建输入\n\n`2026-09-08-browser-third-party-build-inputs.md`\n\n### 他们遇到的事\n\n预构建的浏览器插件**把第三方实现内联在 JavaScript 里**，但生产 npm 依赖**仍然让安装器单独下载那些库并解析它们的 peer**。后果具体到版本：\n\n> When React is declared only for development, **installers can select a different React version for those extra dependencies than the browser artifact uses**.\n\n而且明确排除了\"这是版本问题\"的可能：**相关两个包都支持当前的 React 18，这个问题不需要 React 升级。** 它是**分类**问题。\n\n### 判断：两个事实要分开\n\n决定本身简单——**纯浏览器的第三方依赖属于 `devDependencies`**。但支撑它的判断是本批最锋利的一处：\n\n> **License classification follows distributed content.** ... resolved third-party implementations **remain runtime disclosures even when manifests declare them for development**.\n\n**许可证分类跟随\"分发的内容\"**——通过真实浏览器构建配置解析出的第三方实现，**仍然是运行时披露，即使 manifest 把它们声明为开发依赖**。\n\n而反方向同样成立：**测试工具、被擦除的类型导入、构建工具，不会仅仅因为出现在 `devDependencies` 里就变成分发的代码。**\n\n被否决的那个方案把这件事说得最清楚：\n\n> **Distributing browser code and having an installer download a same-named package are different facts**; that distinction cannot remove license checks on distributed code.\n\n**\"分发浏览器代码\"与\"让安装器下载一个同名包\"，是两个不同的事实。** 同一个 manifest 区段，回答**\"要不要下载\"**和**\"要不要披露\"**是两个不同的问题——**用同一个字段名去回答两个问题，必然在某一头出错。**\n\n### 另外三条判断\n\n- 分类器**从源码导入和 JSX 收集构建输入**；**Host 运行时可达的第三方库优先作为 `dependencies`**；**类型 only 的源码引用不产生 Host 运行时依赖**\n- **npm 区段不选择浏览器打包行为**：动态插件内联私有库并从平台表获取 React；静态浏览器库保留裸导入和样式给最终的 Vite 构建\n- **许可证解析同样不得依赖现有的 `lib/` 文件或写构建输出**（分类保持基于源码）\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 声明另一个生产 React，或覆盖 peer 解析 | **保留了一个浏览器并不使用的额外安装图，而没有让那个安装的副本成为浏览器的共享实例** |\n| 提前内联每个静态库依赖 | **改变了 Vite 的第三方 chunk、缓存与 CSS 处理**；而分类并不需要那些构建改动 |\n| 移动每个含 Client 包的第三方依赖 | 双面包**仍然加载 Host 库**（ZIP 用的 `fflate`、RPC 校验用的 `zod`）；**那些安装关系必须保留** |\n| 直接按 manifest 区段分类许可证披露 | 见上——两个不同的事实 |\n\n第 2 条值得单记：**分类问题不要顺手改构建**。**改变打包行为是另一个问题，把它混进来会让这次改动既难评审又难回滚。**\n\n### 他们承认的代价\n\n> Developers independently consuming static packages or public types **supply the corresponding build dependencies themselves**; this decision **adds no standalone browser-library support promise**.\n\n**独立消费静态包或公共类型的开发者需要自行提供构建依赖**——而且明说**这个决定不增加任何独立的浏览器库支持承诺**。**受益者之外还有受损者，写清楚。**\n\n---\n\n## 3. 取消被取代的 CI 验证\n\n`2026-09-09-cancel-superseded-ci.md`\n\n### 他们遇到的事\n\n> Validation of an obsolete PR revision or master commit **consumes runner capacity without establishing the newest revision's status**.\n\n对一个**过时**的修订做验证，**消耗容量却不确立最新修订的状态**。而附带的一句指出隐性成本：**无条件的聚合裁决和覆盖率历史上传，还会让被取消的运行继续做簿记。**\n\n### 判断：三种义务，三种条件\n\n这篇的核心是**把 `always()` / `!cancelled()` 按义务拆开**：\n\n| 用途 | 条件 | 理由 |\n|---|---|---|\n| PR 聚合裁决 | `!cancelled() && github.event_name == 'pull_request'` | **显式的 status 函数在依赖失败/跳过之后仍保留求值**，而不是接受 GitHub 默认的 success-only 条件 |\n| 覆盖率时长历史 | `!cancelled()` | **失败的覆盖率仍能保存有用的测量；被取消的覆盖率不上传它们** |\n| Wine 资源清理 | `always()` | **仍然是必要的资源清理，而不是可选簿记** |\n\n被否决的那个\"大简化\"把区别点明了：\n\n> **Replace every `always()` condition.** ... **Failure aggregation and resource cleanup have different obligations.** A success-only aggregate **can hide failed dependencies behind a skipped required check**; removing unconditional Wine cleanup **can leave resources running**. **Only cancelled-run bookkeeping is suppressed.**\n\n**失败聚合、资源清理、被取消运行的簿记是三种不同的义务。** 一个 success-only 的聚合**能把失败的依赖藏在一个被跳过的必需检查后面**——这是**最危险的那一类简化：它让失败看起来像通过**。\n\n### 一条原则性的豁免\n\n发布自有的构建被排除在取消之外，理由只有一句：\n\n> Release-owned builds are exempt because **they belong to an intentional publication transaction**.\n\n**它们属于一次有意的发布事务。** 判据由此清楚：**过时的验证可以取消，因为它的价值随新版本出现而贬值；而一次有意的发布事务不会因为\"有更新的提交\"而失效。**\n\n### 一次\"明确接受代价\"的政策反转\n\n这篇**逆转**了更早的故障切换运行手册里的取消豁免。难能可贵的是它**完整记录了旧政策的理由**，而不是一句\"过时了\"：\n\n- 旧豁免（`github.event_name != 'push'`）**偏爱周期性的就绪证据**：每个 standby 用一个门 worker 执行完整的未分片聚合，**可能比 master 合并之间的间隔还长**\n- **即使那个政策也不保证每次演练都完成**\n- GitHub **每个组只保留一个待处理运行，替换中间的待处理推送**；而取消是在新触发的运行上求值的，所以一个共享 master 组的手动基准**仍然可能取消一次演练**\n- 那次罕见的中断**被接受，预期后续推送会提供证据**\n- 旧政策的成本**被 master-only 运行时检查、Wine 和两次演练所界定**\n\n然后是结论，写得毫不含糊：\n\n> This policy is rejected in favor of **freeing capacity for current validation, explicitly accepting standby starvation**.\n\n**这个政策被否决，以换取为当前验证腾出容量，明确接受 standby 饥饿。**\n\n**\"explicitly accepting\"** —— 他们知道新政策会让 standby 演练饿死，并把它写出来，而不是假装没有代价。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保留正在运行的 master-push 演练 | 见上（旧政策的完整成本被摊开后否决） |\n| **用 job 级 concurrency 保护一次演练，或只取消 PR 事件** | **job 级组不能把一个 job 从整个 workflow 的取消中豁免**；只取消 PR 也会豁免手动 dispatch——**一次重复的 runner 基准可以占用十二个 larger runner 长达十五分钟，而不是替换一次过时的测量** |\n| 保留每次合并后、夜间和 pack 运行 | 历史完成度提供更多证据，**但过时的验证会与最新的运行竞争**；而且这些验证**不发布包**，所以保留每一次运行**与保护一次有意的发布事务不是同一个要求** |\n| 替换每个 `always()` | 见上——三种义务不同 |\n\n### 他们承认的代价（含一句关于\"承诺\"的澄清）\n\n- **快速的 master 更新可以重复取消更长的 standby 演练，在它们产生裁决之前**。运维必须使用最新的**已完成**裁决，**检查它的年龄和提交**才能依赖它；**一个已调度、运行中、或被取消的演练不是就绪证据**\n- 政策**不保证**每个中间提交、夜间触发或基准完成\n- 最后一条尤其精确：\n\n> Cancellation is a **request** handled by GitHub Actions and its runners, **not a guarantee of immediate termination or bounded queue delay**. ... The policy **makes obsolete validation cancellable; it does not promise a fixed runtime or cancellation latency**.\n\n**\"让过时的验证可被取消\"不等于\"取消会及时发生\"。** 他们把能力的边界说清楚，**不把\"可取消\"包装成\"能省多少时间\"**。\n\n---\n\n## 对索引里跨批模式的印证\n\n**模式 A（诚实的空白）——第 7 次，且是最强形态。**\n\n启动器那处设计：**它能算出一个干净的文本合并结果，却仍然返回冲突**，因为那个结果没经过驱动的校验。这比前几次的\"标注缺失\"或\"公开不利数据\"更进一步：**它主动放弃一个看似可用的答案，只因为它没被验证过。**\n\n**模式 C（别把不同的事混成一种状态）——强印证。**\n\n三种 `always()` 义务的拆分、以及\"分发代码 vs 下载同名包\"的拆分，都属于这条。而且这次出现了它的**危险形态**：**success-only 的聚合能把失败的依赖藏在一个被跳过的必需检查后面**——**混淆两种状态时，错误的方向是\"把失败显示成通过\"。**\n\n---\n\n## 这批的共同判断标准\n\n**① 同一个字段名不该回答两个问题。**\n`devDependencies` 回答\"安装器要不要下载\"，但**不能**回答\"要不要披露\"；`always()` 回答\"要不要无条件执行\"，但**不能**区分\"失败聚合\"和\"资源清理\"。**当一个字段名开始承担第二个问题时，错误就藏在两者的差集里。**\n\n**② 算不出来时，不要给出一个看起来对的答案。**\n启动器明明能产出干净的文本合并，却返回冲突——因为**未经校验的结果冒充校验过的结果，比明确失败更危险**。这是模式 A 的判据，也是这条标准最纯的表述。\n\n**③ 选介入点，要选在所有路径都必经的地方。**\n包装一个命令只能覆盖\"使用那个命令\"的场景；**合并驱动是裸 Git、stack 工具、rebase、cherry-pick 共享的文件级扩展点**。\n\n**④ 部分成功必须非零退出。**\n\"调用者不能把一次部分解析误认为完成的合并。\"**能做完多少就做多少，但汇报时必须说\"没做完\"。**\n\n**⑤ 失败契约要含\"可观察状态\"。**\n那张表有三列：失败、**可观察状态**、恢复。**恢复的第一步是识别，所以识别条件属于契约。**\n\n**⑥ 验证与生成要分开。**\nhook 只验证不重新生成，所以**绕过 hook 不能静默祝福漂移**。**如果验证会顺手修正，绕过它就成了作弊通道。**\n\n**⑦ 政策反转时要记录被否决政策的完整理由。**\n他们写下了旧豁免当初要保护什么、它的成本被什么界定、以及**\"明确接受 standby 饥饿\"**。**记录代价，而不要假装新政策没有代价。**\n\n**⑧ 说清能力的边界，不把\"可取消\"包装成\"会变快\"。**\n\"取消是一个请求，不是立即终止的保证\"\"它让过时验证可被取消，不承诺固定的运行时长或取消延迟。\"\n\n---\n\n## 下一步\n\n**进度 32/47（68%）**。剩下 15 篇以 CI 基础设施为主。下一批打算读 `package-model-experience-contract`、`serial-cross-platform-ci-reference`、`project-local-issue-planning-fields`，以及两篇 CI 策略类（`master-only-platform-ci`、`release-rehearsal-selfhosted`）——后两篇与刚读的取消政策直接相关，应该能形成印证。\n"},{"file":"2026-09-10-DSH过程决策精读-11-契约写在哪保证什么.md","date":"2026-09-10","slug":"DSH过程决策精读-11-契约写在哪保证什么","title":"DSH 过程决策精读 · 第 11 批：契约写在哪、保证什么","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"2026-07-12-package-model-experience-contract.md","bytes":14511,"lines":232,"body":"# DSH 过程决策精读 · 第 11 批：契约写在哪、保证什么\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。共同点是**契约的选址与强度**：把契约写在实现本地还是中央？\n> 数值不可得时记录什么？以及——**这个验证手段究竟保证了什么、没保证什么。**\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [Model Experience 契约](#1-package-model-experience-契约) | 稳定的契约是\"增长形态\"，不是数字 |\n| 2 | [Project 本地的 Issue 规划字段](#2-project-本地的-issue-规划字段) | 一条政策不该依赖两套独立管理的权限 |\n| 3 | [仅 master 的平台 CI](#3-仅-master-的平台-ci) | 明确接受\"合并后才发现\" |\n\n---\n\n## 1. Package Model Experience 契约\n\n`2026-07-12-package-model-experience-contract.md`\n\n### 他们遇到的事\n\n一个包 README 可以解释 API 和运行时机制，**却不回答主导 agent harness 行为与成本的那些问题**：\n\n> what from this package reaches a model request, under which conditions, how long those tokens remain, and whether later requests preserve a reusable KV-cache prefix\n\n**这个包的什么内容会到达模型请求、在什么条件下、那些 token 停留多久、后续请求是否保留可复用的 KV-cache 前缀。**\n\n而麻烦在于**这个遗漏在插件架构里尤其难审计**：\n\n> A consumer may turn a backend result into a tool message, a policy plugin may replace success with an error, compaction may remove old history, and an agent-scoped registration may change one agent's prompt or schemas while leaving every other agent unchanged.\n\n消费者可能把后端结果变成工具消息；策略插件可能把成功替换成错误；压缩可能移除旧历史；**而一个 agent 作用域的注册可能改变某个 agent 的 prompt 或 schema，同时让其他所有 agent 保持不变**。\n\n于是两边都走不通：**只读那些\"名义上面向模型\"的包会错过真实的上下文效应；而跨每个依赖读源码，对常规评审来说太贵。**\n\n### 判断：契约写在包 README（实现本地）\n\n- 每个有面向模型或模型相邻契约的包 **README 以规范的 Model Experience 段结尾**\n- 有直接/条件/有上限/生命周期/多面/辅助模型效应的包，**每个上下文面用一个 H3**；每个面含三个有序 H4：`What the model sees`、`Token effect`、`KV Cache effect`，**每个字段以一段散文开始**\n- 无效应或完全由别包渲染的路径，用**审计过的短形式**：一句以 `None, as ` 或 `Indirectly, through ` 开头的句子 + 一个 `KV Cache effect` H4\n\n### 三处\"区分两个事实\"的精确措辞\n\n**① \"不失效\"不等于\"保证命中\"。**\n\n> \"Does not invalidate\" means **the package preserves an already-reusable prefix**, not that **a provider promises a cache hit or retention period**.\n\n**\"Does not invalidate\" 的意思是\"这个包保留了一个已经可复用的前缀\"，而不是\"provider 保证缓存命中或保留期\"。** 一句话划清了自己能承诺的与上游才能承诺的。\n\n**② 稳定契约是\"形态\"，不是\"数值\"。**\n\n被否决的方案是\"要求数字化的 token 计数\"，理由是：\n\n> exact counts depend on the selected model tokenizer, adapter serialization, configuration, and runtime data. **The stable contract is the growth shape**: fixed per request, conditional per call, retained, replaced, capped, or zero-direct.\n\n**精确计数取决于 tokenizer、适配器序列化、配置和运行时数据——它不可稳定。** 于是契约退到**可稳定判定的那一层**：增长形态（每次请求固定／每次调用条件性／保留／替换／有上限／零直接效应）。\n\n**③ 缺席必须有解释。**\n\n> unconstrained absence is **ambiguous between an audited zero and forgotten documentation**\n\n**无约束的缺席，在\"审计过的零\"和\"忘记写文档\"之间是模糊的。** 所以省略**只留给**被校验器点名并附理由的模型无关包——**其余零影响的包也必须写一句明确的话**。\n\n这是\"诚实的空白\"的反面用法：**空白本身可以是诚实的，但前提是它被标注过。** 没有标注的空白，读的人无法区分\"这里确实没有\"和\"这里漏了\"。\n\n### 凭什么这么判断（7 个被否决方案，取最利的）\n\n| 方案 | 否决理由 |\n|---|---|\n| **只记录注册了 prompt 或工具的包** | **后端、策略插件、适配器、持久化、作用域和压缩都会改变 token 的内容或生命周期，却不拥有面向模型的 schema** |\n| **从源码生成一个中央上下文成本目录** | **AST 能找到注册，但无法推断语义条件**——历史保留、输出截断、父子可见性、辅助模型边界。**包 README 是实现本地的契约；一份中央副本会增加另一个漂移点** |\n| 要求数字化的 token 计数 | 见上——精确计数不稳定 |\n| 用一张表 | 精确的源码文本和条件结果形态**让单元格密集、难以扫读** |\n| 允许每个零影响包都省略 | 见上——缺席的歧义 |\n| 零影响/简单间接包也用完整结构化形式 | **那是在一个事实周围重复标签** |\n| 只靠约定、不设门禁 | **一个仓库范围的契约还必须覆盖每一个未来的包；评审记忆无法可靠地察觉一个被省略的 README 段** |\n\n第 2 条是模式 B（第二份真相）的又一次印证，而且给出了新论据：**AST 能提取\"结构\"，但提取不出\"语义条件\"**——所以生成物在这里不可能正确，不只是\"会漂移\"。\n\n### 门禁管到哪为止\n\n校验器检查：三种分类、规范的末段顺序、字段标题深度与顺序、非空字段段落、H5 对逐字块的所有权、**具体字面量证据**、锚定的工具目录链接。\n\n而最后一句划了边界：**\"评审仍然拥有覆盖率、链接相关性和事实准确性。\"** —— **门禁管形式，评审管内容**，谁管什么写在明面上。\n\n---\n\n## 2. Project 本地的 Issue 规划字段\n\n`2026-09-02-project-local-issue-planning-fields.md`\n\n### 他们遇到的事\n\n一段很具体的权限与存储耦合：\n\n> A workflow token with Project write access **can** read and update Project custom fields **while GitHub rejects Issue-field reads**, so using both storage systems makes **one policy depend on two independently administered permission sets**.\n\n一个带 Project 写权限的工作流 token 能读写 Project 自定义字段，**而 GitHub 拒绝 Issue 字段的读取**——于是同时使用两个存储系统，会让**一条政策依赖于两套独立管理的权限集**。\n\n这是\"**一条政策不该被两套权限绑住**\"的判据——**不是因为技术上做不到，而是因为它把一个运维面变成了两个。**\n\n### 判断\n\n- 规划字段（`Priority`、`Severity`、`Cost`、`Start Date`、`Target Date`）**归 `DSH Issue Management` Project 所有**\n- 仓库政策**从配置的 Project 解析**；**它拒绝 Issue 支撑的字段或错误的数据类型**\n- 组织级 Issue 字段**只保留为 `Legacy ...` 迁移来源**，不被仓库工作流读取\n- `Start Date` **只对 `pull_request.opened` 初始化**，且**只在当前 Project 值为空时写入**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持组织级 Issue 字段 | 它们让一个值跨 Project 可见，**但工作流不需要那个作用域，而且 GitHub App 会需要单独的组织级 Issue Fields 访问权** |\n| **双写 Issue 和 Project 字段** | 镜像字段保留了跨 Project 可见性，**但每一个写入者和手工编辑都能制造漂移，并需要一条对账政策** |\n| 处理每个订阅的 PR 事件，或覆盖 Start Date | 更晚的事件可以修复缺失日期，**但它们会在工作开始之后才分配日期，或替换一次手工计划** |\n\n第 3 条里那个取舍值得记：**\"修复缺失值\"的机会同时也是\"覆盖人的决定\"的机会**——所以宁可保留\"仅 opened、仅空值\"的窄行为，**也不要一个能修复更多、但也会破坏更多的东西**。\n\n### 他们承认的代价\n\n- 规划元数据**被限定在一个 Project 成员资格内**（同一个 Issue 在另一个 Project 里可以有不同值）\n- **字段重命名或类型变更会让工作流失败，而不是回退到 legacy 字段**（fail-loud 优于静默降级）\n- **空值读取让普通重试幂等**——但：\n  > Project field updates have **no compare-and-set precondition**, so simultaneous pull requests can both observe an empty Start Date and **the last mutation can win**.\n\n  **Project 字段更新没有 compare-and-set 前置条件，所以同时的 PR 可能都观察到空的 Start Date，最后一次变更胜出。** 竞态被明确写出来，而不是被\"重试幂等\"这句话掩盖过去。\n\n---\n\n## 3. 仅 master 的平台 CI\n\n`2026-09-06-master-only-platform-ci.md`\n\n### 他们遇到的事\n\nmacOS Intel/ARM 与 Linux ARM64 的 Python 运行时构建，加上通过 Wine 的 Windows 构建/站点检查，**在每一个 PR 修订上消耗付费托管容量**。\n\n而关键在于**证据的重叠**：**原生 Linux 和 Windows x64 已经提供必需的 executable 和 installed-wheel 证据，原生 Windows 检查也在合并前覆盖了构建与进程行为**。\n\n### 判断\n\n- PR 上要求 Linux x64 与 Windows x64 的运行时验证；**Linux ARM64 与两个 macOS 目标只在 master 推送时选中**\n- **Python 发布保留全部五个目标**\n- Wine **在托管 Ubuntu 上作为独立的 master job 跑一次**——因为它既提供检查，也提供默认分支的缓存生产，**所以不需要单独的缓存播种 job**\n\n### 明确接受代价\n\n被否决方案的第一条把取舍摊开：\n\n> This policy **explicitly accepts post-merge discovery for these four checks**.\n\n**这个政策明确接受这四项检查的\"合并后才发现\"。**\n\nConsequences 里再次直说：\n\n> A macOS, Linux ARM64, or Wine-specific regression **can merge while required PR checks are green**.\n\n**一个 macOS／Linux ARM64／Wine 特定的回归，可以在必需的 PR 检查全绿时合并。** 代价没有被措辞软化。\n\n而与之配套的边界也很清楚：**master 失败仍然是普通的失败 job，不是 `continue-on-error` 观察**——**代价是\"晚发现\"，不是\"不发现\"。**\n\n### 三处\"不声称自己验证不了的东西\"\n\n**① 本地调度测试不声称平台执行。**\n\n> Real platform execution **remains CI-owned**; local scheduling tests **do not claim native runtime or Wine execution**.\n\n**② 负控证明门禁\"能红\"。**\n\n> Executed negative controls **remove the Intel target, misroute Wine, and restore the stale aggregate dependency; each produces its intended failure**.\n\n移除 Intel 目标、错误路由 Wine、恢复陈旧的聚合依赖——**每一个都产生预期的失败**。这是第 01 批\"能红再改\"纪律的又一次落地。\n\n**③ 被取代的笔记仍然保留独立价值。**\n\n它**部分取代**了四篇更早的笔记，然后说明那些笔记\"仍然为 artifact provenance、平台保真度、串行完整性和信任规则而活跃\"——**部分取代要写明保留了什么**。\n\n---\n\n## 对索引里跨批模式的印证\n\n**模式 A（诚实的空白）——第 8 次，这次是\"把不稳定的部分排除出契约\"。**\n\n\"稳定的契约是增长形态，不是数值\"——**它没有假装能给出一个可靠的数字，而是把契约收缩到能稳定判定的那一层**。同一篇里的\"缺席必须有解释\"是这条模式的反面用法：**空白可以是诚实的，但必须是被标注过的空白**，否则读者无法区分\"这里没有\"和\"这里漏了\"。\n\n**模式 B（拒绝第二份真相）——新论据。**\n\n拒绝\"从源码生成中央上下文目录\"的理由不只\"会漂移\"，还有更根本的一条：**AST 能找到注册，但推断不出语义条件**。**当源信息不足以生成正确的副本时，这个副本不是\"需要维护\"，而是\"不可能正确\"。**\n\n**模式 C（别把不同的事混成一种状态）——\"Does not invalidate\" 的定义。**\n\n**\"不使前缀失效\" ≠ \"保证缓存命中\"**：前者是这个包能承诺的，后者只有 provider 能承诺。**一句话划清了责任边界。**\n\n---\n\n## 这批的共同判断标准\n\n**① 契约要住在实现本地。**\n\"包 README 是实现本地的契约；一份中央副本会增加另一个漂移点。\"**决定某份内容住哪里的，是\"谁在改动它\"，而不是\"谁在阅读它\"。**\n\n**② 数值不可得时，记录形态。**\n精确 token 数依赖 tokenizer、序列化、配置和运行时数据——**它不稳定，所以不进契约**。契约退到\"每次请求固定／条件性／保留／替换／有上限／零直接\"这一层：**能被稳定判定的部分**。\n\n**③ 缺席必须被标注，否则读的人无法解读。**\n\"无约束的缺席，在'审计过的零'和'忘记写文档'之间是模糊的。\"**空白也是一种陈述，它需要被授权。**\n\n**④ 一条政策不该依赖两套独立管理的权限。**\n不是因为做不到，而是因为**那把一个运维面变成了两个**。\n\n**⑤ \"修复缺失值\"的机会，往往也是\"覆盖人的决定\"的机会。**\n所以 Start Date 只在 opened 且为空时写。**能修复更多的东西，常常也能破坏更多——取舍要按最坏方向算。**\n\n**⑥ 明确接受代价，不要软化措辞。**\n\"明确接受这四项检查的合并后才发现\"\"一个回归可以在必需的 PR 检查全绿时合并\"。**同时说清代价的边界：是\"晚发现\"，不是\"不发现\"。**\n\n**⑦ 不声称自己验证不了的东西。**\n本地调度测试**不声称原生运行时或 Wine 执行**。**验证手段的边界要写在它的说明里**，否则会被当成它保证了更多。\n\n**⑧ 门禁管形式，评审管内容——而且要写明谁管什么。**\n\"评审仍然拥有覆盖率、链接相关性和事实准确性。\"\n\n**⑨ 测试要有负控。**\n移除一个目标、错误路由一个 job、恢复一个陈旧依赖——**每一个都必须产生预期失败**，否则你不知道这个测试能不能红。\n\n---\n\n## 下一步\n\n**进度 35/47（74%）**。剩余 12 篇。下一批：`release-rehearsal-selfhosted`、`serial-cross-platform-ci-reference`、`native-windows-pull-request-ci`、`node-compatibility-selfhosted`，之后是纯 runner 配置类（准备快速扫读）。\n"},{"file":"2026-09-10-DSH过程决策精读-12-身份与证据的可靠性.md","date":"2026-09-10","slug":"DSH过程决策精读-12-身份与证据的可靠性","title":"DSH 过程决策精读 · 第 12 批：身份与证据的可靠性","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"2026-09-06-release-rehearsal-selfhosted.md","bytes":14353,"lines":241,"body":"# DSH 过程决策精读 · 第 12 批：身份与证据的可靠性\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。共同问题是：**你怎么知道你面对的是你以为的那个东西？**\n> 身份该由标识符还是显示名决定？证据该来自哪里？什么算\"可以据此下结论\"？\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [自托管上的可信发布演练](#1-自托管上的可信发布演练) | 信任边界要窄，清理要不可绕过 |\n| 2 | [job 内分区覆盖](#2-job-内分区覆盖) | **仅仅\"进展缓慢\"永远不构成提高并发的证据** |\n| 3 | [按文件路径识别审批工作流](#3-按文件路径识别审批工作流) | 显示名不标识工作流文件 |\n\n---\n\n## 1. 自托管上的可信发布演练\n\n`2026-09-06-release-rehearsal-selfhosted.md`\n\n### 他们遇到的事\n\n两句话把取舍摆平：\n\n> Dependency-layout and release-pack rehearsals **consume hosted Linux minutes without requiring npm or API credentials**. Moving arbitrary pull-request code or credentialed publication onto a persistent shared host would **weaken isolation**; reusing a checkout without cleaning would also **weaken the packed-payload proof**.\n\n演练消耗托管的 Linux 分钟数，**却不需要 npm 或 API 凭据**——所以有省钱空间。但两个风险也明确：**把任意 PR 代码或有凭据的发布搬到常驻共享主机上会削弱隔离**；**复用一次没清理的 checkout 会削弱打包载荷的证明**。\n\n### 判断：窄的、显式的信任边界\n\n选择器要求**规范仓库**和**非 Dependabot 的 actor**，然后**只接受 master 推送、或同仓库非 fork 且作者不是 Dependabot 的 PR**。\n\n**手动 dispatch 总是选择 `ubuntu-24.04`**——所有其他被拒绝的上下文也一样。这条对应被否决的方案：\n\n> Allowing manual dispatch on arbitrary refs gives a maintainer action **broader persistent-host access than the explicit event trust rule**.\n\n**手动 dispatch 跑在任意 ref 上，会给一个维护者动作比\"显式的事件信任规则\"更宽泛的常驻主机访问权。**\n\n另有一个刻意的耦合被写明：**发布演练与主 CI 共享同一个 Linux 开关**——\"启用或禁用它**同时路由两种工作负载，而不是独立地路由发布**。\" 他们选择让开关语义简单，代价是两者联动。\n\n### 三条清理与隔离的设计\n\n**① 临时目录要落在\"即使进程被杀也会被清理\"的地方。**\n\n`TMPDIR` 指向 `runner.temp`：\n\n> so temporary npm consumers stay **outside the checkout but inside runner cleanup** even when **a killed process cannot execute `finally`**\n\n**临时 npm 消费者待在 checkout 之外、但在 runner 清理之内——即使一个被杀死的进程无法执行 `finally`。** **按\"finally 不会被执行\"来设计清理位置**，而不是假设它总会被执行。\n\n**② checkout 必须显式清理未跟踪与被忽略的输出。**\n\n它在**不可变安装和既有构建之前**清理。理由在别处点明：\n\n> a warm pnpm store **cannot substitute workspace links or stale build output for a tarball payload**\n\n**一个热的 pnpm store 不能替代 workspace links、也不能替代陈旧的构建输出去充当 tarball 载荷。** ——**打包验证的完整性依赖于\"补丁没有被别的东西悄悄填充\"**。\n\n**③ 打包安装验证器在 checkout 之外建全新消费者**，用 npm 安装 tarball、**移除继承的 Node 解析钩子**、并在 `finally` 里删除。\n\n**移除继承的解析钩子**这一条很关键：**否则验证器可能解到仓库里的源码，而不是 tarball 里的内容**——那就是\"你以为在验证 A，实际在验证 B\"。\n\n### 关于负控与边界的两句话\n\n测试跑负控：**fork、Dependabot、其他仓库、非 master 推送、dispatch、缺失 PR 数据、禁用的开关**。\n\n边界声明：\n\n> Real release-build and packed-install execution **remains the PR CI verification owner**; selector tests **do not claim to reproduce those builds**.\n\n**选择器测试不声称复现那些构建。** 与第 11 批\"本地调度测试不声称原生运行时执行\"是同一条。\n\n### 他们承认的代价\n\n- **这是操作者选择的后备，不是自动的 runner 健康检测，也不是对已排队 job 的故障切换**\n- 共享 VM **仍然会与其他可信 job 争用**\n- **没有 workflow 供应主机包，也不改变全局主机配置**（**\"谁能改主机\"被明确留在 workflow 之外**）\n\n---\n\n## 2. job 内分区覆盖\n\n`2026-08-18-in-job-partitioned-coverage.md`\n\n### 他们遇到的事\n\n**原生 Windows 覆盖是完整 PR 清单里最长的反馈路径。** 具体症状：\n\n- 把插桩套件保持在**一个单 worker 的 Vitest 进程**里，避免了更大进程池下出现的 **worker 丢失和 Node 24 CJS lexer 失败**\n- **但一次失败可能要超过十四分钟才出现**，而且门 runner **在完成前一直扣着子进程输出**\n\n两条硬约束同时压着：\n\n1. **优化必须保留每一个测试和合并后的逐文件 100% 阈值**\n2. **必须留在既有的 coverage job 内**——拆到多个 workflow job 会给必需拓扑**增加 checkout、安装、制品传输和一个 merge job**\n\n### 判断：一个 job 内多个单 worker 进程\n\n- 本地 `test:coverage` **仍然是一次 Vitest 调用**（本地保持简单）\n- CI 固定 `DSH_COVERAGE_PARTITIONS=4`\n- **没有基于经过时间的触发器会在运行进行中改变这个数**\n- 协调器用**最小堆按最长处理时间优先（LPT）**分配文件——\"**这样重量级的子进程绑定套件会分散开，而不是堆在路径哈希把它们扔进去的那个分片里**\"\n- 每个分区收到**临时 Vitest 配置**，include 是它自己的文件列表（**命令行传文件超过了 Windows CreateProcess 限制**）\n- **空分区在任何子进程启动之前就被拒绝**\n- **最重的分区最先启动**，让它的裁决最早落地\n- **分区模式在每个子进程里抑制阈值和覆盖率报告器**，每个进程写一个 blob 报告\n\n而裁决的唯一归属是：\n\n> The coordinator waits for every child, validates that the blob directory contains **exactly** the expected files, and then runs **one** `vitest --merge-reports ... --coverage`. **Only that merged command applies the repository's per-file thresholds, so a partition is never judged against an intentionally partial inventory.**\n\n**只有合并后的那一次命令应用逐文件阈值——所以一个分区永远不会被用一份有意不完整的清单来评判。**\n\n被否决的对照方案说得更直白：\n\n| 方案 | 否决理由 |\n|---|---|\n| **在每个分区里独立应用阈值** | **每个分区有意只看到套件的一部分，会报告假未覆盖文件。阈值所有权属于合并后的报告** |\n\n### 三个\"让证据可用\"的设计\n\n**① 失败也要留下可合并的证据。**\n\n> A normal failed test **still emits a blob through `--coverage.reportOnFailure`**, allowing the merge to report the complete coverage state before the coordinator returns failure.\n\n**一个正常的失败测试仍然发出 blob**，让合并能报告**完整的**覆盖状态，**然后**协调器返回失败。**失败不等于放弃完整性。**\n\n**② 具体失败要与最终诊断放在一起。**\n\n协调器保留每个子进程**一个有界的 64 KiB 合并尾部**；当子进程不成功地结算时，它打印 spawn 错误/退出码/信号，**并在验证完整 blob 集之前重复那个尾部**——\"**把具体的 Vitest 失败与最终的分区诊断放在一起**\"。\n\n**③ 清理要防链接陷阱。**\n\n**协调器只移除它自有的覆盖树，并把一个链接形状的路径 unlink 而不是递归跟随它。**\n\n### 本批最锋利的一句：关于\"什么时候才有资格调参\"\n\n> **Future tuning starts from completed runs at one fixed configuration. Slow progress alone never raises partition count or outer concurrency, because repeated restarts would erase the only evidence needed to choose a stable setting.**\n\n**未来的调优从一个固定配置的已完成运行开始。仅仅\"进展缓慢\"永远不会提高分区数或外层并发——因为反复重启会抹掉\"选择稳定设置\"所需要的唯一证据。**\n\n配套的一句同样干脆：\n\n> These values come from completed runs or fixed capacity bounds; **an unfinished run crossing an arbitrary elapsed-time mark is not evidence for increasing concurrency.**\n\n**一个跨过某个任意经过时间标记的未完成运行，不是增加并发的证据。**\n\n**这两句合起来是一条通用的反模式警告：在没有稳定基线时调参，会破坏调参本身所依赖的证据。**\n\n### 他们承认的代价\n\n- 覆盖**为每个分区付一次 Vitest 启动/配置成本，加上一次报告合并成本**\n- **分区输出可能交错**，但分区起始标签和 Vitest 文件身份保留了归因\n- Windows 用四分区**保留独立进程隔离并与 Linux 对齐，代价是更长的单 job 覆盖墙钟时间**——\"这个取舍被接受，以减少高自托管并发下的 vitest worker 启动失败\"\n- 性能数字带着口径说明：\"**那些值比较的是分区延迟，不是当前的峰值**\"\n\n---\n\n## 3. 按文件路径识别审批工作流\n\n`2026-09-10-approval-review-workflow-identity.md` · 短小精悍\n\n### 他们遇到的事\n\n> GitHub can populate a workflow run's `name` with its **expanded `run-name`**.\n\nGitHub **会用展开后的 `run-name` 去填充 workflow run 的 `name`**。审批评审工作流在那个标题里包含了 PR 号，于是**把 `workflow_run.name` 与静态工作流名比较，会在刷新审批状态之前拒绝掉有效的评审事件**。\n\n### 判断\n\n审批发布器**通过它确切的 `workflow_run.path` 识别评审事件工作流**。此外还要求：一个成功的 `pull_request_review` 运行、**从 `display_title` 解析 PR 号**、校验任何提供的 PR 关联、**并在评估审批之前比较当前 PR head 与被评审的 head**。\n\n最后那条是防止\"用旧的评审结论为新的提交背书\"——**审批必须绑定到它实际评审的那个 head**。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| **接受一个名称前缀** | **一个显示名不标识工作流文件；另一个工作流可以使用同样的标题** |\n| **移除带编号的运行标题** | **该标题在 GitHub 返回空 `pull_requests` 数组时提供 PR 号**；移除它需要一个不同的交接机制 |\n\n第 1 条是身份判定的通则：**显示名是给人看的，它可以被任何同名的东西复用；标识符才是身份。**\n\n### 他们承认的代价\n\n- **运行标题展开不再阻止审批刷新，而一个意外的工作流文件仍然失败校验**（正确方向上的严格）\n- **移动评审事件工作流需要更新发布器的预期路径**——**把路径当身份，就要承担路径变化的维护成本**\n\n---\n\n## 对索引里跨批模式的印证\n\n**模式 D（验证到消费点 / 证据要成立）——本批给出了一条新的强度表述。**\n\n\"未完成运行不是增加并发的证据\"\"反复重启会抹掉唯一的证据\"——**这两句把\"什么算证据\"推进到了\"证据的形成条件\"**：不仅要求\"我看到的是真的\"，还要求\"**我看到的时候，条件没有被我的观察行为破坏**\"。\n\n**模式 C（裁决归属唯一）——再次印证。**\n\n\"阈值所有权属于合并后的报告\"：**分区有意只看到套件的一部分，所以它们不能独立判定。** 这与第 05 批\"评估失败 vs 条件未满足\"、第 10 批\"三种 `always()` 义务\"是同一类：**每个判定都要有唯一且明确的归属。**\n\n**模式 A——新形态：\"不声称验证不了的东西\"已成本批的固定收尾。**\n\n第 11 批的\"本地调度测试不声称原生运行时执行\"、本批的\"选择器测试不声称复现那些构建\"——**每篇都在末尾划定自己验证能力的边界。**\n\n---\n\n## 这批的共同判断标准\n\n**① 身份用标识符，不用显示名。**\n\"一个显示名不标识工作流文件；另一个工作流可以使用同样的标题。\" **显示名是给人看的，可被复用；路径/ID 才是身份。**\n\n**② 信任边界要窄，而且要显式到可枚举。**\n\"规范仓库 + 非 Dependabot actor + 只接受 master 推送或同仓库非 fork PR\"——**边界由具体条件组成，不由\"我们信任自己人\"这种态度组成**。手动 dispatch 被排除在自托管之外，因为它绕过了事件信任规则。\n\n**③ 清理要按\"finally 不会被执行\"来设计。**\n`TMPDIR` 指向 `runner.temp`，为的是**即使进程被杀、`finally` 没跑，临时物仍在清理范围内**。\n\n**④ 验证必须确保它在验证你以为的那个东西。**\n\"移除继承的 Node 解析钩子\"、\"checkout 显式清理未跟踪与被忽略的输出\"、\"一个热的 pnpm store 不能替代 tarball 载荷\"——**三处都在防\"验证器解到了别的东西\"**。\n\n**⑤ 只有稳定配置下的已完成运行，才构成调参的证据。**\n\"仅仅进展缓慢永远不会提高并发，因为反复重启会抹掉唯一的证据。\" **在基线不稳时调参，会破坏调参所依赖的证据本身。**\n\n**⑥ 判定的归属必须唯一。**\n\"阈值所有权属于合并后的报告\"——**一个有意不完整的部分，不能对自己作整体判定**。\n\n**⑦ 失败时也要留下完整证据。**\n失败测试**仍然发出 blob**，让合并报告完整状态之后才返回失败。**\"失败\"和\"证据残缺\"是两件事，不要用一个掩盖另一个。**\n\n**⑧ 优化不该改变拓扑。**\n\"必须留在既有 job 内\"——拆 job 会带来 checkout、安装、制品传输和 merge job。**在既有结构内解决问题，优先于为问题改变结构。**\n\n---\n\n## 下一步\n\n**进度 38/47（81%）**。剩余 9 篇：`serial-cross-platform-ci-reference`、`native-windows-pull-request-ci`、`ci-node-compile-cache-data-disk`、`node-compatibility-selfhosted`、`playwright-video-gif`，加 4 篇纯 runner 配置（`preview-hosted-runner-sizing`、`python-runtime-windows-hosted`、`blacksmith-failover-leg`、`parallel-macos-notarization`）。\n\n下一批读完这 9 篇（后者快速扫），即可进入总结阶段。\n"},{"file":"2026-09-10-DSH过程决策精读-13-别让省事的做法冒充正确做法.md","date":"2026-09-10","slug":"DSH过程决策精读-13-别让省事的做法冒充正确做法","title":"DSH 过程决策精读 · 第 13 批：别让省事的做法冒充正确做法","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"2026-07-21-serial-cross-platform-ci-reference.md","bytes":17438,"lines":264,"body":"# DSH 过程决策精读 · 第 13 批：别让省事的做法冒充正确做法\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。每篇都在拆穿一个\"看起来能解决问题、实际解决错了\"的做法：\n> 用超时表达性能目标、用清理解决容量增长、用提高帧率补充缺失的帧。\n> 三者的共同点是——**它们都能让指标变好，而问题还在。**\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [串行跨平台 CI 参考](#1-串行跨平台-ci-参考) | 独立的完整性预言机，和刻意的重复 |\n| 2 | [重定向 Node 编译缓存](#2-重定向-node-编译缓存到数据卷) | **缓存不是残留** |\n| 3 | [Playwright 视频捕获](#3-playwright-视频捕获连续演示) | 提高帧率补不回没有的帧 |\n\n---\n\n## 1. 串行跨平台 CI 参考\n\n`2026-07-21-serial-cross-platform-ci-reference.md`\n\n### 他们遇到的事（三个递进的问题）\n\n**① 必需检查不该是唯一的完整性预言机。**\n\n> a defect in their gate inventory or dependency graph could **omit work while the required aggregate stays green**\n\n**门清单或依赖图里的一个缺陷，可能漏掉工作，而必需的聚合仍然全绿。**\n\n**② 把时间目标编码成超时，会制造一个独立的失败模式。**\n\n> Hosted-runner startup and performance vary, so **a correct gate can be cancelled at the target boundary before it emits useful diagnostics**.\n\n**托管 runner 的启动和性能会变化，所以一个正确的门可能在目标边界处被取消——还没发出有用的诊断。** 于是他们划开两个目标：**性能目标需要按 GitHub 时间戳测量，而正确性需要足够的时间去完成。**\n\n**③ 评审者需要一个更简单问题的直接答案**：当仓库完整的聚合在**没有矩阵选择、没有分片变量、没有并发门**的情况下跑在每个操作系统上，会发生什么？\n\n### 判断：一个独立的、串行的、可见的参考\n\n- **PR 和 master 推送被赋予互补的责任**：PR 跑 Linux/native Windows/Node 兼容/Python 检查，**master 推送拿三套 Python 运行时载体和 Wine**\n- master 上活跃的是**串行 standby** 引用，它们是\"**持续重新证明故障切换目标的 hot-standby 演练**\"\n- 每个参考 job 跑 `check:ci` **不带任何分片选择器**，`DSH_GATE_CONCURRENCY=1` 让聚合**一次执行一个就绪的门**\n- **\"独立 job 定义刻意保持它们简短的 checkout、运行时 setup 和不可变安装序列可见，而不是把操作系统藏在矩阵或可复用 workflow 后面\"**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| **设每个超时等于它的延迟目标** | **调度方差会取消正确的工作，并压制诊断回归所需的证据** |\n| **只信任并发的主清单** | **调度和验证共享实现假设；一个串行聚合是独立的完整性检查** |\n| 每个 PR 都跑串行参考 | 它们重复完整的跨平台聚合，并给每个变更加 macOS 工作 |\n| 每个 PR 都跑真实内核沙箱矩阵 | 它的四个状态**不参与分支保护**，而重复安装、Landlock 构建、macOS 单元对等**消耗 runner 容量却不改变合并裁决** |\n| 用一个操作系统矩阵 | **三个具名 job 让参考面可见，而不需要另一个选择机制** |\n| 在更大的 runner 上跑串行参考 | **必需 CI 和它的独立参考都必须在组织自有池无法分配 job 时仍可运行** |\n\n第 2 条是本篇的核心判断：**\"调度和验证共享实现假设\"**——同一个实现既调度又验证时，它的错误会同时骗过两边。**所以需要一个走不同实现路径的独立检查。**\n\n第 6 条是另一条通用原则：**正确性路径必须能在没有\"仓库外部的 runner 配置\"的情况下运行。**\n\n### 三处平台正确性的处理\n\n**① 平台所有权要显式。**\n\n`terminal-bash` 支持 Linux 和 macOS，**因此它在 POSIX 上拥有它的单元与逐文件覆盖契约，而不是加载一个拒绝 `win32` 的后端**——**Windows 运行仍然执行每一个可移植包**，但**不声称覆盖一个它加载不了的后端**。\n\n**② 可移植 fixture 要真的可移植。**\n\n通过 `node:path` 推导原生路径；**用与生产相同的原生 realpath 实现**比较规范身份；**使用在每个主机上都合法的文件名**。\n\n**③ 别名归一化要按最长优先。**\n\nACP snapshot 运行把生成 cwd 的两种拼写都传给归一化器，**\"它按最长优先替换别名，这样 Windows 的短路径和长路径不能搅动共享 fixture\"**。\n\n### macOS 上的一处\"遏制而不是移除\"\n\n> Node 24 on macOS arm64 has **aborted in its CJS lexer from a worker thread**; **the process boundary contains that external runtime failure without removing any test from the aggregate**, while Linux and Windows retain the lower-overhead thread pool.\n\n**进程边界遏制了那个外部运行时故障，而不从聚合里移除任何测试。** 用结构隔离一个无法修复的外部缺陷，**而不是把它从检查范围里删掉**。\n\n同段还列了三处\"仓库自有的竞态在它们的观察边界处修复\"：dev bundle 轮询**先暂存**再发布重扫、缺失 bundle **保持 dirty 直到成功的内容哈希**、真实 PTY fixture **在运行时组装同步 token**（\"**这样交互式 shell 的输入回显不能满足一个子进程就绪等待**\"）。\n\n### 他们承认的代价\n\n- **工作流包含重复的 setup 步骤**，master 参考可能比优化的 PR 路径长得多——**\"那个重复是刻意的\"**：评审者能检查每个操作系统的完整命令，而不用解析矩阵或并发调度器\n- **参考可能暴露优化的阻塞集还不声称支持的平台故障**——而定性很关键：\n\n  > Such a failure is **evidence about current cross-platform behavior** rather than a reason to **weaken or silently skip** the aggregate.\n\n  **这样一个失败是关于当前跨平台行为的证据，而不是削弱或静默跳过聚合的理由。**\n- **只对真实主机内核或打包 Landlock 安装可见的回归，可以在 master 报告之前合并**——\"那个合并后检测窗口被接受，以换取从每个 PR 移除四个非阻塞 job；**默认分支保留完整的信号**\"\n- **移除严格时长超时，意味着延迟回归是被观察到而不是被自动取消**——因此**托管测量必须伴随性能变更**\n\n---\n\n## 2. 重定向 Node 编译缓存到数据卷\n\n`2026-08-28-ci-node-compile-cache-data-disk.md`\n\n### 他们遇到的事：一份带数字的现场勘查\n\n自托管 Linux CI VM（**一台主机上 32 个 runner 实例**）**耗尽了根分区的 inode 容量**。机制链查得很清楚：\n\n- pnpm 11.7.0 **在它的入口里启用缓存**（`bin/pnpm.mjs` 里的 `module.enableCompileCache?.()`），**每次调用都启用**\n- TypeScript 在 `tsc`/`tsserver` 里也这么做\n- **vitest 转发该 API 但不自己启用它**\n- 每一次这样的调用都把序列化的 V8 字节码缓存写到 `os.tmpdir()/node-compile-cache`\n\n实测（2026-08-28）：**697,389 个 inode 和 9.2 GB，其中 34,110 个文件年轻于 1 小时**。\n\n> the cache **grows on every CI run and is never cleaned**, so the root partition's 3,276,800 inodes **trend toward exhaustion** even after the `dsh-*` residue is controlled\n\n**缓存在每次 CI 运行时增长且永不被清理，所以根分区的 327 万 inode 趋向耗尽**——即使在另一处残留被控制之后。\n\n### 判断：结构性修复，而不是清理\n\n把 `NODE_COMPILE_CACHE` 重定向到每 runner 的数据卷临时目录（`/data_local`，1 TB，约 1% inode 使用）。**重定向是一个紧接 `actions/checkout` 的步骤，把变量写进 `$GITHUB_ENV`**，于是泳道里每个后续步骤都继承它。\n\n### 三个\"为什么不用更简单的做法\"\n\n**① 为什么不直接禁用编译缓存？**\n\n> `NODE_DISABLE_COMPILE_CACHE=1` would stop root-partition growth immediately but **forfeit the startup speedup on every run**, and the cache is a **legitimately useful Node feature**. **Redirecting preserves the benefit while moving the cost off the constrained partition.**\n\n**会立即停止增长，但每次运行都放弃启动加速。重定向保留了收益，同时把成本移出受限分区。** ——**\"关掉它\"永远是能立刻让指标变好的选项，代价是丢掉一个本来正当的功能。**\n\n**② 为什么不把 `node-compile-cache` 加进残留清扫？**\n\n> the CI sweep targets **test residue**; the compile cache is **a cache, not residue**. **Deleting it every run would discard the speedup the cache exists to provide.** Redirecting is **the structural fix**.\n\n**清扫针对的是测试残留，而编译缓存是缓存，不是残留。每次运行删除它会丢弃缓存存在的意义。** 这是本批最好的一个区分：**\"混乱\"和\"缓存\"看起来都是\"占地方的东西\"，但前者的正确处置是删除，后者是搬家。**\n\n**③ 为什么必须注入到 `$GITHUB_ENV`，而不是 job 级 env？**\n\n两个具体的技术事实：**`runner` 上下文在 job 级 `env` 里不可用**（求值为空字符串，会**静默地**把缓存留在根分区）；而只在门步骤加 step 级 env **会让更早的 pnpm 调用继续写根分区**。\n\n于是校验里有一条**位置断言**：`ci-workflow.spec.ts` 断言每个 Linux 泳道在 `pnpm/action-setup` **之前**注入该变量——**\"位置断言会在注入移到第一次 pnpm 调用之后时失败\"**。\n\n**\"在正确的位置做\"属于被测试的契约，而不只是实现细节。**\n\n### 一处经过实测的\"静默降级是可接受的\"\n\n受限子进程（bwrap/Landlock）如果沙箱不授予 `runner.temp` 路径，**会继承变量但静默跳过缓存**。他们在 VM 上验证了行为差异：\n\n> with `NODE_COMPILE_CACHE` pointing at an ungranted path inside bwrap, **`node` runs normally (exit 0)**, **unlike `mkdtemp` which fails hard** with a read-only filesystem error. The compile cache is **best-effort by design**; a failed write is **a cache miss, not a crash**.\n\n**在 bwrap 里指向一个未授权路径时，`node` 正常运行（exit 0），而不像 `mkdtemp` 那样以只读文件系统错误硬失败。** 由此判定：**编译缓存按设计是尽力而为的，一次失败的写入是缓存未命中，不是崩溃。**\n\n**先实测行为，再决定这个失败是否可接受**——而不是先假设再辩护。\n\n### 他们承认的代价（Bought / Cost 格式）\n\n- **Bought**：编译缓存不再消耗根分区 inode；**没有丢掉缓存的启动收益**\n- **Cost**：缓存在 `runner.temp` 里累积，**而 runner 在 job 之间不清空它**——但在数据卷上（约 1% inode）**那无害**（**代价被量化，然后判定无害**）\n- **Cost**：受限子进程跳过缓存，**\"这是缓存未命中，不是失败，且符合 Node 的尽力而为契约\"**\n- **Cost**：**本地开发保持默认的 `os.tmpdir()` 位置**——CI 与本地不同，且被写出来\n\n---\n\n## 3. Playwright 视频捕获连续演示\n\n`2026-09-08-playwright-video-gif.md`\n\n### 他们遇到的事\n\n第 04 批读过 GIF 证据链，现在补上视频模式。问题一句话：\n\n> A screenshot storyboard **omits intermediate animation frames** and can miss short-lived progress indicators. **Increasing the encoded GIF frame rate cannot recover motion absent from its source images.**\n\n**截图分镜省略了中间动画帧**；而**提高编码 GIF 的帧率，无法恢复它的源图像里没有的运动**。\n\n**插值补不出信息。** 输出采样率再高，源里没有的东西也不会出现——**所以正确的做法是提高源采样率（改用连续录制），而不是提高输出帧率。**\n\n### 判断与其他\n\n- **浏览器控制工作流优先**；当它暴露 `recordVideo` 时，**在同一个受控上下文里**捕获中间帧；否则截图\n- **视口与录制尺寸显式匹配，避免 Playwright 默认缩放到 800×800**\n- 编码器接受视频或截图目录；视频输入**选一个连续区间、应用声明的播放倍率、延长最后一帧**\n- **模式不当的选项和无效区间会失败**（fail-loud）\n- **\"失败的录制不能为一次成功的运行贡献帧\"**（第 04 批那条纪律的延续）\n\n### 一条划清\"演示\"与\"证据\"的规则\n\n> The original video remains available for review; **trimming and speed never establish model response latency.**\n\n**原始视频保持可评审；裁剪和加速永远不确立模型响应延迟。**\n\n**一旦你改变了时间轴，这个产物就不能再被当作时间证据。** 用它做演示可以，用它证明\"模型响应很快\"不行——**因为加速这个动作本身改变了被声明的那个量。**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 只提高编码帧率 | **重复稀疏的截图不会捕获额外的运动**（截图仍对显式状态保持、请求的分镜和无视频支持的工作流有用） |\n| 安装一个单独的录制器，或捕获桌面 | **仓库已经声明了 Playwright。** 另一个驱动增加 setup 和版本管理；**桌面捕获会包含无关窗口和个人状态** |\n\n第 2 条里那个理由值得记：**\"桌面捕获会包含无关窗口和个人状态\"**——**扩大捕获范围会把别人的隐私捎带进来**。\n\n### 他们承认的代价\n\n- **连续录制保留中间状态，所以评审者必须检查选定区间是否有敏感内容与可读性**——**新能力带来了新的评审义务**，而不是\"更真实所以更省事\"\n- 原始视频消耗额外暂存存储；**上下文关闭是成功录制的一部分，不是可选的清理**\n- **编码器的本地测试调用真实 ffmpeg 和 ffprobe**，需要媒体前置条件并**被显式运行；仓库 CI 不供应这些媒体二进制**\n\n最后那条又是\"不声称验证不了的东西\"：**这些测试不在 CI 里跑，就明说不在 CI 里跑。**\n\n---\n\n## 对索引里跨批模式的印证\n\n**模式 D（证据要成立）——\"独立预言机\"是一个新维度。**\n\n\"调度和验证共享实现假设\"——**如果一个检查与被检查的对象共享实现，它的通过不能独立地支持任何结论。** 这是\"证据\"要求的又一次升级：不只是\"验到消费点\"，还要\"**用一条不共享假设的路径去验**\"。\n\n**模式 A——\"不声称验证不了的东西\"再次出现（两处）。**\n\n\"仓库 CI 不供应这些媒体二进制\"（本地测试不在 CI 跑，就说明）；\"本地开发保持默认位置\"（CI 与本地不同，就写出）。\n\n**模式 C——\"演示\"与\"证据\"的区分。**\n\n\"裁剪和加速永远不确立模型响应延迟\"：**同一个产物的不同用法，其证明力不同；改变了时间轴，就不能再主张时间结论。**\n\n---\n\n## 这批的共同判断标准\n\n**① 独立检查不能与被检查对象共享实现假设。**\n\"调度和验证共享实现假设；一个串行聚合是独立的完整性检查。\" **同一个实现既调度又验证时，它的错误会同时骗过两边。**\n\n**② 超时不是性能目标的正确表达。**\n\"调度方差会取消正确的工作，并压制诊断回归所需的证据。\" **用取消来表达\"太慢了\"，会让你同时失去\"慢在哪\"的证据。**\n\n**③ 区分\"混乱\"与\"缓存\"。**\n两者看起来都是\"占地方的东西\"，但**前者的正确处置是删除，后者是搬家**。\"每次运行删除它会丢弃它存在的意义。\"\n\n**④ 结构性修复优先于周期清理。**\n重定向 vs 清扫、搬到为它定尺寸的卷 vs 定期删——**当增长是某个东西的正常行为时，问题在\"它长在哪\"，不在\"它长了\"。**\n\n**⑤ 插值补不出信息，要提高源采样率。**\n\"提高编码帧率无法恢复源图像里没有的运动。\" **输出端的任何加工，都不能让输入端不存在的信息出现。**\n\n**⑥ 一旦改变时间轴，就不能再主张时间结论。**\n\"裁剪和加速永远不确立模型响应延迟。\" **编辑手段与被声明的量相冲突时，产物的证明力归属要重新划定。**\n\n**⑦ 让参考面可见，值得付出重复的代价。**\n\"那个重复是刻意的：评审者可以检查每个操作系统的完整命令，而不需要解析矩阵或并发调度器。\"\n\n**⑧ \"在正确的位置做\"属于契约，不只是实现细节。**\n位置断言：**注入必须发生在第一次 pnpm 调用之前，否则整个目的落空**——所以测试断言的是位置。\n\n**⑨ 代价要量化，然后判定它可不可接受。**\n\"缓存在 `runner.temp` 里累积，runner 不清空它——但在数据卷上（约 1% inode）那无害。\"**先量，再判，而不是含糊地说\"影响很小\"。**\n\n**⑩ 新增能力带来新增义务。**\n\"连续录制保留中间状态，**所以评审者必须检查选定区间是否有敏感内容与可读性**。\" **能力变强时，责任清单同步变长。**\n\n---\n\n## 下一步\n\n**进度 41/47（87%）**。剩余 6 篇：`native-windows-pull-request-ci`、`node-compatibility-selfhosted` 两篇精读，加 4 篇纯 runner 配置（`preview-hosted-runner-sizing`、`python-runtime-windows-hosted`、`blacksmith-failover-leg`、`parallel-macos-notarization`）快速扫读。\n\n读完即 47/47，然后我会做**总的收束文档**——把 13 批里反复出现的判断标准合并去重。\n"},{"file":"2026-09-10-DSH过程决策精读-14-真正的瓶颈与不能证明的事.md","date":"2026-09-10","slug":"DSH过程决策精读-14-真正的瓶颈与不能证明的事","title":"DSH 过程决策精读 · 第 14 批：真正的瓶颈，与不能证明的事","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"2026-08-08-native-windows-pull-request-ci.md","bytes":16663,"lines":249,"body":"# DSH 过程决策精读 · 第 14 批：真正的瓶颈，与不能证明的事\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。每篇都有一个\"看起来该有效、实际没打中\"的手段：\n> 用 Wine 代替原生 Windows、用共享 Node 安装节省空间、用代理加速公证。\n> 三篇分别说明了它为什么不行，以及**真正的问题在哪**。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [Wine 与原生 Windows CI](#1-wine-与原生-windows-ci) | Wine 不能证明 NTFS、DACL、ConPTY |\n| 2 | [自托管上的隔离 Node 兼容 job](#2-自托管上的隔离-node-兼容-job) | 可变的共享链接会让结果取决于时序 |\n| 3 | [并行 macOS 公证](#3-从独立-app-副本并行-macos-公证) | 代理改善了 5 倍，但瓶颈不是带宽 |\n\n---\n\n## 1. Wine 与原生 Windows CI\n\n`2026-08-08-native-windows-pull-request-ci.md`\n\n### 他们遇到的事\n\n对 Wine 的定性非常干脆：\n\n> Wine checks the win32 toolchain **over a Linux kernel and case-sensitive ext4 with a hoisted dependency layout**. It **cannot prove NTFS, DACL, ConPTY, crash durability, or native process behavior**.\n\n**Wine 在 Linux 内核和大小写敏感的 ext4 上、用 hoisted 依赖布局检查 win32 工具链。它不能证明 NTFS、DACL、ConPTY、崩溃持久性或原生进程行为。**\n\n**所以它不是\"更便宜的 Windows 检查\"，而是一个覆盖面不同的检查。** 由此：PR 正确性需要**独立于合并后 Wine 结果**的原生 Windows 构建与进程检查。\n\n第二件事是一次覆盖审计：**陈旧的分数状态恢复了受支持 LSP 源码的临时排除**——于是原生 Windows 被要求**在同一个 100% 逐文件阈值下执行完整的受支持源码清单，而不是依赖一个更小的平台专属分母**。\n\n### 判断：三层裁决强度\n\n每个 PR 启动**四个独立的原生 job**。关键在于它们与必需聚合的关系**各不相同**：\n\n| job | 与 `all checks passed` 的关系 |\n|---|---|\n| `windows-build`、`windows-native-tests` | **是依赖**，结果阻塞 |\n| `windows-coverage` | **普通 job，缺席于聚合的 `needs`**——所以\"它的 100% 逐文件结果**保持红色且可见，而不延迟必需的裁决**\" |\n| `windows-observational` | **缺席于 `needs` 且用 `continue-on-error`**，因为 Linux 拥有阻塞性的静态/文档/包/构建产物裁决 |\n\n中间那一档值得单独记住：**\"保持红色且可见，但不延迟必需裁决\"是介于\"阻塞\"和\"跳过\"之间的第三种状态。** 第 05 批的 `pending`、第 10 批的三种 `always()` 义务，都是同一族的设计——**不要把所有不阻塞的东西都塞进\"忽略\"。**\n\n另一处与第 13 批形成对照的用法：逐 job 的截止时间是 60–120 分钟，作用是 **\"约束卡住的工作，而不把性能目标当作正确性截止时间\"**。**超时用来防挂死是对的，用来表达性能目标是错的**——两篇合起来把这条讲全了。\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 让每个原生 Windows 结果都成为聚合的依赖 | 最高保真，**但让每次合并都等待覆盖和重复的观察清单** |\n| **在 PR 上只跑 Wine** | Wine 快速到达阻塞性 win32 分支，**但可以在一个真实的 NT、NTFS、PowerShell、进程或 addon 契约被破坏时报告绿色** |\n| 把每个非阻塞原生 job 都标 `continue-on-error` | 覆盖保持普通 job 且在 `needs` 之外，**所以阈值失败保持红色可见而不阻塞聚合** |\n| **排除看起来不支持的文件，或削弱 Windows fixture** | **受影响的行为是受支持的。** 对等平台分支被**狭窄地标记**；**可移植的结果留在分母里**，通过主机真实的 fixture 演练 |\n| 保持 GitHub 标准 `windows-2025` | 它能可靠完成，**但 32 分钟的串行结果让自动原生信号实用性差得多** |\n| **用 32 核或更大的 runner** | **32 核比较只比 16 核改进 1.47 秒，并在 Node 的 CJS lexer 里失败**；更早的 32/64 核试验在同一类里失败 |\n\n第 4 条是一条硬纪律：**不要为了测试变绿而缩小被测范围。** \"受影响的行为是受支持的\"——**所以它不是\"不测的东西\"，是\"本来就该测、之前漏了的东西\"**。\n\n第 6 条则是**用实测反驳\"加资源就行\"**：更多容量增加了分配成本，却没有稳定的端到端收益。\n\n### 一处\"第一次真实运行就抓到东西\"的记录\n\n> The first native run **exposed two failures hidden by the compatibility lane**.\n\n**第一次原生运行就暴露了两个被兼容泳道隐藏的失败**：文档投影测试**只按 `/` 切分**推导图片 basename；Chokidar 消费者**通过 `%TEMP%` 的 `C:\\Users\\RUNNER~1` 8.3 别名**收到路径，**而 libuv 返回长目录名**，触发了它的 Windows 事件路径断言。\n\n后者的修复被总结成一条可复用的规则：**在打开 watcher 之前规范化\"已存在的原生 watch base 或最深已存在祖先\"，并保留缺失的后缀。**\n\n### 他们承认的代价\n\n- **原生覆盖和观察结果仍可能在 `all checks passed` 变绿时待定或红色**——所以**分支保护消费定向的构建/进程检查，而评审者和后续自动化消费其余的原生结果**\n- **原生 job 在多处重复 setup 并重复构建，但它们降低了每个 job 的进程数**，并暴露被兼容泳道隐藏的缺陷\n- **维护者必须保留两套刻意的执行拓扑**（Wine 快照 vs 原生工作区），而且：\n\n  > A failure unique to either topology must be **classified against that boundary** rather than **weakened or silently skipped**.\n\n  **一个只对任一拓扑唯一的失败，必须针对那个边界分类**——不是被削弱，也不是被静默跳过。\n\n---\n\n## 2. 自托管上的隔离 Node 兼容 job\n\n`2026-09-06-node-compatibility-selfhosted.md`\n\n### 他们遇到的事\n\nNode 22.19/24.9/26 兼容 job **消耗托管 Linux 分钟数**，即使仓库已经选了自托管池。而搬迁的风险很具体：\n\n> Moving version installers onto a persistent shared machine can create **tool-directory collisions** and **accumulate generated cache files outside runner cleanup**.\n\n**工具目录冲突**，以及**在 runner 清理之外累积生成的缓存文件**。\n\n### 判断：用\"重复下载\"换\"隔离\"\n\n- **临时工具缓存**：\"**用重复的 Node 下载换取跨并发 runner 和 Node 版本的隔离**\"\n- 一个 **setup-node-only 的 ESM preload** 在 action 进程内给缓存赋值——因为**Actions runner 会在读完步骤配置之后覆写保留的环境变量**（所以只能在进程内改）\n- **一个执行期的路径检查拒绝 runner temp 之外的安装**\n- **兼容进程不继承那个 preload**；**不引入全局 Node 符号链接或系统包改动**\n- **托管 job 保留它们的工具与包缓存；自托管 job 不恢复也不上传托管包缓存**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保持所有兼容 job 托管 | 避免额外共享主机负载，**但继续为\"不需要不同操作系统或架构\"的 Linux 运行时检查付费** |\n| **使用共享的 Node 安装或全局版本管理器链接** | **job 必须并发跑不同的 Node 发布版。可变的共享链接会让选定的版本取决于另一个 job 的时序** |\n| 在同一次变更里把 Python SDK job 也搬过来 | **它的 setup-python 安装和全局 pip 安装 uv 需要独立的隔离证据**；**它的短托管 job 并不是 Node 优化所需要的** |\n\n第 2 条是一条通用判据：**任何\"共享的可变位置\"都会把并发变成时序依赖。** 这与第 09 批 worktree hooks 那篇（共享 hooks 目录）是同一种病，只是这次的赌注是\"选中的 Node 版本\"。\n\n第 3 条是\"不捎带\"的又一例（第 05、07 批同款）。\n\n### 一处很实用的证据记录法\n\nVerification 段直接列出了三个真实 CI run 的编号与结论，包括一个**只读能力探针**报告：Linux x64、**192 在线逻辑 CPU**、GCC/G++ 13.3、Make 4.3、Python 3.12.3——以及**\"Python 3.10 缺席，强化了单独的 SDK 供应需求\"**。\n\n然后用一句边界收尾：\n\n> These observations establish **version and path compatibility, not an exclusive-host capacity guarantee**.\n\n**这些观察确立了版本与路径兼容性，不是独占主机的容量保证。** ——**用实测支撑结论，同时说清实测覆盖不到的地方。**\n\n### 他们承认的代价\n\n- 池**每个可信 PR 收到三个额外 job**；而 \"**9 月 6 日的清单报告 31 个 Linux 注册，不是 31 台独立机器**\"（第 08 批同款的诚实）\n- **共享 VM 的争用与下载延迟仍然是铺开风险；变量保留了托管恢复能力**\n\n---\n\n## 3. 从独立 App 副本并行 macOS 公证\n\n`2026-09-09-parallel-macos-notarization.md`\n\n### 他们遇到的事\n\nDMG（安装）与 ZIP（更新）需要两份产物。原本**在创建 DMG 之前等待 App 公证，把两次 Apple 提交串行化了**。\n\n而真正的障碍不是带宽：\n\n> **Stapling modifies the App**, so **concurrent notarization and packaging cannot safely share that writable directory**.\n\n**stapling 会修改 App，所以并发公证与打包不能安全地共享那个可写目录。** ——**并行化的障碍是\"同一个可写对象被两条流水线同时改\"，不是服务排队。**\n\n### 判断：先复制，再各走各的\n\n- 签名并验证**一个 App**，然后用 `ditto` **创建两份独立副本**\n- **App 泳道**：公证 + staple 它的副本 + 验证签名/票据/Gatekeeper，**并让 electron-builder 创建 ZIP 与 updater 元数据**\n- **DMG 泳道**：立刻打包它的副本、签名镜像，用既有的 artifact 完成钩子**公证、staple 并验证镜像**\n- 每个 electron-builder 进程**收到实际的 `.app` 路径**（`--prepackaged`）、**一个隔离的输出目录**、`--publish never`\n\n内容上有一个精细差异：**ZIP 里的 App 是单独 staple 过的**（因为 ZIP 更新会被独立解压，依赖在线或缓存票据）；**DMG 里的 App 没有单独 staple 的票据，由 DMG 的外层票据覆盖嵌套代码**。\n\n### 用\"记录缺席\"表达失败\n\n> Only two successful lanes allow promotion... The caller writes the release completion record **last**. **An error leaves that record absent, so the existing upload validation rejects the incomplete release.**\n\n**调用者最后写发布完成记录。一个错误会让那个记录缺席，所以既有的上传校验会拒绝不完整的发布。**\n\n**不是加一个\"是否成功\"的标志位，而是让成功才产生那个必需的东西**——这样\"忘了检查标志\"这种漏洞在结构上不存在。（与第 03 批\"绕过必须在结构上不可能\"同源。）\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| **两条泳道共享一个 App** | **一个 DMG 读取者可以与 `stapler` 写入重叠，产生一个非确定性的 bundle**。独立副本让\"提交的字节\"与\"分发的字节\"在每条泳道内保持稳定 |\n| 只公证 DMG | **ZIP 更新独立分发且需要一个 staple 过的 App** |\n| **保持串行公证，只加代理** | **同一个 214.84 MiB 的 DMG，直传 203.83 秒、经测试的系统代理 38.59 秒，但两条路线都不移除 Apple 提交之间的串行依赖** |\n| 在一次 electron-builder 调用里跑两个目标 | **ZIP 必须读那个 staple 过的副本** |\n\n第 3 条是本批最好的一个分析样本：\n\n**代理把上传时间改善了 5 倍以上（203.83 → 38.59 秒），但它没有打中真正的瓶颈——两次 Apple 提交之间的串行等待。** 一个手段只要改善了某个可见指标，就很容易被当成\"问题解决了\"，**而当真正的约束是另一个量时，这个改善不会缩短总时长**。\n\n同一段还划了一条边界：**\"代理配置仍然是构建主机的事；打包脚本不改变主机网络设置。\"**\n\n### 他们承认的代价（含样本量声明）\n\n- 实测（2026-09-09，同一台 Mac、同一代理）：**并行 490.78 秒 vs 串行 751.33 秒，降低 34.7%**；两条泳道相隔 8 毫秒开始，App/ZIP 用 307.36 秒、DMG 用 268.54 秒完成；Apple 两次都接受，上传相隔约一秒\n- 紧跟一句限制：\n\n  > Each configuration has **one full-build sample**, so **cache and Apple queue variation prevent attributing the entire difference to concurrency**.\n\n  **每个配置只有一个完整构建样本，所以缓存和 Apple 队列变化使整个差异不能被归因于并发。**\n- 两份额外 App 副本增加了峰值磁盘占用；**两次上传可能争用带宽**；**\"阶段计时描述的是观察到的行为，而不是一个 CI 延迟预算\"**\n- **一个失败的泳道会等另一条完成再清理**——\"这可能延迟失败报告，**但避免了删除仍被一个子进程持有的文件**\"\n- 测试用**屏障**证明重叠、票据隔离、双侧错误收集、拒绝发布不完整产物；**一个受控的串行回归会让重叠断言失败**\n\n---\n\n## 对索引里跨批模式的印证\n\n**模式 C（别把不同的事混成一种状态）——\"第三种状态\"。**\n\n\"`windows-coverage` 缺席于聚合 `needs`，所以它的阈值失败**保持红色且可见，而不延迟必需的裁决**\"。**阻塞 / 可见但不阻塞 / 忽略，是三种不同的处置**，把它们压成两种必然损失信息。\n\n**模式 A——\"用实测支撑结论，同时说清实测覆盖不到的地方\"。**\n\n\"这些观察确立了版本与路径兼容性，**不是独占主机的容量保证**\"；\"每个配置只有一个完整构建样本，所以**不能被归因于并发**\"。**两处都是在给出结论的同时，主动削掉结论够不到的部分。**\n\n**一个可以复用的新判据：一个手段改善了可见指标，不等于打中了瓶颈。**\n\n代理把上传从 203.83 秒降到 38.59 秒（5.3 倍），**而总时长没变**，因为真正的约束是两次 Apple 提交之间的串行等待。**看到某个数字大幅改善时，要再问一次：这个数字是约束吗？**\n\n---\n\n## 这批的共同判断标准\n\n**① 说清一个手段\"不能证明\"什么。**\nWine **不能**证明 NTFS、DACL、ConPTY、崩溃持久性、原生进程行为。**它不是\"更便宜的 Windows 检查\"，而是覆盖面不同的检查**——所以不能拿它替代原生 job，只能让它承担它真正覆盖的那部分。\n\n**② \"红色但可见、不阻塞\"是第三种状态。**\n不是所有不该阻塞的东西都该被忽略。**分三档（阻塞 / 可见不阻塞 / 忽略），比只有两档能保留更多信息。**\n\n**③ 不要为了测试变绿而缩小被测范围。**\n\"排除看起来不支持的文件\"被拒绝，理由是**\"受影响的行为是受支持的\"**——它是\"之前漏测的东西\"，不是\"不该测的东西\"。\n\n**④ 更多资源不等于更好，要用实测判断。**\n32 核只比 16 核改进 1.47 秒，而且在 CJS lexer 里失败。**\"加资源\"是需要证据的主张，不是默认答案。**\n\n**⑤ 任何共享的可变位置，都会把并发变成时序依赖。**\n\"可变的共享链接会让选定的版本取决于另一个 job 的时序。\" **隔离的代价（重复下载）要明说，但换来的是结果的可复现。**\n\n**⑥ 一个手段改善了可见指标，不等于它打中了瓶颈。**\n代理把上传时间改善 5 倍以上，**而真正的约束是两次 Apple 提交之间的串行等待**。**看到某个数字大幅改善时，要再问一次：这个数字是约束吗？**\n\n**⑦ 用\"必需物缺席\"表达失败，而不是用一个可能被漏检的标志。**\n发布完成记录**最后写**，出错时它就不存在——**于是\"忘了检查标志\"
