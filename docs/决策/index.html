**keep 白名单**（不得误删）：issue 引用、`TODO(name)`、suppression 理由、**measured 界**（\"the provenance word 'measured' is load-bearing\"）、runtime old/new、外部标准 §、note 的 Alternatives-considered。\n**边界**：`§`-ban 覆盖**未提交草稿**的编号，不覆盖已提交且自有编号的文档。\n\n### 2.2 审查与简化：`dsh-code-review` + `dsh-find-simplifications`\n\n**共同元原则**：\"This skill is guidance, not a complete checklist.\"（导向，不是清单）\n\n**审查顺序**：核对 checkout/分支 → 验证 live base/head → 跑范围报告 → **再读 diff** → 按 SSoT 清单逐项过（AGENTS.md / defensive-patterns / testing / Agent Notes / i18n）。\n**分级**：7 条 Blocking requirements + 一长串 Manual checks；\"Separate blockers from suggestions and omit issues already enforced by a green gate.\"\n**审查质量主张**：\"Prioritize correctness, lifecycle, security, and broken required behavior over style; **a short review with one substantiated blocker is better than a list of nits.**\"\n**两条边界**：\"Automated checks do not establish those properties.\"；\"Coverage is necessary but not evidence that the scenario is correct.\"\n**对既定决策**：\"Treat disagreement with an Agent Note as a design discussion, not an automatic veto.\"\n**收到 review 时**：\"verify each claim and fix or rebut it on technical grounds without performative agreement.\"\n\n**简化的判据**：\"A strong simplification removes, folds, or demotes something real and has clear evidence that the current design costs more than it buys.\"\n**强候选**（非显而易见）：无生产消费者的公共 API/事件/配置项/包；只有测试或文档是消费者且其行为非承重；**同一事实的两份表示**（尤其是持久 session 事件与瞬态 `agent/*` 事件之间）；seam 有所有实现都必须支持却无人用的方法；独立 package 只服务测试；推测性通用性；只为保护无人调用 API 的不变量。\n**反模式**：\"Thin candidates are not enough for an Agent Note: deleting one typo, running `knip` once, removing an intentionally documented backend/adapter, or flagging \"this looks complex\" without call-site proof.\"\n**四条拒绝理由**：有生产调用方／被已实施 Note 或防御模式证成／只造成无关 churn／想法对但太小。\n**替换净值**：\"A wrapper that relocates the same complexity is not a win.\"\n\n### 2.3 提交：`dsh-pre-push-checks`\n\n**选择律**：\"Every behavior change needs the narrowest available test or purpose-built check that would fail for its regression; add broader checks only for surfaces the diff actually reaches.\"\n**为什么本地不跑全量**：hooks 故意窄，\"CI owns exhaustive coverage and the platform matrix\"。\n**变更类型 → 证据映射**（节选）：\n\n| 变更类型 | 应跑证据 |\n|---|---|\n| 包/脚本行为 | 拥有该行为的 Vitest 文件或 focused test name |\n| Remote mock 类型 | `pnpm run typecheck`（unbuilt `any` 只是 \"explicit local fallback, not strict evidence\"） |\n| 文档/Agent Note/catalog | `pnpm run doc-sync` |\n| 模型/CLI/终端可见输出 | 拥有该输出的 focused keyless snapshot |\n| manifest/公开导出/构建配置 | `pnpm run build` + hygiene + 构建产物 smoke |\n| 真实 provider | 相关 e2e（有凭据时）；\"never print secrets\" |\n\n**严禁**：重复已通过的检查（\"do not run typecheck immediately before pushing solely to duplicate the pre-push hook\"）；用 `--passWithNoTests`、降阈值、缩 include 掩盖未覆盖；\"Raw `--force` is never allowed.\"（rewrite 用 `--force-with-lease=\u003cbranch>:\u003cobserved-oid>`）；\"Do not push and hope CI differs.\"\n**全量本地排练**仅三种情形：用户明确要求／诊断 CI 失败／变更广到没有更窄集合可信。\n\n### 2.4 性能与可靠性：`dsh-speed-up-perf` + `dsh-ci-test-reliability`\n\n**性能七步**：定范围（含**停止规则**）→ 核对确切当前 base → survey 用户路径并排序 → 先建真实合成基准 → **填 measurement card 才动手** → 先证回归 → 一次一个因果因子 + negative control。\n**measurement card 七字段**：User operation（确切动作 + 外部可观测完成条件）／Workload（固定维度、分布、种子、为何覆盖常规与尾部）／Entry path／Clock（含与不含的耗费、冷热状态）／Memory（基线、GC 策略、保留 vs 瞬时）／Verdict（原始样本、聚合、标定限额、**negative control**）／Behavior（归属测试与允许差异）。\n**完成判据**：\"the tightened assertion fails on the original implementation or a controlled reintroduction of the targeted cost.\"\n**不算证据**：可疑循环/未用缓存/大文件；历史迭代器或 Client fold 快；\"Node folds, fake DOMs, and custom heartbeat events alone cannot establish browser responsiveness.\"；未区分 merged/closed/superseded/estimated/newly-measured 的历史数字。\n**另一条底层原则**：\"Faster execution with unbounded retention is not an automatic win.\"\n**隐私红线**：不得把 prompt、输出、路径、身份、ID、凭据、录制片段写进 fixture / 日志 / 截图 / PR；基准不得依赖 home、本地仓库、网络服务或私有数据。\n\n**CI 可靠性**：先建模拓扑（同文件／跨文件 worker／同 job 独立进程／共享宿主的多个 job），每个已获取资源点名五件东西。\n**关键防护**：回环 `listen(0)` 后等 listening 再读地址（\"Never scan for a free port and bind it later.\"）；`mkdtemp` per-test 私有根；进程全局态（env/cwd/fake timers/locale/module mocks/globalThis/global fetch）视为独占可变资源，改则 capture → 恢复 → 登记 → try/finally → afterEach 兜底。\n**同步纪律**：\"A fixed sleep is not evidence that setup completed or cleanup settled.\"；\"Use a timeout only to bound a wait, never as the condition that makes the assertion correct.\"\n**可靠 ≠ 多跑几次都过**：\"repeated execution alone is not a race test\"（要用 barrier 证重叠）；\"Stress runs supplement a deterministic regression; they do not replace one.\"\n**反模式清单**（八条禁令）：\"increasing a timeout without identifying the awaited state; adding retries; making all files serial; swallowing an error or unhandled rejection; weakening an assertion; normalizing away unstable behavior; adding a sleep before cleanup or assertion.\"\n**报告纪律**：\"do not describe retries, skipped tests, or pending CI as passing.\"\n\n### 2.5 决策记录：Agent Notes（详见调查文档 §2）\n\n三条最值得立刻用：\n1. **目录即状态机**：`{proposed,implemented,rejected,archived}/{class}/yyyy-mm-dd-title.md`，日期取主题首提日。\n2. **事实就地改，决策不可改**：\"Rewrite stale facts in place\" + \"never edited into a *different decision*\"。\n3. **归档即冻结**：归档后不可编辑、翻译、移动，也不再是当前行为的权威。\n\n## 三、可迁移清单\n\n### A. 个人工作方式（12 条）\n\n1. **砍掉强调通胀**：加粗只留给\"改变行为的那一句\"——我当前回复的加粗密度属于官方 slop 清单明列的反模式。\n2. **不写变更叙事**：文档里禁\"此前/现在/不再/已修订\"，历史归 commit。\n3. **不写 review choreography**：不写\"我上次错了/你纠正得对\"，直接陈述当前结论。\n4. **注释只在 caller 推不出时写**；写就写不变式、顺序、失败模式、负向保证。\n5. **性能动代码前先写停止规则 + measurement card**；一次只改一个因果因子；无 negative control 不算修好。\n6. **偶发 bug 先问宿主拓扑**（固定端口、可预测路径、时钟、全局态、子进程句柄），再谈业务代码；复现用 barrier 不用 sleep。\n7. **提交前按\"回归时会失败的最窄测试\"选证据**，不习惯性全量；不重复已通过的检查。\n8. **向 AI 提需求时给约束模板**：measurement card 七字段 / \"先出范围报告再读 diff\" / \"只保留契约删掉推导\"。\n9. **让 AI 审查时要求\"少而实\"**：blocker 与 suggestion 分栏、每条给 defect/location/impact/evidence、跳过已被绿灯覆盖者。\n10. **收到 review 逐条验证**，fix or rebut on technical grounds，不做表演式同意。\n11. **决策用四段模板**：Problem → Decision（现在时）→ **Alternatives considered（必填）** → Consequences。\n12. **不重复讨论已决事项**：决策变更用新记录取代旧记录并双向交叉链接。\n\n### B. SSiD 工具改造（8 项，按优先级）\n\n| # | 项 | 说明 | 成本 |\n|---|---|---|---|\n| 1 | **Agent Notes 状态机** | `docs/决策/` 加 `proposed/implemented/archived` 流转 + `rejected/` 目录；三行头 + `## Problem` 开头 + 强制 `## Alternatives considered` | 低 |\n| 2 | **`check-rules` gate**（待办 #5） | 参考官方一脚本一职责 + 配套自测 + 统一排编器；先把既有手册规则机械化（双处声明、BOM、vendor MD5、旧名残留） | 中 |\n| 3 | **CoT 泄漏探针** | 把八类泄漏做成 rg 探针批，挂 commit-msg 或 CI；**探针必须带正负例校准 + keep 白名单**，否则误报摧毁规则可信度 | 低 |\n| 4 | **插件模板增两份卡** | `perf-card.md`（measurement card 七字段）+ `test-isolation.md`（资源点名五栏）；新插件入库连带隔离声明（呼应铁律 6） | 低 |\n| 5 | **\"消费者证据\"门禁** | 新增导出/配置项/事件须能列出生产调用方，否则拒收或降级为带稳定标签的 TODO | 中 |\n| 6 | **owner-first 纪律** | 先改 owning source（源 JSDoc/模板），再重生成派生件——与铁律 5「双处声明」同源 | 低 |\n| 7 | **提交纪律落地** | `--force-with-lease` 强制、raw `--force` 禁；报告不把 retry/skip/pending CI 说成通过 | 低 |\n| 8 | **文档字数预算** | 给手册/README 设 ceiling；超限按 relocate → condense → raise，且 raise 需说明理由 | 低 |\n\n## 四、立即应用（本周可做）\n\n1. **我自己**：从下一条回复起，加粗密度降到\"只标改变行为的那句\"；文档不写\"此前/修订/我上次错了\"。（§3.A.1–3）\n2. **SSiD 决策目录**：建 `proposed/implemented/archived/rejected` 四目录，把现有 `docs/决策/` 按状态归档一批，并给新决策套四段模板。（§3.B.1）\n3. **一条探针先跑起来**：从八类泄漏里挑最容易命中的两类（变更叙事 + 死设计会引用）写 rg 探针，带正负例校准，先手动跑。（§3.B.3）\n4. **提需求模板化**：下次让我做性能或排查类任务时，直接用 measurement card 七字段当约束。（§3.A.8）\n5. **提交前自检**：按\"回归时会失败的最窄测试\"选检查项，不跑全量。（§3.A.7）\n\n## 附：素材位置\n\n- 8 个 skill：`DSHfork/.agents/skills/{dsh-prose-standard,dsh-trim-cot-leakage,dsh-code-review,dsh-find-simplifications,dsh-pre-push-checks,dsh-speed-up-perf,dsh-ci-test-reliability,dsh-doc,record-browser-gif,dsh-archive-agent-notes,dsh-translate-docs,dsh-merging-stacked-prs}/SKILL.md`\n- Agent Notes 机制：`DSHfork/.agents/notes/{README.md,AGENTS.md}`、`.agents/notes/implemented/AGENTS.md`\n- 文档标准：`DSHfork/docs/AGENTS.md`\n- 元样本（一篇真实 Note）：`DSHfork/.agents/notes/implemented/process/2026-09-06-evidence-driven-performance-skill.md`\n\n**未验证**：`dsh-doc` 中\"audience-first hierarchy\"的完整定义条目未被读取；`dsh-speed-up-perf` 引用的 `references/ci-flake-diagnosis.md` 未读。\n"},{"file":"2026-09-10-DSH官方工程化范式调查.md","date":"2026-09-10","slug":"DSH官方工程化范式调查","title":"DSH 官方工程化范式调查（2026-09-10）","statusRaw":"事实已逐条查证；「可移植清单」中的成本评估为判断，未实施。","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["dsh-code-review","dsh-speed-up-perf","dsh-doc","dsh-pre-push-checks","dsh-archive-agent-notes","dsh-ci-test-reliability","dsh-find-simplifications","dsh-merging-stacked-prs","dsh-prose-standard","dsh-translate-docs","dsh-trim-cot-leakage","ssid-release"],"summary":"关系：AGENTS.md 说规则 → Skills 教怎么做 → Gates 检查有没有做 → Agent Notes 记录为什么这么做。","bytes":8898,"lines":127,"body":"# DSH 官方工程化范式调查（2026-09-10）\n\n> 目的：DSH 的开发过程本身是 agent 驱动的（仓库大量 Agent Notes、AGENTS.md、skill 体系），其工程范式对 SSiD 的规范建设有直接参考价值。\n> 素材来源：`DSHfork` @ `origin/master`（`c291e7961a`，2026-09-10）；查询命令见文末附录。\n> 状态：**事实已逐条查证；「可移植清单」中的成本评估为判断，未实施**。\n\n## 1. 三套机制总览\n\n| 机制 | 层次 | 规模（实测） | 强制方式 |\n|---|---|---|---|\n| **AGENTS.md** | 规范文本 | 根 + 各包 + 各目录多份 | 靠阅读与自觉 |\n| **Skills** | 方法论 | 12 个（9–60 KB/个） | 靠触发调用 |\n| **Gates** | 执行 | 215 个脚本（约 50 个 `verify-*`） | **机器拒绝（CI 红）** |\n| **Agent Notes** | 长期记忆 | 960 篇英文主文档（含双语共 2921 文件） | 由 `verify-agent-note-*` 部分强制 |\n\n**关系**：AGENTS.md 说规则 → Skills 教怎么做 → Gates 检查有没有做 → Agent Notes 记录为什么这么做。\n\n## 2. Agent Notes（长期记忆）\n\n- **位置**：`.agents/notes/`\n- **状态目录**：`proposed` / `implemented` / `archived` / **`rejected`**\n- **规模**：英文主文档 proposed 21 篇、implemented 310 篇、archived 629 篇（合计 **960 篇**）；含 `.zh.md` 与 `.i18n.yaml` 共 2921 个文件\n- **写入规则**（AGENTS.md 原文）：\"Non-trivial changes MUST include an Agent Note in the same PR; only mechanical/local edits are exempt\"\n- **归档策略**：\"Archived notes are frozen: never edit or treat them as current authority\"\n- **强制**：`verify-agent-note-format`、`verify-agent-note-classification`、`verify-archived-agent-notes` 三个 gate 检查格式与分类\n\n**值得注意**：连**被否决的方案**也保留（`rejected/` 目录），供后人避免重复提出。\n\n## 3. Skills（方法论）\n\n- **位置**：`.agents/skills/\u003cname>/SKILL.md`（单文件，YAML frontmatter：`name` + `description`）\n- **时间线**：最早 `dsh-code-review`（2026-06-13，早于 0.1.0 发布两个月）；最新 `dsh-speed-up-perf`（2026-09-06）；最近修改 2026-09-08（`dsh-doc`、`dsh-pre-push-checks`、`record-browser-gif`）\n- **清单与定位**：\n\n| skill | 定位 |\n|---|---|\n| `dsh-archive-agent-notes` | Agent Notes 新增/审计/裁剪/归档 |\n| `dsh-ci-test-reliability` | CI 并发、时钟、子进程、共享资源导致的非确定性失败 |\n| `dsh-code-review` | PR 审查：对齐本仓规范 / 防御模式 / ADR / 质量门 |\n| `dsh-doc` | 文档创建/重构/审计/迁移（受众优先层级、kind 映射 YAML 元数据） |\n| `dsh-find-simplifications` | 找非显而易见的简化机会（含冗余注释与重文档） |\n| `dsh-merging-stacked-prs` | stacked PR（A←B←C）落地 |\n| `dsh-pre-push-checks` | 推送前选**最小必要证据** |\n| `dsh-prose-standard` | 决定何处该有文档、何处该写注释（19 KB） |\n| `dsh-speed-up-perf` | 把\"再快点\"变成可复现的用户路径测量 |\n| `dsh-translate-docs` | 双语文档工作流 |\n| `dsh-trim-cot-leakage` | 清除\"推理痕迹泄漏\"（残留 `(decision N)`、审计项代码、未提交草稿 §N） |\n| `record-browser-gif` | 浏览器交互演示录为优化 GIF |\n\n### 3.1 两个样本的范式提炼\n\n**`dsh-pre-push-checks`**（10.4 KB）的核心主张：\n\n- 推送前**选最小必要证据**，\"without reflexively running the full repository suite\"\n- \"There is no universal local baseline beyond the hooks\"；\"CI owns exhaustive coverage and the platform matrix\"\n- 提供专用工具：`pnpm run change-scope --base \u003cref>`（计算 outgoing 变更范围，且\"never guesses or fetches a base\"）\n- 明确反模式：**\"Do not manually repeat a passing check merely because commit or push follows\"**\n- 测试选择与覆盖度选择分离：用 `--coverage.include` 把覆盖度量限定到受影响源文件\n\n**`dsh-speed-up-perf`**（12.2 KB，最新）的核心主张：\n\n- \"Turn a broad 'make it faster' request into reproducible user-path measurements and small, evidence-backed fixes\"；\"This is guidance, not a quota or a script\"\n- 先建立 scope（用户可见终点、负载范围、资源约束、停止规则），**backend 与 browser 端到端测量必须分开**\n- 候选排序需要\"production call site + 测量\"，\"A suspicious loop, unused cache, or large file alone is not evidence of a bottleneck\"\n- 实施前必须填 **measurement card**：User operation / Workload / Entry path / Clock / Memory\n- 隐私红线：不得把 prompt、输出、路径、身份、ID、凭据、录制片段写进 fixture / 日志 / 截图 / PR\n\n## 4. Gates（机器强制）\n\n- **位置**：`scripts/`（215 个脚本，其中约 50 个 `verify-*`）\n- **编排**：`scripts/run-gates.ts` —— \"Run local and CI quality gates with bounded in-process scheduling\"；每个 gate 有 `id` / `label` / 依赖关系\n- **聚合模式（Mode，17 个）**：`ci-primary`、`ci-linux-primary`、`ci-static`、`ci-lint-contracts-ready`、`ci-coverage`、`ci-bench`、`ci-snapshot`、`ci-artifacts`、`ci-consumers`、`ci-windows-blocking`、`ci-windows-complete`、`ci-windows-observational`、`node-compat`、`check-all`、`hygiene`、`doc-sync`、`doc-quick`\n- **组织约定**：一个脚本一个职责，多数配 `.spec.ts` 自测\n\n### 4.1 分类清单（举例）\n\n| 约束对象 | 脚本 | 拦住什么 |\n|---|---|---|\n| 文档 | `verify-md-links` / `-md-wrap` / `-doc-budgets` / `-doc-refs` | 死链、换行格式、字数超预算、文档引用失效 |\n| 双语 | `verify-translation-pairing` | 中英文档配对缺失 |\n| 包规范 | `verify-export-jsdoc` / `-package-readme-summaries` / `-readme-model-experience` / `-readme-limitations` | 导出无 JSDoc；README 必填章节缺失 |\n| 架构约束 | `verify-application-entrypoints` / `-cordis-config` / `-client-domain-graph` / `-no-bare-dispatcher` | 绕过 dsh CLI 的应用入口；裸插件未声明依赖；Client 域依赖越界 |\n| Agent 产物 | `verify-agent-note-format` / `-classification` / `-archived` / `-skill-invocation-metadata` | Note 格式/分类合规；skill 元数据完整 |\n| UI | `verify-client-ui-i18n` | 硬编码文案（必须走 locale 字典） |\n\n### 4.2 三个值得注意的设计\n\n1. **`verify-application-entrypoints` 是\"一切皆插件\"的执法者**：架构文档声称\"没有特权内核可改\"，此 gate 拒绝任何绕过 `dsh` CLI 的 Node 应用入口。**约束写在文档里是愿望，写进 CI 才是规则。**\n2. **README 有强制章节**：`-package-readme-summaries` / `-model-experience` / `-limitations` 分别校验三段必填内容，**包括 Known Limitations**——用机器强制诚实。\n3. **`verify-skill-invocation-metadata` 是自举的**：skills 体系自身也要过格式门。\n\n## 5. 可移植清单（对 SSiD 的价值）\n\n| 项 | 我们的现状 | 移植成本 | 优先级 |\n|---|---|---|---|\n| **Agent Notes 状态机**（proposed → implemented → archived + rejected） | `docs/决策/` 为平铺结构，无状态流转 | 低（约定 + 目录） | 高 |\n| **`check-rules` gate**（手册待办 #5） | 已有待办条目与检查项清单 | 中（脚本 + 编排） | 高 |\n| **\"最小证据\"提交纪律**（手册 L1/L2/L3 已接近） | 已分级，但无 `change-scope` 类工具 | 低（纪律）/ 中（工具） | 中 |\n| **measurement card 模板**（性能类改动） | 无 | 低（模板） | 中 |\n| **CoT 泄漏检查**（残留 `(decision N)`、未提交草稿 §N） | 无；我们的产出物常见此类自引用 | 低（检查脚本） | 中 |\n| **README 必填章节校验** | 手册 §9 有\"截图演示\"硬门槛；其余靠自觉 | 低—中 | 中 |\n| **skill 元数据校验** | `ssid-release` 等 skill 已存在，但无格式门 | 低 | 低 |\n\n## 6. 不可直接抄的部分\n\n这些 skill 与 gates 是**为 DSH 仓库量身定做**的：其中命令（`pnpm run change-scope`、`pnpm run doc-sync`、`pnpm run hygiene` 等）都指向它自己的工具链，`verify-*` 的检查对象也是本仓目录结构。**可搬的是方法论与组织方式，不是命令与检查内容。**\n\n## 附：证据与查询命令\n\n```sh\n# skills 清单与时间线\ngit -C DSHfork ls-tree --name-only origin/master .agents/skills/\ngit -C DSHfork log origin/master --diff-filter=A --date=short --pretty=format:'%ad' -- .agents/skills/\u003cname>\n\n# Agent Notes 规模\ngit -C DSHfork ls-tree -r --name-only origin/master .agents/notes/ | Measure-Object -Line\ngit -C DSHfork ls-tree --name-only origin/master .agents/notes/\n\n# gates 规模与编排\ngit -C DSHfork ls-tree --name-only origin/master scripts/ | Select-String 'verify-'\ngit -C DSHfork show origin/master:scripts/run-gates.ts\n\n# 架构约束原文\ngit -C DSHfork show origin/master:docs/architecture.md\ngit -C DSHfork show origin/master:packages/README.md\n```\n"},{"file":"2026-09-10-DSH官方Gates拆解原始报告-E-配对与配置门.md","date":"2026-09-10","slug":"DSH官方Gates拆解原始报告-E-配对与配置门","title":"DSH Gates 双脚本精读报告","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["ssid-gates"],"summary":"- 配对定义 = 纯命名约定，不是 frontmatter：translationPairPaths(anchor) 由英文锚点推出三件套（L109、L154）；.i18n.yaml 是两行 git blob 哈希记录（L230 正则提示 \u003cbasename: \u003c40-hex，期望 40 位十六进制）。 - 缺失：每个 in-scope 且未被排除的 .md 必须有 .zh.md（L186-193","bytes":11866,"lines":94,"body":"## 官方门禁拆解 · 报告 E：配对与配置校验门\n\n本文件是子代理原始报告的存档，未做改写；正文行号均指 `DSHfork/scripts/` 下的对应文件。\n\n# DSH Gates 双脚本精读报告\n\n> 状态：记录（推断 · 2026-09-12）\n\n## A. 两个脚本解决什么问题\n\n| 脚本 | 一句话 | 触发条件 |\n|---|---|---|\n| `verify-translation-pairing.ts`（357 行） | 强制「英文源 `.md` ↔ 中文 `.zh.md` ↔ `.i18n.yaml` 哈希记录」三元组齐全、结构等价、且自上次确认后字节未单边漂移（顶注 L1-11） | `doc-sync` 的叶子门禁（L350 自述「still runs in doc-sync」）；pre-commit 用 `--cached` 走 git index（L6-8、L504） |\n| `verify-cordis-config.ts`（564 行） | 校验 Cordis Loader 配置的条目元数据（只有 `disabled` 可含 `!!js`）与「配置引用的包是否在解析面 package.json 中声明」（顶注 L1-11） | `if (import.meta.main)` 守卫（L60），配置范围由 `cordisConfigFiles(root)`（L61）决定 |\n\n## B. verify-translation-pairing 实现要点\n\n- **配对定义 = 纯命名约定，不是 frontmatter**：`translationPairPaths(anchor)` 由英文锚点推出三件套（L109、L154）；`.i18n.yaml` 是两行 git blob 哈希记录（L230 正则提示 `\u003cbasename>: \u003c40-hex>`，期望 40 位十六进制）。\n- **缺失**：每个 in-scope 且未被排除的 `.md` 必须有 `.zh.md`（L186-193）；三者不齐报 incomplete（L216-220）。锚点取 `.zh.md` 与 `.i18n.yaml` 的**并集**，所以半边删除从任一残骸都能抓到（L198-200）。范围 glob 见 L79-84。\n- **多余**：被 manifest 排除的文件若存在 `.zh.md`/`.i18n.yaml` 也报错（L211-215）。\n- **不同步**：记录哈希与当前内容不符（L234-242）；链接指向错误语言（L252-268）；生成区（marker 分隔）规范化后必须逐段一致（L270-300）；zh 侧缺语言切换器（L304-309）；结构签名 diff（L310-327，覆盖列表种类/起始序号/表格行列）。\n- **白名单/排除**：唯一机制是 `scripts/translation-pairing.manifest.json`，只含 `excluded` 数组（实测 13 行、9 条），目录项以 `/` 结尾表示整目录且不做前缀误匹配（L93-101）。没有「允许内容不同」的宽泛白名单，只有窄豁免（成对文档路径、locale 链接归一化）。\n- **错误信息**：`${file}: 原因` 或 `${source} ↔ ${zh}: diff`；链接违规**带行号** `${violation.sourcePath}:${violation.line}`（L266）。每条都给动作指引（\"bring the other side along, then re-record with --write\"）。全部落 stderr、缩进两空格（L355-356）。\n- **退出码/模式**：`--list` 状态表+计数、exit 0（L336-346）；`--write [pairs…]`/`--write --all` 记录哈希并写 sidecar、exit 0（L150-180）；`--cached` 走 index（L56-57）；参数错误 exit 2（L48-53）；违规 exit 1（L357）。\n\n## C. verify-cordis-config 实现要点\n\n- **校验对象**：条目元数据（`id/name/group/inject/intercept/isolate` 必须静态，L39；仅 `disabled` 可 `!!js` 且必须可解析——用 `new Script()` 只编译不执行，L534-543）+ 插件包解析。\n- **读 package.json 作为权威：是**（`readManifest` L465-467），且按「谁消费」分解析面：apps/cli shipped 配置与 examples 用 `apps/cli/package.json` dependencies + 各 bundle dependencies（L232-248）；apps/cli/tests 用 deps+devDeps（L249-254）；各 bundle 的 patch 行从**该 bundle 自身** deps 解析（L257-265）；`packages/*/*/tests` fixture 从该包 deps/devDeps，并扫描 fixture 目录 `.ts/.mjs` 的 bare import（`ts.preProcessFile`，L335）。\n- **两类错误**：本脚本只处理「**存在但没声明**」——`missingPluginDependencies`（L441-463）报 `${locations}: ${pkg} must be declared in ${owner}`；并带出 chooser 4 个运行期才暴露的后端包（L44-56、L456-458）。自引用豁免（L302、L384）。「声明了但不存在（装不上）」不由它负责（应属 runtime-closure/hygiene，未验证）。\n- **schema/路径/默认值**：无通用 JSON Schema，是手写形状校验（root 必须数组 L65-67，递归 `group.config`/`insert`/`include.patches` L197-220）；**用 TypeScript 编译器 API 做路径解析**：读 `tsconfig.base.json` 的 `paths`，`ts.resolveModuleName` 要求本地包解析到 `.ts/.tsx`，否则判为 built `lib/` 回退（L399-439）。无默认值填充。\n- 另有两条声明一致性：client 包 `exports[\"./client\"]` ↔ `dsh.client` 双向一致（L104-117）；preset 行不得与 host composition 同行，考虑 overlay 的 disabled 撤回（L137-161）。\n- **定位方式**：`${file}${path}`，path 是 JSON 式路径如 `[3].config[1].insert[0]`（L70、L199）；批量 stderr 后 `process.exitCode = 1`（L81-87），**不用 `process.exit()`**。\n\n## D. 共有工程约定\n\n- **入口**：translation 是顶层直接执行（无 main、无顶层 await、全同步）；cordis 用 `import.meta.main` 守卫（L60），以便 spec import 纯函数不触发门禁。\n- **报错退出**：先攒 `errors: string[]` 再一次性打印（fail-soft 汇总，非首错即停）；translation 用 `exit(0/1/2)` 三态，cordis 用 `exitCode = 1`。成功也打印一行计数（L86、L351、L178）。\n- **纯函数与 I/O 分离**：脚本顶层只做 glob/read 与编排，判定抽到具名函数或独立模块（`translation-pairing.ts`、`-record.ts`、`-git.ts`、`-links.ts`；`cordis-config-files.ts`、`cordis-yaml.ts`）。\n- **空语料守卫**：cordis 显式 fail-loud：`found no package-owned Loader configs`（L319-321、L341-343）——门禁发现为空必须失败。\n- **测试**：vitest（spec L10）。`translation-pairing.spec.ts` 9 组 describe、33 个 it，覆盖 git blob 存储/index 读取、manifest 解析、链接语言等价、记录 round-trip、结构签名、CLI 参数归一化、生成区标记；`verify-cordis-config.spec.ts`（155 行）9 个 it，直接 import 导出判定函数并用 `mkdtempSync` 造临时仓库。注意：`verify-translation-pairing.ts` **无同名 spec**，逻辑靠纯模块测。\n\n## E. 可搬到 SSiD 的骨架\n\n1. **双处声明一致性** → 套 C 的「引用集合 ↔ 权威清单」双向差集：解析 profile 与 template 得 `Map\u003cpkg, Set\u003c位置>>`，分别报「只在 profile」「只在 template」，位置带文件+JSON 路径。\n2. **vendor 四份 MD5** → 套 B 的「哈希记录 + 显式豁免」：以权威副本为基准逐份比对；若想避免「四份同时被改」漏检，照 `--write` 先写一份 `.md5.json` 基线再比对。官方用 `gitBlobHash` 而非 MD5，SSiD 用 `crypto` MD5 等价。\n3. **BOM 扫描** → 官方这两个脚本**都没有**（`scripts/*.ts` grep `uFEFF|BOM|byte-order` 零命中，`verify-*.ts` 名单里也无编码类门禁），需自写，但套其结构：读 Buffer 判前三字节 `EF BB BF`。\n\n```ts\nif (import.meta.main) {\n  const errors: string[] = []\n  const files = globSync([...])            // 统一 '\\'→'/'\n  if (files.length === 0) errors.push('scan found no manifests')   // 空语料即失败\n  const prof = pluginMap('profile/.../profile.json')               // Map\u003cpkg, loc>\n  const tpl  = pluginMap('profile-template/.../profile.json')\n  for (const [p, loc] of prof) if (!tpl.has(p)) errors.push(`${loc}: ${p} declared in profile but not in profile-template`)\n  for (const [p, loc] of tpl)  if (!prof.has(p)) errors.push(`${loc}: ${p} declared in profile-template but not in profile`)\n  const base = md5(read(VENDOR[0]))\n  for (const f of VENDOR.slice(1)) { const h = md5(read(f)); if (h !== base) errors.push(`${f}: md5 differs from ${VENDOR[0]}`) }\n  for (const f of [...json, ...ts]) { const b = readFileSync(f)\n    if (b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) errors.push(`${f}:1: UTF-8 BOM`) }\n  if (errors.length) { console.error('verify-ssid-gates:'); errors.forEach(e => console.error(`  ${e}`)); process.exit(1) }\n  console.log(`verify-ssid-gates: ${files.length} files passed.`)\n}\n```\n判定函数（`pluginMap`/`md5Mismatches`/`bomProblem`）导出，spec 用 vitest + `mkdtempSync` 测 6 类：正常、profile 缺项、template 缺项、BOM 命中、MD5 差异、空扫描 fail-loud。\n\n## 未验证项\n\n① 两脚本在 `run-gates.ts` 中的确切注册位置；② 「声明了但不存在」由哪个门禁负责；③ SSiD 的「vendor 四份」具体指哪四个位置。\n\n## 本次补记\n\n### 1. `.i18n.yaml` 哈希记录格式（父 agent 核实 + 本代理复核）\n\n- **路径**：`\u003cbasename>.i18n.yaml`，与 `\u003cbasename>.md`、`\u003cbasename>.zh.md` 同目录；由 `translationPairPaths` 推导（`translation-pairing-record.ts` L31-40），反向由 `translationPairPathsFromMeta` 推导（L48-53）。\n- **内容**：`renderTranslationPairingRecord`（L86-98）以 `join('\\n')` 输出 **4 行 `#` 注释头 + 2 行哈希 + 1 个空行**，故文件以恰好一个换行结束。实测样本 `DSHfork/docs/api-gateway.i18n.yaml`：L1-4 为注释头（第 4 行是 `#   pnpm run verify-translation-pairing --write docs/api-gateway.md` 重录命令），L5 为 `\u003cbasename>.md: \u003c40位hex>`，L6 为 `\u003cbasename>.zh.md: \u003c40位hex>`。\n  - 父 agent 原述为「3 行 `#` 注释头」；实测为 **4 行**，此处按实测记录（差异仅在注释头行数，机制描述无误）。\n- **解析**：正则常量名为 **`META_LINE`**（非 `PAIR_META_LINE`），值 `/^([^:#]+\\.md): ([0-9a-f]{40})$/`（L23）。`parseTranslationPairingRecord`（L62-77）跳过空行与 `#` 开头的行；任何非注释行不匹配该正则、key 重复（L70）、或最终哈希数不为 2（L75）都返回 `undefined`，即**malformed 而非静默缺失**，由门禁按「malformed consistency record」报错（`verify-translation-pairing.ts` L229-231）。\n- **重录**：`--write \u003csource>`（`verify-translation-pairing.ts` L150-180；渲染出的提示命令即 `pnpm run verify-translation-pairing --write \u003csource>`，L94）。\n\n### 2. vendor 四份副本：应实时直接比对，**不要照搬记录式哈希**\n\n**记录式哈希存在的理由**：双语对的两侧内容**本来就不同**（英文原文 vs 中文译文），无法直接互比。记录式解决的是「两侧无法互比」——先把「上次确认一致时的两侧字节哈希」记下来，之后各自与记录比对，任一侧漂移即报警。\n\n**SSiD 的 vendor 四份副本语义相反**：它们是**应当完全相同**的副本，因此可以直接互比，不存在「无法互比」这一前提。照搬记录式会带来两个坏处：\n\n1. **有毒合法化通道**：记录式配套一条重录路径（`--write`）。若四份中有一份被误改后有人执行了重录，不一致会被永久合法化为「确认态」，门禁从此对这份差异沉默。直接比对没有这条通道——四份不一致就是不一致，无所谓「上次确认过」。\n2. **纯负担**：记录式需要额外维护 4 份（或 1 份基准）sidecar 文件与重录流程，还引入「基线本身可能是错的」这一新失效模式；对「应当完全相同」的副本毫无收益。\n\n**建议做法**：以一份**权威副本**（例如 `profile-template` 下那份，或 npm 上架所用的那份）为基准，其余三份实时逐字节/MD5 比对，不写 sidecar、不提供重录入口。若确实需要固化基准值，应使用外部固化值（架构约定、上一版本的归档产物），而不是「上次跑门禁时看到的字节」——后者正是记录式哈希的固有风险，也正是这里不该沿用的部分。\n\n**一句话**：记录式是给「两侧本就不同、必须记住共同确认态」的双语对用的；vendor 四份是「本就相同、可以当场互证」的副本，套用记录式既多余又会打开合法的漂移缺口。\n"},{"file":"2026-09-10-DSH官方Gates拆解原始报告-F-run-gates编排.md","date":"2026-09-10","slug":"DSH官方Gates拆解原始报告-F-run-gates编排","title":"DSH官方Gates拆解原始报告-F-run-gates编排","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["ssid-shell","dsh-ssid-panels","dsh-capture","dsh-context-doctor","dsh-dream-skin","dsh-quick-toolbar","dsh-ssid-zh-ui","#5"],"summary":"本文件是子代理原始报告的存档，未做改写；正文行号均指 DSHfork/scripts/run-gates.ts。","bytes":13883,"lines":78,"body":"> 状态：记录（推断 · 2026-09-12）\n\n## 官方门禁拆解 · 报告 F：run-gates 编排\n\n本文件是子代理原始报告的存档，未做改写；正文行号均指 `DSHfork/scripts/run-gates.ts`。\n\n## A. 数据模型\n\n**Mode（24–42）17 个聚合名**：ci-primary、ci-linux-primary、ci-static、ci-lint-contracts-ready、ci-coverage、ci-bench、ci-snapshot、ci-artifacts、ci-consumers、ci-windows-blocking、ci-windows-complete、ci-windows-observational、node-compat、check-all、hygiene、doc-sync、doc-quick。parseMode（134–159）是白名单 switch，非法值抛错并回显全部合法 mode。\n\n**Gate（47–63）**：`id`（图的键，依赖按 id 引用）、`label`（人读名，默认=script 名，202）、`displayCommand`（只在诊断里打印的人类可读命令，203）、`command`+`args`（真正 spawn 的，199–207 由 pnpmInvocation 生成）、`needs`（强依赖：必须 passed）、`after`（弱依赖：只需 settled，不看结果，54 注释）、`env`（合并进 process.env，1069）、`quick`（供 doc-quick 过滤，776–778）、`allowFailure`（失败可见但不拖垮聚合，59/118/1573）、`streamOutput`（实时透传不缓冲，61）。**没有** platform/timeout/retry/cwd 字段（cwd 恒为仓库根 root，1068）。\n\n**状态机（43–44）**：`GateResultStatus = passed|failed|skipped`；`GateState = pending|running|\u003c终态>`。迁移 pending→running（937）→passed|failed（1270，判据 `exitCode===0 && signalCode===null && 无 spawnError`）；另有两条直接落 skipped 的边：needs 已失败时对下游 pending 当场构造 skipped（957–972），fail-fast/宿主中断把剩余 pending 全置 skipped（946–953、989–995）。`aborted`（74–77、979–982）保证被中止的结果即便 exit 0 也改写为 skipped，不误报 pass。\n\n## B. 依赖与调度\n\n依赖只有两种表达：needs 强、after 弱，判定在 predecessorsReady（1035–1038）。构造后先校验：validateGateGraph（814–837）拒空图/重复 id/未知依赖；findDependencyCycle（839–869）DFS 三色找环，needs 与 after 一起参与（854）。\n\n调度是单进程手写循环 runGates（897–1008）：每轮 `while (running.length \u003c maxActive)` 找第一个 ready 的 pending 启动（934–941，FIFO，故长门应排前，见 726 注释）；无新启动则 `Promise.race` 等任一子进程结束（976–983）；pending 且 needs 已失败时当场生成 skipped（955–972）；否则抛 `validated graph stalled`（958）。\n\n并发度：defaultConcurrency（168–187）用 `node:os.availableParallelism()`（导入 10、默认参数 171）；ci-consumers 放开为 gate 总数（173，其内部还要嵌套跑子 runner），check-all/hygiene/doc-sync/doc-quick 封顶 4（176–186，注释：doc 门各自建整棵 ts.Program，不封顶会内存爆）；`DSH_GATE_CONCURRENCY` 覆盖（107–108、189–197），来源串在 114 行打印。\n\nNode API：spawn/spawnSync（8）、readdirSync/readFileSync（9，读 /proc）、availableParallelism（10）、resolve（11）、performance（12），另有 AbortController、`process.kill(-pid)`、setTimeout/setInterval。**「bounded in-process scheduling」** = 934–941 容量闸 + 976 单点 race 等待 + 168–197 上限计算，全在同一 Node 进程内，不引入 worker/队列服务。\n\n## C. 聚合与命令\n\n注释 4–5 行：`Package scripts own public aggregate names; this runner owns their validated dependency graphs, scheduler environment, and process diagnostics.` 落地：package.json 77–91 每个聚合一行 `tsx scripts/run-gates.ts \u003cmode>`，且非同名映射——`check:all`→check-all（77）、`check:ci`→ci-primary（78）、`test:docs`→doc-quick（116）、doc-sync/hygiene 同名（170–171）。**所以用户敲的是 `pnpm run check:all`，`pnpm run check-all` 并不存在。**\n\n链路：pnpm→tsx→parseMode→gatesForMode（232–296）拼 Gate[]（每门最终仍是 `pnpm run \u003cscript>`，199–207）→defaultConcurrency→runGates→逐门 spawn→printSummary→只要存在非 allowFailure 的 failed/skipped 就 exit 1（118–120）。子进程不经 shell：pnpmInvocation（pnpm-invocation.ts 9–21）从 `npm_execpath` 推出 `process.execPath` + pnpm 入口，缺 npm_execpath 直接抛错。门本身仍是 package script，可单独 `pnpm run typecheck` 复现。\n\n## D. 输出与诊断\n\n收集（1073–1082）：stdout/stderr 均 `setEncoding('utf8')`，data 事件 push 进 `GateOutputChunk[]`（带 stream 归属）；仅 `streamOutput===true` 实时写父进程（1076、1080），否则缓冲到结束。\n\n打印（1541–1557）：pass 且非 `DSH_GATE_VERBOSE=1` 只一行 `PASS label (x.xxs)`；其余打 `== STATUS label (s) ==` + `command: displayCommand` + `outcome:`，outcome 由 formatGateResultReason（1533–1539）把 error / `exit N` / `signal X` 三类事实全列出（缺省 `no exit code or signal`），互不遮蔽。汇总（1559–1577）：总 passed/failed/skipped + 总时长，再逐条列不成功门，allowFailure 加 `NON-BLOCKING` 前缀（1573）。\n\n计时有（per-gate 1058/1274，聚合 113/117）；重试全文无；per-gate 超时也没有——只有中止路径上的分级宽限：SIGTERM 后 5s SIGKILL（1148）、8s 内确认整树静默否则打 `gate tree not quiescent after 8s`（1237–1262，报错在 1256）、10s 强断 stdio 防挂死（1160–1165）。coverage 的 vitest 超时（614）是传给子命令的参数而非看门狗。\n\n**「process diagnostics」** = 子进程输出的归属与重放 + 退出码/信号/启动错误三类事实 + 进程树终止与静默确认（1091–1265）+ 并发来源与 fail-fast 原因行（114、988）。\n\n## E. 环境与条件\n\n开关（均环境变量）：`DSH_GATE_CONCURRENCY`（107）、`DSH_GATE_FAIL_FAST`（仅接受 '1'，684–689）、`DSH_GATE_VERBOSE`（1542）、`DSH_WEB_SNAPSHOT_WORKERS`（≥2，491–503，决定 test:web:ci 还是 test:web:built）、`DSH_OXLINT_THREADS`（575）、`DSH_NODE_COMPAT_SKIP_TYPECHECK`（348）、`DSH_COVERAGE_MAX_WORKERS`（601–609，按 2:1 切给 instrumented 与 exempt 两门）、`DSH_COVERAGE_PARTITIONS`（615–632，改走 partitioned script）、`DSH_COVERAGE_TEST_TIMEOUT_MS`（614）、`DSH_COVERAGE_EXEMPT_HEAVY`（coverage-exempt.ts:26，传给子进程的豁免标记）、`DSH_BUILD_CLIENT_PROFILE=official`（209–215）、`DSH_DOC_TYPECHECK_USE_BUILD_OUTPUT=1`（279、424、479）、`DSH_SNAPSHOT=replay` 与 `DSH_EXAMPLE_MODE=lib`（505–509、653、662）、`DSH_REQUIRE_BUILT_CLI_SMOKE`（398）。\n\n平台/环境造成的「跳过」：runner 无运行期打 skip 的机制（skipped 只来自 fail-fast 与依赖链），条件性全在构造期——nodeCompatGates 在 `runningNodeMajor() !== 22` 时丢掉 build/build:web（351–365）；doc-quick 只取 `quick===true` 的叶子（776–778）；ci-windows-complete 把 observational 门标 allowFailure（526–537）。子命令内部自跳（如无 `DEEPSEEK_API_KEY` 的 e2e）不经过 runner，其实现**未验证**。\n\n## F. 给 SSiD 的取舍（5–10 个检查脚本）\n\n**只有大规模才需要的复杂度（别搬）**：① needs+after 双依赖与环检测（814–869）——它为「产物读者与写入者互斥」而生（447–461 的 dev:web 与产物读取、526–536 的两种 VitePress 模式同目录不可重叠）；② 手写并发调度 + availableParallelism 上限（168–197、934–941）——10 个门串行也就几分钟；③ fail-fast 的进程树终止体系（1091–1265、1377–1508：detached、`kill(-pid)`、Windows `taskkill /T`、后代采样缓存、SIGKILL 升级、静默确认、stdio 强断）——被 vitest worker / dev server / 编译器这类会留后代的子进程逼出来的；④ 十几个 `DSH_*` 开关与 allowFailure/streamOutput/quick 的多样语义；⑤ 嵌套 runner（464–467 的 ci-consumers 门里再跑 check:node-compat）。\n\n**一开始就该有（形状可抄，实现可缩到约 150 行）**：① 单入口 + 白名单 mode 校验（134–159）；② 门表数据化、命令与展示名分离（47–63、199–207），并 shell-free 起进程（pnpm-invocation.ts）——Windows 上避开 shell 引号/转义坑；③ 依赖失败 ⇒ 下游 skipped，绝不误报 passed（957–972、1035–1046）；④ 逐门计时 + 明确退出码契约（113–120、1270），CI/发版脚本只认退出码；⑤ 失败打 displayCommand + exit/signal/error 三类事实（1533–1539、1549–1556），且每个门自带 `文件:行` 定位——BOM/旧名/vendor MD5 类门没有定位等于没跑；⑥ 每个检查一个独立脚本 + 稳定 script 名（77–91 与 4–5 行注释的约定），便于单独复现、单独入 CI 作业；⑦ 平台条件门用构造期过滤 gate 列表（351–365）而非运行期 skip 状态，少一个状态维度。\n\n**落到 `check-rules` 的具体建议（未验证 SSiD 现有结构）**：profile vs template 逐键对比、BOM 扫描、旧名残留、vendor MD5 各做一个 `scripts/check-*.ts`，package.json 各一行 script，`check:rules` = 顺序跑 4 个并汇总退出码；只有 vendor MD5 依赖构建产物时才加一条 needs 边；门数上 10+ 或单轮超 2 分钟，再引入并发与 fail-fast。\n\n## 本次补记：SSiD 侧真实结构核实结果\n\n下列事实本次由本代理实际读取文件/目录核实（非推测），用于修正上节 F 中「未验证 SSiD 现有结构」一句。\n\n**1. 壳库根目录没有 package.json。** `seek-soul-in-darkness/package.json` 不存在（glob 无结果，已核实）；脚本家在 `seek-soul-in-darkness/shell/`，该目录有 `package.json`（133 行，`name: ssid-shell`、`version: 0.2.1`、`private: true`、`type: module`）与 `scripts/`。\n\n**2. `shell/package.json` 现有 scripts（第 8–16 行，逐字）**：`start`（`electron .`）、`typecheck`（`tsc --noEmit -p tsconfig.json`）、`smoke`（`node --import tsx/esm boot-smoke.ts`）、`test`（`node --import tsx/esm --test tests/profile-merge.spec.ts tests/codegraph-adapt.spec.ts`）、`test:profile-merge`、`test:codegraph-adapt`、`pack`（`npm run bundle-kernel && electron-builder --win`）、`bundle-kernel`（esbuild 打 `kernel.bundle.mjs`）、`pack:mac`。**运行器是 `npm run`，不是 pnpm**（`pack` 脚本第 14 行自证）。\n\n**3. `shell/scripts/` 现有内容（已核实）**：`after-pack.cjs`、`boot-bundled.mjs`、`prepare-runtime.mjs`、`repack-open-sea-skin-vendor.mjs`、`verify-deploy-rename.mjs`；另有 `probes/` 下 4 个：`fake-worker.cjs`、`probe-worker-packaged.mjs`、`probe-worker-source.mjs`、`verify-pack.mjs`。\n\n**4. `verify-deploy-rename.mjs`（72 行）是唯一的 verify 先例，且没有退出码契约（已核实）**：第 1–2 行是中文注释；第 7 行 `const base = fileURLToPath(new URL('./tmp-deploy-test', import.meta.url))` 建临时目录；第 38–39 行失败路径只 `console.log('  [FAIL] ...')` 后 `return false`；第 50/52 行把 `ok1`/`ok2` 打成「成功/失败」文本；第 64 行把预期内的失败打成「失败(符合预期)」；第 69 行固定打印 `ALL CHECKS DONE`；全文唯一的非零退出是第 72 行 `run().catch(...)` 里的 `process.exit(1)`，即只有未捕获异常才非零。**结论：脚本正常走完必然 exit 0，任何检查失败对 CI/发版都不可见。** 新的 check-rules 若沿用这一形状（中文注释 + 临时目录 + 逐场景 console.log），必须额外补上 F 节第 ④ 条的退出码契约：收集各项检查的通过/失败状态，失败时 `process.exitCode = 1`（或显式 exit 1），并让聚合脚本把子脚本退出码向上传递——否则「四份核」跑出红字也拦不住发版。\n\n**5. 目标检查共四项（手册待办 #5）**：profile vs template 声明逐键对比、BOM 扫描、旧名残留、vendor MD5 四份核。\n\n**6. 「vendor 四份」已核实为以下四个位置**（前三项本次实测存在；第 2、3 项为当前用户环境路径）：\n- 源头：`seek-soul-in-darkness/plugins/\u003cpkg>/lib/**`（已核实存在，如 `plugins/dsh-ssid-panels/lib/client.js`）\n- `~/.dsh/profiles/web/vendor/\u003cpkg>`（已核实存在；实测包集合：dsh-capture、dsh-context-doctor、dsh-dream-skin、dsh-quick-toolbar、dsh-ssid-panels、dsh-ssid-zh-ui）\n- `~/.dsh/profiles/ssid/vendor/\u003cpkg>`（已核实存在；实测包集合：dsh-capture、dsh-context-doctor、dsh-quick-toolbar、dsh-ssid-panels、dsh-ssid-zh-ui）\n- `seek-soul-in-darkness/shell/profile-template/vendor/\u003cpkg>`（已核实存在；实测目录含 dsh-capture、dsh-context-doctor、dsh-quick-toolbar、dsh-ssid-panels、dsh-ssid-zh-ui）\n\n**注意（本次实测发现，供 check-rules 设计参考）**：四处 vendor 的包集合并不一致——`web` 比 `ssid` 多出 `dsh-dream-skin`，而 `profile-template` 与 `ssid` 的集合一致。因此「vendor MD5 四份核」不能简单地求四份全等：需要先确定「本应参与核对的包集合」与源头的对应关系（哪些包由 `plugins/\u003cpkg>/lib/**` 派生、哪些是外部引入不参与四份比对），否则会把集合差异误报成 MD5 不一致。`dsh-dream-skin` 的归属规则本次未验证，建议在设计 check-rules 时一并确认。\n\n**7. 对 F 节第 ② ⑥ 条的落地修正**：runner 与检查脚本应放 `shell/scripts/`（与该目录既有形状一致），聚合 script 进 `shell/package.json`（`npm run check:rules` 之类），命名风格沿用现有 `verify-*.mjs` / `check-*.mjs`；F 节第 ② 条提到的「shell-free 起进程」在 SSiD 侧的对应做法是 Node `spawn(command, args)` 直接起 `node`（不经 `sh`/`cmd`），`pnpmInvocation` 那套 `npm_execpath` 解析在 npm 环境下是否同样可用，本次未实测。\n"},{"file":"2026-09-10-DSH过程决策精读-01-门禁体系.md","date":"2026-09-10","slug":"DSH过程决策精读-01-门禁体系","title":"DSH 过程决策精读 · 第 01 批：门禁体系","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["#8"],"summary":"2026-06-11-quality-gates.md · 被后续多篇引用为 \"the whole quality story is mechanical gates\"","bytes":19606,"lines":296,"body":"# DSH 过程决策精读 · 第 01 批：门禁体系\n\n> **读的是什么**：`DSHfork/.agents/notes/implemented/process/` 下的决策记录（Agent Notes），共 94 篇，本批 5 篇。\n> **为什么读它**：源码只说明\"他们做了什么\"，判断标准、成立条件、被否决的方案只在决策记录里。本笔记记的是**他们凭什么这么判断**。\n> **本批覆盖**：2026-06-11 → 2026-08-19，正好是这套门禁体系从总纲到成熟期的完整弧线，其中包含一次\"删掉门禁\"的反面案例。\n> **读法提示**：每篇的「被否决的方案」比「决定」更有信息量——决定告诉你结果，否决告诉你边界。\n\n> 状态：记录（推断 · 2026-09-12）\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [机械质量门禁胜过散文约定](#1-总纲机械质量门禁胜过散文约定) | 整套体系的前提：开发主要由 agent 完成 |\n| 2 | [双语配对门禁](#2-双语文档配对门禁) | 6 个被否决方案 + 一段业界先例调研 |\n| 3 | [文档分层与预算](#3-文档分层与字数预算) | 字数这个粗糙代理是刻意接受的 |\n| 4 | [并行 pre-push 门禁](#4-并行-pre-push-门禁) | 每条设计取舍都源于\"拒绝第二份真相\" |\n| 5 | [移除 Knip](#5-移除-knip反面案例) | 什么情况下该**删掉**一个门禁 |\n\n---\n\n## 1. 总纲：机械质量门禁胜过散文约定\n\n`2026-06-11-quality-gates.md` · 被后续多篇引用为 \"the whole quality story is mechanical gates\"\n\n### 他们遇到的事\n\n这个代码库**主要由编码 agent 开发**。早期出过一次事故：类型检查不通过的测试被提交了——因为 vitest 不做类型检查，而这个问题是被人工评审发现的。换句话说，靠的是运气和人的注意力。\n\n### 判断\n\n每一条**可机械检查**的 `AGENTS.md` 承诺，都必须配一条能非零退出的命令。分工是：CI 跑穷尽集，Git hooks 只把延迟预算留给廉价的本地缺陷。\n\n### 凭什么这么判断\n\n> Agents follow enforced gates far more reliably than prose conventions, and \"a lot of work\" is not a cost argument when agents do the labor.\n\n三句话，三件事：\n\n1. **规范的对象是 agent，不是人**——agent 服从机械强制远比服从散文约定可靠。这不是在说人自觉性差，是在说 agent 的服从模型就是这样。\n2. **\"工作量大\"不构成成本论据**——因为干活的是 agent。这句话直接否决了\"写门禁太费事所以算了\"这种想法。\n3. 因此真正的筛选标准不是\"值不值得写脚本\"，而是**\"这条约定能不能被机械判定\"**。\n\n### 他们承认的代价\n\n原文明写了两条，没有藏：\n\n- 门禁本身是**需要维护的代码**，配置变更要像普通改动一样被评审\n- **100% 覆盖率压力会催生没有断言的测试**——对冲手段是变异测试（当时还在提案阶段）\n\n### 被否决的方案\n\n这篇写于格式确立之前，末尾有一行显式豁免注释：`\u003c!-- agent-note-format: alternatives-not-recorded (pre-format Agent Note) -->`。**没有 Alternatives 段这件事本身被记录在案，而不是静默缺失。**\n\n---\n\n## 2. 双语文档配对门禁\n\n`2026-07-02-bilingual-docs-and-pairing-gate.md`\n\n### 他们遇到的事\n\n文档语料要被公司内外的人**和 agent**用中英双语阅读。靠人工维护第二语言、没有任何机制，就是翻译腐烂的标准剧本：一侧前进了，另一侧静默地说着假话，而且没有任何门禁会发现。\n\n原文给这类问题的定性很干脆：*\"The repo's standing answer to invariants of this kind is to encode them as a mechanical check\"*——**这类不变量的标准答案，就是把它编码成机械检查。**\n\n### 判断\n\n一对文档 = 三个兄弟文件：英文 `foo.md`、中文 `foo.zh.md`、一致性记录 `foo.i18n.yaml`。\n\n关键设计：\n\n- **两侧地位平等，没有\"原文\"**——可以先写中文再翻英文，也可以反过来。约束只有一条：两侧必须说同一件事，且**配对整体合并**（两种语言加记录，从不单独一个）\n- 记录里存**两侧的 git blob 哈希**（截至上次确认一致的状态）\n- 重录要点名确认配对（批量重录是显式的 `--write --all`）\n- 清单文件**只包含显式排除项**\n- **全语料一个要求**：一篇文档从创建起就要求完整配对，没有 per-file 过渡态、没有日期截止线、没有 README 专属类别\n\n### 凭什么这么判断\n\n**为什么记录 blob 哈希而不是 commit 哈希**（他们明确参考并否决了 MDN 的 `l10n.sourceCommit` 模型）：\n\n> a same-PR edit has no commit hash yet, so the MDN model cannot express \"consistent as of the state this PR introduces\", and verifying it requires git history instead of file content.\n\n同一个 PR 里的编辑还没有 commit 哈希；而且验证要查 git 历史，而不是读文件内容。**核心判断：验证应当基于内容，不基于历史。**\n\n**为什么重录必须显式点名**：*\"confirming consistency is an explicit, visible act in the PR\"*——确认一致必须是一个可见的动作，而不是顺手批量刷过去。\n\n**为什么清单只列排除项**：*\"so no requirement can bypass discovery and receive a weaker check\"*——不能让任何条目绕过发现流程、从而获得更弱的检查。**绕过必须在结构上不可能。**\n\n### 他们承认的代价\n\n> When the two sides disagree, no mechanical rule picks a winner — the PR review does. That is the price of equal authority, accepted deliberately.\n\n两侧冲突时，**没有机械规则能判定谁对，由 PR 评审决定**。这是\"对等权威\"的定价，**刻意接受**——因为另一条路（指定一种语言为原文）会禁掉中文优先撰写。\n\n另一条代价：每对多一个文件。但因为记录是机器写的（`--write`），成本是**目录噪声，不是维护工作量**；换来的是\"谁在何时确认过一致\"可以从 yaml 的 git blame 直接回答。\n\n### 被否决的方案（6 个）\n\n| 方案 | 否决理由 |\n|---|---|\n| 英文为原文 + 在翻译文件里存指纹（单向 EN→ZH） | 团队要中文优先撰写、双语对等权威，单向模型表达不了这一点。（**但 blob 哈希机制被保留**，只是从\"文件内\"挪到了 sidecar） |\n| locale 目录（`docs/en/` + `docs/zh/`，K8s/ECharts 模式） | 本仓库没有把 locale 映射到路由的文档站框架；移动所有英文文件会搅动全部交叉引用；链接检查需要路径映射逻辑而不能原样工作 |\n| 独立翻译仓库（PingCAP `docs`/`docs-cn` 模式） | 对独立发布节奏的文档产品是对的，对 monorepo 自己的文档是过度设计；而且**把翻译放到了本仓库门禁触及范围之外** |\n| 单文件交错双语 | 每条 diff 翻倍；破坏\"一段一行\"的 diff 工效；**局部不一致变得不可见** |\n| commit 哈希记录（MDN 模型） | 同 PR 编辑还没有 commit 哈希 |\n| 比较两侧的 git 时间戳（不存记录） | 纯格式编辑会**假阳**；无关编辑之后提交的对应文件会**假阴**——**内容同一性是唯一有意义的信号** |\n\n### 顺带：一段业界先例调研\n\n这篇里有一段很值得学的做法——他们在决定前调研了业界：\n\n- **中文大厂的惯例**是配对的同后缀文件（ant-design `index.zh-CN.md`、arco-design、ShardingSphere 的 387 对 `.cn.md`/`.en.md`）——**但没有任何一个仓库在 CI 里强制配对或一致性**，全靠评审\n- **一致性自动化反而在中国之外**：MDN 的 `l10n.sourceCommit`、Vue 的 Ryu-Cho（上游提交监视器，为过时翻译开 issue/PR）、K8s 的本地化漂移脚本、微软 Azure 的 co-op-translator\n- **他们的设计是两者的合成**：中文生态的文件布局 + 哈希配对门禁 + 用 agent 工作流替代 bot 服务\n\n---\n\n## 3. 文档分层与字数预算\n\n`2026-07-04-doc-tiers-and-budgets.md`\n\n### 他们遇到的事\n\n常设文档在积累重复的规则、复述事故经过、重复包地图、过时的 Agent Note 摘要——**尽管当时已经有写作指导**。\n\n原文对原因的判断只有一句：*\"Because review alone did not prevent that growth, the repository needed a mechanical budget alongside its documentation taxonomy.\"*——**因为评审不足以阻止增长。**\n\n### 判断\n\n- **结构跟随文档树**：一份文档拥有自己主题的细节，只总结直接子项的用途、职责和高层行为，并链接到更深的拥有者\n- **一个事实一个家**（one home per fact）：禁止在自己的层级之外复述\n- **窄而硬的预算门禁**：受预算的文件若**缺失也判失败**，这样重命名不能静默地让它的预算成为孤儿\n- 范围**刻意**只覆盖容易膨胀的常设文档（各级 `AGENTS.md`、`architecture.md`、`packages/README.md` 及其接收被驱逐内容的策略文档）。**参考文档、Agent Note、完整的包 README 不设预算——因为穷尽式的事实可以很长**\n- **天花板是棘轮式的**：已达标的文档保留至少 5% 余量、上限随之下调；超标的文档上限被冻结、阻止继续增长直到达标；**提高天花板需要显式的 PR 理由**\n\n### 凭什么这么判断\n\n**为什么不要\"只靠 skill + 评审纪律\"**：\n\n> the accretion above happened while the current-state rule and reviewer attention already existed; a prose rule with no mechanical backstop demonstrably does not hold here\n\n积累**就是在规则和评审注意力都在场的时候发生的**。散文规则没有机械兜底，在这里被证明不成立。\n\n**为什么不要\"覆盖所有文档的宽泛门禁\"**（这条极重要）：\n\n> a blanket ceiling punishes exactly the right kind of long doc (a feature matrix or type catalog where every row is a fact) and generates per-file override churn that trains contributors to rubber-stamp raises.\n\n一刀切的天花板**恰好惩罚了正确的长文档**（特性矩阵、类型目录，每一行都是事实），并产生逐文件覆盖的翻腾，**最终训练出贡献者橡皮图章式地批准提高上限**。——错误的门禁会训练坏行为，这比没有门禁更糟。\n\n**为什么字数这个粗糙代理可以被接受**：\n\n> Word count is a crude proxy accepted deliberately: it cannot judge quality, but it forces the relocation decision at exactly the moment content is being added, which is when the author has the context to place it correctly.\n\n字数**不能判断质量**，但它**恰好在内容被添加的那一刻**逼出\"该放哪\"的决定——而那一刻正是作者最清楚上下文的时候。**门禁的价值在强制决策的时机，不在度量的精度。**\n\n### 被否决的方案（4 个）\n\n| 方案 | 否决理由 |\n|---|---|\n| 只要 skill + 评审纪律，不要门禁 | 积累就发生在规则与评审都在场的时候；没有机械兜底的散文规则在这里被证明不成立 |\n| 覆盖所有完整文档的宽泛门禁 | 惩罚正确的长文档；逐文件覆盖的翻腾训练出橡皮图章式批准 |\n| 每个文档入口各写一套新手教程 | 重复的设置步骤会在命令顺序、首个成果、产品身份上漂移 |\n| 把标准放进 skill 里 | **契约住文档、工作流住 skill**；打包进 `SKILL.md` 的标准，对**不调用该 skill 就编辑文档的 agent 不可见** |\n\n---\n\n## 4. 并行 pre-push 门禁\n\n`2026-07-06-parallel-pre-push-gates.md` · 这就是 `run-gates.ts` 的出生证明\n\n### 他们遇到的事\n\n聚合任务（如文档同步）掩盖了长的**顺序链**，而链上的成员其实是只读且互相独立的。而在 workflow YAML 里复制这些叶子清单，等于给未来的脚本变更留下**多处漂移点**；串行跑包发布检查，则让一道门禁的耗时与包数量成正比。\n\n### 判断（数据化的调度设计）\n\n- `run-gates.ts` 拥有被 CI、`doc-sync`、按需的 `check:all` 共用的**有界调度器**\n- 在启动任何子进程**之前**，拒绝空图或有歧义的依赖图\n- `needs` 边：前置必须**通过**，否则跳过依赖方\n- `after` 边：只等前置**以任意结果结算**，然后仍允许后继运行\n- `allowFailure`：仍报告结果，但不让聚合失败\n- 默认**缓冲**可归因输出；只有声明了 `streamOutput` 的长协调者实时透传\n- 环境变量供不同资源规格的机器调整并发\n\n### 凭什么这么判断——看 6 条否决理由\n\n| 被否决的方案 | 否决理由 |\n|---|---|\n| 保持聚合任务串行 | 墙钟时间等于独立检查之和，还重复了命令包装器的启动开销 |\n| 每个叶子门禁声明一个 CI job | 并行度最大，但重复 checkout/setup/install 开销，且**在 YAML 里复制了调度器清单** |\n| 在 shell 脚本里后台跑子命令 | 能并行，但**丢失逐门计时、确定性的失败分组和直接的信号处理** |\n| 每个门禁都继承 stdio | 进度立刻可见，但互相独立的门禁输出被交错，且**调度器的可归因输出记录被丢弃** |\n| 每个包声明一个 `publint` job | 并行度最大，但产生**手工维护的包清单**，包一变就漂移 |\n| `publint` 无界并发 | 只在小仓库上减少耗时，代价是赌进程数、内存压力、tarball 创建和日志可读性 |\n\n**把 6 条否决理由放在一起看，会发现它们是同一个模式的 6 个变体**：每个方案都换来了某种即时好处，但代价要么是\"**产生第二份需要同步的东西**\"（YAML 清单、包清单），要么是\"**丢失可归因性**\"（计时、分组、输出归属）。理解了这个模式，后面再看他们的任何编排设计都能预判。\n\n### 他们承认的代价\n\n用\"慢的那条依赖链\"替代\"独立门禁之和\"，代价是**一个自定义调度器 + 一份显式的 mode 清单**。选定的长协调者则用跨门顺序和缓冲日志，换即时诊断。\n\n---\n\n## 5. 移除 Knip（反面案例）\n\n`2026-08-19-remove-knip.md` · **什么时候该删掉一个门禁**\n\n### 他们遇到的事\n\nKnip 从静态源码图推导未使用的文件、导出和依赖。但本仓库还做这些事：从包清单和配置加载 Cordis 插件、把 Typert face 生成进 `lib/`、拆分 Host/Client 程序、声明只被生成代码或运行期加载的代码消费的依赖。\n\n结果是：**为了让受支持的路径通过扫描，不得不维护一套 workspace 专属的入口清单和忽略依赖例外**。包和测试布局一变，就得维护那个\"可执行图的第二份近似\"。\n\n### 判断\n\nKnip 不再作为仓库依赖或质量门禁存在。仓库**不设**仓库级的未使用代码静态检查。\n\n### 凭什么这么判断\n\n这是整篇最关键的一段——他们不是凭\"这工具不好用\"删的，而是做了**覆盖分析**：\n\n> The repository already has narrower checks for the failures it treats as release contracts: TypeScript and Oxlint validate source imports, workspace constraints validate manifests, `verify-optional-dependency-imports` validates optional imports, `verify-runtime-closure` validates runtime dependencies, `verify-client-packages` validates Client packaging, and publint validates published packages. The generic unused-code result is advisory, while its exceptions are required maintenance.\n\n拆开是三个判断：\n\n1. **那些失败模式已经被 6 道更窄的检查覆盖了**——一个泛化工具提供的信息，绝大部分是冗余的\n2. **泛化结果是参考性的（advisory），而它的例外清单是必须维护的**——收益是软的，成本是硬的\n3. 例外清单的存在，让**普通的包变更依赖于一个不能代表组装后应用的源码图**\n\n### 被否决的方案\n\n| 方案 | 否决理由 |\n|---|---|\n| 保留 Knip 和它的例外清单 | 保住了宽泛的参考信号，但每个受支持的动态/生成路径都需要配置，而这些配置**重述了清单、构建配置和包专属检查已经拥有的事实** |\n\n### 他们承认的代价\n\n他们明确放弃了自动的宽泛未使用代码/依赖报告；评审和简化工作必须**针对真实的加载路径**证明删除是安全的。并且给未来的检查定了门槛：\n\n> A future unused-code check must understand manifest-driven Cordis loading, generated outputs, and the Host/Client split **without a per-workspace ignore inventory**.\n\n未来若要重新引入未使用代码检查，**必须理解清单驱动的 Cordis 加载、生成产物和 Host/Client 拆分，且不需要 per-workspace 忽略清单**。最后留下了那句判断：\n\n> a dependency with no source import is not dead-code evidence by itself.\n\n**一个没有源码导入的依赖，本身不构成死代码的证据。**\n\n---\n\n## 这批的共同判断标准\n\n跨 5 篇提炼，按我判断的重要性排序：\n\n**① 可机械判定的不变量必须编码成检查，散文规则不作数。**\n依据是两处独立印证：总纲的立场，以及预算门禁的\"积累就发生在规则和评审注意力都在场的时候\"。这是整套体系的地基。\n\n**② 代价的真正来源不是写脚本，是维护\"第二份真相\"。**\n`remove-knip` 的例外清单、`parallel-gates` 拒绝的 YAML 清单与包清单、`doc-budgets` 拒绝的逐文件覆盖——**三种不同的场景，同一个否决理由**。判断标准：任何要求你维护第二份清单的方案，都要重新审视它带来的收益是否值得。\n\n**③ 验证基于内容，不基于历史。**\n双语门禁同时否决了 commit 哈希和时间戳：前者在同 PR 场景下无法表达，后者既会假阳又会假阴。**内容同一性是唯一有意义的信号。**\n\n**④ 确认动作必须显式、可见。**\n重录要点名、批量要显式开关；豁免要留痕（连\"这篇没写 Alternatives\"都用注释标了出来）。**看不见的确认等于没确认。**\n\n**⑤ 不接受过渡态。**\n全语料一个要求，没有 per-file rollout、没有日期截止线、没有类别特例。过渡态是永久泄漏的开始。\n\n**⑥ 绕过必须在结构上不可能。**\n只列排除项，不列包含项——\"不能让任何条目绕过发现流程而获得更弱的检查\"。\n\n**⑦ 错误的门禁会训练坏行为。**\n一刀切的天花板\"训练贡献者橡皮图章式地批准提高上限\"。这条是对\"我们加个检查吧\"的**最强反驳**：门禁设计错了，比没有门禁更糟。\n\n**⑧ 门禁的价值在强制决策的时机，不在度量精度。**\n字数不能判断质量，但它恰好在内容被添加的那一刻逼出迁移决策——那是作者最清楚该放哪的时刻。\n\n**⑨ 删门禁和加门禁一样需要记录，且门槛更高。**\n`remove-knip` 给出了删除的三个条件：失败模式已被更窄的检查覆盖、泛化结果只是参考性而例外是硬维护成本、例外清单使普通变更依赖一份失真的图。\n\n---\n\n## 下一批（待读）\n\n按同一主题线，下一批候选：\n\n- `2026-07-05-uniform-agent-note-format.md` —— Agent Note 格式如何被机械化强制\n- `2026-07-21-serial-cross-platform-ci-reference.md` —— 跨平台 CI 的顺序化\n- `2026-08-02-native-github-stacks-and-optional-rebases.md` —— PR 历史的选择\n- `2026-08-09-concrete-prose-names-actors-and-recorded-facts.md` —— **文字规范**（与 CoT 泄漏探针直接相关）\n- `2026-08-10-event-directed-pr-review-status.md` —— 评审状态的事件驱动\n\n其中 `2026-08-09-concrete-prose...` 与待办 #8（CoT 泄漏探针）关系最紧，值得优先。\n"},{"file":"2026-09-10-DSH过程决策精读-02-文字规范与引用纪律.md","date":"2026-09-10","slug":"DSH过程决策精读-02-文字规范与引用纪律","title":"DSH 过程决策精读 · 第 02 批：文字规范与引用纪律","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["#8"],"summary":"2026-08-09-concrete-prose-names-actors-and-recorded-facts.md","bytes":15911,"lines":235,"body":"# DSH 过程决策精读 · 第 02 批：文字规范与引用纪律\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。比第一批少，原因是这三篇密度极高且内在联系紧——它们共同回答一个问题：**什么样的文字能长期成立**。\n> 第 03 篇尤其重要，它把\"怎么判断一句话该不该删\"讲成了可操作的方法，并罕见地**主动披露了自己的门禁覆盖缺口**。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [具体的散文点名行为者与已记录事实](#1-具体的散文点名行为者与已记录事实) | 为什么\"全局替换同义词\"是错的 |\n| 2 | [Agent Note 的统一格式](#2-agent-note-的统一格式) | 8 个被否决方案，和一条刻意的摩擦 |\n| 3 | [只引用已提交的产物](#3-只引用已提交的产物) | 含召回探针的校准方法，与一次坦诚的缺口披露 |\n\n---\n\n## 1. 具体的散文点名行为者与已记录事实\n\n`2026-08-09-concrete-prose-names-actors-and-recorded-facts.md`\n\n### 他们遇到的事\n\n仓库里的散文**用了抽象类别标签，而读者需要的是不同的具体事实**。同一个标签可能指：\n\n- 被替换掉的引用所引用的更早事件序号\n- 产生某条消息的 provider 和 model\n- 提供上下文的调用方\n- 提供某配置行的文件\n- 构建某个二进制的 CI job\n\n结果是：**读者必须先翻代码，才能知道这句话承诺的到底是哪个事实。**\n\n### 判断\n\n维护中的散文要**点名**本地契约所需的确切**行为者、动作、来源、事件、字段、文件或进程**，并说明**记录了什么、以及谁或什么记录的**。\n\n给写作者的操作方法只有一条，但很锋利：**做口语检查**——把那些你**不会用来向同事解释同一件事**的词替换掉。\n\n适用范围明确列出：Markdown、README、活跃 Agent Note、JSDoc 和注释、提示词、诊断信息、用户可见字符串。\n\n三条约束防止走偏：\n\n- **逐句审查**，不做全仓库同义词替换\n- 编辑后的句子要保留：行为者、动作、条件、顺序、情态、例外、归属、失败行为、后果\n- 精确的代码标识符、公共 API、持久字段、协议成员、类型名、文件名**保持不变**，除非另有一次独立的协同重命名\n\n还有一个专门针对三个高频词的判断：用 `contract` / `boundary` / `shape` 之前，先问这句话是不是其实想说更具体的规则、操作、数据结构、字段集合、校验点、时序点、API、类型或失败条件。\n\n### 凭什么这么判断——三个被否决的方案\n\n| 方案 | 否决理由 |\n|---|---|\n| **禁用一份固定的词表** | 一个词可能是精确的标识符，或在另一份契约里是最清晰的术语——调用方/被调用方的不变量**是真实的契约**，进程或线路边界**是真实的分界**。逐句审查能抓住歧义，而不会否决合法的名称 |\n| **把每个抽象标签都换成 \"source\"/\"origin\"/\"metadata\"** | **另一个宽泛标签仍然让读者去猜**：这句话指的是文件、调用方、事件序号、provider/model 对、commit 还是构建 job |\n| **连同散文一起重命名所有匹配的标识符** | 编辑上的清晰度**不足以正当化**无关的 API、协议、持久格式、类型或文件迁移；那些改动需要各自的消费者审计和独立的决策 |\n\n第 2 条否决理由值得单独记住：**换一个宽泛的词，等于什么都没做，只是把谜题换了个面。**\n\n### 他们承认的代价\n\n文档和诊断信息会多用几个词；仓库范围的散文审计**需要语义分类，不能做盲目替换**。\n\n---\n\n## 2. Agent Note 的统一格式\n\n`2026-07-05-uniform-agent-note-format.md`\n\n### 他们遇到的事\n\nAgent Note 的**路径**已经编码了生命周期和类别，但**文件内容**仍然混杂着各种标题风格、状态格式、ADR 模板和提案模板，甚至 implemented 记录里还留着提案期的章节。\n\n根因一句话：**作者复制他们找到的那个邻居**。而且生命周期移动可以跳过必需的改写——因为没有门禁强制文件内的契约。\n\n### 判断\n\n格式契约落在 README 里，包含：头部块、各生命周期的正文骨架、**强制的 `Alternatives considered` 段**，以及规范章节词汇（在规范章节之间，定制技术章节保持自由形式）。\n\n门禁 `verify-agent-note-format` 作为 `doc-sync` 的一部分强制执行每一条机械条款，于是**跳过硬写的生命周期移动会失败 CI，而不是依赖评审者的记忆**。\n\n两个关键立场：\n\n1. **整个语料在同一次变更里被规范化**——发布前的立场是\"没有过渡期、没有双格式容忍\"\n2. **唯一的祖父条款是内容，不是格式**——alternatives 是**记录的，绝不编造**，所以无法从记录中重建 alternatives 的旧笔记，携带一行精确的注释，而门禁**只对早于本笔记日期的文件**接受它\n\n### 凭什么这么判断——8 个被否决的方案\n\n| 方案 | 否决理由 |\n|---|---|\n| **完全刚性的模板**（每个生命周期一个固定章节序列） | 大型设计笔记带 8–15 个定制的技术章节（包拓扑、线路契约、schema），它们是**承重内容而不是漂移**；刚性序列会强制破坏性重写，并从此永远与模板搏斗 |\n| **只规范化头部**（H1 和 Status，正文不动） | 债务标记标出的恰恰是**正文**的体裁分裂；把 `Context`/`Decision` 与 `Problem`/`Proposal` 长期并置，什么也没解决 |\n| **不要 Status 行**（文件夹本身就是状态） | 选择保留\"自描述的文件\"；促成删除它的那个漂移风险，通过**把该行对着文件夹把关**而被中和 |\n| **带日期的状态**（`implemented (accepted YYYY-MM-DD)`） | 接受日期是**被写作规则挡在文档之外的叙述性历史**；文件名带首次提案时间、git 带其余；而且——**门禁能检查日期的格式，却永远无法检查它的真实性** |\n| **裸 `# \u003ctitle>`** | `Agent Note: ` 前缀让文件在被移到树外阅读时**仍然自描述体裁** |\n| **用 `## What we give up` 作为 implemented 的收尾** | **它只命名代价**，而诚实的 consequences 段必须同时记录这个权衡**买到了什么** |\n| **只靠约定，不设门禁** | slop 检查表已经用约定禁止了 implemented 里的 spec-speak，而**十九个文件展示了单靠约定能达成什么** |\n| **独立的 `FORMAT.md` 契约文件** | 一个入口点同时携带布局、分类和格式，比两个契约文件**更容易被发现和维护** |\n\n第 7 条是整篇最有分量的一条：**\"十九个文件展示了单靠约定能达成什么\"**——这句话把\"我们有规范了\"这种自我安慰直接击穿。\n\n### 他们承认的代价\n\n- 每篇 Agent Note 现在要多花一点结构成本\n- **强制的 `Alternatives considered` 是刻意的摩擦**：*一个没有记录它击败了什么的决策，会招致 Agent Note 本来要防止的重新打官司*\n- 无法重建 alternatives 的旧笔记**永久携带祖父注释**——这是\"记录上一个诚实的空白，而不是编造理由\"\n\n---\n\n## 3. 只引用已提交的产物\n\n`2026-08-09-committed-artifact-citations.md` · **本批最重要的一篇**\n\n### 他们遇到的事\n\n大型设计和评审会话会留下**工作速记**：决策序号、审计项代码、计划章节号、任务和 stack 序号、评审者裁决。这些速记**在会话记录打开时读起来完全自然，会话一关就解析不到任何东西**。\n\n一次仓库范围的审计给出了具体清单（这本身就是个好示范——不是\"感觉有点乱\"，而是\"审计发现集中在 `packages/client`\"）：\n\n- 裸 `(decision 12/16/19/20/21)` 引用，其中**只有 decision 21 有已提交的拥有者**\n- `(audit C2/S1/S3/S7)` 代码——仓库里**任何地方都没有**对应的审计文档\n- `design §4.7` / `web2 §0` / `plan §1.4`——指向**未提交的草稿**\n- 计划阶段标签（`T2/T5/T9`、`P-I`、`W5`）\n- stack 位置（\"a later PR in this stack\"）出现在**持久 JSDoc** 里\n- \"ruling\" / \"design ledger\" 这类词汇\n\n同样的家族还出现在测试、CSS 注释、生成器模板、CI 注释和 Agent Note 里——包括 \"this PR / branch / review round\" 这种视角、评审编排式的归因，以及\"deferred to a later PR\"这类**过时声明（目标其实早已发布）**。\n\n然后是最关键的一句诊断：\n\n> The documentation standard already banned the change-history half (previously/now, PR and commit references) **but stated no counterpart rule for citations**, so unresolvable ordinals kept landing.\n\n**文档标准早就禁止了\"变更历史\"那一半（previously/now、PR 和 commit 引用），但没有为\"引用\"这一半陈述对应规则**——所以无法解析的序号不断落地。\n\n这是\"规则有缺口\"的教科书案例：**禁了一半，没管另一半，漏洞就从没管的那半漏进来。**\n\n### 判断\n\n持久散文（注释、JSDoc、文档、笔记、测试注释和标题）**只引用已提交的产物**，且能在仓库内解析、不需要 grep 考古：\n\n- 可以引用：**具名的拥有者 Agent Note**（路径至少出现一次，正文里有个可搜索的名字）、**文档页路径**、**GitHub issue 号**\n- 仍然禁止：PR、commit、branch、stack 位置（按文档标准）；不过 Agent Note 和事故复盘**可以引用已合并的 PR 和 issue 作为证据**\n- **有已提交拥有者的序号 → 用该决策的名字替换**（\"decision 21\" → \"the plain-text-reference decision\"），序号本身在全仓删掉\n- **没有拥有者的序号 → 直接删除，把它的叙事分句重述为能独立成立的陈述**\n- **已修复的回归用现在时的反事实表述**（\"without X, Y happens\"、\"a naive X would…\"），**绝不用仓库历史**（\"used to Y\"）\n- implemented 笔记陈述**已发布现实**：一条 \"deferred to a later PR\" 如果目标早已发布，就改成具名那篇已发布的笔记\n- **豁免**：录制的 fixture、快照、归档笔记——**录制的模型输出和封存的历史保持原声**\n- **召回探针使用词汇边界，并用已知正例和一个近似负例来校准**；撰写语言探针针对**相反语言的那一面**，而不是把完整的中文语料当作\"未翻译残留\"\n- **所有者优先的编辑要追踪每一个生成的消费者**；逐字代码围栏在双语对之间逐字节复制\n\n### 凭什么这么判断——三个被否决的方案\n\n| 方案 | 否决理由 |\n|---|---|\n| **把设计账本和审计文档提交进去，让序号可解析** | 会话记录是**工作产物，不是维护中的参考**；提交它们会在 Agent Note 旁边**创造一份平行的、没有门禁的决策语料**，而且它们的内部编号**仍然会漂移** |\n| **为禁用词汇做一道机械门禁** | **推迟，不是否决**——理由见下 |\n| **删除那些引用了死产物的理由** | 事实分句被保留或重述；**只有引用、评审编排和推导记录被移除** |\n\n第 3 条划出了删除的边界：**删的是引用，不是理由。**\n\n### 为什么机械门禁被\"推迟\"而不是直接做\n\n这是全篇判断力最集中的一段，值得逐句看：\n\n> the vocabulary is unbounded natural language, and the audit's recall batteries need judgment to separate leakage from legitimate prose (\"wait\" the noun, contrastive \"actually\", runtime old/new states)\n\n词汇是**无界的自然语言**，审计的召回电池**需要判断力**才能区分泄漏与合法散文——比如作名词的 \"wait\"、表对比的 \"actually\"、运行时的 old/new 状态。\n\n他们给出了一份**窄的高精度候选门禁清单**，供模式复现时启用：\n\n```\n\\(decision \\d      \\(audit [A-Z]\\d      \\bcut \\d      this cut\n\\bT\\d\\b            P-I                  used to       \\bv1\\b      §\\d\n```\n\n（最后一条 `§\\d` 排除那些章节编号**有已提交拥有者**的引用。）\n\n而这份清单的**来源**很讲究：*\"review of the purge itself caught residuals in exactly the cases those searches missed, so they lead the candidate list\"*——**对清除行动本身的评审，恰好抓到了那些搜索漏掉的情况，所以它们领跑候选清单**。\n\n### 一次坦诚的缺口披露\n\nVerification 段最后一句：\n\n> Coverage gap: no gate rejects a new ordinal citation — review owns the rule.\n\n**覆盖缺口：没有门禁拒绝新的序号引用——这条规则由评审承担。**\n\n官方**主动写出**\"这条规则靠评审而非门禁\"。这一点在第 01 批的判断标准①（\"可机械判定的不变量必须编码成检查\"）旁边看尤其有意思：它说明**\"能不能机械判定\"本身就需要判断**，硬上一道会误伤合法散文的门禁，只会制造第 01 批判断标准⑦所说的坏训练。\n\n### 他们承认的代价\n\n- 注释里的引用通过**路径或名字**解析；读者永远不需要重建一个已关闭的会话来跟进\n- **设计会话必须先把决策落到 Agent Note，持久散文才能引用它们**；序号速记留在会话内部\n- 引用会变长（一个笔记路径替代 \"(decision 21)\"），换来的是**免 grep 的解析**\n\n---\n\n## 这批的共同判断标准\n\n**① 换一个宽泛的词等于什么都没做。**\n\"把抽象标签统一换成 source/origin/metadata\"被否决的理由是：**另一个宽泛标签仍然让读者去猜**。这条直接适用于任何\"统一术语\"的冲动——统一到一个同样模糊的术语，只是把谜题换了个面。\n\n**② 规范只禁了一半，漏洞就从另一半漏进来。**\n文档标准禁止了\"变更历史\"，却没管\"引用\"，于是序号引用不断落地。看任何规范时都该问：**与它对称的那一半在哪？**\n\n**③ 删除时要区分\"引用\"与\"理由\"。**\n死产物的引用可以删，但**事实分句要保留或重述**。删掉引用就删掉理由，是过度清除。\n\n**④ 不能被机械判定的规则，要么推迟，要么明说缺口。**\n他们对禁用词汇**推迟**了门禁，并列出高精度候选清单备用；同时**主动写出**\"覆盖缺口：这条规则由评审承担\"。两条路都比\"假装有门禁\"诚实。\n\n**⑤ 探针必须用正例和近似负例校准。**\n\"用已知正例和一个近似负例校准\"、\"召回电池需要判断力区分泄漏与合法散文\"——这是待办 #8 的直接方法论输入。近似负例（near-miss negative）是这里的关键：**只测正例的探针，无法知道自己有没有误伤。**\n\n**⑥ 强制的摩擦可以是刻意的。**\n`Alternatives considered` 是\"刻意的摩擦\"，理由是：**一个没记录它击败了什么的决策，会招致它本来要防止的重新打官司**。摩擦不总是坏事，要看它阻止的是哪种未来成本。\n\n**⑦ 诚实的空白胜过编造的理由。**\n无法重建 alternatives 的旧笔记，永久保留一行\"此处不可重建\"的注释，而不是补一段像样的理由。**这与\"编造一个合理的历史\"只有一线之隔，而他们选择了留白。**\n\n**⑧ 自描述优先于依赖上下文。**\n`Agent Note: ` 前缀让文件挪出树外仍能自述体裁；Status 行保留而非依赖文件夹。**假设读者在错误的上下文里读到它。**\n\n---\n\n## 下一批（待读）\n\n主题定为**评审与协作机制**：\n\n- `2026-08-10-event-directed-pr-review-status.md` —— 评审状态的事件驱动\n- `2026-08-02-native-github-stacks-and-optional-rebases.md` —— PR 历史的选择\n- `2026-08-08-unified-github-label-taxonomy.md` —— 标签分类\n- `2026-08-09-blocked-weighted-approvals-remain-pending.md` —— 审批语义\n- `2026-07-26-dependencies-over-hand-rolling.md` —— 依赖优于手搓（这条是 AGENTS.md 里直接引用的政策）\n"},{"file":"2026-09-10-DSH过程决策精读-03-权威与推断.md","date":"2026-09-10","slug":"DSH过程决策精读-03-权威与推断","title":"DSH 过程决策精读 · 第 03 批：权威与推断","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"2026-08-10-event-directed-pr-review-status.md","bytes":15835,"lines":221,"body":"# DSH 过程决策精读 · 第 03 批：权威与推断\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。读之前我以为主题是\"评审与协作\"，读完发现它们共同回答的是一个更基础的问题：\n> **当\"事实\"有多个可能的来源时，以谁为准？**\n> 三篇分别给出了三种答案，而且第三种（依赖政策）反过来讲了一件更狠的事：**当权威根本不存在时，发生了什么。**\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [评审状态的事件驱动](#1-评审状态的事件驱动) | 聚合状态会撒谎，交接事件不会 |\n| 2 | [原生 stack 与可选 rebase](#2-原生-stack-与可选-rebase) | 共享元数据优先于本地推断 |\n| 3 | [依赖优于手搓](#3-依赖优于手搓) | **沉默不是中立**——没写下的政策会被推断得更严 |\n\n---\n\n## 1. 评审状态的事件驱动\n\n`2026-08-10-event-directed-pr-review-status.md`\n\n### 他们遇到的事\n\nIssue Project 的状态记录的是**\"谁拥有下一步\"**——这是一个交接（handoff）语义。\n\n但 GitHub 给出的聚合评审状态回答的是另一个问题：**\"GitHub 是否认为这个 PR 可合并\"**。它无法表达交接，有一个具体的反例：\n\n> an earlier `CHANGES_REQUESTED` review can remain effective after the author fixes the code and requests review again\n\n**一个更早的\"请求修改\"评审，在作者修完代码并重新请求评审之后，仍然保持生效。** 于是聚合状态说\"被阻塞\"，而现实中球已经踢回评审者那边了。\n\n第二个问题：单调（只前进）的投影**无法**在评审者请求修改时，把一个自动化拥有的 Issue 从 `In review` 退回 `In progress`。\n\n### 判断\n\n把评审 webhook 当作**命令**来处理，而不是当作状态快照：\n\n- `pull_request.review_requested`（**包括重复请求**）→ 目标状态 `In review`\n- `pull_request_review.submitted` → 目标状态 `In progress`，**仅当** `review.state` 是 `changes_requested`\n- submitted 事件**仍然必要**，因为**评审者可以在没有更早的评审请求事件的情况下直接请求修改**\n- approved 和 commented 的提交**运行它们的生命周期 job 但什么也不做**（从不触达 Project token 那一步）\n- dismissed（被驳回的）评审**不订阅**\n\n然后是最关键的不对称设计：\n\n- 普通订阅的 PR 事件保持**只前进**——可以把 `Inbox`/`Backlog`/`Ready` 移到 `In progress`，但**不能把 `In review` 往回移**\n- 而 changes-requested 命令**只有在**目标 Project 的最新状态事件是由配置的生命周期 actor 写下的时候，才能把 `In review` 往回移\n- **人类或未知的最新 actor，保留当前状态**\n\n### 一份\"不做什么\"的清单\n\n这篇花了整整一段列举它**不做**的事，这在这批材料里很罕见，值得单独记住：\n\n不改变终态、不为没有 Project 状态的 Issue 添加状态、不依赖 PR 元数据的有效性、不查询 `reviewDecision`、不重建评审轮次、不从 Issue 反查 pull request、**不运行定时的对账器**。\n\n最后一条尤其值得注意：**不加一个定时对账器来兜底**。对账器看似稳妥，实则引入了一个\"与事件流并行的第二套真相\"——正是第 01 批判断标准②要拒绝的东西。\n\n### 凭什么这么判断\n\n| 被否决的方案 | 否决理由 |\n|---|---|\n| 从 `reviewDecision` 或重建的评审轮次推导状态 | GitHub 的聚合**在重复评审请求之后可能仍停留在 `CHANGES_REQUESTED`**；而一个轮次 reducer 会引入**超出两个显式交接**的评审者语义和顺序语义 |\n| 保持只前进的投影 | 单调推进保护了后续状态，但**让 Issue 停在 `In review`，而作者正在实现被请求的修改** |\n| **无条件**应用每一个评审命令 | 这是最小的处理器，但它**让自动化覆盖人类拥有的 Project 状态**——所以\"最新目标 Project 状态的 actor\"成为唯一那道后退转换的守卫 |\n| 恢复 `ready_for_review` 或加一个防抖队列 | ready 状态**不携带任何评审交接**；而多一个队列**增加延迟和控制面状态，却不改变任何一个命令** |\n\n第 3 条的对照最有教育意义：**\"最简单的实现\"和\"正确的实现\"在这里正好相反**——无条件应用是代码最短的写法，但它跨越了一条所有权边界。\n\n### 他们承认的代价\n\n坦诚得不寻常，原文列了三条：\n\n- 重复的评审请求会把自动化管理的 Issue 移到 `In review`，**即使 GitHub 仍报告一个更早的阻塞评审**\n- 投影保持事件驱动，**不会修复一个从未运行的事件**\n- **重放一个旧的 workflow run 可以重放它当时的旧命令**；而且 ProjectV2 **仍然不提供**\"读取最新状态\"与\"变更\"之间的原子 compare-and-swap\n\n也就是说：存在竞态，他们用\"逐 PR 的 workflow 并发\"和\"人类所有权守卫\"**减少**了竞态，但**没有引入持久的生命周期状态**去根除它。这个取舍是明写的。\n\n---\n\n## 2. 原生 stack 与可选 rebase\n\n`2026-08-02-native-github-stacks-and-optional-rebases.md`\n\n### 他们遇到的事\n\n一个只由 base 分支表示的依赖 PR 链，**没有官方的 stack 身份**。落地这样一条链需要手工一次合并一个 PR、保留中间分支、给每个子 PR 重定目标，然后**重建这条链是否还活着**。\n\n而 GitHub 的原生 stacked-PR 特性把这些都接了过去：携带顺序、对**每一层**应用 trunk 规则和 CI、自己拥有自底向上的合并和重定向。\n\n同时出现了第二条线索：**一刀切禁止重写已评审分支**，会把官方的 `gh stack` 同步工作流也排除掉（它的级联 rebase 会更新每一层并用 lease 保护发布）。而如果只在 stack 之外应用那条禁令，又会**给独立 PR 和 stack PR 两套不一致的历史选择**。\n\n### 判断\n\n- 每个同仓库、两个及以上依赖 PR 的链，**落地前必须使用 GitHub 官方的 stack 对象**\n- **活的** `PullRequest.stack` 和 `stackEntry.position` 字段是权威\n- 单作者的非 stack 链**自动**链接（`gh stack link`，自底向上）；**混合作者或作者不可用需要用户确认**\n- **缺少原生支持、跨 fork 链 → 硬停**\n- 已存在于冲突 stack、或官方顺序与分支拓扑不一致 → **需要用户指示**才能解散或重建\n- \"落地 stack\" 合并**完整的**官方 stack；部分落地**必须**指定一个显式的边界 PR\n- **绝不回退**到逐 PR 的 `gh pr merge` 加手工重定目标\n\n历史改写方面：\n\n- **merge-forward 和 rebase 都允许**作为刷新历史的手段，**包括评审之后**\n- 远程历史重写必须用**精确的 lease**或受 lease 保护的 push 路径，**远端移动就中止**；**裸 `--force` 禁止**\n- `gh stack sync` 是一个**显式例外**：因为它把 fetch、级联 rebase、push 当作一个操作，所以**每一个被重写的层都要在之后立刻验证，且任何受影响的 PR 在证据通过前都不得合并**\n- 任何重写后的 push 之后，**重新审计**：当前 heads、未解决的评审线程、批准、可合并性、检查——因为**更早的 commit OID 和内联锚点可能已经过时**\n\n### 凭什么这么判断\n\n| 被否决的方案 | 否决理由 |\n|---|---|\n| 保持分支链作为唯一的 stack 表示 | 保留了手工流程，但**给不了 GitHub 一个 stack 对象**去展示顺序、在每一层强制 trunk 规则、或原子地合并一个范围 |\n| 采用原生 stack，但禁止其评审后的 rebase 命令 | 保持 commit OID 稳定，但**在 stack 处于活跃评审时禁用了官方同步路径**，并让独立 PR 落在**另一套政策**下 |\n| 要求每个 PR 刷新都 rebase | 线性历史有用，但**合并检查点仍是有效选择**——当\"保留已完成的冲突解决及其恢复点\"比\"紧凑历史\"更重要时 |\n| 自动解散冲突的 stack | 会让**本地分支推断覆盖共享的 GitHub 元数据**，还可能打扰被请求链**之外**的 PR 或作者 |\n\n### 一条贯穿的边界：谁的元数据\n\n把四种\"需要用户确认\"的场景排在一起看——混合作者、冲突 stack、顺序与拓扑不符、部分落地——会发现它们共享同一个性质：**这些是共享的元数据，不是本地状态**。\n\n于是自动化的边界就清楚了：**本地能确定的事自动做，涉及共享元数据或链外影响的事，必须留给人类。** 这与第 1 篇的\"人类拥有权守卫\"是同一条原则的两种应用。\n\n### 他们承认的代价\n\n- 重写 push 会使 commit 哈希、批准或评论锚点失效，**所以每次重写 push 都带着一次活的评审与检查审计**\n- `gh stack sync` **可能短暂地发布本地证据尚在等待的代码**；受影响的 PR 保持禁止合并直到同步后验证通过\n- merge-forward 仍然可用并保留已完成的检查点，**代价是额外的合并提交**\n\n---\n\n## 3. 依赖优于手搓\n\n`2026-07-26-dependencies-over-hand-rolling.md` · **本批最重要的一篇**\n\n### 他们遇到的事\n\nharness 手搓了大量成熟外部包已经提供的基础设施。其中**有一部分是刻意的**（vendored Cordis、孪生 LLM 适配器、schemastery 作为配置 schema 标准）——但他们诚实地指出，**更多的部分是从一个从未被说出口的\"避免新依赖\"反射中积累出来的**：\n\n> the repo-wide external dependency list stayed tiny while packages grew their own SSE parsers, protocol framers, retry loops, and glob matchers\n\n仓库范围的外部依赖列表保持极小，而各个包长出了自己的 **SSE 解析器、协议分帧器、重试循环、glob 匹配器**。\n\n然后是整篇的题眼，也是我在这 94 篇里读到的最重要的一句：\n\n> Nothing in `AGENTS.md` actually stated a dependency policy, so agents inferred one from the existing pattern, and the inferred rule (\"don't add deps\") is stricter than anyone decided.\n\n**`AGENTS.md` 里没有任何地方陈述过依赖政策，所以 agent 从既有模式中推断出了一条——而推断出的规则（\"别加依赖\"）比任何人实际决定的都严格。**\n\n他们对这个现象的命名是：**默认运行的\"非我发明\"（Not Invented Here）谬误**。每一个手搓的成熟库克隆，都是我们自己要测试、写文档、评审、调试的代码，**却一点也拿不到生态积累的边界情况修复**。\n\n### 判断\n\n- 引入外部依赖是**合法的简化**，不是政策例外\n- 当维护良好的包（或引擎底线之上的 Node 内置模块）覆盖了手搓的面，**替换手搓代码是首选方向**\n- 但受**与其他简化相同的证据标准**约束：交换必须**真正缩小我们所拥有的东西**（代码、测试、契约面），**而不是把复杂度搬到一个 wrapper 后面**\n\n新依赖的四条门槛：\n\n| 门槛 | 判断内容 |\n|---|---|\n| **净删除** | 依赖替换的是**真实的、已拥有的代码**（实现 + 专用测试 + 文档），不是假设的未来代码。**只增加能力的依赖是特性决策，不是简化** |\n| **健康度** | 活跃维护、广泛使用、传递依赖足迹合理。**一个微小的无人维护的包，是用我们的代码换了别人的废弃代码** |\n| **边界契合** | 包的语义要覆盖我们**实际**的契约；**我们仍然围着它手搓的剩余语义要算作这次交换的负分** |\n| **不是已定的接缝** | schemastery、vendored Cordis、`@earendil-works` 孪生等已记录在 implemented Agent Note 里的决策**不因本政策重开**；一个要瓦解已记录设计的交换，**需要击败那个已记录的理由，而不只是引用本笔记** |\n\n还顺手澄清了一处被误读的规则：`packages/util/` 的\"零依赖\"宪章描述的是那个组的**导出**纪律（util 包保持不含 harness 依赖，这样任何组都能依赖它们），**并不禁止外部包**。一个 util 包如果它的全部工作都被维护良好的外部包做得更好，**应该被依赖替换，而不是为了宪章而保留**。\n\n### 凭什么这么判断\n\n| 被否决的方案 | 否决理由 |\n|---|---|\n| 保持隐式的\"不加新依赖\"文化 | **它从来不是一条被记录的决定**；而它的成本是具体的——手搓的协议与解析代码重复了久经沙场的库，**抬高了逐文件覆盖率负担**，并**拖慢每一个必须重新推导\"生态早已修好\"的边界情况的评审者** |\n| 一份获批包的硬白名单 | 仓库处于发布前、依赖集很小；**逐 PR 的证据门槛（净删除、健康、契合）加评审，把判断留在有上下文的地方**，而不是建立一个本身就需要维护的常设委员会制品 |\n| 像 Cordis 那样 vendor 每个新依赖 | vendor 是留给**我们必须打补丁或对抗上游翻腾而钉住**的包；广泛套用它**会重建依赖本来要卸下的维护负担** |\n\n第 2 条否决理由里那句\"**把判断留在有上下文的地方**\"值得记住——他们宁可逐 PR 付证据成本，也不要一个\"本身需要维护的常设制品\"。\n\n### 他们承认的代价\n\n- 依赖列表会增长，随之而来的是**供应链面**；而本政策**让那个供应链提案变得更紧迫**（原文就用\"more urgent\"）\n- 根 `AGENTS.md` 只放一行规则，**理由和门槛由这篇笔记承担**\n\n---\n\n## 这批的共同判断标准\n\n**① 当推断与权威冲突时，权威胜。**\n三篇的三个版本：聚合状态 vs 交接事件（**选事件**）、本地分支推断 vs 共享元数据（**选共享元数据**）、从现状推断的模式 vs 写下的决定（**选写下的决定**）。\n\n**② 而权威不存在时，必须显式建立它。**\n第 3 篇证明：**沉默不是中立**。政策不写下来，就会被从现状中推断出来一条——而且**推断出来的总是比你想的严格**。这大概是\"把规范写下来\"最有力的论证，比\"便于查阅\"这种理由强得多。\n\n**③ 状态要表达交接，不要表达判定。**\n\"谁拥有下一步\"是交接，能驱动行为；\"GitHub 认为可合并\"是判定，会在具体反例上说谎。**选状态时先问：它是用来驱动谁的下一步动作的？**\n\n**④ 自动化的边界由\"谁拥有这份元数据\"划定。**\n第 1 篇的人类所有权守卫、第 2 篇的四类\"需要用户确认\"，是同一条原则：**本地能确定的事自动做；共享元数据或影响链外的事留给人类。**\n\n**⑤ 重写历史必须带租约，且事后重新审计。**\n精确 lease 或受 lease 保护的路径，远端移动就中止；裸 `--force` 禁止。而且因为 commit OID、批准和评论锚点会失效，**每次重写 push 都要重新审计评审、批准、检查、可合并性**。\n\n**⑥ 不做的事也要列出来。**\n第 1 篇那段\"不重建评审轮次、不查询 reviewDecision、不加定时对账器\"，价值不低于决策本身——**它划出了\"这条命令管到哪为止\"**。定时对账器尤其典型：它看似稳妥，实则是事件流之外的第二套真相。\n\n**⑦ 交换必须真正缩小我们所拥有的。**\n\"净删除\"这条门槛针对的是一个常见伪装：**把复杂度藏到 wrapper 后面**，看起来代码变短了，实际什么都没减少。\"我们仍然围着它手搓的剩余语义要算负分\"是同一个判断的延伸。\n\n---\n\n## 下一批（待读）\n\n继续**协作机制**线，补齐本批未读的两篇，外加相邻主题：\n\n- `2026-08-08-unified-github-label-taxonomy.md` —— 标签分类\n- `2026-09-09-blocked-weighted-approvals-remain-pending.md` —— 审批语义\n- `2026-07-26-ci-failover-runbook.md` —— 故障切换\n- `2026-09-03-semantic-issue-templates-and-policy.md` —— issue 模板的语义化\n"},{"file":"2026-09-10-DSH过程决策精读-04-什么算证据.md","date":"2026-09-10","slug":"DSH过程决策精读-04-什么算证据","title":"DSH 过程决策精读 · 第 04 批：什么算证据","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"2026-08-08-browser-gif-evidence-chain.md · Problem 段写得极好，值得整段记住","bytes":14557,"lines":215,"body":"# DSH 过程决策精读 · 第 04 批：什么算证据\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。读完发现它们在做同一件事：**识破\"看起来等价\"的替代品**。\n> 一堆各自为真的截图不等于一次真实执行；历史上出现过的加速不等于现在该做的优化；从路径推导的标签不等于语义影响。\n> 三篇都在回答：**这个东西凭什么算证据？**\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [浏览器 GIF 保留单一证据链](#1-浏览器-gif-保留单一证据链) | 各自为真的截图，证明不了一次真执行 |\n| 2 | [证据驱动的性能优化](#2-证据驱动的性能优化) | 历史加速产生假设，不构成处方 |\n| 3 | [统一的 GitHub 标签分类](#3-统一的-github-标签分类) | 评论而不修复，等于保留无效状态 |\n\n---\n\n## 1. 浏览器 GIF 保留单一证据链\n\n`2026-08-08-browser-gif-evidence-chain.md` · **Problem 段写得极好，值得整段记住**\n\n### 他们遇到的事\n\n一个浏览器演示的分镜（storyboard）可以**包含各自都为真的截图，却不能证明一次真实的执行**。他们列了四种具体的失效：\n\n- **复用全局应用状态**，会把旧的设置或会话带进来\n- 捕获自动化会**意外地把来自不同模型运行的帧组合在一起**\n- **聊天记录可以展示一次成功的回退，却不暴露导致它的那次工具拒绝**\n- 模糊的可访问名称匹配会接受**提示词回显**或后代文本，而不是预期的结果\n\n还有两条发布边界：\n\n- 产品默认可能打开一个**自动化无法驱动的原生操作系统界面**；而用 mock 或测试钩子替换它，意味着 **GIF 不再展示生产路径**\n- **一次成功的上传或 push，并不证明上传的资产在评审路径上可达且完整**，也不证明 GitHub 把 PR 的 Markdown 认作图片\n\n### 判断：一个分镜 = 一条证据链\n\n核心原则一句话：**一个分镜就是一条证据链，钉在确切的 PR head 上。**\n\n- 构建前要求**干净的工作树**，并记录那个 commit SHA\n- 每次运行使用**全新的** `DSH_HOME`、`DSH_AGENTS_HOME`、工作区、会话和隔离的浏览器状态\n- **每个发布的帧都来自同一次服务器 + 模型驱动的场景运行**\n- 失败的一次捕获**整场丢弃、从全新的根重来**，**绝不与另一次运行拼接**\n- 浏览器自动化**等待唯一的、确切语义的状态**\n- 当主张涉及工具调用、拒绝或恢复时，分镜必须包含一个**细节帧或轨迹帧**：指明是哪个工具、展示其状态或稳定错误码、并展示下游结果\n- **最终编码的 GIF 才是验证主体**——查看器动不了它时，要**从那个 GIF 里解码代表帧**，而不是拿源截图当等价证据\n- 原生生产界面**只能通过正常的应用配置**、用一个官方可被浏览器驱动的生产后端来替换，且**这个覆盖要标注在 GIF 旁边**\n- **fixture、mock 传输、合成事件、测试专用钩子，都不构成真实生产主张的证据**\n\n### 发布阶段要再验一次边界\n\n他们不信任\"上传成功\"这件事，而是把发布拆成可验证的几步：\n\n- 首选 `gh --attach`（v2.99.0+、仅 github.com、上限 10 MB）：body 文件引用本地 GIF 路径 → 命令上传**已验证的产物**并**就地重写那个引用** → 然后**活体 body 必须显示重写后的 URL，且该 URL 必须返回 `200` 和 `image/gif`**\n- 改动 PR body **之前**，活体 head 必须**仍等于**记录的 head；编辑**之后**再检查一次，必须**仍在该记录值上**\n- GitHub 的 Markdown 渲染器**单独**必须产出预期的图片\n\n### 凭什么这么判断\n\n| 被否决的方案 | 否决理由 |\n|---|---|\n| 当可见状态\"看起来等价\"时，允许不同运行的帧混用 | **视觉相似性不确立共享状态、因果顺序或单次场景执行。** 重录要再花一轮真实成本，但**保住了分镜所主张的东西** |\n| 用聊天记录作为\"工具恢复\"的充分证明 | 最终答案证明任务完成了，但它**可以隐藏：哪个工具运行了、失败是否是结构化的、模型是否从该失败中恢复** |\n| 用 fixture 或测试钩子替换不可访问的原生 UI | 那**是通过改变被观察的产品路径**来让自动化更容易。通过正常配置选择官方生产后端，**让被执行的实现保持真实**，并让更窄的模式**显式** |\n| 相信一次成功的上传或 push | 上传或 push **只证明 GitHub 接受了那些字节**，不证明 body 引用指向了上传的资产，也不证明 Markdown 渲染了图片 |\n\n### 他们承认的代价\n\n- 工作流要花额外的暂存状态；**捕获失败后可能要重复一轮真实模型**\n- 通常要多加一个细节帧，外加一串发布检查（活体 head 与 body 重读、Markdown 渲染、上传 URL 抓取）\n- **无头录制能用的生产后端比交互式桌面少**，而每一个被选中的后端**都要标注在 GIF 旁边**\n\n最后一条是\"诚实边界\"的又一例：**能力受限这件事被写在产物旁边，而不是瞒着。**\n\n---\n\n## 2. 证据驱动的性能优化\n\n`2026-09-06-evidence-driven-performance-skill.md`\n\n### 他们遇到的事\n\n两件具体的事：\n\n1. 性能工作**会改进一个孤立的阶段，同时把成本搬到另一个阶段、保留更多数据、或者跳过必需的行为**\n2. **历史 PR 描述会保留被放弃的实现和估算**——所以照着它们表面上的解决方案做，**可能恢复一个已被拒绝的设计**，而不是解决当前的瓶颈\n\n### 判断\n\n把宽泛的性能调查导向**有界的、可测量的用户路径**，并组合：\n\n- 聚焦的归因 + **独立计时**的后端与浏览器端点\n- 合成的工作负载分布\n- **可比较的**冷/热与保留内存条件\n- **针对收紧预算的负对照**（negative controls）\n\n一条容易被忽略但很关键：**工作流要求独立于计时的行为证据**。模型可见日志、持久代际与发布规则、流顺序、取消、释放**仍然是义务**——性能优化不能成为删掉它们的理由。\n\n以及两条边界：\n\n- **授权的私有语料检查只产出聚合的工作负载灵感**；提交的输入和发布的产物**只含合成材料**\n- 优化 PR 携带它**更紧的预算**；而前面一层基准可以保护已测量的基线，并**保持可独立合并**\n\n### 他们怎么处理\"历史证据\"（这段最有教育意义）\n\n表格开头先声明三点：\n\n> These are **author-reported historical measurements, not benchmarks rerun for this workflow**. **Final merged diffs and owning source take precedence over original PR descriptions.** The rejected intermediate proposal is retained **only to explain why identity registries are not a general prescription**.\n\n1. 这些是**作者自报的历史测量，不是为这个工作流重跑的基准**\n2. **最终合并的 diff 和拥有它的源码，优先于原始的 PR 描述**\n3. 被否决的中间提案**保留下来，只为解释\"为什么身份注册表不是一条通用处方\"**\n\n然后表格里每一行都给一个 \"Reusable lesson\"，而且**诚实标注哪些数字是估算而非测量**（例如 \"The 10,000-node timing table is **estimated, not browser measurement**\"）。还专门保留了一行 **closed unmerged** 的 PR，并写明\"**没有当前的所有权证据就不要复活它**\"。\n\n### 凭什么这么判断\n\n| 被否决的方案 | 否决理由 |\n|---|---|\n| **先优化可疑代码，再测量** | 局部复杂度**不能识别主导的用户成本**，也**无法建立改进或回归保护** |\n| **把历史上的加速当作可复用的处方** | 表示法、所有权和生命周期要求**会变**。**历史证据产生假设；当前生产路径和新鲜测量决定一个改动是否适用** |\n| **只用微基准，或只用端到端计时** | 孤立的阶段会**漏掉被搬走的成本**，而聚合计时**无法定位原因**。两者都需要，在适合所选问题的范围内 |\n\n第 2 条是本批最重要的一句：**历史证据产生假设，不构成处方。**\n\n### 他们承认的代价\n\n- 这个 skill **不增加任何运行时行为、基准实现或新的 CI 政策**；它的验证只是文档/链接一致性与 skill 元数据\n- **每个未来的优化，都在自己的拥有者处提供可执行的测量和功能证据**\n- **有限的场景/修复范围，防止一个宽泛的性能请求变成一次无关的架构重写**\n\n最后一条值得单独记：**限定范围本身就是一种防御**——防止任务从\"优化 X\"蔓延成\"重写架构\"。\n\n---\n\n## 3. 统一的 GitHub 标签分类\n\n`2026-08-08-unified-github-label-taxonomy.md`\n\n### 他们遇到的事\n\nPR 标签实际在回答**两个独立的问题**：这次改动做的是**哪一类工作**，以及它**实质影响了哪些持久的仓库领域**。\n\n两个失效模式：\n\n- **混合这两个维度**，或保留同义的普通标签与命名空间标签，会让**查询变得有歧义**\n- 而**一个封闭的领域清单，会强迫新领域进入不准确的类别**\n\n### 判断\n\n- 每个开放的或已合并的 PR：**恰好一个**规范的 `kind/*`，**至少一个**实质影响的 `area/*`\n- **从未合并就关闭的 PR，保留迁移过来的历史分配，但不会获得被臆造的缺失分类**\n- kind 集合**封闭且互斥**；kind 记录**主导意图**——附带的测试、文档、清理、依赖移动，**不覆盖** feature 或 bug fix\n- **保留（reserve）统一化过程中移除的每一个别名**（`kind/bug`、`feature`、`docs`…），理由很精准：*\"防止一个过时的同义词被重新创建为一个看起来无关的操作标签\"*\n- area 集合**刻意可扩展**：当没有现存的描述能**诚实地**覆盖一个持久且可复用的领域时，**agent 可以不经单独批准就创建**一个 `area/\u003clowercase-kebab-case>`；但**不得**为一个 PR、一个偶然路径、一个临时项目、一个状态、或一个人/团队创建。应用后要**向请求者报告新标签和理由**\n\n最后一条附了一个很硬的约束：**仅仅为了避免一次有正当理由的新增，而复用一个不准确的 area，是不可接受的。**\n\n### 凭什么这么判断（9 个被否决方案，挑最利的几条）\n\n| 方案 | 否决理由 |\n|---|---|\n| **一个未区分的标签集合** | **一个标签的存在，不会证明\"意图\"和\"语义范围\"都被考虑过** |\n| **从包或路径推导 area** | **area 描述跨包边界的语义影响，而变更路径包含偶然的测试、文档和支持文件** |\n| **宽泛的实现标签替代产品或工程主题** | **一个具体能力不仅仅是它的工具、界面、文件系统或进程实现** |\n| **在 Issue 上加 kind** | 原生 Issue Type 已经拥有那个分类；**重复它作为标签会产生漂移** |\n| **只靠评论来做 Issue 执行** | **一条评论保留无效元数据并要求人工清理，即使唯一有效的结果就是移除。** 生命周期直接应用那个移除，只为它**无法推断**的选择保留评论 |\n| **每个 PR 恰好一个 area** | 连贯的改动可以实质影响多个独立的 API 或行为，**丢掉次要 area 会隐藏受影响范围** |\n\n第 5 条是本批的另一颗珍珠：**\"评论而不修复\"被否决，因为它保留了无效状态并要求人工清理。** 这与第 01 批的\"不接受过渡态\"是同一条原则的不同侧面——**知道该怎么修却不修，只是把成本推给未来的人力**。\n\n### 他们承认的代价\n\n- 维护者必须**读改动和活的标签描述**，而不是从标题前缀或路径**推断分类**\n- **活的目录、这份理由、以及政策执行，必须在 kind 或某个不明显的 area 边界变化时一起移动**\n- 分类法的迁移**带有明确的历史回填与验证成本**\n\n---\n\n## 这批的共同判断标准\n\n**① 相似性不构成同一性。**\n这是本批的核心。\"看起来等价\"有四种典型伪装：**视觉相似**（不同运行的帧）、**结果相似**（聊天记录显示成功但隐藏了失败路径）、**来源相似**（历史加速看起来是现成答案）、**名称相似**（用宽泛标签替代语义分类）。每一次他们的判断都是：**回到\"这个主张到底需要什么\"**。\n\n**② 历史证据产生假设，不构成处方。**\n性能篇的原话。配套的两个操作：**合并后的 diff 优先于 PR 描述**（因为描述里留着被放弃的设计），**被否决的提案要保留但只为解释边界**。\n\n**③ 要验到\"评审者真正使用的那条路径\"。**\nGIF 篇不满足于\"push 成功\"，而是要**重读活体 body、用 Markdown API 渲染、抓取上传后的 URL**——因为那才是评审者实际看的东西。**验证的终点应当是消费点，不是产出点。**\n\n**④ 不确定的地方要标注，不要补齐。**\n三篇三次出现：性能篇标注\"哪些是估算不是测量\"；标签篇**不发明缺失的分类**（未合并关闭的 PR 就保留历史分配）；GIF 篇把\"这个后端是替代品\"标在 GIF 旁边。这是第 02 批\"诚实的空白胜过编造的理由\"的第二次现身——**它显然是一贯立场，不是偶然**。\n\n**⑤ 知道该怎么修就直接修，别评论。**\n\"只评论不修复\"被否决的理由是：它保留无效状态并要求人工清理。**把一个可自动完成的修复降级成一条提示，是把自己的成本转给未来的某个人。**\n\n**⑥ 限定范围本身就是防御。**\n性能篇明确说\"有限的场景/修复范围，防止一个宽泛的性能请求变成一次无关的架构重写\"。**边界不只是为了省事，是为了防止任务变质。**\n\n**⑦ 验证手段不能改变被验证的行为。**\n用 fixture 替换不可访问的原生 UI 被否决，因为**那通过改变被观察的产品路径来让自动化更容易**。这是观察者效应在工程规范里的版本：**凡是让\"验证更容易\"的改动，都要先问它有没有改变被验证的东西。**\n\n---\n\n## 下一批（待读）\n\n补齐协作机制线并延伸：\n\n- `2026-09-09-blocked-weighted-approvals-remain-pending.md` —— 审批语义\n- `2026-09-03-semantic-issue-templates-and-policy.md` —— issue 模板的语义化\n- `2026-07-26-ci-failover-runbook.md` —— 故障切换与运行手册\n- `2026-08-10-npm-release-sequences.md` —— 发布顺序\n- `2026-08-03-package-anchored-subsystem-pages.md` —— 文档结构锚定\n"},{"file":"2026-09-10-DSH过程决策精读-05-状态的语义精度.md","date":"2026-09-10","slug":"DSH过程决策精读-05-状态的语义精度","title":"DSH 过程决策精读 · 第 05 批：状态的语义精度","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"2026-08-10-npm-release-sequences.md · 本篇 184 行，是这 94 篇里最长的之一","bytes":16751,"lines":251,"body":"# DSH 过程决策精读 · 第 05 批：状态的语义精度\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**。共同点比我预想的更集中：**把\"看起来都是坏结果\"的情况拆成语义不同的类别，并各自给正确的处理。**\n> 未满足 ≠ 失败；没有 ≠ 有但不同；形式不对 ≠ 语义缺失。三篇都在纠正同一类混淆。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [npm 发布的三个独立序列](#1-私有-npm-发布作为三个独立序列) | 184 行，本批最长；\"tag 是 commit 指针，不是发布证明\" |\n| 2 | [阻塞的加权批准保持待定](#2-阻塞的加权批准保持待定) | 未满足的合并条件不是发布者故障 |\n| 3 | [语义化 Issue 模板](#3-语义化-issue-模板与呈现中立的政策) | \"产生了失败，却没有识别出任何缺失的语义决策\" |\n\n---\n\n## 1. 私有 npm 发布作为三个独立序列\n\n`2026-08-10-npm-release-sequences.md` · **本篇 184 行，是这 94 篇里最长的之一**\n\n### 他们遇到的事\n\n仓库有三组**互不相关**的可发布包，而它们在三件事上都不同——**版本基线、变更率、构建要求**：\n\n- `packages/*/*` 和 `apps/*` 随产品移动\n- `vendor/*`（九个 rescope 过的 Cordis 框架包）只在上游重新同步或本地修改变化时移动\n- `native/*` 需要 musl 工具链，且每个架构构建一次\n\n> Forcing them through one pipeline means every product release republishes the framework and the native binaries.\n\n**强迫它们走一条流水线，意味着每次产品发布都要重新发布框架和原生二进制。**\n\n### 一个潜伏了很久的 bug（本批最精彩的细节）\n\n他们发现 933 个手写的 `peerDependencies: \"^0.0.1\"` 存在于兄弟 dsh 包之间。为什么这是 bug：\n\n- `pnpm pack` 会替换 `workspace:` 协议，但**对 semver 范围不管不顾**\n- `^0.0.1` 的含义是 `>=0.0.1 \u003c0.0.2`——**它把 `0.0.2` 排除在外**\n- 而 semver **会把预发布版本排除在一个自身不带预发布的范围之外**，所以它也排除了 `0.0.1-rc.1`\n\n> Those entries never failed only because the version never left `0.0.1`.\n\n**这些条目从未失败，仅仅因为版本从未离开过 `0.0.1`。** 一个一直在那儿、只是条件还没满足的 bug。\n\n### 判断（六块，我只取判断价值最高的部分）\n\n**① 三个独立序列。** `packages/`、`vendor/`、`native/` 各有一个 bump 序列和一个发布，**不共享版本、不共享触发、不共享等待**。\n\n**② 版本从本地命令落入仓库，CI 只检查和上传。**\n\n每个序列有一个 bump-and-commit 命令：推导目标版本 → 写入相关 manifest → `pnpm install --lockfile-only` → 连同 lockfile 一起提交。于是**已发布的版本可以直接从仓库读到**。人类在 commit 合并到 master 之后创建 tag；**CI 从不写仓库，因此也不需要仓库写权限**。\n\n**③ \"registry 决定什么该出去\"——三个状态。**\n\n发布时不读取任何 tag，也不读任何\"本次发布包含什么\"的清单。对每个打包好的 tarball，把版本与 registry 比对：\n\n| 状态 | 动作 |\n|---|---|\n| registry 没有那个版本 | 发布 |\n| registry 有，且 tarball 的 sha512 **等于**记录的 `dist.integrity` | **跳过**：这是对同一个产物的重跑 |\n| registry 有，且 integrity **不同** | **失败**，报告\"内容变了却没有 bump 版本\" |\n\n第三个状态是精髓：它抓住**改了代码却没升版本**的情况。而前两个状态一起提供了幂等性——**对同一产物重跑发布，什么都不会重发，也不需要人工挑选包**。\n\n**④ 让 tag 成为账本，而不是新建账本文件。**\n\n变更判断**不增加任何状态文件**：每个包有自己的 tag，**那个 tag 记录了它上次从哪个 commit 发布**。bump 读取最新的 `vendor-\u003cpackage>-v*` tag，把包目录与该 tag 做 diff。\n\n其中一条规则特别细，也特别重要：**对 `files` 只选 `lib/` 的包，构建输入（`src/**`、`tsconfig*.json`、构建配置）也算变化。** 理由：\n\n> a built payload is not tracked by git: without it, a real source change reads as \"nothing changed\" and the next publication fails on a version whose bytes moved\n\n**构建产物不被 git 跟踪；没有这条规则，一次真实的源码变更会被读成\"什么都没变\"。**\n\n还有一条更硬的区分：\n\n> A tag is a commit pointer, not proof of publication.\n\n**tag 是 commit 指针，不是发布证明。** 所以 bump 会去问 registry：它最新的 tag 所命名的版本真的存在吗？不存在就**失败并交给人类解决**——因为一个为\"最终失败了的发布\"推的 tag，否则会被读成\"已发布\"，从而**无限期地跳过那个包**。\n\n**⑤ 可选依赖绝不在模块作用域加载（一段完整的推理链）。**\n\n这段值得逐句抄：\n\n- `optionalDependencies` 里的依赖、或带 `peerDependenciesMeta.\u003cname>.optional` 的 peer，**可能不在安装树里**——**那个缺席正是\"可选\"的全部承诺**\n- **静态 import 在导入模块被加载时就被求值**，所以一个缺席的包会从\"这个能力不可用\"变成**所有到达那个导入模块的代码的加载失败**\n- 而这个失败**只出现在缺少那个包的安装树里，偏偏这里没有任何测试构造过这样的树**：\n\n> a workspace install always has every package, so the unit tests, the snapshots, and the packed-install probe all pass while the published package is broken for the consumer who declined the optional peer\n\n**workspace 安装总是有每一个包，所以单元测试、快照、打包安装探针全部通过——而发布的包，对那个拒绝了可选 peer 的消费者来说是坏的。**\n\n这是\"**测试环境比真实环境更完备，所以永远测不出缺席**\"的典型。门禁的补救方式是**读每个包自己的 manifest** 来决定\"允许什么缺席\"，再去扫真正会发布的文件。\n\n细节上还有两处判断：**值 vs 类型要针对绑定的 Program 判定，而不是看 import 语法**（因为 `verbatimModuleSyntax` 是关的）；以及——\n\n> A dynamic `import()` only moves the failure to first use... reaching for it is a sign the dependency is not optional\n\n**动态 `import()` 只是把失败挪到首次使用**；伸手去拿它，恰恰说明这个依赖**并不是可选的**——所以门禁**不把它当作补救方案提供**。\n\n**⑥ 两条 registry 现实。**\n\n- 写入之间至少间隔两秒并带退避重试，因为连续发布多个包会**跑过 registry 自己的处理**，招致 `E409 Failed to save packument`\n- **每次重试都先重读 registry**：一个被报告为失败的操作**可能实际上已经落地了**，所以\"现在存在、且 integrity 正是这个 tarball 的\"应当算已发布，而不是要再放一次的版本\n\n### 凭什么这么判断（12 个被否决方案，取最利的几条）\n\n| 方案 | 否决理由 |\n|---|---|\n| **`\u003cbase>-\u003ctimestamp>-\u003cshort SHA>` 版本** | 与\"把已发布版本留在仓库里\"冲突：版本内嵌 commit SHA，而把版本写回又会产生新 commit，于是 **SHA 只能命名被发布的父 commit**，链接需要一整套约定来解释 |\n| **`vendor/published.json` 账本** | **它增加一个必须不与 registry 漂移的状态文件。** 每包一个 tag 提供同样的 commit 指针，而 tag 反正必须存在——**所以它没有引入状态的第二份拷贝** |\n| **只从版本判断\"已发布\"，不比较内容** | **跳过只看版本，会漏掉\"改了代码但没升版本\"——而这是唯一会悄悄把陈旧字节留在 registry 上的失败。** 代价是一次 registry 查询 |\n| **按入口闭包选择子集** | 从两个入口爬 `dependencies` 得到 156 个包（比全集少 61 个）。**但本仓库的插件是从 `cordis.yml` 按名字挂载、而不是 import 的**——有两个包落在依赖闭包之外却在运行时被需要。按代码依赖选包会失败为\"消费者装了它却起不来\"，而且**需要一份常设证明\"没有漏掉任何被挂载的包\"** |\n| **在 CI 里跑 bump 并把版本推回去** | 需要工作流的仓库写权限，而且**发布分支上的版本 commit 会与人类的 commit 撞车** |\n| **一个工作流加 `family` 输入** | 一个文件里放两种版本模型，会把并发组、tag 前缀、演练触发器**分叉成条件表达式**；一族一个文件**既更短也更好读** |\n\n第 2 条再次印证第 01 批的核心模式：**拒绝\"产生第二份需要同步的真相\"**。\n\n### 他们承认的代价（原文列了 9 条，这里是关键的几条）\n\n- **tag 可能与 registry 漂移**（只在有凭据的机器上被抓到）\n- **变更判断依赖可见的 tag**：浅克隆或没有 tag 的 checkout，会把 vendored 判断退化成\"首次发布全部\"——**`fetch-depth: 0` 是前置条件，不是优化**\n- **私有包需要凭据安装**\n- **字节可重现性是假设，不是测量**：\n\n  > Nothing measures that yet: if the build embeds absolute paths or timestamps, a re-run reports a false failure. **Measure it before the first publication a re-run might follow.**\n\n  跳过状态建立在\"同一个 commit 打包两次产生相同字节\"这个前提上，**但没有任何东西在测量它**。\n- **对更老的产物重跑发布，可能把 `latest` 往后移**（因为发布是逐版本决定的）\n- **首次发布是一大步**：九个 vendored 包加整个 dsh 集一次发布，任何载荷缺陷都会在单次发布中暴露——**这就是为什么先用一个预发布版本驱动完整路径**\n\n---\n\n## 2. 阻塞的加权批准保持待定\n\n`2026-09-09-blocked-weighted-approvals-remain-pending.md`\n\n### 他们遇到的事\n\n加权批准的 commit status **必须区分两件不同的事**：\n\n1. **一个未被满足的合并条件**\n2. **一次失败的政策评估**\n\n一个来自**有写权限评审者**的有效 `CHANGES_REQUESTED`，会阻止 PR 满足批准政策——**但它是一个可逆的评审状态，不是一次评估失败**。\n\n为他们发布 `failure` 会造成两个后果：\n\n- **把批准决策与发布者自身的健康混为一谈**\n- **把这一种未满足的政策条件，与草稿 PR、批准点不足区别对待**——而后者保持 pending，且贡献者可以解决\n\n### 判断\n\n- 发布 `pending` 的三种情况：草稿 PR、批准点不足、**来自有写权限评审者的有效 `CHANGES_REQUESTED`**\n- **阻塞性评审支配点数**——所以即使计数的批准达到阈值，状态**仍然保持 pending**\n- 只有\"已就绪 + 达到点数阈值 + 没有阻塞性评审\"三者齐备才发 `success`\n- **评估本身失败**（而非政策未被满足）才发布 `error` 状态并让那个 job 失败\n\n### 凭什么这么判断\n\n| 被否决的方案 | 否决理由 |\n|---|---|\n| 为阻塞性评审发布 `failure` | 它**把一个未满足且可逆的合并条件表示成了故障**，并把政策结果与发布者健康混为一谈 |\n| 让批准点数覆盖阻塞性评审 | 这会让分数成为唯一成功条件，但**允许一个有效决定仍在请求修改的评审者存在时出现成功状态** |\n\n### 他们承认的代价\n\n- 必需状态的分支规则仍然会拦住 PR（因为 `pending` 不满足必需状态），所以**约束力没有损失**\n- **消费者不会仅因为有阻塞性评审就收到失败的 commit status**——他们需要读状态描述或有效评审，才能区分一个阻塞者与其他待定条件\n\n最后一条是**主动暴露的可观测性损失**：为了语义精确，消费者多了一步工作，这件事被写下来了。\n\n---\n\n## 3. 语义化 Issue 模板与呈现中立的政策\n\n`2026-09-03-semantic-issue-templates-and-policy.md`\n\n### 他们遇到的事\n\n两个问题：\n\n- Issue 和 PR 模板**把受理问题与评审证据混在一起**，还把完整内容藏进 `\u003cdetails>` 里；**未使用的前言、单独的 Idea 与 Research 模板，增加了选择却没有改变仓库如何规划工作**\n- 更根本的一个：Issue 政策**把 Markdown 呈现当成了仓库元数据**——它要求 `\u003cdetails>` 元素、50 单位的可见正文、中文标题、标题元数据前缀、以及一行 `Owner:` 正文\n\n对后者的判断一句话击穿：\n\n> produced failures **without identifying a missing semantic decision**\n\n**这些规则产生了失败，却没有识别出任何缺失的语义决策。** 政策在检查形式，而形式与内容无关。\n\n### 判断\n\n- 模板只覆盖 Bug、Feature、Task。**Idea 和 Research 归属 Task，除非未来的决策给它们不同的生命周期行为**\n- 模板前言**只含** `name`、`about`、`type`\n- **Markdown 标题定义层级，HTML 注释解释每个标题下该放什么**（用注释承载指导，而不是用政策承载形式）\n- Issue 政策**不再检查**：`\u003cdetails>` 呈现、可见正文长度、标题语言、标题前缀、正文所有权行\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保留 Idea 和 Research 模板 | 它们的表单**没有确立与 Task 不同的生命周期或政策行为**，所以分开的入口**增加了选择，却没有保留有意义的类型区别** |\n| 把呈现规则保留为警告 | **这些规则可能让本来可行动的 Issue 失败，而且无法确立\"请求的工作、预期行为或交付物是否清晰\"** |\n| 增加自动元数据修复或 Issue 分类 | 那些行为需要新的变更规则、权限、失败处理和运营证据；**它们仍然是独立的决策，而不是随一次政策简化捎带进来** |\n\n第 3 条值得单独记住：**明确拒绝\"顺手捎带\"**。一个简化动作不做额外的事，即使那些事看起来相关。\n\n### 他们承认的代价\n\n政策**不重写历史标签、不选择缺失的 Issue Type、不同步 Priority、不迁移现有数据**；**未来任何针对那些操作的自动化，都需要它自己的决策和评审范围**。\n\n---\n\n## 这批的共同判断标准\n\n**① 未满足 ≠ 失败。**\n\"没有满足条件\"和\"东西坏了\"是两种状态，混在一起会让真正需要警报的情况被淹没。审批篇给了最清晰的切法：`pending`（条件未满足，可解决）/ `success` / `error`（评估本身失败）。\n\n**② 没有 ≠ 有但不同。**\nnpm 篇的第三个 registry 状态（内容变了但版本没变）之所以必须独立存在，是因为它和\"重跑\"看起来都是\"这个版本已经存在了\"。**两种\"已经存在\"只有一个是真的问题。**\n\n**③ 形式检查不是语义检查。**\nIssue 政策检查了正文长度和标题语言，**却无法确立\"请求的工作、预期行为、交付物是否清晰\"**。任何一条政策都该被问一次：**它失败的时候，能不能指出缺失的那个决策？**\n\n**④ 潜伏的 bug 需要专门的搜寻。**\n那条 `^0.0.1` **从未失败，只因版本从未离开 `0.0.1`**。这类 bug 不会通过\"跑测试\"暴露，只能通过**推理条件边界**发现——\"如果这个值变了会怎样\"。\n\n**⑤ 测试环境比真实环境更完备时，测不出缺席。**\nworkspace 安装总是包含每一个包，于是所有测试都通过，而发布的包对拒绝可选 peer 的消费者是坏的。**凡是\"我这个环境里一定有\"的假设，都要问一句：在所有真实环境里也一定有吗？**\n\n**⑥ 假设要标记为假设，并定下验证时点。**\n\"字节可重现性是假设，不是测量\"——而且给出了行动指令：**在第一次可能被重跑的发布之前先测它**。这与第 02、04 批\"诚实的空白\"是同一立场的第三次现身。\n\n**⑦ 幂等不是\"重复执行不出错\"，是\"重复执行不产生新状态\"。**\n跳过状态建立在**内容相等**（integrity 相同）而不是版本相等上，所以\"对同一产物重跑\"这类日常操作不需要任何人工判断。**一个好流程的标志是：重跑它是一件无聊的事。**\n\n**⑧ 顺手能做的事，如果不是本次决策的一部分，就不做。**\n\"自动修复元数据 / 自动分类\"被拒绝的理由是\"它们是独立的决策，而不是随一次政策简化捎带进来\"。**范围蔓延最隐蔽的形式，就是那些看起来相关且容易的事。**\n\n---\n\n## 下一批（待读）\n\n- `2026-07-26-ci-failover-runbook.md` —— 故障切换与运行手册\n- `2026-08-03-package-anchored-subsystem-pages.md` —— 文档结构锚定\n- `2026-07-19-web-styling-system.md` —— 样式系统的约束\n- `2026-08-26-published-dependency-faces.md` —— 发布依赖面\n- `2026-07-19-remove-generated-agent-note-index.md` —— 移除生成的索引\n"},{"file":"2026-09-10-DSH过程决策精读-06-事实住哪里.md","date":"2026-09-10","slug":"DSH过程决策精读-06-事实住哪里","title":"DSH 过程决策精读 · 第 06 批：事实住哪里","statusRaw":"记录（推断 · 2026-09-12）","statusKind":"记录","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"2026-07-19-remove-generated-agent-note-index.md","bytes":13954,"lines":215,"body":"# DSH 过程决策精读 · 第 06 批：事实住哪里\n\n> 状态：记录（推断 · 2026-09-12）\n\n> **本批 3 篇**，主题是\"单一归属\"：**一份事实应该住在哪里、由谁维护、什么时候停止维护。**\n> 这批还有额外价值：**它们对我此前归纳的跨批模式做了交叉验证**（见文末），其中模式 B 和模式 A 得到强力印证。\n\n## 本批篇目\n\n| # | 篇目 | 一句话 |\n|---|---|---|\n| 1 | [移除生成的 Agent Note 索引](#1-移除生成的-agent-note-索引) | 索引是第二份真相，还是个合并热点 |\n| 2 | [冻结低未来价值的 Agent Note](#2-冻结低未来价值的-agent-note) | 存档不是\"假装它仍然是当前的\" |\n| 3 | [包锚定的子系统页面](#3-包锚定的子系统页面) | 可预测性战胜了精确性 |\n\n---\n\n## 1. 移除生成的 Agent Note 索引\n\n`2026-07-19-remove-generated-agent-note-index.md`\n\n### 他们遇到的事\n\n他们曾经提交一个生成的 Agent Note 索引进仓库。两个问题：\n\n**① 它复制了已经存在的事实。** 每个文件的**生命周期/类别路径、文件名日期和 H1** 已经编码了这些信息——索引只是把它们再抄一遍。\n\n**② 它是个可预测的合并热点。**\n\n> Every branch that adds, moves, or renames an otherwise unrelated Agent Note rewrites the same generated file.\n\n**每一个\"添加、移动或重命名一个本来无关的 Agent Note\"的分支，都会重写同一个生成文件。** 换句话说：一个跟你的改动毫无关系的文件，每次都要在你的 diff 里出现。\n\n而且这个集中式时序列表**在树导航和仓库搜索之外，几乎不增加发现价值**——但它的生成器、渲染器、命令和新鲜度检查**仍然是维护负担**。\n\n### 判断\n\n- **生命周期/类别文件系统树就是 Agent Note 的清单**\n- README 保持为**精选的入口点与契约**\n- 发现工作交给**普通的树导航和仓库搜索**\n- 门禁**拒绝**旧的家目录和根 `INDEX.md`；它**不渲染、也不做新鲜度检查**\n\n### 凭什么这么判断\n\n| 方案 | 否决理由 |\n|---|---|\n| 保留提交的生成索引，用\"重新生成\"来解决冲突 | **重新生成让冲突解决变得机械，但不能阻止无关分支修改同一个产物，也不减少它制造的评审噪声** |\n| 提供一个不提交的按需索引命令 | 避免了提交冲突，**但为一个已经由树导航和仓库搜索服务的发现路径，保留了一个渲染器和一条命令** |\n| 恢复手工维护的索引 | **同样的共享文件争用，外加生成方式本来避开的完整性与顺序错误** |\n\n第 3 条尤其利落：**手工索引 = 原有的争用 + 一批新的错误类型。**\n\n### 他们承认的代价\n\n读者**失去了一个单独的时序页面**，改用生命周期/类别树或仓库搜索。\n\n---\n\n## 2. 冻结低未来价值的 Agent Note\n\n`2026-07-26-frozen-agent-note-archive.md`\n\n### 他们遇到的事\n\nimplemented Agent Note 被当作**当前决策记录**来维护，于是活跃语料里的**每一条路径、符号、默认值、翻译、代码围栏、包引用和出站链接，都是一项持续义务**。\n\n当理由能指导未来工作时，这个成本是正当的。但对**已关闭的 UI 细节、小修复、被取代的实现机制、或当前权威在别处的过程历史**，就不正当了。\n\n而两个显而易见的出路都不行：\n\n- **删掉每一个低价值的 implemented 记录** → 会抹掉有用的历史证据\n- **保留每一个被拒绝的提案** → 保留了那些**既不合理也无教益**的想法\n\n他们要的是一条**保留边界**，能区分\"活跃指导\"与\"冻结历史\"，**而又不把归档变成另一个维护层级**。\n\n### 判断（保留规则写得极精细）\n\n- **只有 implemented 笔记能被归档**；proposed 笔记**永不进入归档**（一个过时的提案变成 rejected）\n- 归档条件：已发布的决策**已完成**，且它的**理由、替代方案、后果、负面保证和重新引入条件**都不太可能指导未来工作\n- **不论年龄或字数，以下保持活跃**：基础边界、持久与线路语义、安全规则、**反复出现的设计诱惑**、**未解决的重新引入条件**\n- **rejected 笔记只在它能防止\"一个诱人且有意义的错误\"时保留**，否则作为完整三件套删除\n- 归档变更**只允许四种编辑**：重定位、插入 `Archived: YYYY-MM-DD` 元数据行、相应的 sidecar 重录、机械的入站链接修复\n- 根 `.rgignore` **把归档从\"遍历父目录的搜索\"里排除**（历史查询要显式点名归档目录）\n- **归档后三件套永久冻结**：**不因重命名包、变化的行为、翻译标准、格式规则、断裂的出站链接或后来的文档契约而更新**\n- 门禁**验证指向归档文件的链接**，但**从不把归档文件当作链接源**\n- `verify-archived-agent-notes` 用**路径 + SHA-256 内容哈希**把每个产物封存进一
