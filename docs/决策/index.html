","dsh-guardian","dsh-habit","dsh-memory","dsh-node-appearance"],"summary":"1. 统一范围：所有 @deepseek-ai/dsh-（排除 @deepseek-ai/cordis 与 @deepseek-ai/cordis-plugin-）的 peerDependencies / devDependencies 范围 → ^0.1.1-rc.1（可匹配 0.1.1-rc.2）。@deepseek-ai/cordis@^4.0.1、cordis-plugin-loader ","bytes":3985,"lines":64,"body":"# 全家桶 peer 对齐 DSH 0.1.1-rc.1 —— 决策与实施记录\n\n- **日期**：2026-08-22\n- **背景**：SSiD 内置 DSH 升级 0.1.1-rc.2 后，全家桶插件 peer 仍钉在 `^0.1.0-rc.x`/\n> 状态：进行中（推断 · 2026-09-12）\n\n  `>=0.0.1-rc.x`。npm semver 预发布 tuple 规则下这些范围对 0.1.1-rc.2 全部不满足\n  （实测 false），虽 pnpm strict-peer-dependencies=false 下仅告警不阻断，但长期\n  是隐患（后续内核再升级、其他用户 pnpm 严格模式会炸）。本次统一对齐。\n\n## 决策\n\n1. **统一范围**：所有 `@deepseek-ai/dsh-*`（排除 `@deepseek-ai/cordis` 与\n   `@deepseek-ai/cordis-plugin-*`）的 peerDependencies / devDependencies 范围 →\n   `^0.1.1-rc.1`（可匹配 0.1.1-rc.2）。`@deepseek-ai/cordis@^4.0.1`、`cordis-plugin-loader`\n   不动；`@deepseek-ai/schemastery`（独立版本线 3.18.1）不动。\n2. **版本策略**：peer 契约变化 → minor bump（0.x 语义）：\n   chat-rail 0.2.0→0.3.0、chinese-thinking 0.2.0→0.3.0、draft-polish 0.1.0→0.2.0、\n   guardian 0.1.0→0.2.0、habit 0.1.0→0.2.0、memory 0.4.1→0.5.0、\n   node-appearance 0.2.3→0.3.0、plugin-center 0.1.7→0.2.0、skill-mcp-center 0.3.1→0.4.0\n3. **流程**：批量脚本改 package.json（60 处范围）→ 各仓库 install（npm/pnpm 按 lock）→\n   typecheck → test → build → commit → tag vX.Y.Z → push（GitHub 与 npm 版本对齐）\n   → 给用户 npm publish 指令（2FA 无法代发，用户手动发布）\n4. **发布后**：SSiD profile-template/package.json 依赖范围已是 ^（^0.2.0 等），\n   prepare-runtime 重建归档自动收新版本（minimumReleaseAge: 0 已豁免）。\n\n## 实施状态\n\n- [x] 批量修改 9 个仓库 package.json（脚本 align-peers.mjs，60 处范围）\n- [x] 各仓库 install/typecheck/test/build/commit/tag/push（子代理分批执行 + 手工补两个受阻仓库）\n\n### 执行结果\n\n| 仓库 | 版本 | commit | 备注 |\n|---|---|---|---|\n| dsh-chat-rail | 0.3.0 | 0624afa | ⚠️ 移除 dsh-better-sidebar peer/dev 声明（社区包 omdsh-dev peer 仍旧 rc.8，pnpm 范围合并无解；src 仅注释引用）；测试期望同步（stateVersion 5、hasImage） |\n| dsh-chinese-thinking | 0.3.0 | 7443cf3 | 正常 |\n| dsh-draft-polish | 0.2.0 | d822913 | ⚠️ GitHub 仓库此前不存在，已新建 public（Max-Null/dsh-draft-polish）并推送 |\n| dsh-guardian | 0.2.0 | a091ce6 | 正常 |\n| dsh-habit | 0.2.0 | 857d792 | 正常 |\n| dsh-memory | 0.5.0 | b9057f0 | 正常 |\n| dsh-node-appearance | 0.3.0 | 4773fe1 | ⚠️ 0.1.1-rc.2 内核移除 ui-primitives/ui-slots peer 网络，补声明（primitives 进 peer/dev/inject，ui-slots 进 dev type-only） |\n| dsh-plugin-center | 0.2.0 | 1e34a82 | 正常 |\n| dsh-skill-mcp-center | 0.4.0 | 5f9e9f4 | 正常 |\n\n### 关键教训（2026-08-22）\n\n1. **pnpm 11.21 自动改写 pnpm-workspace.yaml**：install 时自动追加 50+ 条\n   minimumReleaseAgeExclude（@deepseek-ai/dsh-*@0.1.1-rc.1 系列），多个仓库触发，\n   已还原/不提交。\n2. **0.1.1-rc.2 内核 peer 网络收缩**：dsh-client-ui-primitives / ui-slots 不再被\n   任何官方包 peer 引用——src import 它们的插件必须自行显式声明（chat-rail 原已\n   声明；node-appearance 本次补齐）。\n3. **dsh-better-sidebar（omdsh-dev/huanlin 社区包）peer 未对齐**：其 peer 仍为\n   ^0.1.0-rc.x，与本轮 ^0.1.1-rc.1 声明无交集；pnpm 合并产生 `>=0.1.1 \u003c0.2.0-0`\n   （排除全部 prerelease）→ ERR_PNPM_NO_MATCHING_VERSION，9 种绕过方案实测无效，\n   唯一可行是移除 peer 声明。上游对齐前，chat-rail 不再声明协作关系（README 说明）。\n\n## 下一步（用户手动）\n\n- [ ] 逐个 `npm publish`（2FA 无法代发；chat-rail/node-appearance/draft-polish 注意\n      files 含 client.js 检查）\n- [ ] 发布后 prepare-runtime 归档重建（自动收新版本，minimumReleaseAge: 0 已豁免）\n"},{"file":"2026-08-22-chat-rail历史节点修复-投影wire适配.md","date":"2026-08-22","slug":"chat-rail历史节点修复-投影wire适配","title":"chat-rail 历史节点丢失修复 —— 投影 wire API 适配","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-22","dateNote":null,"tags":["dsh-chat-rail"],"summary":"DSH 0.1.1-rc.2 的 session-projection API 破坏性变更：","bytes":3190,"lines":59,"body":"# chat-rail 历史节点丢失修复 —— 投影 wire API 适配\n\n- **日期**：2026-08-22\n- **仓库**：dsh-chat-rail（commit `af4285a`，v0.3.0 重打 tag）\n- **症状**：DSH 重启后载入历史会话，画卷导航栏无历史节点；手动下拉会话点「加载更多」后，\n> 状态：进行中（推断 · 2026-09-12）\n\n  fallback 收集的节点才出现。\n\n## 根因（已实证）\n\n**DSH 0.1.1-rc.2 的 session-projection API 破坏性变更**：\n\n| | rc.8（旧） | rc.2（新） |\n|---|---|---|\n| 单元字段 | `{ key, schema, init, apply, view, stateVersion }` | `{ key, stateSchema, init, apply, wire?: { viewSchema, view }, stateVersion }` |\n| client 快照 | snapshot 输出**所有**注册单元 | **只有带 `wire` 的单元**进 snapshot/restore values；无 wire = host-only（checkpoint 有、client 无） |\n\nchat-rail 的投影定义仍用 rc.8 形状（`schema`/顶层 `view`）→ rc.2 下被当作 host-only 单元\n→ `useProjection('chatRail')` 永远 undefined → rail 空。\n\n验证证据（SSiD 真实环境 boot + detached restore）：\n- 修复前：restore values keys = 官方单元（sessionStats/title/goal/...），无 chatRail；\n  手动 import chat-rail lib 的 apply 注册正常（包本身无问题）\n- 修复后：restore values 含 `chatRail`，`messages=68` 覆盖整会话（seq 7 → 415139），\n  非仅最近页\n\n**why 手动加载更多后有节点**：client fallback `collectFromNodes`（已加载窗口的\nuser 节点）在投影空时兜底；背景 loadOlder 循环因投影「非空即停」的守卫与窗口语义\n配合不佳，历史深度不可靠——但这是 fallback 表象，主修复在投影本身。\n\n## 修复\n\n`src/index.ts`：`schema` → `stateSchema`，`view` 移入 `wire: { viewSchema, view }`\n（chatRail 是导航数据，必须 client-visible）。测试同步（wire.view）。\n`pnpm-workspace.yaml`：`minimumReleaseAge: 0`（pnpm 11 supply-chain lockfile 验证\n以 MINIMUM_RELEASE_AGE_VIOLATION 拦截 0.1.1-rc.1 全家 66 条目，2026-08-22 实测）。\n\n## 影响面\n\n- 全家桶 9 插件中仅 chat-rail 使用 sessionProjections（grep 全量确认），无同类隐患\n- 其他 @max-null 插件（memory/habit/guardian 等）用 storage 服务，不受影响\n- 内置三插件（panels/header-unify/zh-ui）不用投影，不受影响\n\n## 发布要求（关键）\n\n1. **必须发布 chat-rail 0.3.0（含此修复）**：当前 profile 已临时覆盖修复版 host half\n   （用户重启思灵即生效），但归档仍是 0.2.0（无 wire）——若不发布并重建归档，\n   下次归档部署会回退到坏版本。\n2. 发布后：清 pnpm 缓存 → prepare-runtime 重建归档 → 思灵自动升级。\n\n## 遗留观察\n\n- 会话 `session-140b9120`（SSiD 工作区）user/message 事件 182 条 vs chatRail 68 条：\n  差异来自 source.kind 过滤（注入上下文/tool 消息）与无 durable id 消息——符合设计，\n  但若用户感觉节点偏少可再核。\n- SSiD 会话的 projcache 无行（projection-cache 插件在 web profile 未配置？）——\n  冷读走全量折叠，功能正确，缓存缺失仅影响性能，非本次问题。\n"},{"file":"2026-08-22-DSH升级0.1.1-rc.2-多模态升级.md","date":"2026-08-22","slug":"DSH升级0.1.1-rc.2-多模态升级","title":"DSH 升级 0.1.1-rc.2（多模态视觉）—— 决策与实施记录","statusRaw":"已完成（推断 · 2026-09-12）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-22","dateNote":null,"tags":["@deepseek-ai/dsh","ssid-shell","dsh-runtime"],"summary":"1. 插件 API 协议层 ✅：rc.1/rc.2 官方 release notes 无插件破坏性变更；品牌槽位 （sidebar.brand.mark/conversation.hero.brand.mark）、bundle patch 协议 （cordis.patch.yml）、client 注入协议（dsh.client.platform/inject/immediately） 在 0.1.","bytes":5639,"lines":85,"body":"# DSH 升级 0.1.1-rc.2（多模态视觉）—— 决策与实施记录\n\n- **日期**：2026-08-22\n- **动机**：DeepSeek 发布多模态 Flash 模型（DeepSeek-V4-Flash-Vision-Exp，DSH 0.1.1-rc.1 引入），用户希望 SSiD 尽快内置 DSH 0.1.1-rc.2 以解锁视觉能力\n- **涉及仓库**：seek-soul-in-darkness（构建侧）、deepseek-harness（只读）\n\n> 状态：已完成（推断 · 2026-09-12）\n\n## 一、版本现状（检查结论）\n\n| 项 | 值 |\n|---|---|\n| deepseek-harness checkout（apps/cli） | **0.1.1-rc.2**（2026-08-21T12:42Z 发布，\u003c24h） |\n| 上一内置版本 | 0.1.0-rc.8（2026-08-19T15:41Z） |\n| SSiD profile 实况 | `0.1.8-0.1.0-rc.8-76cce55d`（C:\\Users\\MaxNull\\.dsh\\profiles\\ssid） |\n| 安装目录归档 | `C:\\Users\\MaxNull\\AppData\\Local\\Programs\\ssid-shell\\resources\\dsh-runtime.tar.gz`（167MB） |\n| 思灵进程 | 运行中（6 个 electron 进程） |\n\n## 二、兼容性检查结论\n\n1. **插件 API 协议层 ✅**：rc.1/rc.2 官方 release notes 无插件破坏性变更；品牌槽位\n   （`sidebar.brand.mark`/`conversation.hero.brand.mark`）、bundle patch 协议\n   （cordis.patch.yml）、client 注入协议（dsh.client.platform/inject/immediately）\n   在 0.1.1-rc.2 源码中逐一确认保留。插件框架包 rc.8→rc.2 仅 34 文件/376 行小改。\n2. **内置 vendor 插件 ✅**：三插件 cordis.patch.yml 均为 profile 根纯 insert（不碰 DSH 源码）。\n3. **插件 peer 版本范围 ⚠️**：全家桶 peer 钉在 `^0.1.0-rc.7`/`^0.1.0-rc.6`/`>=0.0.1-rc.x`，\n   真实 node-semver 实测对 `0.1.1-rc.2` **全部不满足**（npm 预发布 tuple 规则：\n   候选 prerelease 版本须与范围中某 comparator 的 major.minor.patch 相同）。\n   pnpm 默认 strict-peer-dependencies=false → 仅告警不阻断，运行时风险低；\n   各插件项目后续把 peer 升到 `^0.1.1-rc.1`。\n4. **pnpm 11 发布年龄保护 ❌（阻断级）**：pnpm 11 默认 `minimumReleaseAge: 1440`（1 天），\n   官方文档确认。`@deepseek-ai/dsh@0.1.1-rc.2` 及 60+ 个 `^0.1.1-rc.2` 官方闭包族全部\n   发布 \u003c24h，且 minimumReleaseAgeExclude 名单只有 @max-null 与社区插件。\n   prepare-runtime 每次全新解析（profile-template 无 lockfile）→ 不豁免必装旧版/解析失败。\n\n## 三、决策\n\n1. **`minimumReleaseAge: 0`**（profile-template/pnpm-workspace.yaml）：\n   - 理由：官方闭包 60+ 包同族 \u003c24h，逐包维护 exclude 名单不可行（每个 rc 都要重来）；\n     归档运行时版本由 pnpm-lock.yaml 固定、构建机可控，供应链风险可接受。\n   - 保留既有 minimumReleaseAgeExclude 名单（作信任记录，无害）。\n   - 附带收益：@max-null 全家桶新版本发布后 prepare-runtime 不再受年龄保护阻碍，\n     记忆「发布三步」中的 a 步（豁免名单）不再必需（缓存清理与归档验证仍保留）。\n2. **升级路径**：重跑 prepare-runtime.mjs（DSH_NODE/PNPM_CMD 显式指定）→\n   解压归档静态验证 → 隔离冒烟（DSH_HOME=临时目录 + DSH_CHECKOUT=解压目录，\n   boot-smoke.ts 验证 HTTP 200）→ 替换安装目录归档 → 用户重启思灵 →\n   ensureProfile 自动原子重部署（main.mjs deployRuntime：.deploy.new → rename 原子切换）。\n   不手动替换运行中 profile，避免文件占用与破坏运行中进程。\n\n## 四、实施步骤\n\n- [x] 1. pnpm-workspace.yaml 加 `minimumReleaseAge: 0`\n- [x] 2. 清 pnpm metadata 缓存（%LOCALAPPDATA%\\pnpm-cache\\v11\\metadata{,-full}）\n- [x] 3. `node scripts/prepare-runtime.mjs`（DSH_NODE=C:\\Program Files\\nodejs\\node.exe，\n      PNPM_CMD=...\\npm\\node_modules\\pnpm\\bin\\pnpm.mjs）—— 最终归档 159.7MB，\n      `.runtime-version = 0.1.8-0.1.1-rc.2-0f58d550`\n- [x] 4. 归档验证：`tar -xzOf` @deepseek-ai/dsh = 0.1.1-rc.2、cordis = 4.0.1、\n      全家桶 9 插件版本正确、内置三插件（header-unify/panels/zh-ui）实体完整\n- [x] 5. 隔离冒烟：解压归档 → DSH_CHECKOUT 指向 → boot-smoke HTTP 200（14522 bytes）\n- [x] 6. 替换安装目录归档（rc.8 备份 dsh-runtime.tar.gz.rc8.bak）→ 重启思灵 →\n      ensureProfile 自动重部署完成（.runtime-version 0.1.8-0.1.1-rc.2-0f58d550）\n- [x] 7. 用户 GUI 验收（2026-08-22 用户确认\"没什么问题\"）：品牌瞳孔标记、\n      中文面板/汉化、better-sidebar 布局、模型选择器含 DeepSeek-V4-Flash-Vision-Exp\n- [x] 8. 提交（485c69a：pnpm-workspace.yaml + prepare-runtime.mjs + 本文档）\n\n### 过程修正（2026-08-22）\n\n首次跑 prepare-runtime：pnpm install 成功（901 包全 0.1.1-rc.2），但 `pnpm add 缺失 peer`\n在打印 \"Done in 16.4s\" 后进程不退出（慢网络下 supply-chain 全量验证挂起），被 10 分钟\ntimeout 杀死（spawnSync ETIMEDOUT）。实测 add 实际已完成：dependencies 已写入 20 个\npeer、pnpm-lock.yaml 已生成（759KB）、node_modules 完好。\n\n**脚本改进**（prepare-runtime.mjs）：\n1. 第 3 步注入 @deepseek-ai/dsh 时同步把 MISSING_PEERS 注入 dependencies\n   （版本随 DSH_VERSION 动态对齐，保持单一版本来源）；\n2. 删除 install 后的 pnpm add 步骤（peer 已是显式依赖，install 一步到位）；\n3. runPnpm timeout 10 分钟 → 30 分钟（慢网络兜底）。\n\n## 五、回滚\n\n- 构建侧：旧 dsh-runtime.tar.gz（git 无归档，构建产物）——本机安装目录归档\n  替换前保留原文件副本 `dsh-runtime.tar.gz.rc8.bak`。\n- 部署侧：deployRuntime 自带回滚（失败保留 .deploy.old，.runtime-version 归零\n  强制下次重部署）。\n"},{"file":"2026-08-22-open-sea-skin本地增强与SSiD集成.md","date":"2026-08-22","slug":"open-sea-skin本地增强与SSiD集成","title":"open-sea-skin 本地增强与 SSiD 集成（2026-08-22）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["dsh-bundle","dsh-header-unify"],"summary":"open-sea-skin（d-dev0101/open-sea-skin，WebGPU 海洋皮肤，release tarball 安装）加入 SSiD 预制后，用户要求：设置面板增加「启用开关（ossEnabled）」「自动昼夜循环开关（autoCycle）」「恢复默认」按钮。","bytes":3352,"lines":42,"body":"# open-sea-skin 本地增强与 SSiD 集成（2026-08-22）\n\n> 状态：进行中（推断 · 2026-09-12）\n\n## 背景\n\nopen-sea-skin（d-dev0101/open-sea-skin，WebGPU 海洋皮肤，release tarball 安装）加入 SSiD 预制后，用户要求：设置面板增加「启用开关（ossEnabled）」「自动昼夜循环开关（autoCycle）」「恢复默认」按钮。\n\n## 决策：fork 本地构建，tarball 进归档\n\n- **不改官方 release 依赖**（URL tarball 无法承载改动，也不维护外部 fork 发布链路）\n- **本地 fork**：源码入库 `plugins/open-sea-skin/`（基于上游 main v1.2.1，去掉 .git），改动集中在 `shared/skin-core.js`\n- **构建产物**：`node scripts/build-runtime.mjs && node scripts/build-dsh-bundle.mjs` → `plugin/client.js`（skin-core + localStorage adapter 拼接）\n- **打包**：`npm pack` → `open-sea-skin-1.2.1.tgz`（383KB，24 文件，files 字段含 plugin/native-dist/cordis.patch.yml）\n- **预制引用**：`shell/profile-template/package.json` 依赖 `open-sea-skin: file:./vendor/open-sea-skin-1.2.1.tgz`（tarball 存 `shell/profile-template/vendor/`）——归档构建离线可用，不依赖上游 release\n\n## 改动内容（shared/skin-core.js）\n\n1. **启用开关**：面板新增 checkbox，绑定 `ossEnabled`；`applyEnabled` 调整——禁用时**只卸载海洋背景（frame/glass），保留按钮/面板**（否则设置入口消失无法再启用；2026-08-22 实测原实现 `unmount()` 会把按钮一起移除）\n2. **自动昼夜循环开关**：checkbox 绑定 `ossAutoCycle`（原面板无此开关，手动拖「日光」会置 false 且无法恢复）\n3. **恢复默认按钮**：重置 state 为 DEFAULTS（45/55/72/循环开）→ 写 localStorage 5 键 → 同步 UI/玻璃/海洋/启用状态\n4. 面板样式（.oss-switch / .oss-reset）沿用海洋主题（#8fe9e4 accent）\n\n## SSiD 集成链路（标题栏入口）\n\n- `shell/titlebar.html/js`：插件中心按钮左侧新增「海洋皮肤」按钮 → IPC `ssid:title:action('open-sea-skin')`\n- `shell/main.mjs`：action 通用转发（无需改）→ mainView 派发 `ssid:titlebar` detail='open-sea-skin'\n- `plugins/dsh-header-unify/lib/client.js`：监听该事件 → `document.getElementById('__open-sea-skin-btn__').click()`\n- **隐藏原浮动按钮**：`visibility:hidden + pointer-events:none`（**不能用 display:none**——面板按按钮 rect 定位，display:none 后 rect 全 0 面板飞出视口，2026-08-22 实测）\n- 标题栏 asar 热替换生效（`resources/app.asar` 解包→替换→重打包，原包备份 `app.asar.bak-0622`）；正式分发需 `npm run pack` 重新打安装包\n\n## 配置存储与重置（实证自 plugin/client.js）\n\nlocalStorage 5 键：`ossEnabled` / `ossSea` / `ossTime` / `ossGlass` / `ossAutoCycle`。\n手动重置（DevTools console）：`['ossEnabled','ossSea','ossTime','ossGlass','ossAutoCycle'].forEach(k => localStorage.removeItem(k))` 后刷新。\n面板「恢复默认」按钮等效实现（无需 DevTools）。\n\n## 后续注意\n\n- profile 的 node_modules/open-sea-skin 为手动替换的本地构建（1.2.1）；**执行 pnpm install 前须先完成归档流程**（否则被恢复为官方 1.2.0 URL 版）\n- 归档构建（prepare-runtime）时 file: tarball 依赖随 profile-template 复制，离线可装\n"},{"file":"2026-08-22-open-sea-skin增强版提交上游PR.md","date":"2026-08-22","slug":"open-sea-skin增强版提交上游PR","title":"open-sea-skin 增强版提交上游 PR（2026-08-22）","statusRaw":"已完成（推断 · 2026-09-12）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":[],"summary":"前一决策（2026-08-22-open-sea-skin本地增强与SSiD集成.md）本地 fork 增强版已运行于 SSiD。用户要求：将增强改动整理成 commit 并向上游 d-dev0101/open-sea-skin 提 PR。","bytes":3028,"lines":44,"body":"# open-sea-skin 增强版提交上游 PR（2026-08-22）\n\n> 状态：已完成（推断 · 2026-09-12）\n\n## 背景\n\n前一决策（2026-08-22-open-sea-skin本地增强与SSiD集成.md）本地 fork 增强版已运行于 SSiD。用户要求：将增强改动整理成 commit 并向上游 d-dev0101/open-sea-skin 提 PR。\n\n## 调研结论\n\n- **本地 fork 与上游 main 的差异只有 4 个文件**：`shared/skin-core.js`（手写）+ `plugin/client.js`、`extension/content.js`、`native-dist/loader.js`（均由 build 脚本从 skin-core 生成，必须 byte-for-byte 同步）\n- 上游 main（2437d80）领先 v1.2.1 共 6 个提交（website/CI），本地 fork 基于 main 全量拷贝，PR 基线用 main\n- 上游 CONTRIBUTING 要求：改 shared/ 后跑 `npm run build`、更新 CHANGELOG.md、跑测试（installer 测试依赖 bash，Windows 跳过）\n- gh（Max-Null）已登录，有 repo 权限；Max-Null/open-sea-skin fork **尚未创建**，需先 fork\n\n## 提 PR 前的代码修正（评审发现的 3 个问题）\n\n1. **中文注释 → 英文**：原改动含「SSiD 增强（2026-08-22）」等内部注释，上游全英文注释，公开 PR 需剥离内部引用\n2. **autoCycle 复选框不同步 bug**：拖「日光」滑块的原始逻辑置 `state.autoCycle = false` 并保存，但新复选框仍显示勾选 → 同步 `cycleBox.checked`\n3. **reset 走单一写入路径**：改为 `save({...DEFAULTS}).then(...)`（save 内部已更新 state），避免先手动赋值 state 再写存储的重复路径\n\n## PR 核心卖点（对上游的价值）\n\n- 新增「启用」「自动昼夜循环」「恢复默认」3 个控件（修复禁用后不可再启用的逻辑缺陷）\n- 原版 disabled → `unmount()` 会删除按钮/面板 → 无法再启用；增强版只卸载海洋背景（frame/glass），保留设置入口\n\n## 执行结果\n\n- **PR 已创建并验证**：https://github.com/d-dev0101/open-sea-skin/pull/1 （OPEN, MERGEABLE）\n- commit `c73f133`（分支 `feat/quick-controls-enable-toggle`，作者 MaxNull / 24647158+Max-Null@users.noreply.github.com，含 CHANGELOG Unreleased）\n- 构建产物 `--check` 通过（byte-for-byte 同步）；static/bundle 测试除「site/index.html hash」外全绿——该失败为上游 main 既有问题（测试期望 hash 是按 LF 计算的 `69267b…`，Windows CRLF checkout 本地必失败，CI Linux 无碍），与本次改动无关\n- 本地 fork 4 个代码文件与 PR 分支完全一致（仅 CHANGELOG 差异预期内）\n- fork 仓库：https://github.com/Max-Null/open-sea-skin\n\n## 后续注意\n\n- 作者合并后如需回投 tarball 重建 SSiD vendor，按归档流程走（本次未重建）\n- 若作者未响应，可考虑跟进评论或关闭 PR（本地增强版不依赖合并，SSiD 继续用 file: tarball）\n\n## 不涉及\n\n- 不重建 SSiD vendor tarball / 归档（当前部署已用修正前版本且工作正常；下一轮归档时自然带入修正版）\n- 不改 package.json 版本（发版由维护者决定）\n"},{"file":"2026-08-22-SSiD归档重建与预置插件升级.md","date":"2026-08-22","slug":"SSiD归档重建与预置插件升级","title":"SSiD 归档重建与预置插件升级（2026-08-22，接手误关闭会话）","statusRaw":"进行中（推断 · 2026-09-12）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":null,"dateNote":null,"tags":["@max-null/dsh-plugin-center","@deepseek-ai/dsh","@max-null/dsh-chat-rail","@max-null/dsh-memory","dsh-runtime","dsh-plugin-center","dsh-better-sidebar","dsh-sidebar-qa","dsh-dream-skin","dsh-skin","dsh-chat-rail","dsh-memory"],"summary":"前一会话正在执行 SSiD 归档发版链时被误关闭（shell/dsh-runtime.tar.gz 落在 0 字节 = tar 阶段中断前的残留）。该会话已完成： - npm 发布链：chat-rail 0.3.1（tip 缩略图 + 收起态角标）、plugin-center 0.2.3（AI 推荐修复 + 0.2.1 发布时的文档复盘） - profile-template 依赖声明 @max-","bytes":4210,"lines":61,"body":"# SSiD 归档重建与预置插件升级（2026-08-22，接手误关闭会话）\n\n> 状态：进行中（推断 · 2026-09-12）\n\n## 背景\n\n前一会话正在执行 SSiD 归档发版链时被误关闭（`shell/dsh-runtime.tar.gz` 落在 0 字节 = tar 阶段中断前的残留）。该会话已完成：\n- npm 发布链：chat-rail 0.3.1（tip 缩略图 + 收起态角标）、plugin-center 0.2.3（AI 推荐修复 + 0.2.1 发布时的文档复盘）\n- profile-template 依赖声明 `@max-null/dsh-plugin-center` 升至 `^0.2.3`（未提交，本次并入）\n\n## 本次接手执行\n\n### 1. 预置插件版本对齐（shell/profile-template/package.json，commit 580a1b4）\n\n| 包 | 声明 | npm 最新 | 处理 |\n|---|---|---|---|\n| @max-null/* 全家桶 9 包 | 各 ^x.y.z | 全部一致 | 无需改（chat-rail ^0.3.1 / plugin-center ^0.2.3 等） |\n| dsh-better-sidebar | ^0.14.0 | 0.15.0 | 升 ^0.15.0 |\n| dsh-sidebar-qa | ^0.2.0 | 0.4.0 | 升 ^0.4.0 |\n| dsh-dream-skin / open-sea-skin / vendor 三件套 | — | — | 保持 |\n\n### 2. bundles 残留修复（关键，否则新归档部署即崩溃）\n\n`dsh.profile.bundles` 中：\n- **移除 `dsh-skin`**：依赖已在 e06a10a 移除，但 bundles 残留。kernel `resolveBundleDir` 对 bundle 列表逐包 resolve，找不到直接 throw（`cannot resolve profile bundle`）→ 新归档部署后思灵启动必崩。\n- **补入 `dsh-dream-skin`、`open-sea-skin`**：两包均声明 `dsh.bundle.patch`（npm view / tgz 实测确认），不进 bundles 皮肤不会加载。\n\n### 3. 归档重建与验证链（已执行 ✅）\n\n- `node scripts/prepare-runtime.mjs`：node 自动命中 PATH v26.2.0，pnpm 命中 %APPDATA% 全局 cjs（无需 DSH_NODE/PNPM_CMD）；pnpm install 19.6s（967 包，store 复用 906）+ vendor 兜底正常\n- 归档产物 `shell/dsh-runtime.tar.gz` **163.5 MB**，`.runtime-version = 0.1.8-0.1.1-rc.2-489c8bdf`\n- 归档冒烟（tar 解压 → Node UTF-8 核对实体 package.json，**勿信 pnpm view/乱码的 PowerShell 读取**）：\n\n| 包 | 归档内实体版本 | 期望 |\n|---|---|---|\n| @deepseek-ai/dsh | 0.1.1-rc.2 | ✅ |\n| @max-null/dsh-chat-rail | 0.3.1 | ✅（client.js 含 crl_tipImgCount / attachmentId 新代码） |\n| @max-null/dsh-plugin-center | 0.2.3 | ✅ |\n| @max-null/dsh-memory | 0.5.0 | ✅ |\n| dsh-better-sidebar | 0.15.0 | ✅ |\n| dsh-sidebar-qa | 0.4.0 | ✅ |\n| dsh-dream-skin | 0.4.10 | ✅ |\n| open-sea-skin | 1.2.1 | ✅（file: tarball 本地增强版） |\n| vendor 三件套 | header-unify 0.1.0 / ssid-panels 0.1.3 / ssid-zh-ui 0.1.0 | ✅ |\n\n- 安装目录归档已替换（`C:\\Users\\MaxNull\\AppData\\Local\\Programs\\ssid-shell\\resources\\dsh-runtime.tar.gz`，旧版备份 `.bak-0822`）；profile 现 `.runtime-version=0f58d550` ≠ 归档 `489c8bdf` → 思灵下次启动自动触发重部署\n- 运行 profile 全程未跑 pnpm install（pitfalls 第 11 节顺序约束 ✓，open-sea-skin 手动增强版未被恢复）\n\n### 4. v0.1.9 发版（已执行 ✅）\n\n- **版本决策**：远端 tag v0.1.8 已锚定 8/21 rc.8 时代提交（且 v0.1.7/v0.1.8 均未建 Release），本次 rc.2 内容不可复用 0.1.8 命名 → shell/package.json bump **0.1.9**（commit c5dd8fd）\n- 重跑 prepare-runtime：`.runtime-version = 0.1.9-0.1.1-rc.2-489c8bdf`（指纹与 0.1.8 版一致——依赖/vendor 未变，仅 ssid 版本号变化），冒烟全绿后替换安装目录归档（当前版备份 `.bak-0822b`）\n- `npm run pack`：after-pack 确认 dsh-runtime.tar.gz 163.5MB 入包 → **思灵 Setup 0.1.9.exe（253.9MB）** 签名 + blockmap ✓\n- tag v0.1.9 推送 + GitHub Release：https://github.com/Max-Null/seek-soul-in-darkness/releases/tag/v0.1.9（资产 Setup.0.1.9.exe / .blockmap，命名与 v0.1.6 一致；release-notes-v0.1.9.md 注明 v0.1.7/0.1.8 为本地构建未发）\n- 教训：`gh release create` 的 `--assets` 在 PowerShell 下必须单字符串逗号分隔（数组会展开成多个参数导致解析失败）；`gh release edit` 后再 `upload` 单独传资产更稳。\n\n### 5. 待办（用户操作）\n\n- [ ] `npm run pack`（electron-builder NSIS，含标题栏海洋皮肤按钮等 asar 改动）\n- [ ] GitHub Release（release-notes + 版本）\n"},{"file":"2026-08-20-输入框命令权限中文化-内部插件方案.md","date":"2026-08-20","slug":"输入框命令权限中文化-内部插件方案","title":"输入框命令/权限中文化：SSiD 内部插件方案","statusRaw":"已决策（推断 · 2026-09-12）","statusKind":"已决策","owner":"MaxNull（方案由 DSH 源码调研得出）","purpose":null,"dateInBody":"2026-08-20","dateNote":null,"tags":["@max-null/dsh-ssid-zh-ui","@max-null/dsh-","dsh-ssid-zh-ui","dsh-header-unify"],"summary":"DSH Web GUI 整体已是中文（locale 系统存在且 zh 是键集源），但输入框两处内容仍为英文：","bytes":9662,"lines":131,"body":"# 输入框命令/权限中文化：SSiD 内部插件方案\n\n> 日期：2026-08-20\n> 决策人：MaxNull（方案由 DSH 源码调研得出）\n> 范围：仅 SSiD 内置（`plugins/` + `profile-template/vendor/`），不发布社区插件\n\n> 状态：已决策（推断 · 2026-09-12）\n\n## 一、背景与问题\n\nDSH Web GUI 整体已是中文（locale 系统存在且 zh 是键集源），但**输入框两处内容仍为英文**：\n\n| 位置 | 英文内容 | 原因 |\n|---|---|---|\n| 权限触发器（输入框盾牌按钮 + 菜单） | `Read Only` / `Workspace Write` / `Full access` | 客户端 `PermissionSelect.tsx` 把机器名 kebab 转 Title Case，`Full access` 为硬编码；host 端 `optionOf()` 未配置 name/description 时回退英文 |\n| `/` 命令弹窗（命令行） | 命令 description（`Switch the permission preset...` 等） | 各插件注册命令时 `description` 英文硬编码，未走 locale 字典 |\n\n目标用户：SSiD 非开发用户。命令名（`/compact` 等）是命令语法本身，不翻译；命令描述与权限展示名/描述需要中文化。\n\n## 二、可挂载点调研结论（DSH 源码）\n\n结论先行：**官方扩展面（slot / remote / provide 替换）均不可行，唯一可行且低侵入的挂点是 host 端包装服务实例方法**。\n\n| 候选挂点 | 结论 | 依据 |\n|---|---|---|\n| 客户端 slot 替换权限触发器 | ❌ | `PermissionSelect`/命令按钮是 `ui-conversation` `InputBar.tsx` 硬编码组件，不在 slot 里；`conversation.input.left/right` 文档明言 \"never replace\" 内置 chrome |\n| 客户端替换 `remote.commands` | ❌ | `RemoteNamespaceService` 经 `ctx.plugin` + `provide('remote.commands')` 注册，Cordis provide 唯一实现语义，重复提供抛错（`vendor/cordis/src/reflect.ts` L289） |\n| host 端 `ctx.provide` 替换 services | ❌ | 同上，provide 唯一性 |\n| **host 端包装服务实例方法** | ✅ | Cordis `ctx.get` 返回 traced proxy，`Symbol.for('cordis.original')` 可取原始实例（`vendor/cordis/src/utils.ts` L54/L117）；Typert gateway 每次 RPC 实时 `ctx.get(serviceKey)` 解析 receiver（`packages/api/gateway/src/index.ts` L150），`Reflect.get(receiver, method)` 实例 own 属性优先于原型（L163），`originalOf` 只用于 binding 验证（L537）——实例 `defineProperty` 包装方法对 Typert 反射无影响 |\n\n## 三、方案\n\n**新增 SSiD 内置插件 `@max-null/dsh-ssid-zh-ui`（纯 host 端，无 client half）**：\n\n```\nplugins/dsh-ssid-zh-ui/\n├── package.json        # @max-null/dsh-ssid-zh-ui；dsh.bundle.patch\n├── cordis.patch.yml    # insert 一行插件\n├── lib/index.mjs       # apply：inject ['commands','permissionPresets'] → 包装实例方法\n└── verify-zh-ui.cjs    # node 模拟验证（仿 verify-header-unify.cjs）\n```\n\n### 3.1 包装点\n\n1. **`ctx.commands.list(agent)`** → 返回的 descriptor 数组逐项替换 `description`（按命令名查中文表，未收录保持原样）。\n2. **`ctx.permissionPresets.optionOf(name)`** → 预设项返回中文 `name`/`description`；`custom` 分支固定中文。\n   - 客户端 `displayName()` 对非 kebab 字符串原样透传（`PermissionSelect.tsx` L55-58），中文 name 可直接显示；`selectFor` 内部 `this.optionOf(...)` 会解析到实例 own 属性（包装后的方法），投影/RPC/客户端整链路生效。\n\n### 3.2 实现要点\n\n- 用 `ctx.inject(['commands', 'permissionPresets'], cb)` 等待服务；Cordis 服务 HMR 重载后 inject 重新执行，包装跟随新实例。\n- 通过 `service[Symbol.for('cordis.original')] ?? service` 取原始实例，`Object.defineProperty` 包装（configurable: true），实例 own 属性遮蔽原型方法。\n- 包装幂等（实例上挂标记符号，防重复包装）。\n- 防御：包装失败 try/catch 记 `ctx.logger.warn`，绝不影响 host 启动。\n- wrapper 内用 `Reflect.apply(original, this, args)` 转发，保持 `this` 语义（`list` 内部调用 `this.view()` 等私有方法）。\n\n### 3.3 翻译表\n\n**命令描述**（官方 6 命令全收录，未知保留）：\n\n| 命令 | 中文描述 |\n|---|---|\n| `/compact` | 压缩当前会话的历史记录，释放上下文空间 |\n| `/feedback` | 对当前会话或消息提交反馈 |\n| `/goal` | 为当前会话设置长期执行目标 |\n| `/permission` | 切换权限模式（沙箱范围 + 审批策略） |\n| `/plan` | 进入或退出计划模式 |\n| `/export` | 导出当前会话日志为文件 |\n\n> hint（命令参数占位，如 `\u003cpreset>`）**不翻译**——它是命令语法提示，用户需输入机器值，避免误导。\n\n**权限预设**（覆盖三个默认预设 + custom）：\n\n| 预设 | name | description |\n|---|---|---|\n| `read-only` | 只读 | 仅允许读取与浏览，不授予文件修改或命令执行权限 |\n| `workspace-write` | 工作区写入 | 允许修改当前工作区文件；敏感操作与外部命令仍需逐项确认 |\n| `danger-full-access` | 完全访问 | 可直接执行敏感操作、文件修改或外部命令，不再逐项确认；仅建议在信任任务时使用 |\n| `custom` | 自定义 | 当前沙箱与审批设置不匹配任何预设 |\n\n## 三·五、演进记录（2026-08-20 实测后）\n\n### v1（host 包装）→ v2（client 展示层翻译）决策\n\nv1 实现为 host 端包装 `commands.list` / `permissionPresets.optionOf`，经 settings 语言开关控制翻译。**实测发现死结**：权限投影与命令目录的数据推送是事件驱动的（会话事件/`commands/change`），语言切换**不会触发数据重推**——host 翻译写入数据后，客户端缓存的中文无法切回英文，必须刷新页面才恢复。\n\n**v2 决策：翻译整体移到 client 展示层**：\n\n- host half 变 no-op（数据保持英文原文）。\n- client half 维护**英文原文 → 中文**翻译表（`TEXT_ZH`，文本全等匹配），按 `ctx.locale`（`locale/change` 事件）即时替换/恢复；MutationObserver 兜底 React 重渲染。\n- 替换范围限定 css-modules 原始段 + role 语义：`[class*=\"triggerLabel\"]`（输入框权限/模型触发器）、`[class*=\"selector\"]`（设置页选择器）、`[role=\"menuitem\"]`（菜单项）、`[role=\"option\"]`（命令/权限弹窗选项）。文本全等匹配，官方中文子串（「启用 Full access」）与消息正文不受影响。\n- 权限名中客户端 `PermissionSelect.tsx` 对 `danger-full-access` 硬编码 `Full access`，host 数据无法覆盖——v2 一并由展示层替换为「完全访问」（含菜单项、弹窗选项、设置页选择器）。\n\n**翻译表**（`TEXT_ZH`，11 条 + `ZH_TO_EN` 1 条）：\n\n| 英文原文（rc.8） | 中文 |\n|---|---|\n| `Read Only` / `Workspace Write` / `Full access` / `Custom` | 只读 / 工作区写入 / 完全访问 / 自定义 |\n| `Compact older conversation history` | 压缩当前会话的历史记录，释放上下文空间 |\n| `set or view the goal for a long-running task` | 为当前会话设置长期执行目标 |\n| `Enter or leave plan mode` | 进入或退出计划模式 |\n| `Switch the permission preset (sandbox mode + approval policy)` | 切换权限模式（沙箱范围 + 审批策略） |\n| `Download this Session log as a ZIP archive` | 导出当前会话日志为文件 |\n| `record feedback about this session` | 对当前会话或消息提交反馈 |\n| `Select the model for this conversation` ↔ `选择本会话使用的模型` | 双向（`/model` 命令描述） |\n\n> `/model` 双向兜底：官方 `ui-model-selection` 的命令描述**注册时快照 locale，切语言不刷新**（源码注释明言）。插件用 `ZH_TO_EN` 反向表兜底：中文界面把英文快照转中文，英文界面把中文快照转英文。两表键集互斥（英文键集 vs 中文键集），restore + 正向替换顺序无冲突。\n\n### 实测验收（用户，2026-08-20）\n\n中文界面权限「只读/工作区写入/完全访问」、命令描述中文；切 English 全部即时恢复英文；切回中文即时恢复。`verify-zh-ui.cjs` 43 项断言全过。\n\n## 四、装配与分发\n\n1. 源码：`plugins/dsh-ssid-zh-ui/`（SSiD 仓库内置，仿 `dsh-header-unify`）。\n2. vendor 分发：`shell/profile-template/vendor/dsh-ssid-zh-ui/`（lib 产物副本），`profile-template/package.json` dependencies + bundles 各加一行 `file:./vendor/...`。\n3. 发布链：`scripts/prepare-runtime.mjs` 重跑（新归档含本插件），后续随 SSiD 版本发布。\n4. 本机验证：vendor 副本 + profile `package.json` + pnpm install + 重启 dsh web。\n\n## 五、验证计划\n\n1. `verify-zh-ui.cjs`：node 模拟——翻译表覆盖断言、`wrapList` 翻译/未知保留、`wrapOptionOf` 预设中文/custom 中文/未知走原逻辑、实例 own 属性遮蔽断言。\n2. 实机（本机 ssid profile + 3080 GUI）：权限按钮显示「工作区写入」、菜单「只读/工作区写入/Full access」、tooltip 中文描述；`/` 命令弹窗 description 中文；`/permission` 执行不受影响（机器值不变）。\n3. HMR/重载：改插件重启 profile 后包装仍生效。\n\n## 六、风险与边界\n\n- **上游演进**：DSH 若把命令 description 接入 locale（PR 方向），本插件翻译表可能与其重叠——届时保留本插件（内部用户零感知）或移除（让位上游），二选一。\n- **rc 版本差异**：本方案针对 rc.8 产物（profile 已实测）；上游 master 的 `optionOf`/`list` 签名与 rc.8 一致（源码调研）。\n- **全家桶命令**：`@max-null/dsh-*` 若有自注册命令，未收录时保持英文（兜底不破坏）。\n"},{"file":"2026-08-19-记忆插件升级-实施.md","date":"2026-08-19","slug":"记忆插件升级-实施","title":"记忆插件升级实施：审核与注入解耦（0.3.0）","statusRaw":"实施完成（代码/单测/端点验证全过），待 UI 实机验证 + 发布","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["dsh-memory","dsh-ssid-panels"],"summary":"迁移规则（读旧 schema 兼容转换，不重写文件）： - 旧 auto → { status:'approved', injected:true }（行为不变） - 旧 suggest → { status:'suggested', injected:false } - 旧 suggested / 缺 injected → { status:'suggested', injected:false","bytes":3643,"lines":56,"body":"# 记忆插件升级实施：审核与注入解耦（0.3.0）\n\n> 日期：2026-08-19\n> 状态：**实施完成（代码/单测/端点验证全过），待 UI 实机验证 + 发布**\n> 涉及仓库：`H:\\MaxNull\\WorkStation\\dsh-memory`（0.2.2 → **0.3.0 已提交 7ea4b1e**）、SSiD 仓库 `plugins/dsh-ssid-panels`（**已提交 472c965**）\n\n---\n\n## 一、设计要点回顾（读源码实证后确认）\n\n| 通道 | 现状（v0.2.2） | 改后（0.3.0） |\n|---|---|---|\n| 状态 | `suggested\\|auto\\|suggest` | `suggested\\|approved` + `injected: boolean`（二维） |\n| 注入 | `list({status:'auto'})` 全量注入 | `list({status:'approved', injected:true})` |\n| confirm | `setStatus(id,'auto')` | `setStatus(id,'approved')`（审核语义，不触发注入） |\n| 检索 | memory_search 任意 status | 不变（含 suggested，已确认决策） |\n| RPC | list/search/confirm/forget/reload | + `setInjected(id, boolean)` |\n\n**迁移规则**（读旧 schema 兼容转换，不重写文件）：\n- 旧 `auto` → `{ status:'approved', injected:true }`（行为不变）\n- 旧 `suggest` → `{ status:'suggested', injected:false }`\n- 旧 `suggested` / 缺 injected → `{ status:'suggested', injected:false }`\n- `approved` + 缺 injected → `injected:false`（新写路径）\n\n## 二、改造清单\n\n### dsh-memory（src/）\n| # | 文件 | 改动 |\n|---|---|---|\n| 1 | `engine.ts` | `MemoryStatus='suggested'\\|'approved'`；`StoredBlock`/`MemoryRecord` 加 `injected: boolean`；schema 兼容旧值（status 保留 auto/suggest 枚举 + injected optional）+ `normalizeBlock()` 迁移；`MemoryFilter` 加 `injected?`；list 过滤 injected；新增 `setInjected(id, injected)` |\n| 2 | `index.ts` | RECORD_SCHEMA/tool record 加 injected、status enum 改 approved；`recallText` 只取 approved+injected:true；`memory_confirm` 语义改审核 + 双语描述；GUIDANCE 双语重写；memory_list/search 参数加 injected |\n| 3 | `remote.ts` | `confirm` → setStatus(approved)；新增 `@Remote('setInjected')` |\n\n### dsh-ssid-panels（SSiD 仓库 plugins/dsh-ssid-panels）\n| # | 改动 |\n|---|---|\n| 4 | 记忆 tab：卡片「常驻注入」开关（approved 可切、suggested 禁用）→ `api('memory.setInjected', ...)` |\n| 5 | 三组分组（待审核/按需/常驻注入）+ namespace 筛选 + 中英文案（待审核/已审核/常驻注入） |\n| 6 | 记忆 tab 头部「整理记忆」按钮：`sessions.create` → `open` → input 就绪 `setDraft` → `submit`（一点即发） |\n\n## 三、验证计划\n\n- [x] dsh-memory：typecheck + vitest（**10 项全过**：新增默认不注入/recall 过滤/list 过滤/setInjected/旧数据迁移 5 项）\n- [x] 真实存储迁移：dev 实机 `/ssid/api/memory.list`——**3 条旧 auto 全部 approved+injected:true**（注入行为不变）\n- [x] setInjected 端点：关闭→injected=false（list 复核 3→2），恢复→true\n- [x] panels：build 通过 + vendor 同步（robocopy /MIR）\n- [ ] dev 实机 UI：三组分组/筛选正确；开关→注入行为变化；「整理记忆」按钮流程（sessions.create→open→input 就绪→setDraft→submit，**hero 页/会话页两场景**）\n- [ ] 回归：迁移后注入行为不变（已由迁移验证覆盖）\n\n## 四、发布链（清单 7-8）\n\n1. dsh-memory 0.3.0 npm publish（用户 OTP；已登录 max-null）\n2. dsh-ssid-panels 0.1.3（vendor 分发，不发布 npm）→ 已同步 vendor + 提交\n3. SSiD profile-template：dsh-memory ^0.2.0 → ^0.3.0 + pnpm-workspace 豁免 0.3.0\n4. prepare-runtime（**与 v0.1.6 发布链耦合**：plugin-center 0.1.7 + dsh-memory 0.3.0 一次归档重建）\n"},{"file":"2026-08-19-记忆面板归属迁移-dsh-memory自带UI.md","date":"2026-08-19","slug":"记忆面板归属迁移-dsh-memory自带UI","title":"记忆面板归属迁移 + 工作区路由：dsh-memory 自带 client UI","statusRaw":"已决策，实施中","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["dsh-memory","dsh-ssid-panels"],"summary":"1. 记忆的面板应该跟随 dsh-memory，放在 dsh-ssid-panels 不合适 → 已实施（0.3.3 自带 client UI，侧栏 tab + 设置页兜底入口） 2. 工作区语义：设置页/侧栏都保留\"工作区 tab 显示当前会话工作区的 project 记忆\"；未选择工作区时显示\"未选择工作区\"；术语统一用「工作区」（不用「项目」）","bytes":3442,"lines":70,"body":"# 记忆面板归属迁移 + 工作区路由：dsh-memory 自带 client UI\n\n> 日期：2026-08-19\n> 状态：**已决策，实施中**\n> 关联：`docs/设计/2026-08-16-记忆UI面板-实现设计.md`（当时结论：Typert remote 独立包不可做、面板落 SSiD 侧——**该前提已过时**：dsh-memory 0.1.x 已自带 MemoryGateway remote，client 数据通道成立）\n\n---\n\n## 一、用户反馈（两轮）\n\n1. 记忆的面板应该跟随 dsh-memory，放在 dsh-ssid-panels 不合适 → **已实施**（0.3.3 自带 client UI，侧栏 tab + 设置页兜底入口）\n2. **工作区语义**：设置页/侧栏都保留\"工作区 tab 显示当前会话工作区的 project 记忆\"；未选择工作区时显示\"未选择工作区\"；术语统一用「工作区」（不用「项目」）\n\n## 二、现状与问题\n\n| 项 | 现状 |\n|---|---|\n| 记忆 UI（MemoryView） | ✅ 已迁至 dsh-memory 自带（remote.memory 直连） |\n| **project 记忆路由** | ❌ 引擎固定 `process.cwd()/.dsh/storages`——**未真正跟随工作区**（会话切换 workspace 不感知） |\n| 术语 | 「项目」与「工作区」割裂 |\n\n## 三、工作区路由机制（读代码实证）\n\n| 层 | 取 cwd 的路径 |\n|---|---|\n| 工具执行 | `exec.agent.session.header.cwd`（`tool-fs/session-cwd.ts` 先例——fs 工具已按会话工作区路由） |\n| 侧栏 tab | `TabComponentProps.scope.cwd`（SessionScope） |\n| 设置页 | `sessions.list 快照 byId[current].cwd`（SessionSummary.cwd，host 侧 summary 实证） |\n\n## 四、实施清单（0.3.4）\n\n### engine.ts：project 按 cwd 路由\n| # | 改动 |\n|---|---|\n| 1 | `projectRootFor(cwd)` = `join(cwd, '.dsh', 'storages')`；project 域按 cwd 懒打开 + 缓存（Map\u003ccwd, facility>，backend 名 hash cwd 防重名） |\n| 2 | 所有方法加 `projectCwd?` 参数（调用级，支持多会话并发各自工作区）：remember/list/search/forget/setStatus/setInjected/update 的 project 分支按 cwd 路由；无 cwd → project 部分为空 |\n| 3 | reload：global + 全部已开 project 域重开 |\n\n### index.ts：工具层\n| # | 改动 |\n|---|---|\n| 4 | 各工具 `execute(args, exec)` 取 `exec.agent?.session?.header?.cwd` 传给 engine |\n\n### remote.ts：面板通道\n| # | 改动 |\n|---|---|\n| 5 | remote 方法加 `cwd?` 参数（list/confirm/forget/setInjected/update/reload） |\n\n### client/index.tsx：面板\n| # | 改动 |\n|---|---|\n| 6 | MemoryView 加 `cwd?: string`：侧栏传 `scope.cwd`；设置页传 `sessions 快照 byId[current].cwd`（渲染时读快照） |\n| 7 | 无 cwd（未选工作区）：工作区组显示「未选择工作区」占位 |\n| 8 | 文案：`nsProject` → 「工作区」/「Workspace」，统一术语 |\n\n## 五、验证\n\n- [ ] dsh-memory：typecheck + vitest（新增按 cwd 路由单测：两个 cwd 的 project 记忆互不可见）\n- [ ] SSiD dev：侧栏工作区 tab 显示当前会话工作区记忆；未选工作区显示占位\n- [ ] 设置页：工作区 tab 同样跟随当前会话\n- [ ] 工具：会话 A（cwdA）memory_save → 会话 B（cwdB）不可见；同 cwd 可见\n\n## 六、风险\n\n| 项 | 说明 |\n|---|---|\n| 多会话并发 | cwd 是调用级参数，subagent 各会话各自 cwd ✓ |\n| 旧数据 | 旧 `process.cwd()` 根下的 memory_project.json 不再读取（工作区路由后）——旧文件保留不删 |\n| 术语变更 | 面板/工具描述/self 描述统一「工作区」\n"},{"file":"2026-08-19-记忆面板刷新机制.md","date":"2026-08-19","slug":"记忆面板刷新机制","title":"记忆面板刷新机制：外部编辑文件后重载存储","statusRaw":"进行中","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["dsh-memory","dsh-ssid-panels"],"summary":"外部应用编辑记忆文件后，SSiD 记忆面板一直显示旧数据。","bytes":1557,"lines":34,"body":"# 记忆面板刷新机制：外部编辑文件后重载存储\n\n日期：2026-08-19\n状态：进行中\n\n## 用户实测问题\n\n外部应用编辑记忆文件后，SSiD 记忆面板一直显示旧数据。\n\n## 根因（源码确认）\n\n- DSH `JsonStorageBackend`（storage-json）**打开时 loadAll 一次进内存**，\n  之后读写走内存、写时 atomic 落盘——**无 watch、无 reload API**\n  （packages/storage 全 grep reload 无匹配）。\n- dsh-memory 的 `list()` 读 domain table（内存缓存）→ 外部文件编辑不感知。\n- panels MemoryView 挂载时拉一次，无刷新按钮/可见性重拉。\n\n## 修复\n\n1. **dsh-memory 0.2.1**：`MemoryService.reload()`——关闭 domain 重开\n   （facility.closeAll → 重新 open 两域），放弃内存缓存强制重读文件。\n   - engine.ts 重构：facility/table 提为字段，init 与 reload 共用 openDomains()；\n     关闭效应改为引用当前 facility。\n2. **dsh-ssid-panels 0.1.3**：MemoryView 加「刷新」按钮（调 memory.reload\n   → memory.list 重拉）；tab 可见时自动重拉（visible prop，与其他 tab 一致）。\n   - host 端点：`memory.reload`（调 memory.reload?.() 后返回 list）。\n3. 发布链：dsh-memory npm 0.2.1 → SSiD 依赖/豁免/缓存 → 归档 → 冒烟 → pack。\n\n## 验证\n\n- [ ] dsh-memory typecheck/build、reload 单测（写文件 → reload → list 新数据）\n- [ ] panels typecheck/build + vendor 同步\n- [ ] 归档冒烟 + 用户实测：外部编辑文件 → 面板点刷新即见新数据\n"},{"file":"2026-08-19-预设插件更新检查-better-sidebar升级.md","date":"2026-08-19","slug":"预设插件更新检查-better-sidebar升级","title":"执行记录：预设插件更新检查 + dsh-better-sidebar 升级 0.13.1","statusRaw":"已完成","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["@huanlin/dsh-plugin-better-sidebar-plugin-office","@max-null/dsh-chat-rail","@max-null/dsh-chinese-thinking","@max-null/dsh-guardian","@max-null/dsh-habit","@max-null/dsh-memory","@max-null/dsh-plugin-center","@max-null/dsh-skill-mcp-center","@max-null/dsh-node-appearance","@max-null/dsh-ssid-panels","@deepseek-ai/dsh-base","dsh-better-sidebar"],"summary":"官方 bundle（@deepseek-ai/dsh-base / dsh-web-app）随 DSH 内核分发，不在检查范围。 dev profile 的 dsh-sidebar-preview-select（link: 本地源码）为 dev 专属实验插件，npm 404、不在模板，未纳入。","bytes":2903,"lines":56,"body":"# 执行记录：预设插件更新检查 + dsh-better-sidebar 升级 0.13.1\n\n> 日期：2026-08-19\n> 状态：已完成\n> 执行人：MaxNull（AI 代执行）\n> 关联：SSiD 预设插件清单（shell/profile-template/package.json）\n\n---\n\n## 一、检查结果（全部 14 个 registry 依赖 + 1 个 vendor + 2 个官方 bundle）\n\n| 包 | 模板声明 | dev 实际 | npm latest | 结论 |\n|---|---|---|---|---|\n| @huanlin/dsh-plugin-better-sidebar-plugin-office | ^0.1.0 | 0.1.0 | 0.1.0 | ✅ 最新 |\n| @max-null/dsh-chat-rail | ^0.1.0 | 0.1.0 | 0.1.0 | ✅ 最新 |\n| @max-null/dsh-chinese-thinking | ^0.2.0 | 0.2.0 | 0.2.0 | ✅ 最新 |\n| @max-null/dsh-guardian | ^0.1.0 | 0.1.0 | 0.1.0 | ✅ 最新 |\n| @max-null/dsh-habit | ^0.1.0 | 0.1.0 | 0.1.0 | ✅ 最新 |\n| @max-null/dsh-memory | ^0.2.0 | 0.2.2 | 0.2.2 | ✅ 最新（dev 已升） |\n| @max-null/dsh-plugin-center | ^0.1.5 | 0.1.5 | 0.1.5 | ✅ 最新 |\n| @max-null/dsh-skill-mcp-center | ^0.1.0 | 0.1.0 | 0.1.0 | ✅ 最新 |\n| @max-null/dsh-node-appearance | ^0.1.1 | 0.1.1 | 0.1.1 | ✅ 最新（本次会话已升） |\n| **dsh-better-sidebar** | ^0.13.0 | 0.13.0 | **0.13.1** | ⚠️ **本次升级** |\n| dsh-excel-panel | ^0.6.1 | 0.6.1 | 0.6.1 | ✅ 最新 |\n| dsh-sidebar-qa | ^0.2.0 | 0.2.0 | 0.2.0 | ✅ 最新 |\n| dsh-skin | ^0.4.1 | 0.4.1 | 0.4.1 | ✅ 最新 |\n| dsh-video-preview | ^0.1.1 | 0.1.1 | 0.1.1 | ✅ 最新 |\n| @max-null/dsh-ssid-panels（vendor） | file: 0.1.2 | — | 不发布 npm | ✅ 源码构建与 vendor MD5 全等 |\n\n官方 bundle（@deepseek-ai/dsh-base / dsh-web-app）随 DSH 内核分发，不在检查范围。\ndev profile 的 `dsh-sidebar-preview-select`（link: 本地源码）为 dev 专属实验插件，npm 404、不在模板，未纳入。\n\n## 二、唯一可更新项：dsh-better-sidebar 0.13.0 → 0.13.1\n\n- 0.13.1 发布于 2026-08-18（\u003c7 天，需豁免）；peer/deps 声明与 0.13.0 同代（rc.7 系，与当前 DSH 兼容）\n- 模板声明 `^0.13.0` 已允许 0.13.1（发布自动取 0.13.1），**模板 package.json 无需改**\n\n## 三、改动清单\n\n| 文件 | 改动 |\n|---|---|\n| `~/.dsh/profiles/ssid/pnpm-workspace.yaml` | minimumReleaseAgeExclude 加 `dsh-better-sidebar@0.13.1` |\n| `shell/profile-template/pnpm-workspace.yaml` | 同上（发布侧豁免，保证 prepare-runtime 构建不被 age 策略拦截） |\n| dev profile | `pnpm update dsh-better-sidebar` → 实装 0.13.1，lockfile 更新 |\n\n## 四、验证\n\n1. `pnpm update` 成功（exit 0），node_modules 实装 **0.13.1**\n2. `pnpm peers check`：与升级前完全一致（8 项既有问题，无新增）\n3. 两处 pnpm-workspace.yaml YAML 校验通过\n\n## 五、备注\n\n- 下次发布 SSiD 安装包时 runtime 自动包含 0.13.1（模板 ^0.13.0 解析到 latest）。\n- 更新检查方式备忘：`npm view \u003cpkg> version` 批量对比模板声明与 dev 实装，见本文档第一节表格。\n"},{"file":"2026-08-19-chat-rail-加入SSiD预设.md","date":"2026-08-19","slug":"chat-rail-加入SSiD预设","title":"执行记录：dsh-chat-rail 加入 SSiD 预设插件","statusRaw":"已完成","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["@max-null/dsh-chat-rail","@deepseek-ai/cordis","@deepseek-ai/dsh-session-projection","dsh-chat-rail","dsh-session-projection","dsh-better-sidebar","dsh-chat-timeline"],"summary":"@max-null/dsh-chat-rail@0.1.0（画卷式消息导航）已加入 SSiD 预设插件： 开发 profile 与发布模板两处同步，依赖安装成功、peer 无新增缺失、语法校验通过。","bytes":2726,"lines":40,"body":"# 执行记录：dsh-chat-rail 加入 SSiD 预设插件\n\n> 日期：2026-08-19\n> 状态：已完成\n> 执行人：MaxNull（AI 代执行）\n> 前置决策：[2026-08-18-消息导航自研-放弃第三方rail.md](2026-08-18-消息导航自研-放弃第三方rail.md)（执行顺序的「装入 ssid profile 实测」落点）\n> 关联清单：[SSiD-插件清单.md](../设计/SSiD-插件清单.md) 2.1 已就绪自研预制项\n\n---\n\n## 一、结论\n\n`@max-null/dsh-chat-rail@0.1.0`（画卷式消息导航）已加入 SSiD 预设插件：\n开发 profile 与发布模板两处同步，依赖安装成功、peer 无新增缺失、语法校验通过。\n\n## 二、改动清单\n\n| 文件 | 改动 |\n|---|---|\n| `~/.dsh/profiles/ssid/package.json`（开发 profile） | dependencies + `dsh.profile.bundles` 各加 `@max-null/dsh-chat-rail` |\n| `~/.dsh/profiles/ssid/pnpm-workspace.yaml` | `minimumReleaseAgeExclude` 加 `@max-null/dsh-chat-rail@0.1.0`（新发布包豁免） |\n| `shell/profile-template/package.json`（发布模板） | 同上 dependencies + bundles 两处 |\n| `shell/profile-template/pnpm-workspace.yaml` | 同上豁免项 |\n\n## 三、验证结果\n\n1. **安装**：profile 内 `pnpm install` 成功（exit 0，+1 包），`node_modules/@max-null/dsh-chat-rail@0.1.0` 就位，包内容完整（`lib/index.mjs` host 半端 + `lib/client.js` client 半端 + `cordis.patch.yml` bundle patch）。\n2. **Peer**：5 个 peer 全部满足——`@deepseek-ai/cordis@4.0.1`（cordis-plugin-group 带入）、`@deepseek-ai/dsh-session-projection@0.1.0-rc.7`（官方聚合包直接依赖）、`dsh-better-sidebar@0.13.0`、`react@18.3.1`、`react-dom@18.3.1`。`pnpm peers check` 无 chat-rail 相关条目（既有 missing peer 均为官方 rc.7 包间关系，与本次无关）。**prepare-runtime.mjs 的 MISSING_PEERS 无需补充**——chat-rail 的 peer 均由官方依赖树自动带入，runtime 构建（模板 + 官方包注入 + pnpm install）与开发 profile 同源。\n3. **语法**：4 个改动文件 JSON/YAML 校验全过；chat-rail 的 cordis.patch.yml（`insert: chat-rail`）语法正确，与已加载插件同模式。\n4. **插件测试**：dsh-chat-rail 仓库 `npm test` 通过（exit 0；该版本 tests 目录无 spec 用例）。\n\n## 四、生效方式\n\nbundle 声明在 DSH 进程启动时加载：**重启思灵（或当前 GUI 会话）后**，右侧画卷式消息导航 rail 生效。\n\n## 五、备注\n\n- dsh-chat-timeline（第三方）此前已移除（决策文档要求的执行步骤），本次 package.json 确认无残留。\n- 下次发布 SSiD 安装包时，`prepare-runtime.mjs` 重新打包 runtime 即自动包含 chat-rail（模板已更新），无需其他手工步骤。\n"},{"file":"2026-08-19-dsh-node-appearance-加入SSiD预设.md","date":"2026-08-19","slug":"dsh-node-appearance-加入SSiD预设","title":"执行记录：dsh-node-appearance 加入 SSiD 预设插件","statusRaw":"已完成","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["@max-null/dsh-node-appearance","@deepseek-ai/cordis","dsh-node-appearance","dsh-ssid-panels","dsh-client-runtime","dsh-client-ui-settings","dsh-client-ui-settings-plugins","dsh-settings"],"summary":"@max-null/dsh-node-appearance@0.1.0（节点外观：按节点类型/工具名配色的可配置配色 + 思考过程显示开关） 已加入 SSiD 预设：发布模板（profile-template）补齐 vendor + 依赖 + bundle 声明。 与 chat-rail 的差异：chat-rail 已发布 npm（registry 依赖）；node-appearance 未发布 ","bytes":5300,"lines":80,"body":"# 执行记录：dsh-node-appearance 加入 SSiD 预设插件\n\n> 日期：2026-08-19\n> 状态：已完成\n> 执行人：MaxNull（AI 代执行）\n> 关联：[2026-08-18-工作区内部插件与vendor同步约定.md](2026-08-18-工作区内部插件与vendor同步约定.md)、[2026-08-19-chat-rail-加入SSiD预设.md](2026-08-19-chat-rail-加入SSiD预设.md)\n\n---\n\n## 一、结论\n\n`@max-null/dsh-node-appearance@0.1.0`（节点外观：按节点类型/工具名配色的可配置配色 + 思考过程显示开关）\n已加入 SSiD 预设：发布模板（profile-template）补齐 vendor + 依赖 + bundle 声明。\n\n**与 chat-rail 的差异**：chat-rail 已发布 npm（registry 依赖）；node-appearance **未发布 npm**\n（npm 404 实测确认），按 dsh-ssid-panels 模式走 **vendor 本地分发**（`file:./vendor/...`）。\n\n## 二、改动清单\n\n| 文件 | 改动 |\n|---|---|\n| `shell/profile-template/vendor/dsh-node-appearance/` | **新增**：`lib/`（工作区最新构建产物）+ `package.json` + `cordis.patch.yml` |\n| `shell/profile-template/package.json` | dependencies 加 `\"@max-null/dsh-node-appearance\": \"file:./vendor/dsh-node-appearance\"`；bundles 加 `\"@max-null/dsh-node-appearance\"` |\n| 开发 profile（`~/.dsh/profiles/ssid`） | 原本已有（dependencies + bundles），**本次未改声明**；vendor 恢复为与 node_modules 一致的既有构建 |\n\n## 三、验证结果\n\n1. **构建产物三方一致**：工作区源码 `npm run build` → `lib/` 同步到模板 vendor，MD5 全等（tsdown 输出确定性已实测：连续两次构建 MD5 相同）。\n2. **插件测试**：`npm test`（vitest）20/20 通过（palette 16 + config 4）。\n3. **语法**：模板 package.json JSON 校验通过；`pnpm install` 在 dev profile 实测 exit 0。\n4. **peer**：5 个 peer 全部由官方依赖树满足（`@deepseek-ai/cordis`、`dsh-client-runtime`、`dsh-client-ui-settings`、`dsh-client-ui-settings-plugins`、`dsh-settings`、`react`），无需补 MISSING_PEERS。\n5. **发布路径**：prepare-runtime 重新打包时，全新环境无旧 store 快照，`pnpm install` 会把模板 vendor（最新构建）打包进运行时——**发布版即最新构建**。\n\n## 四、重要发现：pnpm file: 依赖的 store 快照机制（坑）\n\n调试中踩到的 pnpm 11 行为，记录备查：\n\n- **node_modules 里的 file: 依赖副本 = pnpm store 的内容寻址快照（硬链接）**，\n  **不是** vendor 目录的实时复制。\n- lockfile 指纹（如 `10b771...`）是 **peer 组合指纹，与目录内容无关**；\n  目录内容变化**不会**让 pnpm 重新打包。\n- `pnpm install`（含 `--force`）、`pnpm update \u003cpkg>`、删除 vendor 目录、\n  删除 file+H++ 缓存目录、删除 store 内容文件——**都无法**让 pnpm 重新打包 vendor 目录；\n  它总从 store 旧快照恢复 node_modules 副本。\n- **结论**：vendor 内容更新后，**node_modules 不会自动跟随**。更新流程：\n  1. 工作区改源码 → `npm run build`\n  2. `robocopy \u003cws>/lib \u003cvendor>/lib /MIR`（注意：**不要用 PowerShell `Copy-Item` 覆盖已存在目录**，会生成 `lib\\lib` 嵌套，破坏目录结构——pnpm 对结构异常目录会 fallback 到 registry 解析，未发布包直接 404）\n  3. 若需 dev 环境立即生效：**手动复制 lib 到 node_modules 副本**（覆盖硬链接），或等待下一次全新部署\n  4. 发布版不受影响（全新环境直接打包新内容）\n\n## 五、备注\n\n- dev profile 的 node_modules/vendor/store 三方已恢复一致（既有构建，功能与最新构建等价——CSS 键集合 21 项完全一致，仅映射顺序差异）。\n- 若未来 node-appearance 发布 npm，可把依赖从 `file:./vendor/...` 切换为 registry 版本，届时不再需要 vendor 同步。\n\n## 六、升级：0.1.0 → 0.1.1（发布 npm，切 registry）\n\n> 日期：2026-08-19，状态：已完成\n\n**触发**：`@max-null/dsh-node-appearance@0.1.1` 发布 npm（2026-08-18 21:49，0.1.0 发布于同日 21:26）。\n上轮备注中的\"发布 npm 即切 registry\"路径落地。\n\n**改动**：\n\n| 文件 | 改动 |\n|---|---|\n| `shell/profile-template/package.json` | dependencies：`file:./vendor/dsh-node-appearance` → `^0.1.1`（bundles 不变） |\n| `shell/profile-template/vendor/dsh-node-appearance/` | **删除**（不再需要 vendor 分发） |\n| `shell/profile-template/pnpm-workspace.yaml` | minimumReleaseAgeExclude 加 `@max-null/dsh-node-appearance@0.1.1`（发布 \u003c7 天豁免） |\n| dev profile（`~/.dsh/profiles/ssid`） | 用户已先行切换（deps `^0.1.1` + exclude 0.1.0/0.1.1 + install 完成）；本次清理孤儿 vendor 目录 |\n\n**验证**：\n- npm 0.1.1（node_modules 实装）与工作区源码构建 **MD5 全等**（index.js/client.js）——npm 包即最新源码\n- 模板 JSON/YAML 语法通过；dev profile 已装 0.1.1，lockfile 为 registry 形式\n- 0.1.1 测试 20/20 通过（vitest）\n- **发布路径**：prepare-runtime 重新打包时从 registry 安装 0.1.1，不再依赖 vendor 目录\n\n**影响**：node-appearance 从 vendor 分发转为 registry 分发（与 memory/chinese-thinking/guardian/habit/chat-rail 同模式）；\nvendor 同步约定中该插件的条目不再适用（见约定文档更新）。\n"},{"file":"2026-08-19-DSH上游回复-3198确认新机制10.md","date":"2026-08-19","slug":"DSH上游回复-3198确认新机制10","title":"DSH 上游回复：Discussion #3198 被确认为新机制 #10（2026-08-19）","statusRaw":"✅ 上游已确认（argszero 回复，2026-08-18T19:11:17Z）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["dsh-doctor","dsh-chat-rail","dsh-scan","#3198","#10","#2167"],"summary":"2026-08-19 提交的 DSH 上游反馈帖 [3198「Session log unreadable after resume across session/end-seed」] (https://github.com/deepseek-ai/deepseek-harness/discussions/3198)， argszero（deepseek-ai 核心成员）回复确认。","bytes":2649,"lines":49,"body":"# DSH 上游回复：Discussion #3198 被确认为新机制 #10（2026-08-19）\n\n日期：2026-08-19\n状态：✅ 上游已确认（argszero 回复，2026-08-18T19:11:17Z）\n\n## 背景\n\n2026-08-19 提交的 DSH 上游反馈帖\n[#3198「Session log unreadable after resume across session/end-seed」]\n(https://github.com/deepseek-ai/deepseek-harness/discussions/3198)，\nargszero（deepseek-ai 核心成员）回复确认。\n\n## 回复要点（argszero）\n\n1. **确认为 session-corruption 家族第 12 份报告、新机制 #10**\n   （\"resume seed shorter than the persisted tail\"）。单实例可复现的\n   部分最有价值——一举排除跨进程竞态（#1333/#1452）与 stale 缓存路径\n   （#2839），锁定为纯种子构造算术 bug。\n2. **源码分歧点精确确认**（packages/core/session/src/index.ts）：\n   - `:539` `firstLiveSeq = this.log.length` 在 end-seed 逻辑**之前**捕获；\n   - `:545` 追加 `session/end-seed`（注释称仅内存）；\n   - `:629` 每次 live append 用 `seq = this.log.length`。\n   - 分歧出现在**持久化文件尾部超出构造种子**时：新 session 种子停在\n     207485（firstLiveSeq=207486），首个 live append（seq 207486）与持久化\n     尾部重叠 → 严格扫描器（format.ts:364-371）拒绝合并文件。\n3. **修复方向（按杠杆排序）**：\n   - (a) end-seed append **之后**再捕获 `firstLiveSeq`（最小本地修复，\n     只治愈新写入）；\n   - (b) **resume 种子 = 完整持久化尾部**（根修复，家族方向 #2167/#2839）；\n   - (c) 扫描侧在 `session/end-seed` 边界**分区域校验**（持久兜底，\n     不重写即可治愈现有文件）；\n   - (d) dsh-doctor 离线检测 end-seed 后 seq 重启（截断到 end-seed 是安全恢复）。\n4. **评价**：带解码证据 + 确定性复现，是 \"one-PR-sized fix\"——\n   (a)+(b) 一起，或 (a)+(c)（含治愈路径）。\"Good find.\"\n\n## 跟进事项（待用户拍板）\n\n- 上游明示修复空间为一个 PR 大小：可协助实现 (a)+(b) 或 (a)+(c)\n  （deepseek-harness 源码在 H:\\MaxNull\\WorkStation\\deepseek-harness）。\n- 或先在 #3198 回复确认理解 + 提供补充测试用例（已有两个真实日志样例）。\n- 现有用户恢复路径不变：fork 副本（内存连续种子）最稳；旧日志可等\n  (c) 落地后自动可读，或手动平移 seq（tools: fix-seq.ts）。\n\n## 相关文件\n\n- 帖子正文备份：H:\\MaxNull\\WorkStation\\dsh-chat-rail\\tests\\issue-body.md\n- 分析工具：dsh-chat-rail/tests/（seq-gap2/3/5/6.ts、fix-seq.ts、\n  to-zstd.ts、verify-zstd-full.ts、verify-dsh-scan.ts）\n"},{"file":"2026-08-19-DSH修复PR-3198方案落盘.md","date":"2026-08-19","slug":"DSH修复PR-3198方案落盘","title":"DSH 上游修复：实现 #3198 修复（方案 a+c，讨论区交付）","statusRaw":"✅ 已完成（修复实现 + 测试全绿 + 交付到 #3198 讨论区）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["#3198","#10"],"summary":"argszero 确认 3198 为 session 损坏家族新机制 10「resume seed shorter than the persisted tail」，源码分歧点： - packages/core/session/src/index.ts:539 firstLiveSeq = this.log.length 在 end-seed 逻辑（:545）之前捕获； - :545 种子末事件非","bytes":3335,"lines":61,"body":"# DSH 上游修复：实现 #3198 修复（方案 a+c，讨论区交付）\n\n日期：2026-08-19\n状态：✅ 已完成（修复实现 + 测试全绿 + 交付到 #3198 讨论区）\n\n## 背景\n\nargszero 确认 #3198 为 session 损坏家族新机制 #10「resume seed shorter than\nthe persisted tail」，源码分歧点：\n\n- `packages/core/session/src/index.ts:539` `firstLiveSeq = this.log.length`\n  在 end-seed 逻辑（:545）**之前**捕获；\n- `:545` 种子末事件非 end-seed 时追加 `session/end-seed`；\n- `:629` 每次 live append 用 `seq = this.log.length`——与持久化尾部重叠。\n\n上游建议：one-PR 规模，(a)+(b) 一起（根修复），或 (a)+(c)（含治愈路径）。\n\n## 方案选择（实际落地：a + c）\n\n- **(a) 已实现**（core/session/index.ts）：`firstLiveSeq` 在 end-seed append\n  **之后**捕获——现在恒为「构造后第一个 live append 的 seq」，end-seed\n  标记恒位于 `firstLiveSeq - 1`。连带修正：\n  - session-persistence coordinator `attachPrepared`：删除\n    `firstLiveSeq !== cursor` 校验（该字段不再编码 seed 长度；\n    `state.cursor === inspection.events.length` 仍是绑定校验）；\n  - session-telemetry：adoption 起点移到 end-seed 之后（end-seed 是构造\n    事件、从不发布，不再被回放导出；chunk 投影不受影响）。\n- **(b) 未实现（评估结论）**：coordinator 的 `prepareCore` 已经用完整\n  stored events + 合成 closers 作种子，短种子视图的源头在别处\n  （stale view / HMR 式 adoption），属后续跟进，已在讨论区说明。\n- **(c) 已实现**（session-persistence-jsonl/format.ts）：扫描器把\n  `session/end-seed` 视为区域边界——紧随标记的 seq 断裂以断裂事件为\n  区域原点重起，**区域内严格连续**；非 end-seed 边界的断裂仍整体拒绝。\n  存量重叠日志**不重写即可治愈**（expectedSeq 独立于 events.length 计数，\n  治愈后 seq 重叠是合法形态）。\n\n## 验证结果（全绿）\n\n1. vitest：**1205/1205 通过**（core/session、session-persistence、\n   session-persistence-jsonl、session-telemetry、agent-loop、\n   subagent-in-process-driver 46 个文件），新增 3 个 (c) 测试\n   （治愈形态 / 治愈段内断裂仍拒 / 种子段断裂仍拒）。\n2. `tsc -b tsconfig.host.json` 干净；oxlint 改动文件 0 warning 0 error。\n\n## 交付方式（重要调整）\n\n- **上游暂不接受外部 PR**：CONTRIBUTING.md 明确「cannot accept external\n  pull requests at the moment」，pulls API 404（仓库禁用 issues/PR 基础设施）。\n  原「提交 PR」目标不可行，改为讨论区交付：\n  - fork 分支 `Max-Null/deepseek-harness:fix-3198-resume-seq-gap`\n    （commit `bca7700f1d`，基于 rc.7 master）已推送，上游可直接取用；\n  - #3198 讨论区已发两条评论（修复说明 + 验证 + (b) 评估；\n    patch gist：https://gist.github.com/Max-Null/16257bc912307dc15fb06e0d149305a4）；\n  - 评论链接：#discussioncomment-18072466 / #discussioncomment-18072467。\n\n## 关联\n\n- 上游讨论：#3198（argszero 确认 + 修复方向 (a)-(d)）\n- 本仓库决策记录：2026-08-19-DSH上游回复-3198确认新机制10.md\n- DSH checkout：H:\\MaxNull\\WorkStation\\deepseek-harness（分支 fix-3198-resume-seq-gap）\n"},{"file":"2026-08-19-plugin-center-0.1.7本机重建.md","date":"2026-08-19","slug":"plugin-center-0.1.7本机重建","title":"plugin-center 0.1.7 本机重建：决策记录","statusRaw":"实施完成，待 npm publish（代码已构建 + 双验证全过 + 已提交 619a6e1）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["@max-null/dsh-plugin-center","dsh-plugin-center","dsh-header-unify"],"summary":"v0.1.6 发布链待办 1 需要 @max-null/dsh-plugin-center@0.1.7（SSiD profile-template 声明 ^0.1.6，归档重建需 npm 上存在）。 0.1.6/0.1.7 代码原开发于另一台电脑（不在手边，无法取得源码）： - npm 最新仅 0.1.5；GitHub 远程仅 main=ebc3c0d（0.1.5）；本机仓库 H:\\MaxNull","bytes":4298,"lines":65,"body":"# plugin-center 0.1.7 本机重建：决策记录\n\n> 日期：2026-08-19\n> 状态：**实施完成，待 npm publish**（代码已构建 + 双验证全过 + 已提交 619a6e1）\n> 关联：`docs/决策/2026-08-19-v0.1.6发布执行-环境核查与阻塞.md`、`docs/决策/2026-08-17-header按钮统一-调查与方案.md`\n\n---\n\n## 一、背景\n\nv0.1.6 发布链待办 1 需要 `@max-null/dsh-plugin-center@0.1.7`（SSiD profile-template 声明 `^0.1.6`，归档重建需 npm 上存在）。\n\n0.1.6/0.1.7 代码原开发于**另一台电脑**（不在手边，无法取得源码）：\n- npm 最新仅 0.1.5；GitHub 远程仅 main=`ebc3c0d`（0.1.5）；本机仓库 `H:\\MaxNull\\WorkStation\\dsh-plugin-center` 也是 0.1.5；安装版归档、profile 均 0.1.5——**五处一致，0.1.7 代码唯一存在于另一台电脑**。\n\n## 二、决策（用户拍板）\n\n**本机基于 0.1.5 源码重建 0.1.7 等价实现**。用户确认改动很小且记得全部内容：\n> \"就是把插件中心的按钮和磁侧边栏的按钮都移到标题栏了，正如 ssid 的代码展示的那样，没做别的\"\n\n即 0.1.7 的**功能契约**已由 SSiD 侧 `plugins/dsh-header-unify/lib/client.js` 和决策文档完整定义，本机实现只需满足该契约。\n\n## 三、功能契约（来自 dsh-header-unify client.js + SSiD 决策文档）\n\n| API | 行为 | 消费方 |\n|---|---|---|\n| `window.__pluginCenterOpen` | 打开插件中心 overlay（0.1.6 已有） | dsh-header-unify 老版回退 |\n| `window.__pluginCenterToggle` | 开则关、关则开（0.1.7 新增） | dsh-header-unify 优先调用 |\n| `window.__pluginCenterClose` | 关闭 overlay（0.1.7 新增） | dsh-header-unify 开侧栏/底栏前互斥调用 |\n| 点遮罩关闭 | overlay 面板外点击遮罩即关闭（0.1.7 新增） | 用户交互 |\n\n## 四、本机 0.1.5 现状（读源码确认）\n\n`client/index.tsx`：\n- `openOverlay()` / `closeOverlay()` 已存在（模块级 `overlayOpen` + `overlayListeners` 通知，138-139 行）\n- `HeaderButton`（690 行）onClick 只 open，无 toggle\n- `OverlayPanel`（702 行）`.pc-overlay` 遮罩**无** onClick 关闭\n- `apply()`（794 行）未暴露任何 window API\n- 构建：`npm run build` = tsc（src→dist）+ esbuild（client/index.tsx→client.js）\n\n## 五、改动清单（本机重建）\n\n1. ✅ `client/index.tsx`：\n   - 新增 `toggleOverlay()`（`overlayOpen ? closeOverlay() : openOverlay()`）\n   - `apply()` 内暴露 `window.__pluginCenterOpen/Toggle/Close`，含页面卸载清理（unload 时 delete，防泄漏/重复挂载）+ 重复 apply 守卫\n   - `OverlayPanel`：`.pc-overlay` 加 `onClick={closeOverlay}`；`.pc-panel` 加 `onClick={e => e.stopPropagation()}`（面板内点击不触发关闭）\n2. ✅ `package.json`：version 0.1.5 → 0.1.7\n3. ✅ 构建：`npm run build`（tsc 通过 + client.js 45.6kb）\n4. ✅ 验证：\n   - `verify-globals.cjs`（新建）：**14 项全过**——API 暴露/可调用/unload 清理/重复守卫/遮罩关闭静态断言\n   - SSiD 仓库 `plugins/dsh-header-unify/verify-header-unify.cjs`：**17 项全过**（消费方契约）\n5. ✅ git 提交：`619a6e1`（client/index.tsx + package.json + verify-globals.cjs）\n6. ⏳ 发布：用户本机 npm login（.npmrc token 已失效 401）→ `npm publish` → 确认 `npm view` 0.1.7\n7. ⏳ 发布后继续发布链：清 pnpm metadata 缓存 → prepare-runtime（DSH_NODE/PNPM_CMD 已确认）→ 归档 boot 冒烟 → pack → 自测 → Release → 收尾\n8. ⏳ 网络窗口补 push：`619a6e1` + tag `v0.1.7`（本机仓库 origin）\n\n## 六、风险与注意\n\n| 项 | 说明 |\n|---|---|\n| 与另一台电脑实现的差异 | 无法比对源码；功能契约一致即可（契约由 SSiD 侧定义），实现细节差异无影响 |\n| 版本号一致性 | 本机重建后发布的 0.1.7 与另一台电脑未发布的 0.1.7 是同版本号不同实现——但另一台电脑版本从未发布，npm 上无冲突；用户后续拿到另一台电脑代码时如再发布需注意（可升 0.1.8 或直接以本机为准） |\n| verify-header-unify.cjs | 该脚本是模拟环境（假 window），验证 dsh-header-unify 逻辑；plugin-center 侧需独立模拟脚本验证 |\n| npm 凭据 | 用户手动 login；token 401 是用户侧问题 |\n"},{"file":"2026-08-19-SSiD预设技能包-落地方案.md","date":"2026-08-19","slug":"SSiD预设技能包-落地方案","title":"SSiD 预设技能包 —— 落地方案","statusRaw":"已定案（本期实施）","statusKind":"已决策","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["@max-null/dsh-skill-mcp-center","ssid-skills","dsh-runtime","dsh-skill-filesystem","ssid-double-star","dsh-skill-mcp-center","#7"],"summary":"思灵（SSiD）安装后开箱即用：出厂自带 14 个技能（8 mxy + 6 omo）， 无需用户手动安装。现状是仓库根 skills/ 有技能源码，但安装包 （profile-template → dsh-runtime.tar.gz）不含任何技能——新用户装完 思灵，~/.dsh/skills 为空，一个技能都没有。MCP 预设本期不做（另议）。","bytes":4702,"lines":80,"body":"# SSiD 预设技能包 —— 落地方案\n\n> 日期：2026-08-19\n> 状态：已定案（本期实施）\n> 关联：[SSiD-插件清单](../设计/SSiD-插件清单.md) #7「14 技能包 ssid-skills（M3）」\n\n---\n\n## 一、需求\n\n思灵（SSiD）安装后**开箱即用**：出厂自带 14 个技能（8 mxy + 6 omo），\n无需用户手动安装。现状是仓库根 `skills/` 有技能源码，但安装包\n（profile-template → dsh-runtime.tar.gz）**不含任何技能**——新用户装完\n思灵，`~/.dsh/skills` 为空，一个技能都没有。MCP 预设本期不做（另议）。\n\n## 二、机制调研（DSH 侧）\n\n1. **技能发现**（`dsh-skill-filesystem`，standard / ssid-double-star preset\n   里的 `skill-filesystem` 行，`includeDefaultRoots` 默认 true）按 rank 扫描：\n   - 项目根（最近含 `.git` 的祖先）：`.dsh/skills`（100）、`.agents/skills`（200）\n   - `$DSH_HOME/skills`（400，user-dsh，跳过 `.system`）、`~/.agents/skills`（500）\n   - `$DSH_BUNDLED_SKILL_DIR`（bundled 只读层，trustedHost）\n   - 技能格式：目录包 `\u003cname>/SKILL.md` 或扁平 `\u003cname>.md`，需 YAML frontmatter\n     （name kebab-case + description）。\n2. **skill-mcp-center UI**（`@max-null/dsh-skill-mcp-center`，已预制）扫描\n   `~/.dsh/skills`、`~/.agents/skills`、会话 cwd 的 `.dsh/skills`/`.agents/skills`\n   ——**bundled 层不可见、不可 toggle**。出厂技能要能在设置里管理，必须落在\n   用户/工作区层。\n3. **SSiD 部署链路**：`shell/profile-template/`（package.json + cordis.patch.yml\n   + vendor/）→ `prepare-runtime.mjs` → `dsh-runtime.tar.gz` → 用户首启\n   `main.mjs deployRuntime` 解压到 `~/.dsh/profiles/ssid/`（归档顶层 = profile\n   根内容）→ `kernel.ts bootKernel` boot（DSH_HOME = `~/.dsh`）。\n\n## 三、方案决策\n\n**出厂技能 = 归档携带（profileDir/skills）+ 启动时非覆盖合并到用户层（`~/.dsh/skills`）。**\n\n对比过的替代方案与否决理由：\n\n| 方案 | 结论 | 理由 |\n|---|---|---|\n| 只挂 bundled 层（`DSH_BUNDLED_SKILL_DIR` 指向 profileDir/skills） | ❌ | skill-mcp-center UI 扫不到 bundled 层：出厂技能在设置里不可见、不可关；且引入新的环境变量依赖 |\n| bundled + 用户层双挂 | ❌ | 同名技能两个来源，bundled rank 优先会 shadow 用户层修改（toggle 无效） |\n| **用户层非覆盖复制（本期方案）** | ✅ | ①skill-mcp-center 完全可见可管理；②fractal 传统一致（「首次启动初始化，合并非覆盖」）；③用户增删改永远优先，升级补新技能不覆盖用户修改；④不改 DSH 任何机制 |\n\n同步策略（幂等，每次启动执行）：\n\n- 源：`\u003cprofileDir>/skills/`（随归档部署，只读出厂副本）\n- 目标：`$DSH_HOME/skills/`\n- 规则：遍历源下**目录条目**（技能包）；目标不存在同名条目 → 复制；存在 → 跳过。\n  根级 `.md`（如 README）不复制（会被扁平技能解析器误扫）。`skipped` 目录跳过。\n- 失败不阻塞 boot（try/catch + 日志）。\n\n## 四、实施清单\n\n| # | 改动 | 文件 |\n|---|---|---|\n| 1 | 14 个技能目录副本（仓库根 `skills/` 整目录复制，**不含** README.md） | `shell/profile-template/skills/`（新增） |\n| 2 | 同步函数 `syncPresetSkills(sourceDir, targetDir)` + bootKernel 调用 | `shell/kernel.ts` |\n| 3 | pnpm 兜底安装分支复制 skills 到 profileDir | `shell/main.mjs` |\n| 4 | 归档指纹纳入 `skills/`（技能内容变化触发重部署） | `shell/scripts/prepare-runtime.mjs` |\n| 5 | 注明部署副本同步关系（改技能后需同步到 profile-template/skills） | `skills/README.md` |\n\n## 五、验证\n\n1. `npm run typecheck`（shell）—— kernel.ts 改动编译通过\n2. 同步逻辑模拟：源 = 仓库根 `skills/`、目标 = 临时目录，跑两遍（第二遍全跳过 =\n   幂等）；预置同名文件验证「存在即跳过」；验证根级 .md 不被复制\n3. 目录一致性：profile-template/skills 与仓库根 skills 技能条目一一对应\n4. 归档指纹：prepare-runtime.mjs 改动仅影响构建产物，typecheck 覆盖不到，\n   靠代码审查 + 下次构建验证\n\n## 六、边界与后续\n\n- 本期**不做** MCP 预设（双星 persona 引用的 GitHub MCP / Playwright MCP 另立\n  方案，涉及 token 与内置 node 执行路径，需单独设计）\n- 出厂技能若被用户删除，升级**不**补回（非覆盖语义，符合「用户资产」定位）\n- 技能内容更新：改仓库根 `skills/` → 同步到 `profile-template/skills/` → 重建\n  归档（指纹变化自动触发用户升级部署）\n"},{"file":"2026-08-19-v0.1.5发布收尾-归档损坏与恢复.md","date":"2026-08-19","slug":"v0.1.5发布收尾-归档损坏与恢复","title":"v0.1.5 发布收尾：归档损坏恢复 + 误解压事故","statusRaw":"✅ 发布完成","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["@max-null/dsh-chat-rail","@max-null/dsh-memory","dsh-runtime","dsh-profile-ssid","dsh-chat-rail","dsh-node-appearance","dsh-better-sidebar","dsh-memory"],"summary":"- Release v0.1.5「预设技能包 + 预设插件更新」 已发布（Latest）， https://github.com/Max-Null/seek-soul-in-darkness/releases/tag/v0.1.5 - 资产 Setup.0.1.5.exe（265,622,437 字节 ≈ 253 MB），URL HTTP 200。 - tag v0.1.5 指向 ebddc84，","bytes":3395,"lines":58,"body":"# v0.1.5 发布收尾：归档损坏恢复 + 误解压事故\n\n日期：2026-08-19\n状态：✅ 发布完成\n\n## 发布结果\n\n- Release **v0.1.5「预设技能包 + 预设插件更新」** 已发布（Latest），\n  https://github.com/Max-Null/seek-soul-in-darkness/releases/tag/v0.1.5\n- 资产 `Setup.0.1.5.exe`（265,622,437 字节 ≈ 253 MB），URL HTTP 200。\n- tag `v0.1.5` 指向 `ebddc84`，与 origin/main 一致；本地已 fetch 对齐。\n- v0.1.4 Draft（历史遗留，无资产）已删除——v0.1.4 内容并入 v0.1.5，\n  Releases 页不再有草稿。\n- 发布前验证环全绿：typecheck ✅ → prepare-runtime 重建归档（163.3 MB，\n  指纹 `0.1.5-0.1.0-rc.7-80503a8a`）→ 归档完整性 tar 全量 75104 项 ✅ →\n  闭包 boot 冒烟（boot-bundled.mjs，临时 DSH_HOME，HTTP 200）✅ → pack ✅。\n\n## 事故 1：dsh-runtime.tar.gz 损坏（截断）\n\n- 现象：上次会话生成的归档（125.5 MB）tar -tzf 报\n  `Truncated input file (needed 20992 bytes, only 0 available)`，列表只到\n  node_modules 中段（56142 项），`dsh-runtime/` 源目录残留未删。\n- 根因：6:08 那次 prepare-runtime 在 tar 压缩阶段中断（源目录未删是\n  脚本异常退出的标志；脚本正常路径是 [7/7] 删源目录）。\n- 处置：重跑 prepare-runtime（DSH_NODE 指向 PATH 的 node v26.2.0，\n  PNPM_CMD 指向全局 pnpm 11.21.0），完整归档 163.3 MB / 75104 项，重建成功。\n- 教训：**发布前必须 tar -tzf 全量校验归档完整性**——只看文件大小/时间戳\n  会漏掉截断归档，损坏归档会打进安装包（extraResources 原样携带）。\n\n## 事故 2：tar 解压误落 shell 根目录（package.json 被覆盖）\n\n- 现象：冒烟前执行 `tar -xzf dsh-runtime.tar.gz`（在 shell/ 下，无 -C），\n  归档条目是 `./xxx` 前缀 → 全部解压散落到 shell/ 根目录：node_modules\n  （760 MB 混入）、skills/、vendor/、pnpm-lock.yaml、.npmrc、\n  cordis.patch.yml、pnpm-workspace.yaml、.runtime-version——并且\n  **shell/package.json 被归档里的 profile package.json 覆盖**\n  （name 变 dsh-profile-ssid、version/scripts 丢失）。\n- 处置：\n  1. `git show HEAD:shell/package.json` 恢复原文件，再改回 version 0.1.5\n     （注意：PowerShell `ConvertTo-Json` 重写会打乱格式产生 70 行假 diff，\n     必须用文本级替换只改 version 一行）。\n  2. 删除 shell/ 根目录的污染文件（.npmrc/.runtime-version/cordis.patch.yml/\n     pnpm-lock.yaml/pnpm-workspace.yaml/skills/vendor）。\n  3. `npm ci` 干净重装 shell 依赖（混入的 1041 个归档包清除）；\n     electron 二进制 postinstall 未跑，手动 `node node_modules/electron/install.js`\n     补装。\n- 教训：**归档解压必须 `tar -xzf dsh-runtime.tar.gz -C dsh-runtime`**\n  （先建目录），绝不能在工作区根目录直接解压。boot-bundled.mjs 的\n  RUNTIME_DIR 就是 shell/dsh-runtime，冒烟前解压目标必须是它。\n\n## 决策备查\n\n- v0.1.4 内容（安装卡死修复、步骤可视化、plugin-center 预制、圆角、\n  伪 3D）全部并入 v0.1.5 发布，不再单独发 v0.1.4。\n- npm 依赖解析确认：@max-null/dsh-chat-rail@0.1.0、dsh-node-appearance@0.1.1、\n  dsh-better-sidebar@0.13.1、@max-null/dsh-memory@0.2.2 均已在 registry 就绪，\n  minimumReleaseAgeExclude 已同步。\n"},{"file":"2026-08-19-v0.1.6发布待办-标题栏按钮组.md","date":"2026-08-19","slug":"v0.1.6发布待办-标题栏按钮组","title":"v0.1.6 发布待办：标题栏统一按钮组 + 插件中心优化","statusRaw":"已完成（2026-08-20：归档重建 + 打包 + Release v0.1.6 已发布；另顺带更新 skill-mcp-center 0.2.0 进归档）","statusKind":"已完成","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":null,"tags":["@max-null/dsh-header-unify","@max-null/dsh-plugin-center","dsh-skill-mcp-center","dsh-header-unify","ssid-shell","dsh-plugin-center","dsh-runtime"],"summary":"验证：plugins/dsh-header-unify/verify-header-unify.cjs 17 项断言全过；安装版实机验证 4 项（标题栏/会话页/hero 页/主题）+ 2 项优化全部通过。","bytes":4682,"lines":80,"body":"# v0.1.6 发布待办：标题栏统一按钮组 + 插件中心优化\r\n\r\n> 日期：2026-08-19\r\n> 状态：**已完成**（2026-08-20：归档重建 + 打包 + Release v0.1.6 已发布；另顺带更新 skill-mcp-center 0.2.0 进归档）\r\n> 版本：SSiD **0.1.6**（shell/package.json 已升）+ plugin-center **0.1.7**（已提交、已发布）+ dsh-skill-mcp-center **0.2.0**（本次新增，已发布）\r\n> 关联：[`2026-08-17-header按钮统一-调查与方案.md`](2026-08-17-header按钮统一-调查与方案.md)\r\n\r\n---\r\n\r\n## 一、本版包含的改动\r\n\r\n| # | 改动 | 状态 |\r\n|---|---|---|\r\n| 1 | SSiD 自绘标题栏统一按钮组（插件中心/侧栏/底栏，最小化按钮左侧） | ✅ 开发 + 验证 |\r\n| 2 | 内置插件 `@max-null/dsh-header-unify`（隐藏 DSH 内原按钮 + `ssid:titlebar` 事件执行器） | ✅ 开发 + 验证 |\r\n| 3 | plugin-center 暴露全局 API：`__pluginCenterOpen`（0.1.6）/ `__pluginCenterToggle` + `__pluginCenterClose` + 点遮罩关闭（0.1.7） | ✅ 开发 + 验证 |\r\n| 4 | 交互优化：插件中心再点关闭（toggle）；开侧栏/底栏自动关插件中心（单向互斥） | ✅ 用户实测效果很好 |\r\n| 5 | 壳 IPC：`ssid:title:action` → `mainView.executeJavaScript` 派发 `ssid:titlebar` CustomEvent | ✅ |\r\n\r\n验证：`plugins/dsh-header-unify/verify-header-unify.cjs` 17 项断言全过；安装版实机验证 4 项（标题栏/会话页/hero 页/主题）+ 2 项优化全部通过。\r\n\r\n## 二、版本矩阵\r\n\r\n| 包 | 版本 | 仓库 | 提交 |\r\n|---|---|---|---|\r\n| `ssid-shell` | 0.1.6 | `Max-Null/seek-soul-in-darkness` | 本提交（未推送） |\r\n| `@max-null/dsh-plugin-center` | 0.1.7 | `Max-Null/dsh-plugin-center` | `509d9f5`（0.1.6）+ `1833b58`（0.1.7），**未 push、未 publish** |\r\n| `@max-null/dsh-header-unify` | 0.1.0 | SSiD 仓库内置（`plugins/` + `profile-template/vendor/`） | 本提交 |\r\n\r\n## 三、发布链路（按序执行，每步成功后进入下一步）\r\n\r\n### 1. plugin-center：push + publish\r\n```sh\r\ncd D:\\Project\\dsh-plugin-center\r\ngit push origin main          # 推送 509d9f5 + 1833b58\r\nnpm publish                   # 发布 @max-null/dsh-plugin-center@0.1.7（需 npm token）\r\nnpm view @max-null/dsh-plugin-center version   # 确认 0.1.7\r\n```\r\n> 注意：pnpm-workspace.yaml 已把 0.1.7 加进 `minimumReleaseAgeExclude`，发布后立即 prepare-runtime 不会触发发布年龄检查。\r\n\r\n### 2. 重跑运行环境归档（新装机闭包）\r\n```sh\r\ncd D:\\Project\\ssid\\shell\r\nnode scripts/prepare-runtime.mjs\r\n```\r\n- 产物：`shell/dsh-runtime.tar.gz`（约 170MB，含 dsh-header-unify + plugin-center 0.1.7）\r\n- 前置：Node ≥22.13（默认找 `D:\\Program Files\\nvm\\v22.22.2\\node.exe`）、pnpm 11.x\r\n- 归档版本 `.runtime-version` = `0.1.6-0.1.0-rc.7-\u003c指纹>`：版本 + 依赖 + vendor 指纹变化会触发老 profile 重部署\r\n\r\n### 3. 重新打包安装版\r\n```sh\r\ncd D:\\Project\\ssid\\shell\r\nnpm run pack\r\n```\r\n- 产物：`shell/dist-electron/思灵 Setup 0.1.6.exe`\r\n- 验证 asar 含新标题栏：`btn-plugins` / `ssid:title:action`（打包后可选 grep）\r\n\r\n### 4. 发布前自测（安装版）\r\n- [ ] 新装机（删除 `%USERPROFILE%\\.dsh\\profiles\\ssid` 后首启）：归档部署成功，标题栏 3 按钮可用，插件中心可开/关/遮罩关，侧栏互斥正常\r\n- [ ] 老 profile 覆盖安装：标题栏按钮出现（asar 新版），插件中心为 0.1.7（归档指纹变化触发重部署或手动 `dsh plugin update`）\r\n- [ ] hero 页（未选会话）：插件中心可打开\r\n\r\n### 5. GitHub Release v0.1.6\r\n- 上传 `思灵 Setup 0.1.6.exe` 到 Release `v0.1.6`\r\n- Release 正文 = `docs/release-notes-v0.1.6.md`（**待写**，可参考 v0.1.2 的结构：新增/修复/体积/更新说明）\r\n- 打 tag `v0.1.6` 并推送\r\n\r\n### 6. 收尾\r\n- [ ] 推送 SSiD 仓库 main（本提交）\r\n- [ ] 更新 `docs/README.md` 索引（若新增 release-notes 链接）\r\n- [ ] 归档（可选）：发布后删除本机 `shell/dist-electron/` 旧产物，保留 0.1.6\r\n\r\n## 四、风险与注意\r\n\r\n| 项 | 说明 |\r\n|---|---|\r\n| 当前安装包（`思灵 Setup 0.1.5.exe`，2026-08-19 17:58） | 壳代码已含标题栏按钮，但 dsh-runtime 归档是旧内容（plugin-center 0.1.5）——**新装机**会缺 `__pluginCenterToggle/Close`，标题栏插件中心只能打开不能关闭。发布链第 2 步解决 |\r\n| 本机 profile | 已手动部署 0.1.7 + dsh-header-unify，不受归档影响；发布链完成后归档指纹变化，重启可能触发一次重部署（正常） |\r\n| `verify-header-unify.cjs` | 回归测试：任何 client.js 改动后先跑它再部署 |\r\n"},{"file":"2026-08-19-v0.1.6发布执行-环境核查与阻塞.md","date":"2026-08-19","slug":"v0.1.6发布执行-环境核查与阻塞","title":"v0.1.6 发布执行：环境核查与阻塞记录","statusRaw":"执行中，卡在待办 1 的 npm publish（凭据由用户手动执行；0.1.7 代码确认不在 GitHub 远程，publish 需用户在另一环境本地仓库执行）","statusKind":"进行中","owner":null,"purpose":null,"dateInBody":"2026-08-19","dateNote":"拉取代码后当轮","tags":["@max-null/dsh-plugin-center","dsh-plugin-center","dsh-runtime"],"summary":"1. npm 凭据：~/.npmrc 的 token 已失效（401）。用户已选择手动
