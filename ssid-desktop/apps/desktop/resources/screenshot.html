<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>思灵 · 截图引用</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; cursor: crosshair; }
  body { background: #000; user-select: none; }
  #frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }
  #dim { position: absolute; inset: 0; background: rgba(0, 0, 0, .42); pointer-events: none; }
  .cross { position: absolute; background: #4FC3F7; opacity: .8; pointer-events: none; display: none; }
  #cross-v { top: 0; bottom: 0; width: 1px; }
  #cross-h { left: 0; right: 0; height: 1px; }
  /* 选区：本体透明，四周阴影遮暗（Snipaste 式镂空） */
  #selection {
    position: absolute;
    border: 2px solid #4FC3F7;
    background: rgba(79, 195, 247, .10);
    box-shadow: 0 0 0 100000px rgba(0, 0, 0, .45);
    pointer-events: none;
    display: none;
    z-index: 5;
  }
  #selection::before, #selection::after {
    content: ''; position: absolute; width: 14px; height: 14px;
    border-color: #4FC3F7; border-style: solid;
  }
  #selection::before { left: -1px; top: -1px; border-width: 3px 0 0 3px; }
  #selection::after { right: -1px; bottom: -1px; border-width: 0 3px 3px 0; }
  #size {
    position: absolute; right: 6px; bottom: 6px; padding: 2px 8px; border-radius: 4px;
    background: rgba(10, 14, 20, .85); color: #E1F5FE;
    font: 12px/1.6 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    pointer-events: none; display: none;
    z-index: 6;
  }
  #tip {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    padding: 8px 20px; border-radius: 18px; background: rgba(10, 14, 20, .78); color: #E1F5FE;
    font: 13px/1.6 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    letter-spacing: .04em; pointer-events: none; white-space: nowrap;
  }
  #tip em { font-style: normal; color: #4FC3F7; }
  #tip em.red { color: #FF5B4D; }
  /* ── 选区工具条（微信式，挂选区下方/上方） ── */
  #toolbar {
    position: absolute;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 10px;
    background: rgba(26, 32, 42, .94);
    box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
    pointer-events: auto;
    z-index: 7;
    width: max-content;
  }
  #toolbar .tool {
    display: grid; place-items: center;
    width: 30px; height: 30px; flex: none;
    border: none; border-radius: 7px;
    background: transparent; color: #C7D3E3;
    cursor: pointer;
  }
  #toolbar .tool:hover { background: rgba(255, 255, 255, .12); color: #fff; }
  #toolbar .tool.active { background: #2E6BE6; color: #fff; }
  #toolbar .tool[data-tool="redo"] svg { transform: scaleX(-1); }
  #toolbar .tool-text { width: auto; padding: 0 12px; flex: none; white-space: nowrap; font: 13px/1.6 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif; }
  #toolbar .sep { width: 1px; height: 20px; flex: none; background: rgba(255, 255, 255, .18); }
  #toolbar .done {
    padding: 5px 16px; border: none; border-radius: 14px;
    flex: none; white-space: nowrap;
    background: #2E6BE6; color: #fff;
    font: 13px/1.6 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    cursor: pointer;
  }
  #toolbar .done:hover { background: #3B78F5; }
  /* 色板：圆点 + 选中描边环 */
  #toolbar .swatch {
    width: 16px; height: 16px; flex: none; border: none; border-radius: 50%;
    cursor: pointer; padding: 0; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0);
  }
  #toolbar .swatch.on { box-shadow: 0 0 0 2px rgba(255, 255, 255, .85); }
  /* 文字工具输入框（浮于画布上，坐标覆盖层） */
  #text-input {
    position: absolute; border: 1px solid #4FC3F7;
    background: rgba(10, 14, 20, .82); color: #fff;
    font: 15px/1.4 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    padding: 2px 6px; border-radius: 4px; outline: none; min-width: 40px;
    z-index: 8; display: none;
  }
  #text-input::placeholder { color: rgba(255, 255, 255, .45); }
</style>
</head>
<body>
<img id="frame" alt="">
<div id="dim"></div>
<div id="cross-v" class="cross"></div>
<div id="cross-h" class="cross"></div>
<div id="selection"></div>
<div id="size"></div>
<div id="tip"><em>拖拽</em> 选择截图区域 · <em>右键 / Esc</em> 取消</div>
<div id="toolbar">
  <button id="tool-box" type="button" class="tool active" title="矩形框">
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
      <path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5v-9Zm1.2.8v7.4c0 .17.13.3.3.3h7.4c.17 0 .3-.13.3-.3V4.3c0-.17-.13-.3-.3-.3H3.5c-.17 0-.3.13-.3.3Z" fill="#FF5B4D"/>
    </svg>
  </button>
  <button id="tool-ellipse" type="button" class="tool" title="椭圆框">
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
      <circle cx="8" cy="8" r="5.6" fill="none" stroke="#FF5B4D" stroke-width="1.8"/>
    </svg>
  </button>
  <button id="tool-arrow" type="button" class="tool" title="箭头（指向要改的内容）">
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
      <path d="M13.2 2.8 4.9 11.1M13.2 2.8v4.6M13.2 2.8H8.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button id="tool-text" type="button" class="tool" title="文字（点一下输入描述）">T</button>
  <div class="sep"></div>
  <span id="swatches"></span>
  <div class="sep"></div>
  <button id="tool-undo" type="button" class="tool" title="撤销（上一标注）">
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
      <path d="M6.7 3.2 3.2 6.7l3.5 3.5M3.6 6.7h6.1a3.1 3.1 0 0 1 0 6.2H8.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </button>
  <button id="tool-redo-sel" type="button" class="tool tool-text" title="取消（清除标注并重新选择）">取消</button>
  <button id="tool-done" type="button" class="done">完成</button>
</div>
<input id="text-input" type="text" placeholder="输入文字…" tabindex="-1">
<script>
(() => {
  'use strict'
  const frameEl = document.getElementById('frame')
  const dimEl = document.getElementById('dim')
  const crossV = document.getElementById('cross-v')
  const crossH = document.getElementById('cross-h')
  const selectionEl = document.getElementById('selection')
  const sizeEl = document.getElementById('size')
  const tipEl = document.getElementById('tip')
  const toolbarEl = document.getElementById('toolbar')
  const toolBox = document.getElementById('tool-box')
  const toolEllipse = document.getElementById('tool-ellipse')
  const toolArrow = document.getElementById('tool-arrow')
  const toolText = document.getElementById('tool-text')
  const toolUndo = document.getElementById('tool-undo')
  const toolRedoSel = document.getElementById('tool-redo-sel')
  const toolDone = document.getElementById('tool-done')
  const swatchesEl = document.getElementById('swatches')
  const textInputEl = document.getElementById('text-input')

  /** 主进程注入：{ dataUrl, logicalW, logicalH, physicalW, physicalH }。 */
  let frame = null

  // ---- 状态（全部按「帧物理坐标」口径；渲染时换算显示） ----
  let mode = 'select' // 'select'（框选） | 'tool'（选区定格，画标注框）
  let sel = null       // 选区（物理 Rect）
  let dragStart = null // 拖拽起点（显示坐标，select 阶段）
  /** 标注（物理坐标 + kind + color；rect/ellipse 用 x/y/w/h 归一化矩形，
   *  arrow 的 w/h 为带方向向量（可负，保留指向），text 的 w/h 合成时测量）。 */
  let annoRects = []
  let annoDraft = null
  let annoStart = null
  let undoStack = []   // 撤销栈（JSON 快照）
  /** 当前标注工具（工具条切换）。 */
  let toolKind = 'rect'
  /** 当前标注颜色（色板）。 */
  let annoColor = '#FF5B4D'
  /** 文字输入进行中：物理锚点 + 草稿值；提交后并入 annoRects。 */
  let textEdit = null

  // ---- 色板 ----
  const ANNO_COLORS = [
    ['#FF5B4D', '红'], ['#FF9F43', '橙'], ['#FFD93D', '黄'], ['#3ED598', '绿'],
    ['#4FC3F7', '青'], ['#7C6BFF', '紫'], ['#FF5CA8', '品红'], ['#FFFFFF', '白'],
  ]
  for (const [color, name] of ANNO_COLORS) {
    const b = document.createElement('button')
    b.type = 'button'
    b.className = 'swatch'
    b.title = name
    b.style.background = color
    b.addEventListener('click', () => { annoColor = color; syncSwatches() })
    swatchesEl.appendChild(b)
  }
  const syncSwatches = () => {
    for (let i = 0; i < swatchesEl.children.length; i++) {
      swatchesEl.children[i].classList.toggle('on', ANNO_COLORS[i][0] === annoColor)
    }
  }
  syncSwatches()

  /** '#RRGGBB' → 'rgba(r,g,b,a)'。 */
  const hexToRgba = (hex, alpha) => {
    const n = parseInt(hex.slice(1), 16)
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`
  }

  // ---- 闲置超时 3 分钟（交互重置） ----
  let idleTimer = 0
  const IDLE_MS = 180_000
  const resetIdle = () => {
    window.clearTimeout(idleTimer)
    idleTimer = window.setTimeout(() => window.ssidCapture.cancel(), IDLE_MS)
  }
  for (const type of ['mousedown', 'mousemove', 'mouseup', 'dblclick', 'keydown']) {
    document.addEventListener(type, resetIdle, { capture: true })
  }
  resetIdle()

  window.__setFrame = (value) => {
    frame = value
    frameEl.src = value.dataUrl
  }

  const norm = (x1, y1, x2, y2) => ({
    x: Math.min(x1, x2), y: Math.min(y1, y2),
    w: Math.abs(x2 - x1), h: Math.abs(y2 - y1),
  })

  /** 把点吸附进选区（红框起点在选区外时贴到就近边界）。 */
  const clampPoint = (p) => ({
    x: Math.min(Math.max(p.x, sel.x), sel.x + sel.w),
    y: Math.min(Math.max(p.y, sel.y), sel.y + sel.h),
  })
  /** 红框与选区的交集（无交集返回 null——红框不允许超出蓝框）。 */
  const clampToSel = (r) => {
    const x1 = Math.max(r.x, sel.x)
    const y1 = Math.max(r.y, sel.y)
    const x2 = Math.min(r.x + r.w, sel.x + sel.w)
    const y2 = Math.min(r.y + r.h, sel.y + sel.h)
    if (x2 <= x1 || y2 <= y1) return null
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }
  }

  /** 帧元素的实时显示矩形（坐标基准：不用 window.innerWidth——窗口/视口
   *  边界差（边框、DPI、系统约束）会让 inner 偏离屏幕尺寸，产生毫米差的
   *  「错位」；pixel-picker 同款做法：以元素 rect 为基准映射）。 */
  const frameRect = () => frameEl.getBoundingClientRect()
  /** 显示坐标 → 帧物理坐标。 */
  const toPhys = (clientX, clientY) => {
    const r = frameRect()
    return {
      x: (clientX - r.left) / r.width * frame.physicalW,
      y: (clientY - r.top) / r.height * frame.physicalH,
    }
  }
  /** 物理坐标 → 显示坐标。 */
  const toDisplay = (p) => {
    const r = frameRect()
    return {
      x: p.x / frame.physicalW * r.width + r.left,
      y: p.y / frame.physicalH * r.height + r.top,
    }
  }
  /** 物理矩形 → 显示矩形（含缩放后的宽高）。 */
  const toDisplayRect = (r) => {
    const p0 = toDisplay({ x: r.x, y: r.y })
    const p1 = toDisplay({ x: r.x + r.w, y: r.y + r.h })
    return { x: p0.x, y: p0.y, w: p1.x - p0.x, h: p1.y - p0.y }
  }

  const renderSelection = () => {
    if (sel === null || sel.w < 1 || sel.h < 1) {
      selectionEl.style.display = 'none'
      sizeEl.style.display = 'none'
      toolbarEl.style.display = 'none'
      return
    }
    const fr = frameRect()
    const d = toDisplayRect(sel)
    selectionEl.style.display = 'block'
    selectionEl.style.left = `${d.x}px`
    selectionEl.style.top = `${d.y}px`
    selectionEl.style.width = `${d.w}px`
    selectionEl.style.height = `${d.h}px`
    sizeEl.style.display = 'block'
    sizeEl.textContent = `${Math.round(sel.w)} × ${Math.round(sel.h)}`
    // 工具条：先显示再测量（display:none 时 rect 为 0），选区下方居中；
    // 超出帧区域底部则移到选区上方。
    toolbarEl.style.display = 'flex'
    const tb = toolbarEl.getBoundingClientRect()
    const maxX = Math.max(4, fr.left + fr.width - tb.width - 4)
    const left = Math.max(4, Math.min(maxX, d.x + d.w / 2 - tb.width / 2))
    const below = d.y + d.h + 8
    const top = below + tb.height + 8 <= fr.top + fr.height ? below : d.y - tb.height - 8
    toolbarEl.style.left = `${left}px`
    toolbarEl.style.top = `${Math.max(4, top)}px`
  }

  const drawAnnoRect = (s, r) => {
    if (r.kind === 'ellipse') {
      annotateCtx().beginPath()
      annotateCtx().ellipse(s.x + s.w / 2, s.y + s.h / 2, s.w / 2, s.h / 2, 0, 0, Math.PI * 2)
      annotateCtx().stroke()
      annotateCtx().fill()
      return
    }
    annotateCtx().strokeRect(s.x, s.y, s.w, s.h)
    annotateCtx().fillRect(s.x, s.y, s.w, s.h)
  }
  /** 箭头：主线段 + 头翼（30° 两翼）。 */
  const drawArrowOn = (ctx, x1, y1, x2, y2) => {
    ctx.beginPath()
    ctx.moveTo(x1, y1)
    ctx.lineTo(x2, y2)
    const angle = Math.atan2(y2 - y1, x2 - x1)
    const head = 12
    ctx.moveTo(x2, y2)
    ctx.lineTo(x2 - head * Math.cos(angle - Math.PI / 6), y2 - head * Math.sin(angle - Math.PI / 6))
    ctx.moveTo(x2, y2)
    ctx.lineTo(x2 - head * Math.cos(angle + Math.PI / 6), y2 - head * Math.sin(angle + Math.PI / 6))
    ctx.stroke()
  }
  /** 文字标注：标注色文字 + 细黑描边（无背景块；描边保证任意底色可读）。 */
  const drawTextOn = (ctx, x, y, text, color, font) => {
    ctx.font = font
    ctx.textBaseline = 'top'
    ctx.lineWidth = 3
    ctx.strokeStyle = 'rgba(0, 0, 0, .55)'
    ctx.strokeText(text, x, y)
    ctx.fillStyle = color
    ctx.fillText(text, x, y)
  }
  const annotateCtx = () => annoCanvas().getContext('2d')
  const renderAnno = () => {
    const ctx = annotateCtx()
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height)
    const draw = (r) => {
      ctx.strokeStyle = r.color
      ctx.fillStyle = hexToRgba(r.color, .12)
      ctx.lineWidth = 2.5
      if (r.kind === 'text') {
        const d = toDisplay({ x: r.x, y: r.y })
        drawTextOn(ctx, d.x, d.y, r.text || '', r.color, '15px "Microsoft YaHei UI", "PingFang SC", sans-serif')
        return
      }
      const s = toDisplayRect({ x: r.x, y: r.y, w: r.w, h: r.h })
      if (r.kind === 'arrow') {
        const p1 = toDisplay({ x: r.x, y: r.y })
        const p2 = toDisplay({ x: r.x + r.w, y: r.y + r.h })
        drawArrowOn(ctx, p1.x, p1.y, p2.x, p2.y)
        return
      }
      drawAnnoRect(s, r)
    }
    for (const r of annoRects) draw(r)
    if (annoDraft !== null) draw(annoDraft)
  }
  const annoCanvas = () => frameEl.parentElement.querySelector('canvas[data-anno]') || (() => {
    // 若无覆盖 canvas（首次），创建一个与帧元素对齐的覆盖层。
    const fr = frameRect()
    const c = document.createElement('canvas')
    c.dataset.anno = '1'
    c.style.position = 'absolute'
    c.style.left = `${fr.left}px`
    c.style.top = `${fr.top}px`
    c.style.pointerEvents = 'none'
    c.width = fr.width
    c.height = fr.height
    frameEl.parentElement.appendChild(c)
    return c
  })()

  /** 完成：裁剪选区 + 标注合成（颜色/箭头/文字）→ 交付（一次确认）。
   *  协议(v2)：confirm({ source, annotated? }) —— annotated 仅当存在标注时
   *  携带；无标注时只传原图（2026-08-24 用户决定：没编辑就不传编辑图）。 */
  const finish = async () => {
    if (frame === null || sel === null || sel.w < 2 || sel.h < 2) return
    const image = await loadImage(frameEl.src)
    const canvas = document.createElement('canvas')
    canvas.width = Math.round(sel.w)
    canvas.height = Math.round(sel.h)
    const ctx = canvas.getContext('2d')
    ctx.drawImage(image, sel.x, sel.y, sel.w, sel.h, 0, 0, sel.w, sel.h)
    const source = canvas.toDataURL('image/png')
    if (annoRects.length === 0) {
      window.ssidCapture.confirm({ source })
      return
    }
    ctx.save()
    ctx.beginPath()
    ctx.rect(0, 0, canvas.width, canvas.height)
    ctx.clip()
    for (const r of annoRects) {
      ctx.strokeStyle = r.color
      ctx.lineWidth = 3
      ctx.fillStyle = hexToRgba(r.color, .12)
      if (r.kind === 'text') {
        drawTextOn(ctx, r.x - sel.x, r.y - sel.y, r.text || '', r.color, '16px "Microsoft YaHei UI", "PingFang SC", sans-serif')
        continue
      }
      const x = r.x - sel.x
      const y = r.y - sel.y
      if (r.kind === 'arrow') {
        drawArrowOn(ctx, x, y, x + r.w, y + r.h)
        continue
      }
      if (r.kind === 'ellipse') {
        ctx.beginPath()
        ctx.ellipse(x + r.w / 2, y + r.h / 2, r.w / 2, r.h / 2, 0, 0, Math.PI * 2)
        ctx.stroke()
        ctx.fill()
      } else {
        ctx.strokeRect(x, y, r.w, r.h)
        ctx.fillRect(x, y, r.w, r.h)
      }
    }
    ctx.restore()
    window.ssidCapture.confirm({ source, annotated: canvas.toDataURL('image/png') })
  }

  const loadImage = (src) => new Promise((resolve, reject) => {
    const image = new Image()
    image.onload = () => resolve(image)
    image.onerror = () => reject(new Error('frame decode failed'))
    image.src = src
  })

  /** 提交进行中的文字输入（空值丢弃锚点）。 */
  const commitText = () => {
    if (textEdit === null) return
    const clean = textEdit.value.trim()
    if (clean !== '') {
      annoRects.push({ kind: 'text', x: textEdit.x, y: textEdit.y, w: 0, h: 0, color: annoColor, text: clean })
      undoStack.push(JSON.stringify(annoRects.slice(0, -1)))
    }
    endTextEdit()
    renderAnno()
  }
  const endTextEdit = () => {
    textEdit = null
    textInputEl.style.display = 'none'
    textInputEl.value = ''
  }
  const beginTextEdit = (x, y) => {
    commitText()
    textEdit = { x, y, value: '' }
    textInputEl.style.display = 'block'
    textInputEl.style.left = `${toDisplay({ x, y }).x}px`
    textInputEl.style.top = `${toDisplay({ x, y }).y}px`
    textInputEl.value = ''
    textInputEl.focus()
  }

  /** 右键/Esc 层级：文字输入中 → 取消输入；画框中 → 撤框 → 重选 → 取消。 */
  const cancelOrBack = () => {
    if (textEdit !== null) { endTextEdit(); renderAnno(); return }
    if (mode === 'tool') {
      if (annoDraft !== null) { annoDraft = null; renderAnno(); return }
      if (annoRects.length > 0) { annoRects.pop(); renderAnno(); return }
      backToSelect()
      return
    }
    window.ssidCapture.cancel()
  }

  const backToSelect = () => {
    mode = 'select'
    sel = null
    annoRects = []
    annoDraft = null
    annoStart = null
    undoStack = []
    endTextEdit()
    renderAnno()
    renderSelection()
    tipEl.innerHTML = '<em>拖拽</em> 选择截图区域 · <em>右键 / Esc</em> 取消'
  }

  const enterTool = () => {
    mode = 'tool'
    annoRects = []
    undoStack = []
    setToolKind('rect')
    endTextEdit()
    renderAnno()
    renderSelection()
    tipEl.innerHTML = '拖拽画<em class="red">标注</em> · <em>T</em> 点一下写文字 · <em>回车</em> 完成 · <em>右键 / Esc</em> 逐级回退'
  }

  // ---- 事件 ----
  document.addEventListener('contextmenu', (event) => { event.preventDefault() })
  document.addEventListener('mousedown', (event) => {
    // 工具条按钮上的按下不触发任何绘制/选择（点击按钮不应被误认为画框）。
    if (toolbarEl.contains(event.target)) return
    // 文字输入框内的交互交给 input 自身（提交/取消走它的键盘事件）。
    if (event.target === textInputEl) return
    // 右键 = 逐级回退（画框中 → 撤框 → 重选 → 取消）。此前误以为右键是
    // 「浮层消失」元凶而禁用，实测根因是 hideWindow=false 时普通置顶层级
    // 被激活窗口覆盖（screen-saver 置顶修复后恢复右键，2026-08-23 用户确认）。
    if (event.button === 2) {
      event.preventDefault()
      cancelOrBack()
      return
    }
    if (event.button !== 0) return
    if (mode === 'tool') {
      const p = toPhys(event.clientX, event.clientY)
      if (toolKind === 'text') {
        // 文字工具：单击放置锚点并开始输入（无拖拽语义）；已有输入先提交。
        // preventDefault：不带它，mousedown 默认行为会把焦点从刚 focus 的
        // 输入框抢回目标元素 → blur → 空文本提交 → 输入框立即关闭（2026-08-24
        // 自动化复现：前后 display=block/none、left/top 已设置但 focused=false）。
        event.preventDefault()
        beginTextEdit(clampPoint(p).x, clampPoint(p).y)
        return
      }
      annoStart = clampPoint(p)
      annoDraft = { x: annoStart.x, y: annoStart.y, w: 0, h: 0, kind: toolKind, color: annoColor }
      renderAnno()
      return
    }
    // select：记录起点但不立即清空已定格选区（双击确认不被打断）。
    const p = toPhys(event.clientX, event.clientY)
    dragStart = { x: event.clientX, y: event.clientY, phys: p, moved: false }
  })
  document.addEventListener('mousemove', (event) => {
    if (mode === 'tool') {
      if (annoStart !== null) {
        const p = toPhys(event.clientX, event.clientY)
        if (toolKind === 'arrow') {
          // 箭头保留方向（首尾都 clamp 进选区）。
          const a = clampPoint(annoStart)
          const b = clampPoint(p)
          annoDraft = { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y, kind: 'arrow', color: annoColor }
          renderAnno()
          return
        }
        // 标注框与蓝框实时取交集（不允许超出选区）。拖出选区时预览消失、
        // 拖回来立即恢复——以「画框起点存在」为条件，不能以 annoDraft 为条件
        // （否则 clamp 置 null 后拖回选区就不会再出现，2026-08-23 实测）。
        const clipped = clampToSel(norm(annoStart.x, annoStart.y, p.x, p.y))
        annoDraft = clipped === null ? null : { ...clipped, kind: toolKind, color: annoColor }
        renderAnno()
      }
      return
    }
    if (dragStart !== null) {
      const p = toPhys(event.clientX, event.clientY)
      // 拖动超过 4px 才开始新框选：纯点击（含双击序列）不销毁已定格选区。
      if (!dragStart.moved && Math.hypot(p.x - dragStart.phys.x, p.y - dragStart.phys.y) > 4) {
        dragStart.moved = true
        sel = null
      }
      if (dragStart.moved) {
        sel = norm(dragStart.phys.x, dragStart.phys.y, p.x, p.y)
      }
      renderSelection()
    } else {
      crossV.style.display = 'block'
      crossH.style.display = 'block'
      crossV.style.left = `${event.clientX}px`
      crossH.style.top = `${event.clientY}px`
    }
  })
  document.addEventListener('mouseup', () => {
    if (mode === 'tool') {
      if (annoDraft !== null) {
        const d = annoDraft
        const ok = d.kind === 'arrow'
          ? Math.hypot(d.w, d.h) >= 8
          : d.kind !== 'text' && d.w >= 3 && d.h >= 3
        if (ok) {
          annoRects.push(d)
          undoStack.push(JSON.stringify(annoRects.slice(0, -1)))
        }
        annoDraft = null
        annoStart = null
        renderAnno()
      }
      return
    }
    if (dragStart === null) return
    const justDragged = dragStart.moved
    dragStart = null
    renderCrossClear()
    if (justDragged && sel !== null && sel.w >= 4 && sel.h >= 4) enterTool()
    else renderSelection()
  })
  const renderCrossClear = () => {
    crossV.style.display = 'none'
    crossH.style.display = 'none'
  }

  // 工具条
  const setToolKind = (kind) => {
    toolKind = kind
    toolBox.classList.toggle('active', kind === 'rect')
    toolEllipse.classList.toggle('active', kind === 'ellipse')
    toolArrow.classList.toggle('active', kind === 'arrow')
    toolText.classList.toggle('active', kind === 'text')
    if (kind !== 'text' && textEdit !== null) { endTextEdit(); renderAnno() }
  }
  toolBox.addEventListener('click', () => setToolKind('rect'))
  toolEllipse.addEventListener('click', () => setToolKind('ellipse'))
  toolArrow.addEventListener('click', () => setToolKind('arrow'))
  toolText.addEventListener('click', () => setToolKind('text'))
  toolUndo.addEventListener('click', () => {
    if (annoRects.length > 0) { undoStack.push(JSON.stringify(annoRects.slice(0, -1))); annoRects.pop(); renderAnno() }
  })
  toolRedoSel.addEventListener('click', () => { backToSelect() })
  toolDone.addEventListener('click', () => {
    if (textEdit !== null) commitText()
    void finish().catch((error) => { window.ssidCapture.error(String(error)) })
  })

  // 文字输入框：回车提交 / Esc 取消 / 失焦提交。
  textInputEl.addEventListener('input', () => { textEdit.value = textInputEl.value })
  textInputEl.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') { commitText(); }
    else if (event.key === 'Escape') { endTextEdit(); renderAnno() }
    event.stopPropagation()
  })
  textInputEl.addEventListener('blur', () => { if (textEdit !== null) commitText() })

  document.addEventListener('dblclick', () => {
    if (mode === 'tool') {
      if (textEdit !== null) commitText()
      void finish().catch((error) => { window.ssidCapture.error(String(error)) })
      return
    }
    if (sel !== null && sel.w >= 4 && sel.h >= 4) enterTool()
  })
  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') { cancelOrBack(); return }
    if (event.key === 'Enter' && mode === 'tool') {
      if (textEdit !== null) commitText()
      void finish().catch((error) => { window.ssidCapture.error(String(error)) })
    }
  })
})()
</script>
</body>
</html>
