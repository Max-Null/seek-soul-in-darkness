<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>思灵 · 截图引用</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; cursor: crosshair; }
  body { background: #000; user-select: none; }
  #frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }
  #dim { position: absolute; inset: 0; background: rgba(0, 0, 0, .42); pointer-events: none; }
  .cross { position: absolute; background: #4FC3F7; opacity: .8; pointer-events: none; display: none; }
  #cross-v { top: 0; bottom: 0; width: 1px; }
  #cross-h { left: 0; right: 0; height: 1px; }
  /* 选区：本体透明，四周阴影遮暗（Snipaste 式镂空） */
  #selection {
    position: absolute;
    border: 2px solid #4FC3F7;
    background: rgba(79, 195, 247, .10);
    box-shadow: 0 0 0 100000px rgba(0, 0, 0, .45);
    pointer-events: none;
    display: none;
    z-index: 5;
  }
  #selection::before, #selection::after {
    content: ''; position: absolute; width: 14px; height: 14px;
    border-color: #4FC3F7; border-style: solid;
  }
  #selection::before { left: -1px; top: -1px; border-width: 3px 0 0 3px; }
  #selection::after { right: -1px; bottom: -1px; border-width: 0 3px 3px 0; }
  #size {
    position: absolute; right: 6px; bottom: 6px; padding: 2px 8px; border-radius: 4px;
    background: rgba(10, 14, 20, .85); color: #E1F5FE;
    font: 12px/1.6 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    pointer-events: none; display: none;
    z-index: 6;
  }
  #tip {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    padding: 8px 20px; border-radius: 18px; background: rgba(10, 14, 20, .78); color: #E1F5FE;
    font: 13px/1.6 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    letter-spacing: .04em; pointer-events: none; white-space: nowrap;
  }
  #tip em { font-style: normal; color: #4FC3F7; }
  #tip em.red { color: #FF5B4D; }
  /* ── 选区工具条（微信式，挂选区下方/上方） ── */
  #toolbar {
    position: absolute;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 10px;
    background: rgba(26, 32, 42, .94);
    box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
    pointer-events: auto;
    z-index: 7;
  }
  #toolbar .tool {
    display: grid; place-items: center;
    width: 30px; height: 30px;
    border: none; border-radius: 7px;
    background: transparent; color: #C7D3E3;
    cursor: pointer;
  }
  #toolbar .tool:hover { background: rgba(255, 255, 255, .12); color: #fff; }
  #toolbar .tool.active { background: #2E6BE6; color: #fff; }
  #toolbar .tool[data-tool="redo"] svg { transform: scaleX(-1); }
  #toolbar .sep { width: 1px; height: 20px; background: rgba(255, 255, 255, .18); }
  #toolbar .done {
    padding: 5px 16px; border: none; border-radius: 14px;
    background: #2E6BE6; color: #fff;
    font: 13px/1.6 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    cursor: pointer;
  }
  #toolbar .done:hover { background: #3B78F5; }
</style>
</head>
<body>
<img id="frame" alt="">
<div id="dim"></div>
<div id="cross-v" class="cross"></div>
<div id="cross-h" class="cross"></div>
<div id="selection"></div>
<div id="size"></div>
<div id="tip"><em>拖拽</em> 选择截图区域 · <em>右键</em> 取消</div>
<div id="toolbar">
  <button id="tool-box" type="button" class="tool active" title="矩形框">
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
      <path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5v-9Zm1.2.8v7.4c0 .17.13.3.3.3h7.4c.17 0 .3-.13.3-.3V4.3c0-.17-.13-.3-.3-.3H3.5c-.17 0-.3.13-.3.3Z" fill="#FF5B4D"/>
    </svg>
  </button>
  <button id="tool-ellipse" type="button" class="tool" title="椭圆框">
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
      <circle cx="8" cy="8" r="5.6" fill="none" stroke="#FF5B4D" stroke-width="1.8"/>
    </svg>
  </button>
  <div class="sep"></div>
  <button id="tool-undo" type="button" class="tool" title="撤销（上一标注）">
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
      <path d="M6.7 3.2 3.2 6.7l3.5 3.5M3.6 6.7h6.1a3.1 3.1 0 0 1 0 6.2H8.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </button>
  <button id="tool-redo-sel" type="button" class="tool" title="重选区域">
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" aria-hidden="true">
      <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h5A2.5 2.5 0 0 1 13 5.5v5a2.5 2.5 0 0 1-2.5 2.5h-5A2.5 2.5 0 0 1 3 10.5v-5Z" stroke="currentColor" stroke-width="1.4" fill="none"/>
    </svg>
  </button>
  <button id="tool-done" type="button" class="done">完成</button>
</div>
<script>
(() => {
  'use strict'
  const frameEl = document.getElementById('frame')
  const dimEl = document.getElementById('dim')
  const crossV = document.getElementById('cross-v')
  const crossH = document.getElementById('cross-h')
  const selectionEl = document.getElementById('selection')
  const sizeEl = document.getElementById('size')
  const tipEl = document.getElementById('tip')
  const toolbarEl = document.getElementById('toolbar')
  const toolBox = document.getElementById('tool-box')
  const toolEllipse = document.getElementById('tool-ellipse')
  const toolUndo = document.getElementById('tool-undo')
  const toolRedoSel = document.getElementById('tool-redo-sel')
  const toolDone = document.getElementById('tool-done')

  /** 主进程注入：{ dataUrl, logicalW, logicalH, physicalW, physicalH }。 */
  let frame = null

  // ---- 状态（全部按「帧物理坐标」口径；渲染时换算显示） ----
  let mode = 'select' // 'select'（框选） | 'tool'（选区定格，画标注框）
  let sel = null       // 选区（物理 Rect）
  let dragStart = null // 拖拽起点（显示坐标，select 阶段）
  /** 标注框（物理 Rect + kind: 'rect' | 'ellipse'）。 */
  let annoRects = []
  let annoDraft = null
  let annoStart = null
  let undoStack = []   // 撤销栈（JSON 快照）
  /** 当前标注工具（工具条切换）。 */
  let toolKind = 'rect'

  // ---- 闲置超时 3 分钟（交互重置） ----
  let idleTimer = 0
  const IDLE_MS = 180_000
  const resetIdle = () => {
    window.clearTimeout(idleTimer)
    idleTimer = window.setTimeout(() => window.ssidCapture.cancel(), IDLE_MS)
  }
  for (const type of ['mousedown', 'mousemove', 'mouseup', 'dblclick', 'keydown']) {
    document.addEventListener(type, resetIdle, { capture: true })
  }
  resetIdle()

  window.__setFrame = (value) => {
    frame = value
    frameEl.src = value.dataUrl
    dbg(`frame set phys=${value.physicalW}x${value.physicalH} logical=${value.logicalW}x${value.logicalH} inner=${window.innerWidth}x${window.innerHeight}`)
  }

  const norm = (x1, y1, x2, y2) => ({
    x: Math.min(x1, x2), y: Math.min(y1, y2),
    w: Math.abs(x2 - x1), h: Math.abs(y2 - y1),
  })

  /** 把点吸附进选区（红框起点在选区外时贴到就近边界）。 */
  const clampPoint = (p) => ({
    x: Math.min(Math.max(p.x, sel.x), sel.x + sel.w),
    y: Math.min(Math.max(p.y, sel.y), sel.y + sel.h),
  })
  /** 红框与选区的交集（无交集返回 null——红框不允许超出蓝框）。 */
  const clampToSel = (r) => {
    const x1 = Math.max(r.x, sel.x)
    const y1 = Math.max(r.y, sel.y)
    const x2 = Math.min(r.x + r.w, sel.x + sel.w)
    const y2 = Math.min(r.y + r.h, sel.y + sel.h)
    if (x2 <= x1 || y2 <= y1) return null
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }
  }

  /** 帧元素的实时显示矩形（坐标基准：不用 window.innerWidth——窗口/视口
   *  边界差（边框、DPI、系统约束）会让 inner 偏离屏幕尺寸，产生毫米差的
   *  「错位」；pixel-picker 同款做法：以元素 rect 为基准映射）。 */
  const frameRect = () => frameEl.getBoundingClientRect()
  /** 显示坐标 → 帧物理坐标。 */
  const toPhys = (clientX, clientY) => {
    const r = frameRect()
    return {
      x: (clientX - r.left) / r.width * frame.physicalW,
      y: (clientY - r.top) / r.height * frame.physicalH,
    }
  }
  /** 物理坐标 → 显示坐标。 */
  const toDisplay = (p) => {
    const r = frameRect()
    return {
      x: p.x / frame.physicalW * r.width + r.left,
      y: p.y / frame.physicalH * r.height + r.top,
    }
  }
  /** 物理矩形 → 显示矩形（含缩放后的宽高）。 */
  const toDisplayRect = (r) => {
    const p0 = toDisplay({ x: r.x, y: r.y })
    const p1 = toDisplay({ x: r.x + r.w, y: r.y + r.h })
    return { x: p0.x, y: p0.y, w: p1.x - p0.x, h: p1.y - p0.y }
  }

  const renderSelection = () => {
    if (sel === null || sel.w < 1 || sel.h < 1) {
      selectionEl.style.display = 'none'
      sizeEl.style.display = 'none'
      toolbarEl.style.display = 'none'
      return
    }
    const fr = frameRect()
    const d = toDisplayRect(sel)
    selectionEl.style.display = 'block'
    selectionEl.style.left = `${d.x}px`
    selectionEl.style.top = `${d.y}px`
    selectionEl.style.width = `${d.w}px`
    selectionEl.style.height = `${d.h}px`
    sizeEl.style.display = 'block'
    sizeEl.textContent = `${Math.round(sel.w)} × ${Math.round(sel.h)}`
    // 工具条：先显示再测量（display:none 时 rect 为 0），选区下方居中；
    // 超出帧区域底部则移到选区上方。
    toolbarEl.style.display = 'flex'
    const tb = toolbarEl.getBoundingClientRect()
    const maxX = Math.max(4, fr.left + fr.width - tb.width - 4)
    const left = Math.max(4, Math.min(maxX, d.x + d.w / 2 - tb.width / 2))
    const below = d.y + d.h + 8
    const top = below + tb.height + 8 <= fr.top + fr.height ? below : d.y - tb.height - 8
    toolbarEl.style.left = `${left}px`
    toolbarEl.style.top = `${Math.max(4, top)}px`
  }

  const drawAnnoRect = (s, r) => {
    if (r.kind === 'ellipse') {
      annotateCtx().beginPath()
      annotateCtx().ellipse(s.x + s.w / 2, s.y + s.h / 2, s.w / 2, s.h / 2, 0, 0, Math.PI * 2)
      annotateCtx().stroke()
      annotateCtx().fill()
      return
    }
    annotateCtx().strokeRect(s.x, s.y, s.w, s.h)
    annotateCtx().fillRect(s.x, s.y, s.w, s.h)
  }
  const annotateCtx = () => annoCanvas().getContext('2d')
  const renderAnno = () => {
    const ctx = annotateCtx()
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height)
    ctx.strokeStyle = '#FF5B4D'
    ctx.fillStyle = 'rgba(255, 91, 77, .12)'
    ctx.lineWidth = 2.5
    const draw = (r) => drawAnnoRect(toDisplayRect(r), r)
    for (const r of annoRects) draw(r)
    if (annoDraft !== null) draw(annoDraft)
  }
  const annoCanvas = () => frameEl.parentElement.querySelector('canvas[data-anno]') || (() => {
    // 若无覆盖 canvas（首次），创建一个与帧元素对齐的覆盖层。
    const fr = frameRect()
    const c = document.createElement('canvas')
    c.dataset.anno = '1'
    c.style.position = 'absolute'
    c.style.left = `${fr.left}px`
    c.style.top = `${fr.top}px`
    c.style.pointerEvents = 'none'
    c.width = fr.width
    c.height = fr.height
    frameEl.parentElement.appendChild(c)
    return c
  })()

  /** 完成：裁剪选区 + 红框合成 → 交付（一次确认）。 */
  const finish = async () => {
    if (frame === null || sel === null || sel.w < 2 || sel.h < 2) return
    const image = await loadImage(frameEl.src)
    const canvas = document.createElement('canvas')
    canvas.width = Math.round(sel.w)
    canvas.height = Math.round(sel.h)
    const ctx = canvas.getContext('2d')
    ctx.drawImage(image, sel.x, sel.y, sel.w, sel.h, 0, 0, sel.w, sel.h)
    ctx.save()
    ctx.beginPath()
    ctx.rect(0, 0, canvas.width, canvas.height)
    ctx.clip()
    ctx.strokeStyle = '#FF3B30'
    ctx.lineWidth = 3
    ctx.fillStyle = 'rgba(255, 59, 48, .12)'
    for (const r of annoRects) {
      const x = r.x - sel.x
      const y = r.y - sel.y
      if (r.kind === 'ellipse') {
        ctx.beginPath()
        ctx.ellipse(x + r.w / 2, y + r.h / 2, r.w / 2, r.h / 2, 0, 0, Math.PI * 2)
        ctx.stroke()
        ctx.fill()
      } else {
        ctx.strokeRect(x, y, r.w, r.h)
        ctx.fillRect(x, y, r.w, r.h)
      }
    }
    ctx.restore()
    window.ssidCapture.confirm(canvas.toDataURL('image/png'))
  }

  const loadImage = (src) => new Promise((resolve, reject) => {
    const image = new Image()
    image.onload = () => resolve(image)
    image.onerror = () => reject(new Error('frame decode failed'))
    image.src = src
  })

  /** 右键/Esc 层级：画框中 → 撤框 → 重选 → 取消。 */
  const cancelOrBack = () => {
    if (mode === 'tool') {
      if (annoDraft !== null) { annoDraft = null; renderAnno(); return }
      if (annoRects.length > 0) { annoRects.pop(); renderAnno(); return }
      backToSelect()
      return
    }
    window.ssidCapture.cancel()
  }

  const backToSelect = () => {
    mode = 'select'
    sel = null
    annoRects = []
    annoDraft = null
    annoStart = null
    undoStack = []
    renderAnno()
    renderSelection()
    tipEl.innerHTML = '<em>拖拽</em> 选择截图区域 · <em>右键</em> 取消'
  }

  const enterTool = () => {
    mode = 'tool'
    annoRects = []
    undoStack = []
    setToolKind('rect')
    renderAnno()
    renderSelection()
    tipEl.innerHTML = '拖拽画<em class="red">标注框</em>强调 · <em>回车</em> 完成 · <em>右键</em> 逐级回退'
  }

  /** 临时调试：关键事件经 error 通道上报主进程日志（[screenshot] overlay error: [dbg] ...）。 */
  const dbg = (message) => { try { window.ssidCapture.error(`[dbg] ${message}`) } catch { /* ignore */ } }

  // ---- 事件 ----
  document.addEventListener('contextmenu', (event) => { event.preventDefault() })
  document.addEventListener('mousedown', (event) => {
    if (event.button === 2) { cancelOrBack(); return }
    if (event.button !== 0) return
    if (mode === 'tool') {
      const p = toPhys(event.clientX, event.clientY)
      dbg(`mousedown tool@${Math.round(event.clientX)},${Math.round(event.clientY)} phys=${Math.round(p.x)},${Math.round(p.y)}`)
      annoStart = clampPoint(p)
      annoDraft = { x: annoStart.x, y: annoStart.y, w: 0, h: 0, kind: toolKind }
      renderAnno()
      return
    }
    // select：记录起点但不立即清空已定格选区（双击确认不被打断）。
    const p = toPhys(event.clientX, event.clientY)
    dbg(`mousedown select@${Math.round(event.clientX)},${Math.round(event.clientY)} phys=${Math.round(p.x)},${Math.round(p.y)} inner=${window.innerWidth}x${window.innerHeight} physFrame=${frame.physicalW}x${frame.physicalH}`)
    dragStart = { x: event.clientX, y: event.clientY, phys: p, moved: false }
  })
  document.addEventListener('mousemove', (event) => {
    if (mode === 'tool') {
      if (annoDraft !== null && annoStart !== null) {
        const p = toPhys(event.clientX, event.clientY)
        // 拖拽中的标注框永远与蓝框取交集（不允许超出选区；无交集则不显示）。
        const clipped = clampToSel(norm(annoStart.x, annoStart.y, p.x, p.y))
        annoDraft = clipped === null ? null : { ...clipped, kind: toolKind }
        renderAnno()
      }
      return
    }
    if (dragStart !== null) {
      const p = toPhys(event.clientX, event.clientY)
      // 拖动超过 4px 才开始新框选：纯点击（含双击序列）不销毁已定格选区。
      if (!dragStart.moved && Math.hypot(p.x - dragStart.phys.x, p.y - dragStart.phys.y) > 4) {
        dragStart.moved = true
        sel = null
        dbg(`drag started phys=${Math.round(p.x)},${Math.round(p.y)}`)
      }
      if (dragStart.moved) {
        sel = norm(dragStart.phys.x, dragStart.phys.y, p.x, p.y)
        if (sel.w % 300 < 2) dbg(`sel ${Math.round(sel.w)}x${Math.round(sel.h)}`)
      }
      renderSelection()
    } else {
      crossV.style.display = 'block'
      crossH.style.display = 'block'
      crossV.style.left = `${event.clientX}px`
      crossH.style.top = `${event.clientY}px`
    }
  })
  document.addEventListener('mouseup', () => {
    if (mode === 'tool') {
      if (annoDraft !== null) {
        if (annoDraft.w >= 3 && annoDraft.h >= 3) {
          annoRects.push(annoDraft)
          undoStack.push(JSON.stringify(annoRects.slice(0, -1)))
          dbg(`anno added ${Math.round(annoDraft.w)}x${Math.round(annoDraft.h)} total=${annoRects.length}`)
        }
        annoDraft = null
        annoStart = null
        renderAnno()
      }
      return
    }
    if (dragStart === null) return
    const justDragged = dragStart.moved
    dragStart = null
    renderCrossClear()
    dbg(`mouseup sel=${sel === null ? 'null' : `${Math.round(sel.x)},${Math.round(sel.y)} ${Math.round(sel.w)}x${Math.round(sel.h)}`} moved=${justDragged}`)
    if (justDragged && sel !== null && sel.w >= 4 && sel.h >= 4) enterTool()
    else renderSelection()
  })
  const renderCrossClear = () => {
    crossV.style.display = 'none'
    crossH.style.display = 'none'
  }

  // 工具条
  const setToolKind = (kind) => {
    toolKind = kind
    toolBox.classList.toggle('active', kind === 'rect')
    toolEllipse.classList.toggle('active', kind === 'ellipse')
  }
  toolBox.addEventListener('click', () => setToolKind('rect'))
  toolEllipse.addEventListener('click', () => setToolKind('ellipse'))
  toolUndo.addEventListener('click', () => {
    if (annoRects.length > 0) { undoStack.push(JSON.stringify(annoRects.slice(0, -1))); annoRects.pop(); renderAnno() }
  })
  toolRedoSel.addEventListener('click', () => { backToSelect() })
  toolDone.addEventListener('click', () => { void finish().catch((error) => { window.ssidCapture.error(String(error)) }) })

  document.addEventListener('dblclick', () => {
    if (mode === 'tool') { void finish().catch((error) => { window.ssidCapture.error(String(error)) }); return }
    if (sel !== null && sel.w >= 4 && sel.h >= 4) enterTool()
  })
  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') { cancelOrBack(); return }
    if (event.key === 'Enter' && mode === 'tool') {
      void finish().catch((error) => { window.ssidCapture.error(String(error)) })
    }
  })
})()
</script>
</body>
</html>
