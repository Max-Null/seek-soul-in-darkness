<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>思灵 · 截图引用</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; cursor: crosshair; }
  body { background: #000; user-select: none; }
  #frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }
  #dim { position: absolute; inset: 0; background: rgba(0, 0, 0, .42); pointer-events: none; }
  /* 十字准星（跟随鼠标，无选区时显示） */
  .cross {
    position: absolute;
    background: #4FC3F7;
    opacity: .8;
    pointer-events: none;
    display: none;
  }
  #cross-v { top: 0; bottom: 0; width: 1px; }
  #cross-h { left: 0; right: 0; height: 1px; }
  /* 选区：本体透明（露出冻结帧），四周阴影遮暗（Snipaste 式镂空） */
  #selection {
    position: absolute;
    border: 1px solid #4FC3F7;
    background: rgba(79, 195, 247, .08);
    box-shadow: 0 0 0 100000px rgba(0, 0, 0, .42);
    pointer-events: none;
    display: none;
  }
  /* 四角 L 形角标（加强选区视觉强调） */
  #selection::before, #selection::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border-color: #4FC3F7;
    border-style: solid;
  }
  #selection::before { left: -1px; top: -1px; border-width: 3px 0 0 3px; }
  #selection::after { right: -1px; bottom: -1px; border-width: 0 3px 3px 0; }
  /* 选区尺寸标注（选区右下角内侧） */
  #size {
    position: absolute;
    right: 6px;
    bottom: 6px;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(10, 14, 20, .85);
    color: #E1F5FE;
    font: 12px/1.6 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    pointer-events: none;
    display: none;
  }
  #tip {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    border-radius: 18px;
    background: rgba(10, 14, 20, .78);
    color: #E1F5FE;
    font: 13px/1.6 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    letter-spacing: .04em;
    pointer-events: none;
    white-space: nowrap;
  }
  #tip em { font-style: normal; color: #4FC3F7; }
  /* ── 标注阶段 ── */
  #annotate {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, .94);
    cursor: crosshair;
  }
  #annotate-wrap { position: relative; display: none; }
  #crop-img { display: block; pointer-events: none; }
  #annotate-canvas { position: absolute; inset: 0; pointer-events: none; }
  #annotate .panel {
    position: fixed;
    right: 20px;
    top: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(10, 14, 20, .82);
    pointer-events: auto;
  }
  #annotate .hint { color: var(--c, #E1F5FE); font: 12px/1.5 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif; }
  #annotate .done-btn {
    padding: 5px 16px;
    border: none;
    border-radius: 14px;
    background: #2E6BE6;
    color: #fff;
    font: 13px/1.6 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    cursor: pointer;
  }
  #annotate .done-btn:hover { background: #3B78F5; }
  #annotate .clear-btn {
    padding: 5px 12px;
    border: 1px solid rgba(255, 255, 255, .25);
    border-radius: 14px;
    background: transparent;
    color: #E1F5FE;
    font: 13px/1.6 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    cursor: pointer;
  }
  #annotate .clear-btn:hover { border-color: #FF5B4D; color: #FF5B4D; }
  #annotate .undo-btn {
    padding: 5px 12px;
    border: none;
    border-radius: 14px;
    background: rgba(255, 255, 255, .12);
    color: #E1F5FE;
    font: 13px/1.6 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    cursor: pointer;
  }
  #annotate .undo-btn:hover { background: rgba(255, 255, 255, .2); }
</style>
</head>
<body>
<img id="frame" alt="">
<div id="dim"></div>
<div id="cross-v" class="cross"></div>
<div id="cross-h" class="cross"></div>
<div id="selection"></div>
<div id="size"></div>
<div id="tip"><em>拖拽</em> 选择截图区域 · <em>双击 / 回车</em> 确认 · <em>Esc</em> 取消</div>
<div id="annotate">
  <div id="annotate-wrap">
    <img id="crop-img" alt="">
    <canvas id="annotate-canvas"></canvas>
  </div>
  <div class="panel">
    <span class="hint">拖拽画<em style="color:#FF5B4D">红框</em>强调 · 回车完成 · Esc 撤销框 / 重选</span>
    <button id="undo-btn" type="button" class="undo-btn">撤销</button>
    <button id="clear-btn" type="button" class="clear-btn">重选</button>
    <button id="done-btn" type="button" class="done-btn">完成</button>
  </div>
</div>
<script>
(() => {
  'use strict'
  const frameEl = document.getElementById('frame')
  const dimEl = document.getElementById('dim')
  const crossV = document.getElementById('cross-v')
  const crossH = document.getElementById('cross-h')
  const selectionEl = document.getElementById('selection')
  const sizeEl = document.getElementById('size')
  const tipEl = document.getElementById('tip')
  const annotateEl = document.getElementById('annotate')
  const annotateWrapEl = document.getElementById('annotate-wrap')
  const cropImgEl = document.getElementById('crop-img')
  const annotateCanvasEl = document.getElementById('annotate-canvas')
  const undoBtn = document.getElementById('undo-btn')
  const clearBtn = document.getElementById('clear-btn')
  const doneBtn = document.getElementById('done-btn')

  /** 主进程注入：{ dataUrl, logicalW, logicalH, physicalW, physicalH }。 */
  let frame = null
  /** 当前定格选区（逻辑像素，归一化后 x/y 非负）。 */
  let rect = null
  let selecting = false
  let start = null
  /** 本次按下是否已进入真实拖动（>4px 阈值，见 mousedown/mousemove）。 */
  let dragStarted = false

  // ---- 标注阶段状态 ----
  let mode = 'select' // 'select' | 'annotate'
  /** 框选确认后裁剪出的原图（物理像素 dataURL）。 */
  let crop = null
  /** 已完成的强调框（原图物理坐标）。 */
  let annoRects = []
  /** 正在画的强调框（原图物理坐标，画完移入 annoRects）。 */
  let annoDraft = null
  /** 标注视图映射：显示尺寸 → 原图物理尺寸。 */
  let viewScale = 1

  // 闲置超时：3 分钟无任何交互自动取消（防卡屏，框选+标注长思考不受影响）。
  // 统一在捕获阶段重置：鼠标/键盘/按钮点击都归一，无需逐 handler 埋点。
  let idleTimer = 0
  const IDLE_MS = 180_000
  const resetIdle = () => {
    window.clearTimeout(idleTimer)
    idleTimer = window.setTimeout(() => window.ssidCapture.cancel(), IDLE_MS)
  }
  for (const type of ['mousedown', 'mousemove', 'mouseup', 'dblclick', 'keydown']) {
    document.addEventListener(type, resetIdle, { capture: true })
  }
  resetIdle()

  window.__setFrame = (value) => {
    frame = value
    frameEl.src = value.dataUrl
  }

  const norm = (x1, y1, x2, y2) => ({
    x: Math.min(x1, x2), y: Math.min(y1, y2),
    w: Math.abs(x2 - x1), h: Math.abs(y2 - y1),
  })

  const renderSelection = () => {
    if (rect === null || rect.w < 1 || rect.h < 1) {
      selectionEl.style.display = 'none'
      sizeEl.style.display = 'none'
      return
    }
    selectionEl.style.display = 'block'
    selectionEl.style.left = `${rect.x}px`
    selectionEl.style.top = `${rect.y}px`
    selectionEl.style.width = `${rect.w}px`
    selectionEl.style.height = `${rect.h}px`
    sizeEl.style.display = 'block'
    sizeEl.textContent = `${Math.round(rect.w)} × ${Math.round(rect.h)}`
  }

  const renderCross = (clientX, clientY) => {
    if (selecting || rect !== null) {
      crossV.style.display = 'none'
      crossH.style.display = 'none'
      return
    }
    crossV.style.display = 'block'
    crossH.style.display = 'block'
    crossV.style.left = `${clientX}px`
    crossH.style.top = `${clientY}px`
  }

  const loadImage = (src) => new Promise((resolve, reject) => {
    const image = new Image()
    image.onload = () => resolve(image)
    image.onerror = () => reject(new Error('frame decode failed'))
    image.src = src
  })

  /** 逻辑选区 → 物理像素比例映射 → canvas 裁剪 → PNG data URL。 */
  const cropDataUrl = async () => {
    const scaleX = frame.physicalW / frame.logicalW
    const scaleY = frame.physicalH / frame.logicalH
    const sx = Math.max(0, Math.round(rect.x * scaleX))
    const sy = Math.max(0, Math.round(rect.y * scaleY))
    const sw = Math.min(frame.physicalW - sx, Math.max(1, Math.round(rect.w * scaleX)))
    const sh = Math.min(frame.physicalH - sy, Math.max(1, Math.round(rect.h * scaleY)))
    const image = await loadImage(frameEl.src)
    const canvas = document.createElement('canvas')
    canvas.width = sw
    canvas.height = sh
    canvas.getContext('2d').drawImage(image, sx, sy, sw, sh, 0, 0, sw, sh)
    return { dataUrl: canvas.toDataURL('image/png'), width: sw, height: sh }
  }

  // ---- 标注阶段 ----

  const enterAnnotate = async () => {
    if (frame === null || rect === null || rect.w < 2 || rect.h < 2) return
    crop = await cropDataUrl()
    annoRects = []
    annoDraft = null
    finished = false
    mode = 'annotate'
    // 冻结帧视图隐藏，标注视图显示。
    frameEl.style.display = 'none'
    dimEl.style.display = 'none'
    crossV.style.display = 'none'
    crossH.style.display = 'none'
    selectionEl.style.display = 'none'
    sizeEl.style.display = 'none'
    tipEl.style.display = 'none'
    const image = await loadImage(crop.dataUrl)
    // 缩放适配（≤ 92% 视口），保持长宽比。
    const availW = window.innerWidth * 0.92
    const availH = window.innerHeight * 0.92
    viewScale = Math.min(availW / crop.width, availH / crop.height, 1)
    const displayW = Math.max(1, Math.round(crop.width * viewScale))
    const displayH = Math.max(1, Math.round(crop.height * viewScale))
    cropImgEl.src = crop.dataUrl
    cropImgEl.style.width = `${displayW}px`
    cropImgEl.style.height = `${displayH}px`
    annotateWrapEl.style.display = 'block'
    annotateCanvasEl.width = displayW
    annotateCanvasEl.height = displayH
    annotateEl.style.display = 'flex'
    renderAnnotate()
  }

  /** 重绘标注 canvas（把 annoRects/annoDraft 画到显示坐标系）。 */
  const renderAnnotate = () => {
    const ctx = annotateCanvasEl.getContext('2d')
    ctx.clearRect(0, 0, annotateCanvasEl.width, annotateCanvasEl.height)
    const drawRect = (r) => {
      const x = r.x * viewScale
      const y = r.y * viewScale
      const w = r.w * viewScale
      const h = r.h * viewScale
      ctx.strokeStyle = '#FF5B4D'
      ctx.lineWidth = 2.5
      ctx.strokeRect(x, y, w, h)
      ctx.fillStyle = 'rgba(255, 91, 77, .12)'
      ctx.fillRect(x, y, w, h)
    }
    for (const r of annoRects) drawRect(r)
    if (annoDraft !== null) drawRect(annoDraft)
  }

  /** 完成：合成（原图 + 全部强调框）→ 交付。一次性守卫：Enter/双击/按钮
   *  可能并发触发（点击按钮后焦点在其上，回车会同时命中 keydown 与 click）。 */
  let finished = false
  const finishAnnotate = async () => {
    if (finished || crop === null) return
    finished = true
    const image = await loadImage(crop.dataUrl)
    const canvas = document.createElement('canvas')
    canvas.width = crop.width
    canvas.height = crop.height
    const ctx = canvas.getContext('2d')
    ctx.drawImage(image, 0, 0)
    ctx.strokeStyle = '#FF3B30'
    ctx.lineWidth = 3
    ctx.fillStyle = 'rgba(255, 59, 48, .12)'
    for (const r of annoRects) {
      ctx.strokeRect(r.x, r.y, r.w, r.h)
      ctx.fillRect(r.x, r.y, r.w, r.h)
    }
    window.ssidCapture.confirm(canvas.toDataURL('image/png'))
  }

  /** 返回框选（丢弃标注）。 */
  const backToSelect = () => {
    mode = 'select'
    crop = null
    annoRects = []
    annoDraft = null
    finished = false
    annotateEl.style.display = 'none'
    annotateWrapEl.style.display = 'none'
    frameEl.style.display = 'block'
    dimEl.style.display = 'block'
    tipEl.style.display = 'block'
    renderSelection()
  }

  // 右键 = 逐级回退（与 Esc 一致）：标注时撤销画框/当前框 → 无框回框选；
  // 框选时直接取消截图。屏蔽右键默认菜单。
  const cancelOrBack = () => {
    if (mode === 'annotate') {
      if (annoDraft !== null) {
        annoDraft = null
        renderAnnotate()
      } else if (annoRects.length > 0) {
        annoRects.pop()
        renderAnnotate()
      } else {
        backToSelect()
      }
      return
    }
    window.ssidCapture.cancel()
  }

  document.addEventListener('contextmenu', (event) => { event.preventDefault() })

  document.addEventListener('mousedown', (event) => {
    if (event.button === 2) {
      cancelOrBack()
      return
    }
    if (event.button !== 0) return
    if (mode === 'annotate') {
      // 标注内：仅点在裁剪图区域内才画框（换算回原图坐标）。
      const wrapRect = annotateWrapEl.getBoundingClientRect()
      const x = event.clientX - wrapRect.left
      const y = event.clientY - wrapRect.top
      if (x < 0 || y < 0 || x > wrapRect.width || y > wrapRect.height) return
      annoDraft = {
        x: 0,
        y: 0,
        w: 0,
        h: 0,
        originX: x / viewScale,
        originY: y / viewScale,
      }
      return
    }
    selecting = true
    start = { x: event.clientX, y: event.clientY }
    dragStarted = false
  })

  document.addEventListener('mousemove', (event) => {
    if (mode === 'annotate') {
      if (annoDraft !== null) {
        const wrapRect = annotateWrapEl.getBoundingClientRect()
        const x = (event.clientX - wrapRect.left) / viewScale
        const y = (event.clientY - wrapRect.top) / viewScale
        const draft = norm(annoDraft.originX, annoDraft.originY, x, y)
        annoDraft = { ...draft, originX: annoDraft.originX, originY: annoDraft.originY }
        renderAnnotate()
      }
      return
    }
    if (selecting && start !== null) {
      // 拖动超过阈值才开始新框选：纯点击（含双击序列的两次 mousedown）
      // 不销毁已定格的选区——否则双击确认永远拿不到 rect（2026-08-23 实测）。
      if (!dragStarted && Math.hypot(event.clientX - start.x, event.clientY - start.y) > 4) {
        dragStarted = true
        rect = null
      }
      if (dragStarted) {
        rect = norm(start.x, start.y, event.clientX, event.clientY)
        renderSelection()
      }
    } else {
      renderCross(event.clientX, event.clientY)
    }
  })

  document.addEventListener('mouseup', () => {
    if (mode === 'annotate') {
      if (annoDraft !== null) {
        if (annoDraft.w >= 4 && annoDraft.h >= 4) annoRects.push(annoDraft)
        annoDraft = null
        renderAnnotate()
      }
      return
    }
    if (!selecting) return
    selecting = false
    start = null
    dragStarted = false
    renderCross(0, 0)
  })

  undoBtn.addEventListener('click', () => {
    if (annoRects.length > 0) {
      annoRects.pop()
      renderAnnotate()
    }
  })
  clearBtn.addEventListener('click', () => { backToSelect() })
  doneBtn.addEventListener('click', () => { void finishAnnotate().catch((error) => { window.ssidCapture.error(String(error)) }) })

  document.addEventListener('dblclick', () => {
    if (mode === 'annotate') { void finishAnnotate().catch((error) => { window.ssidCapture.error(String(error)) }); return }
    void enterAnnotate().catch((error) => { window.ssidCapture.error(String(error)) })
  })
  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      cancelOrBack()
      return
    }
    if (event.key === 'Enter') {
      if (mode === 'annotate') { void finishAnnotate().catch((error) => { window.ssidCapture.error(String(error)) }); return }
      void enterAnnotate().catch((error) => { window.ssidCapture.error(String(error)) })
    }
  })
})()
</script>
</body>
</html>
