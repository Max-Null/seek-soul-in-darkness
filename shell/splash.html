<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>思灵</title>
<style>
  :root {
    --ssid-bg: #0A0E14;
    --ssid-accent: #4FC3F7;
    --ssid-text: #E1F5FE;
    --ssid-dim: #5C7A8F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ssid-bg);
    color: var(--ssid-text);
    font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    overflow: hidden;
  }
  /* ── 右上角关闭按钮：splash 无边框无系统按钮，必须自绘 ── */
  .close-btn {
    position: fixed;
    top: 0;
    right: 0;
    width: 52px;
    height: 36px;
    border: none;
    background: transparent;
    color: var(--ssid-dim);
    font-size: 16px;
    line-height: 36px;
    cursor: pointer;
    z-index: 10;
  }
  .close-btn:hover { background: #e81123; color: #fff; }
  /* ── 「取消更新」按钮：版本升级部署期间显示（主进程 __setCancelVisible） ── */
  .cancel-btn {
    display: inline-block;
    margin: 0 auto 14px;
    padding: 5px 18px;
    font-size: 12px;
    color: var(--ssid-dim);
    background: transparent;
    border: 1px solid rgba(79, 195, 247, .35);
    border-radius: 14px;
    cursor: pointer;
    letter-spacing: .08em;
    transition: all .2s ease;
  }
  .cancel-btn:hover { color: #ffb4ab; border-color: rgba(232, 17, 35, .6); }
  /* ── 启动/部署步骤清单（主进程 __setStepList 驱动；卡住时高亮行即卡点） ── */
  .steps {
    width: 320px;
    margin: 0 auto 18px;
    text-align: left;
    font-size: 12px;
    line-height: 2;
    letter-spacing: .03em;
  }
  .steps .step { color: var(--ssid-dim); }
  .steps .step::before { content: '· '; }
  .steps .step.done { color: var(--ssid-accent); }
  .steps .step.done::before { content: '✓ '; }
  .steps .step.current { color: var(--ssid-text); font-weight: 600; }
  .steps .step.current::before { content: '▸ '; }
  .splash { text-align: center; }
  /* ── 伪 3D Si 原子（fractal 移植，Canvas 数学投影）：
     460×460 物理像素 canvas，CSS 缩到 180px 显示；渲染逻辑见 script ── */
  .atom3d {
    width: 180px;
    height: 180px;
    margin: 0 auto 14px;
  }
  .atom3d canvas { display: block; width: 100%; height: 100%; }
  h1 {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    margin-bottom: 10px;
  }
  .en { font-size: 14px; letter-spacing: 0.18em; color: var(--ssid-dim); margin-bottom: 34px; }
  .slogan { font-size: 13px; letter-spacing: 0.12em; color: var(--ssid-dim); margin-bottom: 44px; }
  .status { font-size: 12px; color: var(--ssid-dim); margin-bottom: 14px; min-height: 16px; }
  .pct { font-size: 12px; color: var(--ssid-accent); letter-spacing: .08em; margin-bottom: 8px; }
  .bar {
    width: 220px;
    height: 3px;
    margin: 0 auto;
    background: rgba(79, 195, 247, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  /* 两种模式：determinate（JS 驱动真实进度）/ indeterminate（无限滑动兜底） */
  .bar .fill {
    height: 100%;
    width: 40%;
    background: var(--ssid-accent);
    border-radius: 2px;
    transition: width .4s ease;
  }
  .bar.determinate .fill { animation: none; }
  .bar.indeterminate .fill { animation: fill 2.2s ease-in-out infinite; }
  @keyframes fill {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(320%); }
  }
  /* ── 启动失败详情（默认隐藏，boot 异常时主进程注入） ── */
  .error-box {
    display: none;
    max-width: 560px;
    margin: 0 auto 14px;
  }
  .error-box.show { display: block; }
  .error {
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.7;
    text-align: left;
    color: #ffb4ab;
    background: rgba(232, 17, 35, .08);
    border: 1px solid rgba(232, 17, 35, .35);
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 240px;
    overflow-y: auto;
  }
</style>
</head>
<body>
  <button class="close-btn" title="关闭思灵" onclick="window.close()">✕</button>
  <div class="splash">
    <div class="atom3d" aria-hidden="true">
      <canvas id="atom-canvas" width="460" height="460"></canvas>
    </div>
    <h1>思 灵</h1>
    <div class="en">Seek Soul in Darkness</div>
    <div class="slogan">于黑暗中，探寻灵魂。</div>
    <div class="steps" id="steps"></div>
    <div class="status">正在唤醒硅基生命…</div>
    <button id="cancel-update" class="cancel-btn" hidden onclick="window.__cancelRequested = true">取消更新</button>
    <div class="error-box" id="boot-error-box">
      <div class="error" id="boot-error"></div>
    </div>
    <div class="pct" id="pct"></div>
    <div class="bar indeterminate"><div class="fill"></div></div>
  </div>
  <script>
    // ── 伪 3D Si 原子（fractal LoadingScreen 移植，2026-08-17）────────────
    // 数学投影而非 CSS 3D：CSS 平面圆在 3D 里会被压扁（fractal 2026-08-09
    // 实测教训），Canvas 画径向渐变球体 + 旋转矩阵投影（近大远小）+
    // z 分层遮挡（后段电子→核→前段电子→轨道前段），任意角度都是圆。
    const ATOM_W = 460
    const ATOM_CX = 230
    const ATOM_CY = 230
    const ATOM_ROT_X = Math.PI * 0.42 // 俯视角（轨道椭圆开口）
    const ATOM_PERSP = 560 // 透视距离
    const ATOM_WOBBLE_AMP = 0.16 // 整体摇摆 ±9.2°
    // 轨道：r 半径 / tiltY 主轴（绕 Y 0/120/240°）/ speed 公转 / n 电子数 / phase 起始角
    const ATOM_ORBITS = [
      { r: 140, tiltY: 0, speed: 0.5, n: 4, phase: 0 },
      { r: 110, tiltY: 2.094, speed: 0.9, n: 8, phase: 0.4 },
      { r: 73, tiltY: 4.189, speed: 1.95, n: 2, phase: 1.2 },
    ]
    const ATOM_NUCLEUS_R = 32
    const ATOM_PUPIL_R = 14
    function atomOrbitPoint(r, tiltY, theta) {
      // 轨道圆在 XY 平面，绕 Y 轴 tiltY 旋转（主轴朝向）→ 3D 坐标
      const x = r * Math.cos(theta)
      const y = r * Math.sin(theta)
      return [x * Math.cos(tiltY), y, -x * Math.sin(tiltY)]
    }
    function atomProject(p, wobble) {
      // 绕 Y（摇摆）→ 绕 X（俯视）→ 透视除法（近大远小）
      const [x, y, z] = p
      const x1 = x * Math.cos(wobble) + z * Math.sin(wobble)
      const z1 = -x * Math.sin(wobble) + z * Math.cos(wobble)
      const y1 = y * Math.cos(ATOM_ROT_X) - z1 * Math.sin(ATOM_ROT_X)
      const z2 = y * Math.sin(ATOM_ROT_X) + z1 * Math.cos(ATOM_ROT_X)
      const scale = ATOM_PERSP / (ATOM_PERSP + z2)
      return { x: ATOM_CX + x1 * scale, y: ATOM_CY + y1 * scale, z: z2, s: scale }
    }
    // 轨道分段绘制（z<=0 后段 / z>0 前段）——核夹在中间形成前后遮挡
    function atomDrawOrbit(ctx, o, wobble, alpha, back) {
      ctx.beginPath()
      ctx.strokeStyle = `rgba(125, 211, 252, ${alpha * (back ? 0.75 : 1)})`
      ctx.lineWidth = 1.6
      let started = false
      for (let i = 0; i <= 72; i++) {
        const pr = atomProject(atomOrbitPoint(o.r, o.tiltY, (i / 72) * Math.PI * 2), wobble)
        const match = back ? pr.z <= 0 : pr.z > 0
        if (match) {
          if (!started) { ctx.moveTo(pr.x, pr.y); started = true }
          else ctx.lineTo(pr.x, pr.y)
        } else started = false
      }
      ctx.stroke()
    }
    // 电子球体（径向渐变 + 辉光，大小 × 投影 scale = 近大远小）
    function atomDrawElectron(ctx, o, pr) {
      const r = (o.r > 90 ? 5.5 : 6.5) * pr.s
      const g = ctx.createRadialGradient(pr.x - r * 0.35, pr.y - r * 0.35, r * 0.15, pr.x, pr.y, r)
      g.addColorStop(0, '#7dd3fc')
      g.addColorStop(0.55, '#0ea5e9')
      g.addColorStop(1, '#075985')
      ctx.beginPath(); ctx.arc(pr.x, pr.y, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill()
      ctx.beginPath(); ctx.arc(pr.x, pr.y, r * 2.1, 0, Math.PI * 2)
      ctx.fillStyle = `rgba(14, 165, 233, ${0.22 * pr.s})`; ctx.fill()
    }
    // 核（眼睛）：虹膜 + 瞳孔环顾 + 高光固定 + 辉光呼吸
    function atomDrawNucleus(ctx, s) {
      const glow = 0.5 + 0.5 * Math.sin(s * 2.4)
      const gg = ctx.createRadialGradient(ATOM_CX, ATOM_CY, ATOM_NUCLEUS_R * 0.4, ATOM_CX, ATOM_CY, ATOM_NUCLEUS_R * 2.2)
      gg.addColorStop(0, `rgba(14, 165, 233, ${0.38 * glow})`)
      gg.addColorStop(1, 'rgba(14, 165, 233, 0)')
      ctx.beginPath(); ctx.arc(ATOM_CX, ATOM_CY, ATOM_NUCLEUS_R * 2.2, 0, Math.PI * 2); ctx.fillStyle = gg; ctx.fill()
      const ig = ctx.createRadialGradient(ATOM_CX - 8, ATOM_CY - 9, 3, ATOM_CX, ATOM_CY, ATOM_NUCLEUS_R)
      ig.addColorStop(0, '#0b4a75'); ig.addColorStop(0.55, '#0369a1'); ig.addColorStop(1, '#075985')
      ctx.beginPath(); ctx.arc(ATOM_CX, ATOM_CY, ATOM_NUCLEUS_R, 0, Math.PI * 2); ctx.fillStyle = ig; ctx.fill()
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)'; ctx.lineWidth = 1; ctx.stroke()
      // 瞳孔环顾（sin/cos 不同频率组合 = 到处看）
      const px = ATOM_CX + Math.sin(s * 0.9) * 9
      const py = ATOM_CY + Math.cos(s * 1.3) * 9
      const pg = ctx.createRadialGradient(px - 3, py - 3, 2, px, py, ATOM_PUPIL_R)
      pg.addColorStop(0, '#38bdf8'); pg.addColorStop(0.6, '#0ea5e9'); pg.addColorStop(1, '#0284c7')
      ctx.beginPath(); ctx.arc(px, py, ATOM_PUPIL_R, 0, Math.PI * 2); ctx.fillStyle = pg; ctx.fill()
      // 高光固定（光源不动）
      ctx.beginPath(); ctx.arc(ATOM_CX - 11, ATOM_CY - 11, 4.5, 0, Math.PI * 2)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)'; ctx.fill()
      ctx.beginPath(); ctx.arc(ATOM_CX - 11, ATOM_CY - 11, 7, 0, Math.PI * 2)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.18)'; ctx.fill()
    }
    // 底座：与核辉光同步闪烁
    function atomDrawBase(ctx, s) {
      const glow = 0.5 + 0.5 * Math.sin(s * 2.4)
      const g = ctx.createRadialGradient(ATOM_CX, ATOM_CY + 155, 5, ATOM_CX, ATOM_CY + 155, 90)
      g.addColorStop(0, `rgba(56, 189, 248, ${0.14 * (0.6 + 0.4 * glow)})`)
      g.addColorStop(1, 'rgba(56, 189, 248, 0)')
      ctx.beginPath(); ctx.ellipse(ATOM_CX, ATOM_CY + 155, 90, 18, 0, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill()
    }
    function atomFrame(ctx, s) {
      ctx.clearRect(0, 0, ATOM_W, ATOM_W)
      const wobble = Math.sin(s * 0.52) * ATOM_WOBBLE_AMP
      const glow = 0.5 + 0.5 * Math.sin(s * 2.4)
      const orbitAlpha = 0.3 + 0.3 * glow
      atomDrawBase(ctx, s)
      const backE = []
      const frontE = []
      for (const o of ATOM_ORBITS) {
        atomDrawOrbit(ctx, o, wobble, orbitAlpha, true)
        for (let i = 0; i < o.n; i++) {
          const pr = atomProject(atomOrbitPoint(o.r, o.tiltY, o.phase + s * o.speed + (i / o.n) * Math.PI * 2), wobble)
          ;(pr.z <= 0 ? backE : frontE).push({ o, pr })
        }
      }
      for (const e of backE) atomDrawElectron(ctx, e.o, e.pr) // 后段电子（核下）
      atomDrawNucleus(ctx, s) // 核
      for (const e of frontE) atomDrawElectron(ctx, e.o, e.pr) // 前段电子（核上）
      for (const o of ATOM_ORBITS) atomDrawOrbit(ctx, o, wobble, orbitAlpha, false) // 轨道前段
    }
    ;(() => {
      const canvas = document.getElementById('atom-canvas')
      if (!canvas) return
      const ctx = canvas.getContext('2d')
      if (!ctx) return
      // 不 scale：坐标系保持 460×460 物理像素，CSS width:100% 缩放显示
      // （scale 会把坐标系压成 0..230，原子画到右下角——fractal 实测教训）
      const start = performance.now()
      const loop = (now) => { atomFrame(ctx, (now - start) / 1000); requestAnimationFrame(loop) }
      requestAnimationFrame(loop)
    })()
    // 主进程通过 executeJavaScript 驱动：切到确定进度模式并设置百分比。
    // 进度来源是 pnpm ndjson 的近似值（pnpm 无总进度），见 main.mjs。
    window.__setProgress = (pct, text) => {
      const bar = document.querySelector('.bar')
      const fill = document.querySelector('.bar .fill')
      const pctEl = document.getElementById('pct')
      if (bar) { bar.classList.add('determinate'); bar.classList.remove('indeterminate') }
      if (fill) fill.style.width = Math.min(100, Math.max(0, pct)) + '%'
      if (pctEl) pctEl.textContent = pct + '%'
      if (text !== undefined && text !== null) {
        const status = document.querySelector('.status')
        if (status) status.textContent = text
      }
    }
    // 显示启动失败详情（boot 异常时主进程注入）。
    // 「复制错误信息」复用「取消更新」按钮（同一元素、同一 cancel-btn 样式）：
    // 错误出现时按钮切换为复制功能（错误文本不可选中，Electron 默认无文本
    // 选择，用户反馈无法复制只能 OCR），点击写入剪贴板并短暂变绿。
    const cancelBtn = document.getElementById('cancel-update')
    window.__showError = (text) => {
      const el = document.getElementById('boot-error')
      const box = document.getElementById('boot-error-box')
      if (el) el.textContent = text
      if (box) box.classList.add('show')
      if (cancelBtn) {
        cancelBtn.textContent = '复制错误信息'
        cancelBtn.hidden = false
        cancelBtn.onclick = async () => {
          if (!el || el.textContent === '') return
          try {
            await navigator.clipboard.writeText(el.textContent)
          } catch {
            // clipboard API 在非安全上下文可能不可用：回退 execCommand。
            const ta = document.createElement('textarea')
            ta.value = el.textContent
            ta.style.position = 'fixed'
            ta.style.opacity = '0'
            document.body.appendChild(ta)
            ta.select()
            document.execCommand('copy')
            ta.remove()
          }
          cancelBtn.textContent = '已复制 ✓'
          setTimeout(() => { cancelBtn.textContent = '复制错误信息' }, 1600)
        }
      }
    }
    // 「取消更新」：版本升级部署期间由主进程显示；点击后主进程 pollCancel
    // 轮询到 __cancelRequested 即中止部署（旧版无损，下次启动再检测）。
    // 注意：__showError 会接管本按钮为复制功能，两者不会同时出现（错误即
    // 终止流程，部署取消只发生在部署进行中）。
    // 步骤清单：items 为文案数组，current 为当前执行下标（完成项打勾、
    // 当前项高亮、未到项变暗）。主进程在启动/部署各节点更新，卡住时
    // 高亮行即卡点，便于反馈定位。
    window.__setStepList = (items, current) => {
      const el = document.getElementById('steps')
      if (!el) return
      el.innerHTML = ''
      items.forEach((text, i) => {
        const div = document.createElement('div')
        div.className = 'step ' + (i < current ? 'done' : i === current ? 'current' : 'pending')
        div.textContent = text
        el.appendChild(div)
      })
    }
    // 「取消更新」：版本升级部署期间由主进程显示；点击后主进程 pollCancel
    // 轮询到 __cancelRequested 即中止部署（旧版无损，下次启动再检测）。
    window.__cancelRequested = false
    window.__setCancelVisible = (visible) => {
      const btn = document.getElementById('cancel-update')
      if (btn) btn.hidden = !visible
    }
  </script>
</body>
</html>
