<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>思灵</title>
<style>
  :root {
    --ssid-bg: #0A0E14;
    --ssid-accent: #4FC3F7;
    --ssid-text: #E1F5FE;
    --ssid-dim: #5C7A8F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ssid-bg);
    color: var(--ssid-text);
    font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    overflow: hidden;
  }
  .splash { text-align: center; }
  /* 微光剪影：瞳孔环 + 呼吸光晕 */
  .glow {
    width: 96px;
    height: 96px;
    margin: 0 auto 28px;
    position: relative;
    animation: breathe 3.2s ease-in-out infinite;
  }
  .glow .ring {
    position: absolute;
    inset: 0;
    border: 6px solid var(--ssid-accent);
    border-radius: 50%;
    box-shadow: 0 0 24px rgba(79, 195, 247, 0.55), inset 0 0 24px rgba(79, 195, 247, 0.25);
  }
  .glow .pupil {
    position: absolute;
    inset: 22px;
    background: #07131F;
    border-radius: 50%;
  }
  .glow .spark {
    position: absolute;
    top: 30px;
    left: 34px;
    width: 12px;
    height: 12px;
    background: var(--ssid-text);
    border-radius: 50%;
    animation: spark 3.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.06); opacity: 0.85; }
  }
  @keyframes spark {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 0.35; }
  }
  h1 {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    margin-bottom: 10px;
  }
  .en { font-size: 14px; letter-spacing: 0.18em; color: var(--ssid-dim); margin-bottom: 34px; }
  .slogan { font-size: 13px; letter-spacing: 0.12em; color: var(--ssid-dim); margin-bottom: 44px; }
  .status { font-size: 12px; color: var(--ssid-dim); margin-bottom: 14px; }
  .bar {
    width: 220px;
    height: 3px;
    margin: 0 auto;
    background: rgba(79, 195, 247, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .bar .fill {
    height: 100%;
    width: 40%;
    background: var(--ssid-accent);
    border-radius: 2px;
    animation: fill 2.2s ease-in-out infinite;
  }
  @keyframes fill {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(320%); }
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="glow">
      <div class="ring"></div>
      <div class="pupil"></div>
      <div class="spark"></div>
    </div>
    <h1>思 灵</h1>
    <div class="en">Seek Soul in Darkness</div>
    <div class="slogan">于黑暗中，探寻灵魂。</div>
    <div class="status">正在唤醒硅基生命…</div>
    <div class="bar"><div class="fill"></div></div>
  </div>
</body>
</html>
