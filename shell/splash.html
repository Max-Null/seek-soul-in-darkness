<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>思灵</title>
<style>
  :root {
    --ssid-bg: #0A0E14;
    --ssid-accent: #4FC3F7;
    --ssid-text: #E1F5FE;
    --ssid-dim: #5C7A8F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ssid-bg);
    color: var(--ssid-text);
    font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    overflow: hidden;
  }
  /* ── 右上角关闭按钮：splash 无边框无系统按钮，必须自绘 ── */
  .close-btn {
    position: fixed;
    top: 0;
    right: 0;
    width: 52px;
    height: 36px;
    border: none;
    background: transparent;
    color: var(--ssid-dim);
    font-size: 16px;
    line-height: 36px;
    cursor: pointer;
    z-index: 10;
  }
  .close-btn:hover { background: #e81123; color: #fff; }
  /* ── 「取消更新」按钮：版本升级部署期间显示（主进程 __setCancelVisible） ── */
  .cancel-btn {
    display: inline-block;
    margin: 0 auto 14px;
    padding: 5px 18px;
    font-size: 12px;
    color: var(--ssid-dim);
    background: transparent;
    border: 1px solid rgba(79, 195, 247, .35);
    border-radius: 14px;
    cursor: pointer;
    letter-spacing: .08em;
    transition: all .2s ease;
  }
  .cancel-btn:hover { color: #ffb4ab; border-color: rgba(232, 17, 35, .6); }
  /* ── 启动/部署步骤清单（主进程 __setStepList 驱动；卡住时高亮行即卡点） ── */
  .steps {
    width: 320px;
    margin: 0 auto 18px;
    text-align: left;
    font-size: 12px;
    line-height: 2;
    letter-spacing: .03em;
  }
  .steps .step { color: var(--ssid-dim); }
  .steps .step::before { content: '· '; }
  .steps .step.done { color: var(--ssid-accent); }
  .steps .step.done::before { content: '✓ '; }
  .steps .step.current { color: var(--ssid-text); font-weight: 600; }
  .steps .step.current::before { content: '▸ '; }
  .splash { text-align: center; }
  /* 分形同款 logo（Si 原子轨道 + 瞳孔）：外轨道缓转，瞳孔呼吸凝视，
     光晕呼吸让「硅基生命」活起来 */
  .glow {
    width: 104px;
    height: 104px;
    margin: 0 auto 28px;
    position: relative;
    animation: halo 3.2s ease-in-out infinite;
  }
  .glow svg { width: 100%; height: 100%; display: block; }
  .glow .orbit { animation: orbit 14s linear infinite; transform-box: fill-box; transform-origin: center; }
  .glow .pupil-g {
    animation: gaze 3.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes halo {
    0%, 100% { filter: drop-shadow(0 0 14px rgba(79, 195, 247, .35)); }
    50% { filter: drop-shadow(0 0 26px rgba(79, 195, 247, .65)); }
  }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes gaze {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 1; }
    25% { transform: translate(1.5px, -1px) scale(.97); opacity: .92; }
    50% { transform: translate(0, 0) scale(.93); opacity: .85; }
    75% { transform: translate(-1.5px, 1px) scale(.97); opacity: .92; }
  }
  h1 {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    margin-bottom: 10px;
  }
  .en { font-size: 14px; letter-spacing: 0.18em; color: var(--ssid-dim); margin-bottom: 34px; }
  .slogan { font-size: 13px; letter-spacing: 0.12em; color: var(--ssid-dim); margin-bottom: 44px; }
  .status { font-size: 12px; color: var(--ssid-dim); margin-bottom: 14px; min-height: 16px; }
  .pct { font-size: 12px; color: var(--ssid-accent); letter-spacing: .08em; margin-bottom: 8px; }
  .bar {
    width: 220px;
    height: 3px;
    margin: 0 auto;
    background: rgba(79, 195, 247, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  /* 两种模式：determinate（JS 驱动真实进度）/ indeterminate（无限滑动兜底） */
  .bar .fill {
    height: 100%;
    width: 40%;
    background: var(--ssid-accent);
    border-radius: 2px;
    transition: width .4s ease;
  }
  .bar.determinate .fill { animation: none; }
  .bar.indeterminate .fill { animation: fill 2.2s ease-in-out infinite; }
  @keyframes fill {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(320%); }
  }
  /* ── 启动失败详情（默认隐藏，boot 异常时主进程注入） ── */
  .error {
    display: none;
    max-width: 560px;
    margin: 0 auto 14px;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.7;
    text-align: left;
    color: #ffb4ab;
    background: rgba(232, 17, 35, .08);
    border: 1px solid rgba(232, 17, 35, .35);
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .error.show { display: block; }
</style>
</head>
<body>
  <button class="close-btn" title="关闭思灵" onclick="window.close()">✕</button>
  <div class="splash">
    <div class="glow">
      <svg viewBox="0 0 256 256">
        <g class="orbit" fill="none" stroke="#4FC3F7">
          <circle cx="128" cy="128" r="52" stroke-width="2" opacity="0.45" />
          <circle cx="128" cy="128" r="80" stroke-width="2" opacity="0.35" />
          <circle cx="128" cy="128" r="106" stroke-width="2" opacity="0.28" />
          <circle cx="128" cy="180" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.9" />
          <circle cx="128" cy="76" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.9" />
          <circle cx="208" cy="128" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
          <circle cx="184.6" cy="184.6" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
          <circle cx="128" cy="208" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
          <circle cx="71.4" cy="184.6" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
          <circle cx="48" cy="128" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
          <circle cx="71.4" cy="71.4" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
          <circle cx="128" cy="48" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
          <circle cx="184.6" cy="71.4" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
          <circle cx="203" cy="203" r="4" fill="#4FC3F7" stroke="none" opacity="0.9" />
          <circle cx="53" cy="203" r="4" fill="#4FC3F7" stroke="none" opacity="0.9" />
          <circle cx="53" cy="53" r="4" fill="#4FC3F7" stroke="none" opacity="0.9" />
          <circle cx="203" cy="53" r="4" fill="#4FC3F7" stroke="none" opacity="0.9" />
        </g>
        <g class="pupil-g">
          <circle cx="128" cy="128" r="38" fill="#0B5E84" />
          <circle cx="128" cy="128" r="27" fill="#4FC3F7" />
          <circle cx="128" cy="128" r="13" fill="#0B1220" />
          <circle cx="119" cy="118" r="7" fill="#fff" opacity="0.9" />
          <circle cx="139" cy="135" r="3" fill="#fff" opacity="0.5" />
        </g>
      </svg>
    </div>
    <h1>思 灵</h1>
    <div class="en">Seek Soul in Darkness</div>
    <div class="slogan">于黑暗中，探寻灵魂。</div>
    <div class="steps" id="steps"></div>
    <div class="status">正在唤醒硅基生命…</div>
    <button id="cancel-update" class="cancel-btn" hidden onclick="window.__cancelRequested = true">取消更新</button>
    <div class="error" id="boot-error"></div>
    <div class="pct" id="pct"></div>
    <div class="bar indeterminate"><div class="fill"></div></div>
  </div>
  <script>
    // 主进程通过 executeJavaScript 驱动：切到确定进度模式并设置百分比。
    // 进度来源是 pnpm ndjson 的近似值（pnpm 无总进度），见 main.mjs。
    window.__setProgress = (pct, text) => {
      const bar = document.querySelector('.bar')
      const fill = document.querySelector('.bar .fill')
      const pctEl = document.getElementById('pct')
      if (bar) { bar.classList.add('determinate'); bar.classList.remove('indeterminate') }
      if (fill) fill.style.width = Math.min(100, Math.max(0, pct)) + '%'
      if (pctEl) pctEl.textContent = pct + '%'
      if (text !== undefined && text !== null) {
        const status = document.querySelector('.status')
        if (status) status.textContent = text
      }
    }
    // 显示启动失败详情（boot 异常时主进程注入）。
    window.__showError = (text) => {
      const el = document.getElementById('boot-error')
      if (el) { el.textContent = text; el.classList.add('show') }
    }
    // 步骤清单：items 为文案数组，current 为当前执行下标（完成项打勾、
    // 当前项高亮、未到项变暗）。主进程在启动/部署各节点更新，卡住时
    // 高亮行即卡点，便于反馈定位。
    window.__setStepList = (items, current) => {
      const el = document.getElementById('steps')
      if (!el) return
      el.innerHTML = ''
      items.forEach((text, i) => {
        const div = document.createElement('div')
        div.className = 'step ' + (i < current ? 'done' : i === current ? 'current' : 'pending')
        div.textContent = text
        el.appendChild(div)
      })
    }
    // 「取消更新」：版本升级部署期间由主进程显示；点击后主进程 pollCancel
    // 轮询到 __cancelRequested 即中止部署（旧版无损，下次启动再检测）。
    window.__cancelRequested = false
    window.__setCancelVisible = (visible) => {
      const btn = document.getElementById('cancel-update')
      if (btn) btn.hidden = !visible
    }
  </script>
</body>
</html>
