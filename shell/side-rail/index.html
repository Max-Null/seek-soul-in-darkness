<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>记忆</title>
  <style>
    /* SSiD 品牌：主色 #0A0E14，强调 #4FC3F7（Si 瞳孔蓝）。 */
    :root {
      --bg: #0a0e14;
      --panel: #0f141d;
      --card: #131a26;
      --border: #1e2836;
      --border-hover: #2c3a4d;
      --fg: #d8e0ea;
      --muted: #67748a;
      --accent: #4fc3f7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); }

    .rail { display: flex; flex-direction: column; height: 100vh; }

    /* ── header ── */
    header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
    .title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .title-row h1 { margin: 0; flex: 1; font-size: 14px; font-weight: 600; letter-spacing: .5px; }
    .title-row h1 .dot { color: var(--accent); }
    #toggle {
      flex: none; width: 26px; height: 26px; padding: 0;
      background: none; border: 1px solid var(--border); border-radius: 50%;
      color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1;
      transition: border-color .15s, color .15s;
    }
    #toggle:hover { border-color: var(--accent); color: var(--accent); }
    #query {
      width: 100%; padding: 7px 12px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      color: var(--fg); font-size: 13px; outline: none;
      transition: border-color .15s;
    }
    #query::placeholder { color: var(--muted); }
    #query:focus { border-color: var(--accent); }

    /* ── tabs ── */
    .tabs { display: flex; gap: 4px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
    .tabs button {
      flex: 1; padding: 5px 0; font-size: 12px;
      background: none; border: 1px solid transparent; border-radius: 7px;
      color: var(--muted); cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
    }
    .tabs button:hover { color: var(--fg); }
    .tabs button.active { color: var(--accent); border-color: var(--accent); background: rgba(79, 195, 247, .08); }

    /* ── list ── */
    ul { list-style: none; margin: 0; padding: 12px 16px; overflow-y: auto; flex: 1; }
    li { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; margin-bottom: 9px; }
    li:hover { border-color: var(--border-hover); }
    li .content { font-size: 13px; line-height: 1.55; }
    li .meta { margin-top: 7px; font-size: 11px; color: var(--muted); display: flex; gap: 10px; }
    li .meta .ns { color: var(--accent); }
    li .actions { margin-top: 9px; display: flex; gap: 6px; }
    li .actions button {
      padding: 3px 12px; font-size: 12px;
      background: none; border: 1px solid var(--border); border-radius: 6px;
      color: var(--fg); cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    li .actions button:hover { border-color: var(--accent); color: var(--accent); }

    .empty { padding: 32px 14px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ── 面板切换 ── */
    .panel-nav { display: flex; gap: 4px; padding: 8px 16px 0; }
    .panel-nav button {
      flex: 1; padding: 5px 0; font-size: 12px;
      background: none; border: 1px solid transparent; border-radius: 7px;
      color: var(--muted); cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
    }
    .panel-nav button:hover { color: var(--fg); }
    .panel-nav button.active { color: var(--accent); border-color: var(--accent); background: rgba(79, 195, 247, .08); }
    .panel { display: none; flex-direction: column; flex: 1; min-height: 0; }
    .panel.active { display: flex; }

    /* ── 状态面板 ── */
    .state-list { display: flex; flex-direction: column; gap: 9px; padding: 12px 16px; overflow-y: auto; flex: 1; }
    .state-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; }
    .state-card h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .state-card .big { font-size: 22px; font-weight: 700; }
    .state-card .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .level-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); }
    .level-0 { color: var(--muted); }
    .level-1 { color: #f7c94f; border-color: #f7c94f55; }
    .level-2 { color: #f7a14f; border-color: #f7a14f55; }
    .level-3 { color: #f76f4f; border-color: #f76f4f55; }
    .state-card.warn { border-color: #f7a14f66; }
    .review-item { font-size: 12px; padding: 3px 0; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .review-item span { color: var(--muted); margin-right: 6px; }

    /* ── 收起形态：36px 竖窄条 ── */
    body.collapsed header { padding: 12px 0 0; border-bottom: none; }
    body.collapsed .title-row { flex-direction: column; gap: 6px; }
    body.collapsed .title-row h1 { writing-mode: vertical-rl; font-size: 13px; letter-spacing: 4px; }
    body.collapsed .search-row, body.collapsed .panel-nav, body.collapsed .tabs, body.collapsed ul { display: none; }
  </style>
</head>
<body>
  <div class="rail">
    <header>
      <div class="title-row">
        <h1>🧠 记<span class="dot">忆</span></h1>
        <button id="toggle" title="收起/展开">»</button>
      </div>
      <div class="search-row">
        <input id="query" placeholder="搜索记忆…" />
      </div>
    </header>
    <div class="panel-nav">
      <button data-panel="memory" class="active">记忆</button>
      <button data-panel="state">状态</button>
      <button data-panel="habit">习惯</button>
    </div>
    <div id="panel-memory" class="panel active">
      <div class="tabs">
        <button data-status="auto" class="active">auto</button>
        <button data-status="suggested">suggested</button>
        <button data-status="suggest">suggest</button>
      </div>
      <ul id="list"></ul>
    </div>
    <div id="panel-state" class="panel">
      <div class="state-list" id="state-list"></div>
    </div>
    <div id="panel-habit" class="panel">
      <div class="state-list" id="habit-list"></div>
    </div>
  </div>
  <script src="./memory-panel.js"></script>
  <script src="./state-panel.js"></script>
  <script src="./habit-panel.js"></script>
</body>
</html>
