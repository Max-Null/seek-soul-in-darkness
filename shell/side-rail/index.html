<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>思灵</title>
  <style>
    /* SSiD 品牌：主色 #0A0E14，强调 #4FC3F7（Si 瞳孔蓝）。 */
    :root {
      --bg: #0a0e14;
      --panel: #0f141d;
      --card: #131a26;
      --border: #1e2836;
      --border-hover: #2c3a4d;
      --fg: #d8e0ea;
      --muted: #67748a;
      --accent: #4fc3f7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); overflow: hidden; }

    .rail { display: flex; flex-direction: column; height: 100vh; }

    /* ── header：点击标题/logo 收起侧栏；展开显名，收起显 logo ── */
    header { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .title-row { display: flex; align-items: center; justify-content: center; gap: 9px; }
    .title-row h1 { margin: 0; flex: 1; font-size: 15px; font-weight: 600; letter-spacing: .5px; }
    /* 分形同款 logo（Si 原子轨道 + 瞳孔，SSiD 品牌色）：默认隐藏，收起态显示 */
    .logo {
      display: none; width: 22px; height: 22px;
      filter: drop-shadow(0 0 6px rgba(79, 195, 247, .45));
    }
    .logo .orbit { animation: logo-orbit 14s linear infinite; transform-box: fill-box; transform-origin: center; }
    .logo .pupil-g { animation: logo-breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes logo-orbit { to { transform: rotate(360deg); } }
    @keyframes logo-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(.93); } }

    /* ── 主体：左侧竖排导航 + 内容区 ── */
    .rail-body { display: flex; flex: 1; min-height: 0; }
    .nav {
      flex: none; width: 52px;
      display: flex; flex-direction: column; gap: 3px;
      padding: 8px 5px; border-right: 1px solid var(--border);
    }
    .nav button {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 7px 0; background: none; border: 1px solid transparent; border-radius: 8px;
      color: var(--muted); cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
    }
    .nav button:hover { color: var(--fg); }
    .nav button.active { color: var(--accent); border-color: var(--accent); background: rgba(79, 195, 247, .08); }
    .nav-icon { flex: none; width: 17px; height: 17px; }
    .nav-label { font-size: 10px; line-height: 1; }
    .content { flex: 1; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    .panel { display: none; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    .panel.active { display: flex; }

    /* ── 记忆面板 ── */
    .search-row { padding: 10px 12px 6px; }
    #query {
      width: 100%; padding: 7px 12px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      color: var(--fg); font-size: 13px; outline: none;
      transition: border-color .15s;
    }
    #query::placeholder { color: var(--muted); }
    #query:focus { border-color: var(--accent); }
    .tabs { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .tabs button {
      flex: 1; padding: 4px 0; font-size: 11px;
      background: none; border: 1px solid transparent; border-radius: 7px;
      color: var(--muted); cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
    }
    .tabs button:hover { color: var(--fg); }
    .tabs button.active { color: var(--accent); border-color: var(--accent); background: rgba(79, 195, 247, .08); }

    /* ── 通用列表 ── */
    ul { list-style: none; margin: 0; padding: 12px; overflow-y: auto; flex: 1; }
    li { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; margin-bottom: 9px; }
    li:hover { border-color: var(--border-hover); }
    li .content { font-size: 13px; line-height: 1.55; display: block; }
    li .meta { margin-top: 7px; font-size: 11px; color: var(--muted); display: flex; gap: 10px; }
    li .meta .ns { color: var(--accent); }
    li .actions { margin-top: 9px; display: flex; gap: 6px; }
    li .actions button {
      padding: 3px 12px; font-size: 12px;
      background: none; border: 1px solid var(--border); border-radius: 6px;
      color: var(--fg); cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    li .actions button:hover { border-color: var(--accent); color: var(--accent); }

    .empty { padding: 32px 14px; text-align: center; color: var(--muted); font-size: 13px; }

    /* ── 状态/习惯/余额通用卡片 ── */
    .state-list { display: flex; flex-direction: column; gap: 9px; padding: 12px; overflow-y: auto; flex: 1; }
    .state-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; }
    .state-card h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .state-card .big { font-size: 22px; font-weight: 700; }
    .state-card .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .level-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); }
    .level-0 { color: var(--muted); }
    .level-1 { color: #f7c94f; border-color: #f7c94f55; }
    .level-2 { color: #f7a14f; border-color: #f7a14f55; }
    .level-3 { color: #f76f4f; border-color: #f76f4f55; }
    .state-card.warn { border-color: #f7a14f66; }
    .review-item { font-size: 12px; padding: 3px 0; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .review-item span { color: var(--muted); margin-right: 6px; }

    /* ── 文件面板 ── */
    .files-toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px 0; }
    .files-toolbar + .files-toolbar { padding-top: 6px; }
    .files-toolbar .files-action { flex: 1; text-align: center; }
    .files-toolbar .files-action.active { color: var(--accent); border-color: var(--accent); background: rgba(79, 195, 247, .08); }
    #workspace-select {
      flex: 1; min-width: 0; padding: 4px 8px; font-size: 12px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
      color: var(--fg); outline: none;
    }
    .tree-node { user-select: none; }
    .tree-row {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 8px; border-radius: 6px; cursor: pointer;
      font-size: 12.5px; color: var(--fg);
      white-space: nowrap;
    }
    .tree-row:hover { background: var(--panel); }
    .tree-row .tree-icon { flex: none; width: 14px; height: 14px; color: var(--muted); }
    .tree-row.dir .tree-icon { color: var(--accent); opacity: .8; }
    .tree-row .tree-arrow { flex: none; width: 12px; height: 12px; color: var(--muted); transition: transform .12s; }
    .tree-row.open .tree-arrow { transform: rotate(90deg); }
    .tree-row .tree-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .tree-children { overflow: hidden; }
    .tree-note { font-size: 11px; color: var(--muted); padding: 2px 8px 4px; }
    .file-row {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 9px 12px; margin-bottom: 8px; cursor: pointer;
      transition: border-color .15s;
    }
    .file-row:hover { border-color: var(--accent); }
    .file-row-top { display: flex; align-items: center; gap: 6px; }
    .file-name { flex: 1; min-width: 0; font-size: 13px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-time { flex: none; font-size: 10px; color: var(--muted); }
    .file-path { font-size: 10px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .files-action {
      padding: 3px 10px; font-size: 11px;
      background: none; border: 1px solid var(--border); border-radius: 6px;
      color: var(--fg); cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .files-action:hover { border-color: var(--accent); color: var(--accent); }
    #files-preview { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; }
    .files-topbar {
      position: sticky; top: 0; z-index: 1;
      display: flex; align-items: center; gap: 6px;
      padding: 2px 0 8px; margin-bottom: 6px;
      background: var(--bg);
    }
    .files-topbar .file-name { font-size: 13px; font-weight: 600; }
    .files-note { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .files-pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 11px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
    .files-md { font-size: 12px; line-height: 1.6; word-break: break-word; }
    .files-md pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; overflow: auto; font-size: 11px; }
    .files-md code { font-family: Consolas, monospace; background: var(--panel); padding: 1px 4px; border-radius: 4px; }
    .files-md table { border-collapse: collapse; font-size: 11px; }
    .files-md th, .files-md td { border: 1px solid var(--border); padding: 3px 6px; }
    .files-image { max-width: 100%; height: auto; border-radius: 8px; }
    .files-iframe { width: 100%; min-height: 320px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
    .files-table { overflow-x: auto; }

    /* ── 余额面板 ── */
    .balance-foot { padding: 0 12px 12px; }
    .balance-updated { font-size: 10px; color: var(--muted); margin-top: 6px; text-align: center; }

    /* ── 收起形态：36px 竖窄条（logo + 导航图标） ── */
    body.collapsed header { padding: 10px 0; display: flex; justify-content: center; }
    body.collapsed .title-row h1 { display: none; }
    body.collapsed .logo { display: block; width: 24px; height: 24px; }
    body.collapsed .rail-body { flex-direction: row; }
    body.collapsed .nav { width: 36px; padding: 8px 4px; border-right: none; }
    body.collapsed .nav button { padding: 6px 0; }
    body.collapsed .nav-label { display: none; }
    body.collapsed .content { display: none; }
  </style>
</head>
<body>
  <div class="rail">
    <header id="rail-header" title="收起侧栏">
      <div class="title-row">
        <svg class="logo" viewBox="0 0 256 256">
          <g class="orbit" fill="none" stroke="#4FC3F7">
            <circle cx="128" cy="128" r="52" stroke-width="2" opacity="0.45" />
            <circle cx="128" cy="128" r="80" stroke-width="2" opacity="0.35" />
            <circle cx="128" cy="128" r="106" stroke-width="2" opacity="0.28" />
            <circle cx="128" cy="180" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.9" />
            <circle cx="128" cy="76" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.9" />
            <circle cx="208" cy="128" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
            <circle cx="184.6" cy="184.6" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
            <circle cx="128" cy="208" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
            <circle cx="71.4" cy="184.6" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
            <circle cx="48" cy="128" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
            <circle cx="71.4" cy="71.4" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
            <circle cx="128" cy="48" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
            <circle cx="184.6" cy="71.4" r="3.5" fill="#4FC3F7" stroke="none" opacity="0.8" />
            <circle cx="203" cy="203" r="4" fill="#4FC3F7" stroke="none" opacity="0.9" />
            <circle cx="53" cy="203" r="4" fill="#4FC3F7" stroke="none" opacity="0.9" />
            <circle cx="53" cy="53" r="4" fill="#4FC3F7" stroke="none" opacity="0.9" />
            <circle cx="203" cy="53" r="4" fill="#4FC3F7" stroke="none" opacity="0.9" />
          </g>
          <g class="pupil-g">
            <circle cx="128" cy="128" r="38" fill="#0B5E84" />
            <circle cx="128" cy="128" r="27" fill="#4FC3F7" />
            <circle cx="128" cy="128" r="13" fill="#0B1220" />
            <circle cx="119" cy="118" r="7" fill="#fff" opacity="0.9" />
            <circle cx="139" cy="135" r="3" fill="#fff" opacity="0.5" />
          </g>
        </svg>
        <h1>思灵</h1>
      </div>
    </header>
    <div class="rail-body">
      <nav class="nav">
        <button data-panel="memory" class="active" title="记忆">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M16 12h2"/><path d="M16 8h2"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/><path d="M6 12h2"/><path d="M6 8h2"/></svg>
          <span class="nav-label">记忆</span>
        </button>
        <button data-panel="state" title="状态">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>
          <span class="nav-label">状态</span>
        </button>
        <button data-panel="habit" title="习惯">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
          <span class="nav-label">习惯</span>
        </button>
        <button data-panel="files" title="文件">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2h-4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"/><path d="M16.706 2.706A2.4 2.4 0 0 0 15 2v5a1 1 0 0 0 1 1h5a2.4 2.4 0 0 0-.706-1.706z"/><path d="M5 7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 1.732-1"/></svg>
          <span class="nav-label">文件</span>
        </button>
        <button data-panel="balance" title="余额">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
          <span class="nav-label">余额</span>
        </button>
      </nav>
      <div class="content">
        <div id="panel-memory" class="panel active">
          <div class="search-row">
            <input id="query" placeholder="搜索记忆…" />
          </div>
          <div class="tabs">
            <button data-status="auto" class="active">auto</button>
            <button data-status="suggested">suggested</button>
            <button data-status="suggest">suggest</button>
          </div>
          <ul id="list"></ul>
        </div>
        <div id="panel-state" class="panel">
          <div class="state-list" id="state-list"></div>
        </div>
        <div id="panel-habit" class="panel">
          <div class="state-list" id="habit-list"></div>
        </div>
        <div id="panel-files" class="panel">
          <div class="files-toolbar">
            <button data-view="tree" class="files-action active">工作区树</button>
            <button data-view="recent" class="files-action">最近产出</button>
          </div>
          <div class="files-toolbar">
            <select id="workspace-select" title="选择 DSH 工作区"></select>
          </div>
          <div class="state-list" id="files-list"></div>
          <div id="files-preview" hidden></div>
        </div>
        <div id="panel-balance" class="panel">
          <div class="state-list" id="balance-list"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="./vendor/marked.umd.js"></script>
  <script src="./vendor/xlsx.full.min.js"></script>
  <script src="./vendor/mammoth.browser.min.js"></script>
  <script src="./memory-panel.js"></script>
  <script src="./state-panel.js"></script>
  <script src="./habit-panel.js"></script>
  <script src="./files-panel.js"></script>
  <script src="./balance-panel.js"></script>
</body>
</html>
