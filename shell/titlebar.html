<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>思灵</title>
<style>
  :root {
    /* 由主进程从官方 UI 读取 --dsw-alias-* token 后注入；fallback 为
       DSH 深色主题近似值（浅色主题/皮肤插件下会被注入值覆盖）。 */
    --titlebar-bg: #0f141d;
    --titlebar-fg: #d8e0ea;
    --titlebar-muted: #67748a;
    --titlebar-border: #1e2836;
    --accent: #4FC3F7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--titlebar-bg);
    font-family: system-ui, 'Segoe UI', sans-serif;
    user-select: none;
  }
  .titlebar {
    height: 100%;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--titlebar-border);
    -webkit-app-region: drag; /* 整条可拖拽，按钮单独 no-drag */
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 10px;
    height: 100%;
  }
  .brand svg { width: 15px; height: 15px; filter: drop-shadow(0 0 4px rgba(79, 195, 247, .4)); }
  .brand .name {
    font-size: 12px;
    color: var(--titlebar-fg);
    letter-spacing: .14em;
  }
  /* DSH 版本副标题胶囊（主进程 __setDshVersion 注入；跟随主题变量） */
  .brand .dsh-ver {
    font-size: 10px;
    line-height: 16px;
    padding: 0 6px;
    margin-left: 2px;
    color: var(--titlebar-muted);
    border: 1px solid var(--titlebar-border);
    border-radius: 999px;
    background: rgba(128, 148, 168, .08);
    letter-spacing: .03em;
  }
  .spacer { flex: 1; height: 100%; }
  /* SSiD 标题栏统一按钮组：插件中心 / 侧栏 / 底栏（放在窗口控制左侧）。
     按钮样式与 .controls 一致，宽度 40px 比窗口控制（52px）紧凑。 */
  .actions {
    display: flex;
    height: 100%;
    -webkit-app-region: no-drag;
  }
  .actions button {
    width: 40px;
    height: 100%;
    background: none;
    border: none;
    color: var(--titlebar-fg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .12s;
  }
  .actions button:hover { background: rgba(128, 148, 168, .14); }
  .actions svg { width: 15px; height: 15px; }
  .controls {
    display: flex;
    height: 100%;
    -webkit-app-region: no-drag;
  }
  .controls button {
    width: 52px;
    height: 100%;
    background: none;
    border: none;
    color: var(--titlebar-fg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .12s;
  }
  .controls button:hover { background: rgba(128, 148, 168, .14); }
  .controls button.close:hover { background: #e81123; color: #fff; }
  .controls svg { width: 13px; height: 13px; }
</style>
</head>
<body>
  <div class="titlebar">
    <div class="brand">
      <svg viewBox="0 0 256 256">
        <g fill="none" stroke="#4FC3F7">
          <circle cx="128" cy="128" r="52" stroke-width="2" opacity="0.45" />
          <circle cx="128" cy="128" r="80" stroke-width="2" opacity="0.35" />
          <circle cx="128" cy="128" r="106" stroke-width="2" opacity="0.28" />
        </g>
        <g>
          <circle cx="128" cy="128" r="38" fill="#0B5E84" />
          <circle cx="128" cy="128" r="27" fill="#4FC3F7" />
          <circle cx="128" cy="128" r="13" fill="#0B1220" />
          <circle cx="119" cy="118" r="7" fill="#fff" opacity="0.9" />
        </g>
      </svg>
      <span class="name">思灵</span>
      <span class="dsh-ver" id="dsh-ver" hidden></span>
    </div>
    <div class="spacer"></div>
    <div class="actions">
      <button id="btn-plugins" title="插件中心">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
      </button>
      <!-- 顺序对齐 better-sidebar 原 toggleCluster（底栏在左、侧栏在右）：
           用户心智模型以原按钮位置为准，2026-08-19 反馈错位 -->
      <button id="btn-bottom" title="底栏">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M2 10h12"/></svg>
      </button>
      <button id="btn-sidebar" title="侧栏">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M10 2v12"/></svg>
      </button>
    </div>
    <div class="controls">
      <button id="btn-min" title="最小化">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button id="btn-max" title="最大化">
        <svg id="icon-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
        <svg id="icon-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><rect x="7" y="7" width="10" height="10" rx="1"/><path d="M7 7V5a1 1 0 0 1 1-1h11a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-2"/></svg>
      </button>
      <button id="btn-close" class="close" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>
  <script src="./titlebar.js"></script>
</body>
</html>
