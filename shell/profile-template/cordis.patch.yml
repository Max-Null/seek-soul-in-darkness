# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# SSiD 预制 MCP：Playwright MCP ×2（浏览器自动化，默认启用；无头/有头各一条，
# 各带独立 user-data-dir，可同时开浏览器）+ CodeGraph MCP
# （语义代码图：callers/impact/上下文，代码索引；索引目录按需适配，见下）。
# 运行时由 shell/main.mjs 注入 env（与 SSID_PNPM 同模式）：
#   SSID_MCP_NODE      — 打包内置 node.exe → NVM v22.22.2 → PATH（electron 的
#                        execPath 因 ABI 不匹配不可用，见 worker 分支同款注释）
#   SSID_MCP_PW_CLI    — 本 profile pin 依赖 @playwright/mcp 的 cli.js 绝对路径
#   SSID_MCP_CG_CLI    — @astudioplus/codegraph-mcp 的 cli.js 绝对路径
#   SSID_MCP_CG_WS     — CodeGraph 索引目录。boot 前由壳解析：SSID_MCP_CG_WS 环境
#                        变量 → ~/.ssid/codegraph.json → 最近会话探测；**不再默认
#                        用户主目录**（主目录没有代码仓库，会让首次调用扫描 AppData
#                        卡死超时、结果与项目无关——2026-09-09 用户反馈）
#   SSID_MCP_CG_ENABLE — '1' = 已适配到可用目录；否则条目停用（不启动引擎进程）
# 浏览器二进制不随安装包发布：首次使用需 `playwright install chromium`
# （方案与命令详见 docs/决策/2026-08-24-Playwright-MCP-预制-实施方案.md；
#  CodeGraph 索引目录适配见 docs/决策/2026-09-09-CodeGraph-MCP-默认索引目录修复.md）。
- insert:
    - id: mcp-playwright-headless
      name: '@deepseek-ai/dsh-mcp-client'
      # CLI 缺失时停用：args[0] 取自 SSID_MCP_PW_CLI，缺失即求值为 null，而
      # dsh-mcp-client 的 schema 要求 string[] —— 会让整棵插件树加载失败、内核起不来。
      disabled: !!js '!process.env.SSID_MCP_PW_CLI'
      config:
        serverName: playwright-headless
        transport: stdio
        command: !!js 'process.env.SSID_MCP_NODE || "node"'
        args:
          - !!js 'process.env.SSID_MCP_PW_CLI'
          - '--headless'
          # user-data-dir 必须显式给（2026-09-20 修复，勿删）：@playwright/mcp 的默认目录是
          #   %LOCALAPPDATA%\ms-playwright-mcp\mcp-<browser>-<sha256(MCP roots 工作区)[0:7]>
          # 而 roots 由 MCP 客户端按会话工作区上报 —— 同一会话里的两个 Playwright MCP
          # 必然算出**同一个**目录，第二个启动浏览器即失败：
          #   "Browser is already in use for ...\mcp-chrome-<hash>, use --isolated ..."
          # 显式路径优先级高于该 hash（playwright-core/lib/coreBundle.js 的
          # createPersistentBrowser：config.browser.userDataDir ?? createUserDataDir(...)）。
          # 有头/无头是**启动参数**、无法热改，故固定为两条互不干扰的条目。
          - !!js '"--user-data-dir=" + (process.env.LOCALAPPDATA || process.env.USERPROFILE) + "\\ms-playwright-mcp\\headless"'
    - id: mcp-playwright-headed
      name: '@deepseek-ai/dsh-mcp-client'
      # 有头实例：需要人工观察、扫码/验证码登录时用（工具前缀 mcp__playwright-headed__*）。
      # 与上一条同一个 CLI、同一份 pin 依赖，仅 user-data-dir 不同 → 两者可同时开浏览器。
      disabled: !!js '!process.env.SSID_MCP_PW_CLI'
      config:
        serverName: playwright-headed
        transport: stdio
        command: !!js 'process.env.SSID_MCP_NODE || "node"'
        args:
          - !!js 'process.env.SSID_MCP_PW_CLI'
          - !!js '"--user-data-dir=" + (process.env.LOCALAPPDATA || process.env.USERPROFILE) + "\\ms-playwright-mcp\\headed"'
    - id: mcp-codegraph
      name: '@deepseek-ai/dsh-mcp-client'
      # 未适配到可用目录时停用：出厂不再默认指向用户主目录（v0.2.1 的行为），
      # 否则引擎会扫描 AppData 等无关目录、撞 --max-files 上限后长时间卡死。
      # 壳在 boot 前解析目录并设 SSID_MCP_CG_ENABLE=1（见文件头注释）。
      # CLI 判定是第二道保险：args[0] 取自 SSID_MCP_CG_CLI，缺失同样会让内核起不来。
      disabled: !!js 'process.env.SSID_MCP_CG_ENABLE !== "1" || !process.env.SSID_MCP_CG_CLI'
      config:
        serverName: codegraph
        transport: stdio
        cwd: !!js 'process.env.SSID_MCP_CG_WS || ""'
        command: !!js 'process.env.SSID_MCP_NODE || "node"'
        args:
          - !!js 'process.env.SSID_MCP_CG_CLI'
          # 出厂保护清单：即使索引目录被改到项目根，也不进这些目录
          # （报告第 3 条建议；用户可在「设置 → MCP」里追加/覆盖 args）。
          - '--exclude'
          - 'node_modules'
          - '--exclude'
          - '.git'
          - '--exclude'
          - 'AppData'
          - '--exclude'
          - 'target'
          - '--exclude'
          - 'dist'
          - '--exclude'
          - 'build'
          - '--exclude'
          - '.venv'
          - '--exclude'
          - '__pycache__'
        env:
          # 匿名遥测默认开启（工具调用/启动/错误上报）——预制出厂必须关闭
          CODEGRAPH_TELEMETRY: 'off'

# ── connection 行：补回 webServer 注入（405 的修复点）───────────────────────
#
# 背景：DSH 0.1.5 把 `@deepseek-ai/dsh-client-connection` 的 inject 从 rc.1 的
# `['webServer','credentials']` 收缩为 web-app bundle 里的 `inject: [webRuntime]`。
# 但 `rpc.handle()` 的实现仍读 **connection 实例自己的 ctx**（`rpc-host.ts` 的
# `get rpc()` 里 `const owner = this.ctx`）：
#
#     return owner.effect(() => owner.webServer.register(route), …)
#
# owner 的 store 里没有 `webServer` → cordis 的 ctx 代理沿父链找不到（`reflect.ts:155-166`）
# → 抛 `cannot get property "webServer" without inject`。凡是用
# `ctx.connection.rpc.handle(channel, …)` 注册通道的插件（plugin-center、
# ds-harness-remote、apiProxy…）于是全部注册失败：路由不入 webserver 路由表，
# 请求落到 frontend-static 兜底 → **405**（同路径 GET 是 404，`/api` 是 401）。
#
# 这里把 webServer 加回 connection 的 inject。cordis 在 fiber 激活时会把已就绪的依赖
# 写进 `fiber.store`（`_checkImpl`），于是 `owner.webServer` 沿父链可解析，rpc.handle
# 恢复。**这是配置层适配**：不改 DSH 源码（工作区铁律 2.0），也不必逐个改插件。
#
# 与 bundle 原始值保持一致（web-app/cordis.patch.yml 的 connection 行是
# `inject: [webRuntime]`）：webRuntime 不能丢，它那行的 config 里
# `trustedHosts: !!js ctx.webRuntime.trustedHosts` 依赖它。
#
# 已实机验证（2026-09-14）：connection 的 inject 变为
# `[credentials|webRuntime|webServer]`，`pluginCenterRpc` 由 false 变 true，
# 插件中心恢复正常。诊断全文见 docs/决策/2026-09-14-插件中心405诊断记录.md 第十节。
- id: connection
  inject: [webRuntime, webServer]
