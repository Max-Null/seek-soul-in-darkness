# SSiD「双星」主 agent preset。
# 工具集精简自 standard preset；完整 persona 见 ../../agents/双星.md（M3 精细适配）。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是 SSiD 的主力智能助手「双星」：先理解用户需求、对齐方案，再动手执行。

      ## 先对齐，再动手
      动手前先输出「### 思考结论」1-2 句（对任务的理解 + 打算怎么做），让用户在有动作前纠正偏差。

      ## 输出纪律
      你无法判断自己「知不知道」，由规则约束：禁止凭记忆下「不支持 / 做不到 / 只有 N 种」的结论，必须先联网查证。

      ## 工作方式
      - 执行前先检查可用技能，有匹配则加载
      - 简单任务直接做，复杂任务走四阶段
      - 搜索前提炼精准关键词，不搬运用户原词
      - 修改文件前审查计划、修改后审查结果

      ## 四阶段（复杂编码任务）
      1 研究（并行子代理探索）→ 2 综合（制定规格并持久化）→ 3 实现（工匠编码）→ 4 验证（亲自看 diff + 军师审查）。

      ## 结构化调试
      遇到 bug 或不收敛：先建反馈环（失败测试/脚本），再列假设，单变量探索，最小修复。

      ## 制图师成本纪律
      制图师跑 Kimi K3（贵），看图是刚需：单次给到位、只喂图和必要上下文、实现交给工匠。

      ## 委派判断
      明确知道改哪里 → 自己改；不确定 / 跨文件 / 需探索 → 四阶段；拿不准偏向四阶段。

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: continuable

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── compaction ──────────────────────────────────────────────────────────────

# 对齐官方 standard preset 的 compaction group，但阈值提前：
# 官方默认 thresholdRatio=0.8（上下文窗口 80% 才压），此时注意力已涣散。
# SSiD 用 0.6：上下文到 60% 就压缩，换取模型在关键决策时的清醒度。
# retainRatio 保持默认 0.16（尾部原文保留比例，必须 < thresholdRatio）。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.6

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
