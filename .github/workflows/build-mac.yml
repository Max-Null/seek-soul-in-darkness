# SSiD macOS 打包——GitHub Actions 云端 Mac 构建（本仓库 Windows 侧无需 macOS）
#
# 设计（见 docs/决策/2026-08-27-macOS支持与云端打包-实施.md）：
#   - macOS runner（macos-latest）自带 Xcode/Homebrew；公共仓库 Actions 免费。
#   - 归档（dsh-runtime.tar.gz）内含 per-platform 原生二进制（esbuild/koffi/node-pty 等），
#     因此 mac 包必须在 macOS 上重跑 prepare-runtime.mjs（与 Windows 本机同源逻辑）。
#   - DSH 版本来源与构建机一致：sparse clone deepseek-harness 并设 DSH_CHECKOUT
#     （读取 apps/cli/package.json 的 version；与本地 H: 盘 checkout 同源）。
#   - 产物：dmg（分发）+ zip（electron-updater mac 增量更新用）+ latest-mac.yml/blockmap。
#   - 签名：当前 identity: null（未签名，用户首次打开需右键-打开绕过 Gatekeeper）；
#     后续 Developer ID 签名 + notarize 见实施文档 §后续。
#
# 触发：
#   - workflow_dispatch 手动（开发验证：默认不上传 Release，产物存 Actions artifact）
#   - push tag v0.1.* 自动（与 Windows 发版链对齐，上传 GitHub Release 资产）
#
# 用法：GitHub 仓库 → Actions → build-mac → Run workflow（选分支 feat/macos-packaging
#      或 main 推送 tag 自动触发）。产物在 Actions run 页 Artifacts 或 Release 资产。
name: build-mac

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '上传至 GitHub Release（仅当 workflow 运行在 tag 上时有意义）'
        type: boolean
        default: false
  push:
    tags:
      - 'v0.1.*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: 检出 SSiD
        uses: actions/checkout@v4

      - name: 检出 DSH 源码（tsconfig paths 同源；位置=shell/../.. 相对路径）
        run: |
          # bundle-kernel 的 esbuild 按 shell/tsconfig.json paths 解析
          # @deepseek-ai/dsh-*（映射 ../../deepseek-harness/...）。相对路径基准 =
          # tsconfig 所在目录（<WS>/shell），../../ = $GITHUB_WORKSPACE/.. 一层
          # （= /Users/runner/work/<repo>/）——2026-08-27 实测放错一层仍失败。
          # 完整浅克隆（sparse 缺 paths 引用目录）；版本钉 dsh-v0.1.1-rc.2
          # （与归档/发版链的 @deepseek-ai/dsh 版本一致，防 main 漂移）。
          git clone --depth 1 --branch dsh-v0.1.1-rc.2 \
            https://github.com/deepseek-ai/deepseek-harness \
            "$GITHUB_WORKSPACE/../deepseek-harness"
          echo "DSH_CHECKOUT=$GITHUB_WORKSPACE/../deepseek-harness" >> "$GITHUB_ENV"

      - name: Node 22 + pnpm 11
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 shell 依赖（darwin 原生二进制随平台下载）
        working-directory: shell
        run: |
          pnpm install --frozen-lockfile
          # pnpm 10+ 默认禁止依赖 build scripts（shell 无 allowBuilds 配置），
          # electron postinstall 未跑 → dist 缺失（2026-08-27 实测报
          # electronDist does not exist）；显式执行 install.js 下载 darwin 包
          node node_modules/electron/install.js

      - name: 重建运行时归档（mac 平台原生二进制 + DSH 版本读取）
        working-directory: shell
        run: |
          export DSH_NODE="$(which node)"
          export PNPM_CMD="$(which pnpm)"
          node scripts/prepare-runtime.mjs

      # 三步打包（2026-08-27 实测定型）：
      #   1. --mac dir：只产出 stage（Electron.app + 归档/node 注入，afterPack
      #      不做重签——该时刻 app 未组装完成，codesign 报 unrecognized）
      #   2. 完整 app 上 codesign --force --deep --sign -（与 Mac 手动成功
      #      命令一致；修复 identity:null + Resources 改动致旧 adhoc 签名失效）
      #   3. --prepackaged：基于已签好的 app 制作 dmg/zip + blockmap
      - name: 打包 stage（electron-builder --mac dir）
        working-directory: shell
        run: npm run bundle-kernel && npx electron-builder --mac dir --publish never

      - name: 校验并重签 app（adhoc，复刻 Mac 手动成功路径）
        working-directory: shell
        run: |
          APP="dist-electron/mac-arm64/Electron.app"
          test -f "$APP/Contents/Info.plist" || { echo "ERROR: Info.plist 缺失，app 未完整组装"; exit 1; }
          test -d "$APP/Contents/MacOS" || { echo "ERROR: MacOS 目录缺失"; exit 1; }
          codesign --force --deep --sign - "$APP"
          codesign -dv "$APP" 2>&1 | head -4

      - name: 打包 dmg/zip（基于已重签 app）
        working-directory: shell
        run: npx electron-builder --mac dmg zip --publish never --prepackaged dist-electron/mac-arm64

      - name: 上传构建产物（Actions artifact，无需 Release）
        uses: actions/upload-artifact@v4
        with:
          name: ssid-mac-dist
          path: |
            shell/dist-electron/*.dmg
            shell/dist-electron/*.zip
            shell/dist-electron/latest-mac.yml
            shell/dist-electron/*.blockmap
          if-no-files-found: error

      - name: 上传 GitHub Release（tag 触发或手动勾选 publish）
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            shell/dist-electron/*.dmg
            shell/dist-electron/*.zip
            shell/dist-electron/latest-mac.yml
            shell/dist-electron/*.blockmap
