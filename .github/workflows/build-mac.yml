# SSiD macOS 打包——GitHub Actions 云端 Mac 构建（本仓库 Windows 侧无需 macOS）
#
# 设计（见 docs/决策/2026-08-27-macOS支持与云端打包-实施.md）：
#   - arm64（macos-latest，M 系列）+ x64（macos-13 Intel）双 job——归档内含
#     per-platform 原生二进制，各架构必须独立重建归档（universal 单包不可行）。
#   - DSH 版本来源：完整 clone + 钉 dsh-v0.1.1-rc.2，落位 $GITHUB_WORKSPACE/..
#     （= shell/tsconfig.json paths 的 ../../deepseek-harness）。
#   - 图标：多尺度 icns（Dock 16-64 = 白线三层断口原子；128+ = 原彩色硅原子
#     logo），由 iconutil 从 shell/assets/mac-icon-iconset 生成。
#   - 签名：官方 ad-hoc（mac.identity: "-"，e-b 组装完成后自行 codesign）。
#
# 触发：workflow_dispatch 手动（默认只出 artifact）+ push tag v0.1.*（发布）。
name: build-mac

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '上传至 GitHub Release（仅当 workflow 运行在 tag 上时有意义）'
        type: boolean
        default: false
  push:
    tags:
      - 'v0.1.*'

permissions:
  contents: write

jobs:
  build-mac-arm64:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: 检出 SSiD
        uses: actions/checkout@v4

      - name: 检出 DSH 源码（tsconfig paths 同源；位置=shell/../.. 相对路径）
        run: |
          git clone --depth 1 --branch dsh-v0.1.1-rc.2 \
            https://github.com/deepseek-ai/deepseek-harness \
            "$GITHUB_WORKSPACE/../deepseek-harness"
          echo "DSH_CHECKOUT=$GITHUB_WORKSPACE/../deepseek-harness" >> "$GITHUB_ENV"

      - name: Node 22 + pnpm 11
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 shell 依赖（darwin 原生二进制随平台下载）
        working-directory: shell
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js

      - name: 重建运行时归档（mac 平台原生二进制 + DSH 版本读取）
        working-directory: shell
        run: |
          export DSH_NODE="$(which node)"
          export PNPM_CMD="$(which pnpm)"
          node scripts/prepare-runtime.mjs

      - name: 生成多尺度 icns（Dock 白线三层 / 大图彩色原 logo）
        working-directory: shell
        run: |
          iconutil -c icns assets/mac-icon.iconset -o assets/icon.icns
          ls -la assets/icon.icns

      - name: 打包（bundle-kernel + electron-builder --mac dmg/zip，官方 adhoc 签名）
        working-directory: shell
        run: npm run pack:mac -- --publish never

      - name: 上传构建产物（Actions artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ssid-mac-dist-arm64
          path: |
            shell/dist-electron/*.dmg
            shell/dist-electron/*.zip
            shell/dist-electron/latest-mac.yml
            shell/dist-electron/*.blockmap
          if-no-files-found: error

      - name: 上传 GitHub Release（tag 触发或手动勾选 publish）
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            shell/dist-electron/*.dmg
            shell/dist-electron/*.zip
            shell/dist-electron/latest-mac.yml
            shell/dist-electron/*.blockmap

  build-mac-x64:
    # macos-13（Intel）runner 已退役（GitHub 2026 移除实证），x64 改走交叉构建：
    # 同一 arm64 runner 上 npm_config_arch=x64 装 x64 原生二进制 + --x64 打包。
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: 检出 SSiD
        uses: actions/checkout@v4

      - name: 检出 DSH 源码（tsconfig paths 同源；位置=shell/../.. 相对路径）
        run: |
          git clone --depth 1 --branch dsh-v0.1.1-rc.2 \
            https://github.com/deepseek-ai/deepseek-harness \
            "$GITHUB_WORKSPACE/../deepseek-harness"
          echo "DSH_CHECKOUT=$GITHUB_WORKSPACE/../deepseek-harness" >> "$GITHUB_ENV"

      - name: Node 22 + pnpm 11
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 shell 依赖（x64 原生二进制交叉下载）
        working-directory: shell
        run: |
          export npm_config_arch=x64
          export npm_config_platform=darwin
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js

      - name: 重建运行时归档（x64 原生二进制 + DSH 版本读取）
        working-directory: shell
        run: |
          export npm_config_arch=x64
          export npm_config_platform=darwin
          export DSH_NODE="$(which node)"
          export PNPM_CMD="$(which pnpm)"
          node scripts/prepare-runtime.mjs

      - name: 生成多尺度 icns（Dock 白线三层 / 大图彩色原 logo）
        working-directory: shell
        run: |
          iconutil -c icns assets/mac-icon.iconset -o assets/icon.icns
          ls -la assets/icon.icns

      - name: 打包（bundle-kernel + electron-builder --mac --x64，官方 adhoc 签名）
        working-directory: shell
        run: npm run pack:mac -- --x64 --publish never

      - name: 上传构建产物（Actions artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ssid-mac-dist-x64
          path: |
            shell/dist-electron/*.dmg
            shell/dist-electron/*.zip
            shell/dist-electron/latest-mac.yml
            shell/dist-electron/*.blockmap
          if-no-files-found: error

      - name: 上传 GitHub Release（tag 触发或手动勾选 publish）
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            shell/dist-electron/*.dmg
            shell/dist-electron/*.zip
            shell/dist-electron/latest-mac.yml
            shell/dist-electron/*.blockmap
