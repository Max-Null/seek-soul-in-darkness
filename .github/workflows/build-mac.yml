# SSiD macOS 打包——GitHub Actions 云端 Mac 构建（本仓库 Windows 侧无需 macOS）
#
# 设计（见 docs/决策/2026-08-27-macOS支持与云端打包-实施.md）：
#   - arm64（macos-latest，M 系列）+ x64 交叉构建（同一 runner 上
#     npm_config_arch=x64 装 x64 原生二进制 + electron-builder --x64）双 job——
#     归档内含 per-platform 原生二进制，各架构必须独立重建归档。
#   - DSH 版本来源：完整 clone 钉 dsh-v0.1.2-rc.1（与 Windows 构建机同 tag；
#     发版换内核时同步更新此处 branch）。路径 $GITHUB_WORKSPACE/../deepseek-harness
#     = shell/../../deepseek-harness——与 shell/tsconfig.json paths 精确同源
#     （kernel.ts 的 @deepseek-ai/dsh-* 编译期经 esbuild + paths 解析源码；
#     sparse/runner.temp 均会致解析失败——v0.2.0 mac CI 实测）。
#   - 图标：多尺度 icns 由 iconutil 从 shell/assets/mac-icon.iconset 生成
#     （iconutil 要求目录以 .iconset 结尾）。
#   - 签名：官方 ad-hoc（mac.identity: "-"，electron-builder 组装完成后
#     自行 codesign）。
#   - pnpm：CI 的 setup-pnpm 把 PNPM_CMD 指到 .bin/pnpm（shell shim），
#     prepare-runtime 用 node 执行要求 JS 入口——已加 .cjs 校验 + bundled
#     pnpm 兜底（scripts/prepare-runtime.mjs pnpmCandidates）。
#   - esbuild：bundle-kernel 命令已显式声明 devDependency（幽灵依赖在 mac
#     严格布局下 127 command not found）。
#
# 触发：
#   - workflow_dispatch 手动（默认只出 artifact；勾选 publish 上传 Release）
#   - push tag v* 自动（与 Windows 发版链对齐）
name: build-mac

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '上传至 GitHub Release（仅当 workflow 运行在 tag 上时有意义）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac-arm64:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: 检出 SSiD
        uses: actions/checkout@v4

      - name: 检出 DSH 源码（完整 checkout 与 tsconfig paths 同源；固定内核 tag）
        run: |
          git clone --depth 1 --branch dsh-v0.1.2-rc.1 \
            https://github.com/deepseek-ai/deepseek-harness \
            "$GITHUB_WORKSPACE/../deepseek-harness"
          echo "DSH_CHECKOUT=$GITHUB_WORKSPACE/../deepseek-harness" >> "$GITHUB_ENV"

      - name: Node 22 + pnpm 11
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 shell 依赖（darwin 原生二进制随平台下载）
        working-directory: shell
        run: |
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js

      - name: 重建运行时归档（mac 平台原生二进制 + DSH 版本读取）
        working-directory: shell
        run: |
          export DSH_NODE="$(which node)"
          export PNPM_CMD="$(which pnpm)"
          node scripts/prepare-runtime.mjs

      - name: 生成多尺度 icns（iconutil 要求 .iconset 后缀）
        working-directory: shell
        run: |
          iconutil -c icns assets/mac-icon.iconset -o assets/icon.icns
          ls -la assets/icon.icns

      - name: 打包（bundle-kernel + electron-builder --mac dmg/zip，官方 adhoc 签名）
        working-directory: shell
        run: npm run pack:mac -- --publish never

      - name: 上传构建产物（Actions artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ssid-mac-dist-arm64
          path: |
            shell/dist-electron/*.dmg
            shell/dist-electron/*.zip
            shell/dist-electron/latest-mac.yml
            shell/dist-electron/*.blockmap
          if-no-files-found: error

      - name: 上传 GitHub Release（tag 触发或手动勾选 publish）
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            shell/dist-electron/*.dmg
            shell/dist-electron/*.zip
            shell/dist-electron/latest-mac.yml
            shell/dist-electron/*.blockmap
