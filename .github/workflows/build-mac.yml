# SSiD macOS 打包 —— GitHub Actions 云端 Mac 构建（本机是 Windows，出不了 mac 包）
#
# 为什么是现在这个形状（2026-09-29 重写；此前那份是自建壳时代的遗留）：
#
#   - **构建在开发主轴的 fork 分支上做**。壳从自建壳换成官方 `dsh-desktop-host` 基座之后，
#     构建入口是 `apps/desktop/scripts/package-target.ts`（`package:*` 一族脚本），
#     而**不是** `shell/` 下那套 —— `shell/package.json` 里既没有 `prepare-runtime` 也没有
#     `pack:*`，旧 workflow 引用的两个脚本都不存在。旧版还钉着内核 tag `dsh-v0.1.2-rc.1`。
#   - **出厂插件集的声明源在另一个仓库**。`prepare-ssid-plugins.ts` 默认从
#     `<checkout>/../../../../seek-soul-in-darkness/shell/profile-template` 取；CI 上目录布局
#     不同，所以用 `SSID_PROFILE_TEMPLATE_DIR` 显式指过去（该变量是脚本的第一优先来源）。
#   - **未签名通道**。mac 打包默认要求 Apple 签名身份与公证凭据
#     （`electron-builder-config.mjs` 无条件解析，缺变量即抛错），这与「不买证书、接受
#     Gatekeeper 拦截」的既定取舍冲突 —— 与 Windows 侧同取舍。`--unsigned` 现在对 mac 也
#     成立：撤走 Apple 凭据、走 ad-hoc 签名（`identity: '-'`）、跳过公证。产物名带
#     `-unsigned` 后缀，与正式产物不会混淆。
#   - **不设 ELECTRON_MIRROR**。本机（国内）直连 GitHub 拉 Electron 会挂死，所以本地打包
#     必须设镜像；GitHub 的 mac runner 反而直连更快，设国内镜像只会变慢。
#
# 触发：
#   - `push` tag `v*` 自动（与 Windows 发版链对齐）
#   - `workflow_dispatch` 手动（勾选 publish 才会上传 Release）
name: build-mac

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '上传至 GitHub Release（仅在 tag 上运行时才有意义）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac-arm64:
    # mac-arm64 必须在 Apple Silicon 主机上构建（package-target.ts 的显式断言）
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: 检出 SSiD（提供 shell/profile-template —— 出厂插件集的声明源）
        uses: actions/checkout@v4
        with:
          path: seek-soul-in-darkness

      - name: 检出开发主轴（fork 分支：构建与打包都在这里做）
        run: |
          git clone --branch ssid-desktop-fork --single-branch \
            https://github.com/Max-Null/deepseek-harness \
            "$GITHUB_WORKSPACE/.ssid-build/checkout"
          git -C "$GITHUB_WORKSPACE/.ssid-build/checkout" log --oneline -1

      - name: Node 22 + pnpm 11
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装开发主轴依赖
        working-directory: .ssid-build/checkout
        run: pnpm install --frozen-lockfile

      - name: 生成 macOS 打包配置（未签名通道也要 App ID 与强更策略）
        # package-target.ts 无条件加载 apps/desktop/.env.macos，缺文件即抛错
        # （desktop-package-environment.mjs 第 36 行）；上游 CI 同样在运行前生成该文件
        # （apps/desktop/README.zh.md「CI 同样在运行前生成目标文件」）。`--unsigned` 跳过的是
        # Apple 签名与公证凭据的校验（validateDesktopPackageEnvironment 遇 unsigned 提前返回），
        # App ID、强更策略与打包并发仍从这份文件读。取值与本机 .env.windows 一致，
        # 使两个平台的产物带同一套应用标识与策略来源。
        working-directory: .ssid-build/checkout/apps/desktop
        run: |
          cat > .env.macos <<'DOTENV'
          DSH_DESKTOP_APP_ID=com.maxnull.ssid
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://example.com
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://example.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://login.example.com"]}'
          DOTENV

      - name: 打包（mac arm64，未签名：ad-hoc 签名 + 不公证）
        working-directory: .ssid-build/checkout
        env:
          SSID_PROFILE_TEMPLATE_DIR: ${{ github.workspace }}/seek-soul-in-darkness/shell/profile-template
        # package-target.ts 自己会传 `--publish never`，发布是独立步骤
        # mac runner 的 kern.maxfilesperproc 默认 10240，而随包插件集有 43099 个文件：
        # electron-builder 复制这批 extraResources 时会同时打开远超上限的 fd，报 EMFILE。
        # 只抬 ulimit 没用（实测软限制本来就是 10240，抬到 unlimited 照样失败）——内核天花板才是真限制。
        run: |
          echo "before: soft=$(ulimit -n) maxfilesperproc=$(sysctl -n kern.maxfilesperproc)"
          sudo sysctl -w kern.maxfiles=400000 kern.maxfilesperproc=200000
          ulimit -n 200000
          echo "after: soft=$(ulimit -n) maxfilesperproc=$(sysctl -n kern.maxfilesperproc)"
          pnpm --filter "./apps/desktop" run package:mac:arm64:unsigned

      - name: 打包失败时打印签名验证详情
        if: failure()
        working-directory: .ssid-build/checkout
        # @electron/osx-sign 签名后固定跑 `codesign --verify --deep`，失败原因被 electron-builder 吞掉，
        # 只留一句 Command failed。这里在同一个产物上手动复现一次，把具体是哪个文件的问题打出来。
        run: |
          APP="apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/mac-arm64/思灵.app"
          if [ -d "$APP" ]; then
            echo "=== codesign --verify --deep --strict --verbose=4 ==="
            codesign --verify --deep --strict --verbose=4 "$APP" 2>&1 | head -80 || true
            echo "=== 未签名的嵌套代码（前 20 个） ==="
            find "$APP" -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.node' \) -print0 2>/dev/null \
              | xargs -0 -n1 -I{} sh -c 'codesign -dv "{}" >/dev/null 2>&1 || echo "{}"' | head -20 || true
          else
            echo "no app bundle at $APP"
          fi

      - name: 上传构建产物（Actions artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ssid-mac-arm64-unsigned
          path: |
            .ssid-build/checkout/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg
            .ssid-build/checkout/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.zip
            .ssid-build/checkout/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.yml
            .ssid-build/checkout/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.blockmap
          if-no-files-found: error

      - name: 上传 GitHub Release（tag 触发，或手动勾选 publish）
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          # 资产名要与 latest-mac.yml 里的 url 字段一致，否则增量更新 404
          fail_on_unmatched_files: false
          files: |
            .ssid-build/checkout/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg
            .ssid-build/checkout/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.zip
            .ssid-build/checkout/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.yml
            .ssid-build/checkout/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.blockmap
